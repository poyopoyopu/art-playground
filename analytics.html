<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART PLAYGROUND / ANALYTICS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050507;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:24px 16px 60px}.wrap{max-width:820px;margin:auto}
.k{font-size:10px;letter-spacing:.22em;color:#777}h1{margin:8px 0 3px;font-size:28px}.sub{color:#888;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:22px 0}
.stat{border:1px solid #202027;border-radius:14px;padding:16px;background:#0b0b10}.label{font-size:10px;color:#777;letter-spacing:.12em}.num{font-size:30px;font-weight:700;margin-top:5px}
h2{font-size:13px;margin:28px 0 12px}.chart{height:170px;border:1px solid #202027;border-radius:14px;padding:14px;display:flex;align-items:end;gap:3px;background:#0b0b10;overflow:hidden}
.bar{flex:1;min-width:2px;background:#eee;border-radius:2px 2px 0 0;position:relative}.bar span{display:none}
.row{display:grid;grid-template-columns:28px 1fr 75px 110px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #202027}.name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path{font-size:10px;color:#555;margin-top:3px}.views{text-align:right;font-size:18px;font-weight:600}.last{text-align:right;color:#777;font-size:10px}
button{margin-top:20px;border:1px solid #333;background:#111118;color:#fff;border-radius:10px;padding:10px 14px}
#status{margin-top:10px;color:#666;font-size:11px}
@media(max-width:600px){body{padding:18px 12px 50px}.row{grid-template-columns:24px 1fr 58px}.last{display:none}.stats{gap:8px}.num{font-size:26px}}
</style>
</head>
<body><div class="wrap">
<div class="k">ART PLAYGROUND / ANALYTICS</div>
<h1>アクセス解析</h1>
<div class="sub">作品を実際に開いた回数。ギャラリーのプレビュー表示は除外。</div>
<div class="stats">
<div class="stat"><div class="label">TOTAL VIEWS</div><div class="num" id="total">—</div></div>
<div class="stat"><div class="label">LAST 30 DAYS</div><div class="num" id="recent">—</div></div>
</div>
<h2>DAILY VIEWS / 30 DAYS</h2><div class="chart" id="chart"></div>
<h2>WORKS / ALL TIME</h2><div id="list"></div>
<button onclick="load()">↻ 更新</button><div id="status"></div>
</div>
<script>
async function load(){
 const status=document.getElementById('status');status.textContent='更新中…';
 try{
  const r=await fetch('/api/analytics',{cache:'no-store'});const d=await r.json();
  if(!r.ok)throw new Error(d.error||'API error');
  document.getElementById('total').textContent=(d.total_views||0).toLocaleString();
  document.getElementById('recent').textContent=(d.last_30_days||0).toLocaleString();
  const days=d.daily||[], max=Math.max(1,...days.map(x=>Number(x.views)||0));
  const byDay=new Map(days.map(x=>[x.day,Number(x.views)||0]));
  const bars=[];
  for(let i=29;i>=0;i--){const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-i);const day=dt.toISOString().slice(0,10);const v=byDay.get(day)||0;bars.push('<div class="bar" style="height:'+Math.max(v?3:1,Math.round(v/max*140))+'px" title="'+day+': '+v+' views"></div>')}
  document.getElementById('chart').innerHTML=bars.join('');
  const works=(d.works||[]);document.getElementById('list').innerHTML=works.length?works.map((x,i)=>'<div class="row"><div>'+(i+1)+'</div><div><div class="name">'+esc(x.title)+'</div><div class="path">'+esc(x.path)+'</div></div><div class="views">'+Number(x.views||0).toLocaleString()+'</div><div class="last">'+formatDate(x.last_view)+'</div></div>').join(''):'まだアクセス記録がありません。';
  status.textContent='最終更新：'+new Date().toLocaleString('ja-JP');
 }catch(e){status.textContent='解析データを取得できませんでした。'}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){if(!s)return'—';const d=new Date(s);return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
load();setInterval(load,60000);
</script></body></html>
