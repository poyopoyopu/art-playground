(function(){
  let started=false,fc,ctx,raf,last=0,seed=Math.random()*1000,energy=0;
  const fingers=new Map();
  function startFallback(err){
    if(started)return; started=true;
    fc=document.createElement('canvas'); fc.id='fallbackCanvas';
    fc.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:auto;background:#020207;touch-action:none';
    document.body.insertBefore(fc,document.body.firstChild); ctx=fc.getContext('2d',{alpha:false});
    const resize=()=>{const d=Math.min(devicePixelRatio||1,1.6),w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);fc.width=Math.floor(w*d);fc.height=Math.floor(h*d);ctx.setTransform(d,0,0,d,0,0)};
    addEventListener('resize',resize,{passive:true}); resize();
    const pos=e=>({x:e.clientX,y:e.clientY});
    fc.addEventListener('pointerdown',e=>{const p=pos(e);fingers.set(e.pointerId,{x:p.x,y:p.y,px:p.x,py:p.y});energy=Math.min(1,energy+.5);try{fc.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});
    fc.addEventListener('pointermove',e=>{const f=fingers.get(e.pointerId);if(!f)return;f.px=f.x;f.py=f.y;f.x=e.clientX;f.y=e.clientY;energy=Math.min(1,energy+.08)},{passive:true});
    ['pointerup','pointercancel'].forEach(ev=>fc.addEventListener(ev,e=>fingers.delete(e.pointerId),{passive:true}));
    function hash(x,y){const v=Math.sin(x*127.1+y*311.7+seed*17.13)*43758.5453;return v-Math.floor(v)}
    function draw(t){
      const w=innerWidth,h=innerHeight,cx=w*.5,cy=h*.5,R=Math.min(w,h)*.54; ctx.fillStyle='#020207';ctx.fillRect(0,0,w,h);
      ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='screen';
      const spin=t*.00016, pulse=1+Math.sin(t*.00055)*.035;
      for(let layer=0;layer<7;layer++){
        ctx.save();ctx.rotate(spin*(layer+1)*.7);ctx.scale(pulse,pulse);
        const rings=16+layer*5;
        for(let j=0;j<rings;j++){
          const r=R*(j+1)/(rings+1), pts=72;
          ctx.beginPath();
          for(let i=0;i<=pts;i++){
            const a=i/pts*Math.PI*2;
            let rr=r;
            rr+=Math.sin(a*(3+layer)+t*.0012*(1+layer*.08)+j*.7)*R*.014;
            rr+=Math.sin(a*(7+layer*2)-t*.0008-j)*R*.009;
            for(const f of fingers.values()){

            }

            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          const hue=(j*19+layer*47+t*.018+seed)%360;
          ctx.strokeStyle='hsla('+hue+',95%,'+(58+layer*3)+'%,'+(0.055+layer*.012)+')';ctx.lineWidth=1.1+layer*.18;ctx.stroke();
        }
        ctx.restore();
      }

      for(let k=0;k<42;k++){
        const a=k*Math.PI*(3-Math.sqrt(5))+t*.00015*(k%3+1),r=R*.08+R*.82*((k*37)%101)/100;
        const x=Math.cos(a)*r,y=Math.sin(a)*r,s=4+10*Math.sin(t*.001+k)*.5+energy*10;
        const hue=(k*31+t*.025+seed)%360;ctx.fillStyle='hsla('+hue+',100%,70%,'+(0.07+energy*.05)+')';ctx.beginPath();ctx.arc(x,y,Math.max(1,s),0,Math.PI*2);ctx.fill();
      }
      ctx.restore(); energy*=.985; last=t; raf=requestAnimationFrame(draw);
    }
    cancelAnimationFrame(raf); raf=requestAnimationFrame(draw);
    if(err) console.warn('DIVIDED LAW WebGL fallback:',err);
  }
  window.addEventListener('error',e=>startFallback(e.error||e.message),{once:true});
  window.__manyLawsFallback=startFallback;
})();

const VS=`#version 300 es

/* Each pixel stores a local rule. R/G/B are three competing laws:
   geometry, rotation and density. Touch writes into that local rule map. */
const LAW_FS=`#version 300 es
precision highp float;out vec4 o;in vec2 uv;uniform sampler2D prevLaw;uniform vec2 lawRes;uniform float aspect,dtn,wipe;uniform int touchCount;uniform vec4 touch[5];

const MAIN_FS=`#version 300 es
precision highp float;
out vec4 o;in vec2 uv;

float hash21(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+31.17);return fract(p.x*p.y);}

vec3 pal(float t){return .5+.5*cos(6.2831853*(vec3(.00,.32,.67)+t*vec3(1.0,1.0,1.0)));}

vec2 fold(vec2 p,float k){
  for(int i=0;i<5;i++){
    p=abs(p);if(p.x<p.y)p=p.yx;
    p.x-=.47;p*=rot(.5235988+k*.11);p*=1.018;
  }

}

float vor(vec2 p){
  vec2 g=floor(p),f=fract(p);float md=9.;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 q=vec2(x,y),id=g+q;
    vec2 h=vec2(hash21(id),hash21(id+vec2(19.37)));
    md=min(md,length(q+h*.78-f));
  }
  return md;
}

/* A low-frequency "territory" field. It does not draw objects; it decides
   which visual law is winning in each region. */
float territory(vec2 q,float tt,float A,float D){
  float r=length(q),a=atan(q.y,q.x);
  float n=n2(q*1.65+vec2(.0,tt*.025));
  float t1=sin(r*2.25+a*2.1-T(.13)+n*2.2);
  float t2=sin(q.x*2.7-q.y*1.9+T(.09)+n*1.7);

float lawField(vec2 q,float L,float A,float D,float tt,float regime){
  float r=length(q),a=atan(q.y,q.x);
  float sectors=4.5+floor(A*7.0)+floor(regime*3.0);
  float rings=5.0+floor(D*8.0)+floor((1.-regime)*3.0);
  float spiral=sin(a*sectors+r*(3.0+regime*1.4)-T(.37)+sin(r*6.0-tt)*.55);

  float hex=sin((h.x+h.y)*(12.0+regime*6.0)-T(.23))*sin((h.x-h.y)*(10.0+D*5.0)+T(.19));
  float cell=1.-smoothstep(.035,.48,vor(q*(6.0+D*5.0)+vec2(sin(tt*.7),cos(tt*.63))*.22));

  float braid=sin(a*(7.+A*8.)-r*4.0+T(.17))*sin(a*(3.+D*5.)+r*7.0-T(.29));
  return spiral*.24+ring*.20+hex*.22+cell*.13+weave*.09+braid*.12;

void main(){
  vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
  float tt=T(.31),L=law;
  vec4 LW=texture(lawTex,uv);
  float A=LW.r,D=LW.b,R=(LW.g-.5)*2.;

  /* Read the neighbourhood of the persistent law map. The difference is the
     border between two laws — these borders become part of the artwork. */
  vec2 lp=1./vec2(180.0);

  vec4 Ly=texture(lawTex,uv+vec2(0.,lp.y));

             length(vec3(LW.r-Ly.r,LW.g-Ly.g,LW.b-Ly.b));

  float rr=length(p),aa=atan(p.y,p.x);

  vec2 q=rot(worldSpin+R*(1.25+1.35*sin(rr*2.7-tt)*.22))*p;

  /* Large-scale breathing: the coordinate system itself expands and contracts. */
  float breath=1.+.10*sin(T(.115)+sin(aa*3.+T(.08))*.7)+.045*sin(T(.23)-rr*4.);
  q*=breath;
  q+=vec2(cos(aa*5.-tt*.7),sin(aa*6.+tt*.55))*.028*sin(rr*7.-tt*1.2);

  /* Four recursive folds create the self-similar skeleton. */
  for(int k=0;k<4;k++){
    float fk=float(k);
    float turn=sin(T(.055+fk*.017)+fk*1.73)*(.12+.11*chaos+A*.045);
    q=rot(turn)*q;
    q=fold(q*(1.27+fk*.27+L*.018+D*.10),L+fk*.33);
    q*=1./(1.+length(q)*(.11+.055*D));
  }

  /* A second, softer fold is the "hidden" law: it makes broad continents
     drift without destroying the fine structure. */
  vec2 hq=fold(q*.72+vec2(.18*sin(T(.12)),.15*cos(T(.14))),L*.55+territory(q,tt,A,D));
  q=mix(q,hq,.16+.10*territory(q,tt,A,D));

  float touchEnergy=0.;
  for(int i=0;i<5;i++)if(i<touchCount){
    vec2 tp=(touch[i].xy-.5*res)/min(res.x,res.y);
    float d=length(p-tp),w=exp(-d*d/(touch[i].z*touch[i].z+.0001));
    touchEnergy+=w;
    q=rot(w*(1.75+L*.32)*touch[i].w)*q;
    q+=(tp-p)*w*(.11+.34*energy);
    /* moving a finger changes the scale of the local world, not just its hue */
    q*=1.+w*(touch[i].w*.08+energy*.12);
  }

  float terr=territory(q,tt,A,D);
  float regime=smoothstep(.24,.76,.5+.5*sin(T(.026)+terr*4.5+A*3.2-D*2.4+seed*.013));
  float f=lawField(q,L,A,D,tt,regime);
  float f2=lawField(q*1.72+vec2(.31,-.17),L*.72+D*.4,D*.7,A*.8,tt*1.1,1.-regime);

  /* Broad colour continents are driven by the low-frequency fields. */
  float continent=.5+.5*sin(f*3.1+f2*1.7+terr*5.2-T(.19));
  float micro=n2(q*10.+f*3.)*.24+n2(q*27.-f2*4.+seed)*.11;
  float ridges=smoothstep(.76,.98,abs(sin((f+micro)*8.5+T(.42))));
  float filaments=smoothstep(.72,.985,abs(sin((f2-f)*13.0-T(.27)+terr*3.))); 

  /* Law competition: different regimes use different mixtures of the same
     geometry, so the image can change character without becoming random. */
  float voiceA=f*.72+f2*.18+micro*.65;
  float voiceB=f*.20-f2*.72+micro*.45;
  float voiceC=sin((f+f2)*5.0+terr*7.0-T(.33))*.52+micro;
  float voice=mix(mix(voiceA,voiceB,regime),voiceC,edge*.72);

  float hue=.055+voice*.40+continent*.17+L*.026+rr*.25+A*.43+D*.24+regime*.20+edge*.16;
  vec3 col=pal(hue);
  float glow=.55+.45*sin(voice*8.0+tt+sin(terr*5.)*1.5);
  col*=.63+.58*glow;

  /* Fine stained-glass seams appear especially where neighbouring laws disagree. */
  float seam=abs(sin((hq.x+hq.y)*20.+f*4.+A*7.)*sin((hq.x-hq.y)*17.-f2*5.+D*8.));
  seam=pow(seam,19.);
  col+=(.45+.55*pal(hue+.47))*seam*(.18+.25*edge+.12*regime);
  col+=pal(hue+.34)*ridges*(.12+.18*regime);
  col+=pal(hue+.58)*filaments*(.10+.18*(1.-regime));
  col+=pal(hue+.30)*touchEnergy*.44;

  /* The border is a visible event: laws meeting each other create a luminous
     fault line instead of an artificial outline. */
  float fault=smoothstep(.18,.72,edge);
  fault*=.55+.45*sin((q.x-q.y)*28.+f*9.-T(.17));
  col+=pal(hue+.52)*fault*.38;

  /* Persistent feedback gives the field memory while remaining bounded. */
  vec3 old=texture(prev,uv).rgb;
  col=mix(col,old,.055+.045*(1.-chaos));

  float d=length(p)/maxR;
  float vign=1.-smoothstep(.60,1.17,d);
  col*=.86+.14*vign;
  col=pow(max(col,0.),vec3(.87));
  o=vec4(col,1.);
}`;
