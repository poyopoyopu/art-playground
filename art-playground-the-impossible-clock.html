<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020207">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Art Playground — THE IMPOSSIBLE CLOCK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207;color:#fff}
body{height:100dvh;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.controls{position:fixed;z-index:5;right:4vw;bottom:max(3.5vh,env(safe-area-inset-bottom));display:flex;gap:8px;transition:opacity .6s}
.controls.idle{opacity:0;pointer-events:none}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff25;background:#05050bd9;color:#fff;font-size:14px;box-shadow:0 4px 18px #0008;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.92)}
.btn.act{border-color:#ffffff60;background:#ffffff1e}
.label{position:fixed;z-index:4;left:50%;bottom:max(4vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:8px;letter-spacing:.42em;opacity:.28;white-space:nowrap;pointer-events:none;transition:opacity 1.2s}
.label.hide{opacity:0}
.clock{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:6px;font-family:ui-monospace,"SF Mono",monospace;font-variant-numeric:tabular-nums;pointer-events:none}
.clock.on{display:flex}
.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 16px #000,0 4px 34px #000}
.clock .t i{font-style:normal;opacity:.62}
.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.3em;opacity:.62;text-shadow:0 0 4px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="clock" id="clock"><div class="t" id="clockTime">00:00<i>:00</i></div><div class="d" id="clockDate"></div></div>
<div class="label" id="label">THE IMPOSSIBLE CLOCK · TOUCH THE FUTURE</div>
<div class="controls" id="controls">
<button class="btn" id="mutate">✦</button>
<button class="btn" id="wipe">↻</button>
<button class="btn" id="clockBtn">🕐</button>
<button class="btn" id="fsBtn">⛶</button>
</div>

<script>
/*
2026-09-11: THE IMPOSSIBLE CLOCK — built from zero.
The artwork is a time-machine field: the screen is divided into many clocks,
but none of them agree on what "now" means. Touching a place changes its
private time, and that time becomes a permanent scar in the field.
No WebGL dependency: designed to keep moving reliably on iPhone Safari.
*/

const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1;
let t=0,last=performance.now(),seed=Math.random()*10000;
let globalTime=0,mutation=0,energy=0;
let cells=[],touches=new Map(),clockOn=false,wakeLock=null,idleTimer=null;

function resize(){
  const r=c.getBoundingClientRect();
  D=Math.min(devicePixelRatio||1,1.6);
  W=Math.max(1,Math.floor(r.width*D));
  H=Math.max(1,Math.floor(r.height*D));
  c.width=W;c.height=H;
  buildCells();
}
new ResizeObserver(resize).observe(c);
addEventListener('resize',resize,{passive:true});

function rnd(n){const x=Math.sin(n*127.1+seed*17.3)*43758.5453;return x-Math.floor(x)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function hue(h){return `hsl(${((h%360)+360)%360} 100% ${48+18*Math.sin(h*.017+t)}%)`}

/*
  The grid is intentionally not a normal grid.
  Each cell has its own clock speed and direction.
*/
function buildCells(){
  cells=[];
  const min=Math.min(W,H);
  const step=Math.max(30,min/11);
  const nx=Math.ceil(W/step)+2,ny=Math.ceil(H/step)+2;
  for(let y=-1;y<ny;y++)for(let x=-1;x<nx;x++){
    const px=x*step+step*.5+(rnd(x*91+y*37)-.5)*step*.55;
    const py=y*step+step*.5+(rnd(x*17+y*83)-.5)*step*.55;
    cells.push({
      x:px,y:py,
      r:step*(.25+.27*rnd(x*13+y*71)),
      speed:(rnd(x*31+y*11)-.5)*2.2,
      phase:rnd(x*47+y*19)*Math.PI*2,
      twist:(rnd(x*7+y*97)-.5)*2,
      scar:0,scarAngle:0
    });
  }
}
resize();

function draw(now){
  const dt=Math.min(.035,(now-last)/1000);last=now;
  t+=dt;globalTime+=dt;
  energy*=Math.pow(.08,dt);
  mutation*=Math.pow(.25,dt);

  ctx.fillStyle='#020207';
  ctx.fillRect(0,0,W,H);

  const min=Math.min(W,H),cx=W/2,cy=H/2;
  const world=Math.sin(t*.19+mutation)*.06;

  // A slow luminous substrate: the "now" itself moves.
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(world);
  ctx.translate(-cx,-cy);

  for(let k=0;k<cells.length;k++){
    const q=cells[k];
    let x=q.x,y=q.y;
    let dx=x-cx,dy=y-cy;
    const rr=Math.hypot(dx,dy)/min;
    const aa=Math.atan2(dy,dx);

    // Nearby cells borrow time from one another.
    let localTime=t*q.speed+q.phase+Math.sin(rr*8-t*.55)*.8;
    localTime+=q.scar*Math.sin(t*.9+q.scarAngle)*2.7;
    localTime+=mutation*(.5+rr);

    // The field periodically "forgets" Euclidean distance and folds it.
    const fold=.5+.5*Math.sin(t*.23+rr*9+aa*5+q.phase);
    const radius=q.r*(.72+.38*Math.sin(localTime));
    const pulse=.5+.5*Math.sin(localTime*2.0+fold*4.0);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(q.twist+Math.sin(localTime*.37)*.32);

    // concentric clock marks, but every clock has a different hour.
    const marks=8+Math.floor(8*(.5+.5*Math.sin(q.phase)));
    for(let m=0;m<marks;m++){
      const a=m*Math.PI*2/marks+localTime*.16;
      const inner=radius*(.55+.12*Math.sin(m+q.phase));
      const outer=radius*(.92+.10*pulse);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
      ctx.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);
      ctx.lineWidth=Math.max(.7,D*.7);
      ctx.globalAlpha=.18+.22*pulse;
      ctx.strokeStyle=hue(155+q.phase*45+m*31+t*16);
      ctx.stroke();
    }

    // clock hand points to its private time.
    const hand=localTime;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(hand)*radius*.76,Math.sin(hand)*radius*.76);
    ctx.lineWidth=Math.max(.8,D);
    ctx.globalAlpha=.48+.28*pulse;
    ctx.strokeStyle=hue(320+q.phase*60+t*24);
    ctx.stroke();

    // The center is deliberately "wrong": a hole, not a dot.
    ctx.beginPath();
    ctx.arc(0,0,radius*(.055+.035*pulse),0,Math.PI*2);
    ctx.globalAlpha=.7;
    ctx.fillStyle='#020207';
    ctx.fill();

    // Scar halo
    if(q.scar>.02){
      ctx.beginPath();
      ctx.arc(0,0,radius*(1.05+.18*q.scar),0,Math.PI*2);
      ctx.globalAlpha=.08*q.scar;
      ctx.lineWidth=radius*.22;
      ctx.strokeStyle=hue(35+q.scarAngle*80+t*40);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();

  // Long "faults" connect clocks that disagree strongly.
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<cells.length;i+=7){
    const a=cells[i],b=cells[(i+13)%cells.length];
    const disagreement=Math.abs(Math.sin((a.speed-b.speed)*t*2+a.phase-b.phase));
    if(disagreement<.72)continue;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    ctx.quadraticCurveTo(
      mx+Math.sin(t+i)*min*.08,
      my+Math.cos(t*.7+i)*min*.08,
      b.x,b.y
    );
    ctx.globalAlpha=.025+.055*disagreement;
    ctx.lineWidth=.5*D;
    ctx.strokeStyle=hue(90+i*.7+t*28);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* Touch doesn't move an object. It changes the local concept of time. */
function localPos(e){
  const r=c.getBoundingClientRect(),m=Math.min(r.width,r.height);
  return {x:(e.clientX-r.left)/m,y:(e.clientY-r.top)/m};
}
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{c.setPointerCapture(e.pointerId)}catch(_){}
  const p=localPos(e);
  touches.set(e.pointerId,{x:p.x,y:p.y});
  let best=null,bd=1e9;
  for(const q of cells){
    const d=(q.x/W-p.x)*(q.x/W-p.x)+(q.y/H-p.y)*(q.y/H-p.y);
    if(d<bd){bd=d;best=q}
  }
  if(best){
    best.scar=clamp(best.scar+.9,0,3);
    best.scarAngle=(Math.atan2(p.y-best.y/H,p.x-best.x/W));
    best.speed+=(Math.random()-.5)*2.8;
    best.phase+=Math.random()*Math.PI*2;
  }
  energy=1;mutation+=(Math.random()-.5)*.9;
  document.getElementById('label').classList.add('hide');
  bumpIdle();
},{passive:false});

c.addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId))return;
  const p=localPos(e);
  let best=null,bd=1e9;
  for(const q of cells){
    const d=(q.x/W-p.x)*(q.x/W-p.x)+(q.y/H-p.y)*(q.y/H-p.y);
    if(d<bd){bd=d;best=q}
  }
  if(best&&bd<.006){
    best.scar=clamp(best.scar+.035,0,3);
    best.speed+=(Math.random()-.5)*.018;
  }
  mutation+=(Math.random()-.5)*.035;
  energy=1;
},{passive:true});
function up(e){touches.delete(e.pointerId)}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
c.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('mutate').onclick=()=>{
  seed=Math.random()*10000;
  mutation+=(Math.random()-.5)*5;
  energy=1;
  for(const q of cells)if(Math.random()<.22){
    q.speed+=(Math.random()-.5)*1.8;
    q.phase+=Math.random()*Math.PI*2;
  }
};
document.getElementById('wipe').onclick=()=>{
  for(const q of cells){q.scar*=.04;q.speed*=.82}
  mutation+=3;energy=1;
};

const ctrl=document.getElementById('controls');
function bumpIdle(){
  ctrl.classList.remove('idle');
  clearTimeout(idleTimer);
  if(clockOn)idleTimer=setTimeout(()=>ctrl.classList.add('idle'),4000);
}
addEventListener('pointerdown',bumpIdle,{passive:true});

/* Clock: same centered presentation rule as the established piece. */
const clock=document.getElementById('clock');
const clockTime=document.getElementById('clockTime');
const clockDate=document.getElementById('clockDate');
const week=['日','月','火','水','木','金','土'];
const pad=n=>String(n).padStart(2,'0');
function tickClock(){
  if(!clockOn)return;
  const d=new Date();
  clockTime.innerHTML=pad(d.getHours())+':'+pad(d.getMinutes())+'<i>:'+pad(d.getSeconds())+'</i>';
  clockDate.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 ('+week[d.getDay()]+')';
}
function clockLoop(){tickClock();setTimeout(clockLoop,1000-(Date.now()%1000)+8)}
clockLoop();

async function wake(){
  try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(_){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&clockOn&&!wakeLock)wake();
});
document.getElementById('clockBtn').onclick=function(){
  clockOn=!clockOn;
  clock.classList.toggle('on',clockOn);
  this.classList.toggle('act',clockOn);
  if(clockOn)wake();
  else{try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null;ctrl.classList.remove('idle')}
  bumpIdle();
};

document.getElementById('fsBtn').onclick=async()=>{
  const d=document.documentElement;
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  try{
    if(fs)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(d.requestFullscreen)await d.requestFullscreen();
    else if(d.webkitRequestFullscreen)await d.webkitRequestFullscreen();
    else alert('Safariでは「ホーム画面に追加」でフチなし表示にできます');
  }catch(_){}
};
setTimeout(()=>document.getElementById('label').classList.add('hide'),9000);
</script>
</body>
</html>
