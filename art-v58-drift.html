<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — DRIFT</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* DRIFT v58 — ChatGPT作。世界のルール: 世界には北がない。タップした場所が新しい北になり、全物質の軌道が組み替わる。放置しても基準方向は漂う。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,t=0,ang=0,target=0,seed=Math.random()*9,pts=[];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;if(!pts.length)for(let i=0;i<190;i++)pts.push({a:Math.random()*6.283,r:20+Math.random()*Math.min(W,H)*.48})}addEventListener('resize',size);size();
function draw(loop=false,ph=0){if(loop)t=ph*6.283;else t+=.012;g.setTransform(D,0,0,D,0,0);g.fillStyle='rgba(3,3,7,.13)';g.fillRect(0,0,W,H);if(!loop)ang+=(target-ang)*.018+.001;for(let i=0;i<pts.length;i++){let p=pts[i],q=p.a+ang+t*(.15+.0008*p.r),rr=p.r*(.92+.08*Math.sin(t*.7+p.a*3)),x=W/2+Math.cos(q)*rr,y=H/2+Math.sin(q)*rr,q2=q+1.7+.2*Math.sin(t+i),x2=W/2+Math.cos(q2)*rr*.94,y2=H/2+Math.sin(q2)*rr*.94;g.strokeStyle=`hsla(${(i*2.1+seed*70)%360} 90% 72% / .45)`;g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke();g.fillStyle='white';g.globalAlpha=.5;g.fillRect(x-1,y-1,2,2)}g.globalAlpha=1;if(!loop)requestAnimationFrame(()=>draw())}draw();c.addEventListener('pointerdown',e=>{target=Math.atan2(e.clientY-H/2,e.clientX-W/2)});APKit.init({canvas:c,gifName:'drift-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(true,p),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>{ang=target=0}}]});
</script></body></html>
