<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Liquid Kaleidoscope</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; overscroll-behavior:none; }
  canvas { display:block; width:100%; height:100%; }
  #hint {
    position:fixed; left:0; right:0; bottom:6vh; text-align:center;
    font-family:-apple-system, "Hiragino Sans", sans-serif;
    font-size:12px; letter-spacing:0.25em; color:rgba(255,255,255,0.55);
    pointer-events:none; transition:opacity 2s ease; opacity:1;
    text-shadow:0 0 8px rgba(0,0,0,0.6);
  }
  #hint.hide { opacity:0; }
  #fallback {
    display:none; position:fixed; inset:0; color:#fff; background:#000;
    font-family:-apple-system, sans-serif; align-items:center; justify-content:center;
    padding:24px; text-align:center; font-size:15px; line-height:1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">TAP · DRAG · HOLD</div>
<div id="fallback">この端末のブラウザではWebGLがサポートされていません。</div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var hintEl = document.getElementById('hint');
var gl = canvas.getContext('webgl', { antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false })
      || canvas.getContext('experimental-webgl');

if (!gl) {
  document.getElementById('fallback').style.display = 'flex';
  return;
}

// ---------- shader sources ----------

var VERT = [
"attribute vec2 aPos;",
"varying vec2 vUv;",
"void main(){",
"  vUv = aPos*0.5+0.5;",
"  gl_Position = vec4(aPos,0.0,1.0);",
"}"
].join("\n");

var NOISE_LIB = [
"float hash(vec2 p){",
"  p = fract(p*vec2(123.34,456.21));",
"  p += dot(p,p+45.32);",
"  return fract(p.x*p.y);",
"}",
"float vnoise(vec2 p){",
"  vec2 i=floor(p), f=fract(p);",
"  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));",
"  vec2 u=f*f*(3.0-2.0*f);",
"  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;",
"}"
].join("\n");

var SIM_FRAG = [
"precision highp float;",
"varying vec2 vUv;",
"uniform sampler2D uPrev;",
"uniform float uTime;",
"uniform float uDt;",
"uniform float uOrder;",
"uniform float uQuality;",
"uniform vec2 uTexel;",
"uniform vec4 uTouchPos[4];",   // xy=pos(0..1) z=strength w=holdBoost
"uniform vec4 uTouchColor[4];", // rgb=color
"uniform vec2 uTouchVel[4];",
NOISE_LIB,
"float fbmQ(vec2 p, float oct){",
"  float v=0.0, amp=0.5;",
"  for(int i=0;i<5;i++){",
"    float w = step(float(i), oct-1.0);",
"    v += amp*vnoise(p)*w;",
"    p *= 2.02;",
"    amp *= 0.55;",
"  }",
"  return v;",
"}",
"vec2 curlQ(vec2 p, float oct){",
"  float e=0.06;",
"  float n1=fbmQ(p+vec2(0.0,e),oct);",
"  float n2=fbmQ(p-vec2(0.0,e),oct);",
"  float n3=fbmQ(p+vec2(e,0.0),oct);",
"  float n4=fbmQ(p-vec2(e,0.0),oct);",
"  float dx=(n1-n2)/(2.0*e);",
"  float dy=(n3-n4)/(2.0*e);",
"  return vec2(dy,-dx);",
"}",
"void main(){",
"  float oct = mix(2.0, 4.0, step(0.5, uQuality));",
"  vec2 uv = vUv;",
"  vec2 p = uv*3.0 - 1.5;",
"  vec2 vel = curlQ(p + uTime*0.06, oct) * mix(0.9, 0.35, uOrder);",
"  for(int i=0;i<4;i++){",
"    vec2 tp = uTouchPos[i].xy;",
"    float strength = uTouchPos[i].z;",
"    vec2 d = uv - tp;",
"    float dist = length(d)+0.0005;",
"    vec2 tang = vec2(-d.y,d.x)/dist;",
"    float falloff = exp(-dist*7.0)*step(0.001, strength);",
"    vel += tang * strength * falloff * 1.7;",
"    vel += uTouchVel[i] * falloff * 0.9;",
"  }",
"  vec2 srcUv = uv - vel*uDt;",
"  srcUv = clamp(srcUv, 0.0, 1.0);",
"  vec3 prevColor = texture2D(uPrev, srcUv).rgb * 0.985;",
"  vec3 blur = texture2D(uPrev, srcUv+vec2(uTexel.x,0.0)).rgb",
"            + texture2D(uPrev, srcUv-vec2(uTexel.x,0.0)).rgb",
"            + texture2D(uPrev, srcUv+vec2(0.0,uTexel.y)).rgb",
"            + texture2D(uPrev, srcUv-vec2(0.0,uTexel.y)).rgb;",
"  prevColor = mix(prevColor, blur*0.25, 0.07);",
"  for(int i=0;i<4;i++){",
"    float strength = uTouchPos[i].z;",
"    vec2 tp = uTouchPos[i].xy;",
"    float dist = distance(uv, tp);",
"    float radius = 0.018 + uTouchPos[i].w*0.05;",
"    float splat = exp(-dist*dist/(radius*radius)) * strength;",
"    prevColor += uTouchColor[i].rgb * splat * 0.85;",
"  }",
"  gl_FragColor = vec4(clamp(prevColor, 0.0, 1.6), 1.0);",
"}"
].join("\n");

var RENDER_FRAG = [
"precision highp float;",
"varying vec2 vUv;",
"uniform sampler2D uDye;",
"uniform float uTime;",
"uniform float uFold;",
"uniform float uZoom;",
"uniform float uRotation;",
"uniform float uOrder;",
"uniform vec2 uPan;",
"uniform float uAspect;",
NOISE_LIB,
"float fbm4(vec2 p){",
"  float v=0.0, amp=0.5;",
"  for(int i=0;i<4;i++){",
"    v += amp*vnoise(p);",
"    p *= 2.03;",
"    amp *= 0.55;",
"  }",
"  return v;",
"}",
"vec3 palette(float t){",
"  vec3 a=vec3(0.55,0.45,0.55);",
"  vec3 b=vec3(0.45,0.45,0.45);",
"  vec3 c=vec3(1.0,1.0,0.6);",
"  vec3 d=vec3(0.25,0.55,0.75) + uTime*0.012;",
"  return a+b*cos(6.28318*(c*t+d));",
"}",
"void main(){",
"  vec2 centered = (vUv - 0.5);",
"  centered.x *= uAspect;",
"  vec2 uv = centered * uZoom + uPan;",
"  float ang = atan(uv.y, uv.x) + uRotation;",
"  float r = length(uv);",
"  float wedge = 6.2831853 / max(uFold, 1.5);",
"  ang = mod(ang, wedge);",
"  ang = abs(ang - wedge*0.5);",
"  float warpAmt = mix(0.4, 0.05, uOrder);",
"  float w = fbm4(vec2(r*3.0, ang*2.2) + uTime*0.045) * warpAmt;",
"  r += w;",
"  vec2 kUv = vec2(cos(ang), sin(ang)) * r;",
"  kUv = kUv*0.5 + 0.5;",
"  kUv = clamp(kUv, 0.001, 0.999);",
"  float ca = mix(0.0012, 0.006, 1.0-uOrder);",
"  float dR = texture2D(uDye, clamp(kUv+vec2(ca,0.0),0.0,1.0)).r;",
"  float dG = texture2D(uDye, kUv).g;",
"  float dB = texture2D(uDye, clamp(kUv-vec2(ca,0.0),0.0,1.0)).b;",
"  vec3 dye = vec3(dR,dG,dB);",
"  float lum = dot(dye, vec3(0.333));",
"  vec3 col = palette(lum*1.4 + r*0.3);",
"  col = mix(col*0.55, col, clamp(lum*2.0, 0.0, 1.0));",
"  col += dye*0.5;",
"  float vig = smoothstep(1.35, 0.25, length(vUv-0.5));",
"  col *= vig*0.55 + 0.45;",
"  gl_FragColor = vec4(col, 1.0);",
"}"
].join("\n");

// ---------- gl helpers ----------

function compile(type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
    throw new Error("shader compile failed");
  }
  return s;
}
function link(vsSrc, fsSrc){
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error("program link failed");
  }
  return p;
}
function uniforms(program, names){
  var u = {};
  for (var i=0;i<names.length;i++){
    u[names[i]] = gl.getUniformLocation(program, names[i]);
  }
  return u;
}

var simProgram = link(VERT, SIM_FRAG);
var renderProgram = link(VERT, RENDER_FRAG);

var quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(){
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
}

var simU = uniforms(simProgram, ["uPrev","uTime","uDt","uOrder","uQuality","uTexel","uTouchPos","uTouchColor","uTouchVel"]);
var rndU = uniforms(renderProgram, ["uDye","uTime","uFold","uZoom","uRotation","uOrder","uPan","uAspect"]);

// ---------- framebuffers (ping-pong sim, square resolution) ----------

var SIM_RES = 208;

function makeFBO(size){
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo:fbo, tex:tex };
}

var bufA = makeFBO(SIM_RES);
var bufB = makeFBO(SIM_RES);

// clear both to black initially
function clearFBO(target){
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  gl.viewport(0,0,SIM_RES,SIM_RES);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
}
clearFBO(bufA);
clearFBO(bufB);

// ---------- resize ----------

var dpr = Math.min(window.devicePixelRatio || 1, 2.0);
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w*dpr);
  canvas.height = Math.round(h*dpr);
}
resize();
window.addEventListener('resize', resize);

// ---------- touch / pointer state ----------

var MAX_TOUCHES = 4;
var touches = [];
for (var t=0;t<MAX_TOUCHES;t++){
  touches.push({
    id:null, active:false,
    x:0.5, y:0.5, px:0.5, py:0.5,
    vx:0, vy:0,
    strength:0, holdBoost:0,
    color:[1,1,1],
    downTime:0, lastMoveTime:0, moved:0,
    foldTriggered:false
  });
}

function hueColor(h){
  // simple HSV(h,0.85,1) -> rgb, h in [0,1)
  var s=0.8, v=1.0;
  var i = Math.floor(h*6);
  var f = h*6 - i;
  var p = v*(1-s), q = v*(1-f*s), tt = v*(1-(1-f)*s);
  var r,g,b;
  switch(i%6){
    case 0: r=v; g=tt; b=p; break;
    case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=tt; break;
    case 3: r=p; g=q; b=v; break;
    case 4: r=tt; g=p; b=v; break;
    default: r=v; g=p; b=q; break;
  }
  return [r,g,b];
}

function findFreeSlot(){
  for (var i=0;i<MAX_TOUCHES;i++) if (!touches[i].active) return i;
  return -1;
}
function slotForId(id){
  for (var i=0;i<MAX_TOUCHES;i++) if (touches[i].active && touches[i].id===id) return i;
  return -1;
}

function normPos(clientX, clientY){
  var w = window.innerWidth, h = window.innerHeight;
  return [clientX/w, 1.0 - clientY/h];
}

var now = performance.now();
var globalHue = Math.random();

function onDown(id, clientX, clientY){
  var slot = findFreeSlot();
  if (slot<0) return;
  var pos = normPos(clientX, clientY);
  globalHue = (globalHue + 0.15 + Math.random()*0.1) % 1.0;
  var col = hueColor(globalHue);
  var s = touches[slot];
  s.id = id; s.active = true;
  s.x = s.px = pos[0]; s.y = s.py = pos[1];
  s.vx = 0; s.vy = 0;
  s.strength = 1.0; s.holdBoost = 0;
  s.color = col;
  s.downTime = now; s.lastMoveTime = now; s.moved = 0;
  s.foldTriggered = false;
  hintEl.classList.add('hide');
}
function onMove(id, clientX, clientY){
  var slot = slotForId(id);
  if (slot<0) return;
  var s = touches[slot];
  var pos = normPos(clientX, clientY);
  var dx = pos[0]-s.x, dy = pos[1]-s.y;
  s.px = s.x; s.py = s.y;
  s.x = pos[0]; s.y = pos[1];
  s.vx = dx*6.0; s.vy = dy*6.0;
  s.moved += Math.abs(dx)+Math.abs(dy);
  if (Math.abs(dx)+Math.abs(dy) > 0.002) s.lastMoveTime = now;
  s.strength = Math.min(1.0, s.strength + 0.3);
}
function onUp(id){
  var slot = slotForId(id);
  if (slot<0) return;
  touches[slot].releasing = true;
}

// pointer events cover mouse + touch + pen uniformly
canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  onDown(e.pointerId, e.clientX, e.clientY);
}, {passive:false});
canvas.addEventListener('pointermove', function(e){
  if (e.pressure===0 && e.pointerType==='mouse') return;
  onMove(e.pointerId, e.clientX, e.clientY);
}, {passive:true});
canvas.addEventListener('pointerup', function(e){ onUp(e.pointerId); }, {passive:true});
canvas.addEventListener('pointercancel', function(e){ onUp(e.pointerId); }, {passive:true});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// ---------- pinch (zoom / rotation) ----------

var camZoom = 1.0, camRotation = 0.0;
var camZoomTarget = 1.0;
var pinchStartDist = null, pinchStartAngle = null, pinchStartZoom = 1.0, pinchStartRot = 0.0;

function activeSlots(){
  var out = [];
  for (var i=0;i<MAX_TOUCHES;i++) if (touches[i].active) out.push(i);
  return out;
}

// ---------- symmetry / order state ----------

var foldCurrent = 6.0, foldTarget = 6.0;
var FOLD_CHOICES = [3,4,5,6,7,8,9,12];
var lastFrameTime = performance.now();
var startTime = performance.now();

function triggerFoldChange(){
  var choice;
  do { choice = FOLD_CHOICES[Math.floor(Math.random()*FOLD_CHOICES.length)]; }
  while (choice === foldTarget && FOLD_CHOICES.length>1);
  foldTarget = choice;
}

// ---------- main loop ----------

var quality = 1.0;
var fpsAccum = 0, fpsFrames = 0, fpsCheckTime = performance.now();

var read = bufA, write = bufB;

function step(){
  now = performance.now();
  var dtMs = Math.min(now - lastFrameTime, 50);
  lastFrameTime = now;
  var dt = dtMs/1000.0;
  var elapsed = (now-startTime)/1000.0;

  // --- fps / adaptive quality ---
  fpsAccum += dtMs; fpsFrames++;
  if (now - fpsCheckTime > 2000){
    var avgMs = fpsAccum/Math.max(1,fpsFrames);
    if (avgMs > 34 && quality>0.0) quality = 0.0;
    else if (avgMs < 20 && quality<1.0) quality = 1.0;
    fpsAccum=0; fpsFrames=0; fpsCheckTime = now;
  }

  // --- order/chaos oscillator ---
  var order = 0.5 + 0.5*Math.sin(elapsed*0.045);

  // --- update touches: hold detection, decay, release fade ---
  for (var i=0;i<MAX_TOUCHES;i++){
    var s = touches[i];
    if (!s.active) continue;
    if (s.releasing){
      s.strength -= dt*0.6;
      if (s.strength<=0){ s.active=false; s.releasing=false; s.strength=0; }
    } else {
      // gentle settle of velocity so a held-still finger still radiates via holdBoost
      s.vx *= 0.85; s.vy *= 0.85;
      var stillMs = now - s.lastMoveTime;
      if (stillMs > 550){
        s.holdBoost = Math.min(1.0, s.holdBoost + dt*0.35);
        if (!s.foldTriggered && stillMs > 650){
          triggerFoldChange();
          s.foldTriggered = true;
        }
      } else {
        s.holdBoost = Math.max(0.0, s.holdBoost - dt*0.8);
      }
    }
  }

  // --- pinch zoom/rotation ---
  var acts = activeSlots();
  if (acts.length>=2){
    var s0=touches[acts[0]], s1=touches[acts[1]];
    var ddx=(s1.x-s0.x), ddy=(s1.y-s0.y);
    var dist = Math.sqrt(ddx*ddx+ddy*ddy);
    var angle = Math.atan2(ddy,ddx);
    if (pinchStartDist===null){
      pinchStartDist = dist; pinchStartAngle = angle;
      pinchStartZoom = camZoomTarget; pinchStartRot = camRotation;
    } else {
      var ratio = pinchStartDist / Math.max(dist,0.0001);
      camZoomTarget = Math.max(0.35, Math.min(2.5, pinchStartZoom * ratio));
      camRotation = pinchStartRot + (angle - pinchStartAngle);
    }
  } else {
    pinchStartDist = null; pinchStartAngle = null;
  }
  camZoom += (camZoomTarget-camZoom)*Math.min(1,dt*4.0);
  foldCurrent += (foldTarget-foldCurrent)*Math.min(1,dt*1.2);

  // ================= simulation pass =================
  gl.bindFramebuffer(gl.FRAMEBUFFER, write.fbo);
  gl.viewport(0,0,SIM_RES,SIM_RES);
  gl.useProgram(simProgram);
  bindQuad();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, read.tex);
  gl.uniform1i(simU.uPrev, 0);
  gl.uniform1f(simU.uTime, elapsed);
  gl.uniform1f(simU.uDt, Math.min(dt,0.033));
  gl.uniform1f(simU.uOrder, order);
  gl.uniform1f(simU.uQuality, quality);
  gl.uniform2f(simU.uTexel, 1.0/SIM_RES, 1.0/SIM_RES);

  var posArr = new Float32Array(4*4);
  var colArr = new Float32Array(4*4);
  var velArr = new Float32Array(4*2);
  for (var k=0;k<MAX_TOUCHES;k++){
    var st = touches[k];
    var strength = st.active ? st.strength : 0.0;
    posArr[k*4+0] = st.x; posArr[k*4+1] = st.y; posArr[k*4+2] = strength; posArr[k*4+3] = st.holdBoost;
    colArr[k*4+0] = st.color[0]; colArr[k*4+1] = st.color[1]; colArr[k*4+2] = st.color[2]; colArr[k*4+3] = 1.0;
    velArr[k*2+0] = st.vx; velArr[k*2+1] = st.vy;
  }
  gl.uniform4fv(simU.uTouchPos, posArr);
  gl.uniform4fv(simU.uTouchColor, colArr);
  gl.uniform2fv(simU.uTouchVel, velArr);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  var tmp = read; read = write; write = tmp;

  // ================= render pass =================
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width, canvas.height);
  gl.useProgram(renderProgram);
  bindQuad();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, read.tex);
  gl.uniform1i(rndU.uDye, 0);
  gl.uniform1f(rndU.uTime, elapsed);
  gl.uniform1f(rndU.uFold, foldCurrent);
  gl.uniform1f(rndU.uZoom, camZoom);
  gl.uniform1f(rndU.uRotation, camRotation);
  gl.uniform1f(rndU.uOrder, order);
  gl.uniform2f(rndU.uPan, 0.0, 0.0);
  gl.uniform1f(rndU.uAspect, canvas.width/canvas.height);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(step);
}

requestAnimationFrame(step);

// hide hint after a while even without interaction
setTimeout(function(){ hintEl.classList.add('hide'); }, 6000);

})();
</script>
</body>
</html>
