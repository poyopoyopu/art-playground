<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Art Playground — INK BLOOM</title><script src="ap-kit.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02040a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}body{overflow:hidden}#app{height:100dvh;background:#02040a}main{position:relative;width:100%;height:100dvh}canvas{width:100%;height:100%;display:block;touch-action:none;background:#02040a}</style></head><body><div id="app"><main><canvas id="c"></canvas></main></div><script>const C=document.getElementById("c"),X=C.getContext("2d"),$=id=>document.getElementById(id);
let mode="field",W=1,H=1,dpr=1,t=0,last=0,run=true,pulses=[],touches=[],glitters=[],lastGlitter=0;
let seed=Math.random()*1000,energy=.65;
let h=210,speed=70,n=28,w=.60;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=C.clientWidth||innerWidth;H=C.clientHeight||300;C.width=Math.floor(W*dpr);C.height=Math.floor(H*dpr);X.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function col(h,a=.5,l=60){return "hsla("+((h%360+360)%360)+",90%,"+l+"%,"+a+")"}function vals(){return {h,n,w}}
function bg(){X.fillStyle="#02040a";X.fillRect(0,0,W,H)}
function disturb(x,y){let dx=0,dy=0;for(const p of touches){let ax=x-p.x,ay=y-p.y,d=Math.hypot(ax,ay);if(d<p.r&&d>0){let q=(1-d/p.r)*p.a,ang=Math.atan2(ay,ax);dx+=Math.cos(ang)*q*p.power;dy+=Math.sin(ang)*q*p.power}}return {x:x+dx,y:y+dy}}
function addTouch(x,y){touches.push({x,y,r:Math.min(W,H)*.24,a:1,power:34});if(touches.length>6)touches.shift()}
function burstGlitter(x,y,strong=false){
  const now=performance.now();
  if(!strong && now-lastGlitter<70)return;
  lastGlitter=now;
  const count=strong?34:9;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(strong?1.2:.55)+Math.random()*(strong?4.8:2.4);
    const life=(strong?.75:.48)+Math.random()*(strong?.8:.55);
    glitters.push({
      x,y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life,max:life,age:0,
      size:.8+Math.random()*3.8,
      hue:h+Math.random()*150-25,
      spin:(Math.random()-.5)*8,
      rot:Math.random()*Math.PI*2,
      phase:Math.random()*Math.PI*2
    });
  }
  if(glitters.length>180)glitters.splice(0,glitters.length-180);
}
function drawInk(v){
  const bands=Math.max(5,Math.floor(v.n*.34));
  const amp=H*(.025+.10*v.w);
  X.save();
  X.globalCompositeOperation="screen";
  X.lineCap="round";
  X.lineJoin="round";
  for(let k=0;k<bands;k++){
    const y0=H*(.18+(k+1)/(bands+1)*.64);
    const hue=v.h+k*(150/bands)+18*Math.sin(t*.18+k);
    const width=Math.max(10,Math.min(W,H)*(.035+.018*Math.sin(k*1.7+t*.12)));
    const grad=X.createLinearGradient(0,y0,W,y0);
    grad.addColorStop(0,"transparent");
    grad.addColorStop(.12,col(hue,.04,55));
    grad.addColorStop(.32,col(hue+35,.28,62));
    grad.addColorStop(.52,col(hue+80,.42,66));
    grad.addColorStop(.72,col(hue+125,.22,60));
    grad.addColorStop(.9,col(hue+165,.04,55));
    grad.addColorStop(1,"transparent");
    X.strokeStyle=grad;
    X.lineWidth=width*2.4;
    X.filter="blur("+Math.max(2,width*.18)+"px)";
    X.beginPath();
    for(let x=-20;x<=W+20;x+=10){
      const q=x/W;
      const wave=Math.sin(q*7+t*.32+k*1.43)+.52*Math.sin(q*15-t*.21+k*.77)+.22*Math.sin(q*29+t*.47+k);
      const drift=Math.sin(t*.13+k*2.1)*H*.025;
      const y=y0+wave*amp+drift;
      x<=-20?X.moveTo(x,y):X.lineTo(x,y);
    }
    X.stroke();
    X.filter="none";
    X.lineWidth=Math.max(1.2,width*.09);
    X.globalAlpha=.72;
    X.strokeStyle=col(hue+75,.38,74);
    X.beginPath();
    for(let x=-20;x<=W+20;x+=8){
      const q=x/W;
      const wave=Math.sin(q*7+t*.32+k*1.43)+.52*Math.sin(q*15-t*.21+k*.77)+.22*Math.sin(q*29+t*.47+k);
      const y=y0+wave*amp+Math.sin(t*.13+k*2.1)*H*.025;
      x<=-20?X.moveTo(x,y):X.lineTo(x,y);
    }
    X.stroke();
    X.globalAlpha=1;
  }
  // drifting luminous ink droplets
  const dots=Math.max(10,Math.floor(v.n*1.4));
  for(let i=0;i<dots;i++){
    const q=(i*0.61803398875)%1;
    const x=(q*W+t*18*(.35+(i%5)/8))%(W+80)-40;
    const y=H*(.15+((i*0.38196601125)%1)*.7)+Math.sin(t*.35+i*1.9)*H*.035;
    const r=1.2+3.8*(.5+.5*Math.sin(t*.7+i));
    X.fillStyle=col(v.h+i*11,.13,68);
    X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fill();
  }
  X.restore();
}
function drawAurora(v){let layers=Math.max(4,Math.floor(v.n/6));X.save();X.globalCompositeOperation="screen";for(let k=0;k<layers;k++){let base=H*(.16+k/(layers+1)*.72);X.beginPath();for(let x=-20;x<=W+20;x+=8){let y=base+Math.sin(x*.006+t*.42+k*1.7)*H*(.025+.055*v.w)+Math.sin(x*.014-t*.25+k*.8)*H*.025;x<0?X.moveTo(x,y):X.lineTo(x,y)}X.lineTo(W+20,base+H*.18);X.lineTo(-20,base+H*.18);X.closePath();let g=X.createLinearGradient(0,base-H*.13,0,base+H*.18);g.addColorStop(0,"transparent");g.addColorStop(.38,col(v.h+95+k*28,.18,65));g.addColorStop(.58,col(v.h+175+k*19,.25,58));g.addColorStop(1,"transparent");X.fillStyle=g;X.fill();}for(let i=0;i<5;i++){let x=W*(.1+i*.22+.05*Math.sin(t*.2+i)),y=H*(.2+.13*Math.sin(t*.3+i));let r=Math.min(W,H)*(.12+.05*Math.sin(t*.4+i));let g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col(v.h+120+i*35,.08,70));g.addColorStop(1,"transparent");X.fillStyle=g;X.fillRect(x-r,y-r,r*2,r*2)}X.restore()}
function drawField(v){
  const step=Math.max(9,Math.min(24,Math.min(W,H)/(8+v.n*.26)));
  const shapeMode=Math.floor(seed*10)%5;
  const centers=[
    {x:W*(.18+.18*Math.sin(t*.23+seed)),y:H*(.28+.16*Math.cos(t*.17+seed*.7)),a:1.2},
    {x:W*(.78+.14*Math.cos(t*.19+seed*1.3)),y:H*(.62+.17*Math.sin(t*.21+seed)),a:1.05},
    {x:W*(.50+.22*Math.sin(t*.13+seed*2)),y:H*(.52+.20*Math.cos(t*.16+seed)),a:.9},
    ...touches.map(p=>({x:p.x,y:p.y,a:p.a*2.0}))
  ];
  X.save();X.globalCompositeOperation="screen";
  for(let y=step/2;y<H;y+=step){
    for(let x=step/2;x<W;x+=step){
      let f=0,tw=0,px=x,py=y;
      for(const c of centers){
        const ax=x-c.x,ay=y-c.y,d=Math.max(8,Math.hypot(ax,ay)),ang=Math.atan2(ay,ax);
        f+=Math.sin(d*.055-t*(1.15+energy*.9)+Math.sin(ang*3+t*.18)*1.8)*c.a;
        tw+=Math.sin(ang*4+t*.55+d*.012)*c.a/(1+d*.008);
        px+=Math.cos(ang+Math.PI/2)*Math.sin(d*.035-t*.7)*step*.24*c.a;
        py+=Math.sin(ang+Math.PI/2)*Math.sin(d*.035-t*.7)*step*.24*c.a;
      }
      const z=disturb(px,py),q=.5+.5*Math.sin(f*1.85+tw*1.2);
      const pulse=.5+.5*Math.sin(t*1.35+f*1.8+x*.008-y*.006);
      const r=step*(.06+.48*q)*(1+.20*(pulse-.5));
      const hue=v.h+125*q+55*Math.sin(f*.7+t*.16);
      X.save();X.translate(z.x,z.y);X.rotate(tw*.9+t*.05);
      X.strokeStyle=col(hue,.14+.40*q,48+25*q);X.lineWidth=.8+1.8*q;
      X.beginPath();
      if(shapeMode===0){X.arc(0,0,r,0,Math.PI*2)}
      else if(shapeMode===1){for(let i=0;i<6;i++){let aa=i*Math.PI/3;let rr=r*(.65+.45*Math.sin(t+f+i*2.1));let xx=Math.cos(aa)*rr,yy=Math.sin(aa)*rr;i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.closePath()}
      else if(shapeMode===2){for(let i=0;i<10;i++){let aa=i*Math.PI/5;let rr=i%2?r*.42:r;let xx=Math.cos(aa)*rr,yy=Math.sin(aa)*rr;i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.closePath()}
      else if(shapeMode===3){X.moveTo(-r,0);X.bezierCurveTo(-r*.2,-r,r*.65,-r*.7,r,0);X.bezierCurveTo(r*.4,r*.8,-r*.45,r*.85,-r,0)}
      else {X.moveTo(0,-r);for(let i=1;i<=8;i++){let aa=-Math.PI/2+i*Math.PI/4,rr=r*(.55+.55*Math.sin(t*.9+f+i*1.7));X.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}X.closePath()}
      X.stroke();
      X.restore();
      // glitter: sparse, bright, twinkling particles
      const g=.5+.5*Math.sin(x*.17+y*.11+t*4+seed*7);
      if(g>.91 && q>.32){
        const sz=.7+3.2*(g-.91)/.09;
        X.save();X.translate(z.x,z.y);X.rotate(t*1.5+f);
        X.strokeStyle=col(hue+70,.55+.4*g,72+20*g);X.lineWidth=.7;
        X.beginPath();X.moveTo(-sz*2,0);X.lineTo(sz*2,0);X.moveTo(0,-sz*2);X.lineTo(0,sz*2);X.stroke();
        if(g>.97){X.fillStyle=col(hue+100,.45,80);X.beginPath();X.arc(0,0,sz*.45,0,Math.PI*2);X.fill()}
        X.restore();
      }
    }
  }
  X.restore()
}
function drawGlitter(v,dt){
  // Glitter exists ONLY as a response to touch: bright, moving, fading particles
  if(!glitters.length)return;
  X.save();X.globalCompositeOperation="screen";
  for(let i=glitters.length-1;i>=0;i--){
    const g=glitters[i];
    g.age+=dt;
    if(g.age>=g.life){glitters.splice(i,1);continue}
    const q=1-g.age/g.life;
    g.x+=g.vx*(1+.6*q);g.y+=g.vy*(1+.6*q);
    g.vx*=.972;g.vy*=.972;
    g.vy+=.012*(1-q);
    g.rot+=g.spin*dt;
    const tw=.58+.42*Math.sin(t*12+g.phase+g.age*9);
    const alpha=Math.pow(q,.55)*(.48+.52*tw);
    const size=g.size*(.7+.7*tw)*(1+.12*q);

    X.save();X.translate(g.x,g.y);X.rotate(g.rot);
    // luminous moving halo
    X.fillStyle=col(g.hue,alpha*.20,82);
    X.filter="blur("+Math.max(2,size*2.8)+"px)";
    X.beginPath();X.arc(0,0,size*2.7,0,Math.PI*2);X.fill();
    X.filter="none";

    // sparkling cross, stronger and more varied than before
    const arm=size*(1.3+tw*2.4);
    X.strokeStyle=col(g.hue,alpha,90);X.lineWidth=.65+tw*.9;
    X.beginPath();
    X.moveTo(-arm,0);X.lineTo(arm,0);
    X.moveTo(0,-arm);X.lineTo(0,arm);
    if(tw>.73){
      X.moveTo(-arm*.72,-arm*.72);X.lineTo(arm*.72,arm*.72);
      X.moveTo(arm*.72,-arm*.72);X.lineTo(-arm*.72,arm*.72);
    }
    X.stroke();

    X.fillStyle=col(g.hue,alpha,96);
    X.beginPath();X.arc(0,0,Math.max(.45,size*.48),0,Math.PI*2);X.fill();
    X.restore();
  }
  X.restore()
}
function drawBloom(v){let R=Math.min(W,H)*.34,N=Math.max(8,Math.floor(v.n/2));X.save();X.translate(W/2,H/2);X.globalCompositeOperation="screen";for(let i=0;i<N;i++){let a=i*Math.PI*2/N+t*.06;let pulse=.72+.28*Math.sin(t*.8+i*.5);let len=R*(.75+.35*Math.sin(t*.5+i)*v.w);X.save();X.rotate(a);let g=X.createRadialGradient(len*.35,0,2,len*.35,0,len*.75);g.addColorStop(0,col(v.h+i*7,.55,72));g.addColorStop(.55,col(v.h+80+i*5,.16,58));g.addColorStop(1,"transparent");X.fillStyle=g;X.beginPath();X.ellipse(len*.35,0,len*.7*pulse,R*(.14+.12*v.w),Math.sin(t+i)*.45,0,Math.PI*2);X.fill();X.restore()}let core=X.createRadialGradient(0,0,0,0,0,R*.45);core.addColorStop(0,col(v.h+40,.55,75));core.addColorStop(1,"transparent");X.fillStyle=core;X.beginPath();X.arc(0,0,R*.48,0,Math.PI*2);X.fill();X.restore()}
function drawFlow(v){let R=Math.min(W,H)*.48;X.save();X.translate(W/2,H/2);for(let i=0;i<v.n*3;i++){let a=i*2.399+t*.25,r=R*Math.sqrt(i/(v.n*3)),x=Math.cos(a)*r,y=Math.sin(a)*r;X.fillStyle=col(v.h+i*4,.28);X.beginPath();X.arc(x,y,Math.max(.5,1+2*Math.sin(t+i)),0,Math.PI*2);X.fill()}X.restore()}
function drawFlower(v){X.save();X.translate(W/2,H/2);let N=Math.max(6,v.n);for(let i=0;i<N;i++){X.save();X.rotate(i*Math.PI*2/N+t*.08);X.strokeStyle=col(v.h+i*360/N,.38);X.lineWidth=2;X.beginPath();X.ellipse(Math.min(W,H)*.25,0,Math.min(W,H)*(.07+v.w*.06),Math.min(W,H)*.035,Math.sin(t+i),0,Math.PI*2);X.stroke();X.restore()}X.restore()}
function drawWave(v){for(let k=0;k<v.n;k++){let y=H*(k+.5)/v.n;X.strokeStyle=col(v.h+k*8,.32);X.lineWidth=1.5;X.beginPath();for(let x=0;x<=W;x+=7){let yy=y+Math.sin(x*.02+t*1.5+k)*H*(.02+v.w*.06)+Math.cos(x*.008-t+k)*12;let z=disturb(x,yy);x?X.lineTo(z.x,z.y):X.moveTo(z.x,z.y)}X.stroke()}}
function drawSpiral(v){X.save();X.translate(W/2,H/2);let N=v.n*5,R=Math.min(W,H)*.45;for(let i=0;i<N;i++){let q=i/N,a=q*Math.PI*12+t*.35,r=q*R,x=Math.cos(a)*r,y=Math.sin(a)*r;X.fillStyle=col(v.h+i*3,.45);X.beginPath();X.arc(x,y,1+4*q,0,Math.PI*2);X.fill()}X.restore()}
function drawGrid(v){let s=Math.max(14,Math.min(W,H)/Math.max(5,v.n/2));for(let y=0;y<H+s;y+=s)for(let x=0;x<W+s;x+=s){let q=.5+.5*Math.sin(x*.03+y*.02+t);let z=disturb(x+s/2,y+s/2);X.strokeStyle=col(v.h+q*120,.28);X.beginPath();X.arc(z.x,z.y,s*(.1+.25*q)*(1+.18*Math.sin((z.x+z.y)*.03+t)),0,Math.PI*2);X.stroke()}}
function drawStars(v){let N=v.n*7;for(let i=0;i<N;i++){let a=i*2.399+t*.08*(i%3+1),r=(i%v.n+1)/v.n*Math.min(W,H)*.62,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a*1.7+t*.2)*r*.75;X.fillStyle=col(v.h+i*5,.42);X.beginPath();X.arc(x,y,1+3*(.5+.5*Math.sin(t*2+i)),0,Math.PI*2);X.fill()}}
function drawOrbit(v){X.save();X.translate(W/2,H/2);for(let i=0;i<Math.max(5,v.n/2);i++){let r=Math.min(W,H)*(.08+i/v.n*.7);X.strokeStyle=col(v.h+i*18,.28);X.lineWidth=2;X.beginPath();X.ellipse(0,0,r,r*(.45+.25*Math.sin(t+i)),t*.15+i,0,Math.PI*2);X.stroke()}X.restore()}
function drawRibbon(v){X.save();X.translate(W/2,H/2);for(let k=0;k<7;k++){X.strokeStyle=col(v.h+k*35,.32);X.lineWidth=2+k;X.beginPath();for(let i=0;i<150;i++){let q=i/149*Math.PI*6,a=q+t*.2+k,r=Math.min(W,H)*.45*i/149,x=Math.cos(a)*r+Math.sin(q*3+t+k)*40,y=Math.sin(a)*r+Math.cos(q*4-t)*40;i?X.lineTo(x,y):X.moveTo(x,y)}X.stroke()}X.restore()}
function drawCell(v){let N=v.n*2;for(let i=0;i<N;i++){let a=i*2.399+t*.1,r=Math.sqrt(i/N)*Math.min(W,H)*.65,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;X.fillStyle=col(v.h+i*7,.18);X.beginPath();X.arc(x,y,6+15*(.5+.5*Math.sin(t+i)),0,Math.PI*2);X.fill()}}
function art(){let v=vals();if(mode==="field"){drawField(v)}else if(mode==="bloom")drawBloom(v);else if(mode==="flow")drawFlow(v);else if(mode==="flower")drawFlower(v);else if(mode==="wave")drawWave(v);else if(mode==="spiral")drawSpiral(v);else if(mode==="grid")drawGrid(v);else if(mode==="stars")drawStars(v);else if(mode==="orbit")drawOrbit(v);else if(mode==="cell")drawCell(v);else{drawFlow(v);drawStars(v);drawWave(v)}}
let frameDt=.016;
function step(dt){
  frameDt=dt;
  if(run)t+=dt*(speed/70)*(1+energy*.28*Math.sin(t*.11));
  bg();art();drawGlitter(vals(),dt);
  for(let p of pulses){p.r+=2.5;p.a-=.025;X.strokeStyle=col(vals().h+p.r,.45*p.a);X.lineWidth=2;X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.stroke()}
  pulses=pulses.filter(p=>p.a>0);
  touches.forEach(p=>{p.a*=.985;p.r+=1.8});
  touches=touches.filter(p=>p.a>.035);
}
function frame(ms){
  if(window.APKit && APKit.isExporting()){ last=0; requestAnimationFrame(frame); return; }
  if(!last)last=ms;
  const dt=Math.min(.05,(ms-last)/1000);
  last=ms;
  step(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
C.addEventListener("pointerdown",e=>{let r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;pulses.push({x,y,r:4,a:1});addTouch(x,y);burstGlitter(x,y,true)});
C.addEventListener("pointermove",e=>{if(e.buttons){let r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;addTouch(x,y);burstGlitter(x,y,false)}});
function randomize(){
  h=Math.floor(Math.random()*360);
  speed=Math.floor(28+Math.random()*120);
  n=Math.floor(16+Math.random()*55);
  w=.28+Math.random()*.70;
  energy=.25+Math.random()*.85;
  seed=Math.random()*1000;
  touches=[];
}

APKit.init({
  canvas:C,
  gifName:'ink-bloom-loop',
  clockFormat:'spec',
  dock:true, autoHide:true, fullscreenButton:false,
  loopFrame:function(){ step(0.016); },
  buttons:[
    {label:'\u2726', name:'mutate', onClick:randomize}
  ]
});
</script></body></html>
