<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ENCIRCLE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="ap-kit.js"></script>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  ENCIRCLE — Claude(クロちゃん)作

  世界のルール:
  この球は薄い膜でできている。触れた場所には「法(law)」が刻まれる——
  それは点ではなく、球全体を一周する大円の帯。刻まれた法は消えない。
  法が増えるほど膜は厚く重なり、干渉色が変わり、球の見え方そのものが
  作り替えられていく。長押しすると、そこを通る法がねじれて波打ちはじめる。
*/
const c = document.getElementById('c');
const gl = c.getContext('webgl', {antialias:true, alpha:false, preserveDrawingBuffer:true}) ||
           c.getContext('experimental-webgl', {antialias:true, alpha:false, preserveDrawingBuffer:true});

const VERT = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';

const FRAG = [
'precision highp float;',
'uniform vec2 res;',
'uniform float ay,ax,phaseT;',
'uniform vec4 lawA[12];',
'uniform vec4 lawB[12];',
'uniform int lawCount;',
'uniform float baseFilm;',
'uniform vec3 ramp[6];',

'vec3 rotX(vec3 v,float a){float s=sin(a),co=cos(a);return vec3(v.x,co*v.y-s*v.z,s*v.y+co*v.z);}',
'vec3 rotY(vec3 v,float a){float s=sin(a),co=cos(a);return vec3(co*v.x+s*v.z,v.y,-s*v.x+co*v.z);}',

// 6色の止まり木をなめらかに循環補間する
'vec3 grad(float t){',
'  t=fract(t)*6.0;',
'  float fi=floor(t);',
'  float f=t-fi;',
'  f=f*f*(3.0-2.0*f);',
'  vec3 c0=ramp[0],c1=ramp[1];',
'  for(int i=0;i<6;i++){',
'    if(float(i)==fi) c0=ramp[i];',
'    if(float(i)==mod(fi+1.0,6.0)) c1=ramp[i];',
'  }',
'  return mix(c0,c1,f);',
'}',

'float hash2(vec2 p){float v=sin(p.x*127.1+p.y*311.7)*43758.5453;return fract(v);}',

'void main(){',
'  vec2 uv=(gl_FragCoord.xy-0.5*res)/min(res.x,res.y)*2.0;',
'  float r2=dot(uv,uv);',
'  float rr=sqrt(r2);',
'  float R=0.80;',

'  if(r2>R*R){',
// 背景: 球の色系で中心から外へ滑らかに変わるグラデ + 漏れ光のハロー + 微粒子
'    float halo=exp(-max(rr-R,0.0)/0.13);',
'    float rad=pow(clamp(1.0-(rr-R)/1.4,0.0,1.0),2.0);',
'    vec3 bg=mix(ramp[0],ramp[2],rad)*0.20;',
'    bg+=grad(baseFilm*0.20+0.3)*(halo*0.34);',
'    bg+=vec3(hash2(gl_FragCoord.xy)-0.5)*0.016;',
'    gl_FragColor=vec4(max(bg,0.0),1.0);',
'    return;',
'  }',

'  float z=sqrt(max(R*R-r2,0.0));',
'  vec3 nView=normalize(vec3(uv,z));',
'  vec3 nWorld=rotX(rotY(nView,-ay),-ax);',
'  float ct=max(nView.z,0.02);',
'  float ps=clamp(1.0/ct,1.0,2.4);',

'  float glow=0.0;',
'  float flow=0.0;',
'  for(int i=0;i<12;i++){',
'    if(i>=lawCount) break;',
'    vec3 axis=lawA[i].xyz;',
'    float wgt=lawA[i].w;',
'    float width=lawB[i].x;',
'    float tw=lawB[i].y;',
'    float tf=lawB[i].z;',
'    float ph=lawB[i].w;',
'    float dd=dot(nWorld,axis);',
'    vec3 up=abs(axis.y)<0.98?vec3(0.0,1.0,0.0):vec3(1.0,0.0,0.0);',
'    vec3 e1=normalize(cross(up,axis));',
'    vec3 e2=cross(axis,e1);',
'    float th=atan(dot(nWorld,e2),dot(nWorld,e1));',
'    dd-=tw*sin(tf*th+ph+phaseT);',
'    float b=exp(-(dd*dd)/(width*width));',
'    glow+=b*wgt;',
'    flow+=b*(0.5+0.5*sin(th));',
'  }',

'  float g=clamp(glow,0.0,3.0);',
'  float gn=clamp(g,0.0,1.0);',
// 色座標をゆっくり動かす = 虹が何周もせず、帯に沿って色が流れる
'  float t=baseFilm*0.20+(ps-1.0)*0.16+flow*0.20+phaseT*0.02;',
'  vec3 irid=grad(t);',
'  float fres=pow(1.0-ct,3.0);',
'  float rim=smoothstep(R*R*0.93,R*R*0.999,r2);',
'  float lum=g/(1.0+g*0.30);',
'  float edge=clamp(4.0*gn*(1.0-gn),0.0,1.0);',

'  vec3 col=irid*lum;',
'  col+=irid*(edge*0.35);',
'  col+=vec3(1.0)*(pow(lum/2.6,7.0)*0.50);',
'  col+=irid*(rim*(0.30+0.80*fres));',
'  col+=irid*(fres*0.18);',
'  col+=grad(t+0.5)*0.055;',

'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const U={
  res:gl.getUniformLocation(prog,'res'),
  ay:gl.getUniformLocation(prog,'ay'),
  ax:gl.getUniformLocation(prog,'ax'),
  phaseT:gl.getUniformLocation(prog,'phaseT'),
  lawA:gl.getUniformLocation(prog,'lawA'),
  lawB:gl.getUniformLocation(prog,'lawB'),
  lawCount:gl.getUniformLocation(prog,'lawCount'),
  baseFilm:gl.getUniformLocation(prog,'baseFilm'),
  ramp:gl.getUniformLocation(prog,'ramp')
};

let W,H,d=1;
function R(){
  d=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  c.width=Math.round(W*d);c.height=Math.round(H*d);
  gl.viewport(0,0,c.width,c.height);
}
addEventListener('resize',R);R();

const PALETTES=[
  // DEEP SEA — 深い藍からシアン、白、藤、菫へ
  [0.02,0.04,0.14, 0.06,0.28,0.62, 0.20,0.72,0.86, 0.75,0.95,0.98, 0.92,0.72,0.92, 0.45,0.22,0.68],
  // AURORA — 夜の緑からミント、生成り、珊瑚、紫へ
  [0.03,0.05,0.12, 0.10,0.42,0.48, 0.35,0.88,0.72, 0.92,0.97,0.86, 0.96,0.62,0.55, 0.52,0.20,0.52],
  // NEBULA — 紫紺から菫、薔薇、桃、金へ
  [0.05,0.02,0.12, 0.32,0.10,0.48, 0.78,0.28,0.62, 0.99,0.72,0.66, 0.98,0.90,0.62, 0.28,0.14,0.42]
];
let palIndex=0;

const MAX=12;
let laws=[];
let baseFilm=1.0;
let userAy=0,userAx=0;
let autoYaw=0;

function rotXjs(v,a){const s=Math.sin(a),co=Math.cos(a);return [v[0],co*v[1]-s*v[2],s*v[1]+co*v[2]];}
function rotYjs(v,a){const s=Math.sin(a),co=Math.cos(a);return [co*v[0]+s*v[2],v[1],-s*v[0]+co*v[2]];}
function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}
function cross3(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}

function screenToNormal(cx,cy){
  const min=Math.min(c.width,c.height);
  const sx=(cx*d-0.5*c.width)/min*2;
  const sy=-(cy*d-0.5*c.height)/min*2;
  const RR=0.80;
  const r2=sx*sx+sy*sy;
  if(r2>RR*RR) return null;
  const z=Math.sqrt(Math.max(RR*RR-r2,0));
  return norm3([sx,sy,z]);
}

function makeLaw(p, strong){
  const up=Math.abs(p[1])<0.95?[0,1,0]:[1,0,0];
  const t1=norm3(cross3(up,p));
  const t2=cross3(p,t1);
  const a=Math.random()*Math.PI*2;
  const axis=norm3([
    t1[0]*Math.cos(a)+t2[0]*Math.sin(a),
    t1[1]*Math.cos(a)+t2[1]*Math.sin(a),
    t1[2]*Math.cos(a)+t2[2]*Math.sin(a)
  ]);
  return {
    axis:axis,
    weight:strong?(1.0+Math.random()*0.35):(0.72+Math.random()*0.25),
    width:0.070+Math.random()*0.075,
    twist:strong?(0.10+Math.random()*0.16):(0.02+Math.random()*0.07),
    freq:[1,2,2,3,3,4][Math.floor(Math.random()*6)],
    phase:Math.random()*Math.PI*2
  };
}

function addLaw(l){
  laws.push(l);
  if(laws.length>MAX) laws.shift();
}

function genesis(){
  laws=[];
  baseFilm=0.6+Math.random()*0.9;
  for(let i=0;i<3;i++){
    const lon=Math.random()*Math.PI*2, lat=Math.acos(2*Math.random()-1);
    addLaw(makeLaw([Math.sin(lat)*Math.cos(lon),Math.cos(lat),Math.sin(lat)*Math.sin(lon)],false));
  }
}
genesis();

let downX=0,downY=0,moved=false,dragging=false,lastX=0,lastY=0,holdTimer=null;
const HOLD_MS=380, MOVE_THRESH=9;

function worldNormalAt(cx,cy){
  const nView=screenToNormal(cx,cy);
  if(!nView) return null;
  return norm3(rotXjs(rotYjs(nView,-(userAy+autoYaw)),-userAx));
}

c.addEventListener('pointerdown',function(e){
  if(window.APKit && APKit.isUI(e.clientX,e.clientY)) return;
  downX=e.clientX;downY=e.clientY;
  lastX=e.clientX;lastY=e.clientY;
  moved=false;dragging=true;
  c.setPointerCapture(e.pointerId);
  holdTimer=setTimeout(function(){
    if(moved) return;
    const nW=worldNormalAt(downX,downY);
    if(!nW) return;
    let best=null,bestD=0.30;
    for(let i=0;i<laws.length;i++){
      const dd=Math.abs(laws[i].axis[0]*nW[0]+laws[i].axis[1]*nW[1]+laws[i].axis[2]*nW[2]);
      if(dd<bestD){bestD=dd;best=laws[i];}
    }
    if(best){
      best.twist=Math.min(0.42,best.twist+0.13);
      best.weight=Math.min(1.9,best.weight+0.35);
      best.width=Math.min(0.20,best.width+0.025);
    }else{
      addLaw(makeLaw(nW,true));
    }
    baseFilm+=0.35;
    moved=true;
  },HOLD_MS);
});

c.addEventListener('pointermove',function(e){
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(!moved && Math.hypot(e.clientX-downX,e.clientY-downY)>MOVE_THRESH){
    moved=true;
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  }
  if(moved){
    userAy+=dx*0.006;
    userAx=Math.max(-1.35,Math.min(1.35,userAx+dy*0.006));
  }
  lastX=e.clientX;lastY=e.clientY;
});

c.addEventListener('pointerup',function(e){
  if(!dragging) return;
  dragging=false;
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
  if(moved) return;
  if(window.APKit && APKit.isUI(e.clientX,e.clientY)) return;
  const nW=worldNormalAt(e.clientX,e.clientY);
  if(!nW) return;
  addLaw(makeLaw(nW,false));
  baseFilm+=0.18;
});

c.addEventListener('pointercancel',function(){
  dragging=false;
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
});

const A=new Float32Array(MAX*4), B=new Float32Array(MAX*4);
function upload(){
  for(let i=0;i<laws.length;i++){
    const L=laws[i];
    A[i*4]=L.axis[0];A[i*4+1]=L.axis[1];A[i*4+2]=L.axis[2];A[i*4+3]=L.weight;
    B[i*4]=L.width;B[i*4+1]=L.twist;B[i*4+2]=L.freq;B[i*4+3]=L.phase;
  }
  gl.uniform4fv(U.lawA,A);
  gl.uniform4fv(U.lawB,B);
  gl.uniform1i(U.lawCount,laws.length);
  gl.uniform1f(U.baseFilm,baseFilm);
  gl.uniform3fv(U.ramp,PALETTES[palIndex]);
}

function render(ayVal,axVal,phaseVal){
  gl.uniform2f(U.res,c.width,c.height);
  gl.uniform1f(U.ay,ayVal);
  gl.uniform1f(U.ax,axVal);
  gl.uniform1f(U.phaseT,phaseVal);
  upload();
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function loopFrame(phase){
  autoYaw=phase;
  render(userAy+phase, userAx, phase);
}

function anim(ms){
  const t=ms*0.001;
  autoYaw=t*0.16;
  render(userAy+autoYaw, userAx, t*0.55);
  requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

APKit.init({
  canvas:c,
  gifName:'encircle-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:loopFrame,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      palIndex=(palIndex+1)%PALETTES.length;
      baseFilm=0.6+Math.random()*1.4;
      for(let i=0;i<laws.length;i++){
        const L=laws[i];
        L.width=0.065+Math.random()*0.085;
        L.twist=0.02+Math.random()*0.22;
        L.freq=[1,2,2,3,3,4][Math.floor(Math.random()*6)];
        L.phase=Math.random()*Math.PI*2;
      }
    }},
    {label:'↻',name:'reset',onClick:function(){ genesis(); userAy=0; userAx=0; }}
  ]
});
</script>
</body></html>
