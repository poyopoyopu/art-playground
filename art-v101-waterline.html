<!DOCTYPE html>
<!-- WATERLINE — クロちゃん(Claude)作。HAIRLINEの「割れるガラス」を土台に、おっちゃんの「割れたら液体がもれ出す表現」を別作品として作った。
     ヒビの描き方(ギザギザの線・走り続けるヒビ・入れ子の破片)はHAIRLINEから持ってきている。ap-kit.js統合: クロちゃん
     v2: おっちゃん「リアルさが足りない」(噴き出す水・ガラスを伝う水・水槽の中)で作り直し。噴き出しはつながった水の柱にし、先は白く泡立ってしぶきに砕ける。
     ガラスを伝う水はガラスのムラで止まったり曲がったりし、通った跡に濡れた跡と小さな水滴が残る。水槽の中は岩組み・砂・海藻・泡・魚のいる大水槽に。 -->
<!-- 世界のルール: この大きな水槽のガラスの向こうは、液体でいっぱい。割れ目から漏れる勢いは「その上にある液の重さ」だけで決まる
     (トリチェリの法則。深い穴ほど強く噴き、水面より上の穴からは一滴も出ない)。漏れるほど水位は下がり、噴き出しは弱まっていく。
     そして水圧はヒビを育てる。水面より下のヒビだけが勝手にのび、ガラスにひずみがたまる。限界を超えると、ガラスごと決壊する。
     ・タップ … 叩いて割る。水面より下なら、そこから漏れ出す(深いほど強く、手前へ噴き出す)。魚は驚いて散る。
     ・押さえる … 指で穴をふさぐ。漏れは止まるが、そのぶん水圧がたまり、ヒビの育ちが早くなる。離すと一気に噴く。
     ・なぞる … ガラスを伝う液を指でぬぐう。
     ・放っておく … 水面より下のヒビからは、液がにじみ出て玉になり、大きくなると流れ落ちる。水位が下がると岩が水から出て、魚は残った水に追い込まれる。
     ・✦ … 液を替える: 水(魚のいる大水槽) → 蜂蜜 → 水銀 → 蛍光液(URLの#water #honey #mercury #neonで固定して開ける)。流れ方も変わる。
     ・↻ … 新しいガラスにして、液を満たし直す。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>WATERLINE — 深い穴ほど、強く噴き出す水槽</title>
<script src="ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #070a0d; overflow: hidden; overscroll-behavior: none; }
  body {
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 12px; line-height: 1.9; letter-spacing: .07em;
    color: #f2f4f8; opacity: 0; transition: opacity 1.6s ease;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .9);
  }
  #hint.on { opacity: .85; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ddd; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ガラスの向こうは、水でいっぱい。深い穴ほど強く噴く<br>タップ ＝ 叩く　押さえる ＝ ふさぐ　なぞる ＝ ぬぐう</div>
<div id="nogl">WebGLが使えない環境です</div>
<script>
(function () {
  'use strict';

  var cvs = document.getElementById('c');
  var hint = document.getElementById('hint');
  var gl = cvs.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('nogl').style.display = 'flex'; return; }

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  function mkProg(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  }
  function unis(p, names) { var o = {}; names.forEach(function (k) { o[k] = gl.getUniformLocation(p, k); }); return o; }

  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  var NOISE = [
    'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}',
    'float fbm(vec2 p){float v=0.0,a=0.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);',
    '  for(int i=0;i<4;i++){v+=a*noise(p);p=m*p;a*=0.5;}return v;}'
  ].join('\n');

  /* ---------- 1) 水槽の中(毎フレーム、小さめの解像度で描く) ----------
     水: 岩組み・砂・海藻・エアストーンの泡のある大水槽(魚は別に描いて重ねる)。水位が下がると、岩は水の上に出て濡れた色になる。
     ほかの液: 蜂蜜(うしろから照らされた琥珀色と止まった泡) / 水銀(部屋が映る鏡) / 蛍光液(自分で光る)。
     穴の真上まで水位が下がると、水面に渦のくぼみ。穴のまわりは吸い込まれてねじれる。 */
  var SFS = [
    'precision highp float;',
    'uniform vec2 R;uniform float t;uniform float mode;uniform float lv;uniform float lv0;uniform float slosh;uniform float fill;',
    'uniform vec4 Wd[8];',
    NOISE,
    'float caus(vec2 uv,float sp){',
    '  vec2 p=mod(uv*6.2831,6.2831)-250.0;vec2 i=p;float c=1.0;float inten=0.005;',
    '  for(int n=0;n<4;n++){float tt=t*sp*(1.0-(3.5/float(n+1)));',
    '    i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));',
    '    c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten),p.y/(cos(i.y+tt)/inten)));}',
    '  c/=4.0;c=1.17-pow(c,1.4);return pow(abs(c),8.0);}',
    'vec3 wall(vec2 uv,float asp){',
    '  vec3 base=mode<0.5?vec3(0.03,0.04,0.045):mode<1.5?vec3(0.05,0.035,0.02):mode<2.5?vec3(0.04,0.04,0.045):vec3(0.012,0.016,0.014);',
    '  float lamp=exp(-pow((uv.x-0.5)*asp*1.6,2.0)-uv.y*2.2);',
    '  vec3 c=base*(0.6+0.8*fbm(uv*vec2(3.0,8.0)))+vec3(1.0,0.94,0.82)*lamp*(mode>2.5?0.05:0.14);',
    '  vec2 g=fract(vec2(uv.x*asp,uv.y)*vec2(7.0,7.0));',
    '  float j=max(smoothstep(0.03,0.0,g.x),smoothstep(0.03,0.0,g.y));',
    '  c*=1.0-0.35*j;',
    '  return c;',
    '}',
    'vec3 room(vec2 q){',
    '  vec3 c=mix(vec3(0.62,0.64,0.68),vec3(0.07,0.07,0.08),smoothstep(-0.2,0.7,q.y));',
    '  c+=vec3(1.0,0.96,0.88)*exp(-pow((q.x-0.5)*3.0,2.0)-pow((q.y+0.05)*5.0,2.0))*0.9;',
    '  float win=smoothstep(0.02,0.0,abs(q.x-0.18)-0.08)*smoothstep(0.02,0.0,abs(q.y-0.32)-0.14);',
    '  c=mix(c,vec3(0.75,0.85,0.95),win*0.6);',
    '  c*=0.85+0.3*noise(q*vec2(2.0,30.0));',
    '  return c;',
    '}',
    /* 岩(だ円をノイズでくずした形)。上を向いた面ほど明るく、藻がつく */
    'float rock(vec2 uv,float asp,vec4 b,float sd,out vec3 rc,out float up){',
    '  vec2 d=(uv-b.xy)/b.zw;float r=length(d);',
    '  rc=vec3(0.0);up=0.0;',
    '  if(r>1.35)return 0.0;',
    '  vec2 q=vec2(uv.x*asp,uv.y);',
    '  float e=r-1.0+0.24*fbm(q*5.0+sd)+0.08*fbm(q*17.0+sd*1.7)-0.1;',
    '  if(e>0.006)return 0.0;',
    '  vec2 n2=d/max(r,0.001);',
    '  float b1=fbm(q*24.0+sd),b2=fbm(q*24.0+sd+5.3);',
    '  vec3 N=normalize(vec3(n2*smoothstep(-0.4,0.0,e)*1.3+vec2(b1-0.5,b2-0.5)*1.1,0.75));',
    '  vec3 alb=mix(vec3(0.46,0.43,0.38),vec3(0.25,0.26,0.24),fbm(q*9.0+sd));',
    '  alb=mix(alb,vec3(0.2,0.32,0.14),smoothstep(0.15,0.75,-N.y)*0.7*fbm(q*13.0+sd*3.0));',
    '  vec3 Ld=normalize(vec3(0.25,-1.0,0.45));',
    '  float dif=max(dot(N,Ld),0.0);',
    '  float ao=0.55+0.45*smoothstep(0.0,-0.18,e);',
    '  ao*=0.7+0.6*fbm(q*34.0+sd*2.0);',
    '  rc=alb*(0.14+1.0*dif)*ao;',
    '  up=max(-N.y,0.0);',
    '  return smoothstep(0.006,-0.006,e);',
    '}',
    'void main(){',
    '  vec2 uv=vec2(gl_FragCoord.x/R.x,1.0-gl_FragCoord.y/R.y);',
    '  float asp=R.x/R.y;',
    '  float s=lv+slosh*(0.0045*sin(uv.x*9.0+t*2.1)+0.003*sin(uv.x*23.0-t*3.3)+0.0018*sin(uv.x*41.0+t*5.0));',
    '  vec2 sw=vec2(0.0);',
    '  for(int i=0;i<8;i++){vec4 w=Wd[i];if(w.z<=0.0)continue;',
    '    float dx=(uv.x-w.x)*asp;float hd=w.y-lv;',
    '    float near=smoothstep(0.18,0.0,hd)*step(0.0,hd);',
    '    s+=w.z*near*0.045*exp(-dx*dx*500.0);',
    '    vec2 d=vec2(dx,uv.y-w.y);float r=length(d)+0.02;',
    '    float a=w.z*0.012/(r*r+0.004)*step(0.0,hd);',
    '    sw+=vec2(-d.y,d.x)*a*0.08+(-d/r)*w.z*0.004/(r+0.05);',
    '  }',
    '  float below=uv.y-s;',
    '  bool under=below>=0.0;',
    '  vec3 col;',
    '  vec3 air=wall(uv,asp);',
    '  float wet=step(lv0,uv.y)*smoothstep(0.0,0.03,-below)*(mode>1.5&&mode<2.5?0.0:1.0);',
    '  float streak=pow(noise(vec2(uv.x*asp*70.0,uv.y*2.0+floor(uv.x*asp*70.0)*0.37)),6.0);',
    '  vec2 dg=fract(vec2(uv.x*asp,uv.y)*38.0)-0.5;vec2 di=floor(vec2(uv.x*asp,uv.y)*38.0);',
    '  float dot1=smoothstep(0.18,0.1,length(dg-0.25*(vec2(hash(di),hash(di+3.0))-0.5)))*step(0.72,hash(di+7.0));',
    '  vec3 tint=mode<0.5?vec3(0.6,0.85,0.95):mode<1.5?vec3(1.0,0.6,0.15):vec3(0.4,1.0,0.25);',
    '  air+=tint*(streak*0.05+dot1*0.07)*wet*(mode>2.5?2.0:1.0);',
    '  vec2 p=vec2(uv.x*asp,uv.y)+sw;',
    '  float dep=max(below,0.0);',
    '  if(mode<0.5){',
    /* ---- 水: 大水槽 ---- */
    '    vec3 wc=mix(vec3(0.06,0.36,0.44),vec3(0.008,0.07,0.12),smoothstep(0.0,1.0,uv.y));',
    '    wc*=0.8+0.25*exp(-dep*2.0);',
    '    wc+=vec3(0.03,0.08,0.09)*fbm(p*1.5+vec2(t*0.02,0.0));',
    '    col=under?wc:air;',
    /* 奥の岩壁(水にかすむ) */
    '    float ridge=0.6+0.1*fbm(vec2(uv.x*asp*2.2,3.0))+0.05*sin(uv.x*asp*5.0);',
    '    if(uv.y>ridge){vec3 fr=vec3(0.12,0.13,0.13)*(0.5+0.8*fbm(p*7.0));col=under?mix(fr,wc,0.8):fr*0.35;}',
    '    vec3 rc;float up;float cv;',
    /* 遠い岩 */
    '    cv=rock(uv,asp,vec4(0.55,0.93,0.26,0.11),11.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc*0.9+caus(p*1.4,0.4)*up*0.25,wc,0.6):rc*0.35;col=mix(col,c2,cv);}',
    '    cv=rock(uv,asp,vec4(0.2,0.9,0.22,0.12),23.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc*0.9+caus(p*1.4,0.4)*up*0.25,wc,0.6):rc*0.35;col=mix(col,c2,cv);}',
    /* 砂 */
    '    float sy=0.935+0.012*sin(uv.x*asp*9.0)+0.016*fbm(vec2(uv.x*asp*4.0,1.0));',
    '    if(uv.y>sy){',
    '      vec2 sq=vec2(uv.x*asp,uv.y);',
    '      vec3 sc=vec3(0.6,0.55,0.42)*(0.7+0.4*fbm(sq*45.0));',
    '      sc*=0.85+0.15*sin(sq.x*140.0+fbm(sq*9.0)*7.0);',
    '      sc*=0.62;',
    '      if(under){sc+=vec3(0.75,0.95,1.0)*caus(sq*2.2,0.5)*0.45;sc=mix(sc,wc,0.28);}else sc*=0.5;',
    '      col=mix(col,sc,smoothstep(sy,sy+0.004,uv.y));',
    '    }',
    /* 海藻: 砂から生え、ゆらゆら揺れる。水から出た部分は見えない(倒れて沈む) */
    '    for(int i=0;i<7;i++){',
    '      float fi=float(i);',
    '      float bx=0.08+0.14*fi+0.05*hash(vec2(fi,1.0));',
    '      float by=0.95;float hk=0.28+0.32*hash(vec2(fi,2.0));',
    '      float sk=(by-uv.y)/hk;',
    '      if(sk<0.0||sk>1.0||!under)continue;',
    '      float swy=(0.03*sin(t*0.7+fi*1.3+sk*2.5)+0.012*sin(t*1.9+fi+sk*5.0))*sk*sk;',
    '      float dx=(uv.x-bx-swy)*asp;',
    '      float hw=(0.007+0.004*sin(sk*22.0+fi*2.0))*(1.0-0.55*sk);',
    '      float kv=smoothstep(hw,hw-0.002,abs(dx));',
    '      if(kv>0.0){',
    '        vec3 kc=mix(vec3(0.16,0.22,0.07),vec3(0.42,0.5,0.14),0.5+0.5*sin(sk*40.0+fi));',
    '        kc*=0.45+0.8*exp(-dep*1.4)*(0.6+0.4*smoothstep(-hw,hw,dx));',
    '        kc+=vec3(0.5,0.6,0.15)*caus(p*1.6,0.45)*0.15;',
    '        col=mix(col,mix(kc,wc,0.3),kv*0.92);',
    '      }',
    '    }',
    /* 手前の岩組み */
    '    cv=rock(uv,asp,vec4(0.32,1.03,0.21,0.15),37.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc+vec3(0.7,0.92,1.0)*caus(p*1.6,0.45)*up*0.5,wc,0.33):rc*0.42;col=mix(col,c2,cv);}',
    '    cv=rock(uv,asp,vec4(0.73,1.02,0.18,0.12),51.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc+vec3(0.7,0.92,1.0)*caus(p*1.6,0.45)*up*0.5,wc,0.33):rc*0.42;col=mix(col,c2,cv);}',
    '    cv=rock(uv,asp,vec4(0.03,1.01,0.34,0.3),63.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc+vec3(0.7,0.92,1.0)*caus(p*1.6,0.45)*up*0.55,wc,0.2):rc*0.45;col=mix(col,c2,cv);}',
    '    cv=rock(uv,asp,vec4(0.97,0.98,0.3,0.25),77.0,rc,up);',
    '    if(cv>0.0){vec3 c2=under?mix(rc+vec3(0.7,0.92,1.0)*caus(p*1.6,0.45)*up*0.55,wc,0.2):rc*0.45;col=mix(col,c2,cv);}',
    '    if(under){',
    /* エアストーンの泡 */
    '      for(int i=0;i<16;i++){',
    '        float fi=float(i);',
    '        float ph=fract(t*0.21+fi/16.0+hash(vec2(fi,7.0))*0.04);',
    '        float y0=0.92;float yb=y0-ph*(y0-s);',
    '        if(yb<s+0.004)continue;',
    '        float xb=0.62+0.012*sin(t*2.3+fi*1.7)*ph+0.004*sin(ph*31.0+fi);',
    '        float rb=(0.0035+0.004*hash(vec2(fi,3.0)))*(0.8+0.6*ph);',
    '        vec2 bd=vec2((uv.x-xb)*asp,uv.y-yb);float dd=length(bd);',
    '        if(dd<rb){',
    '          float rim=smoothstep(rb*0.55,rb,dd);',
    '          col=mix(col,vec3(0.75,0.9,0.95),rim*0.55)+vec3(1.0)*smoothstep(rb*0.35,0.0,length(bd-vec2(-rb*0.35,-rb*0.4)))*0.6;',
    '        }',
    '      }',
    /* 水面から差し込む光の筋と、浮遊物 */
    '      float ray=pow(noise(vec2((p.x-dep*0.35)*9.0,t*0.12)),3.0)+0.5*pow(noise(vec2((p.x-dep*0.3)*21.0,t*0.2+3.0)),4.0);',
    '      col+=vec3(0.45,0.75,0.8)*ray*0.2*exp(-dep*2.2);',
    '      vec2 mp=p*60.0+vec2(t*0.5,-t*0.9);vec2 mi=floor(mp);',
    '      float mote=smoothstep(0.12,0.0,length(fract(mp)-0.5-0.3*(vec2(hash(mi),hash(mi+1.0))-0.5)))*step(0.88,hash(mi+5.0));',
    '      col+=vec3(0.6,0.85,0.85)*mote*0.2*exp(-dep*1.5);',
    '    }',
    '  }else if(!under){',
    '    col=air;',
    '  }else if(mode<1.5){',
    '    float back=0.55+0.6*exp(-pow((uv.x-0.5)*asp*1.4,2.0))*exp(-dep*0.8);',
    '    col=vec3(0.95,0.52,0.07)*back*exp(-vec3(0.2,0.9,2.6)*dep*1.2);',
    '    col+=vec3(1.0,0.75,0.3)*caus(p*0.5,0.08)*0.12*exp(-dep*2.0);',
    '    vec2 bp=p*14.0+vec2(0.0,-t*0.02);vec2 bi=floor(bp);vec2 bf=fract(bp)-0.5-0.3*(vec2(hash(bi),hash(bi+2.0))-0.5);',
    '    float br=0.05+0.12*hash(bi+4.0);float bd=length(bf);',
    '    float bub=step(0.62,hash(bi+9.0))*(smoothstep(br,br-0.02,bd)-smoothstep(br-0.02,br-0.05,bd)*0.8);',
    '    col+=vec3(1.0,0.85,0.5)*bub*0.5*exp(-dep*0.8);',
    '    col*=0.8+0.2*fbm(p*2.0+t*0.02);',
    '  }else if(mode<2.5){',
    '    vec2 q=vec2(uv.x,uv.y)+sw*3.0+vec2(0.0,0.012*sin(uv.x*20.0+t*2.0)*exp(-dep*12.0));',
    '    col=room(q)*vec3(0.82,0.84,0.87);',
    '    col*=1.0-0.25*smoothstep(0.0,0.9,dep);',
    '  }else{',
    '    float f=fbm(p*3.0+vec2(0.0,-t*0.08)+fbm(p*1.5-t*0.05));',
    '    float fil=pow(1.0-abs(f*2.0-1.0),6.0);',
    '    col=vec3(0.18,0.55,0.08)*(0.55+0.5*fbm(p*1.2+t*0.03))+vec3(0.7,1.0,0.35)*fil*0.6;',
    '    col*=0.75+0.35*exp(-dep*1.5);',
    '    col+=vec3(0.6,1.0,0.3)*caus(p*0.8,0.25)*0.18;',
    '  }',
    /* 水面: 下から見上げると銀色に光る(全反射)。そのすぐ上に明るい縁 */
    '  if(under){',
    '    float tir=smoothstep(0.03,0.0,dep);',
    '    vec3 tc=mode<0.5?vec3(0.7,0.9,0.95):mode<1.5?vec3(1.0,0.8,0.4):mode<2.5?vec3(1.0):vec3(0.75,1.0,0.5);',
    '    col=mix(col,tc*(0.45+0.4*noise(vec2(uv.x*60.0,t*2.0))),tir*0.45);',
    '  }',
    '  col+=vec3(1.0)*exp(-pow(below/0.0022,2.0))*0.5;',
    '  if(fill>0.0){',
    '    float cx=(uv.x-0.5)*asp+0.0025*sin(uv.y*30.0-t*12.0)*uv.y;',
    '    float wdt=0.014+0.012*uv.y+0.004*noise(vec2(uv.y*10.0,t*3.0));',
    '    float inS=smoothstep(wdt,wdt-0.006,abs(cx))*step(uv.y,s+0.02);',
    '    vec3 sc=mode<0.5?vec3(0.6,0.85,0.95):mode<1.5?vec3(1.0,0.62,0.12):mode<2.5?vec3(0.8,0.82,0.85):vec3(0.55,1.0,0.3);',
    '    float stk=0.7+0.5*noise(vec2(cx*90.0,uv.y*6.0-t*14.0));',
    '    col=mix(col,sc*stk,inS*fill*0.85);',
    '    float foam=smoothstep(0.12,0.0,abs(cx))*smoothstep(0.05,0.0,abs(below));',
    '    col+=vec3(1.0)*foam*fill*0.6*noise(vec2(uv.x*80.0,uv.y*80.0-t*6.0));',
    '  }',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  /* ---------- 2) 魚(水槽の中に重ねて描く。1匹ずつ四角に、形と色は描くときに作る) ---------- */
  var FVS = [
    'attribute vec4 a;attribute vec4 b;uniform vec2 V;varying vec2 vuv;varying vec4 vd;',
    'void main(){gl_Position=vec4(a.x/V.x*2.0-1.0,1.0-a.y/V.y*2.0,0.0,1.0);vuv=a.zw;vd=b;}'
  ].join('\n');
  var FFS = [
    'precision mediump float;varying vec2 vuv;varying vec4 vd;uniform vec3 fogc;',
    'float h2(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
    'void main(){',
    '  float u=vuv.x;float kind=vd.z;',
    '  float v=vuv.y+sin(vd.y-u*3.2)*0.07*(1.0-u)*0.5;',
    '  float slim=kind<0.5?0.6:(kind<1.5?0.95:1.12);',
    '  float hb=0.3*slim*sqrt(max(0.0,1.0-pow((u-0.12)/0.92,2.0)));',
    '  float aa=0.045;',
    '  float body=smoothstep(aa,0.0,abs(v)-hb);',
    '  float tu=-0.74-u;',
    '  float tail=step(0.0,tu)*smoothstep(aa,0.0,abs(v)-(0.03+tu*1.15*slim))*smoothstep(0.27,0.21,tu);',
    '  tail*=1.0-step(0.12,tu)*smoothstep(0.03,0.0,abs(v)-(tu-0.12)*0.9);',
    '  float fin=0.0;',
    '  if(kind>0.5){fin=step(v,0.0)*smoothstep(aa,0.0,-v-hb-0.09*slim*smoothstep(0.4,-0.1,u)*smoothstep(-0.55,-0.25,u))*step(-0.55,u)*step(u,0.4);}',
    '  float a=max(max(body,tail),fin);',
    '  if(a<0.01)discard;',
    '  float ty=v/(hb+0.001);',
    '  vec3 top,bel;',
    '  if(kind<0.5){top=vec3(0.1,0.17,0.26);bel=vec3(0.78,0.82,0.86);}',
    '  else if(kind<1.5){top=vec3(0.48,0.4,0.42);bel=vec3(0.86,0.82,0.8);}',
    '  else{top=vec3(0.2,0.19,0.15);bel=vec3(0.47,0.43,0.36);}',
    '  vec3 c=mix(top,bel,smoothstep(-0.6,0.55,ty));',
    '  if(kind<0.5){',
    '    c+=vec3(0.12,0.25,0.38)*smoothstep(0.14,0.0,abs(ty+0.12))*0.7;',
    '    float fl=pow(max(0.0,sin(vd.y*0.19+u*1.4)),14.0);',
    '    c+=vec3(0.9,0.95,1.0)*fl*0.7*smoothstep(-0.4,0.6,ty);',
    '    c*=1.0-0.35*step(0.5,h2(floor(vec2(u*9.0,ty*2.0+3.0))))*smoothstep(0.2,-0.6,ty)*step(-0.1,u)*step(u,0.6);',
    '  }else if(kind>1.5){',
    '    vec2 sq=vec2(u*7.0,v*9.0);vec2 si=floor(sq);vec2 sf=fract(sq)-0.5-0.3*(vec2(h2(si),h2(si+3.1))-0.5);',
    '    c*=0.82+0.3*smoothstep(0.32,0.12,length(sf))*step(0.35,h2(si+7.7));',
    '  }else{',
    '    c+=vec3(0.25,0.3,0.4)*pow(max(0.0,sin(vd.y*0.13+u)),10.0)*0.5;',
    '  }',
    '  c*=1.0-0.3*smoothstep(0.015,0.0,abs(u-0.6+0.07*ty*ty))*body;',
    '  vec2 e=vec2(u-0.79,v+0.05*slim);float ed=length(e);',
    '  c=mix(c,vec3(0.02),smoothstep(0.045,0.03,ed));',
    '  c+=vec3(0.85)*smoothstep(0.016,0.0,length(e-vec2(0.01,-0.012)));',
    '  float fa=max(tail,fin)*(1.0-body);',
    '  c=mix(c,top*0.8+vec3(0.08),fa*0.5);',
    '  a*=mix(1.0,0.7,fa);',
    '  c=mix(c,fogc,vd.x);',
    '  gl_FragColor=vec4(c,a*vd.w);',
    '}'
  ].join('\n');

  /* ---------- 3) ガラスの外を伝う液(粒を、ぼかした点として足し込む) ----------
     赤 = 液の濃さ、緑 = 白い泡(空気を含んだ水)の量 */
  var PVS = [
    'attribute vec4 a;attribute vec2 b;uniform vec2 V;uniform float ps;varying vec2 vw;',
    'void main(){gl_Position=vec4(a.x/V.x*2.0-1.0,1.0-a.y/V.y*2.0,0.0,1.0);gl_PointSize=a.z*ps;vw=vec2(a.w,b.x);}'
  ].join('\n');
  var PFS = [
    'precision mediump float;varying vec2 vw;',
    'void main(){vec2 d=gl_PointCoord-0.5;float r2=dot(d,d)*4.0;if(r2>1.0)discard;',
    '  float f=exp(-r2*3.5)*vw.x;gl_FragColor=vec4(f,f*vw.y,0.0,1.0);}'
  ].join('\n');
  /* 濡れた跡を少しずつ乾かす(色をかけ算するだけ) */
  var CFS = 'precision mediump float;uniform vec4 c;void main(){gl_FragColor=c;}';

  /* ---------- 4) 仕上げ: 液(いちばん手前)→ 濡れた跡と小さな水滴 → ガラス(ヒビで光が曲がる)→ 水槽の中 ---------- */
  var FS = [
    'precision highp float;',
    'uniform sampler2D M;uniform sampler2D BG;uniform sampler2D LQ;uniform sampler2D WT;',
    'uniform vec2 R;uniform vec2 G;uniform vec2 LR;uniform vec2 CS;uniform vec2 shake;',
    'uniform float gone;uniform float black;uniform float S;uniform float S3;uniform float D;uniform float Dc;uniform float K;uniform float sheen;',
    'uniform float mode;uniform float th;uniform float frW;uniform float frB;uniform float tm;',
    'uniform vec3 L;',
    NOISE,
    'vec3 wave(float t){',
    '  vec3 c=vec3(0.13,0.50,0.87);',
    '  vec3 d=clamp(1.0-abs(t-c)/vec3(0.36,0.33,0.36),0.0,1.0);',
    '  return d*d*(3.0-2.0*d);',
    '}',
    'float A(vec2 p){return texture2D(M,p).a;}',
    'float Q(vec2 p){return texture2D(LQ,vec2(p.x,1.0-p.y)).r;}',
    'float Wt(vec2 p){return texture2D(WT,vec2(p.x,1.0-p.y)).r;}',
    'vec3 env(vec3 n){',
    '  vec3 c=mix(vec3(0.5,0.52,0.56),vec3(0.03,0.03,0.035),smoothstep(-0.7,0.6,n.y));',
    '  c+=vec3(1.0,0.96,0.88)*pow(max(dot(n,normalize(vec3(0.15,-0.7,0.7))),0.0),30.0)*1.4;',
    '  c+=vec3(0.55,0.65,0.8)*smoothstep(0.35,0.7,-n.x)*smoothstep(0.7,0.2,abs(n.y+0.1))*0.45;',
    '  return c;',
    '}',
    'void main(){',
    '  vec2 uv=vec2(gl_FragCoord.x/R.x,1.0-gl_FragCoord.y/R.y)+shake;',
    '  vec2 lt=1.0/LR;',
    '  vec4 lq=texture2D(LQ,vec2(uv.x,1.0-uv.y));',
    '  float q0=lq.r;',
    '  float aer=clamp(lq.g/max(q0,0.02),0.0,1.0);',
    '  vec2 gq=vec2(Q(uv+vec2(lt.x,0.0))-Q(uv-vec2(lt.x,0.0)),Q(uv+vec2(0.0,lt.y))-Q(uv-vec2(0.0,lt.y)));',
    '  vec2 l4=lt*4.0;',
    '  vec2 gq4=vec2(Q(uv+vec2(l4.x,0.0))-Q(uv-vec2(l4.x,0.0)),Q(uv+vec2(0.0,l4.y))-Q(uv-vec2(0.0,l4.y)));',
    '  gq+=gq4*0.35;',
    '  float cov=smoothstep(th-0.045,th+0.035,q0);',
    '  float thick=clamp((q0-th)/(1.0-th),0.0,1.0);',
    '  vec3 N=normalize(vec3(-gq*5.0,1.0));',
    /* 水滴はレンズ: 向こうの景色が小さく逆さまに映る */
    '  vec2 ug=uv-N.xy*0.045*cov;',
    /* 濡れた跡: 薄い水の膜と、跡に残った小さな水滴 */
    '  float wt=Wt(uv);',
    '  float mdark=0.0,mhi=0.0;',
    '  if(wt>0.03){',
    '    vec2 gw=vec2(Wt(uv+vec2(lt.x,0.0))-Wt(uv-vec2(lt.x,0.0)),Wt(uv+vec2(0.0,lt.y))-Wt(uv-vec2(0.0,lt.y)));',
    '    ug+=gw*0.006;',
    '    vec2 cp=uv*CS/4.2;vec2 ci=floor(cp);vec2 cf=fract(cp)-0.5;',
    '    float r1=hash(ci),r2=hash(ci+7.1),r3=hash(ci+3.3);',
    '    vec2 jt=(vec2(r1,r2)-0.5)*0.45;',
    '    float rr=0.1+0.3*r3*r3;',
    '    vec2 dv=(cf-jt)/rr;float dd=length(dv);',
    '    if(r1*0.85+0.08<wt*1.25&&dd<1.0){',
    '      ug-=dv*0.0045;',
    '      mdark=smoothstep(0.5,1.0,dd)*0.4;',
    '      mhi=smoothstep(0.32,0.0,length(dv-vec2(-0.3,-0.38)))*0.55;',
    '    }',
    '  }',
    '  vec2 tx=1.0/G;',
    '  vec4 m=texture2D(M,ug);',
    '  vec2 T=(m.rg-0.5)/K*(1.0-gone);',
    '  float a0=m.a*(1.0-gone);',
    '  float aL=A(ug-vec2(tx.x,0.0)), aR=A(ug+vec2(tx.x,0.0)), aU=A(ug-vec2(0.0,tx.y)), aD=A(ug+vec2(0.0,tx.y));',
    '  float aLU=A(ug-tx), aRD=A(ug+tx), aRU=A(ug+vec2(tx.x,-tx.y)), aLD=A(ug+vec2(-tx.x,tx.y));',
    '  vec2 gA=vec2(aR-aL,aD-aU)*0.5*(1.0-gone);',
    '  float hxx=aR+aL-2.0*a0, hyy=aD+aU-2.0*a0, hxy=(aRD-aRU-aLD+aLU)*0.25;',
    '  float th2=0.5*atan(2.0*hxy, hxx-hyy+1e-5);',
    '  vec2 ld=vec2(cos(th2),sin(th2));',
    '  vec2 cd=normalize(L.xy+vec2(0.0001));',
    '  float glint=pow(abs(dot(vec2(-ld.y,ld.x),cd)),5.0);',
    '  vec2 su=vec2(ug.x,1.0-ug.y);',
    '  vec3 acc=vec3(0.0);vec3 cs=vec3(0.0);vec3 ws=vec3(0.0);',
    '  for(int i=0;i<12;i++){',
    '    float t=(float(i)+0.5)/12.0;',
    '    float e=(t-0.5)*2.0;',
    '    float f=1.0+D*e;',
    '    vec2 o=(T*S+gA*S3)*f;',
    '    vec3 b=texture2D(BG,su+vec2(o.x,-o.y)).rgb;',
    '    float c=texture2D(M,ug+cd*Dc*1.3*e*tx).b;',
    '    vec3 w=wave(t);',
    '    acc+=w*b;cs+=w*c;ws+=w;',
    '  }',
    '  vec3 col=acc/ws;',
    '  vec3 crack=cs/ws*(1.0-gone);',
    '  vec3 sc=texture2D(BG,su).rgb;',
    '  float lum=dot(sc,vec3(0.3,0.55,0.15));',
    '  col*=1.0-0.25*crack;',
    '  col+=crack*(0.06+1.0*glint+lum*0.9);',
    '  col+=a0*a0*(0.16*glint+lum*0.14)*vec3(0.92,0.96,1.0);',
    '  vec3 n=normalize(vec3(-T*1.5,1.0));',
    '  float tl=min(length(T)*7.0,1.0);',
    '  float nd=max(dot(n,L),0.0);',
    '  col+=pow(nd,80.0)*0.25*tl+pow(nd,8.0)*0.02*tl;',
    '  float shn=exp(-pow((dot(uv-0.5,cd)*2.0-sheen)*2.4,2.0))*0.05;',
    '  col+=shn*(1.0-gone);',
    '  float fx=min(ug.x,1.0-ug.x);',
    '  float fy=1.0-ug.y;',
    '  if(fx<frW||fy<frB){',
    '    float k=fx<frW?fx/frW:fy/frB;',
    '    vec3 st=vec3(0.075,0.08,0.09)*(0.7+0.6*smoothstep(0.0,0.6,k))*(1.0-0.4*smoothstep(0.8,1.0,k));',
    '    st+=vec3(0.22)*exp(-pow((k-0.35)*8.0,2.0))*0.45;',
    '    col=st;',
    '  }',
    /* 濡れた跡の色 */
    '  if(wt>0.0){',
    '    if(mode<0.5)col=col*(1.0-0.07*wt)+env(vec3(0.0,-0.3,1.0))*0.03*wt;',
    '    else if(mode<1.5)col*=mix(vec3(1.0),vec3(1.0,0.72,0.35),min(wt,1.0)*0.55);',
    '    else if(mode>2.5)col+=vec3(0.2,0.6,0.1)*wt*0.12;',
    '    col=col*(1.0-mdark)+vec3(1.0)*mhi;',
    '  }',
    '  if(cov>0.001){',
    '    vec3 Hh=normalize(L+vec3(0.0,0.0,1.0));',
    '    float sp=pow(max(dot(N,Hh),0.0),90.0);',
    '    float sp2=pow(max(dot(N,normalize(vec3(0.15,-0.7,0.7))),0.0),40.0);',
    '    float fr=1.0-N.z;',
    '    vec3 lc;',
    '    if(mode<0.5){',
    '      lc=col*vec3(0.9,0.97,1.0)*(1.0-0.5*smoothstep(0.05,0.45,fr))+env(N)*(0.05+smoothstep(0.1,0.6,fr)*0.3)+vec3(0.05,0.13,0.15)*(0.3+thick)+(sp+sp2)*1.1;',
    /* 空気を含んで白く泡立った水: 流れに沿った筋が流れていく */
    '      vec2 fp=uv*CS;',
    '      float pa=noise(vec2(fp.x*0.11,fp.y*0.05-tm*22.0))*0.6+noise(vec2(fp.x*0.3+tm*4.0,fp.y*0.16-tm*30.0))*0.4;',
    '      float patch=smoothstep(0.3,0.75,pa);',
    '      lc=mix(lc,vec3(0.82,0.9,0.94)*(0.75+0.35*pa)+(sp+sp2)*0.6,aer*(0.25+0.65*patch));',
    '    }else if(mode<1.5){',
    '      vec3 ab=exp(-vec3(0.12,0.6,2.2)*(0.35+thick*1.3));',
    '      lc=col*ab*1.35+vec3(0.9,0.42,0.05)*0.06*(1.0-thick)+env(N)*smoothstep(0.1,0.6,fr)*0.2+(sp+sp2)*0.9;',
    '      lc*=1.0-0.4*smoothstep(0.1,0.5,fr);',
    '    }else if(mode<2.5){',
    '      lc=env(vec3(N.xy*1.6,N.z))*vec3(0.82,0.84,0.87)+(sp+sp2)*1.3+col*0.04;',
    '      lc*=0.65+0.35*smoothstep(0.0,0.35,thick+0.15);',
    '    }else{',
    '      lc=col*0.3+vec3(0.42,1.0,0.22)*(0.5+0.8*thick)*(1.0-0.3*smoothstep(0.1,0.5,fr))+(sp+sp2)*0.7;',
    '    }',
    '    col=mix(col,lc,cov);',
    '  }',
    '  if(mode>2.5){float halo=smoothstep(0.02,th,q0)*(1.0-cov);col+=vec3(0.25,0.85,0.12)*halo*0.4;}',
    '  vec2 qv=uv-0.5;',
    '  col*=1.0-0.3*dot(qv,qv)*2.0;',
    '  col*=1.0-black;',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  var prog = mkProg(VS, FS);
  var sprog = mkProg(VS, SFS);
  var pprog = mkProg(PVS, PFS);
  var fprog = mkProg(FVS, FFS);
  var cprog = mkProg(VS, CFS);
  var U = unis(prog, ['M', 'BG', 'LQ', 'WT', 'R', 'G', 'LR', 'CS', 'shake', 'gone', 'black', 'S', 'S3', 'D', 'Dc', 'K', 'sheen', 'mode', 'th', 'frW', 'frB', 'tm', 'L']);
  var SU = unis(sprog, ['R', 't', 'mode', 'lv', 'lv0', 'slosh', 'fill', 'Wd']);
  var PU = unis(pprog, ['V', 'ps']);
  var FU = unis(fprog, ['V', 'fogc']);
  var CU = unis(cprog, ['c']);
  var aP = gl.getAttribLocation(prog, 'p');
  var aPs = gl.getAttribLocation(sprog, 'p');
  var aPc = gl.getAttribLocation(cprog, 'p');
  var aPa = gl.getAttribLocation(pprog, 'a'), aPb = gl.getAttribLocation(pprog, 'b');
  var aFa = gl.getAttribLocation(fprog, 'a'), aFb = gl.getAttribLocation(fprog, 'b');

  var vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var PMAX = 4200, PST = 6;
  var pdata = new Float32Array(PMAX * PST);
  var pb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, pdata.byteLength, gl.DYNAMIC_DRAW);
  var FMAXV = 80 * 6, FST = 8;
  var fdata = new Float32Array(FMAXV * FST);
  var fb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, fb);
  gl.bufferData(gl.ARRAY_BUFFER, fdata.byteLength, gl.DYNAMIC_DRAW);
  var maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 64;

  var K = 0.42;
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  function mkTex() {
    var tx = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tx;
  }
  var texM = mkTex(), texScene = mkTex(), texLq = mkTex(), texWet = mkTex();
  var fbo = gl.createFramebuffer(), fboL = gl.createFramebuffer(), fboW = gl.createFramebuffer();
  var sw = 0, shh = 0, lw = 0, lh = 0;
  function attach(f, tex, w, h) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  function sizeTargets() {
    sw = Math.max(64, Math.round(W * 0.75)); shh = Math.max(64, Math.round(Hc * 0.75));
    attach(fbo, texScene, sw, shh);
    lw = Math.max(64, Math.round(W * 0.6)); lh = Math.max(64, Math.round(Hc * 0.6));
    attach(fboL, texLq, lw, lh);
    attach(fboW, texWet, lw, lh);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

          rate *= gurgle;
          totalRate += rate;
          w.acc += rate * dt;
          while (w.acc >= 1) {
            w.acc -= 1;
            var ra = Math.random() * 6.2832, rr = Math.sqrt(Math.random()) * (2 + w.size * 4);
            addF(w.x + Math.cos(ra) * rr, w.y + Math.sin(ra) * rr, (Math.random() - 0.5) * 1.2, Math.random() * 0.6 + 0.3, 1);
            lv += dPer;
          }
          var jk = P.spray * Math.max(0, Math.sqrt(hf) - 0.18) / 0.7 * Math.min(1, w.size * 1.3) * gurgle;
          w.jk = jk; w.jv = Dcam * (0.3 + 0.9 * Math.sqrt(hf)) * (1 + w.boost * 0.3);
          if (jk > 0) {
            lv += dPer * jk * 120 * (1 + w.boost) * bm * dt;
            /* ジェットの先は砕けて、細かいしぶきになって飛んでいく */
            w.sacc += jk * 220 * dt * (1 + w.boost);
            var te = jetEnd(w);
            while (w.sacc >= 1) {
              w.sacc -= 1;
              var tb = te * (Math.random() < 0.6 ? 0.85 + Math.random() * 0.25 : 0.25 + Math.random() * 0.6);
              jetPoint(w, tb, k, jp);
              addS(jp[4] + (Math.random() - 0.5) * 3, jp[5] + (Math.random() - 0.5) * 3, jp[3],
                w.lx * w.jv + (Math.random() - 0.5) * 70, w.ly * w.jv + GJ * tb + (Math.random() - 0.5) * 60, w.jv * (0.85 + Math.random() * 0.25),
                0.22 + Math.random() * 0.3, 0.55 + Math.random() * 0.4);
            }
          }
          w.boost = Math.max(0, w.boost - dt * 1.6);
        }
        w.grow += dt * Math.sqrt(hf) * 0.14;
        if (w.grow >= 1 && state === 'live') {
          w.grow -= 1;
          spawnRunner(w.x * gs, w.y * gs, Math.random() * 6.2832, minG * 1.5, 0.78, minG * (0.12 + Math.random() * 0.25), 1);
          w.size = Math.min(1.4, w.size + 0.06);
          addStress(0.3 + 0.3 * hf);
        }
      }
      if (nCP > 0 && state === 'live') {
        var nSeep = dt * Math.min(40, nCP * 0.05) * P.seep;
        var tries = Math.floor(nSeep) + (Math.random() < nSeep % 1 ? 1 : 0);
        for (var s = 0; s < tries; s++) {
          var ci = (Math.random() * nCP) | 0;
          var cx = crackPts[ci * 2], cy = crackPts[ci * 2 + 1];
          var hd = cy - lv;
          if (hd <= 0 || Math.random() > Math.sqrt(hd / H0) * 1.4) continue;
          addF(cx, cy, 0, 0, 1);
          lv += dPer * 0.5;
        }
      }
    }
    if (lv > lvBot) lv = lvBot;

    stepAcc += dt * 60;
    var nStep = 0;
    while (stepAcc >= 1 && nStep < 3) { stepFluid(P); stepAcc -= 1; nStep++; }
    if (stepAcc > 3) stepAcc = 0;
    for (i = nF - 1; i >= 0; i--) {
      if (fy[i] > Hc + 12) { delF(i); continue; }
      if (fnb[i] < 2) { fage[i] += dt; if (fage[i] > P.life * (fsz[i] > 1.5 ? 0.6 : 1)) delF(i); }
      else fage[i] = Math.max(0, fage[i] - dt);
    }
    stepSpray(dt);
    if (mode === 0) stepFish(dt);

    if (state === 'live') {
      if (stress > STRESS_MAX * 0.6) {
        creak -= dt;
        if (creak <= 0) {
          creak = 0.8 + Math.random() * 1.6;
          shakeAmt = Math.max(shakeAmt, 0.22);
          var lvs = leaves.length ? leaves[(Math.random() * leaves.length) | 0] : null;
          if (lvs && !lvs.dead) { var v0 = lvs.v[0]; spawnRunner(v0[0], v0[1], Math.random() * 6.2832, minG * 1.2, 0.75, minG * (0.15 + Math.random() * 0.3), 1); }
        }
      }
      if (Math.random() < dt * 0.25 && leaves.length) {
        var s2 = leaves[(Math.random() * leaves.length) | 0];
        if (!s2.dead && s2.area > minArea * 3) splitShard(s2, false);
      }
    } else if (state === 'burst') {
      var fs = clock - stT;
      if (fs < 0.45) {
        if (Math.random() < 0.6 && leaves.length) { var lf = leaves[(Math.random() * leaves.length) | 0]; if (!lf.dead) splitShard(lf, true); }
        shakeAmt = Math.max(shakeAmt, 0.6);
      } else {
        if (gone === 0) {
          /* 決壊: ガラスが消え、水面より下の液がまるごと手前へなだれ込む */
          var head0 = Math.max(0, lvBot - lv);
          var n0 = Math.round(150 + 650 * head0 / H0);
          for (var b = 0; b < n0; b++) {
            var yb = lv + Math.pow(Math.random(), 0.7) * head0, hfb = (yb - lv) / H0;
            addS(Math.random() * W, yb, 0, (Math.random() - 0.5) * 160, -60 - Math.random() * 160,
              Dcam * (0.3 + 0.9 * Math.sqrt(hfb)) * (0.55 + Math.random() * 0.6), 1.2 + Math.random() * 2.2, 0.15 + Math.random() * 0.5);
          }
          lensP = 0.5;
          wounds = [];
          flee.push({ x: W / 2, y: Hc / 2, t: clock, r: 2000 });
        }
        gone = Math.min(1, (fs - 0.45) / 0.2);
        lv += (lvBot - lv) * Math.min(1, dt * 1.6);
        shakeAmt = Math.max(shakeAmt, 0.4 * (1 - Math.min(1, (fs - 0.45) / 1.2)));
        if (fs > 4.6) black = Math.min(1, (fs - 4.6) / 0.6);
        if (fs > 5.3) beginRefill();
      }
    } else if (state === 'swap') {
      black = Math.min(1, (clock - stT) / 0.35);
      if (clock - stT > 0.4) beginRefill();
    } else if (state === 'refill') {
      var ft = clock - stT;
      var e = Math.min(1, ft / 3.2);
      e = 1 - Math.pow(1 - e, 2.2);
      lv = lvBot + (lvFull - lvBot) * e;
      fill = ft < 3.2 ? Math.min(1, ft * 4) : Math.max(0, 1 - (ft - 3.2) * 3);
      if (ft > 3.6) { state = 'live'; fill = 0; lv = lvFull; }
    }
    if (state === 'live' || state === 'refill') black = 0;
    if (fadeIn > 0) { black = Math.max(black, fadeIn); fadeIn = Math.max(0, fadeIn - dt / 0.8); }
    shakeAmt = Math.max(0, shakeAmt - dt * 1.4);
    var shx = (Math.random() - 0.5) * shakeAmt * 0.012, shy = (Math.random() - 0.5) * shakeAmt * 0.012;

    upload();

    /* --- 描く: 水槽の中 --- */
    var order = wounds.slice().sort(function (a, b) { return b.size - a.size; });
    for (k = 0; k < 8; k++) {
      var ww = order[k];
      if (ww && ww.y > lv && !ww.plug) { wd[k * 4] = ww.x / W; wd[k * 4 + 1] = ww.y / Hc; wd[k * 4 + 2] = Math.min(1.2, ww.size * (1 + ww.boost * 0.3)); wd[k * 4 + 3] = 0; }
      else { wd[k * 4] = 0; wd[k * 4 + 1] = 0; wd[k * 4 + 2] = 0; wd[k * 4 + 3] = 0; }
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, sw, shh);
    gl.useProgram(sprog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.enableVertexAttribArray(aPs);
    gl.vertexAttribPointer(aPs, 2, gl.FLOAT, false, 0, 0);
    gl.uniform2f(SU.R, sw, shh);
    gl.uniform1f(SU.t, clock);
    gl.uniform1f(SU.mode, mode);
    gl.uniform1f(SU.lv, lv / Hc);
    gl.uniform1f(SU.lv0, lvFull / Hc);
    gl.uniform1f(SU.slosh, 0.4 + Math.min(1.6, totalRate / 120) + fill * 2.5 + (state === 'burst' ? 3 : 0));
    gl.uniform1f(SU.fill, fill);
    gl.uniform4fv(SU.Wd, wd);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(aPs);
    /* 魚 */
    if (mode === 0) {
      var nv = drawFish();
      if (nv > 0) {
        gl.useProgram(fprog);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.bindBuffer(gl.ARRAY_BUFFER, fb);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, fdata.subarray(0, nv * FST));
        gl.enableVertexAttribArray(aFa); gl.enableVertexAttribArray(aFb);
        gl.vertexAttribPointer(aFa, 4, gl.FLOAT, false, FST * 4, 0);
        gl.vertexAttribPointer(aFb, 4, gl.FLOAT, false, FST * 4, 16);
        gl.uniform2f(FU.V, W, Hc);
        gl.uniform3f(FU.fogc, 0.04, 0.22, 0.28);
        gl.drawArrays(gl.TRIANGLES, 0, nv);
        gl.disableVertexAttribArray(aFa); gl.disableVertexAttribArray(aFb);
        gl.disable(gl.BLEND);
      }
    }

    /* --- 描く: ガラスの外の液(粒・ジェット・しぶきを点で足し込む) --- */
    var n = 0;
    var spl = P.splat;
    function put(x, y, size, wgt, ae) {
      if (n >= PMAX) return;
      var o = n * PST;
      pdata[o] = x; pdata[o + 1] = y; pdata[o + 2] = size; pdata[o + 3] = wgt; pdata[o + 4] = ae; pdata[o + 5] = 0;
      n++;
    }
    for (i = 0; i < nF; i++) {
      var life = P.life * (fsz[i] > 1.5 ? 0.6 : 1);
      var shrink = fnb[i] < 2 ? Math.min(1, Math.max(0, (life - fage[i]) / 1.5)) : 1;
      var sz0 = spl * fsz[i] * (0.55 + 0.45 * shrink), wg = 0.55 * (0.4 + 0.6 * shrink);
      put(fx[i], fy[i], sz0, wg, 0);
      /* 流れている玉は、上のほうが細くのびた涙の形になる */
      var vv = fvx[i] * fvx[i] + fvy[i] * fvy[i];
      if (vv > 0.6) {
        var vl = Math.sqrt(vv), st = Math.min(1, vl / 4);
        put(fx[i] - fvx[i] / vl * sz0 * 0.3, fy[i] - fvy[i] / vl * sz0 * 0.3, sz0 * 0.75, wg * 0.8, 0);
        if (st > 0.3) put(fx[i] - fvx[i] / vl * sz0 * 0.65 * st, fy[i] - fvy[i] / vl * sz0 * 0.65 * st, sz0 * 0.55, wg * 0.7, 0);
      }
    }
    var nFilm = n;
    if (state === 'live') {
      for (k = 0; k < wounds.length; k++) {
        var jw = wounds[k];
        if (!jw.jk || jw.plug) continue;
        var r0 = (0.8 + 1.6 * jw.size) * (0.45 + 0.55 * Math.min(1, jw.jk));
        var te2 = jetEnd(jw);
        var lxp = -1e9, lyp = -1e9;
        for (var tau = 0.002; tau < te2 && n < PMAX; tau += 0.0025) {
          jetPoint(jw, tau, k, jp);
          if (jp[3] > Dcam * 0.86 || jp[1] > Hc + 80) break;
          var rip = Math.sin(tau * 160 - clock * 70 + jw.seed) * 0.6 + Math.sin(tau * 71 - clock * 40) * 0.4;
          var fr2 = tau / te2;
          var rad = r0 * jp[2] * (1 + 0.7 * tau) * (1 + 0.13 * rip * Math.min(1, tau * 12));
          /* 先のほうはほつれて途切れ途切れに */
          if (fr2 > 0.7) {
            var hsh = Math.sin(Math.floor(tau * 120 - clock * 30) * 12.9898 + jw.seed) * 43758.5;
            hsh -= Math.floor(hsh);
            if (hsh < (fr2 - 0.7) / 0.3 * 0.75) continue;
            rad *= 0.6 + 0.4 * hsh;
          }
          var ddx = jp[0] - lxp, ddy = jp[1] - lyp;
          if (ddx * ddx + ddy * ddy < rad * rad * 0.09) continue;
          lxp = jp[0]; lyp = jp[1];
          /* 先へ行くほど流れが乱れて、縁がぶれる */
          var jit = rad * 0.45 * fr2;
          put(jp[0] + (Math.random() - 0.5) * jit, jp[1] + (Math.random() - 0.5) * jit, rad * 3.4, 0.6,
            Math.min(1, 0.12 + fr2 * 1.35) * (0.3 + 0.7 * Math.min(1, jw.jk)));
        }
      }
    }
    /* しぶき: 速く動くので、動いた方向に少しのびて見える(ぶれ) */
    for (i = 0; i < nS && n < PMAX; i++) {
      var ps1 = Dcam / (Dcam - sz[i]);
      var X1 = eyeX + (sx[i] - eyeX) * ps1, Y1 = eyeY + (sy[i] - eyeY) * ps1;
      var big = ssz[i] > 1;
      var sz1 = spl * ssz[i] * ps1;
      put(X1, Y1, sz1, 0.6, sae[i]);
      if (!big) {
        var dtb = 0.02, z0 = sz[i] - svz[i] * dtb, ps0 = Dcam / (Dcam - z0);
        var X0 = eyeX + (sx[i] - svx[i] * dtb - eyeX) * ps0, Y0 = eyeY + (sy[i] - svy[i] * dtb - eyeY) * ps0;
        put(X1 * 0.5 + X0 * 0.5, Y1 * 0.5 + Y0 * 0.5, sz1 * 0.85, 0.45, sae[i]);
        put(X0, Y0, sz1 * 0.7, 0.3, sae[i]);
      }
    }
    var psc = Math.min(2 * lw / W, maxPoint / 60);
    gl.useProgram(pprog);
    gl.bindBuffer(gl.ARRAY_BUFFER, pb);
    if (n > 0) gl.bufferSubData(gl.ARRAY_BUFFER, 0, pdata.subarray(0, n * PST));
    gl.uniform2f(PU.V, W, Hc);
    gl.uniform1f(PU.ps, psc);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboL);
    gl.viewport(0, 0, lw, lh);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    if (n > 0) {
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.enableVertexAttribArray(aPa); gl.enableVertexAttribArray(aPb);
      gl.vertexAttribPointer(aPa, 4, gl.FLOAT, false, PST * 4, 0);
      gl.vertexAttribPointer(aPb, 2, gl.FLOAT, false, PST * 4, 16);
      gl.drawArrays(gl.POINTS, 0, n);
    }
    /* 濡れた跡: 少し乾かしてから、動いている玉の通り道を足す */
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboW);
    gl.useProgram(cprog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.enableVertexAttribArray(aPc);
    gl.vertexAttribPointer(aPc, 2, gl.FLOAT, false, 0, 0);
    var dec = Math.pow(0.5, dt / P.wetHL);
    gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
    gl.uniform4f(CU.c, dec, dec, dec, 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(aPc);
    if (P.wetK > 0 && nF > 0) {
      var m2 = 0;
      for (i = 0; i < nF; i++) {
        var vv2 = fvx[i] * fvx[i] + fvy[i] * fvy[i];
        if (vv2 < 0.08) continue;
        var o2 = m2 * PST;
        pdata[o2] = fx[i]; pdata[o2 + 1] = fy[i]; pdata[o2 + 2] = spl * 0.8 * fsz[i]; pdata[o2 + 3] = Math.min(0.22, Math.sqrt(vv2) * 0.07) * P.wetK * dt * 60; pdata[o2 + 4] = 0; pdata[o2 + 5] = 0;
        m2++;
      }
      if (m2 > 0) {
        gl.useProgram(pprog);
        gl.bindBuffer(gl.ARRAY_BUFFER, pb);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, pdata.subarray(0, m2 * PST));
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.enableVertexAttribArray(aPa); gl.enableVertexAttribArray(aPb);
        gl.vertexAttribPointer(aPa, 4, gl.FLOAT, false, PST * 4, 0);
        gl.vertexAttribPointer(aPb, 2, gl.FLOAT, false, PST * 4, 16);
        gl.drawArrays(gl.POINTS, 0, m2);
      }
    }
    gl.disableVertexAttribArray(aPa); gl.disableVertexAttribArray(aPb);
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cvs.width, cvs.height);

    /* --- 描く: 仕上げ --- */
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, texWet);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, texLq);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texScene);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texM);
    var la = clock * 0.19;
    var lx = Math.cos(la) * 0.62, ly = Math.sin(la) * 0.62 - 0.3, lz = 1;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    gl.uniform1i(U.M, 0); gl.uniform1i(U.BG, 1); gl.uniform1i(U.LQ, 2); gl.uniform1i(U.WT, 3);
    gl.uniform2f(U.R, cvs.width, cvs.height);
    gl.uniform2f(U.G, gw, gh);
    gl.uniform2f(U.LR, lw, lh);
    gl.uniform2f(U.CS, W, Hc);
    gl.uniform2f(U.shake, shx, shy);
    gl.uniform1f(U.gone, gone);
    gl.uniform1f(U.black, black);
    gl.uniform1f(U.S, 0.04);
    gl.uniform1f(U.S3, 0.01);
    gl.uniform1f(U.D, glass.D);
    gl.uniform1f(U.Dc, glass.Dc);
    gl.uniform1f(U.K, K);
    gl.uniform1f(U.sheen, Math.sin(clock * 0.13) * 1.4);
    gl.uniform1f(U.mode, mode);
    gl.uniform1f(U.th, 0.3);
    gl.uniform1f(U.frW, Math.min(0.03, 7 / W));
    gl.uniform1f(U.frB, frameB() / Hc);
    gl.uniform1f(U.tm, clock);
    gl.uniform3f(U.L, lx / ll, ly / ll, lz / ll);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  function beginRefill() {
    freshPane();
    nF = 0; nS = 0; lensP = 0.04; gone = 0;
    clearWet();
    state = 'refill'; stT = clock; lv = lvBot; fadeIn = 1; black = 0;
  }

  window.addEventListener('resize', resize);
  resize();
  setTimeout(function () { if (!hintHidden) hint.classList.add('on'); }, 900);
  setTimeout(hideHint, 8500);
  requestAnimationFrame(frame);

  /* ---- 共有コントロール(ap-kit.js) ---- */
  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'waterline',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {   /* 液を 水→蜂蜜→水銀→蛍光液 と替える。流れ方も変わる。ガラスの種類(虹の幅)も替える */
          mode = (mode + 1) % 4;
          glass.D = 0.18 + Math.random() * 0.25;
          glass.Dc = 0.5 + Math.random() * 0.7;
        } },
        { label: '↻', name: 'reset', onClick: function () { if (state === 'live') { state = 'swap'; stT = clock; } } }   /* 新しいガラスにして、液を満たし直す */
      ]
    });
  }
})();
</script>
</body>
