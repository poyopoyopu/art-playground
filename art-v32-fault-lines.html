<!doctype html><html><head><title>Art Playground — FAULT LINES</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020208">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020208;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;opacity:.35;pointer-events:none;z-index:3}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fault Lines">
<script src="ap-kit.js"></script>
</head><body>
<canvas id="c"></canvas><div id="hint">FRACTURE — BREAK THE SURFACE</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D,pts=[],t=0;
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
function seed(){
 pts=[];let n=Math.max(34,Math.min(70,Math.floor(W*H/13000)));
 for(let i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,h:Math.random()*360});
}
seed();
let fingers=new Map();
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});pts.push({x:e.clientX,y:e.clientY,vx:0,vy:0,h:Math.random()*360,life:1})};
c.onpointermove=e=>{let q=fingers.get(e.pointerId);if(q){q.px=q.x;q.py=q.y;q.x=e.clientX;q.y=e.clientY}};
c.onpointerup=c.onpointercancel=e=>fingers.delete(e.pointerId);
function tess(P){
 // Draw the tessellation from wherever the points currently are.
 const K=(k)=>APKit.T(k,P,t);
 x.clearRect(0,0,W,H);x.fillStyle='#020208';x.fillRect(0,0,W,H);
 let step=Math.max(7,Math.floor(W/65));
 for(let yy=0;yy<H;yy+=step)for(let xx=0;xx<W;xx+=step){
   let a=1e9,b=1e9,pa=null,pb=null;
   for(let p of pts){let d=(xx-p.x)**2+(yy-p.y)**2;if(d<a){b=a;pb=pa;a=d;pa=p}else if(d<b){b=d;pb=p}}
   let edge=Math.max(0,1-Math.abs(Math.sqrt(b)-Math.sqrt(a))/7);
   let hue=(pa.h+K(18)*(P==null?1:57.29577951308232)+edge*110)%360;
   x.fillStyle=`hsla(${hue},90%,${24+edge*40}%,${.42+edge*.45})`;
   x.fillRect(xx,yy,step+1,step+1);
 }
}
function frame(){
 if(!APKit.isExporting()){
  t+=.012;
  for(let p of pts){let dx=0,dy=0;
    for(let q of fingers.values()){let ax=p.x-q.x,ay=p.y-q.y,r=Math.hypot(ax,ay)+1;
      let f=Math.min(2,900/(r*r));dx+=ax*f;dy+=ay*f}
    p.vx+=dx*.004;p.vy+=dy*.004;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;
    if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30;
  }
  tess(null);
 }
 requestAnimationFrame(frame)
}frame();

/* The points drift in a straight line and wrap, which never returns to where
   it started. For the loop each point instead travels a small closed ellipse
   around wherever it happens to be, at a speed taken from its own velocity —
   so the cells keep shifting, and frame 0 and the last frame are identical. */
let loopBase=null;
function loopFrame(phase){
 if(!loopBase)loopBase=pts.map(p=>({x:p.x,y:p.y,sp:Math.min(26,Math.hypot(p.vx,p.vy)*90+7),
   ph:Math.random()*Math.PI*2,turns:1+Math.floor(Math.random()*2)}));
 pts.forEach((p,i)=>{
  const b=loopBase[i];
  p.x=b.x+Math.cos(b.turns*phase+b.ph)*b.sp;
  p.y=b.y+Math.sin(b.turns*phase+b.ph)*b.sp*.8;
 });
 tess(phase);
}
APKit.init({
 canvas:c, gifName:'fault-lines-loop', preroll:false,
 loopFrame:loopFrame,
 onExportEnd:()=>{ if(loopBase){pts.forEach((p,i)=>{p.x=loopBase[i].x;p.y=loopBase[i].y});loopBase=null} },
 buttons:[{label:'↻',name:'reset',onClick:()=>{seed();loopBase=null}}]
});
</script></body></html>
