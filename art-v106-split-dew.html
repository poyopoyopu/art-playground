<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPLIT DEW — 切った雫は、また手をつなぐ</title>
<!-- SPLIT DEW — クロちゃん(Claude)作。ap-kit.js統合: Claude
     World law: なぞった線で水滴は切れるが、表面張力がその切れ目を数秒で縫い直す。
     切るほど雫は増え、放っておくと元のひとつに戻ろうとする。
     Render: WebGL1 2D signed-distance field + refraction of the backdrop through each drop,
     dispersed (rainbow) rim, specular, caustic. Backdrops: 真っ黒 / プリズム / ラベンダー. -->
<script src="ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);text-align:center;color:rgba(235,232,245,.62);font:500 11px/1.5 system-ui,sans-serif;letter-spacing:.12em;pointer-events:none;transition:opacity 1s,color .8s;text-shadow:0 0 6px rgba(0,0,0,.35)}
#hint.light{color:rgba(60,52,72,.62);text-shadow:none}
#hint.off{opacity:0}
#error{position:fixed;left:18px;right:18px;bottom:24px;text-align:center;color:#c9c3d6;font:12px/1.5 system-ui,sans-serif;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hint">なぞると切れる · 長押しで引っぱる</div><div id="error">この端末では WebGL を利用できません。</div>
<script>
'use strict';
(() => {
  const canvas = document.getElementById('c'), hint = document.getElementById('hint');
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) { document.getElementById('error').style.display = 'block'; return; }

  const vs = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const fs = `
  precision highp float;
  uniform vec2 uRes;
  uniform float uTime;
  uniform float uSeed;
  uniform vec2 uPtr;
  uniform float uPtrOn;
  uniform float uDisp;
  uniform vec2 uSpan;
  uniform float uBgA;
  uniform float uBgB;
  uniform float uBgT;
  #define NCUT 20
  uniform vec4 uCuts[NCUT];
  uniform float uCutLife[NCUT];

  float smin(float a, float b, float k){
    float h = clamp(0.5 + 0.5*(b-a)/k, 0., 1.);
    return mix(b, a, h) - k*h*(1.-h);
  }
  float smax(float a, float b, float k){ return -smin(-a, -b, k); }
  float capsule(vec2 p, vec2 a, vec2 b, float r){
    vec2 pa = p-a, ba = b-a;
    float h = clamp(dot(pa,ba)/dot(ba,ba), 0., 1.);
    return length(pa - ba*h) - r;
  }
  vec2 orbit(float i, float t){
    float s = uSeed;
    return 0.34 * (vec2(1.) + (uSpan - 1.)*0.45) * vec2(
      sin(t*(0.17 + 0.045*i) + i*1.7 + s*2.31),
      cos(t*(0.13 + 0.037*i) + i*2.9 + s*1.73)
    );
  }
  float map(vec2 p){
    float t = uTime;
    vec2 q = p + 0.04*vec2(sin(p.y*3.1 + t*0.41 + uSeed), sin(p.x*2.7 - t*0.33 - uSeed*0.7));
    float d = length(q - orbit(0., t)) - (0.25 + 0.04*sin(t*0.29 + uSeed));
    d = smin(d, length(q - orbit(1., t)) - 0.19, 0.22);
    d = smin(d, capsule(q, orbit(2., t), orbit(3., t)*1.1, 0.06 + 0.02*sin(t*0.5)), 0.18);
    d = smin(d, length(q - orbit(5., t*1.3)*1.2) - 0.07, 0.12);
    d = smin(d, length(q - orbit(6., t*1.1)*1.3) - 0.045, 0.1);
    d = smin(d, mix(1.0, length(q - uPtr) - 0.10, uPtrOn), 0.24);
    // finger cuts: one gap along the whole stroke, rounded off by surface tension
    float cut = 1.0;
    for (int i = 0; i < NCUT; i++){
      float life = uCutLife[i];
      if (life <= 0.) continue;
      cut = min(cut, capsule(p, uCuts[i].xy, uCuts[i].zw, 0.021*life - 0.004));
    }
    d = smax(d, -cut, 0.03);
    return d;
  }
  vec3 spec(float t){
    vec3 c = 0.5 + 0.5*cos(6.2831*(t*0.82 + vec3(0.0, 0.66, 0.33)));
    return mix(pow(c, vec3(1.3)), vec3(1.), 0.15);
  }
  float sq(float x){ return x*x; }
  float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1)))*43758.5453); }

  // ---- boards the drops sit on ----
  float vhash(vec2 i){ return fract(sin(dot(i, vec2(127.1, 311.7)))*43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3. - 2.*f);
    return mix(mix(vhash(i), vhash(i + vec2(1.,0.)), u.x),
               mix(vhash(i + vec2(0.,1.)), vhash(i + vec2(1.,1.)), u.x), u.y);
  }
  // crumpled foil: ridged noise gives sharp creases
  float foil(vec2 p){
    float h = 0., a = 0.5;
    for (int o = 0; o < 4; o++){
      h += a * (1. - abs(2.*vnoise(p) - 1.));
      p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.7;
      a *= 0.5;
    }
    return h;
  }
  vec3 foilNormal(vec2 p, float scale, float amp){
    float e = 0.004;
    vec2 s = p*scale;
    float h0 = foil(s);
    float hx = foil(s + vec2(e*scale, 0.)) - h0;
    float hy = foil(s + vec2(0., e*scale)) - h0;
    return normalize(vec3(-hx/e*amp, -hy/e*amp, 1.));
  }
  vec3 lavender(vec2 p){
    vec3 c = mix(vec3(0.835, 0.825, 0.865), vec3(0.905, 0.89, 0.895), clamp(0.5 + 0.6*(p.y - p.x*0.4), 0., 1.));
    float t = uTime*0.07;
    vec2 a = vec2(0.32*sin(t + 1.0), 0.30*cos(t*1.3));
    vec2 b = vec2(0.30*cos(t*0.8 + 2.0), 0.32*sin(t*1.1 + 0.5));
    c += vec3(0.07, 0.02, -0.03) * exp(-dot(p-a, p-a)/0.06);
    c += vec3(-0.04, 0.01, 0.06) * exp(-dot(p-b, p-b)/0.07);
    vec2 gp = fract(p*26.) - 0.5;
    c -= 0.04 * smoothstep(0.13, 0.07, length(gp));
    return c;
  }
  vec3 night(vec2 p){
    // near-black lacquer: faint dot grid and two dim pools of light so the lens still has something to bend
    vec3 c = vec3(0.018, 0.018, 0.024);
    float t = uTime*0.07;
    vec2 a = vec2(0.32*sin(t + 1.0), 0.30*cos(t*1.3));
    vec2 b = vec2(0.30*cos(t*0.8 + 2.0), 0.32*sin(t*1.1 + 0.5));
    c += vec3(0.06, 0.025, 0.05) * exp(-dot(p-a, p-a)/0.05);
    c += vec3(0.015, 0.04, 0.07) * exp(-dot(p-b, p-b)/0.06);
    vec2 gp = fract(p*26.) - 0.5;
    c += 0.045 * smoothstep(0.12, 0.06, length(gp));
    return c;
  }
  vec3 holo(vec2 p){
    vec3 N = foilNormal(p, 1.4, 0.008);
    float t = uTime*0.05;
    float ph = dot(N.xy, vec2(2.6, 1.9))*1.3 + p.x*0.9 + p.y*0.6 + t;
    vec3 iri = 0.5 + 0.5*cos(6.2831*(ph + vec3(0.0, 0.33, 0.67)));
    vec3 c = mix(vec3(0.90, 0.90, 0.94), iri, 0.4);
    vec3 Ld = normalize(vec3(-0.4, 0.6, 0.8));
    float sp = pow(max(dot(N, normalize(Ld + vec3(0.,0.,1.))), 0.), 24.);
    c *= 0.9 + 0.15*max(dot(N, Ld), 0.);
    c += vec3(1.) * sp * 0.4;
    return c;
  }
  vec3 boardMode(vec2 p, float m){
    if (m < 0.5) return lavender(p);
    if (m < 1.5) return night(p);
    return holo(p);
  }
  vec3 board(vec2 p){
    vec3 c = boardMode(p, uBgB);
    if (uBgT < 0.999) c = mix(boardMode(p, uBgA), c, uBgT);
    return max(c - 0.03 * dot(p/uSpan, p/uSpan), 0.);
  }

  void main(){
    float px = 1.22 / min(uRes.x, uRes.y);
    vec2 p = (gl_FragCoord.xy - 0.5*uRes) / min(uRes.x, uRes.y) * 1.22;
    float eps = 0.0015;
    float d0 = map(p);
    vec2 g = vec2(map(p + vec2(eps,0.)) - d0, map(p + vec2(0.,eps)) - d0) / eps;
    float glen = max(length(g), 1e-3);
    float d = d0 / clamp(glen, 0.6, 2.0);
    vec2 n = g / glen;
    vec2 L = normalize(vec2(-0.55, 0.83));
    float ndl = dot(n, L);

    float darkW = (abs(uBgB - 1.) < 0.5 ? uBgT : 0.) + (abs(uBgA - 1.) < 0.5 ? 1. - uBgT : 0.);
    // ground + soft contact shadow cast down-right
    vec3 col = board(p);
    float ds = map(p - vec2(0.02, -0.03));
    col *= 1. - 0.10 * (1. - smoothstep(-0.04, 0.06, ds));

    float inside = 1. - smoothstep(-px, px, d);

    // outside glow: warm on the lit side, cool on the shaded side
    vec3 haze = mix(vec3(0.62, 0.84, 1.0), vec3(1.0, 0.72, 0.48), 0.5 + 0.5*ndl);
    col = mix(col, haze, (1. - inside) * (0.22 + 0.10*darkW) * exp(-max(d, 0.)/(0.045 + 0.02*darkW)));

    // water body: flat top, rounded rim -> surface normal
    float R = 0.07;
    float x = clamp(-d/R, 0., 1.);
    float sl = min((1. - x) / sqrt(max(1. - sq(1. - x), 1e-3)), 5.);
    vec3 N = normalize(vec3(n*sl, 1.));
    vec2 off = -N.xy * 0.05;
    float k = 0.1 + uDisp*0.12;
    vec3 refr = vec3(board(p + off*(1. - k)).r, board(p + off).g, board(p + off*(1. + k)).b);
    refr *= vec3(0.975, 0.99, 1.02);
    float fres = pow(1. - N.z, 3.);
    vec3 water = mix(refr, mix(vec3(0.98, 0.98, 1.0), vec3(0.30, 0.31, 0.38), darkW), fres*0.35);
    vec3 Hh = normalize(normalize(vec3(-0.5, 0.75, 0.9)) + vec3(0., 0., 1.));
    float nh = max(dot(N, Hh), 0.);
    water += vec3(1.) * (pow(nh, 90.) * 0.95 + pow(nh, 10.) * 0.05);
    // light focused through the drop pools on the far side
    float caustic = exp(-sq((d + 0.02)/0.014)) * max(-ndl, 0.);
    water += vec3(1.0, 0.86, 0.62) * caustic * 0.30;
    col = mix(col, water, inside);

    // dispersed rim
    float w = 0.0034 + 0.0026*(0.5 + 0.5*ndl);
    float W = 0.028;
    float spread = uDisp * 0.014 * (ndl*0.9 + 0.35);
    vec3 acc = vec3(0.), accW = vec3(0.);
    float wsum = 0., wsumW = 0., gmax = 0.;
    for (int i = 0; i < 9; i++){
      float t = float(i) / 8.;
      float s = (t - 0.5) * spread;
      float gS = exp(-sq((d - s)/w));
      float gW = exp(-sq((d - s*2.2)/W));
      vec3 c = spec(t);
      acc += c*gS; wsum += gS; gmax = max(gmax, gS);
      accW += c*gW; wsumW += gW;
    }
    vec3 bleed = accW / max(wsumW, 1e-4);
    bleed = mix(vec3(dot(bleed, vec3(0.333))), bleed, 2.2);
    col = mix(col, clamp(bleed, 0., 1.), clamp(wsumW/9., 0., 1.) * (0.30 + 0.25*darkW));
    vec3 rim = acc / max(wsum, 1e-4);
    rim = mix(vec3(dot(rim, vec3(0.333))), rim, 1.8);
    col = mix(col, clamp(rim, 0., 1.), clamp(gmax, 0., 1.) * 0.75);
    float core = exp(-sq(d/(w*0.55)));
    col = mix(col, vec3(1.), core * (0.45 + 0.35*max(ndl, 0.)));

    col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.012;
    gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
  }`;

  function sh(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.getElementById('error').style.display = 'block'; return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uRes','uSpan','uTime','uSeed','uPtr','uPtrOn','uDisp','uCuts','uCutLife','uBgA','uBgB','uBgT']
    .forEach(k => U[k] = gl.getUniformLocation(prog, k));

  // ---- finger cuts: a ring buffer of short stroke segments, each with its own healing clock ----
  const NCUT = 20;
  const cutBuf = new Float32Array(NCUT*4), lifeBuf = new Float32Array(NCUT);
  const cutBorn = new Float64Array(NCUT).fill(-1e9);
  let cutIdx = 0;
  function addCut(a, b){
    const i = cutIdx; cutIdx = (cutIdx + 1) % NCUT;
    cutBuf.set([a[0], a[1], b[0], b[1]], i*4);
    cutBorn[i] = performance.now();
  }
  function clearCuts(){ cutBorn.fill(-1e9); }
  // a cut stays open ~2.5s, then surface tension closes it over ~3s
  function cutLife(now, born){
    const age = (now - born) / 1000;
    if (age < 0) return 0;
    if (age < 0.12) return age / 0.12;
    if (age < 2.5) return 1;
    return Math.max(0, 1 - (age - 2.5) / 3);
  }

  // ---- size ----
  let unit = 1;
  function resize(){
    const d = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(innerWidth * d);
    canvas.height = Math.round(innerHeight * d);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
    unit = Math.min(innerWidth, innerHeight);
  }
  addEventListener('resize', resize);
  resize();

  // ---- state ----
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduce ? 0.3 : 1;
  let seed = Math.random()*10, seedTarget = seed;
  let ptr = [0, 0], ptrOn = 0, ptrTarget = 0;
  // backdrop: 1 = 真っ黒, 2 = プリズム, 0 = ラベンダー (crossfade from A to B)
  const BG_ORDER = [1, 2, 0];
  let bgIdx = 0, bgA = 1, bgB = 1, bgT = 1;
  function nextBackdrop(){
    bgIdx = (bgIdx + 1) % BG_ORDER.length;
    bgA = bgB; bgB = BG_ORDER[bgIdx]; bgT = 0;
    hint.classList.toggle('light', bgB !== 1);
  }
  function reshape(){ seedTarget += 1.5 + Math.random()*2.5; }

  // ---- input: drag = cut, press-and-hold then drag = pull, quick tap = new shape ----
  function toP(e){
    return [ (e.clientX - innerWidth/2) / unit * 1.22, -(e.clientY - innerHeight/2) / unit * 1.22 ];
  }
  let down = null;
  function hideHint(){ hint.classList.add('off'); }
  setTimeout(hideHint, 6000);
  canvas.addEventListener('pointerdown', e => {
    if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
    hideHint();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const p0 = toP(e);
    down = { x: e.clientX, y: e.clientY, t: performance.now(), mode: null, last: p0 };
    ptr = p0;
    down.timer = setTimeout(() => {
      if (down && !down.mode) { down.mode = 'pull'; ptrTarget = 1; }
    }, 320);
  });
  canvas.addEventListener('pointermove', e => {
    if (!down) return;
    const p = toP(e);
    if (!down.mode && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) {
      down.mode = 'cut'; clearTimeout(down.timer);
    }
    if (down.mode === 'pull') ptr = p;
    if (down.mode === 'cut' && Math.hypot(p[0] - down.last[0], p[1] - down.last[1]) > 0.045) {
      addCut(down.last, p); down.last = p;
    }
  });
  function end(e){
    if (down) {
      clearTimeout(down.timer);
      if (down.mode === 'cut' && e) {
        const p = toP(e);
        if (Math.hypot(p[0] - down.last[0], p[1] - down.last[1]) > 0.01) addCut(down.last, p);
      }
      if (!down.mode && performance.now() - down.t < 320) reshape();
    }
    down = null; ptrTarget = 0;
  }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  // ---- loop ----
  let t = 0, last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    t += dt * speed;
    seed += (seedTarget - seed) * Math.min(1, dt * 1.6);
    ptrOn += (ptrTarget - ptrOn) * Math.min(1, dt * 4);
    bgT = Math.min(1, bgT + dt * 1.2);
    for (let i = 0; i < NCUT; i++) lifeBuf[i] = cutLife(now, cutBorn[i]);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform2f(U.uSpan, innerWidth / unit, innerHeight / unit);
    gl.uniform1f(U.uTime, t + 20);
    gl.uniform1f(U.uSeed, seed);
    gl.uniform2f(U.uPtr, ptr[0], ptr[1]);
    gl.uniform1f(U.uPtrOn, ptrOn);
    gl.uniform1f(U.uDisp, 1.0);
    gl.uniform4fv(U.uCuts, cutBuf);
    gl.uniform1fv(U.uCutLife, lifeBuf);
    gl.uniform1f(U.uBgA, bgA); gl.uniform1f(U.uBgB, bgB); gl.uniform1f(U.uBgT, bgT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  APKit.init({
    canvas: canvas,
    gifName: 'split-dew-loop',
    clockFormat: 'spec',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      { label: '✦', name: 'mutate', onClick: function(){ reshape(); } },
      { label: '◐', name: 'backdrop', onClick: function(){ nextBackdrop(); } },
      { label: '↻', name: 'reset', onClick: function(){ clearCuts(); reshape(); } }
    ]
  });
})();
</script>
</body>
</html>
