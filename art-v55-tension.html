<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — TENSION</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* TENSION v55 — ChatGPT作。世界のルール: 空間は伸びた膜で、タップした場所が固定点となり全体を引っ張る。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,t=0,seed=Math.random()*9,anchors=[],N=12,nodes=[];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!nodes.length)for(let y=0;y<N;y++)for(let x=0;x<N;x++)nodes.push({x:x/(N-1),y:y/(N-1),vx:0,vy:0})}addEventListener('resize',size);size();
function draw(loop=false,ph=0){if(loop)t=ph*6.283;else t+=.012;g.fillStyle='rgba(3,3,7,.20)';g.fillRect(0,0,W,H);for(let j=0;j<N;j++){g.beginPath();for(let i=0;i<N;i++){let n=nodes[j*N+i],px=n.x*W,py=n.y*H;if(!loop)for(const a of anchors){let dx=a.x-px,dy=a.y-py,d=Math.hypot(dx,dy)+40,k=260/d;n.vx+=dx/d*k*.0007;n.vy+=dy/d*k*.0007}if(!loop){n.vx*=.96;n.vy*=.96;n.x+=n.vx;n.y+=n.vy}px=n.x*W;py=n.y*H;i?g.lineTo(px,py):g.moveTo(px,py)}g.strokeStyle=`hsla(${(j*13+seed*40)%360} 90% 72% / .62)`;g.lineWidth=1.2;g.stroke()}for(let i=0;i<N;i++){g.beginPath();for(let j=0;j<N;j++){let n=nodes[j*N+i],px=n.x*W,py=n.y*H;j?g.lineTo(px,py):g.moveTo(px,py)}g.strokeStyle=`hsla(${(i*17+seed*40+120)%360} 90% 72% / .42)`;g.stroke()}if(!loop)requestAnimationFrame(()=>draw())}draw();c.addEventListener('pointerdown',e=>{anchors.push({x:e.clientX,y:e.clientY});if(anchors.length>4)anchors.shift()});APKit.init({canvas:c,gifName:'tension-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(true,p),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>anchors=[]}]});
</script></body></html>
