<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FLOWER LAW</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160f;touch-action:none}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let W=0,H=0,DPR=1, flowers=[], laws=[], pointer=null, last=0, reduced=false;

const palette=[
  ['#ef3d36','#ff7a16','#ffb000'],
  ['#d92852','#ef6b65','#ffd22b'],
  ['#ffd21a','#f3a51a','#4b2921'],
  ['#ffb914','#e89b24','#332018'],
  ['#ef2b69','#ff4f86','#f5d76e']
];

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,t){return a+(b-a)*t}
function angleDelta(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  seed();
}

function seed(){
  flowers=[];
  const area=W*H;
  const count=Math.round(clamp(area/12500,55,115));
  for(let i=0;i<count;i++){
    const x=rand(-40,W+40), y=rand(-40,H+40);
    const p=palette[Math.floor(Math.random()*palette.length)];
    flowers.push({x,y,ox:x,oy:y,r:rand(5,14),petals:Math.floor(rand(7,18)),len:rand(10,28),width:rand(.45,.9),phase:rand(0,TAU),spin:rand(-.7,.7),hue:p,energy:rand(.15,.8),law:0,seed:Math.random()*1000,age:Math.random()*10});
  }
  laws=[];
}

function addLaw(x,y){
  laws.push({x,y,r:rand(105,155),life:1,power:1,phase:rand(0,TAU)});
  if(laws.length>12)laws.shift();
}

function drawPetal(f,a,len,w,alpha){
  const ca=Math.cos(a),sa=Math.sin(a);
  const px=f.x+ca*f.r, py=f.y+sa*f.r;
  const tx=f.x+ca*(f.r+len), ty=f.y+sa*(f.r+len);
  const nx=-sa,ny=ca;
  const bend=len*w;
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.quadraticCurveTo(f.x+ca*(f.r+len*.45)+nx*bend,f.y+sa*(f.r+len*.45)+ny*bend,tx,ty);
  ctx.quadraticCurveTo(f.x+ca*(f.r+len*.52)-nx*bend*.8,f.y+sa*(f.r+len*.52)-ny*bend*.8,px,py);
  ctx.closePath();
  ctx.globalAlpha=alpha;
  ctx.fill();
}

function drawFlower(f,t){
  let rot=f.phase+f.spin*.12;
  let localLaw=0,lx=0,ly=0;
  for(const L of laws){
    const dx=f.x-L.x,dy=f.y-L.y,d=Math.hypot(dx,dy);
    if(d<L.r){const q=1-d/L.r;localLaw=Math.max(localLaw,q*L.power);lx+=dx*q;ly+=dy*q;}
  }
  if(localLaw>0){
    const target=Math.atan2(-ly,-lx);
    rot+=angleDelta(rot,target)*localLaw*.72;
  }else if(!reduced){rot+=Math.sin(t*.00025+f.seed)*.035;}
  const growth=1+localLaw*.9;
  const len=f.len*growth;
  const wobble=localLaw>0?Math.sin(t*.002+f.seed)*.12:0;
  const p=f.hue;
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(rot);
  for(let i=0;i<f.petals;i++){
    const a=i/f.petals*TAU;
    const edge=.5+.5*Math.sin(i*1.7+f.seed);
    ctx.fillStyle=p[i%2];
    drawPetal({x:0,y:0,r:f.r},a,len*(.78+edge*.28),f.width*(.75+localLaw*.55)+wobble,.78);
  }
  ctx.restore();
  ctx.globalAlpha=.95;ctx.fillStyle=p[2];ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+localLaw*.18),0,TAU);ctx.fill();
  ctx.globalAlpha=.22;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(f.x-f.r*.25,f.y-f.r*.25,f.r*.2,0,TAU);ctx.fill();ctx.globalAlpha=1;
}

function drawLaws(t){
  for(const L of laws){
    const a=L.r*(.45+.1*Math.sin(t*.001+L.phase));
    const g=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,a);
    g.addColorStop(0,'rgba(255,255,220,.045)');g.addColorStop(1,'rgba(255,255,220,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(L.x,L.y,a,0,TAU);ctx.fill();
  }
}

function frame(t){
  const dt=Math.min(32,t-last||16);last=t;
  ctx.fillStyle='#10160f';ctx.fillRect(0,0,W,H);
  for(const f of flowers){
    if(!reduced){f.x+=Math.sin(t*.00008+f.seed)*dt*.002;f.y+=Math.cos(t*.00007+f.seed*1.7)*dt*.0015;}
    if(f.x<-60)f.x=W+60;if(f.x>W+60)f.x=-60;
    if(f.y<-60)f.y=H+60;if(f.y>H+60)f.y=-60;
    drawFlower(f,t);
  }
  drawLaws(t);requestAnimationFrame(frame);
}

function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=pos(e);pointer={...p,id:e.pointerId};canvas.setPointerCapture(e.pointerId);addLaw(p.x,p.y)},{passive:false});
canvas.addEventListener('pointermove',e=>{
  if(!pointer||e.pointerId!==pointer.id)return;
  const p=pos(e),prevX=pointer.x,prevY=pointer.y;pointer.x=p.x;pointer.y=p.y;
  const L=laws[laws.length-1];
  if(L){L.x=lerp(L.x,p.x,.45);L.y=lerp(L.y,p.y,.45);L.r=clamp(L.r+Math.hypot(p.x-prevX,p.y-prevY)*.03,80,175)}
},{passive:false});
canvas.addEventListener('pointerup',e=>{if(pointer&&e.pointerId===pointer.id)pointer=null},{passive:false});
canvas.addEventListener('pointercancel',e=>{if(pointer&&e.pointerId===pointer.id)pointer=null},{passive:false});
window.addEventListener('resize',resize,{passive:true});
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
