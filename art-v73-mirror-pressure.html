<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIRROR PRESSURE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* MIRROR PRESSURE — ChatGPT作。8枚の鏡面が一つの圧力場を共有し、触れた場所が対称そのものを押し曲げる。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;
uniform vec2 r;uniform float t,seed;uniform vec4 press[8];uniform int n;
vec3 pal(float h){
 float z=fract(h+seed*.017);
 return .5+.5*cos(6.2831853*(z+vec3(.0,.31,.63)));
}
void main(){
 vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
 float touchGlow=0.;
 for(int i=0;i<8;i++){if(i>=n)break;
   vec2 d=p-press[i].xy;
   float age=fract(t-press[i].w);
   float life=1.-smoothstep(.05,1.,age);
   float g=exp(-dot(d,d)/.035)*life;
   p-=d*g*(1.65+press[i].z);
   touchGlow+=g;
 }
 float sector=atan(p.y,p.x),rad=length(p);
 sector=mod(sector+3.14159265/4.,6.2831853/8.)-3.14159265/8.;
 p=vec2(cos(sector),sin(sector))*rad;
 p.x+=.08*sin(rad*9.-t*.8)+.025*sin(rad*31.+t);
 for(int i=0;i<6;i++){
   p=abs(p)-vec2(.31,.18);
   float a=.24*sin(t*.27+float(i)*1.1+seed*.1);p=mat2(cos(a),-sin(a),sin(a),cos(a))*p;
   p*=1.42;
 }
 float pressure=0.;float hueShift=0.;
 for(int i=0;i<8;i++){if(i>=n)break;
   vec2 q=press[i].xy;float qr=length(q);float qa=atan(q.y,q.x);qa=mod(qa+3.14159265/4.,6.2831853/8.)-3.14159265/8.;q=vec2(cos(qa),sin(qa))*qr;
   vec2 d=p-q;float g=exp(-dot(d,d)/(.018+.028*press[i].z));g*=1.-smoothstep(.05,1.,fract(t-press[i].w));pressure+=g*press[i].z;hueShift+=g*fract(t-press[i].w);
   float angle=press[i].w*6.2831853;float ca=cos(angle),sa=sin(angle);p+=vec2(ca*d.x-sa*d.y,sa*d.x+ca*d.y)*g*.18*press[i].z;
 }
 float v=length(p)+.09*sin(p.x*18.+p.y*11.)+.035*cos(p.x*43.-p.y*27.);
 float stripe=sin(v*23.-t*.55+pressure*2.5+touchGlow*2.8);
 float cells=fract(sin(floor(p.x*11.)*12.7+floor(p.y*11.)*78.2+seed*3.1)*43758.5453);
 float spectrum=v*.24+stripe*.07+pressure*.14+hueShift*.13+cells*1.05;
 spectrum+=sin(p.x*13.+p.y*8.)*.12+sin(p.x*29.-p.y*19.)*.075;
 vec3 col=pal(spectrum);
 col=mix(col,pal(spectrum+.23+sin(p.y*17.)*.08),smoothstep(.12,.84,abs(stripe)));
 col+=vec3(1.)*pow(max(0.,1.-abs(stripe)),8.)*.38;
 col+=vec3(1.)*smoothstep(.18,.72,touchGlow)*.22;
 col=.055+col*1.08;
 col*=.92+.12*cos(rad*4.-t);
 o=vec4(pow(max(col,0.),vec3(.76)),1.);
}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
let U={};for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''))}
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*70,press=[],paused=false,currentPhase=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.5,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();
function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}
function draw(ph){gl.useProgram(pr);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(32);press.forEach((q,i)=>a.set(q,i*4));gl.uniform4fv(U.press,a);gl.uniform1i(U.n,press.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);press.push([q[0],q[1],.7+.6*Math.random(),currentPhase]);if(press.length>8)press.shift()});
let start=performance.now();function loop(now){currentPhase=(now-start)*.00035;if(!paused)draw(currentPhase);requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'mirror-pressure-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[
{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*90}},
{label:'↻',name:'reset',onClick:()=>{press=[]}}]});
</script></body></html>
