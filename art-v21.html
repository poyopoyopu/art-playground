<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground — Living Mandala</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060d;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}
.title{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:24px;letter-spacing:.08em;text-shadow:0 2px 18px #000;font-weight:700;font-size:clamp(22px,5vw,42px)}
.sub{position:absolute;top:calc(env(safe-area-inset-top) + 64px);left:24px;opacity:.72;font-size:13px;letter-spacing:.12em}
.panel{position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 20px);display:flex;gap:10px;pointer-events:auto}
button{border:1px solid #ffffff22;background:#0b1120cc;color:#eaf1ff;border-radius:18px;padding:14px 17px;font-size:15px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0007}
.bottom{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:#070b14d9;border:1px solid #ffffff18;border-radius:22px;padding:8px;backdrop-filter:blur(14px);white-space:nowrap}
.bottom button.active{background:#1c2a48;border-color:#7ba7ff88;box-shadow:0 0 25px #638dff44}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 94px);transform:translateX(-50%);opacity:.55;font-size:12px;letter-spacing:.08em;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="title">Art Playground</div>
  <div class="sub">LIVING MANDALA · V21</div>
  <div class="panel"><button id="reset">↻</button></div>
  <div class="hint">触れると、その場所が光ってはじける</div>
  <div class="bottom">
    <button id="random">⤨ RANDOM</button>
  </div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,DPR, t0=performance.now(), seed=Math.random()*1e6;
let mx=.5,my=.5,tx=.5,ty=.5,energy=0,particles=[],rings=[],touches=[];
const pal=[
  [90,220,255],[255,104,205],[255,220,90],[116,255,180],
  [152,124,255],[255,145,92],[130,230,220],[245,245,190]
];
function rand(n){return Math.abs(Math.sin(n*12.9898+seed)*43758.5453)%1}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0);build()}
addEventListener('resize',resize);
function build(){
  particles=[]; rings=[];
  const base=Math.min(W,H)*.46;
  for(let r=0;r<17;r++){
    let rr=base*(.08+r/18*.96);
    let count=Math.max(14,Math.floor(18+r*7));
    rings.push({rr,count,phase:rand(r+2)*Math.PI*2,spin:(rand(r+8)-.5)*.00018,amp:2+rand(r+4)*8});
    for(let i=0;i<count;i++){
      let a=i/count*Math.PI*2+rand(r*91+i)*.08;
      let hue=pal[(i+r*3)%pal.length];
      particles.push({r,i,a,rr,jitter:rand(i+r*77)*12,size:1.2+rand(i*2+r)*4,hue,
        pulse:rand(i*31+r)*Math.PI*2,drift:rand(i*13+r)-.5});
    }
  }
}
function petal(cx,cy,a,len,w,col,alpha,phase){
  x.save();x.translate(cx,cy);x.rotate(a);
  const g=x.createRadialGradient(0,0,1,0,0,len);
  g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
  g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  x.fillStyle=g;x.beginPath();
  x.moveTo(0,0);x.bezierCurveTo(len*.28,-w,len*.72,-w*.55,len,0);
  x.bezierCurveTo(len*.72,w*.55,len*.28,w,0,0);x.fill();x.restore();
}
function draw(now){
  requestAnimationFrame(draw);
  const t=(now-t0)*.001;
  energy+=(0-energy)*.018; mx+=(tx-mx)*.035;my+=(ty-my)*.035;
  x.fillStyle='rgba(3,6,13,.22)';x.fillRect(0,0,W,H);
  const cx=W*.5+(mx-.5)*W*.035,cy=H*.49+(my-.5)*H*.035;
  const base=Math.min(W,H)*.46;
  x.save();x.translate(cx,cy);
  // breathing glow
  let glow=base*.18*(1+Math.sin(t*.55)*.03);
  let bg=x.createRadialGradient(0,0,0,0,0,base*1.18);
  bg.addColorStop(0,'rgba(80,150,255,.055)');bg.addColorStop(.55,'rgba(210,80,255,.018)');bg.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=bg;x.fillRect(-W,-H,W*2,H*2);
  // rings
  for(const R of rings){
    const breathe=1+Math.sin(t*.48+R.phase)*.012+energy*.012;
    const rot=R.phase+t*R.spin*1000;
    for(let i=0;i<R.count;i++){
      let a=i/R.count*Math.PI*2+rot;
      let wave=Math.sin(t*.9+i*.61+R.phase)*R.amp + Math.sin(t*.33+i*1.7)*R.amp*.6;
      let rr=(R.rr+wave)*breathe;
      let px=Math.cos(a)*rr,py=Math.sin(a)*rr;
      let col=pal[(i+Math.floor(R.rr))%pal.length];
      let boost=0;
      for(const tt of touches){
        const d=Math.hypot(cx+px-tt.sx,cy+py-tt.sy);
        if(d<150) boost=Math.max(boost,(1-d/150)*tt.life);
      }
      // living dotted vein
      x.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${Math.min(1,.18+Math.sin(t*1.1+i)*.07+boost*.7)})`;
      x.beginPath();x.arc(px,py,(1.1+(i%3)*.45)*(1+boost*1.6),0,Math.PI*2);x.fill();
      if(i%2===0) petal(px,py,a+Math.sin(t*.6+i)*.06,8+R.rr/base*18,2.5+R.rr/base*5,col,.14+boost*.5,0);
    }
  }
  // main particles: all parts subtly move independently
  for(const p of particles){
    let rr=p.rr+Math.sin(t*.72+p.pulse)*p.jitter*.32+Math.sin(t*.27+p.i)*p.jitter*.18;
    let a=p.a+t*(.018+p.drift*.006)+Math.sin(t*.52+p.pulse)*.012;
    let px=Math.cos(a)*rr,py=Math.sin(a)*rr;
    let boost=0;
    for(const tt of touches){
      const d=Math.hypot(cx+px-tt.sx,cy+py-tt.sy);
      if(d<170) boost=Math.max(boost,(1-d/170)*tt.life);
    }
    let s=p.size*(1+Math.sin(t*1.4+p.pulse)*.24)*(1+boost*1.8);
    x.shadowBlur=(8+s*2)*(1+boost*1.5);x.shadowColor=`rgb(${p.hue.join(',')})`;
    x.fillStyle=`rgba(${p.hue[0]},${p.hue[1]},${p.hue[2]},${Math.min(1,.42+Math.sin(t+p.pulse)*.16+boost*.6)})`;
    x.beginPath();x.arc(px,py,s,0,Math.PI*2);x.fill();
    if((p.i+p.r)%5===0) petal(px,py,a,7+p.r*.75,2.5+p.size,p.hue,.12+boost*.5,0);
  }
  // center mandala
  for(let k=0;k<12;k++){
    let a=k/12*Math.PI*2-t*.08;
    let rr=base*.08*(1+Math.sin(t*.7+k)*.08);
    petal(Math.cos(a)*rr,Math.sin(a)*rr,a,base*.16,base*.04,pal[k%pal.length],.42,0);
  }
  for(let q=0;q<3;q++){
    x.strokeStyle=`rgba(210,235,255,${.18-q*.04})`;x.lineWidth=1;
    x.beginPath();x.arc(0,0,base*(.04+q*.055)*(1+Math.sin(t*.6+q)*.025),0,Math.PI*2);x.stroke();
  }
  x.restore();
  // タッチの波紋(画面座標で描く)
  x.globalCompositeOperation='lighter';
  for(let i=touches.length-1;i>=0;i--){
    const tt=touches[i];
    tt.r+=6; tt.life-=.018;
    if(tt.life<=0){ touches.splice(i,1); continue; }
    x.strokeStyle=`rgba(180,220,255,${Math.max(0,tt.life)*.5})`;
    x.lineWidth=1.5+tt.life*2;
    x.beginPath();x.arc(tt.sx,tt.sy,tt.r,0,Math.PI*2);x.stroke();
  }
  x.globalCompositeOperation='source-over';
}
function wake(clientX,clientY){
  tx=clientX/W; ty=clientY/H; energy=1;
  touches.push({sx:clientX,sy:clientY,r:4,life:1});
  if(touches.length>10) touches.shift();
}
addEventListener('pointermove',e=>{if(e.buttons) wake(e.clientX,e.clientY); else {tx=e.clientX/W;ty=e.clientY/H;energy=Math.min(1,energy+.15);}});
addEventListener('pointerdown',e=>wake(e.clientX,e.clientY));
document.getElementById('reset').onclick=()=>{seed=Math.random()*1e6;build();};
document.getElementById('random').onclick=()=>{seed=Math.random()*1e6;build();};
resize();requestAnimationFrame(draw);
</script>
</body></html>
