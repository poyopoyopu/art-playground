<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020207">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Art Playground — ONE KNOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207;color:#fff}
body{height:100dvh;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.controls{position:fixed;z-index:8;right:4vw;bottom:max(11vh,calc(env(safe-area-inset-bottom) + 56px));display:flex;gap:8px;transition:opacity .6s}
.controls.idle{opacity:0;pointer-events:none}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff25;background:#05050bd9;color:#fff;font-size:14px;box-shadow:0 4px 18px #0008;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.92)}
.btn.act{border-color:#ffffff60;background:#ffffff1e}
.label{position:fixed;z-index:7;left:50%;bottom:max(4vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:8px;letter-spacing:.42em;opacity:.3;pointer-events:none;white-space:nowrap;transition:opacity 1.2s}
.label.hide{opacity:0}
.clock{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:6px;font-family:ui-monospace,"SF Mono",monospace;font-variant-numeric:tabular-nums;pointer-events:none}
.clock.on{display:flex}
.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 16px #000,0 4px 34px #000}
.clock .t i{font-style:normal;opacity:.62}
.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.3em;opacity:.62;text-shadow:0 0 4px #000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="clock" id="clock"><div class="t" id="clockTime">00:00<i>:00</i></div><div class="d" id="clockDate"></div></div>
<div class="label" id="label">ONE KNOT · TOUCH TO CUT THE WORLD</div>
<div id="gifStatus" style="position:fixed;z-index:20;left:50%;top:14%;transform:translateX(-50%);padding:10px 14px;border:1px solid #ffffff28;border-radius:14px;background:#05050bdc;color:#fff;backdrop-filter:blur(12px);font:11px ui-monospace,monospace;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap"></div>
<div class="controls" id="controls">
<button class="btn" id="mutate">✦</button>
<button class="btn" id="wipe">↻</button>
<button class="btn" id="gifBtn">◉</button>
<button class="btn" id="clockBtn">🕐</button>
<button class="btn" id="fsBtn">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<script>
/*
2026-09-11: ONE KNOT — full-field/touch overhaul + mobile performance pass.
The whole screen is now one continuous woven flow field.
Touch is a moving singularity: broad pull + push + vortex + shear.
The old central knot limitation is removed.
*/
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W=1,H=1,D=1,t=0,last=performance.now(),seed=Math.random()*99999;
let mutation=0,clockOn=false,wakeLock=null,idleTimer=null;
let touches=new Map(),mem=[],seeds=[],lastMemAt=0;

const TAU=Math.PI*2;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function rnd(n){n=Math.sin(n*127.1+seed*311.7)*43758.5453;return n-Math.floor(n)}
function hue(h){return `hsl(${((h%360)+360)%360} 100% ${48+16*Math.sin(h*.017+t)}%)`}

function resize(){
  const r=c.getBoundingClientRect();
  D=Math.min(devicePixelRatio||1,1.55);
  W=Math.max(1,Math.floor(r.width*D));H=Math.max(1,Math.floor(r.height*D));
  c.width=W;c.height=H;
  buildSeeds();
}
new ResizeObserver(resize).observe(c);
addEventListener('resize',resize,{passive:true});

function buildSeeds(){
  seeds=[];
  /*
    Full-screen coverage. Strands start at the perimeter as well as inside,
    so the artwork cannot collapse into a central object.
  */
  const gap=Math.max(11,Math.min(16,Math.sqrt(W*H)/58));
  const nx=Math.ceil(W/gap)+1,ny=Math.ceil(H/gap)+1;
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){
    if((x+y*2)%3===0)seeds.push({
      x:x*gap+(rnd(x*17+y*31)-.5)*gap,
      y:y*gap+(rnd(x*41+y*13)-.5)*gap,
      phase:rnd(x*73+y*29)*TAU,
      width:.55+.75*rnd(x*19+y*61)
    });
  }
}
resize();

function vector(x,y,time){
  const m=Math.min(W,H);
  const nx=(x-W*.5)/m,ny=(y-H*.5)/m;
  let vx=0,vy=0;

  // Three scales of one continuous field.
  let a=Math.sin(nx*3.2-time*.28)+Math.cos(ny*4.3+time*.22);
  vx+=Math.sin(ny*5.7+time*.43+a*1.7);
  vy+=Math.cos(nx*4.8-time*.37-a*1.4);

  vx+=.62*Math.sin(ny*11-nx*3+time*.16);
  vy+=.62*Math.cos(nx*9+ny*4-time*.19);

  const r=Math.hypot(nx,ny)+.001,ang=Math.atan2(ny,nx);
  const spiral=Math.sin(r*9-time*.55+Math.sin(ang*6+time*.17)*1.8);
  vx+=(-ny/r)*spiral*.95;
  vy+=( nx/r)*spiral*.95;

  // Old touch memories deform a broad region.
  for(let mi=Math.max(0,mem.length-8);mi<mem.length;mi++){ const q=mem[mi];
    const age=time-q.birth,life=clamp(1-age/34,0,1);
    if(!life)continue;
    const dx=nx-q.x,dy=ny-q.y,d=Math.hypot(dx,dy)+.012;
    const w=Math.exp(-(d*d)/(q.radius*q.radius))*life;
    vx+=(-dy/d)*w*q.twist*3.0;
    vy+=( dx/d)*w*q.twist*3.0;
    vx+=( dx/d)*w*q.pull*2.1;
    vy+=( dy/d)*w*q.pull*2.1;
    vx+=q.vx*w*2.8;vy+=q.vy*w*2.8;
  }

  // Live finger influence is intentionally much larger.
  let fingerCount=0;
  for(const q of touches.values()){ if(fingerCount++>=2) break;
    const dx=nx-q.x,dy=ny-q.y,d=Math.hypot(dx,dy)+.012;
    const w=Math.exp(-(d*d)/(q.radius*q.radius));
    vx+=(-dy/d)*w*q.twist*7.5;
    vy+=( dx/d)*w*q.twist*7.5;
    vx+=( dx/d)*w*q.pull*5.2;
    vy+=( dy/d)*w*q.pull*5.2;
    vx+=q.vx*w*5.0;vy+=q.vy*w*5.0;
  }

  const l=Math.hypot(vx,vy)+.001;
  return [vx/l,vy/l];
}

function draw(now){
  const dt=Math.min(.025,(now-last)/1000);last=now;t+=dt;
  mutation*=Math.pow(.16,dt);

  ctx.fillStyle='#020207';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen';

  const step=Math.max(9,Math.min(13,Math.sqrt(W*H)/66));
  const m=Math.min(W,H);

  for(let s=0;s<seeds.length;s++){
    const q=seeds[s];
    let x=q.x,y=q.y;
    ctx.beginPath();ctx.moveTo(x,y);

    /*
      Longer integration = motion across the entire display rather than a
      decorative knot in the middle.
    */
    for(let k=0;k<30;k++){
      const v=vector(x,y,t+q.phase*.04);
      const sp=step*(1.25+.24*Math.sin(s*.13+t));
      x+=v[0]*sp;y+=v[1]*sp;

      // Wrap at edges: the field is continuous, not bounded by a frame.
      if(x<-8)x=W+8;if(x>W+8)x=-8;
      if(y<-8)y=H+8;if(y>H+8)y=-8;
      ctx.lineTo(x,y);
    }

    const base=125+(s%53)*4.8+t*25+mutation*55;
    ctx.globalAlpha=.035+.095*(.5+.5*Math.sin(s*.29+t*1.5));
    ctx.lineWidth=q.width*D;
    ctx.strokeStyle=hue(base);
    ctx.stroke();

    // Sparse bright strands reveal the structure.
    if(s%17===0){
      ctx.globalAlpha=.18;
      ctx.lineWidth=1.15*D;
      ctx.strokeStyle=hue(base+115);
      ctx.stroke();
    }
  }

  // Touch waves expand over the field and slowly disappear.
  for(let mi=Math.max(0,mem.length-8);mi<mem.length;mi++){ const q=mem[mi];
    const life=clamp(1-(t-q.birth)/34,0,1);
    if(life<=0)continue;
    const r=q.radius*m*(1+(t-q.birth)*.42);
    ctx.globalAlpha=.045*life;
    ctx.lineWidth=1.2*D;
    ctx.strokeStyle=hue(q.hue+t*35);
    ctx.beginPath();
    for(let i=0;i<=110;i++){
      const a=i/110*TAU;
      const wob=1+.10*Math.sin(a*9-t*2.0)+.055*Math.sin(a*17+t);
      const x=(q.x+Math.cos(a)*r/m*wob)*m;
      const y=(q.y+Math.sin(a)*r/m*wob)*m;
      if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
    }
    ctx.stroke();
  }

  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function pos(e){
  const r=c.getBoundingClientRect(),m=Math.min(r.width,r.height);
  return {x:(e.clientX-r.left-r.width/2)/m,y:(e.clientY-r.top-r.height/2)/m};
}
function memory(p,strength=1){
  mem.push({
    x:p.x,y:p.y,radius:(.16+.075*Math.random())*strength,
    pull:(Math.random()-.5)*2.8,twist:(Math.random()-.5)*3.2,
    vx:0,vy:0,hue:Math.random()*360,birth:t
  });
  if(mem.length>10)mem.splice(0,mem.length-10);
  mutation+=(Math.random()-.5)*1.6*strength;
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);
  touches.set(e.pointerId,{...p,px:p.x,py:p.y,vx:0,vy:0,radius:.27,
    pull:(Math.random()-.5)*2.4,twist:(Math.random()-.5)*2.4});
  memory(p,1.6);
  document.getElementById('label').classList.add('hide');
  bumpIdle();
},{passive:false});

c.addEventListener('pointermove',e=>{
  const q=touches.get(e.pointerId);if(!q)return;
  const p=pos(e),dx=p.x-q.px,dy=p.y-q.py,v=Math.hypot(dx,dy);
  q.px=p.x;q.py=p.y;q.x=p.x;q.y=p.y;
  q.vx=clamp(dx*1.8,-.09,.09);q.vy=clamp(dy*1.8,-.09,.09);
  q.radius=clamp(.15+v*9,.15,.40);
  // Direction changes the topology: horizontal/vertical drag produce
  // noticeably different shear and rotation.
  q.twist=clamp(q.twist+(dx-dy)*22,-4.5,4.5);
  q.pull=clamp(q.pull+(dx+dy)*10,-4,4);
  if(v>.007 && t-lastMemAt>.028){ lastMemAt=t; memory(p,.62+v*10); }
},{passive:true});

c.addEventListener('pointerup',e=>{
  const q=touches.get(e.pointerId);
  if(q)memory({x:q.x,y:q.y},1.1);
  touches.delete(e.pointerId);
});
c.addEventListener('pointercancel',e=>touches.delete(e.pointerId));
c.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('mutate').onclick=()=>{
  seed=Math.random()*99999;mutation+=(Math.random()-.5)*10;
  for(let i=0;i<7;i++)memory({x:(Math.random()-.5)*1.8,y:(Math.random()-.5)*2.1},.7);
};
document.getElementById('wipe').onclick=()=>{
  mem=[];touches.clear();mutation+=5;
};

const ctrl=document.getElementById('controls');
function bumpIdle(){
  ctrl.classList.remove('idle');clearTimeout(idleTimer);
  if(clockOn)idleTimer=setTimeout(()=>ctrl.classList.add('idle'),4000);
}
addEventListener('pointerdown',bumpIdle,{passive:true});


/* GIF export — established 3 sec / 20 fps / 460px square preset. */
const gifStatus=document.getElementById('gifStatus');
const gifBtn=document.getElementById('gifBtn');

function showGifStatus(s){
  gifStatus.textContent=s;
  gifStatus.style.opacity='1';
}
function hideGifStatus(){gifStatus.style.opacity='0'}

async function exportGIF(){
  if(typeof GIF==='undefined'){
    showGifStatus('GIF ENGINE UNAVAILABLE · RELOAD');
    setTimeout(hideGifStatus,1800);
    return;
  }

  gifBtn.disabled=true;
  gifBtn.classList.add('act');

  const FPS=20, FRAMES=60, SIZE=460;
  const cap=document.createElement('canvas');
  cap.width=SIZE; cap.height=SIZE;
  const cc=cap.getContext('2d',{alpha:false});

  // Center crop of the live artwork.
  const side=Math.min(W,H);
  const sx=(W-side)*.5, sy=(H-side)*.5;

  showGifStatus('WARMING UP · 0%');

  // Warm up twice before capture, as in the established GIF workflow.
  await new Promise(resolve =>
    requestAnimationFrame(() => requestAnimationFrame(resolve))
  );

  const gif=new GIF({
    workers:2,
    quality:8,
    width:SIZE,
    height:SIZE,
    workerScript:'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
  });

  for(let i=0;i<FRAMES;i++){
    await new Promise(requestAnimationFrame);
    cc.clearRect(0,0,SIZE,SIZE);
    cc.drawImage(c,sx,sy,side,side,0,0,SIZE,SIZE);
    gif.addFrame(cc,{copy:true,delay:1000/FPS});
    if(i%3===0) showGifStatus(`RECORDING · ${Math.round((i+1)/FRAMES*100)}%`);
  }

  showGifStatus('ENCODING · 0%');

  await new Promise((resolve,reject)=>{
    gif.on('progress',p=>showGifStatus(`ENCODING · ${Math.round(p*100)}%`));
    gif.on('finished',blob=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='one-knot-3s.gif';
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>a.remove(),1200);
      setTimeout(()=>URL.revokeObjectURL(url),10000);
      showGifStatus(`DONE · ${(blob.size/1024/1024).toFixed(1)} MB`);
      setTimeout(hideGifStatus,2600);
      resolve();
    });
    gif.on('abort',()=>reject(new Error('aborted')));
    gif.render();
  }).catch(err=>{
    console.error(err);
    showGifStatus('GIF EXPORT FAILED');
    setTimeout(hideGifStatus,2200);
  });

  gifBtn.disabled=false;
  gifBtn.classList.remove('act');
}
gifBtn.addEventListener('click',exportGIF);

/* Clock — established centered presentation. */
const clock=document.getElementById('clock'),ct=document.getElementById('clockTime'),cd=document.getElementById('clockDate');
const week=['日','月','火','水','木','金','土'],pad=n=>String(n).padStart(2,'0');
function tick(){
  if(!clockOn)return;
  const d=new Date();
  ct.innerHTML=pad(d.getHours())+':'+pad(d.getMinutes())+'<i>:'+pad(d.getSeconds())+'</i>';
  cd.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 ('+week[d.getDay()]+')';
}
function clockLoop(){tick();setTimeout(clockLoop,1000-(Date.now()%1000)+8)}clockLoop();
async function wake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&clockOn&&!wakeLock)wake()});
document.getElementById('clockBtn').onclick=function(){
  clockOn=!clockOn;clock.classList.toggle('on',clockOn);this.classList.toggle('act',clockOn);
  if(clockOn)wake();else{try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null;ctrl.classList.remove('idle')}
  bumpIdle();
};
document.getElementById('fsBtn').onclick=async()=>{
  const d=document.documentElement,fs=document.fullscreenElement||document.webkitFullscreenElement;
  try{
    if(fs)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(d.requestFullscreen)await d.requestFullscreen();
    else if(d.webkitRequestFullscreen)await d.webkitRequestFullscreen();
    else alert('Safariでは「ホーム画面に追加」でフチなし表示にできます');
  }catch(_){}
};
setTimeout(()=>document.getElementById('label').classList.add('hide'),9000);
</script>
</body>
</html>
