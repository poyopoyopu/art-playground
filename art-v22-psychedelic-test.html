<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Art Playground v22</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;color:#f5f3ff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#title{position:absolute;left:6vw;top:max(6vh,42px);text-shadow:0 3px 22px #000}
#title b{display:block;font-size:clamp(27px,7vw,45px);letter-spacing:.01em}
#title span{display:block;margin-top:7px;font-size:11px;letter-spacing:.32em;opacity:.58}
#sub{position:absolute;bottom:5.5vh;width:100%;text-align:center;font-size:11px;letter-spacing:.25em;opacity:.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="title"><b>Art Playground</b><span>PSYCHEDELIC LIVING MANDALA</span></div><div id="sub">触れると、その場所が輝いて目覚める</div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let W,H,D,staticLayer,sc,items=[],dust=[],touches=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const hues=[0,12,25,38,52,66,84,108,136,165,188,204,222,244,266,286,308,328,342];

function setup(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 staticLayer=document.createElement('canvas');
 staticLayer.width=W*D;staticLayer.height=H*D;
 sc=staticLayer.getContext('2d');sc.setTransform(D,0,0,D,0,0);
 build();
}
function stroke(h,a,w){
 sc.strokeStyle=`hsla(${(h+360)%360},95%,72%,${a})`;sc.lineWidth=w;
}
function fill(h,a,l=72){
 sc.fillStyle=`hsla(${(h+360)%360},96%,${l}%,${a})`;
}
function petal(cx,cy,ang,len,w,h,a){
 sc.save();sc.translate(cx,cy);sc.rotate(ang);
 stroke(h,a,Math.max(.45,w*.035));
 sc.beginPath();sc.moveTo(0,0);
 sc.bezierCurveTo(len*.15,-w,len*.82,-w*.78,len,0);
 sc.bezierCurveTo(len*.82,w*.78,len*.15,w,0,0);
 sc.stroke();
 sc.restore();
}
function drawMandala(p){
 const {x,y,r,h,seed}=p;
 sc.save();sc.translate(x,y);sc.rotate(seed);
 // dark jewel halo
 const g=sc.createRadialGradient(0,0,r*.04,0,0,r*1.22);
 g.addColorStop(0,`hsla(${h},90%,28%,.10)`);
 g.addColorStop(.72,`hsla(${(h+80)%360},85%,20%,.025)`);
 g.addColorStop(1,'transparent');
 sc.fillStyle=g;sc.beginPath();sc.arc(0,0,r*1.22,0,TAU);sc.fill();

 const layers=4;
 for(let L=0;L<layers;L++){
   const n=7+((Math.floor(seed*10)+L*3)%7);
   const rr=r*(.16+L*.19);
   for(let i=0;i<n;i++){
     const a=i*TAU/n+L*.09;
     petal(0,0,a,rr*(1.05+L*.10),rr*.42,(h+L*27+i*5)%360,.72-L*.08);
     // inner facet line
     sc.save();sc.rotate(a);
     stroke((h+95+L*18)%360,.30,Math.max(.35,r*.007));
     sc.beginPath();sc.moveTo(rr*.20,0);sc.lineTo(rr*.68,-rr*.15);sc.lineTo(rr*.86,0);sc.lineTo(rr*.68,rr*.15);sc.closePath();sc.stroke();
     sc.restore();
   }
   stroke((h+L*34)%360,.30,Math.max(.45,r*.009));
   sc.beginPath();sc.arc(0,0,rr*.92,0,TAU);sc.stroke();
 }
 // eye-like center
 for(let k=0;k<5;k++){
   stroke((h+k*43)%360,.82-k*.11,Math.max(.6,r*.018));
   sc.beginPath();sc.arc(0,0,r*(.055+k*.055),0,TAU);sc.stroke();
 }
 fill((h+55)%360,.9,78);sc.beginPath();sc.arc(0,0,r*.035,0,TAU);sc.fill();
 // beads
 const beads=10+Math.floor(r/15);
 for(let i=0;i<beads;i++){
   const a=i*TAU/beads+seed*.37,d=r*rnd(.48,1.04);
   const br=Math.max(.6,r*rnd(.012,.026));
   fill((h+i*19)%360,.74,78);
   sc.beginPath();sc.arc(Math.cos(a)*d,Math.sin(a)*d,br,0,TAU);sc.fill();
 }
 sc.restore();
}
function build(){
 // deep psychedelic background
 const bg=sc.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.82);
 bg.addColorStop(0,'#0a0614');bg.addColorStop(.46,'#050712');bg.addColorStop(1,'#010207');
 sc.fillStyle=bg;sc.fillRect(0,0,W,H);

 items=[];dust=[];
 // deliberately layered hierarchy: big anchors -> medium -> small
 const groups=[
  [Math.max(7,Math.floor(W*H/105000)),105,170],
  [Math.max(20,Math.floor(W*H/36000)),55,100],
  [Math.max(45,Math.floor(W*H/15000)),25,52],
  [Math.max(65,Math.floor(W*H/9000)),10,26]
 ];
 let k=0;
 for(const [count,min,max] of groups){
   for(let i=0;i<count;i++){
     const p={x:rnd(-20,W+20),y:rnd(-20,H+20),r:rnd(min,max),
       h:pick(hues),seed:rnd(0,TAU),phase:rnd(0,TAU),rate:rnd(.00035,.0012),group:k,boost:0};
     items.push(p);drawMandala(p);
   }k++;
 }
 // micro universe between mandalas
 const n=Math.min(1900,Math.max(500,Math.floor(W*H/430)));
 for(let i=0;i<n;i++){
   const x=rnd(0,W),y=rnd(0,H),h=pick(hues),r=rnd(.35,1.65);
   fill(h,rnd(.22,.82),rnd(60,84));sc.beginPath();sc.arc(x,y,r,0,TAU);sc.fill();
   if(i%4===0){
     const a=rnd(0,TAU),d=rnd(4,18);
     stroke((h+35)%360,.20,.5);
     sc.beginPath();sc.moveTo(x,y);sc.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);sc.stroke();
   }
   dust.push({x,y,h,r,p:rnd(0,TAU),s:rnd(.3,1.3),kx:0,ky:0});
 }
}
function draw(t){
 ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);
 ctx.drawImage(staticLayer,0,0,W,H);

 ctx.globalCompositeOperation='lighter';
 for(let i=0;i<items.length;i++){
   const p=items[i];
   if(p.boost>0.001) p.boost*=0.94; else p.boost=0;
   if(p.group>1 && p.boost<0.02){ if(i%2) continue; } else if(i%2 && p.boost<0.02) continue;
   const q=Math.min(1.4,.5+.5*Math.sin(t*p.rate+p.phase)+p.boost);
   const rr=p.r*(.12+.055*q);
   ctx.strokeStyle=`hsla(${(p.h+75)%360},100%,80%,${Math.min(1,.08+.12*q)})`;
   ctx.lineWidth=1+q*1.2;
   ctx.beginPath();ctx.arc(p.x,p.y,rr,0,TAU);ctx.stroke();
   ctx.strokeStyle=`hsla(${p.h},100%,75%,${Math.min(1,.05+.08*q)})`;
   ctx.beginPath();ctx.arc(p.x,p.y,rr*1.75,0,TAU);ctx.stroke();
   if(p.boost>0.15){
     ctx.strokeStyle=`hsla(${(p.h+150)%360},100%,85%,${Math.min(.9,p.boost*.6)})`;
     ctx.lineWidth=1.4;
     ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.1+p.boost*.4),0,TAU);ctx.stroke();
   }
 }
 // sparse drifting sparks(タッチで押しのけられる)
 for(let i=0;i<dust.length;i+=6){
   const d=dust[i];
   d.kx*=0.92; d.ky*=0.92;
   const x=d.x+Math.sin(t*.00035*d.s+d.p)*2.5+d.kx;
   const y=d.y+Math.cos(t*.00042*d.s+d.p)*3+d.ky;
   const a=.15+.28*(.5+.5*Math.sin(t*.001*d.s+d.p));
   ctx.fillStyle=`hsla(${d.h},100%,78%,${a})`;
   ctx.beginPath();ctx.arc(x,y,d.r,0,TAU);ctx.fill();
 }
 // タッチの波紋
 for(let i=touches.length-1;i>=0;i--){
   const tp=touches[i];
   tp.r+=6; tp.life-=.02;
   if(tp.life<=0){ touches.splice(i,1); continue; }
   ctx.strokeStyle=`hsla(${tp.h},100%,80%,${Math.max(0,tp.life)*.55})`;
   ctx.lineWidth=1.5+tp.life*2;
   ctx.beginPath();ctx.arc(tp.x,tp.y,tp.r,0,TAU);ctx.stroke();
 }
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(draw);
}

function wake(x,y){
 touches.push({x,y,r:5,life:1,h:pick(hues)});
 for(const p of items){
   const d=Math.hypot(p.x-x,p.y-y);
   const range=180+p.r;
   if(d<range) p.boost=Math.min(1.3,p.boost+(1-d/range)*1.1);
 }
 for(let i=0;i<dust.length;i+=6){
   const d=dust[i];
   const dx=d.x-x, dy=d.y-y, dist=Math.hypot(dx,dy)||1;
   if(dist<160){
     const k=(1-dist/160)*18;
     d.kx+=(dx/dist)*k; d.ky+=(dy/dist)*k;
   }
 }
}
function canvasPos(e){
 const r=c.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
c.addEventListener('pointerdown',e=>{const p=canvasPos(e);wake(p.x,p.y);});
c.addEventListener('pointermove',e=>{if(e.buttons){const p=canvasPos(e);wake(p.x,p.y);}});

addEventListener('resize',setup,{passive:true});
setup();requestAnimationFrame(draw);
})();
</script>
</body></html>
