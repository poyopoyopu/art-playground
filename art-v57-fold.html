<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — FOLD</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* FOLD v57 — ChatGPT作。世界のルール: 空間は紙のように折れ、タップした場所が新しい折り目となって向こう側の世界を反転させる。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,t=0,seed=Math.random()*9,fold={x:.5,y:.5,a:0},target={x:.5,y:.5};function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D}addEventListener('resize',size);size();
function draw(loop=false,ph=0){if(loop)t=ph*6.283;else t+=.01;g.setTransform(D,0,0,D,0,0);g.fillStyle='rgba(3,3,7,.18)';g.fillRect(0,0,W,H);if(!loop){fold.x+=(target.x-fold.x)*.012;fold.y+=(target.y-fold.y)*.012;fold.a+=.0025}let ca=Math.cos(fold.a),sa=Math.sin(fold.a),S=Math.min(W,H);for(let y=-10;y<=10;y++)for(let z=-10;z<=10;z++){let u=z/10,v=y/10,px=W*(.5+u*.46),py=H*(.5+v*.46),dx=px-fold.x*W,dy=py-fold.y*H,side=dx*ca+dy*sa,bend=Math.tanh(side/(75+25*Math.sin(t*.4)))*.55,rx=fold.x*W+dx*(1-bend),ry=fold.y*H+dy*(1-bend),h=(Math.atan2(ry-H/2,rx-W/2)/6.283+.5+seed*.02)%1;g.fillStyle=`hsla(${h*360} 90% 72% / .72)`;g.fillRect(rx,ry,2,2)}g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1;g.beginPath();g.moveTo(fold.x*W-140*sa,fold.y*H+140*ca);g.lineTo(fold.x*W+140*sa,fold.y*H-140*ca);g.stroke();if(!loop)requestAnimationFrame(()=>draw())}draw();c.addEventListener('pointerdown',e=>{target.x=e.clientX/W;target.y=e.clientY/H;fold.a+=Math.PI/2});APKit.init({canvas:c,gifName:'fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(true,p),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>{target={x:.5,y:.5};fold={x:.5,y:.5,a:0}}}]});
</script></body></html>
