<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Infection">
<title>Art Playground — INFECTION</title>
<script src="ap-kit.js"></script>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block}
  #ui{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 12px);color:#fff;z-index:2;
    font-size:11px;letter-spacing:.18em;opacity:.66;pointer-events:none;text-transform:uppercase;
    text-shadow:0 1px 8px #000}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);transform:translateX(-50%);
    color:#fff;font-size:10px;letter-spacing:.12em;opacity:.38;pointer-events:none;white-space:nowrap;
    text-shadow:0 1px 8px #000;transition:opacity 1.2s}
</style>
</head>
<body>
<div id="ui">INFECTION / TOUCH THE LAW</div>
<div id="hint">TAP — CHANGE THE LAW · HOLD — FEED IT</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>
let pts=[];
let scars=[];
let law=0;
let pulse=0;
let seed;
let pal;
const TAU=Math.PI*2;

/* Each universe gets its own colour scheme instead of the fixed purple.
   Two hues carry the body, a third — pushed roughly opposite them — marks the
   infected regions, so scars always read as foreign to their surroundings. */
function makePalette(){
  const h1=Math.random()*360;
  const spread=55+Math.random()*175;
  const h2=(h1+spread*(Math.random()<.5?1:-1)+360)%360;
  /* Put the scar hue in the widest empty stretch of the colour wheel, not
     simply opposite h1 — otherwise it can land right on h2 and the infection
     stops reading as foreign. */
  const gap=((h2-h1)+360)%360;
  const mid=(gap>=180)? h1+gap/2 : h2+(360-gap)/2;
  const room=Math.max(gap,360-gap)/2;
  const jitter=(Math.random()-.5)*2*Math.max(0,room-48);
  const h3=(mid+jitter+360)%360;
  return {
    h1:h1, h2:h2, h3:h3,
    s1:.45+Math.random()*.45,
    s3:.60+Math.random()*.40,
    v:.75+Math.random()*.25,
    bg:6+Math.random()*22,          // how fast the image forgets
    warm:Math.random()<.5
  };
}
function hsv(h,s,v){
  h=((h%360)+360)%360/60;
  const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=t;break;
    case 3:r=p;g=q;b=v;break; case 4:r=t;g=p;b=v;break; default:r=v;g=p;b=q;
  }
  return [r*255,g*255,b*255];
}

function setup(){
  createCanvas(windowWidth,windowHeight);
  pixelDensity(Math.min(2,window.devicePixelRatio||1));
  seed=floor(random(1e6));
  randomSeed(seed);
  pal=makePalette();
  build();
  background(0);
  APKit.init({
    canvas:document.querySelector('canvas'),
    gifName:'infection-loop',
    loopFrame:function(phase){renderScene(phase)},
    buttons:[
      {label:'\u2726',name:'mutate',onClick:function(){
        seed=floor(random(1e6));randomSeed(seed);pal=makePalette();
        scars=[];law++;pulse=1;background(0);
      }},
      {label:'\u21bb',name:'reset',onClick:function(){scars=[];law=0;background(0)}}
    ]
  });
  setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0'},9000);
}

function build(){
  pts=[];
  const step=max(5,min(10,width/105));
  for(let x=step/2;x<width;x+=step){
    for(let y=step/2;y<height;y+=step){
      pts.push({x:x,y:y,ox:x,oy:y,phase:random(TWO_PI),w:random(.5,1.5)});
    }
  }
}

/* P is the loop phase while exporting, null while live. Anything that would be
   frameCount*k goes through K so the last frame lands exactly on the first.
   frameCount advances about 60 times a second, hence the *60. */
function K(k,P){
  if(P===null||P===undefined)return frameCount*k;
  return Math.max(1,Math.round(k*60*APKit.LOOP_DUR/TAU))*P;
}

function renderScene(P){
  const live=(P===null||P===undefined);
  background(0,pal.bg);
  if(live)pulse*=.94;

  noStroke();
  for(const p of pts){
    let dx=p.x-width*.5, dy=p.y-height*.5;
    let r=sqrt(dx*dx+dy*dy);
    let a=atan2(dy,dx);

    let field =
      sin(r*.018 - K(.008,P) + p.phase*.25) +
      .55*sin(a*3 + K(.004,P)) +
      .35*sin((dx-dy)*.012);

    // Every scar rewrites the space around it: points are seized and twisted,
    // and the direction of the twist flips with each new law.
    let local=0;
    for(const s of scars){
      let sx=p.x-s.x, sy=p.y-s.y;
      let d=sqrt(sx*sx+sy*sy);
      if(d<s.radius){
        let q=1-d/s.radius;
        local += q*q;
        const twist=(law%2===0?1:-1)*q*1.8;
        const tx=sx*cos(twist)-sy*sin(twist);
        const ty=sx*sin(twist)+sy*cos(twist);
        p.x=s.x+tx;
        p.y=s.y+ty;
      }
    }
    p.x += (p.ox-p.x)*.018;
    p.y += (p.oy-p.y)*.018;

    let body = pow(max(0, sin(r*.010 + sin(a*2)*1.8 + K(.012,P) + law)), 8);
    body += local*1.7;

    let q = .5 + .5*sin(r*.035 - K(.025,P) + p.phase);
    let size = 1.1 + 2.5*body + 1.7*local;

    let col;
    if(local>.03){
      col=hsv(pal.h3 + q*40, pal.s3, pal.v);
    }else{
      const h=pal.h1 + (pal.h2-pal.h1)*q;
      const lift=pal.warm? body*.25 : -body*.25;
      col=hsv(h + lift*60, pal.s1*(.55+.45*body), .22 + .78*min(1,body+.18));
    }
    fill(col[0],col[1],col[2],110+145*min(1,body+local));
    rect(p.x-size/2,p.y-size/2,size,size);
  }

  // Scars only age in live play. During a loop they are held still, so the
  // infection cannot half-heal and jump back at the seam.
  for(let i=scars.length-1;i>=0;i--){
    const s=scars[i];
    if(live){ s.radius += 1.2; s.life -= 1; }
    noFill();
    const ring=hsv(pal.h3,pal.s3,1);
    stroke(ring[0],ring[1],ring[2],18);
    circle(s.x,s.y,s.radius*2);
    if(s.life<0) scars.splice(i,1);
  }

  noStroke();
  fill(255,70);
  const beat=live?pulse:(.5+.5*sin(P));
  circle(width*.5,height*.5,2+beat*10);
}

function draw(){
  if(window.APKit && APKit.isExporting())return;
  renderScene(null);
}

function touchLaw(x,y,force){
  force=(force===undefined)?1:force;
  law++;
  pulse=1;
  scars.push({x:x,y:y,radius:22+force*16,life:90+force*50});
  if(scars.length>7) scars.shift();
  const h=document.getElementById('hint');
  if(h)h.style.opacity='0';
}

// the kit's buttons sit over the canvas, so taps on them must not also infect
function insideUI(x,y){
  const el=document.elementFromPoint(x,y);
  return !!(el && el.closest && el.closest('.apk-ctrl'));
}
function mousePressed(){
  if(insideUI(mouseX,mouseY))return;
  touchLaw(mouseX,mouseY,1);
  return false;
}
function mouseDragged(){
  if(frameCount%3===0) touchLaw(mouseX,mouseY,.55);
  return false;
}
function touchStarted(){
  if(touches.length){
    if(insideUI(touches[0].x,touches[0].y))return;
    touchLaw(touches[0].x,touches[0].y,1);
  }
  return false;
}
function touchMoved(){
  if(touches.length && frameCount%3===0)
    touchLaw(touches[0].x,touches[0].y,.55);
  return false;
}
function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  build();
  background(0);
}
</script>
</body>
</html>
