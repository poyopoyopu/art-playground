<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ART PLAYGROUND</title>
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#050507;
    --panel:#0c0c12;
    --line:#1c1c25;
    --line-2:#28282f;
    --text-1:#f2f2f7;
    --text-2:#84848f;
    --text-3:#4d4d58;
    --a:#7ad9ff;
    --b:#ff7ad9;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text-1); }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid var(--a); outline-offset:3px; border-radius:4px; }

  .mono{
    font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }

  /* ambient light drift + a very faint grain — the only motion and the only
     texture on the page, so neither competes with the live previews */
  .field{ position:fixed; inset:0; z-index:-2; overflow:hidden; }
  .field::before{
    content:""; position:absolute; inset:-20%;
    background:
      radial-gradient(38vw 38vw at 18% 6%, rgba(122,217,255,.10), transparent 60%),
      radial-gradient(42vw 42vw at 90% 74%, rgba(255,122,217,.08), transparent 60%);
    filter:blur(10px);
    animation:drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translate3d(0,0,0) scale(1); }
    to{ transform:translate3d(-2%,2%,0) scale(1.06); }
  }
  .grain{ position:fixed; inset:0; z-index:-1; opacity:.05; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .wrap{ max-width:640px; margin:0 auto; padding:28px 18px 56px; position:relative; }

  @media (prefers-reduced-motion: no-preference){
    .wrap{ animation:rise .6s cubic-bezier(.2,.7,.2,1) both; }
  }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  header.top{ padding:2px 2px 26px; }
  header.top .eyebrow{
    display:flex; align-items:center; gap:9px;
    font-size:10.5px; letter-spacing:.28em; color:var(--text-2);
  }
  header.top .eyebrow::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background:linear-gradient(135deg,var(--a),var(--b));
    box-shadow:0 0 10px rgba(122,217,255,.7);
  }
  header.top h1{ font-size:24px; font-weight:700; letter-spacing:-.01em; margin:10px 0 8px; }
  header.top p{ margin:0; font-size:13px; line-height:1.75; color:var(--text-2); max-width:46ch; }

  .prevbar{ display:flex; justify-content:flex-end; margin:22px 0 0; }
  #prevToggle{
    font-family:inherit; border:1px solid var(--line-2); background:var(--panel); color:var(--text-2);
    border-radius:20px; padding:7px 13px; font-size:10.5px; letter-spacing:.12em;
  }
  #prevToggle.off{ color:var(--text-3); }

  h2.label{ font-size:10.5px; letter-spacing:.24em; color:var(--text-2); font-weight:600; margin:26px 2px 10px; }

  .current{
    position:relative; display:block; aspect-ratio:4/5; border-radius:20px;
    overflow:hidden; border:1px solid var(--line-2); background:#000;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.75);
  }
  .current::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px; z-index:2;
    background:linear-gradient(90deg,var(--a),var(--b));
  }
  .current iframe{
    position:absolute; top:0; left:0; width:460px; height:900px; border:0;
    pointer-events:none; transform-origin:top left;
  }
  .current .cap{
    position:absolute; left:0; right:0; bottom:0; padding:22px;
    background:linear-gradient(to top, rgba(0,0,0,.88) 14%, rgba(0,0,0,.4) 55%, transparent);
  }
  .current .tag{
    display:flex; align-items:center; gap:7px;
    font-size:10px; letter-spacing:.24em; color:var(--text-2); margin-bottom:10px;
  }
  .current .tag::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--a);
    box-shadow:0 0 8px var(--a); animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .current .tag::before{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .current .name{
    font-size:11vw; line-height:.98; font-weight:800; letter-spacing:-.02em;
    color:var(--text-1); text-wrap:balance;
  }

  /* LOG is a list, not a card grid — it reads top to bottom, newest first */
  .log{ border-top:1px solid var(--line); }
  .entry{ display:flex; align-items:center; gap:14px; padding:13px 2px; border-bottom:1px solid var(--line); transition:background-color .15s; }
  .entry:active{ background:rgba(255,255,255,.03); }
  .entry .thumb{ position:relative; flex:0 0 auto; width:64px; height:64px; border-radius:12px; overflow:hidden; background:#000; border:1px solid var(--line-2); }
  .entry .thumb iframe{ position:absolute; top:0; left:0; width:460px; height:900px; border:0; pointer-events:none; transform-origin:top left; }
  .entry .name{ flex:1 1 auto; min-width:0; font-size:15.5px; font-weight:700; letter-spacing:-.005em; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry .arrow{ flex:0 0 auto; color:var(--text-3); font-size:15px; transition:transform .15s, color .15s; }
  .entry:active .arrow{ color:var(--text-2); transform:translateX(2px); }

  .entry:not(.live) .thumb{ background:radial-gradient(120% 120% at 30% 0%,#17171f 0%,#0a0a0f 70%); }
  .current:not(.live){ background:radial-gradient(120% 90% at 50% 0%,#17171f 0%,#0a0a0f 70%); }
  .entry:not(.live) .thumb iframe,
  .current:not(.live) iframe{ visibility:hidden; }
  .entry:not(.live) .thumb::after,
  .current:not(.live) .cap::after{ content:"▷"; position:absolute; color:var(--text-3); pointer-events:none; }
  .entry:not(.live) .thumb::after{ inset:0; display:grid; place-items:center; font-size:14px; }
  .current:not(.live) .cap::after{ top:-40px; left:22px; font-size:20px; }

  .credit{ padding:30px 2px 0; font-size:10.5px; letter-spacing:.1em; color:var(--text-3); text-align:center; }
</style>
</head>
<body>
<div class="field"></div>
<div class="grain"></div>
<div class="wrap">
  <header class="top">
    <div class="eyebrow mono">ART PLAYGROUND</div>
    <h1>実験ログ</h1>
    <p>ジェネラティブアートの実験場。遊んで、壊して、進化させる。タップすると、その作品のページへそのまま移動するよ。</p>
  </header>

  <div class="prevbar"><button id="prevToggle" class="mono">PREVIEW ON</button></div>

  <a class="current" href="art-v49-feather-fold.html">
    <iframe data-src="art-v49-feather-fold.html" loading="lazy"></iframe>
    <div class="cap">
      <div class="tag mono">CURRENT</div>
      <div class="name">FEATHER FOLD</div>
    </div>
  </a>

  <h2 class="label">LOG</h2>
  <div class="log">
    <a class="entry" href="art-v47-infection.html">
      <div class="thumb"><iframe data-src="art-v47-infection.html" loading="lazy"></iframe></div>
      <div class="name">INFECTION</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v36-art-of-becoming.html">
      <div class="thumb"><iframe data-src="art-v36-art-of-becoming.html" loading="lazy"></iframe></div>
      <div class="name">ART OF BECOMING</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v35-one-knot.html">
      <div class="thumb"><iframe data-src="art-v35-one-knot.html" loading="lazy"></iframe></div>
      <div class="name">ONE KNOT</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v31-divided-law.html">
      <div class="thumb"><iframe data-src="art-v31-divided-law.html" loading="lazy"></iframe></div>
      <div class="name">DIVIDED LAW</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v30-standing-law.html">
      <div class="thumb"><iframe data-src="art-v30-standing-law.html" loading="lazy"></iframe></div>
      <div class="name">STANDING LAW</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v28-living-order.html">
      <div class="thumb"><iframe data-src="art-v28-living-order.html" loading="lazy"></iframe></div>
      <div class="name">LIVING ORDER</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v27.html">
      <div class="thumb"><iframe data-src="art-v27.html" loading="lazy"></iframe></div>
      <div class="name">PARTICLE COSMOS II</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v20.html">
      <div class="thumb"><iframe data-src="art-v20.html" loading="lazy"></iframe></div>
      <div class="name">ALIVE</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="art-v10.html">
      <div class="thumb"><iframe data-src="art-v10.html" loading="lazy"></iframe></div>
      <div class="name">INK BLOOM</div>
      <div class="arrow">→</div>
    </a>
    <a class="entry" href="void-field-ii.html">
      <div class="thumb"><iframe data-src="void-field-ii.html" loading="lazy"></iframe></div>
      <div class="name">VOID FIELD II</div>
      <div class="arrow">→</div>
    </a>
  </div>

  <div class="credit mono">ART PLAYGROUND</div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Preview budget.
   Every box is a full generative piece, so loading whatever is on screen
   meant several animations running at once. Only the two nearest the middle
   of the viewport stay live; the rest show their card. PREVIEW OFF stops
   all of them. Links navigate directly — no in-page overlay state to track.
   --------------------------------------------------------------------------- */
function scalePreviews(){
  document.querySelectorAll('.current, .thumb').forEach(function(box){
    var iframe = box.querySelector('iframe');
    if(!iframe) return;
    iframe.style.transform = 'scale(' + (box.clientWidth / 460) + ')';
  });
}
window.addEventListener('resize', scalePreviews);

var LIVE_BUDGET = 2;
var previewsOn = true;
try { previewsOn = localStorage.getItem('ap-prev') !== 'off'; } catch(e){}

function boxes(){ return [].slice.call(document.querySelectorAll('.current, .entry')); }
function loadBox(b){
  var f = b.querySelector('iframe'); if(!f) return;
  var src = f.getAttribute('data-src');
  if(src && f.getAttribute('src') !== src){ f.setAttribute('src', src); f.addEventListener('load', scalePreviews); }
  b.classList.add('live');
}
function unloadBox(b){
  var f = b.querySelector('iframe'); if(!f) return;
  if(f.getAttribute('src')){ f.removeAttribute('src'); }
  b.classList.remove('live');
}

var pending = false;
function apply(){
  pending = false;
  if(!previewsOn || document.hidden){ boxes().forEach(unloadBox); return; }
  var mid = innerHeight / 2;
  var visible = boxes().map(function(b){
    var r = b.getBoundingClientRect();
    return { b:b, on: r.bottom > 0 && r.top < innerHeight,
             d: Math.abs((r.top + r.bottom) / 2 - mid) };
  }).filter(function(o){ return o.on; }).sort(function(a,b){ return a.d - b.d; });

  var keep = visible.slice(0, LIVE_BUDGET).map(function(o){ return o.b; });
  boxes().forEach(function(b){ keep.indexOf(b) >= 0 ? loadBox(b) : unloadBox(b); });
}
function schedule(){ if(!pending){ pending = true; requestAnimationFrame(apply); } }

addEventListener('scroll', schedule, {passive:true});
addEventListener('resize', schedule, {passive:true});
document.addEventListener('visibilitychange', schedule);

var toggle = document.getElementById('prevToggle');
function paintToggle(){ toggle.textContent = previewsOn ? 'PREVIEW ON' : 'PREVIEW OFF';
  toggle.classList.toggle('off', !previewsOn); }
toggle.addEventListener('click', function(){
  previewsOn = !previewsOn;
  try { localStorage.setItem('ap-prev', previewsOn ? 'on' : 'off'); } catch(e){}
  paintToggle(); schedule();
});
paintToggle();
schedule();
</script>
</body>
</html>
