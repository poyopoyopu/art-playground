const BODY_N=6500,PINK_N=500,BLACK_N=1100;
let W=0,H=0,D=1,particles=[],phase=0,burst=0;const TAU=Math.PI*2;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!particles.length)init();else particles.forEach(setTarget)}
function targetFor(q){const scale=Math.min(W*.85/750,H*.58/990),cx=W*.5,cy=H*.49;return[cx+(q[0]-.5)*750*scale,cy+(q[1]-.5)*990*scale]}
function setTarget(p){const t=targetFor(p.q);p.tx=t[0];p.ty=t[1]}

for(let i=0;i<particles.length;i++){const p=particles[i],dx=p.tx-p.x,dy=p.ty-p.y;p.vx+=dx*.0042;p.vy+=dy*.0042;const drift=Math.sin(t*.0012+p.seed)*.018;p.vx+=-dy*.00010+drift;p.vy+=dx*.00007;p.vx*=.91;p.vy*=.91;if(burst>0){p.vx+=(p.x-W/2)*.0008*burst;p.vy+=(p.y-H/2)*.0008*burst}p.x+=p.vx;p.y+=p.vy;let a=.65+.25*Math.sin(t*.002+p.seed);if(settle<1)a*=.35+.65*ease;ctx.beginPath();ctx.fillStyle=color(i,a);ctx.arc(p.x,p.y,p.size*(.75+.35*Math.sin(t*.003+p.seed)),0,TAU);ctx.fill()}burst*=.94;requestAnimationFrame(draw)}
function transform(){phase=performance.now();burst=1;particles.forEach(p=>{const ang=Math.atan2(p.y-H/2,p.x-W/2),rr=35+Math.random()*100;p.x+=Math.cos(ang)*rr;p.y+=Math.sin(ang)*rr;p.vx+=(Math.random()-.5)*3;p.vy+=(Math.random()-.5)*3})}
