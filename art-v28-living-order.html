<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207;
 -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}

button{pointer-events:auto;border:1px solid #ffffff18;background:#08081288;color:#fff}
.clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 display:none;flex-direction:column;align-items:center;gap:6px;
 font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
 pointer-events:none;user-select:none;-webkit-user-select:none}
.clock.on{display:flex}
.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;letter-spacing:.01em;
 color:#fff;text-shadow:0 0 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.9),0 4px 34px rgba(0,0,0,.85)}
.clock .t i{font-style:normal;opacity:.62}
.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.30em;color:#fff;opacity:.62;
 text-shadow:0 0 3px rgba(0,0,0,.95),0 2px 16px rgba(0,0,0,.9)}
.ctrl{transition:opacity .7s,transform .7s}

.toast{position:absolute;left:50%;bottom:calc(max(4vh,env(safe-area-inset-bottom)) + 54px);
 transform:translateX(-50%);max-width:78vw;padding:11px 18px;border-radius:14px;
 background:#0a0a16d8;border:1px solid #ffffff1f;backdrop-filter:blur(10px);
 font-size:12px;line-height:1.6;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.toast.on{opacity:1}
.ctrl{position:fixed;left:50%;bottom:max(3.5vh,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:30px;background:rgba(8,8,14,.5);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 6px 30px #0009}

<canvas id="c"></canvas>
<div class="ui">
  <div class="clock" id="clock">
    <div class="t" id="clockTime">00:00<i>:00</i></div>
    <div class="d" id="clockDate"></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="mutate" aria-label="mutate">✦</button>

    <button class="btn" id="clockBtn" aria-label="clock">🕐</button>
  </div>

</div>
<div class="exportSheet" id="exportSheet">
  <div class="exportCard">
    <h3 id="exportTitle">RENDERING LOOP</h3>
    <p id="exportMsg">3秒・30fpsの滑らかなGIFを生成しています…</p>
    <div class="exportBar"><i id="exportBarFill"></i></div>
    <button class="exportClose" id="exportClose">CLOSE</button>
  </div>
</div>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),gl=c.getContext("webgl2",{alpha:false,antialias:false});
if(!gl){document.body.innerHTML="<div style='color:white;padding:30px;font-family:system-ui'>WebGL2が必要です。</div>";return}

const V=`#version 300 es
in vec2 p;out vec2 uv;
void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}
`;

const F=`#version 300 es
precision highp float;
out vec4 o;in vec2 uv;
uniform sampler2D back;
uniform vec2 res;
uniform float time,dt,seed,energy,chaos,fold;
uniform vec4 touch[4];
uniform int touchCount;
#define PI 3.14159265359
#define TAU 6.28318530718

float hash21(vec2 p){
  p=fract(p*vec2(123.34,456.21));
  p+=dot(p,p+45.32);
  return fract(p.x*p.y);
}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  float a=hash21(i),b=hash21(i+vec2(1,0));
  float c=hash21(i+vec2(0,1)),d=hash21(i+1.);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float s=0.,a=.5;
  for(int i=0;i<5;i++){s+=noise(p)*a;p=p*2.03+17.1;a*=.5;}
  return s;
}
vec2 rot(vec2 p,float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c)*p;}

// A bounded "organic order": repeated folds are continuously perturbed
// by a low-frequency field. It is not a fixed kaleidoscope.
vec2 orderField(vec2 p){
  float r=length(p), a=atan(p.y,p.x);
  float n=fbm(p*1.55+vec2(time*.035,-time*.027)+seed*7.);
  float local=exp(-r*r*2.8);
  float w=(.25+.75*local)*(0.22+chaos*.75);
  a += sin(a*fold + n*TAU + time*.17)*w;
  r += sin(r*17.-time*.23+n*9.)*.018*(.5+chaos);
  p=vec2(cos(a),sin(a))*r;
  // angular compression creates self-similar stained-glass bands
  float cell=TAU/fold;
  float q=mod(a+cell*.5,cell)-cell*.5;
  p=rot(p,-q*.42*(.25+.75*chaos));
  return p;
}

vec3 palette(float x){
  vec3 a=vec3(.50,.46,.55);
  vec3 b=vec3(.50,.48,.42);
  vec3 cc=vec3(1.0,.82,.55);
  vec3 d=vec3(.00,.27,.53);
  return a+b*cos(TAU*(cc*x+d));
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
  vec2 q=p;
  float r=length(q);

  // Touch is a force field: it changes the coordinate system, not just pixels.
  for(int i=0;i<4;i++){
    if(i>=touchCount) break;
    vec2 tp=(touch[i].xy-.5*res)/min(res.x,res.y);
    vec2 d=q-tp;
    float dist=length(d)+.0005;
    float fall=exp(-dist*dist/(touch[i].z*touch[i].z+.002));
    float spin=touch[i].w;
    q += normalize(d)*fall*(.075+energy*.06);
    q += vec2(-d.y,d.x)/dist*fall*spin*.065;
  }

  vec2 z=q;
  float phase=0.;
  // Multiple bounded domain folds create the "living geometry".
  for(int i=0;i<5;i++){
    float fi=mix(fold,fold+float(i)*1.37,chaos*.32);
    z=orderField(z);
    z=rot(z, sin(time*.11+float(i)*1.7+seed)*.035*(1.+chaos));
    float k=mod(atan(z.y,z.x)+PI,TAU/fi)-TAU/(2.*fi);
    z=rot(z,-k*.72);
    z*=1.025+sin(time*.09+float(i))*0.012;
    phase+=length(z)*2.7+k*0.7;
  }

  // Thin filament + stained-glass cells.
  float n=fbm(z*3.1+vec2(time*.025,-time*.018));
  float line=abs(sin(z.x*22.+n*7.+phase*.8));
  line=smoothstep(.86,.995,line);
  float cell=abs(sin(z.x*7.+sin(z.y*8.+time*.12)*.8));
  float glow=pow(max(0.,1.-r*1.15),2.4);

  vec2 sampleUv=uv;
  // Feedback is deliberately subtle: the world remembers previous mutations.
  vec2 fb=vec2(
    sin(time*.07+z.y*2.)*.002,
    cos(time*.06+z.x*2.)*.002
  );
  vec4 prev=texture(back,sampleUv+fb);
  vec3 fresh=palette(n*1.7+phase*.035+time*.012+seed);
  fresh=mix(fresh,vec3(1.,.15,.55),line*.18*chaos);
  fresh=mix(fresh,vec3(.15,.65,1.),cell*.16);

  float structure=(.34+.32*sin(phase*1.7+time*.15)+.34*line);
  vec3 col=fresh*(.16+structure*.62);
  col += vec3(1.,.7,.9)*line*(.20+.55*energy);
  col += fresh*glow*.42;

  // Old state dissolves rather than accumulating forever.
  float memory=.78-.14*energy;
  col=mix(prev.rgb,mix(col,col*1.18,chaos*.25),1.-memory);

  // Interaction scars: high energy makes the whole field reorganize.
  float pulse=sin(time*1.8+r*12.+n*9.)*.5+.5;
  col += palette(pulse+seed)*energy*.10*(.3+line);

  // Vignette + gentle grain
  col*=1.-smoothstep(.45,1.0,r)*.22;
  col+=vec3(hash21(gl_FragCoord.xy+time)-.5)*.018;
  o=vec4(pow(max(col,0.),vec3(.88)),1.);
}`;

function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  return s;
}
function program(v,f){
  const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p;
}
const prog=program(V,F);
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"p");
const U={};
["back","res","time","dt","seed","energy","chaos","fold","touch","touchCount"].forEach(k=>U[k]=gl.getUniformLocation(prog,k));

let W=1,H=1,dpr=1,front=null,back=null;
let seed=Math.random()*1000,energy=0,chaos=.62,fold=6,targetFold=6;
let exporting=false;
const clockEl=document.getElementById("clock");
const exportSheet=document.getElementById("exportSheet");
const exportTitle=document.getElementById("exportTitle");
const exportMsg=document.getElementById("exportMsg");
const exportBarFill=document.getElementById("exportBarFill");
const pts=new Map(), touchArr=[];
let last=performance.now(),birth=performance.now();

function tex(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return t;
}
function target(t){
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return f;
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,1.65);
  W=Math.max(1,Math.floor(innerWidth*dpr));H=Math.max(1,Math.floor(innerHeight*dpr));
  c.width=W;c.height=H;
  if(front)gl.deleteTexture(front);if(back)gl.deleteTexture(back);
  front=tex(W,H);back=tex(W,H);
  // Seed the feedback buffer with a dark neutral field.
  gl.bindFramebuffer(gl.FRAMEBUFFER,target(front));gl.clearColor(.01,.01,.025,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,target(back));gl.clearColor(.01,.01,.025,1);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function swap(){let t=front;front=back;back=t}
function mutate(power=1){
  seed=Math.random()*1000;
  targetFold=[3,4,5,6,7,8,9,11][Math.floor(Math.random()*8)];
  chaos=Math.min(1,Math.max(.2,chaos+(Math.random()-.35)*.42*power));
  energy=Math.min(1,energy+.48*power);
  const f=document.getElementById("flash");f.style.opacity=.10;setTimeout(()=>f.style.opacity=0,80);
}
// ---------- clock / fullscreen ----------
const clockTime=document.getElementById("clockTime");
const clockDate=document.getElementById("clockDate");
const toastEl=document.getElementById("toast");
const ctrlEl=document.querySelector(".ctrl");
let clockOn=false,wakeLock=null,toastTimer=null,idleTimer=null;

function toast(msg,ms){
  clearTimeout(toastTimer);
  toastEl.textContent=msg;toastEl.classList.add("on");
  toastTimer=setTimeout(()=>toastEl.classList.remove("on"),ms||3600);
}

const WEEK=["日","月","火","水","木","金","土"];
const pad2=n=>String(n).padStart(2,"0");
function updateClock(){
  if(!clockOn)return;
  const d=new Date();
  clockTime.innerHTML=pad2(d.getHours())+":"+pad2(d.getMinutes())+"<i>:"+pad2(d.getSeconds())+"</i>";
  clockDate.textContent=(d.getMonth()+1)+"月"+d.getDate()+"日 ("+WEEK[d.getDay()]+")";
}
// re-sync to the second boundary each tick so the display never drifts
function scheduleTick(){
  updateClock();
  setTimeout(scheduleTick,1000-(Date.now()%1000)+8);
}
scheduleTick();

async function requestWake(){
  try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(_){}
}
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch(_){} wakeLock=null; }
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&clockOn&&!wakeLock)requestWake();
});

// with the clock up this doubles as a display piece, so the buttons get out of
// the way until the screen is touched again
function showCtrl(){ctrlEl.classList.remove("idle")}
function bumpIdle(){
  showCtrl();
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>ctrlEl.classList.add("idle"),4000);
}
addEventListener("pointerdown",bumpIdle,{passive:true});

document.getElementById("clockBtn").onclick=()=>{
  clockOn=!clockOn;
  clockEl.classList.toggle("on",clockOn);
  if(clockOn){updateClock();requestWake();}else{releaseWake();showCtrl();}
  bumpIdle();
};

// fullscreen is left to the browser / home-screen app, per v49's convention
["fullscreenchange","webkitfullscreenchange","orientationchange"].forEach(ev=>
  addEventListener(ev,()=>setTimeout(resize,120)));

function render(now){
  if(exporting){requestAnimationFrame(render);return}
  const dt=Math.min(.04,(now-last)/1000);last=now;
  energy*=Math.pow(.28,dt);
  fold+=(targetFold-fold)*Math.min(1,dt*.45);
  if(now-birth>7000){
    // Autonomous mutation: rare enough to feel like a living system, not a screensaver.
    if(Math.random()<.018)mutate(.55);
    birth=now;
  }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  gl.bindFramebuffer(gl.FRAMEBUFFER,target(back));gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,front);gl.uniform1i(U.back,0);
  gl.uniform2f(U.res,W,H);gl.uniform1f(U.time,now*.001);gl.uniform1f(U.dt,dt);
  gl.uniform1f(U.seed,seed);gl.uniform1f(U.energy,energy);gl.uniform1f(U.chaos,chaos);gl.uniform1f(U.fold,fold);

  let i=0;
  for(const p of pts.values()){
    if(i>=4)break;
    gl.uniform4f(gl.getUniformLocation(prog,"touch["+i+"]"),p.x*dpr,(H-p.y*dpr),p.r*dpr,p.spin);
    i++;
  }
  gl.uniform1i(U.touchCount,i);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.bindTexture(gl.TEXTURE_2D,back);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  swap();
  requestAnimationFrame(render);
}

const GIF_JS="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js";
const GIF_WORKER="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js";
let gifWorkerURL=null;

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
  });
}
async function prepareGif(){
  if(!window.GIF)await loadScript(GIF_JS);
  if(!gifWorkerURL){
    const r=await fetch(GIF_WORKER);
    if(!r.ok)throw Error("worker");
    gifWorkerURL=URL.createObjectURL(await r.blob());
  }
}
function setExport(on,title,msg){
  exportSheet.classList.toggle("on",on);
  exportTitle.textContent=title;
  exportMsg.textContent=msg;
  exportBarFill.style.width="0%";
}
async function exportGif(){
  if(exporting)return;
  exporting=true;
  document.getElementById("gif").disabled=true;
  setExport(true,"RENDERING LOOP","3秒・30fpsの滑らかなGIFを生成しています…");
  try{
    await prepareGif();

    const side=Math.min(520,Math.round(Math.min(innerWidth,innerHeight)*1.0));
    const FPS=30,SECONDS=3,FRAMES=FPS*SECONDS;
    const ec=document.createElement("canvas");ec.width=ec.height=side;
    const eg=ec.getContext("2d",{alpha:false});
    const gif=new GIF({
      workers:2,quality:7,dither:false,
      width:side,height:side,workerScript:gifWorkerURL,repeat:0
    });

    // Warm up the feedback field so the first captured frame is already smooth.
    const warm=24;
        for(let i=0;i<warm;i++){
      // Reuse the live canvas renderer at a fixed cadence; capture only after warm-up.
      renderExportFrame(i/warm);
      if(i%4===0){exportBarFill.style.width=(i/warm*10)+"%";await new Promise(r=>setTimeout(r,0))}
    }

    for(let i=0;i<FRAMES;i++){
      renderExportFrame(i/FRAMES);
      eg.drawImage(c,0,0,side,side);
      gif.addFrame(eg,{copy:true,delay:1000/FPS});
      exportBarFill.style.width=(10+i/FRAMES*48)+"%";
      if(i%2===0)await new Promise(r=>setTimeout(r,0));
    }

    exportMsg.textContent="GIFをエンコード中…";
    const blob=await new Promise((resolve,reject)=>{
      gif.on("progress",p=>exportBarFill.style.width=(58+p*42)+"%");
      gif.on("finished",resolve);
      gif.on("abort",()=>reject(Error("abort")));
      gif.render();
    });

    const url=URL.createObjectURL(blob);
    exportTitle.textContent="LOOP READY";
    exportMsg.textContent=`${side}×${side} · 3秒 · 30fps · ${Math.round(blob.size/1024)}KB`;
    exportBarFill.style.width="100%";

    const img=document.createElement("img");
    img.src=url;img.alt="generated loop";
    img.style.cssText="display:block;width:min(76vw,300px);margin:14px auto 0;border-radius:12px;border:1px solid #ffffff18";
    exportCardInsert(img,url);
  }catch(err){
    console.error(err);
    exportTitle.textContent="EXPORT FAILED";
    exportMsg.textContent="GIFの生成に失敗しました。通信環境を確認して再試行してください。";
  }finally{
    exporting=false;
    document.getElementById("gif").disabled=false;
    last=performance.now();
  }
}
function exportCardInsert(img,url){
  const card=document.querySelector(".exportCard");
  const old=card.querySelector("img");if(old)old.remove();
  card.insertBefore(img,document.getElementById("exportClose"));
  let dl=card.querySelector(".exportDownload");
  if(!dl){
    dl=document.createElement("a");dl.className="exportDownload";
    dl.style.cssText="display:block;margin:12px auto 0;width:max-content;color:#fff;text-decoration:none;border:1px solid #ffffff25;border-radius:20px;padding:9px 18px;font-size:11px;letter-spacing:.16em";
    dl.textContent="SAVE GIF";
    card.insertBefore(dl,document.getElementById("exportClose"));
  }
  dl.href=url;dl.download="art-playground-loop.gif";
}
function renderExportFrame(phase){
  // Use the same live shader state, but force a consistent short frame step.
  const now=performance.now();
  const dt=.033;
  energy=Math.min(1,energy+.008);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,target(back));
  gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,front);gl.uniform1i(U.back,0);
  gl.uniform2f(U.res,W,H);
  gl.uniform1f(U.time,now*.001+phase*3.0);
  gl.uniform1f(U.dt,dt);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.energy,energy);
  gl.uniform1f(U.chaos,chaos);
  gl.uniform1f(U.fold,fold);
  let i=0;
  for(const p of pts.values()){
    if(i>=4)break;
    gl.uniform4f(gl.getUniformLocation(prog,"touch["+i+"]"),p.x*dpr,(H-p.y*dpr),p.r*dpr,p.spin);i++;
  }
  gl.uniform1i(U.touchCount,i);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,W,H);
  gl.bindTexture(gl.TEXTURE_2D,back);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  swap();
}

function pos(e){const r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener("pointerdown",e=>{
  e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);pts.set(e.pointerId,{x:p.x,y:p.y,r:.28,spin:e.shiftKey?-.8:.8});
  energy=Math.min(1,energy+.28);
  if(pts.size===2){chaos=Math.min(1,chaos+.18);energy=.9}
},{passive:false});
c.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  const p=pos(e),q=pts.get(e.pointerId);
  const dx=p.x-q.x,dy=p.y-q.y;
  q.x=p.x;q.y=p.y;q.r=Math.min(.52,Math.max(.16,Math.hypot(dx,dy)/Math.min(innerWidth,innerHeight)*1.8));
  q.spin=Math.max(-1.2,Math.min(1.2,(dx-dy)/Math.min(innerWidth,innerHeight)*8));
  energy=Math.min(1,energy+.018);
  if(pts.size===2)chaos=Math.min(1,chaos+.012);
},{passive:true});
function up(e){pts.delete(e.pointerId);if(pts.size===0)energy*=.5}
c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
document.getElementById("mutate").onclick=()=>mutate(1);
document.getElementById("reset").onclick=()=>{seed=Math.random()*1000;chaos=.62;energy=.7;targetFold=6};
document.getElementById("gif").onclick=exportGif;
document.getElementById("exportClose").onclick=()=>{
  const card=document.querySelector(".exportCard");
  const img=card.querySelector("img");if(img)img.remove();
  const dl=card.querySelector(".exportDownload");
  if(dl){URL.revokeObjectURL(dl.href);dl.remove()}
  exportSheet.classList.remove("on");
};
addEventListener("resize",resize);
resize();requestAnimationFrame(render);
})();
</script>
