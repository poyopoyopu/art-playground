<!DOCTYPE html>
<!-- LIVING REEF — Arena(エージェントモード)作「Living Reef of Light」をおっちゃんが持ち込み、Claude(クロちゃん)が改良。
     改良: 天井からも生える(上半分は垂れ下がる)・なぞる=風(枝がしなる、指に吸い寄せない)・なぞっただけでは種を植えない・
     120Hz画面の残像の消え残り対策・ヒント追加・ap-kit.js統合(✦=別の色と枝ぶり、↻=最初の世界) -->
<!-- 世界のルール: 光の樹は枝先から胞子を飛ばし、その一部が種になって、新しい樹がひとりでに生える。触らなくても世界は増え、枯れ、入れ替わる。
     タップした場所が新しい樹の根になり、光る芽に触れると弾けて胞子(=次の世代)を撒く。なぞると風が吹き、胞子の行き先=次に生える場所が変わる。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LIVING REEF — 光の種が胞子を飛ばし、ひとりでに増える珊瑚礁</title>
<script src="ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));   /* ap-kitのボタン列と重ならない高さ */
    text-align: center; pointer-events: none;
    font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #9adcff; opacity: 0;
    transition: opacity 2s ease;
    text-shadow: 0 0 14px rgba(70, 170, 255, .6);
  }
  #hint.on { opacity: .72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ 光の種を植える<br>光る芽をタップ ＝ 胞子が弾ける<br>なぞる ＝ 風が吹く ／ ２本指タップ ＝ 撒き直す</div>
<script>
(function () {
  'use strict';

  var cvs  = document.getElementById('c');
  var hint = document.getElementById('hint');
  var ctx  = cvs.getContext('2d', { alpha: false, desynchronized: true });

  /* ================= tuning ================= */
  var DECAY     = 9.5;      /* 残像の減衰（毎秒）。大きいほど尾が短い */
  var MAX_ORG   = 6;        /* 同時に生きる樹の本数 */
  var SEG_CAP   = 820;      /* 枝の総数上限（軽量化） */
  var POLLEN_CAP= 120;      /* 胞子の上限 */
  var RES_CAP   = 2200000;  /* 描画バッファの最大画素数 */
  var PALETTE0  = [188, 200, 268, 286, 316, 44, 162, 232];
  var PALETTE   = PALETTE0.slice();
  var SPREAD    = 1;        /* 枝の開き具合（✦で変わる） */
  var LENK      = 0.66;     /* 枝が短くなる割合（✦で変わる） */
  var TAU = Math.PI * 2;

  var W = 0, H = 0, DPR = 1, baseLen = 54, GAIN = 6, now = 0, fadeAcc = 0;
  var quality = 2, perfAcc = 0, perfN = 0;

  var orgs = [], pollen = [], rings = [], pending = [];
  var autoTimer = 0.35;

  /* ================= 発光スプライト（24色を事前生成） ================= */
  var SPRITES = (function () {
    var a = [], i, k, s, c, g;
    for (i = 0; i < 24; i++) {
      k = i * 15;
      s = document.createElement('canvas');
      s.width = s.height = 64;
      c = s.getContext('2d');
      g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0,    'rgba(255,255,255,1)');
      g.addColorStop(0.16, 'hsla(' + k + ',100%,74%,0.85)');
      g.addColorStop(0.42, 'hsla(' + k + ',100%,58%,0.22)');
      g.addColorStop(1,    'hsla(' + k + ',100%,55%,0)');
      c.fillStyle = g;
      c.fillRect(0, 0, 64, 64);
      a.push(s);
    }
    return a;
  })();

  function sprite(hue, x, y, r, a) {
    var i = (Math.round(hue / 15) % 24 + 24) % 24;
    ctx.globalAlpha = a;
    ctx.drawImage(SPRITES[i], x - r, y - r, r * 2, r * 2);
  }

  /* 自動で生える場所：天井側か床側（真ん中で枝どうしが出会う） */
  var edgeFlip = Math.random() < 0.5;
  function edgeY() {
    edgeFlip = Math.random() < 0.7 ? !edgeFlip : edgeFlip;   /* 上下が偏りすぎないように */
    return edgeFlip ? H * (0.04 + Math.random() * 0.26)
                    : H * (0.66 + Math.random() * 0.30);
  }

  function randHue() {
    return PALETTE[(Math.random() * PALETTE.length) | 0] + (Math.random() - 0.5) * 20;
  }
  function totalSegs() {
    var n = 0, i;
    for (i = 0; i < orgs.length; i++) n += orgs[i].segs.length;
    return n;
  }

  /* ================= 入力 ================= */
  var ptr = { x: 0, y: 0, active: false, down: false, strength: 0, radius: 190,
              vx: 0, vy: 0, wind: 0, press: 0, wang: 0, lx: 0, ly: 0, lt: 0 };   /* なぞった速さ＝風 */
  var pointers = new Map();
  var mouseClicks = 0;
  var gesture = null;

  /* ================= 画面サイズ ================= */
  function resize() {
    var w = cvs.clientWidth || window.innerWidth;
    var h = cvs.clientHeight || window.innerHeight;
    W = w; H = h;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    if (w * h * DPR * DPR > RES_CAP) DPR = Math.max(1, Math.sqrt(RES_CAP / (w * h)));
    cvs.width  = Math.max(1, Math.round(w * DPR));
    cvs.height = Math.max(1, Math.round(h * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    baseLen = Math.max(30, Math.min(w, h) * 0.145);
    ptr.radius = Math.max(150, Math.min(w, h) * 0.46);
  }

  /* ================= 伸びる向き =================
     下半分に植えた樹は上へ、上半分に植えた樹は天井から垂れ下がるように下へ。
     左右の端に近いほど、画面の内側へ傾く（珊瑚礁の洞窟のように画面全体を埋める） */
  function growAngle(x, y) {
    var dy = y > H * 0.5 ? -1 : 1;
    var dx = (W * 0.5 - x) / (W * 0.5) * 0.7;
    return Math.atan2(dy, dx);
  }

  /* ================= 樹を植える ================= */
  function plant(x, y, hue, power, quiet) {
    if (orgs.length >= MAX_ORG) {           /* いちばん古い樹を還元して場所を空ける */
      var old = 0, i;
      for (i = 1; i < orgs.length; i++) if (orgs[i].birth < orgs[old].birth) old = i;
      if (now - orgs[old].birth < 2.5) return;
      orgs.splice(old, 1);
    }
    if (totalSegs() > SEG_CAP * 0.9) return;

    power = power || 1;
    var w0   = baseLen * 0.088 * power;
    var seg0 = {
      parent: -1,
      a: growAngle(x, y) + (Math.random() - 0.5) * 0.9,
      len: baseLen * (0.9 + Math.random() * 0.35) * power,
      w: w0, depth: 0, cur: 0, dur: 0.30 + Math.random() * 0.25,
      bend: 0, ph: Math.random() * TAU,
      bx: x, by: y, ex: x, ey: y,
      grown: false, tip: false
    };
    var org = {
      x: x, y: y, hue: hue, birth: now, fade: 1, fading: false, dead: false,
      flash: 0, w0: w0, segs: [seg0],
      budget: 78 + ((Math.random() * 70) | 0),
      maxDepth: Math.random() < 0.5 ? 6 : 5,
      pending: 1, growDone: -1, lifetime: 20 + Math.random() * 18,
      sporeT: 1.2
    };
    orgs.push(org);

    if (!quiet) {
      rings.push({ x: x, y: y, r: 2, v: 300, a: 1, hue: hue });
      for (i = 0; i < 7; i++) emitPollen(x, y, hue, 90);
    }
    return org;
  }

  /* ================= 枝分かれ（自己相似） ================= */
  function spawn(segs, si, n) {
    var s = segs[si];
    var spread = (0.50 + Math.random() * 0.40) * SPREAD;
    var dir    = Math.random() < 0.5 ? 1 : -1;
    var lenK   = LENK + Math.random() * 0.10;
    for (var j = 0; j < n; j++) {
      var off;
      if (n === 2) off = (j ? spread : -spread) * (0.65 + Math.random() * 0.6) * dir;
      else         off = (j - 1) * spread * 0.8 + (Math.random() - 0.5) * 0.22;
      segs.push({
        parent: si,
        a: s.a + off,
        len: s.len * lenK * (0.88 + Math.random() * 0.26),
        w: s.w * 0.68,
        depth: s.depth + 1,
        cur: 0, dur: 0.26 + Math.random() * 0.40,
        bend: 0, ph: Math.random() * TAU,
        bx: s.ex, by: s.ey, ex: s.ex, ey: s.ey,
        grown: false, tip: false
      });
    }
  }

  /* ================= 胞子 ================= */
  function emitPollen(x, y, hue, spd) {
    if (pollen.length >= POLLEN_CAP) return;
    var a = Math.random() * TAU;
    var s = spd * (0.2 + Math.random() * 0.95);
    var life = 4 + Math.random() * 6;
    pollen.push({
      x: x, y: y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      hue: hue + (Math.random() - 0.5) * 40,
      r: 3.0 + Math.random() * 4.5,
      life: life, max: life, ph: Math.random() * TAU,
      seed: Math.random() < 0.42
    });
  }
  function emitFromTip(o, n) {
    var segs = o.segs, i, tries = 0, s;
    while (n > 0 && tries < 24) {
      tries++;
      s = segs[(Math.random() * segs.length) | 0];
      if (s && s.tip) { emitPollen(s.ex, s.ey, o.hue, 34); n--; }
    }
  }

  /* ================= 樹の成長と揺らぎ ================= */
  function stepOrg(o, dt) {
    var segs = o.segs, i, s, p, bx, by, target, want, dx, dy, d2, d, f, ang, n;

    for (i = 0; i < segs.length; i++) {
      s = segs[i];
      p = s.parent < 0 ? null : segs[s.parent];
      bx = p ? p.ex : o.x;
      by = p ? p.ey : o.y;
      s.bx = bx; s.by = by;

      if (s.cur < 1) {
        s.cur += dt / s.dur;
        if (s.cur > 1) s.cur = 1;
      }

      /* --- 揺らぎ（風） --- */
      target = (0.045 + Math.min(s.depth, 6) * 0.013) * Math.sin(now * 0.60 + s.ph + s.ey * 0.010)
             + 0.030 * Math.sin(now * 0.23 + s.ex * 0.007 + s.ph * 0.5);

      /* --- なぞった方向に風が吹いて、枝がしなる（指に吸い寄せない） --- */
      if (ptr.wind > 0.01) {
        dx = ptr.x - bx; dy = ptr.y - by;
        d2 = dx * dx + dy * dy;
        if (d2 < ptr.radius * ptr.radius * 1.7) {
          d = Math.sqrt(d2);
          f = 1 - d / (ptr.radius * 1.3);
          if (f > 0) {
            want = ptr.wang - s.a;
            want = Math.atan2(Math.sin(want), Math.cos(want));
            if (want > 0.7) want = 0.7; else if (want < -0.7) want = -0.7;
            target += want * f * ptr.wind * (0.35 + Math.min(s.depth, 5) * 0.09);
          }
        }
      }
      s.bend += (target - s.bend) * (1 - Math.exp(-5.5 * dt));

      ang = s.a + s.bend;
      s.ex = bx + Math.cos(ang) * s.len * s.cur;
      s.ey = by + Math.sin(ang) * s.len * s.cur;

      /* --- 伸びきったら分岐 --- */
      if (!s.grown && s.cur >= 1) {
        s.grown = true;
        o.pending--;
        n = Math.random() < 0.24 ? 3 : 2;
        if (s.depth < o.maxDepth &&
            segs.length + n <= o.budget &&
            totalSegs() + n <= SEG_CAP) {
          spawn(segs, i, n);
          o.pending += n;
        } else {
          s.tip = true;
        }
      }
    }

    if (o.pending <= 0 && o.growDone < 0) o.growDone = now;

    /* --- 寿命と還元 --- */
    if (o.growDone >= 0 && !o.fading && now - o.growDone > o.lifetime) o.fading = true;
    if (o.flash > 0) o.flash -= dt * 1.6;
    if (o.fading) {
      o.fade -= dt * 0.18;
      o.sporeT -= dt;
      if (o.sporeT <= 0) {
        o.sporeT = 0.5 + Math.random() * 0.8;
        if (totalSegs() < SEG_CAP * 0.75) emitFromTip(o, 2);
      }
      if (o.fade <= 0) o.dead = true;
    }
  }

  /* ================= 胞子の運動 ================= */
  function stepPollen(dt) {
    var i, p, dx, dy, d, f, R;
    for (i = pollen.length - 1; i >= 0; i--) {
      p = pollen[i];
      p.life -= dt;
      if (p.life <= 0) {
        if (p.seed && Math.random() < 0.22 &&
            orgs.length < MAX_ORG - 1 && pending.length < 3 &&
            totalSegs() < SEG_CAP * 0.7) {
          pending.push({ t: now + 0.05, x: p.x, y: p.y, hue: p.hue, power: 0.6, loud: false });
        }
        pollen.splice(i, 1);
        continue;
      }
      p.vx += Math.sin(now * 1.1 + p.ph) * 9 * dt;
      p.vy -= 5.5 * dt;                                   /* ふわりと浮く */

      if (ptr.strength > 0.001) {                          /* 指のまわりで渦を巻く */
        R = ptr.radius * 1.5;
        dx = ptr.x - p.x; dy = ptr.y - p.y;
        d = Math.hypot(dx, dy) + 1;
        if (d < R) {
          f = (1 - d / R) * ptr.strength * 300;
          p.vx += (dx / d) * f * dt + (-dy / d) * f * 0.9 * dt;
          p.vy += (dy / d) * f * dt + ( dx / d) * f * 0.9 * dt;
        }
      }
      if (ptr.wind > 0.01) {                               /* 風に乗って流れる */
        dx = ptr.x - p.x; dy = ptr.y - p.y;
        d = Math.hypot(dx, dy);
        R = ptr.radius * 1.6;
        if (d < R) {
          f = (1 - d / R) * 0.9;
          p.vx += ptr.vx * f * dt;
          p.vy += ptr.vy * f * dt;
        }
      }
      f = 1 - 1.1 * dt;
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < -40) p.x = W + 40; else if (p.x > W + 40) p.x = -40;
      if (p.y < -40) p.y = H + 40; else if (p.y > H + 40) p.y = -40;
    }
  }

  /* ================= 更新 ================= */
  function update(dt) {
    var i, p, o, f, alive = 0;

    /* 予約された種まき */
    for (i = pending.length - 1; i >= 0; i--) {
      if (now >= pending[i].t) {
        p = pending[i];
        pending.splice(i, 1);
        plant(p.x, p.y, p.hue, p.power, !p.loud);
      }
    }
    /* 何も触らなくても、勝手に増えていく */
    autoTimer -= dt;
    if (autoTimer <= 0) {
      autoTimer = 2.6 + Math.random() * 4.0;
      for (i = 0; i < orgs.length; i++) if (!orgs[i].fading) alive++;
      if (alive < MAX_ORG - 1 && totalSegs() < SEG_CAP * 0.8) {
        plant(W * (0.12 + Math.random() * 0.76), edgeY(),
              randHue(), 0.8 + Math.random() * 0.35, true);
      }
    }
    if (orgs.length === 0) autoTimer = Math.min(autoTimer, 0.35);

    for (i = orgs.length - 1; i >= 0; i--) {
      o = orgs[i];
      stepOrg(o, dt);
      if (o.dead) orgs.splice(i, 1);
    }

    stepPollen(dt);

    for (i = rings.length - 1; i >= 0; i--) {
      p = rings[i];
      p.r += p.v * dt;
      p.v *= 1 - 1.7 * dt;
      p.a -= dt * 0.85;
      if (p.a <= 0) rings.splice(i, 1);
    }

    /* 風はなぞるのをやめると、ゆっくり凪いでいく */
    f = Math.exp(-2.6 * dt);
    ptr.vx *= f; ptr.vy *= f;
    ptr.wind = Math.min(1, Math.hypot(ptr.vx, ptr.vy) / 1100);
    if (ptr.wind > 0.01) ptr.wang = Math.atan2(ptr.vy, ptr.vx);

    /* 指の力の立ち上がり／余韻 */
    f = ptr.active ? (ptr.down ? 1 : 0.55) : 0;
    ptr.strength += (f - ptr.strength) * (1 - Math.exp(-7 * dt));
    if (ptr.strength < 0.002) ptr.strength = 0;
    ptr.press += ((ptr.down ? 1 : 0) - ptr.press) * (1 - Math.exp(-7 * dt));
  }

  /* ================= 描画 ================= */
  function render(dt) {
    var drawA = 1 - Math.exp(-DECAY * dt);
    if (drawA < 0.02) drawA = 0.02;
    GAIN = 1 / drawA;                 /* 加算合成のつり合い（毎フレーム補正） */

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    /* 残像を消す処理は 1/70 秒ぶん溜まってからまとめて行う。
       120Hz 画面で毎回うすく消すと、8bit の丸めで暗い残像が消え残るため */
    fadeAcc += dt;
    if (fadeAcc >= 1 / 70) {
      var fadeA = 1 - Math.exp(-DECAY * fadeAcc);
      fadeAcc = 0;
      ctx.fillStyle = 'rgba(0,0,0,' + fadeA.toFixed(4) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var breath = 0.86 + 0.14 * Math.sin(now * 0.45);
    var drift  = Math.sin(now * 0.055) * 44 + Math.sin(now * 0.021 + 1.7) * 52;
    var i, j, d, o, s, segs, any, hue, tgt, life, w;

    /* ---- 枝（深さごとにまとめて 2 回ストローク＝芯＋ハロー） ---- */
    for (j = 0; j < orgs.length; j++) {
      o = orgs[j];
      segs = o.segs;
      life = o.fade * breath * (1 + o.flash * 0.9);
      for (d = 0; d <= o.maxDepth; d++) {
        any = false;
        ctx.beginPath();
        for (i = 0; i < segs.length; i++) {
          s = segs[i];
          if (s.depth !== d) continue;
          ctx.moveTo(s.bx, s.by);
          ctx.lineTo(s.ex, s.ey);
          any = true;
        }
        if (!any) continue;

        hue   = ((o.hue + d * 9 + drift) % 360 + 720) % 360;
        tgt   = (0.30 + d * 0.105) * life;
        w     = Math.max(0.7, o.w0 * Math.pow(0.68, d));

        ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,' + (62 + Math.min(d, 5) * 4) + '%,' + (tgt * 0.32 / GAIN).toFixed(4) + ')';
        ctx.lineWidth = w * 3.4;
        ctx.stroke();

        ctx.strokeStyle = 'hsla(' + hue.toFixed(1) + ',100%,' + (54 + Math.min(d, 5) * 4) + '%,' + (tgt / GAIN).toFixed(4) + ')';
        ctx.lineWidth = w;
        ctx.stroke();
      }
    }

    /* ---- 枝先の芽（脈打つ光） ---- */
    for (j = 0; j < orgs.length; j++) {
      o = orgs[j];
      segs = o.segs;
      life = o.fade * (1 + o.flash * 1.2);
      for (i = 0; i < segs.length; i++) {
        s = segs[i];
        if (!s.tip || s.cur < 1) continue;
        if (quality === 1 && (i & 1)) continue;
        var pulse = 0.55 + 0.45 * Math.sin(now * 2.1 + s.ph);
        if (pulse < 0) pulse = 0;
        hue = ((o.hue + s.depth * 9 + drift + 14) % 360 + 720) % 360;
        sprite(hue, s.ex, s.ey, 3.0 + s.depth * 0.9 + pulse * 2.6, 0.42 * pulse * life / GAIN);
      }
    }

    /* ---- 胞子 ---- */
    for (i = 0; i < pollen.length; i++) {
      var p = pollen[i];
      var a = Math.min(1, p.life * 0.8, (p.max - p.life) * 2.2);
      if (a <= 0) continue;
      sprite(p.hue, p.x, p.y, p.r * 3.0, 0.55 * a / GAIN);
    }

    /* ---- 波紋 ---- */
    ctx.globalAlpha = 1;
    for (i = 0; i < rings.length; i++) {
      var r = rings[i];
      ctx.strokeStyle = 'hsla(' + r.hue + ',100%,78%,' + (0.45 * r.a / GAIN).toFixed(4) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }

    /* ---- 指のオーラ ---- */
    var aura = ptr.press;          /* 押している間だけ（PCのホバーでは出さない） */
    if (aura > 0.01) {
      sprite(198 + drift * 0.25, ptr.x, ptr.y, 46 + 46 * aura, 0.18 * aura / GAIN);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'hsla(195,100%,80%,' + (0.30 * aura / GAIN).toFixed(4) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(ptr.x, ptr.y, 26 + 22 * (1 - aura), 0, TAU);
      ctx.stroke();
    }
  }

  /* ================= メインループ ================= */
  var last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0.0005) dt = 0.0005;
    now += dt;

    update(dt);
    render(dt);

    /* 端末が重いときは自動でハローを省く */
    perfAcc += dt * 1000; perfN++;
    if (perfN >= 90) {
      if (perfAcc / perfN > 26 && quality === 2) quality = 1;
      perfAcc = 0; perfN = 0;
    }
    requestAnimationFrame(frame);
  }

  /* ================= 操作 ================= */
  function toXY(e) {
    var r = cvs.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function nearTip(x, y) {
    var best = null, bd = 54 * 54, i, j, s, o, dx, dy, d2;
    for (j = 0; j < orgs.length; j++) {
      o = orgs[j]; s = o.segs;
      for (i = 0; i < s.length; i++) {
        if (!s[i].tip) continue;
        dx = s[i].ex - x; dy = s[i].ey - y;
        d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = { o: o, s: s[i] }; }
      }
    }
    return best;
  }

  function tap(x, y) {
    var hit = nearTip(x, y);
    if (hit) {                                   /* 芽に触れたら弾けて胞子をまく */
      hit.o.flash = 1;
      rings.push({ x: hit.s.ex, y: hit.s.ey, r: 1, v: 240, a: 1, hue: hit.o.hue });
      for (var i = 0; i < 12; i++) emitPollen(hit.s.ex, hit.s.ey, hit.o.hue + (Math.random() - 0.5) * 50, 150);
    } else {                                     /* なにも無ければ、そこに種を植える */
      plant(x, y, randHue(), 1.15, false);
    }
  }

  function reseed() {
    var i, n;
    orgs.length = 0;
    pending.length = 0;
    rings.push({ x: W / 2, y: H / 2, r: 4, v: 1000, a: 1, hue: 200 });
    rings.push({ x: W / 2, y: H / 2, r: 1, v: 520, a: 1, hue: 290 });
    for (i = 0; i < 44; i++) emitPollen(Math.random() * W, Math.random() * H, randHue(), 130);
    n = 3 + ((Math.random() * 2) | 0);
    for (i = 0; i < n; i++) {
      pending.push({
        t: now + i * 0.26,
        x: W * (0.15 + Math.random() * 0.7),
        y: edgeY(),
        hue: randHue(), power: 0.85 + Math.random() * 0.35, loud: true
      });
    }
    autoTimer = 2.5;
  }

  function hideHint() { hint.classList.remove('on'); }

  cvs.addEventListener('pointerdown', function (e) {
    if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
    var p = toXY(e);
    ptr.x = p.x; ptr.y = p.y;
    ptr.active = true; ptr.down = true;
    pointers.set(e.pointerId, p);
    ptr.lx = p.x; ptr.ly = p.y; ptr.lt = performance.now();   /* 前回の位置から飛ばない */
    if (now > 1.2) hideHint();

    if (pointers.size >= 2) {                                 /* ２本指＝撒き直す */
      if (gesture) gesture.cancel = true;
      reseed(); return;
    }

    if (e.pointerType === 'mouse') {                          /* PC はダブルクリックでも撒き直す */
      var t = performance.now();
      if (t - mouseClicks < 320) { mouseClicks = 0; gesture = null; reseed(); return; }
      mouseClicks = t;
    }
    /* 種まきは指を離したときに判定（なぞっただけなら種は植えない） */
    gesture = { x: p.x, y: p.y, cancel: false };
  }, { passive: false });

  function onMove(e) {
    var p = toXY(e);
    ptr.x = p.x; ptr.y = p.y;
    if (e.pointerType === 'mouse' && !ptr.down) ptr.active = true;   /* PC はホバーでも風が起きる */
    if (ptr.down && Math.random() < 0.45) emitPollen(p.x, p.y, randHue(), 40);
  }
  cvs.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointermove', function (e) {
    var p = toXY(e), t = performance.now(), dtm = (t - ptr.lt) / 1000;
    if (ptr.lt && dtm > 0.004 && dtm < 0.15) {           /* なぞる速さを風に変える */
      var k = Math.min(1, dtm * 14);
      ptr.vx += ((p.x - ptr.lx) / dtm - ptr.vx) * k;
      ptr.vy += ((p.y - ptr.ly) / dtm - ptr.vy) * k;
    }
    if (!ptr.lt || dtm > 0.004) { ptr.lx = p.x; ptr.ly = p.y; ptr.lt = t; }
    if (!ptr.down) return;
    ptr.x = p.x; ptr.y = p.y;
    if (gesture && Math.hypot(p.x - gesture.x, p.y - gesture.y) > 14) gesture.cancel = true;
  }, { passive: true });

  function release(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      if (e.type === 'pointerup' && gesture && !gesture.cancel) tap(gesture.x, gesture.y);
      gesture = null;
      ptr.down = false;
      if (e.pointerType !== 'mouse') ptr.active = false;
    }
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  cvs.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' && !ptr.down) ptr.active = false;
  });

  /* スクロール・ピンチ・ダブルタップ拡大を封じる */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  var rT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(resize, 180);
  });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 300); });
  document.addEventListener('visibilitychange', function () { last = 0; });

  /* ================= 起動 ================= */
  resize();
  plant(W * 0.42, H * 0.84, 196, 1.05, true);   /* 最初の一本（床から） */
  pending.push({ t: 1.4, x: W * 0.64, y: H * 0.12, hue: 286, power: 0.95, loud: false });   /* 天井からも */
  setTimeout(function () { hint.classList.add('on'); }, 550);
  setTimeout(hideHint, 7000);
  requestAnimationFrame(frame);

  /* ✦: 別の色の組み合わせと枝ぶりで撒き直す */
  function mutate() {
    var base = Math.random() * 360, i, n = 8;
    var span = 60 + Math.random() * 200;               /* 近い色だけ〜ばらばらまで */
    PALETTE = [];
    for (i = 0; i < n; i++) PALETTE.push((base + (i / (n - 1) - 0.5) * span + 360) % 360);
    if (Math.random() < 0.35) PALETTE.push((base + 180) % 360);   /* ときどき補色が混ざる */
    SPREAD = 0.7 + Math.random() * 0.65;
    LENK   = 0.60 + Math.random() * 0.12;
    reseed();
  }
  /* ↻: 最初の世界に戻す */
  function resetAll() {
    PALETTE = PALETTE0.slice(); SPREAD = 1; LENK = 0.66;
    orgs.length = 0; pending.length = 0; pollen.length = 0; rings.length = 0;
    plant(W * 0.42, H * 0.84, 196, 1.05, true);
    pending.push({ t: now + 1.4, x: W * 0.64, y: H * 0.12, hue: 286, power: 0.95, loud: false });
    autoTimer = 2.5;
  }

  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'living-reef',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: mutate },
        { label: '↻', name: 'reset',  onClick: resetAll }
      ]
    });
  }
})();
</script>
</body>
</html>
