<!-- GLASS RELAY(仮) — クロちゃん(Claude)作。2026/11/26。おっちゃんと決めた計画どおりの「ドミノだけのピタゴラ装置」。
     見た目: 透き通る虹色のガラスのドミノ、黒い鏡のテーブル(映り込み)、ぼかし、やわらかい影。静止画 claude/domino-glass-still.html のガラス設定・寸法をそのまま使う。
     コース: しかけ12種類(階段/分かれて並走→合流/宙返りの輪/寝かせたドミノの橋/だんだん大きく/ビー玉の坂/扇/塔くずし/2段重ね/渦巻き/段差落ち/うねる面)から、
       毎分6〜8個をランダムに組む。コースは時刻のフィールドのまわりを回って、最後にフィールドへ入る。
     時計: 毎分0秒に、波が時刻のフィールドに届いて倒れ、倒れたドミノが新しい HH:MM になる(次の分まで残る)。
       57秒ごろ、前の時刻は巻き戻しのように起き上がって消え、0秒に新しい時刻で倒れる。0〜3秒でコースは巻き戻しのように起き上がりながら、次の分のコースに並び直す。
     倒れ方: 読み込み時に、ドミノの列を本物の剛体の物理(手前の下の角を支点に回る板、ぶつかりはばね+減衰)で1回計算し、
       列の途中の14枚と最後の2枚の倒れ方(揺れ・跳ね返り・寄りかかって止まる角度)を全ドミノで使い回す。大きいドミノは√倍ゆっくり倒れる。実物の約5.5倍のスロー。
     カメラ: 波の先頭を斜め後ろの少し上から追う。しかけごとに撮り方を変える(階段は一緒にのぼる、輪は回り込む、ビー玉は並走、扇・渦巻きは上から…)。0秒前後は引いて時刻を正面から。
     重さ: 読み込み中に実際に描いて速さを測り、画質の段(解像度・ぼかし・影・ガラスの分光)を決める。動き出してからも重ければ段を下げる。
     眺めていての変化(2026/11/26 おっちゃん選択):
       ・10分ごと・正時の大仕掛け: :10 :20 …が出る分のコースはしかけ9個、:00 が出る分は12種ぜんぶ(色は虹・形は円)。その時刻が出たあと、
         カメラが真上近くまで大きく引いてコース全体と時刻を見せ(引いている間に巻き戻しが見える)、6秒過ぎに次のコースが走り出す。
       ・毎分の色テーマ: 虹(多め)/氷/琥珀/パステル/透明に1色/夕焼け/深い海。フィールドの数字の色は、その時刻を運んできたコースのテーマ。
       ・コースの形と回る向き: 円/三つ葉/四つ葉/角丸/楕円 × 左回り/右回り。最後の滑走路の手前は円に戻す。
     2026/11/26 ヌルヌル化・アクション増量(おっちゃん「もっとヌルヌルに、アクション増やして、ローディング長くてもいい」):
       ・しかけ17種類に(放射の輪/絵のフィールド=倒れるとハート・星・ねこ…が光る/連なる塔/すべり台/階段くだり を追加)。ふだん毎分8〜10個、10分ごと12個、正時15個。
         階段で上った高さの下ろし方は、段差落ち/ビー玉の坂/階段くだり/すべり台の4通り。
       ・カメラの通り道を0.05秒ごとに並べ直して前後0.35秒でならす(ドミノ1枚ごとのカクつきを消す)。
       ・鏡の写しと影は角の丸みのない軽い形で描く(影は影のカメラにだけ写るレイヤー1の写し)。書き換えた範囲だけGPUへ送る。
       ・読み込み中に、使う材質の組み合わせを全部先に準備し、40コマずつ描いて60fpsで回る一番きれいな段を選ぶ。動いてからは、2回続けて遅いときだけ1段下げる。
       ・直した不具合: 倒れきったあとの姿勢を計算するとき大きな時刻で桁あふれし、ドミノが消えることがあった。
     2026/11/26 夕方 5分で1周に(おっちゃん「1分1周じゃなくて5分1周は無理かな？1分カウントも欲しいから何か別のアクションで表現」):
       ・コースは5分かけて時刻のフィールドのまわりを外から内へ回る(1周 約4000枚・しかけ40〜50個、1分ごとの区間に8〜10個)。波が時刻のフィールドに届くのは5分ごと。
       ・1分の合図(別のアクション): 毎分0秒ちょうどに、波がコースの途中の「分の数字のフィールド」に届き、倒れると分の数字(例「07」)が光る(上から見せる)。
         奥の時刻のフィールドも、分の一の位の列だけが57秒ごろ起き上がり、0秒に左から斜めに倒れ直す(5分ごとの全体の波とは違う動き)。
       ・1分ごとの区間の終わりがちょうど0秒になるよう、区間ごとに数字のフィールドを置く位置を前後に動かして合わせる(区間ごとの速さの伸び縮みは0.85〜1.17倍)。
       ・ドミノは512枚ずつの区画で描き、画面に入らない区画は描かず、遠い区画は軽い形にする。次の周のコースは、走っている間に間をあけて少しずつ組む。
       ・周の終わり: 時刻が出て巻き戻しが始まると、カメラは高く弧を描いて次の周の入り口へ(巻き戻る1周を上から見せる)。
       ・10分ごと・正時の大仕掛けは、5分ごとに届く時刻が :X0 / :00 のときの「真上近くまで引く画」と、正時の虹色。毎分の色テーマ・形と向きは今まで通り。
     2026/11/26 夜 背景の玉ボケをやめて空に(「背景の玉みたいなのを変えて欲しいな、美しくね」): 地平線がうっすら明るく上ほど深い色、ゆっくり流れる虹色のもや、
       黒い鏡には暗く映り込む。もやの色はその分の色テーマの色相へゆっくり寄る。霧の色も地平線の色に合わせた。
     操作: なぞる=見回す(離すと4秒で戻る) / ✦=いまの時刻から別のコースに組み直す(次に時刻のフィールドへ届くまでの分)
     テスト用: ?cyc=NNN(5分の周の何秒目から、その周を最初から走っていたことにして始める) ?fast=1(時間が3倍で進む) ?debug=1(コマ数・画質の段・しかけ名・カメラ) ?sec=NN(その秒から、1分ぶんのコースで始める) ?seed=N ?tier=0〜4(画質の段を固定)
       ?debug=1&pause=1(時間を止める) ?debug=1&cam=top(真上から全体) ?debug=1&special=hour|ten&theme=0〜6&shape=0〜4&mir=1|-1&reveal=hour|ten(大仕掛け・色・形の確認)
     three.js r187(assets/vendor/three)。音なし。ギャラリー未追加。 -->

// ---- ローディング: 黒地に1枚のドミノがゆっくり倒れる(three.jsの読み込み前から動く)
(function(){
  var c=document.getElementById('ld'),g=c.getContext('2d'),t0=performance.now();
  function draw(now){
    var L=document.getElementById('load');if(!L||L.classList.contains('gone'))return;
    var t=((now-t0)/1000)%3.2, u=Math.min(1,Math.max(0,(t-.5)/1.6));
    var a=(1-Math.cos(u*Math.PI))/2*1.31, fade=t>2.6?1-(t-2.6)/.6:1;
    g.clearRect(0,0,240,320);
    g.save();g.translate(150,260);g.rotate(a);g.globalAlpha=Math.max(0,fade);
    var gr=g.createLinearGradient(-30,-150,0,0);
    gr.addColorStop(0,'hsla('+(200+u*160)+',90%,72%,.85)');gr.addColorStop(1,'hsla('+(260+u*160)+',90%,60%,.35)');
    g.fillStyle=gr;g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;
    g.beginPath();g.roundRect(-30,-150,30,150,4);g.fill();g.stroke();
    g.restore();
    g.globalAlpha=.25;g.fillStyle='#fff';g.fillRect(40,261,160,1);g.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const Q=new URLSearchParams(location.search);
const FAST=Q.get('fast')==='1', DEBUG=Q.get('debug')==='1';
const SPEED=FAST?3:1;
const V3=THREE.Vector3, QT=THREE.Quaternion;
const UP=new V3(0,1,0), XA=new V3(1,0,0), DEG=Math.PI/180;
const hintEl=document.getElementById('hint'), dbgEl=document.getElementById('dbg');
function showHint(s,ms){hintEl.innerHTML=s;hintEl.classList.add('on');setTimeout(()=>hintEl.classList.remove('on'),ms);}
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));

// ---------- 寸法(静止画と同じ) ----------
const DH=1.0, DW=0.5, DT=0.16, SP=0.62;
const G_REAL=9.81/0.05;          // 1単位=5cm として重力(単位/秒²)
const SM=5.5;                    // スロー倍率(実物の5.5倍ゆっくり)
const CL=new V3(0,DH/2,-DT/2);   // ドミノの中心(支点=手前下の辺からの位置)

// ============================================================
// 1) 倒れ方の物理(読み込み時に1回)
// ============================================================
let PROF=[], NMID=0, END=0, END2=0, DREAL=0.0235, DN=0.13;
function simulate(){
  const N=34, H=DH, T=DT, S=SP, g=G_REAL, I=(H*H+T*T)/3, k=6e5, c=60, dt=2e-5;
  const th=new Float64Array(N), om=new Float64Array(N), hit=new Float64Array(N).fill(-1);
  const cs=new Float64Array(N), sn=new Float64Array(N), tau=new Float64Array(N);
  om[0]=3.0;
  const steps=Math.round(1.3/dt), every=Math.round(1e-3/dt), rec=[];
  let t=0;
  for(let st=0;st<steps;st++){
    for(let i=0;i<N;i++){cs[i]=Math.cos(th[i]);sn[i]=Math.sin(th[i]);tau[i]=g*(-T/2*cs[i]+H/2*sn[i]);}
    for(let i=0;i<N-1;i++){
      const Px=i*S+H*sn[i], Py=H*cs[i];              // iの上の手前の角
      const Bx=(i+1)*S-T*cs[i+1], By=T*sn[i+1];      // i+1の後ろ面の下の角
      const nx=-cs[i+1], ny=sn[i+1];
      const d=(Px-Bx)*nx+(Py-By)*ny, al=(Px-Bx)*sn[i+1]+(Py-By)*cs[i+1];
      if(d<0&&al>=0&&al<=H){
        const r1x=Px-i*S, r1y=Py, r2x=Px-(i+1)*S, r2y=Py;
        const vn=(om[i]*r1y-om[i+1]*r2y)*nx+(-om[i]*r1x+om[i+1]*r2x)*ny;
        let F=-k*d-c*vn; if(F<0)F=0;
        const Fx=F*nx, Fy=F*ny;
        tau[i]+=-(r1x*Fy-r1y*Fx);
        tau[i+1]+=-(r2x*(-Fy)-r2y*(-Fx));
      }
    }
    for(let i=0;i<N;i++){
      om[i]+=tau[i]/I*dt; th[i]+=om[i]*dt;
      if(th[i]>Math.PI/2){th[i]=Math.PI/2;if(om[i]>0)om[i]*=-0.25;}
      if(th[i]<0){th[i]=0;if(om[i]<0)om[i]=0;}
      if(hit[i]<0&&th[i]>1e-3)hit[i]=t;
    }
    t+=dt;
    if(st%every===0)rec.push(Float32Array.from(th));
  }
  const L=520;
  function profileOf(j){
    const a=new Float32Array(L);
    for(let m=0;m<L;m++){
      const tt=hit[j]+m*1e-3, x=tt/1e-3, i0=Math.floor(x);
      if(i0>=rec.length-1){a[m]=rec[rec.length-1][j];continue;}
      const f=x-i0; a[m]=rec[i0][j]+(rec[i0+1][j]-rec[i0][j])*f;
    }
    a[0]=0; return a;
  }
  PROF=[];
  for(let j=12;j<26;j++)PROF.push(profileOf(j));
  NMID=PROF.length;
  PROF.push(profileOf(N-1)); END=NMID;      // 最後の1枚(床まで倒れる)
  PROF.push(profileOf(N-2)); END2=NMID+1;   // 最後から2枚目
  let s=0;for(let j=12;j<26;j++)s+=hit[j+1]-hit[j];
  DREAL=s/14; DN=DREAL*SM;
}
function prof(id,tr){const a=PROF[id];if(!(tr>0))return 0;const x=tr*1000;if(x>=a.length-1)return a[a.length-1];const i=Math.floor(x);return a[i]+(a[i+1]-a[i])*(x-i);}   // 大きな時刻でも桁あふれしないように
function profTimeTo(id,ang){const a=PROF[id];for(let i=1;i<a.length;i++)if(a[i]>=ang){const f=(ang-a[i-1])/(a[i]-a[i-1]);return (i-1+f)/1000;}return a.length/1000;}
const SETTLE=0.5;   // 倒れてから落ち着くまで(実時間秒)

// ============================================================
// 2) 時刻のフィールド
// ============================================================
const FC=25, FR=14, FS=0.7, FSS=Math.sqrt(0.7), FX=0.62*FS, FZ0=2.82;   // フィールドのドミノは0.7倍(縦画面でも時刻が入るように)
const fieldX=c=>(c-12)*FX, fieldZ=r=>FZ0-r*SP*FS;
const FIELD_RECT=[-6.6,6.6,-3.9,3.9];
const RUN_Z0=13.4, RUN_Z1=fieldZ(0)+0.5;
const FONT={
 '0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
 '2':['01110','10001','00001','00010','00100','01000','11111'],'3':['11111','00010','00100','00010','00001','10001','01110'],
 '4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
 '6':['00110','01000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
 '8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00010','01100']};
function digitMask(str){ // "HH:MM" → Uint8Array(FC*FR)
  const m=new Uint8Array(FC*FR), off=[0,6,14,20], ds=[str[0],str[1],str[3],str[4]];
  const set=(c,fr)=>{for(const r of [13-2*fr,12-2*fr])m[r*FC+c]=1;};
  ds.forEach((d,k)=>{const f=FONT[d];for(let fr=0;fr<7;fr++)for(let x=0;x<5;x++)if(f[fr][x]==='1')set(off[k]+x,fr);});
  set(12,2);set(12,4);
  return m;
}

// ============================================================
// 3) 汎用の小道具
// ============================================================
const _m4=new THREE.Matrix4();
function qBasis(X,Y,Z){_m4.makeBasis(X,Y,Z);return new QT().setFromRotationMatrix(_m4);}
function qStand(fwd,up){const Z=fwd.clone().normalize(), Y=up.clone().addScaledVector(Z,-up.dot(Z)).normalize(), X=new V3().crossVectors(Y,Z);return qBasis(X,Y,Z);}
function qLie(longDir,normal){const Y=longDir.clone().normalize(), Z=normal.clone().addScaledVector(Y,-normal.dot(Y)).normalize(), X=new V3().crossVectors(Y,Z);return qBasis(X,Y,Z);}
const qYaw=a=>new QT().setFromAxisAngle(UP,a);
function pivotFromCenter(c,q,s){return c.clone().sub(CL.clone().multiplyScalar(s).applyQuaternion(q));}
function makePath(pts){ // pts:[[x,y,z],...] → 弧長で引ける折れ線(水平の長さ)
  const n=pts.length, cum=new Float64Array(n);
  for(let i=1;i<n;i++){const dx=pts[i][0]-pts[i-1][0],dz=pts[i][2]-pts[i-1][2];cum[i]=cum[i-1]+Math.hypot(dx,dz);}
  return {len:cum[n-1],at(L){
    L=clamp(L,0,cum[n-1]);let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<L)lo=m;else hi=m;}
    const f=(L-cum[lo])/((cum[hi]-cum[lo])||1),a=pts[lo],b=pts[hi];
    return {x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f,z:a[2]+(b[2]-a[2])*f,a:Math.atan2(b[0]-a[0],b[2]-a[2])};
  }};
}
function bezierPts(x0,z0,a0,x1,z1,a1,y,k){
  const d=Math.hypot(x1-x0,z1-z0), h=d*(k||0.42), pts=[];
  const c0=[x0+Math.sin(a0)*h,z0+Math.cos(a0)*h], c1=[x1-Math.sin(a1)*h,z1-Math.cos(a1)*h];
  const N=Math.max(24,Math.ceil(d*8));
  for(let i=0;i<=N;i++){const t=i/N,u=1-t;
    pts.push([u*u*u*x0+3*u*u*t*c0[0]+3*u*t*t*c1[0]+t*t*t*x1,y,u*u*u*z0+3*u*u*t*c0[1]+3*u*t*t*c1[1]+t*t*t*z1]);}
  return pts;
}

// ============================================================
// 4) コースを組む
// ============================================================
// item.k: 0=倒れるドミノ 1=動かない(寝かせたドミノ) 2=飛ぶ破片(塔) 3=まぐさ(2段重ねの横板) 4=上段のドミノ
// 毎分の色テーマ(f(i,h)→[色相,彩度,明度]。iはコースの何枚目か、hはその分の基準の色)
const THEMES=[
  {jp:'虹',w:3,f:(i,h)=>[(h+i/36)%1,1,0.62]},
  {jp:'氷',w:1,f:(i,h)=>{const w=.5+.5*Math.sin(i*0.16+h*6);return [0.5+0.11*w,0.7,0.7+0.08*Math.sin(i*0.37)];}},
  {jp:'琥珀',w:1,f:(i,h)=>{const w=.5+.5*Math.sin(i*0.15+h*6);return [0.045+0.075*w,0.95,0.56+0.08*Math.sin(i*0.31)];}},
  {jp:'パステル',w:1,f:(i,h)=>[(h+i/50)%1,0.5,0.8]},

const COURSE_SHAPES=['円','三つ葉','四つ葉','角丸','楕円'];
function newCourse(seed,theme){
  const C={items:[],spine:[],cams:[],boxes:[],geos:[],posts:[],marbles:[],rnd:mulberry(seed),names:[],nCol:0,collide:[]};
  C.hue=C.rnd();C.theme=theme||0;
  C.color=function(){const t=THEMES[C.theme].f(C.nCol++,C.hue);return new THREE.Color().setHSL(t[0],t[1],t[2]);};
  return C;
}
function addFall(C,x,y,z,a,th,o={}){
  const s=o.s||1, j=o.nojit?0:1;
  const it={k:0,p:new V3(x+(C.rnd()-.5)*.018*j,y,z+(C.rnd()-.5)*.018*j),q:o.q||qYaw(a+(C.rnd()-.5)*.028*j),s,ss:Math.sqrt(s),
    th:th+(C.rnd()-.5)*.012*j,pr:o.pr!=null?o.pr:(C.rnd()*NMID|0),pm:o.pm||1,col:o.col||C.color()};
  if(o.glow!==undefined){it.glow=o.glow;it.col=PIC_DIM.clone();}   // 絵のフィールド: 倒れるほど光る(o.glow=光る色 or null=暗いまま)
  it.ord=it.th; it.w0=it.th; it.w1=it.th+SETTLE*SM*it.ss*Math.max(1,it.pm);
  C.items.push(it);
  if(y>0.01&&o.sup!==false){ // 下に台(黒いガラス)
    const len=o.edge?SP:SP+0.02, back=o.edge?SP/2:0.08;
    C.boxes.push({x:x-Math.sin(a)*back,z:z-Math.cos(a)*back,y0:0,y1:y,w:1.25,l:len,a});
  }
  if(o.spine!==false)C.spine.push([it.th,x,y+0.4*s,z]);
  C.collide.push([x,y,z,it.ord]);
  return it;
}
const PIC_DIM=new THREE.Color(0.025,0.025,0.03);
function addStatic(C,center,q,s,ord,col){
  const it={k:1,p:pivotFromCenter(center,q,s),q,s,ss:Math.sqrt(s),ord,w0:-1e9,w1:-1e9,col:col||C.color()};
  C.items.push(it);C.collide.push([center.x,center.y,center.z,ord]);return it;
}
function frame(C,flip){
  const P=C.pose, ca=Math.cos(P.a), sa=Math.sin(P.a), fl=flip?-1:1;
  return {x:(lx,lz)=>P.x+ca*lx*fl+sa*lz, z:(lx,lz)=>P.z-sa*lx*fl+ca*lz, a:la=>P.a+la*fl, v:(lx,ly,lz)=>new V3(ca*lx*fl+sa*lz,ly,-sa*lx*fl+ca*lz), y:P.y, t:P.t, fl, P:{...P}};
}
function put(C,F,lx,ly,lz,la,th,o){return addFall(C,F.x(lx,lz),F.y+ly,F.z(lx,lz),F.a(la),th,o);}
function setPose(C,F,lx,lz,la,th,y,s){C.pose={x:F.x(lx,lz),z:F.z(lx,lz),a:F.a(la),y:y,t:th,s:s||1};}
function cam(C,t0,t1,m,extra){C.cams.push(Object.assign({t0,t1,m},extra||{}));}

function connector(C,x1,z1,a1,o={}){
  const P=C.pose, pts=bezierPts(P.x,P.z,P.a,x1,z1,a1,P.y,o.k);
  const path=makePath(pts), n=Math.max(1,Math.round(path.len/SP)), sp=path.len/n;
  let th=P.t, last=null;
  for(let i=1;i<=n;i++){const q=path.at(i*sp);th+=DN*(sp/SP)*0.98;last={q,th};addFall(C,q.x,P.y,q.z,q.a,th,o.end&&i===n?{pr:END}:{});}
  C.pose={x:last.q.x,z:last.q.z,a:last.q.a,y:P.y,t:last.th,s:1};
  return n;
}
function run(C,n){const F=frame(C);let th=F.t;for(let i=1;i<=n;i++){th+=DN;put(C,F,0,0,i*SP,0,th);}setPose(C,F,0,n*SP,0,th,F.y);}

const GADGETS={};
GADGETS.stairs=function(C){ // 階段のぼり(一緒にのぼる)
  const F=frame(C);let th=F.t;const rise=0.2,n=14;let lz=0,y=0;
  for(let i=1;i<=n;i++){lz=i*SP;const k=i<=2?0:Math.floor((i-3)/3)+1;y=k*rise;th+=DN*((i>2&&(i-3)%3===0)?1.12:1);put(C,F,0,y,lz,0,th);}

GADGETS.drop=function(C){ // 段差落ち: 台の端から落ちて、下の列を起こす
  const F=frame(C), Y=F.y;let th=F.t;
  for(let i=1;i<=2;i++){th+=DN;put(C,F,0,0,i*SP,0,th);}
  const ze=3*SP, pm=123/90;th+=DN;
  put(C,F,0,0,ze,0,th,{pr:END,pm,edge:true});
  // 台の端の支点から倒れて、下の1枚目の上の後ろの角に触れる角度
  const zgap=0.39, ang=Math.atan2(zgap,1.0-Y);   // 倒れる板の線が、下の1枚の上の後ろの角を通る角度
  const tc=profTimeTo(END,clamp(ang,0.3,2.0)/pm)*SM;
  let th1=th+tc;
  const z1=ze+zgap+DT;
  put(C,F,0,-Y,z1,0,th1);
  for(let i=1;i<=2;i++){th1+=DN;put(C,F,0,-Y,z1+i*SP,0,th1);}
  cam(C,F.t-0.4,th1+0.4,'side',{s:1});
  setPose(C,F,0,z1+2*SP,0,th1,0);
};
GADGETS.marble=function(C){ // ビー玉の坂(並走)
  const F=frame(C), Y=F.y;let th=F.t;
  th+=DN;put(C,F,0,0,SP,0,th);
  th+=DN;const zl=2*SP;put(C,F,0,0,zl,0,th,{pr:END});
  const zp=zl+0.62, R=0.2, ped=Y+0.7;
  const ac=Math.asin(0.42), tcR=profTimeTo(END,ac), tc=tcR*SM;
  const om=(prof(END,tcR+0.002)-prof(END,tcR))/0.002, v0=Math.max(1.5,om*0.75);
  // 坂: 横にS字、高さはなめらかに下がる
  const Lr=3.4+Y*2.6, A=(C.rnd()<.5?-1:1)*(0.6+C.rnd()*0.5), samples=[];
  const NS=Math.ceil((Lr+1.0)/0.02);
  for(let i=0;i<=NS;i++){const s=i*0.02;let lx,ly,lz;
    if(s<=Lr){const u=s/Lr;lx=A*Math.sin(u*Math.PI*2)*(1-u*0.3)*Math.min(1,u*4);lz=zp+s;ly=R+ped*(1-sstep(0,1,u))-Y;}
    else{lx=0;lz=zp+s;ly=R-Y;}
    samples.push([lx,ly,lz]);}
  // 走る時間(転がる球: 加速度 5/7 g sinθ)
  const pts=[],ts=[];let t=th+tc,v=v0;
  for(let i=0;i<samples.length;i++){
    const s=samples[i], w=F.v(s[0],0,s[2]);
    pts.push(new V3(F.P.x+w.x,F.y+s[1],F.P.z+w.z));
    if(i>0){const p0=pts[i-1],p1=pts[i],ds=p0.distanceTo(p1),dy=p1.y-p0.y;
      v=Math.sqrt(Math.max(0.5,v*v-2*(5/7)*G_REAL*dy-0.03*G_REAL*ds));t+=ds/v*SM;}
    ts.push(t);
    if(i%40===0)C.spine.push([t,pts[i].x,pts[i].y,pts[i].z]);
    if(i%10===0)C.collide.push([pts[i].x,pts[i].y-0.2,pts[i].z,t]);
  }
  const zend=zp+Lr+1.0;
  C.marbles.push({pts,ts,r:R});
  // 台座・レール・支柱
  C.posts.push({x:F.x(0,zp),z:F.z(0,zp),y0:0,y1:F.y+ped,r:0.11});
  const railL=[],railR=[];
  for(let i=0;i<=samples.length-1;i+=4){const s=samples[i],a0=samples[Math.max(0,i-2)],a1=samples[Math.min(samples.length-1,i+2)];
    const tx=a1[0]-a0[0],tz=a1[2]-a0[2],tl=Math.hypot(tx,tz)||1,nx=tz/tl,nz=-tx/tl;
    const pL=F.v(s[0]+nx*0.13,0,s[2]+nz*0.13), pR=F.v(s[0]-nx*0.13,0,s[2]-nz*0.13), yy=F.y+s[1]-0.14;
    railL.push(new V3(F.P.x+pL.x,yy,F.P.z+pL.z));railR.push(new V3(F.P.x+pR.x,yy,F.P.z+pR.z));
    if(i%45===0&&yy>0.08){C.posts.push({x:F.P.x+pL.x,z:F.P.z+pL.z,y0:0,y1:yy,r:0.025});C.posts.push({x:F.P.x+pR.x,z:F.P.z+pR.z,y0:0,y1:yy,r:0.025});}
  }
  for(const rl of [railL,railR])C.geos.push({type:'tube',pts:rl,r:0.024});
  const tArr=ts[ts.length-1];
  const z1=zend+R+DT;
  put(C,F,0,-Y,z1,0,tArr+0.02);
  let th1=tArr+0.02;for(let i=1;i<=2;i++){th1+=DN;put(C,F,0,-Y,z1+i*SP,0,th1);}
  cam(C,th+tc-0.6,tArr+0.5,'side',{marble:true});
  setPose(C,F,0,z1+2*SP,0,th1,0);
};
GADGETS.split=function(C){ // 2列に分かれて並走→合流
  const F=frame(C, C.rnd()<.5);let th=F.t;

  let arrive=[];
  for(const ln of lanes){
    const pts=[];for(let i=0;i<=200;i++){const u=i/200,lz=0.5+u*Lf;const b=Math.sin(u*Math.PI);pts.push([ln.sg*(0.3+W*Math.pow(b,0.7)),0,lz]);}
    const path=makePath(pts), n=Math.round(path.len/ln.sp), sp=path.len/n;let t=th;
    for(let i=0;i<=n;i++){const q=path.at(i*sp);t+=ln.dn*(i===0?1:sp/SP);put(C,F,q.x,0,q.z,q.a,t,{spine:false});
      if(ln.sg<0)C.spine.push([t,F.x(0,q.z),F.y+0.4,F.z(0,q.z)]);}

};
GADGETS.loop=function(C){ // 宙返りの輪(回り込む)
  const F=frame(C,C.rightOut);let th=F.t;   // 輪の横ずれは内側へ(追いかけるカメラは外側を通るので、輪にかぶらない)
  th+=DN;put(C,F,0,0,SP,0,th);
  const r=1.45, drift=1.1, z0=SP*2;
  const NS=600, pts=[];
  for(let i=0;i<=NS;i++){const al=i/NS*Math.PI*2;pts.push([drift*al/(Math.PI*2),r-r*Math.cos(al),z0+r*Math.sin(al),al]);}
  const cum=[0];for(let i=1;i<=NS;i++){const a=pts[i],b=pts[i-1];cum.push(cum[i-1]+Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]));}
  const Ltot=cum[NS], n=Math.round(Ltot/SP), sp=Ltot/n;
  let j=0;const ring=[];
  for(let i=0;i<n;i++){const L=i*sp;while(cum[j+1]<L)j++;const al=pts[j][3];
    const lp=new V3(drift*al/(2*Math.PI),r-r*Math.cos(al),z0+r*Math.sin(al));
    const tg=new V3(drift/(2*Math.PI),r*Math.sin(al),r*Math.cos(al)).normalize(), nm=new V3(0,Math.cos(al),-Math.sin(al));
    const wp=F.v(lp.x,0,lp.z), fw=F.v(tg.x,tg.y,tg.z);

  }

  const rib=[];for(let i=0;i<=160;i++){const al=i/160*Math.PI*2;const lp=new V3(drift*al/(2*Math.PI),r-r*Math.cos(al)-0.0,z0+r*Math.sin(al));const nm=new V3(0,Math.cos(al),-Math.sin(al));
    const c=F.v(lp.x,0,lp.z), N=F.v(nm.x,nm.y,nm.z), B=F.v(1,0,0);rib.push({c:new V3(F.P.x+c.x,F.y+lp.y,F.P.z+c.z).addScaledVector(N,-0.025),n:N,b:B});}

  cam(C,F.t-0.3,th+0.6,'orbit',{c:center,a0:F.a(0)+Math.PI/2*F.fl});
  th+=DN;put(C,F,drift,0,z0+SP,0,th);
  setPose(C,F,drift,z0+SP,0,th,F.y);
};
GADGETS.bridge=function(C){ // 寝かせたドミノの橋
  const F=frame(C);let th=F.t;
  const layers=[1,2,3,4,4,4,4,4,3,2,1], hy=DT;
  const zc=i=>SP*(i+1);
  const right=F.v(1,0,0), fwd=F.v(0,0,1);
  const qLat=qLie(right,UP), qLong=qLie(fwd,UP);
  for(let i=0;i<layers.length;i++){
    const deck=i>=3&&i<=7, nStack=deck?(i===3||i===7?3:0):layers[i];
    for(let j=0;j<nStack;j++){const c=new V3(F.x(0,zc(i)-0.08),F.y+hy*(j+0.5),F.z(0,zc(i)-0.08));addStatic(C,c,qLat,1,th+DN*i);}
    const y=F.y+hy*layers[i];th+=DN*(i===0?1:1.05);
    put(C,F,0,y-F.y,zc(i),0,th,{sup:false});
  }
  // 橋の床: 縦向きの寝かせたドミノ2列×3枚、下は空洞
  const z3=zc(3)-0.08, z7=zc(7)-0.08, span=z7-z3+0.5;
  for(const lx of [-0.26,0.26])for(let k=0;k<3;k++){const lz=z3-0.25+span*(k+0.5)/3;
    const c=new V3(F.x(lx,lz),F.y+hy*3.5,F.z(lx,lz));addStatic(C,c,qLong,1,F.t+DN*5);}
  cam(C,F.t-0.3,th+0.4,'side',{s:-1});
  setPose(C,F,0,zc(layers.length-1),0,th,F.y);
  // 最後は床の高さに戻る
  const F2=frame(C);th+=DN;put(C,F2,0,0,SP,0,th);setPose(C,F2,0,SP,0,th,F.y);
};
GADGETS.grow=function(C){ // だんだん大きくなる
  const F=frame(C);let th=F.t,lz=0,s=1;
  const n=8, gr=1.17;
  for(let k=1;k<=n;k++){const s1=Math.pow(gr,k);lz+=SP*0.5*(s+s1);th+=DN*Math.sqrt(s);s=s1;
    put(C,F,0,0,lz,0,th,{s,pr:k===n?END:undefined});}

  const tc=profTimeTo(END,thc)*SM*Math.sqrt(s);

GADGETS.fan=function(C){ // 扇に広がる
  const F=frame(C);let th=F.t;
  const rows=8, half=(38+C.rnd()*14)*DEG, apex=0.0;
  let centerLast=null;
  for(let m=1;m<=rows;m++){const r=SP*m, nn=2*Math.floor(r*half/0.62)+1, t=th+DN*m;
    for(let k=0;k<nn;k++){const ph=nn===1?0:-half+2*half*k/(nn-1), mid=(nn%2===1)&&k===(nn-1)/2;
      const lx=Math.sin(ph)*r, lz=apex+Math.cos(ph)*r;
      put(C,F,lx,0,lz,ph,t+Math.abs(ph)*0.08,{spine:mid,pr:m===rows&&!mid?END:undefined});

  }
  const c=new V3(F.x(0,SP*rows*0.6),F.y,F.z(0,SP*rows*0.6));
  cam(C,F.t-0.3,centerLast.t+0.6,'crane',{c,h:6.5,rr:4.5,a0:F.a(0)});

// 塔(寝かせたドミノを井桁に積む)を1本くずす。破片は前へ飛んで寝る。reachで前へ飛ぶ距離の上限
function towerAt(C,F,zt,layers,tHit,reach){
  const right=F.v(1,0,0), fwd=F.v(0,0,1);
  let maxFwd=0, lastLand=tHit;
  for(let j=0;j<layers;j++)for(let i=0;i<2;i++){
    const even=j%2===0, o=i?0.3:-0.3;
    const lx=even?o:0, lz=even?zt:zt+o, y=F.y+DT*(j+0.5);
    const c0=new V3(F.x(lx,lz),y,F.z(lx,lz)), q0=even?qLie(fwd,UP):qLie(right,UP);
    let fwdL=0.7+DT*j*1.25+C.rnd()*0.35;if(reach)fwdL=Math.min(fwdL,reach-0.25+C.rnd()*0.2);
    const latL=lx*1.6+(C.rnd()-.5)*0.9+(even?0:(i?0.35:-0.35));
    const lz1=zt+fwdL, c1=new V3(F.x(latL,lz1),F.y+DT*0.5+0.004*(j*2+i),F.z(latL,lz1));
    const q1=qLie(F.v(Math.sin(C.rnd()*6.28),0,Math.cos(C.rnd()*6.28)),UP);
    const t0=tHit+(j*0.012+C.rnd()*0.01)*SM, v=0.4+C.rnd()*0.6;
    const tr=(v+Math.sqrt(v*v+2*G_REAL*Math.max(0.001,y-c1.y)))/G_REAL, tf=tr*SM*1.15;
    const it={k:2,c0,q0,c1,q1,t0,tf,v,s:1,ss:1,ord:t0,w0:t0,w1:t0+tf+0.35*SM,col:C.color(),spin:(C.rnd()-.5)*4};
    C.items.push(it);C.collide.push([c1.x,c1.y,c1.z,t0]);
    maxFwd=Math.max(maxFwd,fwdL);lastLand=Math.max(lastLand,t0+tf);
  }
  C.spine.push([tHit,F.x(0,zt),F.y+0.7,F.z(0,zt)]);
  return {maxFwd,lastLand};
}
GADGETS.tower=function(C){ // 塔くずし
  const F=frame(C);let th=F.t;
  th+=DN;put(C,F,0,0,SP,0,th);
  th+=DN;put(C,F,0,0,2*SP,0,th,{pr:END});
  const zt=2*SP+0.95, tHit=th+profTimeTo(END,0.45)*SM;
  const R=towerAt(C,F,zt,9,tHit,0);
  const z1=zt+R.maxFwd+0.75;let th1=R.lastLand-0.15*SM;
  put(C,F,0,0,z1,0,th1);
  for(let i=1;i<=2;i++){th1+=DN;put(C,F,0,0,z1+i*SP,0,th1);}
  cam(C,F.t-0.3,th1+0.3,'pull',{c:new V3(F.x(0,zt+0.8),F.y,F.z(0,zt+0.8))});
  setPose(C,F,0,z1+2*SP,0,th1,F.y);
};
GADGETS.towers3=function(C){ // 連なる塔: 3本の塔が順にくずれて、次の塔を倒す
  const F=frame(C);let th=F.t;

GADGETS.twotier=function(C){ // 2段重ね(ドミノの上を走る)

GADGETS.spiral=function(C){ // 渦巻き(二重のうず)
  const turns=1.45+C.rnd()*0.3, b=1.24/(Math.PI), tmax=turns*2*Math.PI, tmin=0.62/b;
  const P=[];
  for(let i=0;i<=600;i++){const t=tmax-(tmax-tmin)*i/600, r=b*t;P.push([r*Math.cos(t),r*Math.sin(t)]);}
  // 中心のS字(内側の端どうしを、同じ向きの接線でつなぐ)
  {const A=[b*tmin*Math.cos(tmin),b*tmin*Math.sin(tmin)];let T=[-(b*Math.cos(tmin)-b*tmin*Math.sin(tmin)),-(b*Math.sin(tmin)+b*tmin*Math.cos(tmin))];
   const tl=Math.hypot(T[0],T[1]);T=[T[0]/tl,T[1]/tl];const h=0.55, P1=[A[0]+T[0]*h,A[1]+T[1]*h], P2=[-A[0]-T[0]*h,-A[1]-T[1]*h], P3=[-A[0],-A[1]];
   for(let i=1;i<40;i++){const t=i/40,u=1-t;P.push([u*u*u*A[0]+3*u*u*t*P1[0]+3*u*t*t*P2[0]+t*t*t*P3[0],u*u*u*A[1]+3*u*u*t*P1[1]+3*u*t*t*P2[1]+t*t*t*P3[1]]);}}
  for(let i=0;i<=600;i++){const t=tmin+(tmax-tmin)*i/600, r=b*t;P.push([-r*Math.cos(t),-r*Math.sin(t)]);}
  // 入口を原点・+z向きにそろえる
  const dx=P[1][0]-P[0][0], dy=P[1][1]-P[0][1], ang0=Math.atan2(dx,dy);
  const loc=P.map(p=>{const x=p[0]-P[0][0],y=p[1]-P[0][1];const c=Math.cos(-ang0),s=Math.sin(-ang0);let lx=x*c+y*s,lz=-x*s+y*c;return [lx,0,lz+0.62];});
  // 外向きに広がるよう、x の向きを決める
  let sx=0;for(const p of loc)sx+=p[0];const mir=(sx>0)===!!C.rightOut?1:-1;   // 外側へ広げる
  const F=frame(C);

  let cx=0,cz=0;for(const p of loc){cx+=p[0]*mir;cz+=p[2];}cx/=loc.length;cz/=loc.length;

  C.pose={x:last.x,z:last.z,a:last.a,y:F.y,t:th,s:1};

GADGETS.wave=function(C){ // うねりながら倒れる面

GADGETS.slide=function(C){ // すべり台: 台の端の1枚が倒れて、ガラスの坂を寝たまま滑りおり、下の列を起こす
  const F=frame(C), Y=F.y;let th=F.t;
  for(let i=1;i<=2;i++){th+=DN;put(C,F,0,0,i*SP,0,th);}
  const ze=3*SP, al=22*DEG, L=Y/Math.tan(al), a=F.a(0);

  C.boxes.push({x:F.x(0,ze-SP/2),z:F.z(0,ze-SP/2),y0:0,y1:Y,w:1.25,l:SP,a});
  // 坂(黒いガラスの板)

  C.geos.push({type:'box',c:rc,q:rq,size:[0.9,0.05,Math.hypot(L,Y)+0.05]});
  // 1枚の動き: ①台の端を支点に倒れて坂に寝る ②坂を滑る ③床を少し滑って次の1枚にぶつかる
  const keys=[], pv=new V3(F.x(0,ze),Y,F.z(0,ze)), dn=F.v(0,-Math.sin(al),Math.cos(al)), fw=F.v(0,0,1);
  const thEnd=Math.PI/2+al;let t=th;

  while(s2<slope){const dtr=0.004;v+=acc*dtr;s2+=v*dtr;tt+=dtr*SM;const sc=Math.min(s2,slope);p.copy(pv).addScaledVector(dn,sc);

  const z1=ze+L+zStop+DH+DT+0.02;let th1=tt;

  for(let i=1;i<=2;i++){th1+=DN;put(C,F,0,-Y,z1+i*SP,0,th1);}
  cam(C,th-0.3,th1+0.4,'side',{marble:true});

const GADGET_LEN={stairs:9.5,drop:3.5,marble:7,split:11,loop:4.5,bridge:8,grow:13,fan:5.5,tower:6,twotier:7,spiral:8,wave:10};
const GADGET_JP={gate:'分の数字',ripple:'放射の輪',picture:'絵のフィールド',cascade:'階段くだり',slide:'すべり台',towers3:'連なる塔',stairs:'階段',drop:'段差落ち',marble:'ビー玉の坂',split:'分岐→合流',loop:'宙返りの輪',bridge:'寝かせたドミノの橋',grow:'だんだん大きく',fan:'扇',tower:'塔くずし',twotier:'2段重ね',spiral:'渦巻き',wave:'うねる面'};

function planList(rnd,kTotal){
  const pool=['split','loop','bridge','grow','fan','tower','twotier','spiral','wave','marble','ripple','picture','towers3'];
  for(let i=pool.length-1;i>0;i--){const j=rnd()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  if(kTotal<=0)return [];
  const combo=kTotal>=4&&rnd()<0.6;   // 階段は、段差落ちかビー玉の坂とセット(上った高さを下ろす)
  const list=pool.slice(0,combo?kTotal-2:kTotal);
  if(combo){const low=['drop','cascade','slide'];if(!list.includes('marble'))low.push('marble');list.splice(rnd()*(list.length+1)|0,0,'stairs',low[rnd()*low.length|0]);}   // 下ろし方は4通り
  return list;
}

// コース全体: 時刻のフィールドのまわりを外から内へ回り、最後に南からフィールドへ入る
// コース全体(5分で1周): 時刻のフィールドのまわりを外から内へ回り、最後に南からフィールドへ入る。
// legs=[{Ta,theme,gate,k}] 1分ごとの区間。区間の終わり(gateあり)は分の数字のフィールドで、ちょうど毎分0秒に届く。最後の区間は時刻のフィールドへ。
function snap(C){return {n:[C.items.length,C.spine.length,C.cams.length,C.boxes.length,C.geos.length,C.posts.length,C.collide.length,C.marbles.length,C.names.length],pose:{...C.pose},nCol:C.nCol};}
function restore(C,S){const a=[C.items,C.spine,C.cams,C.boxes,C.geos,C.posts,C.collide,C.marbles,C.names];a.forEach((x,i)=>x.length=S.n[i]);C.pose={...S.pose};C.nCol=S.nCol;}
function buildCourse(seed,legs,turns,opt){
  opt=opt||{};
  const C=newCourse(seed,legs[0].theme);
  const wOf=l=>l.Ta, totTa=legs.reduce((a,l)=>a+wOf(l),0);   // 角度は時間に比例して割り当てる
  const span=turns*2*Math.PI, phiEnd=Math.PI/2-0.35, phiStart=phiEnd-span;
  const R0=17+span*2.05, R1=17;   // 周と周の間は約13
  const Rof=ph=>lerp(R0,R1,clamp((ph-phiStart)/Math.max(span,1e-3),0,1));
  // コースの形(円/三つ葉/四つ葉/角丸/楕円)と回る向き(mir=-1で右回り)。最後の0.9radは円に戻して滑走路へ入りやすくする
  const shp=opt.shape||0, mir=opt.mir||1, sp0=opt.sp||0;
  const Rmod=ph=>{const e=clamp((phiEnd-ph)/0.9,0,1);let m=1;
    if(shp===1)m=1+0.15*Math.sin(3*ph+sp0);else if(shp===2)m=1+0.12*Math.sin(4*ph+sp0);
    else if(shp===3){const c=Math.abs(Math.cos(ph+sp0)),s2=Math.abs(Math.sin(ph+sp0));m=0.93*Math.pow(c**4+s2**4,-0.25);}
    else if(shp===4)m=1+0.2*Math.cos(2*(ph-sp0));
    return 1+e*(m-1);};
  const G=ph=>{const R=Rof(ph)*Rmod(ph);return [R*Math.cos(ph)*mir,R*Math.sin(ph)];};
  const tang=ph=>{const a=G(ph-1e-3),b=G(ph+1e-3);return Math.atan2(b[0]-a[0],b[1]-a[1]);};
  const g0=G(phiStart);
  C.pose={x:g0[0],z:g0[1],a:tang(phiStart),y:0,t:0,s:1};
  C.shape=shp;C.mir=mir;C.legs=[];
  addFall(C,C.pose.x,0,C.pose.z,C.pose.a,0);   // 最初の1枚(押される1枚)
  run(C,2);
  let phi=phiStart;
  const curPhi=()=>{let p=Math.atan2(C.pose.z,C.pose.x*mir);while(p<phi-Math.PI)p+=2*Math.PI;while(p>phi+Math.PI)p-=2*Math.PI;return p;};
  let cum=0, n0=0;
  for(let L=0;L<legs.length;L++){
    const leg=legs[L], ph0=phiStart+span*cum/totTa, ph1=phiStart+span*(cum+wOf(leg))/totTa;cum+=wOf(leg);
    const last=L===legs.length-1;
    let k=leg.k, S=snap(C), fOk=null;
    for(let tryN=0;tryN<4;tryN++){
      restore(C,S);C.theme=leg.theme;
      const rl=mulberry(seed*31+L*977+tryN*13);
      let list=planList(rl,k);
      const kk=list.length;
      for(let i=0;i<kk;i++){
        const g=list[i];phi=curPhi();
        const slot=ph0+(ph1-ph0)*(i+0.35)/(kk+(last?0.15:0.9));
        let target=Math.max(slot,phi+0.22);
        if(list[i-1]==='stairs')target=phi+0.16;
        const gp=G(target);connector(C,gp[0],gp[1],tang(target));
        const P=C.pose, rx=Math.cos(P.a), rz=-Math.sin(P.a);C.rightOut=(rx*P.x+rz*P.z)>0;   // 大きなしかけは外側へ広げる
        GADGETS[g](C);C.names.push(GADGET_JP[g]);
      }
      let nEnd;
      if(!last){ // 区間の終わり: 分の数字のフィールド。届く自然時間が区間の長さに近くなるよう、置く位置を前後に動かして合わせる

          restore(C,S2);phi=phi0;const gp=G(target);

          GADGETS.gate(C,leg.gate);nEnd=C.gateHit;
          const want=leg.Ta, have=nEnd-n0, R=Math.max(8,Math.hypot(C.pose.x,C.pose.z));
          if(Math.abs(want/have-1)<0.06)break;

          target=Math.max(phi0+0.25,target+dphi);

        for(let i=1;i<=nRun;i++){th+=DN*(spR/SP);addFall(C,0,0,RUN_Z0-i*spR,Math.PI,th).run=true;}
        C.pose.t=th;nEnd=th+DN;   // フィールドの1列目が倒れる自然時間
      }

function collides(C){
  const cell=1.0, map=new Map(), key=(x,z)=>((x/cell|0)+500)*4096+((z/cell|0)+500);
  for(const p of C.collide){
    if(p[0]>FIELD_RECT[0]&&p[0]<FIELD_RECT[1]&&p[2]>FIELD_RECT[2]&&p[2]<FIELD_RECT[3]&&!(Math.abs(p[0])<0.4&&p[2]>2.6))return 'field';
    const k=key(p[0],p[2]);
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const L=map.get(key(p[0]+dx*cell,p[2]+dz*cell));if(!L)continue;
      for(const q of L){if(Math.abs(q[3]-p[3])<1.8)continue;if(Math.abs(q[1]-p[1])>1.3)continue;
        if(Math.hypot(q[0]-p[0],q[2]-p[2])<0.72)return 'self';}}
    let L=map.get(k);if(!L){L=[];map.set(k,L);}L.push(p);
  }

}
// 1周ぶんのコースを決める。1分ごとの区間に、しかけを8〜10個
function kFor(Ta,special){return Ta<14?0:Ta<24?2:Ta<34?4:Ta<44?6:8;}   // 5分1周なので、1周でしかけの種類はほぼ全部出る
async function planCourse(seed,legs,opt,yieldFn){
  opt=opt||{};
  const rnd=mulberry(seed*7+3);
  legs.forEach(l=>{l.k=l.k!=null?l.k:kFor(l.Ta)+(l.Ta>44?(rnd()*3|0):0);});
  let best=null,bestScore=1e9;
  for(let attempt=0;attempt<14;attempt++){
    if(attempt===8&&!best)legs.forEach(l=>l.k=Math.max(0,l.k-3));   // 重なってばかりなら、しかけを減らして組む
    const s=seed+attempt*7919;
    const o={shape:opt.shape!=null?opt.shape:(mulberry(s+1)()*COURSE_SHAPES.length|0),mir:opt.mir||(mulberry(s+2)()<.5?1:-1),sp:mulberry(s+3)()*6.28};
    let turns=clamp(legs.reduce((a,l)=>a+l.Ta,0)/45,0.12,6), C=null;
    for(let it=0;it<4;it++){
      C=buildCourse(s,legs,turns,o);
      if(yieldFn)await yieldFn();
      const fs=C.legs.map(l=>l.f), mean=fs.reduce((a,b)=>a+b,0)/fs.length;
      if(fs.every(f=>f>0.86&&f<1.16))break;
      turns=clamp(turns*(1+(mean-1)*0.7),0.05,7);
    }
    const col=collides(C), fs=C.legs.map(l=>l.f), score=fs.reduce((a,f)=>a+Math.abs(Math.log(f)),0);
    if(!col&&C.items.length<CAP&&fs.every(f=>f>0.86&&f<1.16)){best=C;break;}
    if(!col&&C.items.length<CAP&&score<bestScore){best=C;bestScore=score;}
  }
  if(!best)best=buildCourse(seed,legs.map(l=>({...l,k:0})),0.1*legs.length,{});
  best.legs.forEach(l=>l.f=clamp(l.f,0.6,1.6));
  best.special=opt.special||null;
  best.items.sort((a,b)=>a.ord-b.ord);   // 並び順(巻き戻しの順番)
  best.spine.sort((a,b)=>a[0]-b[0]);
  return best;
}

const _q=new QT(),_q2=new QT(),_v=new V3(),_v2=new V3(),_v3=new V3(),_s=new V3(),_m=new THREE.Matrix4();

function lintelFrame(L,τ){ // まぐさ: 下の2枚の頭に乗る

function evalItem(it,τ,out){

    case 2:{ // 塔の破片: 放物線で落ちて、少し跳ねる

    case 3:{lintelFrame(it,τ);_m.makeBasis(_X,_Y,_Z);_q2.setFromRotationMatrix(_m);
      _v.copy(_v3).addScaledVector(_Z,DT/2);_v2.copy(CL).applyQuaternion(_q2);_v.sub(_v2);return out.compose(_v,_q2,_s.setScalar(1));}
    case 4:{const L=it.L;lintelFrame(L,τ);

      _v.copy(_v3).addScaledVector(_Z,DT+0.001).addScaledVector(_Y,DT/2);
      _A.crossVectors(_Z,_Y);_m.makeBasis(_A,_Z,_Y);_q2.setFromRotationMatrix(_m);
      _q.setFromAxisAngle(XA,prof(it.pr,(τ-it.th)/SM));_q2.multiply(_q);
      return out.compose(_v,_q2,_s.setScalar(1));}
    case 8:{ // すべり台の1枚: 支点の位置と倒れ角のキーをなぞる
      const K=it.keys;let i=0;

      if(i<0){x=K[0][1];y=K[0][2];z=K[0][3];a=0;}

  }
}

  C.tStart=tStart;C.segs=[];let a0=tStart;

// 周が時刻のフィールドに届く分 A の時刻が :00 なら正時、:10 :20 … なら10分ごと
function minuteOfHour(M){return new Date(M*60000).getMinutes();}

function revealOf(M){if(DEBUG&&Q.get('reveal'))return Q.get('reveal');return isArrival(M)?specialAt(M):null;}   // 分Mの0秒に出た時刻が大仕掛けの時刻か

  if(specialOf(M)==='hour')return 0;   // 正時は虹
  const r=mulberry(((M*2654435761)^SEED0)>>>0);r();const x=r();
  let tot=0;for(const t of THEMES)tot+=t.w;let a=x*tot;
  for(let i=0;i<THEMES.length;i++){a-=THEMES[i].w;if(a<0)return i;}return 0;
}
// tStart から、次に時刻のフィールドへ届く時刻(5分ごと)までを、1分ごとの区間に分ける
function makeLegs(tStart){
  let A=Math.ceil((tStart+0.001)/60);while(!isArrival(A))A++;
  const bounds=[];let b=Math.ceil((tStart+9)/60)*60;   // 9秒より近い分の区切りは飛ばす
  for(;b<A*60;b+=60)bounds.push(b);
  bounds.push(A*60);
  const legs=[];let a0=tStart;
  for(const b1 of bounds){const M=Math.round(b1/60)-1, last=b1===A*60;
    legs.push({Ta:b1-a0,theme:themeOf(M),gate:last?null:String(minuteOfHour(M+1)).padStart(2,'0'),special:last?((DEBUG&&Q.get('special'))||specialAt(A)):null});a0=b1;}

async function makeCourseFor(tStart,yieldFn){

const MORPH=3.2;

}

// ---- 毎コマ: コースのドミノ
function updateCourse(vt){
  if(!cur)return;
  const τ=courseTau(cur,vt);
  if(morph){
    const n=morph.n, md=1.25;let done=true;
    for(let i=0;i<n;i++){
      const st=morph.t0+0.2+(1-i/Math.max(1,n-1))*1.55, u=clamp((vt-st)/md,0,1);
      if(u<1)done=false;
      const e=ease3(u), fr=morph.from[i], it=slotIt[i], to=it?cur.toPose[i]:null;
      if(fr&&to){_v.lerpVectors(fr.p,to.p,e);_v.y+=Math.sin(Math.PI*e)*(0.35+fr.p.distanceTo(to.p)*0.06);_q2.slerpQuaternions(fr.q,to.q,e);_s.lerpVectors(fr.s,to.s,e);}
      else if(fr){_v.copy(fr.p);_v.y+=e*0.3;_q2.copy(fr.q);_s.copy(fr.s).multiplyScalar(1-e);}
      else if(to){_v.copy(to.p);_q2.copy(to.q);_s.copy(to.s).multiplyScalar(e);}
      else continue;
      _s.x=Math.max(1e-4,_s.x);_s.y=Math.max(1e-4,_s.y);_s.z=Math.max(1e-4,_s.z);
      _m.compose(_v,_q2,_s);setM(FN+i,_m);
      if(it){const c=it.col;if(fr)setC(FN+i,lerp(fr.c.r,c.r,e),lerp(fr.c.g,c.g,e),lerp(fr.c.b,c.b,e));else setC(FN+i,c.r,c.g,c.b);}
    }
    // 飾り: 古いのは鏡に沈み、新しいのは鏡から上がる
    if(oldDecor){const u=clamp((vt-oldDecor.decorSink)/1.3,0,1);setDecorY(oldDecor,-oldDecor.decorH*ease3(u));}
    {const u=clamp((vt-morph.t0-0.15)/1.6,0,1);setDecorY(cur,-cur.decorH*(1-ease3(u)));}
    if(done&&vt>morph.t0+MORPH){morph=null;setCount(FN+slotCount);if(oldDecor){disposeDecor(oldDecor);oldDecor=null;}setDecorY(cur,0);slotSt.fill(-1);setChunkBounds(cur);setCulling(true);}
  }
  if(!morph){
    for(let i=0;i<slotCount;i++){
      const it=slotIt[i];if(!it)continue;
      const st=τ<it.w0?0:τ>it.w1?2:1;
      if(st!==slotSt[i]||st===1){const tt=st===0?-1e9:st===2?1e9:τ;evalItem(it,tt,_m);setM(FN+i,_m);slotSt[i]=st;
        if(it.glow!==undefined){ // 絵のフィールド: 倒れた角度で光らせる
          const g=clamp(prof(it.pr,(tt-it.th)/(SM*it.ss))/1.2,0,1), D=PIC_DIM;let r=D.r,gg=D.g,b=D.b;
          if(it.glow){const kk=g*g*2.2;r=lerp(r,it.glow.r*kk,g);gg=lerp(gg,it.glow.g*kk,g);b=lerp(b,it.glow.b*kk,g);}

    }
  }
  if(cur.decor)for(const mb of cur.marbles){
    const ts=mb.ts;let p;
    if(τ<=ts[0]||morph)p=mb.pts[0];
    else if(τ>=ts[ts.length-1])p=mb.pts[mb.pts.length-1];
    else{let lo=0,hi=ts.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(ts[m]<τ)lo=m;else hi=m;}
      const f=(τ-ts[lo])/(ts[hi]-ts[lo]);_v.lerpVectors(mb.pts[lo],mb.pts[hi],f);p=_v;

  }
}

const FI=[];   // {p,q,pr,r,c}

function initField(){
  const rnd=mulberry(77);
  for(let r=0;r<FR;r++)for(let c=0;c<FC;c++){
    FI.push({p:new V3(fieldX(c)+(rnd()-.5)*0.01,0,fieldZ(r)+(rnd()-.5)*0.01),q:qYaw(Math.PI+(rnd()-.5)*0.02),pr:r===FR-1?END:(rnd()*NMID|0),r,c,j:(rnd()-.5)*0.02});

function fieldTimes(f,M){ // 倒れる時刻・起き上がる時刻(絶対秒)
  const tf=isArrival(M)?M*60+(f.r*DN+Math.abs(f.c-12)*0.3*DN)*FSS+f.j:M*60+((f.c-20)*2.2*DN+f.r*0.35*DN)*FSS+f.j;

const RISE=2.6;

  const moving=sec<5.6||sec>55.8;

  for(let i=0;i<FN;i++){
    const f=FI[i], [tf,tr]=fieldTimes(f,M);
    let th;
    if(vt>=tr&&cellMoves(f,M+1))th=prof(f.pr,Math.max(0,SETTLE*SM*FSS-(vt-tr)*RISE)/(SM*FSS));

const FIELD_C=new V3(0,0,-0.2);

function spineAt(C,τ,out){

  const a=S[lo],b=S[hi],f=(τ-a[0])/((b[0]-a[0])||1);

// カメラ用の通り道: 波の先頭の位置を0.05秒ごとに並べ直し、前後0.35秒でならしておく(ドミノ1枚ごとのカクつきを消す)
function smoothSpine(C){

}
function camSpineAt(C,τ,out){
  const S=C.cs;if(!S)return spineAt(C,τ,out);
  const x=clamp((τ-S.t0)/S.dt,0,S.n-1), i=Math.min(S.n-2,Math.floor(x)), f=x-i, P=S.P, a=i*3, b=a+3;
  return out.set(P[a]+(P[b]-P[a])*f,P[a+1]+(P[b+1]-P[a+1])*f,P[a+2]+(P[b+2]-P[a+2])*f);
}
const _h=new V3(),_ha=new V3(),_hb=new V3(),_hc=new V3(),_d=new V3(),_r=new V3(),_fp=new V3(),_ft=new V3();
let focusDist=8,lastMode='',overW=0,sharpW=0;
function pickMode(C,τ){for(const c of C.cams){if(τ>=c.t0&&τ<=c.t1)return c;}return null;}
function courseCam(C,τ,cm,P,T){
  camSpineAt(C,τ,_h);camSpineAt(C,τ+0.9,_ha);camSpineAt(C,τ-0.9,_hb);camSpineAt(C,τ+0.9,_hc);
  _d.subVectors(_hc,_hb);_d.y=0;if(_d.lengthSq()<1e-6)_d.set(0,0,-1);_d.normalize();
  _r.set(_d.z,0,-_d.x);
  const out=Math.sign(_r.x*_h.x+_r.z*_h.z)||1;   // 外側へずらすと、内側のフィールドが奥に見える
  const mode=cm?cm.m:'chase';
  const y0=_h.y-0.4;
  switch(mode){
    case 'climb':P.copy(_h).addScaledVector(_d,-3.0).addScaledVector(_r,out*1.5);P.y=y0+1.15;T.copy(_ha).addScaledVector(_d,0.8);T.y+=0.55;break;
    case 'high':P.copy(_h).addScaledVector(_d,-4.2).addScaledVector(_r,out*2.0);P.y=y0+4.3;T.copy(_ha);T.y=y0+0.2;break;
    case 'low':{const s=cm.s||3;P.copy(_h).addScaledVector(_d,-2.6-s*0.7).addScaledVector(_r,out*(1.9+s*0.45));P.y=y0+0.5;camSpineAt(C,τ+1.4,T);T.y=y0+0.3+s*0.35;break;}
    case 'side':P.copy(_h).addScaledVector(_r,out*3.3).addScaledVector(_d,-1.3);P.y=y0+(cm.marble?1.0:1.35);T.copy(_h).addScaledVector(_d,1.0);T.y=y0+0.3;break;
    case 'orbit':{const u=clamp((τ-cm.t0)/(cm.t1-cm.t0),0,1), a=cm.a0+(u-0.5)*1.1;P.set(cm.c.x+Math.sin(a)*7.0,cm.c.y+0.9,cm.c.z+Math.cos(a)*7.0);T.copy(cm.c);T.y-=0.2;break;}
    case 'crane':{const u=clamp((τ-cm.t0)/(cm.t1-cm.t0),0,1), a=cm.a0+Math.PI+(u-0.5)*(cm.spin||0.5);
      P.set(cm.c.x+Math.sin(a)*cm.rr,cm.c.y+cm.h,cm.c.z+Math.cos(a)*cm.rr);T.lerpVectors(cm.c,_h,cm.still?0:0.35);T.y=cm.c.y;break;}
    case 'pull':{const fa=cm.far||1;P.copy(cm.c).addScaledVector(_d,-4.6*fa).addScaledVector(_r,out*2.8*fa);P.y=cm.c.y+2.3*fa;T.copy(cm.c);T.y+=0.45;break;}
    default: // 波の先頭を、斜め後ろの少し上から
      P.copy(_h).addScaledVector(_d,-3.0).addScaledVector(_r,out*2.1);P.y=y0+1.5;T.copy(_h).addScaledVector(_d,3.3);T.y=y0+0.3;
      T.lerp(FIELD_C,0.06);
  }
}
const camBlend={from:null,to:null,u:1,init:false};
const _P2=new V3(),_T2=new V3();
function courseCamBlended(C,τ,dt,P,T){
  const cm=pickMode(C,τ);
  if(!camBlend.init){camBlend.from=camBlend.to=cm;camBlend.u=1;camBlend.init=true;}
  if(cm!==camBlend.to){camBlend.from=camBlend.u<0.5?camBlend.from:camBlend.to;camBlend.to=cm;camBlend.u=0;}
  camBlend.u=Math.min(1,camBlend.u+dt/1.1);
  lastMode=(camBlend.to?camBlend.to.m:'chase');
  sharpW=lerp(sharpW,camBlend.to&&camBlend.to.sharp?1:0,0.08);
  courseCam(C,τ,camBlend.to,P,T);
  if(camBlend.u<1){courseCam(C,τ,camBlend.from,_P2,_T2);const e=ease3(camBlend.u);P.lerpVectors(_P2,P,e);T.lerpVectors(_T2,T,e);}
  spineAt(C,τ,_h);
}
function updateCamera(dt,vt){
  const M=Math.floor(vt/60), sec=vt-M*60;
  // 0秒前後は引いて、時刻のフィールドを正面から
  const rv=revealOf(M);
  let w=0,arc=0;if(sec>50&&isArrival(M+1))w=sstep(58.3,59.85,sec);else if(sec<10&&isArrival(M)){w=1-(rv?sstep(6.2,8.8,sec):sstep(3.2,5.9,sec));arc=4*w*(1-w);}   // 正面から時刻を見せるのは、5分ごとに波が届くときだけ。次の周の入り口へは、高く弧を描いて移る(巻き戻る1周を上から見せる)
  // 10分ごと・正時: 時刻が出たあと、真上近くまで大きく引いてコース全体と時刻を見せる
  let wo=0;if(rv&&sec<10)wo=sstep(0.9,2.9,sec)*(1-sstep(5.0,6.6,sec));
  overW=wo;
  const asp=camera.aspect;
  _fp.set(0,asp<1?21.5:11.5,asp<1?13.8:9.5);_ft.copy(FIELD_C);
  if(cur){const τ=courseTau(cur,vt);
    courseCamBlended(cur,Math.max(τ,-0.5),dt,desP,desT);
  }else{desP.copy(_fp);desT.copy(_ft);w=1;_h.copy(FIELD_C);}
  desP.lerp(_fp,w);desT.lerp(_ft,w);
  if(arc>0){desP.y+=arc*30;desT.y=Math.max(0,desT.y-arc*2);}
  if(wo>0){const H=rv==='hour'?(asp<1?64:44):(asp<1?38:27);_v.set(0,H,H*0.3);_v2.set(0,0,-H*0.02);desP.lerp(_v,wo);desT.lerp(_v2,wo);}
  if(scene.fog)scene.fog.near=16+wo*(rv==='hour'?60:30);if(scene.fog)scene.fog.far=72+wo*(rv==='hour'?110:55);
  // ユーザーのなぞり(見回し): 目標のまわりを回す
  const idle=vt-userLast;
  if(!dragging&&idle>4/SPEED){userYaw*=Math.exp(-dt*1.6);userPitch*=Math.exp(-dt*1.6);}
  if(Math.abs(userYaw)>1e-4||Math.abs(userPitch)>1e-4){
    _v.subVectors(desP,desT);const r=_v.length();let yaw=Math.atan2(_v.x,_v.z)+userYaw,pit=Math.asin(clamp(_v.y/r,-1,1))+userPitch;pit=clamp(pit,0.06,1.35);
    desP.set(desT.x+Math.sin(yaw)*Math.cos(pit)*r,desT.y+Math.sin(pit)*r,desT.z+Math.cos(yaw)*Math.cos(pit)*r);
  }
  const kp=1-Math.exp(-dt*7), kt=1-Math.exp(-dt*8);
  camPos.lerp(desP,kp);camTgt.lerp(desT,kt);
  if(camPos.y<0.22)camPos.y=0.22;
  camera.position.copy(camPos);camera.lookAt(camTgt);
  if(DEBUG&&Q.get('cam')==='top'){scene.fog=null;const cx=+(Q.get('cx')||0),cz=+(Q.get('cz')||0);camera.position.set(cx,Q.get('h')?+Q.get('h'):95,cz+0.01);camera.lookAt(cx,0,cz);if(!window.__mk){window.__mk=new THREE.Mesh(new THREE.SphereGeometry(0.8),new THREE.MeshBasicMaterial({color:0xff0000,fog:false}));scene.add(window.__mk);}window.__mk.position.copy(_h);}
  if(DEBUG){window.__camMode=lastMode;window.__camInfo=()=>({cam:camera.position.toArray().map(v=>+v.toFixed(2)),tgt:camTgt.toArray().map(v=>+v.toFixed(2)),des:desP.toArray().map(v=>+v.toFixed(2)),h:_h.toArray().map(v=>+v.toFixed(2))});}
  _v.lerpVectors(_h,FIELD_C,w);
  focusDist=lerp(focusDist,camera.position.distanceTo(_v),1-Math.exp(-dt*4));
  // 影のカメラとキラキラの点光源は、見ている所について動く
  const sz=26/2048*4;_v2.copy(_v);_v2.x=Math.round(_v2.x/sz)*sz;_v2.z=Math.round(_v2.z/sz)*sz;
  key.target.position.copy(_v2);key.position.copy(_v2).addScaledVector(KEYDIR,30);
  glint.position.set(_v.x-3,4,_v.z+2);
  sheenU.uCam.value.copy(camera.position);
  sky.position.copy(camera.position);skyU.uT.value=vt%10000;
  {const T=THEMES[themeOf(M)].f(0,(M%60)/60);let dh=T[0]-skyHue;dh-=Math.round(dh);skyHue+=dh*(1-Math.exp(-dt*0.25));skyU.uHue.value=skyHue;}
}

// ============================================================
// 9) 画質の段と、ぼかし
// ============================================================
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bokeh=new BokehPass(scene,camera,{focus:8,aperture:0.006,maxblur:0.018});
composer.addPass(bokeh);
composer.addPass(new OutputPass());
const TIERS=[
  {pr:2.0,sh:2048,bokeh:true,disp:4,trs:1.0},
  {pr:1.5,sh:2048,bokeh:true,disp:4,trs:0.5},
  {pr:1.25,sh:1024,bokeh:true,disp:0,trs:0.5},
  {pr:1.0,sh:1024,bokeh:false,disp:0,trs:0.5},
  {pr:0.8,sh:0,bokeh:false,disp:0,trs:0.35},
];
let tier=Q.get('tier')!=null?+Q.get('tier'):1;
function applyTier(t){
  tier=clamp(t,0,TIERS.length-1);const T=TIERS[tier];
  renderer.setPixelRatio(Math.min(T.pr,window.devicePixelRatio||1));
  resize();
  if(T.sh){renderer.shadowMap.enabled=true;key.castShadow=true;if(key.shadow.mapSize.x!==T.sh){key.shadow.mapSize.set(T.sh,T.sh);if(key.shadow.map){key.shadow.map.dispose();key.shadow.map=null;}}}
  else{key.castShadow=false;}
  shadowFloor.visible=!!T.sh;
  if(glassMat.dispersion!==T.disp){glassMat.dispersion=T.disp;glassMat.needsUpdate=true;marbleMat.dispersion=T.disp?2:0;marbleMat.needsUpdate=true;}
  renderer.transmissionResolutionScale=T.trs;
  bokeh.enabled=T.bokeh;
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(w,h);
  camera.aspect=w/h;camera.fov=w<h?52:40;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

// ============================================================
// 10) 操作
// ============================================================
let lastX=0,lastY=0;
cv.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;dragging=true;lastX=e.clientX;lastY=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  userYaw-=dx*0.006;userPitch=clamp(userPitch+dy*0.004,-0.9,0.9);userLast=vtime();});
const endDrag=()=>{dragging=false;userLast=vtime();};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
let wl=null;function wake(){if(navigator.wakeLock&&!wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null;});}).catch(()=>{});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});

// ============================================================
// 11) はじまり
// ============================================================
let frames=0,fpsT=0,fpsN=0,fps=0,lastNow=0,perfLog=[],bootTier=1,lastVt=0,slowWin=0;
async function boot(){
  await nextFrame();
  simulate();
  initField();
  applyTier(tier);
  await nextFrame();
  // 最初のコース
  const vt=vtime(), M=Math.floor(vt/60), L=Math.floor(M/LAP)*LAP;
  if((Q.get('sec')!=null||Q.get('cyc')!=null)&&vt>L*60+3.6){ // テスト用: この周を最初から走っていたことにする
    const C=await makeCourseFor(L*60+3.5,nextFrame);if(C)startCourse(C,vtime(),false);
  }else await newCourseNow(vt,true);
  curMinute=Math.floor(vtime()/60);
  updateField(vt);updateCourse(vt);
  updateCamera(10,vt);camPos.copy(desP);camTgt.copy(desT);
  // ①使う材質の組み合わせ(分光あり/なし × 影あり/なし、台やレールやビー玉)を全部、先に準備する
  //   → 途中で画質の段が変わったり、新しいしかけが初めて出たりしてもカクッとしない
  await warmCompile();
  // ②実際に描いて速さを測り、60fpsで回る一番きれいな段を選ぶ(ローディングは長くなってもよい、とおっちゃん)
  const mobile=/iPhone|iPad|Android/.test(navigator.userAgent);
  if(Q.get('tier')==null){
    let t=mobile?1:0;applyTier(t);await bench(8);
    for(;;){const v=await bench(40);perfLog.push('tier '+t+': '+v.toFixed(1)+'ms');if(v<=18.5||t>=TIERS.length-2)break;t++;applyTier(t);await bench(6);}
  }else await bench(10);
  bootTier=tier;
  const ld=document.getElementById('load');ld.classList.add('out');setTimeout(()=>{ld.classList.add('gone');ld.remove();},1300);
  wake();
  APKit.init({canvas:cv,gifName:'glass-relay-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
    buttons:[{label:'✦',name:'mutate',onClick:function(){   // いまの時刻から、別のコースに組み直す
      const vt=vtime(),M=Math.floor(vt/60),sec=vt-M*60;
      if(building||(isArrival(M+1)&&sec>60-MORPH-9)||(isArrival(M)&&sec<3.6)){APKit.toast&&APKit.toast('もうすぐ時刻が出るから、そのあとでね');return;}
      if(nextC){disposeDecor(nextC);nextC=null;}
      newCourseNow(vt,true);}}]});
  showHint('5分で1周するドミノ。毎分0秒に分の数字が倒れて出て、<br>5分ごとに時刻のフィールドへ届く。なぞると見回せる',7500);
  lastNow=performance.now();
  requestAnimationFrame(loop);
}
async function warmCompile(){
  const g=new THREE.BoxGeometry(.2,.2,.2), W=new THREE.Group(), WM=new THREE.Group();
  for(const m of [darkMat,darkMatDS,railMat,marbleMat]){const me=new THREE.Mesh(g,m);me.castShadow=true;me.receiveShadow=true;W.add(me);}
  for(const m of [darkMirMat,darkMirMatDS,railMirMat,marbleMirMat])WM.add(new THREE.Mesh(g,m));
  W.position.y=-40;WM.position.y=-40;scene.add(W);mirrorRoot.add(WM);
  const d0=glassMat.dispersion, s0=key.castShadow;
  for(const d of [4,0])for(const sh of [true,false]){
    glassMat.dispersion=d;glassMat.needsUpdate=true;marbleMat.dispersion=d?2:0;marbleMat.needsUpdate=true;key.castShadow=sh;
    try{await renderer.compileAsync(scene,camera);}catch(e){}
    render(vtime(),1/60);await nextFrame();
  }
  glassMat.dispersion=d0;glassMat.needsUpdate=true;marbleMat.dispersion=d0?2:0;marbleMat.needsUpdate=true;key.castShadow=s0;
  try{await renderer.compileAsync(scene,camera);}catch(e){}
  scene.remove(W);mirrorRoot.remove(WM);g.dispose();
}
async function bench(n){ // n コマ描いて、遅いほうから4割の所のコマ時間(ms)
  const ts=[];let t0=performance.now();
  for(let i=0;i<n;i++){render(vtime(),1/60);await nextFrame();const t=performance.now();ts.push(t-t0);t0=t;}
  ts.sort((a,b)=>a-b);return ts[Math.floor(ts.length*0.6)];
}
function render(vt,dt){
  updateField(vt);updateCourse(vt);updateCamera(dt,vt);updateLOD();flushInst();
  if(bokeh.enabled){bokeh.uniforms.focus.value=focusDist;bokeh.uniforms.aspect.value=camera.aspect;bokeh.uniforms.aperture.value=0.006*(1-0.85*Math.max(overW,sharpW*0.8));}
  if(bokeh.enabled)composer.render(dt);else{composer.render(dt);}
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-lastNow)/1000);lastNow=now;
  const vt=vtime(), M=Math.floor(vt/60), sec=vt-M*60;
  if(lastVt&&(vt-lastVt>2.5||M>curMinute+1)&&!building){ // 見ていない間に時間がとんだ: いまの時刻から組み直す
    if(nextC){disposeDecor(nextC);nextC=null;}newCourseNow(vt,false);curMinute=M;
  }
  lastVt=vt;
  curMinute=M;
  // 周の終わり(時刻のフィールドに届いた後): 次の周へ巻き戻す。大仕掛けの時刻なら、引きの画を見せてから
  if(cur&&!morph){const A=cur.arrive/60, tGo=cur.arrive+(revealOf(A)?3.0:0.25);
    if(vt>=tGo){if(nextC){startCourse(nextC,vt,true);nextC=null;}else if(!building&&vt>=tGo+0.5)newCourseNow(vt,true);}}
  else if(!cur&&!building&&!morph)newCourseNow(vt,true);
  // 次の周は、いまの周が走り出して少したったら、1回ずつ間をあけて少しずつ組む(組むときのカクッをなくす)
  if(!nextC&&!building&&cur&&vt>cur.tStart+25&&vt<cur.arrive-5)buildNext();
  render(vt,dt);
  // 速さを見て、重ければ段を下げる
  frames++;fpsN++;fpsT+=dt;
  if(fpsT>=2){fps=fpsN/fpsT;
    slowWin=fps<44?slowWin+1:0;   // 2回続けて遅いときだけ、1段だけ下げる
    if(Q.get('tier')==null&&slowWin>=2&&tier<Math.min(TIERS.length-1,bootTier+1)&&!document.hidden){applyTier(tier+1);slowWin=0;perfLog.push('fps '+fps.toFixed(0)+' → tier '+tier);}
    fpsT=0;fpsN=0;}
  if(DEBUG)dbgEl.textContent=`fps ${fps.toFixed(1)}  frame ${frames}  tier ${tier}  pr ${renderer.getPixelRatio().toFixed(2)}\n`+
    `sec ${sec.toFixed(1)}  ${hhmm(M)}  items ${cur?cur.items.length:0}  f ${cur?curF(cur,vt).toFixed(2):'-'}  next ${nextC?'ok':building?'…':'-'}  build ${cur?cur.buildMs.toFixed(0):'-'}ms\n`+(cur?`色 ${THEMES[themeOf(M)].jp}  形 ${COURSE_SHAPES[cur.shape]}${cur.mir<0?'・右回り':'・左回り'}  ${cur.special||''}\n`:'')+
    (cur?cur.names.join(' / '):'')+'\ncam '+lastMode+'\n'+perfLog.slice(-3).join('\n');
}
if(DEBUG)window.__dbg={planCourse,buildCourse,collides,planList,mulberry,setSec(x){const v=vtime(),M=Math.floor(v/60);vOffset+=(M*60+x)-v;lastVt=vtime();curMinute=Math.floor(lastVt/60);},setCyc(x){const v=vtime(),L=Math.floor(v/60/LAP)*LAP;vOffset+=(L*60+x)-v;lastVt=vtime();curMinute=Math.floor(lastVt/60);},get cur(){return cur;}};
boot().catch(e=>{console.error(e);showHint('この端末では表示できないみたい',1e9);});
</script>
