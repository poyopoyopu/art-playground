<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<title>Art Playground — 焦点 FOCUS</title>
<!--
  焦点 FOCUS (v52・旧「根の掟 ROOT LAW」を全面作り直し) — Claude作

  旧v52(根の掟 ROOT LAW)は「根は止まらず自律的に伸び続け、縄張りは
  早い者勝ち」という成長と陣取りの法則だったが、「もっと面白く」ではなく
  「全部気に入らないので一から新しい法則で」という要望を受け、
  コンセプトから作り直した。

  世界のルール: この世界は見られた場所にしか細部が存在しない。
  画面全体は常に4分木で再帰的に細分化されているが、ある一区画がさらに
  自己相似に割れて奥へ進めるかどうかは、その場所に注がれている
  「注視」の強さで決まる——注視が薄い場所は粗いブロックのまま止まり、
  濃い場所ほど同じ分割ルールを繰り返し何段も奥まで割れていく。

  タップした場所はその瞬間の注視点になり、離した後も"残像"として
  数秒かけて薄れながら細部を保つ。指を置いたまま(ホールド)でいるほど
  注視は強く育ち、より深い階層まで世界を割り続ける——長く見つめるほど
  世界は詳しくなる。触れていない間も、世界は完全に静止はせず、
  あちこちに「夢」のような注視がランダムに生まれては薄れ、また
  別の場所に生まれ直す。

  ダブルタップは「瞬き」——一瞬すべての注視(夢も残像もホールド中の
  注視も)を無効化し、世界を一斉に最も粗い状態へ引き戻す。瞬きが終われば
  法則はそのまま再開し、また見た場所から細部が生まれ直す。

  ホールドの継続時間・残像の減衰・瞬きはすべて実時間駆動のライブ専用。
  GIFループ側は固定シードの「夢」の発生予定表だけを注視源として使う
  (位相の周回距離で強さを決めるので位相0と2πで厳密に一致する)。
  タップ残像やホールドはループの中には存在しない——これは省略ではなく、
  そもそも「一回きりの注視」は周期関数にできないための設計上の選択。

  改良1(おっちゃんフィードバック「発想は好き、ただ自動生成になってない、
  ループしてほしい」): 触れていない間、漂う視線(idleGaze)1つだけでは
  強さが閾値をほぼ超えず、実質ほぼ静止画に見えていたのが原因と判断。
  常時ゆっくり脈打つ2つ目の視線「エコー」を追加し、閾値も緩めた。

  改良2(おっちゃんフィードバック「タッチ操作は面白いけど、ずっと眺めて
  はいられない」): 改良1の2点だけの巡回は、動いてはいても軌道が単調で
  「見ていたくなる」ほどの驚きがなかったと判断。漂う視線・エコーの2点を
  廃止し、代わりに「夢」という自律ソースに置き換えた——画面のどこかに
  数秒おきにランダムな場所・大きさ・強さで注視が生まれ、山なりに強まって
  また薄れて消え、しばらくすると別の場所にまた生まれる。世界が誰にも
  見られていない間、自分自身に向かって小さな夢のような注視を投げかけ
  続けている、という体で"次に何が起きるか分からない"ランダム性を持たせた。
  GIFループは非決定的な夢をそのまま使えないため、固定シードで位相上の
  6箇所に夢の発生タイミングを配置し、位相の周回距離だけで強さを決める
  (0と2πで座標・強さとも厳密に一致する)。
-->
<script src="ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030308}
body{touch-action:none;overscroll-behavior:none;
 -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

let W=1,H=1,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const TAU=Math.PI*2;
const BG='#030308';
function pal(t){
  return [
    Math.round(255*(0.5+0.5*Math.cos(TAU*t))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.33)))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.67))))
  ];
}

// ---------- law: how much attention falls on a point, given every source
// currently active (the roaming idle gaze, a held touch, fading afterimages)
// ----------
function attentionAt(x,y,sources){
  let v=0;
  for(let i=0;i<sources.length;i++){
    const s=sources[i];
    const d=Math.hypot(x-s.x,y-s.y);
    v+=s.strength*Math.exp(-d/s.radius);
  }
  return v;
}

// ---------- the recursive rule: a rectangle either holds still as a single
// leaf, or — if enough attention falls on its centre — splits into four
// half-size rectangles that obey exactly the same rule. self-similar by
// construction; depth is bounded by both a hard cap and a rising threshold,
// so only a small, attention-lit region ever goes deep. ----------
let gHueShift=0, gSensitivity=1, MAX_DEPTH=6;
function drawLeaf(x,y,w,h,depth,hue,att){
  const [r,g,b]=pal(hue);
  const alpha=Math.min(1,0.32+att*0.5);
  const px=x+Math.min(w,h)*0.045, py=y+Math.min(w,h)*0.045;
  const pw=w-Math.min(w,h)*0.09, ph=h-Math.min(w,h)*0.09;
  const cx=x+w/2, cy=y+h/2, rad=Math.max(pw,ph)*0.72;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  grad.addColorStop(0,`rgba(${r},${g},${b},${0.85*alpha})`);
  grad.addColorStop(1,`rgba(${r},${g},${b},${0.10*alpha})`);
  ctx.fillStyle=grad;
  ctx.fillRect(px,py,Math.max(0,pw),Math.max(0,ph));
  ctx.strokeStyle=`rgba(${r},${g},${b},${0.32*alpha})`;
  ctx.lineWidth=1;
  ctx.strokeRect(px,py,Math.max(0,pw),Math.max(0,ph));
}
function subdivide(x,y,w,h,depth,sources){
  const cx=x+w/2, cy=y+h/2;
  const att=attentionAt(cx,cy,sources);
  const threshold=(0.42+depth*0.3)/gSensitivity;
  if(depth<MAX_DEPTH && att>threshold && Math.min(w,h)>12){
    const hw=w/2, hh=h/2;
    subdivide(x,y,hw,hh,depth+1,sources);
    subdivide(x+hw,y,hw,hh,depth+1,sources);
    subdivide(x,y+hh,hw,hh,depth+1,sources);
    subdivide(x+hw,y+hh,hw,hh,depth+1,sources);
  }else{
    const hue=gHueShift+depth*0.045+(cx/W)*0.09+(cy/H)*0.06;
    drawLeaf(x,y,w,h,depth,hue,att);
  }
}

// ---------- live: touch adds a growing, then fading, source. when nobody is
// touching, the world doesn't just idle — small "dreams" of attention keep
// being born at random places, rise, and fade, so it's never fully still and
// never repeats the same path twice. ----------
let activeTouch=null; // {x,y,downAt}
let memories=[]; // {x,y,strength}
let lastTap=0, blinkAt=-999;
let lastFrameTime=performance.now();

const MAX_DREAMS=4;
let dreams=[]; // {x,y,radius,peak,bornAt,duration}
let lastDreamAt=-9999;
function maybeSpawnDream(now){
  if(dreams.length>=MAX_DREAMS) return;
  if(now-lastDreamAt<900+Math.random()*1500) return;
  lastDreamAt=now;
  dreams.push({
    x:Math.random()*W, y:Math.random()*H,
    radius:Math.min(W,H)*(0.15+Math.random()*0.22),
    peak:0.7+Math.random()*1.15,
    bornAt:now,
    duration:2600+Math.random()*4400
  });
}
function dreamSources(now){
  const list=[];
  for(let i=dreams.length-1;i>=0;i--){
    const d=dreams[i], t=now-d.bornAt;
    if(t>=d.duration){ dreams.splice(i,1); continue; }
    const e=t/d.duration;
    list.push({x:d.x,y:d.y,strength:d.peak*Math.sin(Math.PI*e),radius:d.radius});
  }
  return list;
}
function buildLiveSources(now){
  if(now-blinkAt<260) return []; // a blink zeroes every source at once
  maybeSpawnDream(now);
  const sources=dreamSources(now);
  if(activeTouch){
    const heldSec=(now-activeTouch.downAt)/1000;
    sources.push({
      x:activeTouch.x,y:activeTouch.y,
      strength:Math.min(2.6,0.8+heldSec*1.15),
      radius:Math.min(W,H)*(0.20+Math.min(0.28,heldSec*0.05))
    });
  }
  for(let i=0;i<memories.length;i++){
    const m=memories[i];
    sources.push({x:m.x,y:m.y,strength:m.strength,radius:Math.min(W,H)*0.22});
  }
  return sources;
}
function renderLive(now,dt){
  for(let i=memories.length-1;i>=0;i--){
    memories[i].strength*=Math.pow(0.06,dt); // ~3s to fade below notice
    if(memories[i].strength<0.03) memories.splice(i,1);
  }
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  subdivide(0,0,W,H,0,buildLiveSources(now));
}
function loop(){
  const now=performance.now();
  const dt=Math.min(0.1,(now-lastFrameTime)/1000); lastFrameTime=now;
  if(!APKit.isExporting()) renderLive(now,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  if(now-lastTap<300){
    blinkAt=now; activeTouch=null; memories=[];
    lastTap=0;
  }else{
    lastTap=now;
    activeTouch={x:e.clientX,y:e.clientY,downAt:now};
  }
},{passive:true});
canvas.addEventListener('pointermove',e=>{
  if(activeTouch){ activeTouch.x=e.clientX; activeTouch.y=e.clientY; }
},{passive:true});
function releaseTouch(){
  if(activeTouch){
    const heldSec=(performance.now()-activeTouch.downAt)/1000;
    memories.push({x:activeTouch.x,y:activeTouch.y,strength:Math.min(2.4,0.6+heldSec*0.9)});
    if(memories.length>18) memories.shift();
    activeTouch=null;
  }
}
canvas.addEventListener('pointerup',releaseTouch,{passive:true});
canvas.addEventListener('pointercancel',releaseTouch,{passive:true});

// ---------- GIF export: dreams are random by nature and can't be replayed
// exactly, so the export uses a fixed schedule of 6 seeded dream events
// spread around the phase circle. each one's strength depends only on the
// angular (wraparound) distance from its centre phase, so it is exactly
// zero outside its window and phase 0 matches phase 2π exactly. ----------
const DEMO_DREAMS=[
  {pc:0.3, pw:1.05, fx:0.28, fy:0.35, peak:1.25, rf:0.24},
  {pc:1.7, pw:0.95, fx:0.72, fy:0.24, peak:0.95, rf:0.20},
  {pc:2.9, pw:1.15, fx:0.62, fy:0.68, peak:1.35, rf:0.27},
  {pc:4.1, pw:0.90, fx:0.20, fy:0.62, peak:1.05, rf:0.22},
  {pc:5.0, pw:1.05, fx:0.5, fy:0.42, peak:1.20, rf:0.25},
  {pc:5.95,pw:0.85, fx:0.78, fy:0.72, peak:0.85, rf:0.19}
];
function angDist(a,b){
  let d=Math.abs(a-b)%TAU;
  return d>Math.PI ? TAU-d : d;
}
function renderLoopDemo(phase){
  const sources=[];
  for(const d of DEMO_DREAMS){
    const dist=angDist(phase,d.pc);
    if(dist>=d.pw) continue;
    const e=1-dist/d.pw;
    sources.push({
      x:d.fx*W, y:d.fy*H,
      strength:d.peak*Math.sin(Math.PI/2*e),
      radius:Math.min(W,H)*d.rf
    });
  }
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  subdivide(0,0,W,H,0,sources);
}

APKit.init({
  canvas:canvas,
  gifName:'focus-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){ renderLoopDemo(phase); },
  buttons:[
    {label:'\u2726',name:'mutate',onClick:function(){
      gHueShift=Math.random();
      gSensitivity=0.65+Math.random()*1.0;
    }},
    {label:'\u21bb',name:'reset',onClick:function(){
      activeTouch=null; memories=[]; blinkAt=-999;
      dreams=[]; lastDreamAt=-9999;
      gHueShift=0; gSensitivity=1;
    }}
  ]
});
</script>
</body>
</html>
