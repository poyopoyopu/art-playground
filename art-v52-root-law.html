<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Root Law"><title>Art Playground — 根の掟 ROOT LAW</title>
<!-- 根の掟 ROOT LAW (v52) — Claude作。改良: ChatGPT, Claude
  世界のルール: 根は止まらない。触らなくても世界は自律的に種を生み、自己相似の分岐を続ける。
  土地は有限で早い者勝ち。他の根の縄張りに触れた枝は即死。
  タッチは「新しい法則を介入させる」ためのもので、成長の開始条件ではない。
  追加改良(Claude): 分岐できなくなった先端がそのまま消滅していたため、
  個々の根がしばらくすると完全に静止して見えるバグを修正。分岐に失敗した
  先端は消えず、極細の根毛としてtraveledをリセットして這い続ける。
  GIFループ対応(Claude): ライブの成長は不可逆・一回性なので原理的にループ
  できない。そこでGIF書き出し専用に、固定シードの木を一度だけ生成し、
  位相0〜πで芽吹かせて満開にし、π〜2πで同じ絵をフェードアウトさせる
  「別ルート」を追加。位相だけの純粋な関数なので、開始と終了が完全に一致する
  数学的に厳密なループになる。ライブ表示側の挙動には一切手を加えていない。
--><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04030a}body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),TAU=Math.PI*2,CELL=22,MAXDEPTH=8,MAXBRANCHES=900,BASE_THICK=3.2,MINTHICK=.5;
function pal(t){return[Math.round(255*(.5+.5*Math.cos(TAU*t))),Math.round(255*(.5+.5*Math.cos(TAU*(t+.33)))),Math.round(255*(.5+.5*Math.cos(TAU*(t+.67))))]}
let W=1,H=1,DPR=1,gridW=1,gridH=1,territory=new Int32Array(1),branches=[],tips=[],nextSeedId=1,nextBranchId=1,branchAngle=.55,decayRatio=.74,holding=false,speedMul=1;
function rebuildTerritory(){gridW=Math.max(1,Math.ceil(W/CELL));gridH=Math.max(1,Math.ceil(H/CELL));territory=new Int32Array(gridW*gridH).fill(-1)}
function strokeBranchSegment(br,x1,y1,x2,y2){const[r,g,b]=pal(br.hue+br.depth*.02),alpha=Math.max(.28,1-br.depth*.08);ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;ctx.lineWidth=Math.max(.6,br.thickness);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function redrawAll(){ctx.fillStyle='#04030a';ctx.fillRect(0,0,W,H);for(const br of branches){const pts=br.points;for(let i=1;i<pts.length;i++)strokeBranchSegment(br,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1])}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);rebuildTerritory();redrawAll()}addEventListener('resize',resize);
function claim(x,y,seedId){const gx=Math.floor(x/CELL),gy=Math.floor(y/CELL);if(gx<0||gy<0||gx>=gridW||gy>=gridH)return false;const gi=gy*gridW+gx,owner=territory[gi];if(owner!==-1&&owner!==seedId)return false;territory[gi]=seedId;return true}
function spawnChildren(tip){const angleOff=branchAngle*(.75+Math.random()*.5),childThick=tip.branch.thickness*decayRatio;for(const sign of [1,-1]){const childAngle=tip.angle+sign*angleOff*(.85+Math.random()*.3),branch={id:nextBranchId++,seedId:tip.seedId,depth:tip.depth+1,thickness:childThick,hue:tip.branch.hue,points:[[tip.x,tip.y]]};branches.push(branch);tips.push({branch,seedId:tip.seedId,depth:branch.depth,x:tip.x,y:tip.y,angle:childAngle,traveled:0})}}
function stepGrowth(mult){for(let i=tips.length-1;i>=0;i--){const tip=tips[i],speed=Math.max(.18,.85*Math.pow(.88,tip.depth))*mult;tip.angle+=(Math.random()-.5)*(.035+tip.depth*.01);const nx=tip.x+Math.cos(tip.angle)*speed,ny=tip.y+Math.sin(tip.angle)*speed;if(nx<-40||nx>W+40||ny<-40||ny>H+40){tips.splice(i,1);continue}if(!claim(nx,ny,tip.seedId)){tips.splice(i,1);continue}strokeBranchSegment(tip.branch,tip.x,tip.y,nx,ny);tip.branch.points.push([nx,ny]);tip.x=nx;tip.y=ny;tip.traveled+=speed;const interval=Math.max(6,34*Math.pow(.80,tip.depth));if(tip.traveled>=interval){const forkChance=Math.max(.06,.9*Math.pow(.82,tip.depth)),canFork=tip.depth<MAXDEPTH&&tip.branch.thickness>MINTHICK&&branches.length<MAXBRANCHES-2&&Math.random()<forkChance;if(canFork){tips.splice(i,1);spawnChildren(tip)}else{tip.traveled=0}}}}
function plantSeed(x,y){if(branches.length>=MAXBRANCHES)return;const seedId=nextSeedId++,hue=Math.random(),branch={id:nextBranchId++,seedId,depth:0,thickness:BASE_THICK,hue,points:[[x,y]]};branches.push(branch);tips.push({branch,seedId,depth:0,x,y,angle:Math.random()*TAU,traveled:0});claim(x,y,seedId)}
function plantCluster(x,y,n){for(let k=0;k<n;k++){const a=Math.random()*TAU,d=20+Math.random()*40;plantSeed(x+Math.cos(a)*d,y+Math.sin(a)*d)}}
// ---------- GIF export: a separate, fully deterministic demo growth ----------
// The live growth above never repeats itself (that's the point of the piece),
// so it can never produce a seamless GIF loop. For export only, a fixed seeded
// tree is generated once and revealed as a pure function of phase — it opens
// from nothing to fully grown over the first half of the loop, then fades back
// to nothing over the second half, so phase=0 and phase=TAU are identical.
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296}}
const LOOP_SEEDS=[[.38,.5],[.62,.46],[.5,.68]];
function buildLoopDemo(seed){
  const rng=mulberry32(seed);
  let queue=LOOP_SEEDS.map(s=>({fx:s[0],fy:s[1],ux:0,uy:0,angle:rng()*TAU,depth:0,hue:rng()}));
  const list=[]; let order=0; const MAXD=7, MAXBR=260;
  while(queue.length && list.length<MAXBR){
    const next=[];
    for(const tip of queue){
      if(list.length>=MAXBR) break;
      const segLen=Math.max(.012,.09*Math.pow(.8,tip.depth)), steps=7;
      const pts=[[tip.ux,tip.uy]]; let ux=tip.ux,uy=tip.uy,angle=tip.angle;
      for(let s=0;s<steps;s++){
        angle+=(rng()-.5)*(.10+tip.depth*.02);
        ux+=Math.cos(angle)*(segLen/steps); uy+=Math.sin(angle)*(segLen/steps);
        pts.push([ux,uy]);
      }
      list.push({fx:tip.fx,fy:tip.fy,points:pts,depth:tip.depth,thickness:Math.max(.4,3.0*Math.pow(.74,tip.depth)),hue:tip.hue,order:order++});
      const forkChance=Math.max(.08,.88*Math.pow(.8,tip.depth));
      if(tip.depth<MAXD && rng()<forkChance){
        const angleOff=.5*(.75+rng()*.5);
        next.push({fx:tip.fx,fy:tip.fy,ux,uy,angle:angle+angleOff*(.85+rng()*.3),depth:tip.depth+1,hue:tip.hue});
        next.push({fx:tip.fx,fy:tip.fy,ux,uy,angle:angle-angleOff*(.85+rng()*.3),depth:tip.depth+1,hue:tip.hue});
      }
    }
    queue=next;
  }
  return list;
}
let loopDemoSeed=(Math.random()*1e9)|0, loopDemo=null;
function renderLoopDemo(revealFrac,alpha){
  if(!loopDemo) loopDemo=buildLoopDemo(loopDemoSeed);
  const total=loopDemo.length, revealCount=Math.floor(total*revealFrac), m=Math.min(W,H);
  ctx.fillStyle='#04030a'; ctx.fillRect(0,0,W,H);
  for(const br of loopDemo){
    if(br.order>=revealCount) continue;
    const ox=br.fx*W, oy=br.fy*H;
    const [r,g,b]=pal(br.hue+br.depth*.02);
    ctx.strokeStyle=`rgba(${r},${g},${b},${Math.max(.28,1-br.depth*.08)*alpha})`;
    ctx.lineWidth=Math.max(.6,br.thickness); ctx.lineCap='round';
    ctx.beginPath();
    const pts=br.points;
    ctx.moveTo(ox+pts[0][0]*m, oy+pts[0][1]*m);
    for(let i=1;i<pts.length;i++) ctx.lineTo(ox+pts[i][0]*m, oy+pts[i][1]*m);
    ctx.stroke();
  }
}
function renderExportPhase(phase){
  const revealFrac = phase<Math.PI ? phase/Math.PI : 1;
  const alpha = phase<Math.PI ? 1 : Math.max(0,1-(phase-Math.PI)/Math.PI);
  renderLoopDemo(revealFrac,alpha);
}
function resetWorld(){branches=[];tips=[];rebuildTerritory();redrawAll();plantSeed(W*.38,H*.5);plantSeed(W*.62,H*.46);plantSeed(W*.5,H*.68)}
resize();resetWorld();let lastAutoSeed=performance.now();
function loop(){if(!APKit.isExporting()){const now=performance.now(),target=holding?5.5:1;speedMul+=(target-speedMul)*.12;stepGrowth(speedMul);if(now-lastAutoSeed>4200&&branches.length<MAXBRANCHES-20){const edge=Math.floor(Math.random()*4),x=edge===0?10:edge===1?W-10:Math.random()*W,y=edge===2?10:edge===3?H-10:Math.random()*H;plantSeed(x,y);lastAutoSeed=now}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
let lastTap=0;canvas.addEventListener('pointerdown',e=>{const now=performance.now(),x=e.clientX,y=e.clientY;if(now-lastTap<300){plantCluster(x,y,3);lastTap=0}else{lastTap=now;plantSeed(x,y)}holding=true},{passive:true});canvas.addEventListener('pointerup',()=>{holding=false},{passive:true});canvas.addEventListener('pointercancel',()=>{holding=false},{passive:true});
APKit.init({canvas:canvas,gifName:'root-law-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){renderExportPhase(phase)},buttons:[{label:'\u2726',name:'mutate',onClick:function(){branchAngle=.30+Math.random()*.65;decayRatio=.62+Math.random()*.20;loopDemoSeed=(Math.random()*1e9)|0;loopDemo=null}},{label:'\u21bb',name:'reset',onClick:function(){resetWorld();lastAutoSeed=performance.now();loopDemoSeed=(Math.random()*1e9)|0;loopDemo=null}}]});
</script></body></html>
