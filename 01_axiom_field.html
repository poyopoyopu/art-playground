<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050509"><title>AXIOM FIELD — ART PLAYGROUND</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{touch-action:none}#stage,#fallbackStage{position:fixed;inset:0;width:100%;height:100%;display:block}#clock{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:24px;z-index:4;pointer-events:none;text-shadow:0 1px 10px #000,0 0 3px #000;mix-blend-mode:screen}.time{font-size:clamp(28px,7vw,52px);font-weight:600;letter-spacing:.03em;line-height:1}.date{margin-top:6px;font-size:clamp(10px,2.4vw,15px);letter-spacing:.24em;opacity:.9}.controls{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);display:flex;gap:10px;padding:9px;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(7,7,12,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .55s,transform .55s}.controls.hidden{opacity:0;transform:translateX(-50%) translateY(10px);pointer-events:none}.btn{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(15,15,23,.45);color:#fff;font:inherit;font-size:21px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.94)}#hint{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom) + 112px);left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.28em;opacity:.34;white-space:nowrap;pointer-events:none;text-align:center}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:end center;background:rgba(0,0,0,.32)}.modal.open{display:grid}.sheet{width:min(92vw,430px);margin-bottom:calc(env(safe-area-inset-bottom) + 18px);padding:18px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(10,10,16,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.sheet h2{margin:0 0 5px;font-size:13px;letter-spacing:.22em}.sheet p{margin:0 0 16px;font-size:10px;opacity:.5;letter-spacing:.12em}.opts{display:grid;gap:8px}.opt,.cancel{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;font:inherit;text-align:left}.opt b{font-size:12px}.opt span{float:right;opacity:.45;font-size:10px}.cancel{margin-top:8px;text-align:center;opacity:.7}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:none;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.55);font-size:11px;letter-spacing:.08em}
</style></head><body>
<canvas id="stage"></canvas><canvas id="fallbackStage"></canvas><div id="clock"><div class="time">00:00:00</div><div class="date">0000 00 00 XXX</div></div>
<div id="hint">TOUCH THE WORLD · CHANGE ITS LAW</div>
<div class="controls" id="controls"><button class="btn" id="random" aria-label="Random">✦</button><button class="btn" id="gif" aria-label="GIF">◉</button><button class="btn" id="clockBtn" aria-label="Clock">◷</button></div>
<div class="modal" id="modal"><div class="sheet"><h2>EXPORT LOOP</h2><p>なめらかさを選んでください</p><div class="opts"><button class="opt" data-fps="25"><b>SMOOTH · 25fps</b><span>3 sec</span></button><button class="opt" data-fps="20"><b>BALANCED · 20fps</b><span>3 sec</span></button><button class="opt" data-fps="12.5"><b>LIGHT · 12.5fps</b><span>3 sec</span></button></div><button class="cancel" id="cancel">キャンセル</button></div></div><div id="status"></div>
<script type="module">
const TITLE='AXIOM FIELD', MODE=0;
const canvas=document.getElementById('stage'), fallbackCanvas=document.getElementById('fallbackStage'), gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
const clockEl=document.getElementById('clock'), controls=document.getElementById('controls'), hint=document.getElementById('hint'), modal=document.getElementById('modal'), status=document.getElementById('status');
let renderer=null, scene=null, camera=null, material=null, THREE=null, fallback=false, ctx2=null, raf=0, last=performance.now(), clockOn=true, uiTimer=0; fallbackCanvas.style.display="none";
let universe=makeUniverse(Math.random()*1e6), laws=[];
const LOOP=7.0, DPR=Math.min(devicePixelRatio||1,2);
function hash(n){return (Math.sin(n*127.1+universe.seed*1.7)*43758.5453)%1}
function makeUniverse(seed){return {seed, symmetry:Math.floor(5+Math.abs(Math.sin(seed*.003))*9), scale:.7+Math.abs(Math.sin(seed*.017))*1.2, warp:.35+Math.abs(Math.sin(seed*.031))*.9, density:.35+Math.abs(Math.sin(seed*.047))*.55, twist:(Math.sin(seed*.061))*1.8, freq:2+Math.floor(Math.abs(Math.sin(seed*.073))*5), hue:Math.abs(Math.sin(seed*.083))*6.28, energy:.6+Math.abs(Math.sin(seed*.097))*.7, mode:MODE};}
function addLaw(x,y){const r=.10+Math.random()*.18; laws.push({x,y,r,str:(Math.random()-.5)*2,tw:(Math.random()-.5)*2,sy:1+Math.floor(Math.random()*5),ph:Math.random()*6.283,amp:.35+Math.random()*.7}); if(laws.length>12) laws.shift(); showUI();}
function showUI(){controls.classList.remove('hidden'); hint.style.opacity='.34'; clearTimeout(uiTimer); uiTimer=setTimeout(()=>{controls.classList.add('hidden');hint.style.opacity='0'},3600)}
function resize(){const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight); canvas.width=Math.floor(w*DPR);canvas.height=Math.floor(h*DPR);canvas.style.width=w+'px';canvas.style.height=h+'px';fallbackCanvas.width=Math.floor(w*DPR);fallbackCanvas.height=Math.floor(h*DPR);fallbackCanvas.style.width=w+'px';fallbackCanvas.style.height=h+'px'; if(renderer) renderer.setSize(w,h,false); if(fallback){ctx2=fallbackCanvas.getContext('2d',{alpha:false});}}
function pointer(e){const p=e.touches?e.touches[0]:e; const rect=canvas.getBoundingClientRect(); const x=(p.clientX-rect.left)/rect.width, y=1-(p.clientY-rect.top)/rect.height; if(y<.17&&x<.48){showUI();return;} addLaw(x,y);}
canvas.addEventListener('pointerdown',e=>{if(e.target===canvas)pointer(e)}); canvas.addEventListener('pointermove',e=>{if(e.buttons===1&&e.target===canvas&&Math.random()<.12)pointer(e)});

document.getElementById('random').onclick=()=>{universe=makeUniverse(Math.random()*1e9);laws=[];showUI()};
document.getElementById('clockBtn').onclick=()=>{clockOn=!clockOn;clockEl.style.display=clockOn?'block':'none';showUI()};
document.getElementById('gif').onclick=()=>{modal.classList.add('open');showUI()};
document.getElementById('cancel').onclick=()=>modal.classList.remove('open'); modal.addEventListener('pointerdown',e=>{if(e.target===modal)modal.classList.remove('open')});
function updateClock(){if(!clockOn)return; const d=new Date(); const pad=n=>String(n).padStart(2,'0'); const days=['SUN','MON','TUE','WED','THU','FRI','SAT']; clockEl.querySelector('.time').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;clockEl.querySelector('.date').textContent=`${d.getFullYear()} ${pad(d.getMonth()+1)} ${pad(d.getDate())} ${days[d.getDay()]}`;}
const V=`#version 300 es\nprecision highp float; in vec2 position; out vec2 uv; void main(){uv=position*.5+.5;gl_Position=vec4(position,0.,1.);}`;
const F=`#version 300 es\nprecision highp float; out vec4 outColor; in vec2 uv; uniform float uPhase,uTime,uSeed,uSym,uScale,uWarp,uDensity,uTwist,uFreq,uHue,uEnergy,uMode; uniform vec3 uTint; uniform vec4 uLaws[12]; uniform vec4 uLaw2[12];
#define PI 3.14159265359
float hash21(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n2(p);p*=2.03;a*=.5;}return v;}
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c)*p;}
void main(){
 vec2 p=uv-.5; p.x*=1.0/(0.55+0.45); float aspect=1.;
 float t=2.*PI*uPhase; vec4 T=vec4(cos(t),sin(t),cos(2.*t),sin(2.*t));
 float r=length(p), ang=atan(p.y,p.x); float sym=max(3.,uSym); float sector=2.*PI/sym; float a=mod(ang+sector*.5,sector)-sector*.5; float rr=r;
 float s=sin(float(uMode+1)*a*sym + T.x*uFreq); float c=cos(float(uMode+2)*a*sym - T.y*uFreq);
 vec2 q=vec2(cos(a),sin(a))*rr;
 float baseWarp=fbm(q*uScale*3.0+T.xy*uWarp)+.5*fbm(q*uScale*7.0-T.zw*uWarp*1.3);
 float field=0.; float lawMask=0.; float lawTw=0.; float lawSym=0.;
 for(int i=0;i<12;i++){vec4 L=uLaws[i],K=uLaw2[i]; float d=distance(uv,L.xy); float m=(L.z>0.0001)?(1.-smoothstep(0.,L.z,d)):0.; lawMask+=m*K.w; lawTw+=m*K.x; lawSym+=m*K.y; field+=m*sin(2.*PI*(uPhase*K.z+float(i)*.17));}
 float localSym=sym+lawSym*2.2; float localSector=2.*PI/max(2.,localSym); float la=mod(ang+localSector*.5,localSector)-localSector*.5;
 float lattice=abs(sin((rr*18.+baseWarp*5.+field*2.)*PI + T.x*3.));
 float veins=abs(cos(la*localSym*3.+rr*11.+lawTw*4.-T.y*2.));
 float structure=pow(max(0.,1.-abs(lattice-.42)*3.),1.6)*.72 + pow(max(0.,1.-veins*2.4),2.2)*.55;
 float boundary=smoothstep(.78,.18,rr)*(1.-smoothstep(.82,1.05,rr));
 float core=exp(-r*r*10.)*(.25+.25*sin(t*uFreq+baseWarp*4.));
 float chaos=fbm(rot(q,baseWarp*uTwist+T.z)*8.+T.zw*uWarp*2.);
 float v=structure*(.55+.65*baseWarp)+boundary*.38+core*.35+chaos*.18+field*.11;
 v*=.72+.28*sin(t*2.+baseWarp*5.);
 float h=uHue + v*.85 + ang*.12 + baseWarp*.35;
 vec3 col=0.5+0.5*cos(6.28318*(h+vec3(0.,.16,.33)));
 col*=pow(max(v,0.),.62)*uEnergy; col=mix(col,col*uTint,0.38);
 col+=vec3(.025,.02,.035)*(1.-smoothstep(.0,.8,r));
 float edge=smoothstep(.98,.72,r); col*=edge;
 outColor=vec4(col,1.);
}`;
function initGL(){if(!gl)return false; const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,V);gl.compileShader(vs);const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,F);gl.compileShader(fs);if(!gl.getShaderParameter(vs,gl.COMPILE_STATUS)||!gl.getShaderParameter(fs,gl.COMPILE_STATUS))return false;const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))return false; const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.useProgram(p);const loc=gl.getAttribLocation(p,'position');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);return {p};}
let G=null;
function renderGL(phase){gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(G.p);const u=(n)=>gl.getUniformLocation(G.p,n);gl.uniform1f(u('uPhase'),phase);gl.uniform1f(u('uTime'),phase*LOOP);gl.uniform1f(u('uSeed'),universe.seed);gl.uniform1f(u('uSym'),universe.symmetry);gl.uniform1f(u('uScale'),universe.scale);gl.uniform1f(u('uWarp'),universe.warp);gl.uniform1f(u('uDensity'),universe.density);gl.uniform1f(u('uTwist'),universe.twist);gl.uniform1f(u('uFreq'),universe.freq);gl.uniform1f(u('uHue'),universe.hue);gl.uniform1f(u('uEnergy'),universe.energy);gl.uniform1f(u('uMode'),MODE);let tint=[1,1,1];if(THREE&&THREE.Color){const c=new THREE.Color().setHSL((universe.hue/(2.*PI))%1,.72,.58);tint=[c.r,c.g,c.b];}gl.uniform3fv(u('uTint'),tint);const a=[],b=[];for(let i=0;i<12;i++){const L=laws[i]||{x:-2,y:-2,r:0,str:0,tw:0,sy:0,ph:0,amp:0};a.push(L.x,L.y,L.r,L.str);b.push(L.tw,L.sy,L.ph/(2*PI),L.amp);}gl.uniform4fv(u('uLaws[0]'),a);gl.uniform4fv(u('uLaw2[0]'),b);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
function renderFallback(phase){if(!ctx2)return;const w=fallbackCanvas.width,h=fallbackCanvas.height;const img=ctx2.createImageData(w,h),d=img.data;const t=2*Math.PI*phase;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let px=x/w-.5,py=1-y/h-.5, r=Math.hypot(px,py),a=Math.atan2(py,px);let s=Math.max(3,universe.symmetry),sec=2*Math.PI/s,aa=((a+sec*.5)%sec)-sec*.5;let n=Math.sin((r*24+Math.sin(px*8+Math.cos(t))*2+phase*universe.freq)*Math.PI);let v=Math.pow(Math.max(0,1-Math.abs(n)),3)*.8;v+=Math.pow(Math.max(0,Math.cos(aa*s*2+r*13+t*2)),8)*.35;for(const L of laws){let q=Math.hypot(x/w-L.x,(1-y/h)-L.y),m=Math.max(0,1-q/(L.r||.1));v+=m*.3*Math.sin(t*(L.sy||1)+L.ph);}let hh=universe.hue+v*.9+a*.12;let R=(.5+.5*Math.cos(hh*6.283))*v*universe.energy,Gg=(.5+.5*Math.cos((hh+.16)*6.283))*v*universe.energy,B=(.5+.5*Math.cos((hh+.33)*6.283))*v*universe.energy;let i=(y*w+x)*4;d[i]=R*255;d[i+1]=Gg*255;d[i+2]=B*255;d[i+3]=255;}ctx2.putImageData(img,0,0);}
async function boot(){resize();try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');}catch(e){THREE=null} G=initGL();if(!G){fallback=true;canvas.style.display='none';fallbackCanvas.style.display='block';ctx2=fallbackCanvas.getContext('2d',{alpha:false});} loop();}
function loop(now=performance.now()){raf=requestAnimationFrame(loop);updateClock();const phase=((now/1000)%LOOP)/LOOP;if(G)renderGL(phase);else renderFallback(phase);}
async function exportGIF(fps){modal.classList.remove('open');status.style.display='block';status.textContent='GENERATING LOOP…';await new Promise(r=>setTimeout(r,40));let mod;try{mod=await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm')}catch(e){status.textContent='GIF LIBRARY LOAD FAILED';setTimeout(()=>status.style.display='none',1800);return;}const {GIFEncoder,quantize,applyPalette}=mod;const gif=GIFEncoder();const N=Math.round(fps*3);const w=Math.min(720,Math.max(360,Math.round(innerWidth*.75))),h=Math.round(w*innerHeight/innerWidth);const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;const tx=tmp.getContext('2d',{willReadFrequently:true});const target=fallback?fallbackCanvas:canvas;const oldW=target.width,oldH=target.height,oldStyleW=target.style.width,oldStyleH=target.style.height;target.width=w;target.height=h;for(let i=0;i<N;i++){const phase=i/N;if(G)renderGL(phase);else renderFallback(phase);tx.clearRect(0,0,w,h);tx.drawImage(target,0,0,w,h);const rgba=tx.getImageData(0,0,w,h).data;const pal=quantize(rgba,128);const idx=applyPalette(rgba,pal);gif.writeFrame(idx,w,h,{palette:pal,delay:1000/fps,repeat:0});if(i%5===0)status.textContent=`GENERATING LOOP… ${i+1}/${N}`;await new Promise(r=>setTimeout(r,0));}target.width=oldW;target.height=oldH;target.style.width=oldStyleW;target.style.height=oldStyleH;resize();const bytes=gif.bytes(),blob=new Blob([bytes],{type:'image/gif'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=TITLE.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-loop.gif';a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);status.style.display='none'},1000);}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>exportGIF(Number(b.dataset.fps)));
addEventListener('resize',resize);showUI();boot();
</script></body></html>
