<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050b}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#f5f4f7;font-family:system-ui,-apple-system,sans-serif}
.title{position:absolute;left:7vw;top:7vh;letter-spacing:.12em;text-shadow:0 2px 18px #000}
.title b{display:block;font-size:clamp(28px,5vw,54px);letter-spacing:.04em}.title span{display:block;margin-top:6px;font-size:12px;opacity:.68;letter-spacing:.32em}
button{pointer-events:auto;position:absolute;right:7vw;top:7vh;width:72px;height:72px;border-radius:50%;border:1px solid #ffffff33;background:#0b0c18bb;color:white;font-size:34px}
.hint{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font-size:12px;letter-spacing:.18em;opacity:.55;white-space:nowrap}
</style></head><body><canvas id="c"></canvas>
<div class="ui"><div class="title"><b>Art Playground</b><span>PSYCHEDELIC LIVING MANDALA</span></div><button id="regen">↻</button><div class="hint">触れると、その曼荼羅が目覚める</div></div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,cells=[],seed=1,touches=[];
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
function build(){cells=[];seed=(Math.random()*4294967295)>>>0;let sp=Math.max(48,Math.min(82,Math.min(W,H)/10));
for(let y=-sp;y<H+sp;y+=sp*.72)for(let xx=-sp;xx<W+sp;xx+=sp*.68)cells.push({x:xx+(rnd()-.5)*sp*.55,y:y+(rnd()-.5)*sp*.45,r:sp*(.42+rnd()*.62),n:5+Math.floor(rnd()*6),rot:rnd()*6.28,h:rnd()*360,p:rnd()*6.28,live:rnd()<.22,w:.6+rnd()*1.4,boost:0})}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);build()}
function petal(o,a,rr,len,ww,warp,fill){
let ca=Math.cos(a),sa=Math.sin(a),P=(u,v)=>[o.x+u*ca-v*sa,o.y+u*sa+v*ca];x.beginPath();let q=P(0,0);x.moveTo(...q);q=P(len*.35,ww);x.quadraticCurveTo(...q,...P(len*.75,ww*.55));q=P(len,warp);x.quadraticCurveTo(...q,...P(len*.75,-ww*.55));q=P(len*.35,-ww);x.quadraticCurveTo(...q,o.x,o.y);x.fillStyle=fill;x.fill();x.strokeStyle='rgba(8,5,18,.9)';x.lineWidth=Math.max(1.5,rr*.05);x.stroke()}
function draw(o,t){
o.boost*=0.93; if(o.boost<0.001) o.boost=0;
let baseLive=o.live||o.boost>0.04;
let pulse=baseLive?Math.sin(t*.0011*o.w+o.p)*.10+o.boost*.35:Math.sin(t*.00012+o.p)*.01, r=o.r*(1+pulse);
for(let ring=0;ring<3;ring++){let rr=r*(1-ring*.24);for(let i=0;i<o.n;i++){let a=o.rot+i*6.283/o.n+Math.sin(t*.00015+i+o.p)*.012,warp=baseLive&&i%2==0?Math.sin(t*.0014+o.p+i)*rr*.1:0,h=(o.h+ring*25+Math.sin(t*.0008+o.p)*18+o.boost*40)%360;petal(o,a,rr,rr*(.80-ring*.07),rr*(.27-ring*.035),warp,hsl(h,80-ring*8,58+o.boost*10,ring?0.87:0.96));}}
x.beginPath();x.arc(o.x,o.y,r*.19,0,6.283);x.fillStyle='#080611';x.fill();x.lineWidth=Math.max(1.5,r*.045);x.strokeStyle=hsl(o.h+80,85,68,.9);x.stroke();x.beginPath();x.arc(o.x+Math.sin(t*.0007+o.p)*r*.025,o.y,r*.075,0,6.283);x.fillStyle=hsl(o.h+150,90,72);x.fill();
if(o.boost>0.1){x.beginPath();x.arc(o.x,o.y,r*1.12,0,6.283);x.strokeStyle=hsl(o.h+150,95,75,Math.min(.85,o.boost*.6));x.lineWidth=2;x.stroke();}}
function wake(px,py){
touches.push({x:px,y:py,r:6,life:1,h:rnd()*360});
for(const o of cells){const d=Math.hypot(o.x-px,o.y-py),range=o.r*3+140;if(d<range)o.boost=Math.min(1.4,o.boost+(1-d/range)*1.3);}
}
function canvasPos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{const p=canvasPos(e);wake(p.x,p.y)});
c.addEventListener('pointermove',e=>{if(e.buttons){const p=canvasPos(e);wake(p.x,p.y)}});
function frame(t){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a0712');g.addColorStop(.5,'#05050b');g.addColorStop(1,'#0d0711');x.fillStyle=g;x.fillRect(0,0,W,H);
cells.sort((a,b)=>b.r-a.r);for(const o of cells)draw(o,t);
x.globalCompositeOperation='lighter';
for(let i=touches.length-1;i>=0;i--){const tp=touches[i];tp.r+=6;tp.life-=.02;if(tp.life<=0){touches.splice(i,1);continue}x.strokeStyle=hsl(tp.h,95,78,Math.max(0,tp.life)*.5);x.lineWidth=1.5+tp.life*2;x.beginPath();x.arc(tp.x,tp.y,tp.r,0,6.283);x.stroke()}
x.globalCompositeOperation='source-over';
requestAnimationFrame(frame)}
document.getElementById('regen').onclick=build;addEventListener('resize',resize);resize();requestAnimationFrame(frame)})();
</script></body></html>
