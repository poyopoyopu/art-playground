<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — ELASTIC BREAK</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* ELASTIC BREAK v62 — ChatGPT作。世界のルール: 空間は膜。触れた場所を強く引くほど、その場所に亀裂が入り、亀裂を越えた線だけ位相が反転する。 */
const c=document.getElementById('c'),g=c.getContext('2d'),TAU=Math.PI*2;let W=1,H=1,D=1,seed=Math.random()*99,anchors=[],cuts=[],st=performance.now();const N=22;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function pos(i,j,t){let X=i/(N-1)*W,Y=j/(N-1)*H,s=Math.min(W,H),flip=0;for(const a of anchors){let dx=a.x-X,dy=a.y-Y,d=Math.hypot(dx,dy)+24,k=Math.exp(-d/(s*.22))*.52;X+=dx*k;Y+=dy*k}for(const q of cuts){let side=(X-q.x)*Math.cos(q.a)+(Y-q.y)*Math.sin(q.a);if(side<0)flip++;}let bend=Math.sin(t*2+j*.22)*4+Math.sin(t*3+i*.17)*3;return[X+Math.cos(flip*Math.PI)*bend,Y+Math.sin(flip*Math.PI)*bend]}
function render(t,live){if(live){g.fillStyle='rgba(2,2,7,.18)';g.fillRect(0,0,W,H)}else{g.clearRect(0,0,W,H);g.fillStyle='#020207';g.fillRect(0,0,W,H)}for(let j=0;j<N;j++){g.beginPath();for(let i=0;i<N;i++){let p=pos(i,j,t);i?g.lineTo(...p):g.moveTo(...p)}g.strokeStyle=`hsla(${(j*15+seed*30)%360} 90% 72% / .62)`;g.lineWidth=1.1;g.stroke()}for(let i=0;i<N;i++){g.beginPath();for(let j=0;j<N;j++){let p=pos(i,j,t);j?g.lineTo(...p):g.moveTo(...p)}g.strokeStyle=`hsla(${(i*17+seed*30+150)%360} 90% 72% / .45)`;g.stroke()}for(const q of cuts){g.beginPath();g.moveTo(q.x-80*Math.sin(q.a),q.y+80*Math.cos(q.a));g.lineTo(q.x+80*Math.sin(q.a),q.y-80*Math.cos(q.a));g.strokeStyle='rgba(255,255,255,.75)';g.stroke()}}
function frame(){render((performance.now()-st)/1000*TAU/3,true);requestAnimationFrame(frame)}frame();let down=null;c.onpointerdown=e=>{down={x:e.clientX,y:e.clientY};anchors.push(down);anchors=anchors.slice(-4)};c.onpointermove=e=>{if(down){down.x=e.clientX;down.y=e.clientY;anchors[anchors.length-1]=down}};c.onpointerup=e=>{if(down){cuts.unshift({x:e.clientX,y:e.clientY,a:Math.atan2(e.clientY-H/2,e.clientX-W/2)});cuts=cuts.slice(0,5);down=null}};
APKit.init({canvas:c,gifName:'elastic-break-loop',clockFormat:'spec',loopFrame:p=>render(p,false),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>{anchors=[];cuts=[]}}]});
</script></body></html>
