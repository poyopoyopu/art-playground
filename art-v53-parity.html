<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — PARITY</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* PARITY v53 — ChatGPT作。世界のルール: 画面は2つの向きの秩序に分かれ、境界が自律的に移動する。タップは絵を足さず、触れた場所の向きを反転させる。 */
const c=document.getElementById('c'),x=c.getContext('2d'),TAU=Math.PI*2;let W=1,H=1,D=1,seed=Math.random()*99,phase=0,marks=[],global=0;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function col(t){return `hsl(${(t*360)%360} 80% 68%)`}
function hash(a){return Math.abs(Math.sin(a*127.1+seed*17.3)*43758.5)%1}
function draw(){phase+=.006;let s=Math.min(W,H),cx=W/2,cy=H/2;x.fillStyle='rgba(3,3,7,.16)';x.fillRect(0,0,W,H);x.save();x.translate(cx,cy);x.globalCompositeOperation='lighter';
for(let k=0;k<34;k++){let a=k*TAU/34+phase*(k%2?-1:1)*.32+global,rr=s*(.08+k*.019),side=(k+Math.floor(phase*2)+Math.floor(global*2))%2,pts=side?5:6; x.beginPath();for(let j=0;j<pts;j++){let q=j*TAU/pts+a, wob=rr*(.72+.28*Math.sin(phase*2+k));let px=Math.cos(q)*wob,py=Math.sin(q)*wob;if(j===0)x.moveTo(px,py);else x.lineTo(px,py)}x.closePath();x.strokeStyle=col((k/34)+(side?.12:0));x.globalAlpha=.18+.018*k;x.lineWidth=1.2;x.stroke();}
for(const m of marks){let age=(performance.now()-m.t)*.001;if(age<4){let q=1-age/4,r=age*s*.12;x.beginPath();x.arc(m.x,m.y,r,0,TAU);x.strokeStyle=col(m.h+.5);x.globalAlpha=q*.8;x.lineWidth=2;x.stroke()}}x.restore();x.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw);
let last=0;c.addEventListener('pointerdown',e=>{let now=performance.now(),s=Math.min(W,H),px=e.clientX-W/2,py=H/2-e.clientY;if(now-last<300){global+=Math.PI;marks=[];last=0;return}last=now;marks.unshift({x:px,y:py,t:now,h:Math.atan2(py,px)/TAU+.5});marks=marks.slice(0,8);global+=.55});
APKit.init({canvas:c,gifName:'parity-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:()=>draw(),buttons:[{label:'\u2726',name:'mutate',onClick:()=>{seed=Math.random()*99}},{label:'\u21bb',name:'reset',onClick:()=>{seed=Math.random()*99;global=0;marks=[]}}]});
</script></body></html>
