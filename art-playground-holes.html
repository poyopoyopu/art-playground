<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030308"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Art Playground — HOLES — TOUCH SOMEWHERE ELSE</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030308;color:#fff}
body{height:100dvh;touch-action:none;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:9;left:50%;bottom:max(10vh,calc(env(safe-area-inset-bottom) + 62px));transform:translateX(-50%);display:flex;gap:9px}
button{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff28;background:#07070dd9;color:#fff;font-size:15px;box-shadow:0 4px 20px #0009;backdrop-filter:blur(12px)}
button:active{transform:scale(.91)}button.on{background:#ffffff20;border-color:#ffffff65}
.hint{position:fixed;z-index:8;left:50%;bottom:max(4vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:8px;letter-spacing:.42em;opacity:.28;white-space:nowrap;pointer-events:none;transition:opacity 1s}
.hint.hide{opacity:0}
.clock{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:6px;font-family:ui-monospace,"SF Mono",monospace;font-variant-numeric:tabular-nums;pointer-events:none}
.clock.on{display:flex}.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;text-shadow:0 0 3px #000,0 0 16px #000}.clock i{font-style:normal;opacity:.62}.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.3em;opacity:.62}
</style></head><body>
<canvas id="c"></canvas><div class="hint" id="hint">HOLES — TOUCH SOMEWHERE ELSE</div>
<div class="clock" id="clock"><div class="t" id="clockTime">00:00<i>:00</i></div><div class="d" id="clockDate"></div></div>
<div class="ui"><button id="mutate">✦</button><button id="reset">↻</button><button id="clockBtn">🕐</button><button id="fsBtn">⛶</button></div>
<script>
/* 2026-09-11: HOLES — touch creates portals; distant regions exchange positions. */
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,D,t=0,last=performance.now(),portals=[],drag=null;
function size(){const r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,1.5);W=c.width=Math.floor(r.width*D);H=c.height=Math.floor(r.height*D)}new ResizeObserver(size).observe(c);size();
function warp(px,py){let X=px,Y=py;for(const q of portals){let dx=X-q.x,dy=Y-q.y,d2=dx*dx+dy*dy,w=Math.exp(-d2/(q.r*q.r));if(w>.001){let a=q.spin*w*2.5;let ca=Math.cos(a),sa=Math.sin(a);let nx=dx*ca-dy*sa,ny=dx*sa+dy*ca;X+=nx-dx;Y+=ny-dy;X+=q.tx*w;Y+=q.ty*w}}return[X,Y]}
function draw(now){let dt=Math.min(.03,(now-last)/1000);last=now;t+=dt;x.fillStyle='#030308';x.fillRect(0,0,W,H);let m=Math.min(W,H);for(let n=0;n<125;n++){x.beginPath();for(let j=0;j<=72;j++){let a=j/72*Math.PI*2,r=.025+n/125*1.5+.02*Math.sin(j+n-t);let p=warp(Math.cos(a)*r,Math.sin(a)*r);let X=p[0]+.035*Math.sin(p[1]*13+t+n*.08),Y=p[1]+.035*Math.cos(p[0]*11-t);if(j)x.lineTo(X*m,Y*m);else x.moveTo(X*m,Y*m)}x.globalAlpha=.035+.045*(n%17===0);x.lineWidth=(.55+(n%19===0)*1.1)*D;x.strokeStyle=`hsl(${285+n*2.9+t*22} 100% 63%)`;x.stroke()}for(const q of portals){x.globalAlpha=.5;x.lineWidth=1.3*D;x.strokeStyle=`hsl(${q.h+t*35} 100% 70%)`;x.beginPath();x.arc(q.x*m,q.y*m,q.r*m*(1+.15*Math.sin(t*2)),0,Math.PI*2);x.stroke()}x.globalAlpha=1;requestAnimationFrame(draw)}requestAnimationFrame(draw);
function P(e){let r=c.getBoundingClientRect(),m=Math.min(r.width,r.height);return{x:(e.clientX-r.left-r.width/2)/m,y:(e.clientY-r.top-r.height/2)/m}}
function add(p){portals.push({x:p.x,y:p.y,r:.12,spin:Math.random()*2-1,tx:Math.random()*1.5-.75,ty:Math.random()*1.8-.9,h:Math.random()*360});if(portals.length>9)portals.shift()}
c.onpointerdown=e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}let p=P(e);drag={...p,px:p.x,py:p.y};add(p)};c.onpointermove=e=>{if(!drag)return;let p=P(e);if(Math.hypot(p.x-drag.px,p.y-drag.py)>.03)add(p);drag.px=p.x;drag.py=p.y};c.onpointerup=()=>drag=null;
document.getElementById('mutate').onclick=()=>{for(let i=0;i<5;i++)add({x:Math.random()*1.8-.9,y:Math.random()*2-1})};document.getElementById('reset').onclick=()=>portals=[];


const clock=document.getElementById('clock'),ct=document.getElementById('clockTime'),cd=document.getElementById('clockDate');
const week=['日','月','火','水','木','金','土'],pad=n=>String(n).padStart(2,'0');
let clockOn=false,wakeLock=null;
function tick(){if(!clockOn)return;const d=new Date();ct.innerHTML=pad(d.getHours())+':'+pad(d.getMinutes())+'<i>:'+pad(d.getSeconds())+'</i>';cd.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 ('+week[d.getDay()]+')'}
function cl(){tick();setTimeout(cl,1000-(Date.now()%1000)+8)}cl();
async function wake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(_){}}
document.getElementById('clockBtn').onclick=function(){clockOn=!clockOn;clock.classList.toggle('on',clockOn);this.classList.toggle('on',clockOn);if(clockOn)wake();else{try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null}};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&clockOn&&!wakeLock)wake()});
document.getElementById('fsBtn').onclick=async()=>{const d=document.documentElement,fs=document.fullscreenElement||document.webkitFullscreenElement;try{if(fs)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(d.requestFullscreen)await d.requestFullscreen();else if(d.webkitRequestFullscreen)await d.webkitRequestFullscreen()}catch(_){}};

setTimeout(()=>document.getElementById('hint').classList.add('hide'),8500);
</script></body></html>
