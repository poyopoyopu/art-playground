<!doctype html><html><head><title>Art Playground — EVERSION</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020208">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020208;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;opacity:.35;pointer-events:none;z-index:3}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eversion">
<script src="ap-kit.js"></script>
</head><body>
<canvas id="c"></canvas><div id="hint">INVERSION — TOUCH FLIPS INSIDE AND OUT</div>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,D,t=0,flip=[];
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
c.onpointerdown=e=>{flip.push({x:e.clientX,y:e.clientY,r:90,life:1});if(flip.length>8)flip.shift();c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(e.buttons){let q=flip[flip.length-1];q.x=e.clientX;q.y=e.clientY;q.r=Math.min(180,q.r+1)}};
function signed(x,y){
 let d=Math.hypot(x-W*.5,y-H*.5);
 for(let q of flip){let rr=Math.hypot(x-q.x,y-q.y);if(rr<q.r)d=-d*.72}
 return d;
}
function render(P){
 // P = loop phase (0..2π) while exporting, null while live.
 // Every phase goes through APKit.T so the last frame lands on the first.
 const K=(k)=>APKit.T(k,P,t);
 g.fillStyle='#010107';g.fillRect(0,0,W,H);
 let M=Math.min(W,H),cx=W/2,cy=H/2;
 for(let n=0;n<28;n++){let off=n*9+Math.sin(K(1.5)+n)*5;
   g.beginPath();
   for(let j=0;j<=240;j++){let a=j/240*Math.PI*2;
     let wob=Math.sin(a*3+K(1)+n*.3)*10+Math.sin(a*7-K(1.4))*4;
     let rr=M*.08+off+wob;let xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr;
     if(j===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}
   g.closePath();g.strokeStyle=`hsla(${(n*13+K(42)*(P==null?1:57.29577951308232))%360},100%,65%,.22)`;
   g.lineWidth=1.5;g.stroke();
 }
 // inversion zones redraw as nested contours, so a touch changes topology
 for(let q of flip){for(let n=0;n<11;n++){let rr=q.r*(.12+n*.09)+Math.sin(K(2)+n)*3;
   g.beginPath();g.arc(q.x,q.y,rr,0,Math.PI*2);
   g.strokeStyle=`hsla(${(280+n*23+K(35)*(P==null?1:57.29577951308232))%360},100%,65%,${.12+n*.018})`;
   g.lineWidth=2;g.stroke()}}
}
function frame(){ if(!APKit.isExporting()){ t+=.012; render(null); } requestAnimationFrame(frame) }
frame();
APKit.init({
 canvas:c, gifName:'eversion-loop',
 loopFrame:(phase)=>render(phase),
 buttons:[{label:'↻',name:'reset',onClick:()=>{flip=[]}}]
});
</script></body></html>
