<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART v19 — Living Field</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060c;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#dfe7ff}#title{position:absolute;left:18px;top:18px;font-size:12px;letter-spacing:.18em;opacity:.6}#hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;opacity:.45;white-space:nowrap}button{pointer-events:auto;position:absolute;right:16px;top:14px;width:54px;height:54px;border-radius:50%;border:1px solid #ffffff24;background:#0a0c1899;color:#eaf0ff;font-size:20px}</style></head>
<body><canvas id="c"></canvas><div id="ui"><div id="title">LIVING FIELD · v19</div><div id="hint">触ると流れが変わる</div><button id="reset">↻</button></div>
<script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d',{alpha:false}),N=260,pts=[],touches=[];let w,h,dpr,hue=Math.random()*360,last=performance.now();
const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function make(i){return{x:rnd(0,w),y:rnd(0,h),vx:rnd(-.28,.28),vy:rnd(-.28,.28),s:rnd(5,18),a:rnd(0,6.28),spin:rnd(-.012,.012),phase:rnd(0,99),kind:i%4}}function seed(){pts.length=0;for(let i=0;i<N;i++)pts.push(make(i))}seed();
function shape(p,t){let s=p.s*(.55+.45*Math.sin(t*.001+p.phase));x.save();x.translate(p.x,p.y);x.rotate(p.a);x.lineWidth=Math.max(.7,s*.11);x.strokeStyle=`hsla(${(hue+p.x*.035+p.y*.02+t*.006)%360},82%,66%,.78)`;x.beginPath();if(p.kind===0){x.moveTo(-s*.75,-s*.1);x.lineTo(-s*.18,-s*.62);x.lineTo(s*.7,-s*.35);x.lineTo(s*.55,s*.52);x.lineTo(-s*.45,s*.66);x.closePath()}else if(p.kind===1)x.ellipse(0,0,s*.72,s*.42,0,0,6.28);else if(p.kind===2){x.moveTo(-s*.7,0);x.quadraticCurveTo(-s*.25,-s*.8,s*.2,-s*.55);x.quadraticCurveTo(s*.85,-s*.2,s*.55,s*.6);x.quadraticCurveTo(0,s*.85,-s*.7,0)}else{x.moveTo(-s*.72,-s*.55);x.lineTo(s*.62,-s*.68);x.lineTo(s*.78,s*.25);x.lineTo(-s*.35,s*.7);x.closePath()}x.stroke();x.restore()}
function loop(t){let dt=Math.min(32,t-last);last=t;x.fillStyle='#05060c';x.fillRect(0,0,w,h);for(const p of pts){p.vx+=(Math.sin(p.y*.004+t*.00022)+Math.cos(p.x*.003-t*.00017))*.003;p.vy+=(Math.cos(p.x*.004+t*.00019)-Math.sin(p.y*.003+t*.00023))*.003;for(const z of touches){let dx=p.x-z.x,dy=p.y-z.y,d=Math.hypot(dx,dy)||1;if(d<z.r){let k=(1-d/z.r)*z.power;p.vx+=dx/d*k;p.vy+=dy/d*k}}p.vx*=.992;p.vy*=.992;p.x+=p.vx*dt*.06;p.y+=p.vy*dt*.06;p.a+=p.spin*dt*.06;if(p.x<-30)p.x=w+30;if(p.x>w+30)p.x=-30;if(p.y<-30)p.y=h+30;if(p.y>h+30)p.y=-30;shape(p,t)}touches.forEach(z=>z.r*=.985);for(let i=touches.length-1;i>=0;i--)if(touches[i].r<8)touches.splice(i,1);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function hit(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{let p=hit(e);touches.push({x:p.x,y:p.y,r:Math.min(w,h)*.22,power:.11})};c.onpointermove=e=>{if(e.buttons){let p=hit(e);touches.push({x:p.x,y:p.y,r:Math.min(w,h)*.16,power:.075})}};reset.onclick=()=>{seed();hue=Math.random()*360;touches.length=0};setInterval(()=>hue=(hue+1.8)%360,40)})();</script></body></html>
