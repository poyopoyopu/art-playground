    return[cx+Math.cos(aa)*rr,cy+yy+Math.sin(aa)*rr*.20,0];
  }
  if(mode===3){
    let q=(p.seed%1)*TAU;
    let x=16*Math.pow(Math.sin(q),3);
    let y=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q);
    let fill=(p.r/(s*.58));
    let sc=s*.0185*(.48+.52*Math.sin(fill*Math.PI));
    let wob=1+Math.sin(u*1.6+p.phase)*.025;
    return[cx+x*sc*wob,cy-y*sc*wob,0];
  }
  if(mode===4){
    let arms=5;
    let aa=a+Math.log(1+r)*.76+u*.22+Math.floor(p.seed*arms)*TAU/arms;
    let rr=r*.72;
    return[cx+Math.cos(aa)*rr*1.32,cy+Math.sin(aa)*rr*.62,0];
  }
  if(mode===5) return rabbitPoint(p,u);
  let aa=a+u*.18;
  let rr=s*.34*(.58+.42*Math.pow(Math.abs(Math.cos(5*aa)),8));
  return[cx+Math.cos(aa)*rr,cy+Math.sin(aa)*rr,0];
}
function frame(now){
  let u=(now-t0)/1000;
  ctx.fillStyle='rgb(2,3,10)';ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.72);
  g.addColorStop(0,'#0a1030');g.addColorStop(.38,'#070a1a');g.addColorStop(1,'#02030a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const [h1,h2]=palettes[mode];ctx.globalCompositeOperation='lighter';
  for(const p of pts){
    let [tx,ty,k]=organic(p,u);
    if(drag){
      let dx=drag.x-tx,dy=drag.y-ty,d=Math.hypot(dx,dy)+1,range=Math.min(W,H)*.32;
      if(d<range){
        let q=1-d/range;
        tx+=dx*q*q*1.15-dy*q*.48+drag.vx*q*1.8;
        ty+=dy*q*q*1.15+dx*q*.48+drag.vy*q*1.8;
        p.vx+=drag.vx*q*.018;p.vy+=drag.vy*q*.018;
      }
    }
    p.x+=(tx-p.x)*.065+p.vx;p.y+=(ty-p.y)*.065+p.vy;
    p.vx*=.90;p.vy*=.90;
    let vel=Math.hypot(p.x-p.px,p.y-p.py);p.px=p.x;p.py=p.y;
    let hue=(h1+(h2-h1)*(p.seed%1)+Math.sin(u*.7+p.phase)*18+360)%360;
    let light=64+Math.min(20,vel*8);
    let alpha=.24+Math.min(.72,vel*.25)+p.size*.045;
    let sz=p.size*(.74+Math.min(1.85,vel*.18));
    if(mode===5){
      if(k===1){ctx.fillStyle=`hsla(345,18%,92%,${Math.min(.95,alpha*1.12)})`;sz*=.92}
      else if(k===2){ctx.fillStyle=`hsla(${335+Math.sin(p.phase)*8},92%,72%,${Math.min(.95,alpha*1.15)})`;sz*=1.08}
      else {ctx.fillStyle=`hsla(${35+(p.seed%1)*42},88%,${70+Math.min(15,vel*5)}%,${alpha})`}
    } else {
      ctx.fillStyle=`hsla(${hue},100%,${light}%,${alpha})`;
    }
    ctx.beginPath();ctx.arc(p.x,p.y,sz,0,TAU);ctx.fill();
  }
  for(let i=trail.length-1;i>=0;i--){
    let q=trail[i];q.life-=.028;q.r+=2.8;
    if(q.life<=0){trail.splice(i,1);continue}
    ctx.strokeStyle=`hsla(${q.h},100%,78%,${q.life*.45})`;
    ctx.lineWidth=1+q.life*2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.stroke();
  }
  for(let i=shock.length-1;i>=0;i--){
    let q=shock[i];q.r+=q.v;q.life-=.018;
    if(q.life<=0){shock.splice(i,1);continue}
    ctx.strokeStyle=`hsla(${q.h},100%,80%,${q.life*.7})`;
    ctx.lineWidth=1.5+q.life*2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame);
}
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function interact(e){
  const p=pos(e);if(!drag)drag={x:p.x,y:p.y,vx:0,vy:0};
  drag.vx=p.x-drag.x;drag.vy=p.y-drag.y;drag.x=p.x;drag.y=p.y;
  trail.push({x:p.x,y:p.y,r:3,life:1,h:(p.x/W*360+performance.now()/35)%360});
  if(trail.length>90)trail.shift();document.getElementById('tip').style.opacity=0;
}
function pointerDown(e){c.setPointerCapture?.(e.pointerId);drag=null;interact(e)}
function pointerMove(e){if(drag)interact(e)}
function pointerUp(e){if(drag)shock.push({x:drag.x,y:drag.y,r:8,v:5+Math.hypot(drag.vx,drag.vy)*.7,life:1,h:(drag.x/W*360)%360});drag=null}
c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);
c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',pointerUp);
document.getElementById('mode').addEventListener('click',()=>{
  mode=(mode+1)%modes.length;document.getElementById('modeName').textContent=modes[mode];burst();
});
document.getElementById('regen').addEventListener('click',()=>build());
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>
