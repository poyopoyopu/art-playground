<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Law Field">
<title>LAW FIELD — Art Playground</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a;overscroll-behavior:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}
.ctrl{position:absolute;right:5vw;top:max(4vh,env(safe-area-inset-top));display:flex;gap:8px;transition:opacity .6s}
.ctrl.idle{opacity:0;pointer-events:none}
.btn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff20;
 background:#0a0a16a0;color:#fff;font-size:17px;backdrop-filter:blur(8px)}
.btn:disabled{opacity:.35}
.btn.act{border-color:#ffffff60;background:#ffffff1e}
.legend{position:absolute;left:50%;bottom:max(4vh,env(safe-area-inset-bottom));transform:translateX(-50%);
 font-size:9.5px;letter-spacing:.2em;opacity:.42;white-space:nowrap;text-align:center;transition:opacity 1.2s;
 text-shadow:0 1px 10px #000}
.legend.hide{opacity:0}
.read{position:absolute;left:5vw;top:max(4vh,env(safe-area-inset-top));font-size:9px;letter-spacing:.22em;
 opacity:0;transition:opacity .4s;text-shadow:0 1px 10px #000;line-height:1.85;font-variant-numeric:tabular-nums}
.read.on{opacity:.62}
.flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .18s}

.clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
 flex-direction:column;align-items:center;gap:6px;
 font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
 pointer-events:none;user-select:none;-webkit-user-select:none}
.clock.on{display:flex}
.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;color:#fff;
 text-shadow:0 0 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.9),0 4px 34px rgba(0,0,0,.85)}
.clock .t i{font-style:normal;opacity:.62}
.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.3em;opacity:.62;
 text-shadow:0 0 3px rgba(0,0,0,.95),0 2px 16px rgba(0,0,0,.9)}

.toast{position:absolute;left:50%;bottom:calc(max(4vh,env(safe-area-inset-bottom)) + 52px);
 transform:translateX(-50%);max-width:78vw;padding:11px 18px;border-radius:14px;
 background:#0a0a16d8;border:1px solid #ffffff1f;backdrop-filter:blur(10px);
 font-size:12px;line-height:1.6;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.toast.on{opacity:1}

.sheet{position:fixed;inset:0;background:#03030ae8;backdrop-filter:blur(14px);display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;z-index:9;
 color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
.sheet.on{display:flex}
.sheet h3{margin:0;font-size:12px;letter-spacing:.34em;font-weight:600;opacity:.8}
.sheet p{margin:0;font-size:12px;line-height:1.7;opacity:.62;max-width:290px}
.bar{width:min(72vw,300px);height:3px;background:#ffffff1a;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad9ff,#ff7ad9);transition:width .2s}
.sheet img{max-width:min(78vw,340px);max-height:50vh;border-radius:12px;border:1px solid #ffffff1a}
.sheet button,.sheet a{pointer-events:auto;border:1px solid #ffffff28;background:#ffffff10;color:#fff;
 border-radius:22px;padding:11px 24px;font-size:12px;letter-spacing:.18em;text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="ctrl" id="ctrl">
    <button class="btn" id="lawBtn" aria-label="show law">◐</button>
    <button class="btn" id="resetBtn" aria-label="reset law">↻</button>
    <button class="btn" id="gifBtn" aria-label="export gif">◉</button>
    <button class="btn" id="clockBtn" aria-label="clock">🕐</button>
    <button class="btn" id="fsBtn" aria-label="fullscreen">⛶</button>
  </div>
  <div class="read" id="read"></div>
  <div class="clock" id="clock">
    <div class="t" id="clockTime">00:00<i>:00</i></div>
    <div class="d" id="clockDate"></div>
  </div>
  <div class="legend" id="legend">DRAG 渦を塗る · HOLD 対称を上げる · 2本指 粒度</div>
  <div class="toast" id="toast"></div>
  <div class="flash" id="flash"></div>
</div>

<div class="sheet" id="sheet">
  <h3 id="sheetTitle">EXPORT LOOP</h3>
  <div class="bar" id="barWrap"><i id="barFill"></i></div>
  <p id="sheetMsg"></p>
  <div class="row" id="sheetActions"></div>
</div>

<script>
(()=>{
"use strict";

/* ===========================================================================
   LAW FIELD
   A low-resolution grid stores the RULES of the world, not its contents:
     F  local symmetry (how many fold the lattice has here)
     S  local spin     (which way, how hard this region turns)
     R  local tempo    (how fast time runs here)
     C  local grain    (how tightly the lattice is packed)
   Particles do not remember anything. Each frame they read the law at their
   own position and obey it. The finger paints the law, and paint stays.
   =========================================================================== */

const TAU=Math.PI*2, LOOP=3;
const GW=64, GH=64;                    // law grid resolution
const F0=6, S0=0, R0=1, C0=1;          // the world's default law

const lawF=new Float32Array(GW*GH), lawS=new Float32Array(GW*GH),
      lawR=new Float32Array(GW*GH), lawC=new Float32Array(GW*GH);
const tmp=new Float32Array(GW*GH);

function resetLaw(){
 lawF.fill(F0); lawS.fill(S0); lawR.fill(R0); lawC.fill(C0);
}
resetLaw();

const clampf=(v,a,b)=>v<a?a:v>b?b:v;

// bilinear read so particles never see the grid's stair-steps
function sample(arr,u,v){
 const x=clampf(u*(GW-1),0,GW-1.001), y=clampf(v*(GH-1),0,GH-1.001);
 const i=x|0, j=y|0, fx=x-i, fy=y-j, k=j*GW+i;
 const a=arr[k], b=arr[k+1], c=arr[k+GW], d=arr[k+GW+1];
 return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}

/* Laws bleed very slowly into their neighbours. Slow enough that what you paint
   is still there minutes later, fast enough that hard edges soften into
   interference instead of staying as cut lines. */
function diffuse(arr,k){
 for(let j=0;j<GH;j++){
  const jm=j>0?j-1:0, jp=j<GH-1?j+1:GH-1;
  for(let i=0;i<GW;i++){
   const im=i>0?i-1:0, ip=i<GW-1?i+1:GW-1;
   const c=arr[j*GW+i];
   const n=(arr[j*GW+im]+arr[j*GW+ip]+arr[jm*GW+i]+arr[jp*GW+i])*.25;
   tmp[j*GW+i]=c+(n-c)*k;
  }
 }
 arr.set(tmp);
}

// ---------- noise ----------
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,y){
 const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
 const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
 const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
 return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function fbm(x,y){return vnoise(x,y)*.6+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.12}

// ---------- canvas ----------
const c=document.getElementById('c'), ctx=c.getContext('2d',{alpha:false});
const flashEl=document.getElementById('flash'), legendEl=document.getElementById('legend'),
      readEl=document.getElementById('read'), toastEl=document.getElementById('toast'),
      ctrlEl=document.getElementById('ctrl');

let W=0,H=0,DPR=1,SS=1,N=0,pts=[],quality=1,exporting=false,showLaw=false;

// law preview layer, drawn at grid resolution and scaled up
const lawCv=document.createElement('canvas'); lawCv.width=GW; lawCv.height=GH;
const lawCtx=lawCv.getContext('2d');
const lawImg=lawCtx.createImageData(GW,GH);

// ---------- hue sprites ----------
const HUES=48, sprites=[];
for(let i=0;i<HUES;i++){
 const s=document.createElement('canvas'), R=16;
 s.width=s.height=R*2;
 const g=s.getContext('2d'), h=i*360/HUES;
 const rg=g.createRadialGradient(R,R,0,R,R,R);
 rg.addColorStop(0,`hsla(${h},100%,86%,1)`);
 rg.addColorStop(.28,`hsla(${h},100%,64%,.78)`);
 rg.addColorStop(1,`hsla(${h},100%,50%,0)`);
 g.fillStyle=rg; g.fillRect(0,0,R*2,R*2);
 sprites.push(s);
}

function resize(){
 if(exporting)return;
 DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; SS=Math.min(W,H);
 c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 build();
}
function makeParticles(n,w,h){
 const arr=[];
 for(let i=0;i<n;i++){
  const ang=Math.random()*TAU, rad=Math.sqrt(Math.random())*Math.min(w,h)*.52;
  const x=w/2+Math.cos(ang)*rad, y=h/2+Math.sin(ang)*rad;
  arr.push({bx:x,by:y,ax:x,ay:y,x,y,px:x,py:y,
   phi:Math.random()*TAU, ph:Math.random()*TAU, lt:Math.random()*40,
   size:.5+Math.random()*1.4, seed:Math.random()});
 }
 return arr;
}
function build(){
 N=Math.max(1400,Math.min(3400,Math.round(W*H/210*quality)));
 pts=makeParticles(N,W,H);
 ctx.fillStyle='#03030a'; ctx.fillRect(0,0,W,H);
}
function flash(){flashEl.style.opacity=.13;setTimeout(()=>flashEl.style.opacity=0,90)}

/* ---------------------------------------------------------------------------
   Where a particle belongs.
   The lattice is polar: `F` wedges around the centre, rings spaced by `C`.
   A particle snaps to the nearest lattice site OF ITS OWN REGION, so when two
   regions carry different laws their lattices disagree along the border and
   the mismatch itself becomes the pattern.
   --------------------------------------------------------------------------- */
function siteOf(ax,ay,w,h,s,F,C){
 const cx=w*.5, cy=h*.5, dx=ax-cx, dy=ay-cy;
 const r=Math.hypot(dx,dy), a=Math.atan2(dy,dx);
 const wedge=TAU/F;
 const aSnap=Math.round(a/wedge)*wedge;
 const L=s*.082*C;
 const rSnap=Math.max(L*.6,Math.round(r/L)*L);
 return [cx+Math.cos(aSnap)*rSnap, cy+Math.sin(aSnap)*rSnap, L];
}

// ---------- law painting ----------
const BRUSH=()=>SS*.20;
function paintLaw(x,y,w,h,fn){
 const br=BRUSH(), u=x/w, v=y/h;
 const rx=br/w*(GW-1), ry=br/h*(GH-1);
 const ci=u*(GW-1), cj=v*(GH-1);
 const i0=Math.max(0,Math.floor(ci-rx)), i1=Math.min(GW-1,Math.ceil(ci+rx));
 const j0=Math.max(0,Math.floor(cj-ry)), j1=Math.min(GH-1,Math.ceil(cj+ry));
 for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
  const dx=(i-ci)/rx, dy=(j-cj)/ry, d=Math.hypot(dx,dy);
  if(d>1)continue;
  const q=(1-d)*(1-d);
  fn(j*GW+i,q,i/(GW-1)-u,j/(GH-1)-v);
 }
}

// ---------- input ----------
let drag=null, pinch=null;
const active=new Map();
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

c.addEventListener('pointerdown',e=>{
 if(exporting)return;
 e.preventDefault();
 try{c.setPointerCapture(e.pointerId)}catch(_){}
 const p=pos(e);
 active.set(e.pointerId,{x:p.x,y:p.y});
 if(active.size===1){drag={x:p.x,y:p.y,vx:0,vy:0,hold:0,moving:false,id:e.pointerId};}
 else if(active.size===2){
  const [a,b]=[...active.values()];
  pinch={d:Math.hypot(b.x-a.x,b.y-a.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
  drag=null;
 }
 legendEl.classList.add('hide');
 bumpIdle();
},{passive:false});

c.addEventListener('pointermove',e=>{
 if(!active.has(e.pointerId))return;
 const p=pos(e);
 active.set(e.pointerId,{x:p.x,y:p.y});
 if(active.size>=2){
  const [a,b]=[...active.values()];
  const d=Math.hypot(b.x-a.x,b.y-a.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
  if(pinch){
   // spreading coarsens the grain, pinching in makes it finer — locally
   const k=(d-pinch.d)/SS;
   if(Math.abs(k)>.0015){
    paintLaw(cx,cy,W,H,(idx,q)=>{ lawC[idx]=clampf(lawC[idx]+k*q*1.5,.45,2.3); });
   }
  }
  pinch={d,cx,cy};
  return;
 }
 if(!drag||e.pointerId!==drag.id)return;
 const dx=p.x-drag.x, dy=p.y-drag.y;
 drag.vx=dx; drag.vy=dy; drag.x=p.x; drag.y=p.y;
 if(Math.abs(dx)+Math.abs(dy)>1.2){
  drag.moving=true;
  const speed=Math.hypot(dx,dy);
  /* Dragging paints spin. The sign comes from the cross product of the stroke
     against the offset from the stroke, so sweeping clockwise leaves a
     clockwise region behind — you stir the world and it keeps stirring. */
  paintLaw(p.x,p.y,W,H,(idx,q,ox,oy)=>{
   const cross=dx*(oy*H)-dy*(ox*W);
   lawS[idx]=clampf(lawS[idx]+Math.sign(cross)*q*.055*Math.min(3,speed*.14),-1,1);
   lawR[idx]=clampf(lawR[idx]+q*.030*Math.min(3,speed*.10),.30,2.8);
  });
 }
},{passive:true});

function endPointer(e){
 active.delete(e.pointerId);
 if(active.size<2)pinch=null;
 if(drag&&e.pointerId===drag.id)drag=null;
}
c.addEventListener('pointerup',endPointer);
c.addEventListener('pointercancel',endPointer);
c.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- the world ----------
let last=performance.now(), t0=performance.now(), acc=0, frames=0, check=performance.now(), dfc=0;

function stepLive(dt,t){
 // a held finger crystallises its region: symmetry climbs, grain tightens
 if(drag&&!drag.moving){
  drag.hold=Math.min(1,drag.hold+dt*.8);
  paintLaw(drag.x,drag.y,W,H,(idx,q)=>{
   lawF[idx]=clampf(lawF[idx]+q*dt*3.4,3,14);
   lawC[idx]=clampf(lawC[idx]-q*dt*.30,.45,2.3);
  });
 }else if(drag)drag.hold=Math.max(0,drag.hold-dt*1.6);

 /* Painted law has to actually persist, or this is just the force-field piece
    again with extra steps. Measured: ~96% still there after a minute, ~84%
    after five. Edges soften into interference; the region itself stays. */
 if(++dfc%15===0){ diffuse(lawF,.002); diffuse(lawS,.003); diffuse(lawR,.0025); diffuse(lawC,.002); }

 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='rgba(3,3,10,.20)';
 ctx.fillRect(0,0,W,H);
 if(showLaw)drawLawLayer(ctx,W,H);
 ctx.globalCompositeOperation='lighter';

 for(let i=0;i<pts.length;i++){
  const p=pts[i];
  const u=p.ax/W, v=p.ay/H;
  const F=sample(lawF,u,v), S=sample(lawS,u,v), R=sample(lawR,u,v), C=sample(lawC,u,v);

  p.lt+=dt*R;                                   // time runs at the local rate

  // anchors wander, so particles migrate between regions and adopt new laws
  const n1=fbm(p.ax/SS*1.7+t*.05, p.ay/SS*1.7);
  const n2=fbm(p.ax/SS*1.7+11, p.ay/SS*1.7+t*.05);
  p.ax+=(n1-.5)*SS*.010; p.ay+=(n2-.5)*SS*.010;
  if(drag){
   const dx=p.ax-drag.x, dy=p.ay-drag.y, d=Math.hypot(dx,dy)+1, br=BRUSH();
   if(d<br){const q=1-d/br; p.ax+=drag.vx*q*.28; p.ay+=drag.vy*q*.28;}
  }
  p.ax=clampf(p.ax,-SS*.1,W+SS*.1); p.ay=clampf(p.ay,-SS*.1,H+SS*.1);

  const [sx,sy,L]=siteOf(p.ax,p.ay,W,H,SS,F,C);
  const phi=p.phi+p.lt*S*2.3;
  const rho=L*(.20+.17*Math.sin(p.lt*1.25+p.ph));
  const tx=sx+Math.cos(phi)*rho, ty=sy+Math.sin(phi)*rho;

  p.x+=(tx-p.x)*.10; p.y+=(ty-p.y)*.10;
  drawParticle(ctx,p,F,R,1);
 }
 ctx.globalCompositeOperation='source-over';
}

function drawParticle(g,p,F,R,gain){
 const vel=Math.hypot(p.x-p.px,p.y-p.py); p.px=p.x; p.py=p.y;
 // speed response saturates instead of clamping, so fast regions stay readable
 const vn=vel/(SS*.011), b=vn/(1+vn);
 const hue=(((F-3)/11)*250+R*38+p.seed*14+300)%360;
 let idx=Math.floor(hue/360*HUES)%HUES; if(idx<0)idx+=HUES;
 const alpha=Math.min(.92,(.40+1.25*b+p.size*.10)*gain);
 const sz=p.size*(1.5+2.0*b);
 g.globalAlpha=alpha;
 g.drawImage(sprites[idx],p.x-sz,p.y-sz,sz*2,sz*2);
 g.globalAlpha=1;
}

// law preview: hue = symmetry, brightness = tempo, dashes = spin direction
function drawLawLayer(g,w,h){
 const d=lawImg.data;
 for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
  const k=j*GW+i, F=lawF[k], S=lawS[k], R=lawR[k];
  const hue=((F-3)/11)*250, lum=.13+ (R-.3)/2.5*.26 + Math.abs(S)*.10;
  const q=hue/60, x=Math.floor(q), f=q-x, vv=lum*2;
  const pp=0, qq=vv*(1-f), tt=vv*f;
  let r,gg,bb;
  switch(x%6){case 0:r=vv;gg=tt;bb=pp;break;case 1:r=qq;gg=vv;bb=pp;break;
   case 2:r=pp;gg=vv;bb=tt;break;case 3:r=pp;gg=qq;bb=vv;break;
   case 4:r=tt;gg=pp;bb=vv;break;default:r=vv;gg=pp;bb=qq;}
  const o=k*4;
  d[o]=Math.min(255,r*255); d[o+1]=Math.min(255,gg*255); d[o+2]=Math.min(255,bb*255); d[o+3]=255;
 }
 lawCtx.putImageData(lawImg,0,0);
 g.globalAlpha=.5;
 g.imageSmoothingEnabled=true;
 g.drawImage(lawCv,0,0,w,h);
 g.globalAlpha=1;
}

function frame(now){
 const dt=Math.min((now-last)/1000,.05); last=now;
 if(exporting){requestAnimationFrame(frame);return}
 const t=(now-t0)/1000;
 acc+=dt*1000; frames++;
 if(now-check>2200){
  const avg=acc/frames;
  if(avg>32&&quality>.55){quality=.55;build();}
  else if(avg<19&&quality<1){quality=1;build();}
  acc=0;frames=0;check=now;
 }
 stepLive(dt,t);
 if(readEl.classList.contains('on'))updateRead();
 requestAnimationFrame(frame);
}

function updateRead(){
 const x=drag?drag.x:W/2, y=drag?drag.y:H/2;
 const u=x/W, v=y/H;
 readEl.innerHTML=
  'SYMMETRY '+sample(lawF,u,v).toFixed(1)+'<br>'+
  'SPIN '+sample(lawS,u,v).toFixed(2)+'<br>'+
  'TEMPO '+sample(lawR,u,v).toFixed(2)+'<br>'+
  'GRAIN '+sample(lawC,u,v).toFixed(2);
}

/* ===========================================================================
   GIF export.
   The law you painted is frozen and stays exactly as it is. Only the motion is
   re-driven from a loop phase: each region's spin is rounded to a whole number
   of turns and its tempo to a whole number of breaths, so every region — fast
   or slow — arrives back where it started at the same instant.
   =========================================================================== */
const PRESETS=[
 {name:'SMOOTH',  fps:25,   delay:40, side:400},
 {name:'BALANCED',fps:20,   delay:50, side:440},
 {name:'LIGHT',   fps:12.5, delay:80, side:460}
];
function drawLoopFrame(g,arr,P,side,fadeMul,gain){
 g.globalCompositeOperation='source-over';
 g.fillStyle=`rgba(3,3,10,${Math.min(.65,.20*fadeMul)})`;
 g.fillRect(0,0,side,side);
 if(showLaw)drawLawLayer(g,side,side);
 g.globalCompositeOperation='lighter';
 for(let i=0;i<arr.length;i++){
  const p=arr[i];
  const u=p.bx/side, v=p.by/side;
  const F=sample(lawF,u,v), S=sample(lawS,u,v), R=sample(lawR,u,v), C=sample(lawC,u,v);
  // anchor drift becomes a closed circle so it returns to where it began
  const n1=fbm(p.bx/side*1.7+Math.cos(P)*1.1, p.by/side*1.7+Math.sin(P)*1.1);
  const n2=fbm(p.bx/side*1.7+11+Math.cos(P)*1.1, p.by/side*1.7+Math.sin(P)*1.1);
  const ax=p.bx+(n1-.5)*side*.06, ay=p.by+(n2-.5)*side*.06;
  const [sx,sy,L]=siteOf(ax,ay,side,side,side,F,C);
  const turns=Math.round(S*3);                       // whole turns per loop
  const breaths=Math.max(1,Math.round(R*2));         // whole breaths per loop
  const phi=p.phi+turns*P;
  const rho=L*(.20+.17*Math.sin(breaths*P+p.ph));
  const tx=sx+Math.cos(phi)*rho, ty=sy+Math.sin(phi)*rho;
  p.x+=(tx-p.x)*.10; p.y+=(ty-p.y)*.10;
  drawParticle(g,p,F,R,gain);
 }
 g.globalCompositeOperation='source-over';
}

const GIF_JS='https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
const GIF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
let workerURL=null;
const sheet=document.getElementById('sheet'), sheetTitle=document.getElementById('sheetTitle'),
      sheetMsg=document.getElementById('sheetMsg'), barFill=document.getElementById('barFill'),
      barWrap=document.getElementById('barWrap'), sheetActions=document.getElementById('sheetActions');

function loadScript(src){return new Promise((res,rej)=>{
 const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('x'));
 document.head.appendChild(s);});}
async function prepGif(){
 if(!window.GIF)await loadScript(GIF_JS);
 if(!workerURL){
  const r=await fetch(GIF_WORKER);
  if(!r.ok)throw new Error('worker');
  workerURL=URL.createObjectURL(await r.blob());
 }
}
function sheetOn(title,msg){sheetTitle.textContent=title;sheetMsg.textContent=msg;
 sheetActions.innerHTML='';barFill.style.width='0%';sheet.classList.add('on');}
function sheetOff(){sheet.classList.remove('on');sheetActions.innerHTML='';}
function addBtn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;
 sheetActions.appendChild(b);return b;}
function askPreset(){return new Promise(res=>{
 sheetOn('EXPORT LOOP','なめらかさを選んでください');
 barWrap.style.display='none';
 PRESETS.forEach(p=>addBtn(`${p.name} · ${p.fps}fps`,()=>{barWrap.style.display='';res(p)}));
 addBtn('キャンセル',()=>{barWrap.style.display='';res(null)});
});}

async function exportGif(){
 const btn=document.getElementById('gifBtn');
 const preset=await askPreset();
 if(!preset){sheetOff();return}
 btn.disabled=true; exporting=true;
 sheetOn('RENDERING LOOP','いま塗られている法則のまま、3秒のループを描き出しています…');
 try{
  await prepGif();
  const side=Math.min(preset.side,Math.round(Math.min(innerWidth,innerHeight)*1.1));
  const FRAMES=Math.round(LOOP*preset.fps);
  const fadeMul=preset.delay/66.7, gain=preset.delay/66.7;
  const off=document.createElement('canvas'); off.width=off.height=side;
  const g=off.getContext('2d',{alpha:false});
  g.fillStyle='#03030a'; g.fillRect(0,0,side,side);
  const arr=makeParticles(Math.min(2800,pts.length),side,side);
  const gif=new GIF({workers:2,quality:12,dither:false,width:side,height:side,
   workerScript:workerURL,repeat:0});

  const PRE=FRAMES*2;                       // settle onto the periodic orbit
  for(let i=0;i<PRE;i++){
   drawLoopFrame(g,arr,(i%FRAMES)/FRAMES*TAU,side,fadeMul,gain);
   if(i%12===0){barFill.style.width=(i/PRE*22)+'%';await new Promise(r=>setTimeout(r,0));}
  }
  for(let i=0;i<FRAMES;i++){
   drawLoopFrame(g,arr,i/FRAMES*TAU,side,fadeMul,gain);
   gif.addFrame(g,{copy:true,delay:preset.delay});
   barFill.style.width=(22+i/FRAMES*28)+'%';
   await new Promise(r=>setTimeout(r,0));
  }
  sheetMsg.textContent='GIFにエンコード中…';
  const blob=await new Promise((res,rej)=>{
   gif.on('progress',pr=>{barFill.style.width=(50+pr*50)+'%'});
   gif.on('finished',b=>res(b));
   gif.on('abort',()=>rej(new Error('abort')));
   gif.render();
  });
  const url=URL.createObjectURL(blob), mb=(blob.size/1048576).toFixed(1);
  const overWeb=blob.size>15*1048576, overApp=blob.size>5*1048576;
  sheetTitle.textContent='LOOP READY';
  sheetMsg.textContent=`${side}×${side} · ${preset.fps}fps · ${FRAMES}コマ · ${mb}MB`
   +(overWeb?' — Xの上限15MB超え。LIGHTで撮り直しを'
    :overApp?' — 5MB超えなのでSafariのx.comから投稿を'
    :' — Xアプリからそのまま投稿できます');
  barFill.style.width='100%';
  const img=new Image(); img.src=url;
  sheet.insertBefore(img,sheetActions);
  sheetActions.innerHTML='';
  const a=document.createElement('a');
  a.href=url; a.download='law-field-loop.gif'; a.textContent='ダウンロード';
  sheetActions.appendChild(a);
  addBtn('閉じる',()=>{img.remove();URL.revokeObjectURL(url);sheetOff();});
 }catch(_){
  sheetTitle.textContent='EXPORT FAILED';
  sheetMsg.textContent='GIFの書き出しに失敗しました。通信環境を確認してもう一度お試しください。';
  addBtn('閉じる',sheetOff);
 }finally{ exporting=false; btn.disabled=false; last=performance.now(); }
}

// ---------- clock / fullscreen ----------
const clockEl=document.getElementById('clock'), clockTime=document.getElementById('clockTime'),
      clockDate=document.getElementById('clockDate');
let clockOn=false, wakeLock=null, toastTimer=null, idleTimer=null;
function toast(msg,ms){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('on');
 toastTimer=setTimeout(()=>toastEl.classList.remove('on'),ms||3600);}
const WEEK=['日','月','火','水','木','金','土'], pad2=n=>String(n).padStart(2,'0');
function tickClock(){
 if(!clockOn)return;
 const d=new Date();
 clockTime.innerHTML=pad2(d.getHours())+':'+pad2(d.getMinutes())+'<i>:'+pad2(d.getSeconds())+'</i>';
 clockDate.textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 ('+WEEK[d.getDay()]+')';
}
function scheduleTick(){tickClock();setTimeout(scheduleTick,1000-(Date.now()%1000)+8)}
scheduleTick();
async function requestWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(_){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='visible'&&clockOn&&!wakeLock)requestWake();});
function showCtrl(){ctrlEl.classList.remove('idle')}
function bumpIdle(){showCtrl();clearTimeout(idleTimer);
 if(clockOn)idleTimer=setTimeout(()=>ctrlEl.classList.add('idle'),4000);}
addEventListener('pointerdown',bumpIdle,{passive:true});

document.getElementById('clockBtn').onclick=function(){
 clockOn=!clockOn; clockEl.classList.toggle('on',clockOn);
 this.classList.toggle('act',clockOn);
 if(clockOn){tickClock();requestWake();}else{releaseWake();showCtrl();}
 bumpIdle();
};
document.getElementById('lawBtn').onclick=function(){
 showLaw=!showLaw; this.classList.toggle('act',showLaw);
 readEl.classList.toggle('on',showLaw);
};
document.getElementById('resetBtn').onclick=()=>{
 resetLaw(); build(); flash();
 toast('法則をまっさらに戻しました');
};
document.getElementById('gifBtn').onclick=exportGif;

const docEl=document.documentElement;
function fsElement(){return document.fullscreenElement||document.webkitFullscreenElement}
function fsSupported(){return !!(docEl.requestFullscreen||docEl.webkitRequestFullscreen)}
document.getElementById('fsBtn').onclick=async()=>{
 if(!fsSupported()){
  if(window.navigator.standalone)toast('すでにフルスクリーンで動いています');
  else toast('iPhoneのSafariは全画面表示に対応していません。共有ボタン → 「ホーム画面に追加」で開くと、フチなしの全画面で使えます',7000);
  return;
 }
 try{
  if(fsElement())(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else await (docEl.requestFullscreen||docEl.webkitRequestFullscreen).call(docEl);
 }catch(_){toast('全画面表示に切り替えられませんでした')}
};
['fullscreenchange','webkitfullscreenchange','orientationchange'].forEach(ev=>
 addEventListener(ev,()=>setTimeout(resize,120)));
addEventListener('resize',resize);
setTimeout(()=>legendEl.classList.add('hide'),9000);
resize(); requestAnimationFrame(frame);
})();
</script>
