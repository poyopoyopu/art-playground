<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>FLUX</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02070a}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,z=1;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#02070a';g.fillRect(0,0,W,H);for(let i=0;i<260;i++){let q=i*7.31,a=q+Math.sin(q*.7+p*6)*z*2,r=(i/260)*Math.min(W,H)*.48,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;g.fillStyle=`hsla(${175+i*.4},90%,65%,.45)`;g.fillRect(x,y,2,2)}}function mu(){z=.3+Math.random()*3}APKit.init({canvas:c,gifName:'flux-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>z=1}]});draw(0)</script>
