<!doctype html>
<!-- CREASE FIELD — ChatGPT作。格子そのものに「折り目」が伝播するフラット生成アート。ap-kit.js統合 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>CREASE FIELD — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*99999,creases=[],down=false,lastX=0,lastY=0,lastT=0;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=u;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=u;break;case 3:r=p;g=q;b=v;break;case 4:r=u;g=p;b=v;break;default:r=v;g=p;b=q}return[r*255,g*255,b*255]}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function creaseAt(nx,ny,now){let dx=0,dy=0,power=0,angle=0;for(const m of creases){const ox=nx-m.x,oy=ny-m.y;const along=ox*m.dx+oy*m.dy;const side=ox*m.dy-oy*m.dx;const q=(along/m.len);const s=side/m.width;const age=Math.max(0,(now-m.t)/1000);const fade=Math.exp(-age*.055);const gate=Math.exp(-(q*q*1.7+s*s*.72))*fade;const ripple=.5+.5*Math.cos(q*13-m.phase);power+=gate*(1+.7*ripple);angle+=gate*side*2.1;dx+=m.dx*gate*(.18+.82*ripple);dy+=m.dy*gate*(.18+.82*ripple);}
return[dx,dy,power,angle]}
function tile(cx,cy,size,kind,rot){g.save();g.translate(cx,cy);g.rotate(rot);const a=size*.48,b=size*.48;g.beginPath();if(kind===0){g.rect(-a,-b,a*2,b*2)}else if(kind===1){g.moveTo(0,-b);g.lineTo(a,b);g.lineTo(-a,b);g.closePath()}else if(kind===2){g.moveTo(0,-b);g.lineTo(a,0);g.lineTo(0,b);g.lineTo(-a,0);g.closePath()}else if(kind===3){g.moveTo(-a,-b);g.lineTo(0,-b);g.lineTo(0,0);g.lineTo(a,0);g.lineTo(a,b);g.lineTo(-a,b);g.closePath()}else{g.moveTo(-a,-b);g.lineTo(a,-b);g.lineTo(a*.35,0);g.lineTo(a,b);g.lineTo(-a,b);g.lineTo(-a*.35,0);g.closePath()}g.fill();g.restore()}
function scene(now){g.fillStyle='#000';g.fillRect(0,0,W,H);const gap=Math.max(10,Math.min(15,W/58)),cols=Math.ceil(W/gap)+2,rows=Math.ceil(H/gap)+2;for(let iy=-1;iy<rows;iy++)for(let ix=-1;ix<cols;ix++){const x=(ix+.5)*gap,y=(iy+.5)*gap,nx=x/W*2-1,ny=1-y/H*2;const z=creaseAt(nx,ny,now),p=Math.min(1,z[2]);const drift=z[0]*gap*2.8,driftY=-z[1]*gap*2.8;const wave=Math.sin((nx*2.7+ny*1.9+seed*.0002))*22;const hue=seed*.013+ix*.41-iy*.29+wave+p*170+Math.sin(z[3]*5)*35;const col=hsv(hue,1,.92);g.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;const phase=(ix*17+iy*31+Math.floor(seed))%5;const kind=p<.18?0:(p<.38?((phase&1)+1):p<.68?((phase%3)+2):((phase%2)+3));const rot=p*(z[3]*.55+(phase-2)*.08);const xx=x+drift,yy=y+driftY;tile(xx,yy,gap*.76,kind,rot)}}
function addCrease(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;let len=tap?.72:.48,width=tap?.16:.11;let dx=vx,dy=-vy;const n=Math.hypot(dx,dy);if(n<.01){const a=Math.random()*TAU;dx=Math.cos(a);dy=Math.sin(a)}else{dx/=n;dy/=n}creases.push({x:x/W*2-1,y:1-y/H*2,dx,dy,len,width,phase:Math.random()*TAU,t:performance.now()});if(creases.length>28)creases.shift();return false}
function handleDown(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e);lastX=p.x;lastY=p.y;lastT=performance.now();down=true;c.setPointerCapture?.(e.pointerId);addCrease(p.x,p.y,0,0,true);scene(performance.now())}
function handleMove(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e),now=performance.now(),dt=Math.max(16,now-lastT);if(now-lastT<45)return;addCrease(p.x,p.y,(p.x-lastX)/dt,(p.y-lastY)/dt,false);lastX=p.x;lastY=p.y;lastT=now}
function handleUp(){down=false}
c.addEventListener('pointerdown',handleDown,{passive:false});c.addEventListener('pointermove',handleMove,{passive:false});c.addEventListener('pointerup',handleUp);c.addEventListener('pointercancel',handleUp);
let start=performance.now();function loop(now){if(!APKit.isExporting())scene(now);requestAnimationFrame(loop)}
APKit.init({canvas:c,gifName:'crease-field-loop',clockFormat:'spec',loopFrame:p=>scene(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;creases=[];scene(performance.now())}},{label:'↻',name:'reset',onClick:()=>{creases=[];scene(performance.now())}}]});requestAnimationFrame(loop);
</script></body></html>
