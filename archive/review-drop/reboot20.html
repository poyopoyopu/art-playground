<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>REBOOT20</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}#bar{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;gap:6px;padding:8px;overflow-x:auto;background:rgba(0,0,0,.86);scrollbar-width:none}#bar::-webkit-scrollbar{display:none}button{flex:0 0 auto;min-width:96px;height:44px;border:1px solid #444;border-radius:7px;background:#111;color:#ddd}button.on{background:#fff;color:#000}iframe{position:absolute;left:0;right:0;bottom:0;top:60px;width:100%;height:calc(100% - 60px);border:0}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['01','PRESS'],['02','BREATH'],['03','SHEAR'],['04','GRAVITY'],['05','DRIFT'],['06','FOLD'],['07','TRACE'],['08','MIRROR'],['09','SPLIT'],['10','FIELD'],['11','THREAD'],['12','GRAIN'],['13','RING'],['14','SCAR'],['15','TIDE'],['16','ORBIT'],['17','VOID'],['18','GATE'],['19','SWARM'],['20','FAULT']],bar=document.getElementById('bar'),stage=document.getElementById('stage');function go(i){stage.src='reboot'+A[i][0].toLowerCase()+'-'+A[i][1].toLowerCase()+'.html';[...bar.children].forEach((b,j)=>b.classList.toggle('on',j===i));bar.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}A.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a[0]+' '+a[1];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{let i=A.findIndex(a=>stage.src.includes(a[1].toLowerCase()));if(e.key==='ArrowRight')go((i+1)%20);if(e.key==='ArrowLeft')go((i+19)%20)});</script></body></html>
