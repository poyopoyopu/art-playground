<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>AFTERIMAGE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,shift=20;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#fff';g.fillRect(0,0,W,H);for(let i=0;i<90;i++){let x=i*W/90,y=H*.5+Math.sin(i*.24+p*6)*H*.3;g.beginPath();g.arc(x+Math.sin(p*6+i)*shift,y,3,0,7);g.fillStyle=`hsla(${200+i*2},70%,45%,.5)`;g.fill()}}function mu(){shift=Math.random()*100}APKit.init({canvas:c,gifName:'afterimage-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>shift=20}]});draw(0)</script>
