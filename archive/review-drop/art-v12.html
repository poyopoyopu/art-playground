<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground v12 — iPhone 17 Stress Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#02040a;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#02040a}
#edit{position:fixed;top:max(18px,env(safe-area-inset-top));right:18px;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff14;background:#07101ddd;color:#dce7f7;font-size:20px;z-index:5;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tip{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#aab7cb;background:#08111dcc;padding:9px 14px;border-radius:999px;font-size:11px;letter-spacing:.08em;pointer-events:none;opacity:.55;transition:opacity 1s;z-index:4}.tip.hide{opacity:0}
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:10;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:#101827f7;border-top:1px solid #ffffff16;border-radius:28px 28px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
body.open #panel{transform:translateY(0)}body.open #shade{opacity:1;pointer-events:auto}
.handle{width:42px;height:4px;border-radius:9px;background:#ffffff33;margin:0 auto 16px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.head b{font-size:27px;letter-spacing:.01em}.close{border:0;border-radius:999px;padding:10px 16px;background:#ffffff0d;color:#dbe5f3;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mode{min-height:58px;border-radius:17px;border:1px solid #ffffff0d;background:#1a2638;color:#dbe5f3;font-weight:800;letter-spacing:.08em}.mode.active{background:#7186b9;color:#fff;border-color:#a9c0ff66}
.random{width:100%;margin-top:12px;min-height:62px;border:1px solid #ffffff12;border-radius:18px;background:linear-gradient(135deg,#29364c,#142034);color:#eef5ff;font-size:18px;font-weight:800;letter-spacing:.16em}.note{margin:11px 4px 0;color:#8c99ac;font-size:11px;line-height:1.6}
</style></head>
<body><canvas id="c"></canvas><button id="edit" aria-label="編集">⚙︎</button><div id="shade"></div>
<div class="tip">触ると、模様が歪んで光が弾ける</div>
<section id="panel"><div class="handle"></div><div class="head"><b>Art Playground</b><button class="close" id="close">閉じる</button></div><div class="grid" id="grid"></div><button class="random" id="random">↻ RANDOM</button><div class="note">スライダーは廃止。選んだ世界観のまま、RANDOMで色・密度・動き・形を毎回変える。</div></section>
<script>
const c=document.querySelector("#c"),x=c.getContext("2d",{alpha:false}),$=q=>document.querySelector(q);
let W=1,H=1,dpr=1,t=0,last=0,mode="field",seed=Math.random()*9999;
const modes=["field","coral","shard","pulse","kaleido","void"];
const names={field:"FIELD",coral:"CORAL",shard:"SHARD",pulse:"PULSE",kaleido:"KALEIDO",void:"VOID"};
let P={},target={},touches=[],glitters=[],drag=false,tipTimer=0,phase=0;
function rnd(a,b){return a+Math.random()*(b-a)}
function choose(first=false){target={h:rnd(0,360),density:rnd(.72,1.35),speed:rnd(.35,1.45),warp:rnd(.35,1.25),shape:Math.floor(rnd(0,6)),energy:rnd(.35,1.25),twist:rnd(.2,1.4),scale:rnd(.65,1.35)};if(first)P={...target};seed=Math.random()*9999}
choose(true);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);x.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function hue(a){return ((a%360)+360)%360}function hs(h,a=.5,l=60){return "hsla("+hue(h)+",92%,"+l+"%,"+a+")"}
function morph(dt){for(const k in target){if(k==="shape")continue;P[k]+=(target[k]-P[k])*Math.min(1,dt*.09)}}
function randomize(){choose(false);phase++;document.querySelector(".tip").classList.add("hide");sync()}
function force(x0,y0){let dx=0,dy=0;for(const p of touches){let ax=x0-p.x,ay=y0-p.y,d=Math.hypot(ax,ay);if(d<p.r&&d>1){let q=(1-d/p.r)*p.a,ang=Math.atan2(ay,ax);dx+=Math.cos(ang)*q*42*P.warp;dy+=Math.sin(ang)*q*42*P.warp}}return{x:x0+dx,y:y0+dy}}
function touch(px,py,strong=false){touches.push({x:px,y:py,r:Math.min(W,H)*(strong?.22:.16),a:strong?1:.62});if(touches.length>8)touches.shift();burst(px,py,strong?36:8)}
function burst(px,py,count){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,sp=rnd(.5,3.4),life=rnd(.35,1.05);glitters.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,age:0,size:rnd(.25,1.25),h:P.h+rnd(-25,150),rot:rnd(0,6.28),spin:rnd(-8,8),phase:rnd(0,6.28)})}if(glitters.length>220)glitters.splice(0,glitters.length-220)}
function poly(cx,cy,r,n,rot,irreg){x.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n,rr=r*(.72+Math.sin(i*2.17+seed+phase)*irreg);let px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function field(){
 let step=Math.max(13,Math.min(29,Math.min(W,H)/(7+13*P.density))), kind=target.shape%6;
 x.save();x.globalCompositeOperation="screen";
 for(let gy=step*.45;gy<H;gy+=step)for(let gx=step*.45;gx<W;gx+=step){
  let xx=gx,yy=gy,f=0,ang=0;
  for(let j=0;j<3;j++){let cx=W*(.5+.33*Math.sin(t*(.13+j*.025)+seed*j*.17+j*2)),cy=H*(.5+.30*Math.cos(t*(.15+j*.022)+seed*.11+j*1.7));let dx=gx-cx,dy=gy-cy,d=Math.max(6,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);f+=Math.sin(d*.055-t*(1.1+P.speed*.8)+Math.sin(a*3+t*.2)*1.8)/(1+j*.35);ang+=a/(1+j)}
  let z=force(gx+Math.cos(ang)*Math.sin(f)*step*.25,gy+Math.sin(ang)*Math.cos(f)*step*.25),q=.5+.5*Math.sin(f*1.65+t*.35),r=step*(.07+.44*q)*P.scale,h=P.h+150*q+35*Math.sin(f);
  x.save();x.translate(z.x,z.y);x.rotate(ang+t*.05);x.strokeStyle=hs(h,.15+.55*q,48+25*q);x.lineWidth=.75+1.6*q;
  if(kind===0)x.arc(0,0,r,0,6.283);
  else if(kind===1)poly(0,0,r,6,t*.25+f,.28);
  else if(kind===2){poly(0,0,r,5,t*.1+f,.55)}
  else if(kind===3){poly(0,0,r,4,t*.15+f,.42)}
  else if(kind===4){x.moveTo(-r,0);x.bezierCurveTo(-r*.3,-r,r*.8,-r*.65,r,0);x.bezierCurveTo(r*.25,r*.95,-r*.7,r*.6,-r,0)}
  else {poly(0,0,r,8,t*.12+f,.62)}
  x.stroke();x.restore();
 }x.restore();
}
function coral(){
 const N=Math.floor(70+120*P.density),cx=W/2,cy=H/2,R=Math.min(W,H)*.48;x.save();x.globalCompositeOperation="screen";x.lineCap="round";
 for(let i=0;i<N;i++){let a=i*2.399963+t*.04,r=Math.sqrt(i/N)*R,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;let len=(9+34*(1-r/R))*P.scale,turn=Math.sin(t*.8+i*.73)*P.twist;let z=force(px,py);x.strokeStyle=hs(P.h+i*2.7,.12+.32*(1-r/R),55+25*Math.sin(i));x.lineWidth=.5+2.1*(1-r/R);x.beginPath();x.moveTo(z.x,z.y);for(let k=1;k<5;k++){let q=k/4,aa=a+turn*q+Math.sin(i+k+t)*.25,rr=len*q;let zz=force(px+Math.cos(aa)*rr,py+Math.sin(aa)*rr);x.lineTo(zz.x,zz.y)}x.stroke();
 if(i%3===0){let zz=force(px,py);x.fillStyle=hs(P.h+i*3,.16,68);x.beginPath();x.arc(zz.x,zz.y,1.2+3*(1-r/R),0,6.283);x.fill()}
 }x.restore();
}
function shard(){
 const N=Math.floor(130+220*P.density),R=Math.min(W,H)*.75;x.save();x.globalCompositeOperation="screen";
 for(let i=0;i<N;i++){let a=i*2.399+Math.sin(t*.11+i)*.3,r=Math.sqrt((i+.5)/N)*R,cx=W/2+Math.cos(a)*r,cy=H/2+Math.sin(a*1.7+t*.07)*r*.72,z=force(cx,cy),sz=(3+18*(1-r/R))*P.scale;
 x.save();x.translate(z.x,z.y);x.rotate(a+t*.09);x.strokeStyle=hs(P.h+i*1.8,.10+.38*(1-r/R),55+20*Math.sin(i));x.lineWidth=.7;poly(0,0,sz,3+(i%4),t*.04+i,.42);x.stroke();if(i%5===0){x.fillStyle=hs(P.h+i*2.3,.05,70);x.fill()}x.restore()
 }x.restore();
}
function pulse(){
 const step=Math.max(18,Math.min(42,Math.min(W,H)/(4+9*P.density)));x.save();x.globalCompositeOperation="screen";
 for(let gy=0;gy<H+step;gy+=step)for(let gx=0;gx<W+step;gx+=step){let xx=gx,yy=gy,v=0;for(let j=0;j<4;j++){let cx=W*(.5+.34*Math.sin(t*(.09+j*.03)+j*2+seed*.1)),cy=H*(.5+.32*Math.cos(t*(.1+j*.02)+j+seed*.07));let d=Math.hypot(gx-cx,gy-cy);v+=Math.sin(d*.035-t*(1.4+P.speed)+j*1.8)}let q=.5+.5*Math.sin(v*1.7),z=force(xx,yy),r=step*(.08+.6*q)*P.scale,h=P.h+q*180;
 x.save();x.translate(z.x,z.y);x.rotate(v*.3+t*.08);x.strokeStyle=hs(h,.15+.5*q,48+28*q);x.lineWidth=.8+1.8*q;
 if(target.shape%2)poly(0,0,r,7,t*.2+v,.58);else {x.beginPath();for(let k=0;k<7;k++){let a=k*6.283/7,rr=r*(.55+.45*Math.sin(v+k*2+t));let px=Math.cos(a)*rr,py=Math.sin(a)*rr;k?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}x.stroke();x.restore()}
 x.restore();
}
function kaleido(){
 const cx=W/2,cy=H/2,N=Math.floor(240+360*P.density),S=8+(target.shape%5);x.save();x.globalCompositeOperation="screen";
 for(let i=0;i<N;i++){let q=i/N,a=(i*2.399+t*.08)%(Math.PI*2/S),r=Math.sqrt(q)*Math.min(W,H)*.74,base=Math.sin(t*.55+i*.17),len=(3+18*(1-q))*P.scale;
 for(let m=0;m<S;m++){let aa=a+m*2*Math.PI/S+(m%2?-.0:0),px=cx+Math.cos(aa)*r,py=cy+Math.sin(aa)*r,z=force(px,py);x.save();x.translate(z.x,z.y);x.rotate(aa+base);x.strokeStyle=hs(P.h+i*1.1+m*14,.10+.38*(1-q),55+25*q);x.lineWidth=.65+1.4*(1-q);poly(0,0,len,3+(i%5),base,.5);x.stroke();x.restore()}
 }x.restore();
}
function voidMode(){
 const N=Math.floor(240+460*P.density),cx=W/2,cy=H/2;x.save();x.globalCompositeOperation="screen";
 for(let i=0;i<N;i++){let a=i*2.399+Math.sin(t*.13+i)*.5,r=(.12+.88*Math.sqrt(i/N))*Math.min(W,H)*.72;let px=cx+Math.cos(a+t*.03)*r,py=cy+Math.sin(a*1.3-t*.04)*r*.74,z=force(px,py),q=.5+.5*Math.sin(t*1.2+i*1.73+r*.025),sz=(.5+7*q*(1-r/(Math.min(W,H)*.72)))*P.scale;x.fillStyle=hs(P.h+i*2.1,.05+.5*q,55+25*q);x.beginPath();x.arc(z.x,z.y,sz,0,6.283);x.fill()}x.restore();
}
function draw(){x.fillStyle="#02040a";x.fillRect(0,0,W,H);if(mode==="field")field();else if(mode==="coral")coral();else if(mode==="shard")shard();else if(mode==="pulse")pulse();else if(mode==="kaleido")kaleido();else voidMode()}
function glitter(dt){x.save();x.globalCompositeOperation="screen";for(let i=glitters.length-1;i>=0;i--){let g=glitters[i];g.age+=dt;if(g.age>g.life){glitters.splice(i,1);continue}let q=1-g.age/g.life,tw=.55+.45*Math.sin(t*13+g.phase),s=g.size*(.7+tw*.9),a=Math.pow(q,.55)*(.5+.5*tw);g.x+=g.vx;g.y+=g.vy;g.vx*=.975;g.vy=g.vy*.975+.008;g.rot+=g.spin*dt;x.save();x.translate(g.x,g.y);x.rotate(g.rot);x.strokeStyle=hs(g.h,a,92);x.lineWidth=.35+tw*.35;let arm=s*(1.1+tw*1.8);x.beginPath();x.moveTo(-arm,0);x.lineTo(arm,0);x.moveTo(0,-arm);x.lineTo(0,arm);if(tw>.78){x.moveTo(-arm*.6,-arm*.6);x.lineTo(arm*.6,arm*.6);x.moveTo(arm*.6,-arm*.6);x.lineTo(-arm*.6,arm*.6)}x.stroke();x.restore()}x.restore()}
function frame(ms){if(!last)last=ms;let dt=Math.min(.05,(ms-last)/1000);last=ms;morph(dt);t+=dt*(.45+P.speed*.7);if(ms>tipTimer+7000){choose(false);tipTimer=ms}draw();glitter(dt);touches.forEach(p=>{p.a*=.982;p.r+=1.3});touches=touches.filter(p=>p.a>.035);requestAnimationFrame(frame)}requestAnimationFrame(frame);
c.addEventListener("pointerdown",e=>{drag=true;c.setPointerCapture?.(e.pointerId);let r=c.getBoundingClientRect();touch(e.clientX-r.left,e.clientY-r.top,true);$(".tip").classList.add("hide")});
c.addEventListener("pointermove",e=>{if(!drag)return;let r=c.getBoundingClientRect();touch(e.clientX-r.left,e.clientY-r.top,false)});
c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
const grid=$("#grid");for(const m of modes){let b=document.createElement("button");b.className="mode";b.textContent=names[m];b.dataset.m=m;b.onclick=()=>{mode=m;seed=Math.random()*9999;choose(false);sync()};grid.appendChild(b)}
function sync(){[...grid.children].forEach(b=>b.classList.toggle("active",b.dataset.m===mode))}
$("#edit").onclick=()=>{document.body.classList.add("open");sync()};$("#close").onclick=()=>document.body.classList.remove("open");$("#shade").onclick=()=>document.body.classList.remove("open");$("#random").onclick=randomize;sync();tipTimer=performance.now();setTimeout(()=>$(".tip").classList.add("hide"),4200);
</script></body></html>
