<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>DISSOLVE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,amp=.3;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#111';g.fillRect(0,0,W,H);for(let i=0;i<120;i++){let x=i*W/120,y=H/2+Math.sin(i*.18+p*6)*H*.28*amp/0.3;g.beginPath();for(let j=0;j<20;j++){let xx=x+j*7,yy=y+Math.sin(j*.8+i+p*6)*30*amp;g.lineTo(xx,yy)}g.strokeStyle=`hsla(${40+i*2},70%,65%,.3)`;g.stroke()}}function mu(){amp=.05+Math.random()*1}APKit.init({canvas:c,gifName:'dissolve-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>amp=.3}]});draw(0)</script>
