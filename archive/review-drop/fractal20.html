nt=a[0]+' '+a[1];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{const i=A.findIndex(a=>stage.src.endsWith(a[2]));if(e.key==='ArrowRight')go((i+1)%20);if(e.key==='ArrowLeft')go((i+19)%20)});</script></body></html>
