<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Last Geometry"><title>THE LAST GEOMETRY — ART PLAYGROUND</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.clock{position:fixed;top:calc(env(safe-area-inset-top) + 22px);left:50%;transform:translateX(-50%);text-align:center;color:white;pointer-events:none;text-shadow:0 2px 12px #000,0 0 4px #000;letter-spacing:.16em}.time{font-size:clamp(26px,7vw,52px);letter-spacing:.08em}.date{font-size:11px;margin-top:8px;opacity:.9}.ui{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);display:flex;gap:12px;align-items:center;transition:opacity .7s,transform .7s;z-index:5}.ui.hide{opacity:0;transform:translate(-50%,12px);pointer-events:none}.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 116px);transform:translateX(-50%);font-size:10px;letter-spacing:.38em;color:#fff8;white-space:nowrap;text-shadow:0 1px 8px #000;transition:opacity .7s}.ui.hide+.hint{opacity:0}.btn{width:62px;height:62px;border-radius:50%;border:1px solid #fff4;background:#07070bd9;color:white;font-size:21px;box-shadow:0 4px 24px #0008;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.btn:active{transform:scale(.94)}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:#08080dcc;border:1px solid #fff3;padding:14px 18px;border-radius:14px;font-size:11px;letter-spacing:.16em;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}.toast.show{opacity:1}@media(max-width:600px){.btn{width:58px;height:58px}.hint{bottom:calc(env(safe-area-inset-bottom) + 108px)}}</style></head><body><canvas id="c"></canvas><div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div><div class="ui" id="ui"><button class="btn" id="rnd" aria-label="Random">✦</button><button class="btn" id="gif" aria-label="GIF">◎</button><button class="btn" id="clk" aria-label="Clock">◷</button></div><div class="hint">TOUCH THE WORLD · CHANGE ITS LAW</div><div class="toast" id="toast"></div><script src="ap-kit.js"></script>
<script>const canvas=document.getElementById('c'),gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});if(!gl){document.body.innerHTML='<div style="color:white;padding:30px">WebGL2 is required.</div>';throw Error('WebGL2');}const title='THE LAST GEOMETRY';const src='#version 300 es\nprecision highp float;\nout vec4 o;\nuniform vec2 R; uniform float phase; uniform float seed; uniform vec4 laws[10];\n#define PI 3.14159265359\nfloat hash21(vec2 q){q=fract(q*vec2(123.34,345.45));q+=dot(q,q+34.345);return fract(q.x*q.y);}\nfloat n2(vec2 q){vec2 i=floor(q),f=fract(q);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}\nfloat law(vec2 q){float v=0.;for(int i=0;i<10;i++){vec4 L=laws[i];float a=step(.5,L.z);float d=length(q-L.xy);v+=a*exp(-d*d/(.002+L.w*L.w*.12))*(.5+.5*sin(6.2831*(phase*float(i+1)+L.z)));}return v;}\nvoid main(){vec2 p=gl_FragCoord.xy;vec2 q=(p-.5*R)/min(R.x,R.y);float t=phase*2.*PI;vec2 z=q;float accum=0.;for(int i=0;i<9;i++){float k=float(i)+1.;float ang=atan(z.y,z.x)+sin(t*k*.37)*.16;float rr=length(z);float target=.08+.07*mod(k,4.);accum+=abs(rr-target);z=vec2(cos(ang),sin(ang))*rr;z+=.08*vec2(sin(z.y*17.+t*k),cos(z.x*19.-t*k));}float L=law(q);float lattice=sin(accum*115.-t*4.+L*8.);float cuts=pow(abs(cos(atan(q.y,q.x)*13.+length(q)*25.+t*2.)),16.);float core=exp(-18.*length(q));vec3 c=mix(vec3(.015,.012,.02),vec3(.62,.25,.08),smoothstep(.1,.8,lattice));c+=vec3(.12,.48,.8)*cuts;c+=vec3(1.,.55,.12)*core*.8;c+=vec3(.5,.15,.65)*L*.55;o=vec4(c,1.);}';function sh(type,s){let x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0,1);}'));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,src));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const R=gl.getUniformLocation(prog,'R'),PH=gl.getUniformLocation(prog,'phase'),SE=gl.getUniformLocation(prog,'seed'),LA=gl.getUniformLocation(prog,'laws');let seed=Math.random()*1000,laws=[];function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();function render(ph){gl.uniform2f(R,canvas.width,canvas.height);gl.uniform1f(PH,ph);gl.uniform1f(SE,seed);let a=new Float32Array(40);laws.forEach((L,i)=>{if(i<10)a.set(L,i*4)});gl.uniform4fv(LA,a);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}let start=performance.now(),period=7000;function frame(now){if(!APKit.isExporting())render(((now-start)%period)/period);requestAnimationFrame(frame)}requestAnimationFrame(frame);const ui=document.getElementById('ui'),clock=document.getElementById('clock'),toast=document.getElementById('toast');let hideTimer;function showUI(){ui.classList.remove('hide');document.querySelector('.hint').style.opacity='1';clearTimeout(hideTimer);hideTimer=setTimeout(()=>ui.classList.add('hide'),3500)}addEventListener('pointerdown',e=>{if(e.target.closest('.ui')||e.target.closest('.apk-ctrl')){showUI();return}const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;laws.push([x,y,.5,.08]);if(laws.length>10)laws.shift();showUI()},{passive:true});function msg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}document.getElementById('rnd').onclick=e=>{e.stopPropagation();seed=Math.random()*9999;laws=[];msg('NEW UNIVERSE');showUI()};document.getElementById('clk').onclick=e=>{e.stopPropagation();clock.style.display=clock.style.display==='none'?'block':'none';showUI()};document.getElementById('gif').style.display='none';function tick(){let d=new Date(),z=n=>String(n).padStart(2,'0'),days=['SUN','MON','TUE','WED','THU','FRI','SAT'];document.getElementById('time').textContent=`${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;document.getElementById('date').textContent=`${d.getFullYear()} ${z(d.getMonth()+1)} ${z(d.getDate())} ${days[d.getDay()]}`}function tickLoop(){tick();setTimeout(tickLoop,1000-(Date.now()%1000)+8)}tickLoop();showUI();
/* The GIF button, clock and fullscreen come from the shared kit, and the loop
   is exact: this piece is already a pure function of a 0..1 phase, so a whole
   turn of that phase is a perfect loop with nothing to quantise. */
APKit.init({canvas:canvas,gifName:'last-geometry-loop',preroll:false,loopFrame:(ph)=>render(ph/(Math.PI*2))});
</script></body></html>
