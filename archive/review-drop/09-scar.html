<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SCAR</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}body{touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,scars=[],t=0;
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function draw(){t+=.01;x.fillStyle="#050505";x.fillRect(0,0,W,H);let S=Math.min(W,H);
for(let k=0;k<180;k++){let y=k/179*H; x.beginPath();for(let i=0;i<=120;i++){let xx=i/120*W,yy=y;
for(const s of scars){let dx=xx-s.x,dy=yy-s.y,r=Math.hypot(dx,dy);if(r<s.r){let q=1-r/s.r,ang=Math.atan2(dy,dx)+q*q*s.twist;let rr=r*(1-q*.55);xx=s.x+Math.cos(ang)*rr;yy=s.y+Math.sin(ang)*rr}}
xx+=Math.sin(y*.018+t+i*.035)*2.2;x.lineTo(xx,yy)}x.strokeStyle=`hsla(${190+k*.45},45%,${35+(k%9)*4}%,.16)`;x.lineWidth=.55;x.stroke()}
for(const s of scars){s.r+=.035;s.twist*=.9995;s.life-=.12}scars=scars.filter(s=>s.life>0);requestAnimationFrame(draw)}
function cut(px,py){scars.unshift({x:px,y:py,r:20,twist:(Math.random()>.5?1:-1)*3,life:700});scars=scars.slice(0,6)}
c.addEventListener("pointerdown",e=>cut(e.clientX,e.clientY));draw();
</script></body></html>
