<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ECHO</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style><body><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,pts=[],h=200;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function frame(p){g.fillStyle='#000';g.fillRect(0,0,W,H);let cx=W/2,cy=H/2;for(let k=0;k<pts.length;k++){let q=pts[k],r=((p*800-q.t)%900+900)%900;g.beginPath();g.arc(q.x,q.y,r,0,7);g.strokeStyle=`hsla(${h+k*8},80%,65%,${Math.max(0,1-r/900)*.5})`;g.lineWidth=2;g.stroke()}g.fillStyle='#fff';for(let q of pts){g.beginPath();g.arc(q.x,q.y,2,0,7);g.fill()}}c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;pts.unshift({x:e.clientX,y:e.clientY,t:performance.now()/6});pts=pts.slice(0,12)});function mutate(){h=Math.random()*360;pts=[]}APKit.init({canvas:c,gifName:'echo-loop',clockFormat:'spec',loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:()=>pts=[]}]});frame(0)</script>
