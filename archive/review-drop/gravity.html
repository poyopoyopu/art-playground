<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>GRAVITY</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#040404}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,G=.8;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#040404';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let i=0;i<180;i++){let x=(i*73)%W,y=(i*131)%H,t=p*6+i*.04;let yy=(y+t*t*G*80)%H;g.beginPath();g.arc(x,yy,1+(i%4),0,7);g.fillStyle=`hsla(${200+i%100},80%,70%,.5)`;g.fill()}}function mu(){G=.2+Math.random()*2}APKit.init({canvas:c,gifName:'gravity-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>G=.8}]});draw(0)</script>
