<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>BLACKHOLE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,h=0;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#000';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let i=0;i<300;i++){let r=S*(.02+i/300*.55),a=i*.37+p*6,warp=Math.sin(a*3+p*6)*h*.5;let x=cx+Math.cos(a)*r+warp,y=cy+Math.sin(a)*r;g.fillStyle=`hsla(${h*360+i},80%,65%,.45)`;g.fillRect(x,y,2,2)}}function mu(){h=Math.random()}APKit.init({canvas:c,gifName:'blackhole-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>h=0}]});draw(0)</script>
