<!doctype html>
<!-- MICRO SPLIT — ChatGPT作。極小セルが局所的な分裂規則を持つ高密度構造。ap-kit.js統合 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MICRO SPLIT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W,H,D,seed=Math.random()*99,marks=[],down=false,last;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=((h%360)+360)%360/60;let i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s),r,b,d;switch(i%6){case 0:r=v;b=u;d=p;break;case 1:r=q;b=v;d=p;break;case 2:r=p;b=v;d=u;break;case 3:r=p;b=q;d=v;break;case 4:r=u;b=p;d=v;break;default:r=v;b=p;d=q}return`rgb(${r*255|0},${b*255|0},${d*255|0})`}
function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function effect(x,y,t){let X=x/W*2-1,Y=1-y/H*2,rot=0,power=0;for(let m of marks){let dx=X-m.x,dy=Y-m.y,d=Math.hypot(dx,dy),a=Math.exp(-d*d/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.2);if(a<.002)continue;rot+=m.rq*a;power+=a*m.p;let ca=Math.cos(rot*a),sa=Math.sin(rot*a);X+=(dx*ca-dy*sa-dx)*a*.8;Y+=(dx*sa+dy*ca-dy)*a*.8}return[X,Y,rot,power]}
function diamond(x,y,s,r){g.save();g.translate(x,y);g.rotate(r);g.beginPath();g.moveTo(0,-s);g.lineTo(s*.62,0);g.lineTo(0,s);g.lineTo(-s*.62,0);g.closePath();g.fill();g.restore()}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let step=Math.max(5,Math.min(8,Math.min(W,H)/92));let cols=Math.ceil(W/step)+2,rows=Math.ceil(H/step)+2;for(let j=-1;j<rows;j++)for(let i=-1;i<cols;i++){let x=(i+.5)*step,y=(j+.5)*step,e=effect(x,y,t),phase=i*.17+j*.29+seed*.7;let branch=(Math.sin(phase)+Math.sin(phase*2.31)+Math.sin(phase*.43))*.33;let r=branch+e[2]*.8;let s=step*(.54+.18*(.5+.5*Math.sin(phase*3.7+e[3]*2)));let hue=phase*57+e[3]*210+Math.sin(i*.043+j*.061)*85;g.fillStyle=hsv(hue,1,.95);diamond(x+e[0]*step*2,y-e[1]*step*2,s,r);if(Math.sin(phase*5.2+e[3]*4)>.82){g.fillStyle=hsv(hue+110,1,.9);diamond(x+e[0]*step*2.35,y-e[1]*step*2.35,s*.43,r-.7)}}}
function touch(x,y,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.27:.16,rq:(Math.random()-.5)*5,p:tap?1.7:1.05,t:performance.now()});if(marks.length>26)marks.shift();draw(performance.now());return false}
function down(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let q=p(e);downing=true;last=q;c.setPointerCapture?.(e.pointerId);touch(q.x,q.y,true)}let downing=false;function move(e){if(!downing)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let q=p(e);if(Math.hypot(q.x-last.x,q.y-last.y)>9){touch(q.x,q.y,false);last=q}}function up(){downing=false}c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);let start=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-split-loop',clockFormat:'spec',loopFrame:q=>draw(start+q*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
