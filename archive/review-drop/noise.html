<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>NOISE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,scale=35;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){let im=g.createImageData(W,H),q=im.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=128+127*Math.sin(x/scale+y/scale*1.7+p*6+Math.sin(y*.03+p*6)*2),i=(y*W+x)*4;q[i]=v;q[i+1]=v*.8;q[i+2]=v*.95;q[i+3]=255}g.putImageData(im,0,0)}function mu(){scale=8+Math.random()*80}APKit.init({canvas:c,gifName:'noise-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>scale=35}]});draw(0)</script>
