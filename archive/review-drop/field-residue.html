<!doctype html>
<!-- FIELD RESIDUE — ChatGPT作。四角い粒が多層の流れを読み、通過した場所に残像を残す。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020207"><title>FIELD RESIDUE — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
let W=1,H=1,D=1,seed=Math.random()*10000;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.max(1,Math.floor(W*D));canvas.height=Math.max(1,Math.floor(H*D));ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const N=820;
const particles=Array.from({length:N},(_,i)=>({x:Math.sin(i*91.7)*.82,y:Math.cos(i*47.3)*.82,s:1.7+(i%6)*.55,h:(i*137.3)%360,seed:i*0.173}));
let marks=[];

function hash(x){return Math.sin(x*127.1+seed*.731)*43758.5453%1}
function field(x,y,t){
  // A nested curl field: the same law is sampled at four scales.
  let vx=0,vy=0,px=x,py=y;
  for(let k=0;k<4;k++){
    const s=1.05+k*.78;
    const a=Math.sin(py*s*3.0 + Math.cos(px*s*1.7+t*.31+k))*1.55
           +Math.cos(px*s*2.35-py*s*1.15-t*.23-k*.7);
    const w=.72/(k+1);
    vx+=Math.cos(a+px*1.8)*w;
    vy+=Math.sin(a+py*1.5)*w;
    const c=Math.cos(.38+k*.43),q=Math.sin(.38+k*.43);
    const nx=(px*c-py*q)*.61,ny=(px*q+py*c)*.61;px=nx;py=ny;
  }
  // Touch does not paint circles; it bends the underlying field.
  for(let i=0;i<marks.length;i++){
    const m=marks[i],dx=x-m.x,dy=y-m.y,r2=dx*dx+dy*dy+.012;
    const g=Math.exp(-r2/(m.r*m.r));
    vx+=(-dy/r2)*g*m.p*.13 + dx*g*m.p*.035;
    vy+=( dx/r2)*g*m.p*.13 + dy*g*m.p*.035;
  }
  const l=Math.hypot(vx,vy)||1;return [vx/l,vy/l];
}
function wrap(v){return v>1.08?v-2.16:v<-1.08?v+2.16:v}

function particlePos(p,phase,echo){
  let x=p.x,y=p.y;
  // Six integration levels make motion itself hierarchical, not just texture detail.
  const base=phase*6.2831853-echo*.16;
  for(let j=0;j<7;j++){
    const f=field(x,y,base+j*.19+p.seed);
    const step=.0105/(1+j*.055);
    x=wrap(x+f[0]*step);y=wrap(y+f[1]*step);
    const a=.018*Math.sin(base*.55+j*.41+p.seed*3.0)/(j+1);
    const c=Math.cos(a),s=Math.sin(a),nx=x*c-y*s; y=x*s+y*c;x=nx;
  }
  return [x,y];
}

function paint(phase){
  const t=phase*6.2831853;
  ctx.fillStyle='#020207';ctx.fillRect(0,0,W,H);
  const side=Math.min(W,H),ox=W*.5,oy=H*.5;

  // Four temporal echoes: a moving square leaves a family of smaller residues.
  for(let i=0;i<N;i++){
    const p=particles[i];
    for(let e=4;e>=0;e--){
      const z=particlePos(p,phase,e),x=ox+z[0]*side*.49,y=oy-z[1]*side*.49;
      const k=e/4;
      const pulse=.72+.28*Math.sin(t*.7+p.seed*9-e*.8);
      const size=p.s*(1-k*.34)*pulse;
      const hue=(p.h + z[0]*80-z[1]*45+t*18+e*23+seed*.01)%360;
      const alpha=e===0?.78:(.18*(1-k)+.025);
      ctx.fillStyle=`hsla(${hue},100%,${62+18*(1-k)}%,${alpha})`;
      ctx.fillRect(x-size*.5,y-size*.5,size,size);
    }
  }

  // Sparse larger squares reveal the large-scale geometry of the field.
  for(let i=0;i<95;i++){
    const p=particles[(i*17+Math.floor(seed))%N],z=particlePos(p,phase,0);
    const x=ox+z[0]*side*.49,y=oy-z[1]*side*.49;
    const q=3.2+(i%5)*1.15;
    ctx.fillStyle=`hsla(${(p.h+t*20+seed*.02)%360},100%,72%,.58)`;
    ctx.fillRect(x-q*.5,y-q*.5,q,q);
  }
}

function touch(x,y){
  if(window.APKit&&APKit.isUI(x,y))return true;
  marks.push({x:x/W*2-1,y:.5-y/H*2,r:.07+Math.random()*.12,p:Math.random()<.5?-1:1});
  if(marks.length>14)marks.shift();
  return false;
}
let drawing=false,last=0;
canvas.addEventListener('pointerdown',e=>{if(touch(e.clientX,e.clientY))return;drawing=true;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing||performance.now()-last<42)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=performance.now();touch(e.clientX,e.clientY)});
canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);

let start=performance.now();function frame(now){if(!APKit.isExporting()){paint(((now-start)/1000%10)/10)}requestAnimationFrame(frame)}
APKit.init({canvas:canvas,gifName:'field-residue-loop',clockFormat:'spec',loopFrame:paint,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*10000;marks=[]}},{label:'↻',name:'reset',onClick:()=>{marks=[]}}]});requestAnimationFrame(frame);
</script></body></html>
