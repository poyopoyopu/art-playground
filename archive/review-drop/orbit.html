<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>ORBIT</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030406}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,count=23,off=0;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#030406';g.fillRect(0,0,W,H);let S=Math.min(W,H)*.38;for(let i=0;i<count;i++){let a=i*Math.PI*2/count+p*6*(i%2?1:-1),r=S*(.25+.75*i/count);let x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r*.65;g.beginPath();g.arc(x,y,1.5+4*Math.sin(p*6+i),0,7);g.fillStyle=`hsla(${200+i*4},90%,75%,.8)`;g.fill()}}function mu(){count=8+Math.floor(Math.random()*35)}APKit.init({canvas:c,gifName:'orbit-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>count=23}]});draw(0)</script>
