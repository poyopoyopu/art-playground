<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>PULSE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,rings=16;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#000';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let i=0;i<rings;i++){let q=(p*2+i/rings)%1,r=q*S*.55;g.beginPath();g.arc(W/2,H/2,r,0,7);g.strokeStyle=`hsla(${180+i*9},90%,70%,${(1-q)*.45})`;g.lineWidth=1+i%3;g.stroke()}}function mu(){rings=5+Math.floor(Math.random()*30)}APKit.init({canvas:c,gifName:'pulse-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>rings=16}]});draw(0)</script>
