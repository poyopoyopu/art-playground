<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART PLAYGROUND — REVIEW</title>
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--text:#f2f2f2;--muted:#8d8d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(8,8,8,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px 16px 14px}
h1{font-size:18px;letter-spacing:.14em;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:7px;overflow:auto;padding-top:14px}.filter{border:1px solid var(--line);background:#101010;color:#aaa;border-radius:999px;padding:7px 12px;font-size:12px;white-space:nowrap}.filter.active{color:#fff;border-color:#777}
main{max-width:1100px;margin:auto;padding:14px 12px 60px}.count{font-size:12px;color:var(--muted);margin:0 4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.top{padding:12px 12px 8px}.name{font-size:14px;font-weight:650;letter-spacing:.04em;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}button{appearance:none;border:0;border-right:1px solid var(--line);background:#101010;color:#888;padding:10px 4px;font-size:12px}button:last-child{border-right:0}button.on{color:#fff;background:#202020;font-weight:650}button:active{background:#2a2a2a}
.open{display:block;text-decoration:none;color:#ddd;font-size:11px;padding:9px 12px;border-top:1px solid var(--line)}.open:hover{background:#171717}
.empty{text-align:center;padding:40px;color:var(--muted)}
.legend{font-size:11px;color:#777;margin:0 4px 14px}.legend b{color:#bbb}
</style>
</head>
<body>
<header>
<h1>ART PLAYGROUND / REVIEW</h1><div class="sub">作品を見て、KEEP / MAYBE / DROP に仕分ける選考台帳</div>
<div class="filters">
<button class="filter active" data-filter="ALL">ALL</button><button class="filter" data-filter="KEEP">KEEP</button><button class="filter" data-filter="MAYBE">MAYBE</button><button class="filter" data-filter="DROP">DROP</button><button class="filter" data-filter="UNREVIEWED">未判定</button>
</div>
</header>
<main><p class="legend"><b>KEEP</b> 採用候補　<b>MAYBE</b> 保留　<b>DROP</b> 削除候補　※判定はこの端末のブラウザに保存</p><p id="count" class="count">読み込み中…</p><div id="grid" class="grid"></div></main>
<script>
const API='https://api.github.com/repos/poyopoyopu/art-playground/contents/prototypes?ref=main';
const KEY='art-playground-review-v1';
let files=[],state=JSON.parse(localStorage.getItem(KEY)||'{}'),filter='ALL';
function status(path){return state[path]||'UNREVIEWED'}
function save(path,value){state[path]=value;localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
 const list=files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name)).filter(f=>filter==='ALL'||status(f.path)===filter);
 document.querySelector('#count').textContent=`${list.length} / ${files.filter(f=>f.type==='file'&&/\.html$/i.test(f.name)).length} 作品`;
 document.querySelector('#grid').innerHTML=list.length?list.map(f=>{let s=status(f.path);let url=`./${encodeURIComponent(f.name)}`;return `<article class="card"><div class="top"><div class="name">${esc(f.name.replace(/\.html$/i,''))}</div><div class="meta">${s==='UNREVIEWED'?'未判定':s}</div></div><div class="actions">${['KEEP','MAYBE','DROP'].map(x=>`<button class="${s===x?'on':''}" data-p="${esc(f.path)}" data-s="${x}">${x}</button>`).join('')}</div><a class="open" href="${url}" target="_blank" rel="noopener">OPEN → 作品を見る</a></article>`}).join(''):'<div class="empty">この条件の作品はありません。</div>';
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>save(b.dataset.p,b.dataset.s));
}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch(API,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{files=x.sort((a,b)=>a.name.localeCompare(b.name));render()}).catch(e=>{document.querySelector('#count').textContent='読み込み失敗';document.querySelector('#grid').innerHTML=`<div class="empty">GitHubから作品一覧を取得できませんでした。<br>${esc(String(e))}</div>`});
</script>
</body></html>
