<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TENSION</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}body{touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,pts=[],down=null;
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);pts=[];for(let j=0;j<26;j++)for(let i=0;i<38;i++)pts.push({x:i/37*W,y:j/25*H,ox:i/37*W,oy:j/25*H,vx:0,vy:0})}addEventListener("resize",size);size();
function draw(){x.fillStyle="#111";x.fillRect(0,0,W,H);for(const p of pts){let fx=(p.ox-p.x)*.015,fy=(p.oy-p.y)*.015;if(down){let dx=p.x-down.x,dy=p.y-down.y,r=Math.hypot(dx,dy);if(r<240){let q=1-r/240;fx+=down.dx*q*2.4;fy+=down.dy*q*2.4}}p.vx=(p.vx+fx)*.88;p.vy=(p.vy+fy)*.88;p.x+=p.vx;p.y+=p.vy}
for(let j=0;j<26;j++){x.beginPath();for(let i=0;i<38;i++){let p=pts[j*38+i];i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)}x.strokeStyle="rgba(240,240,240,.13)";x.lineWidth=.7;x.stroke()}
for(let i=0;i<38;i++){x.beginPath();for(let j=0;j<26;j++){let p=pts[j*38+i];j?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)}x.strokeStyle="rgba(240,240,240,.08)";x.stroke()}requestAnimationFrame(draw)}
c.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,dx:0,dy:0};c.setPointerCapture(e.pointerId)});
c.addEventListener("pointermove",e=>{if(down){down.dx=(e.clientX-down.x)*.018;down.dy=(e.clientY-down.y)*.018}});
c.addEventListener("pointerup",()=>down=null);draw();
</script></body></html>
