<!doctype html>
<!-- FRACTURE 20 — ChatGPT作。対称な万華鏡ではなく、非対称な自己相似増殖を試すプロトタイプ。 -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FRACTURE 20</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif;height:100%;overflow:hidden}#tabs{position:fixed;z-index:3;top:10px;left:10px;right:10px;display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}button{border:1px solid #555;background:#111;color:#aaa;border-radius:99px;padding:7px 11px;white-space:nowrap;font-size:11px}button.on{background:#fff;color:#000}#stage{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><div id="tabs"></div><iframe id="stage" title="FRACTURE 20"></iframe><script>const names=['BLOCK','FANG','DIAMOND','CROSS','HEX','STAR','BAR','RING','CHEVRON','ZIGZAG','CAPSULE','EYE','BRACKET','TOOTH','SHARD','DOT','HOLE','MESH','ARC','CELL'];const tabs=document.querySelector('#tabs'),stage=document.querySelector('#stage');let m=+(new URLSearchParams(location.search).get('mode')||0);m=(m+20)%20;names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+name;b.onclick=()=>{m=i;stage.src='fracture20-stage.html?mode='+i;document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');history.replaceState(null,'','?mode='+i)};tabs.append(b)});stage.src='fracture20-stage.html?mode='+m;tabs.children[m].classList.add('on');</script></body></html>
