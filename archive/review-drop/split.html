<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>SPLIT</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#fafafa}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,axis=0;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#fafafa';g.fillRect(0,0,W,H);let S=Math.min(W,H),m=axis*S*.12;for(let i=0;i<40;i++){let a=i*.37+p*6,x=W/2+Math.cos(a)*S*.4,y=H/2+Math.sin(a)*S*.4;g.beginPath();g.moveTo(x,y);g.lineTo(W-x+m*Math.sin(a),H-y+m*Math.cos(a));g.strokeStyle=`hsla(${i*9},70%,35%,.25)`;g.stroke()}}function mu(){axis=Math.random()*2-1}APKit.init({canvas:c,gifName:'split-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>axis=0}]});draw(0)</script>
