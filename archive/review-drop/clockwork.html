<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>CLOCKWORK</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f1e8}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,teeth=12;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#f4f1e8';g.fillRect(0,0,W,H);let S=Math.min(W,H)*.3;for(let j=0;j<3;j++){let r=S*(.55+j*.32);g.save();g.translate(W/2,H/2);g.rotate(p*6*(j%2?-.3:.3));for(let i=0;i<teeth;i++){g.rotate(6.28/teeth);g.fillStyle='#222';g.fillRect(r,-3,18,6)}g.beginPath();g.arc(0,0,r,0,7);g.stroke();g.restore()}}function mu(){teeth=6+Math.random()*24|0}APKit.init({canvas:c,gifName:'clockwork-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>teeth=12}]});draw(0)</script>
