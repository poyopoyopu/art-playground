<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SPECTRA 20</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:13px system-ui}#bar{position:fixed;z-index:5;top:0;left:0;right:0;height:58px;display:flex;gap:6px;padding:7px;overflow-x:auto;background:rgba(0,0,0,.86);scrollbar-width:none}#bar::-webkit-scrollbar{display:none}button{flex:0 0 auto;height:44px;min-width:112px;border:1px solid #555;border-radius:7px;background:#111;color:#ddd;font-size:13px}button.on{background:#fff;color:#000;border-color:#fff}iframe{position:absolute;left:0;right:0;bottom:0;top:58px;width:100%;height:calc(100% - 58px);border:0}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['01','BRANCH','spectra01-branch.html'],['02','CHAOS','spectra02-chaos.html'],['03','JULIA','spectra03-julia.html'],['04','MANDELBROT','spectra04-mandelbrot.html'],['05','KOCH','spectra05-koch.html'],['06','DRAGON','spectra06-dragon.html'],['07','SIERPINSKI','spectra07-sierpinski.html'],['08','CIRCLES','spectra08-circles.html'],['09','APOLLONIAN','spectra09-apollonian.html'],['10','HILBERT','spectra10-hilbert.html'],['11','CARPET','spectra11-carpet.html'],['12','NEWTON','spectra12-newton.html'],['13','BURN','spectra13-burn.html'],['14','ORBIT','spectra14-orbit.html'],['15','CORAL','spectra15-coral.html'],['16','LACE','spectra16-lace.html'],['17','FLAME','spectra17-flame.html'],['18','MIRROR','spectra18-mirror.html'],['19','GROW','spectra19-grow.html'],['20','VOID','spectra20-void.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');function go(i){stage.src=A[i][2];[...bar.children].forEach((b,j)=>b.classList.toggle('on',j===i));bar.children[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}A.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0]+' '+a[1];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{const i=A.findIndex(a=>stage.src.endsWith(a[2]));if(e.key==='ArrowRight')go((i+1)%20);if(e.key==='ArrowLeft')go((i+19)%20)});</script></body></html>
