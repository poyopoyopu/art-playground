<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020207">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ART PLAYGROUND — v37 · LIVING FIELD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207;color:#fff;font-family:system-ui,-apple-system,sans-serif}
body{height:100dvh;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;z-index:5;left:50%;top:18px;transform:translateX(-50%);font-size:8px;letter-spacing:.42em;opacity:.25;pointer-events:none;white-space:nowrap;transition:opacity 1s}
.hud.hide{opacity:0}
.controls{position:fixed;z-index:6;right:4vw;bottom:max(3.5vh,env(safe-area-inset-bottom));display:flex;gap:8px;transition:opacity .6s}
.controls.idle{opacity:0;pointer-events:none}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff25;background:#05050bd9;color:#fff;font-size:14px;box-shadow:0 4px 18px #0008;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.92)}
.btn.act{border-color:#ffffff60;background:#ffffff1e}
.toast{position:fixed;z-index:7;left:50%;bottom:calc(max(3.5vh,env(safe-area-inset-bottom)) + 52px);transform:translateX(-50%);max-width:82vw;padding:11px 18px;border-radius:14px;background:#0a0a16d8;border:1px solid #ffffff1f;backdrop-filter:blur(10px);font-size:11px;line-height:1.6;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000b;backdrop-filter:blur(18px)}
.sheet.on{display:flex}
.card{width:min(88vw,370px);padding:22px;border:1px solid #ffffff20;border-radius:20px;background:#080812ee;text-align:center;box-shadow:0 20px 80px #000}
.card h2{margin:0 0 8px;font-size:13px;letter-spacing:.2em}
.card p{margin:0;font-size:11px;line-height:1.7;opacity:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.acts button,.acts a{padding:9px 18px;border:1px solid #ffffff25;border-radius:20px;background:none;color:#fff;font-size:10px;letter-spacing:.16em;text-decoration:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">LIVING FIELD · WRITE / DISTURB / LET IT BECOME</div>
<div class="controls" id="controls">
  <button class="btn" id="seed" aria-label="new seed">✦</button>
  <button class="btn" id="clear" aria-label="clear">↻</button>
  <button class="btn" id="save" aria-label="save image">◎</button>
  <button class="btn" id="fs" aria-label="fullscreen">⛶</button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="card">
  <h2 id="sheetTitle">LIVING FIELD</h2>
  <p id="sheetMsg"></p>
  <div class="acts" id="acts"></div>
</div></div>

<script>
'use strict';

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<div style="padding:30px">WebGL2対応ブラウザが必要です。</div>';throw Error('WebGL2')}

const VS=`#version 300 es
in vec2 a;out vec2 uv;
void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;

const SIM=`#version 300 es
precision highp float;
out vec4 o; in vec2 uv;
uniform sampler2D state;
uniform vec2 px;
uniform float dt,aspect,life,phase;
uniform int n;
uniform vec4 touch[6];

float h(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+19.19);return fract(p.x*p.y);}
float noise(vec2 p){
 vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);
}
vec2 curl(vec2 p){
 float e=.0025;
 float a=noise(p+vec2(0,e)),b=noise(p-vec2(0,e));
 float c=noise(p+vec2(e,0)),d=noise(p-vec2(e,0));
 return vec2(a-b,c-d)/(2.*e);
}
void main(){
 vec4 s=texture(state,uv);
 vec4 l=texture(state,uv-vec2(px.x,0.));
 vec4 r=texture(state,uv+vec2(px.x,0.));
 vec4 d=texture(state,uv-vec2(0.,px.y));
 vec4 u=texture(state,uv+vec2(0.,px.y));
 vec4 lap=(l+r+d+u)*.25-s;

 // R = living matter, G/B = pigment/energy, A = memory
 float field=noise(uv*3.5+phase*.025);
 vec2 v=curl(uv*4.0+phase*.018);
 float adv=noise(uv*7.0-v*.55+phase*.03);

 vec3 x=s.rgb;
 x += lap.rgb*(.16+.08*sin(life));
 x += vec3(.004,-.002,.003)*(field-.5);
 x *= .9975;

 // slow reaction: energy catalyses colour and creates islands
 float reaction=s.r*(1.-s.r);
 x.r += reaction*.010;
 x.g += s.r*(.004+adv*.006);
 x.b += s.g*(.003+field*.004);

 // persistent interaction: a touch writes state instead of merely pushing pixels
 for(int i=0;i<6;i++){
   if(i<n){
     vec2 q=uv-touch[i].xy; q.x*=aspect;
     float rr=touch[i].z;
     float w=exp(-dot(q,q)/(rr*rr+1e-5));
     float spin=touch[i].w;
     x.r+=w*(.035+.025*abs(spin));
     x.g+=w*(.018+.012*sin(phase+spin*3.));
     x.b+=w*.028;
   }
 }

 float memory=max(s.a*.9992,max(x.r,x.g)*.12);
 o=vec4(clamp(x,0.,1.),clamp(memory,0.,1.));
}`;

const RENDER=`#version 300 es
precision highp float;
out vec4 o;in vec2 uv;
uniform sampler2D state;
uniform vec2 res;
uniform float time,seed,phase;
uniform int n;
uniform vec4 touch[6];

#define PI 3.14159265359

mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}

float h(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+19.19);return fract(p.x*p.y);}
float noise(vec2 p){
 vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1)),f.x),f.y);
}
float fbm(vec2 p){
 float z=0.,a=.5;
 for(int i=0;i<5;i++){z+=a*noise(p);p=rot(.65)*p*2.03;a*=.5;}
 return z;
}
vec3 palette(float t){
 return .5+.5*cos(6.2831853*(vec3(.00,.21,.48)+t*vec3(1.0,.83,.71)));
}
float field(vec2 p,float t,vec4 s){
 float r=length(p),a=atan(p.y,p.x);
 float memory=s.a;
 float rings=5.0+memory*16.0;
 float petals=3.0+floor(s.r*13.0);
 float n1=fbm(p*2.2+vec2(t*.035,-t*.021));
 float n2=fbm(rot(.7)*p*5.0-vec2(t*.018,t*.027));
 float spiral=sin(a*petals+r*rings-n1*4.5+t*.32);
 float web=sin((p.x+p.y)*12.0+n2*6.0)*sin((p.x-p.y)*9.0-n1*5.0);
 float shells=sin(r*28.0-n1*8.0+t*.15);
 return spiral*.48+web*.22+shells*.16+n1*.35;
}
void main(){
 vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
 float r=length(p);
 vec4 s=texture(state,uv);

 // Multi-scale domain warping driven by the persistent field.
 vec2 q=p;
 float w=fbm(q*2.0+time*.018);
 q+=vec2(
   fbm(q*3.0+vec2(time*.021,0.))-0.5,
   fbm(q*3.0-vec2(0.,time*.017))-.5
 )*.20;
 q=rot(s.a*1.9+w*.6)*q;

 float f=field(q,time,s);
 float micro=fbm(q*11.0-time*.02);
 float filament=pow(max(0.,sin(f*13.0+micro*5.0)),8.0);
 float halo=exp(-r*r*1.7);

 float hue=.06+f*.085+s.r*.46+s.g*.25+s.b*.17+r*.24+micro*.10+sin(time*.04)*.025;
 vec3 col=palette(hue);
 col*=.45+.75*clamp(.5+.5*f,0.,1.);
 col+=palette(hue+.13)*filament*.65;
 col+=palette(hue+.45)*s.r*.18;
 col+=vec3(.16,.10,.22)*halo*.30;

 // Persistent memory becomes fine luminous topology.
 float edge=abs(dFdx(s.r)+dFdy(s.r))*35.0;
 col+=palette(hue+.28)*smoothstep(.02,.16,edge)*.18;

 // Touches distort the visible field in real time.
 for(int i=0;i<6;i++){
   if(i<n){
     vec2 q2=uv-touch[i].xy;q2.x*=res.x/res.y;
     float dd=length(q2),ww=exp(-dd*dd/(touch[i].z*touch[i].z+.0001));
     q=rot(ww*touch[i].w*.8)*q;
     col+=palette(hue+ww*.18)*ww*.12;
   }
 }

 // Temporal-like persistence from the state texture + cinematic vignette.
 float vign=1.-smoothstep(.52,1.18,r);
 col*=.78+.22*vign;
 col=pow(max(col,0.),vec3(.88));
 o=vec4(col,1.);
}`;

function compile(type,src){
 const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
 return s;
}
function program(fs){
 const p=gl.createProgram();
 gl.attachShader(p,compile(gl.VERTEX_SHADER,VS));
 gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
 gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
 return p;
}
const simProg=program(SIM),renderProg=program(RENDER);
const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
function bindQuad(){
 gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(0);
 gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
}
const SU={},RU={};
['state','px','dt','aspect','life','phase','n'].forEach(k=>SU[k]=gl.getUniformLocation(simProg,k));
['state','res','time','seed','phase','n'].forEach(k=>RU[k]=gl.getUniformLocation(renderProg,k));
const ST=[],RT=[];
for(let i=0;i<6;i++){
 ST.push(gl.getUniformLocation(simProg,'touch['+i+']'));
 RT.push(gl.getUniformLocation(renderProg,'touch['+i+']'));
}

let W=1,H=1,dpr=1,A=null,B=null;
const SIMW=256,SIMH=256;
let seed=Math.random()*1000,life=Math.random()*10,phase=Math.random()*100;
let last=performance.now(),energy=.2;
let fingers=new Map(),idleTimer=null,toastTimer=null;

function tex(w,h){
 const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
 return t;
}
const fbo=gl.createFramebuffer();
function target(t,w,h){
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
 gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
 gl.viewport(0,0,w,h);
}
function clear(t,w,h){
 target(t,w,h);gl.clearColor(.003,.002,.008,1);gl.clear(gl.COLOR_BUFFER_BIT);
}
function initState(){
 A=tex(SIMW,SIMH);B=tex(SIMW,SIMH);
 clear(A,SIMW,SIMH);clear(B,SIMW,SIMH);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
initState();

function resize(){
 const r=canvas.getBoundingClientRect(),vw=Math.max(1,Math.round(r.width)),vh=Math.max(1,Math.round(r.height));
 dpr=Math.min(devicePixelRatio||1,1.75);
 const nw=Math.max(1,Math.floor(vw*dpr)),nh=Math.max(1,Math.floor(vh*dpr));
 if(nw===W&&nh===H&&canvas.width)return;
 W=nw;H=nh;canvas.width=W;canvas.height=H;gl.viewport(0,0,W,H);
}
new ResizeObserver(resize).observe(canvas);addEventListener('resize',resize,{passive:true});resize();

function swap(){let t=A;A=B;B=t}

function seedWorld(strength=1){
 seed=Math.random()*1000;life=1.5+Math.random()*9;phase=Math.random()*100;
 // Put a few deterministic impulses into the simulation through temporary touches.
 const cx=.28+Math.random()*.44,cy=.28+Math.random()*.44;
 fingers.set(-999,{x:cx*innerWidth,y:(1-cy)*innerHeight,r:innerWidth*.18*strength,spin:(Math.random()*2-1)*1.4});
 energy=1;
 setTimeout(()=>fingers.delete(-999),90);
 flash();
}
function flash(){
 document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.18)'},{filter:'brightness(1)'}],{duration:220});
}
function step(dt){
 gl.useProgram(simProg);bindQuad();target(B,SIMW,SIMH);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A);gl.uniform1i(SU.state,0);
 gl.uniform2f(SU.px,1/SIMW,1/SIMH);
 gl.uniform1f(SU.dt,dt);gl.uniform1f(SU.aspect,W/H);gl.uniform1f(SU.life,life);gl.uniform1f(SU.phase,phase);
 const n=Math.min(6,fingers.size);gl.uniform1i(SU.n,n);
 let i=0;
 for(const p of fingers.values()){
   if(i>=6)break;
   gl.uniform4f(ST[i],p.x*dpr/W,1-p.y*dpr/H,p.r*dpr/Math.min(W,H),p.spin);i++;
 }
 for(;i<6;i++)gl.uniform4f(ST[i],0,0,0,0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);swap();
}
function render(t){
 gl.useProgram(renderProg);bindQuad();
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A);gl.uniform1i(RU.state,0);
 gl.uniform2f(RU.res,W,H);gl.uniform1f(RU.time,t);gl.uniform1f(RU.seed,seed);gl.uniform1f(RU.phase,phase);
 const n=Math.min(6,fingers.size);gl.uniform1i(RU.n,n);
 let i=0;
 for(const p of fingers.values()){
   if(i>=6)break;
   gl.uniform4f(RT[i],p.x*dpr/W,1-p.y*dpr/H,p.r*dpr/Math.min(W,H),p.spin);i++;
 }
 for(;i<6;i++)gl.uniform4f(RT[i],0,0,0,0);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function frame(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 phase+=dt*8;life+=dt*.08;energy*=Math.pow(.08,dt);
 step(dt*60);render(now*.001);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 const p=pos(e);
 fingers.set(e.pointerId,{x:p.x,y:p.y,r:Math.min(innerWidth,innerHeight)*.10,spin:e.shiftKey?-1:1});
 energy=1;hideHud();bump();
},{passive:false});
canvas.addEventListener('pointermove',e=>{
 const q=fingers.get(e.pointerId);if(!q)return;
 const p=pos(e),dx=p.x-q.x,dy=p.y-q.y;
 q.x=p.x;q.y=p.y;
 q.r=Math.max(12,Math.min(Math.min(innerWidth,innerHeight)*.25,Math.hypot(dx,dy)*2.8+16));
 q.spin=Math.max(-1.8,Math.min(1.8,(dx-dy)/Math.min(innerWidth,innerHeight)*10));
 energy=1;
},{passive:true});
function up(e){fingers.delete(e.pointerId)}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function toast(msg,ms=3200){
 clearTimeout(toastTimer);document.getElementById('toast').textContent=msg;
 document.getElementById('toast').classList.add('on');
 toastTimer=setTimeout(()=>document.getElementById('toast').classList.remove('on'),ms);
}
const controls=document.getElementById('controls');
function bump(){controls.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>controls.classList.add('idle'),4500)}
function hideHud(){document.getElementById('hud').classList.add('hide')}
setTimeout(hideHud,7000);

document.getElementById('seed').onclick=()=>{seedWorld(1);toast('新しい生命の種を投入')};
document.getElementById('clear').onclick=()=>{
 A=tex(SIMW,SIMH);B=tex(SIMW,SIMH);clear(A,SIMW,SIMH);clear(B,SIMW,SIMH);
 seedWorld(.7);toast('場をリセットしました');
};
document.getElementById('save').onclick=()=>{
 const a=document.createElement('a');a.download='living-field-'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click();
 toast('現在の一瞬をPNGに保存しました');
};
document.getElementById('fs').onclick=async()=>{
 const el=document.documentElement;
 try{
   if(document.fullscreenElement)await document.exitFullscreen();
   else if(el.requestFullscreen)await el.requestFullscreen();
   else toast('iPhoneでは「ホーム画面に追加」でフチなし表示にできます');
 }catch(_){toast('フルスクリーンに切り替えられませんでした')}
};
addEventListener('pointerdown',bump,{passive:true});
</script>
</body>
</html>
