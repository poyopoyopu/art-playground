<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030305"><title>QUIET CATASTROPHE — ART PLAYGROUND</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030305;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#clock{position:fixed;top:calc(env(safe-area-inset-top) + 22px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:5;mix-blend-mode:screen;text-shadow:0 1px 12px #000,0 0 3px #000}#time{font-size:clamp(28px,7vw,54px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.045em}#date{font-size:clamp(9px,2.1vw,14px);margin-top:7px;letter-spacing:.28em;opacity:.8}#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 116px);transform:translateX(-50%);font-size:10px;letter-spacing:.32em;opacity:.28;white-space:nowrap;pointer-events:none;transition:opacity .7s}#controls{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);display:flex;gap:10px;padding:8px;border:1px solid #ffffff24;border-radius:999px;background:#05050966;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .7s,transform .7s;z-index:10}#controls.hide{opacity:0;transform:translate(-50%,12px);pointer-events:none}button{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff30;background:#09090dba;color:#fff;font:inherit;font-size:21px;box-shadow:0 0 0 1px #0008,0 5px 25px #0008}button:active{transform:scale(.94)}#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border:1px solid #ffffff22;border-radius:999px;background:#050509cc;backdrop-filter:blur(12px);opacity:0;transition:opacity .25s;pointer-events:none;font-size:11px;letter-spacing:.12em;z-index:20}#toast.on{opacity:1}@media (orientation:landscape){#clock{top:calc(env(safe-area-inset-top) + 16px)}#controls{bottom:calc(env(safe-area-inset-bottom) + 16px)}#hint{bottom:calc(env(safe-area-inset-bottom) + 94px)}}
</style></head><body><canvas id="c"></canvas><div id="clock"><div id="time">--:--:--</div><div id="date">---- -- -- ---</div></div><div id="hint">TOUCH THE WORLD · CHANGE ITS LAW</div><div id="controls"><button id="random" aria-label="Random">✦</button><button id="gif" aria-label="Export GIF">◉</button><button id="clockBtn" aria-label="Clock">◷</button></div><div id="toast"></div><script>
function rgb332(r,g,b){return ((r&224))|((g&224)>>3)|((b&192)>>6)}
function gifLzw(indices){const clear=256,end=257;let codeSize=9,next=258,max=511,dict=new Map();let out=[],bits=0,buf=0;function put(c){buf|=c<<bits;bits+=codeSize;while(bits>=8){out.push(buf&255);buf>>=8;bits-=8}}put(clear);let prefix=null;for(const k of indices){if(prefix===null){prefix=k;continue}const key=prefix+','+k;if(dict.has(key)){prefix=dict.get(key)}else{put(prefix);dict.set(key,next++);prefix=k;if(next>max&&codeSize<12){codeSize++;max=(1<<codeSize)-1}}if(next>=4096){put(clear);dict.clear();codeSize=9;next=258;max=511}}if(prefix!==null)put(prefix);put(end);if(bits)out.push(buf&255);return out}
function makeGIF(frames,w,h,delay){let a=[];const push=(...x)=>a.push(...x);push(71,73,70,56,57,97,w&255,w>>8,h&255,h>>8,0xF7,0,0);for(let i=0;i<256;i++){push(i&224,i&28?((i&28)<<3):0,(i&3)<<6)}push(0x21,0xFF,11,...new TextEncoder().encode('NETSCAPE2.0'),3,1,0,0,0);for(const data of frames){push(0x21,0xF9,4,0,delay&255,delay>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0);const idx=[];for(let p=0;p<data.length;p+=4)idx.push(rgb332(data[p],data[p+1],data[p+2]));const lzw=gifLzw(idx);push(8);for(let i=0;i<lzw.length;i+=255){const n=Math.min(255,lzw.length-i);push(n,...lzw.slice(i,i+n))}push(0)}push(0x3B);return new Blob([new Uint8Array(a)],{type:'image/gif'})}

const canvas=document.getElementById('c'),gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
let seed=Math.random()*999,sym=7,laws=[],clockOn=true,raf=0,last=performance.now(),hiddenTimer=0,phaseStart=performance.now();
const LOOP=7.2;
function fallback(){window.__fallback=true;const x=canvas.getContext('2d');function f(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);x.setTransform(d,0,0,d,0,0);const w=innerWidth,h=innerHeight,t=((performance.now()-phaseStart)/1000/LOOP)%1;x.fillStyle='#030305';x.fillRect(0,0,w,h);const cx=w/2,cy=h*.48,R=Math.min(w,h)*.42;x.globalCompositeOperation='screen';for(let k=0;k<9;k++){x.beginPath();for(let i=0;i<=360;i++){let a=i*Math.PI/180,rr=R*(.18+.72*(k+1)/10)+Math.sin(a*(7+sym)+t*Math.PI*2*(k+1))*R*.025+Math.sin(a*3-t*Math.PI*4)*R*.018;let xx=cx+Math.cos(a)*rr,yy=cy+Math.sin(a)*rr;x.lineTo(xx,yy)}x.closePath();x.strokeStyle=`hsla(${(seed*37+k*29)%360},70%,${45+k*4}%,.16)`;x.lineWidth=1.2;x.stroke()}x.globalCompositeOperation='source-over';requestAnimationFrame(f)}f();}
const V=`#version 300 es
precision highp float;layout(location=0)in vec2 a;out vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}`,F=`#version 300 es
precision highp float;
in vec2 v;out vec4 o;
uniform vec2 uRes;uniform float ph,uSeed,uSym;uniform vec4 uLaw[8];
const float TAU=6.28318530718;
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash21(i),b=hash21(i+vec2(1,0)),d=hash21(i+vec2(0,1)),e=hash21(i+vec2(1,1));return mix(mix(a,b,f.x),mix(d,e,f.x),f.y);}
float fbm(vec2 p){float z=0.,a=0.5;for(int i=0;i<5;i++){z+=a*noise(p);p=mat2(.8,-.6,.6,.8)*p*2.02;a*=.5;}return z;}

float world(vec2 p){
  float r=length(p),a=atan(p.y,p.x);vec2 q=p;
  float e=sin(TAU*ph*2.0),f=cos(TAU*ph*3.0);
  q+=0.20*vec2(sin(q.y*5.0+TAU*ph*2.0),cos(q.x*6.0-TAU*ph*3.0))*exp(-r);
  float crystal=sin(q.x*19.0+q.y*7.0+e*4.0)*sin(q.y*17.0-q.x*5.0+f*5.0);
  float shells=sin(r*31.0-TAU*ph*5.0+sin(a*6.0+TAU*ph*2.0)*3.0);
  float fault=sin(a*5.0+r*12.0+TAU*ph*4.0);
  float law=0.0;for(int i=0;i<8;i++){vec4 L=uLaw[i];float d=length(p-L.xy);law+=L.z*exp(-d*d/(L.w*L.w))*(0.55*sin(d*34.0+TAU*ph*float(i+2))+0.45*cos(a*(4.0+float(i%4))-TAU*ph*3.0));}
  return crystal*.10+shells*.34+fault*.18+fbm(q*2.0)*.28+law*.85;
}
void main(){vec2 p=(v*uRes-0.5*uRes)/min(uRes.x,uRes.y);p*=1.35;float w=world(p);float r=length(p);float edge=smoothstep(1.55,.18,r);float bands=0.5+0.5*sin(w*5.8);float filament=smoothstep(.42,.9,abs(sin(w*3.1+fbm(p*4.0)*2.0)));float glow=exp(-abs(w)*2.0);
vec3 colA=0.5+0.5*cos(TAU*(uSeed*.17+vec3(.00,.17,.34)+w*.12));vec3 colB=0.5+0.5*cos(TAU*(uSeed*.29+vec3(.11,.31,.53)-w*.09));vec3 col=mix(colA,colB,bands);col*=0.24+0.76*edge;col+=filament*0.22*colB;col+=glow*0.18*colA;col*=1.0-0.32*smoothstep(1.0,1.8,r);float grain=hash21(gl_FragCoord.xy+uSeed*19.);col+=((grain-.5)/255.0);o=vec4(pow(max(col,0.),vec3(.9)),1.);}
`;
function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
let P;try{P=gl&&gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,V));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(P);if(!gl.getProgramParameter(P,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(P));}catch(e){console.error(e);fallback()}
let loc={};if(P){gl.useProgram(P);loc.res=gl.getUniformLocation(P,'uRes');loc.ph=gl.getUniformLocation(P,'ph');loc.seed=gl.getUniformLocation(P,'uSeed');loc.sym=gl.getUniformLocation(P,'uSym');loc.law=gl.getUniformLocation(P,'uLaw');const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0)}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(2,Math.floor(innerWidth*d));canvas.height=Math.max(2,Math.floor(innerHeight*d));if(gl)gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();
function phase(){return ((performance.now()-phaseStart)/1000/LOOP)%1}
function draw(ph){if(!gl||!P)return;gl.useProgram(P);gl.uniform2f(loc.res,canvas.width,canvas.height);gl.uniform1f(loc.ph,ph);gl.uniform1f(loc.seed,seed);gl.uniform1f(loc.sym,sym);let arr=new Float32Array(32);laws.forEach((L,i)=>{arr[i*4]=L.x;arr[i*4+1]=L.y;arr[i*4+2]=L.s;arr[i*4+3]=L.r});gl.uniform4fv(loc.law,arr);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function loop(now){draw(phase());raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop);
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*2-1,y:1-(e.clientY-r.top)/r.height*2}}
let controls=document.getElementById('controls');function reveal(){controls.classList.remove('hide');clearTimeout(hiddenTimer);hiddenTimer=setTimeout(()=>controls.classList.add('hide'),3500)}
canvas.addEventListener('pointerdown',e=>{reveal();const q=pos(e);let s=.7+(seed%17)/40,r=.11+.06*Math.sin(seed);laws.unshift({x:q.x*(innerWidth/Math.min(innerWidth,innerHeight))/1.35,y:q.y*(innerHeight/Math.min(innerWidth,innerHeight))/1.35,s:s*(Math.random()>.5?1:-1),r});laws=laws.slice(0,8);seed=(seed*1.618+q.x*31+q.y*17)%1000;phaseStart=performance.now();toast('LAW CHANGED')});
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),700)}
document.getElementById('random').onclick=e=>{e.stopPropagation();seed=Math.random()*1000;sym=3+Math.floor(Math.random()*11);laws=[];phaseStart=performance.now();reveal();toast('NEW UNIVERSE')};
document.getElementById('clockBtn').onclick=e=>{e.stopPropagation();clockOn=!clockOn;document.getElementById('clock').style.display=clockOn?'block':'none';reveal()};
document.getElementById('gif').onclick=async e=>{e.stopPropagation();reveal();await exportLoop()};
function tick(){let d=new Date(),p=n=>String(n).padStart(2,'0');let days=['SUN','MON','TUE','WED','THU','FRI','SAT'];document.getElementById('time').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;document.getElementById('date').textContent=`${d.getFullYear()} ${p(d.getMonth()+1)} ${p(d.getDate())} ${days[d.getDay()]}`;setTimeout(tick,250)}tick();reveal();
async function exportLoop(){const N=60,w=256,h=256;const oldW=canvas.width,oldH=canvas.height;canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);let frames=[];for(let i=0;i<N;i++){draw(i/N);frames.push(new Uint8Array(gl.readPixels?(()=>{let a=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,a);return a})():[]));await new Promise(r=>setTimeout(r,0))}canvas.width=oldW;canvas.height=oldH;gl.viewport(0,0,oldW,oldH);const blob=makeGIF(frames,w,h,12);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='art-playground-loop.gif';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('GIF READY')}
</script></body></html>
