<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — SHADOW</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020206}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* SHADOW v56 — ChatGPT作。世界のルール: 光は空間を満たすが、触れた場所は光を拒む空洞になる。光源は自律回転する。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,t=0,seed=Math.random()*9,holes=[];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D}addEventListener('resize',size);size();
function draw(loop=false,ph=0){if(loop)t=ph*6.283;else t+=.012;g.setTransform(D,0,0,D,0,0);g.fillStyle='rgba(2,2,6,.22)';g.fillRect(0,0,W,H);let R=Math.min(W,H)*.34,a=t*.25+seed,lx=W/2+Math.cos(a)*R,ly=H/2+Math.sin(a)*R;for(let i=0;i<210;i++){let q=i*2.399+t*.035,r=12+(i%32)*7,px=W/2+Math.cos(q)*r,py=H/2+Math.sin(q)*r,blocked=false;for(const h of holes)if(Math.hypot(px-h.x,py-h.y)<h.r)blocked=true;if(blocked)continue;let dx=px-lx,dy=py-ly,L=Math.hypot(dx,dy)+1;g.strokeStyle=`hsla(${(Math.atan2(dy,dx)*57.3+seed*60+360)%360} 95% 75% / .36)`;g.lineWidth=.8;g.beginPath();g.moveTo(lx,ly);g.lineTo(px,py);g.stroke()}for(const h of holes){h.r=20+18*Math.sin(t*.3+h.s);g.beginPath();g.arc(h.x,h.y,h.r,0,6.283);g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.5;g.stroke()}if(!loop)requestAnimationFrame(()=>draw())}draw();c.addEventListener('pointerdown',e=>{holes.push({x:e.clientX,y:e.clientY,r:30,s:holes.length});if(holes.length>6)holes.shift()});APKit.init({canvas:c,gifName:'shadow-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(true,p),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>holes=[]}]});
</script></body></html>
