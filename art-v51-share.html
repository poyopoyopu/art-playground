<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanctuary">
<title>Art Playground — 聖域 SANCTUARY</title>
<!--
  聖域 SANCTUARY (v51・旧「分与 SHARE」を全面作り直し) — Claude作

  旧v51(分与 SHARE)は「総質量は常に一定、分裂は再配分でしかない」という
  質量保存の法則だったが、「もっと面白く」ではなく「全部気に入らないので
  一から新しい法則で」という要望を受け、コンセプトから作り直した。

  世界のルール: この世界のものは本来すべて儚い。淡く明滅する入れ子の
  正方形(1つの図形の中に、少し回転して縮んだ相似形が入れ子になっている)
  が、あちこちで浅く呼吸するように現れては沈む——それが既定の法則。

  しかしタップした場所だけは法則が変わる。そこに「聖域」が生まれ、
  もう呼吸(明滅)はしない代わりに、心拍のたびに入れ子の階層が
  1段ずつ後戻りなく深くなっていく。一度壊れた儚さの法則は、その場所では
  二度と元に戻らない。指を触れたまま(ホールド)でいると、近くの聖域の
  心拍が速まり成長を早める。離れたところをダブルタップすると、
  存在するすべての聖域に同時に鼓動が走り、一斉に一段深くなる。

  ホールド中の加速、聖域の永続成長、ダブルタップの全体鼓動と画面フラッシュは
  すべて実時間駆動のライブ専用演出。GIFループ側は位相のみの純関数として
  別に再構成しており(呼吸する背景はそのまま、聖域は位相0→πで象徴的に
  芽生えて深くなり、π→2πでアルファだけを0まで落として2πでちょうど
  非表示=位相0の状態と一致させる)、ライブの「永続成長」というルール自体は
  ループの都合で変更していない。

  改良(おっちゃんフィードバック「四角は縮むより育っていく方が面白い」
  「背景の色も変えてみたら」): 入れ子を縮小方向から拡大方向へ反転。
  核(depth=0)だけを塗りつぶし、そこから外側へリングが1段ずつ大きく
  育っていく構造にした。背景も固定の黒ではなく、聖域の数と現在の色相に
  応じてごく僅かに色づく関数に変更(currentBG)。
-->
<script src="ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308}
body{touch-action:none;overscroll-behavior:none;
 -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

let W=1,H=1,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const TAU=Math.PI*2;
// background is no longer a flat constant — it drifts very slightly warmer
// as more of the world becomes permanent, and tracks the current hue so a
// mutate() feels like it touches the whole world, not just the seeds.
function currentBG(presence){
  const [r,g,b]=pal(gHueShift+0.5);
  const br=6+presence*11;
  return `rgb(${Math.round(br+r*0.06)},${Math.round(br*0.82+g*0.05)},${Math.round(br*1.3+b*0.08)})`;
}
function pal(t){
  return [
    Math.round(255*(0.5+0.5*Math.cos(TAU*t))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.33)))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.67))))
  ];
}
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=(t+Math.imul(t^t>>>7,61|t))^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

// ---------- the one recursive motif every seed is built from: a small solid
// core square, surrounded by a rotated frame that is itself surrounded by a
// bigger rotated frame, `depth` times outward. growing outward (not shrinking
// inward) reads as the seed actually swelling as it deepens — the core never
// moves, each new ring just encloses it further out. cheap (depth+1 draws,
// no branching) and unambiguously self-similar. `grow` >1 makes each ring
// bigger than the last; the size is clamped so a fully matured seed still
// reads as one shape instead of a rectangle wandering off past the screen.
// ----------
const NEST_SIZE_CAP_F=1.35; // × min(W,H) — matured seeds may bleed past the edges a little, on purpose
function drawNested(x,y,size,depth,hue,rot,grow,alphaScale){
  if(depth<0||alphaScale<=0.01) return;
  const cap=Math.min(W,H)*NEST_SIZE_CAP_F;
  ctx.save();
  ctx.translate(x,y);
  let s=size;
  for(let i=0;i<=depth;i++){
    const a=alphaScale*(1-(i/(depth+2))*0.42);
    if(a>0.01){
      const [r,g,b]=pal(hue+i*0.05);
      ctx.rotate(rot);
      if(i===0){
        ctx.fillStyle=`rgba(${r},${g},${b},${a*0.55})`;
        ctx.fillRect(-s/2,-s/2,s,s);
      }
      ctx.strokeStyle=`rgba(${r},${g},${b},${a})`;
      ctx.lineWidth=Math.max(0.6,s*0.024);
      ctx.strokeRect(-s/2,-s/2,s,s);
    }else{
      ctx.rotate(rot);
    }
    s=Math.min(cap,s*grow);
  }
  ctx.restore();
}

// ---------- default law: shallow, breathing, never accumulates ----------
const AMBIENT_COUNT=13;
let ambient=[];
function initAmbient(seed){
  const rng=mulberry32(seed);
  ambient=[];
  for(let i=0;i<AMBIENT_COUNT;i++){
    ambient.push({
      fx:0.08+rng()*0.84, fy:0.08+rng()*0.84,
      phase:rng()*TAU, hue:rng(), sizeF:0.045+rng()*0.05
    });
  }
}

// ---------- broken law: born from touch, only ever deepens ----------
const MAX_SANCTUARY=44;
const MAX_DEPTH=9;
const BEAT_SEC=2.15; // one heartbeat = one step deeper, at rest
let sanctuary=[]; // {x,y,hue,depth,prog}
let gGrow=1.16, gRot=0.34, gHueShift=0;

function addSanctuary(x,y){
  if(sanctuary.length>=MAX_SANCTUARY) sanctuary.shift();
  sanctuary.push({x,y,hue:Math.random(),depth:0,prog:0});
}
function resetWorld(){
  sanctuary=[];
  initAmbient((Math.random()*1e9)|0);
}
resetWorld();

// ---------- live: real time drives breathing, heartbeats, and input ----------
let holding=false, holdX=0, holdY=0, lastTap=0, flashAt=-999;
let lastFrameTime=performance.now();

function updateGrowth(dt){
  const baseRate=1/BEAT_SEC;
  for(const s of sanctuary){
    if(s.depth>=MAX_DEPTH){ s.prog=0; continue; }
    let rate=baseRate;
    if(holding){
      const d=Math.hypot(s.x-holdX,s.y-holdY);
      if(d<130) rate+=baseRate*3.4*Math.exp(-d/85);
    }
    s.prog+=dt*rate;
    while(s.prog>=1 && s.depth<MAX_DEPTH){ s.depth++; s.prog-=1; }
  }
}
function renderLive(now){
  const presence=Math.min(1,sanctuary.length/24);
  ctx.fillStyle=currentBG(presence); ctx.fillRect(0,0,W,H);
  const m=Math.min(W,H);
  for(const a of ambient){
    const raw=1.5+1.35*Math.sin(now*0.00032+a.phase);
    const d=Math.max(0,Math.min(3,Math.round(raw)));
    drawNested(a.fx*W,a.fy*H,m*a.sizeF,d,a.hue+gHueShift,gRot,gGrow,0.5);
  }
  for(const s of sanctuary){
    drawNested(s.x,s.y,m*0.05,s.depth,s.hue+gHueShift,gRot,gGrow,0.92);
  }
  const age=(now-flashAt)/1000;
  if(age<0.4){
    const a=Math.max(0,1-age/0.4);
    ctx.fillStyle=`rgba(255,255,255,${0.2*a*a})`;
    ctx.fillRect(0,0,W,H);
  }
}
function loop(){
  const now=performance.now();
  const dt=(now-lastFrameTime)/1000; lastFrameTime=now;
  if(!APKit.isExporting()){
    updateGrowth(Math.min(dt,0.1));
    renderLive(now);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  holdX=e.clientX; holdY=e.clientY; holding=true;
  if(now-lastTap<300){
    for(const s of sanctuary) s.depth=Math.min(MAX_DEPTH,s.depth+1);
    flashAt=now; lastTap=0;
  }else{
    lastTap=now;
    addSanctuary(e.clientX,e.clientY);
  }
},{passive:true});
canvas.addEventListener('pointermove',e=>{
  if(holding){ holdX=e.clientX; holdY=e.clientY; }
},{passive:true});
canvas.addEventListener('pointerup',()=>{holding=false;},{passive:true});
canvas.addEventListener('pointercancel',()=>{holding=false;},{passive:true});

// ---------- GIF export: deterministic, phase-only. sanctuary can't loop while
// growing forever, so the export shows a symbolic birth: it grows to full
// depth by phase π, then only its alpha fades to 0 by phase 2π — matching the
// invisible phase-0 state exactly. the ambient breathing above is already an
// exact function of phase (integer multiple), so it is reused as-is. ----------
let demoSeeds=null;
function buildDemoSeeds(seed){
  const rng=mulberry32(seed);
  const list=[];
  for(let i=0;i<4;i++) list.push({fx:0.2+rng()*0.6, fy:0.2+rng()*0.6, hue:rng()});
  return list;
}
let demoSeed=(Math.random()*1e9)|0;
function renderLoopDemo(phase){
  if(!demoSeeds) demoSeeds=buildDemoSeeds(demoSeed);
  const growE=Math.min(1,phase/Math.PI);
  const fadeE=phase<=Math.PI?1:Math.max(0,1-(phase-Math.PI)/Math.PI);
  ctx.fillStyle=currentBG(growE*fadeE); ctx.fillRect(0,0,W,H);
  const m=Math.min(W,H);
  for(const a of ambient){
    const raw=1.5+1.35*Math.sin(phase*2+a.phase);
    const d=Math.max(0,Math.min(3,Math.round(raw)));
    drawNested(a.fx*W,a.fy*H,m*a.sizeF,d,a.hue+gHueShift,gRot,gGrow,0.5);
  }
  if(fadeE>0.01){
    const depth=Math.round(growE*MAX_DEPTH);
    for(const s of demoSeeds){
      drawNested(s.fx*W,s.fy*H,m*0.05,depth,s.hue+gHueShift,gRot,gGrow,0.92*fadeE);
    }
  }
}

APKit.init({
  canvas:canvas,
  gifName:'sanctuary-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){ renderLoopDemo(phase); },
  buttons:[
    {label:'\u2726',name:'mutate',onClick:function(){
      gHueShift=Math.random();
      gGrow=1.08+Math.random()*0.26;
      gRot=0.16+Math.random()*0.55;
      demoSeed=(Math.random()*1e9)|0; demoSeeds=null;
    }},
    {label:'\u21bb',name:'reset',onClick:function(){
      resetWorld();
      gHueShift=0; gGrow=1.16; gRot=0.34;
      demoSeed=(Math.random()*1e9)|0; demoSeeds=null;
    }}
  ]
});
</script>
</body>
</html>
