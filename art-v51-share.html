<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Share">
<title>Art Playground — 分与 SHARE</title>
<!--
  分与 SHARE (v51) — Claude作 / 改良: ChatGPT / 再設計: Claude(3回目)
  世界のルール: 総質量(半径の二乗の合計)は常に一定。分裂は足し算ではなく
  既存の質量の再配分でしかない。

  1回目は全員同時にパッと分裂する同期モデルで地味だった。2回目は3クラスタ
  +非同期の分裂スケジュールにして常に色々な深さが同時に見えるようにした。
  今回(3回目)は「もっと面白く」というリクエストを受けて、地味さの残る
  部分を派手さで補強:
  - 分裂の瞬間、その場所から白い衝撃波リング(ポン、という視覚的な破裂)
  - まだ再分裂していない兄弟同士を、細い光の糸でつなぐ(血縁が見える)
  - 分裂の間隔を詰めて全体のテンポを速めた
  - ダブルタップは全クラスタを蹴るだけでなく、画面全体が一瞬明るく光る
  衝撃波リングと兄弟の糸は位相だけで決まる純関数なので、GIFループの
  厳密さ(0とTAUで完全一致)は崩れない。ダブルタップの画面フラッシュだけは
  実時間で減衰する演出なので、ライブ表示のみで発生しGIF書き出しには
  一切影響しない。

  → 実機/GIFで見ると「速すぎて何が起きたか分からない」状態だったため
  (4回目・Claude): 分裂の瞬間の弾け(BIRTH_DURATION)を0.11→0.42に伸ばして
  ちゃんと目で追える長さにし、タップ1回で進む量も大幅に減らした(以前は
  タップ数回でアニメーションを飛び越えてしまっていた)。分裂の間隔自体は
  ほぼ維持し、テンポの速さと「見える」ことを両立させた。
-->
<script src="ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040308}
body{touch-action:none;overscroll-behavior:none;
 -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

let W=1,H=1,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const TAU=Math.PI*2;
function pal(t){
  return [
    Math.round(255*(0.5+0.5*Math.cos(TAU*t))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.33)))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.67))))
  ];
}
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=(t+Math.imul(t^t>>>7,61|t))^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

// ---------- each cluster: a fixed tree where every node knows WHEN (in clock
// units 0..PI) it finishes splitting into its two children ----------
const BIRTH_DURATION=0.42;
const CLOCK_LIMIT=Math.PI-0.05;

function buildTree(seed){
  const rng=mulberry32(seed);
  const list=[];
  function make(parentId,tau,x,y,r,hue){
    const id=list.length;
    const node={id,parentId,tau,x,y,r,hue,children:[]};
    list.push(node);
    if(parentId>=0) list[parentId].children.push(id);
    const childTau=tau+0.30+rng()*0.34;
    if(childTau<CLOCK_LIMIT && list.length<140){
      const newR=r/Math.SQRT2;
      const angle=rng()*TAU;
      const push=newR*(0.75+rng()*0.36);
      const dx=push*Math.cos(angle), dy=push*Math.sin(angle);
      make(id,childTau,x-dx,y-dy,newR,hue+(rng()*0.05-0.025));
      make(id,childTau,x+dx,y+dy,newR,hue-(rng()*0.05-0.025));
    }
  }
  make(-1,0,0,0,1,rng());
  return list;
}

// three independent clusters, scattered like the rest of the gallery's pieces
const CLUSTERS=[
  {fx:0.32,fy:0.42},
  {fx:0.68,fy:0.36},
  {fx:0.5,fy:0.7}
];
let baseSeed=(Math.random()*1e9)|0;
function buildAllTrees(){
  return CLUSTERS.map((c,i)=>({ ...c, nodes:buildTree(baseSeed+i*97) }));
}
let clusters=buildAllTrees();

function drawCell(x,y,r,hue,alpha){
  if(alpha<=0.01||r<=0.2) return;
  const [r8,g8,b8]=pal(hue);
  const grad=ctx.createRadialGradient(x,y,0,x,y,r);
  grad.addColorStop(0,`rgba(${r8},${g8},${b8},${0.95*alpha})`);
  grad.addColorStop(1,`rgba(${r8},${g8},${b8},${0.05*alpha})`);
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle=`rgba(${r8},${g8},${b8},${0.7*alpha})`;
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
}
function drawFlash(x,y,r,e){
  const inten=4*e*(1-e); // 0 at e=0 and e=1, peak at e=0.5 — a pure function of e
  if(inten<=0.02) return;
  ctx.strokeStyle=`rgba(255,255,255,${0.6*inten})`;
  ctx.lineWidth=Math.max(0.5,2.4*inten);
  ctx.beginPath(); ctx.arc(x,y,r*(1+e*2.0),0,TAU); ctx.stroke();
}

// recursive: renders whatever this node's lineage looks like at clock time c.
// also records currently-resting leaves into `leaves` so siblings still both
// whole can be connected with a thread afterward.
function drawNode(nodes,node,c,cx,cy,scalePx,wob,leaves){
  const hasKids=node.children.length>0;
  const kidsTau=hasKids?nodes[node.children[0]].tau:Infinity;
  if(!hasKids||c<kidsTau){
    const w=wob(node.id);
    const px=cx+node.x*scalePx+w[0], py=cy+node.y*scalePx+w[1];
    drawCell(px,py,Math.max(0.6,node.r*scalePx), node.hue, 1);
    leaves.push({x:px,y:py,parentId:node.parentId,hue:node.hue});
    return;
  }
  const e=Math.min(1,(c-kidsTau)/BIRTH_DURATION);
  const w0=wob(node.id);
  drawFlash(cx+node.x*scalePx+w0[0], cy+node.y*scalePx+w0[1], Math.max(0.6,node.r*scalePx), e);
  for(const cid of node.children){
    const child=nodes[cid];
    if(e<1){
      const w=wob(child.id);
      const ix=node.x+(child.x-node.x)*e, iy=node.y+(child.y-node.y)*e, ir=node.r+(child.r-node.r)*e;
      const px=cx+ix*scalePx+w[0], py=cy+iy*scalePx+w[1];
      drawCell(px,py,Math.max(0.6,ir*scalePx), child.hue, e);
      if(e>0.7) leaves.push({x:px,y:py,parentId:node.id,hue:child.hue});
    }else{
      drawNode(nodes,child,c,cx,cy,scalePx,wob,leaves);
    }
  }
}

function drawSiblingThreads(leaves){
  const byParent=new Map();
  for(const lf of leaves){
    if(lf.parentId<0) continue;
    (byParent.get(lf.parentId)||byParent.set(lf.parentId,[]).get(lf.parentId)).push(lf);
  }
  for(const pair of byParent.values()){
    if(pair.length!==2) continue;
    const [a,b]=pair;
    const [r,g,b8]=pal((a.hue+b.hue)/2+0.5);
    ctx.strokeStyle=`rgba(${r},${g},${b8},0.3)`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}

function triangleWave(ph){ return 1-Math.abs((ph/Math.PI)-1); } // 0 at 0 & TAU, 1 at PI

function renderClusters(phases){
  ctx.fillStyle='#040308';
  ctx.fillRect(0,0,W,H);
  const m=Math.min(W,H);
  for(let i=0;i<clusters.length;i++){
    const cl=clusters[i];
    const ph=phases[i];
    const c=Math.PI*triangleWave(ph);
    const cx=cl.fx*W, cy=cl.fy*H, scalePx=m*0.13;
    const wob=(id)=>[Math.sin(ph*2+id*0.7+i*3)*3, Math.cos(ph*2+id*1.3+1.7+i*3)*3];
    const leaves=[];
    drawNode(cl.nodes,cl.nodes[0],c,cx,cy,scalePx,wob,leaves);
    drawSiblingThreads(leaves);
  }
}

// ---------- live: each cluster breathes on its own; touch nudges the nearest one ----------
let livePhases=[0,0,0], lastFrameTime=performance.now();
let rateMul=[1,1,1], heldCluster=-1;
let dtFlashAt=-999; // real-time double-tap screen pulse (live only, never exported)

function loop(){
  const now=performance.now();
  const dt=(now-lastFrameTime)/1000; lastFrameTime=now;
  if(!APKit.isExporting()){
    for(let i=0;i<3;i++){
      const target=(i===heldCluster)?4.2:1;
      rateMul[i]+=(target-rateMul[i])*0.08;
      livePhases[i]=(livePhases[i]+dt*(TAU/APKit.LOOP_DUR)*rateMul[i])%TAU;
    }
    renderClusters(livePhases);
    const age=(now-dtFlashAt)/1000;
    if(age<0.4){
      const a=Math.max(0,1-age/0.4);
      ctx.fillStyle=`rgba(255,255,255,${0.22*a*a})`;
      ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- input: tap/hold act on whichever cluster is closest to the touch ----------
function nearestCluster(x,y){
  let best=0, bestD=Infinity;
  for(let i=0;i<clusters.length;i++){
    const d=Math.hypot(clusters[i].fx*W-x, clusters[i].fy*H-y);
    if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
let lastTap=0;
canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  const idx=nearestCluster(e.clientX,e.clientY);
  if(now-lastTap<300){
    for(let i=0;i<3;i++) livePhases[i]=(livePhases[i]+TAU*0.16)%TAU; // double tap: kick everyone
    dtFlashAt=now;
    lastTap=0;
  }else{
    lastTap=now;
    livePhases[idx]=(livePhases[idx]+TAU*0.06)%TAU; // tap: kick the nearest cluster
  }
  heldCluster=idx;
},{passive:true});
canvas.addEventListener('pointerup',()=>{ heldCluster=-1; },{passive:true});
canvas.addEventListener('pointercancel',()=>{ heldCluster=-1; },{passive:true});

// ---------- shared kit: clock, fullscreen, GIF ----------
// renderClusters is a pure function of the phase array — for export every
// cluster is driven by the SAME phase ap-kit hands us, so the whole frame is a
// pure function of that one number with period TAU: an exact loop. The
// double-tap screen flash is drawn only from the live loop(), never here.
APKit.init({
  canvas:canvas,
  gifName:'share-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){ renderClusters([phase,phase,phase]); },
  buttons:[
    {label:'\u2726',name:'mutate',onClick:function(){
      baseSeed=(Math.random()*1e9)|0;
      clusters=buildAllTrees();
    }},
    {label:'\u21bb',name:'reset',onClick:function(){
      baseSeed=(Math.random()*1e9)|0;
      clusters=buildAllTrees();
      livePhases=[0,0,0];
    }}
  ]
});
</script>
</body>
</html>
