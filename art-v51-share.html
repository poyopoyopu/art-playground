<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Share">
<title>Art Playground — 分与 SHARE</title>
<!--
  分与 SHARE (v51) — Claude作 / 改良: ChatGPT / 再設計: Claude
  世界のルール: 総質量(半径の二乗の合計)は常に一定。分裂は足し算ではなく
  既存の質量の再配分でしかない。
  再設計の理由: 以前のバージョンは「たまに1個だけランダムに分裂する」自律
  挙動で、地味で退屈な上、GIFループも作れなかった(蓄積された乱数状態は
  同じ姿に戻らないため)。今回は最初から「ひとつの決まった木構造が、一定の
  周期でπまで開いてπから2πでまた同じ姿に閉じる」呼吸として設計し直した。
  開閉は同じ関数を位相(0〜2π)だけで駆動しているので、ライブでもGIF書き出し
  でも数式として厳密に同じ姿に戻ってくる — 継ぎ目のない完全ループ。
  タップは呼吸を一段先へ蹴る、長押しは呼吸を一時的に速める、ダブルタップは
  大きく蹴る、✦は次の呼吸の木の形そのものを引き直す。
-->
<script src="ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040308}
body{touch-action:none;overscroll-behavior:none;
 -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});

let W=1,H=1,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const TAU=Math.PI*2;
function pal(t){
  return [
    Math.round(255*(0.5+0.5*Math.cos(TAU*t))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.33)))),
    Math.round(255*(0.5+0.5*Math.cos(TAU*(t+0.67))))
  ];
}

// ---------- a fixed, seeded binary tree — the same shape every breath ----------
const MAXDEPTH=6;
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=(t+Math.imul(t^t>>>7,61|t))^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function buildTree(seed){
  const rng=mulberry32(seed);
  const list=[];
  function make(parentId,depth,x,y,r,hue){
    const id=list.length;
    const node={id,parentId,depth,x,y,r,hue,children:[]};
    list.push(node);
    if(parentId>=0) list[parentId].children.push(id);
    if(depth<MAXDEPTH){
      const newR=r/Math.SQRT2;
      const angle=rng()*TAU;
      const push=newR*(0.75+rng()*0.36);
      const dx=push*Math.cos(angle), dy=push*Math.sin(angle);
      make(id,depth+1,x-dx,y-dy,newR,hue+(rng()*0.05-0.025));
      make(id,depth+1,x+dx,y+dy,newR,hue-(rng()*0.05-0.025));
    }
  }
  make(-1,0,0,0,1,rng());
  return list;
}
let treeSeed=(Math.random()*1e9)|0;
let nodes=buildTree(treeSeed);

// ---------- pure function of phase: this is the whole loop ----------
function triangleWave(ph){ return 1-Math.abs((ph/Math.PI)-1); } // 0 at 0 and TAU, 1 at PI
function easeInOut(x){ return x*x*(3-2*x); }

function drawCell(x,y,r,hue,alpha){
  if(alpha<=0.01||r<=0.2) return;
  const [r8,g8,b8]=pal(hue);
  const grad=ctx.createRadialGradient(x,y,0,x,y,r);
  grad.addColorStop(0,`rgba(${r8},${g8},${b8},${0.95*alpha})`);
  grad.addColorStop(1,`rgba(${r8},${g8},${b8},${0.05*alpha})`);
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle=`rgba(${r8},${g8},${b8},${0.7*alpha})`;
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
}

function renderAtPhase(ph){
  const t=MAXDEPTH*triangleWave(ph);
  const flo=Math.min(MAXDEPTH,Math.floor(t)), frac=t-flo;

  ctx.fillStyle='#040308';
  ctx.fillRect(0,0,W,H);

  const cx=W/2, cy=H/2, scalePx=Math.min(W,H)*0.17;
  // a small organic wobble, driven by phase itself (2 full cycles per breath)
  // so it closes the loop exactly like everything else here
  function wobble(id){
    return [Math.sin(ph*2+id*0.7)*3, Math.cos(ph*2+id*1.3+1.7)*3];
  }

  for(const n of nodes){
    if(n.depth!==flo) continue;
    const wn=wobble(n.id);
    const px=cx+n.x*scalePx+wn[0], py=cy+n.y*scalePx+wn[1], pr=Math.max(0.6,n.r*scalePx);
    drawCell(px,py,pr,n.hue,1);
    if(n.depth<MAXDEPTH && frac>0.001){
      const e=easeInOut(frac);
      for(const cid of n.children){
        const c=nodes[cid];
        const wc=wobble(c.id);
        const ix=cx+(n.x+(c.x-n.x)*e)*scalePx+wc[0];
        const iy=cy+(n.y+(c.y-n.y)*e)*scalePx+wc[1];
        const ir=Math.max(0.6,(n.r+(c.r-n.r)*e)*scalePx);
        drawCell(ix,iy,ir,c.hue,e);
      }
    }
  }
}

// ---------- live: the breath advances on its own, touch just kicks it ----------
let livePhase=0, lastFrameTime=performance.now();
let rateMul=1, holding=false;

function loop(){
  const now=performance.now();
  const dt=(now-lastFrameTime)/1000; lastFrameTime=now;
  if(!APKit.isExporting()){
    const targetRate=holding?4.2:1;
    rateMul+=(targetRate-rateMul)*0.08;
    livePhase=(livePhase+dt*(TAU/APKit.LOOP_DUR)*rateMul)%TAU;
    renderAtPhase(livePhase);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- input: tap kicks the breath forward, hold speeds it up ----------
let lastTap=0;
canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  if(now-lastTap<300){
    livePhase=(livePhase+TAU*0.4)%TAU; // double tap: a big kick
    lastTap=0;
  }else{
    lastTap=now;
    livePhase=(livePhase+TAU*0.14)%TAU; // tap: a kick
  }
  holding=true;
},{passive:true});
canvas.addEventListener('pointerup',()=>{ holding=false; },{passive:true});
canvas.addEventListener('pointercancel',()=>{ holding=false; },{passive:true});

// ---------- shared kit: clock, fullscreen, GIF ----------
// renderAtPhase is a pure function of phase with period TAU, so loopFrame just
// calls it directly — this is a mathematically exact, seamless loop.
APKit.init({
  canvas:canvas,
  gifName:'share-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){ renderAtPhase(phase); },
  buttons:[
    {label:'\u2726',name:'mutate',onClick:function(){
      treeSeed=(Math.random()*1e9)|0;
      nodes=buildTree(treeSeed);
    }},
    {label:'\u21bb',name:'reset',onClick:function(){
      treeSeed=(Math.random()*1e9)|0;
      nodes=buildTree(treeSeed);
      livePhase=0;
    }}
  ]
});
</script>
</body>
</html>
