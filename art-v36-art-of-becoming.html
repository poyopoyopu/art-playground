<title>Art Playground — ART OF BECOMING</title>
<!--
  ART OF BECOMING (v30) — based on LIVING LAW
  Base: ChatGPT. Revisions: Claude.
  The change of principle in this revision: a touch no longer applies a force that
  fades. It writes into a law texture that the shader reads every frame, so the
  region you touched keeps obeying what you wrote there after you let go.
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#020207;color:#fff;
 font-family:system-ui,-apple-system,sans-serif}
body{height:100dvh;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.controls{position:fixed;z-index:6;right:4vw;bottom:max(3.5vh,env(safe-area-inset-bottom));
 display:flex;gap:8px;transition:opacity .6s}
.controls.idle{opacity:0;pointer-events:none}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff25;background:#05050bd9;color:#fff;
 font-size:14px;box-shadow:0 4px 18px #0008;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.92)}
.btn.act{border-color:#ffffff60;background:#ffffff1e}
.flash{position:fixed;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen;
 transition:opacity .08s}

/* clock — same spec as v27: centred, seconds held back, tabular figures, heavy
   shadow so it survives the brightest part of the field */
.clock{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
 flex-direction:column;align-items:center;gap:6px;
 font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
 pointer-events:none;user-select:none;-webkit-user-select:none}
.clock.on{display:flex}
.clock .t{font-size:clamp(44px,16.5vw,132px);line-height:1;font-weight:600;letter-spacing:.01em;color:#fff;
 text-shadow:0 0 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.9),0 4px 34px rgba(0,0,0,.85)}
.clock .t i{font-style:normal;opacity:.62}
.clock .d{font-size:clamp(11px,3.3vw,17px);letter-spacing:.3em;opacity:.62;
 text-shadow:0 0 3px rgba(0,0,0,.95),0 2px 16px rgba(0,0,0,.9)}

.toast{position:fixed;z-index:7;left:50%;bottom:calc(max(3.5vh,env(safe-area-inset-bottom)) + 52px);
 transform:translateX(-50%);max-width:78vw;padding:11px 18px;border-radius:14px;background:#0a0a16d8;
 border:1px solid #ffffff1f;backdrop-filter:blur(10px);font-size:12px;line-height:1.6;text-align:center;
 opacity:0;transition:opacity .35s;pointer-events:none}
.toast.on{opacity:1}

.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
 background:#000b;backdrop-filter:blur(18px)}
.sheet.on{display:flex}
.card{width:min(88vw,360px);padding:22px;border:1px solid #ffffff20;border-radius:20px;background:#080812ee;
 text-align:center;box-shadow:0 20px 80px #000}
.card h2{margin:0 0 8px;font-size:13px;letter-spacing:.2em}
.card p{margin:0;font-size:11px;line-height:1.7;opacity:.6}
.card img{max-width:100%;max-height:42vh;margin-top:14px;border-radius:12px;border:1px solid #ffffff1a}
.bar{height:3px;margin:16px 0;background:#ffffff12;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ad9ff,#ff7ad9);transition:width .12s}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.acts button,.acts a{padding:9px 18px;border:1px solid #ffffff25;border-radius:20px;background:none;color:#fff;
 font-size:10px;letter-spacing:.16em;text-decoration:none}
</style>

<canvas id="c"></canvas>

<script>
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<div style="padding:30px">WebGL2対応ブラウザが必要です。</div>';throw Error('WebGL2')}

const VS=`#version 300 es
precision highp float;in vec2 a;out vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;

/* ---------------------------------------------------------------------------
   LAW SHADER
   A small persistent texture holding, per place on screen, what the rules are:
     R  extra symmetry written here
     G  standing twist (0.5 = none, away from 0.5 = turned one way or the other)
     B  extra density / colour shift
   A finger adds to it. Nothing else erases it. It bleeds into its neighbours
   extremely slowly, so borders soften but the region itself stays for minutes.
   --------------------------------------------------------------------------- */
const LAW_FS=`#version 300 es
precision highp float;
out vec4 o;in vec2 uv;
uniform sampler2D prevLaw;
uniform vec2 lawRes;
uniform float aspect,dtn,wipe;
uniform int touchCount;
uniform vec4 touch[5];
void main(){
  vec4 L=texture(prevLaw,uv);
  vec2 px=1.0/lawRes;
  vec4 n=(texture(prevLaw,uv+vec2(px.x,0.))+texture(prevLaw,uv-vec2(px.x,0.))
         +texture(prevLaw,uv+vec2(0.,px.y))+texture(prevLaw,uv-vec2(0.,px.y)))*.25;
  // Bleed into the neighbours, and fade toward neutral — both deliberately
  // slow. Measured at 60fps: ~96% of what you wrote is still there after a
  // minute, ~84% after five. Borders soften; the region itself stays.
  L=mix(L,n,clamp(.0025*dtn,0.,1.));
  vec4 neutral=vec4(0.,.5,0.,1.);
  L=mix(L,neutral,clamp(.00001*dtn,0.,1.));
  for(int i=0;i<5;i++){
    if(i<touchCount){
      vec2 d=uv-touch[i].xy; d.x*=aspect;
      float w=exp(-dot(d,d)/(touch[i].z*touch[i].z+1e-5));
      L.r+=w*dtn*.0075;
      L.g+=w*dtn*.0090*touch[i].w;
      L.b+=w*dtn*.0060;
    }
  }
  L=mix(L,neutral,wipe);
  o=vec4(clamp(L.r,0.,1.),clamp(L.g,0.,1.),clamp(L.b,0.,1.),1.);
}`;

const MAIN_FS=`#version 300 es
precision highp float;
out vec4 o; in vec2 uv;
uniform vec2 res;
uniform float time,seed,law,energy,chaos;
uniform float loopMode,phase,loopDur,maxR;
uniform int touchCount;
uniform vec4 touch[5];
uniform sampler2D prev;
uniform sampler2D lawTex;
#define PI 3.14159265359
#define TAU 6.28318530718

float T(float k){
  float cycles=max(1.0,floor(k*loopDur/TAU+0.5));
  return mix(time*k,cycles*phase,loopMode);
}
float hash21(vec2 p){
  p=fract(p*vec2(127.1,311.7)); p+=dot(p,p+34.7);
  return fract(p.x*p.y);
}
float n2(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
             mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
}
mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}

vec3 palette(float t){
  vec3 a=vec3(.50,.48,.50);
  vec3 b=vec3(.50,.50,.50);
  vec3 c=vec3(1.0,.92,.86);
  vec3 d=vec3(.00,.18,.36);
  return a+b*cos(TAU*(c*t+d));
}

/* A recursive "living glass" field.
   Each pass folds the same world at a different scale. The result is not a
   collection of objects: the entire coordinate system is continuously rewritten. */
vec2 livingFold(vec2 p,float lawv,float twist){
  float drift=T(.18);
  for(int i=0;i<5;i++){
    p=abs(p);
    if(p.x<p.y)p=p.yx;
    float k=float(i);
    p.x-=.48+.08*sin(lawv+k*1.7);
    p*=rot(.38+twist*.55+sin(drift+k*.9)*.13);
    p*=1.22+k*.065;
    p-=sin(p.yx*vec2(1.7,2.1)+drift+k)*.055*(.8+chaos);
  }
  return p;
}

float field(vec2 p,float L,float sym,float den){
  float r=length(p);
  float a=atan(p.y,p.x);
  float sectors=5.0+floor(sym*10.0)+floor(L*.55);
  float rings=7.0+floor(den*9.0)+floor(L*.35);

  float aa=a*sectors+sin(r*8.0-T(.31))*(.34+.16*chaos);
  float radial=sin(r*rings*PI-T(.47)+sin(a*3.0+T(.12))*1.35);
  float spoke=sin(aa+sin(r*6.0-T(.22))*.75);

  vec2 h=livingFold(p*(1.02+den*.42+L*.018),L,(sym-.5)*2.0);
  float glass=sin((h.x+h.y)*15.0-T(.26))*sin((h.x-h.y)*11.0+T(.37));

  float ripple=sin(r*21.0-a*3.0+T(.14));
  float weave=sin((p.x*9.0+p.y*13.0)+sin(p.y*7.0+T(.21)));

  return radial*.28+spoke*.25+glass*.24+ripple*.13+weave*.10;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
  float L=law;
  vec4 LW=texture(lawTex,uv);
  float sym=LW.r;
  float twist=(LW.g-.5)*2.0;
  float den=LW.b;

  /* The whole field breathes. It is deliberately slow enough to feel alive,
     not like a screensaver. */
  float breath=sin(T(.073)+length(p)*5.0)*.018;
  vec2 q=p*(1.0+breath);

  /* Persistent law first: a touched region changes the coordinate grammar
     that all later layers inherit. */
  q=rot(twist*2.7+sin(T(.041))*0.06)*q;
  float rr=length(q);
  float ang=atan(q.y,q.x);
  q*=1.0+sin(ang*(7.0+sym*9.0)+T(.16))*rr*.035*(.6+den);

  for(int i=0;i<3;i++){
    float k=float(i);
    q=rot(sin(T(.052+k*.021)+k*2.0)*(.11+.10*chaos))*q;
    float s=1.28+k*.46+L*.025+den*.28;
    q=livingFold(q*s,L+k*.17,twist);
    q*=1.0/(1.0+length(q)*.105);
  }

  float touchEnergy=0.0;
  for(int i=0;i<5;i++){
    if(i<touchCount){
      vec2 tp=(touch[i].xy-.5*res)/min(res.x,res.y);
      float d=length(p-tp);
      float w=exp(-d*d/(touch[i].z*touch[i].z+.0001));
      touchEnergy+=w;
      q=rot(w*(1.5+L*.28)*touch[i].w)*q;
      q+=(tp-p)*w*(.12+.34*energy);
      q*=1.0+w*.10;
    }
  }

  float f=field(q+vec2(sin(q.y*4.3+T(.11)),cos(q.x*4.1-T(.17)))*.022*(1.0+chaos),
                L,sym,den);

  float micro=n2(q*10.0+f*2.4)*.30;
  micro+=n2(q*27.0-f*3.1)*.12;
  float structure=sin((f+micro)*8.2+L*.9+T(.27))
                +.42*sin((f+micro)*19.0-T(.39))
                +.17*sin((f+micro)*41.0+T(.61));

  float radius=length(p);
  float hue=.02+f*.32+structure*.055+L*.018
            +radius*.17+sym*.50+den*.25;

  /* Multi-band color: large color continents with fine stained-glass grain. */
  vec3 col=palette(hue);
  vec3 alt=palette(hue+.19+f*.07);
  float bands=smoothstep(-.15,.72,sin(f*5.0+structure*.7+T(.13)));
  col=mix(col,alt,bands*.42);

  float luminous=.72+.30*sin(f*6.0+T(.24))+touchEnergy*.55;
  col*=luminous;
  col+=palette(hue+.47)*touchEnergy*.32;

  float seam=abs(sin((q.x+q.y)*13.0+f*5.0)*sin((q.x-q.y)*17.0-f*4.0));
  seam=pow(seam,14.0);
  col+=(.25+.75*palette(hue+.5))*seam*.24;

  /* Gentle feedback makes the field remember its previous shape without
     ever accumulating particles. */
  vec3 old=texture(prev,uv).rgb;
  col=mix(col,old,.045+.040*(1.0-chaos));

  float d=length(p)/maxR;
  float vign=1.0-smoothstep(.62,1.15,d);
  col*=.88+.12*vign;

  o=vec4(pow(max(col,0.0),vec3(.88)),1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  return s;
}
function link(fsSrc){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fsSrc));
  gl.bindAttribLocation(p,0,'a');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  return p;
}
const prog=link(MAIN_FS), lawProg=link(LAW_FS);

const quad=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
function bindQuad(){gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);}

const U={};
['res','time','seed','law','energy','chaos','loopMode','phase','loopDur','maxR','touchCount','prev','lawTex']
 .forEach(k=>U[k]=gl.getUniformLocation(prog,k));
const UT=[];for(let i=0;i<5;i++)UT.push(gl.getUniformLocation(prog,'touch['+i+']'));
const LU={};
['prevLaw','lawRes','aspect','dtn','wipe','touchCount'].forEach(k=>LU[k]=gl.getUniformLocation(lawProg,k));
const LUT=[];for(let i=0;i<5;i++)LUT.push(gl.getUniformLocation(lawProg,'touch['+i+']'));

let W=1,H=1,dpr=1,A=null,B=null;
let law=3.8,targetLaw=3.8,energy=.35,chaos=.58,seed=Math.random()*1000;
let last=performance.now(),lastMutate=performance.now(),exporting=false,wipeFlag=0;
const fingers=new Map();

const LAWRES=160;
let lawA=null,lawB=null;

function tex(w,h){
  const x=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,x);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return x;
}
const fbo=gl.createFramebuffer();
function bindTarget(t,w,h){
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.viewport(0,0,w,h);
}
function clearTo(t,w,h,r,g,b){
  bindTarget(t,w,h);gl.clearColor(r,g,b,1);gl.clear(gl.COLOR_BUFFER_BIT);
}

function initLaw(){
  if(lawA)gl.deleteTexture(lawA);
  if(lawB)gl.deleteTexture(lawB);
  lawA=tex(LAWRES,LAWRES);lawB=tex(LAWRES,LAWRES);
  clearTo(lawA,LAWRES,LAWRES,0,.5,0);
  clearTo(lawB,LAWRES,LAWRES,0,.5,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
initLaw();

function resize(){
  const r=c.getBoundingClientRect();
  const vw=Math.max(1,Math.round(r.width)),vh=Math.max(1,Math.round(r.height));
  dpr=Math.min(devicePixelRatio||1,1.65);
  const nw=Math.max(1,Math.floor(vw*dpr)),nh=Math.max(1,Math.floor(vh*dpr));
  if(nw===W&&nh===H&&A)return;
  W=nw;H=nh;c.width=W;c.height=H;
  if(A)gl.deleteTexture(A);
  if(B)gl.deleteTexture(B);
  A=tex(W,H);B=tex(W,H);
  clearTo(A,W,H,.005,.003,.012);clearTo(B,W,H,.005,.003,.012);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
}
let rq=0;
function queue(){if(rq)return;rq=1;requestAnimationFrame(()=>{rq=0;resize()})}
new ResizeObserver(queue).observe(c);
addEventListener('resize',queue,{passive:true});
addEventListener('orientationchange',()=>setTimeout(queue,120),{passive:true});
if(window.visualViewport)visualViewport.addEventListener('resize',queue,{passive:true});
resize();

function swap(){const x=A;A=B;B=x}
function swapLaw(){const x=lawA;lawA=lawB;lawB=x}

function mutate(power){
  power=power||1;
  seed=Math.random()*1000;
  targetLaw=1.5+Math.random()*9.5;
  chaos=Math.max(.18,Math.min(1,chaos+(Math.random()-.35)*.38*power));
  energy=Math.min(1,energy+.55*power);
  const f=document.getElementById('flash');
  f.style.opacity=.09;setTimeout(()=>f.style.opacity=0,90);
}

// ---- law pass: paint what the fingers are writing, then keep it ----
function stepLaw(dtn){
  gl.useProgram(lawProg);bindQuad();
  bindTarget(lawB,LAWRES,LAWRES);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,lawA);
  gl.uniform1i(LU.prevLaw,0);
  gl.uniform2f(LU.lawRes,LAWRES,LAWRES);
  gl.uniform1f(LU.aspect,W/H);
  gl.uniform1f(LU.dtn,dtn);
  gl.uniform1f(LU.wipe,wipeFlag);
  const n=Math.min(5,fingers.size);
  gl.uniform1i(LU.touchCount,n);
  let i=0;
  for(const p of fingers.values()){
    if(i>=5)break;
    gl.uniform4f(LUT[i],p.x*dpr/W,1.0-p.y*dpr/H,p.r*dpr/Math.min(W,H),p.spin);
    i++;
  }
  for(;i<5;i++)gl.uniform4f(LUT[i],0,0,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  swapLaw();
  wipeFlag=0;
}

function setUniforms(nowSec,loopModeV,phaseV){
  gl.useProgram(prog);bindQuad();
  gl.uniform2f(U.res,W,H);
  gl.uniform1f(U.time,nowSec);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.law,law);
  gl.uniform1f(U.energy,energy);
  gl.uniform1f(U.chaos,chaos);
  gl.uniform1f(U.loopMode,loopModeV);
  gl.uniform1f(U.phase,phaseV);
  gl.uniform1f(U.loopDur,LOOP_DUR);
  gl.uniform1f(U.maxR,Math.hypot(W*.5,H*.5)/Math.min(W,H));
  gl.uniform1i(U.prev,0);
  gl.uniform1i(U.lawTex,1);
  const n=Math.min(5,fingers.size);
  gl.uniform1i(U.touchCount,n);
  let i=0;
  for(const p of fingers.values()){
    if(i>=5)break;
    gl.uniform4f(UT[i],p.x*dpr,H-p.y*dpr,p.r*dpr,p.spin);
    i++;
  }
  for(;i<5;i++)gl.uniform4f(UT[i],0,0,0,0);
}
function drawMain(){
  bindTarget(B,W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lawA);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,B);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  swap();
}

const LOOP_DUR=3.0;
function frame(now){
  if(exporting){requestAnimationFrame(frame);return}
  const dt=Math.min(.04,(now-last)/1000);last=now;
  energy*=Math.pow(.25,dt);
  law+=(targetLaw-law)*Math.min(1,dt*.7);
  // the original rolled a 2.5% die every 6.2s, so the world re-invented itself
  // roughly once every four minutes; this makes it a real event on a real clock
  if(now-lastMutate>26000){if(Math.random()<.5)mutate(.45);lastMutate=now;}
  stepLaw(dt*60);
  setUniforms(now*.001,0,0);
  drawMain();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- input ----------
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{c.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);
  fingers.set(e.pointerId,{x:p.x,y:p.y,r:Math.min(innerWidth,innerHeight)*.13,spin:e.shiftKey?-1:1});
  energy=Math.min(1,energy+.3);
  if(fingers.size===2){targetLaw+=1.7;chaos=Math.min(1,chaos+.2)}
  document.getElementById('label').classList.add('hide');
  bumpIdle();
},{passive:false});
c.addEventListener('pointermove',e=>{
  const q=fingers.get(e.pointerId);if(!q)return;
  const p=pos(e),dx=p.x-q.x,dy=p.y-q.y;
  q.x=p.x;q.y=p.y;
  q.r=Math.max(20,Math.min(Math.min(innerWidth,innerHeight)*.3,Math.hypot(dx,dy)*3+18));
  q.spin=Math.max(-1.4,Math.min(1.4,(dx-dy)/Math.min(innerWidth,innerHeight)*9));
  energy=Math.min(1,energy+.024);
  targetLaw=Math.max(1,Math.min(12,targetLaw+(dx+dy)/Math.min(innerWidth,innerHeight)*.018));
  if(fingers.size>1)chaos=Math.min(1,chaos+.008);
},{passive:true});
function up(e){fingers.delete(e.pointerId);if(!fingers.size)energy*=.45}
c.addEventListener('pointerup',up);
c.addEventListener('pointercancel',up);
c.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- shared kit: clock, fullscreen, GIF ----------
APKit.init({
  canvas:c, gifName:'art-of-becoming-loop', clockFormat:'spec', dock:true, autoHide:true, fullscreenButton:false,
  loopFrame:(phase)=>{ exporting=true; setUniforms(0,1,phase); drawMain(); },
  onExportEnd:()=>{ exporting=false; last=performance.now(); },
  buttons:[
    {label:'✦',name:'mutate',onClick:()=>mutate(1)},
    {label:'↻',name:'wipe',onClick:()=>{wipeFlag=1;APKit.toast('書き込まれた法則を消しました')}}
  ]
});
setTimeout(()=>{const l=document.getElementById('label');if(l)l.classList.add('hide')},9000);
</script>
