<!doctype html><html><head><title>PARALLAX</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020208">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020208;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:14px;z-index:5;transition:opacity .5s}
button{width:74px;height:58px;border:1px solid #333;border-radius:30px;background:#09090eaa;color:#fff;font-size:21px;backdrop-filter:blur(10px)}
button:active{transform:scale(.94)}
#clock{position:fixed;inset:0;display:none;place-items:center;z-index:4;pointer-events:none;text-align:center}
#clock .t{font-size:clamp(52px,14vw,120px);font-weight:300;letter-spacing:.04em}
#clock i{font-style:normal;opacity:.38;font-size:.5em}.d{font-size:14px;opacity:.55;margin-top:5px}
#hint{position:fixed;left:50%;top:12%;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;opacity:.35;pointer-events:none;z-index:3}
</style>
</head><body>
<canvas id="c"></canvas><div id="hint">PARALLAX — DEPTH IS LYING</div>
<div id="clock"><div><div class="t"></div><div class="d"></div></div></div>
<div id="ui"><button id="resetBtn">↻</button><button id="clockBtn">◷</button><button id="fsBtn">⛶</button></div>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,D,t=0,mx=.5,my=.5;
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);
c.onpointermove=e=>{mx=e.clientX/W;my=e.clientY/H};
function frame(){
 t+=.01;g.fillStyle='#020208';g.fillRect(0,0,W,H);let cx=W/2,cy=H/2,M=Math.min(W,H);
 for(let L=34;L>=1;L--){let z=L/34,scale=.25+z*.95,rot=t*(.35-z*.2)+mx*2;
   g.save();g.translate(cx+(mx-.5)*M*z*.35,cy+(my-.5)*M*z*.35);g.rotate(rot);
   let sides=6+(L%4),R=M*(.07+z*.31);
   g.beginPath();for(let k=0;k<=sides;k++){let a=k*Math.PI*2/sides+Math.sin(t+L)*.12;let rr=R*(1+.08*Math.sin(a*5+t*2+L));let xx=Math.cos(a)*rr,yy=Math.sin(a)*rr;if(k)g.lineTo(xx,yy);else g.moveTo(xx,yy)}g.closePath();
   g.strokeStyle=`hsla(${(L*10+t*45)%360},100%,65%,${.03+z*.06})`;g.lineWidth=1+z*2;g.stroke();
   // cross-linked chords create depth ambiguity rather than a flow field
   for(let q=0;q<4;q++){let a=t*.4+q*Math.PI/2+L*.17,b=a+Math.PI*(.6+.08*Math.sin(L));
     g.beginPath();g.moveTo(Math.cos(a)*R,Math.sin(a)*R);g.quadraticCurveTo(0,0,Math.cos(b)*R,Math.sin(b)*R);g.strokeStyle=`hsla(${(L*17+q*70+t*30)%360},100%,70%,.055)`;g.stroke()}
   g.restore();
 }requestAnimationFrame(frame)}frame();
</script><script>
const clock=document.querySelector('#clock'), ui=document.querySelector('#ui');
let clockOn=false, wake=null;
function tick(){
 const d=new Date(), p=n=>String(n).padStart(2,'0');
 clock.querySelector('.t').innerHTML=`${p(d.getHours())}:${p(d.getMinutes())}:<i>${p(d.getSeconds())}</i>`;
 clock.querySelector('.d').textContent=`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
document.querySelector('#clockBtn').onclick=async()=>{
 clockOn=!clockOn; clock.style.display=clockOn?'grid':'none'; document.querySelector('#clockBtn').style.background=clockOn?'#fff':'#09090eaa'; document.querySelector('#clockBtn').style.color=clockOn?'#000':'#fff';
 if(clockOn && 'wakeLock' in navigator){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
 else if(wake){try{await wake.release()}catch(e){} wake=null}
 tick();
};
setInterval(tick,250);
document.querySelector('#fsBtn').onclick=()=>document.documentElement.requestFullscreen?.();
let idle;
function showUI(){ui.style.opacity=1;clearTimeout(idle);idle=setTimeout(()=>{if(clockOn)ui.style.opacity=.18},4000)}
addEventListener('pointermove',showUI); addEventListener('pointerdown',showUI);
document.querySelector('#resetBtn').onclick=()=>location.reload();
</script></body></html>
