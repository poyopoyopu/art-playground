<canvas id="c"></canvas>
<div class="ui">
<div class="label">ART PLAYGROUND · USAGI</div>
<button id="regen">↻</button>
<div class="hint">うさぎは静かに、世界だけが生きている</div>
</div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d');
const img=document.getElementById('base');
let W,H,D,t=0,seed=1,pts=[],rings=[],bursts=[],last=0;

const colors=[[255,75,155],[255,164,55],[255,228,100],[255,255,255],[190,105,255],[115,220,255]];

function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function col(a){return colors[a%colors.length]}
function rgb(a,alpha){return `rgba(${a[0]},${a[1]},${a[2]},${alpha})`}

function resize(){
 D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 build();
}
function build(){
 seed=(Date.now()>>>0);pts=[];rings=[];bursts=[];
 // fixed population: nothing accumulates
 for(let i=0;i<520;i++){
   const a=rnd()*Math.PI*2;
   const rr=Math.pow(rnd(),.72)*Math.min(W,H)*.46;
   pts.push({
     a,r:rr,base:rr,sp:.08+rnd()*.32,
     size:.5+rnd()*2.3,phase:rnd()*Math.PI*2,
     c:(rnd()*colors.length)|0,orbit:.3+rnd()*1.2
   });
 }
 for(let i=0;i<13;i++) rings.push({
   a:rnd()*6.28, r:Math.min(W,H)*(.22+i*.018),
   w:1+rnd()*2, phase:rnd()*6.28, c:(rnd()*colors.length)|0
 });
}

function fit(){
 const s=Math.min(W/img.naturalWidth,H/img.naturalHeight);
 const iw=img.naturalWidth*s, ih=img.naturalHeight*s;
 return {x:(W-iw)/2,y:(H-ih)/2,w:iw,h:ih};
}

// Approximate exclusion mask for the original bunny.
// The base image is NEVER transformed or redrawn by the animation.
function insideBunny(x,y,F){
 const cx=W*.5, cy=H*.44;
 // ears
 const e1=((x-(cx-W*.075))/(W*.055))**2+((y-(cy-H*.20))/(H*.105))**2;
 const e2=((x-(cx+W*.075))/(W*.055))**2+((y-(cy-H*.20))/(H*.105))**2;
 // head/body merged
 const head=((x-cx)/(W*.245))**2+((y-(cy+H*.01))/(H*.19))**2;
 const body=((x-cx)/(W*.20))**2+((y-(cy+H*.205))/(H*.18))**2;
 return e1<1 || e2<1 || head<1 || body<1;
}

function auraPoint(p,time){
 const cx=W*.5,cy=H*.44;
 const wave=Math.sin(time*p.orbit+p.phase);
 // Non-orbiting deformation: radius breathes and angle drifts irregularly
 p.a += p.sp*.004;
 let rr=p.base*(1+.055*Math.sin(time*.55+p.phase)+.018*Math.sin(time*1.7+p.phase*2));
 let ang=p.a + .035*Math.sin(time*.31+p.phase);
 let x=cx+Math.cos(ang)*rr*(W/H);
 let y=cy+Math.sin(ang)*rr;
 // gently bend the field toward a living contour
 x += Math.sin(ang*3+time*.35+p.phase)*18*wave;
 y += Math.cos(ang*2-time*.28+p.phase)*13*wave;
 return [x,y];
}

function drawRibbon(time,r){
 const cx=W*.5,cy=H*.44;
 const n=150;
 ctx.beginPath();
 for(let i=0;i<=n;i++){
   const a=r.a+i/n*Math.PI*2;
   const wob=1+0.035*Math.sin(time*.6+r.phase+i*.13)+0.018*Math.sin(time*1.9+i*.37);
   const rad=r.r*wob;
   let x=cx+Math.cos(a)*rad*(W/H),y=cy+Math.sin(a)*rad;
   // create deliberate breaks around the bunny so the center remains pristine
   const near=Math.abs(Math.sin(a));
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 const cc=col(r.c);
 ctx.strokeStyle=rgb(cc,.12);ctx.lineWidth=r.w;ctx.stroke();
}

function draw(time){
 // exact original image, untouched
 ctx.globalCompositeOperation='source-over';
 ctx.globalAlpha=1;
 ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
 const F=fit();ctx.drawImage(img,F.x,F.y,F.w,F.h);

 // generated aura lives around the original shape
 ctx.globalCompositeOperation='lighter';
 for(const r of rings)drawRibbon(time,r);

 // fixed number of particles, recycled by movement
 for(const p of pts){
   const q=auraPoint(p,time);
   let x=q[0],y=q[1];
   // If a particle wanders into the bunny, push it outward.
   if(insideBunny(x,y,F)){
     const dx=x-W*.5,dy=y-H*.44,d=Math.hypot(dx,dy)||1;
     x=W*.5+dx/d*(Math.min(W,H)*.28);
     y=H*.44+dy/d*(Math.min(W,H)*.28);
   }
   const cc=col(p.c);
   const pulse=.65+.35*Math.sin(time*1.8+p.phase);
   ctx.fillStyle=rgb(cc,.28+.34*pulse);
   ctx.shadowBlur=5*pulse;ctx.shadowColor=rgb(cc,.45);
   ctx.beginPath();ctx.arc(x,y,p.size*(.75+.5*pulse),0,Math.PI*2);ctx.fill();
 }
 ctx.shadowBlur=0;

 // Occasional finite "birth" event: particles appear only by reusing existing bursts.
 if(Math.sin(time*.23)>0.9985 && bursts.length<2){
   bursts.push({a:rnd()*6.28,life:1,r:Math.min(W,H)*.25,c:(rnd()*colors.length)|0});
 }
 for(let i=bursts.length-1;i>=0;i--){
   const b=bursts[i];b.life-=.012;b.r+=3;
   const cc=col(b.c);
   ctx.strokeStyle=rgb(cc,b.life*.18);ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(W*.5,H*.44,b.r,0,Math.PI*2);ctx.stroke();
   if(b.life<=0)bursts.splice(i,1);
 }
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(draw);
}

c.addEventListener('pointerdown',e=>{
 // Interaction changes the field, not the bunny.
 const rect=c.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
 for(const p of pts){
   const dx=mx-(W*.5),dy=my-(H*.44),d=Math.hypot(dx,dy);
   if(d<Math.min(W,H)*.5)p.a+=.18*(1-d/(Math.min(W,H)*.5));
 }
});
document.getElementById('regen').onclick=build;
addEventListener('resize',resize);
if(img.complete)resize();else img.onload=resize;
requestAnimationFrame(draw);
})();
</script>
</body>
