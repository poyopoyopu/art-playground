<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ART PLAYGROUND / RESULTS</title><style>body{margin:0;background:#050507;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:24px 16px}.wrap{max-width:720px;margin:auto}.k{font-size:11px;letter-spacing:.2em;color:#777}h1{margin:8px 0 4px}.sub{color:#888;font-size:13px}.total{margin:22px 0;font-size:18px}.row{display:grid;grid-template-columns:28px 1fr 90px 60px;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid #202027}.name{font-weight:600}.avg{font-size:20px}.count{color:#777;font-size:12px;text-align:right}.bar{height:4px;background:#202027;margin-top:6px}.bar i{display:block;height:100%;background:#fff}.refresh{margin-top:20px;border:1px solid #333;background:#111118;color:#fff;border-radius:10px;padding:10px 14px}#status{margin-top:12px;color:#777;font-size:12px}</style></head><body><div class="wrap"><div class="k">ART PLAYGROUND / RESULTS</div><h1>観客ランキング</h1><div class="sub">公開投票の集計結果</div><div class="total" id="total">読み込み中…</div><div id="list"></div><button class="refresh" onclick="load()">↻ 更新</button><div id="status"></div></div><script>async function load(){document.getElementById('status').textContent='更新中…';try{let r=await fetch('/api/results',{cache:'no-store'});let d=await r.json();if(!r.ok)throw 0;let a=d.results.filter(x=>x.votes).sort((x,y)=>y.average-x.average||y.votes-x.votes);document.getElementById('total').textContent=`${d.voters} 人が投票`;document.getElementById('list').innerHTML=a.length?a.map((x,i)=>`<div class="row"><div>${i+1}</div><div><div class="name">${x.work}</div><div class="bar"><i style="width:${x.average/5*100}%"></i></div></div><div class="avg">★ ${x.average.toFixed(2)}</div><div class="count">${x.votes}票</div></div>`).join(''):'まだ投票はありません。';document.getElementById('status').textContent='最終更新：'+new Date().toLocaleString('ja-JP')}catch(e){document.getElementById('status').textContent='結果を取得できませんでした。'}}load();setInterval(load,30000)</script></body></html>
