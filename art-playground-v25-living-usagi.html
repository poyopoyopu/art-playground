<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground — Living Usagi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#fff}
.brand{position:absolute;left:6vw;top:6vh;opacity:.78}
.brand small{font-size:9px;letter-spacing:.42em}
.brand strong{display:block;margin-top:8px;font-size:clamp(28px,7vw,48px);letter-spacing:.03em}
.brand em{font-style:normal;font-size:9px;letter-spacing:.34em;opacity:.55}
button{pointer-events:auto;position:absolute;right:6vw;top:6vh;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff2a;background:#080710bb;color:#fff;font-size:29px;backdrop-filter:blur(8px)}
.hint{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;opacity:.36;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="brand"><small>ART PLAYGROUND</small><strong>LIVING USAGI</strong><em>GENERATIVE · ORGANIC · PSYCHEDELIC</em></div>
  <button id="reset" aria-label="regenerate">↻</button>
  <div class="hint">触れると、周囲の世界が反応する</div>
</div>
<script>
(()=>{
"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d",{alpha:false});
let W=0,H=0,D=1,t=0,seed=1;
const TAU=Math.PI*2;
const palette=["#ff3c9d","#ff8b42","#ffe36b","#8df36b","#43e2cf","#53c4ff","#8b78ff","#df6dff","#ffd0e8"];
let particles=[],threads=[],bursts=[],touches=[];

/* Fixed-size ecology: particles are recycled, never accumulated. */
const MAX=720, THREADS=20;

function rnd(){
  seed=(seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}
function pick(){return palette[(rnd()*palette.length)|0]}
function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  init();
}
function init(){
  seed=(Date.now()>>>0);
  particles=[];threads=[];bursts=[];touches=[];
  const R=Math.min(W,H);
  for(let i=0;i<MAX;i++){
    const a=rnd()*TAU;
    const r=Math.sqrt(rnd())*R*.49;
    particles.push({
      a,r,base:r,
      speed:.035+rnd()*.15,
      drift:.15+rnd()*.55,
      phase:rnd()*TAU,
      size:.45+rnd()*2.0,
      color:pick(),
      lane:rnd()
    });
  }
  for(let i=0;i<THREADS;i++){
    threads.push({
      a:rnd()*TAU,
      radius:R*(.17+rnd()*.31),
      wobble:7+rnd()*27,
      freq:.8+rnd()*1.8,
      phase:rnd()*TAU,
      color:pick(),
      width:.35+rnd()*1.2
    });
  }
}

/* A clean procedural rabbit silhouette. It is deliberately stable;
   the surrounding field changes, not the character's identity. */
function rabbitPath(cx,cy,s,detail=false){
  const p=[];
  // ears
  function ellipse(x,y,rx,ry,n=28,rot=0){
    for(let i=0;i<n;i++){
      const a=i/n*TAU;
      const ca=Math.cos(a),sa=Math.sin(a);
      p.push([x+(ca*rx*Math.cos(rot)-sa*ry*Math.sin(rot)),
              y+(ca*rx*Math.sin(rot)+sa*ry*Math.cos(rot))]);
    }
  }
  ellipse(cx-s*.30,cy-s*.62,s*.13,s*.31,28,-.08);
  ellipse(cx+s*.30,cy-s*.62,s*.13,s*.31,28,.08);
  ellipse(cx,cy-s*.12,s*.43,s*.39,42);
  ellipse(cx,cy+s*.42,s*.34,s*.36,38);
  return p;
}
function isRabbit(x,y){
  const cx=W*.5,cy=H*.49,s=Math.min(W,H)*.43;
  const e1=((x-(cx-s*.30))/(s*.13))**2+((y-(cy-s*.62))/(s*.31))**2;
  const e2=((x-(cx+s*.30))/(s*.13))**2+((y-(cy-s*.62))/(s*.31))**2;
  const head=((x-cx)/(s*.43))**2+((y-(cy-s*.12))/(s*.39))**2;
  const body=((x-cx)/(s*.34))**2+((y-(cy+s*.42))/(s*.36))**2;
  return e1<1||e2<1||head<1||body<1;
}
function fieldAngle(x,y,time){
  const nx=x/W,ny=y/H;
  let a=
    Math.sin(nx*7.1+time*.17)*1.05+
    Math.cos(ny*6.2-time*.13)*.92+
    Math.sin((nx-ny)*10.3+time*.09)*.54+
    Math.cos((nx+ny)*15-time*.07)*.26;
  const cx=W*.5,cy=H*.49;
  const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)+1;
  // A rotating component makes the aura curl, but never forms a rigid orbit.
  a += Math.atan2(dy,dx)+Math.sin(time*.25+d*.008)*.7;
  for(const q of touches){
    const ddx=x-q.x,ddy=y-q.y,dd=Math.hypot(ddx,ddy)+1;
    if(dd<Math.min(W,H)*.55) a += Math.atan2(ddy,ddx)*(.9-dd/(Math.min(W,H)*.55))*q.power;
  }
  return a;
}
function drawRabbit(cx,cy,s,time){
  // Crisp outline, almost unchanged. Only a subtle breathing glow.
  ctx.save();
  ctx.translate(cx,cy);
  const pulse=1+Math.sin(time*.8)*.006;
  ctx.scale(pulse,pulse);
  ctx.globalCompositeOperation="lighter";
  ctx.shadowBlur=16;
  ctx.shadowColor="#fff4d8";
  ctx.strokeStyle="#fff7df";
  ctx.lineWidth=Math.max(1.5,s*.012);
  ctx.beginPath();
  ctx.ellipse(-s*.30,-s*.62,s*.13,s*.31,-.08,0,TAU);
  ctx.ellipse(s*.30,-s*.62,s*.13,s*.31,.08,0,TAU);
  ctx.ellipse(0,-s*.12,s*.43,s*.39,0,0,TAU);
  ctx.ellipse(0,s*.42,s*.34,s*.36,0,0,TAU);
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,245,225,.035)";
  ctx.fill();
  // face: minimal and fixed
  ctx.fillStyle="#fff8e8";
  ctx.beginPath();ctx.arc(-s*.15,-s*.15,s*.035,0,TAU);ctx.arc(s*.15,-s*.15,s*.035,0,TAU);ctx.fill();
  ctx.strokeStyle="#fff8e8";ctx.lineWidth=s*.012;
  ctx.beginPath();ctx.arc(0,-s*.04,s*.055,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.restore();
}
function draw(time){
  // Deep black-violet ground, with restrained persistence.
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(5,3,10,.115)";
  ctx.fillRect(0,0,W,H);

  const cx=W*.5,cy=H*.49,R=Math.min(W,H);

  // Organic ribbons
  ctx.globalCompositeOperation="lighter";
  for(const q of threads){
    q.a += .0009*q.freq;
    ctx.beginPath();
    for(let i=0;i<=150;i++){
      const a=q.a+i/150*TAU;
      const rr=q.radius+
        Math.sin(a*q.freq+time*.42+q.phase)*q.wobble+
        Math.sin(a*3-time*.17+q.phase)*q.wobble*.28;
      const xx=cx+Math.cos(a)*rr*(W/H);
      const yy=cy+Math.sin(a)*rr;
      i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
    }
    ctx.strokeStyle=q.color+"28";
    ctx.lineWidth=q.width;
    ctx.stroke();
  }

  // Recycled particles follow a changing vector field.
  for(const p of particles){
    const a0=p.a;
    const ang=fieldAngle(cx+Math.cos(a0)*p.r*(W/H),cy+Math.sin(a0)*p.r,time);
    p.a += p.speed*.0025;
    p.r += Math.sin(time*p.drift+p.phase)*.018;
    let x=cx+Math.cos(p.a)*p.r*(W/H);
    let y=cy+Math.sin(p.a)*p.r;
    // Keep the generated aura outside the character's silhouette.
    if(isRabbit(x,y)){
      const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;
      x=cx+dx/d*(R*.30)*(W/H);
      y=cy+dy/d*(R*.30);
    }
    const wig=Math.sin(time*.7+p.phase)*.45;
    const cc=p.color;
    ctx.fillStyle=cc;
    ctx.globalAlpha=.18+.25*(.5+.5*Math.sin(time*1.5+p.phase));
    ctx.shadowBlur=3;
    ctx.shadowColor=cc;
    ctx.beginPath();
    ctx.arc(x+Math.cos(ang)*wig,y+Math.sin(ang)*wig,p.size,0,TAU);
    ctx.fill();
  }
  ctx.shadowBlur=0;

  // Finite bursts: events fade instead of accumulating.
  for(let i=bursts.length-1;i>=0;i--){
    const b=bursts[i];
    b.r+=2.4;b.life-=.012;
    ctx.globalAlpha=Math.max(0,b.life)*.28;
    ctx.strokeStyle=b.color;
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();
    if(b.life<=0)bursts.splice(i,1);
  }

  // The original form remains the visual anchor.
  ctx.globalAlpha=1;
  drawRabbit(cx,cy,R*.43,time);

  // Face-area sparkles are generated but do not obscure the silhouette.
  if(Math.sin(time*.31)>0.998 && bursts.length<3){
    const a=rnd()*TAU,d=R*(.30+.14*rnd());
    bursts.push({x:cx+Math.cos(a)*d*(W/H),y:cy+Math.sin(a)*d,r:2,life:1,color:pick()});
  }

  // Touch influence decays.
  for(let i=touches.length-1;i>=0;i--){
    touches[i].power*=.985;
    if(touches[i].power<.03)touches.splice(i,1);
  }

  ctx.globalCompositeOperation="source-over";
  requestAnimationFrame(draw);
}
function interact(e){
  const r=c.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  touches.push({x,y,power:1});
  if(touches.length>5)touches.shift();
}
let dragging=false;
c.addEventListener("pointerdown",e=>{dragging=true;interact(e)});
c.addEventListener("pointermove",e=>{if(dragging&&Math.random()<.16)interact(e)});
addEventListener("pointerup",()=>dragging=false);
document.getElementById("reset").onclick=init;
addEventListener("resize",resize);
resize();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
