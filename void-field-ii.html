<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Void Field">
<title>Art Playground — VOID FIELD II</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{touch-action:none;overscroll-behavior:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;z-index:3;pointer-events:none;text-shadow:0 1px 10px #000,0 0 3px #000}
.title{left:22px;top:calc(env(safe-area-inset-top) + 16px);font-size:15px;letter-spacing:.32em;opacity:.78}
.sub{left:23px;top:calc(env(safe-area-inset-top) + 40px);font-size:8.5px;letter-spacing:.26em;opacity:.45}
.hint{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);
 font-size:9px;letter-spacing:.24em;opacity:.4;white-space:nowrap;transition:opacity 1.4s}
.hint.gone{opacity:0}
</style>
</head>
<body>
<div class="hud title">VOID FIELD</div>
<div class="hud sub">II — THE ABSENCE IS THE SUBJECT</div>
<div class="hud hint" id="hint">TAP — PUSH · HOLD — PULL · DOUBLE — WAVE</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>
let particles=[], voids=[], waves=[];
let lastTap=0, downAt=0, downX=0, downY=0, holding=null;
let quality=1, frameCost=0, costSamples=0, lastCheck=0;

const MAX_VOIDS=18;

function setup(){
  createCanvas(windowWidth,windowHeight);
  pixelDensity(Math.min(2,window.devicePixelRatio||1));
  noStroke();
  seedParticles();
  background(0);
}

function seedParticles(){
  particles=[];
  const gap=Math.max(7,Math.min(12,width/95))/quality;
  for(let x=gap/2;x<width;x+=gap){
    for(let y=gap/2;y<height;y+=gap){
      particles.push({
        x:x+random(-.7,.7), y:y+random(-.7,.7),
        ox:x, oy:y, ph:random(TWO_PI),
        vx:0, vy:0
      });
    }
  }
}

/* A void is not an event that fades — it is a rule written into the field, and
   it keeps its own polarity. Tapping writes a repeller, holding writes an
   attractor, and the two kinds coexist. Where a repeller meets an attractor
   their forces cancel along a line, and particles pile up on it: the seam is
   drawn by the physics, not painted on afterwards. */
function makeVoid(x,y,repulse,force){
  voids.push({
    x:x, y:y,
    r:16+random(10,26)*force,
    str:1.35+force*.9,
    spin:(Math.random()<.5?-1:1)*(1.5+Math.random()*1.4),
    repulse:repulse,
    born:millis(),
    fade:1
  });
  /* The field keeps its history, but not without limit: the oldest law
     dissolves gradually rather than blinking out.
     This was a `while (voids.length > MAX_VOIDS)` that only set a flag — the
     length never changed, so the nineteenth void locked the browser in an
     endless loop. Marking is now a bounded pass, and there is a hard ceiling
     so a fast drag can never outrun the dissolving. */
  let active=0;
  for(let i=voids.length-1;i>=0;i--) if(!voids[i].dissolving) active++;
  for(let i=0;i<voids.length && active>MAX_VOIDS;i++){
    if(!voids[i].dissolving){ voids[i].dissolving=true; active--; }
  }
  const HARD=MAX_VOIDS*2;
  if(voids.length>HARD) voids.splice(0,voids.length-HARD);
}

function draw(){
  const t0=performance.now();
  background(0,20);
  const t=frameCount*.012;

  for(let i=voids.length-1;i>=0;i--){
    const v=voids[i];
    if(v.dissolving){
      v.fade -= .006*(1+voids.length/MAX_VOIDS);
      if(v.fade<=0){ voids.splice(i,1); continue; }
    }
  }

  const nv=voids.length;
  for(let pi=0;pi<particles.length;pi++){
    const p=particles[pi];
    let ax=0, ay=0;

    const cx=p.x-width*.5, cy=p.y-height*.5;
    const rr=Math.sqrt(cx*cx+cy*cy)+1;
    const ang=Math.atan2(cy,cx);
    const field=Math.sin(rr*.016-t*2+p.ph)+.55*Math.sin(ang*3+t);
    ax += -Math.sin(ang)*field*.075;
    ay +=  Math.cos(ang)*field*.075;

    // one pass over the laws: force, influence and polarity together
    let inf=0, net=0, spinSum=0;
    for(let vi=0;vi<nv;vi++){
      const v=voids[vi];
      const dx=p.x-v.x, dy=p.y-v.y;
      const R=v.r*3.2;
      if(dx>R||dx<-R||dy>R||dy<-R) continue;
      const d=Math.sqrt(dx*dx+dy*dy)+.001;
      if(d>=R) continue;
      const q=(1-d/R)*(1-d/R)*v.fade;
      const s=v.repulse?1:-1;
      ax += dx/d * s*q*v.str;
      ay += dy/d * s*q*v.str;
      ax += -dy/d * q*v.spin;
      ay +=  dx/d * q*v.spin;
      inf += q;
      net += s*q;
      spinSum += v.spin*q;
    }

    // Home is only a memory: where a law is strong it wins, and the field
    // recovers on its own where nothing has been written.
    const slack=1/(1+inf*3.5);
    ax += (p.ox-p.x)*.0016*slack;
    ay += (p.oy-p.y)*.0016*slack;

    for(let wi=0;wi<waves.length;wi++){
      const w=waves[wi];
      const dx=p.x-w.x, dy=p.y-w.y, d=Math.sqrt(dx*dx+dy*dy)+.001;
      const band=Math.abs(d-w.r);
      if(band<70){
        const push=(1-band/70)*w.life/120*1.1;
        ax += dx/d*push; ay += dy/d*push;
      }
    }

    p.vx=(p.vx+ax)*.91;
    p.vy=(p.vy+ay)*.91;
    p.x+=p.vx;
    p.y+=p.vy;

    /* The original wrapped particles around the edges while also pulling them
       back toward home, so anything that wrapped was dragged the whole way
       across the screen and — with trails on — left a line through the middle
       of the picture. Here the edge simply holds them. */
    const m=6;
    if(p.x<m){ p.x=m; p.vx=Math.abs(p.vx)*.35; }
    else if(p.x>width-m){ p.x=width-m; p.vx=-Math.abs(p.vx)*.35; }
    if(p.y<m){ p.y=m; p.vy=Math.abs(p.vy)*.35; }
    else if(p.y>height-m){ p.y=height-m; p.vy=-Math.abs(p.vy)*.35; }

    const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);

    /* Where attraction and repulsion cancel, the net force vanishes while the
       total influence stays high. That is the border between two regimes, and
       it is the brightest thing on screen. */
    /* Cancellation happens where the two influences are equal, and that place
       sits far from both centres — so the total influence there is small (about
       0.1 in practice). Gating on a high influence, as a first attempt did,
       meant the seam never lit up at all. */
    const balance = inf>.05 ? 1-Math.min(1,Math.abs(net)/(inf*.5)) : 0;
    const seam = balance*Math.min(1,inf*4.5);

    const structure=Math.pow(Math.max(0,Math.sin(
      rr*.012 + Math.sin(ang*2+t)*2.0 - t*.7 + p.ph
    )),8);
    const ripple=.5+.5*Math.sin(rr*.035-t*4+p.ph*2);
    const intensity=Math.min(1, structure*.85 + ripple*.16 + Math.min(1,speed*.5)*.5 + seam*1.1);

    /* Colour comes from which law owns this place, not from the particle.
       Repelled ground runs warm, attracted ground runs cold, and the seam
       between them burns pale — so the territories read at a glance. */
    let hue;
    if(inf>.03){
      const side=net/Math.max(inf,.0001);      // +1 pushed, -1 pulled
      hue = 205 - side*168;                     // cold -> warm
      hue += spinSum/Math.max(inf,.0001)*7;
    }else{
      hue = 212 + Math.sin(rr*.01+p.ph)*16;
    }
    let sat = inf>.03 ? .80 : .34;
    let val = .30 + .70*intensity;
    if(seam>.25){ sat*= (1-seam*.75); val=Math.min(1,val+seam*.55); }

    const col=hsv(hue,sat,val);
    const size=.8+intensity*2.9+seam*2.6;
    fill(col[0],col[1],col[2],40+215*intensity);
    rect(p.x-size/2,p.y-size/2,size,size);
  }

  /* No black disc is drawn over the void. The hole is there because the
     particles genuinely left; covering it would also hide the rim they form,
     which is the most interesting part of the picture. */
  for(let i=waves.length-1;i>=0;i--){
    const w=waves[i];
    w.r+=5; w.life-=2;
    if(w.life<=0){ waves.splice(i,1); continue; }
    noFill(); stroke(150,200,255,Math.max(0,w.life)*.13);
    circle(w.x,w.y,w.r*2);
    noStroke();
  }

  // hold to write an attractor: it deepens while the finger stays down
  if(holding && millis()-downAt>260){
    const age=(millis()-downAt-260)/1000;
    if(frameCount%9===0) makeVoid(downX+random(-6,6),downY+random(-6,6),false,.35+Math.min(1.4,age));
  }

  frameCost+=performance.now()-t0; costSamples++;
  if(millis()-lastCheck>2500){
    const avg=frameCost/Math.max(1,costSamples);
    if(avg>19&&quality>.7){ quality=.7; seedParticles(); }
    else if(avg<9&&quality<1){ quality=1; seedParticles(); }
    frameCost=0; costSamples=0; lastCheck=millis();
  }
}

function hsv(h,s,v){
  h=((h%360)+360)%360/60;
  const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0:r=v;g=u;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=u;break;
    case 3:r=p;g=q;b=v;break; case 4:r=u;g=p;b=v;break; default:r=v;g=p;b=q;
  }
  return [r*255,g*255,b*255];
}

function globalWave(x,y){
  waves.push({x,y,r:2,life:120});
}

function pointerDown(x,y){
  const now=millis();
  if(now-lastTap<320) globalWave(x,y);
  lastTap=now;
  downAt=now; downX=x; downY=y; holding=true;
  makeVoid(x,y,true,1);                 // a tap pushes
  const h=document.getElementById('hint');
  if(h)h.classList.add('gone');
}
function pointerMove(x,y){
  downX=x; downY=y;
  if(millis()-downAt>120 && frameCount%7===0) makeVoid(x,y,true,.4);
}
function pointerUp(){ holding=null; }

function mousePressed(){pointerDown(mouseX,mouseY);return false}
function mouseDragged(){pointerMove(mouseX,mouseY);return false}
function mouseReleased(){pointerUp();return false}
function touchStarted(){ if(touches.length)pointerDown(touches[0].x,touches[0].y); return false }
function touchMoved(){ if(touches.length)pointerMove(touches[0].x,touches[0].y); return false }
function touchEnded(){pointerUp();return false}

function keyPressed(){
  if(key==='r'||key==='R'){ voids=[]; waves=[]; seedParticles(); background(0); }
}
function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  seedParticles();
  background(0);
}
</script>
</body>
</html>
