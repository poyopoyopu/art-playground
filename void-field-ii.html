<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Art Playground — VOID FIELD II</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}canvas{display:block;position:fixed;inset:0}</style></head><body><script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script><script>
let particles=[],voids=[],waves=[],lastTap=0,downAt=0,downX=0,downY=0,holding=null,quality=1,frameCost=0,costSamples=0,lastCheck=0;const MAX_VOIDS=18;
function setup(){createCanvas(windowWidth,windowHeight);bindPointerEvents();pixelDensity(Math.min(2,window.devicePixelRatio||1));noStroke();seedParticles();background(0);APKit.init({canvas:document.querySelector('canvas'),gifName:'void-field-ii-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>renderScene(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seedParticles();voids=[];waves=[];background(0)}},{label:'↻',name:'reset',onClick:()=>{voids=[];waves=[];seedParticles();background(0)}}]})}
function seedParticles(){particles=[];const gap=Math.max(7,Math.min(12,width/95))/quality;for(let x=gap/2;x<width;x+=gap)for(let y=gap/2;y<height;y+=gap)particles.push({x:x+random(-.7,.7),y:y+random(-.7,.7),ox:x,oy:y,ph:random(TWO_PI),vx:0,vy:0})}
function makeVoid(x,y,repulse,force){voids.push({x,y,r:16+random(10,26)*force,str:1.35+force*.9,spin:(Math.random()<.5?-1:1)*(1.5+Math.random()*1.4),repulse,born:millis(),fade:1});let active=0;for(let i=voids.length-1;i>=0;i--)if(!voids[i].dissolving)active++;for(let i=0;i<voids.length&&active>MAX_VOIDS;i++)if(!voids[i].dissolving){voids[i].dissolving=true;active--}const HARD=MAX_VOIDS*2;if(voids.length>HARD)voids.splice(0,voids.length-HARD)}
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=u;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=u;break;case 3:r=p;g=q;b=v;break;case 4:r=u;g=p;b=v;break;default:r=v;g=p;b=q}return[r*255,g*255,b*255]}
function renderScene(P){const live=P===undefined||P===null;if(live){background(0,20)}else{background(0)}const t=live?frameCount*.012:P;for(let i=voids.length-1;i>=0;i--){let v=voids[i];if(live&&v.dissolving){v.fade-=.006*(1+voids.length/MAX_VOIDS);if(v.fade<=0){voids.splice(i,1);continue}}}for(const p of particles){let ax=0,ay=0,cx=p.x-width*.5,cy=p.y-height*.5,rr=Math.hypot(cx,cy)+1,ang=Math.atan2(cy,cx),field=Math.sin(rr*.016-t*2+p.ph)+.55*Math.sin(ang*3+t);ax+=-Math.sin(ang)*field*.075;ay+=Math.cos(ang)*field*.075;let inf=0,net=0,spinSum=0;for(const v of voids){let dx=p.x-v.x,dy=p.y-v.y,R=v.r*3.2;if(Math.abs(dx)>R||Math.abs(dy)>R)continue;let d=Math.hypot(dx,dy)+.001;if(d>=R)continue;let q=(1-d/R)*(1-d/R)*v.fade,s=v.repulse?1:-1;ax+=dx/d*s*q*v.str;ay+=dy/d*s*q*v.str;ax+=-dy/d*q*v.spin;ay+=dx/d*q*v.spin;inf+=q;net+=s*q;spinSum+=v.spin*q}let slack=1/(1+inf*3.5);ax+=(p.ox-p.x)*.0016*slack;ay+=(p.oy-p.y)*.0016*slack;for(const w of waves){let dx=p.x-w.x,dy=p.y-w.y,d=Math.hypot(dx,dy)+.001,band=Math.abs(d-w.r);if(band<70){let push=(1-band/70)*w.life/120*1.1;ax+=dx/d*push;ay+=dy/d*push}}p.vx=(p.vx+ax)*.91;p.vy=(p.vy+ay)*.91;p.x+=p.vx;p.y+=p.vy;const m=6;if(p.x<m){p.x=m;p.vx=Math.abs(p.vx)*.35}else if(p.x>width-m){p.x=width-m;p.vx=-Math.abs(p.vx)*.35}if(p.y<m){p.y=m;p.vy=Math.abs(p.vy)*.35}else if(p.y>height-m){p.y=height-m;p.vy=-Math.abs(p.vy)*.35}let speed=Math.hypot(p.vx,p.vy),balance=inf>.05?1-Math.min(1,Math.abs(net)/(inf*.5)):0,seam=balance*Math.min(1,inf*4.5),structure=Math.pow(Math.max(0,Math.sin(rr*.012+Math.sin(ang*2+t)*2-t*.7+p.ph)),8),ripple=.5+.5*Math.sin(rr*.035-t*4+p.ph*2),intensity=Math.min(1,structure*.85+ripple*.16+Math.min(1,speed*.5)*.5+seam*1.1),hue;if(inf>.03){let side=net/Math.max(inf,.0001);hue=205-side*168+spinSum/Math.max(inf,.0001)*7}else hue=212+Math.sin(rr*.01+p.ph)*16;let sat=inf>.03?.8:.34,val=.3+.7*intensity;if(seam>.25){sat*=1-seam*.75;val=Math.min(1,val+seam*.55)}const col=hsv(hue,sat,val),size=.8+intensity*2.9+seam*2.6;fill(col[0],col[1],col[2],40+215*intensity);rect(p.x-size/2,p.y-size/2,size,size)}for(let i=waves.length-1;i>=0;i--){let w=waves[i];if(live){w.r+=5;w.life-=2}if(w.life<=0){waves.splice(i,1);continue}noFill();stroke(150,200,255,Math.max(0,w.life)*.13);circle(w.x,w.y,w.r*2);noStroke()}if(live&&holding&&millis()-downAt>260){let age=(millis()-downAt-260)/1000;if(frameCount%9===0)makeVoid(downX+random(-6,6),downY+random(-6,6),false,.35+Math.min(1.4,age))}}
function draw(){if(window.APKit&&APKit.isExporting())return;renderScene(null)}
function globalWave(x,y){waves.push({x,y,r:2,life:120})}
function pointerDown(x,y){if(window.APKit&&APKit.isUI(x,y))return true;const now=millis();if(now-lastTap<320)globalWave(x,y);lastTap=now;downAt=now;downX=x;downY=y;holding=true;makeVoid(x,y,true,1);document.getElementById('hint')?.classList.add('gone');return false}
function pointerMove(x,y){if(window.APKit&&APKit.isUI(x,y))return true;downX=x;downY=y;if(millis()-downAt>120&&frameCount%7===0)makeVoid(x,y,true,.4);return false}function pointerUp(){holding=null}
/* Bind only after p5 has created the canvas. */
function bindPointerEvents(){
  const cv=document.querySelector('canvas');
  if(!cv)return;
  let dragging=false;
  function xy(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  cv.addEventListener('pointerdown',e=>{const [x,y]=xy(e);dragging=true;pointerDown(x,y)},{passive:true});
  cv.addEventListener('pointermove',e=>{if(!dragging)return;const [x,y]=xy(e);pointerMove(x,y)},{passive:true});
  cv.addEventListener('pointerup',()=>{dragging=false;pointerUp()},{passive:true});
  cv.addEventListener('pointercancel',()=>{dragging=false;pointerUp()},{passive:true});
}
function keyPressed(){if(key==='r'||key==='R'){voids=[];waves=[];seedParticles();background(0)}}function windowResized(){resizeCanvas(windowWidth,windowHeight);seedParticles();background(0)}
</script></body></html>
