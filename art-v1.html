<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Art Playground</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#03050b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column}#panel{flex:none;background:#101522;padding:max(8px,env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid #2a344b}.head{display:flex;justify-content:space-between;align-items:center}.head b{font-size:21px}.head small{color:#9eabc3}.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}.mode,.act{border:0;border-radius:10px;background:#283143;color:#eef3ff;font-size:10px;font-weight:700;padding:7px 2px}.mode.on{background:#6d80b7}.mode i{display:block;font-style:normal;font-size:16px;margin-bottom:2px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.box{background:#20283a;padding:5px 7px;border-radius:9px}.box label{display:flex;justify-content:space-between;font-size:10px;color:#d0d8e8}.box output{color:#a9c4ff}input{width:100%;margin:1px 0 0;accent-color:#9db7ff}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.act{padding:8px 1px}#gif{background:#513276}#full{background:#285078}main{position:relative;flex:1;min-height:180px}canvas{width:100%;height:100%;display:block;background:#02040a;touch-action:none}.tip{position:absolute;left:8px;bottom:7px;font-size:9px;color:#8490a8;background:#07101dbb;padding:5px 8px;border-radius:9px}.exit{display:none}#app.fs #panel{display:none}#app.fs main{height:100dvh}.fs .exit{display:block;position:absolute;right:10px;top:10px;width:42px;height:42px;border:0;border-radius:50%;background:#111827dd;color:#fff;font-size:20px;z-index:2}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;background:#172037;border-radius:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style></head><body><div id="app"><section id="panel"><div class="head"><b>🎨 Art Playground</b><small id="status">FLOW</small></div><div class="modes" id="modes"></div><div class="controls"><div class="box"><label>色 <output id="oh"></output></label><input id="h" type="range" min="0" max="360" value="210"></div><div class="box"><label>速度 <output id="os"></output></label><input id="s" type="range" min="0" max="180" value="70"></div><div class="box"><label>密度 <output id="on"></output></label><input id="n" type="range" min="5" max="80" value="28"></div><div class="box"><label>ゆがみ <output id="ow"></output></label><input id="w" type="range" min="0" max="100" value="60"></div></div><div class="actions"><button class="act" id="play">⏸ 停止</button><button class="act" id="rnd">🎲 ランダム</button><button class="act" id="png">📷 PNG</button><button class="act" id="gif">◌ GIF</button><button class="act" id="full">⛶ 全画面</button></div></section><main><canvas id="c"></canvas><button class="exit" id="exit">×</button><div class="tip">タップすると波紋が生まれる</div></main></div><div class="toast" id="toast"></div><script>
const C=document.getElementById("c"),X=C.getContext("2d"),$=id=>document.getElementById(id);
const list=[["flow","∞"],["flower","✿"],["wave","〰"],["spiral","🧬"],["grid","◇"],["stars","✦"],["orbit","◎"],["ribbon","⌁"],["cell","◉"],["mix","✧"]];
let mode="flow",W=1,H=1,dpr=1,t=0,last=0,run=true,pulses=[];
list.forEach(([id,icon])=>{let b=document.createElement("button");b.className="mode"+(id==="flow"?" on":"");b.dataset.id=id;b.innerHTML="<i>"+icon+"</i>"+id.toUpperCase();b.onclick=()=>setMode(id);$("modes").appendChild(b)});
function setMode(id){mode=id;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.id===id));$("status").textContent=id.toUpperCase()}
["h","s","n","w"].forEach(k=>{let e=$(k);$("o"+k).textContent=e.value;e.oninput=()=>$("o"+k).textContent=e.value});
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=C.clientWidth||innerWidth;H=C.clientHeight||300;C.width=Math.floor(W*dpr);C.height=Math.floor(H*dpr);X.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function col(h,a=.5,l=60){return "hsla("+((h%360+360)%360)+",90%,"+l+"%,"+a+")"}function vals(){return {h:+$("h").value,n:+$("n").value,w:+$("w").value/100}}
function bg(){X.fillStyle="#02040a";X.fillRect(0,0,W,H)}
function drawFlow(v){let R=Math.min(W,H)*.48;X.save();X.translate(W/2,H/2);for(let i=0;i<v.n*3;i++){let a=i*2.399+t*.25,r=R*Math.sqrt(i/(v.n*3)),x=Math.cos(a)*r,y=Math.sin(a)*r;X.fillStyle=col(v.h+i*4,.28);X.beginPath();X.arc(x,y,Math.max(.5,1+2*Math.sin(t+i)),0,Math.PI*2);X.fill()}X.restore()}
function drawFlower(v){X.save();X.translate(W/2,H/2);let N=Math.max(6,v.n);for(let i=0;i<N;i++){X.save();X.rotate(i*Math.PI*2/N+t*.08);X.strokeStyle=col(v.h+i*360/N,.38);X.lineWidth=2;X.beginPath();X.ellipse(Math.min(W,H)*.25,0,Math.min(W,H)*(.07+v.w*.06),Math.min(W,H)*.035,Math.sin(t+i),0,Math.PI*2);X.stroke();X.restore()}X.restore()}
function drawWave(v){for(let k=0;k<v.n;k++){let y=H*(k+.5)/v.n;X.strokeStyle=col(v.h+k*8,.32);X.lineWidth=1.5;X.beginPath();for(let x=0;x<=W;x+=7){let yy=y+Math.sin(x*.02+t*1.5+k)*H*(.02+v.w*.06)+Math.cos(x*.008-t+k)*12;x?X.lineTo(x,yy):X.moveTo(x,yy)}X.stroke()}}
function drawSpiral(v){X.save();X.translate(W/2,H/2);let N=v.n*5,R=Math.min(W,H)*.45;for(let i=0;i<N;i++){let q=i/N,a=q*Math.PI*12+t*.35,r=q*R,x=Math.cos(a)*r,y=Math.sin(a)*r;X.fillStyle=col(v.h+i*3,.45);X.beginPath();X.arc(x,y,1+4*q,0,Math.PI*2);X.fill()}X.restore()}
function drawGrid(v){let s=Math.max(14,Math.min(W,H)/Math.max(5,v.n/2));for(let y=0;y<H+s;y+=s)for(let x=0;x<W+s;x+=s){let q=.5+.5*Math.sin(x*.03+y*.02+t);X.strokeStyle=col(v.h+q*120,.28);X.beginPath();X.arc(x+s/2,y+s/2,s*(.1+.25*q),0,Math.PI*2);X.stroke()}}
function drawStars(v){let N=v.n*7;for(let i=0;i<N;i++){let a=i*2.399+t*.08*(i%3+1),r=(i%v.n+1)/v.n*Math.min(W,H)*.62,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a*1.7+t*.2)*r*.75;X.fillStyle=col(v.h+i*5,.42);X.beginPath();X.arc(x,y,1+3*(.5+.5*Math.sin(t*2+i)),0,Math.PI*2);X.fill()}}
function drawOrbit(v){X.save();X.translate(W/2,H/2);for(let i=0;i<Math.max(5,v.n/2);i++){let r=Math.min(W,H)*(.08+i/v.n*.7);X.strokeStyle=col(v.h+i*18,.28);X.lineWidth=2;X.beginPath();X.ellipse(0,0,r,r*(.45+.25*Math.sin(t+i)),t*.15+i,0,Math.PI*2);X.stroke()}X.restore()}
function drawRibbon(v){X.save();X.translate(W/2,H/2);for(let k=0;k<7;k++){X.strokeStyle=col(v.h+k*35,.32);X.lineWidth=2+k;X.beginPath();for(let i=0;i<150;i++){let q=i/149*Math.PI*6,a=q+t*.2+k,r=Math.min(W,H)*.45*i/149,x=Math.cos(a)*r+Math.sin(q*3+t+k)*40,y=Math.sin(a)*r+Math.cos(q*4-t)*40;i?X.lineTo(x,y):X.moveTo(x,y)}X.stroke()}X.restore()}
function drawCell(v){let N=v.n*2;for(let i=0;i<N;i++){let a=i*2.399+t*.1,r=Math.sqrt(i/N)*Math.min(W,H)*.65,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;X.fillStyle=col(v.h+i*7,.18);X.beginPath();X.arc(x,y,6+15*(.5+.5*Math.sin(t+i)),0,Math.PI*2);X.fill()}}
function art(){let v=vals();if(mode==="flow")drawFlow(v);else if(mode==="flower")drawFlower(v);else if(mode==="wave")drawWave(v);else if(mode==="spiral")drawSpiral(v);else if(mode==="grid")drawGrid(v);else if(mode==="stars")drawStars(v);else if(mode==="orbit")drawOrbit(v);else if(mode==="ribbon")drawRibbon(v);else if(mode==="cell")drawCell(v);else{drawFlow(v);drawRibbon(v);drawStars(v)}}
function frame(ms){if(!last)last=ms;let dt=Math.min(.05,(ms-last)/1000);last=ms;if(run)t+=dt*(+$("s").value/70);bg();art();for(let p of pulses){p.r+=2.5;p.a-=.025;X.strokeStyle=col(vals().h+p.r,.45*p.a);X.lineWidth=2;X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.stroke()}pulses=pulses.filter(p=>p.a>0);requestAnimationFrame(frame)}requestAnimationFrame(frame);
C.addEventListener("pointerdown",e=>{let r=C.getBoundingClientRect();pulses.push({x:e.clientX-r.left,y:e.clientY-r.top,r:4,a:1})});
$("play").onclick=()=>{run=!run;$("play").textContent=run?"⏸ 停止":"▶ 再生"};$("rnd").onclick=()=>{["h","s","n","w"].forEach(k=>{let e=$(k);e.value=Math.round(+e.min+Math.random()*(+e.max-+e.min));$("o"+k).textContent=e.value});setMode(list[Math.floor(Math.random()*list.length)][0])};$("png").onclick=()=>{let a=document.createElement("a");a.download="art.png";a.href=C.toDataURL();a.click()};$("full").onclick=()=>{$("app").classList.add("fs");setTimeout(resize,50)};$("exit").onclick=()=>{$("app").classList.remove("fs");setTimeout(resize,50)};$("gif").onclick=()=>{toast("GIF機能はSafari対応を確認中。まずアニメーション本体を安定化したよ。")};function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
</script></body></html>
