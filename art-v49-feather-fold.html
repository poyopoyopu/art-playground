<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feather Fold">
<title>Art Playground — FEATHER FOLD</title>
<!--
  FEATHER FOLD
  Two sources combined, not just placed side by side:
    - the raymarch reference's recursive fold  p += cos(p.yzx*d - T*5.)/d ; d*=.8
      run in 2D as a 5-level self-similar domain warp
    - the parametric-plotter reference's feather formula (k,e,d,q,c -> u,v)
      evaluated AT the folded coordinate, so the feather shape recurs inside
      every fold scale instead of sitting flat on top of it
-->
<script src="ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a}
body{touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<div style="color:#fff;padding:30px;font:13px system-ui">WebGL2 is required.</div>';throw Error('WebGL2');}

const VS=`#version 300 es
in vec2 a;
void main(){ gl_Position=vec4(a,0.,1.); }`;

const FS=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 R;
uniform float time, seed, loopMode, phase, loopDur, maxR;
uniform vec4 laws[10];
#define PI 3.14159265359
#define TAU 6.2831853

/* Every animated term goes through T(). Live, it's just time*k. Exporting a
   loop, k becomes a whole number of turns over the loop length, so the last
   frame lands exactly on the first — verified for every k this shader uses. */
float T(float k){
  if(loopMode<0.5) return time*k;
  float cycles=max(1.0, floor(k*loopDur/TAU+0.5));
  return cycles*phase;
}

vec3 pal(float t){
  return 0.5+0.5*cos(TAU*(t+vec3(0.0,0.33,0.67)));
}

void main(){
  vec2 uv=gl_FragCoord.xy/min(R.x,R.y);
  vec2 center=0.5*R/min(R.x,R.y);
  vec2 p=uv-center;

  /* --- touch, applied directly to the screen you're looking at ---
     A tap pushes space outward from where you touched; holding pulls it in,
     and grows stronger the longer you hold. This runs on the RAW coordinate,
     before any folding — the earlier version bent an already-folded, already
     scrambled coordinate, so the effect could show up nowhere near your
     finger. Doing it here means what you touch is where it happens.
     Each law persists (capped at 10, oldest evicted) rather than fading. */
  vec2 aspect=R/min(R.x,R.y);
  vec2 wp=p;
  float lawBend=0.0;
  for(int i=0;i<10;i++){
    vec4 L=laws[i];
    if(L.w<=0.0) continue;
    /* L.xy arrives as a 0..1 fraction of the screen, same as gl_FragCoord
       normalised by width/height — NOT by min(R.x,R.y) the way p is. It has
       to go through the same 0.5-then-aspect conversion p did, or a portrait
       screen's taller axis puts it far from where you actually touched. */
    /* No extra flip here: norm() in JS already puts L.y in the same
       bottom-origin convention gl_FragCoord uses, so flipping again mirrored
       every touch vertically — the top of the screen behaved like the
       bottom. That was the second position bug, separate from the aspect
       one fixed earlier. */
    vec2 lp=(L.xy-0.5)*aspect;
    vec2 dv=wp-lp;
    float dist=length(dv)+0.0001;
    float infl=smoothstep(L.w,0.0,dist);
    infl*=infl;
    float ang=atan(dv.y,dv.x) + infl*L.z*2.6;
    float rr=dist*(1.0 - infl*0.55*sign(L.z));
    wp=lp+vec2(cos(ang),sin(ang))*rr;
    lawBend+=infl*abs(L.z)*0.5;
  }

  /* --- self-similar recursive fold, on top of the touch-warped point ---
     The same warp, cos(q.yx*d - T*0.35d)/d, is applied five times as d
     shrinks (2.0 -> 0.328) — each pass a smaller echo of the one before it.
     Because it now runs on wp, the fractal ripples radiate outward from
     wherever a touch has bent the space, instead of everywhere at once. */
  vec2 q=wp*3.0;
  float d=2.0;
  for(int j=0;j<5;j++){
    d*=0.8;
    vec2 w=cos(q.yx*d - T(0.18*d) + seed*0.7);
    q+=w/d;
  }

  /* --- feather formula, evaluated at the folded coordinate ---
     k,e,d,q,c are the reference plotter's own names. There the grid (x,y)
     is scattered to a plotted point (u,v); here the same relationship is
     read as a distortion field: bands appear where a pixel's folded
     position and its mapped (u,v) nearly coincide. */
  vec2 P=q*70.0;
  float k=5.0*cos(P.x/14.0)*cos(P.y/30.0);
  float e=P.y/8.0-13.0;
  float dd=(k*k+e*e)/59.0+4.0;
  float qq=60.0-3.0*sin(atan(k,e))+k*(3.0+4.0/dd*sin(dd*dd-T(0.2)));
  float c=dd/2.0+e/99.0-T(1.0/18.0);
  float u=3.0*qq*sin(c);
  float v=3.0*(qq+9.0*dd)*cos(c);

  float feather=sin((u-P.x)*0.05)*sin((v-P.y)*0.05);
  float bands=0.5+0.5*sin(dd*0.6-T(0.15));

  float density=pow(max(0.0, feather*0.5+0.5), 3.0)*0.85 + bands*0.22 + lawBend;

  float hue=atan(k,e)/TAU + dd*0.012 + T(0.02) + lawBend*0.4 + seed*0.15;
  vec3 col=pal(hue)*min(1.4,density);

  /* A gentle vignette scaled to the real corner distance, not a hard circle
     that clips a portrait screen — the pattern still reaches every edge. */
  float r=length(p)/max(maxR,0.001);
  col*=mix(1.0, 0.72, smoothstep(0.32,1.05,r));

  o=vec4(pow(max(col,0.0),vec3(0.9)),1.0);
}`;

function sh(type,src){
  const x=gl.createShader(type); gl.shaderSource(x,src); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw Error(gl.getShaderInfoLog(x));
  return x;
}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U={};
['R','time','seed','loopMode','phase','loopDur','maxR','laws'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));

let seed=Math.random()*1000, laws=[];
let W=1,H=1,DPR=1,startTime=performance.now();

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize); resize();

function renderGL(loopModeV, phaseV){
  gl.uniform2f(U.R,canvas.width,canvas.height);
  gl.uniform1f(U.time,(performance.now()-startTime)*0.001);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.loopMode,loopModeV);
  gl.uniform1f(U.phase,phaseV);
  gl.uniform1f(U.loopDur,APKit.LOOP_DUR);
  gl.uniform1f(U.maxR,Math.hypot(canvas.width*.5,canvas.height*.5)/Math.min(canvas.width,canvas.height));
  const arr=new Float32Array(40);
  laws.forEach((L,i)=>{ if(i<10) arr.set(L,i*4); });
  gl.uniform4fv(U.laws,arr);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function addLaw(x,y,sign,strength,radius){
  const L=[x,y,sign*strength,radius];
  laws.push(L);
  if(laws.length>10) laws.shift();
  return L;
}

let activeLaw=null;
function loop(){
  if(!APKit.isExporting()){
    if(activeLaw){
      // grows the whole time it's held, so the effect is visible immediately
      // and keeps building — release only decides which way it ends up
      const held=performance.now()-activeLaw.downAt;
      const pulling = held>280;
      activeLaw.law[2]=(pulling?-1:1)*Math.min(1.7,0.35+held/650);
      activeLaw.law[3]=Math.min(0.55,0.16+held/2600);
    }
    renderGL(0,0);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- input: push on tap, pull if you hold, grows while held ----------
let lastTap=0;
function norm(clientX,clientY){ return [clientX/W, 1-clientY/H]; }

canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  const [x,y]=norm(e.clientX,e.clientY);
  if(now-lastTap<300){
    for(const L of laws) L[2]*=-1;      // double-tap reverses every law at once
    lastTap=0;
  }else{
    lastTap=now;
    const law=addLaw(x,y,1,0.35,0.16);
    activeLaw={law,downAt:now,id:e.pointerId};
  }
},{passive:true});

function endTouch(e){
  if(activeLaw && activeLaw.id===e.pointerId) activeLaw=null;
}
canvas.addEventListener('pointerup',endTouch,{passive:true});
canvas.addEventListener('pointercancel',endTouch,{passive:true});

// ---------- shared kit: clock, fullscreen, GIF ----------
APKit.init({
  canvas:canvas,
  gifName:'feather-fold-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){ renderGL(1,phase); },
  buttons:[
    {label:'\u2726',name:'mutate',onClick:function(){ seed=Math.random()*1000; laws=[]; }},
    {label:'\u21bb',name:'reset', onClick:function(){ laws=[]; }}
  ]
});
</script>
</body>
</html>
