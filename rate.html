<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ART PLAYGROUND / VOTE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:18px 14px 60px}header,main{max-width:900px;margin:auto}.kicker{font-size:11px;letter-spacing:.18em;color:#888893}h1{font-size:28px;margin:7px 0 4px}.sub{color:#9999a5;font-size:13px;line-height:1.6}#progress{margin-top:13px;font-size:13px}#bar{height:3px;background:#1c1c23;margin-top:8px;border-radius:9px;overflow:hidden}#fill{height:100%;width:0;background:#fff;transition:.25s}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:#0c0c11;border:1px solid #202027;border-radius:16px;overflow:hidden}.preview{aspect-ratio:4/5;background:#000;position:relative;cursor:pointer}.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.preview .open{position:absolute;right:8px;top:8px;padding:6px 8px;border-radius:999px;background:#111a;color:#fff;font-size:11px;border:1px solid #444}.body{padding:12px}.rank{font-size:10px;color:#666;letter-spacing:.12em}.title{font-size:15px;font-weight:600;margin:3px 0 10px}.stars{display:flex;gap:3px}button.star{border:0;background:transparent;color:#45454e;font-size:25px;line-height:1;padding:0 2px;cursor:pointer;touch-action:manipulation}button.star.on{color:#fff}.rated{font-size:10px;color:#777;margin-top:7px;min-height:12px}.actions{margin:18px auto 0;max-width:900px;display:flex;gap:8px;position:sticky;bottom:12px}.action{border:1px solid #333;background:#111118;color:#eee;border-radius:12px;padding:13px 15px;font-size:13px;cursor:pointer}#submit{flex:1;background:#f5f5f7;color:#050507;font-weight:700}#submit:disabled{opacity:.35}#reset{color:#999}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:20;padding:10px}.modal.open{display:flex;align-items:center;justify-content:center}.modalbox{width:min(900px,100%);height:min(92vh,900px);background:#000;border:1px solid #333;border-radius:16px;overflow:hidden;position:relative}.modal iframe{width:100%;height:100%;border:0}.close{position:absolute;right:10px;top:10px;z-index:2;border:1px solid #555;background:#111;color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px}@media(max-width:600px){body{padding:14px 10px 80px}.cards{gap:8px}.body{padding:10px}.title{font-size:13px}button.star{font-size:23px}.actions{margin-left:0;margin-right:0}}
</style></head><body><header><div class="kicker">ART PLAYGROUND / AUDIENCE VOTE</div><h1>作品を評価してください</h1><div class="sub">それぞれの作品を触って、直感で ★1〜★5。全10作品を評価したら送信できます。</div><div id="progress">0 / 10 評価済み</div><div id="bar"><div id="fill"></div></div></header><main><div class="cards" id="cards"></div></main><div class="actions"><button class="action" id="submit" disabled>10作品を評価して送信</button><button class="action" id="reset">リセット</button></div><div class="modal" id="modal"><div class="modalbox"><button class="close" id="close">×</button><iframe id="modalFrame" title="Artwork"></iframe></div></div><script>
const works=[['INFECTION','art-v47-infection.html'],['VOID FIELD II','void-field-ii.html'],['ART OF BECOMING','art-v36-art-of-becoming.html'],['ONE KNOT','art-v35-one-knot.html'],['DIVIDED LAW','art-v31-divided-law.html'],['STANDING LAW','art-v30-standing-law.html'],['LIVING ORDER','art-v28-living-order.html'],['PARTICLE COSMOS II','art-v27.html'],['ALIVE','art-v20.html'],['INK BLOOM','art-v10.html']];
const KEY='art-playground-public-vote-v1';let ratings=JSON.parse(localStorage.getItem(KEY)||'{}');
const cards=document.getElementById('cards');
function save(){localStorage.setItem(KEY,JSON.stringify(ratings))}
function render(){cards.innerHTML='';works.forEach((w,i)=>{let v=ratings[w[1]]||0;let c=document.createElement('article');c.className='card';c.dataset.i=i;c.innerHTML=`<div class="preview"><iframe loading="lazy" data-src="${w[1]}" title="${w[0]}"></iframe><span class="open">触って見る ↗</span></div><div class="body"><div class="rank">WORK ${String(i+1).padStart(2,'0')}</div><div class="title">${w[0]}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${n<=v?'on':''}" data-n="${n}">★</button>`).join('')}</div><div class="rated">${v?'評価：★ '+v+' / 5':'未評価'}</div></div>`;c.querySelector('.preview').onclick=()=>openArt(w[1]);c.querySelectorAll('.star').forEach(b=>b.onclick=()=>{ratings[w[1]]=+b.dataset.n;save();render();let next=works.findIndex((x,j)=>j>i&&!ratings[x[1]]);if(next>=0)setTimeout(()=>document.querySelector(`[data-i="${next}"]`).scrollIntoView({behavior:'smooth',block:'center'}),100)});cards.appendChild(c)});update();lazy()}
function update(){let n=works.filter(w=>ratings[w[1]]).length;document.getElementById('progress').textContent=`${n} / ${works.length} 評価済み`;document.getElementById('fill').style.width=n/works.length*100+'%';document.getElementById('submit').disabled=n!==works.length;document.getElementById('submit').textContent=n===works.length?'評価を送信':'10作品を評価して送信'}
function lazy(){let o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){let f=e.target;if(!f.src)f.src=f.dataset.src;o.unobserve(f)}}),{rootMargin:'300px'});document.querySelectorAll('iframe[data-src]').forEach(f=>o.observe(f))}
function openArt(url){document.getElementById('modalFrame').src=url;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeArt(){document.getElementById('modal').classList.remove('open');document.getElementById('modalFrame').src='';document.body.style.overflow=''}
document.getElementById('close').onclick=closeArt;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeArt()};document.getElementById('reset').onclick=()=>{if(confirm('この端末の評価を消しますか？')){ratings={};save();render()}};
document.getElementById('submit').onclick=async()=>{let votes=works.map(w=>({work:w[0],rating:ratings[w[1]]}));let b=document.getElementById('submit');b.disabled=true;b.textContent='送信中…';try{let r=await fetch('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({votes})});let d=await r.json();if(r.ok){localStorage.setItem(KEY+'_submitted','1');cards.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px 20px;background:#0c0c11;border:1px solid #202027;border-radius:16px"><div style="font-size:22px;font-weight:700">投票ありがとう。</div><div style="color:#888;margin-top:10px">あなたの評価を受け付けました。</div></div>';document.getElementById('progress').textContent='投票完了';document.getElementById('fill').style.width='100%';document.getElementById('submit').style.display='none'}else if(d.error==='ALREADY_VOTED'){alert('この端末からは、すでに投票済みです。')}else if(d.error==='DB_NOT_CONFIGURED'){alert('投票サーバーの設定がまだ完了していません。')}else throw new Error()}catch(e){alert('送信できませんでした。時間を置いてもう一度お試しください。');b.disabled=false;b.textContent='評価を送信'}};
render();
</script></body></html>
