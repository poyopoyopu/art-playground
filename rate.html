<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART PLAYGROUND / RANKING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}body{padding:18px 14px 60px}header{max-width:900px;margin:0 auto 18px}.kicker{font-size:11px;letter-spacing:.18em;color:#888893}h1{font-size:28px;margin:7px 0 4px;letter-spacing:-.03em}.sub{color:#9999a5;font-size:13px}#progress{margin-top:13px;font-size:13px;color:#c9c9d2}#bar{height:3px;background:#1c1c23;border-radius:9px;margin-top:8px;overflow:hidden}#fill{height:100%;width:0;background:#fff;transition:.25s}main{max-width:900px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#0c0c11;border:1px solid #202027;border-radius:16px;overflow:hidden;position:relative}.preview{aspect-ratio:4/5;background:#000;position:relative;overflow:hidden;cursor:pointer}.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.preview .open{position:absolute;right:8px;top:8px;padding:6px 8px;border-radius:999px;background:#111a;color:#fff;font-size:11px;border:1px solid #444}.body{padding:12px}.rank{font-size:10px;color:#666;letter-spacing:.12em}.title{font-size:15px;font-weight:600;margin:3px 0 10px}.stars{display:flex;gap:4px}button.star{border:0;background:transparent;color:#45454e;font-size:25px;line-height:1;padding:0 2px;cursor:pointer;touch-action:manipulation}button.star.on{color:#fff}.rated{font-size:10px;color:#777;margin-top:7px;min-height:12px}.actions{display:flex;gap:8px;margin:16px 0 0}.action{border:1px solid #292931;background:#0d0d13;color:#eee;border-radius:10px;padding:10px 12px;font-size:12px;cursor:pointer}#next{flex:1}#reset{color:#999}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:20;padding:10px}.modal.open{display:flex;align-items:center;justify-content:center}.modalbox{width:min(900px,100%);height:min(92vh,900px);background:#000;border:1px solid #333;border-radius:16px;overflow:hidden;position:relative}.modal iframe{width:100%;height:100%;border:0}.close{position:absolute;right:10px;top:10px;z-index:2;border:1px solid #555;background:#111;color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px}@media(max-width:600px){body{padding:14px 10px 50px}.cards{grid-template-columns:1fr 1fr;gap:8px}.body{padding:10px}.title{font-size:13px}button.star{font-size:23px}}
</style>
</head>
<body>
<header><div class="kicker">ART PLAYGROUND / RANKING</div><h1>作品評価</h1><div class="sub">触ってから、直感で ★1〜★5。迷ったら第一印象で。</div><div id="progress">0 / 10 rated</div><div id="bar"><div id="fill"></div></div></header>
<main><div class="cards" id="cards"></div><div class="actions"><button class="action" id="next">次の未評価へ →</button><button class="action" id="reset">リセット</button></div></main>
<div class="modal" id="modal"><div class="modalbox"><button class="close" id="close">×</button><iframe id="modalFrame" title="Artwork"></iframe></div></div>
<script>
const works=[
{title:'INFECTION',url:'art-v47-infection.html'},{title:'VOID FIELD II',url:'void-field-ii.html'},{title:'ART OF BECOMING',url:'art-v36-art-of-becoming.html'},{title:'ONE KNOT',url:'art-v35-one-knot.html'},{title:'DIVIDED LAW',url:'art-v31-divided-law.html'},{title:'STANDING LAW',url:'art-v30-standing-law.html'},{title:'LIVING ORDER',url:'art-v28-living-order.html'},{title:'PARTICLE COSMOS II',url:'art-v27.html'},{title:'ALIVE',url:'art-v20.html'},{title:'INK BLOOM',url:'art-v10.html'}];
const KEY='art-playground-ratings-v1';let ratings=JSON.parse(localStorage.getItem(KEY)||'{}');const cards=document.getElementById('cards'),progress=document.getElementById('progress'),fill=document.getElementById('fill');
function save(){localStorage.setItem(KEY,JSON.stringify(ratings))}function render(){cards.innerHTML='';works.forEach((w,i)=>{const v=ratings[w.url]||0,card=document.createElement('article');card.className='card';card.dataset.i=i;card.innerHTML=`<div class="preview"><iframe loading="lazy" data-src="${w.url}" title="${w.title}"></iframe><span class="open">触って見る ↗</span></div><div class="body"><div class="rank">WORK ${String(i+1).padStart(2,'0')}</div><div class="title">${w.title}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${n<=v?'on':''}" data-n="${n}" aria-label="${n} stars">★</button>`).join('')}</div><div class="rated">${v?`評価：★ ${v} / 5`:'未評価'}</div></div>`;card.querySelector('.preview').onclick=()=>openArt(w.url);card.querySelectorAll('.star').forEach(b=>b.onclick=()=>rate(w.url,+b.dataset.n,i));cards.appendChild(card)});updateProgress();lazyLoad()}
function rate(url,n,i){ratings[url]=n;save();render();setTimeout(()=>{const next=works.findIndex((w,j)=>j>i&&!ratings[w.url]);if(next>=0)document.querySelector(`[data-i="${next}"]`).scrollIntoView({behavior:'smooth',block:'center'})},120)}
function updateProgress(){const count=works.filter(w=>ratings[w.url]).length;progress.textContent=`${count} / ${works.length} rated`;fill.style.width=(count/works.length*100)+'%'}
function lazyLoad(){const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const f=e.target;if(!f.src)f.src=f.dataset.src;obs.unobserve(f)}}),{rootMargin:'300px'});document.querySelectorAll('iframe[data-src]').forEach(f=>obs.observe(f))}
function openArt(url){document.getElementById('modalFrame').src=url;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden'}function closeArt(){document.getElementById('modal').classList.remove('open');document.getElementById('modalFrame').src='';document.body.style.overflow=''}
document.getElementById('close').onclick=closeArt;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeArt()};document.getElementById('next').onclick=()=>{const i=works.findIndex(w=>!ratings[w.url]);if(i<0){alert('10作品すべて評価済みです。');return}document.querySelector(`[data-i="${i}"]`).scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('reset').onclick=()=>{if(confirm('評価をすべて消しますか？')){ratings={};save();render()}};render();
</script></body></html>
