<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — GRAVITY SCAR</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* GRAVITY SCAR v61 — ChatGPT作。世界のルール: 重力は触れた場所へ移るが、離れたあとも軌道に「傷」が残り、次の重力を曲げ続ける。 */
const c=document.getElementById('c'),g=c.getContext('2d'),TAU=Math.PI*2;let W=1,H=1,D=1,seed=Math.random()*99,scars=[],drag=null;function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function point(i,t){let s=Math.min(W,H),a=i*2.399+t*(.28+(i%7)*.009),r=s*(.045+(i%31)*.011);let x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;for(const q of scars){let dx=q.x-x,dy=q.y-y,d=Math.hypot(dx,dy)+18,k=Math.exp(-d/(s*.20))*.34;x+=dx*k;y+=dy*k;a+=q.k*Math.exp(-d/(s*.27));}return[x,y]}
function render(t,live){let s=Math.min(W,H);if(live){g.fillStyle='rgba(2,2,7,.17)';g.fillRect(0,0,W,H)}else{g.clearRect(0,0,W,H);g.fillStyle='#020207';g.fillRect(0,0,W,H)}let gx=W/2+Math.cos(t*.7+seed)*s*.20,gy=H/2+Math.sin(t*.9+seed)*s*.20;if(drag){gx=drag.x;gy=drag.y}for(let i=0;i<270;i++){let p=point(i,t),dx=gx-p[0],dy=gy-p[1],d=Math.hypot(dx,dy)+22,k=Math.min(75,3200/d);p[0]+=dx/d*k;p[1]+=dy/d*k;g.fillStyle=`hsla(${(i*2.3+seed*50)%360} 90% 72% / .62)`;g.fillRect(p[0],p[1],1.5+(i%3),1.5+(i%3))}for(const q of scars){g.beginPath();g.arc(q.x,q.y,10+5*Math.sin(t*1.5+q.k),0,TAU);g.strokeStyle='rgba(255,255,255,.55)';g.stroke()}g.beginPath();g.arc(gx,gy,15+4*Math.sin(t*2),0,TAU);g.strokeStyle='white';g.stroke()}
let st=performance.now();function frame(){render((performance.now()-st)/1000*TAU/3,true);requestAnimationFrame(frame)}frame();c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};scars.unshift({x:e.clientX,y:e.clientY,k:(Math.random()-.5)*1.4});scars=scars.slice(0,7)};c.onpointermove=e=>{if(drag){drag.x=e.clientX;drag.y=e.clientY}};c.onpointerup=()=>drag=null;
APKit.init({canvas:c,gifName:'gravity-scar-loop',clockFormat:'spec',loopFrame:p=>render(p,false),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>scars=[]}]});
</script></body></html>
