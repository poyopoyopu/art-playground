<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground — Psychedelic Garden</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff}
#title{position:absolute;top:24px;left:22px;font-size:22px;font-weight:700;letter-spacing:.05em;text-shadow:0 2px 15px #000}
#sub{position:absolute;top:54px;left:23px;font-size:10px;letter-spacing:.22em;opacity:.7}
#hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.5;white-space:nowrap}
button{pointer-events:auto;position:absolute;right:18px;top:18px;width:54px;height:54px;border-radius:50%;border:1px solid #ffffff33;background:#11162ad9;color:white;font-size:22px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="title">Art Playground</div><div id="sub">PSYCHEDELIC GARDEN · v22</div><button id="reset">↻</button><div id="hint">触れると、庭がうねる</div></div>
<script>
(()=>{
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,D=1,last=0,seed=Math.random()*9999;
let flowers=[],ripples=[],hue=0;

function R(n){return (Math.sin(n*127.1+seed*19.7)*43758.5453123)%1+1}
function rand(n,a,b){return a+(R(n)-Math.floor(R(n)))*(b-a)}

function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);
 build();
}
addEventListener('resize',resize);

function build(){
 flowers=[];
 const area=W*H, count=Math.min(150,Math.max(65,Math.floor(area/8500)));
 for(let i=0;i<count;i++){
   const s=rand(i*3,32,Math.min(W,H)*.16);
   flowers.push({
     x:rand(i*7,-s,W+s), y:rand(i*11,-s,H+s),
     s, petals:Math.floor(rand(i*13,7,19)),
     rot:rand(i*17,0,Math.PI*2), speed:rand(i*19,-.14,.14),
     phase:rand(i*23,0,Math.PI*2), hue:rand(i*29,0,360),
     type:Math.floor(rand(i*31,0,3)), alpha:rand(i*37,.35,.92)
   });
 }
}

function flower(f,t){
 const pulse=1+Math.sin(t*.75+f.phase)*.07;
 const rot=f.rot+t*f.speed*.18;
 g.save();g.translate(f.x,f.y);g.rotate(rot);g.scale(pulse,pulse);
 g.globalAlpha=f.alpha;
 for(let k=0;k<f.petals;k++){
   const a=k*Math.PI*2/f.petals;
   const wig=Math.sin(t*.9+k*1.7+f.phase)*.11;
   const len=f.s*(.65+Math.sin(t*.55+k+f.phase)*.08);
   const wid=f.s*(.12+((k%3)/60));
   const h=(f.hue+k*17+t*3)%360;
   g.save();g.rotate(a+wig);
   const grad=g.createRadialGradient(len*.25,0,1,len*.35,0,len);
   grad.addColorStop(0,`hsla(${h},100%,74%,.9)`);
   grad.addColorStop(.55,`hsla(${(h+55)%360},95%,58%,.55)`);
   grad.addColorStop(1,`hsla(${(h+110)%360},90%,55%,0)`);
   g.fillStyle=grad;
   g.beginPath();
   if(f.type===0){
     g.ellipse(len*.48,0,len*.5,wid,0,0,Math.PI*2);
   }else if(f.type===1){
     g.moveTo(0,0);g.bezierCurveTo(len*.25,-wid*2,len*.9,-wid,len,0);
     g.bezierCurveTo(len*.72,wid*1.5,len*.25,wid*2,0,0);
   }else{
     g.arc(len*.5,0,wid*.75,-Math.PI/2,Math.PI/2);
   }
   g.fill();g.restore();
 }
 // concentric eye
 for(let q=0;q<3;q++){
   g.strokeStyle=`hsla(${(f.hue+q*75+t*8)%360},100%,75%,.65)`;
   g.lineWidth=Math.max(.8,f.s*.025);
   g.beginPath();
   const rr=f.s*(.13+q*.095)*(1+Math.sin(t+q+f.phase)*.08);
   g.arc(0,0,rr,0,Math.PI*2);g.stroke();
 }
 g.fillStyle=`hsla(${(f.hue+t*12)%360},100%,82%,.85)`;
 g.beginPath();g.arc(0,0,f.s*.075,0,Math.PI*2);g.fill();
 g.restore();
}

function draw(tms){
 requestAnimationFrame(draw);
 const t=tms*.001;
 // faint trails = psychedelic flow
 g.fillStyle='rgba(2,3,10,.18)';g.fillRect(0,0,W,H);
 g.globalCompositeOperation='lighter';
 for(const f of flowers) flower(f,t);
 // moving color veins
 for(let n=0;n<7;n++){
   const yy=H*(n+.5)/7+Math.sin(t*.45+n*2.1)*35;
   g.strokeStyle=`hsla(${(hue+n*45)%360},100%,60%,.08)`;
   g.lineWidth=2;g.beginPath();
   for(let x=0;x<=W;x+=18){
     const y=yy+Math.sin(x*.012+t*.8+n)*16+Math.sin(x*.028-t*.45)*9;
     x?g.lineTo(x,y):g.moveTo(x,y);
   }g.stroke();
 }
 g.globalCompositeOperation='source-over';
 for(let i=ripples.length-1;i>=0;i--){
   let r=ripples[i];r.life-=.018;r.radius+=r.speed;
   g.strokeStyle=`hsla(${(hue+r.h)%360},100%,75%,${Math.max(0,r.life)*.45})`;
   g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,r.radius,0,Math.PI*2);g.stroke();
   if(r.life<=0)ripples.splice(i,1);
 }
 hue=(hue+.35)%360;
}

function touch(e){
 const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 ripples.push({x,y,radius:5,speed:4,life:1,h:Math.random()*120});
 for(const f of flowers){
   const dx=f.x-x,dy=f.y-y,d=Math.hypot(dx,dy);
   if(d<180){f.phase+=Math.PI*.8*(1-d/180);f.rot+=(Math.random()-.5)*.7;}
 }
 document.getElementById('hint').style.opacity='.15';
}
c.addEventListener('pointerdown',touch);
c.addEventListener('pointermove',e=>{if(e.buttons)touch(e)});
document.getElementById('reset').onclick=()=>{seed=Math.random()*9999;build();};
resize();requestAnimationFrame(draw);
})();
</script>
</body></html>
