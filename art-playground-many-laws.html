const c=document.getElementById('c');

const VS=`#version 300 es
precision highp float;in vec2 a;out vec2 uv;void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;

/* MANY LAWS: each pixel stores a local rule. R/G/B are three competing laws:
   geometry, rotation and density. Touch writes into that local rule map. */
const LAW_FS=`#version 300 es
precision highp float;out vec4 o;in vec2 uv;uniform sampler2D prevLaw;uniform vec2 lawRes;uniform float aspect,dtn,wipe;uniform int touchCount;uniform vec4 touch[5];
void main(){

 vec4 neutral=vec4(0.,.5,0.,1.); L=mix(L,neutral,clamp(.000004*dtn,0.,1.));
 for(int i=0;i<5;i++)if(i<touchCount){vec2 d=uv-touch[i].xy;d.x*=aspect;float w=exp(-dot(d,d)/(touch[i].z*touch[i].z+1e-5));

}`;

const MAIN_FS=`#version 300 es
precision highp float;out vec4 o;in vec2 uv;uniform vec2 res;uniform float time,seed,law,energy,chaos,loopMode,phase,loopDur,maxR;uniform int touchCount;uniform vec4 touch[5];uniform sampler2D prev,lawTex;#define PI 3.14159265359
float T(float k){float cyc=max(1.,floor(k*loopDur/6.2831853+.5));return mix(time*k,cyc*phase,loopMode);}
float hash21(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+31.17);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
mat2 rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
vec3 pal(float t){return .5+.5*cos(6.2831853*(vec3(.02,.34,.67)+t));}
vec2 fold(vec2 p,float k){for(int i=0;i<5;i++){p=abs(p);if(p.x<p.y)p=p.yx;p.x-=.47;p*=rot(.5236+k*.12);p*=1.025;}return p;}
float vor(vec2 p){vec2 g=floor(p),f=fract(p);float md=9.;for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 q=vec2(x,y),r=q+vec2(hash21(g+q),hash21(g+q+19.));md=min(md,length(q+ r*.72-f));}return md;}

 float r=length(q),a=atan(q.y,q.x);float sectors=5.+floor(A*9.);float rings=5.+floor(D*10.);

}
void main(){
 vec2 p=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);float tt=T(.37),L=law;vec4 LW=texture(lawTex,uv);float A=LW.r,D=LW.b,R=(LW.g-.5)*2.;
 /* local laws bend the coordinate field, not merely the colour */
 vec2 q=p;float rr=length(p),aa=atan(p.y,p.x);
 float globalWave=.035*sin(rr*11.-T(.51)+sin(aa*5.+T(.17))*2.);
 q=rot(R*(1.4+1.5*sin(rr*3.-tt)*.18))*q;
 q+=vec2(cos(aa*7.+tt),sin(aa*5.-tt))*globalWave*(.4+A);
 for(int k=0;k<4;k++){float kk=float(k);q=rot(sin(T(.067+kk*.013)+kk)*(.14+.12*chaos+A*.05))*q;q=fold(q*(1.32+kk*.28+L*.025+D*.12),L+kk*.3);q*=1./(1.+length(q)*(.12+.04*D));}
 float touchEnergy=0.;
 for(int i=0;i<5;i++)if(i<touchCount){vec2 tp=(touch[i].xy-.5*res)/min(res.x,res.y);float d=length(p-tp),w=exp(-d*d/(touch[i].z*touch[i].z+.0001));touchEnergy+=w;q=rot(w*(1.8+L*.3)*touch[i].w)*q;q+=(tp-p)*w*(.12+.32*energy);}
 float f=field(q,L,A,D,tt);float micro=n2(q*12.+f*4.)*.32+n2(q*31.-f*5.+seed)*.14;
 /* phase competition: occasionally one law dominates, then another takes over */
 float age=.5+.5*sin(T(.083)+seed*.17);float regime=smoothstep(.28,.72,.5+.5*sin(T(.031)+A*4.-D*3.+seed));
 float bands=sin((f+micro)*11.+L*1.8+tt)+.55*sin((f+micro)*27.-T(.63))+regime*.45*sin((f+micro)*43.+T(.21));
 float hue=.08+f*.43+bands*.095+L*.028+rr*.34+A*.48+D*.25+regime*.16;
 vec3 col=pal(hue);float glow=.55+.45*sin(f*9.+tt+age*2.);col*=.68+.54*glow;
 /* rare crystalline seams emerge where competing laws disagree */
 float seam=abs(sin((q.x+q.y)*22.+f*5.+A*8.)*sin((q.x-q.y)*19.-f*4.+D*7.));seam=pow(seam,22.);col+=(.5+.5*pal(hue+.48))*seam*(.24+.22*regime);

 /* slow feedback makes the world remember its own previous shape */

 float d=length(p)/maxR;float vign=1.-smoothstep(.58,1.16,d);col*=.84+.16*vign;

}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}

const U={};['res','time','seed','law','energy','chaos','loopMode','phase','loopDur','maxR','touchCount','prev','lawTex'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));const UT=[];for(let i=0;i<5;i++)UT.push(gl.getUniformLocation(prog,'touch['+i+']'));

let W=1,H=1,dpr=1,Atex=null,Btex=null,lawA=null,lawB=null;let law=3.8,targetLaw=3.8,energy=.32,chaos=.52,seed=Math.random()*1000,last=performance.now(),lastMutate=performance.now(),exporting=false,wipeFlag=0;const fingers=new Map();const LAWRES=180;const LOOP_DUR=3;
function tex(w,h){const x=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,x);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);return x}
const fbo=gl.createFramebuffer();function bindTarget(t,w,h){gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.viewport(0,0,w,h)}function clearTo(t,w,h,r,g,b){bindTarget(t,w,h);gl.clearColor(r,g,b,1);gl.clear(gl.COLOR_BUFFER_BIT)}
function initLaw(){if(lawA)gl.deleteTexture(lawA);if(lawB)gl.deleteTexture(lawB);lawA=tex(LAWRES,LAWRES);lawB=tex(LAWRES,LAWRES);clearTo(lawA,LAWRES,LAWRES,0,.5,0);clearTo(lawB,LAWRES,LAWRES,0,.5,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null)}initLaw();
function resize(){const r=c.getBoundingClientRect(),vw=Math.max(1,Math.round(r.width)),vh=Math.max(1,Math.round(r.height));dpr=Math.min(devicePixelRatio||1,1.65);const nw=Math.max(1,Math.floor(vw*dpr)),nh=Math.max(1,Math.floor(vh*dpr));if(nw===W&&nh===H&&Atex)return;W=nw;H=nh;c.width=W;c.height=H;if(Atex)gl.deleteTexture(Atex);if(Btex)gl.deleteTexture(Btex);Atex=tex(W,H);Btex=tex(W,H);clearTo(Atex,W,H,.005,.003,.012);clearTo(Btex,W,H,.005,.003,.012);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H)}
let rq=0;function queue(){if(rq)return;rq=1;requestAnimationFrame(()=>{rq=0;resize()})}new ResizeObserver(queue).observe(c);addEventListener('resize',queue,{passive:true});addEventListener('orientationchange',()=>setTimeout(queue,120),{passive:true});if(window.visualViewport)visualViewport.addEventListener('resize',queue,{passive:true});resize();
function swap(){const x=Atex;Atex=Btex;Btex=x}function swapLaw(){const x=lawA;lawA=lawB;lawB=x}
function mutate(power){power=power||1;seed=Math.random()*1000;targetLaw=1.5+Math.random()*10;chaos=Math.max(.15,Math.min(1,chaos+(Math.random()-.32)*.4*power));energy=Math.min(1,energy+.55*power);const f=document.getElementById('flash');f.style.opacity=.1;setTimeout(()=>f.style.opacity=0,90)}

function frame(now){if(exporting){requestAnimationFrame(frame);return}const dt=Math.min(.04,(now-last)/1000);last=now;energy*=Math.pow(.22,dt);law+=(targetLaw-law)*Math.min(1,dt*.65);if(now-lastMutate>18000){if(Math.random()<.52)mutate(.35);lastMutate=now}stepLaw(dt*60);setUniforms(now*.001,0,0);drawMain();requestAnimationFrame(frame)}requestAnimationFrame(frame);
