<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — GRAVITY</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* GRAVITY v54 — ChatGPT作。世界のルール: すべての物質は重力中心へ落ちる。放置すると中心は漂い、タップした場所が新しい重力中心になる。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,cx,cy,tx,ty,t=0,seed=Math.random()*9,pts=[];function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(cx==null){cx=W/2;cy=H/2;tx=cx;ty=cy}}addEventListener('resize',size);size();for(let i=0;i<260;i++){let a=i*2.399,r=30+(i%17)*18;pts.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0,s:1+(i%4)*.45})}
function draw(loop=false,ph=0){if(loop)t=ph*6.283;else t+=.012;g.fillStyle='rgba(3,3,7,.18)';g.fillRect(0,0,W,H);if(!loop){cx+=(tx-cx)*.018+Math.cos(t*.23+seed)*.12;cy+=(ty-cy)*.018+Math.sin(t*.19+seed)*.12}for(const p of pts){let dx=cx-p.x,dy=cy-p.y,d=Math.hypot(dx,dy)+18,a=150/d;p.vx+=dx/d*a*.85;p.vy+=dy/d*a*.85;p.vx*=.985;p.vy*=.985;p.x+=p.vx*.85;p.y+=p.vy*.85;if(p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){p.x=cx+(Math.random()-.5)*80;p.y=cy+(Math.random()-.5)*80;p.vx=p.vy=0}g.fillStyle=`hsl(${(Math.atan2(dy,dx)/Math.PI*180+seed*80+360)%360} 90% 72%)`;g.globalAlpha=Math.min(.9,40/d);g.beginPath();g.arc(p.x,p.y,p.s,0,6.283);g.fill()}g.globalAlpha=1;g.strokeStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(cx,cy,18+12*Math.sin(t*.7),0,6.283);g.stroke();if(!loop)requestAnimationFrame(()=>draw())}draw();c.addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});APKit.init({canvas:c,gifName:'gravity-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{g.clearRect(0,0,W,H);draw(true,p)},buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>{cx=W/2;cy=H/2;tx=cx;ty=cy}}]});
</script></body></html>
