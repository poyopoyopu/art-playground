<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — GRAVITY</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none;-webkit-user-select:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* GRAVITY v54 — ChatGPT作。世界のルール: 重力中心が世界を支配する。触れた場所へ重力が乗り移り、物質の軌道そのものが変わる。GIFは3秒完全ループ。 */
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D=1,clock=0,seed=Math.random()*99,well=null,wellBorn=0;const N=260;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function center(t){let s=Math.min(W,H),r=s*.23;return [W/2+Math.cos(t*.73+seed)*r,H/2+Math.sin(t*.91+seed*1.7)*r]}
function particle(i,t,interactive){let a=i*2.399+seed*.4,rad=25+(i%29)*Math.min(W,H)*.017;let spin=t*(.12+(i%7)*.009),x=W/2+Math.cos(a+spin)*rad,y=H/2+Math.sin(a+spin)*rad;let [cx,cy]=center(t*.35);if(interactive&&well){let age=Math.min(1,(performance.now()-wellBorn)/5000),dx=well.x-cx,dy=well.y-cy;cx+=dx*(1-age);cy+=dy*(1-age)}let dx=cx-x,dy=cy-y,d=Math.hypot(dx,dy)+20,force=Math.min(80,9000/d);x+=dx/d*force*Math.sin(t*.7+i*.17);y+=dy/d*force*Math.sin(t*.7+i*.17);return [x,y,cx,cy]}
function render(t,interactive=false){g.setTransform(D,0,0,D,0,0);g.fillStyle='rgba(3,3,7,.20)';g.fillRect(0,0,W,H);let [cx,cy]=center(t*.35);for(let i=0;i<N;i++){let p=particle(i,t,interactive),dx=p[2]-p[0],dy=p[3]-p[1],h=(Math.atan2(dy,dx)/Math.PI*180+seed*37+360)%360;g.globalAlpha=.18+.7/(1+Math.hypot(dx,dy)/90);g.fillStyle=`hsl(${h} 90% 72%)`;g.beginPath();g.arc(p[0],p[1],1+(i%4)*.45,0,Math.PI*2);g.fill()}g.globalAlpha=.8;g.strokeStyle='rgba(255,255,255,.65)';g.beginPath();g.arc(cx,cy,18+8*Math.sin(t*1.4),0,Math.PI*2);g.stroke();g.globalAlpha=1}
function animate(){clock=(performance.now()%30000)/1000;render(clock,true);requestAnimationFrame(animate)}animate();c.addEventListener('pointerdown',e=>{well={x:e.clientX,y:e.clientY};wellBorn=performance.now()});
APKit.init({canvas:c,gifName:'gravity-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>render(ph*2*Math.PI,false),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>well=null}]});
</script></body></html>
