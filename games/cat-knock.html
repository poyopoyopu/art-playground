<!doctype html>
<!-- ねこが落とす (CAT KNOCK) — クロード作(猫の絵=おっちゃんの三毛猫ドット絵に差し替え 2026-10-02)(おっちゃん「猫は棚から物を落とすよね?それをゲームにしたい」→猫視点・落ちる物はいろいろ混ぜる)。ギャラリー作品ではなくgames/のゲーム。ap-kit.jsは使わない -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ねこが落とす</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a2230;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
html,body,canvas,button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,40,.55);z-index:10;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
#ov.off{display:none}
#ov .box{width:min(320px,86%);background:#FFF6E6;color:#5A3A2A;border-radius:22px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
#ov h1{margin:0 0 4px;font-size:30px;letter-spacing:.06em}
#ov .cat{font-size:44px;line-height:1.1}
#ov p{margin:8px 0 0;font-size:13px;line-height:1.8}
#ov ul{margin:12px 0 0;padding:0;list-style:none;text-align:left;font-size:13px;line-height:1.75}
#ov li{padding:2px 0 2px 1.6em;text-indent:-1.6em}
#ov .res{margin:10px 0 0;font-size:15px;line-height:1.7}
#ov .res b{font-size:30px;color:#D9732B}
#ov button{margin-top:16px;width:100%;padding:13px 0;border:0;border-radius:14px;background:#F0A44B;color:#fff;font:700 17px inherit;
  letter-spacing:.1em;font-family:inherit;box-shadow:0 4px 0 #C9772A}
#ov button:active{transform:translateY(3px);box-shadow:0 1px 0 #C9772A}
#mute{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;width:38px;height:38px;border-radius:50%;
  border:0;background:rgba(255,255,255,.5);font-size:18px;line-height:1;padding:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<button id="mute" aria-label="sound">🔊</button>
<div id="ov"><div class="box">
  <div class="cat">🐈</div>
  <h1 id="ttl">ねこが落とす</h1>
  <p id="sub">棚の上の物は、ねこにとっては「落とすもの」。</p>
  <ul id="rules">
    <li>👆 物をタップ → ねこが目を合わせて、チョン</li>
    <li>👀 飼い主がこっちを見てる間に落ちると、バレる</li>
    <li>💢 3回バレたらおしまい。続けて落とすとコンボ!</li>
  </ul>
  <div class="res" id="res"></div>
  <button id="go">はじめる</button>
</div></div>
<script>
(function(){
'use strict';
const cv=document.getElementById('cv');let cx=cv.getContext('2d');
const ov=document.getElementById('ov'),goBtn=document.getElementById('go'),muteBtn=document.getElementById('mute');
const H=600,FLOOR=552,G=1500,FONT='"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif';
let DPR=1,S=1,Ww=277,RW=277,offX=0,safeTop=0;
const SH=[];let SURF=[];
let T=0,lastAct=-9,state='title',score=0,best=0,strikes=0,day=1,combo=0,lastDropT=-9,shake=0,flash=0,overT=0,tidyT=-1,hintOn=true,ovShown=false;
let items=[],parts=[],puddles=[],floats=[];
try{best=parseInt(localStorage.getItem('catknock.best')||'0',10)||0;}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- sound ---------- */
let AC=null,master=null,muted=false,nbuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    const n=AC.sampleRate;nbuf=AC.createBuffer(1,n,AC.sampleRate);const d=nbuf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,ftype,freq,delay,q){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
const SND={
  paw(){noise(.05,.35,'bandpass',1800,0,2);tone(300,150,.06,'sine',.2);},
  meow(){tone(620,880,.12,'triangle',.22);tone(880,520,.28,'triangle',.22,.1);},
  tick(v){noise(.04,.15*v,'highpass',2500);},
  thud(v){tone(120,50,.14,'sine',.45*v);noise(.08,.3*v,'lowpass',500);},
  glass(){for(let i=0;i<6;i++)tone(2200+Math.random()*3000,1800+Math.random()*1000,.12+Math.random()*.1,'sine',.12,i*.025);noise(.25,.35,'highpass',3500);},
  ceramic(){noise(.2,.5,'bandpass',1500,0,1.2);tone(520,200,.12,'triangle',.25);for(let i=0;i<4;i++)tone(1200+Math.random()*1500,900,.06,'sine',.1,.04+i*.04);},
  pot(){noise(.25,.45,'lowpass',900);tone(180,70,.15,'sine',.4);noise(.12,.2,'highpass',2000,.05);},
  ring(){for(let i=0;i<8;i++){const f=i%2?1500:1800;tone(f,f,.07,'square',.12,i*.09);}},
  shout(){tone(260,150,.35,'sawtooth',.28);tone(390,200,.3,'square',.1);},
  strike(){tone(200,90,.4,'sawtooth',.25);},
  tidy(){for(let i=0;i<4;i++){const f=440*Math.pow(1.26,i);tone(f,f,.1,'triangle',.18,i*.07);}},
  combo(n){tone(500+n*80,900+n*80,.12,'triangle',.2);},
  bounce(v){tone(300*v+150,120,.07,'sine',.25*v);}
};
function snd(n,a){if(!AC||muted)return;try{SND[n](a);}catch(e){}}

/* ---------- items ---------- */
const TYPES={
  mug:{w:22,h:20,cr:11,brk:430,pts:100,m:1,fric:4.5,e:.25,word:'ガシャン!',kind:'ceramic'},
  vase:{w:22,h:40,cr:14,brk:380,pts:300,m:1.3,fric:4.5,e:.2,word:'パリーン!',kind:'ceramic'},
  glass:{w:16,h:24,cr:10,brk:300,pts:150,m:.7,fric:5,e:.2,word:'パリン!',kind:'glass'},
  pencil:{w:36,h:7,cr:5,pts:30,m:.3,fric:.9,round:true,spin:false,e:.3},
  book:{w:32,h:20,cr:14,pts:80,m:1.6,fric:7,e:.15,thud:true},
  plant:{w:30,h:42,cr:15,brk:360,pts:250,m:1.7,fric:6,e:.15,word:'ガシャッ!',kind:'pot'},
  apple:{w:22,h:22,cr:11,pts:50,m:.8,fric:.55,round:true,spin:true,e:.45},
  clock:{w:28,h:28,cr:14,brk:700,pts:150,m:1,fric:1.2,round:true,spin:true,e:.3,ring:true,word:'ガシャン!',kind:'ceramic'},
  frame:{w:24,h:30,cr:13,brk:340,pts:150,m:.8,fric:5,e:.2,word:'ガチャン!',kind:'glass'},
  ball:{w:20,h:20,cr:10,pts:20,m:.5,fric:.35,round:true,spin:true,e:.72},
  tissue:{w:30,h:22,cr:13,pts:60,m:.7,fric:6,e:.1},
  remote:{w:30,h:10,cr:7,pts:60,m:.4,fric:5,e:.2}
};
/* 物のサイズ(当たり判定も)を一括で縮める。絵は下のitemSpriteでドット化して同じ倍率で描く */
const IS=.62;
Object.keys(TYPES).forEach(function(k){const t=TYPES[k];t.w=Math.round(t.w*IS*10)/10;t.h=Math.round(t.h*IS*10)/10;t.cr=Math.round(t.cr*IS*10)/10;});
let DOT=1.6,CP=1.6;const ISPR=new Map();
function setDot(){DOT=Math.max(1,Math.round(1.6*S))/S;CP=DOT;ISPR.clear();}
const COLS={
  mug:['#F2EBDD','#E86A5E','#6FB5E0','#F2C14E'],
  vase:['#5B9BD5','#E58FB0','#78B58C','#E7B24C'],
  book:['#C0504D','#4F81BD','#6AA84F','#8E6BBF']
};
function mk(n,x,si){
  const ty=TYPES[n];
  return {t:n,x:x,y:SH[si].y-ty.h/2,vx:0,vy:0,ang:0,av:0,surf:si,hb:ty.h/2,cr:ty.cr,m:ty.m,ci:Math.floor(Math.random()*4),
    knocked:false,chain:false,scored:false,lap:0,pop:1,ring:0,dead:false,pushed:false};
}
function layout(){
  SH.length=0;
  SH.push({x0:RW*.1,x1:RW*.68,y:190});
  SH.push({x0:RW*.34,x1:RW*.9,y:318});
  SH.push({x0:RW*.08,x1:RW*.72,y:446});
  SURF=SH.concat([{x0:-1e9,x1:1e9,y:FLOOR,floor:true}]);
}
function restock(){
  items.length=0;parts.length=0;puddles.length=0;
  const names=Object.keys(TYPES);let bag=[];
  const kMax=Math.min(7,4+Math.floor((day-1)/2));let delay=0;
  SH.forEach(function(s,si){
    let x=s.x0+8+Math.random()*6,k=0;
    while(k<kMax){
      if(!bag.length)bag=names.slice().sort(function(){return Math.random()-.5;});
      const n=bag.pop(),ty=TYPES[n];
      if(x+ty.w>s.x1-8)break;
      const it=mk(n,x+ty.w/2,si);it.pop=-delay;delay+=.07;items.push(it);
      x+=ty.w+5+Math.random()*9;k++;
    }
  });
}

/* ---------- cat ---------- */
const cat={x:100,y:318,shelf:1,face:1,st:'idle',t:0,plan:[],cur:null,info:null,item:null,queue:null,walkT:0,blinkT:0,nextBlink:2,
  ext:0,smug:0,pet:0,jmp:null};
function catPlace(si){
  cat.shelf=si;cat.x=(SH[si].x0+SH[si].x1)/2;cat.y=SH[si].y;
  cat.plan=[];cat.cur=null;cat.item=null;cat.queue=null;cat.st='idle';cat.ext=0;
}
function standFor(it){
  const s=SH[it.surf],dl=it.x-s.x0,dr=s.x1-it.x,dir=dl<dr?-1:1,dist=Math.min(dl,dr);
  const sx=clamp(it.x-dir*(it.cr+14),s.x0+12,s.x1-12);
  return {dir:dir,dist:dist,standX:sx};
}
function validTarget(q){return q&&!q.dead&&q.surf>=0&&q.surf<3&&Math.abs(q.vx)<=3&&q.pop>=1;}
function startPlan(it){
  const info=standFor(it);cat.info=info;cat.item=it;cat.plan=[];
  if(cat.shelf!==it.surf)cat.plan.push({k:'jump',to:it.surf,x:info.standX});
  cat.plan.push({k:'move',x:info.standX},{k:'stare'},{k:'paw'});
  cat.cur=null;catNext();
}
function catNext(){
  if(cat.plan.length){
    cat.cur=cat.plan.shift();cat.t=0;cat.st=cat.cur.k;
    if(cat.cur.k==='jump')cat.jmp={x0:cat.x,y0:cat.y,x1:cat.cur.x,y1:SH[cat.cur.to].y};
    if(cat.cur.k==='paw'){cat.pushed=false;cat.gentle=cat.info.dist<45;cat.ext=0;}
    if(cat.cur.k==='stare')cat.face=cat.info.dir;
  }else{
    cat.cur=null;cat.st='idle';cat.t=0;cat.item=null;cat.ext=0;
    if(cat.queue){const q=cat.queue;cat.queue=null;if(validTarget(q))startPlan(q);}
  }
}
function order(it){
  if(cat.item===it&&cat.cur)return;
  if(cat.cur&&(cat.cur.k==='jump'||cat.cur.k==='paw')){cat.queue=it;return;}
  startPlan(it);
}
function doPush(){
  const it=cat.item;if(!it||!validTarget(it))return;
  const ty=TYPES[it.t],d=cat.info.dir,dist=cat.info.dist;
  let v0=ty.fric*(dist+12);
  if(cat.gentle)v0=clamp(v0,ty.round?110:90,260);else v0=clamp(v0,ty.round?300:260,900);
  it.vx=d*v0;it.knocked=true;it.pushed=true;lastAct=T;snd('paw');
  if(Math.random()<.35)snd('meow');
}
function catUpdate(dt){
  cat.blinkT-=dt;cat.nextBlink-=dt;
  if(cat.nextBlink<=0){cat.blinkT=.12;cat.nextBlink=rnd(2,5);}
  if(cat.smug>0)cat.smug-=dt;if(cat.pet>0)cat.pet-=dt;
  if(cat.st==='shock'){cat.t+=dt;if(cat.t>1.0){cat.st='idle';cat.t=0;}return;}
  const c=cat.cur;
  if(c&&c.k!=='paw'&&c.k!=='jump'&&!validTarget(cat.item)){cat.plan=[];cat.cur=null;cat.st='idle';cat.item=null;cat.ext=0;return;}
  if(!c){
    if(cat.queue){const q=cat.queue;cat.queue=null;if(validTarget(q))startPlan(q);}
    return;
  }
  cat.t+=dt;
  if(c.k==='jump'){
    const u=Math.min(1,cat.t/.55),j=cat.jmp;
    cat.x=j.x0+(j.x1-j.x0)*u;
    cat.y=j.y0+(j.y1-j.y0)*u-Math.sin(Math.PI*u)*(46+Math.abs(j.y1-j.y0)*.25);
    cat.face=j.x1>=j.x0?1:-1;
    if(u>=1){cat.shelf=c.to;cat.y=SH[c.to].y;cat.x=j.x1;catNext();}
  }else if(c.k==='move'){
    const dx=c.x-cat.x,sp=105*dt;cat.face=dx>=0?1:-1;cat.walkT+=dt;
    if(Math.abs(dx)<=sp){cat.x=c.x;catNext();}else cat.x+=Math.sign(dx)*sp;
  }else if(c.k==='stare'){
    if(cat.t>=.55)catNext();
  }else if(c.k==='paw'){
    const g=cat.gentle,tp=g?.8:.12,tot=g?1.2:.45,ex=g?.5:.12;
    if(cat.t<ex)cat.ext=cat.t/ex;else if(cat.t<tp+.15)cat.ext=1;else cat.ext=Math.max(0,1-(cat.t-tp-.15)/(tot-tp-.15));
    if(!cat.pushed&&cat.t>=tp){cat.pushed=true;doPush();}
    if(cat.t>=tot)catNext();
  }
}

/* ---------- owner ---------- */
const O={st:'down',t:0,dur:3.8};
const downDur=()=>rnd(Math.max(1.5,3.4-.3*(day-1)),Math.max(2.8,5.4-.35*(day-1)));
const lookDur=()=>rnd(1.0,Math.min(1.9,1.2+day*.12));
function ownerUpdate(dt){
  O.t+=dt;
  if(state!=='play')return;
  if(O.st==='down'){if(O.t>=O.dur){O.st='warn';O.t=0;O.dur=Math.max(.38,.72-day*.04);}}
  else if(O.st==='warn'){if(O.t>=O.dur){O.st='look';O.t=0;O.dur=lookDur();}}
  else if(O.st==='look'){
    if(T-lastAct<.4)caught();
    else if(O.t>=O.dur){O.st='down';O.t=0;O.dur=downDur();}
  }else if(O.st==='caught'){if(O.t>=1.5){O.st='down';O.t=0;O.dur=2.6;}}
}
function loudEvent(p){
  if(state==='play'&&O.st==='down'&&Math.random()<p){O.st='warn';O.t=0;O.dur=.75;}
}
function caught(){
  O.st='caught';O.t=0;strikes++;combo=0;shake=.5;flash=.6;
  snd('shout');setTimeout(function(){snd('strike');},180);
  cat.st='shock';cat.t=0;cat.plan=[];cat.cur=null;cat.queue=null;cat.item=null;cat.ext=0;
  floats.push({x:RW-62,y:FLOOR-120,txt:'バレた!',col:'#D93A2B',life:1.4,t:0,size:20,vy:-14});
  if(strikes>=3){state='over';overT=0;ovShown=false;}
}

/* ---------- scoring / fx ---------- */
function drop(it){
  if(it.scored)return;it.scored=true;
  combo=(T-lastDropT<2.4)?combo+1:1;lastDropT=T;
  const mult=Math.min(combo,6),ty=TYPES[it.t];
  let p=ty.pts*mult*(it.chain?1.5:1)*(it.lap>0?.5:1);p=Math.round(p);
  score+=p;
  floats.push({x:it.x,y:it.y-18,txt:'+'+p,col:'#E8742A',life:1.1,t:0,size:15,vy:-34});
  if(it.chain)floats.push({x:it.x,y:it.y-34,txt:'ドミノ!',col:'#3A8F6B',life:1.1,t:0,size:12,vy:-30});
  if(combo>=2)snd('combo',combo);
  if(it.pushed)cat.smug=1.1;
  it.lap++;
}
function addShard(x,y,col,n,vmax){
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+rnd(-1.5,1.5),v=rnd(60,vmax);
    parts.push({k:'shard',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:rnd(0,6),vr:rnd(-9,9),s:rnd(2.5,6),col:col[Math.floor(Math.random()*col.length)],rest:false});
  }
  if(parts.length>260)parts.splice(0,parts.length-260);
}
function breakItem(it,v){
  const ty=TYPES[it.t];it.dead=true;lastAct=T;
  const mult=Math.min(Math.max(combo,1),6),p=Math.round(ty.pts*mult);score+=p;
  floats.push({x:it.x,y:it.y-26,txt:ty.word,col:'#C23B5B',life:1.2,t:0,size:17,vy:-26,rot:rnd(-.2,.2)});
  floats.push({x:it.x+16,y:it.y-8,txt:'+'+p,col:'#E8742A',life:1.1,t:0,size:13,vy:-30});
  let cols;
  if(ty.kind==='glass'){cols=['#DDF1FF','#BFE3FA','#FFFFFF'];
    for(let i=0;i<10;i++){const a=-Math.PI/2+rnd(-1.4,1.4),sp=rnd(40,200);parts.push({k:'drop',x:it.x,y:it.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.5,1)});}
    puddles.push({x:it.x,y:it.y+it.hb,w:0,wMax:rnd(16,26),a:.55});
  }else if(ty.kind==='pot'){cols=['#C9733F','#A85B2E','#6B4A2B','#4F9A4B'];}
  else{const c=COLS[it.t]?COLS[it.t][it.ci%4]:'#E8E2D4';cols=[c,c,'#FFFFFF','#8A6A4A'];}
  addShard(it.x,it.y,cols,13,300);
  snd(ty.kind==='glass'?'glass':ty.kind==='pot'?'pot':'ceramic');
  if(ty.ring)snd('ring');
  shake=Math.max(shake,.18);loudEvent(.55);
}
function impactSound(it,v){
  const ty=TYPES[it.t],a=clamp(v/900,.25,1);
  if(ty.ring){it.ring=1.6;snd('ring');loudEvent(.6);lastAct=T;return;}
  if(ty.thud||ty.m>1)snd('thud',a);else if(ty.round)snd('bounce',a);else snd('tick',a*1.5);
  if(v>500)loudEvent(.3*a);
}

/* ---------- physics ---------- */
function land(it,i,s){
  const ty=TYPES[it.t],v=it.vy;it.y=s.y-it.hb;
  if(ty.brk&&v>ty.brk){breakItem(it,v);return;}
  if(v>140)impactSound(it,v);
  const nvy=-v*ty.e;
  if(Math.abs(nvy)<70){
    it.surf=i;it.vy=0;it.av=0;
    if(!s.floor){it.scored=false;}
  }else{it.vy=nvy;it.surf=-1;it.av*=.6;it.vx*=.85;}
}
function stepItem(it,dt){
  if(it.dead)return;
  const ty=TYPES[it.t];
  if(it.ring>0)it.ring-=dt;
  if(it.pop<1)it.pop+=dt*3.2;
  if(it.surf>=0){
    const s=SURF[it.surf];
    if(it.vx!==0){
      it.vx*=Math.exp(-ty.fric*dt);
      if(Math.abs(it.vx)<(ty.round?5:6))it.vx=0;
      it.x+=it.vx*dt;
      if(ty.spin)it.ang+=it.vx/ty.cr*dt;
    }
    if(!ty.spin){const tg=Math.round(it.ang/Math.PI)*Math.PI;it.ang+=(tg-it.ang)*Math.min(1,dt*14);}
    it.y=s.y-it.hb;
    if(s.floor){
      if(it.x<it.cr){it.x=it.cr;it.vx=Math.abs(it.vx)*.4;}
      if(it.x>RW-it.cr){it.x=RW-it.cr;it.vx=-Math.abs(it.vx)*.4;}
    }else if(it.x<s.x0||it.x>s.x1){
      it.surf=-1;it.vy=0;
      it.av=ty.spin?it.vx/ty.cr:(it.x>s.x1?1:-1)*(2.5+Math.abs(it.vx)/50);
      drop(it);
    }
    if(it.surf>=0&&it.vx===0&&Math.abs(it.vy)<1){it.knocked=false;it.chain=false;it.pushed=false;}
    return;
  }
  const pb=it.y+it.hb;
  it.vy+=G*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.ang+=it.av*dt;
  if(it.x<it.cr){it.x=it.cr;it.vx=Math.abs(it.vx)*.5;}
  if(it.x>RW-it.cr){it.x=RW-it.cr;it.vx=-Math.abs(it.vx)*.5;}
  if(it.vy>0){
    const nb=it.y+it.hb;
    for(let i=0;i<SURF.length;i++){
      const s=SURF[i];
      if(pb<=s.y+1&&nb>=s.y&&it.x>=s.x0&&it.x<=s.x1){land(it,i,s);break;}

}
function collide(a,b){
  let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);const rr=a.cr+b.cr;
  if(d>=rr)return;
  if(d<.001){dx=Math.random()-.5;dy=-.1;d=Math.hypot(dx,dy);}
  const nx=dx/d,ny=dy/d,ov=rr-d,ar=a.surf>=0,br=b.surf>=0;
  if(ar&&br){const sx=Math.sign(dx)||(Math.random()<.5?1:-1);a.x-=sx*ov*.5;b.x+=sx*ov*.5;}
  else if(ar){b.x+=nx*ov;b.y+=ny*ov;}
  else if(br){a.x-=nx*ov;a.y-=ny*ov;}
  else{a.x-=nx*ov*.5;a.y-=ny*ov*.5;b.x+=nx*ov*.5;b.y+=ny*ov*.5;}
  const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
  if(vn<0){
    const ia=1/a.m,ib=1/b.m,j=-(1.35)*vn/(ia+ib),sp=-vn;
    a.vx-=j*ia*nx;a.vy-=j*ia*ny;b.vx+=j*ib*nx;b.vy+=j*ib*ny;
    if(Math.abs(nx)<.4&&(!ar||!br)){const sg=nx>=0?1:-1;if(ar)a.vx-=sg*50;else if(br)b.vx+=sg*50;else{a.vx-=sg*30;b.vx+=sg*30;}}
    if(ar){a.vy=0;if(Math.abs(a.vx)>1){a.knocked=true;a.chain=true;}}
    if(br){b.vy=0;if(Math.abs(b.vx)>1){b.knocked=true;b.chain=true;}}
    if(sp>110)snd('tick',clamp(sp/500,.3,1));
    [a,b].forEach(function(o){const ty=TYPES[o.t];if(ty.brk&&sp>ty.brk*.7&&!o.dead){breakItem(o,sp);}});
  }
}
function physics(dt){
  const sub=2,h=dt/sub;
  for(let k=0;k<sub;k++){
    for(let i=0;i<items.length;i++)stepItem(items[i],h);
    for(let i=0;i<items.length;i++){
      if(items[i].dead||items[i].pop<1)continue;
      for(let j=i+1;j<items.length;j++){if(!items[j].dead&&items[j].pop>=1)collide(items[i],items[j]);}
    }
  }
  for(let i=items.length-1;i>=0;i--){if(items[i].dead)items.splice(i,1);}
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.knocked&&(it.surf<0||Math.abs(it.vx)>35))lastAct=T;
    if(it.ring>0)lastAct=T;
  }
}
function partsUpdate(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.k==='shard'){
      if(p.rest)continue;
      p.vy+=G*.8*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      if(p.x<2||p.x>RW-2){p.vx*=-.5;p.x=clamp(p.x,2,RW-2);}
      let ground=FLOOR;
      for(let s=0;s<3;s++){const sh=SH[s];if(p.vy>0&&p.x>=sh.x0&&p.x<=sh.x1&&p.y>=sh.y-1&&p.y-p.vy*dt<=sh.y+1){ground=sh.y;break;}}
      if(p.y>=ground){p.y=ground-1;p.vy*=-.3;p.vx*=.6;p.vr*=.5;if(Math.abs(p.vy)<40){p.rest=true;p.vy=0;p.vx=0;}}
    }else if(p.k==='drop'){
      p.vy+=G*.7*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      if(p.life<=0||p.y>FLOOR)parts.splice(i,1);
    }
  }
  for(let i=puddles.length-1;i>=0;i--){const q=puddles[i];q.w=Math.min(q.wMax,q.w+60*dt);q.a-=dt*.05;if(q.a<=0)puddles.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y+=f.vy*dt;f.vy*=.96;if(f.t>=f.life)floats.splice(i,1);}
}

/* ---------- game flow ---------- */
function tidy(){
  day++;combo=0;tidyT=-1;restock();snd('tidy');
  floats.push({x:RW/2,y:150,txt:'DAY '+day,col:'#fff',life:1.6,t:0,size:22,vy:-10,out:'#5A3A2A'});
  O.st='down';O.t=0;O.dur=2.6;
}
function gameLogic(dt){
  if(state!=='play')return;
  const onShelf=items.some(function(i){return !i.dead&&i.surf>=0&&i.surf<3;});
  const air=items.some(function(i){return !i.dead&&(i.surf<0||Math.abs(i.vx)>3);});
  if(!onShelf&&!air){
    if(tidyT<0)tidyT=0;tidyT+=dt;
    if(tidyT>.9&&O.st==='down'){O.st='tidy';O.t=0;}
    if(tidyT>1.7)tidy();
  }else tidyT=-1;
}
function reset(){
  score=0;strikes=0;day=1;combo=0;lastDropT=-9;lastAct=-9;tidyT=-1;hintOn=true;shake=0;flash=0;
  items=[];parts=[];puddles=[];floats=[];layout();restock();catPlace(1);
  O.st='down';O.t=0;O.dur=3.8;state='play';ovShown=false;ov.classList.add('off');
}
function showOver(){
  ovShown=true;
  let newBest=false;
  if(score>best){best=score;newBest=true;try{localStorage.setItem('catknock.best',String(best));}catch(e){}}
  document.getElementById('ttl').textContent='バレちゃった…';
  document.getElementById('sub').textContent='飼い主に3回見つかった。でも、いい仕事だった。';
  document.getElementById('rules').style.display='none';
  document.getElementById('res').innerHTML='SCORE<br><b>'+score+'</b><br>'+(newBest?'🎉 ベスト更新!':'BEST '+best)+'<br>DAY '+day;
  goBtn.textContent='もういっかい';ov.classList.remove('off');
}
function onTap(px,py){
  if(state!=='play')return;
  hintOn=false;
  let bestIt=null,bd=1e9;
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.dead||it.surf<0||it.surf>2||Math.abs(it.vx)>3||it.pop<1)continue;
    const d=Math.hypot(px-it.x,py-it.y);
    if(d<it.cr+18&&d<bd){bd=d;bestIt=it;}
  }
  if(!bestIt){
    if(Math.hypot(px-cat.x,py-(cat.y-14))<26&&!cat.cur&&cat.st==='idle'){cat.pet=.6;snd('meow');
      floats.push({x:cat.x,y:cat.y-38,txt:'にゃ',col:'#E8742A',life:.9,t:0,size:15,vy:-24});}
    return;
  }
  if(cat.st==='shock')return;
  order(bestIt);
}

  for(let i=0;i<items.length;i++)drawItem(items[i]);
  drawParts();drawCat();
  const k=SKY[(day-1)%4][2];if(k>0){cx.fillStyle=(day-1)%4===2?'rgba(20,20,70,'+k+')':'rgba(240,120,40,'+k+')';cx.fillRect(0,0,RW,H);}
  drawFloats();drawHud();
  if(flash>0){cx.fillStyle='rgba(220,40,30,'+(flash*.5)+')';cx.fillRect(0,0,RW,H);}
  cx.restore();
}

/* ---------- loop / input ---------- */
let lastTs=0;
function frame(ts){
  const dt=Math.min(.033,Math.max(0,(ts-lastTs)/1000||0));lastTs=ts;
  T+=dt;
  physics(dt);catUpdate(dt);ownerUpdate(dt);partsUpdate(dt);gameLogic(dt);
  if(shake>0)shake=Math.max(0,shake-dt);if(flash>0)flash=Math.max(0,flash-dt*1.2);
  if(state==='over'){overT+=dt;if(overT>1.4&&!ovShown)showOver();}
  render();
  requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.max(2,Math.round(window.innerWidth*DPR));cv.height=Math.max(2,Math.round(window.innerHeight*DPR));
  S=cv.height/H;Ww=cv.width/S;RW=Math.min(Ww,430);offX=(Ww-RW)/2;
  safeTop=parseFloat(getComputedStyle(document.getElementById('probe')).paddingTop)||0;
  setDot();layout();restock();catPlace(1);
}
cv.addEventListener('pointerdown',function(e){
  audioInit();
  const px=(e.clientX*DPR)/S-offX,py=(e.clientY*DPR)/S;
  onTap(px,py);e.preventDefault();
});
goBtn.addEventListener('click',function(){
  audioInit();
  document.getElementById('rules').style.display='';
  reset();
});
muteBtn.addEventListener('click',function(){
  audioInit();muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.55;
});
window.addEventListener('resize',resize);
window.addEventListener('contextmenu',function(e){e.preventDefault();});
resize();
window.catKnock={state:function(){return {state:state,score:score,strikes:strikes,day:day,items:items.length,owner:O.st,ot:O.t,combo:combo};},tap:onTap,
  items:function(){return items;},cat:cat};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
