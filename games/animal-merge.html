function emptyCells(){const e=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!board[y][x]&&!isGen(x,y))e.push([x,y]);return e;}
function friendCount(){return friends.filter(v=>v>0).length;}
function newOrder(slot,delay){
  const busy=new Set(orders.filter(Boolean).map(o=>o.sp));
  const fresh=[...Array(NS).keys()].filter(i=>!friends[i]&&!busy.has(i)),any=[...Array(NS).keys()].filter(i=>!busy.has(i));
  const pool=fresh.length&&Math.random()<.75?fresh:any;const sp=pool[Math.floor(Math.random()*pool.length)];
  const f=friendCount(),top=Math.min(MAXL,2+Math.floor(f/4)),lo=Math.max(2,Math.min(3,top-2));
  const l=Math.floor(rnd(lo,top+1)),c=Math.random()<.5?0:1;
  orders[slot]={sp,c,l,st:'in',t:-(delay||0),x:1.4,happy:0,bl:rnd(0,4)};}

  board=d.board.map(r=>r.map(v=>v?{c:v.c,l:v.l,pop:1}:null));friends=(d.friends||[]).concat(new Array(NS).fill(0)).slice(0,NS);hearts=d.hearts||0;mute=!!d.mute;
  orders=(d.orders||[]).map(o=>o&&o.sp<NS?{sp:o.sp,c:o.c,l:o.l,st:'in',t:0,x:1.4,happy:0,bl:rnd(0,4)}:null);return true;}catch(e){return false;}}

/* ---------- 音(やさしい電子音。🔈で消せる) ---------- */
let AC=null,mute=false;
function tone(f,t0,d,type,v){if(mute)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
const sPop=()=>{tone(620,0,.12,'sine',.12);tone(930,.05,.1,'sine',.08);};
const sMerge=l=>{const b=[523,587,659,784,880,1047][l-1]||1047;tone(b,0,.18,'triangle',.13);tone(b*1.5,.08,.22,'triangle',.1);if(l>=MAXL)tone(b*2,.18,.4,'sine',.1);};
const sGive=()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.3,'triangle',.11));};
const sNo=()=>{tone(300,0,.12,'sine',.08);};

/* ---------- レイアウト ---------- */
let L={};
function layout(){
  DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const land=W>H*1.15,top=Math.max(10,parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0)+8;
  let cell,bx,by,shop;
  if(land){cell=Math.floor(Math.min((W*.58)/COLS,(H-40)/ROWS));bx=Math.round(W-cell*COLS-Math.max(16,W*.03));by=Math.round((H-cell*ROWS)/2+8);shop={x:0,y:0,w:bx-14,h:Math.round(H*.72),land:true};}
  else{const shopH=Math.round(Math.min(H*.34,W*.62));cell=Math.floor(Math.min((W-20)/COLS,(H-shopH-24)/ROWS));bx=Math.round((W-cell*COLS)/2);by=Math.round(H-cell*ROWS-Math.max(14,(H-shopH-cell*ROWS)/2));shop={x:0,y:0,w:W,h:by-6,land:false};}
  const d=Math.max(2,Math.floor(cell*.8/12));

  L.da=Math.max(3,Math.floor(Math.min(cell*1.05/12,shop.h*.34/11,shop.w*.26/13)));
  L.btnR=Math.max(20,Math.round(cell*.36));
  L.albumBtn={x:shop.w-L.btnR-12,y:L.btnR+14};L.muteBtn={x:shop.w-L.btnR*3-20,y:L.btnR+14};L.helpBtn={x:shop.w-L.btnR*5-28,y:L.btnR+14};}
addEventListener('resize',layout);

/* ---------- 動き ---------- */
let parts=[],drag=null,idle=0,T=0,shake=null,flyers=[];
function cellAt(px,py){const x=Math.floor((px-L.bx)/L.cell),y=Math.floor((py-L.by)/L.cell);if(x<0||y<0||x>=COLS||y>=ROWS)return null;return[x,y];}
function cellC(x,y){return[L.bx+(x+.5)*L.cell,L.by+(y+.5)*L.cell];}
function slotAt(px,py){for(let i=0;i<L.slots.length;i++){const s=L.slots[i],o=orders[i];if(!o||o.st!=='wait')continue;const r=L.da*9;if(Math.abs(px-s.x)<r&&py>s.y-L.da*26&&py<s.y+L.da*3)return i;}return -1;}
function burst(x,y,n,cols,sz){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(60,220)*(sz||1);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,t:0,life:rnd(.5,.9),c:cols[i%cols.length],k:'sq',s:rnd(.6,1.2)*L.d*1.4});}}
function heartsAt(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+rnd(-20,20),y,vx:rnd(-30,30),vy:rnd(-160,-90),t:-i*.08,life:1.3,k:'heart',c:'#FF6A9A',s:L.d*1.2});}
function spawnFrom(g){const e=emptyCells();const[gx,gy]=GENPOS[g];
  if(!e.length){shake={x:gx,y:gy,t:0};sNo();return;}
  e.sort((a,b)=>(Math.abs(a[0]-gx)+Math.abs(a[1]-gy))-(Math.abs(b[0]-gx)+Math.abs(b[1]-gy)));
  const[x,y]=e[0];const it={c:g,l:1,pop:0,fly:0};board[y][x]=it;const[sx,sy]=cellC(gx,gy);it.fx=sx;it.fy=sy;sPop();save();}
function merge(x,y,sx,sy){const a=board[y][x];a.l++;a.pop=0;board[sy][sx]=null;const[cx,cy]=cellC(x,y);
  burst(cx,cy,a.l>=MAXL?26:12,a.c?['#FF8FB8','#FFE066','#8FE08A','#FFFFFF']:['#FFB8D6','#FFE066','#FFFFFF','#8FD0F0'],a.l>=MAXL?1.5:1);sMerge(a.l);
  if(a.l>=MAXL)heartsAt(cx,cy-10,3);save();}
function give(i,fromX,fromY){const o=orders[i];board[fromY][fromX]=null;const s=L.slots[i];
  o.st='happy';o.t=0;friends[o.sp]++;hearts++;sGive();heartsAt(s.x,s.y-L.da*12,5);burst(s.x,s.y-L.da*6,16,['#FF8FB8','#FFE066','#FFFFFF'],1.2);
  const f=friendCount();if(f!==seen&&f%5===0&&f>0){celebrate=1.8;}seen=f;save();}
let celebrate=0;
function findMatch(o){for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=board[y][x];if(v&&v.c===o.c&&v.l===o.l)return[x,y];}return null;}
function hint(){const m=new Map();for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=board[y][x];if(!v||v.l>=MAXL)continue;const k=v.c+'_'+v.l;if(m.has(k))return[m.get(k),[x,y]];m.set(k,[x,y]);}return null;}

/* ---------- タッチ ---------- */
function P(e){return[e.clientX,e.clientY];}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[px,py]=P(e);idle=0;
  if(AC&&AC.state==='suspended')AC.resume();
  if(Math.hypot(px-L.albumBtn.x,py-L.albumBtn.y)<L.btnR+6){openAlbum();return;}
  if(Math.hypot(px-L.helpBtn.x,py-L.helpBtn.y)<L.btnR+6){openHowto();return;}
  if(Math.hypot(px-L.muteBtn.x,py-L.muteBtn.y)<L.btnR+6){mute=!mute;if(!mute)sPop();save();return;}
  const si=slotAt(px,py);if(si>=0){const o=orders[si],m=findMatch(o);if(m){give(si,m[0],m[1]);}else{o.wig=.5;sNo();}return;}
  const c=cellAt(px,py);if(!c)return;const[x,y]=c;
  const gi=genAt(x,y);if(gi>=0){spawnFrom(gi);drag=null;L.press={x,y,t:0};return;}
  const v=board[y][x];if(!v)return;drag={x,y,px,py,sx:px,sy:py,moved:false,id:e.pointerId};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const[px,py]=P(e);drag.px=px;drag.py=py;if(Math.hypot(px-drag.sx,py-drag.sy)>8)drag.moved=true;});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;const v=board[d.y][d.x];if(!v)return;
  if(!d.moved){v.pop=0;const[cx,cy]=cellC(d.x,d.y);if(v.l>=MAXL)burst(cx,cy,8,['#FFE066','#FFFFFF']);return;}
  const si=slotAt(d.px,d.py);if(si>=0){const o=orders[si];if(o.c===v.c&&o.l===v.l){give(si,d.x,d.y);}else{o.wig=.5;sNo();v.back=1;v.bx=d.px;v.by=d.py;}return;}
  const c=cellAt(d.px,d.py);if(!c||(c[0]===d.x&&c[1]===d.y)||isGen(c[0],c[1])){v.back=1;v.bx=d.px;v.by=d.py;return;}
  const[x,y]=c,t=board[y][x];
  if(t&&t.c===v.c&&t.l===v.l&&t.l<MAXL){merge(x,y,d.x,d.y);return;}
  board[y][x]=v;board[d.y][d.x]=t;v.back=1;v.bx=d.px;v.by=d.py;if(t){t.back=1;const[ox,oy]=cellC(x,y);t.bx=ox;t.by=oy;}save();}

/* ---------- 更新 ---------- */
function step(dt){T+=dt;idle+=dt;celebrate=Math.max(0,celebrate-dt);
  for(let i=0;i<3;i++){let o=orders[i];if(!o){newOrder(i,i*.4);o=orders[i];}
    o.t+=dt;o.bl-=dt;if(o.bl<0)o.bl=rnd(2.5,5);if(o.wig)o.wig=Math.max(0,o.wig-dt);
    if(o.st==='in'){if(o.t>0){o.x=Math.max(0,o.x-dt*1.6);if(o.x<=0){o.st='wait';}}}
    else if(o.st==='happy'){if(o.t>1.3){o.st='out';o.t=0;}}
    else if(o.st==='out'){o.x-=dt*1.8;if(o.x<-1.4){orders[i]=null;newOrder(i,.3);save();}}}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const v=board[y][x];if(!v)continue;v.pop=Math.min(1,(v.pop||0)+dt*4);if(v.fly!=null&&v.fly<1)v.fly=Math.min(1,v.fly+dt*4.5);if(v.back){v.back=Math.max(0,v.back-dt*6);}}
  if(shake){shake.t+=dt;if(shake.t>.4)shake=null;}
  for(const p of parts){p.t+=dt;if(p.t<0)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.k==='heart'?-20:420)*dt;p.vx*=.98;}
  parts=parts.filter(p=>p.t<p.life);}

function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();}
function heartShape(x,y,s,c){ctx.fillStyle=c;const H=[".##.##.","#######","#######",".#####.","..###..","...#..."];for(let r=0;r<H.length;r++)for(let q=0;q<7;q++)if(H[r][q]==='#')ctx.fillRect(Math.round(x+(q-3.5)*s),Math.round(y+(r-3)*s),Math.ceil(s),Math.ceil(s));}

    for(let k=0;k<2;k++){const gx=(S.w*.3+k*S.w*.35+Math.sin(T*.7+k)*30),gy=sea*.35+Math.sin(T*1.3+k)*8,w=Math.sin(T*6+k)>0;ctx.fillStyle='#5A6A7A';ctx.fillRect(gx-d*3,gy-(w?d:0),d*3,d);ctx.fillRect(gx+d,gy-(w?d:0),d*3,d);ctx.fillRect(gx,gy,d,d);}}

  if(f>=10){/* ちょうちん */for(let k=0;k<2;k++){const x=k?aw-d*10:d*6,y=awnY+stw/2+d*14+Math.sin(T*1.5+k)*d;ctx.fillStyle='#FF6A5A';ctx.fillRect(x,y,d*5,d*6);ctx.fillStyle='#FFD08A';ctx.fillRect(x+d,y+d*2,d*3,d*2);ctx.fillStyle='#5A3A26';ctx.fillRect(x+d,y-d,d*3,d);ctx.fillRect(x+d,y+d*6,d*3,d);}}

  const nb=friendCount();ctx.fillStyle='#FF6A9A';ctx.beginPath();ctx.arc(ab.x+L.btnR*.75,ab.y-L.btnR*.7,L.btnR*.42,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 '+Math.round(L.btnR*.5)+'px sans-serif';ctx.textAlign='center';ctx.fillText(String(nb),ab.x+L.btnR*.75,ab.y-L.btnR*.68);
  ctx.fillStyle='#7A6A8A';const s=L.btnR/10;ctx.fillRect(mb.x-s*5,mb.y-s*2.5,s*3,s*5);ctx.beginPath();ctx.moveTo(mb.x-s*2,mb.y-s*2.5);ctx.lineTo(mb.x+s*2,mb.y-s*6);ctx.lineTo(mb.x+s*2,mb.y+s*6);ctx.lineTo(mb.x-s*2,mb.y+s*2.5);ctx.fill();
  if(mute){ctx.strokeStyle='#FF6A6A';ctx.lineWidth=s*1.6;ctx.beginPath();ctx.moveTo(mb.x-s*6,mb.y-s*6);ctx.lineTo(mb.x+s*6,mb.y+s*6);ctx.stroke();}else{ctx.strokeStyle='#7A6A8A';ctx.lineWidth=s*1.2;ctx.beginPath();ctx.arc(mb.x+s*3,mb.y,s*3,-.9,.9);ctx.stroke();}
  const hb=L.helpBtn;ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(hb.x,hb.y,L.btnR,0,TAU);ctx.fill();
  ctx.fillStyle='#FF8FB8';ctx.font='800 '+Math.round(L.btnR*1.15)+'px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';ctx.textAlign='center';ctx.fillText('?',hb.x,hb.y+L.btnR*.06);
  ctx.textAlign='left';}
function drawOrders(){const da=L.da;ctx.save();ctx.beginPath();ctx.rect(0,0,L.shop.w,L.shop.h+6);ctx.clip();
  for(let i=0;i<3;i++){const o=orders[i];if(!o||o.t<0)continue;const s=L.slots[i];
    const x=s.x+o.x*L.shop.w*.6;let y=s.y;
    const walking=o.st==='in'&&o.x>0||o.st==='out';const fr=walking?Math.floor(T*8)%2:0;
    let hop=0;if(o.st==='happy')hop=Math.abs(Math.sin(o.t*9))*da*4;else if(!walking)hop=Math.abs(Math.sin(T*2+i))*da*.6;
    const wig=o.wig?Math.sin(o.wig*40)*da:0;
    const flip=o.st==='out'||(o.st==='in'&&o.x>0);
    ctx.fillStyle='rgba(60,50,40,.15)';ctx.beginPath();ctx.ellipse(x,y+da*.5,da*5,da*1.2,0,0,TAU);ctx.fill();
    blitC(aniSpr(o.sp,fr,flip,o.bl<.14&&!walking),x+wig,y-hop+da,da);
    /* ふきだし */
    if(o.st==='wait'||o.st==='happy'){const it=itemSpr(o.c,o.l),bd=Math.max(2,Math.floor(da*.85)),bw=it.width*bd+bd*6,bh=it.height*bd+bd*5,bx=x-bw/2,by=y-da*12-bh-hop*.3+Math.sin(T*2.2+i)*2;
      const ok=o.st==='wait'&&findMatch(o);
      rr(bx,by,bw,bh,bd*3,o.st==='happy'?'#FFE3EE':'#FFFFFF');ctx.fillStyle=o.st==='happy'?'#FFE3EE':'#FFFFFF';ctx.beginPath();ctx.moveTo(x-bd*2,by+bh-1);ctx.lineTo(x+bd*2,by+bh-1);ctx.lineTo(x,by+bh+bd*3);ctx.fill();
      if(o.st==='happy'){heartShape(x,by+bh/2,bd*1.6,'#FF6A9A');}
      else{blitC(it,x,by+bh-bd*2,bd);if(ok){const pul=1+Math.sin(T*6)*.12;ctx.fillStyle='#5CC878';ctx.beginPath();ctx.arc(bx+bw-bd,by+bd,bd*2.6*pul,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=bd*.9;ctx.beginPath();ctx.moveTo(bx+bw-bd*2.2,by+bd);ctx.lineTo(bx+bw-bd*1.2,by+bd*2);ctx.lineTo(bx+bw+bd*.4,by);ctx.stroke();}}}}ctx.restore();}
function drawBoard(){const{cell,bx,by,d}=L;
  rr(bx-10,by-10,cell*COLS+20,cell*ROWS+20,22,'#FFF3E0');
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const cx=bx+x*cell,cy=by+y*cell;rr(cx+3,cy+3,cell-6,cell-6,cell*.2,(x+y)%2?'#FFE6EE':'#FFF0F4');}
  const h=idle>5?hint():null,hk=h?h.map(p=>p.join(',')):[];
  const genHint=idle>5&&!h;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const[cx,cy]=cellC(x,y);
    const gi=genAt(x,y);if(gi>=0){let sc=1;if(genHint||(!board.flat().some(Boolean)))sc=1+Math.sin(T*6)*.06;let sx=0;if(shake&&shake.x===x&&shake.y===y)sx=Math.sin(shake.t*50)*d*1.5;
      rr(cx-cell/2+3,cy-cell/2+3,cell-6,cell-6,cell*.2,gi?'#DFF2D8':'#FFE0CC');const img=genSpr(gi);const dd=Math.max(2,Math.floor(d*sc));blitC(img,cx+sx,cy+img.height*dd/2,dd);continue;}
    const v=board[y][x];if(!v||(drag&&drag.x===x&&drag.y===y&&drag.moved))continue;
    let px=cx,py=cy;if(v.fly!=null&&v.fly<1&&v.fx!=null){const u=ease(v.fly);px=v.fx+(cx-v.fx)*u;py=v.fy+(cy-v.fy)*u-Math.sin(u*Math.PI)*cell*.5;}
    if(v.back){const u=v.back;px=cx+(v.bx-cx)*u;py=cy+(v.by-cy)*u;}
    const p=v.pop==null?1:v.pop,sc=p<1?(.4+.6*ease(p)+Math.sin(p*Math.PI)*.25):1;let wig=0;if(hk.includes(x+','+y))wig=Math.sin(T*14)*d*.8;
    const img=itemSpr(v.c,v.l),dd=Math.max(1,Math.round(d*sc));
    if(v.l>=MAXL){ctx.fillStyle='rgba(255,230,120,'+(.25+.15*Math.sin(T*3))+')';ctx.beginPath();ctx.arc(px,py,cell*.42,0,TAU);ctx.fill();}
    blitC(img,px+wig,py+img.height*dd/2,dd);
    /* 段の目印(小さな点) */
    for(let k=0;k<v.l;k++){ctx.fillStyle=v.c?'#6FC060':'#FF8FB8';ctx.fillRect(Math.round(px-v.l*d*1.1+k*d*2.2+d*.2),Math.round(cy+cell*.36),Math.ceil(d*1.4),Math.ceil(d*1.4));}}
  if(drag&&drag.moved){const v=board[drag.y][drag.x];if(v){const img=itemSpr(v.c,v.l),dd=Math.round(L.d*1.25);ctx.fillStyle='rgba(60,40,60,.18)';ctx.beginPath();ctx.ellipse(drag.px,drag.py+L.cell*.45,L.cell*.3,L.cell*.08,0,0,TAU);ctx.fill();blitC(img,drag.px,drag.py+img.height*dd/2-L.cell*.15,dd);
    const c=cellAt(drag.px,drag.py);if(c){const t=board[c[1]][c[0]];if(t&&t!==v&&t.c===v.c&&t.l===v.l&&t.l<MAXL){const[tx,ty]=cellC(c[0],c[1]);ctx.strokeStyle='#FFD84A';ctx.lineWidth=4;ctx.beginPath();ctx.arc(tx,ty,L.cell*.44,0,TAU);ctx.stroke();}}}}}
/* 指のマーク:しばらく触らないと、次にすることを指で教える(重ねられる組があれば重ねる動き、なければかごをトントン) */
const HAND=["...HH.....","...HH.....","...HH.....","...HHHH...","...HHHHHH.",".HHHHHHHH.",".HHHHHHHH.","..HHHHHHH.","..HHHHHH..","...HHHHH..","...SSSSS..","...SSSSS.."];
function drawHand(){if(idle<4||drag||albumEl.classList.contains('on')||howEl.classList.contains('on'))return;
  const img=pix('hand',HAND,{H:'#FFE0C8',S:'#8FC0F0'},'#7A4A3A'),d=Math.max(2,Math.floor(L.d*1.1));
  const h=hint();let x,y,press=0;const ph=((idle-4)%2.4)/2.4;
  if(h){const[a,b]=h.map(p=>cellC(p[0],p[1]));const u=ph<.2?0:ph>.8?1:ease((ph-.2)/.6);x=a[0]+(b[0]-a[0])*u;y=a[1]+(b[1]-a[1])*u;press=ph<.85?1:0;
    if(ph>.12&&ph<.85){const v=board[h[0][1]][h[0][0]];if(v){const it=itemSpr(v.c,v.l);ctx.globalAlpha=.55;blitC(it,x,y+it.height*L.d/2-L.cell*.1,L.d);ctx.globalAlpha=1;}}}
  else{const e=emptyCells();if(!e.length)return;const g=GENPOS[Math.floor(idle/4.8)%2];[x,y]=cellC(g[0],g[1]);press=Math.sin(ph*TAU*2)>0?1:0;}
  ctx.globalAlpha=Math.min(1,(idle-4)*2);blitC(img,x+d*2,y+img.height*d+d*2-press*d*2+L.cell*.1,d);ctx.globalAlpha=1;}
function drawParts(){for(const p of parts){if(p.t<0)continue;const a=1-p.t/p.life;ctx.globalAlpha=Math.max(0,a);
  if(p.k==='heart')heartShape(p.x,p.y,p.s,p.c);else{ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.ceil(p.s),Math.ceil(p.s));}}ctx.globalAlpha=1;
  if(celebrate>0){const a=Math.min(1,celebrate);for(let i=0;i<40;i++){const x=(i*97.3+T*40*(1+i%3))%W,y=((i*53.1+T*(120+i*7))%(H+40))-20;ctx.globalAlpha=a;ctx.fillStyle=['#FF8FB8','#FFE066','#8FD0F0','#9FE08A','#C8A8F8'][i%5];ctx.fillRect(x,y,L.d*2,L.d*3);}ctx.globalAlpha=1;}}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#BFE8F7';ctx.fillRect(0,0,W,H);
  if(L.land){ctx.fillStyle='#F6E2C8';ctx.fillRect(0,0,W,H);}else{ctx.fillStyle='#F6E2C8';ctx.fillRect(0,L.shop.h,W,H-L.shop.h);ctx.fillStyle='#EBD2B2';for(let y=L.shop.h+16;y<H;y+=22)ctx.fillRect(0,y,W,2);}
  drawShop();drawOrders();drawBoard();drawHand();drawParts();}

/* ---------- はじまり ---------- */
if(!load())freshBoard();
seen=friendCount();
layout();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
let seenHow=false;try{seenHow=localStorage.getItem(KEY+'.howto')==='1';}catch(e){}
if(!seenHow)setTimeout(openHowto,300);
if(location.hash.indexOf('debug')>=0)window.__mg={board:()=>board,orders:()=>orders,spawn:spawnFrom,give,friends:()=>friends,setF:n=>{for(let i=0;i<NS;i++)friends[i]=i<n?1:0;},merge,L:()=>L};
})();
