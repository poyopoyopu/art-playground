<!doctype html>
<!-- どうぶつ ぺあさがし — クロード作。おっちゃんが用意してくれた動物50種のドット絵シートから、「このキャラで別のゲームを」との依頼で。
     絵柄はおっちゃんのシートを1匹ずつ切り出してドットの格子に整えたもの(既存の有名キャラに似ている2種は外して48種)。5歳の子向けの神経衰弱 -->

<title>どうぶつ ぺあさがし</title>

<canvas id="c"></canvas>
<div class="ov" id="album"><div class="card"><div class="ttl">みつけた おともだち</div><div class="cnt" id="acnt"></div><div class="grid" id="agrid"></div><button class="btn" id="aclose">もどる</button></div></div>
<div class="ov" id="howto"><div class="card"><div class="ttl">あそびかた</div>
<div class="st"><div class="num">1</div><canvas id="hw1"></canvas><div class="cap">カードを<br>タップ</div></div>
<div class="st"><div class="num">2</div><canvas id="hw2"></canvas><div class="cap">おなじ<br>どうぶつを<br>みつける</div></div>
<div class="st"><div class="num">3</div><canvas id="hw3"></canvas><div class="cap">おともだちが<br>ふえる</div></div>
<div class="note">おうちの方へ:カードを2枚ずつめくって、同じ動物の組を探す「神経衰弱」です。そろうと動物がカードから飛び出して、下の草原をおさんぽします(タップするとぴょんと跳ねます)。全部そろうとお祝いして、次はカードが少し増えます(6枚→8枚→12枚→16枚→20枚→24枚)。見つけた動物は右上の「おともだち帳」に集まります(全48種)。まちがえてもカードが裏に戻るだけで、失敗や時間切れはありません。進みぐあいはこの端末に保存されます。</div>
<button class="btn" id="hgo">あそぶ!</button></div></div>

const sprCache=new Map();
function spr(i,flip){const k=i+(flip?'f':'');let c=sprCache.get(k);if(c)return c;const r=RECTS[i];c=document.createElement('canvas');c.width=r[2];c.height=r[3];const g=c.getContext('2d');
  if(flip){g.translate(r[2],0);g.scale(-1,1);}g.drawImage(sheet,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);sprCache.set(k,c);return c;}
/* 整数倍でにじまずに貼る(下端中央を指定) */
function blit(img,cx,by,s,a){const w=img.width*s,h=img.height*s;if(a!=null)ctx.globalAlpha=a;ctx.drawImage(img,Math.round(cx-w/2),Math.round(by-h),w,h);ctx.globalAlpha=1;}
function fitS(i,w,h){const r=RECTS[i];return Math.max(1,Math.floor(Math.min(w/r[2],h/r[3])));}

/* ---------- 保存 ---------- */
const KEY='animalPairs.v1';
let found=new Array(N).fill(0),level=0,mute=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify({found,level,mute}));}catch(e){}}
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){found=(d.found||[]).concat(new Array(N).fill(0)).slice(0,N);level=d.level||0;mute=!!d.mute;}}catch(e){}

/* ---------- 音 ---------- */
let AC=null;
function tone(f,t0,d,type,v){if(mute)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}catch(e){}}
const sFlip=()=>tone(700,0,.08,'sine',.08),sYay=()=>[784,988,1175].forEach((f,i)=>tone(f,i*.08,.25,'triangle',.12)),sNo=()=>{tone(420,0,.12,'sine',.07);tone(360,.1,.14,'sine',.06);},
  sBoing=()=>{tone(520,0,.1,'sine',.1);tone(780,.06,.12,'sine',.08);},sClear=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.4,'triangle',.12));

/* ---------- レベル(カードの枚数) ---------- */
const LV=[3,4,6,8,10,12];
let cards=[],open=[],lock=0,cleared=0,walkers=[],parts=[],T=0,idle=0,L={};
function pickAnimals(n){const all=[...Array(N).keys()];const nf=all.filter(i=>!found[i]).sort(()=>Math.random()-.5),f=all.filter(i=>found[i]).sort(()=>Math.random()-.5);
  const a=nf.slice(0,Math.ceil(n*.7));for(const i of f.concat(nf.slice(a.length))){if(a.length>=n)break;if(!a.includes(i))a.push(i);}return a.slice(0,n);}
function deal(){const n=LV[Math.min(level,LV.length-1)],an=pickAnimals(n);const ids=an.concat(an).sort(()=>Math.random()-.5);
  cards=ids.map((id,k)=>({id,k,up:0,want:0,matched:false,gone:0,deal:-k*.05,wig:0}));open=[];lock=0;cleared=0;layout();}
function gridShape(n){const land=W>H*1.1;const opts=land?{6:[3,2],8:[4,2],12:[4,3],16:[4,4],20:[5,4],24:[6,4]}:{6:[2,3],8:[2,4],12:[3,4],16:[4,4],20:[4,5],24:[4,6]};return opts[n]||[4,Math.ceil(n/4)];}
function layout(){DPR=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const hh=Math.max(58,Math.round(Math.min(W,H)*.15)),mh=Math.round(H*(W>H?.2:.17));
  const[c,r]=gridShape(cards.length||6);const aw=W-24,ah=H-hh-mh-16;const gap=Math.max(6,Math.round(Math.min(aw,ah)*.02));
  let cw=(aw-gap*(c-1))/c,ch=cw/0.78;if(ch*r+gap*(r-1)>ah){ch=(ah-gap*(r-1))/r;cw=ch*.78;}
  cw=Math.floor(cw);ch=Math.floor(ch);const bw=cw*c+gap*(c-1),bh=ch*r+gap*(r-1),bx=Math.round((W-bw)/2),by=Math.round(hh+(ah-bh)/2+4);
  L={hh,mh,c,r,cw,ch,gap,bx,by,btnR:Math.round(hh*.3)};
  cards.forEach((cd,k)=>{cd.x=bx+(k%c)*(cw+gap);cd.y=by+Math.floor(k/c)*(ch+gap);});
  L.albumBtn={x:W-L.btnR-12,y:hh/2};L.muteBtn={x:W-L.btnR*3-20,y:hh/2};L.helpBtn={x:W-L.btnR*5-28,y:hh/2};
  L.ground=H-mh*.25;L.ds=Math.max(2,Math.floor(mh*.5/28));}
addEventListener('resize',layout);

/* ---------- 草原のおともだち ---------- */
function addWalker(id,x,y){if(walkers.length>=14)walkers.shift();walkers.push({id,x:x!=null?x:rnd(20,W-20),y0:y,fly:y!=null?0:1,dir:Math.random()<.5?1:-1,v:rnd(18,34),ph:rnd(0,9),hop:0,rest:0});}
function initWalkers(){const got=[...Array(N).keys()].filter(i=>found[i]).sort(()=>Math.random()-.5).slice(0,6);got.forEach(i=>addWalker(i));}

/* ---------- 粒 ---------- */
function starShape(x,y,s,c){ctx.fillStyle=c;const S=["...#...","...#...","..###..","#######","..###..","...#...","...#..."];for(let r=0;r<7;r++)for(let q=0;q<7;q++)if(S[r][q]==='#')ctx.fillRect(Math.round(x+(q-3.5)*s),Math.round(y+(r-3.5)*s),Math.ceil(s),Math.ceil(s));}
function heartShape(x,y,s,c){ctx.fillStyle=c;const Hh=[".##.##.","#######","#######",".#####.","..###..","...#..."];for(let r=0;r<6;r++)for(let q=0;q<7;q++)if(Hh[r][q]==='#')ctx.fillRect(Math.round(x+(q-3.5)*s),Math.round(y+(r-3)*s),Math.ceil(s),Math.ceil(s));}
function burst(x,y,n,sz){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(80,240)*(sz||1);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,t:0,life:rnd(.6,1),k:i%3?'star':'heart',c:['#FF8FB8','#FFE066','#8FD0F0','#9FE08A','#C8A8F8'][i%5],s:rnd(1.6,2.6)});}}

/* ---------- タッチ ---------- */
function cardAt(px,py){for(const cd of cards){if(cd.matched)continue;if(px>=cd.x&&px<cd.x+L.cw&&py>=cd.y&&py<cd.y+L.ch)return cd;}return null;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const px=e.clientX,py=e.clientY;idle=0;if(AC&&AC.state==='suspended')AC.resume();
  const hit=b=>Math.hypot(px-b.x,py-b.y)<L.btnR+6;
  if(hit(L.albumBtn)){openAlbum();return;}if(hit(L.helpBtn)){openHowto();return;}if(hit(L.muteBtn)){mute=!mute;if(!mute)sFlip();save();return;}
  if(cleared>1.4){level=Math.min(level+1,LV.length-1)+(level>=LV.length-1?0:0);save();deal();return;}
  if(py>H-L.mh){for(const w of walkers){const s=L.ds;const r=RECTS[w.id];if(Math.abs(px-w.x)<r[2]*s*.6&&py>L.ground-r[3]*s-10){w.hop=1;sBoing();parts.push({x:w.x,y:L.ground-r[3]*s,vx:0,vy:-60,t:0,life:1,k:'heart',c:'#FF6A9A',s:2});return;}}return;}
  if(lock>0)return;const cd=cardAt(px,py);if(!cd||cd.want)return;
  cd.want=1;open.push(cd);sFlip();
  if(open.length===2){const[a,b]=open;if(a.id===b.id){lock=.55;setTimeout(()=>{a.matched=b.matched=true;a.gone=b.gone=0.001;found[a.id]++;save();sYay();
        const mx=(a.x+b.x)/2+L.cw/2,my=(a.y+b.y)/2+L.ch/2;burst(a.x+L.cw/2,a.y+L.ch/2,10);burst(b.x+L.cw/2,b.y+L.ch/2,10);addWalker(a.id,mx,my);open=[];
        if(cards.every(c=>c.matched)){cleared=.001;setTimeout(()=>{sClear();for(let k=0;k<5;k++)setTimeout(()=>burst(rnd(W*.2,W*.8),rnd(H*.25,H*.55),16,1.3),k*200);},500);}},450);}
    else{lock=1.1;setTimeout(()=>{a.want=0;b.want=0;a.wig=.4;b.wig=.4;open=[];sNo();},900);}}});

/* ---------- おともだち帳・あそびかた ---------- */
const albumEl=document.getElementById('album'),howEl=document.getElementById('howto');
function iconCanvas(i,sc,sil){const r=RECTS[i],c=document.createElement('canvas');c.width=r[2]*sc;c.height=r[3]*sc;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(spr(i),0,0,c.width,c.height);
  if(sil){g.globalCompositeOperation='source-in';g.fillStyle='#D8C4B0';g.fillRect(0,0,c.width,c.height);}return c;}
function openAlbum(){const g=document.getElementById('agrid');g.innerHTML='';const n=found.filter(Boolean).length;document.getElementById('acnt').textContent=n+' / '+N;
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='cell'+(found[i]?' got':'');d.appendChild(iconCanvas(i,2,!found[i]));const t=document.createElement('div');t.textContent=found[i]?NAMES[IDS[i]]:'?';d.appendChild(t);g.appendChild(d);}
  albumEl.classList.add('on');}
document.getElementById('aclose').addEventListener('click',()=>albumEl.classList.remove('on'));
function hw(id,draw){const c=document.getElementById(id),S=4,w=60,h=22;c.width=w*S;c.height=h*S;const g=c.getContext('2d');g.imageSmoothingEnabled=false;draw(g,S,w,h);}
function miniCard(g,S,x,up,i){g.fillStyle=up?'#FFFFFF':'#FF9FC0';g.fillRect(x*S,1*S,14*S,20*S);g.fillStyle=up?'#FFE6F0':'#FFC8DC';g.fillRect((x+1)*S,2*S,12*S,18*S);
  if(up){const r=RECTS[i],s=Math.max(1,Math.floor(Math.min(11/r[2],12/r[3])*S));g.drawImage(spr(i),Math.round((x+7)*S-r[2]*s/2),Math.round(17*S-r[3]*s),r[2]*s,r[3]*s);}else{g.fillStyle='#FFFFFF';g.fillRect((x+5)*S,8*S,4*S,4*S);g.fillRect((x+4)*S,6*S,S,S);g.fillRect((x+9)*S,6*S,S,S);g.fillRect((x+6)*S,5*S,S,S);g.fillRect((x+7)*S,5*S,S,S);}}
function arrow(g,S,x){g.fillStyle='#FF8FB8';g.fillRect(x*S,10*S,5*S,2*S);g.fillRect((x+4)*S,8*S,S,6*S);g.fillRect((x+5)*S,9*S,S,4*S);}
function openHowto(){hw('hw1',(g,S)=>{miniCard(g,S,2,false,0);arrow(g,S,20);miniCard(g,S,30,true,0);});
  hw('hw2',(g,S)=>{miniCard(g,S,2,true,2);miniCard(g,S,18,true,2);arrow(g,S,35);g.fillStyle='#FF6A9A';const Hh=[".##.##.","#######","#######",".#####.","..###..","...#..."];for(let r=0;r<6;r++)for(let q=0;q<7;q++)if(Hh[r][q]==='#')g.fillRect((45+q)*S,(8+r)*S,S,S);});
  hw('hw3',(g,S)=>{g.fillStyle='#A8E08A';g.fillRect(0,16*S,60*S,6*S);[0,8,16].forEach((i,k)=>{const r=RECTS[i],s=Math.max(1,Math.floor(Math.min(14/r[2],14/r[3])*S));g.drawImage(spr(i),Math.round((10+k*20)*S-r[2]*s/2),Math.round(17*S-r[3]*s),r[2]*s,r[3]*s);});});
  howEl.classList.add('on');}
document.getElementById('hgo').addEventListener('click',()=>{howEl.classList.remove('on');idle=0;try{localStorage.setItem(KEY+'.howto','1');}catch(e){}});

/* ---------- 更新 ---------- */
function step(dt){T+=dt;idle+=dt;lock=Math.max(0,lock-dt);if(cleared)cleared+=dt;
  for(const cd of cards){cd.deal+=dt;cd.up+=((cd.want?1:0)-cd.up)*Math.min(1,dt*12);if(Math.abs(cd.up-(cd.want?1:0))<.01)cd.up=cd.want?1:0;if(cd.wig)cd.wig=Math.max(0,cd.wig-dt);if(cd.gone)cd.gone=Math.min(1,cd.gone+dt*2.5);}
  for(const w of walkers){w.ph+=dt;if(w.fly<1){w.fly=Math.min(1,w.fly+dt*1.4);continue;}
    if(w.hop)w.hop=Math.max(0,w.hop-dt*1.8);if(w.rest>0){w.rest-=dt;}else{w.x+=w.dir*w.v*dt;if(Math.random()<dt*.15)w.rest=rnd(.8,2);}
    if(w.x<16){w.x=16;w.dir=1;}if(w.x>W-16){w.x=W-16;w.dir=-1;}}
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.k==='heart'?-30:360)*dt;p.vx*=.98;}parts=parts.filter(p=>p.t<p.life);}

/* ---------- 描画 ---------- */
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.fill();}
const CARDBG=['#FFE6F0','#EDE6FF','#E2F6EC','#FFF3D6','#E3F1FF'];
function drawCard(cd){const{cw,ch}=L;if(cd.deal<0||cd.gone>=1)return;const dd=Math.min(1,cd.deal*4);
  let x=cd.x,y=cd.y+(1-ease(dd))*30,sx=Math.abs(Math.cos(cd.up*Math.PI)),face=cd.up>.5;
  if(cd.wig)x+=Math.sin(cd.wig*50)*4;
  let a=1,sc=1;if(cd.gone){a=1-cd.gone;sc=1+cd.gone*.25;}
  ctx.save();ctx.globalAlpha=a*dd;ctx.translate(x+cw/2,y+ch/2);ctx.scale(Math.max(.02,sx)*sc,sc);ctx.translate(-cw/2,-ch/2);
  rr(2,5,cw-4,ch-4,cw*.14,'rgba(190,110,150,.25)');
  if(face){rr(0,0,cw,ch,cw*.14,'#FFFFFF');rr(cw*.06,cw*.06,cw*.88,ch-cw*.12,cw*.1,CARDBG[cd.id%5]);
    const r=RECTS[cd.id],s=fitS(cd.id,cw*.8,ch*.62);const bob=cd.matched?0:Math.sin(T*3+cd.k)*1.5;blit(spr(cd.id),cw/2,ch*.8+bob,s);
    ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.ellipse(cw/2,ch*.82,r[2]*s*.35,ch*.03,0,0,TAU);ctx.fill();}
  else{rr(0,0,cw,ch,cw*.14,'#FFFFFF');rr(cw*.06,cw*.06,cw*.88,ch-cw*.12,cw*.1,'#FF9FC0');
    const q=Math.max(8,cw*.16);ctx.fillStyle='rgba(255,255,255,.22)';for(let yy=cw*.1;yy<ch-cw*.1;yy+=q)for(let xx=cw*.1+((yy/q|0)%2)*q/2;xx<cw*.9;xx+=q){ctx.beginPath();ctx.arc(xx,yy,q*.18,0,TAU);ctx.fill();}
    const p=cw*.07;ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.ellipse(cw/2,ch/2+p*.8,p*1.6,p*1.3,0,0,TAU);ctx.fill();
    [[-1.7,-1],[-.6,-2],[.6,-2],[1.7,-1]].forEach(([dx,dy])=>{ctx.beginPath();ctx.arc(cw/2+dx*p,ch/2+dy*p,p*.6,0,TAU);ctx.fill();});}
  ctx.restore();ctx.globalAlpha=1;}
function drawHeader(){const{hh,btnR}=L;const n=found.filter(Boolean).length;
  heartShape(18+btnR*.4,hh/2,Math.max(3,btnR*.12),'#FF6A9A');ctx.fillStyle='#FFFFFF';ctx.font='800 '+Math.round(btnR*.95)+'px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  ctx.lineWidth=5;ctx.strokeStyle='#E86A9A';const tx=24+btnR*1.05;ctx.strokeText(n+' / '+N,tx,hh/2+1);ctx.fillText(n+' / '+N,tx,hh/2+1);
  /* レベルの星 */
  const lvn=Math.min(level,LV.length-1)+1;for(let k=0;k<LV.length;k++)starShape(W/2+(k-(LV.length-1)/2)*btnR*.72,hh/2,btnR*.09,k<lvn?'#FFC840':'#F2D8E2');
  for(const b of [L.albumBtn,L.muteBtn,L.helpBtn]){ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(b.x,b.y,btnR,0,TAU);ctx.fill();}
  if(ready){const i=IDS.indexOf(9),s=fitS(i,btnR*1.4,btnR*1.3);blit(spr(i),L.albumBtn.x,L.albumBtn.y+btnR*.62,s);}
  ctx.fillStyle='#FF8FB8';ctx.textAlign='center';ctx.font='800 '+Math.round(btnR*1.15)+'px "Hiragino Maru Gothic ProN",sans-serif';ctx.fillText('?',L.helpBtn.x,L.helpBtn.y+btnR*.06);
  const mb=L.muteBtn,s=btnR/10;ctx.fillStyle='#9A7AA8';ctx.fillRect(mb.x-s*5,mb.y-s*2.5,s*3,s*5);ctx.beginPath();ctx.moveTo(mb.x-s*2,mb.y-s*2.5);ctx.lineTo(mb.x+s*2,mb.y-s*6);ctx.lineTo(mb.x+s*2,mb.y+s*6);ctx.lineTo(mb.x-s*2,mb.y+s*2.5);ctx.fill();
  if(mute){ctx.strokeStyle='#FF6A6A';ctx.lineWidth=s*1.6;ctx.beginPath();ctx.moveTo(mb.x-s*6,mb.y-s*6);ctx.lineTo(mb.x+s*6,mb.y+s*6);ctx.stroke();}else{ctx.strokeStyle='#9A7AA8';ctx.lineWidth=s*1.2;ctx.beginPath();ctx.arc(mb.x+s*3,mb.y,s*3,-.9,.9);ctx.stroke();}
  ctx.textAlign='left';}
function drawMeadow(){const{mh}=L,y0=H-mh;
  const g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,'#C8F0B0');g.addColorStop(1,'#9FDC8A');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,y0+12);
  for(let x=0;x<=W;x+=20)ctx.lineTo(x,y0+6+Math.sin(x*.05)*5);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  for(let k=0;k<Math.floor(W/60);k++){const x=k*60+20+(k%2)*14,y=y0+mh*(.35+(k*7%5)/10);ctx.fillStyle=['#FFFFFF','#FFE066','#FF9FC0'][k%3];ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();ctx.fillStyle='#FFD84A';ctx.fillRect(x-1,y-1,2,2);}
  if(!ready)return;const s=L.ds;
  for(const w of walkers){const r=RECTS[w.id];let x=w.x,y=L.ground;
    if(w.fly<1){const u=ease(w.fly);x=w.x;y=w.y0+(L.ground-w.y0)*u-Math.sin(u*Math.PI)*80;}
    const walking=w.rest<=0&&w.fly>=1;const bob=walking?-Math.abs(Math.sin(w.ph*9))*s*1.2:0,hop=-Math.sin(w.hop*Math.PI)*s*14;
    ctx.fillStyle='rgba(60,110,50,.2)';ctx.beginPath();ctx.ellipse(x,L.ground+2,r[2]*s*.35,s*1.5,0,0,TAU);ctx.fill();
    blit(spr(w.id,w.dir<0),x,y+bob+hop,s);}}
function drawParts(){for(const p of parts){const a=1-p.t/p.life;ctx.globalAlpha=Math.max(0,a);if(p.k==='heart')heartShape(p.x,p.y,p.s,p.c);else starShape(p.x,p.y,p.s,p.c);}ctx.globalAlpha=1;}
function drawClear(){if(!cleared)return;const u=Math.min(1,cleared*2);ctx.fillStyle='rgba(255,240,248,'+(.55*u)+')';ctx.fillRect(0,L.hh,W,H-L.hh-L.mh);
  const sz=Math.min(W,H)*.13*ease(u);ctx.save();ctx.translate(W/2,H*.42);ctx.rotate(Math.sin(T*3)*.05);
  ctx.font='900 '+Math.round(sz)+'px "Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=sz*.16;ctx.strokeStyle='#FFFFFF';ctx.strokeText('できた!',0,0);ctx.fillStyle='#FF6A9A';ctx.fillText('できた!',0,0);ctx.restore();
  if(cleared>1.4){const b=Math.min(W*.5,260),bh=Math.max(54,b*.28),y=H*.58+Math.sin(T*4)*4;rr(W/2-b/2,y,b,bh,bh/2,'#FF8FB8');ctx.fillStyle='#FFFFFF';ctx.font='800 '+Math.round(bh*.46)+'px "Hiragino Maru Gothic ProN",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('つぎへ ▶',W/2,y+bh/2+1);ctx.textAlign='left';}}
function drawHint(){if(idle<6||cleared||lock||albumEl.classList.contains('on')||howEl.classList.contains('on'))return;const cd=cards.find(c=>!c.matched&&!c.want);if(!cd)return;
  const p=(idle-6)%1.4/1.4,a=Math.min(1,(idle-6)*2);ctx.globalAlpha=a*(1-p);ctx.strokeStyle='#FFD84A';ctx.lineWidth=5;ctx.beginPath();ctx.arc(cd.x+L.cw/2,cd.y+L.ch/2,L.cw*(.2+p*.4),0,TAU);ctx.stroke();ctx.globalAlpha=1;}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FFE3EF');g.addColorStop(1,'#F2E8FF');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.55)';const q=34;for(let y=0,r=0;y<H;y+=q,r++)for(let x=(r%2)*q/2;x<W;x+=q){ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();}
  ctx.fillStyle='#FFFFFF';rr(8,6,W-16,L.hh-10,L.hh*.35,'rgba(255,255,255,.75)');
  drawHeader();if(ready)for(const cd of cards)drawCard(cd);drawHint();drawMeadow();drawParts();drawClear();}

/* ---------- はじまり ---------- */
layout();deal();initWalkers();
let seenHow=false;try{seenHow=localStorage.getItem(KEY+'.howto')==='1';}catch(e){}
sheet.addEventListener('load',()=>{if(!seenHow)openHowto();});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(location.hash.indexOf('debug')>=0)window.__pp={cards:()=>cards,found:()=>found,L:()=>L,deal,setLevel:v=>{level=v;deal();}};
})();
</script>
