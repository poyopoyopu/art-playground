function resize(){
 dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;

function radius(t){return 22+Math.min(t,MAX)*1.15}
function make(t,x,y,vy=0){return{x,y,vx:0,vy,r:radius(t),t,rest:0,dead:false,age:0}}
function unlocked(){return Math.min(MAX,Math.max(2,highest+2))}
function pickType(){
 const candidates=balls.filter(p=>!p.dead&&p.t<unlocked());
 if(candidates.length&&Math.random()<.58)return candidates[Math.floor(Math.random()*candidates.length)].t;
 const max=unlocked(),r=Math.pow(Math.random(),2.15);
 return Math.min(max,Math.floor(r*(max+1)));
}
function newCurrent(){
 current=make(next,W/2,76);next=pickType();
}

 const colors=pal[t];

 const out=base.map(row=>row.split(''));
 // add species-specific accent pixels without destroying silhouettes
 for(let y=0;y<9;y++)for(let x=0;x<11;x++)if(out[y][x]==='B' && ((x+y+t)%7===0))out[y][x]=(t%5===0?'K':'B');
 return out;
}
const spriteCache=new Map();
function sprite(t,blink){
 const key=t+'_'+blink;if(spriteCache.has(key))return spriteCache.get(key);
 const p=pal[t],g=gridFor(t),s=6,c=document.createElement('canvas');c.width=66;c.height=54;
 const q=c.getContext('2d');q.imageSmoothingEnabled=false;
 for(let y=0;y<9;y++)for(let x=0;x<11;x++)if(g[y][x]){
   q.fillStyle=p[0];q.fillRect(x*s,y*s,s,s);
 }
 // accent band / shell / wing
 q.fillStyle=p[1];
 for(let x=2;x<9;x++)if(g[4][x])q.fillRect(x*s,4*s,s,s);
 // eyes
 q.fillStyle=p[2];
 if(blink){q.fillRect(3*s,3*s,s,2);q.fillRect(7*s,3*s,s,2)}
 else{q.fillRect(3*s,2*s,s,s);q.fillRect(7*s,2*s,s,s)}
 // stage mark
 if(t>9){q.fillStyle=p[1];q.fillRect(5*s,6*s,s,s)}
 spriteCache.set(key,c);return c;
}
function draw(p,a=1){
 const im=sprite(p.t,Math.floor(performance.now()/170)%9===8);
 const scale=Math.max(1,Math.floor((p.r*2)/66));
 ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.drawImage(im,-33*scale,-27*scale,66*scale,54*scale);ctx.restore();ctx.globalAlpha=1;
}
function burst(x,y,t){
 const c=pal[t%pal.length];
 for(let i=0;i<18;i++)parts.push({x,y,vx:(Math.random()-.5)*210,vy:(Math.random()-.8)*220,life:.55+Math.random()*.35,a:0,c:c[i%2],s:2+Math.random()*4});
 flash=.16;
}
function merge(a,b){
 if(a.dead||b.dead||a.t!==b.t)return;
 const t=Math.min(MAX,a.t+1),x=(a.x+b.x)/2,y=(a.y+b.y)/2;
 a.dead=b.dead=true;balls.push(make(t,x,y,-95));
 score+=(t+1)*12*(t>highest?2:1);highest=Math.max(highest,t);
 best=Math.max(best,score);localStorage.setItem('pm-best',best);
 burst(x,y,t);
 msg=t===MAX?'50種目「黒玉」まで到達！':names[t]+' に進化！';
}
function physics(dt){
 for(const p of balls){if(p.dead)continue;p.age+=dt;p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;
   if(p.x-p.r<8){p.x=8+p.r;p.vx=Math.abs(p.vx)*.28}
   if(p.x+p.r>W-8){p.x=W-8-p.r;p.vx=-Math.abs(p.vx)*.28}
   if(p.y+p.r>ground){p.y=ground-p.r;p.vy*=-.18;if(Math.abs(p.vy)<16)p.vy=0;p.rest+=dt}else p.rest=0;
 }
 for(let pass=0;pass<2;pass++)for(let i=0;i<balls.length;i++){const a=balls[i];if(a.dead)continue;
   for(let j=i+1;j<balls.length;j++){const b=balls[j];if(b.dead)continue;
     const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,n=a.r+b.r;
     if(d<n){if(a.t===b.t&&d<n*.72){merge(a,b);continue}
       const push=(n-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*push;b.x+=nx*push;a.y-=ny*push;b.y+=ny*push;
     }
   }
 }
 balls=balls.filter(p=>!p.dead);
 // A stable pile touching the danger band ends the run. No more endless wall of animals.
 if(balls.some(p=>p.y-p.r<92&&p.rest>.72))over=true;
}
function drop(){
 if(!current||over)return;
 current.x=spawnX;current.vx=(spawnX-W/2)*.22;current.vy=70;balls.push(current);
 dropCount++;if(balls.length>24)msg='詰まり注意。大きい生き物を早めに進化させよう';
 newCurrent();
}
function px(e){const r=cv.getBoundingClientRect();return Math.max(30,Math.min(W-30,(e.clientX-r.left)*W/r.width))}
cv.addEventListener('pointerdown',e=>{
 if(over){reset();return}
 if(window.APKit&&APKit.isUI&&APKit.isUI(e.clientX,e.clientY))return;
 drag=true;spawnX=px(e);current.x=spawnX;cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener('pointermove',e=>{if(drag&&!over){spawnX=px(e);current.x=spawnX}});
cv.addEventListener('pointerup',()=>{if(drag){drag=false;drop()}});
cv.addEventListener('pointercancel',()=>drag=false);

function reset(){
 score=0;over=false;balls=[];parts=[];highest=2;dropCount=0;msg='同じ生き物を重ねて進化させる';next=Math.floor(Math.random()*3);newCurrent();
}
function mutate(){next=Math.floor(Math.random()*(unlocked()+1));newCurrent();msg='次に来る生き物が変わった'};
function guide(){alert('あそびかた\n\n上の生き物を左右に動かして落とす。\n同じ生き物どうしが触れると、ひとつ上の生き物へ進化する。\n\n低い種類は出やすく、進化すると新しい種類が少しずつ解禁される。\n上まで積み上がる前に、どんどん進化させよう。\n\n目標：50種目「黒玉」');}

 ctx.fillStyle='#a9afbf';ctx.font='10px ui-monospace';ctx.fillText('図鑑 '+Math.min(50,new Set(balls.map(p=>p.t)).size+1)+'/50',W-16,55);
}
function render(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#141925';ctx.fillRect(0,0,W,66);
 // playfield grid
 ctx.strokeStyle='rgba(170,190,220,.055)';ctx.lineWidth=1;
 for(let x=8;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,66);ctx.lineTo(x,ground);ctx.stroke()}
 for(let y=94;y<ground;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // danger band
 ctx.fillStyle='rgba(255,95,100,.045)';ctx.fillRect(0,66,W,30);
 ctx.strokeStyle='rgba(255,110,110,.22)';ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(0,92);ctx.lineTo(W,92);ctx.stroke();ctx.setLineDash([]);
 // floor
 ctx.fillStyle='#1d2431';ctx.fillRect(0,ground,W,H-ground);
 ctx.strokeStyle='#596174';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(W,ground);ctx.stroke();
 ui();
 if(current&&!over){
   ctx.strokeStyle='rgba(220,230,255,.25)';ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(current.x,66);ctx.lineTo(current.x,ground);ctx.stroke();ctx.setLineDash([]);
   draw(current,.98);
 }
 for(const p of balls)draw(p);
 for(const p of parts){p.a+=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=360*.016;ctx.globalAlpha=Math.max(0,1-p.a/p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1}
 ctx.fillStyle='#c0c5d2';ctx.font='11px ui-monospace';ctx.textAlign='center';ctx.fillText(msg,W/2,H-30);
 // simple instruction that remains useful without covering play
 if(!over){ctx.fillStyle='#71798a';ctx.font='9px ui-monospace';ctx.fillText('DRAG  →  DROP  →  SAME + SAME = EVOLVE',W/2,H-14)}
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,66,W,ground-66)}
 if(over){
   ctx.fillStyle='rgba(8,10,15,.82)';ctx.fillRect(0,0,W,H);
   ctx.fillStyle='#fff';ctx.font='900 30px ui-monospace';ctx.textAlign='center';ctx.fillText('STACK FULL',W/2,H*.43);
   ctx.font='13px ui-monospace';ctx.fillText('SCORE '+score,W/2,H*.43+30);
   ctx.fillStyle='#bfc5d4';ctx.font='11px ui-monospace';ctx.fillText('タップでリスタート',W/2,H*.43+57);
 }
 ctx.textAlign='left';
}
function loop(t){const dt=Math.min(.03,(t-last)/1000||0);last=t;if(!over)physics(dt);for(const p of parts){}flash=Math.max(0,flash-dt);render();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
if(window.APKit)APKit.init({canvas:cv,gifName:'pixel-menagerie-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
 {label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset},{label:'?',name:'guide',onClick:guide}
]});
})();
</script>
