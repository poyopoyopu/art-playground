/* 動き方 */
const MOVE={'うさぎ':'hop','かえる':'hop','あおいことり':'fly','タコ':'swim','くじら':'swim','カメ':'slow','ペンギン':'waddle'};
const LABEL={walk:'あるく',hop:'はねる',fly:'とぶ',swim:'およぐ',slow:'のんびり',waddle:'よちよち'};
const DPR=Math.min(3,window.devicePixelRatio||1);
/* ドット絵を1ドット=1ピクセルで描き、まわりに濃い色のふち取りをつける */
function bake(c){return c.f.map(rows=>{const h=rows.length,w=rows[0].length,cv=document.createElement('canvas');cv.width=w+2;cv.height=h+2;const g=cv.getContext('2d');
  g.fillStyle=c.o;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(rows[y][x]!=='.'){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h||rows[yy][xx]==='.')g.fillRect(xx+1,yy+1,1,1);}}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch==='.')continue;g.fillStyle=c.p[ch];g.fillRect(x+1,y+1,1,1);}return cv;});}
CH.forEach(c=>{c.img=bake(c);c.mv=MOVE[c.n]||'walk';});
const g=document.getElementById('g'),cells=[];
function mk(c,canvas){return{c,cv:canvas,x:canvas.getContext('2d'),px:.2+Math.random()*.6,dir:Math.random()<.5?1:-1,t:Math.random()*4,pause:0,hop:Math.random(),fk:0,bl:Math.random()*3};}
CH.forEach(c=>{const d=document.createElement('div');d.className='c';const cv=document.createElement('canvas');d.appendChild(cv);
  const t=document.createElement('div');t.className='n';t.innerHTML=c.n+'<i>'+LABEL[c.mv]+'</i>';d.appendChild(t);g.appendChild(d);
  cells.push(mk(c,cv));d.addEventListener('click',()=>openBig(c));});
let big=null;const bigEl=document.getElementById('big'),bc=document.getElementById('bc');
function openBig(c){big=mk(c,bc);big.px=.5;document.getElementById('bt').textContent=c.n;bigEl.classList.add('on');}
bigEl.addEventListener('click',()=>{bigEl.classList.remove('on');big=null;});
const rnd=(a,b)=>a+Math.random()*(b-a);
function step(o,dt){o.t+=dt;o.bl-=dt;if(o.bl<-.14)o.bl=rnd(2,4.5);
  if(o.pause>0){o.pause-=dt;return;}
  const m=o.c.mv,v={walk:.13,hop:.18,fly:.12,swim:.06,slow:.035,waddle:.07}[m];
  const rate={walk:.16,hop:.2,fly:.1,swim:.42,slow:.3,waddle:.22}[m];o.fk+=dt/rate;
  if(m==='hop'){o.hop+=dt/.7;if(o.hop>=1){o.hop-=1;if(Math.random()<.25)o.pause=rnd(.5,1.4);}if(o.hop<.62)o.px+=o.dir*v*dt*1.6;}
  else o.px+=o.dir*v*dt;
  const mg=Math.min(.45,o.mg||.2);if(o.px<mg){o.px=mg;o.dir=1;}if(o.px>1-mg){o.px=1-mg;o.dir=-1;}
  if((m==='walk'||m==='waddle')&&Math.random()<dt*.15)o.pause=rnd(.6,1.6);
  if(Math.random()<dt*.06)o.dir*=-1;}
function draw(o,isBig){const r=o.cv.getBoundingClientRect(),w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);if(o.cv.width!==w||o.cv.height!==h){o.cv.width=w;o.cv.height=h;}
  const x=o.x,m=o.c.mv,water=m==='swim';x.imageSmoothingEnabled=false;
  const gr=x.createLinearGradient(0,0,0,h);if(water){gr.addColorStop(0,'#CFEFFC');gr.addColorStop(1,'#9AD4F0');}else{gr.addColorStop(0,'#EAF6FD');gr.addColorStop(1,'#FBFAF2');}x.fillStyle=gr;x.fillRect(0,0,w,h);
  const gy=Math.round(h*.84);
  if(!water){x.fillStyle='#CFEDB6';x.fillRect(0,gy,w,h-gy);x.fillStyle='#B4DD96';x.fillRect(0,gy,w,Math.max(2,Math.round(h*.02)));}
  else{x.fillStyle='#EAD9A6';x.fillRect(0,Math.round(h*.92),w,h);}
  const img0=o.c.img[0],D=Math.max(1,Math.floor(h*(isBig?.58:.6)/img0.height));
  o.mg=(img0.width*D*.5+4*DPR)/w;

  let cx=o.px*w,by=gy;
  if(m==='hop'&&moving)by-=Math.sin(Math.min(1,o.hop/.62)*Math.PI)*h*.22*(o.hop<.62?1:0);
  if(m==='fly')by=h*.6+Math.sin(o.t*2.3)*h*.08;
  if(m==='swim')by=h*.72+Math.sin(o.t*1.2)*h*.05;
  if(m==='waddle'&&moving)cx+=Math.sin(o.t*9)*D*.6;
  if(!water){const k=m==='fly'?.4:1;x.fillStyle='rgba(80,110,60,'+(.2*k)+')';x.beginPath();x.ellipse(cx,gy+D,img0.width*D*.32*k,D*1.4,0,0,Math.PI*2);x.fill();}
  const iw=img.width*D,ih=img.height*D,X=Math.round(cx-iw/2),Y=Math.round(by-ih+D);
  x.save();if(o.dir<0){x.translate(X+iw,Y);x.scale(-1,1);x.drawImage(img,0,0,iw,ih);}else x.drawImage(img,X,Y,iw,ih);x.restore();}
let last=performance.now();
function loop(t){const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;const vh=innerHeight;
  for(const o of cells){step(o,dt);const r=o.cv.getBoundingClientRect();if(r.bottom<-40||r.top>vh+40)continue;draw(o,false);}
  if(big){step(big,dt);draw(big,true);}requestAnimationFrame(loop);}
