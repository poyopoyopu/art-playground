<!doctype html>
<!-- どうぶつの動き — おっちゃんの動物シート(50種)の各コマを切り出し、それぞれの動き方(歩く・跳ねる・飛ぶ・泳ぐ)で小さな舞台の上を動かして見るページ。クロード作
     コマは体の重心と足元をそろえてあるので、パラパラしてもその場でぶれない。体から離れた小さな飾り(キラキラ・音符)は外した。20番・50番は有名キャラに似ているため除外 -->
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どうぶつの動き</title>
<style>
html,body{margin:0;background:#F4F1F6;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;color:#6A5A7A}
h1{font-size:18px;text-align:center;margin:18px 0 4px;letter-spacing:.1em}
p.s{text-align:center;font-size:12px;margin:0 0 12px;color:#9A8AA8}
.bar{display:flex;justify-content:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.bar button{border:0;border-radius:18px;padding:6px 14px;background:#fff;color:#6A5A7A;font:inherit;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar button.on{background:#FF8FB8;color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:0 10px calc(20px + env(safe-area-inset-bottom,0px))}
.c{background:#fff;border-radius:14px;padding:6px 6px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.c canvas{display:block;width:100%;height:96px;border-radius:10px}
.n{font-size:11px;margin-top:4px}
.n b{color:#C8A8C8;font-weight:600;margin-right:4px}
.n i{font-style:normal;color:#B8A8C8;margin-left:4px}
#big{position:fixed;inset:0;z-index:10;display:none;background:rgba(60,50,80,.5);align-items:center;justify-content:center}
#big.on{display:flex}
#big canvas{width:min(94vw,640px);height:min(60vh,380px);border-radius:20px;background:#fff}
#big .t{position:absolute;bottom:calc(10vh);left:0;right:0;text-align:center;color:#fff;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
</style></head><body>

<div class="bar"><button data-sp="1.6">ゆっくり</button><button data-sp="1" class="on">ふつう</button><button data-sp="0.6">はやい</button></div>
<div class="g" id="g"></div>
<div id="big"><canvas id="bc"></canvas><div class="t" id="bt"></div></div>

26.5, 53], [935, 465, 50, 52, 24.6, 51], [0, 523, 52, 51, 24.9, 50]], "37": [[53, 523, 96, 66, 50.0, 65], [150, 523, 70, 56, 35.9, 55], [221, 523, 57, 52, 29.5, 51]], "38": [[279, 523, 74, 63, 39.8, 62], [354, 523, 72, 65, 38.1, 64], [427, 523, 72, 64, 38.8, 63]], "39": [[500, 523, 115, 63, 64.1, 62], [616, 523, 101, 64, 57.1, 63]], "40": [[718, 523, 74, 58, 40.2, 57], [793, 523, 65, 57, 34.9, 56]], "41": [[859, 523, 99, 67, 51.2, 66], [0, 591, 73, 66, 38.1, 65], [74, 591, 68, 66, 34.0, 65]], "42": [[143, 591, 81, 56, 42.5, 55], [225, 591, 86, 55, 43.4, 54], [312, 591, 83, 58, 44.5, 57]], "43": [[396, 591, 67, 51, 32.3, 50], [464, 591, 67, 51, 32.5, 50], [532, 591, 71, 48, 35.2, 47]], "44": [[604, 591, 81, 58, 39.9, 57], [686, 591, 68, 57, 32.8, 56], [755, 591, 60, 49, 28.6, 48]], "45": [[816, 591, 54, 59, 27.9, 58], [871, 591, 57, 59, 31.7, 58], [929, 591, 53, 60, 27.0, 59]], "46": [[0, 658, 113, 64, 63.5, 63], [114, 658, 105, 65, 59.5, 64]], "47": [[220, 658, 68, 61, 37.8, 60], [289, 658, 67, 61, 37.1, 60], [357, 658, 66, 65, 35.6, 64]], "48": [[424, 658, 75, 54, 39.9, 53], [500, 658, 70, 54, 35.0, 53], [571, 658, 71, 53, 36.1, 52]], "49": [[643, 658, 81, 61, 40.9, 60], [725, 658, 80, 58, 41.7, 57], [806, 658, 77, 58, 39.3, 57]]},NM={"1": "ねこ", "2": "いぬ", "3": "うさぎ", "4": "ペンギン", "5": "ひよこ", "6": "かえる", "7": "あおいことり", "8": "おばけ", "9": "ハムスター", "10": "かめ", "11": "たこ", "12": "はいいろねこ", "13": "ひつじ", "14": "すずめ", "15": "ウーパールーパー", "16": "くじら", "17": "きつね", "18": "はりねずみ", "19": "にわとり", "21": "たぬき", "22": "あざらし", "23": "くろねこ", "24": "くらげ", "25": "ねずみ", "26": "こじか", "27": "レッサーパンダ", "28": "カワウソ", "29": "ことり", "30": "しろぎつね", "31": "はち", "32": "てんとうむし", "33": "あおむし", "34": "こうもり", "35": "かぶ", "36": "おほしさま", "37": "ドラゴン", "38": "ユニコーン", "39": "ほのおねこ", "40": "もちうさぎ", "41": "おおかみ", "42": "たれみみいぬ", "43": "かに", "44": "ふぐ", "45": "ふたば", "46": "じんべえざめ", "47": "いか", "48": "むらさきねこ", "49": "くもちゃん"};
/* 動き方:walk=歩く hop=ぴょんぴょん fly=空を飛ぶ swim=ふわふわ泳ぐ slide=ずりずり進む */
const MOVE={3:'hop',6:'hop',40:'hop',36:'hop',5:'walk',
 7:'fly',14:'fly',29:'fly',31:'fly',32:'fly',34:'fly',49:'fly',8:'fly',37:'walk',
 11:'swim',15:'swim',16:'swim',24:'swim',44:'swim',46:'swim',47:'swim',
 22:'slide',28:'slide',33:'slide',10:'slide',45:'hop',35:'hop',43:'walk'};
const FACE_LEFT={46:1};
const img=new Image();img.src='animal-motion-sprites.webp';
let slow=1;const cells=[];
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',()=>{slow=+b.dataset.sp;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));}));
const g=document.getElementById('g'),DPR=Math.min(3,window.devicePixelRatio||1);
function mk(n,canvas){const fr=R[n],mw=Math.max(...fr.map(f=>f[2])),mh=Math.max(...fr.map(f=>f[3]));
  return{n,fr,mw,mh,c:canvas,x:canvas.getContext('2d'),mv:MOVE[n]||'walk',px:Math.random(),dir:Math.random()<.5?1:-1,t:Math.random()*5,pause:0,hop:Math.random(),fk:0};}
Object.keys(R).map(Number).sort((a,b)=>a-b).forEach(n=>{
  const d=document.createElement('div');d.className='c';const c=document.createElement('canvas');d.appendChild(c);
  const mvj={walk:'あるく',hop:'はねる',fly:'とぶ',swim:'およぐ',slide:'すすむ'}[MOVE[n]||'walk'];
  const t=document.createElement('div');t.className='n';t.innerHTML='<b>'+n+'</b>'+NM[n]+'<i>'+mvj+'</i>';d.appendChild(t);g.appendChild(d);
  const o=mk(n,c);cells.push(o);d.addEventListener('click',()=>openBig(n));});
let big=null;const bigEl=document.getElementById('big'),bc=document.getElementById('bc');
function openBig(n){big=mk(n,bc);big.px=.5;document.getElementById('bt').textContent=n+'  '+NM[n];bigEl.classList.add('on');}
bigEl.addEventListener('click',()=>{bigEl.classList.remove('on');big=null;});
function fit(o){const r=o.c.getBoundingClientRect(),w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);if(o.c.width!==w||o.c.height!==h){o.c.width=w;o.c.height=h;}return[w,h];}
function step(o,dt){o.t+=dt;const sp=1/slow;
  if(o.pause>0){o.pause-=dt;return;}
  o.fk+=dt/(.15*slow);
  const v={walk:.12,hop:.16,fly:.1,swim:.06,slide:.06}[o.mv]*sp;
  if(o.mv==='hop'){o.hop+=dt*sp/.75;if(o.hop>=1){o.hop-=1;if(Math.random()<.18)o.pause=rnd(.4,1.2);}o.px+=o.dir*v*dt*(Math.sin(o.hop*Math.PI)>0?1.6:0);}
  else o.px+=o.dir*v*dt;
  const mg=Math.min(.45,o.mg||.15);if(o.px<mg){o.px=mg;o.dir=1;}if(o.px>1-mg){o.px=1-mg;o.dir=-1;}
  if(o.mv==='walk'&&Math.random()<dt*.12)o.pause=rnd(.6,1.6);
  if(Math.random()<dt*.05)o.dir*=-1;}
function rnd(a,b){return a+Math.random()*(b-a);}
function draw(o,isBig){const[w,h]=fit(o),x=o.x;x.clearRect(0,0,w,h);
  /* 舞台:空と地面(泳ぐ子は水の中) */
  const water=o.mv==='swim';const gy=h*(isBig?.84:.86);
  const gr=x.createLinearGradient(0,0,0,h);if(water){gr.addColorStop(0,'#CFEFFC');gr.addColorStop(1,'#9FD8F2');}else{gr.addColorStop(0,'#EAF6FD');gr.addColorStop(1,'#F8FBF2');}
  x.fillStyle=gr;x.fillRect(0,0,w,h);
  if(!water){x.fillStyle='#CDEBB4';x.fillRect(0,gy,w,h-gy);x.fillStyle='#B6DE98';x.fillRect(0,gy,w,Math.max(2,h*.02));}
  else{x.fillStyle='#E8D8A8';x.fillRect(0,h*.92,w,h*.08);}
  if(!img.complete||!img.naturalWidth)return;
  const S=(h*(isBig?.62:.6))/Math.max(o.mh,o.mw*.62);
  const moving=o.pause<=0;o.mg=(o.mw*S*.55+4)/w;
  const f=o.fr[Math.floor(o.fk)%o.fr.length];
  let cx=o.px*w,by=gy;
  if(o.mv==='hop'&&moving)by-=Math.sin(Math.min(1,o.hop)*Math.PI)*h*.22;
  if(o.mv==='fly'){by=h*.62+Math.sin(o.t*2.2)*h*.08;}
  if(o.mv==='swim'){by=h*.7+Math.sin(o.t*1.3)*h*.06;}
  if(o.mv==='walk'&&moving)by-=Math.abs(Math.sin(o.t*10/slow))*h*.012;
  /* 影 */
  if(!water){const sh=o.mv==='fly'?.35:o.mv==='hop'?.7+.3*(by/gy):1;x.fillStyle='rgba(80,110,60,'+(.18*sh)+')';x.beginPath();x.ellipse(cx,gy+h*.015,o.mw*S*.32*sh,h*.025,0,0,Math.PI*2);x.fill();}
  const faceR=!FACE_LEFT[o.n],flip=(o.dir<0)===faceR;
  x.imageSmoothingEnabled=false;x.save();x.translate(cx,by);if(flip)x.scale(-1,1);
  x.drawImage(img,f[0],f[1],f[2],f[3],-f[4]*S,-f[5]*S,f[2]*S,f[3]*S);x.restore();}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  const vis=window.innerHeight;
  for(const o of cells){step(o,dt);const r=o.c.getBoundingClientRect();if(r.bottom<-50||r.top>vis+50)continue;draw(o,false);}
  if(big){step(big,dt);draw(big,true);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
