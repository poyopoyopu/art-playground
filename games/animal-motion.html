.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:0 10px calc(20px + env(safe-area-inset-bottom,0px))}
.c{background:#fff;border-radius:14px;padding:8px 4px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.c canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
.n{font-size:11px;margin-top:4px}
.n b{color:#C8A8C8;font-weight:600;margin-right:4px}
</style></head><body>
