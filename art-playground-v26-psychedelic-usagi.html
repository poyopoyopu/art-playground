<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground — USAGI / Psychedelic Bloom</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#fff}
.title{position:absolute;left:5.5vw;top:5.5vh;text-shadow:0 2px 12px #000}
.title small{display:block;font-size:9px;letter-spacing:.42em;opacity:.7}
.title b{display:block;font-size:clamp(30px,7vw,48px);letter-spacing:.02em;margin-top:8px}
.title span{font-size:9px;letter-spacing:.30em;opacity:.45}
button{pointer-events:auto;position:absolute;right:5.5vw;top:5.5vh;width:64px;height:64px;border-radius:50%;border:1px solid #ffffff32;background:#080711c8;color:#fff;font-size:30px}
.hint{position:absolute;bottom:4.5vh;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.18em;opacity:.38;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="title"><small>ART PLAYGROUND</small><b>USAGI</b><span>PSYCHEDELIC LIVING PORTRAIT</span></div>
  <button id="regen">↻</button>
  <div class="hint">触れると、まわりの粒子が目を覚ます</div>
</div>
<script>
(()=>{
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W,H,D,t=0,seed=1,particles=[],ribbons=[],events=[],touch=[];
const MAX=900;
const colors=['#ff4da6','#ff8a3d','#ffe36a','#a2f35c','#43e4cf','#52c9ff','#817cff','#d76cff','#ffd9ed'];

function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function pick(){return colors[(rand()*colors.length)|0]}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);init()}
function init(){
 seed=(Date.now()>>>0);particles=[];ribbons=[];events=[];touch=[];
 const R=Math.min(W,H);
 for(let i=0;i<MAX;i++){
   const a=rand()*Math.PI*2, r=Math.pow(rand(),.78)*R*.48;
   particles.push({
     a,r,home:r,phase:rand()*Math.PI*2,
     speed:.02+rand()*.10,
     size:.45+rand()*2.0,
     c:pick(),life:rand()
   });
 }
 for(let i=0;i<15;i++) ribbons.push({
   radius:R*(.23+rand()*.30),phase:rand()*6.28,
   amp:8+rand()*22,turn:1+rand()*2.5,
   speed:(rand()-.5)*.004,c:pick(),w:.35+rand()*1.15
 });
}

/* Stable, recognizable chibi-rabbit silhouette.
   Unlike the previous version, the body is filled rather than only an outline. */
function bunnyPath(cx,cy,s){
 const p=new Path2D();
 // body
 p.ellipse(cx,cy+s*.25,s*.34,s*.40,0,0,Math.PI*2);
 // head
 p.ellipse(cx,cy-s*.14,s*.43,s*.39,0,0,Math.PI*2);
 // ears
 p.ellipse(cx-s*.24,cy-s*.56,s*.13,s*.32,-.08,0,Math.PI*2);
 p.ellipse(cx+s*.24,cy-s*.56,s*.13,s*.32,.08,0,Math.PI*2);
 return p;
}
function bunnyMask(x,y){
 const cx=W*.5,cy=H*.50,s=Math.min(W,H)*.42;
 const e1=((x-(cx-s*.24))/(s*.13))**2+((y-(cy-s*.56))/(s*.32))**2;
 const e2=((x-(cx+s*.24))/(s*.13))**2+((y-(cy-s*.56))/(s*.32))**2;
 const head=((x-cx)/(s*.43))**2+((y-(cy-s*.14))/(s*.39))**2;
 const body=((x-cx)/(s*.34))**2+((y-(cy+s*.25))/(s*.40))**2;
 return e1<1||e2<1||head<1||body<1;
}
function field(x,y,time){
 const nx=x/W,ny=y/H;
 let a=Math.sin(nx*8+time*.20)*.95+
       Math.cos(ny*7-time*.16)*.85+
       Math.sin((nx+ny)*13+time*.08)*.45;
 const cx=W*.5,cy=H*.5,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)+1;
 a+=Math.atan2(dy,dx)*.72+Math.sin(d*.015-time*.35)*.55;
 for(const q of touch){
   const dd=Math.hypot(x-q.x,y-q.y);
   if(dd<Math.min(W,H)*.45)a+=Math.atan2(y-q.y,x-q.x)*(1-dd/(Math.min(W,H)*.45))*q.power;
 }
 return a;
}
function drawBunny(time){
 const cx=W*.5,cy=H*.50,s=Math.min(W,H)*.42;
 const path=bunnyPath(cx,cy,s);

 // Soft colored inner light — shape remains stable and readable.
 ctx.save();
 ctx.globalCompositeOperation='lighter';
 ctx.shadowBlur=24;
 ctx.shadowColor='#ffdb9d';
 const g=ctx.createRadialGradient(cx,cy-s*.05,0,cx,cy,s*.55);
 g.addColorStop(0,'rgba(255,245,215,.96)');
 g.addColorStop(.55,'rgba(255,190,225,.82)');
 g.addColorStop(1,'rgba(255,105,190,.42)');
 ctx.fillStyle=g;ctx.fill(path);
 ctx.shadowBlur=0;

 // Dense living texture clipped inside the bunny.
 ctx.clip(path);
 for(let i=0;i<300;i++){
   const a=i*2.399963+time*.035;
   const rr=(i%31)/31*s*.43;
   const x=cx+Math.cos(a)*rr*(W/H);
   const y=cy+Math.sin(a)*rr;
   const cc=colors[i%colors.length];
   const pulse=.65+.35*Math.sin(time*1.4+i*.31);
   ctx.fillStyle=cc;
   ctx.globalAlpha=.10+.20*pulse;
   ctx.beginPath();ctx.arc(x,y,1.0+(i%5)*.32,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();

 // Clean facial identity.
 ctx.save();ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#20111e';
 ctx.beginPath();
 ctx.arc(cx-s*.15,cy-s*.15,s*.037,0,Math.PI*2);
 ctx.arc(cx+s*.15,cy-s*.15,s*.037,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#ff8fb9';
 ctx.beginPath();
 ctx.ellipse(cx-s*.22,cy+s*.04,s*.075,s*.045,0,0,Math.PI*2);
 ctx.ellipse(cx+s*.22,cy+s*.04,s*.075,s*.045,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#301421';ctx.lineWidth=s*.012;
 ctx.beginPath();ctx.arc(cx,cy+s*.005,s*.055,.18*Math.PI,.82*Math.PI);ctx.stroke();
 ctx.restore();
}
function draw(time){
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='rgba(5,3,10,.12)';ctx.fillRect(0,0,W,H);
 const cx=W*.5,cy=H*.50,R=Math.min(W,H);

 // Broad psychedelic currents — not rigid rings.
 ctx.globalCompositeOperation='lighter';
 for(const q of ribbons){
   q.phase+=q.speed;
   ctx.beginPath();
   for(let i=0;i<=180;i++){
     const a=i/180*Math.PI*2+q.phase;
     const rr=q.radius+
       Math.sin(a*q.turn+time*.45+q.phase*2)*q.amp+
       Math.sin(a*4-time*.18)*q.amp*.22;
     const x=cx+Math.cos(a)*rr*(W/H),y=cy+Math.sin(a)*rr;
     i?ctx.lineTo(x,y):ctx.moveTo(x,y);
   }
   ctx.strokeStyle=q.c+'20';ctx.lineWidth=q.w;ctx.stroke();
 }

 // Fixed population, recycled forever.
 for(const p of particles){
   const baseA=p.a;
   const x0=cx+Math.cos(baseA)*p.r*(W/H),y0=cy+Math.sin(baseA)*p.r;
   const ang=field(x0,y0,time);
   p.a+=p.speed*.002;
   p.r=p.home+Math.sin(time*.45+p.phase)*5+Math.sin(time*.13+p.phase*2)*3;
   let x=cx+Math.cos(p.a)*p.r*(W/H);
   let y=cy+Math.sin(p.a)*p.r;

   // Keep the character clean; particles skirt and flow around it.
   if(bunnyMask(x,y)){
     const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1;
     x=cx+dx/d*(R*.33)*(W/H);
     y=cy+dy/d*(R*.33);
   }
   const pulse=.55+.45*Math.sin(time*1.7+p.phase);
   ctx.globalAlpha=.16+.32*pulse;
   ctx.fillStyle=p.c;ctx.shadowBlur=5;ctx.shadowColor=p.c;
   ctx.beginPath();
   ctx.arc(x+Math.cos(ang)*1.8* pulse,y+Math.sin(ang)*1.8*pulse,p.size*(.75+.45*pulse),0,Math.PI*2);
   ctx.fill();
 }
 ctx.shadowBlur=0;

 // Finite psychedelic events.
 if(Math.sin(time*.29)>.998 && events.length<3){
   const a=rand()*Math.PI*2,d=R*(.37+rand()*.12);
   events.push({x:cx+Math.cos(a)*d*(W/H),y:cy+Math.sin(a)*d,r:2,life:1,c:pick()});
 }
 for(let i=events.length-1;i>=0;i--){
   const e=events[i];e.r+=3.2;e.life-=.018;
   ctx.globalAlpha=e.life*.22;ctx.strokeStyle=e.c;ctx.lineWidth=1.2;
   ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
   if(e.life<=0)events.splice(i,1);
 }

 drawBunny(time);

 for(let i=touch.length-1;i>=0;i--){touch[i].power*=.97;if(touch[i].power<.03)touch.splice(i,1)}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(draw);
}
function touchAt(e){
 const r=c.getBoundingClientRect();
 touch.push({x:e.clientX-r.left,y:e.clientY-r.top,power:1});
 if(touch.length>5)touch.shift();
}
let down=false;
c.addEventListener('pointerdown',e=>{down=true;touchAt(e)});
c.addEventListener('pointermove',e=>{if(down&&Math.random()<.14)touchAt(e)});
addEventListener('pointerup',()=>down=false);
document.getElementById('regen').onclick=init;
addEventListener('resize',resize);
resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
