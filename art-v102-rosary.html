<!-- ROSARY — クロちゃん(Claude)作。おっちゃんが見せてくれた動画(mesmerizeappのリール「点でできた輪が何重にも並ぶ万華鏡が、中心から脈打って湧き出す」)を参考に、
     「数えた珠の数が、次に生まれる輪の数になる」という世界のルールで再構成。ap-kit.js統合: クロちゃん -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ROSARY — 数えた珠の数が、次の世界の形になる</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05090b;overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas#c{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#888;font:14px sans-serif}
  #hint{position:fixed;left:16px;right:16px;bottom:calc(18% + env(safe-area-inset-bottom));text-align:center;
    color:rgba(220,240,232,.78);font:13px/1.9 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.06em;
    pointer-events:none;transition:opacity 1.2s;text-shadow:0 0 8px #000}
</style>
<script src="ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="nogl">WebGL2が使えない環境です</div>
<div id="hint">珠の輪をタップ — 数えた珠の数が、次の輪の数になる<br>長押しで息を吸い、離すと吐き出す</div>
<script>
(function(){
"use strict";

/* ---------- 世界のルール ----------
   この世界は「珠(たま)の輪」でできている。
   ひとつの帯には、珠の輪が N 個ぐるりと並ぶ(N = 帯の対称数)。輪ひとつには珠が m 個。
   輪の中には同じ数の珠の小さな輪、そのまた中にさらに小さな輪(入れ子)。
   そして帯そのものも、外から見れば「輪の珠」でできた大きな輪になっている。
   帯は中心で生まれ、息に合わせて外へ外へと流れていく(対数極座標なので、どこまで潜っても同じ構造)。

   ・タップ … 触れた輪の珠を数える。その数 m が、これから中心で生まれる帯の対称数 N になる。
              珠の数は (N + m) から次の数が決まる。色も一代ごとに少しずれる。
              だから触った順番が、同心円の「家系」として外へ流れ出ていく。一度流れた帯は変わらない。
   ・長押し … 息を吸う。世界が中心へ吸い込まれ、光が溜まる。
   ・離す   … 吐き出す。溜めた分だけ一気に外へ噴き出す(放射状の光の尾)。
   ・✦ … 次に生まれる帯の数と色をランダムに。 ・↻ … 最初の世界に戻す。 */

var cv=document.getElementById('c');
var gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('nogl').style.display='flex';return;}

var VS='#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var FS=[
'#version 300 es',
'precision highp float;',
'out vec4 o;',
'uniform vec2 uRes;',
'uniform float uT,uScroll,uBlur,uCharge,uFlashK,uFlashAge;',
'uniform int uSamp,uK0;',
'uniform float uN[24],uM[24],uRot[24],uTint[24];',
'const float PI=3.14159265,TAU=6.2831853,HB=0.6;',
'float h1(float x){return fract(sin(x*127.1)*43758.5453);}',
'float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'vec3 tintCol(float t){return 0.5+0.5*cos(TAU*(t+vec3(0.0,0.33,0.67)));}',
'float cover(float d,float rr,float px){',
'  float e=max(px*0.8,rr*0.25);',
'  return (1.0-smoothstep(rr-e,rr+e,d))*min(1.0,rr*rr/(px*px)*2.0);',
'}',
// 珠の輪: 半径R、珠m個
'float bead(vec2 q,float R,float m,float off,float dr,float px,out float an){',
'  float st=TAU/m;',
'  float a=atan(q.y,q.x);',
'  an=floor((a-off)/st+0.5)*st+off;',
'  float d=length(q-R*vec2(cos(an),sin(an)));',
'  return cover(d,dr,px)+0.07*exp(-d*d/(dr*dr*6.0))*min(1.0,dr/px);',
'}',
'vec3 irid(float t,float a,float sat){',
'  vec3 c=tintCol(t+0.16*sin(a)+0.07*sin(2.0*a+uT*0.7));',
'  return mix(vec3(0.92,0.95,1.0),c,sat);',
'}',
'vec3 pat(float w,float v,float px){',
'  float kf=floor(w/HB);',
'  int idx=clamp(int(kf)-uK0,0,23);',
'  float N=uN[idx],m=uM[idx];',
'  float par=mod(kf,2.0);',
'  float spin=(par<1.0?1.0:-1.0)*uT*0.03;',
'  float cw=TAU/N;',
'  float vv=v+uRot[idx]+spin;',
'  float ci=floor(vv/cw);',
'  float qx=(fract(vv/cw)-0.5)*cw;',
'  float qy=(fract(w/HB)-0.5)*HB;',
'  vec2 q=vec2(qx,qy);',
'  float R=0.36*min(cw,HB);',
'  float dr=min(R*sin(PI/m)*0.36,R*0.10);',
'  float a0,a1,a2,a3;',
'  float b0=bead(q,R*1.24,m*2.0,PI*0.5+PI/(m*2.0),dr*0.55,px,a0);',
'  float b1=bead(q,R,m,PI*0.5,dr,px,a1);',
'  float b2=bead(q,R*0.6,m,PI*0.5+PI/m,dr*0.62,px,a2);',
'  float b3=bead(q,R*0.3,max(3.0,floor(m*0.5)),PI*0.5,dr*0.42,px,a3);',
'  float c0=cover(length(q),dr*0.7,px);',
// 輪と輪のあいだの放射状の点線
'  float sz=HB/6.0;',
'  float sx=abs(abs(qx)-cw*0.5);',
'  float sy=(fract(w/sz)-0.5)*sz;',
'  float sp=cover(length(vec2(sx,sy)),dr*0.4,px);',
// 散らばった星屑(鏡像になるよう|qx|で)
'  float gz=HB/7.0;',
'  vec2 g=vec2(abs(qx),w)/gz; vec2 gi=floor(g); vec2 gf=fract(g)-0.5;',
'  float hh=h2(gi+vec2(N*1.7,m));',
'  vec2 off=(vec2(h2(gi+3.1),h2(gi+7.7))-0.5)*0.6;',
'  float spr=step(0.5,hh)*cover(length((gf-off)*gz),gz*0.07,px)*(0.55+0.45*sin(uT*3.0+hh*40.0));',
// きらめき(1つおきの輪が対称に光る)
'  float hs=h1(kf*7.13+mod(ci,2.0)*3.7+N);',
'  float g1=pow(max(0.0,sin(uT*(1.1+uCharge*1.2)+hs*TAU+kf*0.8)),22.0);',
'  float th=uTint[idx];',
'  vec3 tc=tintCol(th);',
'  vec3 c0c=irid(th+0.00,a0,0.75);',
'  vec3 c1c=irid(th+0.10,a1,0.70);',
'  vec3 c2c=irid(th+0.24,a2,0.78);',
'  vec3 c3c=irid(th+0.40,a3,0.85);',
'  vec3 col=c0c*b0*0.55+c1c*b1*0.95+c2c*b2*0.75+c3c*b3*0.65',
'    +vec3(1.0,0.93,0.80)*c0*0.85+irid(th+0.55,qy*6.0,0.5)*sp*0.42+vec3(0.80,0.86,1.0)*spr*0.5;',
'  vec3 glc=mix(tintCol(th+0.5),vec3(1.0),0.45);',
'  col+=glc*(b1+b2*0.8+b3*0.6+c0*0.5)*g1*3.6;',
'  float fl=(1.0-step(0.5,abs(kf-uFlashK)))*exp(-uFlashAge*2.0);',
'  col+=glc*(b1+b2+b3+c0+sp)*fl*2.6;',
'  col*=1.0+uCharge*0.45;',
'  return col;',
'}',
'void main(){',
'  float S=0.5*min(uRes.x,uRes.y);',
'  vec2 p=(gl_FragCoord.xy-0.5*uRes)/S;',
'  float r=max(length(p),1e-4);',
'  float u=log(r);',
'  float v=atan(p.y,p.x);',
'  float px=1.0/(S*r);',
'  vec3 acc=vec3(0.0); float nm=0.0;',
'  float n=float(uSamp);',
'  for(int i=0;i<12;i++){',
'    if(i>=uSamp)break;',
'    float f=float(i)/max(1.0,n-1.0);',
'    float wt=1.0-0.55*f;',
'    vec3 ch=uSamp>1?mix(vec3(1.25,0.85,0.55),vec3(0.55,0.85,1.30),f):vec3(1.0);',
'    acc+=pat(u-uScroll+uBlur*f,v,px)*ch*wt; nm+=wt;',
'  }',
'  acc/=nm;',
'  vec3 tc=tintCol(uTint[0]);',
'  float sw=0.5+0.5*sin(v*3.0+u*1.4-uT*0.12);',
'  vec3 bg=mix(vec3(0.030,0.016,0.060),vec3(0.000,0.050,0.060),sw)*(0.7+0.5*exp(-r*0.8));',
'  bg+=tintCol(uTint[0]+0.5)*0.025*exp(-r*1.2);',
'  vec3 col=bg+acc;',
'  col+=mix(tc,vec3(1.0),0.4)*(0.10+uCharge*0.12)*exp(-r*14.0);',
'  col=1.0-exp(-col*1.5);',
'  col*=1.0-0.35*smoothstep(0.9,2.2,r);',
'  o=vec4(col,1.0);',
'}'
].join('\n');

function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
var pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
var U={};['uRes','uT','uScroll','uBlur','uCharge','uFlashK','uFlashAge','uSamp','uK0','uN','uM','uRot','uTint']
  .forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});

var W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.75);
  // 見えているキャンバスの実寸で描く(iPhoneは100vhとinnerHeightが食い違い、縦に引き伸ばされて楕円・中心ずれになる)
  W=cv.clientWidth||window.innerWidth;H=cv.clientHeight||window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  gl.viewport(0,0,cv.width,cv.height);
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
resize();

/* ---------- 帯の遺伝子 ---------- */
var HB=0.6, R_BIRTH=0.03, R_MIN=0.002;
var INIT={N:12,m:16,tint:0.62};
var genes=new Map();
var cur=Object.assign({},INIT);
var scroll=0;
function par(k){return ((k%2)+2)%2;}
function birthK(){return Math.floor((Math.log(R_BIRTH)-scroll)/HB);}
function maxK(){return Math.floor((Math.log(Math.hypot(W,H)/Math.min(W,H)*1.05)-scroll)/HB)+1;}
function make(g,k){return {N:g.N,m:g.m,tint:g.tint,rot:par(k)?Math.PI/g.N:0};}
function geneFor(k){
  var g=genes.get(k); if(g)return g;
  return make(cur,k);
}
function seedVisible(){
  genes.clear();
  for(var k=birthK();k<=maxK()+2;k++)genes.set(k,make(INIT,k));
}
function assignBorn(){
  var b=birthK(), mx=maxK()+2;
  for(var k=b;k<=mx;k++){
    if(!genes.has(k)){
      // 外側から戻ってきた(吸い込みで初めて見えた)帯は、いちばん外の既知の帯を受け継ぐ
      if(k>b && genes.has(k-1)){genes.set(k,make(genes.get(k-1),k));}
      else genes.set(k,make(cur,k));
    }
  }
}
seedVisible();

var aN=new Float32Array(24),aM=new Float32Array(24),aR=new Float32Array(24),aT=new Float32Array(24);

/* ---------- 息 ---------- */
var t=0,last=performance.now(),base=0.2,kick=0,charge=0,holding=false;
var flashK=-999,flashAge=99;

function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
  var breath=0.6*Math.pow(Math.max(0,Math.sin(t*1.25)),6);
  var target=holding?-0.22:0.16+breath;
  base+=(target-base)*Math.min(1,dt*3);
  kick*=Math.exp(-dt*1.3);
  var speed=base+kick;
  scroll+=speed*dt;
  charge=holding?Math.min(2.5,charge+dt*0.8):charge*Math.exp(-dt*1.4);
  flashAge+=dt;
  assignBorn();
  var k0=Math.floor((Math.log(R_MIN)-scroll)/HB)-1;
  for(var i=0;i<24;i++){
    var g=geneFor(k0+i);
    aN[i]=g.N;aM[i]=g.m;aR[i]=g.rot;aT[i]=g.tint;
  }
  var blur=Math.min(0.45,Math.max(0,Math.abs(speed)-0.14)*0.16);
  var samp=Math.min(10,1+Math.ceil(blur/0.03));
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform1f(U.uT,t);gl.uniform1f(U.uScroll,scroll);gl.uniform1f(U.uBlur,blur);
  gl.uniform1f(U.uCharge,charge);gl.uniform1f(U.uFlashK,flashK);gl.uniform1f(U.uFlashAge,flashAge);
  gl.uniform1i(U.uSamp,samp);gl.uniform1i(U.uK0,k0);
  gl.uniform1fv(U.uN,aN);gl.uniform1fv(U.uM,aM);gl.uniform1fv(U.uRot,aR);gl.uniform1fv(U.uTint,aT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 表示 ---------- */
var hint=document.getElementById('hint');
var hintGone=false;
function hideHint(){if(hintGone)return;hintGone=true;hint.style.opacity=0;}
setTimeout(hideHint,7000);

/* ---------- 操作 ---------- */
function choose(x,y){
  var S=0.5*Math.min(W,H);
  var px=(x-W/2)/S,py=(H/2-y)/S;
  var r=Math.max(Math.hypot(px,py),1e-4);
  var k=Math.floor((Math.log(r)-scroll)/HB);
  var g=geneFor(k);
  cur={N:g.m,m:((g.N+g.m-3)%18)+4,tint:(g.tint+0.09+g.m*0.013)%1};  // 色も数えた珠の数だけずれる
  flashK=k;flashAge=0;
  kick+=0.45;
}
function mutate(){
  cur={N:5+Math.floor(Math.random()*12),m:5+Math.floor(Math.random()*14),tint:Math.random()};
  kick+=0.6;flashK=birthK();flashAge=0;
}
function resetAll(){
  scroll=0;cur=Object.assign({},INIT);seedVisible();
  kick=0;charge=0;base=0.2;flashAge=99;
}

var down=null,holdTimer=0;
cv.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(down)return;
  hideHint();
  var rc=cv.getBoundingClientRect();
  down={x:e.clientX,y:e.clientY,cx:e.clientX-rc.left,cy:e.clientY-rc.top,id:e.pointerId,moved:false};
  clearTimeout(holdTimer);
  holdTimer=setTimeout(function(){if(down&&!down.moved)holding=true;},280);
  e.preventDefault();
});
cv.addEventListener('pointermove',function(e){
  if(!down||e.pointerId!==down.id)return;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>14)down.moved=true;
});
function up(e){
  if(!down||e.pointerId!==down.id)return;
  clearTimeout(holdTimer);
  if(holding){
    holding=false;
    kick+=0.5+charge*0.95;   // 吐き出す
  }else if(!down.moved){
    choose(down.cx,down.cy);
  }
  down=null;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',function(e){if(down&&e.pointerId===down.id){clearTimeout(holdTimer);holding=false;down=null;}});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

if(window.APKit){
  window.APKit.init({
    canvas:cv,
    gifName:'rosary',
    clockFormat:'spec',
    dock:true,
    autoHide:true,
    fullscreenButton:false,
    buttons:[
      {label:'✦',name:'mutate',onClick:mutate},
      {label:'↻',name:'reset',onClick:resetAll}
    ]
  });
}
})();
</script>
</body>
</html>
