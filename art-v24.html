<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Cosmos — Art Playground</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}.brand{position:absolute;left:6vw;top:max(6vh,env(safe-area-inset-top));text-shadow:0 2px 20px #000}.brand b{display:block;font-size:clamp(22px,4.2vw,44px);letter-spacing:.08em;font-weight:750}.brand span{font-size:10px;letter-spacing:.32em;opacity:.55}.controls{position:absolute;right:5vw;top:max(5vh,env(safe-area-inset-top));display:flex;gap:9px;pointer-events:auto}.btn{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff28;background:#080b18a8;color:#fff;font-size:20px;backdrop-filter:blur(8px)}.mode{position:absolute;left:50%;bottom:max(5vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.24em;opacity:.65;white-space:nowrap;text-align:center}.mode b{display:block;font-size:11px;letter-spacing:.34em;margin-bottom:5px;color:#d9e4ff}.flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .15s}.tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.28em;opacity:.7;text-align:center;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
</style></head><body><canvas id="c"></canvas><div class="ui"><div class="brand"><b>PARTICLE COSMOS</b><span>ART PLAYGROUND — v24</span></div><div class="controls"><button class="btn" id="mode" aria-label="mode">✦</button><button class="btn" id="regen" aria-label="regenerate">↻</button></div><div class="tip" id="tip">TOUCH THE UNIVERSE</div><div class="mode"><b id="modeName">BLOOM</b><span>tap ✦ to transform</span></div><div class="flash" id="flash"></div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W,H,D,N,pts=[],t0=performance.now(),mode=0,lastTouch=null,trail=[],auto=0;
const modes=['BLOOM','ORBIT','TORNADO','HEART','GALAXY'];
const palettes=[[190,320],[260,40],[280,190],[330,15],[210,290]];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);N=Math.min(5200,Math.max(1800,Math.floor(W*H/210)));build()}
function rand(a=1){return Math.random()*a}
function build(){pts=[];for(let i=0;i<N;i++){let a=rand(Math.PI*2),r=Math.pow(Math.random(),.42)*Math.min(W,H)*.52;pts.push({a,r,phase:rand(Math.PI*2),speed:.2+rand(1.2),seed:rand(1000),size:.35+rand(1.7),h:rand(360),x:W/2,y:H/2,px:0,py:0})}trail=[];lastTouch=null;auto=0;burst()}
function burst(){const f=document.getElementById('flash');f.style.opacity=.16;setTimeout(()=>f.style.opacity=0,80)}
function target(p,u){let cx=W*.5,cy=H*.52,s=Math.min(W,H),a=p.a+u*.16*p.speed+p.phase*.2,r=p.r;
if(mode===0){ // flower / breathing cosmos
 let k=5+Math.sin(u*.22)*2, rr=r*(.78+.22*Math.sin(k*a+u*.7+p.phase));return[cx+Math.cos(a)*rr*1.08,cy+Math.sin(a)*rr*.82];
}
if(mode===1){let rings=2+Math.floor(p.seed%4),rr=(p.r*.18)+(rings*(s*.095))+Math.sin(u*.8+p.phase)*s*.018;return[cx+Math.cos(a*2.4+u*.45)*rr*1.35,cy+Math.sin(a*2.4+u*.45)*rr*.78];}
if(mode===2){let y=(p.r/s-.5)*H*1.25,rr=(1-Math.abs(y)/(H*.7))*s*(.10+.22*(p.seed%1));let aa=a*1.8+u*1.4+y/s*9;return[cx+Math.cos(aa)*rr,cy+y+Math.sin(aa*2)*s*.025];}
if(mode===3){let q=(p.seed%1)*Math.PI*2,rr=(p.r/(s*.52))*s*.29,x=16*Math.pow(Math.sin(q),3),y=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q);let scale=s*.018;return[cx+x*scale*(.3+rr/(s*.3)),cy-y*scale*(.3+rr/(s*.3))];}
// galaxy
let arms=4,aa=a+Math.log(1+r)*.75+u*.18,rr=r*.72;aa+=Math.floor(p.seed*arms)*Math.PI*2/arms;return[cx+Math.cos(aa)*rr*1.25,cy+Math.sin(aa)*rr*.58];
}
function frame(now){let u=(now-t0)/1000;auto+=.006;ctx.fillStyle='rgb(2,3,10)';ctx.fillRect(0,0,W,H);
// atmospheric glow
let g=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.72);g.addColorStop(0,'#0a1030');g.addColorStop(.35,'#070a1a');g.addColorStop(1,'#02030a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const [h1,h2]=palettes[mode];ctx.globalCompositeOperation='lighter';
for(let p of pts){let [tx,ty]=target(p,u);if(lastTouch){let dx=tx-lastTouch.x,dy=ty-lastTouch.y,d2=dx*dx+dy*dy,range=Math.min(W,H)*.28;if(d2<range*range){let q=1-Math.sqrt(d2)/range,ang=Math.atan2(dy,dx)+Math.sin(u*3+p.phase)*1.4;tx+=Math.cos(ang)*q*q*range*.42;ty+=Math.sin(ang)*q*q*range*.42;}}
 p.x+=(tx-p.x)*.055;p.y+=(ty-p.y)*.055;
 let vel=Math.hypot(p.x-p.px,p.y-p.py);p.px=p.x;p.py=p.y;let hue=(h1+(h2-h1)*(p.seed%1)+Math.sin(u*.7+p.phase)*18+360)%360;let alpha=.22+Math.min(.7,vel*.22)+p.size*.05;let sz=p.size*(.75+Math.min(1.8,vel*.18));ctx.fillStyle=`hsla(${hue},100%,${64+Math.min(18,vel*8)}%,${alpha})`;ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();}
// touch shockwaves
for(let i=trail.length-1;i>=0;i--){let q=trail[i];q.r+=4.5;q.life-=.022;if(q.life<=0){trail.splice(i,1);continue}ctx.strokeStyle=`hsla(${q.h},100%,72%,${q.life*.55})`;ctx.lineWidth=1+q.life*2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke()}
ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}
function interact(e){const r=c.getBoundingClientRect();let p={x:e.clientX-r.left,y:e.clientY-r.top};lastTouch=p;trail.push({x:p.x,y:p.y,r:4,life:1,h:180+Math.random()*160});document.getElementById('tip').style.opacity=0;clearTimeout(window.__clear);window.__clear=setTimeout(()=>lastTouch=null,1200)}
c.addEventListener('pointerdown',e=>{interact(e);c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(e.buttons)interact(e)});
document.getElementById('regen').onclick=build;document.getElementById('mode').onclick=()=>{mode=(mode+1)%modes.length;document.getElementById('modeName').textContent=modes[mode];lastTouch=null;burst();};addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script></body></html>
