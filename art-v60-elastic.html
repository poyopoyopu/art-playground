<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Art Playground — ELASTIC</title><script src="ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030307}body{touch-action:none}canvas{width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* ELASTIC v60 — ChatGPT作。3秒完全ループ。空間は伸縮する膜。触れた場所が引力点になり、重なった引力が網目の形を変える。 */
const c=document.getElementById('c'),g=c.getContext('2d'),TAU=Math.PI*2;let W,H,D=1,seed=Math.random()*99,pts=[],st=performance.now();const N=18;function S(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',S);S();function P(i,j,t,A){let X=i/(N-1)*W,Y=j/(N-1)*H,s=Math.min(W,H);for(const a of A){let dx=a.x-X,dy=a.y-Y,d=Math.hypot(dx,dy)+30,k=Math.exp(-d/(s*.23))*.45;X+=dx*k;Y+=dy*k}return[X+Math.sin(t+j)*5,Y+Math.cos(t+i*.8)*5]}function R(t,A){g.fillStyle='rgba(3,3,7,.18)';g.fillRect(0,0,W,H);for(let j=0;j<N;j++){g.beginPath();for(let i=0;i<N;i++){let p=P(i,j,t,A);i?g.lineTo(...p):g.moveTo(...p)}g.strokeStyle=`hsla(${(j*16+seed*31)%360} 90% 72%/.62)`;g.stroke()}for(let i=0;i<N;i++){g.beginPath();for(let j=0;j<N;j++){let p=P(i,j,t,A);j?g.lineTo(...p):g.moveTo(...p)}g.strokeStyle=`hsla(${(i*18+seed*31+130)%360} 90% 72%/.4)`;g.stroke()}}function A(){R((performance.now()-st)/1000*TAU/3,pts);requestAnimationFrame(A)}A();c.onpointerdown=e=>{pts.unshift({x:e.clientX,y:e.clientY});pts=pts.slice(0,5)};APKit.init({canvas:c,gifName:'elastic-loop',clockFormat:'spec',loopFrame:p=>R(p,[]),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>pts=[]}]});
</script></body></html>
