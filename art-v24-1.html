<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Cosmos — Art Playground</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}.brand{position:absolute;left:6vw;top:max(6vh,env(safe-area-inset-top));text-shadow:0 2px 20px #000}.brand b{display:block;font-size:clamp(22px,4.2vw,44px);letter-spacing:.08em;font-weight:750}.brand span{font-size:10px;letter-spacing:.32em;opacity:.55}.controls{position:absolute;right:5vw;top:max(5vh,env(safe-area-inset-top));display:flex;gap:9px;pointer-events:auto}.btn{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff28;background:#080b18a8;color:#fff;font-size:20px;backdrop-filter:blur(8px)}.mode{position:absolute;left:50%;bottom:max(5vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.24em;opacity:.65;white-space:nowrap;text-align:center}.mode b{display:block;font-size:11px;letter-spacing:.34em;margin-bottom:5px;color:#d9e4ff}.flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .15s}.tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.28em;opacity:.7;text-align:center;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
</style></head><body><canvas id="c"></canvas><div class="ui"><div class="brand"><b>PARTICLE COSMOS</b><span>ART PLAYGROUND — v24</span></div><div class="controls"><button class="btn" id="mode" aria-label="mode">✦</button><button class="btn" id="regen" aria-label="regenerate">↻</button></div><div class="tip" id="tip">TOUCH THE UNIVERSE</div><div class="mode"><b id="modeName">BLOOM</b><span>tap ✦ to transform</span></div><div class="flash" id="flash"></div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W,H,D,N,pts=[],t0=performance.now(),mode=0,trail=[],shock=[],wells=[],drag=null,auto=0;
const modes=['BLOOM','ORBIT','TORNADO','HEART','GALAXY'];
const palettes=[[190,320],[260,40],[280,190],[330,15],[210,290]];

function resize(){
 D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
 N=Math.min(5000,Math.max(1800,Math.floor(W*H/220)));build();
}
function rand(a=1){return Math.random()*a}
function build(){
 pts=[];
 for(let i=0;i<N;i++){
  let a=rand(Math.PI*2),r=Math.pow(Math.random(),.42)*Math.min(W,H)*.52;
  pts.push({a,r,phase:rand(Math.PI*2),speed:.2+rand(1.2),seed:rand(1000),size:.35+rand(1.7),h:rand(360),x:W/2,y:H/2,px:W/2,py:H/2,vx:0,vy:0});
 }
 trail=[];shock=[];wells=[];drag=null;burst();
}
function burst(){
 const f=document.getElementById('flash');f.style.opacity=.16;
 setTimeout(()=>f.style.opacity=0,80);
}
function target(p,u){
 let cx=W*.5,cy=H*.52,s=Math.min(W,H),a=p.a+u*.16*p.speed+p.phase*.2,r=p.r;
 if(mode===0){
  let k=5+Math.sin(u*.22)*2,rr=r*(.78+.22*Math.sin(k*a+u*.7+p.phase));
  return[cx+Math.cos(a)*rr*1.08,cy+Math.sin(a)*rr*.82];
 }
 if(mode===1){
  let rings=2+Math.floor(p.seed%4),rr=(p.r*.18)+(rings*(s*.095))+Math.sin(u*.8+p.phase)*s*.018;
  return[cx+Math.cos(a*2.4+u*.45)*rr*1.35,cy+Math.sin(a*2.4+u*.45)*rr*.78];
 }
 if(mode===2){
  let y=(p.r/s-.5)*H*1.25,rr=(1-Math.abs(y)/(H*.7))*s*(.10+.22*(p.seed%1));
  let aa=a*1.8+u*1.4+y/s*9;
  return[cx+Math.cos(aa)*rr,cy+y+Math.sin(aa*2)*s*.025];
 }
 if(mode===3){
  let q=(p.seed%1)*Math.PI*2,rr=(p.r/(s*.52))*s*.29;
  let x=16*Math.pow(Math.sin(q),3),y=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q);
  let scale=s*.018;return[cx+x*scale*(.3+rr/(s*.3)),cy-y*scale*(.3+rr/(s*.3))];
 }
 let arms=4,aa=a+Math.log(1+r)*.75+u*.18,rr=r*.72;
 aa+=Math.floor(p.seed*arms)*Math.PI*2/arms;
 return[cx+Math.cos(aa)*rr*1.25,cy+Math.sin(aa)*rr*.58];
}
function field(p,x,y){
 for(const w of wells){
  let dx=w.x-x,dy=w.y-y,d=Math.hypot(dx,dy)+1,range=Math.min(W,H)*.30;
  if(d<range){
   let q=1-d/range,f=w.power*q*q;
   if(w.kind==='black'){p.vx+=dx/d*f*2.5;p.vy+=dy/d*f*2.5;}
   else {p.vx+=(-dy/d)*f*2.8;p.vy+=(dx/d)*f*2.8;}
  }
 }
}
function frame(now){
 let u=(now-t0)/1000;
 ctx.fillStyle='rgb(2,3,10)';ctx.fillRect(0,0,W,H);
 let g=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.72);
 g.addColorStop(0,'#0a1030');g.addColorStop(.35,'#070a1a');g.addColorStop(1,'#02030a');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const [h1,h2]=palettes[mode];ctx.globalCompositeOperation='lighter';

 for(const p of pts){
  let [tx,ty]=target(p,u);
  field(p,tx,ty);

  if(drag){
   let dx=drag.x-tx,dy=drag.y-ty,d=Math.hypot(dx,dy)+1,range=Math.min(W,H)*.34;
   if(d<range){
    let q=1-d/range, swirl=drag.vx*.75-drag.vy*.35;
    tx+=dx*q*q*1.15-dy*q*.45+drag.vx*q*1.8;
    ty+=dy*q*q*1.15+dx*q*.45+drag.vy*q*1.8;
    p.vx+=swirl*q*.18;p.vy+=(drag.vy*.75+drag.vx*.35)*q*.18;
   }
  }

  p.x+=(tx-p.x)*.055+p.vx;
  p.y+=(ty-p.y)*.055+p.vy;
  p.vx*=.91;p.vy*=.91;

  let vel=Math.hypot(p.x-p.px,p.y-p.py);p.px=p.x;p.py=p.y;
  let hue=(h1+(h2-h1)*(p.seed%1)+Math.sin(u*.7+p.phase)*18+360)%360;
  let alpha=.22+Math.min(.7,vel*.22)+p.size*.05,sz=p.size*(.75+Math.min(1.8,vel*.18));
  ctx.fillStyle=`hsla(${hue},100%,${64+Math.min(18,vel*8)}%,${alpha})`;
  ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();
 }

 for(let i=trail.length-1;i>=0;i--){
  let q=trail[i];q.life-=.028;q.r+=2.8;
  if(q.life<=0){trail.splice(i,1);continue}
  ctx.strokeStyle=`hsla(${q.h},100%,72%,${q.life*.45})`;ctx.lineWidth=1+q.life*2;
  ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke();
 }
 for(let i=shock.length-1;i>=0;i--){
  let q=shock[i];q.r+=q.v;q.life-=.018;
  if(q.life<=0){shock.splice(i,1);continue}
  ctx.strokeStyle=`hsla(${q.h},100%,76%,${q.life*.7})`;ctx.lineWidth=1.5+q.life*2;
  ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke();
 }
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(frame);
}

function pos(e){
 const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function interact(e){
 const p=pos(e);
 if(!drag)drag={x:p.x,y:p.y,vx:0,vy:0};
 drag.vx=p.x-drag.x;drag.vy=p.y-drag.y;drag.x=p.x;drag.y=p.y;
 trail.push({x:p.x,y:p.y,r:4,life:1,h:(p.x/W*360+performance.now()/30)%360});
 if(trail.length>90)trail.shift();
 document.getElementById('tip').style.opacity=0;
}
c.addEventListener('pointerdown',e=>{
 c.setPointerCapture?.(e.pointerId);const p=pos(e);
 drag={x:p.x,y:p.y,vx:0,vy:0};
 wells.push({x:p.x,y:p.y,power:.75,kind:e.shiftKey?'black':'swirl'});
 if(wells.length>2)wells.shift();
 interact(e);
});
c.addEventListener('pointermove',e=>{if(drag)interact(e)});
function release(e){
 if(!drag)return;
 const p=pos(e),speed=Math.hypot(drag.vx,drag.vy);
 shock.push({x:p.x,y:p.y,r:8,v:6+speed*.12,life:1,h:(p.x/W*360+performance.now()/20)%360});
 for(const q of pts){
  const d=Math.hypot(q.x-p.x,q.y-p.y),range=Math.min(W,H)*.28;
  if(d<range){let f=(1-d/range)*2.8;q.vx+=drag.vx*f;q.vy+=drag.vy*f;}
 }
 drag=null;wells=[];
}
c.addEventListener('pointerup',release);
c.addEventListener('pointercancel',()=>{drag=null;wells=[]});
document.getElementById('regen').onclick=build;
document.getElementById('mode').onclick=()=>{
 mode=(mode+1)%modes.length;document.getElementById('modeName').textContent=modes[mode];
 shock.push({x:W/2,y:H/2,r:5,v:9,life:1,h:Math.random()*360});burst();
};
c.addEventListener('dblclick',e=>{
 const p=pos(e);wells.push({x:p.x,y:p.y,power:1.5,kind:'black'});
 shock.push({x:p.x,y:p.y,r:5,v:4,life:1,h:280});
 setTimeout(()=>{wells=[]},1800);
});
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script></body></html>
