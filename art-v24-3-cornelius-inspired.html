<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Cosmos — Art Playground</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}canvas{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-family:system-ui,-apple-system,sans-serif}.brand{position:absolute;left:6vw;top:max(6vh,env(safe-area-inset-top));text-shadow:0 2px 20px #000}.brand b{display:block;font-size:clamp(22px,4.2vw,44px);letter-spacing:.08em;font-weight:750}.brand span{font-size:10px;letter-spacing:.32em;opacity:.55}.controls{position:absolute;right:5vw;top:max(5vh,env(safe-area-inset-top));display:flex;gap:9px;pointer-events:auto}.btn{width:48px;height:48px;border-radius:50%;border:1px solid #ffffff28;background:#080b18a8;color:#fff;font-size:20px;backdrop-filter:blur(8px)}.mode{position:absolute;left:50%;bottom:max(5vh,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.24em;opacity:.65;white-space:nowrap;text-align:center}.mode b{display:block;font-size:11px;letter-spacing:.34em;margin-bottom:5px;color:#d9e4ff}.flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .15s}.tip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.28em;opacity:.7;text-align:center;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
\n.audioPanel{position:fixed;left:16px;bottom:16px;width:min(310px,calc(100vw - 32px));padding:16px 18px;border:1px solid #ffffff22;border-radius:18px;background:#070a16e8;backdrop-filter:blur(14px);color:#fff;font-family:system-ui,-apple-system,sans-serif;opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;transition:.2s;z-index:20;box-shadow:0 12px 40px #0008}.audioPanel.show{opacity:1;transform:none;pointer-events:auto}.audioHead{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;opacity:.85}.audioClose{border:0;background:none;color:#fff;font-size:20px;padding:0 2px}.audioRow{display:flex;align-items:center;gap:10px;margin-top:14px}.audioRow input{flex:1}.audioValue{width:42px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;opacity:.7}.audioHint{margin-top:9px;font-size:9px;letter-spacing:.08em;opacity:.35}.audioPanel input[type=range]{accent-color:#fff}
</style></head><body><canvas id="c"></canvas><div class="ui"><div class="brand"><b>PARTICLE COSMOS</b><span>ART PLAYGROUND — v24</span></div><div class="controls"><button class="btn" id="mode" aria-label="mode">✦</button><button class="btn" id="regen" aria-label="regenerate">↻</button></div><div class="tip" id="tip">TOUCH THE UNIVERSE</div><div class="mode"><b id="modeName">BLOOM</b><span>tap ✦ to transform</span></div><div class="flash" id="flash"></div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W,H,D,N,pts=[],t0=performance.now(),mode=0,trail=[],shock=[],drag=null;
let audio=null,master=null,filter=null,ambient=null;
let volume=Number(localStorage.getItem('pc_volume') ?? 68);
let audioEnabled=localStorage.getItem('pc_audio') !== '0';
const modes=['BLOOM','ORBIT','TORNADO','HEART','GALAXY'];
const palettes=[[190,320],[260,40],[280,190],[330,15],[210,290]];

function audioStart(){
 if(audio)return;
 if(!audioEnabled)return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain(); master.gain.value=audioEnabled ? volume/100*.105 : 0;
 filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1800;filter.Q.value=.35;
 filter.connect(master);master.connect(audio.destination);
 const o=audio.createOscillator(),g=audio.createGain();
 o.type='sine';o.frequency.value=110;g.gain.value=.012;o.connect(g);g.connect(filter);o.start();ambient={o,g};
}
function applyVolume(){ if(master) master.gain.setTargetAtTime(audioEnabled ? volume/100*.105 : 0,audio.currentTime,.03); const v=document.getElementById('audioVol'); if(v)v.value=volume; const out=document.getElementById('audioValue'); if(out)out.textContent=Math.round(volume)+'%'; }
function setVolume(v){volume=Math.max(0,Math.min(100,Number(v)));localStorage.setItem('pc_volume',volume);audioEnabled=volume>0;localStorage.setItem('pc_audio',audioEnabled?'1':'0');audioStart();applyVolume();}
function openAudioPanel(){const p=document.getElementById('audioPanel');p.classList.add('show');applyVolume();}
function closeAudioPanel(){document.getElementById('audioPanel').classList.remove('show');}
function chime(freq=660,dur=.32,vol=.035){
 if(!audio)return;
 const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
 o.type='triangle';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(freq*1.32,now+dur);
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
 o.connect(g);g.connect(filter);o.start(now);o.stop(now+dur+.03);
}
function sparkle(x,y,power=1){
 if(!audio)return;
 const now=audio.currentTime;
 [1,1.25,1.5].forEach((m,i)=>{
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=i===0?'triangle':'sine';o.frequency.value=330*m*(.92+Math.random()*.16);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.032*power,now+.008+i*.014);g.gain.exponentialRampToValueAtTime(.0001,now+.28+i*.06);
  o.connect(g);g.connect(filter);o.start(now);o.stop(now+.4);
 });
}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);N=Math.min(4800,Math.max(1800,Math.floor(W*H/230)));build()}
function rand(a=1){return Math.random()*a}
function build(){
 pts=[];for(let i=0;i<N;i++){let a=rand(Math.PI*2),r=Math.pow(Math.random(),.42)*Math.min(W,H)*.52;
 pts.push({a,r,phase:rand(Math.PI*2),speed:.2+rand(1.2),seed:rand(1000),size:.35+rand(1.7),h:rand(360),x:W/2,y:H/2,px:W/2,py:H/2,vx:0,vy:0})}
 trail=[];shock=[];drag=null;burst(); if(audio)chime(520,.45,.025);
}
function burst(){const f=document.getElementById('flash');f.style.opacity=.10;setTimeout(()=>f.style.opacity=0,90)}
function target(p,u){
 let cx=W*.5,cy=H*.52,s=Math.min(W,H),a=p.a+u*.16*p.speed+p.phase*.2,r=p.r;
 if(mode===0){let k=5+Math.sin(u*.22)*2,rr=r*(.78+.22*Math.sin(k*a+u*.7+p.phase));return[cx+Math.cos(a)*rr*1.08,cy+Math.sin(a)*rr*.82]}
 if(mode===1){let rings=2+Math.floor(p.seed%4),rr=p.r*.18+rings*s*.095+Math.sin(u*.8+p.phase)*s*.018;return[cx+Math.cos(a*2.4+u*.45)*rr*1.35,cy+Math.sin(a*2.4+u*.45)*rr*.78]}
 if(mode===2){let y=(p.r/s-.5)*H*1.25,rr=(1-Math.abs(y)/(H*.7))*s*(.10+.22*(p.seed%1)),aa=a*1.8+u*1.4+y/s*9;return[cx+Math.cos(aa)*rr,cy+y+Math.sin(aa*2)*s*.025]}
 if(mode===3){let q=(p.seed%1)*Math.PI*2,rr=p.r/(s*.52)*s*.29,x=16*Math.pow(Math.sin(q),3),y=13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q),scale=s*.018;return[cx+x*scale*(.3+rr/(s*.3)),cy-y*scale*(.3+rr/(s*.3))]}
 let arms=4,aa=a+Math.log(1+r)*.75+u*.18,rr=r*.72;aa+=Math.floor(p.seed*arms)*Math.PI*2/arms;return[cx+Math.cos(aa)*rr*1.25,cy+Math.sin(aa)*rr*.58]
}
function frame(now){
 let u=(now-t0)/1000;ctx.fillStyle='rgb(2,3,10)';ctx.fillRect(0,0,W,H);
 let g=ctx.createRadialGradient(W*.5,H*.52,0,W*.5,H*.52,Math.max(W,H)*.72);g.addColorStop(0,'#0a1030');g.addColorStop(.35,'#070a1a');g.addColorStop(1,'#02030a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const [h1,h2]=palettes[mode];ctx.globalCompositeOperation='lighter';
 for(const p of pts){
  let [tx,ty]=target(p,u);
  if(drag){let dx=drag.x-tx,dy=drag.y-ty,d=Math.hypot(dx,dy)+1,range=Math.min(W,H)*.34;if(d<range){let q=1-d/range;tx+=dx*q*q*1.1-dy*q*.45+drag.vx*q*1.8;ty+=dy*q*q*1.1+dx*q*.45+drag.vy*q*1.8;p.vx+=drag.vx*q*.018;p.vy+=drag.vy*q*.018}}
  p.x+=(tx-p.x)*.055+p.vx;p.y+=(ty-p.y)*.055+p.vy;p.vx*=.91;p.vy*=.91;
  let vel=Math.hypot(p.x-p.px,p.y-p.py);p.px=p.x;p.py=p.y;
  let hue=(h1+(h2-h1)*(p.seed%1)+Math.sin(u*.7+p.phase)*18+360)%360,alpha=.22+Math.min(.7,vel*.22)+p.size*.05,sz=p.size*(.75+Math.min(1.8,vel*.18));
  ctx.fillStyle=`hsla(${hue},100%,${64+Math.min(18,vel*8)}%,${alpha})`;ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill();
 }
 for(let i=trail.length-1;i>=0;i--){let q=trail[i];q.life-=.028;q.r+=2.8;if(q.life<=0){trail.splice(i,1);continue}ctx.strokeStyle=`hsla(${q.h},100%,78%,${q.life*.45})`;ctx.lineWidth=1+q.life*2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke()}
 for(let i=shock.length-1;i>=0;i--){let q=shock[i];q.r+=q.v;q.life-=.018;if(q.life<=0){shock.splice(i,1);continue}ctx.strokeStyle=`hsla(${q.h},100%,80%,${q.life*.7})`;ctx.lineWidth=1.5+q.life*2;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke()}
 if(audio&&ambient){ambient.o.frequency.setTargetAtTime(92+mode*18+(drag?Math.min(55,Math.hypot(drag.vx,drag.vy)*3):0),audio.currentTime,.25)}
 ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)
}
function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function interact(e){
 const p=pos(e);if(!drag)drag={x:p.x,y:p.y,vx:0,vy:0};
 drag.vx=p.x-drag.x;drag.vy=p.y-drag.y;drag.x=p.x;drag.y=p.y;
 trail.push({x:p.x,y:p.y,r:3,life:1,h:(p.x/W*360+performance.now()/35)%360});if(trail.length>90)trail.shift();
 document.getElementById('tip').style.opacity=0;
 if(audio&&Math.random()<.07)chime(360+(p.x/W)*500,.18,.012);
}
c.addEventListener('pointerdown',e=>{audioStart();c.setPointerCapture?.(e.pointerId);const p=pos(e);drag={x:p.x,y:p.y,vx:0,vy:0};interact(e);});
c.addEventListener('pointermove',e=>{if(drag)interact(e)});
c.addEventListener('pointerup',e=>{if(!drag)return;const p=pos(e),v=Math.hypot(drag.vx,drag.vy);shock.push({x:p.x,y:p.y,r:7,v:5+v*.15,life:1,h:(p.x/W*360+performance.now()/25)%360});sparkle(p.x,p.y,Math.min(1.8,.6+v/10));for(const q of pts){const d=Math.hypot(q.x-p.x,q.y-p.y),range=Math.min(W,H)*.3;if(d<range){let f=(1-d/range)*2.5;q.vx+=drag.vx*f;q.vy+=drag.vy*f}}drag=null;});
c.addEventListener('pointercancel',()=>{drag=null});
document.getElementById('regen').onclick=()=>{audioStart();build()};
const audioVol=document.getElementById('audioVol');audioVol.value=volume;audioVol.oninput=e=>setVolume(e.target.value);document.getElementById('audioClose').onclick=closeAudioPanel;let secretTimer=null;const secretZone={x:0,y:0};c.addEventListener('pointerdown',e=>{if(e.clientX<90&&e.clientY>innerHeight-90){clearTimeout(secretTimer);secretTimer=setTimeout(openAudioPanel,1100)}});c.addEventListener('pointerup',()=>clearTimeout(secretTimer));c.addEventListener('pointercancel',()=>clearTimeout(secretTimer));
document.getElementById('mode').onclick=()=>{audioStart();mode=(mode+1)%modes.length;document.getElementById('modeName').textContent=modes[mode];shock.push({x:W/2,y:H/2,r:5,v:8,life:1,h:Math.random()*360});chime(360+mode*100,.55,.035);burst()};
c.addEventListener('dblclick',e=>{audioStart();const p=pos(e);shock.push({x:p.x,y:p.y,r:4,v:3.5,life:1,h:285});chime(130,.8,.045)});
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
})();
</script>\n<div id="audioPanel" class="audioPanel"><div class="audioHead"><span>AUDIO</span><button id="audioClose" class="audioClose">×</button></div><div class="audioRow"><span>VOL</span><input id="audioVol" type="range" min="0" max="100" step="1"><span id="audioValue" class="audioValue"></span></div><div class="audioHint">long-press bottom-left to open</div></div>\n</body></html>
