<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Art Playground — FOLD INTERFERENCE</title><script src="ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* FOLD INTERFERENCE v63 — ChatGPT作。世界のルール: 空間には折り目があり、触ると新しい折り目が生まれる。折り目同士が交差すると、その交点を境に空間の表裏が入れ替わる。 */
const c=document.getElementById('c'),g=c.getContext('2d'),TAU=Math.PI*2;let W=1,H=1,D=1,seed=Math.random()*99,folds=[],st=performance.now();function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function render(t,live){if(live){g.fillStyle='rgba(2,2,7,.16)';g.fillRect(0,0,W,H)}else{g.clearRect(0,0,W,H);g.fillStyle='#020207';g.fillRect(0,0,W,H)}let s=Math.min(W,H),count=folds.length;for(let k=0;k<30;k++){let base=k/29-.5;g.beginPath();for(let j=0;j<=180;j++){let u=j/180-.5,x=W/2+u*s*1.25,y=H/2+base*s*1.25;let sign=1;for(const f of folds){let d=(x-f.x)*Math.cos(f.a)+(y-f.y)*Math.sin(f.a);let q=Math.exp(-Math.abs(d)/(s*.12));y+=Math.sin(d*.025+f.a+t*.8)*q*35;sign*=d<0?-1:1}x+=Math.sin(t*.7+k)*3; y+=Math.sin(t*1.1+u*8+k)*2;if(j)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle=`hsla(${(k*12+seed*40+count*18)%360} 90% 72% / .58)`;g.lineWidth=1.1;g.stroke()}
for(let k=0;k<folds.length;k++){let f=folds[k],len=s*.42;g.beginPath();g.moveTo(f.x-Math.sin(f.a)*len,f.y+Math.cos(f.a)*len);g.lineTo(f.x+Math.sin(f.a)*len,f.y-Math.cos(f.a)*len);g.strokeStyle='rgba(255,255,255,.8)';g.stroke()}}
function frame(){render((performance.now()-st)/1000*TAU/3,true);requestAnimationFrame(frame)}frame();let drag=null;c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,a:Math.atan2(e.clientY-H/2,e.clientX-W/2)}};c.onpointermove=e=>{if(drag){drag.x=e.clientX;drag.y=e.clientY;drag.a+=.015}};c.onpointerup=e=>{if(drag){folds.unshift(drag);folds=folds.slice(0,7);drag=null}};
APKit.init({canvas:c,gifName:'fold-interference-loop',clockFormat:'spec',loopFrame:p=>render(p,false),buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*99},{label:'↻',name:'reset',onClick:()=>folds=[]}]});
</script></body></html>
