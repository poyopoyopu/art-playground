<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ART PLAYGROUND — INFECTION</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block}
  #ui{
    position:fixed;left:14px;top:12px;color:#fff;z-index:2;
    font-size:11px;letter-spacing:.18em;opacity:.72;pointer-events:none;
    text-transform:uppercase
  }
  #hint{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    color:#fff;font-size:11px;letter-spacing:.12em;opacity:.42;
    pointer-events:none;white-space:nowrap
  }
</style>
</head>
<body>
<div id="ui">INFECTION / TOUCH THE LAW</div>
<div id="hint">TAP — CHANGE THE LAW · HOLD — FEED IT</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>
let pts=[];
let scars=[];
let law=0;
let pulse=0;
let seed;

function setup(){
  createCanvas(windowWidth,windowHeight);
  pixelDensity(Math.min(2,window.devicePixelRatio||1));
  seed=floor(random(1e6));
  randomSeed(seed);
  build();
  background(0);
}

function build(){
  pts=[];
  const step=max(5,min(10,width/105));
  for(let x=step/2;x<width;x+=step){
    for(let y=step/2;y<height;y+=step){
      pts.push({
        x,y, ox:x,oy:y,
        phase:random(TWO_PI),
        w:random(.5,1.5)
      });
    }
  }
}

function draw(){
  // very slow memory: the image persists, but never becomes a static picture
  background(0,18);

  pulse*=.94;

  noStroke();
  for(const p of pts){
    let dx=p.x-width*.5, dy=p.y-height*.5;
    let r=sqrt(dx*dx+dy*dy);
    let a=atan2(dy,dx);

    // Base field
    let field =
      sin(r*.018 - frameCount*.008 + p.phase*.25) +
      .55*sin(a*3 + frameCount*.004) +
      .35*sin((dx-dy)*.012);

    let nx=cos(a + field*.55);
    let ny=sin(a + field*.55);

    // The law changes with every touch.
    let local=0;
    for(const s of scars){
      let sx=p.x-s.x, sy=p.y-s.y;
      let d=sqrt(sx*sx+sy*sy);
      if(d<s.radius){
        let q=1-d/s.radius;
        local += q*q;
        const twist=(law%2===0?1:-1)*q*1.8;
        const tx=sx*cos(twist)-sy*sin(twist);
        const ty=sx*sin(twist)+sy*cos(twist);
        p.x=s.x+tx;
        p.y=s.y+ty;
      }
    }

    // Restore toward original position, but slowly.
    p.x += (p.ox-p.x)*.018;
    p.y += (p.oy-p.y)*.018;

    // A coherent "organism" emerges from the field.
    let body = pow(max(0, sin(r*.010 + sin(a*2)*1.8 + frameCount*.012 + law)), 8);
    body += local*1.7;

    let q = .5 + .5*sin(r*.035 - frameCount*.025 + p.phase);
    let size = 1.1 + 2.5*body + 1.7*local;

    let R=55 + 180*q*body;
    let G=40 + 210*(1-q)*body;
    let B=130 + 125*q;

    if(local>.03){
      R=180+75*q; G=35+90*(1-q); B=210;
    }

    fill(R,G,B,110+145*min(1,body+local));
    rect(p.x-size/2,p.y-size/2,size,size);
  }

  // Touch-created scars are not decoration: they rewrite the field.
  for(let i=scars.length-1;i>=0;i--){
    const s=scars[i];
    s.radius += 1.2;
    s.life -= 1;
    noFill();
    stroke(120,80,255,18);
    circle(s.x,s.y,s.radius*2);
    if(s.life<0) scars.splice(i,1);
  }

  // A tiny central heartbeat makes the organism feel alive.
  noStroke();
  fill(255,70);
  circle(width*.5,height*.5,2+pulse*10);
}

function touchLaw(x,y,force=1){
  law++;
  pulse=1;
  scars.push({
    x,y,
    radius:22+force*16,
    life:90+force*50
  });
  if(scars.length>7) scars.shift();
}

function mousePressed(){
  touchLaw(mouseX,mouseY,1);
  return false;
}
function mouseDragged(){
  // Holding does not simply paint; it continuously feeds the infection.
  if(frameCount%3===0) touchLaw(mouseX,mouseY,.55);
  return false;
}
function touchStarted(){
  if(touches.length) touchLaw(touches[0].x,touches[0].y,1);
  return false;
}
function touchMoved(){
  if(touches.length && frameCount%3===0)
    touchLaw(touches[0].x,touches[0].y,.55);
  return false;
}
function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  build();
  background(0);
}
</script>
</body>
</html>
