<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Prototype — Organic Mandala Mural</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07050c}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#f5f3ff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#title{position:absolute;left:5vw;top:max(5vh,36px);text-shadow:0 3px 20px #000}
#title b{display:block;font-size:clamp(20px,5vw,30px);letter-spacing:.02em;opacity:.9}
#title span{display:block;margin-top:5px;font-size:10px;letter-spacing:.28em;opacity:.5}
#loading{position:fixed;inset:0;background:#07050c;color:#9d92c9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
font-family:-apple-system,sans-serif;font-size:13px;letter-spacing:.1em;z-index:10}
#spinner{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff22;border-top-color:#c9a2ff;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div id="spinner"></div><div>壁画を織っています…</div></div>
<canvas id="c"></canvas>
<div id="ui"><div id="title"><b>Organic Mandala Mural</b><span>PROTOTYPE v2 — 一部分だけ生きている</span></div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
const loadingEl=document.getElementById('loading');
const TAU=Math.PI*2;
let W,H,D,base,bctx,cells=[],living=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

// 不穏・毒々しいパレット群(濁った混ざり方を狙う)
const paletteGroups=[
  ['#7a0b1e','#b3411a','#c9a227'],   // 血と腐敗
  ['#3a0b4d','#7a1f6b','#9fc94a'],   // 打撲紫〜酸っぱい緑
  ['#0e3b2e','#1f8f5c','#c7d92a'],   // 苔〜毒黄緑
  ['#4a0f3a','#c22a6b','#e8c23a'],   // 爛れたピンク〜黄
  ['#1a2b4a','#2f7a8c','#8fd6c9']    // 溺れた青緑
];

function setup(){
  D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);
  base=document.createElement('canvas');
  base.width=W*D;base.height=H*D;
  bctx=base.getContext('2d');bctx.setTransform(D,0,0,D,0,0);
  loadingEl.style.display='flex';
  setTimeout(build, 30);
}

// ---- 円充填(かなり密に重ねる) ----
function place(radius,maxTry){
  for(let t=0;t<maxTry;t++){
    const x=rnd(-radius*.3,W+radius*.3), y=rnd(-radius*.3,H+radius*.3);
    let ok=true;
    for(const cell of cells){
      const d=Math.hypot(cell.x-x,cell.y-y);
      if(d < (cell.r+radius)*0.60){ ok=false; break; }
    }
    if(ok) return {x,y};
  }
  return null;
}

function buildCells(){
  cells=[];
  const area=W*H;
  const buckets=[
    {r:[70,125], n:Math.max(4, Math.floor(area/62000))},
    {r:[36,66],  n:Math.max(10, Math.floor(area/24000))},
    {r:[18,34],  n:Math.max(16, Math.floor(area/10500))},
    {r:[8,17],   n:Math.max(26, Math.floor(area/5200))}
  ];
  for(const bk of buckets){
    for(let i=0;i<bk.n;i++){
      const r=rnd(bk.r[0],bk.r[1]);
      const pos=place(r,26);
      if(!pos) continue;
      cells.push(makeCell(pos.x,pos.y,r));
    }
  }
  for(let pass=0; pass<4; pass++){
    for(let i=0;i<260;i++){
      const x=rnd(0,W), y=rnd(0,H);
      let covered=false;
      for(const cell of cells){
        if(Math.hypot(cell.x-x,cell.y-y) < cell.r*0.85){ covered=true; break; }
      }
      if(!covered){
        cells.push(makeCell(x,y,rnd(6,13)));
      }
    }
  }
}

function makeCell(x,y,r){
  const extraEyes=[];
  if(r>45){
    const n=Math.floor(rnd(1,4));
    for(let i=0;i<n;i++){
      extraEyes.push({
        a:rnd(0,TAU), d:rnd(0.3,0.85),
        size:rnd(0.10,0.22),
        lookA:rnd(0,TAU)
      });
    }
  }
  return {
    x,y,r,
    seed:rnd(0,TAU),
    rot:rnd(0,TAU),
    petals:5+Math.floor(rnd(0,6)),
    petalVar:rnd(0.55,1.0),
    palette:pick(paletteGroups),
    type: r>55 ? 'flower' : (r>26 ? (Math.random()<0.5?'flower':'eye') : (Math.random()<0.4?'eye':'leaf')),
    phase:rnd(0,TAU),
    breatheRate:rnd(0.00028,0.00075),
    extraEyes,
    living:false
  };
}

// ---- 目(スリット瞳孔・血走った白目) ----
function drawEyeShape(g,R,lookAngle,pupilColorA,pupilColorB,scleraShade){
  g.save();
  const grad=g.createRadialGradient(0,0,R*0.05,0,0,R);
  grad.addColorStop(0,scleraShade[0]);
  grad.addColorStop(0.7,scleraShade[1]);
  grad.addColorStop(1,'rgba(5,3,6,0.9)');
  g.fillStyle=grad;
  g.strokeStyle='rgba(5,3,6,0.95)';
  g.lineWidth=Math.max(0.8,R*0.09);
  g.beginPath(); g.arc(0,0,R,0,TAU); g.fill(); g.stroke();

  // 血管
  g.strokeStyle='rgba(180,20,30,0.55)';
  g.lineWidth=Math.max(0.4,R*0.03);
  for(let i=0;i<3;i++){
    const a=rnd(0,TAU);
    g.beginPath();
    g.moveTo(Math.cos(a)*R*0.15,Math.sin(a)*R*0.15);
    g.quadraticCurveTo(Math.cos(a+0.3)*R*0.6,Math.sin(a+0.3)*R*0.6,Math.cos(a+0.1)*R*0.92,Math.sin(a+0.1)*R*0.92);
    g.stroke();
  }

  // スリット瞳孔(向きランダム)
  const px=Math.cos(lookAngle)*R*0.18, py=Math.sin(lookAngle)*R*0.18;
  g.translate(px,py);
  g.rotate(lookAngle+Math.PI/2);
  const irisGrad=g.createLinearGradient(0,-R*0.42,0,R*0.42);
  irisGrad.addColorStop(0,pupilColorA); irisGrad.addColorStop(1,pupilColorB);
  g.fillStyle=irisGrad;
  g.beginPath(); g.ellipse(0,0,R*0.30,R*0.42,0,0,TAU); g.fill();
  g.fillStyle='rgba(4,2,4,0.98)';
  g.beginPath(); g.ellipse(0,0,R*0.09,R*0.40,0,0,TAU); g.fill();
  g.restore();
}

function drawFlower(g,cell,scale,petalFlex,hueShift){
  const {r,seed,palette,extraEyes}=cell;
  const R=r*scale;
  g.save();
  g.translate(cell.x,cell.y);
  g.rotate(cell.rot+hueShift*0.0006);

  const n=cell.petals;
  for(let i=0;i<n;i++){
    const a=i*TAU/n + Math.sin(seed*7+i)*0.12;
    const flex=cell.petalVar+Math.sin(petalFlex+i*1.7+seed)*0.14;
    const lenJit=1+Math.sin(seed*13+i*3.3)*0.28;
    const len=R*0.95*flex*lenJit;
    const wJit=1+Math.cos(seed*9+i*2.1)*0.35;
    const w=R*0.36*wJit;
    g.save();
    g.rotate(a);
    const grad=g.createLinearGradient(0,0,len,0);
    grad.addColorStop(0,palette[0]);
    grad.addColorStop(0.5,palette[1]);
    grad.addColorStop(1,palette[2]);
    g.fillStyle=grad;
    g.strokeStyle='rgba(4,2,5,0.92)';
    g.lineWidth=Math.max(1.0,R*0.045);
    // 不揃いな輪郭(左右非対称)
    const bulge1=1+Math.sin(seed*5+i)*0.3;
    const bulge2=1+Math.cos(seed*11+i)*0.3;
    g.beginPath();
    g.moveTo(0,0);
    g.bezierCurveTo(len*0.18,-w*bulge1,len*0.78,-w*0.6*bulge2,len,0);
    g.bezierCurveTo(len*0.75,w*0.65*bulge1,len*0.22,w*bulge2,0,0);
    g.closePath();
    g.fill(); g.stroke();
    // 血管状の内部ライン(分岐)
    g.strokeStyle='rgba(10,5,8,0.5)';
    g.lineWidth=Math.max(0.4,R*0.015);
    g.beginPath();
    g.moveTo(len*0.12,0);
    g.quadraticCurveTo(len*0.4,-w*0.2,len*0.62,0);
    g.stroke();
    g.beginPath();
    g.moveTo(len*0.35,-w*0.05);
    g.lineTo(len*0.5,-w*0.35);
    g.stroke();
    g.beginPath();
    g.moveTo(len*0.35,w*0.05);
    g.lineTo(len*0.5,w*0.32);
    g.stroke();
    g.restore();
  }

  // 追加の小さい目(花びらの上に不気味に点在)
  for(const e of extraEyes){
    const ex=Math.cos(e.a)*R*e.d, ey=Math.sin(e.a)*R*e.d;
    g.save();
    g.translate(ex,ey);
    drawEyeShape(g,R*e.size,e.lookA,palette[0],palette[2],['#d8cf8a','#8a6a3a']);
    g.restore();
  }

  // 中心の大きな目
  const eyeR=R*0.30;
  drawEyeShape(g,eyeR,cell.seed*3,palette[1],palette[2],['#e6d9a0','#5a3a2a']);

  g.restore();
}

function drawEye(g,cell,scale,pulse){
  const {r,palette,rot}=cell;
  const R=r*scale;
  g.save();
  g.translate(cell.x,cell.y);
  g.rotate(rot);
  g.beginPath();
  g.moveTo(-R,0);
  g.quadraticCurveTo(-R*0.2,-R*0.85,R,0);
  g.quadraticCurveTo(-R*0.2,R*0.62,-R,0);
  g.closePath();
  const grad=g.createLinearGradient(-R,0,R,0);
  grad.addColorStop(0,palette[2]); grad.addColorStop(0.5,palette[1]); grad.addColorStop(1,palette[0]);
  g.fillStyle=grad;
  g.strokeStyle='rgba(4,2,5,0.92)';
  g.lineWidth=Math.max(1.1,R*0.08);
  g.fill(); g.stroke();

  drawEyeShape(g,R*(0.5+pulse*0.06),rot*2,palette[0],palette[2],['#d8cf8a','#6a4a2a']);
  g.restore();
}

function drawLeaf(g,cell,scale){
  const {r,palette,rot,seed}=cell;
  const R=r*scale;
  g.save();
  g.translate(cell.x,cell.y);
  g.rotate(rot);
  g.beginPath();
  g.moveTo(0,-R);
  g.quadraticCurveTo(R*0.95*(1+Math.sin(seed)*0.2),0,0,R);
  g.quadraticCurveTo(-R*0.7*(1+Math.cos(seed)*0.2),0,0,-R);
  g.closePath();
  const grad=g.createLinearGradient(0,-R,0,R);
  grad.addColorStop(0,palette[0]); grad.addColorStop(1,palette[1]);
  g.fillStyle=grad;
  g.strokeStyle='rgba(4,2,5,0.9)';
  g.lineWidth=Math.max(1,R*0.09);
  g.fill(); g.stroke();
  g.strokeStyle='rgba(10,5,8,0.4)';
  g.lineWidth=Math.max(0.5,R*0.03);
  g.beginPath(); g.moveTo(0,-R*0.7); g.quadraticCurveTo(R*0.15,0,0,R*0.7); g.stroke();
  g.restore();
}

function drawCell(g,cell,t){
  if(cell.type==='flower') drawFlower(g,cell,cell._scale||1, t*0.0016+cell.phase, t);
  else if(cell.type==='eye') drawEye(g,cell,cell._scale||1, 0.5+0.5*Math.sin(t*0.0012+cell.phase));
  else drawLeaf(g,cell,cell._scale||1);
}

function build(){
  loadingEl.style.display='flex';
  const bg=bctx.createRadialGradient(W*0.5,H*0.46,0,W*0.5,H*0.46,Math.max(W,H)*0.85);
  bg.addColorStop(0,'#160b12'); bg.addColorStop(0.55,'#0c0710'); bg.addColorStop(1,'#050308');
  bctx.fillStyle=bg; bctx.fillRect(0,0,W,H);

  buildCells();

  living=[];
  const sorted=[...cells].sort((a,b)=>b.r-a.r);
  const livingCount=Math.max(8, Math.floor(cells.length*0.05));
  for(let i=0;i<sorted.length && living.length<livingCount;i++){
    if(sorted[i].r>16 && Math.random()<0.35){
      sorted[i].living=true;
      living.push(sorted[i]);
    }
  }

  for(const cell of cells){
    if(cell.living) continue;
    drawCell(bctx,cell,0);
  }

  loadingEl.style.display='none';
}

function draw(t){
  ctx.drawImage(base,0,0,W,H);
  for(const cell of living){
    const breathe=1+Math.sin(t*cell.breatheRate+cell.phase)*0.085;
    cell._scale=breathe;
    drawCell(ctx,cell,t);
  }
  requestAnimationFrame(draw);
}

addEventListener('resize',setup,{passive:true});
setup();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
