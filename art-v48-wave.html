<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wave">
<title>Art Playground — WAVE</title>
<script src="ap-kit.js"></script>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909}
  body{touch-action:none;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0}
  #hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);
    transform:translateX(-50%);color:#fff;font-size:10px;letter-spacing:.3em;opacity:.32;
    pointer-events:none;white-space:nowrap;text-shadow:0 1px 8px #000;transition:opacity 1.2s;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="hint">TOUCH TO BEND THE WAVE</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>
let t=0;
let P=null;              // wave parameters, re-rolled by ✦
let pulls=[];            // where the viewer has bent the wave
const TAU=Math.PI*2;

function makeParams(){
  return {
    ripple : 7 + Math.random()*5,        // cos frequency along the strand
    swell  : 55 + Math.random()*55,      // how far the body breathes
    girth  : 60 + Math.random()*70,
    lift   : 30 + Math.random()*38,      // vertical throw
    beat   : 6 + Math.floor(Math.random()*8), // secondary pulse — whole number so the loop can close
    hue    : Math.random()*360,
    hue2   : Math.random()*360,
    sat    : 0.0 + Math.random()*0.55,   // sometimes pure white, sometimes tinted
    fade   : 12 + Math.random()*16,      // how long the afterimage lingers
    count  : 9000,
    tilt   : (Math.random()-0.5)*0.5
  };
}

function setup(){
  createCanvas(windowWidth,windowHeight);
  pixelDensity(Math.min(2,window.devicePixelRatio||1));
  P=makeParams();
  background(9);
  strokeWeight(1);
  noFill();

  APKit.init({
    canvas:document.querySelector('canvas'),
    gifName:'wave-loop',
    clockFormat:'spec',      // YYYY MM DD DDD
    clockPos:'top',
    dock:true,               // one capsule instead of loose circles
    autoHide:true,           // tools appear on touch, then withdraw
    fullscreenButton:false,  // the browser and home-screen app own fullscreen
    loopFrame:function(phase){renderScene(phase)},
    buttons:[
      {label:'\u2726',name:'random',onClick:function(){
        P=makeParams();pulls=[];background(9);
      }},
      {label:'\u21bb',name:'reset',onClick:function(){pulls=[];background(9)}}
    ]
  });
  setTimeout(function(){var h=document.getElementById('hint');if(h)h.style.opacity='0'},8000);
}

/* The strand is written in a 400x400 design space. Rather than letterboxing it
   into a square, it is scaled to cover the whole screen and centred, so the
   canvas genuinely fills the display on any aspect ratio. */
function coverScale(){ return Math.max(width,height)/400*1.12; }

function wave(y,tt){
  const k = 5*Math.cos(y*P.ripple);
  const d = Math.abs(k);
  const e = y-35;
  const c = d/3-tt;

  let x =
    (P.girth + k*k + d*4)*Math.sin(c) +
    200 +
    P.swell*Math.sin(c/2) +
    7/d*Math.sin(k*2) +
    y;

  let yy =
    P.lift*k*e +
    d*3*Math.sin(tt*P.beat - d*2 + Math.sin(tt)/0.216) +
    200;

  // a touch bends the strand near it and keeps bending it
  for(let i=0;i<pulls.length;i++){
    const g=pulls[i];
    const dx=x-g.x, dy=yy-g.y;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    if(dist<g.r){
      const q=1-dist/g.r;
      const a=Math.atan2(dy,dx)+q*q*g.turn;
      const rr=dist*(1-q*q*0.45);
      x=g.x+Math.cos(a)*rr;
      yy=g.y+Math.sin(a)*rr;
    }
  }
  point(x,yy);
}

function renderScene(ph){
  const live=(ph===null||ph===undefined);
  /* The strand carries a half-frequency term, sin(c/2), so it only comes back
     to itself after t advances by TWO turns — hence ph*2. With `beat` kept a
     whole number, every other term completes a whole count of cycles in that
     span and the loop closes exactly, with nothing to quantise. */
  const tt = live ? t : ph*2;

  background(9,P.fade);
  push();
  translate(width/2,height/2);
  const s=coverScale();
  scale(s);
  rotate(P.tilt);
  translate(-200,-200);
  strokeWeight(1/s);

  const c1=hsv(P.hue,P.sat,1), c2=hsv(P.hue2,P.sat*0.8,1);
  stroke(c1[0],c1[1],c1[2],70);
  for(let i=P.count;i>0;i--) wave(i/254,tt);

  // a second, slightly offset pass gives the strand its afterimage
  stroke(c2[0],c2[1],c2[2],35);
  for(let j=0;j<2;j++){
    for(let i=P.count;i>0;i-=2) wave((i/254)+(j*.004),tt);
  }
  pop();

  if(live) t += Math.PI/240;
}

function hsv(h,s,v){
  h=((h%360)+360)%360/60;
  const i=Math.floor(h),f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0:r=v;g=u;b=p;break; case 1:r=q;g=v;b=p;break; case 2:r=p;g=v;b=u;break;
    case 3:r=p;g=q;b=v;break; case 4:r=u;g=p;b=v;break; default:r=v;g=p;b=q;
  }
  return [r*255,g*255,b*255];
}

function draw(){
  if(window.APKit && APKit.isExporting())return;
  renderScene(null);
}
function mouseReleased(){onDock=false}

// map a screen tap into the strand's own 400x400 space
function toDesign(sx,sy){
  const s=coverScale();
  let x=(sx-width/2)/s, y=(sy-height/2)/s;
  const c=Math.cos(-P.tilt), sn=Math.sin(-P.tilt);
  return [x*c-y*sn+200, x*sn+y*c+200];
}
function bend(sx,sy){
  const d=toDesign(sx,sy);
  pulls.push({x:d[0],y:d[1],r:40+Math.random()*55,turn:(Math.random()-.5)*3.2});
  if(pulls.length>6)pulls.shift();
  const h=document.getElementById('hint');
  if(h)h.style.opacity='0';
}
// taps on any kit surface — dock, export sheet, toast — belong to the UI,
// not to the wave
function onUI(x,y){ return window.APKit ? APKit.isUI(x,y) : false }
/* Returning false from a p5 handler calls preventDefault. Doing that on every
   touch also swallowed the taps meant for the dock, so the buttons never fired.
   Now a touch that lands on the controls is handed straight back to the DOM. */
let onDock=false;
function mousePressed(){
  if(onUI(mouseX,mouseY))return true;
  bend(mouseX,mouseY);
  return false;
}
function touchStarted(){
  if(!touches.length)return true;
  onDock=onUI(touches[0].x,touches[0].y);
  if(onDock)return true;
  bend(touches[0].x,touches[0].y);
  return false;
}
function touchMoved(){
  if(onDock)return true;
  if(touches.length&&frameCount%6===0)bend(touches[0].x,touches[0].y);
  return false;
}
function touchEnded(){
  if(onDock){onDock=false;return true}
  return false;
}
function windowResized(){
  resizeCanvas(windowWidth,windowHeight);
  background(9);
}
</script>
</body>
</html>
