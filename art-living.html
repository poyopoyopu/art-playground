<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Playground — Living Tapestry</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#f4f1ff;font-family:system-ui,-apple-system,sans-serif}
.label{position:absolute;left:7vw;top:7vh;letter-spacing:.32em;font-size:11px;opacity:.62;text-shadow:0 2px 12px #000}
button{pointer-events:auto;position:absolute;right:7vw;top:6vh;width:66px;height:66px;border-radius:50%;border:1px solid #ffffff24;background:#0c0d18c9;color:#fff;font-size:30px}
.hint{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);font-size:11px;letter-spacing:.18em;opacity:.42;white-space:nowrap}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui"><div class="label">LIVING TAPESTRY</div><button id="regen">↻</button><div class="hint">触れると、そこだけ世界がほどける</div></div>
<script>
(()=>{
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,D,seed=1,threads=[],motifs=[],ripples=[],last=0;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function rr(a,b){return a+(b-a)*rand()}
function hsl(h,s,l,a=1){return 'hsla('+h+','+s+'%,'+l+'%,'+a+')'}
function make(){
 seed=(Math.random()*4294967295)>>>0;threads=[];motifs=[];ripples=[];
 const scale=Math.min(W,H), step=Math.max(34,scale/18), palette=[178,196,214,262,292,318,24,48,82,126];
 for(let y=-step;y<H+step;y+=step*.72)for(let x=-step;x<W+step;x+=step*.70){
  if(rand()<.18)continue;const px=x+rr(-step*.24,step*.24),py=y+rr(-step*.22,step*.22),h=palette[(rand()*palette.length)|0];
  threads.push({x:px,y:py,h,phase:rr(0,Math.PI*2),len:rr(step*.9,step*2.5),w:rr(1.2,3.6),live:rand()<.16,drift:rr(.3,1.2),kind:rand()<.62?0:1});
 }
 const count=Math.round(Math.max(22,scale/22));
 for(let i=0;i<count;i++)motifs.push({x:rr(-40,W+40),y:rr(-40,H+40),r:rr(scale*.035,scale*.11),h:palette[(rand()*palette.length)|0],n:5+((rand()*5)|0),p:rr(0,6.28),live:rand()<.28});
}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);make()}
function field(x,y,t){return Math.sin(x*.012+y*.008+t*.00008)*.65+Math.sin(y*.017-x*.009-t*.00005)*.35+Math.sin((x+y)*.006)*.25}
function curve(th,t,boost){
 const a=field(th.x,th.y,t)*1.2+Math.sin(th.phase+t*.00018)*.5,dx=Math.cos(a),dy=Math.sin(a),sway=Math.sin(t*.0007*th.drift+th.phase)*th.len*.16*(th.live?1.8:.35)*(1+boost*2);
 ctx.beginPath();ctx.moveTo(th.x-dx*th.len*.48,th.y-dy*th.len*.48);ctx.quadraticCurveTo(th.x-dy*sway,th.y+dx*sway,th.x+dx*th.len*.52,th.y+dy*th.len*.52);
 ctx.strokeStyle=hsl(th.h,72,62,th.kind?.72:.48+boost*.35);ctx.lineWidth=th.w*(1+boost*.8);ctx.stroke();
 if(th.kind)for(let k=0;k<4;k++){const q=(k+.5)/4,px=th.x+dx*th.len*(q-.48)-dy*Math.sin(q*Math.PI)*sway*.45,py=th.y+dy*th.len*(q-.48)+dx*Math.sin(q*Math.PI)*sway*.45,pulse=th.live?Math.sin(t*.0015+th.phase+k)*.5+.5:.3;ctx.beginPath();ctx.arc(px,py,th.w*(1.2+pulse*1.8+boost*2),0,6.283);ctx.fillStyle=hsl(th.h+22,88,68,.7+boost*.25);ctx.fill()}
}
function island(m,t,boost){
 const live=m.live||boost>.02,wob=live?Math.sin(t*.0011+m.p)*.12*(1+boost*2):.025;ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.p+Math.sin(t*.00012+m.p)*.025);
 for(let ring=0;ring<3;ring++){const n=m.n+ring*2,rad=m.r*(1-ring*.22);ctx.beginPath();for(let i=0;i<=n;i++){const a=i/n*6.283,v=rad*(.58+.18*Math.sin(i*2.4+m.p)+wob*Math.sin(t*.0016+i*1.7+m.p)),xx=Math.cos(a)*v,yy=Math.sin(a)*v;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();ctx.strokeStyle=hsl(m.h+ring*19,82-ring*8,62+ring*5,.76);ctx.lineWidth=Math.max(1.1,m.r*.045);ctx.stroke()}
 ctx.beginPath();ctx.arc(0,0,m.r*.19*(1+wob),0,6.283);ctx.fillStyle=hsl(m.h+55,90,68,.85);ctx.fill();ctx.beginPath();ctx.arc(m.r*.07*Math.cos(t*.0008+m.p),m.r*.07*Math.sin(t*.0008+m.p),m.r*.07,0,6.283);ctx.fillStyle='#090611';ctx.fill();ctx.restore();
}
function boostAt(o){let b=0;for(const r of ripples){const d=Math.hypot(o.x-r.x,o.y-r.y),edge=Math.abs(d-r.r);if(edge<90)b=Math.max(b,(1-edge/90)*r.life)}return b}
function draw(t){
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#070610');g.addColorStop(.5,'#030409');g.addColorStop(1,'#0b0610');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
 for(const th of threads)curve(th,t,boostAt(th));for(const m of motifs)island(m,t,boostAt(m));
 for(let i=0;i<threads.length;i+=5){const q=threads[i],b=boostAt(q);if(b>.04||q.live){const z=(Math.sin(t*.0014+q.phase)*.5+.5);ctx.beginPath();ctx.arc(q.x+Math.cos(q.phase+t*.0004)*q.len*.18,q.y+Math.sin(q.phase+t*.0004)*q.len*.18,1.2+z*2.2+b*3,0,6.283);ctx.fillStyle=hsl(q.h+70,90,75,.25+z*.38+b*.35);ctx.fill()}}
 ctx.globalCompositeOperation='source-over';
 for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=5+r.life*12;r.life-=.018;if(r.life<=0){ripples.splice(i,1);continue}ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.strokeStyle=hsl(r.h,90,72,r.life*.34);ctx.lineWidth=1+r.life*2;ctx.stroke()}requestAnimationFrame(draw)
}
function wake(e){const rect=c.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(performance.now()-last<45)return;last=performance.now();ripples.push({x,y,r:4,life:1,h:rr(0,360)});if(ripples.length>8)ripples.shift()}
c.addEventListener('pointerdown',wake);c.addEventListener('pointermove',e=>{if(e.buttons)wake(e)});document.getElementById('regen').onclick=make;addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script></body></html>
