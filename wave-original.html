<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAVE / p5.js generative sketch</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909}
  body{display:grid;place-items:center;touch-action:none}
  canvas{display:block;image-rendering:auto}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
<script>
let t=0;

function setup(){
  createCanvas(400,400);
  background(9);
  stroke(255,255,255,66);
  strokeWeight(1);
}

function draw(){
  // 元作品の重要な特徴：
  // background() は毎フレーム消さず、10,000点の軌跡を蓄積する。
  t += PI/240;

  for(let i=1e4; i>0; i--){
    const y = i/254;

    const k = 5*cos(y*9);
    const d = mag(k, y-35)/2.5;
    const e = y-35;
    const c = d/3-t;

    const x =
      (79+k*k+d*4)*sin(c) +
      200;

    const yy =
      89*sin(c/2) +
      7/d*sin(k*2) +
      y/44*k*e +
      d*3*sin(t*9-d*2+sin(t)/0.6**3) +
      200;

    point(x,yy);
  }
}

function mousePressed(){
  // 触ると少しだけ新しい軌跡を発生させる
  t += 0.35;
}

function touchStarted(){
  t += 0.35;
  return false;
}
</script>
</body>
</html>
