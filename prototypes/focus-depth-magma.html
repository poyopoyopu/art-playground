<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH MAGMA</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100402}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: attention heats structure; deeper levels change color. TOUCH DRILLS a hot well. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,last=performance.now(),f={x:0,y:0,p:.4},marks=[];
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!f.x){f.x=W/2;f.y=H/2}}addEventListener('resize',rs);rs();function reset(){f={x:W*.5,y:H*.5,p:.32};marks=[]}reset();
function A(x,y){let v=f.p*Math.exp(-Math.hypot(x-f.x,y-f.y)/(Math.min(W,H)*.29));for(let m of marks)v+=m.p*Math.exp(-Math.hypot(x-m.x,y-m.y)/(Math.min(W,H)*.17));return v}
function cell(x,y,s,d){let a=A(x+s/2,y+s/2),th=.20+d*.10;if(d<11&&a>th&&s>2.5){let q=s/2;cell(x,y,q,d+1);cell(x+q,y,q,d+1);cell(x,y+q,q,d+1);cell(x+q,y+q,q,d+1);return}let h=(8+d*13+(x/W)*45+(y/H)*80)%360,l=44+a*28;g.fillStyle=`hsla(${h},92%,${l}%,${.05+a*.23})`;g.fillRect(x,y,s-.5,s-.5);g.strokeStyle=`hsla(${h+42},100%,${72+a*16}%,${.10+a*.42})`;g.lineWidth=.5;g.strokeRect(x+.25,y+.25,s-.5,s-.5)}
function draw(t,dt){f.p=.26+.40*(.5+.5*Math.sin(t*.00034));for(let m of marks)m.p*=Math.pow(.15,dt);marks=marks.filter(m=>m.p>.025);g.fillStyle='#100402';g.fillRect(0,0,W,H);cell(0,0,W,0);g.beginPath();g.arc(f.x,f.y,4+f.p*7,0,TAU);g.strokeStyle='rgba(255,210,80,.65)';g.stroke()}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
let down=false;c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;f.x=e.clientX;f.y=e.clientY;f.p=1});c.addEventListener('pointermove',e=>{if(down){f.x=e.clientX;f.y=e.clientY;f.p=Math.min(1,f.p+.02)}});c.addEventListener('pointerup',()=>{down=false;marks.push({x:f.x,y:f.y,p:f.p});if(marks.length>14)marks.shift()});c.addEventListener('pointercancel',()=>down=false);
APKit.init({canvas:c,gifName:'focus-depth-magma-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{f={x:W*(.5+.33*Math.cos(p*2)),y:H*(.5+.32*Math.sin(p*3)),p:.3+.6*(.5+.5*Math.sin(p*2)**2)};g.fillStyle='#100402';g.fillRect(0,0,W,H);cell(0,0,W,0)},buttons:[{label:'✦',name:'mutate',onClick:()=>{f.p=.25+Math.random()*.72}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
