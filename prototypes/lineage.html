<!doctype html>
<!-- BLOODLINE — ChatGPT作。輪に触れると、その輪の形が次の世代の法則になる。ap-kit.js統合: ChatGPT -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BLOODLINE — 触れた輪が次の血筋になる</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom,0px));text-align:center;font:500 12px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.18em;color:rgba(255,220,180,.65);pointer-events:none;transition:opacity 1.5s;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">輪に触れる<br>その輪が、次の血筋になる</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('c'),hint=document.getElementById('hint');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.body.textContent='WebGL2 required';return}

const MAX=14,TAU=Math.PI*2;
const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.,1.);}
`;

const FS=`#version 300 es
precision highp float;
#define MAX ${MAX}
uniform vec2 uRes,uCenter;
uniform float uUnit,uTime,uFlash,uTeeth,uPulse,uSeed;
uniform int uN;
uniform vec4 uRing[MAX];
out vec4 outColor;

float hash(float x){return fract(sin(x*127.1)*43758.5453);}
float fang(float a,float n,float sharp){
  float cell=6.2831853/n;
  float x=abs(mod(a+cell*.5,cell)-cell*.5)/(cell*.5);
  return pow(max(0.,1.-x),sharp);
}
float ring(float r,float a,float rad,float thick,float teeth,float phase,float age){
  float f=fang(a+phase,teeth,3.2);
  float tooth=rad+f*(.035+.07*smoothstep(.1,.9,rad));
  float d=r-tooth;
  float core=exp(-d*d/(thick*thick));
  float halo=exp(-d*d/(thick*thick*9.));
  float inner=exp(-d*d/(thick*thick*.18));
  return core*1.25+halo*.38+inner*.9*smoothstep(.04,.55,age);
}
void main(){
  vec2 p=(vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)-uCenter)/uUnit;
  float r=length(p),a=atan(p.y,p.x);
  vec3 col=vec3(.0015,.0004,.0002);

  float eye=.105;
  float eyeCore=exp(-r*r/(eye*eye*.55));
  float eyeRim=exp(-pow((r-eye)/(eye*.13),2.));
  col+=vec3(1.,.48,.12)*eyeRim*1.4;
  col+=vec3(1.,.96,.78)*eyeCore*1.8;
  col+=vec3(1.,.22,.025)*exp(-r*r/(eye*eye*7.))*.65*(1.+uPulse);

  for(int i=0;i<MAX;i++){
    if(i>=uN)break;
    vec4 q=uRing[i];
    float rad=q.x,alpha=q.y,flash=q.z,age=q.w;
    float ph=float(i)*.11+uSeed*.7+uTime*.035*(1.-age*.4);
    float I=ring(r,a,rad,.0085+rad*.006,uTeeth,ph,age);
    float heat=smoothstep(.12,1.,rad);
    vec3 hot=mix(vec3(1.,.12,.015),vec3(1.,.55,.08),heat);
    vec3 white=vec3(1.,.93,.72);
    col+=hot*I*alpha;
    col+=white*I*I*(.75+flash*2.2);
    col+=vec3(.55,.07,.015)*I*.32;
  }

  float outer=exp(-pow((r-1.12)/.035,2.));
  col+=vec3(.22,.025,.008)*outer*(.25+.25*sin(uTime*1.7+uSeed));
  col=col/(1.+col*.08);
  col+=vec3((hash(gl_FragCoord.x+gl_FragCoord.y+uTime)-.5)*.006);
  outColor=vec4(col,1.);
}`;

function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

gl.bindVertexArray(gl.createVertexArray());
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U={};
['uRes','uCenter','uUnit','uTime','uFlash','uTeeth','uPulse','uSeed','uN','uRing'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
const rings=new Float32Array(MAX*4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function genome(){return{teeth:randInt(7,18),seed:Math.random()*99,rate:.72+Math.random()*.18,thick:.85+Math.random()*.35}}
const FIRST={teeth:11,seed:2.7,rate:.82,thick:1};
let parent=Object.assign({},FIRST),items=[],birth=0,time=0,flash=0,pulse=0;
let W=0,H=0,unit=1,cx=0,cy=0,maxR=1.7,lastTouch=-99,hinted=false;

function resize(){
  W=innerWidth;H=innerHeight;
  const d=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);
  gl.viewport(0,0,canvas.width,canvas.height);
  unit=Math.min(W,H)*.5;cx=W*.5;cy=H*.49;
  maxR=Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy))/unit+.12;
}
addEventListener('resize',resize);
function spawn(g){items.push({g:Object.assign({},g),age:0,alpha:0,flash:0,hold:0});if(items.length>MAX)items.shift();pulse=1}
function mutate(g){
  const n=Object.assign({},g);
  if(Math.random()<.72)n.teeth=clamp(g.teeth+randInt(-2,2),5,22);
  if(Math.random()<.35)n.teeth=clamp(n.teeth+(Math.random()<.5?-3:3),5,22);
  n.seed=g.seed+(Math.random()-.5)*1.8;
  n.rate=clamp(g.rate+(Math.random()-.5)*.08,.62,.92);
  n.thick=clamp(g.thick+(Math.random()-.5)*.18,.7,1.35);
  return n;
}
function radius(age){return .075*Math.exp(.54*age)}
function pick(x,y){
  const qx=(x-cx)/unit,qy=-(y-cy)/unit,r=Math.hypot(qx,qy);
  let hit=null,best=99;
  for(const o of items){const rr=radius(o.age),d=Math.abs(r-rr);if(!o.dying&&d<.075+rr*.035&&d<best){best=d;hit=o}}
  return hit;
}
function choose(o){
  parent=Object.assign({},o.g);o.flash=1.6;o.hold=.5;
  for(const x of items)if(x!==o)x.dying=1;
  flash=1.5;pulse=1;
}
function draw(t,flashNow){
  rings.fill(0);
  for(let i=0;i<items.length;i++){const o=items[i];rings[i*4]=radius(o.age);rings[i*4+1]=o.alpha;rings[i*4+2]=o.flash;rings[i*4+3]=o.age}
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform2f(U.uCenter,cx*(canvas.width/W),cy*(canvas.height/H));
  gl.uniform1f(U.uUnit,unit*(canvas.width/W));
  gl.uniform1f(U.uTime,t%1000);gl.uniform1f(U.uFlash,flashNow);
  gl.uniform1f(U.uTeeth,parent.teeth);gl.uniform1f(U.uPulse,pulse);gl.uniform1f(U.uSeed,parent.seed);
  gl.uniform1i(U.uN,items.length);gl.uniform4fv(U.uRing,rings);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
let prev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;time+=dt;birth-=dt;
  if(birth<=0){spawn(mutate(parent));birth=parent.rate}
  for(const o of items){
    if(o.hold>0)o.hold-=dt;else o.age+=dt;
    o.alpha=o.dying?Math.max(0,o.alpha-dt*3.2):Math.min(1,o.alpha+dt*3.5);
    o.flash=Math.max(0,o.flash-dt*2.8);
  }
  items=items.filter(o=>radius(o.age)<maxR&&!(o.dying&&o.alpha<=0));
  pulse=Math.max(0,pulse-dt*2.5);flash=Math.max(0,flash-dt*2);
  draw(time,flash);requestAnimationFrame(frame);
}
function loopFrame(phase){
  const f=phase/TAU,list=[];
  for(let i=0;i<MAX;i++){const age=(i+f)*.82,rr=.075*Math.exp(.54*age);if(rr<maxR)list.push(age)}
  rings.fill(0);
  list.forEach((age,i)=>{rings[i*4]=.075*Math.exp(.54*age);rings[i*4+1]=1;rings[i*4+3]=age});
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform2f(U.uCenter,cx*(canvas.width/W),cy*(canvas.height/H));
  gl.uniform1f(U.uUnit,unit*(canvas.width/W));gl.uniform1f(U.uTime,phase);
  gl.uniform1f(U.uFlash,0);gl.uniform1f(U.uTeeth,parent.teeth);gl.uniform1f(U.uPulse,0);gl.uniform1f(U.uSeed,parent.seed);
  gl.uniform1i(U.uN,list.length);gl.uniform4fv(U.uRing,rings);gl.drawArrays(gl.TRIANGLES,0,3);
}
function hideHint(){if(!hinted){hinted=true;hint.classList.remove('on')}}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();const o=pick(e.clientX,e.clientY);if(o)choose(o);lastTouch=time;hideHint();
},{passive:false});
function mutateAll(){parent=genome();for(const o of items)o.dying=1;birth=.1;flash=1}
function resetAll(){parent=Object.assign({},FIRST);for(const o of items)o.dying=1;birth=.1;flash=1}
resize();requestAnimationFrame(frame);
setTimeout(()=>{if(!hinted)hint.classList.add('on')},1000);setTimeout(hideHint,6500);
window.APKit.init({canvas:canvas,gifName:'bloodline-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loopFrame,buttons:[
  {label:'✦',name:'mutate',onClick:mutateAll},{label:'↻',name:'reset',onClick:resetAll}
]});
})();
</script>
</body>
</html>
