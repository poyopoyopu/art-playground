<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLEED — BLACK ORCHID A</title>
<script src="../ap-kit.js"></script>
<script src="orchid-engine.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  BLEED — Claude(クロちゃん)作。ap-kit.js統合: Claude / 描画は orchid-engine.js
  案A。おっちゃん提供の黒い蘭の写真から。

  世界のルール — 「黒は、色を溜め込んでいる状態」:
  この花が黒いのは、色を持っていないからではなく、吸った色をひとつも外に出さないから。
  花弁に触れると、その花弁だけが溜め込んだ色を噴き出す。
  噴き出した色は空中に残り、二度と花には戻らない。色を吐いた花弁は灰になる。
  色を見たければ花を壊すしかなく、全部見た人の手元には色の抜けた白い骸だけが残る。
  ✦は新しい花を咲かせるが、これまでに噴き出した色は画面に残り続ける。
*/
const O=Orchid,c=document.getElementById('c'),ctx=c.getContext('2d');
let W=0,H=0,DPR=1,R=1,CX=0,CY=0,bg=null,pig=null,pctx=null,geo=null;
let genes=[],dr=[],going=[],pressing=false,sel=-1,holdT=0,hint=1;

function newFlower(seed){
  const r=O.mulberry32(seed);
  const base=seed===1?O.clone(O.WILD):O.randomGene(r);
  genes=[];for(let i=0;i<O.N;i++)genes.push(O.mutate(base,0.05,r));
  dr=[0,0,0,0,0,0];going=[0,0,0,0,0,0];
  geo=O.buildGeo(genes,R);
}

/* 色を空中へ焼き付ける(消えない) */
function spray(i,dt){
  const g=genes[i],o=geo[i];
  const d=dr[i];
  const ang=Math.atan2(o.hit[1],o.hit[0]);
  const dist=R*(0.35+1.55*Math.pow(d,0.75));
  const px=CX+Math.cos(ang)*dist,py=CY+Math.sin(ang)*dist;
  const n=3;
  pctx.globalCompositeOperation='lighter';
  for(let k=0;k<n;k++){
    const jitter=(Math.random()-0.5)*R*0.5*(0.3+d);
    const jx=px+Math.cos(ang+1.57)*jitter,jy=py+Math.sin(ang+1.57)*jitter;
    const rr=R*(0.10+0.55*d)*(0.6+Math.random()*0.8);
    const h=((g.hue+(Math.random()-0.5)*30)%360+360)%360;
    const a=0.055*(1-d*0.55)*dt*60/n;
    const gr=pctx.createRadialGradient(jx,jy,0,jx,jy,rr);
    gr.addColorStop(0,'hsla('+h.toFixed(0)+',100%,58%,'+a.toFixed(4)+')');
    gr.addColorStop(0.55,'hsla('+h.toFixed(0)+',100%,42%,'+(a*0.45).toFixed(4)+')');
    gr.addColorStop(1,'hsla('+h.toFixed(0)+',100%,40%,0)');
    pctx.fillStyle=gr;pctx.beginPath();pctx.arc(jx,jy,rr,0,7);pctx.fill();
  }
  pctx.globalCompositeOperation='source-over';
  return [px,py,d];
}

const paint=function(i,g){
  const d=dr[i],k=Math.pow(d,0.8);
  return {hue:g.hue,sat:g.sat*Math.pow(1-d,1.6)+0.02,
    lum:g.lum*(1-k)+0.55*k, sheen:g.sheen*(1-d)+0.10*d, alpha:1};
};

let jets=[];
function draw(bp){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  ctx.drawImage(pig,0,0);
  O.drawFlower(ctx,geo,{cx:CX,cy:CY,bp:bp,paint:paint});
  /* 噴き出し口の光 */
  for(const j of jets){
    const gr=ctx.createRadialGradient(j[0],j[1],0,j[0],j[1],R*0.22);
    gr.addColorStop(0,'rgba(255,255,255,'+(0.30*(1-j[2])).toFixed(3)+')');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(j[0],j[1],R*0.22,0,7);ctx.fill();
  }
  if(pressing&&sel>=0&&dr[sel]<1){
    const o=geo[sel];
    ctx.save();ctx.translate(CX,CY+(o.ro.kind==='lip'?R*0.06:0));
    if(o.ro.kind!=='lip')ctx.rotate(o.th);
    ctx.lineWidth=Math.max(1.2,R*0.006);
    ctx.strokeStyle='rgba(255,255,255,0.45)';
    if(o.ro.kind==='lip'){ctx.stroke(o.lip.disc)}else ctx.stroke(o.path);
    ctx.restore();
  }
  let n=0;for(let i=0;i<O.N;i++)if(dr[i]>=1)n++;
  O.label(ctx,W,H,R,'BLED '+n+'/6');
  if(hint>0)O.label(ctx,W,H,R,'TOUCH TO SPILL ITS COLOUR',true,0.38*hint);
}

let last=performance.now();
function tick(){
  const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  jets=[];
  for(let i=0;i<O.N;i++){
    if(going[i]&&dr[i]<1){
      dr[i]=Math.min(1,dr[i]+dt/(going[i]===2?0.8:1.7));
      jets.push(spray(i,dt));
      if(dr[i]>=1)going[i]=0;
    }
  }
  if(hint>0&&now>6000)hint=Math.max(0,hint-dt*0.5);
  draw(now/1000*0.55);
  requestAnimationFrame(tick);
}

function start(i,strong){if(i<0||dr[i]>=1)return;going[i]=strong?2:1;hint=0}
c.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  sel=O.pick(geo,e.clientX*DPR,e.clientY*DPR,CX,CY,R);
  pressing=true;holdT=performance.now();
  start(sel,false);
});
c.addEventListener('pointermove',function(e){
  if(!pressing)return;
  const i=O.pick(geo,e.clientX*DPR,e.clientY*DPR,CX,CY,R);
  if(i>=0&&i!==sel){sel=i;start(i,false)}
});
function up(){if(!pressing)return;pressing=false;
  if(sel>=0&&(performance.now()-holdT)/1000>0.7)going[sel]=2;sel=-1}
c.addEventListener('pointerup',up);
c.addEventListener('pointercancel',function(){pressing=false;sel=-1});
c.addEventListener('contextmenu',function(e){e.preventDefault()});

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);
  c.width=W;c.height=H;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  R=Math.min(W,H)*0.34;CX=W/2;CY=H*0.46;
  bg=O.makeBG(W,H,7777);
  const old=pig;
  pig=document.createElement('canvas');pig.width=W;pig.height=H;pctx=pig.getContext('2d');
  if(old)pctx.drawImage(old,0,0,W,H);
  geo=O.buildGeo(genes,R);
}
window.addEventListener('resize',resize);
newFlower(1);resize();requestAnimationFrame(tick);

APKit.init({
  canvas:c,gifName:'orchid-bleed-loop',clockFormat:'spec',dock:true,autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){newFlower((Date.now()&0x7fffffff)||2);hint=0}},
    {label:'↻',name:'reset',onClick:function(){
      pctx.clearRect(0,0,W,H);newFlower(1);hint=1}}
  ]
});
</script>
</body></html>
