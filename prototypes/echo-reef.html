<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ECHO REEF</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,dpr=1,t=0,seed=Math.random()*99,marks=[];
function R(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',R);R();
function field(px,py){let q=Math.hypot(px,py),a=Math.atan2(py,px),z=0;for(let k=1;k<7;k++){let f=k*2.1;z+=Math.sin(px*f+Math.sin(py*f*.7+t*.08)*2.2+a*3)*Math.cos(py*f*.73-a*2+t*.05)/k}for(const m of marks){let dx=px-m.x,dy=py-m.y,r=Math.hypot(dx,dy);z+=Math.exp(-r*r/(m.r*m.r))*m.s}return z+Math.sin(q*7-a*4+t*.11)*.22}
function draw(T=t){x.fillStyle='#03050a';x.fillRect(0,0,W,H);let s=Math.max(7,Math.min(11,W/100)),cols=Math.ceil(W/s),rows=Math.ceil(H/s);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let px=(i+.5)*s/W*3.2-1.6,py=(j+.5)*s/H*3.2-1.6,z=field(px,py),edge=Math.abs(Math.sin(z*5.2));if(edge>.78){let h=(z*70+T*3+seed*40+px*35+py*20)%360;x.fillStyle=`hsla(${h},80%,${42+edge*28}%,${.5+edge*.5})`;x.fillRect(i*s,j*s,s+1,s+1)}else if(z>.7){x.fillStyle='rgba(7,14,20,.9)';x.fillRect(i*s,j*s,s+1,s+1)}}}
function touch(px,py,force=1){marks.push({x:px/W*3.2-1.6,y:py/H*3.2-1.6,r:.16+.18*force,s:force*2});if(marks.length>9)marks.shift()}
let down=0;c.onpointerdown=e=>{down=1;touch(e.clientX,e.clientY,1.4);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(down)touch(e.clientX,e.clientY,.5)};c.onpointerup=()=>down=0;
function loop(p){draw(p)}function frame(ms){t=ms*.001;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
APKit.init({canvas:c,gifName:'echo-reef-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;marks=[]}},{label:'↻',name:'reset',onClick:()=>marks=[]}]});
</script></body></html>
