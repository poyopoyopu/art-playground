<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FROZEN CYCLE</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814}
body{touch-action:none}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const TEMP_PERIOD=6.0;
const c=document.getElementById('c'),g=c.getContext('2d');
let W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,2),phase=0,seed=Math.random(),nodes=[],holdX=-9999,holdY=-9999;
c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);

function temperature(phase){
  const t=((phase/(Math.PI*2))%1+1)%1;
  return t<0.5?t*2:2-t*2;
}

function buildCrystal(seed,originX,originY){
  const created=[{x:originX,y:originY,depth:0,angle:-Math.PI/2,parentId:-1,bornAtTemp:temperature(phase)}];
  for(let depth=0;depth<7;depth++){
    const start=created.length;
    for(let i=0;i<start;i++){
      if(created[i].depth!==depth)continue;
      const branches=depth<2?3:2;
      for(let b=0;b<branches;b++){
        const parent=created[i];
        const spread=.34+depth*.035;
        const wobble=Math.sin(seed*17.13+i*2.71+b*4.37+depth*.91)*.075;
        const angle=parent.angle+(b-(branches-1)/2)*spread+wobble;
        const length=(22+depth*8)*(0.78+0.22*Math.sin(seed*8.1+i*.73+b*2.9)**2);
        created.push({x:parent.x+Math.cos(angle)*length,y:parent.y+Math.sin(angle)*length,depth:depth+1,angle:angle,parentId:i,bornAtTemp:parent.bornAtTemp});
      }
    }
  }
  return created;
}

function renderAt(nodes,temp){
  g.fillStyle='#050814';g.fillRect(0,0,W,H);
  const cold=1-temp;
  for(const n of nodes){
    if(n.depth===0)continue;
    const p=nodes[n.parentId];
    if(!p)continue;
    const melt=Math.max(0,Math.min(1,(temp-n.bornAtTemp+.12)/.48));
    const reach=Math.max(.015,cold*(1-melt*.96));
    const x=p.x+(n.x-p.x)*reach,y=p.y+(n.y-p.y)*reach;
    const hue=205+temp*105+n.depth*2.5;
    const sat=76+reach*18;
    const light=58+reach*30;
    g.beginPath();g.moveTo(p.x,p.y);g.lineTo(x,y);
    g.strokeStyle=`hsla(${hue},${sat}%,${light}%,${.08+.8*reach})`;
    g.lineWidth=Math.max(.35,2.35-n.depth*.25);g.stroke();
  }
  for(const n of nodes){
    if(n.depth!==0)continue;
    g.beginPath();g.arc(n.x,n.y,2.6,0,Math.PI*2);
    g.fillStyle=`hsl(${205+temp*105},92%,92%)`;g.fill();
  }
}

function onTap(x,y){
  if(window.APKit&&APKit.isUI(x,y))return true;
  const crystal=buildCrystal(seed+nodes.length*.173,x,y),offset=nodes.length;
  for(const n of crystal){if(n.parentId>=0)n.parentId+=offset;nodes.push(n)}
  return true;
}

function onHold(x,y){
  if(window.APKit&&APKit.isUI(x,y))return true;
  holdX=x;holdY=y;
  for(const n of nodes){
    if(n.depth>0&&Math.hypot(n.x-x,n.y-y)<Math.min(W,H)*.22)n.bornAtTemp=Math.min(n.bornAtTemp,0.18);
  }
  return true;
}

function onDoubleTap(){
  phase=0;
  return true;
}

let lastTap=0,holdTimer=0;
c.setAttribute('onpointerdown',"if(window.APKit&&APKit.isUI(event.clientX,event.clientY))return;var now=performance.now();if(now-lastTap<320){clearTimeout(holdTimer);onDoubleTap();lastTap=0}else{lastTap=now;holdX=event.clientX;holdY=event.clientY;holdTimer=setTimeout('onHold(holdX,holdY)',420);onTap(event.clientX,event.clientY)}");
c.setAttribute('onpointerup',"clearTimeout(holdTimer);holdX=-9999;holdY=-9999");

nodes=buildCrystal(seed,W*.5,H*.5);
setInterval('phase=(phase+Math.PI*2*(0.016/TEMP_PERIOD))%(Math.PI*2);renderAt(nodes,temperature(phase))',16);

APKit.init({canvas:c,gifName:'FROZEN-CYCLE-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>renderAt(nodes,temperature(p)),buttons:[
 {label:'✦',name:'mutate',onClick:()=>{seed=Math.random();nodes=buildCrystal(seed,W*.5,H*.5)}},
 {label:'↻',name:'reset',onClick:()=>{nodes=buildCrystal(seed,W*.5,H*.5)}}
]});
</script>
</body>
</html>
