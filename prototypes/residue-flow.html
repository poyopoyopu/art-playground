<!doctype html>
<!-- RESIDUE FLOW — ChatGPT作。四角い粒子が流れ、触れた場所で流れの法則そのものが曲がる。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020207"><title>RESIDUE FLOW — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020207}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
let W=1,H=1,D=1,seed=Math.random()*10000,marks=[],start=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const N=2600,pts=[];
for(let i=0;i<N;i++)pts.push({x:Math.random()*2-1,y:Math.random()*2-1,a:Math.random()*6.283,z:Math.random(),s:.35+Math.random()*.9});
function hash(n){return (Math.sin(n*127.1+seed*3.17)*43758.5453)%1}
function law(x,y,t,phase){
 let vx=0,vy=0;
 // Four nested scales of the same curl law: large current -> smaller currents.
 for(let k=0;k<4;k++){
  const s=1.15+k*1.08,xx=x*s,yy=y*s;
  const ang=.62*Math.sin(xx*2.1+Math.sin(yy*1.7+t*.16+k))+.43*Math.cos(yy*2.7-xx*.8-t*.11-k);
  const qx=Math.cos(ang),qy=Math.sin(ang);
  vx+=(-yy*qx+xx*qy)*(.018/(k+1));
  vy+=( xx*qx+yy*qy)*(.018/(k+1));
 }
 // Touches are not particles: they become permanent changes to the field.
 for(let i=0;i<marks.length;i++){
  const m=marks[i],dx=x-m.x,dy=y-m.y,r2=dx*dx+dy*dy+.0008,g=Math.exp(-r2/(m.r*m.r));
  const spin=m.spin*g;
  vx+=(-dy)*spin*2.8;vy+=dx*spin*2.8;
  const pull=(m.pull*g)*.55;vx+=dx*pull;vy+=dy*pull;
 }
 return [vx,vy];
}
function sample(p,phase,ghost){
 const t=phase*6.283185307;let x=p.x,y=p.y;
 const age=ghost*.075;
 for(let j=0;j<9;j++){const f=law(x,y,t-age);x+=f[0];y+=f[1]}
 x+=.16*Math.sin(t*.18+p.a)+.07*Math.sin(y*5+t*.09+p.a*2);
 y+=.12*Math.cos(t*.15+p.a*1.7)+.06*Math.cos(x*4-t*.08+p.a);
 return [x,y];
}
function draw(phase){
 const t=phase*6.283185307;ctx.fillStyle='rgba(2,2,7,.18)';ctx.fillRect(0,0,W,H);
 const cx=W*.5,cy=H*.5,sc=Math.min(W,H)*.44;
 for(let i=0;i<N;i++){
  const p=pts[i];
  for(let g=3;g>=0;g--){const q=sample(p,phase,g);let x=cx+q[0]*sc,y=cy+q[1]*sc;
   if(x<-10||x>W+10||y<-10||y>H+10)continue;
   const h=(seed*.013+i*.00073+Math.atan2(q[1],q[0])*.055+t*.008+g*.055)%1;
   const hue=(h*360+360)%360;
   const size=(1.05+p.s*1.7)*(1-g*.16);
   ctx.fillStyle=`hsla(${hue},96%,${66+g*6}%,${.11+(.22/(g+1))})`;
   ctx.fillRect(x-size*.5,y-size*.5,size,size);
  }
 }
 // A few larger square remnants reveal the hierarchy instead of becoming noise.
 for(let i=0;i<marks.length;i++){const m=marks[i];const q=sample({x:m.x,y:m.y,a:i,z:0,s:1},phase,0);const x=cx+q[0]*sc,y=cy+q[1]*sc;const s=3+9*m.r;
  ctx.fillStyle=`hsla(${(m.hue+t*5)%360},100%,72%,.55)`;ctx.fillRect(x-s/2,y-s/2,s,s);
 }
}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;const nx=(x-W/2)/Math.min(W,H)/.44,ny=(H/2-y)/Math.min(W,H)/.44;marks.push({x:nx,y:ny,r:.10+Math.random()*.08,spin:(Math.random()>.5?1:-1)*(1.3+Math.random()*1.8),pull:(Math.random()-.5)*1.8,hue:Math.random()*360});if(marks.length>9)marks.shift();return false}
let down=false,last=0;C.addEventListener('pointerdown',e=>{if(touch(e.clientX,e.clientY))return;down=true;C.setPointerCapture?.(e.pointerId)});C.addEventListener('pointermove',e=>{if(!down||performance.now()-last<55)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=performance.now();touch(e.clientX,e.clientY)});addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
function frame(now){if(!APKit.isExporting()){const ph=((now-start)/1000%12)/12;draw(ph)}requestAnimationFrame(frame)}
APKit.init({canvas:C,gifName:'residue-flow-loop',clockFormat:'spec',loopFrame:ph=>draw(ph),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*10000;marks=[]}},{label:'↻',name:'reset',onClick:()=>{marks=[]}}]});requestAnimationFrame(frame);
</script></body></html>
