<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* CHROMATIC FOLD — ChatGPT作。面そのものが折り畳まれ、触れた場所に新しい折り目が固定される。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;
uniform vec2 r;uniform float t,seed;uniform vec4 fold[8];uniform int n;
float noisy(float x){return fract(sin(x*91.7+seed*17.3)*43758.5453)*.42-.21;}
vec3 pal(float x){float a=fract(x);float h=fract(a*7.0+seed*.013);return .5+.5*cos(6.2831853*(h+vec3(.0,.31,.63)));}
void main(){
 vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y); float ang=.16*sin(t*.42);
 mat2 R=mat2(cos(ang),-sin(ang),sin(ang),cos(ang));p=R*p;
 for(int i=0;i<8;i++){if(i>=n)break;vec2 q=p-fold[i].xy;float d=length(q);float g=exp(-d*d/(.018+.028*fold[i].z));p+=q*normalize(max(d,.0001))*g*fold[i].z*.55;}
 for(int j=0;j<5;j++){
   p=abs(p)-vec2(.42,.34);
   float a=.17*sin(t*.32+float(j)*1.37)+.08*cos(seed+float(j));
   mat2 M=mat2(cos(a),-sin(a),sin(a),cos(a));p=M*p;
   p*=1.36+float(j)*.045;
 }
 float v=length(p)+.11*sin(p.x*5.+p.y*4.-t*.7)+.045*cos(p.x*13.-p.y*9.+t);
 float bands=sin(v*17.-t*.38);
 float cells=fract(sin(floor(p.x*5.)*12.7+floor(p.y*5.)*78.2+seed*3.1)*43758.5453);float h=v*.16+bands*.018+seed*.004+noisy(v)+cells*.38;
 vec3 col=pal(h);
 col=mix(col,pal(h+.11),smoothstep(.65,1.,abs(bands)));
 float edge=pow(max(0.,1.-abs(bands)),5.);
 col+=vec3(1.)*edge*.24;
 float vign=1.-.18*length((gl_FragCoord.xy/r)-.5);
 o=vec4(pow(col*vign,vec3(.86)),1.);
}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
let U={};for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''))}
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*40,touch=[],live=0,paused=false;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();
function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}
function draw(ph){gl.useProgram(pr);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(32);touch.forEach((q,i)=>a.set(q,i*4));gl.uniform4fv(U.fold,a);gl.uniform1i(U.n,touch.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);touch.push([q[0],q[1],.55+.45*Math.random(),Math.random()*6.283]);if(touch.length>8)touch.shift()});
function loop(now){if(!paused){live=now*.00035;draw(live)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[
{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*80}},
{label:'↻',name:'reset',onClick:()=>{touch=[];live=0}}]});
</script></body></html>
