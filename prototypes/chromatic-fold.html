<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eee6}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*1000;
let law=0,px=.5,py=.5,tx=.5,ty=.5,last=performance.now();
const palettes=[
 ['#f4efe4','#d7d1c3','#b8a79d','#8f6f83','#563f68'],
 ['#f2eadc','#d5c0a7','#b56d5b','#7e3f55','#34263f'],
 ['#e9f1ef','#b9d5d0','#7199a0','#4c6289','#2d345f'],
 ['#f3ead8','#d8d29d','#9c9a5c','#64734d','#303c39']
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function render(phase=null){
 const now=performance.now()/1000,t=phase===null?now:phase,p=palettes[law];
 const T=k=>APKit.T(k,phase,t),base=Math.min(W,H),u=T(.16);
 const breathe=(Math.sin(T(.39))+1)/2;
 const tide=(Math.sin(T(.145)-.8)+1)/2;
 const centerX=W*(.5+(px-.5)*.14),centerY=H*(.5+(py-.5)*.14);

 // A warm, luminous paper atmosphere. The light drifts so slowly that the
 // field feels alive without reading as an animated background effect.
 const bg=ctx.createLinearGradient(0,0,W,H);
 bg.addColorStop(0,p[0]);
 bg.addColorStop(.28,p[0]);
 bg.addColorStop(.55,p[1]);
 bg.addColorStop(.82,p[0]);
 bg.addColorStop(1,p[0]);
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='screen';
 for(let k=0;k<4;k++){
   const gx=W*(.10+.28*k)+Math.sin(T(.045)+k*1.7)*W*.08;
   const gy=H*(.18+.23*((k*1.37)%1))+Math.cos(T(.035)+k)*H*.06;
   const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,base*(.48+.10*Math.sin(k+T(.06))));
   const hue=(law*55+k*31+u*22)%360;
   rg.addColorStop(0,hs(hue,30,74,.035+.025*breathe));
   rg.addColorStop(1,hs(hue,30,74,0));
   ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
 ctx.globalCompositeOperation='source-over';

 ctx.save();ctx.translate(centerX,centerY);
 const bands=46;

 // Very soft broad folds sit behind the drawing. Their colors migrate through
 // the same field as the fine lines, producing a silk-like depth.
 for(let r=0;r<7;r++){
   const q=r/6,phaseR=T(.07)+r*1.07;
   ctx.beginPath();
   for(let i=0;i<=280;i++){
     const z=i/280,x=(z-.5)*W*1.42;
     const y=(q-.5)*base*.80
       +Math.sin(z*Math.PI*1.72+phaseR)*base*(.075+.025*breathe)
       +Math.sin(z*Math.PI*3.25-phaseR*.6+r)*base*.025;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const hue=(law*58+r*24+u*34)%360;
   ctx.strokeStyle=hs(hue,48+q*22,66-q*7,.055+.035*(1-q));
   ctx.lineWidth=base*(.032+.010*breathe);
   ctx.filter='blur('+Math.max(3,base*.012)+'px)';ctx.stroke();ctx.filter='none';
 }

 // Main folded field. The spacing breathes very slightly, while a slow phase
 // slip moves the apparent crest from left to right. This keeps the image
 // recognizable but gives the eye new relationships to discover.
 for(let b=0;b<bands;b++){
   const q=b/(bands-1),path=new Path2D();
   for(let i=0;i<=300;i++){
     const z=i/300;
     const x=(z-.5)*W*1.43;
     const crest=Math.sin(z*Math.PI*1.72+T(.075)+q*2.15+seed*.0007);
     const fold=Math.sin(z*Math.PI*3.45-T(.045)+q*1.55+T(.20)*.12+seed*.001);
     const fine=Math.sin(z*Math.PI*8.2+q*5.8+T(.11))*base*.0038;
     const localBreath=.72+.28*Math.sin(T(.31)+q*4.2);
     const y=(q-.5)*base*.82
       +crest*base*(.052+.028*breathe)*localBreath
       +fold*base*(.009+.012*(1-q))
       +fine;
     const xx=x+Math.sin(z*Math.PI*2.15+q*3.2+T(.065))*base*.006*(.45+breathe);
     if(i===0)path.moveTo(xx,y);else path.lineTo(xx,y);
   }
   const hue=(law*62+q*102+u*34+Math.sin(q*Math.PI*2+T(.12))*12)%360;
   const sat=31+q*30+6*Math.sin(q*Math.PI);
   const light=43+q*30+3*breathe;
   const alpha=.22+.31*(1-q);
   ctx.strokeStyle=hs(hue,sat,light,alpha);
   ctx.lineWidth=.62+base*.00225*(1-q)*(1.02+.36*breathe);
   ctx.stroke(path);
 }

 // A pearly band of light slowly travels through the field. It is broad enough
 // to feel like illumination, not another line competing with the composition.
 for(let r=0;r<3;r++){
   const q=(tide+r*.31)%1;
   const y0=(q-.5)*base*.82;
   ctx.beginPath();
   for(let i=0;i<=240;i++){
     const z=i/240,x=(z-.5)*W*1.42;
     const y=y0
       +Math.sin(z*Math.PI*1.72+T(.075)+q*2.15)*base*.075
       +Math.sin(z*Math.PI*3.4-T(.04))*base*.018;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const hue=(law*60+q*150+u*28)%360;
   ctx.strokeStyle=hs(hue,58,72,.075+.035*breathe);
   ctx.lineWidth=base*(.012+.006*breathe);
   ctx.filter='blur('+Math.max(2,base*.006)+'px)';ctx.stroke();ctx.filter='none';
 }

 // The recognizable accent filament remains, but it now emerges and recedes
 // with the moving light instead of dominating the whole composition.
 const filament=T(.20);
 ctx.beginPath();
 for(let i=0;i<=260;i++){
   const z=i/260,x=(z-.5)*W*1.40;
   const y=Math.sin(z*Math.PI*1.62+filament)*base*.235
     +Math.sin(z*Math.PI*4.8-filament*.65)*base*.017;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 const fh=(law*80+u*55)%360;
 ctx.strokeStyle=hs(fh,68,71,.38+.16*(1-tide));
 ctx.lineWidth=Math.max(.8,base*.0021);
 ctx.stroke();
 ctx.restore();

 // A very light edge falloff gives the image a finished, photographic softness.
 const vign=ctx.createRadialGradient(W*.5,H*.5,base*.16,W*.5,H*.5,Math.max(W,H)*.78);
 vign.addColorStop(0,'rgba(255,255,255,0)');
 vign.addColorStop(.70,'rgba(0,0,0,.012)');
 vign.addColorStop(1,'rgba(0,0,0,.075)');
 ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}
function animate(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 px+=(tx-px)*(1-Math.exp(-dt*2.3));py+=(ty-py)*(1-Math.exp(-dt*2.3));
 render();requestAnimationFrame(animate);
}
function touch(x,y){
 if(window.APKit&&APKit.isUI(x,y))return true;
 tx=x/innerWidth;ty=y/innerHeight;
 law=(law+1)%palettes.length;seed=Math.random()*1000;
 return true;
}
canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/innerWidth;ty=e.clientY/innerHeight}},{passive:true});
APKit.init({canvas:canvas,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){law=(law+1)%palettes.length;seed=Math.random()*1000}},
 {label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*1000;tx=ty=px=py=.5}}
]});
requestAnimationFrame(animate);
</script>
</body>
</html>
