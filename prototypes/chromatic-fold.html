<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eee6}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*1000;
let law=0,px=.5,py=.5,tx=.5,ty=.5,last=performance.now();
const palettes=[
 ['#f4efe4','#d7d1c3','#b8a79d','#8f6f83','#563f68'],
 ['#f2eadc','#d5c0a7','#b56d5b','#7e3f55','#34263f'],
 ['#e9f1ef','#b9d5d0','#7199a0','#4c6289','#2d345f'],
 ['#f3ead8','#d8d29d','#9c9a5c','#64734d','#303c39']
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function render(phase=null){
 const now=performance.now()/1000,t=phase===null?now:phase,p=palettes[law];
 const T=k=>APKit.T(k,phase,t),base=Math.min(W,H),u=T(.16),breath=(Math.sin(T(.62))+1)/2;
 const centerX=W*(.5+(px-.5)*.18),centerY=H*(.5+(py-.5)*.18);
 const bg=ctx.createLinearGradient(0,0,W,H);
 bg.addColorStop(0,p[0]);bg.addColorStop(.42,p[1]);bg.addColorStop(1,p[0]);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(centerX,centerY);
 const folds=7, bands=46;
 for(let b=0;b<bands;b++){
   const q=b/(bands-1), path=new Path2D();
   for(let i=0;i<=240;i++){
     const z=i/240, x=(z-.5)*W*1.35;
     const bend=(.055+.028*breath)*base*Math.sin(z*Math.PI*2+T(.09)+q*2.4);
     const crease=Math.sin(z*Math.PI*folds+T(.27)+q*1.7+seed*.01)*base*(.012+.018*(1-q));
     const y=(q-.5)*base*.78 + bend + crease;
     const xx=x + Math.sin(z*Math.PI*3+q*4+T(.13))*base*.012*(1+breath);
     if(i===0)path.moveTo(xx,y);else path.lineTo(xx,y);
   }
   const hue=(law*74+q*92+u*28)%360;
   ctx.strokeStyle=hs(hue,35+q*18,32+q*42,.24+.44*(1-q));
   ctx.lineWidth=.7+base*.003*(1-q)*(1.2+breath);
   ctx.stroke(path);
 }
 for(let r=0;r<folds;r++){
   const phaseR=T(.11)+r*1.17;
   ctx.beginPath();
   for(let i=0;i<=220;i++){
     const z=i/220,x=(z-.5)*W*1.4;
     const y=(r-(folds-1)/2)*base*.105 + Math.sin(z*Math.PI*2+phaseR)*base*.075 + Math.sin(z*Math.PI*4-T(.07)+r)*base*.018;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const hue=(law*70+r*37+u*40)%360;
   ctx.strokeStyle=hs(hue,68,55,.10+.08*breath);ctx.lineWidth=base*(.035+.014*breath);ctx.filter='blur('+Math.max(2,base*.008)+'px)';ctx.stroke();ctx.filter='none';
 }
 const seam=T(.20);
 ctx.beginPath();
 for(let i=0;i<=180;i++){
   const z=i/180,x=(z-.5)*W*1.3;
   const y=Math.sin(z*Math.PI*1.7+seam)*base*.25 + Math.sin(z*Math.PI*6-seam*.7)*base*.025;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle=hs((law*80+u*55)%360,80,72,.8);ctx.lineWidth=Math.max(1,base*.006);ctx.stroke();
 ctx.restore();
 const vign=ctx.createRadialGradient(W*.5,H*.5,base*.2,W*.5,H*.5,Math.max(W,H)*.75);vign.addColorStop(0,'rgba(255,255,255,0)');vign.addColorStop(1,'rgba(0,0,0,.10)');ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;px+=(tx-px)*(1-Math.exp(-dt*3));py+=(ty-py)*(1-Math.exp(-dt*3));render();requestAnimationFrame(animate)}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;tx=x/innerWidth;ty=y/innerHeight;law=(law+1)%palettes.length;seed=Math.random()*1000;return true}
canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/innerWidth;ty=e.clientY/innerHeight}},{passive:true});
APKit.init({canvas:canvas,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){law=(law+1)%palettes.length;seed=Math.random()*1000}},
 {label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*1000;tx=ty=px=py=.5}}
]});
requestAnimationFrame(animate);
</script>
</body>
</html>
