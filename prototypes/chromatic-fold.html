<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eee6}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*1000;
let law=0,px=.5,py=.5,tx=.5,ty=.5,last=performance.now();
const palettes=[
 ['#f4efe4','#d7d1c3','#b8a79d','#8f6f83','#563f68'],
 ['#f2eadc','#d5c0a7','#b56d5b','#7e3f55','#34263f'],
 ['#e9f1ef','#b9d5d0','#7199a0','#4c6289','#2d345f'],
 ['#f3ead8','#d8d29d','#9c9a5c','#64734d','#303c39']
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function render(phase=null){
 const now=performance.now()/1000,t=phase===null?now:phase,p=palettes[law];
 const T=k=>APKit.T(k,phase,t),base=Math.min(W,H),u=T(.16);
 const breathe=(Math.sin(T(.39))+1)/2;
 const tide=(Math.sin(T(.145)-.8)+1)/2;
 const bloom=(Math.sin(T(.082)+1.2)+1)/2;
 const centerX=W*(.5+(px-.5)*.14),centerY=H*(.5+(py-.5)*.14);

 // The paper is never visually still: a very slow chromatic dawn moves through it.
 const bg=ctx.createLinearGradient(0,0,W,H);
 const drift=.5+.5*Math.sin(T(.052));
 bg.addColorStop(0,p[0]);
 bg.addColorStop(.20,p[0]);
 bg.addColorStop(.43,hs((law*57+u*30)%360,18,92,.55));
 bg.addColorStop(.62,p[1]);
 bg.addColorStop(.84,p[0]);
 bg.addColorStop(1,p[0]);
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='screen';
 for(let k=0;k<5;k++){
   const gx=W*(.02+k*.245+Math.sin(T(.038)+k*1.7)*.10)+drift*W*.08;
   const gy=H*(.10+.24*((k*1.37)%1))+Math.cos(T(.030)+k)*H*.07;
   const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,base*(.43+.14*bloom));
   const hue=(law*55+k*29+u*22+drift*24)%360;
   rg.addColorStop(0,hs(hue,36,77,.048+.035*breathe));
   rg.addColorStop(.48,hs(hue+24,28,79,.018+.012*bloom));
   rg.addColorStop(1,hs(hue,30,80,0));
   ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
 }
 ctx.globalCompositeOperation='source-over';

 ctx.save();ctx.translate(centerX,centerY);
 const bands=46;

 // Soft folds establish depth first. Their crests travel at a different speed
 // from the fine field, so the image slowly changes its internal hierarchy.
 for(let r=0;r<9;r++){
   const q=r/8,phaseR=T(.052)+r*.83;
   ctx.beginPath();
   for(let i=0;i<=300;i++){
     const z=i/300,x=(z-.5)*W*1.44;
     const y=(q-.5)*base*.80
       +Math.sin(z*Math.PI*1.72+phaseR)*base*(.060+.032*breathe)
       +Math.sin(z*Math.PI*3.18-phaseR*.55+r)*base*.022
       +Math.sin(z*Math.PI*.82-T(.028))*base*.018*(q-.5);
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const hue=(law*58+r*24+u*34)%360;
   ctx.strokeStyle=hs(hue,46+q*25,65-q*6,.045+.035*(1-q));
   ctx.lineWidth=base*(.024+.011*breathe);
   ctx.filter='blur('+Math.max(3,base*.0105)+'px)';ctx.stroke();ctx.filter='none';
 }

 // Main folded field. The spacing breathes, while a very slow phase slip moves
 // the crest. Color changes continuously instead of jumping between stripes.
 for(let b=0;b<bands;b++){
   const q=b/(bands-1),path=new Path2D();
   for(let i=0;i<=320;i++){
     const z=i/320;
     const x=(z-.5)*W*1.43;
     const crest=Math.sin(z*Math.PI*1.72+T(.075)+q*2.15+seed*.0007);
     const fold=Math.sin(z*Math.PI*3.45-T(.045)+q*1.55+T(.20)*.12+seed*.001);
     const fine=Math.sin(z*Math.PI*8.2+q*5.8+T(.11))*base*.0037;
     const localBreath=.72+.28*Math.sin(T(.31)+q*4.2);
     const y=(q-.5)*base*.82
       +crest*base*(.050+.031*breathe)*localBreath
       +fold*base*(.009+.012*(1-q))
       +fine;
     const xx=x+Math.sin(z*Math.PI*2.15+q*3.2+T(.065))*base*.006*(.45+breathe);
     if(i===0)path.moveTo(xx,y);else path.lineTo(xx,y);
   }
   const hue=(law*62+q*102+u*34+Math.sin(q*Math.PI*2+T(.12))*12)%360;
   const sat=33+q*31+7*Math.sin(q*Math.PI);
   const light=42+q*31+4*breathe;
   const alpha=.22+.32*(1-q);
   ctx.strokeStyle=hs(hue,sat,light,alpha);
   ctx.lineWidth=.62+base*.00225*(1-q)*(1.02+.38*breathe);
   ctx.stroke(path);
 }

 // Pearlescent illumination sweeps slowly across the sheet. Three veils overlap
 // so the eye sees changing color relationships rather than a moving stripe.
 for(let r=0;r<3;r++){
   const q=(tide+r*.305)%1;
   const y0=(q-.5)*base*.82;
   ctx.beginPath();
   for(let i=0;i<=260;i++){
     const z=i/260,x=(z-.5)*W*1.44;
     const y=y0
       +Math.sin(z*Math.PI*1.72+T(.075)+q*2.15)*base*.075
       +Math.sin(z*Math.PI*3.4-T(.04)+r*.5)*base*.018;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const hue=(law*60+q*150+u*28+r*18)%360;
   ctx.strokeStyle=hs(hue,60,73,.060+.045*breathe);
   ctx.lineWidth=base*(.012+.007*breathe);
   ctx.filter='blur('+Math.max(2,base*.006)+'px)';ctx.stroke();ctx.filter='none';
 }

 // The accent filament now behaves like a reflection: it becomes visible,
 // fades, and changes hue as the broad illumination passes over it.
 const filament=T(.20);
 ctx.beginPath();
 for(let i=0;i<=280;i++){
   const z=i/280,x=(z-.5)*W*1.40;
   const y=Math.sin(z*Math.PI*1.62+filament)*base*.235
     +Math.sin(z*Math.PI*4.8-filament*.65)*base*.017;
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 const fh=(law*80+u*55+Math.sin(T(.08))*18)%360;
 ctx.strokeStyle=hs(fh,66,72,.22+.30*(1-tide));
 ctx.lineWidth=Math.max(.75,base*.0021);ctx.stroke();

 // Tiny glints drift across the folds. They are deliberately broad enough to
 // read as light moving over a surface, not as particles.
 ctx.globalCompositeOperation='screen';
 for(let g=0;g<3;g++){
   const gx=-W*.65+((T(.042+g*.009)+g*.37)%1)*W*2.3;
   const gy=H*(.35+.16*g)+Math.sin(T(.065)+g*2.1)*base*.16-H*.5;
   const gr=ctx.createRadialGradient(gx,gy,0,gx,gy,base*(.14+.04*bloom));
   gr.addColorStop(0,hs((law*64+g*51+u*26)%360,48,84,.050+.018*bloom));
   gr.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=gr;ctx.fillRect(-W,-H,W*2,H*2);
 }
 ctx.globalCompositeOperation='source-over';
 ctx.restore();

 const vign=ctx.createRadialGradient(W*.5,H*.5,base*.16,W*.5,H*.5,Math.max(W,H)*.78);
 vign.addColorStop(0,'rgba(255,255,255,0)');
 vign.addColorStop(.70,'rgba(0,0,0,.010)');
 vign.addColorStop(1,'rgba(0,0,0,.075)');
 ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}
function animate(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 px+=(tx-px)*(1-Math.exp(-dt*2.3));py+=(ty-py)*(1-Math.exp(-dt*2.3));
 render();requestAnimationFrame(animate);
}
function touch(x,y){
 if(window.APKit&&APKit.isUI(x,y))return true;
 tx=x/innerWidth;ty=y/innerHeight;
 law=(law+1)%palettes.length;seed=Math.random()*1000;
 return true;
}
canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/innerWidth;ty=e.clientY/innerHeight}},{passive:true});
APKit.init({canvas:canvas,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){law=(law+1)%palettes.length;seed=Math.random()*1000}},
 {label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*1000;tx=ty=px=py=.5}}
]});
requestAnimationFrame(animate);
</script>
</body>
</html>
