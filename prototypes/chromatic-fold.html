<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120d1c}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*1000;
let law=0,tx=.5,ty=.5,px=.5,py=.5,last=performance.now();
const palettes=[
 ['#100b19','#33204b','#ff7d9d','#78e0d1','#f7d98a'],
 ['#07151b','#163e4a','#68d8ff','#b9a1ff','#ffcf8b'],
 ['#170b10','#4b1d30','#ff8d68','#d5e58a','#bda4ff'],
 ['#0a101c','#24375b','#73e8c9','#f5a6d5','#ffe09a']
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function render(phase=null){
 const now=performance.now()/1000,t=phase===null?now:phase,p=palettes[law];
 const T=k=>APKit.T(k,phase,t),S=Math.min(W,H),cx=W*(.5+(px-.5)*.08),cy=H*(.5+(py-.5)*.08);
 const breath=(Math.sin(T(.47))+1)/2;
 // Deep, slowly changing atmospheric field rather than a flat background.
 const bg=ctx.createRadialGradient(cx,cy-S*.08,S*.05,W*.5,H*.5,Math.max(W,H)*.78);
 bg.addColorStop(0,p[2]);bg.addColorStop(.18,p[1]);bg.addColorStop(.58,p[0]);bg.addColorStop(1,'#07060b');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // A quiet halo gives the ribbons a physical space to exist in.
 const halo=ctx.createRadialGradient(cx,cy,S*.03,cx,cy,S*.62);
 halo.addColorStop(0,'rgba(255,255,255,.10)');halo.addColorStop(.45,'rgba(255,255,255,.025)');halo.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(cx,cy);
 const layers=54;
 // The main body is a stack of closed, slightly displaced silk surfaces.
 // Each layer has its own phase offset, so the eye discovers new folds over time.
 for(let l=0;l<layers;l++){
   const q=l/(layers-1),a0=q*Math.PI*2;
   ctx.beginPath();
   const points=260;
   for(let i=0;i<=points;i++){
     const a=i/points*Math.PI*2;
     const radial=S*(.045+q*.44);
     const petal=1+.16*Math.sin(a*3+T(.21)+q*2.8)+.075*Math.sin(a*7-T(.13)+seed*.004);
     const fold=.045*Math.sin(a*2-T(.31)*.0+q*5.2+T(.37))*S*(.12+q*.25);
     const drift=Math.sin(a-T(.09)+q*4.5)*S*.035*(1-q);
     const rr=radial*petal+fold;
     const xx=Math.cos(a+a0*.018+T(.055))*rr+drift;
     const yy=Math.sin(a+a0*.018+T(.055))*rr*.72 + Math.sin(a*2+T(.17)+q)*S*.018;
     if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
   }
   ctx.closePath();
   const hue=(l*3.8+T(.075)*34+law*46)%360;
   const alpha=.075+.17*(1-q)+.055*breath;
   ctx.fillStyle=hs(hue,66+18*Math.sin(q*Math.PI),58+12*Math.sin(q*Math.PI*1.4),alpha);
   ctx.strokeStyle=hs(hue,55,72,.18+.25*(1-q));
   ctx.lineWidth=Math.max(.7,S*(.0012+.0014*(1-q)));
   ctx.fill();ctx.stroke();
 }
 // Three broad translucent folds sweep through the sculpture, creating the
 // moments where the flat line drawing turns into something almost physical.
 ctx.globalCompositeOperation='screen';
 for(let r=0;r<3;r++){
   ctx.beginPath();
   for(let i=0;i<=240;i++){
     const z=i/240,a=z*Math.PI*2;
     const rr=S*(.10+r*.16)+Math.sin(a*2+T(.12)+r*2.1)*S*.075+Math.sin(a*5-T(.08))*S*.018;
     const x=Math.cos(a+T(.035))*rr;
     const y=Math.sin(a+T(.035))*rr*.72;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   const g=ctx.createRadialGradient(0,0,0,0,0,S*.5);
   const c=[p[2],p[3],p[4]][r];
   g.addColorStop(0,c+'00');g.addColorStop(.45,c+'55');g.addColorStop(1,c+'00');
   ctx.strokeStyle=g;ctx.lineWidth=S*(.035+.012*breath);ctx.filter='blur('+Math.max(3,S*.012)+'px)';ctx.stroke();ctx.filter='none';
 }
 ctx.globalCompositeOperation='source-over';
 // A tiny luminous core continuously changes its internal symmetry.
 const petals=5+law;
 for(let k=0;k<petals;k++){
   const a=k/petals*Math.PI*2+T(.16);
   const rr=S*(.075+.018*Math.sin(T(.8)+k));
   ctx.beginPath();
   ctx.ellipse(Math.cos(a)*rr*.55,Math.sin(a)*rr*.55,rr*.42,rr*.12,a,0,Math.PI*2);
   ctx.fillStyle=hs((k*360/petals+T(.1)*40+law*55)%360,82,68,.16+.06*breath);ctx.fill();
 }
 ctx.restore();
 // Fine outer arcs: the boundary slowly appears and disappears, like a breathing contour map.
 ctx.save();ctx.translate(cx,cy);
 for(let n=0;n<20;n++){
   const q=n/20,rad=S*(.38+q*.28);
   ctx.beginPath();
   for(let i=0;i<=180;i++){
     const a=i/180*Math.PI*2;
     const rr=rad+Math.sin(a*3+T(.19)+n*.4)*S*.018+Math.sin(a*8-T(.11))*S*.006;
     const x=Math.cos(a+T(.025))*rr,y=Math.sin(a+T(.025))*rr*.72;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   ctx.strokeStyle=hs((law*52+n*7+T(.06)*25)%360,42,72,.025+.07*(1-q));
   ctx.lineWidth=.6+S*.001*(1-q);ctx.stroke();
 }
 ctx.restore();
 const vign=ctx.createRadialGradient(W*.5,H*.5,S*.16,W*.5,H*.5,Math.max(W,H)*.76);
 vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(.72,'rgba(0,0,0,.08)');vign.addColorStop(1,'rgba(0,0,0,.42)');
 ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;px+=(tx-px)*(1-Math.exp(-dt*2.2));py+=(ty-py)*(1-Math.exp(-dt*2.2));render();requestAnimationFrame(animate)}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;tx=x/innerWidth;ty=y/innerHeight;law=(law+1)%palettes.length;seed=Math.random()*1000;return true}
canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/innerWidth;ty=e.clientY/innerHeight}},{passive:true});
APKit.init({canvas:canvas,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){law=(law+1)%palettes.length;seed=Math.random()*1000}},
 {label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*1000;tx=ty=px=py=.5}}
]});
requestAnimationFrame(animate);
</script>
</body>
</html>
