<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e9}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*1000;
let law=0,px=.5,py=.5,tx=.5,ty=.5,last=performance.now();
const palettes=[
 ['#f7f3ea','#dce8e1','#e9d9d1','#c9d9e5','#d9d5c2'],
 ['#f7f1e8','#ead9d4','#ddd8e9','#d7e5df','#eadfbd'],
 ['#f4f3ed','#d7e8e5','#e4d8e4','#d6e1eb','#e8dfc8'],
 ['#f6f0e5','#dbe1d2','#e7d7c8','#d2dce5','#e4dfbf']
];
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}
function render(phase=null){
 const now=performance.now()/1000,t=phase===null?now:phase,p=palettes[law];
 const T=k=>APKit.T(k,phase,t),S=Math.min(W,H),u=T(.13);
 const breath=(Math.sin(T(.34))+1)/2;
 const drift=(Math.sin(T(.075)-.9)+1)/2;
 const glow=(Math.sin(T(.045)+1.7)+1)/2;
 const cx=W*(.5+(px-.5)*.10),cy=H*(.5+(py-.5)*.10);

 // Luminous ivory paper with extremely slow chromatic movement.
 const bg=ctx.createLinearGradient(0,0,W,H);
 bg.addColorStop(0,p[0]);
 bg.addColorStop(.28,hs(38+law*8,22,96,.9));
 bg.addColorStop(.50,p[1]);
 bg.addColorStop(.72,p[0]);
 bg.addColorStop(1,hs(205+law*9,18,96,.7));
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // Large soft pools of light create the airy photographic atmosphere.
 ctx.globalCompositeOperation='screen';
 for(let k=0;k<6;k++){
   const a=T(.025)+k*1.047;
   const gx=W*(.12+.16*k)+Math.sin(a+k)*W*.10;
   const gy=H*(.18+.13*Math.sin(k*1.7+a))+H*.20;
   const r=S*(.38+.08*glow);
   const g=ctx.createRadialGradient(gx,gy,0,gx,gy,r);
   const hue=(k*34+law*17+u*26)%360;
   g.addColorStop(0,hs(hue,34,84,.055+.025*glow));
   g.addColorStop(.45,hs(hue+18,25,88,.025));
   g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 }
 ctx.globalCompositeOperation='source-over';

 ctx.save();ctx.translate(cx,cy);

 // Main silk field: many extremely fine strands, with gentle non-uniform spacing.
 // The reference's beauty comes from the density and tiny color changes between lines.
 const bands=66;
 for(let b=0;b<bands;b++){
   const q=b/(bands-1),path=new Path2D();
   for(let i=0;i<=340;i++){
     const z=i/340;
     const x=(z-.5)*W*1.52;
     const broad=Math.sin(z*Math.PI*1.62+T(.055)+q*1.75);
     const secondary=Math.sin(z*Math.PI*3.22-T(.035)+q*1.23+seed*.0005);
     const micro=Math.sin(z*Math.PI*9.0+q*6.1+T(.10))*S*.0024;
     const y=(q-.5)*S*.84
       +broad*S*(.045+.026*breath)
       +secondary*S*(.006+.011*(1-q))
       +micro;
     const xx=x+Math.sin(z*Math.PI*2.05+q*3.1+T(.045))*S*.0045*(.5+breath);
     if(i===0)path.moveTo(xx,y);else path.lineTo(xx,y);
   }
   const hue=(law*38+q*88+u*32+Math.sin(q*Math.PI*2+T(.08))*8)%360;
   const sat=22+q*27;
   const light=49+q*31;
   const alpha=.18+.27*(1-q);
   ctx.strokeStyle=hs(hue,sat,light,alpha);
   ctx.lineWidth=.48+S*.00175*(1-q)*(1+.25*breath);
   ctx.stroke(path);
 }

 // Very faint companion strands widen the field toward the bottom, like threads seen through silk.
 for(let b=0;b<28;b++){
   const q=b/27,path=new Path2D();
   for(let i=0;i<=300;i++){
     const z=i/300,x=(z-.5)*W*1.48;
     const y=(q-.5)*S*.88+Math.sin(z*Math.PI*1.7+T(.048)+q*1.9)*S*.055+Math.sin(z*Math.PI*5.4+q)*S*.008;
     if(i===0)path.moveTo(x,y);else path.lineTo(x,y);
   }
   ctx.strokeStyle=hs((law*48+q*115+u*25)%360,28,68,.035+.045*(1-q));
   ctx.lineWidth=.35+S*.001*(1-q);ctx.stroke(path);
 }

 // Broad translucent ribbons: unlike the fine lines, these move at different rates and create depth.
 const ribbonColors=[p[2],p[3],p[4]];
 for(let r=0;r<5;r++){
   const rr=r/4;
   ctx.beginPath();
   for(let i=0;i<=300;i++){
     const z=i/300,x=(z-.5)*W*1.50;
     const y=(r-2)*S*.16
       +Math.sin(z*Math.PI*1.18+T(.038)+r*.82)*S*(.095+.018*breath)
       +Math.sin(z*Math.PI*2.65-T(.025)+r)*S*.025;
     if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   ctx.strokeStyle=ribbonColors[r%3]+'55';
   ctx.lineWidth=S*(.026+.010*breath)*(1+.12*Math.sin(r+T(.09)));
   ctx.filter='blur('+Math.max(4,S*.010)+'px)';ctx.stroke();ctx.filter='none';
 }

 // One delicate diagonal reflection crosses the field. It is intentionally pale, like light on glass.
 const beam=T(.055);
 ctx.beginPath();
 for(let i=0;i<=280;i++){
   const z=i/280,x=(z-.5)*W*1.55;
   const y=S*(.27*Math.sin(z*Math.PI*1.48+beam)-.035*Math.sin(z*Math.PI*4.1-beam));
   if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle=hs((law*57+u*50+18)%360,48,79,.19+.11*glow);
 ctx.lineWidth=Math.max(.8,S*.0020);ctx.stroke();

 // A broad diagonal wash gives the lower ribbons a soft, almost luminous photographic quality.
 ctx.globalCompositeOperation='screen';
 const wash=ctx.createLinearGradient(-W*.7,H*.45,W*.7,-H*.35);
 wash.addColorStop(0,'rgba(255,255,255,0)');
 wash.addColorStop(.38,hs((law*42+u*35)%360,30,88,.045+.025*glow));
 wash.addColorStop(.55,'rgba(255,255,255,.055)');
 wash.addColorStop(.72,'rgba(255,255,255,0)');
 ctx.fillStyle=wash;ctx.fillRect(-W,-H,W*2,H*2);
 ctx.globalCompositeOperation='source-over';
 ctx.restore();

 // Soft edge falloff only; keep the center bright and clean.
 const vign=ctx.createRadialGradient(W*.5,H*.48,S*.10,W*.5,H*.48,Math.max(W,H)*.82);
 vign.addColorStop(0,'rgba(255,255,255,0)');
 vign.addColorStop(.76,'rgba(0,0,0,.006)');
 vign.addColorStop(1,'rgba(0,0,0,.045)');
 ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;px+=(tx-px)*(1-Math.exp(-dt*2.1));py+=(ty-py)*(1-Math.exp(-dt*2.1));render();requestAnimationFrame(animate)}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;tx=x/innerWidth;ty=y/innerHeight;law=(law+1)%palettes.length;seed=Math.random()*1000;return true}
canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
canvas.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/innerWidth;ty=e.clientY/innerHeight}},{passive:true});
APKit.init({canvas:canvas,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){law=(law+1)%palettes.length;seed=Math.random()*1000}},
 {label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*1000;tx=ty=px=py=.5}}
]});
requestAnimationFrame(animate);
</script>
</body>
</html>
