<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC FOLD</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* CHROMATIC FOLD — 軽量化再設計。色の面が折れ、触れた場所が世界の座標を強く引き寄せる。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL2 unavailable');
const V=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision mediump float;
out vec4 o;
uniform vec2 r;
uniform float t,seed;
uniform vec4 touch[4];
uniform int n;

vec3 palette(float h){
  return .5+.5*cos(6.2831853*(h+vec3(0.0,.27,.61)));
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
  float spin=.12*sin(t*.25);
  mat2 R=mat2(cos(spin),-sin(spin),sin(spin),cos(spin));
  p=R*p;

  /* 軽い自己相似折り */
  for(int i=0;i<4;i++){
    p=abs(p)-vec2(.42,.31);
    float a=.20*sin(seed+float(i)*1.73+t*.18);
    p=mat2(cos(a),-sin(a),sin(a),cos(a))*p;
    p*=1.48;
  }

  /* 最大4点。expを使わず平方距離だけで局所変形 */
  float pressure=0.;
  for(int i=0;i<4;i++){
    if(i>=n)break;
    vec2 d=p-touch[i].xy;
    float q=dot(d,d);
    float g=touch[i].z/max(.018,q);
    g=clamp(g,0.,2.5);
    float ca=cos(touch[i].w),sa=sin(touch[i].w);
    vec2 bend=vec2(ca*d.x-sa*d.y,sa*d.x+ca*d.y);
    p+=bend*g*.055;
    pressure+=g*.12;
  }

  float v=length(p);
  v+=.12*sin(p.x*7.0+p.y*5.0-t*.45);
  v+=.055*sin(p.x*17.0-p.y*13.0+t*.3);

  float bands=sin(v*19.0-t*.35);
  float region=fract(floor((p.x+p.y)*3.2+seed)*.173+floor((p.x-p.y)*2.1)*.071);
  float hue=v*.13+region*.92+bands*.035+pressure*.18+seed*.011;

  vec3 col=palette(hue);
  col=mix(col,palette(hue+.19),smoothstep(.25,.95,abs(bands)));
  col+=vec3(1.)*pow(max(0.,1.-abs(bands)),7.)*.22;

  float vign=1.-.16*length(gl_FragCoord.xy/r-.5);
  o=vec4(pow(max(col*vign,0.),vec3(.86)),1.);
}`;

function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;
}
const pr=gl.createProgram();
gl.attachShader(pr,shader(gl.VERTEX_SHADER,V));
gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,F));
gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));

const U={};
for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''));
}
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,D=1,seed=Math.random()*100,points=[],paused=false;
function resize(){
  W=innerWidth;H=innerHeight;
  D=Math.min(1.5,devicePixelRatio||1);
  c.width=Math.floor(W*D);c.height=Math.floor(H*D);
}
addEventListener('resize',resize);resize();

function point(x,y){
  const s=Math.min(W,H);
  return[(x-W/2)/s,(H/2-y)/s];
}
function draw(ph){
  gl.useProgram(pr);
  gl.viewport(0,0,c.width,c.height);
  gl.uniform2f(U.r,c.width,c.height);
  gl.uniform1f(U.t,ph);
  gl.uniform1f(U.seed,seed);
  const a=new Float32Array(16);
  points.forEach((q,i)=>a.set(q,i*4));
  gl.uniform4fv(U.touch,a);
  gl.uniform1i(U.n,points.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  const q=point(e.clientX,e.clientY);
  points.push([q[0],q[1],.65+.35*Math.random(),Math.random()*6.283]);
  if(points.length>4)points.shift();
});
function loop(now){if(!paused)draw(now*.00032);requestAnimationFrame(loop)}requestAnimationFrame(loop);

APKit.init({
  canvas:c,gifName:'chromatic-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},
  buttons:[
    {label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*100}},
    {label:'↻',name:'reset',onClick:()=>{points=[];seed=Math.random()*100}}
  ]
});
</script></body></html>
