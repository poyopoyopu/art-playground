<!doctype html>
<!-- CAMPFIRE — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/11/01 試作(v2: 炭の変化・陽炎を追加)。
     お題: おっちゃんが選んだ「焚き火」(リアルに・音付き・炭の変化も)。10/30依頼の新作題材3候補から選択。
     世界のルール: 炎は「上」へ昇る。触った場所だけ、その「上」の向きが書き換わる。
       タップ=その場所の上が「下」になる(炎が垂れ、火の粉が雨のように落ちる) / なぞる=なぞった向きが上になる / 押し続ける=上の向きがゆっくり回り、炎が渦を巻く。
       向きの違う場所の境目には、昇る力が打ち消し合う「無重力の淀み」ができる。離すと数秒かけて元の世界に戻る(複数の指も可)。風が当たった炭は明るく息をする。
       触らなくても、燃え続ける焚き火として成立する。
     炭の変化: 薪は約100秒かけて、生木(樹皮) → 黒く焦げてひび割れ、割れ目が赤く光る → 細く縮んで白い灰をかぶる → 熾火(灰をかぶった赤い炭の床)へ進む。
       炎は徐々に小さくなり、途中で薪が崩れ落ちる瞬間がある(火の粉と音)。✦で新しい薪をくべると、また生木から始まる。
       URLに ?burn=0〜1 を付けると、その段階(0=生木、1=熾火)から始まる(確認用)。
     音: WebAudioで生成(音源ファイルなし)。炎のうなり・パチパチ・火の粉の爆ぜる音・触った場所の風音・薪が崩れる音。最初に画面を触ると鳴り始める(ブラウザの決まり)。ドックの🔊/🔇で切替。
       iPhoneは本体の消音スイッチ(サイレントモード)がオンだと鳴らない。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>CAMPFIRE — 触れた所だけ、炎の「上」が変わる</title>
<script src="../ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04060c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;text-align:center;pointer-events:none;color:#ffe6c4;font:500 10px/1.9 ui-monospace,monospace;letter-spacing:.2em;text-shadow:0 2px 14px #000c;transition:opacity 1.8s}
#hint b{display:block;font:600 12px/1.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em}
#hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><b>触れた所だけ、炎の「上」が変わる</b>タップ=逆さ · なぞる=その向き · 押し続ける=回る<br>薪は少しずつ炭になる · ✦で新しい薪<br>触ると音が出ます(🔇で切替)</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint');
var TAU=Math.PI*2;
var W=1,H=1,DPR=1,U=1,FX=0,FY=0,HY=0;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}
function gs(){return (Math.random()+Math.random()+Math.random()-1.5)/0.75}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- ノイズ(炎の揺らぎ・乱流・陽炎) ---------- */
var PERM=new Uint8Array(512);
(function(){var r=mulberry(1234),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=(r()*(i+1))|0;t=p[i];p[i]=p[j];p[j]=t}for(i=0;i<512;i++)PERM[i]=p[i&255]})();
function hs(i,j,k){return PERM[(PERM[(PERM[i&255]+j)&255]+k)&255]/127.5-1}
function nz(x,y,z){
  var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,
      u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  var a=lerp(hs(xi,yi,zi),hs(xi+1,yi,zi),u),b=lerp(hs(xi,yi+1,zi),hs(xi+1,yi+1,zi),u),
      c=lerp(hs(xi,yi,zi+1),hs(xi+1,yi,zi+1),u),d=lerp(hs(xi,yi+1,zi+1),hs(xi+1,yi+1,zi+1),u);
  return lerp(lerp(a,b,v),lerp(c,d,v),w);
}

/* ---------- 色(黒体放射ふう: 白黄 → 橙 → 赤 → 暗赤) ---------- */
var RAMP=[[0,[40,8,4]],[0.2,[150,34,8]],[0.4,[232,92,18]],[0.6,[255,158,48]],[0.8,[255,214,118]],[1,[255,246,214]]];
function ramp(t){
  t=clamp(t,0,1);
  for(var i=1;i<RAMP.length;i++){
    if(t<=RAMP[i][0]){var a=RAMP[i-1],b=RAMP[i],f=(t-a[0])/(b[0]-a[0]);
      return [a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f]}
  }
  return RAMP[RAMP.length-1][1];
}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}
function rgbs(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'}
function mixc(a,b,m){return [lerp(a[0],b[0],m),lerp(a[1],b[1],m),lerp(a[2],b[2],m)]}
var NSP=28,SPR=[],NSM=8,SMK=[],BLUE=null;
function buildSprites(){
  var i,c,g,col,gr;
  for(i=0;i<NSP;i++){
    c=document.createElement('canvas');c.width=c.height=64;g=c.getContext('2d');col=ramp(i/(NSP-1));
    gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,rgba(col,1));gr.addColorStop(0.25,rgba(col,0.6));gr.addColorStop(0.6,rgba(col,0.18));gr.addColorStop(1,rgba(col,0));
    g.fillStyle=gr;g.fillRect(0,0,64,64);SPR.push(c);
  }
  for(i=0;i<NSM;i++){
    c=document.createElement('canvas');c.width=c.height=64;g=c.getContext('2d');
    var f=i/(NSM-1);col=[lerp(62,176,f),lerp(66,96,f),lerp(78,52,f)];
    gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,rgba(col,1));gr.addColorStop(0.5,rgba(col,0.45));gr.addColorStop(1,rgba(col,0));
    g.fillStyle=gr;g.fillRect(0,0,64,64);SMK.push(c);
  }
  c=document.createElement('canvas');c.width=c.height=64;g=c.getContext('2d');col=[70,120,255];
  gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,rgba(col,1));gr.addColorStop(0.35,rgba(col,0.5));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(0,0,64,64);BLUE=c;
}
buildSprites();

/* ---------- 世界の「上」: 触った場所だけ書き換わる向きの場 ---------- */
var patches=[];
var UX=0,UY=-1,UW=0;
function upAt(x,y){
  var ux=0,uy=-1,mw=0,i,p,dx,dy,d2,w;
  for(i=0;i<patches.length;i++){
    p=patches[i];dx=x-p.x;dy=y-p.y;d2=(dx*dx+dy*dy)/(p.r*p.r);
    if(d2>5)continue;
    w=p.s*Math.exp(-d2*1.15);if(w<0.004)continue;if(w>mw)mw=w;
    ux=ux*(1-w)+Math.cos(p.a)*w;uy=uy*(1-w)+Math.sin(p.a)*w;
  }
  UX=ux;UY=uy;UW=mw; /* 長さは0〜1のまま: 向きが打ち消し合う所は昇る力も弱い(無重力の淀み) */
}

/* ---------- 燃え進み(薪が炭になる) ---------- */
var B=0,burnRate=1/100,settleBoost=0,settleTarget=0,fastRebuild=0,rbT=0,ready=false,bedG=0.3,bedP=0.25;
function fuelCurve(b){return 1.12*(1-0.7*sstep(0.3,1,b))}
function heatOf(b){return sstep(0.15,0.5,b)*(1-0.45*sstep(0.82,1,b))}

/* ---------- 粒子 ---------- */
var NF=1000,NM=170,NK=150;
var FW=new Float32Array(NF),FPX=new Float32Array(NF),FPY=new Float32Array(NF),FVX=new Float32Array(NF),FVY=new Float32Array(NF),FA=new Float32Array(NF),FL=new Float32Array(NF),FSZ=new Float32Array(NF),FAX=new Float32Array(NF),FSD=new Float32Array(NF);
var MPX=new Float32Array(NM),MPY=new Float32Array(NM),MVX=new Float32Array(NM),MVY=new Float32Array(NM),MA=new Float32Array(NM),ML=new Float32Array(NM),MSZ=new Float32Array(NM),MSD=new Float32Array(NM);
var KPX=new Float32Array(NK),KPY=new Float32Array(NK),KVX=new Float32Array(NK),KVY=new Float32Array(NK),KA=new Float32Array(NK),KL=new Float32Array(NK),KSD=new Float32Array(NK);
var pf={v:0},pm={v:0},pk={v:0};
function slot(L,n,ptr){for(var j=0;j<n;j++){var i=(ptr.v+j)%n;if(L[i]<=0){ptr.v=(i+1)%n;return i}}return -1}

var T=0,fuelBase=1,flare=0,flick=1,inten=0.7,wind=0,emitAcc=0,lickAcc=0,smokeAcc=0,sparkAcc=0,fuel=1;
var NT=3,tC=[0,0,0],tI=[0.7,0.7,0.7],tF=[1,1,1],tw=2.1;
var layoutSeed=20261101;
var LOGS=[],CH=[],COALS=[],STONES=[],CRKW=[],EMBW=[];

function updateTongues(){
  var k;tw=0;
  for(k=0;k<NT;k++){
    tC[k]=((k-1)*0.05+nz(T*0.45+k*11.3,3.1,0.5)*0.07)*U;
    tI[k]=clamp(0.78+0.45*nz(T*(0.8+k*0.27)+k*5.7,9.2,1.7),0.42,1.2);
    tF[k]=0.78+0.34*nz(T*3.1+k*4.2,5.5,0.3); /* 舌ごとの、素早い伸び縮み */
    tw+=tI[k];
  }
  wind=nz(T*0.3,50,2);
  fuel=fuelBase*fuelCurve(B)*(0.92+0.12*nz(T*0.12,8,3))+flare;
  flick=clamp(0.78+0.2*nz(T*9,1,1)+0.12*nz(T*23,2,2)+0.1*(tw/NT-0.6),0.35,1.2);
  inten=clamp(tw/NT/0.8,0,1.2)*clamp(fuel,0.3,1.5);
  bedG=(0.3+0.7*sstep(0.18,0.72,B))*(1-0.22*sstep(0.92,1,B));
  bedP=0.25+0.75*sstep(0.1,0.7,B);
}

function emitFlame(lick){
  var i=slot(FL,NF,pf);if(i<0)return;
  var r=Math.random()*tw,k=0;
  for(k=0;k<NT-1;k++){if(r<tI[k])break;r-=tI[k]}
  var it=tI[k],spread=U*0.065*(0.55+Math.random()*0.7)*clamp(0.5+0.6*fuel,0.55,1.1);
  FPX[i]=FX+tC[k]+gs()*spread*0.55;
  FPY[i]=FY-U*0.01-Math.random()*U*0.03;
  FVX[i]=(Math.random()-0.5)*U*0.05;FVY[i]=-U*(0.12+Math.random()*0.18)*it*(lick?1.7:1);
  FAX[i]=FX+tC[k]*0.5;
  FL[i]=(0.6+Math.random()*0.9)*fuel*(0.55+0.65*it)*tF[k]*(lick?0.8:1);
  FA[i]=0;FSZ[i]=U*(0.026+Math.random()*0.024)*(lick?0.62:1);FSD[i]=Math.random();
}
function emitSmoke(){
  var i=slot(ML,NM,pm);if(i<0)return;
  var hf=clamp(fuel,0.3,1.4);
  MPX[i]=FX+tC[1]*0.6+gs()*U*0.03;MPY[i]=FY-U*(0.06+0.24*hf+Math.random()*0.16*hf);
  MVX[i]=(Math.random()-0.5)*U*0.05;MVY[i]=-U*(0.08+Math.random()*0.06);
  ML[i]=3+Math.random()*2.6;MA[i]=0;MSZ[i]=U*(0.03+Math.random()*0.03);MSD[i]=Math.random();
}
function spawnSpark(x,y,vx,vy,life){
  var i=slot(KL,NK,pk);if(i<0)return;
  KPX[i]=x;KPY[i]=y;KVX[i]=vx;KVY[i]=vy;KL[i]=life;KA[i]=0;KSD[i]=Math.random();
}
function emberPoint(){
  if(B>0.5&&COALS.length&&Math.random()<0.6){var c=COALS[(Math.random()*COALS.length)|0];if(c.thr<=bedP)return [c.x,c.y]}
  if(EMBW.length&&Math.random()<0.85){var e=EMBW[(Math.random()*EMBW.length)|0];return [e.x,e.y]}
  return [FX+gs()*U*0.05,FY-U*0.03];
}
function sparkBurst(n,power){
  var e=emberPoint(),i;
  for(i=0;i<n;i++){
    spawnSpark(e[0]+gs()*U*0.01,e[1]-U*0.01,(Math.random()-0.5)*U*0.5*power,-U*(0.22+Math.random()*0.55)*power,1.3+Math.random()*1.9);
  }
}

function updateParticles(dt){
  var i,a,Tn,bu,tu,nx,ny,ax,ay,B_=U*2.0,kN=1/(U*0.18),drag;
  /* 炎 */
  emitAcc+=680*(0.55+0.6*tw/NT)*fuel*dt;
  while(emitAcc>=1){emitAcc--;emitFlame(false)}
  lickAcc+=3.2*inten*dt; /* 舌の先が千切れて飛ぶ炎 */
  while(lickAcc>=1){lickAcc--;emitFlame(true)}
  drag=Math.exp(-2.3*dt);
  for(i=0;i<NF;i++){
    if(FL[i]<=0)continue;
    FA[i]+=dt;if(FA[i]>=FL[i]){FL[i]=0;continue}
    a=FA[i]/FL[i];Tn=Math.pow(1-a,1.25);
    upAt(FPX[i],FPY[i]);FW[i]=UW;
    bu=B_*(0.25+1.0*Tn);ax=UX*bu;ay=UY*bu;
    tu=U*1.4*(0.3+0.7*a);
    nx=nz(FPX[i]*kN,FPY[i]*kN,T*1.4+FSD[i]*0.6);ny=nz(FPX[i]*kN+31.4,FPY[i]*kN+7.7,T*1.4);
    ax+=nx*tu+wind*U*0.45;ay+=ny*tu*0.5;
    ax+=-(FPX[i]-FAX[i])*(4.2*(0.3+a))*(1-UW); /* 炎が上で細くなる。向きが書き換わった所では効かせない */
    FVX[i]=(FVX[i]+ax*dt)*drag;FVY[i]=(FVY[i]+ay*dt)*drag;
    FPX[i]+=FVX[i]*dt;FPY[i]+=FVY[i]*dt;
  }
  /* 煙(終盤の熾火は、薄い煙が細く立ちのぼる) */
  smokeAcc+=(8*clamp(fuel,0.3,1.4)+6*sstep(0.6,1,B))*dt;
  while(smokeAcc>=1){smokeAcc--;emitSmoke()}
  drag=Math.exp(-1.0*dt);
  for(i=0;i<NM;i++){
    if(ML[i]<=0)continue;
    MA[i]+=dt;if(MA[i]>=ML[i]){ML[i]=0;continue}
    upAt(MPX[i],MPY[i]);
    ax=UX*U*0.28;ay=UY*U*0.28;
    nx=nz(MPX[i]*kN*0.7,MPY[i]*kN*0.7,T*0.6+MSD[i]);ny=nz(MPX[i]*kN*0.7+9.1,MPY[i]*kN*0.7,T*0.6);
    ax+=nx*U*0.35+wind*U*0.3;ay+=ny*U*0.2;
    MVX[i]=(MVX[i]+ax*dt)*drag;MVY[i]=(MVY[i]+ay*dt)*drag;
    MPX[i]+=MVX[i]*dt;MPY[i]+=MVY[i]*dt;
  }
  /* 火の粉 */
  sparkAcc+=(3+11*inten)*dt;
  while(sparkAcc>=1){sparkAcc--;var e=emberPoint();
    spawnSpark(e[0]+gs()*U*0.02,e[1]-U*(0.02+Math.random()*0.15),(Math.random()-0.5)*U*0.25,-U*(0.2+Math.random()*0.35),1.5+Math.random()*1.8)}
  drag=Math.exp(-0.9*dt);
  for(i=0;i<NK;i++){
    if(KL[i]<=0)continue;
    KA[i]+=dt;if(KA[i]>=KL[i]){KL[i]=0;continue}
    upAt(KPX[i],KPY[i]);
    ax=UX*U*0.34;ay=UY*U*0.34;
    nx=nz(KPX[i]*kN*1.3,KPY[i]*kN*1.3,T*1.1+KSD[i]*9);ny=nz(KPX[i]*kN*1.3+5.3,KPY[i]*kN*1.3,T*1.1+KSD[i]*9);
    ax+=nx*U*0.9+wind*U*0.4;ay+=ny*U*0.6;
    KVX[i]=(KVX[i]+ax*dt)*drag;KVY[i]=(KVY[i]+ay*dt)*drag;
    KPX[i]+=KVX[i]*dt;KPY[i]+=KVY[i]*dt;
    if(KPY[i]>FY+U*0.07&&KVY[i]>0){KL[i]=Math.min(KL[i],KA[i]+0.22);KVY[i]=0;KVX[i]*=0.3} /* 逆さの世界で落ちた火の粉は地面で消える */
  }
}

/* ---------- 触る ---------- */
var held={};
function addPatch(id,x,y){
  if(patches.length>=6){var j=0,k;for(k=0;k<patches.length;k++)if(!patches[k].held){j=k;break}patches.splice(j,1)}
  var p={id:id,x:x,y:y,a:Math.PI/2,s:0,r:U*0.26,hold:0,held:true,lastMove:-9,dragged:false};
  patches.push(p);held[id]=p;return p;
}
function updatePatches(dt){
  for(var i=patches.length-1;i>=0;i--){
    var p=patches[i];
    if(p.held){
      p.s=Math.min(1,p.s+dt*4);p.hold+=dt;p.r=U*(0.26+0.12*Math.min(1,p.hold/1.6));
      if(T-p.lastMove>(p.dragged?0.6:0.14))p.a+=dt*1.7; /* 動かさず押し続けると、上の向きが回る(なぞった直後は、狙った向きを保つため0.6秒待つ) */
    }else{
      p.s*=Math.exp(-dt/2.6);p.s-=dt*0.02;
      if(p.s<0.02){patches.splice(i,1)}
    }
  }
}
function angDiff(a,b){var d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d}
canvas.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  hint.classList.add('off');
  unlockAudio();
  addPatch(e.pointerId,e.clientX,e.clientY);
  thump(e.clientX/W*2-1,false);
},{passive:false});
canvas.addEventListener('pointermove',function(e){
  var p=held[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(Math.hypot(dx,dy)>2){
    var tgt=Math.atan2(dy,dx);p.a+=angDiff(p.a,tgt)*0.3;p.lastMove=T;p.dragged=true;
  }
  p.x=e.clientX;p.y=e.clientY;
});
function release(e){
  var p=held[e.pointerId];if(p){p.held=false;delete held[e.pointerId]}
  if(e.type==='pointerup')unlockAudio();
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

/* ---------- 夜景(静止した背景) と 薪・炭(燃え進みに応じて描き直す層) ---------- */
var skyC,landC,logsC,logsX,frontC,litC,litX,shC=null,shX=null,shRect=null;
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU)}
function gaussR(rnd){return (rnd()+rnd()+rnd()-1.5)/0.75}

function drawSky(g,rnd){
  var gr=g.createLinearGradient(0,0,0,HY);

/* 陽炎: 炎の上の景色(木・星)を、細い横帯ごとにゆらゆらずらす */
function shimmer(g){
  var amp=1.5*clamp(inten,0,1)*(0.35+0.65*clamp(fuel,0,1));
  if(amp<0.12||!shRect)return;
  shX.setTransform(1,0,0,1,0,0);
  shX.drawImage(canvas,Math.round(shRect.x*DPR),Math.round(shRect.y*DPR),shC.width,shC.height,0,0,shC.width,shC.height);
  var hs=3,y,u,dx,sy,sh;
  for(y=0;y<shRect.h;y+=hs){
    u=y/shRect.h;
    dx=amp*u*(Math.sin(y*0.11-T*8+nz(T*1.3,y*0.04,1)*4)+0.6*Math.sin(y*0.23+T*5.3));
    sy=Math.round(y*DPR);sh=Math.min(Math.round(hs*DPR),shC.height-sy);if(sh<=0)break;
    g.drawImage(shC,0,sy,shC.width,sh,shRect.x+dx,shRect.y+y,shRect.w,sh/DPR);
  }
}

  var base=Math.max(clamp(fuel,0.3,1.3),0.9*bedG);
  /* 熾火の床・地面の照り返し */
  g.globalAlpha=0.3*flick*base;g.drawImage(SPR[11],FX-U*0.5,FY-U*0.1,U*1.0,U*0.22);
  g.globalAlpha=0.13*flick*base;g.drawImage(SPR[9],FX-U*0.8,FY-U*0.18,U*1.6,U*0.46);
  /* 炎の根元の青い光(木が燃え始める所) */

  for(i=0;i<EMBW.length;i++){e=EMBW[i];var eb=LOGS[e.li].b;
    al=0.5+0.5*Math.sin(T*e.sp+e.ph)*Math.sin(T*e.sp*0.37+e.ph);
    g.globalAlpha=(0.2+0.5*al)*flick*clamp(fuel,0.3,1.3)*(1-0.7*sstep(0.5,1,eb));
    g.drawImage(SPR[10+((al*6)|0)],e.x-e.r*2,e.y-e.r*2,e.r*4,e.r*4)}

  /* 煙 */
  g.globalCompositeOperation='source-over';
  for(i=0;i<NM;i++){
    if(ML[i]<=0)continue;
    a=MA[i]/ML[i];
    r=MSZ[i]*(1+a*4.2);
    var dist=Math.hypot(MPX[i]-FX,MPY[i]-(FY-U*0.2))/U,lit=clamp(1-dist/0.95,0,1);lit=lit*lit;
    al=Math.sin(Math.PI*Math.pow(a,0.7))*0.05*(0.12+0.88*lit); /* 夜の煙は、焚き火の光が届く所だけ見える */
    g.globalAlpha=al;g.drawImage(SMK[(lit*(NSM-1)+0.5)|0],MPX[i]-r,MPY[i]-r,r*2,r*2);
  }

  /* 炎 */
  g.globalCompositeOperation='lighter';
  for(i=0;i<NF;i++){
    if(FL[i]<=0)continue;
    a=FA[i]/FL[i];Tn=0.8*Math.pow(1-a,1.25);
    r=FSZ[i]*(0.35+0.95*Math.pow(1-a,0.55));
    al=0.072*(0.35+0.75*Tn/0.8)*(a>0.78?(1-a)/0.22:1)*Math.min(1,a/0.06+0.25);
    g.globalAlpha=al*(0.85+0.3*FSD[i])*(1-0.5*FW[i]); /* 向きを書き換えた所で炎が潰れても、粒の重なりで真っ白に飽和させない */
    g.drawImage(SPR[(Tn*(NSP-1)+0.5)|0],FPX[i]-r,FPY[i]-r,r*2,r*2);
  }
  /* 火の粉 */
  g.lineCap='round';
  for(i=0;i<NK;i++){
    if(KL[i]<=0)continue;
    a=KA[i]/KL[i];Tn=Math.pow(1-a,0.8);
    var fl=0.65+0.35*Math.random();
    idx=(clamp(Tn*0.95,0,1)*(NSP-1)+0.5)|0;
    g.globalAlpha=clamp(Tn*1.1,0,1)*fl;
    var c2=ramp(Tn*0.95);
    g.strokeStyle=rgbs(c2);g.lineWidth=0.8+1.1*KSD[i]+0.8*Tn;
    g.beginPath();g.moveTo(KPX[i]-KVX[i]*0.03,KPY[i]-KVY[i]*0.03);g.lineTo(KPX[i],KPY[i]);g.stroke();
    if(Tn>0.45){g.globalAlpha=0.35*Tn*fl;g.drawImage(SPR[idx],KPX[i]-5,KPY[i]-5,10,10)}
  }
  g.globalAlpha=1;
  drawLaws(g);
  g.globalCompositeOperation='source-over';
}
/* 書き換えた「上」の可視化: ごく薄いレンズ・点線の輪・向きを示す小さな矢印 */
function drawLaws(g){
  var i,k,p,s,dx,dy,len,px,py,ang;
  g.globalCompositeOperation='lighter';g.lineCap='round';
  for(i=0;i<patches.length;i++){
    p=patches[i];s=p.s;if(s<0.03)continue;
    var gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    gr.addColorStop(0,'rgba(255,170,90,'+(0.07*s)+')');gr.addColorStop(0.7,'rgba(255,150,70,'+(0.03*s)+')');gr.addColorStop(1,'rgba(255,140,60,0)');
    g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();
    g.strokeStyle='rgba(255,205,150,'+(0.17*s)+')';g.lineWidth=1;g.setLineDash([2,7]);g.lineDashOffset=-T*10;
    g.beginPath();g.arc(p.x,p.y,p.r*0.78,0,TAU);g.stroke();g.setLineDash([]);
    dx=Math.cos(p.a);dy=Math.sin(p.a);len=p.r*0.13;
    g.strokeStyle='rgba(255,215,170,'+(0.2*s)+')';g.lineWidth=1.1;
    for(k=0;k<7;k++){
      ang=k===0?0:(k-1)/6*TAU;px=k===0?p.x:p.x+Math.cos(ang)*p.r*0.42;py=k===0?p.y:p.y+Math.sin(ang)*p.r*0.42;
      g.beginPath();g.moveTo(px-dx*len,py-dy*len);g.lineTo(px+dx*len,py+dy*len);
      g.moveTo(px+dx*len,py+dy*len);g.lineTo(px+dx*len-dx*len*0.55+dy*len*0.4,py+dy*len-dy*len*0.55-dx*len*0.4);
      g.moveTo(px+dx*len,py+dy*len);g.lineTo(px+dx*len-dx*len*0.55-dy*len*0.4,py+dy*len-dy*len*0.55+dx*len*0.4);
      g.stroke();
    }
  }
}

/* ---------- 音(WebAudioで生成。音源ファイルなし) ---------- */
var AC=null,master=null,roarG=null,roarF=null,bodyG=null,hissG=null,windG=null,windF=null,windPan=null,whiteBuf=null,soundOn=false,autoTried=false,surge=0,crackActive=0;
function noiseBuf(ac,secs,brown){
  var f=(ac.sampleRate*0.25)|0,n=(ac.sampleRate*secs)|0,tmp=new Float32Array(n+f),last=0,i;
  for(i=0;i<n+f;i++){var w=Math.random()*2-1;if(brown){last=(last+0.02*w)/1.02;tmp[i]=last*3.5}else tmp[i]=w}
  var b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(i=0;i<n;i++){d[i]=i<f?tmp[i]*(i/f)+tmp[n+i]*(1-i/f):tmp[i]}
  return b;
}
function loopSrc(ac,buf){var s=ac.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*buf.duration*0.9);return s}
function audioInit(){
  if(AC)return true;
  var Ctor=window.AudioContext||window.webkitAudioContext;if(!Ctor)return false;
  try{AC=new Ctor()}catch(e){AC=null;return false}
  var ac=AC;
  master=ac.createGain();master.gain.value=0;
  var comp=ac.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=24;comp.ratio.value=3.5;comp.attack.value=0.004;comp.release.value=0.2;
  master.connect(comp);comp.connect(ac.destination);
  var brown=noiseBuf(ac,4,true);whiteBuf=noiseBuf(ac,1.5,false);
  var s1=loopSrc(ac,brown),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;lp.Q.value=0.5;roarF=lp;
  roarG=ac.createGain();roarG.gain.value=0;s1.connect(lp);lp.connect(roarG);roarG.connect(master);
  var s2=loopSrc(ac,brown),bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=0.7;
  bodyG=ac.createGain();bodyG.gain.value=0;s2.connect(bp);bp.connect(bodyG);bodyG.connect(master);
  var s3=loopSrc(ac,whiteBuf),hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=5200;
  hissG=ac.createGain();hissG.gain.value=0;s3.connect(hp);hp.connect(hissG);hissG.connect(master);
  var s4=loopSrc(ac,brown),wb=ac.createBiquadFilter();wb.type='bandpass';wb.frequency.value=600;wb.Q.value=1.1;windF=wb;
  windG=ac.createGain();windG.gain.value=0;s4.connect(wb);wb.connect(windG);
  if(ac.createStereoPanner){windPan=ac.createStereoPanner();windG.connect(windPan);windPan.connect(master)}else windG.connect(master);
  try{var sb=ac.createBuffer(1,1,22050),ss=ac.createBufferSource();ss.buffer=sb;ss.connect(ac.destination);ss.start(0)}catch(_){} /* iOS用: 無音を一瞬鳴らして音の出口を開ける */
  return true;
}
function setSound(on){
  soundOn=on;
  var b=document.querySelector('.apk-btn[aria-label="sound"]');if(b)b.textContent=on?'🔊':'🔇';
  if(AC){var t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(on?0.9:0,t,0.08);if(on&&AC.state!=='running')AC.resume()}
}
function unlockAudio(){
  if(!autoTried){autoTried=true;if(audioInit())setSound(true)}
  if(AC&&AC.state!=='running'&&soundOn)AC.resume();
}
function toggleSound(){
  autoTried=true;
  if(!soundOn){
    if(!audioInit()){if(window.APKit&&APKit.toast)APKit.toast('この端末では音を出せません');return}
    if(AC.state!=='running')AC.resume();setSound(true);
  }else setSound(false);
}
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('visibilitychange',function(){
  if(!AC)return;
  if(document.hidden)AC.suspend();else if(soundOn)AC.resume();
});
function panOf(x){return clamp(x/W*2-1,-1,1)}
/* パチッ: 短いノイズを帯域で切り出した1発。kind 0=小さな爆ぜ 1=中 2=大きな破裂 */
function crack(kind,pan,delay){
  if(!AC||!soundOn||crackActive>14)return;
  var ac=AC,when=ac.currentTime+(delay||0)+0.005,src=ac.createBufferSource();
  src.buffer=whiteBuf;
  var f,q,dur,vol;
  if(kind===0){f=3000+Math.random()*4500;q=1.2+Math.random()*2;dur=0.008+Math.random()*0.02;vol=0.1+Math.random()*0.1}
  else if(kind===1){f=1500+Math.random()*2200;q=0.9+Math.random()*1.2;dur=0.03+Math.random()*0.04;vol=0.22+Math.random()*0.16}
  else{f=800+Math.random()*1300;q=0.7+Math.random();dur=0.07+Math.random()*0.07;vol=0.5+Math.random()*0.25}
  var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  var g=ac.createGain();g.gain.setValueAtTime(0.0001,when);g.gain.linearRampToValueAtTime(vol,when+0.0015);g.gain.exponentialRampToValueAtTime(0.0008,when+dur);
  src.connect(bp);bp.connect(g);
  if(ac.createStereoPanner){var p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(master)}else g.connect(master);
  crackActive++;src.onended=function(){crackActive--};
  src.start(when,Math.random()*1.2,dur+0.05);src.stop(when+dur+0.06);
}
/* ボッ(触った瞬間の低い風の塊) / ドサッ(薪が崩れる。低く長く、ノイズが混じる) */
function thump(pan,collapse){
  if(!AC||!soundOn)return;
  var ac=AC,t=ac.currentTime,dur=collapse?0.6:0.34;
  var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(collapse?62:95,t);o.frequency.exponentialRampToValueAtTime(collapse?30:38,t+dur*0.85);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(collapse?0.42:0.32,t+0.012);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);
  if(collapse&&whiteBuf){
    var ns=ac.createBufferSource();ns.buffer=whiteBuf;var lp2=ac.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=260;
    var ng=ac.createGain();ng.gain.setValueAtTime(0.0001,t);ng.gain.linearRampToValueAtTime(0.5,t+0.01);ng.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    ns.connect(lp2);lp2.connect(ng);ng.connect(master);ns.start(t,Math.random()*0.8,0.55);ns.stop(t+0.6);
  }
  if(ac.createStereoPanner){var p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(master)}else g.connect(master);
  o.start(t);o.stop(t+dur+0.06);
  if(!collapse)surge=1;
}
var popAcc=0;
function popUpdate(dt){
  popAcc+=(0.8+5.2*inten+5*flare)*dt;
  while(popAcc>=1){popAcc--;
    var r=Math.random(),kind=r<0.72?0:r<0.95?1:2,e=emberPoint(),pan=panOf(e[0]);
    sparkBurst(kind===2?(10+(Math.random()*8|0)):kind===1?(2+(Math.random()*3|0)):(Math.random()<0.5?1:0),kind===2?1.25:0.8);
    crack(kind,pan,0);
    if(kind<2&&Math.random()<0.3){var n=1+(Math.random()*3|0),j;for(j=0;j<n;j++)crack(0,pan+(Math.random()-0.5)*0.2,0.02+Math.random()*0.1)}
  }
}
function audioUpdate(dt){
  surge*=Math.exp(-dt/0.5);
  if(!AC||!soundOn)return;
  var t=AC.currentTime,sMax=0,ang=0,px=W/2,i,p;
  for(i=0;i<patches.length;i++){p=patches[i];if(p.s>sMax){sMax=p.s;ang=p.a;px=p.x}}
  var I=clamp(inten,0,1.3),fl=0.6+0.8*(0.5+0.5*nz(T*5,4,4));
  roarG.gain.setTargetAtTime(0.06+0.2*I+0.07*flare+0.2*surge,t,0.08);
  roarF.frequency.setTargetAtTime((220+420*I)*(1-0.45*sMax)+160*surge,t,0.1);
  bodyG.gain.setTargetAtTime((0.015+0.085*I)*fl,t,0.06);
  hissG.gain.setTargetAtTime(0.006+0.012*I+0.012*sstep(0.6,1,B)*bedG,t,0.1); /* 熾火が増えると、細い「しゅー」が目立つ */
  windG.gain.setTargetAtTime(0.26*sMax,t,0.12);
  windF.frequency.setTargetAtTime(380+900*(0.5-0.5*Math.sin(ang)),t,0.15);
  if(windPan)windPan.pan.setTargetAtTime(panOf(px),t,0.1);
}

/* ---------- 薪が崩れる / ✦ 新しい薪をくべる / ↻ もとの焚き火に ---------- */
function collapse(){
  settleTarget+=0.1;fastRebuild=0.9;flare=Math.max(flare,0.5);
  sparkBurst(16,1.3);crack(2,panOf(FX),0);thump(0,true);
}
function clearAll(){FL.fill(0);ML.fill(0);KL.fill(0);patches.length=0;held={}}
function fresh(seed,b0,fb){
  clearAll();layoutSeed=seed;B=b0;settleBoost=0;settleTarget=0;fuelBase=fb;flare=1;buildScene();
}
function mutate(){
  fresh((Math.random()*1e9)|0,0,0.9+Math.random()*0.25);
  if(window.APKit&&APKit.toast)APKit.toast('新しい薪をくべた',1800);
}
function reset(){fresh(20261101,0,1)}

/* ---------- ループ ---------- */
var last=performance.now();
function step(dt){
  T+=dt;
  flare*=Math.exp(-dt/1.4);
  var pb=B;B=Math.min(1,B+dt*burnRate);
  if(ready){if(pb<0.42&&B>=0.42)collapse();if(pb<0.78&&B>=0.78)collapse()}
  settleBoost+=(settleTarget-settleBoost)*(1-Math.exp(-dt*5));
  rbT+=dt;fastRebuild-=dt;
  if(rbT>(fastRebuild>0?0.04:0.3)){rbT=0;rebuildLogs()}
  updateTongues();updatePatches(dt);updateParticles(dt);popUpdate(dt);
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  step(dt);render();audioUpdate(dt);
}
addEventListener('resize',function(){layout()});
(function(){var q=parseFloat((new URLSearchParams(location.search)).get('burn'));B=isNaN(q)?0.04:clamp(q,0,1)})();
layout();
for(var w0=0;w0<60;w0++)step(0.03);
ready=true;
APKit.init({canvas:canvas,gifName:'campfire-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:mutate},
  {label:'🔇',name:'sound',onClick:toggleSound},
  {label:'↻',name:'reset',onClick:reset}
]});
setTimeout(function(){hint.classList.add('off')},12000);
requestAnimationFrame(frame);
})();
</script>
