     お題: おっちゃんが選んだ「焚き火」(リアルに・音付き・炭の変化も)。10/30依頼の新作題材3候補から選択。
     世界のルール: 炎は「上」へ昇る。触った場所だけ、その「上」の向きが書き換わる。
       タップ=その場所の上が「下」になる(炎が垂れ、火の粉が雨のように落ちる) / なぞる=なぞった向きが上になる / 押し続ける=上の向きがゆっくり回り、炎が渦を巻く。
       向きの違う場所の境目には、昇る力が打ち消し合う「無重力の淀み」ができる。離すと数秒かけて元の世界に戻る(複数の指も可)。風が当たった炭は明るく息をする。
       触らなくても、燃え続ける焚き火として成立する。
     炭の変化: 薪は1本ずつ、約45秒かけて 生木(樹皮) → 黒く焦げてひび割れ、割れ目が赤く光る → 細く縮んで白い灰をかぶる → 熾火。その後さらに約30秒で熾火が冷えて灰になる(v5)。
       炎は薪が焦げるにつれて小さくなり、すべての薪が燃え尽きると火が消えて、夜の闇だけが残る。芯まで焦げた薪は、ずるっと崩れ落ち、細くなった所でぽきっと2本に折れる(折れ口はぎざぎざで赤く光る。火の粉と音)。
       ✦で新しい薪を上から落とす。自前の2D物理(外部ライブラリなし)で、重力・地面・薪どうしの衝突・摩擦を解くので、転がって積み重なる。火が残っていればすぐ着火、冷えきっていると数秒かかる(触って風を送ると早い)。↻で最初の焚き火に戻す。
       URLに ?burn=0〜2 を付けると、その段階から始まる(確認用。0=生木、1=熾火、2=冷えた灰)。
     音: WebAudioで生成(音源ファイルなし)。炎のうなり・パチパチ・火の粉の爆ぜる音・触った場所の風音・薪が崩れる音。最初に画面を触ると鳴り始める(ブラウザの決まり)。ドックの🔊/🔇で切替。
       iPhoneは本体の消音スイッチ(サイレントモード)がオンだと鳴らない。 -->

<script>
(function(){

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- ノイズ(炎の揺らぎ・乱流・陽炎) ---------- */
var PERM=new Uint8Array(512);
(function(){var r=mulberry(1234),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=(r()*(i+1))|0;t=p[i];p[i]=p[j];p[j]=t}for(i=0;i<512;i++)PERM[i]=p[i&255]})();
function hs(i,j,k){return PERM[(PERM[(PERM[i&255]+j)&255]+k)&255]/127.5-1}
function nz(x,y,z){
  var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,
      u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);

      c=lerp(hs(xi,yi,zi+1),hs(xi+1,yi,zi+1),u),d=lerp(hs(xi,yi+1,zi+1),hs(xi+1,yi+1,zi+1),u);

/* ---------- 色(黒体放射ふう: 白黄 → 橙 → 赤 → 暗赤) ---------- */
var RAMP=[[0,[40,8,4]],[0.2,[150,34,8]],[0.4,[232,92,18]],[0.6,[255,158,48]],[0.8,[255,214,118]],[1,[255,246,214]]];
function ramp(t){

  for(var i=1;i<RAMP.length;i++){
    if(t<=RAMP[i][0]){var a=RAMP[i-1],b=RAMP[i],f=(t-a[0])/(b[0]-a[0]);
      return [a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f]}
  }

function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}

function mixc(a,b,m){return [lerp(a[0],b[0],m),lerp(a[1],b[1],m),lerp(a[2],b[2],m)]}
var NSP=28,SPR=[],NSM=8,SMK=[],BLUE=null;

    var f=i/(NSM-1);col=[lerp(62,176,f),lerp(66,96,f),lerp(78,52,f)];
    gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,rgba(col,1));gr.addColorStop(0.5,rgba(col,0.45));gr.addColorStop(1,rgba(col,0));
    g.fillStyle=gr;g.fillRect(0,0,64,64);SMK.push(c);
  }

  gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,rgba(col,1));gr.addColorStop(0.35,rgba(col,0.5));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(0,0,64,64);BLUE=c;

buildSprites();

/* ---------- 世界の「上」: 触った場所だけ書き換わる向きの場 ---------- */
var patches=[];
var UX=0,UY=-1,UW=0;
function upAt(x,y){
  var ux=0,uy=-1,mw=0,i,p,dx,dy,d2,w;
  for(i=0;i<patches.length;i++){
    p=patches[i];dx=x-p.x;dy=y-p.y;d2=(dx*dx+dy*dy)/(p.r*p.r);
    if(d2>5)continue;
    w=p.s*Math.exp(-d2*1.15);if(w<0.004)continue;if(w>mw)mw=w;
    ux=ux*(1-w)+Math.cos(p.a)*w;uy=uy*(1-w)+Math.sin(p.a)*w;
  }
  UX=ux;UY=uy;UW=mw; /* 長さは0〜1のまま: 向きが打ち消し合う所は昇る力も弱い(無重力の淀み) */
}

/* ---------- 燃え進み(薪1本ずつ。炎・熾火・灰の量は、全部の薪の合計から決まる) ---------- */
var B=0,ashB=0,burnRate=1/45,coolTime=30,bedG=0.3,bedP=0.25,fuelAgg=1,alive=1,ready=false,rbT=0,coldT=0,coldHint=false,startB=0.04,startCool=0;
function heatOf(b){return sstep(0.03,0.34,b)*(1-0.45*sstep(0.82,1,b))}
function flameOf(b){return 1.18*(1-0.75*sstep(0.04,0.95,b))*(1-sstep(0.78,1,b))} /* 薪1本が出す炎の強さ。燃え尽きる手前で0になる */

/* ---------- 粒子 ---------- */
var NF=1000,NM=170,NK=150;
var FW=new Float32Array(NF),FPX=new Float32Array(NF),FPY=new Float32Array(NF),FVX=new Float32Array(NF),FVY=new Float32Array(NF),FA=new Float32Array(NF),FL=new Float32Array(NF),FSZ=new Float32Array(NF),FAX=new Float32Array(NF),FSD=new Float32Array(NF);
var MPX=new Float32Array(NM),MPY=new Float32Array(NM),MVX=new Float32Array(NM),MVY=new Float32Array(NM),MA=new Float32Array(NM),ML=new Float32Array(NM),MSZ=new Float32Array(NM),MSD=new Float32Array(NM);
var KPX=new Float32Array(NK),KPY=new Float32Array(NK),KVX=new Float32Array(NK),KVY=new Float32Array(NK),KA=new Float32Array(NK),KL=new Float32Array(NK),KSD=new Float32Array(NK);
var pf={v:0},pm={v:0},pk={v:0};
function slot(L,n,ptr){for(var j=0;j<n;j++){var i=(ptr.v+j)%n;if(L[i]<=0){ptr.v=(i+1)%n;return i}}return -1}

/* 炎の舌: 根元から「上」の場に沿ってたどった折れ線。向きを書き換えた所では、舌そのものが曲がる・垂れる・地面を這う */
var NTG=7,NS=12,TP=new Float32Array(NTG*(NS+1)*2),TW=new Float32Array(NTG*(NS+1)),TH=new Float32Array(NTG),TIPX=new Float32Array(NTG),TIPY=new Float32Array(NTG),TIPDX=new Float32Array(NTG),TIPDY=new Float32Array(NTG),TUW=new Float32Array(NTG);
var T=0,fuelBase=1,flare=0,flick=1,inten=0.7,wind=0,emitAcc=0,lickAcc=0,smokeAcc=0,sparkAcc=0,fuel=1;
var NT=3,tC=[0,0,0],tI=[0.7,0.7,0.7],tF=[1,1,1],tw=2.1;
var layoutSeed=20261101;
var LOGS=[],CH=[],COALS=[],STONES=[],CRKW=[],EMBW=[],BRKW=[];

/* ---------- 炎の根元(v5.3): 炎は「いま燃えている薪」の上から立つ ----------
   薪から出るガスが燃えているのが炎なので、燃えている薪の位置(重み=炎の強さ)の重心に炎の根元を置く。
   燃えている薪が左右に分かれたら、炎も2本に分かれる。薪が燃え尽きるにつれて、炎は残った薪のほうへ寄っていく。 */
var SRCS=[{x:0,y:0,w:0},{x:0,y:0,w:0}],fBY=0,fxOff=0;
function updateSources(dt){
  var i,L,w,sw=0,mx=0,my=0,vx=0,tg=[[0,0,0],[0,0,0]],k,S,tx,ty,a=1-Math.exp(-dt*2.5),W0,top;
  for(i=0;i<LOGS.length;i++){L=LOGS[i];w=L.fl*flameOf(L.b);if(w<0.04)continue;
    sw+=w;mx+=w*L.x;my+=w*(L.y-L.t*thkK(L)*0.4)}
  if(sw>0.04){mx/=sw;my/=sw;
    for(i=0;i<LOGS.length;i++){L=LOGS[i];w=L.fl*flameOf(L.b);if(w<0.04)continue;vx+=w*(L.x-mx)*(L.x-mx)}
    if(Math.sqrt(vx/sw)>0.07){ /* 燃えている薪が左右に離れている: 2本の炎 */
      for(i=0;i<LOGS.length;i++){L=LOGS[i];w=L.fl*flameOf(L.b);if(w<0.04)continue;
        k=L.x<mx?0:1;tg[k][0]+=w*L.x;tg[k][1]+=w*(L.y-L.t*thkK(L)*0.4);tg[k][2]+=w}
    }else tg[0]=[mx*sw,my*sw,sw];
  }
  for(k=0;k<2;k++){S=SRCS[k];
    if(tg[k][2]>0.04){tx=tg[k][0]/tg[k][2];ty=tg[k][1]/tg[k][2];
      if(S.w<0.02){S.x=tx;S.y=ty}else{S.x+=(tx-S.x)*a;S.y+=(ty-S.y)*a}
      S.w+=(tg[k][2]-S.w)*a;
    }else S.w-=S.w*a;
  }

  if(W0>0.02){
    fxOff+=((SRCS[0].x*SRCS[0].w+SRCS[1].x*SRCS[1].w)/W0*U-fxOff)*a;
    top=(SRCS[0].y*SRCS[0].w+SRCS[1].y*SRCS[1].w)/W0;
    fBY+=((FY-U*0.012)+0.4*(FY+top*U-(FY-U*0.012))-fBY)*a; /* 根元の高さは、地面と薪の上面の間 */

function updateTongues(){
  var k;tw=0;
  for(k=0;k<NT;k++){
    tC[k]=fxOff+((k-1)*0.05+nz(T*0.45+k*11.3,3.1,0.5)*0.07)*U;
    tI[k]=clamp(0.78+0.45*nz(T*(0.8+k*0.27)+k*5.7,9.2,1.7),0.42,1.2);
    tF[k]=0.78+0.34*nz(T*3.1+k*4.2,5.5,0.3); /* 舌ごとの、素早い伸び縮み */

  flick=clamp(0.78+0.2*nz(T*9,1,1)+0.12*nz(T*23,2,2)+0.1*(tw/NT-0.6),0.35,1.2);

function traceTongues(){
  var k,i,c=(NTG-1)/2,gy=FY+U*0.055;
  for(k=0;k<NTG;k++){
    var env=1-Math.abs(k-c)/(c+1.3)*0.62;
    var fl=0.62+0.5*nz(T*1.25+k*7.1,2.3,k)+0.16*nz(T*5.5+k*3.3,7.7,1.1);
    var H=U*(0.42+0.08*fuel)*Math.pow(clamp(fuel,0.05,1.4),1.7)*env*clamp(fl,0.25,1.3);
    var Wd=U*(0.075+0.04*clamp(fuel,0,1.2))*env*(0.8+0.4*nz(T*0.9+k*2.7,1.3,4.4));
    var x=FX+fxOff+(k-c)*U*0.03+nz(T*0.5+k*9.1,4,2)*U*0.015,y=fBY-nz(k*3.1,1,1)*U*0.008,uwMax=0,dxn=0,dyn=-1;
    TH[k]=H;
    for(i=0;i<=NS;i++){
      var sN=i/NS,o=(k*(NS+1)+i);
      TP[o*2]=x;TP[o*2+1]=y;
      var wp=(1-Math.pow(sN,0.85))*(0.55+0.45*Math.sin(Math.min(1,sN*3.2)*1.5708));
      TW[o]=Wd*wp*(0.7+0.6*nz(T*2.3+k*4.7,sN*5.5+k,3.3))*(0.7+0.5*nz(k*1.7,sN*3,9));
      if(i===NS)break;
      upAt(x,y);if(UW>uwMax)uwMax=UW;
      var len=Math.hypot(UX,UY),f=clamp(len,0.14,1);

      var ds=H/NS*f*(1+0.35*Math.sin(sN*3.1416));
      var px=-dyn,py=dxn;
      var lat=nz(T*1.7+k*5.3,sN*2.6+k*1.3,0.7)*U*0.12*sN*(0.3+0.7*sN)+0.5*nz(T*4.1+k*2.1,sN*5,1.9)*U*0.03*sN;
      x+=dxn*ds+px*lat/NS*3.2;y+=dyn*ds+py*lat/NS*3.2;
      if(y>gy){y=gy;x+=(dxn>=0?1:-1)*ds*0.9} /* 逆さの世界では、炎が地面を舐めて広がる */
    }

}
function emitFlame(lick){
  if(lick){ /* 舌の先から、千切れた炎が飛ぶ */
    var kk=(Math.random()*NTG)|0,j=slot(FL,NF,pf);if(j<0)return;
    FPX[j]=TIPX[kk];FPY[j]=TIPY[kk];FVX[j]=TIPDX[kk]*U*(0.25+Math.random()*0.3)+(Math.random()-0.5)*U*0.1;FVY[j]=TIPDY[kk]*U*(0.25+Math.random()*0.3);
    FAX[j]=TIPX[kk];FL[j]=0.45+Math.random()*0.5;FA[j]=0;FSZ[j]=U*(0.014+Math.random()*0.014);FSD[j]=Math.random();return;
  }
  var i=slot(FL,NF,pf);if(i<0)return;
  var r=Math.random()*tw,k=0;
  for(k=0;k<NT-1;k++){if(r<tI[k])break;r-=tI[k]}
  var it=tI[k],spread=U*0.065*(0.55+Math.random()*0.7)*clamp(0.5+0.6*fuel,0.55,1.1);
  FPX[i]=FX+tC[k]+gs()*spread*0.55;
  FPY[i]=fBY+U*0.002-Math.random()*U*0.03;
  FVX[i]=(Math.random()-0.5)*U*0.05;FVY[i]=-U*(0.12+Math.random()*0.18)*it*(lick?1.7:1);
  FAX[i]=FX+tC[k]*0.5;
  FL[i]=(0.6+Math.random()*0.9)*fuel*(0.55+0.65*it)*tF[k]*(lick?0.8:1);
  FA[i]=0;FSZ[i]=U*(0.026+Math.random()*0.024)*(lick?0.62:1);FSD[i]=Math.random();
}
function emitSmoke(){
  var i=slot(ML,NM,pm);if(i<0)return;
  var hf=clamp(fuel,0.3,1.4);
  MPX[i]=FX+tC[1]*0.6+gs()*U*0.03;MPY[i]=FY-U*(0.06+0.24*hf+Math.random()*0.16*hf);
  MVX[i]=(Math.random()-0.5)*U*0.05;MVY[i]=-U*(0.08+Math.random()*0.06);

function spawnSpark(x,y,vx,vy,life){

  KPX[i]=x;KPY[i]=y;KVX[i]=vx;KVY[i]=vy;KL[i]=life;KA[i]=0;KSD[i]=Math.random();

function emberPoint(){

function updateParticles(dt){
  var i,a,Tn,bu,tu,nx,ny,ax,ay,B_=U*2.0,kN=1/(U*0.18),drag;
  /* 炎 */
  emitAcc+=400*(0.55+0.6*tw/NT)*fuel*dt;
  while(emitAcc>=1){emitAcc--;emitFlame(false)}
  lickAcc+=7*inten*dt; /* 舌の先が千切れて飛ぶ炎 */
  while(lickAcc>=1){lickAcc--;emitFlame(true)}
  drag=Math.exp(-2.3*dt);
  for(i=0;i<NF;i++){
    if(FL[i]<=0)continue;
    FA[i]+=dt;if(FA[i]>=FL[i]){FL[i]=0;continue}
    a=FA[i]/FL[i];Tn=Math.pow(1-a,1.25);
    upAt(FPX[i],FPY[i]);FW[i]=UW;
    bu=B_*(0.25+1.0*Tn);ax=UX*bu;ay=UY*bu;
    tu=U*1.4*(0.3+0.7*a);
    nx=nz(FPX[i]*kN,FPY[i]*kN,T*1.4+FSD[i]*0.6);ny=nz(FPX[i]*kN+31.4,FPY[i]*kN+7.7,T*1.4);
    ax+=nx*tu+wind*U*0.45;ay+=ny*tu*0.5;
    ax+=-(FPX[i]-FAX[i])*(4.2*(0.3+a))*(1-UW); /* 炎が上で細くなる。向きが書き換わった所では効かせない */
    FVX[i]=(FVX[i]+ax*dt)*drag;FVY[i]=(FVY[i]+ay*dt)*drag;
    FPX[i]+=FVX[i]*dt;FPY[i]+=FVY[i]*dt;
  }
  /* 煙(終盤の熾火は、薄い煙が細く立ちのぼる) */
  smokeAcc+=(8*clamp(fuel,0,1.4)+6*sstep(0.5,1,B)*clamp(bedG*1.6,0,1))*dt;
  while(smokeAcc>=1){smokeAcc--;emitSmoke()}
  drag=Math.exp(-1.0*dt);
  for(i=0;i<NM;i++){
    if(ML[i]<=0)continue;
    MA[i]+=dt;if(MA[i]>=ML[i]){ML[i]=0;continue}
    upAt(MPX[i],MPY[i]);
    ax=UX*U*0.28;ay=UY*U*0.28;
    nx=nz(MPX[i]*kN*0.7,MPY[i]*kN*0.7,T*0.6+MSD[i]);ny=nz(MPX[i]*kN*0.7+9.1,MPY[i]*kN*0.7,T*0.6);
    ax+=nx*U*0.35+wind*U*0.3;ay+=ny*U*0.2;
    MVX[i]=(MVX[i]+ax*dt)*drag;MVY[i]=(MVY[i]+ay*dt)*drag;
    MPX[i]+=MVX[i]*dt;MPY[i]+=MVY[i]*dt;
  }
  /* 火の粉 */
  sparkAcc+=(3+11*inten)*alive*dt;
  while(sparkAcc>=1){sparkAcc--;var e=emberPoint();
    spawnSpark(e[0]+gs()*U*0.02,e[1]-U*(0.02+Math.random()*0.15),(Math.random()-0.5)*U*0.25,-U*(0.2+Math.random()*0.35),1.5+Math.random()*1.8)}
  drag=Math.exp(-0.9*dt);
  for(i=0;i<NK;i++){
    if(KL[i]<=0)continue;
    KA[i]+=dt;if(KA[i]>=KL[i]){KL[i]=0;continue}
    upAt(KPX[i],KPY[i]);
    ax=UX*U*0.34;ay=UY*U*0.34;
    nx=nz(KPX[i]*kN*1.3,KPY[i]*kN*1.3,T*1.1+KSD[i]*9);ny=nz(KPX[i]*kN*1.3+5.3,KPY[i]*kN*1.3,T*1.1+KSD[i]*9);
    ax+=nx*U*0.9+wind*U*0.4;ay+=ny*U*0.6;
    KVX[i]=(KVX[i]+ax*dt)*drag;KVY[i]=(KVY[i]+ay*dt)*drag;
    KPX[i]+=KVX[i]*dt;KPY[i]+=KVY[i]*dt;
    if(KPY[i]>FY+U*0.07&&KVY[i]>0){KL[i]=Math.min(KL[i],KA[i]+0.22);KVY[i]=0;KVX[i]*=0.3} /* 逆さの世界で落ちた火の粉は地面で消える */
  }
}

var held={};
function addPatch(id,x,y){
  if(patches.length>=6){var j=0,k;for(k=0;k<patches.length;k++)if(!patches[k].held){j=k;break}patches.splice(j,1)}
  var p={id:id,x:x,y:y,a:Math.PI/2,s:0,r:U*0.26,hold:0,held:true,lastMove:-9,dragged:false};
  patches.push(p);held[id]=p;return p;
}
function updatePatches(dt){
  for(var i=patches.length-1;i>=0;i--){
    var p=patches[i];
    if(p.held){
      p.s=Math.min(1,p.s+dt*4);p.hold+=dt;p.r=U*(0.26+0.12*Math.min(1,p.hold/1.6));
      if(T-p.lastMove>(p.dragged?0.6:0.14))p.a+=dt*1.7; /* 動かさず押し続けると、上の向きが回る(なぞった直後は、狙った向きを保つため0.6秒待つ) */
    }else{

}

/* ---------- 薪の物理(自前の2D剛体。長さの単位は「U」=画面の基準長) ----------
   薪=丸い粒を一列に並べた棒。重力・地面・壁・薪どうしの衝突と摩擦だけを解く小さな物理(外部ライブラリなし)。
   奥行きz(0=奥〜1=手前)が離れた薪どうしは当たらない(手前と奥で交差して見える、この作品の疑似3D)。
   全部が静止したら計算を止め、燃えて細くなる分だけ1.2秒ごとに起こして落ち着かせる。 */
var GRAV=3.4,GY0=0.005,GY1=0.042,WALL=0.29,DZ=0.5,MU_G=0.8,MU_L=0.6,ITER=7,SUBS=5;
var physAwake=0,calmT=0,nudgeT=0,impactMax=0,impactX=0,CT=[],cn=0;
function gyOf(z){return GY0+GY1*z}
function lenK(L){return 1-0.4*L.b-0.1*L.cool}
function thkK(L){return 1-0.5*L.b-0.1*L.cool}
function wake(){physAwake=1;calmT=0}
function circles(L){
  var r=L.t*thkK(L)*0.5,hl=Math.max(0,L.l*lenK(L)*0.5-r),ca=Math.cos(L.a),sa=Math.sin(L.a),n=L.n,k,u;
  L.r=r;L.hl=hl;
  for(k=0;k<n;k++){u=n>1?-hl+2*hl*k/(n-1):0;L.cx[k]=L.x+u*ca;L.cy[k]=L.y+u*sa}
}
function addC(A,Bd,nx,ny,pen,px,py){
  var c=CT[cn]||(CT[cn]={});cn++;c.A=A;c.B=Bd;c.nx=nx;c.ny=ny;c.pen=pen;c.px=px;c.py=py;c.jn=0;
}
function detect(){
  var i,j,k,m,A,Bd,dx,dy,d2,rr,d,rx,ry,reach,gy;
  cn=0;
  for(i=0;i<LOGS.length;i++)circles(LOGS[i]);
  for(i=0;i<LOGS.length;i++){A=LOGS[i];gy=gyOf(A.z);
    for(k=0;k<A.n;k++){
      if(A.cy[k]+A.r>gy)addC(A,null,0,-1,A.cy[k]+A.r-gy,A.cx[k],gy);
      if(A.cx[k]-A.r<-WALL)addC(A,null,1,0,-WALL-(A.cx[k]-A.r),-WALL,A.cy[k]);
      else if(A.cx[k]+A.r>WALL)addC(A,null,-1,0,A.cx[k]+A.r-WALL,WALL,A.cy[k]);
    }
    for(j=i+1;j<LOGS.length;j++){Bd=LOGS[j];
      if(Math.abs(A.z-Bd.z)>DZ)continue;
      rx=A.x-Bd.x;ry=A.y-Bd.y;reach=A.hl+Bd.hl+A.r+Bd.r;if(rx*rx+ry*ry>reach*reach)continue;
      rr=A.r+Bd.r;
      for(k=0;k<A.n;k++)for(m=0;m<Bd.n;m++){
        dx=A.cx[k]-Bd.cx[m];dy=A.cy[k]-Bd.cy[m];d2=dx*dx+dy*dy;
        if(d2<rr*rr){d=Math.sqrt(d2);
          if(d<1e-6){dx=0;dy=-1;d=0}else{dx/=d;dy/=d}
          addC(A,Bd,dx,dy,rr-d,Bd.cx[m]+dx*(Bd.r-(rr-d)*0.5),Bd.cy[m]+dy*(Bd.r-(rr-d)*0.5));
        }
      }
    }
  }
}
function pushImp(A,Bd,rax,ray,rbx,rby,ix,iy){
  A.vx+=ix*A.im;A.vy+=iy*A.im;A.w+=(rax*iy-ray*ix)*A.iI;
  if(Bd){Bd.vx-=ix*Bd.im;Bd.vy-=iy*Bd.im;Bd.w-=(rbx*iy-rby*ix)*Bd.iI}
}
function solve(){
  var it,i,c,A,Bd,rax,ray,rbx,rby,vx,vy,vn,rn,rnb,rt,rtb,den,j,tx,ty,vt,jt,cap;
  for(it=0;it<ITER;it++){
    for(i=0;i<cn;i++){c=CT[i];A=c.A;Bd=c.B;
      rax=c.px-A.x;ray=c.py-A.y;rbx=0;rby=0;
      if(Bd){rbx=c.px-Bd.x;rby=c.py-Bd.y}
      vx=A.vx-A.w*ray;vy=A.vy+A.w*rax;
      if(Bd){vx-=Bd.vx-Bd.w*rby;vy-=Bd.vy+Bd.w*rbx}
      vn=vx*c.nx+vy*c.ny;
      if(vn<0){
        rn=rax*c.ny-ray*c.nx;den=A.im+rn*rn*A.iI;
        if(Bd){rnb=rbx*c.ny-rby*c.nx;den+=Bd.im+rnb*rnb*Bd.iI}
        if(it===0&&-vn>impactMax){impactMax=-vn;impactX=c.px}
        j=-(1+(vn<-0.4?0.15:0))*vn/den;
        pushImp(A,Bd,rax,ray,rbx,rby,c.nx*j,c.ny*j);c.jn+=j;
        vx=A.vx-A.w*ray;vy=A.vy+A.w*rax;
        if(Bd){vx-=Bd.vx-Bd.w*rby;vy-=Bd.vy+Bd.w*rbx}
      }
      tx=-c.ny;ty=c.nx;vt=vx*tx+vy*ty;
      rt=rax*ty-ray*tx;den=A.im+rt*rt*A.iI;
      if(Bd){rtb=rbx*ty-rby*tx;den+=Bd.im+rtb*rtb*Bd.iI}
      jt=-vt/den;cap=(Bd?MU_L:MU_G)*c.jn;
      if(jt>cap)jt=cap;else if(jt<-cap)jt=-cap;
      if(jt!==0)pushImp(A,Bd,rax,ray,rbx,rby,tx*jt,ty*jt);
    }
  }
}
function physStep(dt){
  var h=dt/SUBS,s,i,L,c,f,pen,mv=0,k,low,gy;
  impactMax=0;
  for(s=0;s<SUBS;s++){
    for(i=0;i<LOGS.length;i++){L=LOGS[i];L.vy+=GRAV*h;L.vx*=1-0.15*h;L.w*=1-1.5*h}
    detect();solve();
    for(i=0;i<LOGS.length;i++){L=LOGS[i];L.x+=L.vx*h;L.y+=L.vy*h;L.a+=L.w*h}
    for(i=0;i<cn;i++){c=CT[i];pen=c.pen-0.0008;if(pen<=0)continue;
      f=pen*0.35/(c.A.im+(c.B?c.B.im:0));
      c.A.x+=c.nx*f*c.A.im;c.A.y+=c.ny*f*c.A.im;
      if(c.B){c.B.x-=c.nx*f*c.B.im;c.B.y-=c.ny*f*c.B.im}
    }
  }
  for(i=0;i<LOGS.length;i++){L=LOGS[i];
    mv=Math.max(mv,Math.hypot(L.vx,L.vy)+Math.abs(L.w)*L.l*0.5);
    low=-9;for(k=0;k<L.n;k++)if(L.cy[k]>low)low=L.cy[k];
    gy=gyOf(L.z);L.air=Math.max(0,gy-(low+L.r)); /* 地面から浮いている高さ(影の濃さに使う) */
  }
  if(mv<0.045){calmT+=dt;if(calmT>0.4){physAwake=0;for(i=0;i<LOGS.length;i++){L=LOGS[i];L.vx=0;L.vy=0;L.w=0}}}else calmT=0;
  if(impactMax>0.5)logThud(impactMax,impactX);
}

/* ---------- 薪の形(v5.2): 均一な筒(ちくわ)にならないよう、先細り・こぶ・ゆるい反り・斜めの切り口にする ---------- */
function makeShape(rnd){
  var N=9,sh={top:[],bot:[],ctr:[]},tp=(rnd()-0.5)*0.34,bend=(rnd()-0.5)*0.4,k1=rnd(),k2=rnd(),a1=(rnd()-0.25)*0.32,a2=(rnd()-0.25)*0.28,s1=rnd()<0.5,i,f,kn,base,e,d;
  for(i=0;i<N;i++){f=i/(N-1);

  for(i=0;i<L.ash.length;i++){q=L.ash[i];if(q.thr>ashA)continue;

function lump(g,c,k,ox,oy){var n=c.pg.length,i,a,m;g.beginPath();for(i=0;i<n;i++){a=i/n*TAU;m=c.pg[i]*k;if(i===0)g.moveTo(ox+Math.cos(a)*c.rx*m,oy+Math.sin(a)*c.ry*m);else g.lineTo(ox+Math.cos(a)*c.rx*m,oy+Math.sin(a)*c.ry*m)}g.closePath()}

    g.save();g.translate(c.x,c.y);g.rotate(c.rot);
    g.fillStyle='rgb(24,17,14)';lump(g,c,1,0,0);g.fill(); /* 炭のかたまり: ぎざぎざの輪郭(v5.2) */
    if(ashB>c.thr*0.7){g.fillStyle='rgba(140,135,130,'+(0.2*ashB)+')';lump(g,c,0.5,-c.rx*0.1,-c.ry*0.3);g.fill()}
    g.restore()}

  fgX.setTransform(DPR,0,0,DPR,0,0);fgX.clearRect(0,0,W,H);REC=false;

/* 薪を1本ずつ燃やす。着火 → 焦げ(b) → 熾火 → 冷えて灰(cool)。炎・熾火の量は全部の薪の合計 */
function updateLogs(dt){
  var i,L,flameSum=0,emberSum=0,bs=0,as=0,n=LOGS.length,sMax=0,cf,ign,rate;
  for(i=0;i<patches.length;i++)if(patches[i].s>sMax)sMax=patches[i].s;
  rate=0.2+0.9*clamp(bedG+0.25*fuelAgg,0,1.2)+0.45*sMax; /* 火が弱いと着きにくい。触って風を送ると着きやすい */
  for(i=0;i<n;i++){L=LOGS[i];
    if(L.brk&&L.b>=L.brkB&&L.l*lenK(L)>0.2){breakLog(i);L=LOGS[i]} /* 焦げて細くなった所でぽきっと折れる */
    if(L.ig<1)L.ig=Math.min(1,L.ig+dt*rate);
    ign=sstep(0.3,0.8,L.ig);
    if(L.b<1){
      if(ign>0){var pb=L.b;L.b=Math.min(1,L.b+dt*burnRate*L.rate*ign);
        if(!L.kick&&pb<0.55&&L.b>=0.55){L.kick=1;kickLog(L)}}
    }else if(L.cool<1)L.cool=Math.min(1,L.cool+dt*L.rate/coolTime);
    cf=1-L.cool;
    L.fl=sstep(0.15,1,L.ig);L.glow=sstep(0.1,0.6,L.ig)*Math.pow(cf,1.4);
    flameSum+=L.fl*flameOf(L.b);
    emberSum+=sstep(0.1,0.6,L.ig)*(0.3+0.7*sstep(0.18,0.72,L.b))*cf*Math.sqrt(cf);
    bs+=L.b;as+=Math.max(sstep(0.55,1,L.b),L.cool);
  }
  fuelAgg=1.6*(1-Math.exp(-flameSum/3.4)); /* v6.2: 薪が多いほど火力が大きくなる(旧: 1.3/2.6で早く頭打ち)。薪1本で約0.4、3本で約0.9、最初の5本で約1.2、10本で約1.5 */
  bedG=clamp(emberSum/5,0,1);
  B=n?bs/n:0;
  bedP=Math.max(bedP,0.25+0.75*sstep(0.1,0.7,B));ashB=Math.max(ashB,n?as/n:0);
  alive=clamp(fuelAgg*0.9+bedG*0.6+flare*0.5,0,1);
  updateSources(dt);
  if(!physAwake){nudgeT+=dt;if(nudgeT>1.2){nudgeT=0;wake()}}
  if(physAwake)physStep(dt);
}
function kickLog(L){ /* 芯まで焦げた薪が、ずるっと崩れる */
  L.vy+=0.1;L.w+=(Math.random()-0.5)*2.2;wake();
  if(!ready)return;
  var px=panOf(FX+L.x*U);
  flare=Math.max(flare,0.5*alive);sparkBurst(14,1.2);crack(2,px,0);thump(px,true,0.8);
}
function logThud(v,x){ /* 薪が何かにぶつかった音と火の粉 */
  if(!ready)return;
  var k=clamp(v/2.3,0.15,1),px=panOf(FX+x*U);
  thump(px,true,k*0.9);if(k>0.45)crack(2,px,0.02);
  if(alive>0.12){flare=Math.max(flare,(0.15+0.6*k)*alive);sparkBurst((3+12*k)|0,0.7+0.5*k)}
}
function setupShimmer(){
  var x0=Math.max(0,FX-U*0.3),x1=Math.min(W,FX+U*0.3),y0=Math.max(0,FY-U*1.05),y1=FY-U*0.14;

  g1.setTransform(DPR,0,0,DPR,0,0);g2.setTransform(DPR,0,0,DPR,0,0);g3.setTransform(DPR,0,0,DPR,0,0);

/* 陽炎: 炎の上の景色(木・星)を、細い横帯ごとにゆらゆらずらす */
function shimmer(g){
  var amp=1.5*clamp(inten,0,1)*(0.35+0.65*clamp(fuel,0,1));

  shX.drawImage(canvas,Math.round(shRect.x*DPR),Math.round(shRect.y*DPR),shC.width,shC.height,0,0,shC.width,shC.height);

'  for(int i=0;i<6;i++){',
'    vec2 d=q-uP[i].xy;float d2=dot(d,d)/(uP[i].z*uP[i].z);',

'  vec3 c=vec3(0.0);',
'  c=mix(c,vec3(0.50,0.07,0.0),smoothstep(0.0,0.28,e));',
'  c=mix(c,vec3(1.0,0.34,0.04),smoothstep(0.22,0.5,e));',
'  c=mix(c,vec3(1.0,0.68,0.2),smoothstep(0.45,0.74,e));',

'  float n3=vn(vec2(h*5.0-t*3.5,xl*2.0+3.0));',

function initGL(){

var PBUF=new Float32Array(24),ABUF=new Float32Array(6);

function drawGLFlame(g){

  if(W0<0.02){glPass(g,FX,FY-U*0.012,clamp(fuel,0.05,1.4),layoutSeed%97,0);return}

}

var TL=[[1.25,[170,40,8],0.04],[0.9,[235,85,14],0.055],[0.62,[255,145,34],0.07],[0.38,[255,205,100],0.085],[0.18,[255,244,210],0.09]];
function drawTongues(g){
  var k,L,i,o,s,col,fk=clamp(fuel,0.2,1.2),dk;
  for(L=0;L<TL.length;L++){
    s=TL[L][0];col=TL[L][1];

      if(TH[k]<U*0.02)continue;

      g.globalAlpha=TL[L][2]*(L>2?(0.45+0.55*fk):1)*dk*flick*clamp(fuel*1.6,0,1);
      g.fillStyle=rgbs(col);

function setSound(on){
  soundOn=on;
  var b=document.querySelector('.apk-btn[aria-label="sound"]');if(b)b.textContent=on?'🔊':'🔇';
  if(AC){var t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(on?0.9:0,t,0.08);if(on&&AC.state!=='running')AC.resume()}
}
function unlockAudio(){
  if(!autoTried){autoTried=true;if(audioInit())setSound(true)}
  if(AC&&AC.state!=='running'&&soundOn)AC.resume();
}
function toggleSound(){
  autoTried=true;
  if(!soundOn){
    if(!audioInit()){if(window.APKit&&APKit.toast)APKit.toast('この端末では音を出せません');return}
    if(AC.state!=='running')AC.resume();setSound(true);
  }else setSound(false);
}
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('visibilitychange',function(){
  if(!AC)return;
  if(document.hidden)AC.suspend();else if(soundOn)AC.resume();
});
function panOf(x){return clamp(x/W*2-1,-1,1)}
/* パチッ: 短いノイズを帯域で切り出した1発。kind 0=小さな爆ぜ 1=中 2=大きな破裂 */
function crack(kind,pan,delay){
  if(!AC||!soundOn||crackActive>14)return;
  var ac=AC,when=ac.currentTime+(delay||0)+0.005,src=ac.createBufferSource();
  src.buffer=whiteBuf;
  var f,q,dur,vol;
  if(kind===0){f=3000+Math.random()*4500;q=1.2+Math.random()*2;dur=0.008+Math.random()*0.02;vol=0.1+Math.random()*0.1}
  else if(kind===1){f=1500+Math.random()*2200;q=0.9+Math.random()*1.2;dur=0.03+Math.random()*0.04;vol=0.22+Math.random()*0.16}
  else{f=800+Math.random()*1300;q=0.7+Math.random();dur=0.07+Math.random()*0.07;vol=0.5+Math.random()*0.25}
  var bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
  var g=ac.createGain();g.gain.setValueAtTime(0.0001,when);g.gain.linearRampToValueAtTime(vol,when+0.0015);g.gain.exponentialRampToValueAtTime(0.0008,when+dur);
  src.connect(bp);bp.connect(g);
  if(ac.createStereoPanner){var p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(master)}else g.connect(master);
  crackActive++;src.onended=function(){crackActive--};
  src.start(when,Math.random()*1.2,dur+0.05);src.stop(when+dur+0.06);
}
/* ボッ(触った瞬間の低い風の塊) / ドサッ(薪が崩れる。低く長く、ノイズが混じる) */
function thump(pan,collapse,k){
  if(!AC||!soundOn)return;
  k=k||1;var ac=AC,t=ac.currentTime,dur=collapse?0.6:0.34;
  var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(collapse?62:95,t);o.frequency.exponentialRampToValueAtTime(collapse?30:38,t+dur*0.85);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime((collapse?0.42:0.32)*k,t+0.012);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);
  if(collapse&&whiteBuf){
    var ns=ac.createBufferSource();ns.buffer=whiteBuf;var lp2=ac.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=260;
    var ng=ac.createGain();ng.gain.setValueAtTime(0.0001,t);ng.gain.linearRampToValueAtTime(0.5*k,t+0.01);ng.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    ns.connect(lp2);lp2.connect(ng);ng.connect(master);ns.start(t,Math.random()*0.8,0.55);ns.stop(t+0.6);
  }
  if(ac.createStereoPanner){var p=ac.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(master)}else g.connect(master);
  o.start(t);o.stop(t+dur+0.06);
  if(!collapse)surge=1;
}
var popAcc=0;
function popUpdate(dt){
  popAcc+=(0.8+5.2*inten+5*flare)*alive*dt;
  while(popAcc>=1){popAcc--;
    var r=Math.random(),kind=r<0.72?0:r<0.95?1:2,e=emberPoint(),pan=panOf(e[0]);
    sparkBurst(kind===2?(10+(Math.random()*8|0)):kind===1?(2+(Math.random()*3|0)):(Math.random()<0.5?1:0),kind===2?1.25:0.8);
    crack(kind,pan,0);
    if(kind<2&&Math.random()<0.3){var n=1+(Math.random()*3|0),j;for(j=0;j<n;j++)crack(0,pan+(Math.random()-0.5)*0.2,0.02+Math.random()*0.1)}
  }
}
function audioUpdate(dt){
  surge*=Math.exp(-dt/0.5);
  if(!AC||!soundOn)return;
  var t=AC.currentTime,sMax=0,ang=0,px=W/2,i,p;
  for(i=0;i<patches.length;i++){p=patches[i];if(p.s>sMax){sMax=p.s;ang=p.a;px=p.x}}
  var I=clamp(inten,0,1.3),fl=0.6+0.8*(0.5+0.5*nz(T*5,4,4));
  roarG.gain.setTargetAtTime(0.06*alive+0.2*I+0.07*flare+0.2*surge,t,0.08);
  roarF.frequency.setTargetAtTime((220+420*I)*(1-0.45*sMax)+160*surge,t,0.1);
  bodyG.gain.setTargetAtTime((0.015*alive+0.085*I)*fl,t,0.06);
  hissG.gain.setTargetAtTime(0.006*alive+0.012*I+0.012*sstep(0.6,1,B)*bedG,t,0.1); /* 熾火が増えると、細い「しゅー」が目立つ */
  windG.gain.setTargetAtTime(0.26*sMax,t,0.12);
  windF.frequency.setTargetAtTime(380+900*(0.5-0.5*Math.sin(ang)),t,0.15);
  if(windPan)windPan.pan.setTargetAtTime(panOf(px),t,0.1);
}

/* ---------- ✦ 薪をくべる(上から落とす) / ↻ もとの焚き火に ---------- */
function clearAll(){FL.fill(0);ML.fill(0);KL.fill(0);patches.length=0;held={}}
function fresh(seed,b0){
  clearAll();layoutSeed=seed;startB=b0;startCool=0;LOGS=[];ashB=0;bedP=0.25;fuelBase=1;flare=1;coldT=0;coldHint=false;nudgeT=0;buildScene();
}
function addLog(){
  var rnd=Math.random,l=0.3+rnd()*0.12,t=0.04+rnd()*0.02,L,i,bi,bv,v;
  while(LOGS.length>=12){bi=0;bv=-1;for(i=0;i<LOGS.length;i++){v=LOGS[i].b+LOGS[i].cool;if(v>bv){bv=v;bi=i}}LOGS.splice(bi,1)} /* 増えすぎたら、いちばん燃え尽きた薪(灰)を片づける */
  L=newLog(rnd,(rnd()-0.5)*0.12,-0.8,(rnd()-0.5)*1.1,l,t,0.15+rnd()*0.7);
  L.ig=0;L.fl=0;L.glow=0;L.vy=0.1;L.w=(rnd()-0.5)*3;
  LOGS.push(L);wake();unlockAudio();hint.classList.add('off');
  if(window.APKit&&APKit.toast)APKit.toast('薪をくべた',1500);
}
function reset(){fresh(20261101,0)}

/* ---------- ループ ---------- */
var last=performance.now();
function step(dt){
  T+=dt;
  flare*=Math.exp(-dt/1.4);
  var pa=physAwake;
  updateLogs(dt);
  rbT+=dt;
  if(pa||physAwake||rbT>0.3){rbT=0;rebuildLogs()}
  updateTongues();updatePatches(dt);traceTongues();updateParticles(dt);popUpdate(dt);
  /* 火が完全に消えて数秒たったら、次の手を教える */
  if(ready&&alive<0.03){coldT+=dt;if(coldT>3&&!coldHint){coldHint=true;hint.innerHTML='<b>火が消えた</b>✦で薪をくべる · 触って風を送ると火がつく';hint.classList.remove('off');setTimeout(function(){hint.classList.add('off')},9000)}}
  else if(alive>0.3){coldT=0;coldHint=false}
}
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-last)/1000;last=now;if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  step(dt);render();audioUpdate(dt);
}
addEventListener('resize',function(){layout()});
(function(){var q=parseFloat((new URLSearchParams(location.search)).get('burn'));if(isNaN(q))q=0.04;q=clamp(q,0,2);startB=Math.min(q,1);startCool=Math.max(q-1,0);B=startB})();
initGL();
layout();
for(var w0=0;w0<60;w0++)step(0.03);
ready=true;
APKit.init({canvas:canvas,gifName:'campfire-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:addLog},
  {label:'🔇',name:'sound',onClick:toggleSound},
  {label:'↻',name:'reset',onClick:reset}
]});
setTimeout(function(){hint.classList.add('off')},12000);
requestAnimationFrame(frame);
})();
</script>
