<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS SWIPE CORAL</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090304}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* TOUCH LAW: SWIPE catches the nearest focus and throws it to the release point. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=6.283185;let W,H,D,drag=null,dreams=[],mem=[],seed=21,last=performance.now(),hue=.98,sens=1;
function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();function r(){let z=Math.sin(seed++*59.7)*43758.5;return z-Math.floor(z)}function reset(){seed=21;dreams=[];mem=[];for(let i=0;i<5;i++)dreams.push({x:W*(.1+.8*r()),y:H*(.1+.8*r()),q:.7+r(),b:performance.now()+i*650,d:3500+r()*3300,rad:Math.min(W,H)*(.16+r()*.18)})}reset();
function src(t){let a=[];for(let i=dreams.length-1;i>=0;i--){let d=dreams[i],u=(t-d.b)/d.d;if(u>=1){dreams.splice(i,1);continue}if(u<0)continue;let e=Math.sin(Math.PI*u);d.x+=Math.sin(t*.00018+i)*.04;d.y+=Math.cos(t*.00016+i)*.035;a.push({x:d.x,y:d.y,s:d.q*e,rad:d.rad})}for(let m of mem)a.push(m);return a}function at(px,py,a){let v=0;for(let s of a)v+=s.s*Math.exp(-Math.hypot(px-s.x,py-s.y)/s.rad);return v}function cell(px,py,w,d,a){let A=at(px+w/2,py+w/2,a),th=(.30+d*.19)/sens;if(d<7&&w>10&&A>th){let q=w/2;cell(px,py,q,d+1,a);cell(px+q,py,q,d+1,a);cell(px,py+q,q,d+1,a);cell(px+q,py+q,q,d+1,a)}else{let hh=(hue+d*.025+(py/H)*.06)%1;g.strokeStyle=`hsla(${350+hh*45},88%,70%,${.08+A*.24})`;g.lineWidth=.7;g.strokeRect(px+.5,py+.5,w-1,w-1)}}function draw(t,dt){for(let i=mem.length-1;i>=0;i--){mem[i].s*=Math.pow(.08,dt);if(mem[i].s<.025)mem.splice(i,1)}g.fillStyle='#090304';g.fillRect(0,0,W,H);cell(0,0,W,0,src(t))}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY}});c.addEventListener('pointermove',e=>{if(drag){drag.x=e.clientX;drag.y=e.clientY}});function up(){if(!drag)return;let near=null,b=Infinity;for(let d of dreams){let q=Math.hypot(drag.sx-d.x,drag.sy-d.y);if(q<b){b=q;near=d}}if(near&&b<180){near.x=drag.x;near.y=drag.y;near.q=Math.min(2.2,near.q+.5);near.b=performance.now()}mem.push({x:drag.x,y:drag.y,s:.7,rad:Math.min(W,H)*.17});drag=null}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',()=>drag=null);
APKit.init({canvas:c,gifName:'focus-swipe-coral-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{let z={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.27*Math.sin(p*2)),s:1.7,rad:Math.min(W,H)*.26};g.fillStyle='#090304';g.fillRect(0,0,W,H);cell(0,0,W,0,[z])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=.88+Math.random()*.18;sens=.82+Math.random()*.35}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
