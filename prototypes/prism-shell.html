<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRISM SHELL — ひとつのガラスの殻が、触れた場所から形を変えて覚える</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f2ee}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 18px);text-align:center;color:rgba(62,54,69,.62);font:500 11px/1.5 system-ui,sans-serif;letter-spacing:.12em;pointer-events:none;transition:opacity 1s}
#hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="hint">殻をタップすると、その場所が折れ曲がり、元には戻らない</div>
<script>
'use strict';
/* PRISM SHELL — ChatGPT作。ap-kit.js統合: ChatGPT
   World law: ひとつながりのガラス殻は、触れられた場所を恒久的な折り目として記憶する。
   触れた歪みは殻を伝い、次の呼吸にも残る。
*/
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const hint=document.getElementById('hint');
let W=0,H=0,DPR=1,last=performance.now(),time=0,seed=Math.random()*1000,palette=0;
const scars=[];
const colors=[
 {h:18,h2:188,h3:318},
 {h:45,h2:205,h3:270},
 {h:330,h2:175,h3:42},
 {h:195,h2:285,h3:48}
];
function resize(){DPR=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return 'hsla('+((h%360+360)%360)+','+s+'%,'+l+'%,'+a+')'}
function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a< -Math.PI)a+=Math.PI*2;return a}
function deform(a){
 let d=0;
 for(const s of scars){const q=wrap(a-s.a),influence=Math.exp(-(q*q)/(s.width*s.width));d+=influence*s.amount}
 return d;
}
function project(p,rx,ry,rz,scale,cx,cy){
 let x=p.x*Math.cos(ry)+p.z*Math.sin(ry),z=-p.x*Math.sin(ry)+p.z*Math.cos(ry);
 let y=p.y*Math.cos(rx)-z*Math.sin(rx);z=p.y*Math.sin(rx)+z*Math.cos(rx);
 const xx=x*Math.cos(rz)-y*Math.sin(rz),yy=x*Math.sin(rz)+y*Math.cos(rz);
 const perspective=1/(1-z*.16);
 return {x:cx+xx*scale*perspective,y:cy+yy*scale*perspective,z};
}
function centerline(a,t,layer){
 const d=deform(a+layer*.11);
 const major=1.03+layer*.035+.13*Math.cos(3*a+t*.25);
 const minor=.48+.07*Math.sin(2*a-t*.31);
 const twist=2*a+layer*.8;
 let x=(major+minor*Math.cos(3*a+twist*.18))*Math.cos(2*a+layer*.24);
 let y=(.82*major+.78*minor*Math.cos(3*a+twist*.18))*Math.sin(2*a+layer*.24);
 let z=minor*Math.sin(3*a+twist*.18)+.18*Math.sin(5*a+t*.2+layer);
 // A touch is a persistent crease in the glass, not a painted mark.
 x+=d*Math.cos(a*2+layer*.3);y+=d*Math.sin(a*2+layer*.3);z+=d*.8*Math.sin(a*3+layer);
 return {x,y,z};
}
function render(){
 const now=performance.now(),dt=Math.min(.04,(now-last)/1000);last=now;time+=dt;
 ctx.fillStyle='#f6f2ee';ctx.fillRect(0,0,W,H);
 const base=Math.min(W,H),cx=W*.5,cy=H*.49,p=colors[palette];
 const bg=ctx.createRadialGradient(cx,cy-base*.08,base*.03,cx,cy,base*.74);
 bg.addColorStop(0,'rgba(255,255,255,.9)');bg.addColorStop(.58,'rgba(244,235,229,.34)');bg.addColorStop(1,'rgba(232,224,221,0)');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const rx=.18+Math.sin(time*.23)*.16,ry=time*.19,rz=Math.sin(time*.14)*.1;
 const scale=base*.235*(1+.012*Math.sin(time*.8));
 const segments=[],N=260,layers=3;
 for(let layer=0;layer<layers;layer++){
   const pts=[];
   for(let i=0;i<=N;i++){
     const a=i/N*Math.PI*2;
     pts.push(project(centerline(a,time,layer),rx+layer*.025,ry+layer*.14,rz,scale,cx,cy));
   }
   for(let i=0;i<N;i++){
     const a=pts[i],b=pts[i+1],ang=(i+.5)/N*Math.PI*2;
     segments.push({a,b,layer,depth:(a.z+b.z)*.5,ang});
   }
 }
 segments.sort((a,b)=>a.depth-b.depth);
 ctx.lineCap='round';ctx.lineJoin='round';
 for(const s of segments){
   const z=Math.max(0,Math.min(1,(s.depth+1.45)/2.9)),p=s.layer;
   const hue=p.h+(s.ang/(Math.PI*2))*72+z*46+12*Math.sin(time*.3+s.ang*2);
   const width=(13+z*15)*(1-p*.12);
   const x1=s.a.x,y1=s.a.y,x2=s.b.x,y2=s.b.y;
   // Soft contact shadow gives the tube volume against the pale ground.
   ctx.globalCompositeOperation='multiply';
   ctx.strokeStyle='rgba(78,53,70,.12)';ctx.lineWidth=width*1.65;
   ctx.beginPath();ctx.moveTo(x1+2,y1+4);ctx.lineTo(x2+2,y2+4);ctx.stroke();
   ctx.globalCompositeOperation='source-over';
   // Refractive body, chromatic rim and a narrow specular highlight.
   const body=ctx.createLinearGradient(x1-width,y1-width,x2+width,y2+width);
   body.addColorStop(0,hs(hue-30,94,71,.93));
   body.addColorStop(.24,hs(p.h2+z*25,88,56,.96));
   body.addColorStop(.48,hs(hue+70,100,82,.98));
   body.addColorStop(.72,hs(p.h3+z*40,96,65,.96));
   body.addColorStop(1,hs(hue+22,95,48,.92));
   ctx.strokeStyle=body;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle=hs(hue+65,95,78,.86);ctx.lineWidth=Math.max(1.1,width*.23);
   ctx.beginPath();ctx.moveTo(x1-width*.1,y1-width*.16);ctx.lineTo(x2-width*.1,y2-width*.16);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.88)';ctx.lineWidth=Math.max(1,width*.075);
   ctx.beginPath();ctx.moveTo(x1-width*.2,y1-width*.27);ctx.lineTo(x2-width*.2,y2-width*.27);ctx.stroke();
 }
 // Fine, stationary caustic rings reveal where the material remembers each touch.
 for(const s of scars){
   const a=s.a,pt=project(centerline(a,time,0),rx,ry,rz,scale,cx,cy),r=base*(.018+s.amount*.008);
   ctx.globalCompositeOperation='screen';
   const g=ctx.createRadialGradient(pt.x,pt.y,1,pt.x,pt.y,r*3.2);
   g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.42,hs(p.h2,95,68,.24));g.addColorStop(.62,'rgba(255,255,255,.72)');g.addColorStop(.74,hs(p.h3,100,62,.6));g.addColorStop(1,'rgba(255,255,255,0)');
   ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(pt.x,pt.y,r*3.2,r*1.5, a*.3,0,Math.PI*2);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(render);
}
function touch(x,y){
 if(window.APKit&&APKit.isUI(x,y))return true;
 const a=Math.atan2(y-H*.49,x-W*.5);
 scars.push({a,width:.26,amount:.13+Math.random()*.07});
 if(scars.length>18)scars.shift();
 hint.classList.add('off');return true;
}
canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId)},{passive:true});
APKit.init({canvas:canvas,gifName:'prism-shell-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
 {label:'✦',name:'mutate',onClick:function(){palette=(palette+1)%colors.length;seed=Math.random()*1000;scars.push({a:Math.random()*Math.PI*2,width:.4,amount:.18})}},
 {label:'↻',name:'reset',onClick:function(){scars.length=0;palette=0;hint.classList.remove('off')}}
]});
requestAnimationFrame(render);
</script>
</body>
</html>
