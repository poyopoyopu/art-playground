<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRISM SHELL</title><script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ed}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;text-align:center;color:#786d78;font:500 11px system-ui;letter-spacing:.12em;pointer-events:none;transition:opacity 1s}#hint.off{opacity:0}</style></head>
<body><canvas id="c"></canvas><div id="hint">殻に触れると、光の層がゆっくり組み替わる</div><script>
'use strict';
/* PRISM SHELL — one continuous iridescent glass shell. Touch changes the remembered light. */
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false}),hint=document.getElementById('hint');
let W,H,D=1,t=0,last=performance.now(),pal=0,pulse=0;const marks=[];
const P=[{o:24,l:18,i:195,e:322,a:42},{o:192,l:47,i:177,e:252,a:28},{o:330,l:24,i:205,e:278,a:48},{o:46,l:196,i:188,e:320,a:65}];
function resize(){D=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a=1){return 'hsla('+((h%360+360)%360)+','+s+'%,'+l+'%,'+a+')'}
function path(x,y,w,h){let l=x-w/2,r=x+w/2,u=y-h/2,b=y+h/2;g.beginPath();g.moveTo(x,u);g.bezierCurveTo(l+w*.2,u-h*.01,l,u+h*.07,l,y-h*.16);g.bezierCurveTo(l,y+h*.16,l+w*.02,b-h*.12,x-w*.2,b-h*.025);g.bezierCurveTo(x-w*.07,b+.01*h,x+w*.07,b+.01*h,x+w*.2,b-h*.025);g.bezierCurveTo(r-w*.02,b-h*.12,r,y+h*.16,r,y-h*.16);g.bezierCurveTo(r,u+h*.07,r-w*.2,u-h*.01,x,u);g.closePath()}
function render(){let n=performance.now(),dt=Math.min(.04,(n-last)/1000);last=n;t+=dt;pulse*=.985;g.fillStyle='#f5f1ed';g.fillRect(0,0,W,H);let x=W/2,y=H*.49,b=Math.min(W*.88,H*.83),p=P[pal],breath=1+.009*Math.sin(t*.72)+pulse*.01,w=b*.84*breath,h=b*1.12*breath,top=y-h/2;
let ambient=g.createRadialGradient(x,y-b*.08,b*.02,x,y,b*.78);ambient.addColorStop(0,'rgba(255,255,255,.8)');ambient.addColorStop(1,'rgba(231,220,219,0)');g.fillStyle=ambient;g.fillRect(0,0,W,H);
// One broad outer shell, with warm transmitted light.
g.save();g.shadowColor='rgba(107,57,82,.17)';g.shadowBlur=b*.025;g.shadowOffsetY=b*.014;
let outer=g.createLinearGradient(x-w/2,top,x+w/2,top+h);outer.addColorStop(0,hs(p.o+5,95,65));outer.addColorStop(.18,hs(p.e,92,61));outer.addColorStop(.34,hs(p.o+28,100,72));outer.addColorStop(.56,hs(p.l,98,57));outer.addColorStop(.76,hs(p.a,100,70));outer.addColorStop(.92,hs(p.o+8,100,58));outer.addColorStop(1,hs(p.e+12,95,53));path(x,y,w,h);g.fillStyle=outer;g.fill();g.restore();
// The single inset lens occupies the upper half; no extra rings or tubes.
let iw=w*.72,ih=h*.61,ix=x+Math.sin(t*.31)*b*.004,iy=y-h*.16,ix0=ix-iw/2,iy0=iy-ih/2;
let rim=g.createLinearGradient(ix0,iy0,ix0+iw,iy0+ih);rim.addColorStop(0,hs(p.e+8,92,78));rim.addColorStop(.18,hs(p.e,96,67));rim.addColorStop(.36,hs(p.i+35,90,77));rim.addColorStop(.58,hs(p.i,95,66));rim.addColorStop(.8,hs(p.e+48,94,62));rim.addColorStop(1,hs(p.o+300,100,58));path(ix,iy,iw,ih);g.fillStyle=rim;g.fill();
path(ix,iy,iw*.965,ih*.978);g.save();g.clip();let inner=g.createRadialGradient(ix-iw*.16,iy-ih*.08,iw*.015,ix,iy,iw*.76);inner.addColorStop(0,'rgba(255,255,255,.98)');inner.addColorStop(.25,hs(p.i+28,75,83,.96));inner.addColorStop(.52,hs(p.i,92,66,.82));inner.addColorStop(.77,hs(p.e+25,95,65,.76));inner.addColorStop(1,hs(p.o+290,100,52,.9));g.fillStyle=inner;g.fillRect(ix0,iy0,iw,ih);
let lx=ix+Math.sin(t*.38)*iw*.24,ly=iy+Math.cos(t*.32)*ih*.2,glow=g.createRadialGradient(lx,ly,1,lx,ly,iw*.42);glow.addColorStop(0,'rgba(255,255,255,.28)');glow.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=glow;g.fillRect(ix0,iy0,iw,ih);g.restore();
let edge=g.createLinearGradient(ix0,iy0,ix0+iw,iy0+ih);edge.addColorStop(0,hs(p.e,100,58,.94));edge.addColorStop(.24,'rgba(255,255,255,.92)');edge.addColorStop(.45,hs(p.i+70,100,70,.96));edge.addColorStop(.68,hs(p.o+305,100,60,.95));edge.addColorStop(.86,hs(p.a,100,72,.96));edge.addColorStop(1,hs(p.e+24,100,55,.92));path(ix,iy,iw,ih);g.strokeStyle=edge;g.lineWidth=Math.max(1.4,b*.004);g.stroke();
path(x,y,w,h);g.strokeStyle='rgba(255,255,255,.42)';g.lineWidth=Math.max(1,b*.002);g.stroke();g.beginPath();g.moveTo(x-w*.27,top+h*.045);g.bezierCurveTo(x-w*.04,top-h*.008,x+w*.23,top+.005*h,x+w*.34,top+h*.075);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=Math.max(2,b*.008);g.lineCap='round';g.stroke();
for(const m of marks){let px=m.x*W,py=m.y*H,r=b*.1,light=g.createRadialGradient(px,py,1,px,py,r);light.addColorStop(0,'rgba(255,255,255,0)');light.addColorStop(.5,hs(p.i+45,100,76,.12));light.addColorStop(.72,hs(p.e,100,66,.24));light.addColorStop(1,'rgba(255,255,255,0)');g.globalCompositeOperation='screen';g.fillStyle=light;g.fillRect(px-r,py-r,r*2,r*2)}g.globalCompositeOperation='source-over';requestAnimationFrame(render)}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;marks.push({x:e.clientX/W,y:e.clientY/H});if(marks.length>12)marks.shift();pal=(pal+1)%P.length;pulse=1;hint.classList.add('off');c.setPointerCapture?.(e.pointerId)},{passive:true});
APKit.init({canvas:c,gifName:'prism-shell-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[{label:'✦',name:'mutate',onClick:()=>{pal=(pal+1)%P.length;pulse=1}},{label:'↻',name:'reset',onClick:()=>{marks.length=0;pal=0;pulse=0;hint.classList.remove('off')}}]});requestAnimationFrame(render);
</script></body></html>
