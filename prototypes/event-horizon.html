<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03030a">
<title>EVENT HORIZON</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a}
body{touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* EVENT HORIZON — ChatGPT作。ap-kit.js統合: ChatGPT
   World law: every touch creates a permanent gravitational law.
*/
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2;let W=0,H=0,DPR=1,cx=0,cy=0,scale=1;
let seed=Math.random()*1000,palette=Math.random()*TAU,symmetry=9+Math.floor(Math.random()*5),time=0;
let laws=[],pointer=null;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);cx=W*.5;cy=H*.5;scale=Math.min(W,H)*.47}
addEventListener('resize',resize,{passive:true});resize();
function fract(x){return x-Math.floor(x)}
function hash(n){return fract(Math.sin(n*127.1+seed*19.7)*43758.5453)}
function addLaw(x,y){const dx=(x-cx)/scale,dy=(y-cy)/scale,r=Math.hypot(dx,dy);laws.push({x:dx,y:dy,strength:.52+hash(laws.length+7)*.5,phase:hash(laws.length+31)*TAU,radius:Math.max(.035,Math.min(.55,r)),sign:hash(laws.length+71)>.5?1:-1});if(laws.length>7)laws.shift()}
function field(x,y,t,layer){let xx=x,yy=y;const r=Math.hypot(xx,yy)+1e-5,a=Math.atan2(yy,xx);let bend=0;
for(let k=0;k<3;k++){const s=2**k,aa=a*s+t*(.16+k*.035)+layer*.37;bend+=Math.sin(aa*symmetry+Math.sin(r*8*s-t*.7)*1.7+palette)*(.015/(k+1))}
for(let i=0;i<laws.length;i++){const L=laws[i],dx=xx-L.x,dy=yy-L.y,d=Math.hypot(dx,dy)+.002,influence=Math.exp(-d*(3+L.radius*7))*L.strength,ang=Math.atan2(dy,dx);bend+=L.sign*influence*Math.sin(ang*3+L.phase+t*.25)*(.28/(1+d*4));xx-=dx*influence*.09;yy-=dy*influence*.09}
return{r:Math.hypot(xx,yy),a:a+.20*Math.sin(r*5.2-t*.33+layer*.7)+bend,bend}
}
function colorAt(t,a){const h=(palette+t*1.15+.12*Math.sin(t*7+time*.18))%TAU;const R=Math.floor(140+115*Math.sin(h)**2),G=Math.floor(80+175*Math.sin(h+2.1)**2),B=Math.floor(100+155*Math.sin(h+4.2)**2);return`rgba(${R},${G},${B},${a})`}
function draw(phase){const t=phase==null?time:phase*3;ctx.fillStyle='#03030a';ctx.fillRect(0,0,W,H);
const bg=ctx.createRadialGradient(cx,cy,scale*.025,cx,cy,scale*1.02);bg.addColorStop(0,'#000');bg.addColorStop(.12,'rgba(10,4,18,.98)');bg.addColorStop(.48,'rgba(8,5,18,.72)');bg.addColorStop(1,'#010208');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let layer=0;layer<4;layer++){const R=scale*(.16+layer*.205),count=layer===0?240:180;ctx.beginPath();for(let i=0;i<=count;i++){const u=i/count,a=u*TAU;let radial=1+.045*Math.sin(a*symmetry+t*(.45+layer*.11)+layer*.8)+.028*Math.sin(a*(symmetry*2-1)-t*.31-layer)+.018*Math.sin(a*(symmetry*4+3)+t*.19);const p=field(Math.cos(a)*radial,Math.sin(a)*radial,t,layer),rr=R*(1+.055*Math.sin(a*(symmetry+layer*2)-t*(.55-layer*.04)))*(1+p.bend*.55),x=cx+Math.cos(p.a)*rr,y=cy+Math.sin(p.a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=colorAt(layer*.19,.17+layer*.045);ctx.lineWidth=1+layer*.65;ctx.shadowBlur=layer===0?14:8;ctx.shadowColor=colorAt(layer*.2,.18);ctx.stroke();ctx.shadowBlur=0}
for(let layer=0;layer<3;layer++){const rays=symmetry*(layer+2);for(let j=0;j<rays;j++){const base=j/rays*TAU+layer*.17;ctx.beginPath();for(let q=0;q<=70;q++){const u=q/70,r=.11+u*.87,a=base+.33*Math.sin(u*8-t*.35+layer)*u**.65+.08*Math.sin(u*21+t*.2+j*.7),p=field(Math.cos(a)*r,Math.sin(a)*r,t,layer),rr=scale*(.10+u*.84)*(1+p.bend*.23),x=cx+Math.cos(p.a)*rr,y=cy+Math.sin(p.a)*rr;q?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=colorAt(base+layer*.31,.055+layer*.018);ctx.lineWidth=.55+layer*.22;ctx.stroke()}}
for(const L of laws){const x=cx+L.x*scale,y=cy+L.y*scale,p=.5+.5*Math.sin(t*.7+L.phase);ctx.beginPath();ctx.arc(x,y,1.1+2.2*p,0,TAU);ctx.fillStyle=colorAt(L.phase,.35);ctx.fill()}
const hole=scale*(.105+.008*Math.sin(t*.31)),hg=ctx.createRadialGradient(cx,cy,hole*.58,cx,cy,hole*1.9);hg.addColorStop(0,'#000');hg.addColorStop(.55,'#000');hg.addColorStop(.76,'rgba(0,0,0,.82)');hg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,cy,hole*1.9,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(cx,cy,hole*1.03,0,TAU);ctx.strokeStyle=colorAt(t*.02,.55);ctx.lineWidth=.75;ctx.stroke()}
function reset(){laws=[];time=0;seed=Math.random()*1000}
function mutate(){palette=Math.random()*TAU;symmetry=8+Math.floor(Math.random()*7);seed=Math.random()*1000}
function pointerDown(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture?.(e.pointerId);addLaw(e.clientX,e.clientY)}
function pointerMove(e){if(!pointer||pointer.id!==e.pointerId)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>38)addLaw(e.clientX,e.clientY);pointer.x=e.clientX;pointer.y=e.clientY}
function pointerUp(){pointer=null}
canvas.addEventListener('pointerdown',pointerDown,{passive:false});canvas.addEventListener('pointermove',pointerMove,{passive:false});canvas.addEventListener('pointerup',pointerUp,{passive:true});canvas.addEventListener('pointercancel',pointerUp,{passive:true});
APKit.init({canvas,gifName:'event-horizon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:phase=>draw(phase),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
function frame(){time+=.0065;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
