precision mediump float;out vec4 O;in vec2 v;uniform vec2 R;uniform float T,S;uniform vec4 A[8];uniform int N;uniform int M;float hash(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.23);return fract(p.x*p.y*95.433);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*noise(p);p*=2.03;a*=.5;}return s;}float touch(vec2 p){float q=0.;for(int i=0;i<8;i++){if(i>=N)break;vec2 d=p-A[i].xy;float rr=max(A[i].z,.015);q+=exp(-dot(d,d)/(rr*rr))*(.7+.3*sin(A[i].w));}return min(q,2.5);}vec3 palette(float x,int m){vec3 a,b,c;if(m==0){a=vec3(.01,.035,.04);b=vec3(.08,.34,.38);c=vec3(.75,.42,.12);}else if(m==1){a=vec3(.04,.01,.07);b=vec3(.35,.08,.45);c=vec3(1.,.22,.08);}else if(m==2){a=vec3(.015,.04,.025);b=vec3(.08,.42,.32);c=vec3(.95,.55,.08);}else if(m==3){a=vec3(.035,.008,.06);b=vec3(.22,.08,.5);c=vec3(.95,.32,.12);}else if(m==4){a=vec3(.005,.035,.02);b=vec3(.05,.5,.25);c=vec3(1.,.28,.03);}else if(m==5){a=vec3(.015,.008,.045);b=vec3(.12,.12,.55);c=vec3(1.,.25,.55);}else if(m==6){a=vec3(.02,.025,.035);b=vec3(.05,.45,.55);c=vec3(1.,.25,.08);}else if(m==7){a=vec3(.045,.018,.008);b=vec3(.35,.18,.08);c=vec3(.15,.65,.95);}else if(m==8){a=vec3(.02,.008,.045);b=vec3(.55,.06,.3);c=vec3(.05,.85,1.);}else{a=vec3(.008,.012,.05);b=vec3(.18,.08,.55);c=vec3(.35,1.,.45);}float k=fract(x);return a+b*(.35+.65*k)+c*(k*k*(3.-2.*k));}void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.);float q=touch(p),tt=T*.012;p*=2.15;vec2 w=p+.32*vec2(sin(p.y*2.1+fbm(p*.75+tt)*4.),cos(p.x*2.4-fbm(p*.8-tt)*4.));if(M==3||M==9){w=abs(w)-.34;w*=mat2(.94,-.34,.34,.94);}if(M==6)w+=.18*vec2(sin(w.y*3.),cos(w.x*3.));float n=fbm(w*.95+tt),n2=fbm(w*2.15-n);vec2 cell=floor(w*5.2+n*1.4),f=fract(w*5.2+n*1.4)-.5;float id=hash(cell+S*.0001),edge=min(abs(f.x),abs(f.y)),seam=smoothstep(.075,.018,edge);float filament=pow(abs(sin((w.x+w.y*1.37+n*2.)*18.+T*.006)),7.);float voids=0.;for(int i=0;i<3;i++){float k=float(i);vec2 z=vec2(sin(S*.001+k*4.7),cos(S*.001-k*5.3))*(.42+.12*k);float d=length(w-z+vec2(sin(k*2.1+tt),cos(k*1.7-tt))*.12);voids=max(voids,1.-smoothstep(.12+.06*k,.34+.08*k,d));}voids=max(voids,smoothstep(.45,.9,q));float pressure=smoothstep(.05,.85,q);w*=1.-.42*pressure;float grain=fbm(w*4.+n2),value=.18+.52*n+.22*n2;vec3 col=palette(n+n2*.35+float(M)*.07,M);col*=.35+1.15*value;col+=seam*(.18+.75*filament)*palette(id+q,M);col+=filament*.12*palette(n2+.2,M);col*=1.-.94*voids;float rim=smoothstep(.02,.28,voids)-smoothstep(.28,.55,voids);col+=rim*(.25+.65*filament)*palette(n2+.45,M);col+=grain*.035;O=vec4(max(col,vec3(0.)),1.);}`;function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let u=null;try{const pr=gl.createProgram();gl.attachShader(pr,compile(gl.VERTEX_SHADER,VS));gl.attachShader(pr,compile(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);u={R:gl.getUniformLocation(pr,'R'),T:gl.getUniformLocation(pr,'T'),S:gl.getUniformLocation(pr,'S'),A:gl.getUniformLocation(pr,'A[0]'),N:gl.getUniformLocation(pr,'N'),M:gl.getUniformLocation(pr,'M')}}catch(e){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#020307;font:14px system-ui">WebGL2 could not start</div>');console.error(e)}function draw(t){if(!u)return;gl.uniform2f(u.R,W,H);gl.uniform1f(u.T,t);gl.uniform1f(u.S,seed);gl.uniform1i(u.M,mode);const a=new Float32Array(32);for(let i=0;i<ma
