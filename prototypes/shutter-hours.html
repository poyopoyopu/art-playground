<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SHUTTER HOURS — 羽根を押し広げると、外の時刻がのぞく</title>
<!-- SHUTTER HOURS — クロちゃん作(2026/11/14)。brice_deg氏の「shutters」の投稿から着想。ap-kit.js統合: クロちゃん
     2026/11/14 作り直し(おっちゃん「ビルにこだわる必要もない」「ブラインドをリアルに滑らかに」「タップ効果も変えて」)。
     世界のルール: 窓のブラインドの向こう、向かいのビルの電光掲示板に今の時刻が出ている。見えるのは羽根のすき間からだけ。
       ・指で押さえて動かす = 羽根を押し広げて外をのぞく。離すと羽根はしなりながら戻るが、押し広げた所は少し曲がったまま残る(アルミの羽根の癖)。
       ・タップ = その辺りの羽根がパタパタ揺れ、揺れが上下の羽根へ伝わる。
       ・傾き = 見る角度が変わり、すき間の見え方と外の景色の位置が変わる。
     描き方: 画面の全ピクセルを1本のフラグメントシェーダー(WebGL2)で計算。羽根の傾き・上下のずれは横48点×羽根の枚数の
       小さなテクスチャでJSから渡し、羽根の曲面の光沢・すき間の外の景色・漏れる光のにじみはシェーダーで描く。three.jsは使わない。 -->
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#0d0b09;overflow:hidden;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:84vw;max-width:420px;text-align:center;color:rgba(255,240,222,.9);font:500 13px/1.75 -apple-system,"Hiragino Sans",sans-serif;
  letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.9);pointer-events:none;transition:opacity 1.2s}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#eee;font:14px/1.8 sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">指で押さえると、羽根を押し広げて外がのぞける<br>タップで揺れる・下のスマホの絵で傾き</div>
<div id="err"></div>
<script>
(function () {
'use strict';
function showErr(msg) { const er = document.getElementById('err'); er.style.display = 'flex'; er.textContent = msg; }
addEventListener('error', e => showErr('エラー: ' + (e.message || e)));

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
if (!gl) { showErr('この端末では描画が使えないみたい'); return; }

// ───────── 寸法 ─────────
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
let PITCH = 22, TOP = 20, N = 40;
const K = 48;                          // 羽根1枚あたりの横の点の数
let dy, vdy, ph, vph, dent, dentPh;    // 上下のずれ(ピッチ単位)・傾きのずれ(rad)とその速さ・曲がったままの癖
const stateBuf = { data: null };
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  PITCH = Math.max(16, Math.min(26, H / 38));
  TOP = Math.max(14, PITCH * 0.9);
  const n = Math.ceil((H - TOP) / PITCH) + 1;
  if (n !== N || !dy) {
    N = n; const L = N * K;
    dy = new Float32Array(L); vdy = new Float32Array(L); ph = new Float32Array(L); vph = new Float32Array(L);
    dent = new Float32Array(L); dentPh = new Float32Array(L); stateBuf.data = new Float32Array(L * 4);
  }
  makeOutside();
}

// ───────── 窓の外(向かいのビルの電光掲示板) ─────────
const OUTW = 540;
const outCv = document.createElement('canvas'), outCtx = outCv.getContext('2d');
const blurCv = document.createElement('canvas'), blurCtx = blurCv.getContext('2d');
let city = null, seed = 1;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function makeCity() {
  seed = 1 + Math.floor(Math.random() * 1e6);
  city = { far: [], win: [] };
  let x = -20; while (x < OUTW + 20) { const w = 30 + rnd() * 70; city.far.push({ x, w, h: 0.12 + rnd() * 0.22 }); x += w + rnd() * 6; }
  for (let i = 0; i < 400; i++) city.win.push({ x: rnd(), y: rnd(), on: rnd(), tint: rnd() });
}
const FONT = {
  0:['01110','10001','10011','10101','11001','10001','01110'], 1:['00100','01100','00100','00100','00100','00100','01110'],
  2:['01110','10001','00001','00110','01000','10000','11111'], 3:['11110','00001','00001','01110','00001','00001','11110'],
  4:['00010','00110','01010','10010','11111','00010','00010'], 5:['11111','10000','11110','00001','00001','10001','01110'],
  6:['00110','01000','10000','11110','10001','10001','01110'], 7:['11111','00001','00010','00100','01000','01000','01000'],
  8:['01110','10001','10001','01110','10001','10001','01110'], 9:['01110','10001','10001','01111','00001','00010','01100']
};
// 時刻ごとの空 [時, 上, 下, 太陽のにじみ, 明るさ]
const SKY = [
  [0, '#05070f', '#141a2c', '#1a1830', 0.05], [5, '#0b1022', '#3a3550', '#6a4a5a', 0.12], [6.5, '#3a5a8c', '#e7a77e', '#ffc890', 0.55],
  [9, '#4b86c8', '#bcd8ec', '#fff3dc', 1.0], [15.5, '#4a82c2', '#c6dbe8', '#fff0d0', 0.95], [17.3, '#3b3f66', '#f0a070', '#ffb070', 0.6],
  [18.6, '#1c1c38', '#7a4a5c', '#c0705a', 0.25], [20, '#070a18', '#1a1e34', '#2a2034', 0.07], [24, '#05070f', '#141a2c', '#1a1830', 0.05]
];
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixc(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function skyAt(h) {
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
  const A = SKY[i], B = SKY[i + 1], t = (h - A[0]) / (B[0] - A[0]);
  return { top: mixc(hex(A[1]), hex(B[1]), t), bot: mixc(hex(A[2]), hex(B[2]), t), sun: mixc(hex(A[3]), hex(B[3]), t), lum: A[4] + (B[4] - A[4]) * t };
}
let skyLum = 0.5, skyCol = [1, 1, 1], hourOverride = null;
function hourNow() { if (hourOverride != null) return hourOverride; const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
function rgb(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a == null ? 1 : a) + ')'; }

function makeOutside() {
  const OH = Math.round(OUTW * H / W);
  if (outCv.width !== OUTW || outCv.height !== OH) { outCv.width = OUTW; outCv.height = OH; blurCv.width = 54; blurCv.height = Math.max(8, Math.round(54 * H / W)); }
  drawOutside();
}
let colonOn = true;
function drawOutside() {
  const c = outCtx, w = outCv.width, h = outCv.height, hr = hourNow(), S = skyAt(hr);
  skyLum = S.lum; skyCol = mixc(S.top, S.bot, 0.6).map(v => v / 255);
  const night = 1 - Math.min(1, S.lum * 1.6);
  // 空
  const g = c.createLinearGradient(0, 0, 0, h * 0.55); g.addColorStop(0, rgb(S.top)); g.addColorStop(1, rgb(S.bot));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const sg = c.createRadialGradient(w * 0.82, h * 0.12, 0, w * 0.82, h * 0.12, w * 0.7);
  sg.addColorStop(0, rgb(S.sun, 0.75)); sg.addColorStop(1, rgb(S.sun, 0)); c.fillStyle = sg; c.fillRect(0, 0, w, h * 0.6);
  // 遠くの街
  const farY = h * 0.48;
  c.fillStyle = rgb(mixc(S.bot, [20, 22, 30], 0.7));
  for (const b of city.far) c.fillRect(b.x, farY - b.h * h * 0.5, b.w, b.h * h * 0.5 + 4);
  // 向かいのビル(手前・大きい)
  const by = h * 0.30;
  const wallC = mixc([62, 60, 62], [16, 16, 22], night);
  c.fillStyle = rgb(wallC); c.fillRect(0, by, w, h - by);
  // 窓
  const cols = 9, rows = Math.ceil((h - by) / 46);
  for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
    const x = 14 + q * (w - 28) / cols, y = by + 18 + r * 46, ww = (w - 28) / cols - 14, wh = 26;
    const wn = city.win[(r * cols + q) % city.win.length];
    const lit = wn.on < 0.15 + night * 0.45;
    c.fillStyle = lit ? rgb(wn.tint < 0.7 ? [255, 214, 150] : [190, 220, 255], 0.55 + night * 0.4) : rgb(mixc([120, 140, 160], [20, 24, 34], night), 0.9);
    c.fillRect(x, y, ww, wh);
  }
  // 電光掲示板(縦長の画面は「時」と「分」を2段に)
  const d = new Date(), hh = d.getHours(), mm = d.getMinutes();
  const two = h > w * 1.25;
  const lines = two ? [[Math.floor(hh / 10), hh % 10], [Math.floor(mm / 10), mm % 10]]
                    : [[Math.floor(hh / 10), hh % 10, -1, Math.floor(mm / 10), mm % 10]];
  const cellsW = two ? 11 : 26;   // 数字(5+1)・コロン(2+1)
  const pw = w * 0.92, dot = pw / (cellsW + 2);
  const lineH = dot * 8, ph = lineH * lines.length + dot * (two ? 2 : 1);
  const px = (w - pw) / 2, py = Math.max(by + 16, h * (two ? 0.56 : 0.5) - ph / 2);
  c.fillStyle = '#060504'; c.fillRect(px - 6, py - 6, pw + 12, ph + 12);
  c.fillStyle = '#1b1a18'; c.fillRect(px - 6, py + ph + 6, pw + 12, 5);
  lines.forEach((ln, li) => {
    let cx = px + dot * (two ? 1.5 : 1);
    const ly = py + dot * (two ? 1 : 0.5) + li * (lineH + dot);
    for (const dg of ln) {
      if (dg < 0) {
        for (const ry of [2, 4]) { c.fillStyle = colonOn ? '#ffb347' : 'rgba(255,140,40,.12)'; c.beginPath(); c.arc(cx + dot * 0.5, ly + dot * (ry + 0.5), dot * 0.36, 0, 7); c.fill(); }
        cx += dot * 3; continue;
      }
      const f = FONT[dg];
      for (let r = 0; r < 7; r++) for (let q = 0; q < 5; q++) {
        const on = f[r][q] === '1';
        c.fillStyle = on ? '#ffb347' : 'rgba(255,140,40,.07)';
        c.beginPath(); c.arc(cx + q * dot + dot * 0.5, ly + dot * (r + 0.5), dot * (on ? 0.4 : 0.3), 0, 7); c.fill();
      }
      cx += dot * 6;
    }
  });
  // 縦2段のときは秒の代わりに、掲示板の右下の点が1秒ごとに点滅
  if (two) { c.fillStyle = colonOn ? '#ffb347' : 'rgba(255,140,40,.12)'; c.beginPath(); c.arc(px + pw - dot * 0.9, py + ph - dot * 0.9, dot * 0.3, 0, 7); c.fill(); }
  // にじみ用(縮めるとぼける)
  blurCtx.clearRect(0, 0, blurCv.width, blurCv.height);
  blurCtx.drawImage(outCv, 0, 0, blurCv.width, blurCv.height);
  outDirty = true;
}
let outDirty = true;

// ───────── シェーダー ─────────
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform sampler2D uState, uOut, uBlur;
uniform vec2 uRes; uniform float uDpr, uPitch, uTop, uN, uTheta, uView, uTime, uSkyLum;
uniform vec3 uSlat, uSlat2, uSky; uniform vec2 uPar; uniform float uGrain;
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 outside(vec2 uv){ return texture(uOut, clamp(uv + uPar, vec2(0.001), vec2(0.999))).rgb; }
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uDpr - gl_FragCoord.y) / uDpr;   // CSS px, y下向き
  float u = p.x / uRes.x;
  vec2 ouv = p / uRes;
  vec3 col = outside(ouv);
  vec3 glow = texture(uBlur, clamp(ouv + uPar, vec2(0.001), vec2(0.999))).rgb;
  float pa = 1.0 / uDpr;            // 1ピクセル(CSS px)
  // ── 羽根 ──
  if (p.y > uTop) {
    float fi = (p.y - uTop) / uPitch;
    int i0 = int(floor(fi));
    vec3 sc = vec3(0); float cov = 0.;
    for (int j = 2; j >= -2; j--) {          // 下の羽根を先に(上の羽根が手前に重なる)
      int i = i0 + j; if (i < 0 || float(i) >= uN) continue;
      vec4 st = texture(uState, vec2(u, (float(i) + .5) / uN));
      float th = uTheta + st.y - uView;      // 見る角度込みの傾き(0=閉じて正面向き)
      float yc = uTop + (float(i) + .5) * uPitch + st.x * uPitch;
      float half_ = 0.6 * uPitch * abs(cos(th)) + 0.05 * uPitch * abs(sin(th)) + 0.3;
      float s = (yc - p.y) / half_;          // +1=羽根の上の縁, -1=下の縁
      float a = 1. - smoothstep(1. - 1.6 * pa / half_, 1., abs(s));
      if (a <= 0.) continue;
      // 羽根の曲面(断面がゆるく反っている)
      float cur = 0.42 * s;
      float t2 = th + cur * sign(cos(th));
      vec3 n = normalize(vec3(0., sin(t2), cos(t2)));       // y上・z手前
      // 上を向いた面は空(窓の外)の光を受け、下を向いた面は部屋の暗さ
      float up = max(n.y, 0.), down = max(-n.y, 0.);
      vec3 base = mix(uSlat, uSlat2, h21(vec2(float(i), 3.)) * .25);
      float grain = uGrain * (h21(vec2(floor(p.x * .5), float(i))) - .5) * (0.5 + 0.5 * sin(p.x * .07 + float(i) * 1.7));
      vec3 lit = base * (0.10 + 0.95 * up * (0.25 + uSkyLum) * uSky + 0.06 * down + 0.10 * n.z);
      lit *= 1. + grain;
      // 鏡のような光沢(反射した先の空の明るさ)
      vec3 r = reflect(vec3(0, 0, -1), n);
      float spec = pow(max(r.y, 0.), 6.) * (0.18 + 0.5 * uSkyLum);
      lit += spec * uSky * 0.8;
      // 縁が光る(逆光)
      float rim = smoothstep(0.78, 1., abs(s)) * (0.35 + glow.r * 0.8);
      lit += rim * glow * 0.6;
      // 上の羽根の影
      float shade = 0.6 + 0.48 * smoothstep(-1., 0.9, s);
      lit *= shade;
      lit += uSky * exp(-pow((s - 0.72) / 0.13, 2.)) * (0.12 + 0.35 * uSkyLum) * up;   // 上の縁の照り返し
      sc = mix(sc, lit, a); cov = max(cov, a);
    }
    col = mix(col * 0.92, sc, cov);
    // ── ラダーコード(羽根を吊る糸)と昇降ひも ──
    for (int k = 0; k < 3; k++) {
      float lx = uRes.x * (k == 0 ? 0.14 : (k == 1 ? 0.5 : 0.86));
      if (k == 1 && uRes.x < 560.) continue;
      float dxa = abs(p.x - (lx - 2.2)), dxb = abs(p.x - (lx + 2.2));
      float fa = 1. - smoothstep(0.35, 0.35 + 1.2 * pa, dxa);
      float fb = 1. - smoothstep(0.35, 0.35 + 1.2 * pa, dxb);
      vec3 cord = uSlat * (0.55 + 0.6 * uSkyLum) + glow * 0.3;
      col = mix(col, cord, fa * 0.85);                  // 手前の糸
      col = mix(col, cord * 0.7, fb * 0.6 * (1. - cov)); // 奥の糸(すき間だけ)
      float dl = abs(p.x - lx);                          // 昇降ひも(すき間だけ・羽根には穴)
      col = mix(col, uSlat * 0.6 + glow * 0.2, (1. - smoothstep(0.7, 0.7 + 1.2 * pa, dl)) * (1. - cov));
      col = mix(col, col * 0.55, (1. - smoothstep(1.2, 2.4, dl)) * cov * 0.6);
    }
  } else {
    // ── ヘッドレール ──
    float t = p.y / uTop;
    col = uSlat * (0.55 + 0.45 * smoothstep(0.1, 0.5, t) - 0.35 * smoothstep(0.6, 1., t)) * (0.4 + 0.8 * uSkyLum);
  }
  // 漏れる光のにじみ

  // 部屋の中の暗さ(四隅を少し落とす)
  vec2 q = ouv - .5; col *= 1. - dot(q, q) * 0.55;

}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { showErr('シェーダーのエラー: ' + gl.getShaderInfoLog(s)); throw new Error(gl.getShaderInfoLog(s)); } return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { showErr('シェーダーのエラー: ' + gl.getProgramInfoLog(prog)); return; }
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
const U = {}; ['uState', 'uOut', 'uBlur', 'uRes', 'uDpr', 'uPitch', 'uTop', 'uN', 'uTheta', 'uView', 'uTime', 'uSkyLum', 'uSlat', 'uSlat2', 'uSky', 'uPar', 'uGrain'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
function mkTex(unit, filter) { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
const texState = mkTex(0, gl.LINEAR), texOut = mkTex(1, gl.LINEAR), texBlur = mkTex(2, gl.LINEAR);
gl.uniform1i(U.uState, 0); gl.uniform1i(U.uOut, 1); gl.uniform1i(U.uBlur, 2);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

// ───────── 羽根の色(✦で替わる) ─────────
const PALS = [
  { name: 'ALUMINUM', a: [0.86, 0.85, 0.82], b: [0.80, 0.80, 0.80], grain: 0.03, theta: 1.2 },
  { name: 'WALNUT', a: [0.42, 0.26, 0.15], b: [0.55, 0.36, 0.22], grain: 0.22, theta: 1.15 },
  { name: 'MATTE BLACK', a: [0.16, 0.16, 0.17], b: [0.20, 0.19, 0.18], grain: 0.02, theta: 1.25 },
  { name: 'SAND', a: [0.82, 0.72, 0.58], b: [0.78, 0.66, 0.52], grain: 0.06, theta: 1.1 },
  { name: 'MINT', a: [0.62, 0.80, 0.74], b: [0.70, 0.84, 0.80], grain: 0.03, theta: 1.2 }
];
let pal = 0, theta = PALS[0].theta, thetaT = theta;

// ───────── 触る ─────────
const touch = { on: false, x: 0, y: 0, x0: 0, y0: 0, t0: 0, moved: 0, peek: 0 };
function slatsNear(y) { return (y - TOP) / PITCH - 0.5; }
// 指が押し広げるときの、羽根 i・点 k の目標のずれ
function peekField(i, k, fx, fy, amt) {
  const x = (k + 0.5) / K * W, gx = Math.exp(-Math.pow((x - fx) / (W * 0.16), 2));
  const d = (i - slatsNear(fy));                        // 指より下なら+、上なら-
  const fall = Math.exp(-Math.abs(d) / 1.6);
  return { dy: Math.sign(d || 1) * 1.15 * fall * gx * amt, ph: 0.55 * fall * gx * amt };
}
canvas.addEventListener('pointerdown', e => {
  if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
  touch.on = true; touch.x = touch.x0 = e.clientX; touch.y = touch.y0 = e.clientY; touch.t0 = performance.now(); touch.moved = 0;
  hideHint(); wake(); canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!touch.on) return;
  touch.x = e.clientX; touch.y = e.clientY; touch.moved = Math.max(touch.moved, Math.hypot(touch.x - touch.x0, touch.y - touch.y0));
});
function release() {
  if (!touch.on) return; touch.on = false;
  const quick = performance.now() - touch.t0 < 260 && touch.moved < 12;
  if (quick) flutter(touch.x, touch.y, 1);
  else if (touch.peek > 0.3) {   // 押し広げた所は少し曲がったまま残る
    for (let i = 0; i < N; i++) for (let k = 0; k < K; k++) {
      const f = peekField(i, k, touch.x, touch.y, touch.peek), j = i * K + k;
      dent[j] = Math.max(-0.45, Math.min(0.45, dent[j] + f.dy * 0.16));
      dentPh[j] = Math.min(0.35, dentPh[j] + f.ph * 0.12);
    }
  }
}
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
function flutter(x, y, s) {
  const c = slatsNear(y);
  for (let i = 0; i < N; i++) { const fd = Math.exp(-Math.abs(i - c) / 1.3); if (fd < 0.02) continue;
    for (let k = 0; k < K; k++) { const xx = (k + 0.5) / K * W, gx = Math.exp(-Math.pow((xx - x) / (W * 0.22), 2)), j = i * K + k;
      vph[j] += 9 * s * fd * gx * (i >= c ? 1 : 0.8); vdy[j] += 1.6 * s * fd * gx * Math.sign(i - c || 1); } }
}

// ───────── 傾き ─────────
let tiltOn = false, tiltBtn = null, tiltX = 0, tiltY = 0, viewX = 0, viewY = 0;
function onOri(e) {
  if (e.gamma == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let x = e.gamma, y = e.beta - 45;
  if (ang === 90) { x = e.beta; y = -e.gamma - 45; } else if (ang === -90 || ang === 270) { x = -e.beta; y = e.gamma - 45; }
  tiltX = Math.max(-40, Math.min(40, x)); tiltY = Math.max(-40, Math.min(40, y));
}
function setTilt(on) { tiltOn = on; if (tiltBtn) tiltBtn.classList.toggle('apk-on', on);
  if (on) addEventListener('deviceorientation', onOri); else { removeEventListener('deviceorientation', onOri); tiltX = tiltY = 0; } }
function toggleTilt() {
  if (tiltOn) { setTilt(false); toast('傾き OFF'); return; }
  const D = window.DeviceOrientationEvent; if (!D) { toast('この端末では傾きセンサーが使えないみたい'); return; }
  if (typeof D.requestPermission === 'function') {
    D.requestPermission().then(r => { if (r !== 'denied') { setTilt(true); toast('傾けると、羽根のすき間の見え方が変わる'); } else toast('傾きが許可されなかった'); })
      .catch(() => toast('傾きが許可されなかった'));
  } else { setTilt(true); toast('傾けると、羽根のすき間の見え方が変わる'); }
}
function toast(s) { if (window.APKit && APKit.toast) APKit.toast(s); }

// ───────── ✦ ↻ ─────────
function mutate() {
  pal = (pal + 1) % PALS.length; thetaT = PALS[pal].theta + (Math.random() - 0.5) * 0.16; makeCity(); drawOutside();
  for (let i = 0; i < N; i++) for (let k = 0; k < K; k++) vph[i * K + k] += 3.5 * (0.8 + 0.4 * Math.sin(i * 0.7));
  toast(PALS[pal].name);
}
function reset() { pal = 0; thetaT = PALS[0].theta; dent.fill(0); dentPh.fill(0); makeCity(); drawOutside(); flutter(W / 2, H / 2, 0.6); }

// ───────── 画面を消さない・ヒント ─────────
let wl = null;
async function wake() { try { if ('wakeLock' in navigator && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
wake();
const hintEl = document.getElementById('hint'); let hintGone = false;
function hideHint() { if (hintGone) return; hintGone = true; hintEl.style.opacity = 0; }
setTimeout(hideHint, 9000);

// ───────── 毎フレーム ─────────
let last = performance.now() / 1000, lastSec = -1, breezeAt = 3;
function step(dt) {
  const kP = 70, dP = 3.2, kD = 110, dD = 9, cY = 60;
  if (touch.on && !(performance.now() - touch.t0 < 120 && touch.moved < 6)) touch.peek = Math.min(1, touch.peek + dt * 5); else touch.peek = Math.max(0, touch.peek - dt * 6);
  const pk = touch.peek > 0.001, fx = touch.x, fy = touch.y, c = slatsNear(fy);
  for (let i = 0; i < N; i++) {
    const near = pk && Math.abs(i - c) < 9;
    for (let k = 0; k < K; k++) {
      const j = i * K + k;
      let tDy = dent[j], tPh = dentPh[j];
      if (near) { const f = peekField(i, k, fx, fy, touch.peek); tDy += f.dy; tPh += f.ph; }
      const up = i > 0 ? ph[j - K] : ph[j], dn = i < N - 1 ? ph[j + K] : ph[j];
      vph[j] += (kP * (tPh - ph[j]) - dP * vph[j] + cY * (up + dn - 2 * ph[j])) * dt;
      vdy[j] += (kD * (tDy - dy[j]) - dD * vdy[j]) * dt;
    }
  }
  for (let j = 0; j < N * K; j++) { ph[j] += vph[j] * dt; dy[j] += vdy[j] * dt; }
  // 羽根は横方向には硬い(なめらかにつなぐ)
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < N; i++) {
    const o = i * K; let pd = dy[o], pp = ph[o];
    for (let k = 1; k < K - 1; k++) { const j = o + k, nd = dy[j], np = ph[j];
      dy[j] = nd + 0.3 * ((pd + dy[j + 1]) * 0.5 - nd); ph[j] = np + 0.3 * ((pp + ph[j + 1]) * 0.5 - np); pd = nd; pp = np; }
  }
}
function frame() {
  const now = performance.now() / 1000; const dt = Math.min(0.05, now - last); last = now;
  const sec = Math.floor(Date.now() / 1000);
  if (sec !== lastSec) { lastSec = sec; colonOn = sec % 2 === 0; drawOutside(); }
  // ときどき窓のすき間から風(ほんの少し揺れる)
  if (now > breezeAt) { breezeAt = now + 6 + Math.random() * 10; flutter(Math.random() * W, TOP + Math.random() * (H - TOP), 0.18); }
  const sub = 3; for (let s = 0; s < sub; s++) step(dt / sub);
  theta += (thetaT - theta) * Math.min(1, dt * 2);
  viewX += (tiltX - viewX) * Math.min(1, dt * 4); viewY += (tiltY - viewY) * Math.min(1, dt * 4);

  // 状態をテクスチャへ
  const sd = stateBuf.data;
  for (let j = 0; j < N * K; j++) { sd[j * 4] = dy[j]; sd[j * 4 + 1] = ph[j]; sd[j * 4 + 2] = 0; sd[j * 4 + 3] = 1; }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texState);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, K, N, 0, gl.RGBA, gl.FLOAT, sd);
  if (outDirty) {
    outDirty = false;
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texOut); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, outCv);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texBlur); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, blurCv);
  }
  const P = PALS[pal];
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uDpr, canvas.width / W);
  gl.uniform1f(U.uPitch, PITCH); gl.uniform1f(U.uTop, TOP); gl.uniform1f(U.uN, N);
  gl.uniform1f(U.uTheta, theta); gl.uniform1f(U.uView, viewY * Math.PI / 180 * 0.6); gl.uniform1f(U.uTime, now);
  gl.uniform1f(U.uSkyLum, skyLum); gl.uniform3f(U.uSky, 0.55 + skyCol[0] * 0.6, 0.55 + skyCol[1] * 0.6, 0.55 + skyCol[2] * 0.6);
  gl.uniform3fv(U.uSlat, P.a); gl.uniform3fv(U.uSlat2, P.b); gl.uniform1f(U.uGrain, P.grain);
  gl.uniform2f(U.uPar, -viewX / 40 * 0.04, -viewY / 40 * 0.05);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

makeCity(); layout();
addEventListener('resize', layout);
requestAnimationFrame(frame);

const TILT_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="8.5" y="3" width="7" height="18" rx="2"/><path d="M4.5 9c-1 2-1 4 0 6M19.5 9c1 2 1 4 0 6"/></svg>';
APKit.init({
  canvas: canvas,
  gifName: 'shutter-hours',
  clockFormat: 'spec',
  dock: true,
  autoHide: true,
  fullscreenButton: false,
  buttons: [
    { label: '✦', name: 'mutate', onClick: mutate },   // 羽根の色と開き具合、外の街を替える
    { label: '↻', name: 'reset', onClick: reset },     // 曲がった羽根を新品に戻す
    { label: TILT_SVG, name: 'tilt', onClick: toggleTilt }
  ]
});
setTimeout(() => { tiltBtn = document.querySelector('.apk-btn[aria-label="tilt"]'); }, 0);
// テスト用
window.__sh = { hour: v => { hourOverride = v; drawOutside(); }, flutter: (x, y) => flutter(x, y, 1), state: () => ({ N, K, PITCH }) };
})();
</script>
