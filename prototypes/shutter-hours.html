<title>SHUTTER HOURS — 塔の鎧戸は、指でともした灯りへ向き直る</title>
<!-- SHUTTER HOURS — クロちゃん作(2026/11/14)。brice_deg氏の「shutters」(three.js + WebGPU)の投稿から着想。ap-kit.js統合: クロちゃん
     世界のルール: 塔の外壁の鎧戸(約1万2千枚)は、みな指でともした灯りのほうへ向く。向き直りは触れた所から波で広がる。
     時計: 開いた鎧戸の奥の明かりで、左の面=時・右の面=分。秒=角を昇るエレベーター。毎分=上からめくれて数字が替わる。毎正時=塔じゅうの板が一回転。
     技術: three.js r187 の WebGPURenderer(WebGPUが無い端末は自動でWebGL2)、TSLのブルーム、InstancedMesh。板の色は毎フレームJSで
     「灯りの当たり・空の映り込み・きらめき」から計算する。 -->

const scene = new THREE.Scene();

// ───────── 空(正距円筒の絵。背景と映り込みの両方に使う) ─────────
const SKW = 384, SKH = 192;
const skyCv = document.createElement('canvas'); skyCv.width = SKW; skyCv.height = SKH;
const skyCtx = skyCv.getContext('2d');

// 横につながる雲のノイズ(起動時に1回)
function hash3(x, y, z) { let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  return L(L(L(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),L(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
           L(L(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),L(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);
}
const cloud = new Float32Array(SKW * SKH);
let cloudSeed = 1;
function makeClouds() {
  cloudSeed = Math.random() * 100;
  for (let y = 0; y < SKH; y++) {
    const el = (0.5 - y / SKH) * Math.PI;              // 高度
    const band = Math.max(0, Math.sin(Math.min(Math.max((el - 0.02) / 0.9, 0), 1) * Math.PI)); // 地平線近くと天頂は薄め
    for (let x = 0; x < SKW; x++) {
      const a = x / SKW * Math.PI * 2, R = 3.2;
      const px = Math.cos(a) * R, pz = Math.sin(a) * R, py = el * 5 + cloudSeed;
      let n = 0, amp = .55, fr = 1;
      for (let o = 0; o < 4; o++) { n += amp * vnoise(px * fr + 11, py * fr, pz * fr + 7); amp *= .5; fr *= 2.1; }
      cloud[y * SKW + x] = Math.max(0, Math.min(1, (n - 0.47) * 3.2)) * band;
    }
  }
}
// 時刻ごとの空の色(sRGB)。[時, 天頂, 中ほど, 地平, 雲の影, 雲の明るい所, 太陽のにじみ]
const SKY_KEYS = [
  [0,   [6,8,18],    [12,16,34],   [26,30,50],   [16,18,28],  [40,44,64],   [40,36,50]],
  [4.5, [8,10,24],   [16,20,40],   [40,38,60],   [20,22,34],  [60,58,80],   [80,60,70]],
  [6,   [30,38,70],  [90,80,110],  [230,150,110],[70,60,80],  [250,180,140],[255,170,110]],
  [8,   [55,100,165],[120,160,205],[190,210,225],[150,160,175],[245,245,248],[255,240,210]],
  [15.5,[50,95,160], [115,155,200],[200,215,225],[150,158,170],[245,243,240],[255,235,200]],
  [17.2,[48,44,62],  [120,82,76],  [215,130,80], [90,62,60],  [240,150,90], [255,150,70]],
  [18.4,[30,26,40],  [80,52,54],   [170,92,60],  [60,40,42],  [200,110,70], [230,110,60]],
  [20,  [10,12,26],  [20,22,42],   [44,40,58],   [22,22,34],  [60,56,76],   [70,50,60]],
  [24,  [6,8,18],    [12,16,34],   [26,30,50],   [16,18,28],  [40,44,64],   [40,36,50]]
];
function skyKey(h) {
  let i = 0; while (i < SKY_KEYS.length - 2 && SKY_KEYS[i + 1][0] <= h) i++;
  const A = SKY_KEYS[i], B = SKY_KEYS[i + 1], t = (h - A[0]) / (B[0] - A[0]);
  const out = []; for (let k = 1; k < 7; k++) out.push(A[k].map((v, j) => v + (B[k][j] - v) * t));
  return out;
}
const SKL_W = 96, SKL_H = 48;
const skyLin = new Float32Array(SKL_W * SKL_H * 3);   // 映り込み用(リニア)
let skyAmb = [0.1, 0.1, 0.1];                         // 空の平均(環境光)
let skyHour = -1;
const SUN_U = 0.62;                                   // 夕日・朝日のにじみの方角
function paintSky(h) {
  skyHour = h;
  const [zen, mid, hor, cD, cL, glow] = skyKey(h);
  const img = skyCtx.createImageData(SKW, SKH), d = img.data;
  const dusk = Math.max(0, 1 - Math.min(Math.abs(h - 17.8), Math.abs(h - 6.2)) / 1.6);  // 夕焼け・朝焼けの強さ
  for (let y = 0; y < SKH; y++) {
    const el = (0.5 - y / SKH) * Math.PI;
    for (let x = 0; x < SKW; x++) {
      let c;
      if (el < 0) { const t = Math.min(1, -el / 0.25); c = hor.map((v, j) => v * (1 - t) * .55 + 8 * t); }
      else { const t = Math.min(1, el / 1.2); const t1 = Math.min(1, t * 2), t2 = Math.max(0, t * 2 - 1);
        c = t < .5 ? hor.map((v, j) => v + (mid[j] - v) * t1) : mid.map((v, j) => v + (zen[j] - v) * t2); }
      // 太陽のにじみ
      let du = Math.abs(x / SKW - SUN_U); du = Math.min(du, 1 - du);
      const g = Math.exp(-(du * du) / 0.012 - (el * el) / 0.06) * (0.35 + dusk * 0.9);
      c = c.map((v, j) => v + (glow[j] - v) * Math.min(1, g));
      // 雲
      const cl = cloud[y * SKW + x];
      if (cl > 0 && el > -0.02) {
        const lit = Math.min(1, 0.35 + Math.exp(-(du * du) / 0.05) * (0.4 + dusk * 0.6) + (1 - Math.min(1, el)) * 0.2);
        const cc = cD.map((v, j) => v + (cL[j] - v) * lit);
        c = c.map((v, j) => v + (cc[j] - v) * Math.min(1, cl * 1.15));
      }
      const o = (y * SKW + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  skyCtx.putImageData(img, 0, 0); skyTex.needsUpdate = true;
  // 映り込み用に縮めてリニアへ
  const sx = SKW / SKL_W, sy = SKH / SKL_H; let ar = 0, ag = 0, ab = 0;
  for (let y = 0; y < SKL_H; y++) for (let x = 0; x < SKL_W; x++) {
    const o = (Math.floor(y * sy + sy / 2) * SKW + Math.floor(x * sx + sx / 2)) * 4, k = (y * SKL_W + x) * 3;

let skyDrift = 0;

// ───────── 地面と塔の骨組み ─────────
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshBasicMaterial({ color: 0x0b0806 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const core = new THREE.Mesh(new THREE.BoxGeometry(W - 0.7, TOP + 1.4, W - 0.7), new THREE.MeshBasicMaterial({ color: 0x070505 }));
core.position.y = (TOP + 1.4) / 2; scene.add(core);
// 1階(ロビー)と屋上の帯
const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, BASE, W + 0.3), new THREE.MeshBasicMaterial({ color: 0x15100d }));
plinth.position.y = BASE / 2; scene.add(plinth);
const crown = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 1.4, W + 0.4), new THREE.MeshBasicMaterial({ color: 0x1a1410 }));
crown.position.y = TOP + 0.7; scene.add(crown);
// 方立(縦)と階の梁(横)
{
  const bars = [];
  for (let f = 0; f < FACES; f++) {
    const n = FN[f], t = FT[f];
    for (let c = 0; c <= COLS; c++) { const s = c * BAY_W - HW, corner = (c === 0 || c === COLS);
      bars.push({ p: [n[0] * (HW + .12) + t[0] * s, BASE + ROWS * BAY_H / 2, n[2] * (HW + .12) + t[2] * s], sx: corner ? .34 : .09, sy: ROWS * BAY_H, f }); }
    for (let r = 0; r <= ROWS; r++)
      bars.push({ p: [n[0] * (HW + .1), BASE + r * BAY_H, n[2] * (HW + .1)], sx: W, sy: (r % 6 === 0) ? .16 : .07, f });
  }
  const g = new THREE.BoxGeometry(1, 1, 0.3);
  const m = new THREE.InstancedMesh(g, new THREE.MeshBasicMaterial({ color: 0x1c1612 }), bars.length);
  const q = new THREE.Quaternion(), M = new THREE.Matrix4(), Y = new THREE.Vector3(0, 1, 0);
  bars.forEach((b, i) => { q.setFromAxisAngle(Y, b.f * Math.PI / 2); M.compose(new THREE.Vector3(...b.p), q, new THREE.Vector3(b.sx, b.sy, 1)); m.setMatrixAt(i, M); });
  scene.add(m);
}

// ───────── 区画(奥の部屋の明かり) ─────────
const bayP = new Float32Array(NBAY * 3), bayF = new Uint8Array(NBAY), bayC = new Uint8Array(NBAY), bayR = new Uint8Array(NBAY);
const bayIdx = (f, c, r) => (f * ROWS + r) * COLS + c;
const roomMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(BAY_W * 0.97, BAY_H * 0.95), new THREE.MeshBasicMaterial({ color: 0xffffff }), NBAY);
{
  const q = new THREE.Quaternion(), M = new THREE.Matrix4(), Y = new THREE.Vector3(0, 1, 0), S = new THREE.Vector3(1, 1, 1);
  for (let f = 0; f < FACES; f++) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const b = bayIdx(f, c, r), n = FN[f], t = FT[f], s = (c + .5) * BAY_W - HW, y = BASE + (r + .5) * BAY_H;

// 区画の役割: 0=空き 1=数字 2=住人の明かり 3=エレベーター
const role = new Uint8Array(NBAY);

const tileGeo = new THREE.BoxGeometry(TW, TH, 0.035);

function paintTints() {
  const P = PALS[pal];
  for (let b = 0; b < NBAY; b++) { const j = (bayR[b] * 7 + bayC[b] * 3 + bayF[b]) % 5; const w = 0.85 + 0.15 * hash3(b, 3, 9);
    tint[b * 3] = P.base[0] * w; tint[b * 3 + 1] = P.base[1] * w; tint[b * 3 + 2] = P.base[2] * w; }
  const nPatch = 70;
  for (let p = 0; p < nPatch; p++) {
    const f = Math.floor(Math.random() * FACES), w = 1 + Math.floor(Math.random() * 4), h = 2 + Math.floor(Math.random() * 6);
    const c0 = Math.floor(Math.random() * (COLS - w + 1)), r0 = Math.floor(Math.random() * (ROWS - h + 1));
    let col;
    if (P.patch) col = P.patch[Math.floor(Math.random() * P.patch.length)];
    else col = hsv((r0 + h / 2) / ROWS * 0.9 + f * 0.25 + Math.random() * .08, .75, 1.0);
    for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) {

    }

}

let curMin = -1, curHour = -1, digitColor = [];
