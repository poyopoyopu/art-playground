<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALEIDO FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* KALEIDO FOLD — ChatGPT作。万華鏡の対称法則をタッチで変える。 */

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl)throw new Error('WebGL2 unavailable');

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 O;

uniform vec2 r;
uniform float t;
uniform float seed;
uniform float twist;
uniform float fold;
uniform float scale;

#define TAU 6.28318530718

vec3 hsv(float h,float s,float v){
  vec3 k=vec3(1.0,2.0/3.0,1.0/3.0);
  vec3 p=abs(fract(vec3(h)+k)*6.0-3.0);
  return v*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),s);
}

vec2 mirror(vec2 p,float n,float rot){
  float a=atan(p.y,p.x)+rot;
  float s=TAU/n;
  a=mod(a+s*.5,s)-s*.5;
  a=abs(a);
  float d=length(p);
  return vec2(cos(a),sin(a))*d;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
  float d=length(p);

  float n=8.0+floor(mod(seed+abs(fold)*1.7,6.0));
  float sc=1.0+scale*.08;
  vec3 col=vec3(.91,.92,.95);

  for(int i=0;i<6;i++){
    float fi=float(i);
    vec2 q=mirror(p*sc*(1.0+fi*.075),n,twist+fi*.13);
    float qr=length(q);
    float qa=atan(q.y,q.x);

    float sector=TAU/n;
    float wedge=abs(qa)/(sector*.5);

    float radial=qr*(3.0+fi*.55)+fi*.31-t*(.10+fi*.018);
    float cell=fract(radial);
    float band=1.0-smoothstep(.10,.20,cell);
    band=max(band,1.0-smoothstep(.80,.90,cell));

    float diagonal=fract(qr*(2.0+fi*.25)+abs(qa)/sector*2.0+fi*.37);
    float facet=smoothstep(.04,.18,diagonal)*smoothstep(.96,.82,diagonal);

    float edge=smoothstep(.82,.98,wedge);
    float h=fract(seed*.035+fi*.17+floor(radial)*.095+wedge*.18);
    vec3 c=hsv(h,.72,.72+.18*facet);

    float w=.22+.12*band+.08*facet;
    col=mix(col,c,w);

    col*=1.0-.10*edge;
  }

  float center=exp(-d*5.5);
  col=mix(col,vec3(.96,.98,1.0),center*.20);

  float aperture=1.0-smoothstep(.010,.016,d);
  col*=1.0-aperture;

  col=pow(clamp(col,0.0,1.0),vec3(.92));
  O=vec4(col,1.0);
}
`;

function shader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}

const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={
  r:gl.getUniformLocation(program,'r'),
  t:gl.getUniformLocation(program,'t'),
  seed:gl.getUniformLocation(program,'seed'),
  twist:gl.getUniformLocation(program,'twist'),
  fold:gl.getUniformLocation(program,'fold'),
  scale:gl.getUniformLocation(program,'scale')
};

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*10;
let twist=0;
let fold=0;
let scale=0;
let dragging=false;
let lastX=0,lastY=0;
let phase=0;
let paused=false;
let last=performance.now();

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);
resize();

function draw(ph){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform1f(U.t,ph);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.twist,twist);
  gl.uniform1f(U.fold,fold);
  gl.uniform1f(U.scale,scale);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  const cx=e.clientX-W*.5;
  const cy=e.clientY-H*.5;
  twist+=Math.atan2(cy,cx)*.06;
  fold=Math.max(-3,Math.min(3,fold+(Math.hypot(cx,cy)/Math.min(W,H)-.45)*.35));
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(e.buttons&&dragging){
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    twist+=dx*.009;
    fold=Math.max(-3,Math.min(3,fold-dy*.014));
    scale=Math.max(-1,Math.min(1,scale+dx*.0012));
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
canvas.addEventListener('pointerup',()=>{dragging=false});
canvas.addEventListener('pointercancel',()=>{dragging=false});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  if(!paused){
    phase=(phase+dt*.30)%6.28318530718;
    draw(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,
  gifName:'kaleido-fold-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph)},
  onExportEnd:function(){paused=false;last=performance.now()},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*10;
      twist=(Math.random()-.5)*6.28;
      fold=(Math.random()-.5)*3;
      scale=(Math.random()-.5)*1.2;
    }},
    {label:'↻',name:'reset',onClick:function(){
      seed=0;twist=0;fold=0;scale=0;
    }}
  ]
});
</script>
</body>
</html>
