<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KALEIDO FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* KALEIDO FOLD — ChatGPT作。万華鏡の対称法則をタッチで変える。 */

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl)throw new Error('WebGL2 unavailable');

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 O;

uniform vec2 r;
uniform float t;
uniform float seed;
uniform float twist;
uniform float fold;
uniform float scale;

#define TAU 6.28318530718

vec3 hsv(float h,float s,float v){
  vec3 k=vec3(1.0,2.0/3.0,1.0/3.0);
  vec3 p=abs(fract(vec3(h)+k)*6.0-3.0);
  return v*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),s);
}

mat2 rot(float a){
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}

vec2 kaleido(vec2 p,float n,float rot0){
  float a=atan(p.y,p.x)+rot0;
  float sec=TAU/n;
  a=mod(a+sec*.5,sec)-sec*.5;
  a=abs(a);
  float d=length(p);
  return vec2(cos(a),sin(a))*d;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
  p*=1.12+scale*.06;

  float n=6.0+floor(mod(seed+abs(fold)*1.4,7.0));
  vec2 q=kaleido(p,n,twist);

  // Cartesian recursive folding: the visual unit is a facet, not a ray.
  q=rot(.18*sin(seed))*q;
  float depth=0.0;
  for(int i=0;i<5;i++){
    float fi=float(i);
    q=abs(q);
    q=q*1.55-vec2(.48,.30);
    q*=rot(.58+fi*.09+fold*.025);
    depth+=length(q)*.10;
  }

  // Folded triangular cell coordinates.
  vec2 g=q*2.35;
  vec2 cell=floor(g);
  vec2 fcell=fract(g)-.5;
  float parity=mod(cell.x+cell.y,2.0);

  // Cut each square into two large polygonal facets.
  float diag=(fcell.x+fcell.y)*(parity*2.0-1.0);
  float facet=step(0.0,diag);

  float edge=max(
    smoothstep(.47,.36,abs(fcell.x)),
    smoothstep(.47,.36,abs(fcell.y))
  );
  float diagonalEdge=smoothstep(.47,.34,abs(fcell.x+fcell.y));

  float h=fract(
    seed*.07+
    cell.x*.073+
    cell.y*.117+
    facet*.16+
    floor(depth*5.0)*.035
  );

  vec3 c1=hsv(h,.78,.88);
  vec3 c2=hsv(h+.085,.62,.96);
  vec3 col=mix(c1,c2,facet);

  // Glass-like internal planes.
  float sheen=.5+.5*cos(
    fcell.x*5.5+fcell.y*4.0+t*(.20+sin(seed)*.0)
  );
  col=mix(col,vec3(1.0),sheen*.13);

  // Keep facets crisp while retaining a little softness.
  float boundary=min(edge,diagonalEdge);
  col*=.82+.18*boundary;

  // Subtle nested kaleidoscope ghost planes.
  vec2 q2=kaleido(p*1.92,n+2.0,twist-.37);
  float ghost=.5+.5*cos(q2.x*10.0-q2.y*7.0+t*.12);
  col=mix(col,vec3(.94,.97,1.0),ghost*.07);

  float d=length(p);
  float aperture=1.0-smoothstep(.010,.016,d);
  col*=1.0-aperture;

  col=pow(clamp(col,0.0,1.0),vec3(.94));
  O=vec4(col,1.0);
}
`;

function shader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}

const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={
  r:gl.getUniformLocation(program,'r'),
  t:gl.getUniformLocation(program,'t'),
  seed:gl.getUniformLocation(program,'seed'),
  twist:gl.getUniformLocation(program,'twist'),
  fold:gl.getUniformLocation(program,'fold'),
  scale:gl.getUniformLocation(program,'scale')
};

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*10;
let twist=0;
let fold=0;
let scale=0;
let dragging=false;
let lastX=0,lastY=0;
let phase=0;
let paused=false;
let last=performance.now();

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);
resize();

function draw(ph){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform1f(U.t,ph);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.twist,twist);
  gl.uniform1f(U.fold,fold);
  gl.uniform1f(U.scale,scale);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  const cx=e.clientX-W*.5;
  const cy=e.clientY-H*.5;
  twist+=Math.atan2(cy,cx)*.06;
  fold=Math.max(-3,Math.min(3,fold+(Math.hypot(cx,cy)/Math.min(W,H)-.45)*.35));
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(e.buttons&&dragging){
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    twist+=dx*.009;
    fold=Math.max(-3,Math.min(3,fold-dy*.014));
    scale=Math.max(-1,Math.min(1,scale+dx*.0012));
    lastX=e.clientX;
    lastY=e.clientY;
  }
});
canvas.addEventListener('pointerup',()=>{dragging=false});
canvas.addEventListener('pointercancel',()=>{dragging=false});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  if(!paused){
    phase=(phase+dt*.30)%6.28318530718;
    draw(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,
  gifName:'kaleido-fold-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph)},
  onExportEnd:function(){paused=false;last=performance.now()},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*10;
      twist=(Math.random()-.5)*6.28;
      fold=(Math.random()-.5)*3;
      scale=(Math.random()-.5)*1.2;
    }},
    {label:'↻',name:'reset',onClick:function(){
      seed=0;twist=0;fold=0;scale=0;
    }}
  ]
});
</script>
</body>
</html>
