<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RADIAL FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/*
 RADIAL FOLD — ChatGPT作。
 多角形の折り返しを同心方向へ再帰適用し、
 画面全体を色面の自己相似構造として生成する。
 タッチは局所変形ではなく、全体の折り方の法則だけを書き換える。
*/

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{
  antialias:false,
  alpha:false,
  preserveDrawingBuffer:true
});
if(!gl) throw new Error('WebGL2 unavailable');

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 O;

uniform vec2 r;
uniform float t;
uniform float seed;
uniform float lawTwist;
uniform float lawFold;
uniform float lawScale;

#define PI 3.14159265359
#define TAU 6.28318530718

vec3 hsv(float h,float s,float v){
  vec3 k=vec3(1.0,2.0/3.0,1.0/3.0);
  vec3 p=abs(fract(vec3(h)+k)*6.0-3.0);
  return v*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),s);
}

vec2 polygonFold(vec2 p,float sides,float twist){
  float a=atan(p.y,p.x)+twist;
  float sector=TAU/sides;
  a=mod(a+sector*.5,sector)-sector*.5;
  float rr=length(p);
  return vec2(cos(a),sin(a))*rr;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
  vec2 p=uv;

  float a=atan(p.y,p.x);
  float rad=length(p);

  vec3 col=vec3(0.0);
  float energy=0.0;

  for(int i=0;i<7;i++){
    float fi=float(i);
    float sides=5.0+mod(fi+seed+floor(abs(lawFold)*2.0),5.0);
    float phase=fi*1.173 + sin(t*.55+fi*.71)*.18 + seed*.7 + lawTwist*(1.0+fi*.13);

    vec2 z=p*(1.08+fi*.055);
    z*=1.0+lawScale*(0.035+fi*.012);
    z=polygonFold(z,sides,phase);

    for(int j=0;j<5;j++){
      float fj=float(j);
      z=abs(z)-vec2(.17+.025*sin(fi+fj),.11);
      z*=1.18+fj*.035;
      z=polygonFold(z,4.0+mod(fi+fj,4.0),phase+fj*.43);
    }

    float localR=length(z);
    float localA=atan(z.y,z.x);
    float facet=abs(sin(localA*sides*.5 + phase));
    float rings=abs(sin(log(localR+.025)*3.4-fi*.73+t*.18));
    float v=.46+.54*facet;
    float h=fract(localA/TAU+fi*.115+localR*.17+rings*.11+t*.035+seed*.09);

    vec3 c=hsv(h,.88,v);
    float layer=exp(-abs(length(z)-.32)*2.4);
    col+=c*(.12+layer*.18);
    energy+=.16+layer*.12;
  }

  float core=1.0-smoothstep(.045,.065,rad);
  col*=1.0-core;

  float seam=pow(abs(sin(a*18.0 + rad*9.0 + t*.12)),18.0);
  col*=.82+.18*seam;

  col=col/max(energy,.001)*2.9;
  col=pow(max(col,0.0),vec3(.86));

  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  }
  return s;
}

const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
  throw new Error(gl.getProgramInfoLog(program)||'program link failed');
}

const U={
  r:gl.getUniformLocation(program,'r'),
  t:gl.getUniformLocation(program,'t'),
  touch:gl.getUniformLocation(program,'touch'),
  seed:gl.getUniformLocation(program,'seed'),
  lawTwist:gl.getUniformLocation(program,'lawTwist'),
  lawFold:gl.getUniformLocation(program,'lawFold'),
  lawScale:gl.getUniformLocation(program,'lawScale')
};

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
  -1,-1, 1,-1, -1,1, 1,1
]),gl.STATIC_DRAW);

gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*8;
let lawTwist=0;
let lawFold=0;
let lawScale=0;
let dragging=false;
let lastX=0,lastY=0;
let phase=0;
let paused=false;
let last=performance.now();

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);
resize();

function draw(ph){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform1f(U.t,ph);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.lawTwist,lawTwist);
  gl.uniform1f(U.lawFold,lawFold);
  gl.uniform1f(U.lawScale,lawScale);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
  /* A tap itself changes the global fold law. */
  const cx=e.clientX-W*.5;
  const cy=e.clientY-H*.5;
  lawTwist+=Math.atan2(cy,cx)*.08;
  lawScale=Math.max(-1.0,Math.min(1.0,lawScale+(Math.hypot(cx,cy)/Math.min(W,H)-.35)*.18));
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(e.buttons&&dragging){
    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;
    lawTwist+=dx*.010;
    lawFold=Math.max(-2.5,Math.min(2.5,lawFold-dy*.012));
    lawScale=Math.max(-1.0,Math.min(1.0,lawScale+dx*.0015));
    lastX=e.clientX;
    lastY=e.clientY;
  }
});

canvas.addEventListener('pointerup',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  dragging=false;
});
canvas.addEventListener('pointercancel',()=>{dragging=false;});

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;

  if(!paused){
    phase=(phase+dt*.34)%6.28318530718;
    draw(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,
  gifName:'radial-fold-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){
    paused=true;
    draw(ph);
  },
  onExportEnd:function(){
    paused=false;
    last=performance.now();
  },
  buttons:[
    {
      label:'✦',
      name:'mutate',
      onClick:function(){
        seed=Math.random()*8;
        lawTwist=(Math.random()-.5)*3.0;
        lawFold=(Math.random()-.5)*2.0;
        lawScale=(Math.random()-.5)*1.2;
      }
    },
    {
      label:'↻',
      name:'reset',
      onClick:function(){
        seed=0;
        lawTwist=0;
        lawFold=0;
        lawScale=0;
        targetX=0;
        targetY=0;
      }
    }
  ]
});
</script>
</body>
</html>
