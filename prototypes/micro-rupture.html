<!doctype html><!-- MICRO RUPTURE — ChatGPT作。極小セルの自己相似裂け目。ap-kit.js統合 --><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MICRO RUPTURE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,seed=Math.random()*1e5,marks=[],down=0,lx=0,ly=0;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=(h%360+360)%360/60;let i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s),a,b,d;switch(i%6){case 0:a=v;b=u;d=p;break;case 1:a=q;b=v;d=p;break;case 2:a=p;b=v;d=u;break;case 3:a=p;b=q;d=v;break;case 4:a=u;b=p;d=v;break;default:a=v;b=p;d=q}return`rgb(${a*255|0},${b*255|0},${d*255|0})`}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function warp(x,y,t){let X=x,Y=y,cc=0;for(let k=0;k<4;k++){for(const m of marks){let dx=X-m.x,dy=Y-m.y,d=Math.hypot(dx,dy),a=Math.exp(-d*d/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.16);if(a>.002){let q=Math.atan2(dy,dx)+m.spin*a;X-=Math.cos(q)*a*m.push;Y-=Math.sin(q)*a*m.push;cc+=a*(k+1)}}X=Math.sign(X)*Math.min(1,Math.abs(X)*1.08+Math.sin(Y*9+k)*.012);Y=Y*.91+Math.sin(X*7+k)*.018}return[X,Y,cc]}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let s=5.2,cols=Math.ceil(W/s)+1,rows=Math.ceil(H/s)+1;for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let x=i*s,y=j*s,nx=x/W*2-1,ny=y/H*2-1,z=warp(nx,ny,t);let amp=Math.sin(nx*31+ny*17+seed*.01)*.5+Math.sin(nx*71-ny*43)*.25;let hue=seed*.03+i*.17+j*.11+z[2]*210+amp*28;g.fillStyle=hsv(hue,1,.95);let q=s*.82;g.fillRect(x+z[0]*s*2-q/2,y+z[1]*s*2-q/2,q,q)}}
function touch(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:y/H*2-1,r:tap?.22:.11,push:tap?1.8:.95,spin:(vx-vy)*.012+1.7,t:performance.now()});if(marks.length>32)marks.shift();draw(performance.now());return false}
function downFn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=pt(e);down=1;lx=p.x;ly=p.y;touch(p.x,p.y,0,0,1)}function move(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=pt(e),dx=p.x-lx,dy=p.y-ly;if(Math.hypot(dx,dy)>7){touch(p.x,p.y,dx,dy,0);lx=p.x;ly=p.y}}function up(){down=0}c.onpointerdown=downFn;c.onpointermove=move;c.onpointerup=up;c.onpointercancel=up;
let st=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-rupture-loop',clockFormat:'spec',loopFrame:p=>draw(st+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*1e5;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
