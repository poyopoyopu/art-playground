<!-- TIDE MARK — クロちゃん(Claude)作。おっちゃん提供の動画(虹色の境界が斜めに走るグラデーション)を参考に、
     「境界=なぎさ」という世界のルールで再構成。ap-kit.js統合: クロちゃん -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TIDE MARK — なぎさの法則</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f2ece2;overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../ap-kit.js"></script>
<script>
(function(){
"use strict";

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
addEventListener('orientationchange',resize);
resize();

/* ---------- 世界のルール ----------
   画面には二つの気配(暖かい側/冷たい側)を分ける虹色のなぎさが一本、ゆるやかに弧を描いている。
   指でなぞると、その場所でなぎさが押し出され、新しい満ち引きの跡(傷)になる。
   跡は消えない。なぞるたびに、なぎさの形そのものが積み重なって変わっていく。
   ✦は新しい満潮(全く新しいなぎさの形と色)を呼ぶ。↻は最初の凪の状態に戻す。
------------------------------------ */

var MAX_MARKS=140;
var marks=[];       // 恒久的な跡 {s, strength, sigma}
var active=null;    // ドラッグ中の一時的な跡

// 弧は基本1つのゆるいうねり(amp[0]/freq[0])に、ごく小さな副うねりを1つ添えるだけ。
// 参考動画のような「画面を一度だけ大きく弧を描いて横切る帯」に寄せてある。
var DEFAULT_SHAPE={tilt:0.30,amp:[64,7],freq:[0.55,1.7],phase:[0.5,3.4],hue:326};
var shape=cloneShape(DEFAULT_SHAPE);

function cloneShape(s){return {tilt:s.tilt,amp:s.amp.slice(),freq:s.freq.slice(),phase:s.phase.slice(),hue:s.hue};}

function rand(a,b){return a+Math.random()*(b-a);}

function randomShape(){
  return {
    tilt: rand(-0.42,0.42),
    amp:[rand(42,78),rand(3,12)],
    freq:[rand(0.4,0.8),rand(1.3,2.1)],
    phase:[rand(0,6.28),rand(0,6.28)],
    hue: rand(0,360)
  };
}

/* ---------- なぎさの形 ---------- */
function gaussian(d,sigma){var v=d/sigma;return Math.exp(-0.5*v*v);}

function baseY(s,ambient){
  var y=H*0.5 + shape.tilt*(s-0.5)*W;
  y += shape.amp[0]*Math.sin(shape.freq[0]*6.2832*s+shape.phase[0]);
  y += shape.amp[1]*Math.sin(shape.freq[1]*6.2832*s+shape.phase[1]);
  y += ambient*Math.sin(Math.PI*s);
  return y;
}

function curveY(s,ambient){
  var y=baseY(s,ambient);
  for(var i=0;i<marks.length;i++){
    var m=marks[i];
    y += m.strength*gaussian(s-m.s,m.sigma);
  }
  if(active) y += active.strength*gaussian(s-active.s,active.sigma);
  return y;
}

/* ---------- 入力 ---------- */
var pointerId=null;

function toS(clientX){return Math.min(1,Math.max(0,clientX/W));}

function updateActive(clientX,clientY,ambient){
  var s=toS(clientX);
  var by=baseY(s,ambient);
  for(var i=0;i<marks.length;i++){
    var m=marks[i]; by+=m.strength*gaussian(s-m.s,m.sigma);
  }
  active={s:s,strength:clientY-by,sigma:0.085};
}

canvas.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  pointerId=e.pointerId;
  updateActive(e.clientX,e.clientY,lastAmbient);
},{passive:false});

canvas.addEventListener('pointermove',function(e){
  if(pointerId===null||e.pointerId!==pointerId)return;
  e.preventDefault();
  updateActive(e.clientX,e.clientY,lastAmbient);
},{passive:false});

function release(e){
  if(pointerId===null||e.pointerId!==pointerId)return;
  pointerId=null;
  if(active){
    marks.push(active);
    if(marks.length>MAX_MARKS)marks.shift();
    active=null;
  }
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

/* ---------- 帯(なぎさの断面) ----------
   ラスタ画像を並べて敷き詰める方式だと、継ぎ目に縦縞のモアレが出てしまったので、
   一本の曲線パス(オフセットストローク)を重ねる方式に描き直した。
   細く鮮やかな線(マゼンタ/シアン)を、太く淡いグロー(暖色/寒色)の上に重ねる。
   最後にオフスクリーンごとぼかして本体へ合成するので、継ぎ目は出ない。 */
var lastAmbient=0;
var bandCanvas=document.createElement('canvas');
var bctx=bandCanvas.getContext('2d');

function bgColor(t,offset){
  var h=(shape.hue+offset+Math.sin(t*0.06)*5+360)%360;
  return h;
}

function bandsFor(hue){
  return [
    {off:-52, width:118, h:hue+120, s:60, l:86, a:0.20}, // 暖色側の淡いグロー
    {off: 52, width:118, h:hue-90,  s:55, l:87, a:0.20}, // 寒色側の淡いグロー
    {off:-15, width:26,  h:hue,     s:92, l:58, a:0.82}, // マゼンタの芯
    {off: 15, width:26,  h:hue-120, s:92, l:56, a:0.82}, // シアンの芯
    {off:  0, width:9,   h:hue-120, s:35, l:97, a:0.90}  // 中心のハイライト線
  ];
}

function render(time,phase){
  var T=(window.APKit?APKit.T:function(k,ph,tm){return tm*k}).bind(null);
  var breathe=T(0.5,phase,time);
  var glintPhase=T(0.11,phase,time);
  var ambient=Math.sin(breathe)*6;
  lastAmbient=ambient;

  // 背景: 暖かい側 / 冷たい側の淡いグラデーション
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'hsl('+bgColor(time,120)+',48%,88%)');
  g.addColorStop(0.5,'hsl('+bgColor(time,15)+',20%,94%)');
  g.addColorStop(1,'hsl('+bgColor(time,-90)+',42%,90%)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // 曲線の点列を1回だけ作る
  var N=Math.max(60,Math.round(W/4));
  var pts=new Array(N+1);
  for(var i=0;i<=N;i++){
    var s=i/N;
    pts[i]=[s*W,curveY(s,ambient)];
  }

  if(bandCanvas.width!==W||bandCanvas.height!==H){bandCanvas.width=W;bandCanvas.height=H;}
  bctx.clearRect(0,0,W,H);

  var bands=bandsFor(shape.hue);
  for(var b=0;b<bands.length;b++){
    var band=bands[b];
    var hh=((band.h%360)+360)%360;
    bctx.beginPath();
    bctx.moveTo(pts[0][0],pts[0][1]+band.off);
    for(var j=1;j<pts.length;j++)bctx.lineTo(pts[j][0],pts[j][1]+band.off);
    bctx.lineJoin='round';bctx.lineCap='round';
    bctx.lineWidth=band.width;
    bctx.strokeStyle='hsla('+hh+','+band.s+'%,'+band.l+'%,'+band.a+')';
    bctx.stroke();
  }

  // 満ち引きの跡(傷)を薄く強調する小さな光点
  for(var k=0;k<marks.length;k++){
    var m=marks[k];
    var mx=m.s*W, my=curveY(m.s,ambient);
    var r=16+Math.min(24,Math.abs(m.strength)*0.10);
    var rg=bctx.createRadialGradient(mx,my,0,mx,my,r);
    rg.addColorStop(0,'hsla('+shape.hue+',70%,80%,0.28)');
    rg.addColorStop(1,'hsla('+shape.hue+',70%,80%,0)');
    bctx.fillStyle=rg;
    bctx.beginPath();bctx.arc(mx,my,r,0,6.2832);bctx.fill();
  }

  // 揺らめく光の点(生きている感じ)
  var gs=Math.sin(glintPhase)*0.5+0.5;
  var gx=gs*W, gy=curveY(gs,ambient);
  var glow=bctx.createRadialGradient(gx,gy,0,gx,gy,30);
  glow.addColorStop(0,'hsla('+((shape.hue-120+360)%360)+',55%,94%,0.5)');
  glow.addColorStop(1,'hsla('+((shape.hue-120+360)%360)+',55%,94%,0)');
  bctx.fillStyle=glow;
  bctx.beginPath();bctx.arc(gx,gy,30,0,6.2832);bctx.fill();

  // オフスクリーンをぼかして本体へ。継ぎ目のない柔らかい光になる
  ctx.save();
  ctx.filter='blur(13px)';
  ctx.drawImage(bandCanvas,0,0,W,H);
  ctx.restore();
}

/* ---------- メインループ ---------- */
var t0=performance.now();
function tick(now){
  render((now-t0)/1000,null);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- ✦ / ↻ ---------- */
function mutate(){
  shape=randomShape();
  marks.length=0; active=null;
}
function resetAll(){
  shape=cloneShape(DEFAULT_SHAPE);
  marks.length=0; active=null;
}

window.APKit.init({
  canvas:canvas,
  gifName:'tide-mark-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){render(0,phase);},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});

})();
</script>
</body>
</html>
