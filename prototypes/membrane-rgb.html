<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGB Membrane</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,law=0,seed=3,start=performance.now();function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function paint(p){g.fillStyle='#fff';g.fillRect(0,0,W,H);let t=p*6.2831853,N=Math.floor(H/2.45),M=Math.floor(W/2.2);for(let ch=0;ch<3;ch++){g.beginPath();for(let r=0;r<N;r++){let y=r*H/N;for(let q=0;q<=M;q++){let u=q/M,X=u*W;let a=Math.sin(u*11+r*.037+t*(ch==0?1:ch==1?-1.4:.65)+seed*.17);let b=Math.sin(u*27-r*.071-t*.8);let c1=Math.sin(u*4.7+t*1.7+r*.013);let Y=y+a*12+b*4+c1*9+law*Math.sin(u*8-t+r*.025)*24;if(q==0)g.moveTo(X,Y);else g.lineTo(X,Y)}}g.strokeStyle='hsla('+(ch==0?350:ch==1?185:55)+',100%,45%,.16)';g.lineWidth=ch==1?1.15:.7;g.stroke()}for(let r=0;r<N;r+=2)for(let q=0;q<M;q+=3){let u=q/M,Y=r*H/N+Math.sin(u*18+r*.2+t)*5+law*Math.sin(u*6+t)*13;g.fillStyle='hsla('+(190+chroma(q,r))%360+',100%,48%,.09)';g.fillRect(u*W,Y,1,1)}}function chroma(q,r){return q*.31+r*.13+seed*23+law*31}function frame(p){paint(p)}function mutate(){seed+=1+Math.floor(Math.random()*7);law=(law+1)%5}function reset(){seed=3;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%5;return true});function loop(t){paint(((t-start)/18000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'rgb-membrane-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
