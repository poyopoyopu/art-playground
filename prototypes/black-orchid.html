<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLACK ORCHID</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020105}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* BLACK ORCHID — ChatGPT作。ap-kit.js統合: ChatGPT
   NEW CORE: the specimen is grown from a single deformable botanical spine.
   No radial spokes, no rings, no particles as structure. Broad petals unfurl
   from a living stem; each petal contains recursively smaller copies of its
   own edge. The entire silhouette breathes as one organism. */

const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,seed=Math.random()*99999,genes=[],drag=null,last=0;
const TAU=Math.PI*2;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a){return 'hsla('+((h%360)+360)%360+','+s+'%,'+l+'%,'+a+')'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(n){const q=Math.sin(n*83.17+seed*11.71)*43758.5453;return q-Math.floor(q)}
function mix(a,b,t){return(a+((b-a+540)%360-180)*t+360)%360}

function law(){
  let curl=0,tilt=0,flare=0,color=0;
  for(let i=0;i<genes.length;i++){const m=genes[i],w=(i+1)/genes.length;curl+=m.c*w;tilt+=m.t*w;flare+=m.f*w;color+=m.h*w}
  return{curl:curl*.12,tilt:tilt*.09,flare:flare*.055,color:color*.55}
}

function bg(t,p,S){
  g.fillStyle='#020105';g.fillRect(0,0,W,H);
  const q=g.createRadialGradient(W*.48,H*.46,0,W*.5,H*.5,S*.82);
  q.addColorStop(0,hs(p,48,11,.76));q.addColorStop(.35,hs(p+315,28,5,.94));
  q.addColorStop(.75,'rgba(3,2,7,.98)');q.addColorStop(1,'#010104');
  g.fillStyle=q;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='screen';
  for(let i=0;i<22;i++){
    const a=rnd(i*3.7)*TAU+t*.004,r=S*(.38+rnd(i*7.2)*.7);
    g.fillStyle=hs(mix(p,p+100,rnd(i)),55,55,.018);
    g.beginPath();g.arc(W*.5+Math.cos(a)*r,H*.48+Math.sin(a)*r*.78,.4,0,TAU);g.fill()
  }
  g.globalCompositeOperation='source-over'
}

/* A cubic spine gives the work its non-radial silhouette. */
function spine(t,S,L){
  const pts=[],n=64;
  for(let i=0;i<=n;i++){
    const u=i/n,y=H*.78-u*S*.69;
    const x=W*.5 + Math.sin(u*2.7+t*.12+L.tilt)*S*(.12*u*(1-u)+.025*Math.sin(u*8+t*.2));
    pts.push([x,y])
  }
  return pts
}

function ribbon(points,w,p,phase,depth){
  g.beginPath();g.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)g.lineTo(points[i][0],points[i][1]);
  const end=points[points.length-1];
  const gr=g.createLinearGradient(points[0][0],points[0][1],end[0],end[1]);
  gr.addColorStop(0,hs(p+330,72,5,.98));gr.addColorStop(.5,hs(p,62,12,.98));
  gr.addColorStop(1,hs(p+35,76,28,.94));g.strokeStyle=gr;g.lineWidth=w;g.lineCap='round';g.stroke();
  g.strokeStyle=hs(p+55,76,52,.28);g.lineWidth=Math.max(.5,w*.035);g.stroke()
}

/* Broad petal, built as a filled curved membrane rather than a tube. */
function petal(cx,cy,ang,len,w,phase,p,level,side,L){
  const N=44,top=[],bot=[],ca=Math.cos(ang),sa=Math.sin(ang);
  for(let i=0;i<=N;i++){
    const u=i/N,k=Math.sin(Math.PI*u),curl=L.curl+side*.035*Math.sin(phase);
    const forward=len*(u+.08*Math.sin(phase)*u*u);
    const bow=curl*len*u*u + .045*len*Math.sin(u*Math.PI*1.2+phase)*u;
    const width=w*Math.pow(k,.48)*(1-.12*u);
    const off=side*(width+bow*.12);
    top.push([cx+ca*(forward-bow)-sa*off,cy+sa*(forward-bow)+ca*off])
  }
  for(let i=N;i>=0;i--){
    const u=i/N,k=Math.sin(Math.PI*u),curl=L.curl-side*.028*Math.sin(phase);
    const forward=len*(u+.08*Math.sin(phase)*u*u),bow=curl*len*u*u;
    const width=w*.72*Math.pow(k,.48)*(1-.12*u),off=side*(-width+bow*.08);
    bot.push([cx+ca*(forward-bow)-sa*off,cy+sa*(forward-bow)+ca*off])
  }
  g.beginPath();g.moveTo(top[0][0],top[0][1]);
  for(const q of top)g.lineTo(q[0],q[1]);for(const q of bot)g.lineTo(q[0],q[1]);g.closePath();
  const tip=top[N],gr=g.createLinearGradient(cx,cy,tip[0],tip[1]);
  gr.addColorStop(0,hs(p+330,35,4,.99));gr.addColorStop(.48,hs(p+level*7,57,10,.99));
  gr.addColorStop(.82,hs(p+22,72,19,.98));gr.addColorStop(1,hs(p+65,80,38,.88));
  g.fillStyle=gr;g.fill();

  /* organic edge */
  g.beginPath();g.moveTo(top[0][0],top[0][1]);for(const q of top)g.lineTo(q[0],q[1]);
  g.strokeStyle=hs(p+55,83,60,.48);g.lineWidth=.9+level*.12;g.stroke();

  /* folds: curved, long, sparse */
  for(let v=1;v<7;v++){
    const frac=v/7,pts=[];
    for(let j=2;j<40;j++){
      const u=j/44,k=Math.sin(Math.PI*u),forward=len*u;
      const lateral=side*w*(.08+frac*.36)*Math.pow(k,.62);
      const bow=(L.curl+side*.02*Math.sin(phase))*len*u*u;
      pts.push([cx+ca*(forward-bow)-sa*lateral,cy+sa*(forward-bow)+ca*lateral])
    }
    g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const q of pts)g.lineTo(q[0],q[1]);
    g.strokeStyle=hs(mix(p+5,p+105,frac),72,28+frac*14,.14);g.lineWidth=.42+frac*.18;g.stroke()
  }

  /* self-similar fringe */
  if(level<3){
    for(let j=0;j<7;j++){
      const u=.42+j*.065,k=Math.floor(u*N),q=top[k];
      const aa=ang+side*(.25+.08*Math.sin(j+phase));
      const ll=len*(.07+.025*Math.sin(j*1.7+phase));
      const child=[];
      for(let z=0;z<=14;z++){const zt=z/14,rr=ll*zt;child.push([q[0]+Math.cos(aa)*rr,q[1]+Math.sin(aa)*rr])}
      ribbon(child,.7+level*.15,mix(p+20,p+100,j/7),phase+j,level)
    }
  }
}

function flower(t){
  const S=Math.min(W,H),L=law(),p=(282+L.color+20*Math.sin(t*.15)+360)%360;
  bg(t,p,S);
  const sp=spine(t,S,L);

  /* Stem first: the anatomy is born from one continuous spine. */
  ribbon(sp,S*.018,p,t*.15,0);

  /* Unequal organs along the spine. This creates the reference-like vertical
     growth and prevents the circular/urchin silhouette of previous versions. */
  const organs=[
    {u:.15,a:-2.70,len:.34,w:.17,s:-1},
    {u:.29,a:-2.18,len:.39,w:.20,s:-1},
    {u:.42,a:-1.62,len:.45,w:.24,s:-1},
    {u:.55,a:-1.02,len:.52,w:.27,s:1},
    {u:.68,a:-.48,len:.45,w:.22,s:1},
    {u:.79,a:.16,len:.37,w:.18,s:1},
    {u:.89,a:.70,len:.28,w:.15,s:1}
  ];
  for(let i=0;i<organs.length;i++){
    const o=organs[i],k=Math.floor(o.u*(sp.length-1)),q=sp[k];
    const sway=.13*Math.sin(t*.22+i*1.3)+L.tilt*.7;
    const a=o.a+sway;
    petal(q[0],q[1],a,S*o.len*(1+.07*Math.sin(t*.31+i)),S*o.w*(1+.05*Math.sin(t*.47+i)),t*.18+i*.93,p,0,o.s,L);
  }

  /* lower hanging organs: they share the same stem, not a central hub */
  for(let i=0;i<3;i++){
    const q=sp[Math.floor((.38+i*.11)*sp.length)],a=1.55+i*.23+.08*Math.sin(t*.2+i);
    petal(q[0],q[1],a,S*(.25+.035*i),S*(.11-.012*i),t*.2+i,p,1,1,L)
  }

  /* central dark throat where the stem terminates */
  const q=sp[sp.length-1],R=S*.10;
  g.beginPath();g.moveTo(q[0]-R*.55,q[1]);g.bezierCurveTo(q[0]-R*.7,q[1]-R*.8,q[0]+R*.7,q[1]-R*.8,q[0]+R*.55,q[1]);
  g.bezierCurveTo(q[0]+R*.35,q[1]+R*1.0,q[0]-R*.35,q[1]+R*1.0,q[0]-R*.55,q[1]);g.closePath();
  const dark=g.createRadialGradient(q[0],q[1]-R*.2,0,q[0],q[1],R);
  dark.addColorStop(0,'#000');dark.addColorStop(.6,hs(p+320,82,6,1));dark.addColorStop(1,hs(p+20,72,22,.8));
  g.fillStyle=dark;g.fill();

  /* slow chromatic breathing over the whole specimen */
  g.globalCompositeOperation='screen';
  const glow=g.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,S*.45);
  glow.addColorStop(0,hs(p+15,75,30,.035+.018*Math.sin(t*.5)));
  glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='source-over';
}

function render(t){flower(t)}
let start=performance.now();
function animate(){render((performance.now()-start)*.001);requestAnimationFrame(animate)}
requestAnimationFrame(animate);

function mutate(px,py){
  if(APKit.isUI(px,py))return;
  const S=Math.min(W,H),q=clamp(1-Math.hypot(px-W*.5,py-H*.47)/(S*.75),.12,1);
  genes.push({c:(Math.random()-.5)*2.2*q,t:(Math.random()-.5)*2.4*q,f:(Math.random()-.5)*2*q,h:(Math.random()-.5)*120*q});
  if(genes.length>18)genes.shift()
}
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;c.setPointerCapture(e.pointerId);drag=e.pointerId;mutate(e.clientX,e.clientY);last=performance.now()});
c.addEventListener('pointermove',e=>{if(e.pointerId!==drag||!e.buttons||APKit.isUI(e.clientX,e.clientY))return;const n=performance.now();if(n-last>110){mutate(e.clientX,e.clientY);last=n}});
c.addEventListener('pointerup',e=>{if(e.pointerId===drag)drag=null});
c.addEventListener('pointercancel',e=>{if(e.pointerId===drag)drag=null});

APKit.init({
  canvas:c,gifName:'black-orchid-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:phase=>render(phase),
  buttons:[
    {label:'✦',name:'mutate',onClick:()=>mutate(W*.5+(Math.random()-.5)*W*.5,H*.47+(Math.random()-.5)*H*.5)},
    {label:'↻',name:'reset',onClick:()=>{genes=[];seed=Math.random()*99999}}
  ]
});
</script>
</body>
</html>
