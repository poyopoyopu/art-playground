<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLACK ORCHID</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020105}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* BLACK ORCHID — ChatGPT作。ap-kit.js統合: ChatGPT
   ROOT REBUILD: not a flower, not a particle field.
   LAW: the organism is a rotating aperture made from nested membranes.
   Each membrane inherits the deformation of the one inside it. Touch changes
   the inherited deformation, so the whole anatomy is rewritten. */

const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,seed=Math.random()*1e6,marks=[],pid=null,last=0;
const TAU=Math.PI*2;

function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a){return 'hsla('+((h%360)+360)%360+','+s+'%,'+l+'%,'+a+')'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(n){const q=Math.sin(n*12.9898+seed*78.233)*43758.5453;return q-Math.floor(q)}
function hdist(a,b){return((b-a+540)%360)-180}
function hue(a,b,t){return(a+hdist(a,b)*t+360)%360}

function law(){
  let bend=0,spin=0,open=0,warp=0,col=0;
  for(let i=0;i<marks.length;i++){
    const m=marks[i],w=.22+.78*(i+1)/marks.length;
    bend+=m.b*w;spin+=m.s*w;open+=m.o*w;warp+=m.w*w;col+=m.c*w;
  }
  return{bend:bend*.34,spin:spin*.28,open:open*.028,warp:warp*.35,col:col*.5}
}

function bg(t,p,S){
  x.fillStyle='#020105';x.fillRect(0,0,W,H);
  const q=x.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,S*.72);
  q.addColorStop(0,hs(p,48,10,.72));q.addColorStop(.35,hs(p+305,38,5,.9));
  q.addColorStop(.72,'rgba(3,2,8,.98)');q.addColorStop(1,'#010104');
  x.fillStyle=q;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='screen';
  for(let i=0;i<48;i++){
    const a=rnd(i*2.4)*TAU+t*.008,r=S*(.38+rnd(i*8.2)*.64);
    const px=W*.5+Math.cos(a)*r,py=H*.48+Math.sin(a)*r*.82;
    const z=.4+.6*Math.sin(t*.18+i*2.1);
    x.fillStyle=hs(p+40+rnd(i)*80,75,60,.018+.03*z);
    x.beginPath();x.arc(px,py,.3+1.1*z,0,TAU);x.fill();
  }
  x.globalCompositeOperation='source-over';
}

/* A single membrane is a closed organic sheet. Its child repeats the same
   coordinate deformation at a smaller scale: true nested self-similarity. */
function membrane(cx,cy,R,thick,phase,depth,p,t,L){
  const N=180,pts=[];
  for(let i=0;i<=N;i++){
    const a=i/N*TAU;
    const wave=
      .10*Math.sin(a*(5+depth)+phase*1.1)+
      .055*Math.sin(a*(9-depth*.35)-phase*1.7)+
      .025*Math.sin(a*17+phase*.8);
    const directional=L.bend*Math.sin(a-L.spin)+L.warp*.045*Math.sin(2*a+phase);
    const r=R*(1+wave+directional);
    pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r*.91]);
  }
  x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);
  x.closePath();
  const fill=x.createRadialGradient(cx-R*.2,cy-R*.15,R*.05,cx,cy,R);
  fill.addColorStop(0,hs(p+depth*13,65,3,.98));
  fill.addColorStop(.54,hs(p+depth*8,70,7,.98));
  fill.addColorStop(.82,hs(p+35,75,13,.98));
  fill.addColorStop(1,'rgba(1,0,3,0)');
  x.fillStyle=fill;x.fill();

  for(let k=0;k<4;k++){
    x.beginPath();
    for(let i=0;i<=N;i++){
      const a=i/N*TAU;
      const wave=.10*Math.sin(a*(5+depth)+phase*1.1)+.055*Math.sin(a*(9-depth*.35)-phase*1.7);
      const r=R*(1+wave+L.bend*Math.sin(a-L.spin)+L.warp*.045*Math.sin(2*a+phase)) - k*thick*.33;
      const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.91;
      if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.strokeStyle=hs(hue(p+depth*16,p+105,(Math.sin(phase+k)+1)/2),82,35+k*8,.16);
    x.lineWidth=.55+k*.3;x.stroke();
  }

  if(depth<4){
    /* child is not merely a smaller circle: it is the same membrane law */
    membrane(cx+Math.cos(phase*.31+depth)*R*.045,
      cy+Math.sin(phase*.27-depth)*R*.035,
      R*(.62-.035*depth),thick*.72,phase*1.31+depth*1.7,depth+1,p,t,L);
  }
}

function radialVeins(cx,cy,R,n,p,t,L){
  for(let i=0;i<n;i++){
    const a=i*TAU/n+t*.018+L.spin*.15;
    const reach=R*(1.55+.32*Math.sin(i*1.73+t*.17)+L.open*.8);
    const bend=.34*Math.sin(t*.23+i*1.91)+L.bend*.9;
    const side=.08+.045*Math.sin(i*2.7+t);
    const pts=[];
    for(let j=0;j<=52;j++){
      const u=j/52,rr=R*.72+reach*u;
      const aa=a+bend*u*u+side*Math.sin(Math.PI*u)*Math.sin(i+t*.2);
      pts.push([cx+Math.cos(aa)*rr,cy+Math.sin(aa)*rr*.91]);
    }
    /* broad black ribbon under a luminous vein */
    x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
    for(let j=1;j<pts.length;j++)x.lineTo(pts[j][0],pts[j][1]);
    x.strokeStyle=hs(p+10,58,4,.95);x.lineWidth=5.5+2*Math.sin(i);x.lineCap='round';x.stroke();
    x.strokeStyle=hs(hue(p+10,p+125,(Math.sin(i*1.7+t*.25)+1)/2),91,50,.52);
    x.lineWidth=1.05+.45*Math.sin(i*1.4+t);x.stroke();
    x.strokeStyle=hs(p+55,90,72,.12);x.lineWidth=.35;x.stroke();

    /* inherited branches */
    for(let b=0;b<2;b++){
      const k=22+b*12,q=pts[k],aa=a+bend*(k/52)**2+(b?-1:1)*.42;
      x.beginPath();x.moveTo(q[0],q[1]);
      x.quadraticCurveTo(q[0]+Math.cos(aa)*R*.22,q[1]+Math.sin(aa)*R*.2,
        q[0]+Math.cos(aa)*R*(.48+.08*b),q[1]+Math.sin(aa)*R*(.44+.06*b));
      x.strokeStyle=hs(p+80+b*25,82,42,.20);x.lineWidth=.5;x.stroke();
    }
  }
}

function throat(cx,cy,R,p,t,L){
  const wob=.035*Math.sin(t*.9)+L.open;
  x.save();x.translate(cx,cy);x.rotate(L.spin*.12);
  x.beginPath();x.ellipse(0,0,R*(.34+wob),R*(.48+wob*.7),0,0,TAU);
  const g=x.createRadialGradient(0,-R*.12,0,0,0,R);
  g.addColorStop(0,'#000');g.addColorStop(.45,hs(p+315,88,4,1));g.addColorStop(.8,hs(p+25,80,15,1));g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fill();
  for(let i=0;i<64;i++){
    const a=i/64*TAU+t*.025;
    const r1=R*(.39+.025*Math.sin(i+t)),r2=R*(.53+.09*Math.sin(i*2.1+t*.7));
    x.beginPath();x.moveTo(Math.cos(a)*r1,Math.sin(a)*r1*.96);
    x.lineTo(Math.cos(a)*r2,Math.sin(a)*r2*.96);
    x.strokeStyle=hs(hue(p+10,p+100,i/64),85,52,.30);x.lineWidth=.55;x.stroke();
  }
  /* the descending organ is part of the same rule */
  x.beginPath();x.moveTo(-R*.13,R*.27);
  x.bezierCurveTo(-R*.18,R*.8,-R*.07,R*1.65,0,R*1.92);
  x.bezierCurveTo(R*.07,R*1.65,R*.18,R*.8,R*.13,R*.27);x.closePath();
  const tg=x.createLinearGradient(0,R*.2,0,R*1.95);
  tg.addColorStop(0,hs(p+15,85,21,.92));tg.addColorStop(.42,hs(p+330,80,8,.98));tg.addColorStop(1,'rgba(1,0,3,0)');
  x.fillStyle=tg;x.fill();
  for(let i=0;i<19;i++){
    const xx=(i-9)*R*.025;
    x.beginPath();x.moveTo(xx,R*.38);
    x.quadraticCurveTo(xx+Math.sin(t+i)*R*.018,R*.92,xx*.7,R*1.8);
    x.strokeStyle=hs(p+20+i*2,80,38,.25);x.lineWidth=.6;x.stroke();
  }
  x.restore();
}

function render(t){
  const L=law(),p=(286+L.col+18*Math.sin(t*.13)+360)%360,S=Math.min(W,H);
  const cx=W*.5,cy=H*.465,R=S*(.17+.012*Math.sin(t*.31));
  bg(t,p,S);

  radialVeins(cx,cy,R,19,p,t,L);
  membrane(cx,cy,R*1.06,S*.012,t*.55,0,p,t,L);
  throat(cx,cy,R,p,t,L);

  /* outer filaments emerge from behind the membrane, never as isolated dots */
  x.globalCompositeOperation='lighter';
  for(let i=0;i<19;i++){
    const a=i*TAU/19+t*.02;
    const len=S*(.27+.055*Math.sin(i*1.37+t*.16)+L.open*.02);
    x.beginPath();
    for(let j=0;j<=60;j++){
      const u=j/60,rr=R*1.02+len*u;
      const aa=a+(0.25+.18*Math.sin(i*1.7))*u*u+L.bend*.7*Math.sin(Math.PI*u);
      const px=cx+Math.cos(aa)*rr,py=cy+Math.sin(aa)*rr*.91;
      if(j===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.strokeStyle=hs(hue(p,p+120,(Math.sin(i*1.31+t*.4)+1)/2),88,56,.24);
    x.lineWidth=.55+.35*Math.sin(i+t);x.stroke();
  }
  x.globalCompositeOperation='source-over';

  const v=x.createRadialGradient(cx,cy,S*.08,cx,cy,S*.72);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.75,'rgba(0,0,0,.05)');v.addColorStop(1,'rgba(0,0,0,.72)');
  x.fillStyle=v;x.fillRect(0,0,W,H);
}

function mutate(px,py){
  if(APKit.isUI(px,py))return;
  const dx=px-W*.5,dy=py-H*.465,a=Math.atan2(dy,dx);
  const q=clamp(1-Math.hypot(dx,dy)/(Math.min(W,H)*.7),.12,1);
  marks.push({b:(Math.random()-.5)*1.5*q,s:(Math.random()-.5)*2.5*q,
    o:(Math.random()-.5)*1.8*q,w:(Math.random()-.5)*2*q,
    c:(Math.random()-.5)*120*q,a});
  if(marks.length>20)marks.shift();
}
c.addEventListener('pointerdown',e=>{
  if(APKit.isUI(e.clientX,e.clientY))return;
  c.setPointerCapture(e.pointerId);pid=e.pointerId;mutate(e.clientX,e.clientY);last=performance.now();
});
c.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid||!e.buttons||APKit.isUI(e.clientX,e.clientY))return;
  const n=performance.now();if(n-last>105){mutate(e.clientX,e.clientY);last=n}
});
c.addEventListener('pointerup',e=>{if(e.pointerId===pid)pid=null});
c.addEventListener('pointercancel',e=>{if(e.pointerId===pid)pid=null});

APKit.init({
  canvas:c,gifName:'black-orchid-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:phase=>render(phase),
  buttons:[
    {label:'✦',name:'mutate',onClick:()=>mutate(W*.5+(Math.random()-.5)*W*.5,H*.465+(Math.random()-.5)*H*.5)},
    {label:'↻',name:'reset',onClick:()=>{marks=[];seed=Math.random()*1e6}}
  ]
});
</script>
</body>
</html>
