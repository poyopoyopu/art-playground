<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLACK ORCHID</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020105}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* BLACK ORCHID — ChatGPT作。ap-kit.js統合: ChatGPT
   ORGANIC REBUILD: no radial spokes, no circular shell.
   LAW: a dark botanical body unfolds through six inherited organs.
   Every organ is a deformed ribbon with its own genealogy; descendants inherit
   the parent's bend, width and spectral phase. Touch selects a new ancestor
   and permanently changes the morphology of the whole specimen. */

const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,seed=Math.random()*999999,genes=[],drag=null,last=0;
const TAU=Math.PI*2;

function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function hs(h,s,l,a){return 'hsla('+((h%360)+360)%360+','+s+'%,'+l+'%,'+a+')'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(n){const q=Math.sin(n*91.17+seed*17.13)*43758.5453;return q-Math.floor(q)}
function hmix(a,b,t){return(a+((b-a+540)%360-180)*t+360)%360}

function genome(){
  let bend=0,lean=0,spread=0,depth=0,chrom=0;
  for(let i=0;i<genes.length;i++){
    const m=genes[i],w=(i+1)/genes.length;
    bend+=m.b*w;lean+=m.l*w;spread+=m.s*w;depth+=m.d*w;chrom+=m.c*w;
  }
  return {bend:bend*.16,lean:lean*.13,spread:spread*.10,depth:depth*.06,chrom:chrom*.5};
}

function background(t,p,S){
  ctx.fillStyle='#020105';ctx.fillRect(0,0,W,H);
  const q=ctx.createRadialGradient(W*.48,H*.46,0,W*.5,H*.48,S*.82);
  q.addColorStop(0,hs(p,45,10,.72));q.addColorStop(.28,hs(p+325,34,5,.9));
  q.addColorStop(.7,'rgba(3,2,7,.98)');q.addColorStop(1,'#010104');
  ctx.fillStyle=q;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<28;i++){
    const a=rnd(i*3.1)*TAU+t*.006,r=S*(.28+rnd(i*9)*.78);
    const px=W*.5+Math.cos(a)*r,py=H*.47+Math.sin(a)*r*.72;
    ctx.fillStyle=hs(p+30+rnd(i)*100,70,58,.025);
    ctx.beginPath();ctx.arc(px,py,.35+rnd(i*2)*1.2,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
}

/* One botanical organ. Its silhouette is a tapered ribbon, not a line.
   The return edge creates the dark mass seen in a real petal/sepal. */
function organ(cx,cy,angle,length,width,phase,index,p,G,level,mirror){
  const N=54,top=[],bot=[];
  const ca=Math.cos(angle),sa=Math.sin(angle);
  for(let i=0;i<=N;i++){
    const u=i/N,k=Math.sin(Math.PI*u);
    const taper=Math.pow(k,.42);
    const flare=.72+.28*Math.sin(Math.PI*u);
    const localB=G.bend*(.4+u*u)+.035*Math.sin(phase+u*3.2+index);
    const side=mirror*(width*.5*flare+width*.08*Math.sin(phase+u*5));
    const forward=length*(u+.055*Math.sin(phase)*u*u);
    const px=cx+ca*(forward-localB*length*u*u)-sa*side;
    const py=cy+sa*(forward-localB*length*u*u)+ca*side;
    top.push([px,py,taper]);
  }
  for(let i=N;i>=0;i--){
    const u=i/N,k=Math.sin(Math.PI*u),flare=.72+.28*k;
    const side=mirror*(width*.5*flare-width*.055*(1-u));
    const forward=length*(u+.055*Math.sin(phase)*u*u);
    const localB=G.bend*(.4+u*u)+.035*Math.sin(phase+u*3.2+index);
    bot.push([cx+ca*(forward-localB*length*u*u)-sa*side,
      cy+sa*(forward-localB*length*u*u)+ca*side]);
  }

  ctx.beginPath();ctx.moveTo(top[0][0],top[0][1]);
  for(let i=1;i<top.length;i++)ctx.lineTo(top[i][0],top[i][1]);
  for(const q of bot)ctx.lineTo(q[0],q[1]);ctx.closePath();

  const tip=top[N],grad=ctx.createLinearGradient(cx,cy,tip[0],tip[1]);
  grad.addColorStop(0,hs(p+level*8,38,5,.98));
  grad.addColorStop(.48,hs(p+level*11,58,10,.98));
  grad.addColorStop(.82,hs(p+25,72,18,.98));
  grad.addColorStop(1,hs(hmix(p+20,p+100,.35),80,36,.92));
  ctx.fillStyle=grad;ctx.fill();

  /* one wet rim and one buried rim: gives volume without neon tubes */
  ctx.beginPath();ctx.moveTo(top[0][0],top[0][1]);
  for(let i=1;i<top.length;i++)ctx.lineTo(top[i][0],top[i][1]);
  ctx.strokeStyle=hs(p+55,82,61,.42);ctx.lineWidth=.8+level*.18;ctx.stroke();
  ctx.beginPath();ctx.moveTo(bot[N][0],bot[N][1]);
  for(let i=N-1;i>=0;i--)ctx.lineTo(bot[i][0],bot[i][1]);
  ctx.strokeStyle=hs(p+315,68,30,.28);ctx.lineWidth=.65;ctx.stroke();

  /* veins follow the ribbon surface and converge toward its birth point */
  for(let v=0;v<7;v++){
    const side=mirror*(v%2?1:-1),off=(v+1)/8;
    ctx.beginPath();
    for(let j=2;j<51;j++){
      const u=j/54,k=Math.sin(Math.PI*u),forward=length*u;
      const lateral=side*width*(.06+off*.18)*Math.pow(k,.65);
      const bend=G.bend*length*u*u;
      const px=cx+ca*(forward-bend)-sa*lateral;
      const py=cy+sa*(forward-bend)+ca*lateral;
      if(j===2)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.strokeStyle=hs(hmix(p+10,p+115,(v+1)/8),75,35+v*3,.16);
    ctx.lineWidth=.42+.08*v;ctx.stroke();
  }

  /* serrated inherited fringe at the outer third */
  if(level<3){
    for(let q=0;q<9;q++){
      const u=.48+q*.045,idx=Math.floor(u*N),P=top[idx];
      const a=angle+mirror*(.34+.06*Math.sin(q+phase));
      const L=length*(.08+.025*Math.sin(q*2.1+phase));
      ctx.beginPath();ctx.moveTo(P[0],P[1]);
      ctx.quadraticCurveTo(P[0]+Math.cos(a)*L*.5,P[1]+Math.sin(a)*L*.5,
        P[0]+Math.cos(a)*L,P[1]+Math.sin(a)*L);
      ctx.strokeStyle=hs(p+65+q*5,76,48,.24);ctx.lineWidth=.55;ctx.stroke();
    }
  }

  /* three nested descendants, each a smaller version of the same organ law */
  if(level<3){
    for(let k=0;k<3;k++){
      const u=.28+k*.22,idx=Math.floor(u*N),P=top[idx];
      const a=angle+mirror*(.16+k*.11)+G.lean*.25*Math.sin(k+phase);
      organ(P[0],P[1],a,length*(.20+.025*k),width*(.34-.035*k),
        phase*1.17+k*1.9,index+k+level*7,p,G,level+1,mirror);
    }
  }
}

function centralBud(cx,cy,R,p,t,G){
  /* not a circle: a vertical, folded throat */
  const open=.20+.045*Math.sin(t*.72)+G.spread*.015;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(G.lean*.08);
  ctx.beginPath();
  ctx.moveTo(-R*.42,0);
  ctx.bezierCurveTo(-R*.50,-R*.34,-R*.34,-R*.62,0,-R*.70);
  ctx.bezierCurveTo(R*.34,-R*.62,R*.50,-R*.34,R*.42,0);
  ctx.bezierCurveTo(R*.31,R*.25,R*.20,R*.55,0,R*1.48);
  ctx.bezierCurveTo(-R*.20,R*.55,-R*.31,R*.25,-R*.42,0);
  ctx.closePath();
  const q=ctx.createLinearGradient(0,-R,0,R*1.5);
  q.addColorStop(0,hs(p+20,65,18,.96));q.addColorStop(.32,hs(p+315,78,7,1));
  q.addColorStop(.7,hs(p,74,12,.98));q.addColorStop(1,'rgba(1,0,3,0)');
  ctx.fillStyle=q;ctx.fill();

  /* black throat */
  ctx.beginPath();ctx.ellipse(0,-R*.10,R*(.20+open),R*(.31+open*.4),0,0,TAU);
  const dark=ctx.createRadialGradient(0,-R*.14,0,0,0,R*.5);
  dark.addColorStop(0,'#000');dark.addColorStop(.72,hs(p+325,80,4,.98));dark.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=dark;ctx.fill();

  for(let i=0;i<32;i++){
    const a=-Math.PI*.85+i/31*Math.PI*1.7;
    const r1=R*(.28+.03*Math.sin(i+t)),r2=R*(.46+.05*Math.sin(i*1.7+t));
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,-R*.10+Math.sin(a)*r1);
    ctx.quadraticCurveTo(Math.cos(a)*r2*.9,-R*.10+Math.sin(a)*r2*.8,
      Math.cos(a)*r2,-R*.10+Math.sin(a)*r2);
    ctx.strokeStyle=hs(hmix(p,p+100,i/31),82,50,.28);ctx.lineWidth=.6;ctx.stroke();
  }
  for(let i=0;i<15;i++){
    const xx=(i-7)*R*.025;
    ctx.beginPath();ctx.moveTo(xx,R*.25);
    ctx.quadraticCurveTo(xx+Math.sin(t+i)*R*.02,R*.75,xx*.72,R*1.38);
    ctx.strokeStyle=hs(p+35+i*2,76,36,.27);ctx.lineWidth=.55;ctx.stroke();
  }
  ctx.restore();
}

function render(t){
  const G=genome(),p=(276+G.chrom+16*Math.sin(t*.18)+360)%360,S=Math.min(W,H);
  background(t,p,S);
  const cx=W*.50,cy=H*.46,R=S*.105;

  /* Six unequal organs: the silhouette is intentionally off-axis and botanical. */
  const organs=[
    [-1.52,.46,1.00],[-.78,.84,.82],[-.25,1.05,.92],[.37,.96,.88],
    [.92,.73,1.02],[1.57,.51,.78]
  ];
  for(let i=0;i<organs.length;i++){
    const q=organs[i],a=q[0]+.035*Math.sin(t*.21+i)+G.lean*.10;
    const len=S*q[1]*(.88+.08*Math.sin(t*.29+i*1.7))+G.spread*S*.008;
    const w=S*.17*q[2]*(1+.05*Math.sin(t*.43+i));
    const mx=i%2?1:-1;
    organ(cx,cy,a,len,w,t*.16+i*.71,i,p,G,0,mx);
  }

  /* A second, lower set forms the long drooping sepals of the reference. */
  for(let i=0;i<3;i++){
    const a=1.95+i*.42+.04*Math.sin(t*.17+i);
    organ(cx,cy,a,S*(.30+.05*Math.sin(i+t*.2)),S*.10,
      t*.13+i*1.4,i+20,p,G,1,i%2?1:-1);
  }

  centralBud(cx,cy,R,p,t,G);

  /* restrained atmospheric dust; never the subject */
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<42;i++){
    const a=rnd(i*5.3)*TAU+t*.01,r=S*(.20+rnd(i*8)*.70);
    const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.75;
    ctx.fillStyle=hs(hmix(p,p+100,rnd(i)),78,58,.025);
    ctx.beginPath();ctx.arc(px,py,.35+rnd(i*3)*.9,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  const v=ctx.createRadialGradient(cx,cy,S*.08,cx,cy,S*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.75,'rgba(0,0,0,.05)');
  v.addColorStop(1,'rgba(0,0,0,.70)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

let animationStart=performance.now();
function animate(){render((performance.now()-animationStart)*.001);requestAnimationFrame(animate)}
requestAnimationFrame(animate);

function mutate(px,py){
  if(APKit.isUI(px,py))return;
  const dx=px-W*.5,dy=py-H*.46,q=clamp(1-Math.hypot(dx,dy)/(Math.min(W,H)*.72),.12,1);
  genes.push({b:(Math.random()-.5)*2.4*q,l:(Math.random()-.5)*2.0*q,
    s:(Math.random()-.5)*3.0*q,d:(Math.random()-.5)*2.5*q,c:(Math.random()-.5)*120*q});
  if(genes.length>16)genes.shift();
}
c.addEventListener('pointerdown',e=>{
  if(APKit.isUI(e.clientX,e.clientY))return;
  c.setPointerCapture(e.pointerId);drag=e.pointerId;mutate(e.clientX,e.clientY);last=performance.now();
});
c.addEventListener('pointermove',e=>{
  if(e.pointerId!==drag||!e.buttons||APKit.isUI(e.clientX,e.clientY))return;
  const n=performance.now();if(n-last>115){mutate(e.clientX,e.clientY);last=n}
});
c.addEventListener('pointerup',e=>{if(e.pointerId===drag)drag=null});
c.addEventListener('pointercancel',e=>{if(e.pointerId===drag)drag=null});

APKit.init({
  canvas:c,gifName:'black-orchid-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:phase=>render(phase),
  buttons:[
    {label:'✦',name:'mutate',onClick:()=>mutate(W*.5+(Math.random()-.5)*W*.55,H*.46+(Math.random()-.5)*H*.55)},
    {label:'↻',name:'reset',onClick:()=>{genes=[];seed=Math.random()*999999}}
  ]
});
</script>
</body>
</html>
