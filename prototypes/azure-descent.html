<!doctype html>
<!-- AZURE DESCENT — ChatGPT作。参考動画の「半透明な青い円盤が縦に重なり、ほどけていく構造」を完全生成で再構成。ap-kit.js統合: ChatGPT -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AZURE DESCENT — 青い器官がほどける</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3efe7}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(10% + env(safe-area-inset-top,0px));text-align:center;font:500 12px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.18em;color:rgba(20,45,90,.65);pointer-events:none;transition:opacity 1.5s;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas><div id="hint">青い器官に触れる<br>その器官が、次の形を決める</div>
<script>
(function(){
'use strict';
const TAU=Math.PI*2,canvas=document.getElementById('c'),hint=document.getElementById('hint');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.body.textContent='WebGL2 required';return}
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
#define MAX 18
uniform vec2 uRes;
uniform float uTime,uSeed,uTilt,uDepth;
uniform int uN;
uniform vec4 uBlob[MAX];
out vec4 outColor;
float hash(float x){return fract(sin(x*127.1)*43758.5453);}
vec3 hsv(vec3 c){
 vec3 p=abs(fract(c.xxx+vec3(0.,.6666667,.3333333))*6.-3.);
 return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);
}
float ellipse(vec2 p,vec2 c,vec2 s,float rot){
 float cs=cos(rot),sn=sin(rot);vec2 q=p-c;q=mat2(cs,-sn,sn,cs)*q;
 float d=length(q/s);
 return exp(-pow(abs(d-1.)/.055,2.));
}
float fill(vec2 p,vec2 c,vec2 s,float rot){
 float cs=cos(rot),sn=sin(rot);vec2 q=p-c;q=mat2(cs,-sn,sn,cs)*q;
 float d=length(q/s);
 return smoothstep(1.02,.72,d);
}
void main(){
 vec2 p=(gl_FragCoord.xy/uRes-.5);p.x*=uRes.x/uRes.y;
 float t=uTime;
 vec3 col=vec3(.965,.945,.90);
 float floorGlow=exp(-pow((p.y+.43)/.75,2.))*vec3(.025,.03,.05);
 col-=floorGlow;
 for(int i=0;i<MAX;i++){
   if(i>=uN)break;
   vec4 b=uBlob[i];
   float z=b.z,rot=b.w;
   vec2 c=b.xy;
   float breathe=1.+.035*sin(t*(.45+z*.03)+float(i)*.71);
   vec2 s=vec2(.22+.025*sin(float(i)*1.7+uSeed),.31)*breathe;
   s*=1.-z*.008;
   float f=fill(p,c,s,rot);
   float edge=ellipse(p,c,s,rot);
   float shade=smoothstep(1.,.2,length((p-c)/s));
   float h=fract(.58+z*.012+uSeed*.008);
   vec3 base=hsv(vec3(h,.60,.74));
   vec3 light=hsv(vec3(fract(h+.025),.35,1.));
   col=mix(col,col*(1.-f*.22)+base*f*.40,f);
   col+=light*edge*(.26+.16*shade);
   col+=vec3(.02,.06,.13)*edge*.35;
 }
 float core=exp(-pow(length(p-vec2(.02,.02))/.12,2.));
 col+=vec3(.08,.17,.30)*core*.12;
 col=1.-exp(-col*1.15);
 float grain=(hash(gl_FragCoord.x*.7+gl_FragCoord.y*.13)-.5)*.012;
 col+=grain;
 outColor=vec4(col,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);
gl.bindVertexArray(gl.createVertexArray());const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uRes','uTime','uSeed','uTilt','uDepth','uN','uBlob'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
const blobs=new Float32Array(72);
let W=0,H=0,t=0,seed=5.3,tilt=0,depth=0,prev=performance.now(),hinted=false;
const marks=[];
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);
function layout(phase){
 const n=14;
 for(let i=0;i<n;i++){
   const f=(i+phase*.45)/n;
   const y=.38-f*.92 + .045*Math.sin(t*.5+i*.77);
   const x=.10*Math.sin(i*1.37+phase*TAU)+.035*Math.sin(t*.33+i);
   blobs[i*4]=x;blobs[i*4+1]=y;blobs[i*4+2]=i;blobs[i*4+3]=tilt + .22*Math.sin(i*1.2+phase*TAU);
 }
 for(let i=0;i<marks.length;i++){
   const m=marks[i],idx=(i*3)%n;
   blobs[idx*4]+=m.x*.25;blobs[idx*4+1]+=m.y*.25;blobs[idx*4+3]+=m.r*.8;
 }
}
function draw(time,phase){
 layout(phase||0);
 gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uTime,time);gl.uniform1f(U.uSeed,seed);gl.uniform1f(U.uTilt,tilt);gl.uniform1f(U.uDepth,depth);
 gl.uniform1i(U.uN,14);gl.uniform4fv(U.uBlob,blobs);gl.drawArrays(gl.TRIANGLES,0,3);
}
function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;t+=dt;draw(t,(t/8)%1);requestAnimationFrame(frame)}
function loopFrame(phase){draw(phase,phase/TAU)}
function touch(x,y){const qx=x/W-.5,qy=.5-y/H;marks.unshift({x:qx*1.8,y:qy*1.8,r:(Math.random()-.5)*.8});if(marks.length>6)marks.pop();depth=Math.min(1,depth+.12);tilt+=(Math.random()-.5)*.18;hinted=true;hint.classList.remove('on')}
function mutate(){seed=Math.random()*90;tilt=(Math.random()-.5)*.7;depth=Math.random()*.6}
function reset(){marks.length=0;seed=5.3;tilt=0;depth=0}
canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();touch(e.clientX,e.clientY)},{passive:false});
resize();requestAnimationFrame(frame);setTimeout(()=>{if(!hinted)hint.classList.add('on')},900);setTimeout(()=>hint.classList.remove('on'),6000);
window.APKit.init({canvas:canvas,gifName:'azure-descent-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loopFrame,buttons:[
 {label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}
]});
})();
</script>
</body>
</html>
