<!doctype html>
<!-- AZURE DESCENT — ChatGPT作。半透明の青い器官が重なり、触れた場所の法則だけがほどける。ap-kit.js統合: ChatGPT -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AZURE DESCENT — 青い器官がほどける</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3efe7}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(10% + env(safe-area-inset-top,0px));text-align:center;font:500 12px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.18em;color:rgba(20,45,90,.65);pointer-events:none;transition:opacity 1.5s;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas><div id="hint">青い器官に触れる<br>その器官が、次の形を決める</div>
<script>
(function(){
'use strict';
const TAU=Math.PI*2,canvas=document.getElementById('c'),hint=document.getElementById('hint');
let W=0,H=0,t=0,seed=5.3,tilt=0,depth=0,prev=performance.now(),hinted=false;
let touchX=0,touchY=0,touchPower=0;
const marks=[];

function resize(){
  W=innerWidth;H=innerHeight;
  const d=Math.min(devicePixelRatio||1,1.5);
  canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);
}
addEventListener('resize',resize);

const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
let renderGL=null;

if(gl){
  const VS=`#version 300 es
  in vec2 p;
  void main(){gl_Position=vec4(p,0.,1.);}`;

  const FS=`#version 300 es
  precision highp float;
  uniform vec2 uRes;
  uniform float uTime,uSeed,uTilt,uDepth;
  uniform vec4 uTouch[6];
  out vec4 outColor;

  float hash(float x){return fract(sin(x*127.1)*43758.5453);}
  float ellipseDist(vec2 p,vec2 c,vec2 s,float rot){
    float cs=cos(rot),sn=sin(rot);
    vec2 q=p-c;
    q=mat2(cs,-sn,sn,cs)*q;
    return length(q/s);
  }

  vec3 palette(float i,float seed){
    float h=fract(.56+i*.012+seed*.001);
    vec3 a=vec3(.02,.15,.42);
    vec3 b=vec3(.18,.62,.98);
    float k=.5+.5*sin(h*6.2831);
    return mix(a,b,k);
  }

  void main(){
    vec2 p=gl_FragCoord.xy/uRes-.5;
    p.x*=uRes.x/uRes.y;

    vec3 col=vec3(.965,.945,.905);
    col-=vec3(.025,.035,.055)*exp(-pow((p.y+.38)/.85,2.));

    for(int i=0;i<14;i++){
      float fi=float(i);
      float phase=uTime*.18+fi*.43+uSeed*.017;
      float y=.40-fi*.064 + .035*sin(phase);
      float x=.085*sin(fi*1.31+uTime*.12+uTilt);
      x+=.035*sin(fi*.71+uTime*.23);
      float local=0.0;

      for(int j=0;j<6;j++){
        vec4 m=uTouch[j];
        float d=length(p-m.xy);
        local+=m.w*exp(-d*d*18.0)*(0.12+uDepth*.18);
      }

      x+=local*sin(fi*.9+1.2);
      y-=local*.28;

      float rot=.18*sin(fi*1.17+uTime*.11+uTilt)+uTilt*.55;
      vec2 s=vec2(.23+.018*sin(fi*1.7+uSeed),.105+.010*sin(fi*.9+uSeed*.3));

      float d=ellipseDist(p,vec2(x,y),s,rot);
      float body=1.0-smoothstep(.68,1.02,d);
      float edge=exp(-pow((d-1.0)/.045,2.0));
      float inner=exp(-pow(d/.72,3.0));

      vec3 base=palette(fi,uSeed);
      float depthFade=.32+.045*fi;
      col=mix(col,col*(1.0-body*.12)+base*body*depthFade,body);
      col+=base*edge*(.22+.025*fi);
      col+=vec3(.25,.55,.95)*inner*.025;

      float shadow=exp(-pow((p.y-(y-s.y*.86))/.055,2.0));
      col-=vec3(.015,.025,.05)*shadow*(.35+.03*fi);
    }

    float core=exp(-pow(length(p-vec2(.02,.02))/.13,2.0));
    col+=vec3(.05,.13,.28)*core*.10;

    float grain=(hash(gl_FragCoord.x*.71+gl_FragCoord.y*.17)-.5)*.009;
    col+=grain;
    outColor=vec4(clamp(col,0.0,1.0),1.0);
  }`;

  function compile(type,src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs=compile(gl.VERTEX_SHADER,VS),fs=compile(gl.FRAGMENT_SHADER,FS);
  if(vs&&fs){
    const pr=gl.createProgram();
    gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
      gl.useProgram(pr);
      gl.bindVertexArray(gl.createVertexArray());
      const buf=gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(pr,'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

      const U={
        res:gl.getUniformLocation(pr,'uRes'),
        time:gl.getUniformLocation(pr,'uTime'),
        seed:gl.getUniformLocation(pr,'uSeed'),
        tilt:gl.getUniformLocation(pr,'uTilt'),
        depth:gl.getUniformLocation(pr,'uDepth'),
        touch:gl.getUniformLocation(pr,'uTouch')
      };
      const touchData=new Float32Array(24);

      renderGL=function(time,phase){
        for(let i=0;i<6;i++){
          const m=marks[i];
          touchData[i*4]=m?m.x:0;
          touchData[i*4+1]=m?m.y:0;
          touchData[i*4+2]=m?m.r:0;
          touchData[i*4+3]=m?m.w:0;
        }
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.uniform2f(U.res,canvas.width,canvas.height);
        gl.uniform1f(U.time,time);
        gl.uniform1f(U.seed,seed);
        gl.uniform1f(U.tilt,tilt);
        gl.uniform1f(U.depth,depth);
        gl.uniform4fv(U.touch,touchData);
        gl.drawArrays(gl.TRIANGLES,0,3);
      };
    }
  }
}

const ctx=canvas.getContext('2d');
function render2D(time){
  const sx=canvas.width/W,sy=canvas.height/H;
  ctx.setTransform(sx,0,0,sy,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f3efe7';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(W/H,1);
  for(let i=13;i>=0;i--){
    const fi=i,yy=.40-fi*.064+.035*Math.sin(time*.18+fi*.43+seed*.017);
    const xx=.085*Math.sin(fi*1.31+time*.12+tilt)+.035*Math.sin(fi*.71+time*.23);
    ctx.save();
    ctx.translate(xx,yy);ctx.rotate(.18*Math.sin(fi*1.17+time*.11+tilt)+tilt*.55);
    ctx.scale(.23+.018*Math.sin(fi*1.7+seed),.105+.01*Math.sin(fi*.9+seed*.3));
    const g=ctx.createRadialGradient(0,0,.05,0,0,1);
    g.addColorStop(0,'rgba(55,145,245,.10)');
    g.addColorStop(.72,'rgba(40,110,220,.42)');
    g.addColorStop(.93,'rgba(120,195,255,.50)');
    g.addColorStop(1,'rgba(30,90,190,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,1,1,0,0,TAU);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function draw(time,phase){
  if(renderGL) renderGL(time,phase); else render2D(time);
}
function frame(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;t+=dt;
  draw(t,(t/8)%1);requestAnimationFrame(frame);
}
function loopFrame(phase){draw(phase,phase/TAU)}

function touch(x,y){
  const qx=x/W-.5,qy=.5-y/H;
  marks.unshift({x:qx*1.7,y:qy*1.7,r:(Math.random()-.5)*.7,w:1});
  if(marks.length>6)marks.pop();
  depth=Math.min(1,depth+.12);
  tilt+=(Math.random()-.5)*.16;
  hinted=true;hint.classList.remove('on');
}
function mutate(){
  seed=Math.random()*90;
  tilt=(Math.random()-.5)*.7;
  depth=Math.random()*.6;
}
function reset(){
  marks.length=0;seed=5.3;tilt=0;depth=0;
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();touch(e.clientX,e.clientY);
},{passive:false});

resize();
requestAnimationFrame(frame);
setTimeout(()=>{if(!hinted)hint.classList.add('on')},900);
setTimeout(()=>hint.classList.remove('on'),6000);

window.APKit.init({
  canvas:canvas,gifName:'azure-descent-loop',clockFormat:'spec',
  dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:loopFrame,
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:reset}
  ]
});
})();
</script>
</body>
</html>
