<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS TAP VIOLET</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07030b}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* TOUCH LAW: TAP relocates the world's attention to the tapped cell and inverts its local hierarchy. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=6.283185;let W,H,D,spots=[],mem=[],seed=31,last=performance.now(),hue=.78,sens=1;
function s(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',s);s();function r(){let z=Math.sin(seed++*43.2)*43758.5;return z-Math.floor(z)}function reset(){seed=31;spots=[];mem=[];for(let i=0;i<5;i++)spots.push({x:W*(.08+.84*r()),y:H*(.08+.84*r()),q:.7+r(),b:performance.now()+i*800,d:3500+r()*3300,rad:Math.min(W,H)*(.16+r()*.18),flip:0})}reset();
function sources(t){let a=[];for(let i=spots.length-1;i>=0;i--){let z=spots[i],u=(t-z.b)/z.d;if(u>=1){z.b=t+500+r()*1000;z.x=W*(.08+.84*r());z.y=H*(.08+.84*r());u=0}let e=Math.sin(Math.max(0,u)*Math.PI);a.push({x:z.x+Math.sin(t*.00015+i)*10,y:z.y+Math.cos(t*.00017+i)*8,s:z.q*e,rad:z.rad,flip:z.flip})}for(let m of mem)a.push(m);return a}function A(px,py,a){let v=0;for(let z of a)v+=z.s*Math.exp(-Math.hypot(px-z.x,py-z.y)/z.rad);return v}function cell(px,py,w,d,a){let q=A(px+w/2,py+w/2,a),th=(.31+d*.19)/sens;if(d<7&&w>10&&q>th){let k=w/2;cell(px,py,k,d+1,a);cell(px+k,py,k,d+1,a);cell(px,py+k,k,d+1,a);cell(px+k,py+k,k,d+1,a)}else{let flip=((px/W*7|0)+(py/H*9|0))%2;let hh=(hue+d*.028+(flip? .08:0))%1;g.strokeStyle=`hsla(${260+hh*80},90%,${62+q*9}%,${.08+q*.24})`;g.lineWidth=.7;g.strokeRect(px+.5,py+.5,w-1,w-1)}}function draw(t,dt){for(let i=mem.length-1;i>=0;i--){mem[i].s*=Math.pow(.07,dt);if(mem[i].s<.025)mem.splice(i,1)}g.fillStyle='#07030b';g.fillRect(0,0,W,H);cell(0,0,W,0,sources(t))}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;let near=null,b=Infinity;for(let z of spots){let q=Math.hypot(e.clientX-z.x,e.clientY-z.y);if(q<b){b=q;near=z}}if(near&&b<170){near.x=e.clientX;near.y=e.clientY;near.q=Math.min(2.2,near.q+.55);near.flip=1-near.flip}else spots.push({x:e.clientX,y:e.clientY,q:1,b:performance.now(),d:3000,rad:Math.min(W,H)*.2,flip:1});mem.push({x:e.clientX,y:e.clientY,s:.55,rad:Math.min(W,H)*.14});});
APKit.init({canvas:c,gifName:'focus-tap-violet-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{let z={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.28*Math.sin(p*2)),s:1.6,rad:Math.min(W,H)*.25};g.fillStyle='#07030b';g.fillRect(0,0,W,H);cell(0,0,W,0,[z])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=.68+Math.random()*.22;sens=.8+Math.random()*.4}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
