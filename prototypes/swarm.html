<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>SWARM</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020202}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,N=120;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#020202';g.fillRect(0,0,W,H);for(let i=0;i<N;i++){let a=i*.73+p*6*(i%3+1),r=Math.min(W,H)*(.12+.002*i),x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;g.beginPath();g.arc(x,y,1.5,0,7);g.fillStyle=`hsla(${i*3},85%,65%,.7)`;g.fill()}}function mu(){N=40+Math.random()*220|0}APKit.init({canvas:c,gifName:'swarm-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>N=120}]});draw(0)</script>
