<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CULTIVAR — BLACK ORCHID</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  CULTIVAR (BLACK ORCHID) / Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: おっちゃん提供の黒い蘭の写真。
  ※ 同じ写真からチャッピーが prototypes/black-orchid.html を先に作っているので、
     そちらは残したまま別ファイルとして置いている(法則も別物)。
  元写真の特徴(黒い花被片 + 紫の放射条を持つ房状の唇弁)

  世界のルール — 「触れた花弁が、次の世代すべての祖先になる」:
  この花は6つの器官(背萼片・側萼片2・側花弁2・唇弁)を持つが、
  6つとも同じ一組の遺伝子から育っていて、器官ごとに少しずつ形質がズレている。
  花弁を1つ選ぶと、その花弁が持っていたズレが「次の世代の基準」になり、
  花全体がその形質を受け継いで咲き直す。選ばれなかった形質は永久に失われる。
  長押しで選ぶと、受け継ぐ際の変異が大きくなる(強制変異)。
  世代は戻らない。背後には過去の世代の影が薄く残り、系統が伸びていく。
  つまりこれは人工授粉・品種改良の作品で、触る人は「育種家」になる。

  花弁の輪郭は同じ切れ込みの規則を4〜5階層くり返した自己相似のフリンジで、
  大きな鋸歯の中に小さな鋸歯、その中にさらに小さな鋸歯が入れ子になっている。
*/

const c=document.getElementById('c');
const ctx=c.getContext('2d');
let W=0,H=0,DPR=1,R=1,CX=0,CY=0;

/* ---------- 乱数 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ---------- 遺伝子 ---------- */
const FIELDS={
  len  :[0.60,1.55],  /* 花弁の長さ */
  wid  :[0.45,1.70],  /* 幅 */
  curl :[-1.00,1.00], /* 反り */
  twist:[-0.80,0.80], /* ねじれ */
  fringe:[0.02,0.95], /* 縁の切れ込みの深さ */
  depth:[2.40,5.40],  /* 切れ込みの再帰階層 */
  hue  :[200,420],    /* 色相(360超は赤へ回り込む) */
  sat  :[0.15,1.00],
  lum  :[0.03,0.20],  /* 基本は黒。上げると色が抜ける */
  sheen:[0.15,1.00],  /* 光沢 */
  ray  :[12,70],      /* 唇弁の放射条 */
  tail :[0.15,1.70],  /* 唇弁の尾 */
  lipR :[0.50,1.50],  /* 唇弁の大きさ */
  seed :[0,9999]      /* 切れ込みの並び */
};
const KEYS=Object.keys(FIELDS);

/* 原種(写真に寄せた初期値) */
const WILD={len:1.00,wid:1.00,curl:0.45,twist:0.10,fringe:0.55,depth:4.60,
  hue:288,sat:0.95,lum:0.070,sheen:0.75,ray:44,tail:1.15,lipR:1.00,seed:1234};

function clone(g){const o={};for(const k of KEYS)o[k]=g[k];return o}
function clamp(k,v){const f=FIELDS[k];return v<f[0]?f[0]:v>f[1]?f[1]:v}
function mutate(g,s,r){
  const o={};
  for(const k of KEYS){
    const f=FIELDS[k],span=f[1]-f[0];
    o[k]=clamp(k,g[k]+gauss(r)*span*s*(k==='seed'?3.0:0.5));
  }
  return o;
}
function randomGene(r){
  const o={};for(const k of KEYS){const f=FIELDS[k];o[k]=f[0]+r()*(f[1]-f[0])}
  o.lum=0.03+r()*r()*0.14;           /* 暗い方に寄せる */
  o.fringe=0.15+r()*0.7;
  return o;
}
function lerpG(a,b,t){const o={};for(const k of KEYS)o[k]=a[k]+(b[k]-a[k])*t;return o}

/* ---------- 器官の役割 ---------- */
const ROLE=[
  {a:-90 ,L:1.02,W:0.30,ck: 2.60,kind:'sepal'}, /* 背萼片(上・鉤状) */
  {a:-156,L:1.00,W:0.54,ck: 1.05,kind:'wing' }, /* 側萼片 左 */
  {a:-24 ,L:1.00,W:0.54,ck:-1.05,kind:'wing' }, /* 側萼片 右 */
  {a: 146,L:1.32,W:0.23,ck:-1.60,kind:'petal'}, /* 側花弁 左(長い) */
  {a: 34 ,L:1.32,W:0.23,ck: 1.60,kind:'petal'}, /* 側花弁 右 */
  {a: 90 ,L:0.00,W:0.00,ck: 0.00,kind:'lip'  }  /* 唇弁 */
];
const N=ROLE.length;

/* ---------- 状態 ---------- */
let base=clone(WILD);
let cur=[],src=[],tgt=[],morph=1,gen=1,hint=1;
let geo=null,ghosts=[],bg=null;
let pressing=false,sel=-1,holdT=0,flash=0;

function spawn(b,s,r){
  const a=[];
  for(let i=0;i<N;i++)a.push(mutate(b,s,r));
  return a;
}
function resetAll(keepGen){
  const r=mulberry32(20260919);
  base=clone(WILD);
  cur=spawn(base,0.05,r);src=cur.map(clone);tgt=cur.map(clone);morph=1;
  ghosts=[];if(!keepGen)gen=1;geo=null;
}

/* ---------- 幾何 ---------- */
/* 同じ規則をdepth階層くり返す自己相似フリンジ(鋸歯の中の鋸歯) */
function fringePath(pts,depth,amp,seed,close){
  const df=Math.floor(depth),fr=depth-df;
  let a=pts;
  for(let d=0;d<df+1;d++){
    const k=amp*Math.pow(0.58,d)*(d===df?fr:1);
    if(k<0.001)break;
    const b=[];const n=a.length;
    const last=close?n:n-1;
    for(let i=0;i<last;i++){
      const p=a[i],q=a[(i+1)%n];
      b.push(p);
      const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);
      if(L<0.7){continue}
      const s=Math.sin((i*12.9898+d*78.233+seed)*1.0)*43758.5453;
      const j=0.62+(s-Math.floor(s))*0.9;
      b.push([(p[0]+q[0])/2-dy/L*L*k*j,(p[1]+q[1])/2+dx/L*L*k*j]);
    }
    if(!close)b.push(a[n-1]);
    a=b;
  }
  return a;
}

function petalOutline(g,ro){
  const L=R*0.92*ro.L*g.len, steps=26;
  const mid=[],nor=[];
  let x=0,y=0;
  for(let i=0;i<=steps;i++){
    const t=i/steps;
    mid.push([x,y]);
    const ang=g.curl*ro.ck*t*0.95+g.twist*Math.sin(t*Math.PI)*0.5;
    nor.push([-Math.sin(ang),Math.cos(ang)]);
    x+=Math.cos(ang)*(L/steps);y+=Math.sin(ang)*(L/steps);
  }
  const Wm=L*ro.W*g.wid;
  const half=i=>{const t=i/steps;
    return Wm*Math.pow(Math.sin(Math.PI*Math.pow(t,0.62)),0.75)*(1-0.25*t);};
  const up=[],dn=[];
  for(let i=0;i<=steps;i++){
    const w=half(i),p=mid[i],nv=nor[i];
    up.push([p[0]+nv[0]*w,p[1]+nv[1]*w]);
    dn.push([p[0]-nv[0]*w,p[1]-nv[1]*w]);
  }
  let out=up.concat(dn.reverse());
  out=fringePath(out,g.depth,g.fringe*0.30,g.seed,true);
  return {out:out,mid:mid,L:L,Wm:Wm};
}

function toPath(pts){
  const p=new Path2D();p.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);
  p.closePath();return p;
}

function lipGeo(g){
  const rad=R*0.30*g.lipR, steps=64, ring=[];
  for(let i=0;i<steps;i++){
    const a=i/steps*Math.PI*2;
    const rr=rad*(1+0.06*Math.sin(a*5+g.seed*0.01));
    ring.push([Math.cos(a)*rr,Math.sin(a)*rr*1.08]);
  }
  const disc=toPath(fringePath(ring,g.depth+0.4,g.fringe*0.34,g.seed+7,true));
  /* 尾(下へ伸びる房) */
  const tl=rad*2.1*g.tail,tw=rad*0.30,tail=[];
  const sg=16;
  for(let i=0;i<=sg;i++){const t=i/sg;tail.push([ tw*(1-t)*Math.pow(1-t*0.3,0.5), rad*0.8+tl*t])}
  for(let i=sg;i>=0;i--){const t=i/sg;tail.push([-tw*(1-t)*Math.pow(1-t*0.3,0.5), rad*0.8+tl*t])}
  const tailP=toPath(fringePath(tail,g.depth,g.fringe*0.42,g.seed+13,true));
  return {disc:disc,tail:tailP,rad:rad};
}

function build(){
  const o=[];
  for(let i=0;i<N;i++){
    const g=cur[i],ro=ROLE[i];
    if(ro.kind==='lip'){o.push({g:g,ro:ro,lip:lipGeo(g),hit:[0,R*0.20]});continue}
    const pg=petalOutline(g,ro);
    const th=ro.a*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th);
    const hm=pg.mid[Math.floor(pg.mid.length*0.55)];
    o.push({g:g,ro:ro,path:toPath(pg.out),L:pg.L,Wm:pg.Wm,th:th,
      hit:[hm[0]*cs-hm[1]*sn,hm[0]*sn+hm[1]*cs]});
  }
  geo=o;
}

/* ---------- 色 ---------- */
function col(g,l,a){
  const h=((g.hue%360)+360)%360;
  return 'hsla('+h.toFixed(1)+','+(g.sat*100).toFixed(0)+'%,'+(l*100).toFixed(1)+'%,'+a+')';
}

/* ---------- 背景 ---------- */
function makeBG(seed){
  const b=document.createElement('canvas');b.width=W;b.height=H;
  const x=b.getContext('2d'),r=mulberry32(seed);
  x.fillStyle='#05070a';x.fillRect(0,0,W,H);
  for(let i=0;i<26;i++){
    const px=r()*W,py=r()*H,rr=(0.10+r()*0.30)*Math.max(W,H);
    const g=x.createRadialGradient(px,py,0,px,py,rr);
    const h=68+r()*46,l=4+r()*9;
    g.addColorStop(0,'hsla('+h+',34%,'+l+'%,0.55)');
    g.addColorStop(1,'hsla('+h+',34%,'+l+'%,0)');
    x.fillStyle=g;x.beginPath();x.arc(px,py,rr,0,7);x.fill();
  }
  const v=x.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.12,W/2,H*0.45,Math.max(W,H)*0.72);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.88)');
  x.fillStyle=v;x.fillRect(0,0,W,H);
  bg=b;
}

/* ---------- 描画 ---------- */
function drawPetal(o,bp,i,alpha,ghost){
  const g=o.g;
  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(o.th+Math.sin(bp+i*1.17)*0.014);
  const br=1+Math.sin(bp+i*0.7)*0.012;
  ctx.scale(br,br);
  if(ghost){
    ctx.fillStyle=col(g,g.lum*0.8,alpha);
    ctx.fill(o.path);
    ctx.restore();return;
  }
  const gr=ctx.createLinearGradient(0,0,o.L,0);
  gr.addColorStop(0   ,col(g,g.lum*0.55,alpha));
  gr.addColorStop(0.32,col(g,g.lum*1.75,alpha));
  gr.addColorStop(0.72,col(g,g.lum*0.90,alpha));
  gr.addColorStop(1   ,col(g,g.lum*0.35,alpha));
  ctx.fillStyle=gr;ctx.fill(o.path);

  /* 光沢(中心線に沿ったサテンの筋) */
  ctx.save();ctx.clip(o.path);
  const sh=ctx.createLinearGradient(0,-o.Wm*0.55,0,o.Wm*0.55);
  const sa=g.sheen*0.30*alpha;
  sh.addColorStop(0,'rgba(255,255,255,0)');
  sh.addColorStop(0.42,col(g,0.72,sa));
  sh.addColorStop(0.5,'rgba(255,255,255,'+(sa*0.55).toFixed(3)+')');
  sh.addColorStop(0.60,col(g,0.55,sa*0.7));
  sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh;ctx.fillRect(0,-o.Wm*1.2,o.L*1.05,o.Wm*2.4);
  ctx.restore();

  /* 縁の紫の光 */
  ctx.lineWidth=Math.max(0.8,R*0.004);
  ctx.strokeStyle=col(g,0.52,0.20*g.sheen*alpha);
  ctx.stroke(o.path);
  ctx.restore();
}

function drawLip(o,bp,alpha,ghost){
  const g=o.g,lp=o.lip;
  ctx.save();
  ctx.translate(CX,CY+R*0.06);
  const br=1+Math.sin(bp+2.2)*0.016;
  ctx.scale(br,br);
  if(ghost){
    ctx.fillStyle=col(g,g.lum*0.8,alpha);
    ctx.fill(lp.tail);ctx.fill(lp.disc);ctx.restore();return;
  }
  /* 尾 */
  const tg=ctx.createLinearGradient(0,0,0,lp.rad*3.2);
  tg.addColorStop(0,col(g,g.lum*2.2,alpha));
  tg.addColorStop(0.35,col(g,g.lum*1.1,alpha));
  tg.addColorStop(1,col(g,g.lum*0.35,alpha));
  ctx.fillStyle=tg;ctx.fill(lp.tail);

  /* 房(円盤) */
  const dg=ctx.createRadialGradient(0,0,lp.rad*0.04,0,0,lp.rad*1.05);
  dg.addColorStop(0   ,col(g,0.04,alpha));
  dg.addColorStop(0.30,col(g,0.30*(0.4+g.sat*0.6),alpha));
  dg.addColorStop(0.62,col(g,0.40*(0.4+g.sat*0.6),alpha));
  dg.addColorStop(0.88,col(g,g.lum*1.3,alpha));
  dg.addColorStop(1   ,col(g,g.lum*0.5,alpha));
  ctx.fillStyle=dg;ctx.fill(lp.disc);

  /* 放射条 */
  ctx.save();ctx.clip(lp.disc);
  const n=Math.round(g.ray);
  ctx.lineWidth=Math.max(0.6,lp.rad*0.012);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    ctx.strokeStyle=(i%2)?col(g,0.03,0.45*alpha):col(g,0.62,0.13*alpha);
    ctx.beginPath();ctx.moveTo(Math.cos(a)*lp.rad*0.10,Math.sin(a)*lp.rad*0.10);
    ctx.lineTo(Math.cos(a)*lp.rad*1.25,Math.sin(a)*lp.rad*1.30);ctx.stroke();
  }
  ctx.restore();
  /* 中心の光点 */
  const cg=ctx.createRadialGradient(0,-lp.rad*0.12,0,0,-lp.rad*0.12,lp.rad*0.30);
  cg.addColorStop(0,'rgba(255,255,255,'+(0.40*g.sheen*alpha).toFixed(3)+')');
  cg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,-lp.rad*0.12,lp.rad*0.32,0,7);ctx.fill();
  ctx.lineWidth=Math.max(0.7,R*0.003);
  ctx.strokeStyle=col(g,0.58,0.22*g.sheen*alpha);ctx.stroke(lp.disc);
  ctx.restore();
}

const ORDER=[1,2,0,3,4,5];

function drawFlower(bp,alpha,ghost){
  for(const i of ORDER){
    const o=geo[i];
    if(o.ro.kind==='lip')drawLip(o,bp,alpha,ghost);else drawPetal(o,bp,i,alpha,ghost);
  }
}

function draw(bp){
  ctx.setTransform(1,0,0,1,0,0);
  if(bg)ctx.drawImage(bg,0,0);else{ctx.fillStyle='#05070a';ctx.fillRect(0,0,W,H)}

  /* 過去の世代の影(系統) */
  for(let k=0;k<ghosts.length;k++){
    const gh=ghosts[k],f=(k+1)/(ghosts.length+1);
    ctx.save();
    ctx.translate(CX,CY);ctx.scale(1+0.10*(ghosts.length-k),1+0.10*(ghosts.length-k));
    ctx.translate(-CX,-CY);
    ctx.globalAlpha=0.16*f;
    const keep=geo;geo=gh;drawFlower(bp*0.5,0.5,true);geo=keep;
    ctx.restore();
  }
  ctx.globalAlpha=1;

  drawFlower(bp,1,false);

  /* 選択中の器官を縁取り */
  if(pressing&&sel>=0&&geo[sel]){
    const o=geo[sel],hold=Math.min(1,(performance.now()-holdT)/700);
    ctx.save();ctx.translate(CX,CY+(o.ro.kind==='lip'?R*0.06:0));
    if(o.ro.kind!=='lip')ctx.rotate(o.th);
    ctx.lineWidth=Math.max(1.2,R*0.006);
    ctx.strokeStyle='hsla('+((o.g.hue%360+360)%360).toFixed(0)+',100%,'+(60+hold*30).toFixed(0)+'%,'+(0.35+hold*0.5).toFixed(2)+')';
    if(o.ro.kind==='lip'){ctx.stroke(o.lip.disc);ctx.stroke(o.lip.tail)}else ctx.stroke(o.path);
    ctx.restore();
    if(hold>=1){
      ctx.save();ctx.globalAlpha=0.22+0.18*Math.sin(performance.now()/90);
      ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,R*0.004);
      ctx.beginPath();ctx.arc(CX,CY,R*1.02,0,7);ctx.stroke();ctx.restore();
    }
  }
  if(flash>0){
    ctx.save();ctx.globalAlpha=flash*0.16;ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);ctx.restore();
  }

  /* 世代表示 */
  const pad=Math.max(14,R*0.07);
  ctx.save();
  ctx.font=(Math.max(10,R*0.045)|0)+'px ui-monospace,Menlo,monospace';
  ctx.fillStyle='rgba(200,190,215,0.38)';ctx.textBaseline='bottom';
  ctx.fillText('GEN '+String(gen).padStart(2,'0'),pad,H-pad);
  if(hint>0){
    ctx.globalAlpha=hint;
    ctx.textAlign='right';
    ctx.fillText('TAP A PETAL TO BREED',W-pad,H-pad);
    ctx.textAlign='left';
  }
  ctx.restore();
}

/* ---------- 交配 ---------- */
function breed(i,strength){
  if(!geo||!geo[i])return;
  ghosts.push(geo);if(ghosts.length>4)ghosts.shift();
  base=clone(cur[i]);
  const r=mulberry32((Date.now()^(i*7919))>>>0);
  src=cur.map(clone);
  tgt=spawn(base,strength,r);
  morph=0;gen++;flash=1;hint=0;
}

/* ---------- 入力 ---------- */
function pick(x,y){
  let best=-1,bd=1e9;
  for(let i=0;i<N;i++){
    const o=geo[i];
    const px=CX+o.hit[0],py=CY+o.hit[1];
    const d=Math.hypot(x-px,y-py);
    if(d<bd){bd=d;best=i}
  }
  return bd<R*0.62?best:-1;
}
c.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(!geo)return;
  const i=pick(e.clientX*DPR,e.clientY*DPR);
  if(i<0)return;
  sel=i;pressing=true;holdT=performance.now();
});
c.addEventListener('pointermove',function(e){
  if(!pressing)return;
  /* 指を滑らせている間は、いま触れている器官へ選択を移せる。花から外れたら選択解除 */
  sel=pick(e.clientX*DPR,e.clientY*DPR);
});
function release(e){
  if(!pressing)return;
  pressing=false;
  if(sel<0)return;
  const held=(performance.now()-holdT)/1000;
  breed(sel,held>0.7?0.16:0.045);
  sel=-1;
}
c.addEventListener('pointerup',release);
c.addEventListener('pointercancel',function(){pressing=false;sel=-1});
c.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- ループ ---------- */
let last=performance.now(),skip=0;
function tick(){
  const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(morph<1){
    morph=Math.min(1,morph+dt/1.25);
    const t=morph<0.5?2*morph*morph:1-Math.pow(-2*morph+2,2)/2;
    for(let i=0;i<N;i++)cur[i]=lerpG(src[i],tgt[i],t);
    skip=(skip+1)%2;
    if(skip===0||morph>=1)build();
  }else if(!geo)build();
  if(flash>0)flash=Math.max(0,flash-dt*2.2);
  if(hint>0&&now>6000)hint=Math.max(0,hint-dt*0.5);
  draw(now/1000*0.55);
  requestAnimationFrame(tick);
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);
  c.width=W;c.height=H;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  ctx.setTransform(1,0,0,1,0,0);
  R=Math.min(W,H)*0.34;CX=W/2;CY=H*0.46;
  makeBG(7777);ghosts=[];build();
}
window.addEventListener('resize',resize);
resetAll(false);resize();
requestAnimationFrame(tick);

/* ---------- ap-kit ---------- */
APKit.init({
  canvas:c,
  gifName:'black-orchid-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 別の野生株を持ち込む(系統は続くが、基準遺伝子が丸ごと入れ替わる) */
      const r=mulberry32((Date.now()*2654435761)>>>0);
      ghosts.push(geo);if(ghosts.length>4)ghosts.shift();
      base=randomGene(r);src=cur.map(clone);tgt=spawn(base,0.05,r);
      morph=0;gen++;flash=1;hint=0;makeBG((Date.now()&0xffff));
    }},
    {label:'↻',name:'reset',onClick:function(){resetAll(false);makeBG(7777)}}
  ]
});
