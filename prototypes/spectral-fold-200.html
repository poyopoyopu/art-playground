<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPECTRAL FOLD 200</title><script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f5ef}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*10000,mx=.18,my=.34,tx=.18,ty=.34,press=0,pt=0,hue=0,ht=0,last=performance.now();
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const hash=n=>{const x=Math.sin(n*127.1+seed*.017)*43758.5453;return x-Math.floor(x)};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function ribbon(i,z,phase,S){const q=i/23,base=H*(.22+q*.60),wave=S*(.04+.025*q),anchor=Math.exp(-Math.pow((z-mx)/.24,2));return base+wave*Math.sin(z*TAU*(.8+q*1.8)+i*.63+phase*.16)+S*.055*Math.sin(z*TAU*1.35+phase*.10)*anchor*press+(my*H-base)*.12*anchor}
function drawBand(i,phase,S){const q=i/23,N=180,pts=[];for(let j=0;j<=N;j++){const z=-.03+j/N*1.06;pts.push([z*W,ribbon(i,z,phase,S)])}const h=300+q*230+hue,g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,hs(h,55,62,.62));g.addColorStop(.32,hs(h+35,62,72,.84));g.addColorStop(.56,hs(h+105,42,75,.78));g.addColorStop(.8,hs(h+180,60,63,.82));g.addColorStop(1,hs(h+215,52,58,.55));ctx.strokeStyle=g;ctx.lineWidth=1.25;ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();if(i%3===0){ctx.strokeStyle='rgba(255,255,255,.36)';ctx.lineWidth=.55;ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]-1):ctx.moveTo(p[0],p[1]-1));ctx.stroke()}}
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H),X=mx*W,Y=my*H;const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,hs(42+hue*.08,32,97));bg.addColorStop(.5,hs(35+hue*.05,28,96));bg.addColorStop(1,hs(28+hue*.06,34,94));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const ph=T(1.3);for(let i=0;i<24;i++)drawBand(i,ph,S);ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(X,Y,0,X,Y,S*.46);g.addColorStop(0,'rgba(255,244,210,.42)');g.addColorStop(.25,'rgba(255,225,190,.12)');g.addColorStop(1,'rgba(255,240,215,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';for(let i=0;i<9;i++){const q=hash(i+6),z=clamp(.12+q*.82+Math.sin(T(.06)+i)*.03,0,1),y=ribbon(Math.floor(q*23),z,T(.4),S),a=.16+.6*Math.pow((Math.sin(T(.38+i*.05)+i)+1)/2,9),r=S*.005;ctx.fillStyle=`rgba(255,250,235,${a})`;ctx.beginPath();ctx.arc(z*W,y,r,0,TAU);ctx.fill()}}
function frame(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;mx+=(tx-mx)*(1-Math.pow(.0005,dt));my+=(ty-my)*(1-Math.pow(.0005,dt));press+=(pt-press)*(1-Math.pow(.0001,dt));hue+=(ht-hue)*(1-Math.pow(.0008,dt));draw();requestAnimationFrame(frame)}frame();
function setTouch(x,y,down){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);pt=down?1:0;return true}canvas.addEventListener('pointerdown',e=>{setTouch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)setTouch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>{setTouch(e.clientX,e.clientY,false)});
function mutate(){seed=Math.random()*10000;ht=(ht+55+hash(seed)*110)%360}function reset(){mx=tx=.18;my=ty=.34;press=pt=0;hue=ht=0;seed=Math.random()*10000}
APKit.init({canvas,gifName:'spectral-fold-200-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
