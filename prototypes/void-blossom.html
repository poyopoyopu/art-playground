<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VOID BLOSSOM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,mut=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function draw(T=t){x.fillStyle='#03020a';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,S=Math.min(W,H)*.47;for(let r=3;r<S;r+=3.2)for(let k=0;k<42;k++){let a=k*2*Math.PI/42+Math.sin(r*.021+T*.07)*.08,pet=Math.sin(a*21+seed)+.35*Math.sin(a*47-r*.07),rr=r*(.45+.55*Math.max(0,pet));for(const m of mut){let dx=cx+Math.cos(a)*rr-m.x,dy=cy+Math.sin(a)*rr-m.y;rr+=Math.exp(-(dx*dx+dy*dy)/(m.r*m.r))*m.s}let px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr,h=(a*57.3+r*1.3+seed*100+T*4)%360,q=.2+.8*Math.abs(Math.sin(r*.16+a*9));x.fillStyle=`hsla(${h},90%,${48+q*28}%,${q*.75})`;x.fillRect(px,py,3+q*3,2+q*2)}x.beginPath();x.arc(cx,cy,32+10*Math.sin(T*.5),0,7);x.fillStyle='#000';x.fill()}function touch(px,py){mut.push({x:px,y:py,r:45+Math.random()*70,s:(Math.random()-.5)*120});if(mut.length>8)mut.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'void-blossom-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;mut=[]}},{label:'↻',name:'reset',onClick:()=>mut=[]}]});</script></body></html>
