<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COLOR TECTONIC</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* COLOR TECTONIC — ChatGPT作。色の地殻がずれ続け、触れた場所に断層が残る。 */
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*999,phase=0,paused=false;
const faults=[];const N=19;
function rng(i){return (Math.sin(i*127.13+seed*3.71)*43758.5453)%1}
function buildSeeds(){let a=[];for(let i=0;i<N;i++){let x=.08+.84*((Math.sin(i*17.31+seed)*.5+.5)),y=.08+.84*((Math.sin(i*31.77+seed*1.7)*.5+.5));a.push({x,y,a:Math.sin(i*2.9+seed)*.35,b:Math.cos(i*1.7+seed)*.35,h:fract(i*.137+seed*.007)});}return a}
let seeds=buildSeeds();
function fract(x){return x-Math.floor(x)}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.5,devicePixelRatio||1);c.width=W*D;c.height=H*D}
addEventListener('resize',resize);resize();
function hs(h,s,l){h=fract(h)*6;let q=Math.floor(h),f=h-q,a=l*(1-s),b=l*(1-s*f),d=l*(1-s*(1-f));let v=[[l,b,a],[d,l,a],[a,l,b],[a,d,l],[b,a,l],[l,a,d]][q];return 'rgb('+v.map(x=>Math.round(x*255)).join(',')+')'}
function draw(ph){
 const w=Math.min(330,Math.floor(W*.72)),h=Math.min(330,Math.floor(H*.48));const ox=(W-w)/2,oy=(H-h)/2;
 const img=ctx.createImageData(w,h),data=img.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let X=x/w,Y=y/h,best=1e9,second=1e9,bi=0;
   for(let i=0;i<N;i++){let s=seeds[i],dx=X-s.x,dy=Y-s.y;for(const f of faults){let fx=X-f.x,fy=Y-f.y,d=Math.hypot(fx,fy);let g=Math.exp(-d*d/(f.r*f.r));dx+=g*f.dx;dy+=g*f.dy}
     let d=dx*dx+dy*dy;if(d<best){second=best;best=d;bi=i}else if(d<second)second=d}
   let edge=Math.max(0,1-Math.sqrt(second)-0);let hue=seeds[bi].h+ph*.035+bi*.018;let sat=.78,l=.46+.12*Math.sin(ph*.7+bi);
   let rr=1-Math.min(1,Math.sqrt(Math.max(0,second-best))*10);sat*=.72+.28*rr;l*=.82+.18*rr;
   let rgb=hs(hue,sat,l);let m=/\d+/.test(rgb);let parts=rgb.match(/\d+/g).map(Number);let k=(y*w+x)*4;
   data[k]=parts[0];data[k+1]=parts[1];data[k+2]=parts[2];data[k+3]=255;
 }
 ctx.putImageData(img,ox,oy);
 ctx.save();ctx.translate(ox,oy);
 for(let i=0;i<N;i++){let s=seeds[i],px=s.x*w,py=s.y*h;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,7+3*Math.sin(ph+i),0,Math.PI*2);ctx.stroke()}
 for(const f of faults){ctx.save();ctx.translate(f.x*w,f.y*h);ctx.rotate(f.ang);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-f.len/2,0);ctx.lineTo(f.len/2,0);ctx.stroke();ctx.restore()}
 ctx.restore();
}
function addFault(x,y){let dx=Math.cos(seed+x*19)*.045,dy=Math.sin(seed+y*23)*.045;faults.push({x,y,dx,dy,ang:Math.atan2(dy,dx)+Math.PI/2,r:.13,len:.25});if(faults.length>9)faults.shift()}
function pointer(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let w=Math.min(330,Math.floor(W*.72)),h=Math.min(330,Math.floor(H*.48));addFault((e.clientX-(W-w)/2)/w,(e.clientY-(H-h)/2)/h)}
c.addEventListener('pointerdown',pointer);
function loop(now){if(!paused){phase=now*.00022;draw(phase)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'color-tectonic-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[
{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;seeds=buildSeeds()}},
{label:'↻',name:'reset',onClick:()=>{faults.length=0;seed=Math.random()*999;seeds=buildSeeds()}}]});
</script></body></html>
