<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ROOT LAW EVOLUTION</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020604}body{touch-action:none}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D=1,roots=[],hue=110;const TAU=Math.PI*2;function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();function reset(){roots=[];for(let i=0;i<9;i++)roots.push({x:W*(.1+Math.random()*.8),y:H*(.1+Math.random()*.8),a:Math.random()*TAU,v:.3+Math.random()*.5,n:0})}reset();
function draw(p=0){x.fillStyle='#020604';x.fillRect(0,0,W,H);for(let r of roots){let px=r.x,py=r.y,ang=r.a;x.beginPath();x.moveTo(px,py);for(let k=0;k<90;k++){let bend=Math.sin(k*.18+r.n+p*.7)*.055;ang+=bend;let speed=r.v*(1+k*.008);px+=Math.cos(ang)*speed;py+=Math.sin(ang)*speed;if(px<0||px>W||py<0||py>H)ang+=Math.PI*.75; x.lineTo(px,py);if(k%18===0){x.save();x.translate(px,py);x.rotate(ang);x.moveTo(0,0);x.lineTo(18+Math.sin(k+r.n)*8,0);x.restore()}}x.strokeStyle=`hsla(${hue+r.n*40},85%,${55+r.n*5}%,.55)`;x.lineWidth=1.2+r.n*.35;x.stroke();r.a+=.0008;r.n=Math.min(4,r.n+.0006)}for(let i=0;i<roots.length;i++)for(let j=i+1;j<roots.length;j++){let a=roots[i],b=roots[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<90){let nx=(a.x+b.x)/2,ny=(a.y+b.y)/2;roots.splice(j,1);a.x=nx;a.y=ny;a.v=Math.min(1.4,a.v+b.v*.25);a.n=Math.min(4,a.n+.7);break}}}
function touch(px,py){if(APKit.isUI(px,py))return;let r={x:px,y:py,a:Math.random()*TAU,v:.9,n:2.2};roots.push(r);if(roots.length>14)roots.shift();for(let q of roots){let d=Math.hypot(q.x-px,q.y-py);if(d<130)q.a+=Math.atan2(q.y-py,q.x-px)+Math.PI*.5,q.n=Math.min(4,q.n+.8)}}c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));APKit.init({canvas:c,gifName:'root-law-evolution-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=70+Math.random()*180;roots.forEach(r=>r.a+=Math.random()*.8-.4)}},{label:'↻',name:'reset',onClick:reset}]});function loop(){draw(performance.now()*.0001);requestAnimationFrame(loop)}loop();</script></body></html>
