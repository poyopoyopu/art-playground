<!DOCTYPE html>
<!-- SEA HALT — クロちゃん(Claude)作。2026/11/24 試作。
     海辺の秘境駅の箱庭(3D、three.js)。配置はチャッピーが描いた昼の絵(駅舎・ホーム・ベンチ・階段・踏切・電柱・防波堤・消波ブロック・海)から起こした。
     夕方・夜の絵は灯りの色の参考だけ。
     眺める時計: 箱庭に当たる光は「いまの本物の太陽の位置」(東京・今日の日付で計算)。夕方は低い光と長い影、日が沈むと駅舎の窓・街灯がともる。
       列車は10分ごと(毎時00・10・20…分ちょうどに停車)、上りと下りが交互。近づくと踏切が鳴って遮断機が下りる。
     世界のルール: 「時間は指の下でだけ速く流れる」— 長押しの間だけ一日が早送りされ(太陽が回り、灯りがともり、消える)、離すと時間は今へ戻る。
     なぞる=箱庭を回す、2本指=寄る・動かす。ティルトシフト(画面の上下をぼかす)でミニチュアに見せる。
     ✦=列車の塗装と波の高さを替えて、臨時列車をいま走らせる。↻=視点と時間を元に戻す。音なし・常駐テキストなし。 -->

<body>

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const hint = document.getElementById('hint'), ffEl = document.getElementById('ff');
const Q = new URLSearchParams(location.search);

// ---------- 小道具 ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(7);                       // 配置は毎回同じ
function hash2(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v);
}
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let o = 0; o < 4; o++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s / .9375 * 2 - 1; }

function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  return t;
}
function speckle(g, w, h, n, cols, smin, smax) {
  for (let i = 0; i < n; i++) { g.fillStyle = cols[(R() * cols.length) | 0]; const s = lerp(smin, smax, R()); g.fillRect(R() * w, R() * h, s, s); }
}
const std = (o) => new THREE.MeshStandardMaterial(Object.assign({roughness: .9, metalness: 0}, o));
function box(w, h, d, mat, x, y, z, parent = scene) {   // (x,y,z)=底面の中心
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}

// ---------- 寸法(箱庭) ----------
// +X=東、+Z=南(海)。土台は x-12〜12, z-9〜9
const X0 = -12, X1 = 12, Z0 = -9, Z1 = 9, BOT = -3;
const TZ = .45, SEA = -1.0, WALLZ = 1.9, FLOOR = -2.3, PLAT = .9;
const ROAD0 = -11.5, ROAD1 = -8.3, CROSSX = (ROAD0 + ROAD1) / 2;
const RAILTOP = .4;

// ---------- three ----------
const renderer = new THREE.WebGLRenderer({antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance'});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 200);

const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x6a5a40, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 80});
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;

// ---------- テクスチャ ----------
const soilTex = ctex(512, 256, (g, w, h) => {
  const layers = [['#4a3a2a', .00], ['#5b4631', .06], ['#6b5238', .22], ['#5e4a35', .45], ['#735c42', .62], ['#5a4634', .8]];
  layers.forEach(([c, y], i) => { g.fillStyle = c; g.fillRect(0, y * h, w, h); });
  speckle(g, w, h, 2600, ['#3d3024', '#8a7358', '#2e251c', '#9c8a70'], 1, 3);
  for (let i = 0; i < 90; i++) { g.fillStyle = ['#8d877c', '#6f685e', '#a39d90'][i % 3]; g.beginPath(); g.ellipse(R() * w, (.3 + R() * .7) * h, 3 + R() * 7, 2 + R() * 4, 0, 0, 7); g.fill(); }
  g.fillStyle = '#4f6a2a'; g.fillRect(0, 0, w, 6);
});
const soilLong = soilTex.clone(); soilLong.wrapS = soilLong.wrapT = THREE.RepeatWrapping; soilLong.repeat.set(5, 1);
const soilShort = soilTex.clone(); soilShort.wrapS = soilShort.wrapT = THREE.RepeatWrapping; soilShort.repeat.set(2.4, 1);
const concTex = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#9b968c'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 4000, ['#8b867c', '#aaa59b', '#857f74', '#b3aea3'], 1, 2);
  for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(70,64,55,.035)'; g.fillRect(R() * w, 0, 4 + R() * 14, h); }
  g.fillStyle = 'rgba(40,36,30,.3)'; g.fillRect(0, 0, 2, h);
}, [5, 1]);
const wallTex = ctex(256, 256, (g, w, h) => {   // 防波堤:目地とよごれ
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#a29d93'); gr.addColorStop(.55, '#8e897f'); gr.addColorStop(1, '#5e5a52');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 3000, ['#7f7a70', '#b0aba0', '#6e695f'], 1, 2);
  for (let i = 0; i < 10; i++) { g.fillStyle = 'rgba(60,55,45,.12)'; g.fillRect(R() * w, h * .2, 2 + R() * 6, h); }
  g.fillStyle = 'rgba(35,32,28,.6)'; g.fillRect(0, 0, 2, h);
  g.fillStyle = 'rgba(40,55,40,.35)'; g.fillRect(0, h * .78, w, h * .22);
}, [10, 1]);
const ballastTex = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#6f6a63'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const c = 70 + R() * 90 | 0; g.fillStyle = `rgb(${c},${c - 4},${c - 9})`; g.beginPath(); g.ellipse(R() * w, R() * h, 1.2 + R() * 2.4, 1 + R() * 1.8, R() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 300; i++) { g.fillStyle = 'rgba(110,70,40,.35)'; g.fillRect(R() * w, R() * h, 3, 3); }
}, [12, 1]);
const asphaltTex = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#56575a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 5000, ['#4a4b4e', '#646568', '#3f4043', '#707174'], 1, 2);
  g.fillStyle = '#d9d6cc'; g.fillRect(8, 0, 5, h); g.fillRect(w - 13, 0, 5, h);
}, [1, 5]);
const groundTex = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#7c7356'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { g.fillStyle = ['rgba(85,110,50,.5)', 'rgba(120,130,70,.4)', 'rgba(105,95,70,.5)'][i % 3]; g.beginPath(); g.ellipse(R() * w, R() * h, 8 + R() * 30, 6 + R() * 20, R() * 3, 0, 7); g.fill(); }
  speckle(g, w, h, 3000, ['#6a7d3c', '#8a8a5c', '#5b5440', '#99926e'], 1, 2);
}, [12, 6]);
function woodCanvas(g, w, h, boards) {
  g.fillStyle = '#5e574d'; g.fillRect(0, 0, w, h);
  const bw = w / boards;
  for (let i = 0; i < boards; i++) {
    const l = 58 + R() * 12, s = 6 + R() * 8;
    g.fillStyle = `hsl(36,${s}%,${l}%)`; g.fillRect(i * bw + 1, 0, bw - 2, h);
    for (let k = 0; k < 5; k++) { g.fillStyle = `rgba(60,50,40,${.08 + R() * .1})`; g.fillRect(i * bw + 2 + R() * (bw - 4), 0, 1, h); }
  }
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(40,32,24,.25)'); gr.addColorStop(.25, 'rgba(0,0,0,0)'); gr.addColorStop(.85, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(50,40,30,.45)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}
const woodTex = ctex(256, 128, (g, w, h) => woodCanvas(g, w, h, 16));
// 駅舎の正面(窓と戸)
const WIN = [[.06, .3, .23, .45], [.32, .3, .23, .45], [.6, .15, .14, .85], [.79, .3, .16, .45]];   // x,y,w,h(割合)
const frontTex = ctex(512, 205, (g, w, h) => {
  woodCanvas(g, w, h, 30);
  WIN.forEach(([x, y, ww, hh], i) => {
    const X = x * w, Y = y * h, W = ww * w, H = hh * h;
    g.fillStyle = '#d3cdbf'; g.fillRect(X - 4, Y - 4, W + 8, H + 8);
    if (i === 2) { g.fillStyle = '#2c2620'; g.fillRect(X, Y, W, H); g.fillStyle = '#d3cdbf'; g.fillRect(X + W / 2 - 2, Y, 4, H); return; }
    const gr = g.createLinearGradient(X, Y, X + W, Y + H); gr.addColorStop(0, '#5d6e78'); gr.addColorStop(.5, '#2b343b'); gr.addColorStop(1, '#3d4a52');
    g.fillStyle = gr; g.fillRect(X, Y, W, H);
    g.fillStyle = '#d3cdbf'; g.fillRect(X + W / 2 - 2, Y, 4, H); g.fillRect(X, Y + H / 2 - 2, W, 4);
  });
});
const frontEmi = ctex(512, 205, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  WIN.forEach(([x, y, ww, hh], i) => { g.fillStyle = i === 2 ? '#ffb45a' : '#ffc977'; g.fillRect(x * w, y * h, ww * w, hh * h); g.fillStyle = '#000'; g.fillRect((x + ww / 2) * w - 2, y * h, 4, hh * h); if (i !== 2) g.fillRect(x * w, (y + hh / 2) * h - 2, ww * w, 4); });
});
const roofTex = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#7d4f35'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 8) { const gr = g.createLinearGradient(x, 0, x + 8, 0); gr.addColorStop(0, 'rgba(255,220,180,.18)'); gr.addColorStop(.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.28)'); g.fillStyle = gr; g.fillRect(x, 0, 8, h); }
  for (let i = 0; i < 160; i++) { g.fillStyle = ['rgba(160,95,55,.5)', 'rgba(70,45,35,.45)', 'rgba(130,120,110,.35)', 'rgba(190,120,70,.35)'][i % 4]; g.beginPath(); g.ellipse(R() * w, R() * h, 3 + R() * 10, 8 + R() * 30, 0, 0, 7); g.fill(); }
}, [3, 1]);
const glowTex = ctex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(255,255,255,.55)'); gr.addColorStop(.5, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const streakTex = ctex(64, 256, (g, w, h) => {   // 水面に映る灯りの帯
  for (let y = 0; y < h; y += 3) {
    const a = (1 - y / h) * (.35 + .65 * R());
    const ww = w * (.25 + .5 * R()) * (1 - y / h * .5);
    const gr = g.createLinearGradient(w / 2 - ww / 2, 0, w / 2 + ww / 2, 0);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, `rgba(255,255,255,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, y, w, 2);
  }
});
const stripeTex = ctex(128, 16, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#1b1b1b' : '#f2c21b'; g.fillRect(i * 16, 0, 16, h); } }, [1, 1]);
const poleStripe = ctex(16, 128, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#1b1b1b' : '#f2c21b'; g.beginPath(); g.moveTo(0, i * 16); g.lineTo(w, i * 16 - 8); g.lineTo(w, i * 16 + 8); g.lineTo(0, i * 16 + 16); g.fill(); } });

// ---------- 材質 ----------
const M = {
  soilL: std({map: soilLong}), soilS: std({map: soilShort}),
  ground: std({map: groundTex}), conc: std({map: concTex}), wall: std({map: wallTex}),
  ballast: std({map: ballastTex}), asphalt: std({map: asphaltTex, roughness: .95}),
  wood: std({map: woodTex}), roof: std({map: roofTex, roughness: .7, metalness: .25, side: THREE.DoubleSide}),
  front: std({map: frontTex, emissiveMap: frontEmi, emissive: 0xffffff, emissiveIntensity: 0}),
  sleeper: std({color: 0x4a3a2c}), rail: std({color: 0x6d4b36, roughness: .5, metalness: .6}),
  railTop: std({color: 0xb9b4ad, roughness: .3, metalness: .9}),
  metal: std({color: 0x8d9191, roughness: .55, metalness: .5}), dark: std({color: 0x2a2a2a}),
  white: std({color: 0xe8e6e0, roughness: .6}), yellow: std({color: 0xd9b52a, roughness: .7}),
  pole: std({color: 0x8f8b83}), stripe: std({map: stripeTex}), pstripe: std({map: poleStripe}),
  bench: std({color: 0xd8dde2, roughness: .6}), stone: std({color: 0x7e786c}),
  bulb: std({color: 0xfff2d0, emissive: 0xffd28a, emissiveIntensity: 0}),
  red1: std({color: 0x401010, emissive: 0xff2a1a, emissiveIntensity: 0}),
  red2: std({color: 0x401010, emissive: 0xff2a1a, emissiveIntensity: 0}),
  tetra: std({color: 0x8a857b, roughness: .95}),
};

// ---------- 土台 ----------
{
  const land = new THREE.Mesh(new THREE.BoxGeometry(X1 - X0, -BOT, WALLZ - Z0), [M.soilS, M.soilS, M.ground, M.soilL, M.soilL, M.soilL]);
  land.position.set(0, BOT / 2, (Z0 + WALLZ) / 2); land.receiveShadow = true; scene.add(land);
  const seabed = new THREE.Mesh(new THREE.BoxGeometry(X1 - X0, FLOOR - BOT, Z1 - WALLZ), [M.soilS, M.soilS, std({color: 0x6b6250}), M.soilL, M.soilL, M.soilL]);
  seabed.position.set(0, (BOT + FLOOR) / 2, (WALLZ + Z1) / 2); seabed.receiveShadow = true; scene.add(seabed);
  // 海底の岩
  for (let i = 0; i < 26; i++) {
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(.2 + R() * .35, 0), M.stone);
    r.position.set(lerp(X0 + .5, X1 - .5, R()), FLOOR + .1, lerp(WALLZ + 1.5, Z1 - .4, R())); r.rotation.set(R() * 3, R() * 3, R() * 3); r.scale.y = .6; scene.add(r);
  }
}

// ---------- 防波堤・線路 ----------
box(X1 - X0, .45 - FLOOR, WALLZ - 1.0, M.wall, 0, FLOOR, (1.0 + WALLZ) / 2);
box(X1 - ROAD1, .24, 1.2, M.ballast, (ROAD1 + X1) / 2, 0, (-.2 + 1.0) / 2);
{
  // 枕木
  const xs = []; for (let x = ROAD1 + .3; x < X1; x += .46) xs.push(x);
  const sl = new THREE.InstancedMesh(new THREE.BoxGeometry(.2, .07, 1.62), M.sleeper, xs.length);
  const m4 = new THREE.Matrix4(); xs.forEach((x, i) => { m4.makeTranslation(x, .275, TZ); sl.setMatrixAt(i, m4); });
  sl.castShadow = sl.receiveShadow = true; scene.add(sl);
  // レール(踏切の上も通る)
  for (const s of [-1, 1]) {
    box(X1 - X0, .09, .07, M.rail, 0, .31, TZ + s * .53);
    box(X1 - X0, .012, .075, M.railTop, 0, .4, TZ + s * .53);
  }
}
// 道路・踏切
box(ROAD1 - ROAD0, .16, 1.0 - Z0, M.asphalt, CROSSX, 0, (Z0 + 1.0) / 2);
box(ROAD1 - ROAD0, .23, 1.45, std({color: 0x3b3b3d}), CROSSX, .16, TZ);
for (const s of [-1, 1]) box(ROAD1 - ROAD0, .012, .14, M.stripe, CROSSX, .395, TZ + s * .79);
// ガードレール
for (let z = Z0 + .5; z < -1.2; z += 1.1) box(.08, .55, .08, M.white, ROAD0 - .22, 0, z);
box(.04, .16, (-1.2) - (Z0 + .4), M.white, ROAD0 - .27, .38, (Z0 + .4 - 1.2) / 2);

// ---------- ホーム・広場・駅舎 ----------
box(15, PLAT, 2.15, M.conc, 3, 0, -1.275);                    // ホーム(x-4.5〜10.5, z-2.35〜-0.2)
box(15, .005, .2, M.yellow, 3, PLAT, -.62);                     // 点字ブロック
box(15, .005, .06, M.white, 3, PLAT, -.27);
box(9.1, PLAT, 3.45, M.conc, -2.95, 0, -4.075);                 // 駅前の広場(x-7.5〜1.6, z-5.8〜-2.35)
function stairs(x0, x1, z0, z1, yb, yt, n, alongX) {   // 段々。alongX: x0→x1 に向かって上がる
  const g = [];
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n, top = lerp(yb, yt, t1);
    let bg;
    if (alongX) { const a = lerp(x0, x1, t0), b = lerp(x0, x1, t1); bg = new THREE.BoxGeometry(Math.abs(b - a), top - yb, Math.abs(z1 - z0)); bg.translate((a + b) / 2, (top + yb) / 2, (z0 + z1) / 2); }
    else { const a = lerp(z0, z1, t0), b = lerp(z0, z1, t1); bg = new THREE.BoxGeometry(Math.abs(x1 - x0), top - yb, Math.abs(b - a)); bg.translate((x0 + x1) / 2, (top + yb) / 2, (a + b) / 2); }
    g.push(bg);
  }
  const m = new THREE.Mesh(mergeGeometries(g), M.conc); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
stairs(-8.25, -7.5, -3.7, -2.6, 0, PLAT, 5, true);             // 広場→道路

function sunPos(date) {
  const doy = (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(date.getFullYear(), 0, 0)) / 864e5;
  const g = 2 * Math.PI / 365 * (doy - 1 + (date.getHours() - 12) / 24);
  const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));
  const decl = .006918 - .399912 * Math.cos(g) + .070257 * Math.sin(g) - .006758 * Math.cos(2 * g) + .000907 * Math.sin(2 * g) - .002697 * Math.cos(3 * g) + .00148 * Math.sin(3 * g);
  const lat = 35.68 * Math.PI / 180, lon = 139.77;
  const mins = date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
  const tst = mins + eq + 4 * lon - 60 * 9;               // JST(UTC+9)
  const ha = (tst / 4 - 180) * Math.PI / 180;
  const cz = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  const zen = Math.acos(clamp(cz, -1, 1)), alt = Math.PI / 2 - zen;
  let az = Math.acos(clamp((Math.sin(lat) * Math.cos(zen) - Math.sin(decl)) / (Math.cos(lat) * Math.sin(zen)), -1, 1));
  az = ha > 0 ? az + Math.PI : Math.PI - az;                // 北から時計回り
  return {alt, az};
}

  bg.copy(BG.day).lerp(BG.dusk, golden).lerp(BG.night, 1 - dayF);
  renderer.setClearColor(bg, 1);
  document.body.style.background = '#' + bg.getHexString();
  renderer.toneMappingExposure = lerp(1.45, 1.0, dayF) + .25 * golden;
  // 灯り
  const flick = 1;
  M.front.emissiveIntensity = 1.6 * lampF;
  M.bulb.emissiveIntensity = 3 * lampF;
  for (const L of LAMPS) { L.light.intensity = 3.5 * lampF; L.glow.material.opacity = .9 * lampF; L.streak.material.opacity = .85 * lampF; }
  stationLight.intensity = 6 * lampF; stationGlow.material.opacity = .55 * lampF; stationStreak.material.opacity = .7 * lampF;
  seaMat.color.set(0xffffff).lerp(C(0x3a4a66), (1 - dayF) * .75); seaMat.roughness = lerp(.06, .14, dayF);
  for (const sd of sides) sd.m.material.color.set(0xffffff).lerp(C(0x33405a), (1 - dayF) * .75);
  for (const m of trainWinMats) m.emissiveIntensity = 1.3 * smooth(.1, .8, lampF) + .05;
  for (const g of headGlows) g.material.opacity = lerp(.35, 1, lampF);
  for (const g of tailGlows) g.material.opacity = .7 * lampF;
  window._clock.m.material.emissiveIntensity = .6 * lampF;
  spMat.uniforms.uTint.value.set(0xffffff).lerp(C(0x56627e), 1 - dayF);
  return deg;
}

// ---------- 時計の文字盤 ----------
function drawClock(date) {
  const k = window._clock, s = date.getSeconds(); if (s === k.last) return; k.last = s;
  const g = k.c.getContext('2d'), w = 128;
  g.fillStyle = '#f5f2ea'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill(); g.lineWidth = 6; g.strokeStyle = '#333'; g.stroke();
  g.fillStyle = '#333'; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.fillRect(64 + Math.sin(a) * 48 - 3, 64 - Math.cos(a) * 48 - 3, 6, 6); }
  const hand = (a, l, wd, c) => { g.strokeStyle = c; g.lineWidth = wd; g.lineCap = 'round'; g.beginPath(); g.moveTo(64, 64); g.lineTo(64 + Math.sin(a) * l, 64 - Math.cos(a) * l); g.stroke(); };
  const m = date.getMinutes() + s / 60, h = (date.getHours() % 12) + m / 60;
  hand(h / 12 * Math.PI * 2, 30, 8, '#222'); hand(m / 60 * Math.PI * 2, 46, 5, '#222'); hand(s / 60 * Math.PI * 2, 50, 2, '#c22');
  k.t.needsUpdate = true;
}

// ---------- カメラ ----------
const view = {az: 0, el: 0, zoom: 1, tx: .5, tz: 0};
let AZ0 = -.55, EL0 = .64, baseHalf = 10;
function camDir(az, el) { return new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)); }
function fit() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  AZ0 = asp < .9 ? -1.18 : -.42;
  EL0 = asp < .9 ? .74 : .6;
  // 土台の8隅を写して、画面に収まる大きさを出す
  const d = camDir(AZ0, EL0), up = new THREE.Vector3(0, 1, 0), right = new THREE.Vector3().crossVectors(up, d).normalize(), vup = new THREE.Vector3().crossVectors(d, right);
  let mx = 0, my = 0; const c = new THREE.Vector3(.5, .8, 0);
  for (const x of [X0, X1]) for (const y of [BOT, 4.5]) for (const z of [Z0, Z1]) { const p = new THREE.Vector3(x, y, z).sub(c); mx = Math.max(mx, Math.abs(p.dot(right))); my = Math.max(my, Math.abs(p.dot(vup))); }
  baseHalf = Math.max(my * .9, mx / asp) / (asp < .9 ? .98 : .94);
}
function placeCamera() {
  const az = AZ0 + view.az, el = clamp(EL0 + view.el, .3, 1.2);
  const tgt = new THREE.Vector3(view.tx, .8, view.tz);
  camera.position.copy(tgt).addScaledVector(camDir(az, el), 70); camera.lookAt(tgt);
  const asp = innerWidth / innerHeight, hh = baseHalf;
  Object.assign(camera, {left: -hh * asp, right: hh * asp, top: hh, bottom: -hh, zoom: view.zoom});
  camera.updateProjectionMatrix();
}

// ---------- ティルトシフト(画面の上下をぼかす) ----------
const rtA = new THREE.WebGLRenderTarget(1, 1, {type: THREE.HalfFloatType, samples: 4});
const rtB = new THREE.WebGLRenderTarget(1, 1, {type: THREE.HalfFloatType});
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const FS = `uniform sampler2D tSrc; uniform vec2 uRes, uDir; uniform float uFocus, uBand, uMax; varying vec2 vUv;
void main(){
  float d=abs(vUv.y-uFocus);
  float r=uMax*smoothstep(uBand,uBand+.34,d);
  vec2 st=uDir/uRes*r*.25;
  vec4 c=texture2D(tSrc,vUv)*.2270270270;
  c+=(texture2D(tSrc,vUv+st)+texture2D(tSrc,vUv-st))*.1945945946;
  c+=(texture2D(tSrc,vUv+2.*st)+texture2D(tSrc,vUv-2.*st))*.1216216216;
  c+=(texture2D(tSrc,vUv+3.*st)+texture2D(tSrc,vUv-3.*st))*.0540540541;
  c+=(texture2D(tSrc,vUv+4.*st)+texture2D(tSrc,vUv-4.*st))*.0162162162;
#ifdef FINAL
  vec3 col=c.rgb; float l=dot(col,vec3(.2126,.7152,.0722)); col=mix(vec3(l),col,1.1);
  gl_FragColor=vec4(col,1.);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
#else
  gl_FragColor=c;
#endif
}`;
const mkPass = (final) => new THREE.ShaderMaterial({
  uniforms: {tSrc: {value: null}, uRes: {value: new THREE.Vector2()}, uDir: {value: new THREE.Vector2(final ? 0 : 1, final ? 1 : 0)}, uFocus: {value: .5}, uBand: {value: .14}, uMax: {value: 6}},
  vertexShader: VS, fragmentShader: FS, defines: final ? {FINAL: 1} : {}, depthTest: false, depthWrite: false, toneMapped: final
});
const passH = mkPass(false), passV = mkPass(true);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), passH); quad.frustumCulled = false;
const quadScene = new THREE.Scene(); quadScene.add(quad);

let dpr = Math.min(devicePixelRatio || 1, 2), W = 1, Hh = 1;
function layout() {
  W = innerWidth; Hh = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(W, Hh);
  const pw = Math.round(W * dpr), ph = Math.round(Hh * dpr);
  rtA.setSize(pw, ph); rtB.setSize(pw, ph);
  for (const p of [passH, passV]) { p.uniforms.uRes.value.set(pw, ph); p.uniforms.uMax.value = 5.5 * dpr; }
  spMat.uniforms.uSize.value = 5 * dpr;
  fit(); placeCamera();
}

// ---------- 操作 ----------
const ptrs = new Map();
let gesture = null, holdTimer = 0, downAt = null;
const cv = renderer.domElement;
function startHold() { holding = true; ffSpeed = 0; }
cv.addEventListener('pointerdown', (e) => {
  if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (ptrs.size === 1) {
    downAt = {x: e.clientX, y: e.clientY}; gesture = 'tap';
    clearTimeout(holdTimer); holdTimer = setTimeout(() => { if (gesture === 'tap') { gesture = 'hold'; startHold(); } }, 420);
  } else { clearTimeout(holdTimer); if (gesture === 'hold') holding = false; gesture = 'pinch'; pinch0 = pinchState(); }
  hint.classList.remove('on');
});
let pinch0 = null;
function pinchState() {
  const a = [...ptrs.values()]; const dx = a[0].x - a[1].x, dy = a[0].y - a[1].y;
  return {d: Math.hypot(dx, dy), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2, zoom: view.zoom, tx: view.tx, tz: view.tz};
}
cv.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (gesture === 'tap' && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 9) { gesture = 'drag'; clearTimeout(holdTimer); }
  if (gesture === 'drag') { view.az = clamp(view.az - dx * .006, -.9, .9); view.el = clamp(view.el + dy * .004, -.3, .45); }
  if (gesture === 'pinch' && ptrs.size >= 2) {
    const s = pinchState();
    view.zoom = clamp(pinch0.zoom * s.d / pinch0.d, .8, 3.2);
    // 2本指で動かす(地面の上を滑らせる)
    const wpp = 2 * baseHalf / view.zoom / Hh, az = AZ0 + view.az;
    const mx = (s.mx - pinch0.mx) * wpp, my = (s.my - pinch0.my) * wpp / Math.sin(clamp(EL0 + view.el, .3, 1.2));
    const rx = Math.cos(az), rz = -Math.sin(az), fx = -Math.sin(az), fz = -Math.cos(az);
    view.tx = clamp(pinch0.tx - mx * rx + my * fx, X0, X1); view.tz = clamp(pinch0.tz - mx * rz + my * fz, Z0, Z1);
  }
});
function up(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); clearTimeout(holdTimer);
  if (gesture === 'hold') holding = false;
  if (ptrs.size === 0) gesture = null;
  else if (ptrs.size === 1) gesture = 'none';
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// ---------- 臨時列車(✦) ----------
let extra = null;
function callTrain() {
  liveryIdx = (liveryIdx + 1 + (Math.random() * (LIVERIES.length - 1) | 0)) % LIVERIES.length;
  buildTrain(LIVERIES[liveryIdx]); builtIdx = liveryIdx;
  seaAmp = [.6, 1, 1.5, 2.1][Math.random() * 4 | 0];
  extra = {t0: performance.now(), dir: Math.random() < .5 ? 1 : -1};
  APKit.toast && APKit.toast('臨時列車がまいります');
}

// ---------- ループ ----------
let last = performance.now(), simT = 0, fpsAcc = 0, fpsN = 0, slow = 0;
const vTmp = new THREE.Vector3();
function frame(nowMs) {
  requestAnimationFrame(frame);
  let dt = Math.min(.05, (nowMs - last) / 1000); last = nowMs; simT += dt;
  // 時間の早送り/戻り
  if (holding) { ffSpeed = Math.min(ffSpeed + dt * 3000, 5400); offset += ffSpeed * dt * 1000; }
  else if (!fixedOffset && offset !== 0) {
    const day = 864e5; offset = ((offset % day) + day) % day; if (offset > day / 2) offset -= day;
    offset *= Math.exp(-dt * 2.6); if (Math.abs(offset) < 800) offset = 0;
  }
  const date = nowDate();
  updateLight(date); drawClock(date);
  if (holding || (offset !== 0 && !fixedOffset)) { ffEl.textContent = String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0'); ffEl.classList.add('on'); }
  else ffEl.classList.remove('on');

  // 列車
  let tr = null;
  const secs = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
  const fast = holding || (Math.abs(offset) > 60000 && !fixedOffset);
  if (!fast) {
    const k = Math.round(secs / 600), t = secs - k * 600, dir = k % 2 ? -1 : 1;
    if (onBoard(centerAt(t, dir)) || (t > -12 && t < RUN.dwell)) tr = {kind: 'stop', t, dir};
    else { const k5 = Math.round((secs - 300) / 600), tp = secs - 300 - k5 * 600, dp = k5 % 2 ? 1 : -1;     // 毎時05・15…分は通過列車
      if (onBoard(STOPX + dp * VPASS * tp)) tr = {kind: 'pass', t: tp, dir: dp}; }
  }
  if (extra) {
    const t = (nowMs - extra.t0) / 1000 - 12;
    if (t > 60) extra = null; else if (!tr && (onBoard(centerAt(t, extra.dir)) || t < RUN.dwell)) tr = {kind: 'stop', t, dir: extra.dir};
  }
  const posAt = (r, t) => r.kind === 'pass' ? STOPX + r.dir * VPASS * t : centerAt(t, r.dir);
  if (tr) {
    const want = tr.kind === 'pass' ? (liveryIdx + 2) % LIVERIES.length : liveryIdx;
    if (want !== builtIdx) { buildTrain(LIVERIES[want]); builtIdx = want; }
    const c = posAt(tr, tr.t);
    train.visible = true; train.position.x = c; train.rotation.y = tr.dir > 0 ? 0 : Math.PI;
    for (const g of [...headGlows, ...tailGlows]) { g.getWorldPosition(vTmp); g.visible = vTmp.x > X0 && vTmp.x < X1; }
  } else train.visible = false;
  // 踏切
  let active = false;
  if (tr) for (let s = 0; s <= 7; s += .5) { if (Math.abs(posAt(tr, tr.t + s) - CROSSX) < TL / 2 + 1.6) { active = true; break; } }
  CROSS.activeFor = active ? CROSS.activeFor + dt : 0;
  const target = CROSS.activeFor > 2.2 ? 0 : Math.PI / 2 - .05;
  CROSS.angle += clamp(target - CROSS.angle, -1.1 * dt, 1.1 * dt); CROSS.pivot.rotation.z = CROSS.angle;
  const blink = active ? (Math.floor(simT * 1.6) % 2) : -1;
  M.red1.emissiveIntensity = blink === 0 ? 4 : 0; M.red2.emissiveIntensity = blink === 1 ? 4 : 0;
  CROSS.reds[0].material.opacity = blink === 0 ? .95 : 0; CROSS.reds[1].material.opacity = blink === 1 ? .95 : 0;
  CROSS.light.intensity = active ? 5 : 0; CROSS.streak.material.opacity = active ? .25 + .45 * lampF : 0;

  // 乗客: 停車の2分ほど前から歩いてきて待つ。停車したら乗り、降りた人は帰る
  if (fast) { if (PEOPLE.length || spawnQ.length) clearPeople(); }
  else {
    const kN = Math.ceil(secs / 600), toN = kN * 600 - secs;
    if (toN < 150 && toN > 45 && spawnedK !== kN) { spawnedK = kN; const n = 1 + (Math.random() * 2.6 | 0); for (let j = 0; j < n; j++) spawnQ.push(simT + j * (6 + Math.random() * 22)); }
    while (spawnQ.length && spawnQ[0] <= simT) { spawnQ.shift(); person([...P_IN, [lerp(-1.5, 9, Math.random()), PLAT, lerp(-1.75, -.95, Math.random())]], false); }
    if (tr && tr.kind === 'stop' && tr.t > 3 && tr.t < RUN.dwell - 3) {
      boardT -= dt;
      if (boardT <= 0) { const w = PEOPLE.find(p => p.state === 'wait'); if (w) { scene.remove(w.g); w.state = 'gone'; } boardT = .9; }
      const id = Math.round(secs - tr.t);
      if (tr.t > 6 && lastAlight !== id) {
        lastAlight = id; const c = posAt(tr, tr.t), n = Math.random() * 2.4 | 0;
        for (let j = 0; j < n; j++) { const dx = (j % 2 ? 3.3 : -3.3) * tr.dir; person([[c + dx, PLAT, -.5], ...P_IN.slice().reverse()], true); }
      }
    }
  }
  updatePeople(dt);
  // 船
  if (!boatS && simT > nextBoat) { const d = Math.random() < .5 ? 1 : -1; boatS = {d, x: -15 * d, z: lerp(5.2, 7.6, Math.random())}; boat.rotation.y = d > 0 ? 0 : Math.PI; }
  if (boatS) {
    boatS.x += boatS.d * .5 * dt;
    boat.visible = true; boat.position.set(boatS.x, wave(boatS.x, boatS.z, simT) + .04, boatS.z);
    boat.rotation.x = Math.sin(simT * 1.3) * .05; boat.rotation.z = Math.sin(simT * 1.7 + 1) * .04;
    boatGlow.visible = Math.abs(boatS.x) < X1 - .4; boatGlow.material.opacity = .9 * lampF;
    if (Math.abs(boatS.x) > 16) { boatS = null; boat.visible = false; nextBoat = simT + 50 + Math.random() * 130; }
  }
  catBody.scale.y = .6 * (1 + .045 * Math.sin(simT * 1.6));
  // 海・しぶき・風・カモメ
  updateSea(simT); updateSpray(simT, dt); sway.value = simT; updateGulls(simT, dayF);
  // 水面の映り込みは見ている方向へ伸ばす
  const az = AZ0 + view.az;
  for (const s of [stationStreak, CROSS.streak, ...LAMPS.map(l => l.streak)]) { s.rotation.z = -az; s.position.z = WALLZ + 2.3; s.scale.x = .85 + .3 * Math.random(); }

  placeCamera();
  vTmp.set(view.tx, .8, view.tz).project(camera);
  passH.uniforms.uFocus.value = passV.uniforms.uFocus.value = clamp(vTmp.y * .5 + .5, .3, .7);
  passH.uniforms.uBand.value = passV.uniforms.uBand.value = .1 + .06 * view.zoom;

  renderer.setRenderTarget(rtA); renderer.render(scene, camera);
  quad.material = passH; passH.uniforms.tSrc.value = rtA.texture; renderer.setRenderTarget(rtB); renderer.render(quadScene, quadCam);
  quad.material = passV; passV.uniforms.tSrc.value = rtB.texture; renderer.setRenderTarget(null); renderer.render(quadScene, quadCam);

  // 重い端末は解像度を下げる
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 2) { const ms = fpsAcc / fpsN * 1000; if (ms > 24 && dpr > 1) { dpr = Math.max(1, dpr - .35); layout(); } fpsAcc = 0; fpsN = 0; }
}

layout();
addEventListener('resize', () => { clearTimeout(layout.t); layout.t = setTimeout(layout, 120); });
updateSea(0);
requestAnimationFrame((n) => { last = n; frame(n); });
hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 7000);

APKit.init({
  canvas: renderer.domElement, gifName: 'sea-halt-loop', clockFormat: 'spec',
  dock: true, autoHide: true, fullscreenButton: false,
  buttons: [
    {label: '✦', name: 'mutate', onClick: callTrain},                  // 塗装と波を替えて臨時列車
    {label: '↻', name: 'reset', onClick: () => { Object.assign(view, {az: 0, el: 0, zoom: 1, tx: .5, tz: 0}); if (!fixedOffset) offset = 0; }}
  ]
});
window.__sea = {scene, view, people: PEOPLE, get offset() { return offset; }, set offset(v) { offset = v; }, callTrain, train};
</script>
</body>
</html>
