<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TIME LATTICE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,rewrites=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function draw(T=t){x.fillStyle='#030509';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2;for(let L=0;L<7;L++){let gap=26+L*17,off=Math.sin(T*.12+L)*gap*.3;for(let i=-20;i<30;i++){let xx=cx+i*gap+off;for(let j=-18;j<22;j++){let px=xx,py=cy+j*gap+Math.cos(i*.4+L)*gap*1.2,q=Math.sin((px+py)*.025+L)+Math.cos((px-py)*.031-T*.08),hit=rewrites.some(z=>Math.hypot(px-z.x,py-z.y)<z.r);if(hit){let dx=px-z.x,dy=py-z.y;px+=dy*.35;py-=dx*.25}let h=(L*44+i*7+j*5+seed*100+T*6)%360,alpha=.18+.22*(q+1)/2;x.fillStyle=`hsla(${h},80%,${48+18*(q+1)/2}%,${hit?.85:alpha})`;x.fillRect(px-3,py-3,6,6)}}}for(const z of rewrites){x.beginPath();x.arc(z.x,z.y,z.r*(1+.12*Math.sin(T+z.a)),0,7);x.strokeStyle=`hsla(${z.a*70+30},95%,72%,.8)`;x.lineWidth=2;x.stroke()}}function touch(px,py){rewrites.push({x:px,y:py,r:55+Math.random()*80,a:Math.random()*6.28});if(rewrites.length>8)rewrites.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'time-lattice-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;rewrites=[]}},{label:'↻',name:'reset',onClick:()=>rewrites=[]}]});</script></body></html>
