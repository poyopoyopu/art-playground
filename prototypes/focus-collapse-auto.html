<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FOCUS COLLAPSE AUTO</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010207}
body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body><canvas id="c"></canvas><script>
/* CHATGPT — FOCUS COLLAPSE AUTO
WORLD LAW: attention is finite. The world autonomously chooses one place to
look at. That place becomes recursively detailed until it has seen too much,
then collapses and ejects its attention to another place. Touching is not a
brush: it steals the world's attention and forces the next collapse.
*/
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let W=1,H=1,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let seed=17;
function rnd(){let x=Math.sin(seed++*127.31)*43758.5453;return x-Math.floor(x)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

let hueShift=.58, rotation=.0, sensitivity=1;
let foci=[];
let dominant=0;
let cycle=0;
let lastTime=performance.now();
let userFocus=null;

function reset(){
 seed=17; foci=[]; cycle=0; dominant=0; userFocus=null;
 for(let i=0;i<7;i++){
   foci.push({
     x:W*(.08+.84*rnd()),y:H*(.08+.84*rnd()),
     depth:1+Math.floor(rnd()*2),
     energy:.12+rnd()*.12,
     age:rnd()*10,
     hue:rnd()
   });
 }
 foci[0].energy=.92;
}
reset();

function attention(x,y,source){
 const d=Math.hypot(x-source.x,y-source.y);
 return source.energy*Math.exp(-d/(source.radius||120));
}

function drawCell(x,y,size,depth,source,phase){
 if(size<5)return;
 const cx=x+size*.5,cy=y+size*.5;
 const a=attention(cx,cy,source);
 const threshold=(.18+depth*.105)/sensitivity;
 if(depth>0 && a>threshold && size>10){
   const gap=Math.max(1,size*.035),q=(size-gap)/2;
   drawCell(x,y,q,depth-1,source,phase+.13);
   drawCell(x+q+gap,y,q,depth-1,source,phase-.09);
   drawCell(x,y+q+gap,q,depth-1,source,phase-.07);
   drawCell(x+q+gap,y+q+gap,q,depth-1,source,phase+.11);
   return;
 }
 const dist=Math.hypot(cx-source.x,cy-source.y);
 const local=clamp(a*(1+source.depth*.12),0,1);
 const alpha=.055+local*.32+source.depth*.018;
 const hue=hueShift+source.hue+depth*.035+dist/Math.max(W,H)*.12;
 const r=Math.round(255*(.5+.5*Math.cos(TAU*hue)));
 const g=Math.round(255*(.5+.5*Math.cos(TAU*(hue+.33))));
 const b=Math.round(255*(.5+.5*Math.cos(TAU*(hue+.67))));
 ctx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
 ctx.lineWidth=.55+local*1.2;
 ctx.strokeRect(x+.5,y+.5,size-1,size-1);
 if(local>.32){
   ctx.fillStyle=`rgba(${r},${g},${b},${local*.045})`;
   ctx.fillRect(x+1,y+1,size-2,size-2);
 }
}

function render(phase=null){
 const t=phase===null?performance.now()*.0001:phase;
 ctx.fillStyle='#010207';ctx.fillRect(0,0,W,H);
 const source=foci[dominant];
 if(!source)return;
 // The entire field obeys the current focus. No decorative particles: the
 // geometry itself is what changes as attention moves.
 drawCell(0,0,W,7,source,t);
 for(let i=0;i<foci.length;i++){
   const f=foci[i];
   const pulse=1+.045*Math.sin(t*3+f.age);
   const radius=(4+f.depth*3)*pulse;
   ctx.beginPath();ctx.arc(f.x,f.y,radius,0,TAU);
   const alpha=i===dominant?.72:.10+f.energy*.18;
   ctx.strokeStyle=`hsla(${190+f.hue*140},90%,78%,${alpha})`;
   ctx.lineWidth=i===dominant?1.8:.8;
   ctx.stroke();
 }
 // During the handoff, show the old and new centers simultaneously. The
 // recursive field follows only the stronger one, so the change reads as a
 // transfer of attention rather than two independent animations.
 if(userFocus){
   ctx.beginPath();ctx.arc(userFocus.x,userFocus.y,12+Math.sin(t*7)*2,0,TAU);
   ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.stroke();
 }
}

function chooseNext(exclude){
 let best=-1,bestScore=-1;
 for(let i=0;i<foci.length;i++)if(i!==exclude){
   const f=foci[i];
   const score=.25+rnd()*.75+f.energy*.55;
   if(score>bestScore){bestScore=score;best=i}
 }
 return best<0?0:best;
}

// Autonomous law: one focus accumulates attention, becomes too deep, then
// collapses. Its stored attention is not destroyed; it is handed to another
// focus. This is the visible engine that was missing from the earlier version.
function update(dt){
 const current=foci[dominant];
 if(!current)return;
 current.age+=dt;
 const held=userFocus!==null;
 if(held){
   current.x=userFocus.x;current.y=userFocus.y;
   current.energy=Math.min(1,current.energy+dt*.72);
   current.depth=Math.min(7,current.depth+dt*2.4);
 }else{
   current.energy=Math.min(1,current.energy+dt*.105);
   current.depth=Math.min(7,current.depth+dt*.55);
 }
 // Other places lose attention while the chosen place becomes detailed.
 for(let i=0;i<foci.length;i++)if(i!==dominant){
   const f=foci[i];
   f.energy=Math.max(.035,f.energy-dt*(.035+current.energy*.025));
   f.depth=Math.max(0,f.depth-dt*.18);
   f.age+=dt*.4;
 }
 // Collapse threshold: detail becomes unstable. The old focus falls apart
 // rapidly, then its attention is transferred to a fresh location.
 const overload=held?5.7:4.25;
 if(current.depth>=overload){
   current.depth=0;
   current.energy=.08;
   const next=chooseNext(dominant);
   const old=dominant;
   dominant=next;
   const n=foci[next];
   n.x=W*(.08+.84*rnd());n.y=H*(.08+.84*rnd());
   n.depth=1;n.energy=.84;
   n.hue=(current.hue+rnd()*.33)%1;
   cycle++;
   // Give the transfer a visible memory: the previous focus becomes weak,
   // while the new focus arrives already charged enough to start splitting.
   foci[old].energy=.045;
 }
}

function touch(x,y){
 if(window.APKit&&APKit.isUI(x,y))return;
 let nearest=-1,dist=Infinity;
 for(let i=0;i<foci.length;i++){
   const d=Math.hypot(x-foci[i].x,y-foci[i].y);
   if(d<dist){dist=d;nearest=i}
 }
 if(nearest>=0&&dist<180){
   dominant=nearest;
   foci[dominant].x=x;foci[dominant].y=y;
   foci[dominant].energy=Math.min(1,foci[dominant].energy+.5);
   foci[dominant].depth=Math.min(6,foci[dominant].depth+1.5);
 }else{
   const n=foci.length;
   if(n>=8)foci.shift();
   foci.push({x,y,depth:3,energy:.8,age:0,hue:Math.random()});
   dominant=foci.length-1;
 }
 userFocus={x,y};
}
function release(){userFocus=null}
canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY)},{passive:true});
canvas.addEventListener('pointermove',e=>{if(userFocus){userFocus.x=e.clientX;userFocus.y=e.clientY}},{passive:true});
canvas.addEventListener('pointerup',release,{passive:true});
canvas.addEventListener('pointercancel',release,{passive:true});

function liveLoop(){
 const now=performance.now();
 const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;
 if(!APKit.isExporting()){update(dt);render()}
 requestAnimationFrame(liveLoop);
}
requestAnimationFrame(liveLoop);

// Deterministic GIF: a focus travels through a complete autonomous cycle.
function loopFrame(phase){
 const p=phase/TAU;
 const local=Math.sin(p*TAU);
 const f={x:W*(.5+.33*Math.cos(p*TAU)),y:H*(.5+.33*Math.sin(p*TAU*2)),depth:Math.round(1+4*(.5+.5*local)),energy:.55+.35*(.5+.5*local),radius:120,hue:.55};
 ctx.fillStyle='#010207';ctx.fillRect(0,0,W,H);
 drawCell(0,0,W,7,f,phase);
 ctx.beginPath();ctx.arc(f.x,f.y,5+f.depth*2,0,TAU);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.stroke();
}

APKit.init({
 canvas:canvas,
 gifName:'focus-collapse-auto-loop',
 clockFormat:'spec',
 dock:true,
 autoHide:true,
 fullscreenButton:false,
 loopFrame:loopFrame,
 buttons:[
  {label:'✦',name:'mutate',onClick:function(){
    hueShift=Math.random();
    sensitivity=.82+Math.random()*.52;
    rotation=(Math.random()-.5)*.45;
    foci.forEach(f=>{f.hue=(f.hue+Math.random()*.4)%1;f.x=clamp(f.x+(Math.random()-.5)*W*.12,0,W);f.y=clamp(f.y+(Math.random()-.5)*H*.12,0,H)});
  }},
  {label:'↻',name:'reset',onClick:reset}
 ]
});
</script></body></html>
