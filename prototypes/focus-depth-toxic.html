<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH TOXIC</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030903}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: looking down opens an impossible depth. TOUCH PINCHES the attention. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,last=performance.now(),f={x:0,y:0,p:.5},marks=[],seed=Math.random();
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!f.x){f.x=W/2;f.y=H/2}}addEventListener('resize',rs);rs();
function reset(){f={x:W*.5,y:H*.5,p:.35};marks=[]}reset();
function att(x,y){let v=f.p*Math.exp(-Math.hypot(x-f.x,y-f.y)/(Math.min(W,H)*.30));for(let m of marks)v+=m.p*Math.exp(-Math.hypot(x-m.x,y-m.y)/(Math.min(W,H)*.18));return v}
function hue(d,x,y){return (92+d*31+(x/W)*130-(y/H)*70)%360}
function cell(x,y,s,d){let a=att(x+s/2,y+s/2),th=.24+d*.105;if(d<10&&a>th&&s>3){let q=s/2;cell(x,y,q,d+1);cell(x+q,y,q,d+1);cell(x,y+q,q,d+1);cell(x+q,y+q,q,d+1);return}let h=hue(d,x,y);g.fillStyle=`hsla(${h},88%,${42+a*18}%,${.05+a*.18})`;g.fillRect(x,y,s-.7,s-.7);g.strokeStyle=`hsla(${h+70},100%,${62+a*15}%,${.12+a*.3})`;g.lineWidth=.5;g.strokeRect(x+.3,y+.3,s-.7,s-.7)}
function draw(t,dt){f.p=.28+.34*(.5+.5*Math.sin(t*.00031));for(let m of marks)m.p*=Math.pow(.18,dt);marks=marks.filter(m=>m.p>.025);g.fillStyle='#030903';g.fillRect(0,0,W,H);cell(0,0,W,0);g.beginPath();g.arc(f.x,f.y,5+f.p*6,0,TAU);g.strokeStyle='rgba(190,255,90,.6)';g.stroke()}
function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
let down=false;c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;f.x=e.clientX;f.y=e.clientY;f.p=1});c.addEventListener('pointermove',e=>{if(down){f.x=e.clientX;f.y=e.clientY;f.p=Math.min(1,f.p+.018)}});c.addEventListener('pointerup',()=>{down=false;marks.push({x:f.x,y:f.y,p:f.p});if(marks.length>12)marks.shift()});c.addEventListener('pointercancel',()=>down=false);
APKit.init({canvas:c,gifName:'focus-depth-toxic-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{f={x:W*(.5+.3*Math.cos(p)),y:H*(.5+.3*Math.sin(p*3)),p:.3+.6*(.5+.5*Math.sin(p)**2)};g.fillStyle='#030903';g.fillRect(0,0,W,H);cell(0,0,W,0)},buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
