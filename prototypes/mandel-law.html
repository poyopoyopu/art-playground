<!-- MANDEL LAW — ChatGPT作。安定描画版。マンデルブロ集合を「触れた場所で局所的な冪法則が変わる世界」として再構成。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MANDEL LAW</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:auto}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const c=document.getElementById('c');
const ctx=c.getContext('2d',{alpha:false});
const off=document.createElement('canvas');
const octx=off.getContext('2d',{alpha:false});
let W=1,H=1,D=1,OW=360,OH=360;
let zoom=1,panX=-.5,panY=0,hue=.58,phase=0;
let laws=[],pointerId=null,dirty=true;
let field=new Float32Array(OW*OH);

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){
  D=Math.min(devicePixelRatio||1,1.5);
  W=innerWidth;H=innerHeight;
  c.width=Math.max(1,Math.round(W*D));c.height=Math.max(1,Math.round(H*D));
  const aspect=W/Math.max(H,1);
  const base=aspect>=1?400:360;
  OW=clamp(Math.round(base*aspect),280,560);
  OH=base;
  off.width=OW;off.height=OH;
  field=new Float32Array(OW*OH);
  dirty=true;
}
addEventListener('resize',resize,{passive:true});
resize();

function worldAt(x,y){
  const s=Math.min(W,H);
  return [(x-W*.5)/s/zoom+panX,(H*.5-y)/s/zoom+panY];
}

function lawPower(x,y){
  let p=2;
  for(const l of laws){
    const dx=x-l.x,dy=y-l.y,r=Math.max(l.r,.001);
    const w=Math.exp(-(dx*dx+dy*dy)/(r*r));
    p+=l.delta*w;
  }
  return clamp(p,.72,3.25);
}

function rebuild(){
  const aspect=OW/OH;
  const spanY=2.45/zoom;
  const spanX=spanY*aspect;
  const x0=panX-spanX*.5,y0=panY-spanY*.5;
  const maxIt=105;
  for(let py=0;py<OH;py++){
    const y=y0+(py+.5)/OH*spanY;
    for(let px=0;px<OW;px++){
      const x=x0+(px+.5)/OW*spanX;
      const p=lawPower(x,y);
      let zx=0,zy=0,it=maxIt;
      for(let i=0;i<maxIt;i++){
        const r=Math.hypot(zx,zy);
        const a=Math.atan2(zy,zx);
        const rp=Math.pow(Math.max(r,1e-12),p);
        const ap=a*p;
        zx=rp*Math.cos(ap)+x;
        zy=rp*Math.sin(ap)+y;
        if(zx*zx+zy*zy>64){it=i;break}
      }
      field[py*OW+px]=it+(it<maxIt?0.5:0);
    }
  }
  dirty=false;
}

function hsv(h,s,v){
  h=((h%1)+1)%1;
  const i=Math.floor(h*6),f=h*6-i;
  const p=v*(1-s),q=v*(1-s*f),t=v*(1-s*(1-f));
  switch(i%6){
    case 0:return [v,t,p];case 1:return [q,v,p];case 2:return [p,v,t];
    case 3:return [p,q,v];case 4:return [t,p,v];default:return [v,p,q];
  }
}

function draw(phaseValue){
  phase=phaseValue;
  if(dirty)rebuild();
  const img=octx.createImageData(OW,OH);
  const data=img.data;
  const maxIt=105;
  for(let i=0;i<field.length;i++){
    const it=field[i];
    const inside=it>=maxIt;
    let f=inside?0:it/maxIt;
    const bands=.5+.5*Math.cos(it*.22-phase*6.283*3);
    const edge=Math.pow(Math.max(0,1-f),.42);
    const h=hue+.72*f+.10*bands;
    const v=inside?.018:.09+.84*edge;
    const rgb=hsv(h,.84,v);
    const k=i*4;
    data[k]=Math.round(rgb[0]*255);
    data[k+1]=Math.round(rgb[1]*255);
    data[k+2]=Math.round(rgb[2]*255);
    data[k+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#050507';ctx.fillRect(0,0,c.width,c.height);
  ctx.imageSmoothingEnabled=true;
  const scale=Math.max(c.width/OW,c.height/OH);
  const dw=OW*scale,dh=OH*scale;
  ctx.drawImage(off,(c.width-dw)*.5,(c.height-dh)*.5,dw,dh);
}

function animate(now){
  draw((now*.000055)%1);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function addLaw(x,y){
  if(window.APKit&&APKit.isUI(x,y))return;
  const [wx,wy]=worldAt(x,y);
  laws.push({x:wx,y:wy,r:clamp(.055/zoom,.018,.12),delta:(Math.random()-.5)*1.35});
  if(laws.length>8)laws.shift();
  hue=(hue+.07+Math.random()*.12)%1;
  zoom=clamp(zoom*1.018,.72,5.5);
  dirty=true;
}

function reset(){
  laws=[];zoom=1;panX=-.5;panY=0;hue=.58;dirty=true;
}

function mutate(){
  laws=[];
  hue=Math.random();
  zoom=.9+Math.random()*1.7;
  panX=-.72+Math.random()*.42;
  panY=-.08+Math.random()*.16;
  const n=2+Math.floor(Math.random()*5);
  for(let i=0;i<n;i++)laws.push({
    x:-.82+Math.random()*1.15,
    y:-.52+Math.random()*1.04,
    r:.025+Math.random()*.075,
    delta:(Math.random()-.5)*1.25
  });
  dirty=true;
}

c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  pointerId=e.pointerId;c.setPointerCapture(pointerId);addLaw(e.clientX,e.clientY);
});
c.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointerId||!e.buttons)return;
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  addLaw(e.clientX,e.clientY);
});
c.addEventListener('pointerup',e=>{
  if(e.pointerId===pointerId){try{c.releasePointerCapture(pointerId)}catch(_){}pointerId=null}
});
c.addEventListener('pointercancel',()=>{pointerId=null});

APKit.init({
  canvas:c,
  gifName:'mandel-law-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(p){draw(p)},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:reset}
  ]
});
</script>
</body>
</html>
