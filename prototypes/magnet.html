<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>MAGNET</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#090909}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,mx=0,my=0,pow=1;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#090909';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=20)for(let x=0;x<W;x+=20){let dx=mx-x,dy=my-y,r=Math.hypot(dx,dy)+30,a=Math.atan2(dy,dx)+Math.sin(r*.03+p*6)*.7*pow;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*18,y+Math.sin(a)*18);g.strokeStyle=`hsla(${210+r*.03},80%,65%,.28)`;g.stroke()}}c.onpointermove=e=>{if(APKit.isUI(e.clientX,e.clientY))return;mx=e.clientX;my=e.clientY};function mu(){pow=.2+Math.random()*2}APKit.init({canvas:c,gifName:'magnet-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>pow=1}]});draw(0)</script>
