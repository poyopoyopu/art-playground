<!DOCTYPE html>
<!-- NOWHERE — クロちゃん(Claude)作。2026/11/10 試作。トリック作品(別枠。ギャラリー本体には入れない)。
     世界のルール: 「動きつづけるのに、どこにも行かない」。
     輪は広がり続ける(縮み続ける)ように見えるのに、大きさも位置も1ミリも変わらない。
     動いているのは輪の中の明暗の波だけで、輪の場所(波が見える範囲)は固定している(motion without movement)。
     タップ=その場所に印を置く(輪が印から動かないことを確かめられる)+いちばん近い輪が逆向きになる。
     押さえる=止まる(止めた絵と動いている絵で、輪の場所が同じ)。
     技術: WebGL2 / 広色域(display-p3)の描画 / 画面を消さないWake Lock。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NOWHERE — 動きつづけるのに、どこにも行かない</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#808080;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;
  color:#fff;font:600 15px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif;letter-spacing:.06em;
  text-shadow:0 0 8px #000,0 0 8px #000,0 1px 2px #000;pointer-events:none;opacity:0;transition:opacity .6s;padding:0 20px}
#hint.on{opacity:.95}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
(function(){
var cv=document.getElementById('c'), hint=document.getElementById('hint');
function say(s,ms){hint.textContent=s;hint.classList.add('on');
  clearTimeout(say.t);if(ms)say.t=setTimeout(function(){hint.classList.remove('on');},ms);}
var gl=cv.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){say('このブラウザでは表示できないみたい(WebGL2が必要)',0);return;}
if('drawingBufferColorSpace' in gl){try{gl.drawingBufferColorSpace='display-p3';}catch(e){}}

var MAXR=8, MAXP=6;
var VS='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var FS=[
'#version 300 es',
'precision highp float;',
'uniform vec2 R;uniform float LOB,AMP,SIG,K;uniform int N;',
'uniform float PH['+MAXR+'],RAD['+MAXR+'],HUE['+MAXR+'],SPI['+MAXR+'];',
'uniform vec3 PIN['+MAXP+'];',
'out vec4 o;',
'vec3 hsv(float h,float s,float v){vec3 k=abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.;return v*mix(vec3(1.),clamp(k,0.,1.),s);}',
'void main(){',
' float m=min(R.x,R.y);',
' vec2 q=(gl_FragCoord.xy-.5*R)/m;',
' float r=length(q)+1e-5, a=atan(q.y,q.x);',
' vec3 col=vec3(.5);',
' for(int i=0;i<'+MAXR+';i++){',
'  if(i>=N)break;',
'  float d=r-RAD[i]*(1.+AMP*cos(LOB*a+float(i)*.7));',   // 輪(花びら形)からの距離。ここは時間で変わらない
'  float env=exp(-d*d/(2.*SIG*SIG));',                    // 輪の場所(固定)
'  float w=cos(K*d-PH[i]+SPI[i]*a);',                     // 中を流れる波(動くのはこれだけ)
'  col+=env*w*.44*hsv(HUE[i],.5,1.);',
' }',
// 印(置いた場所から動かない目印)
' for(int j=0;j<'+MAXP+';j++){',
'  if(PIN[j].z<.5)continue;',
'  float pd=distance(gl_FragCoord.xy,PIN[j].xy);',
'  float u=m*.012;',
'  col=mix(col,vec3(0.),smoothstep(u*1.25,u*1.05,pd));',
'  col=mix(col,vec3(1.),smoothstep(u*.95,u*.75,pd));',
'  col=mix(col,vec3(0.),smoothstep(u*.42,u*.28,pd));',
' }',
' o=vec4(clamp(col,0.,1.),1.);',
'}'].join('\n');

function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var U={};['R','LOB','AMP','SIG','K','N','PH','RAD','HUE','SPI','PIN'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});

var dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);gl.viewport(0,0,cv.width,cv.height);}
addEventListener('resize',resize);resize();

var SIG=.021, K=1.55/SIG;
var law, rings, pins=[], held=false, last=performance.now()/1000, stage=0;
function build(l){law=l;rings=[];
  for(var i=0;i<l.n;i++)rings.push({rad:.11+i*.088,dir:i%2?-1:1,ph:Math.random()*6.28,hue:(l.hue+i*l.hstep)%1,spi:l.spi*(i%2?-1:1)});}
function defaults(){return {n:7,lob:0,amp:0,spi:0,speed:5.2,hue:.58,hstep:.09};}
function mutate(){var lob=[0,3,4,5,6,8][Math.floor(Math.random()*6)];
  build({n:5+Math.floor(Math.random()*4),lob:lob,amp:lob?(.04+Math.random()*.08):0,
    spi:[0,0,2,3,4][Math.floor(Math.random()*5)],speed:4+Math.random()*3,hue:Math.random(),hstep:.04+Math.random()*.1});}
build(defaults());

function frame(){
  var now=performance.now()/1000, dt=Math.min(now-last,.1);last=now;
  if(!held)rings.forEach(function(g){g.ph+=g.dir*law.speed*dt;});
  var PH=new Float32Array(MAXR),RAD=new Float32Array(MAXR),HUE=new Float32Array(MAXR),SPI=new Float32Array(MAXR);
  rings.forEach(function(g,i){PH[i]=g.ph%6.2831853;RAD[i]=g.rad;HUE[i]=g.hue;SPI[i]=g.spi;});
  var PIN=new Float32Array(MAXP*3);
  pins.forEach(function(p,i){PIN[i*3]=p.x*innerWidth*dpr;PIN[i*3+1]=cv.height-p.y*innerHeight*dpr;PIN[i*3+2]=1;});
  gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.LOB,law.lob);gl.uniform1f(U.AMP,law.amp);
  gl.uniform1f(U.SIG,SIG);gl.uniform1f(U.K,K);gl.uniform1i(U.N,rings.length);
  gl.uniform1fv(U.PH,PH);gl.uniform1fv(U.RAD,RAD);gl.uniform1fv(U.HUE,HUE);gl.uniform1fv(U.SPI,SPI);
  gl.uniform3fv(U.PIN,PIN);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}

var wl=null;
function wake(){if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;
  l.addEventListener('release',function(){wl=null;});}).catch(function(){});}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});

var down=null;
cv.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  wake();held=true;down={x:e.clientX,y:e.clientY,t:performance.now()};
});
function up(){
  if(!down)return;held=false;
  if(performance.now()-down.t<300){
    // 短いタップ: 印を置く(画面の割合で持つ)+ いちばん近い輪を逆向きに
    pins.push({x:down.x/innerWidth,y:down.y/innerHeight});if(pins.length>MAXP)pins.shift();
    var m=Math.min(innerWidth,innerHeight), r=Math.hypot(down.x-innerWidth/2,down.y-innerHeight/2)/m, best=0,bd=9;
    rings.forEach(function(g,i){var d=Math.abs(g.rad-r);if(d<bd){bd=d;best=i;}});
    rings[best].dir=-rings[best].dir;
    say(stage<1?'印を置いた。輪は印から1ミリも動かない':'触った輪が逆向きになった',4500);stage=1;
  }else say('止めていた。止まった絵と、輪の場所は同じ',4000);
  down=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

wake();say('輪は広がり続けるのに、大きくならない',5000);
setTimeout(function(){if(stage<1)say('タップで印を置いて確かめて。押さえると止まる',7000);},9000);
requestAnimationFrame(frame);

APKit.init({
  canvas:cv, gifName:'nowhere-loop', clockFormat:'spec',
  dock:true, autoHide:true, fullscreenButton:false,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){mutate();say('形と流れを変えた。今度も、どこにも行かない',4000);}},
    {label:'↻',name:'reset',onClick:function(){pins=[];stage=0;build(defaults());say('輪は広がり続けるのに、大きくならない',5000);}}
  ]
});
})();
</script>
</body>
</html>
