<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PIXEL FOREST</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,scars=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function hash(a){return Math.abs(Math.sin(a*91.7+seed*17.1))}function draw(T=t){x.fillStyle='#020704';x.fillRect(0,0,W,H);let cell=9;for(let i=0;i<Math.ceil(W/cell);i++)for(let j=0;j<Math.ceil(H/cell);j++){let nx=i/(W/cell)*10,ny=j/(H/cell)*10,z=Math.sin(nx*2.7+Math.sin(ny+T*.1))+Math.cos(ny*3.2-nx*.8)+Math.sin((nx+ny)*6.1),branch=z>1;for(const s of scars)if(Math.hypot(i*cell-s.x,j*cell-s.y)<s.r)branch=false;if(branch){let h=(100+z*55+i*2+T*3+seed*90)%360,q=.35+.55*Math.max(0,z/3);x.fillStyle=`hsla(${h},70%,${35+q*35}%,${q})`;x.fillRect(i*cell,j*cell,cell-1,cell-1);if(hash(i*31+j*17)>.84)x.fillRect(i*cell+2,j*cell-3,cell-4,cell+5)}}}function touch(px,py){scars.push({x:px,y:py,r:35+Math.random()*55});if(scars.length>10)scars.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'pixel-forest-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;scars=[]}},{label:'↻',name:'reset',onClick:()=>scars=[]}]});</script></body></html>
