<!doctype html>
<!-- MICRO WEAVE — ChatGPT作。極小の自己相似セルが触れた場所から別の秩序へ編み替わる試作。ap-kit.js統合 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MICRO WEAVE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W,H,D,seed=Math.random()*9999,marks=[],down=false,last=null;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=((h%360)+360)%360/60;let i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s),a,b,d;switch(i%6){case 0:a=v;b=u;d=p;break;case 1:a=q;b=v;d=p;break;case 2:a=p;b=v;d=u;break;case 3:a=p;b=q;d=v;break;case 4:a=u;b=p;d=v;break;default:a=v;b=p;d=q}return`rgb(${a*255|0},${b*255|0},${d*255|0})`}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function sample(x,y,t){let X=x/W*2-1,Y=1-y/H*2,co=0,rot=0,sc=0;for(let k=0;k<marks.length;k++){let m=marks[k],dx=X-m.x,dy=Y-m.y,d2=dx*dx+dy*dy,a=Math.exp(-d2/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.18);if(a<.001)continue;let ang=Math.atan2(dy,dx)+m.rot*a;X-=Math.cos(ang)*a*.24;Y-=Math.sin(ang)*a*.24;co+=a*m.co;rot+=a*m.rot;sc+=a*m.sc}return[X,Y,co,rot,sc]}
function cell(x,y,s,shape,r){g.save();g.translate(x,y);g.rotate(r);g.beginPath();if(shape===0){g.rect(-s/2,-s/2,s,s)}else if(shape===1){g.moveTo(0,-s*.58);g.lineTo(s*.52,s*.42);g.lineTo(-s*.52,s*.42);g.closePath()}else{g.moveTo(0,-s*.62);g.lineTo(s*.46,-s*.16);g.lineTo(s*.28,s*.56);g.lineTo(-s*.28,s*.56);g.lineTo(-s*.46,-s*.16);g.closePath()}g.fill();g.restore()}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let step=Math.max(4.5,Math.min(7.2,Math.min(W,H)/105));let cols=Math.ceil(W/step)+2,rows=Math.ceil(H/step)+2;for(let y=-1;y<rows;y++)for(let x=-1;x<cols;x++){let px=(x+.5)*step,py=(y+.5)*step,z=sample(px,py,t),q=Math.sin(x*.31+y*.19+seed*.01+z[2]*3)+Math.sin(x*.071-y*.113+seed*.003+z[3]);let shape=Math.abs(Math.floor(q*1.7))%3;let size=step*(.72+.18*Math.sin(x*.13-y*.17+z[4]*4));let hue=seed*.04+x*.9-y*.43+z[2]*170+Math.sin(x*.027+y*.041)*70;g.fillStyle=hsv(hue,1,.94);cell(px+z[0]*step*2.4,py-z[1]*step*2.4,size,shape,z[3]*.35)}}
function touch(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.23:.13,rot:(Math.random()-.5)*4.5,co:tap?1.8:1.1,sc:tap?1.4:1,t:performance.now()});if(marks.length>32)marks.shift();draw(performance.now());return false}
function downFn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=pt(e);down=true;last=p;c.setPointerCapture?.(e.pointerId);touch(p.x,p.y,0,0,true)}function moveFn(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=pt(e);if(Math.hypot(p.x-last.x,p.y-last.y)<7)return;touch(p.x,p.y,p.x-last.x,p.y-last.y,false);last=p}function up(){down=false}c.addEventListener('pointerdown',downFn,{passive:false});c.addEventListener('pointermove',moveFn,{passive:false});c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);let start=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-weave-loop',clockFormat:'spec',loopFrame:p=>draw(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9999;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
