<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>RIFT</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,gap=60;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#050505';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=gap){g.beginPath();for(let x=0;x<W;x+=8){let yy=y+Math.sin(x*.03+p*6)*20;g.lineTo(x,yy)}g.strokeStyle=`hsla(${x=180},80%,70%,.5)`;g.stroke()} }function mu(){gap=25+Math.random()*100|0}APKit.init({canvas:c,gifName:'rift-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>gap=60}]});draw(0)</script>
