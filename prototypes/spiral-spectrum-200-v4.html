<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM 200 V4 — LIVING OCEAN</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,px=.5,py=.49,tx=.5,ty=.49,force=0,ft=0,hue=0,ht=0,seed=Math.random()*9999,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function spiralPoint(q,u,t,S){const cx=W*(.5+.016*Math.sin(t*.055)),cy=H*(.49+.016*Math.cos(t*.065)),minR=S*.043,maxR=S*.46,layer=(q-.5)*S*.145,r=minR+(maxR-minR)*u+layer,turns=2.78,base=-.72+u*turns*TAU+q*.018*TAU;const tide=.052*Math.sin(TAU*t/8+u*7-q*5),wave=.026*Math.sin(TAU*t/5.5-q*9+u*4);const dx=tx-.5,dy=ty-.5,dist=Math.hypot(dx,dy),touch=Math.exp(-Math.pow((u-.52)/.34,2))*force;const touchAngle=(dx*Math.cos(base)+dy*Math.sin(base))*5.8*touch;const ang=base+tide+wave+touchAngle;const rr=r*(1+.038*Math.sin(TAU*t/10+q*7+u*5)+.024*Math.sin(TAU*t/4.7+u*12))+S*(.095*touch*(1-u)+.026*Math.sin(TAU*t/6.5+q*13)*u);return[cx+Math.cos(ang)*rr+dx*S*.065*touch,cy+Math.sin(ang)*rr+dy*S*.065*touch]}
function draw(phase=null){const real=performance.now()/1000,t=phase===null?real:phase,T=k=>APKit.T(k,phase,real),S=Math.min(W,H),beat=.5+.5*Math.sin(T(1)*TAU),wave=.5+.5*Math.sin(T(.43)*TAU),drift=.5+.5*Math.sin(T(.19)*TAU);ctx.globalCompositeOperation='source-over';const bx=W*(.47+.055*Math.sin(T(.075)*TAU)),by=H*(.45+.045*Math.cos(T(.06)*TAU));const bg=ctx.createRadialGradient(bx,by,0,bx,by,S*(.78+.12*beat));bg.addColorStop(0,hs(44+hue*.06,34,99));bg.addColorStop(.30,hs(350+wave*35+hue*.04,25,98));bg.addColorStop(.58,hs(205+wave*48,23,96));bg.addColorStop(1,hs(28+hue*.03,27,91));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// 巨大な水面の波紋。螺旋とは別の周期で、背景そのものがゆっくり呼吸する。
ctx.save();ctx.translate(W*.5+Math.sin(T(.09)*TAU)*S*.025,H*.5+Math.cos(T(.065)*TAU)*S*.022);ctx.rotate(T(.025)*TAU);for(let k=0;k<17;k++){const q=k/16,rx=S*(.16+q*.085+.025*beat),ry=S*(.10+q*.115+.018*wave),shear=Math.sin(T(.12)*TAU+k*.83)*S*.012;ctx.beginPath();ctx.ellipse(shear,0,rx,ry,Math.sin(k*1.41+T(.055)*TAU)*.18,0,TAU);ctx.strokeStyle=hs(300+q*285+hue*.25+wave*28,42,73,.018+.040*(1-q)*(.45+.55*beat));ctx.lineWidth=.42+.32*(1-q);ctx.stroke()}ctx.restore();
// ゆっくり移動する色の海霧。重ならないよう非常に薄くする。
for(let k=0;k<8;k++){const a=TAU*(k/8+T(.052)),x=W*(.5+.43*Math.cos(a)),y=H*(.5+.34*Math.sin(a)),r=S*(.16+.055*Math.sin(T(.10)*TAU+k*1.7));const fog=ctx.createRadialGradient(x,y,0,x,y,r);fog.addColorStop(0,hs(275+k*39+hue*.18,48,79,.040+.045*beat));fog.addColorStop(.38,hs(170+k*31,40,85,.020));fog.addColorStop(1,hs(50,30,96,0));ctx.fillStyle=fog;ctx.fillRect(x-r*1.6,y-r*1.6,r*3.2,r*3.2)}
// 水面の微細な流線。
ctx.globalCompositeOperation='multiply';for(let k=0;k<28;k++){const y=H*(k/28),phaseK=T(.08)+k*.19;ctx.beginPath();ctx.moveTo(-30,y+Math.sin(phaseK*TAU)*S*.006);ctx.bezierCurveTo(W*.25,y+Math.sin(phaseK*TAU+1.2)*S*(.009+.008*beat),W*.68,y+Math.sin(phaseK*TAU+2.4)*S*(.009+.006*wave),W+30,y+Math.sin(phaseK*TAU+3.4)*S*.006);ctx.strokeStyle=hs(35+k*10+drift*48,22,66,.010+.012*beat);ctx.lineWidth=.45;ctx.stroke()}ctx.globalCompositeOperation='source-over';
// 主役の58本のスペクトル螺旋はV3の構造を維持。
const N=58;for(let i=0;i<N;i++){const q=i/(N-1),g=ctx.createLinearGradient(W*.08,H*.12,W*.92,H*.88),base=298+q*214+hue+wave*18;g.addColorStop(0,hs(base-42,54,68,.14));g.addColorStop(.18,hs(base,70,60,.76));g.addColorStop(.42,hs(base+78,57,72,.86));g.addColorStop(.67,hs(base+145,62,65,.82));g.addColorStop(.84,hs(base+190,58,61,.62));g.addColorStop(1,hs(base+225,52,62,.16));ctx.strokeStyle=g;ctx.lineWidth=.48+.64*(1-Math.abs(q-.5)*1.55);ctx.beginPath();for(let j=0;j<=360;j++){const u=-.015+j/360*1.03,p=spiralPoint(q,u,T(1),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
// タッチは波紋として世界に残り、螺旋を局所的に引き込む。
if(force>.008){const X=tx*W,Y=ty*H;for(let k=0;k<5;k++){const rr=S*(.035+k*.055+force*S*0);ctx.beginPath();ctx.ellipse(X,Y,rr*(1+wave*.16),rr*(.72+beat*.15),T(.03)*TAU+k*.4,0,TAU);ctx.strokeStyle=hs(185+k*38+hue,46,72,.035*force*(1-k*.14));ctx.lineWidth=.6;ctx.stroke()}}
ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,r=S*(.105+.065*beat),gl=ctx.createRadialGradient(X,Y,0,X,Y,r*5);gl.addColorStop(0,'rgba(255,252,225,.62)');gl.addColorStop(.18,'rgba(255,226,180,.19)');gl.addColorStop(.52,'rgba(210,220,255,.055)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();
function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;ht=(ht+(x/W-.5)*34+(y/H-.5)*22)%360;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));
function mutate(){seed=Math.random()*9999;ht=(ht+55+Math.random()*100)%360}function reset(){px=tx=.5;py=ty=.49;force=ft=0;hue=ht=0;seed=Math.random()*9999}
APKit.init({canvas,gifName:'spiral-spectrum-200-v4-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
