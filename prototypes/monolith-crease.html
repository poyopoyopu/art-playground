<!doctype html>
<!-- MONOLITH CREASE — ChatGPT作。巨大な構造体がタッチで分裂・再帰変形する試作。ap-kit.js統合 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MONOLITH CREASE — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*99999,marks=[],down=false,lastX=0,lastY=0,lastT=0;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);scene(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=u;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=u;break;case 3:r=p;g=q;b=v;break;case 4:r=u;g=p;b=v;break;default:r=v;g=p;b=q}return`rgb(${r*255|0},${g*255|0},${b*255|0})`}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}
function field(x,y,now){let X=x,Y=y,C=0,S=0;for(const m of marks){let dx=X-m.x,dy=Y-m.y,d=Math.hypot(dx,dy),a=Math.exp(-d*d/(m.r*m.r)),age=Math.max(0,(now-m.t)/1000),q=Math.exp(-age*.22)*a;if(q<.001)continue;let k=Math.atan2(dy,dx)+m.spin*q;X-=Math.cos(k)*q*m.push;Y-=Math.sin(k)*q*m.push;C+=q*m.chroma;S+=q*m.scale}return[X,Y,C,S]}
function poly(cx,cy,r,n,rot){g.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n,rr=r*(i&1?.56:1);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fill()}
function scene(now){g.fillStyle='#000';g.fillRect(0,0,W,H);const base=Math.min(W,H)*.30;const cx=W*.5,cy=H*.5;function branch(x,y,r,rot,lev,energy){if(lev<0||r<2)return;const f=field(x/W*2-1,1-y/H*2,now);const ang=rot+f[2]*.9+Math.sin(seed*.01+lev*2.7)*.18;const rr=r*(1+f[3]*.34);const n=lev>3?6:5;g.fillStyle=hsv(seed*.03+lev*47+f[2]*125+Math.sin(x*.009+y*.007)*34,1,.96);poly(x,y,rr,n,ang);if(lev===0)return;const count=lev>=4?3:2;for(let i=0;i<count;i++){const a=ang+(i-(count-1)/2)*(lev>=4?.82:1.05);const dist=rr*.78;const nx=x+Math.cos(a)*dist,ny=y+Math.sin(a)*dist;branch(nx,ny,rr*.46,a+(i?-.22:.22),lev-1,energy*.8)}}
 branch(cx,cy,base,seed*.001,5,1);
 // second displaced macro-lobe: breaks the single centered emblem
 const f=field(.31,-.17,now);branch(W*.30+f[0]*W*.18,H*.63-f[1]*H*.12,Math.min(W,H)*.12,seed*.004+1.4,3,.7);
}
function addTouch(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.42:.25,push:tap?1.15:.75,spin:tap?1.9:2.8,chroma:tap?2.2:1.4,scale:tap?1.4:1.0,t:performance.now()});if(marks.length>18)marks.shift();scene(performance.now());return false}
function downFn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e);lastX=p.x;lastY=p.y;lastT=performance.now();down=true;c.setPointerCapture?.(e.pointerId);addTouch(p.x,p.y,0,0,true)}
function moveFn(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e),now=performance.now();if(now-lastT<55)return;addTouch(p.x,p.y,p.x-lastX,p.y-lastY,false);lastX=p.x;lastY=p.y;lastT=now}
function upFn(){down=false}
c.addEventListener('pointerdown',downFn,{passive:false});c.addEventListener('pointermove',moveFn,{passive:false});c.addEventListener('pointerup',upFn);c.addEventListener('pointercancel',upFn);let start=performance.now();function loop(now){if(!APKit.isExporting())scene(now);requestAnimationFrame(loop)}
APKit.init({canvas:c,gifName:'monolith-crease-loop',clockFormat:'spec',loopFrame:p=>scene(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;marks=[];scene(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];scene(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
