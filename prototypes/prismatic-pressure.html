<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRISMATIC PRESSURE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030304}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=Math.random()*8,px=.5,py=.5,power=0;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function draw(p){let t=p*Math.PI*2+seed;g.fillStyle='#020204';g.fillRect(0,0,W,H);let cols=105,rows=105,cw=W/cols,ch=H/rows;for(let j=0;j<rows;j++){for(let i=0;i<cols;i++){let u=(i+.5)/cols,v=(j+.5)/rows;let dx=u-px,dy=v-py,r=Math.hypot(dx,dy)+.0001;let a=Math.atan2(dy,dx);let pressure=power*Math.exp(-r*5.2)*Math.sin(a*5-r*34+t*2);let bend=Math.sin(u*9+Math.sin(v*7+t)*2+t*.7)+.55*Math.sin(v*15-u*4-t*.4);let xx=(u+pressure*dx*.8)*W,yy=(v+pressure*dy*.8)*H;let z=.5+.5*Math.sin((u+v)*18+pressure*8+t);let size=.45+2.2*z*z;let hue=190+145*z+40*Math.sin(r*18-t);g.fillStyle=`hsla(${hue},100%,${48+38*z}%,${.18+.72*z})`;g.fillRect(xx-size,yy-size,size*2,size*2)}}
// coherent pressure ribs
for(let k=0;k<18;k++){let yy=H*(k+0.5)/18;g.beginPath();for(let i=0;i<=W;i+=5){let u=i/W;let q=Math.sin(u*8+k*.67+t)+.4*Math.sin(u*19-k*.3-t*1.7);let bend=power*70*Math.exp(-Math.hypot(i-px*W,yy-py*H)/260)*Math.sin((i/W)*12+t*1.2);let y=yy+q*9+bend;if(i===0)g.moveTo(i,y);else g.lineTo(i,y)}g.strokeStyle=`hsla(${205+k*9},100%,70%,.22)`;g.lineWidth=.7;g.stroke()}}
function loopFrame(p){draw(p)}function tick(){draw((performance.now()/11000)%1);requestAnimationFrame(tick)}tick();
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(window.APKit&&APKit.isUI(x,y))return true;px=x/W;py=y/H;power=1;setTimeout(()=>power=.38,1000);return true});
APKit.init({canvas:c,gifName:'prismatic-pressure-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame,buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*90},{label:'↻',name:'reset',onClick:()=>{seed=3;power=0;px=.5;py=.5}}]});</script></body></html>
