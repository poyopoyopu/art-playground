<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>GROWTH</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020604}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,branches=7;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#020604';g.fillRect(0,0,W,H);function b(x,y,a,len,dep){if(dep<=0)return;let nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;g.strokeStyle=`hsla(${110+dep*7},65%,65%,.5)`;g.beginPath();g.moveTo(x,y);g.lineTo(nx,ny);g.stroke();b(nx,ny,a+.45+Math.sin(p*6)*.05,len*.72,dep-1);b(nx,ny,a-.55,len*.69,dep-1)}for(let i=0;i<branches;i++)b(W/2,H,i*6.28/branches+p*.2,Math.min(W,H)*.13,7)}function mu(){branches=3+Math.floor(Math.random()*10)}APKit.init({canvas:c,gifName:'growth-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>branches=7}]});draw(0)</script>
