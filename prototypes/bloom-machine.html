<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BLOOM MACHINE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060908}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let d,W,H,seeds=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function render(p=0){g.fillStyle='#060908';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let s of seeds){for(let q=0;q<6;q++){g.beginPath();for(let i=0;i<90;i++){let u=i/89,a=u*Math.PI*2+q*.9+p*.4,r=S*.02+u*S*(.04+s.age*.018);let wob=Math.sin(u*14+q*2+p*2)*S*.012*(1+s.age*.2);g.lineTo(s.x+Math.cos(a)*r+Math.cos(a+1.57)*wob,s.y+Math.sin(a)*r+Math.sin(a+1.57)*wob)}g.strokeStyle=`hsla(${80+q*32+s.age*8},75%,${55+q*3}%,${.15+s.age*.018})`;g.lineWidth=1.2+q*.5;g.stroke()}}}function add(x,y){if(APKit.isUI(x,y))return;seeds.unshift({x,y,age:0});seeds=seeds.slice(0,8)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));APKit.init({canvas:c,gifName:'BLOOM-MACHINE-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>seeds.forEach(s=>s.age=Math.random()*5)},{label:'↻',name:'reset',onClick:()=>seeds=[]}]});function loop(){seeds.forEach(s=>s.age=Math.min(8,s.age+.006));render(performance.now()*.00012);requestAnimationFrame(loop)}loop();</script></body></html>
