const dayU=t=>((t/DAY)%1+1)%1;
function dayLight(u){if(u<.08)return ss(u/.08);if(u<.48)return 1;if(u<.58)return 1-ss((u-.48)/.1);if(u<.97)return 0;return ss((u-.97)/.11);}
const SKY=[[0,'#6E7CC0','#F6C8A8'],[.08,'#8FD0F5','#DDF2FB'],[.47,'#8FD0F5','#DDF2FB'],[.53,'#7A84C8','#F8B48A'],[.6,'#1E2852','#3C4880'],[.96,'#161E44','#34406E'],[1,'#6E7CC0','#F6C8A8']];

function takeSpecies(){const used=new Set(rooms.filter(Boolean).map(r=>r.nsp!=null?r.nsp:r.sp));

function layout(){
  const land=W>H;
  const sideM=land?10:8,topM=land?16:12,groundH=land?16:20,roofH=12;
  cols=Math.max(1,Math.floor((W-sideM*2-2)/CW));
  rowsN=Math.max(1,Math.floor((H-topM-groundH-roofH-3)/CH));
  const bw=cols*CW+2,bh=rowsN*CH+3;
  bx=Math.floor((W-bw)/2);by=H-groundH-bh;gH=groundH;
  const old=rooms;rooms=[];
  for(let r=0;r<rowsN;r++)for(let c=0;c<cols;c++){const o=old.find(q=>q.c===c&&q.r===r);if(o){rooms.push(o);}else rooms.push(null);}
  for(let i=0;i<rooms.length;i++)if(!rooms[i]){const c=i%cols,r=Math.floor(i/cols);rooms[i]=makeRoom(c,r);}
  for(const rm of rooms){rm.ix=bx+2+rm.c*CW;rm.iy=by+3+rm.r*CH;}
  stars=[];const sr=srand(7);for(let i=0;i<Math.round(W*H/180);i++)stars.push({x:Math.floor(sr()*W),y:Math.floor(sr()*by*1.1),p:sr()*TAU});
  if(!clouds.length)for(let i=0;i<5;i++)clouds.push({x:rnd(-20,W),y:rnd(4,Math.max(8,by*.6)),w:Math.floor(rnd(10,20)),v:rnd(1.2,2.4)});}

function planTo(rm,i){const res=rm.res,sp=TH[rm.sp].spots[i];res.q=[];

function stepRes(rm,dt){const res=rm.res,th=TH[rm.sp];res.t+=dt;

    if(s.k==='wait'){s.d-=dt;if(s.d<=0)res.q.shift();res.mode='idle';return;}}
  if(res.mode==='act'){const sp=th.spots[res.spot];res.actT-=dt;
    if(res.act==='slide'){res.slideU=Math.min(1,(res.slideU||0)+dt/1.1);const u=Math.pow(res.slideU,1.6);res.x=lerp(sp.x,sp.x2,u);res.y=Math.min(FT,sp.y+(sp.x-res.x)*.9);if(res.slideU>=1){res.y=FT;res.act='look';res.actT=1.2;res.spot=-1;}return;}
    if(res.act==='sleep'){if(awakeNow(rm)){res.asleep=false;chooseNext(rm);}return;}
    if(!awakeNow(rm)&&res.act!=='sleep'){chooseNext(rm);return;}
    if(res.actT<=0)chooseNext(rm);return;}
  if(res.mode==='idle'||res.mode==='go'||res.mode==='walk'||res.mode==='hop'){if(rm.ph==='live')chooseNext(rm);}}

/* ---------- お引っ越し ---------- */
function startMove(rm){if(rm.ph!=='live')return false;const res=rm.res;
  rm.ph='out';rm.pt=0;res.q=[];res.asleep=false;res.act=null;res.carry=true;
  if(res.y!==FT)res.q.push({k:'hop',y:FT,x:res.x});res.q.push({k:'walk',x:4});res.q.push({k:'door'});res.mode='go';
  burst(rm,res.x,res.y-9,'!',1);callTruck();return true;}
function stepRoom(rm,dt){rm.pt+=dt;const res=rm.res;
  if(rm.ph==='live'||rm.ph==='in2')stepRes(rm,dt);
  /* 家具の動き */
  const act=res&&res.mode==='act'?res.act:null;
  if(act==='run')rm.wa+=dt*7;else if(act==='knit'){rm.wa+=dt*2.2;rm.scarf=Math.min(7,rm.scarf+dt*.35);};
  if(act==='sleep'&&rm.sp===11&&rm.scarf>=6){rm.scarf=0;rm.made=Math.min(4,rm.made+1);}
  const swingOn=act==='swing'||(act==='sleep'&&rm.sp===17);rm.swing=swingOn?Math.round(Math.sin(res.t*2.4)*(rm.sp===17?1:2)):0;
  rm.rock=act==='read'?res.t*2.2:0;
  /* 灯り:起きていて暗くなったらつける、寝床に入ったら少しして消す */
  const dl=dayLight(dayU(T));let want=0;
  if(rm.ph==='live'&&res){if(res.asleep){want=(res.t-res.sit<1.4)?rm.light:0;}else want=dl<.6?1:0;}
  else if(rm.ph==='in'||rm.ph==='in2'||rm.ph==='paint'||rm.ph==='pack')want=dl<.6?1:0;
  else want=rm.light;
  rm.light+=(want-rm.light)*Math.min(1,dt*8);
  if(rm.ph==='out'){stepRes(rm,dt);
    if(res.x<=4.6&&res.mode!=='gone')rm.door=Math.min(1,rm.door+dt*5);
    if(res.mode==='fade'&&res.alpha<=0){res.mode='gone';rm.ph='pack';rm.pt=0;}}
  else if(rm.ph==='pack'){rm.door=Math.max(0,rm.door-dt*4);const n=rm.items.length,k=Math.floor(rm.pt/.28);
    for(let i=0;i<n;i++){if(i<k&&rm.items[i]==='on'){rm.items[i]='box';const it=TH[rm.sp].items[i];puffAt(rm,it.x+it.w/2,FL-4,5);}}
    const k2=Math.floor((rm.pt-n*.28-.5)/.2);
    for(let i=0;i<n;i++){if(i<k2&&rm.items[i]==='box'){rm.items[i]='off';const it=TH[rm.sp].items[i];puffAt(rm,it.x+it.w/2,FL-3,4);}}
    if(k2>=n){rm.ph='paint';rm.pt=0;rm.oldSp=rm.sp;rm.nsp=takeSpecies();setSpecies(rm,rm.nsp);rm.items=rm.items.map(()=>'off');rm.wipe=0;rm.nsp=null;}}
  else if(rm.ph==='paint'){rm.wipe=Math.min(1,rm.pt/1.3);if(rm.wipe>=1){rm.ph='in';rm.pt=0;rm.oldSp=null;rm.res=newRes(rm.sp);rm.res.x=4;rm.res.alpha=0;rm.res.mode='idle';}}
  else if(rm.ph==='in'){const r=rm.res;rm.door=rm.pt<1.2?Math.min(1,rm.door+dt*5):Math.max(0,rm.door-dt*4);
    if(rm.pt>.25)r.alpha=Math.min(1,r.alpha+dt*4);
    if(rm.pt>.5&&!r.walkedIn){r.walkedIn=1;r.q=[{k:'walk',x:14}];r.mode='go';}
    if(r.q.length)stepRes(rm,dt);
    const n=rm.items.length,k=Math.floor((rm.pt-.9)/.18);
    for(let i=0;i<n;i++)if(i<k&&rm.items[i]==='off'){rm.items[i]='box';const it=TH[rm.sp].items[i];puffAt(rm,it.x+it.w/2,FL-3,3);}
    const k2=Math.floor((rm.pt-.9-n*.18-.6)/.36);
    for(let i=0;i<n;i++)if(i<k2&&rm.items[i]==='box'){rm.items[i]='on';const it=TH[rm.sp].items[i];puffAt(rm,it.x+it.w/2,FL-Math.min(10,it.h)/2-2,6);sparkAt(rm,it.x+it.w/2,FL-it.h);}
    if(k2>=n&&!r.q.length){rm.ph='live';rm.pt=0;r.q=[];r.mode='idle';burst(rm,r.x,r.y-10,'♥',3);}}}

/* ---------- 粒(寝息のz・ハート・音符・湯気・泡・くず・煙) ---------- */
function addP(rm,p){p.x0=rm.ix;p.y0=rm.iy;p.fy=rm.iy+FL-1;parts.push(p);}
function puffAt(rm,x,y,n){for(let i=0;i<n;i++)addP(rm,{k:'puff',x:rm.ix+x+rnd(-3,3),y:rm.iy+y+rnd(-2,2),vx:rnd(-6,6),vy:rnd(-7,-2),t:0,life:rnd(.35,.6),c:'#FFFFFF'});}
function sparkAt(rm,x,y){for(let i=0;i<4;i++)addP(rm,{k:'dot',x:rm.ix+x+rnd(-4,4),y:rm.iy+y+rnd(-1,2),vx:rnd(-4,4),vy:rnd(-8,-3),t:0,life:.6,c:'#FFE890'});}
function burst(rm,x,y,ch,n){for(let i=0;i<n;i++)addP(rm,{k:'glyph',g:ch,x:rm.ix+x+rnd(-2,2)+i*3-(n-1)*1.5,y:rm.iy+y,vx:0,vy:-5,t:-i*.12,life:1.3,c:ch==='!'?'#FFFFFF':'#FF6A8A'});}
const GL={'z':["###","..#",".#.","###"],'♥':["#.#","###",".#."],'♪':[".##",".#.",".#.","##."],'!':["#","#","#",".","#"],'✦':[".#.","###",".#."]};
function emitFx(rm,dt){const res=rm.res;if(!res||res.mode!=='act'||rm.ph!=='live')return;const sp=TH[rm.sp].spots[res.spot];if(!sp)return;
  const hx=rm.ix+res.x+res.dir*4,hy=rm.iy+res.y-6;
  const fx=res.act==='sleep'?'z':sp.fx||(res.act==='look'?'note?':null);
  if(fx==='z'&&Math.random()<dt*.8)addP(rm,{k:'glyph',g:'z',x:rm.ix+res.x+rnd(-1,2),y:rm.iy+res.y-9,vx:(res.x>IW-14?-1:1)*rnd(1,2),vy:-3.5,t:0,life:2.4,c:'#6A7AA8'});
  if(fx==='crumb'&&Math.random()<dt*3)addP(rm,{k:'dot',x:hx+res.dir,y:hy+4,vx:rnd(-4,4),vy:rnd(-6,-2),g:1,t:0,life:.6,c:'#C8A060'});
  if(fx==='heart'&&Math.random()<dt*.7)addP(rm,{k:'glyph',g:'♥',x:hx,y:hy-2,vx:rnd(-1,1),vy:-4,t:0,life:1.4,c:'#FF6A8A'});
  if((fx==='note'||fx==='note?')&&Math.random()<dt*(fx==='note'?1.6:.18))addP(rm,{k:'glyph',g:'♪',x:hx,y:hy-3,vx:rnd(-2,2),vy:-4,t:0,life:1.5,c:fx==='note'?'#8A5A34':'#6A7AA8'});
  if(fx==='steam'&&Math.random()<dt*2.5)addP(rm,{k:'puff',x:rm.ix+rnd(26,46),y:rm.iy+25,vx:rnd(-1,1),vy:rnd(-4,-2),t:0,life:rnd(1.2,2),c:'#FFFFFF'});
  if(fx==='bubble'&&Math.random()<dt*2)addP(rm,{k:'ring',x:rm.ix+res.x+rnd(-5,5),y:rm.iy+26,vx:0,vy:-3,t:0,life:.8,c:'#E8F8FF'});
  if(fx==='sparkle'&&Math.random()<dt*1.2)addP(rm,{k:'glyph',g:'✦',x:rm.ix+res.x+rnd(-5,5),y:rm.iy+res.y-9+rnd(-2,2),vx:0,vy:-1.5,t:0,life:.9,c:'#FFE890'});
  if(fx==='spray'&&Math.random()<dt*9){const a=rnd(-2.3,-1.5);addP(rm,{k:'dot',x:rm.ix+res.x+res.dir*5,y:rm.iy+res.y-8,vx:Math.cos(a)*rnd(8,14)*res.dir*-1,vy:Math.sin(a)*rnd(10,16),g:1,t:0,life:.9,c:'#8FD0F0'});}}

const VEH={
 car:{s:["....BBBBB.....","...BWWBWWWB...","..BWWWBWWWWB..","TBBBBBBBBBBBBH","BBBBBBBBBBBBBB","..OO......OO.."],p:{W:'#BFE6F7',T:'#E0403A',H:'#FFE890',O:'#2A2A33'}},

 bus:{s:["BBBBBBBBBBBBBBBBBBBBB.","BWWWBWWWBWWWBWWWBDDWB.","BWWWBWWWBWWWBWWWBDDWWB","BBBBBBBBBBBBBBBBBDDBBB","SSSSSSSSSSSSSSSSSDDSSH","TBBBBBBBBBBBBBBBBBBBBB","...OO...........OO...."],p:{W:'#BFE6F7',D:'#5A6A7A',S:'#FFFFFF',T:'#E0403A',H:'#FFE890',O:'#2A2A33'}},

const CARC=['#E86A5A','#5C9AD8','#F2C94C','#7FC0A0','#F4F4F4','#8A7AC8'];
function vehSprite(k,col,flip,nl){const V=VEH[k],w=V.s[0].length,h=V.s.length;
  return sprite('v'+k+col+(flip?'f':'')+nl,w,h,()=>{const dk=c=>mix(c,'#262A46',nl/4*.62);
    for(let r=0;r<h;r++)for(let c=0;c<w;c++){const ch=V.s[r][c];if(ch==='.')continue;const x=flip?w-1-c:c;
      let cc=ch==='B'?col:V.p[ch];if(ch==='H'&&nl>1)cc='#FFF6C0';else if(ch==='T'&&nl>1)cc='#FF5040';else cc=dk(cc);

function spawnVeh(k,lane,stop){const V=VEH[k],w=V.s[0].length,dir=lane?-1:1;
  let x=dir>0?-w-2:W+2;
  for(const q of traffic)if(q.t==='v'&&q.lane===lane){if(dir>0)x=Math.min(x,q.x-w-6);else x=Math.max(x,q.x+q.w+6);}
  traffic.push({t:'v',k,lane,dir,w,h:V.s.length,x,v:k==='bus'?15:k==='truck'?17:rnd(20,30),col:k==='truck'?'#3E86B4':k==='bus'?'#7FC0A0':CARC[Math.floor(Math.random()*CARC.length)],stop:stop?1:0,st:0,wt:0});}
function spawnWalker(){const dir=Math.random()<.5?1:-1,n=Math.random()<.25?(2+Math.floor(Math.random()*2)):1,v=rnd(5,7),sp=Math.floor(Math.random()*NS);
  for(let i=0;i<n;i++)traffic.push({t:'w',sp:i&&Math.random()<.6?sp:Math.floor(Math.random()*NS),dir,x:(dir>0?-8:W+8)-dir*i*11,v,ph:rnd(0,5),look:0,lk:rnd(2,6)});}
function callTruck(){if(traffic.some(o=>o.t==='v'&&o.stop))return;spawnVeh('truck',0,1);}
function stepTraffic(dt){
  tNext-=dt;if(tNext<0){const r=Math.random();spawnVeh(r<.62?'car':r<.8?'van':r<.93?'bus':'truck',Math.random()<.5?1:0,0);tNext=rnd(3,9);}
  wNext-=dt;if(wNext<0){spawnWalker();wNext=rnd(5,12);}
  const stopX=bx+Math.floor((cols*CW+2)/2);
  for(const o of traffic){
    if(o.t==='v'){let v=o.v;
      if(o.stop===1){const d=stopX-(o.x+o.w/2);if(d<30)v=Math.max(0,o.v*d/30);if(d<.6){o.stop=2;o.wt=3.2;}}
      else if(o.stop===2){v=0;o.wt-=dt;if(o.wt<0)o.stop=3;}
      else if(o.stop===3){o.st=Math.min(1,o.st+dt*.6);v=o.v*o.st;}
      /* 前の車にはぶつからない */
      for(const q of traffic)if(q!==o&&q.t==='v'&&q.lane===o.lane){const gap=o.dir>0?q.x-(o.x+o.w):o.x-(q.x+q.w);if(gap>0&&gap<5)v=Math.min(v,Math.max(0,(gap-2)*4));}
      o.x+=o.dir*v*dt;o.moving=v>1;o.dead=o.dir>0?o.x>W+4:o.x+o.w<-4;}
    else{o.ph+=dt;o.lk-=dt;
      if(o.look>0){o.look-=dt;}else{o.x+=o.dir*o.v*dt;if(o.lk<0&&o.x>bx&&o.x<bx+cols*CW){o.look=rnd(1.2,2.2);o.lk=rnd(6,12);}}
      o.dead=o.dir>0?o.x>W+10:o.x<-10;}}
  traffic=traffic.filter(o=>!o.dead);}
function drawTraffic(nk){const nl=Math.round(nk/.62*4),gy=by+rowsN*CH+3,night=nl>1;
  const yl=[gy+9,gy+Math.min(gH-2,15)];

    const spc=sprite('w'+o.sp+'_'+fr+(o.dir<0?'f':'')+(bl?'b':'')+nl,w+2,h+2,()=>{drawAnimal(1+w/2,h,o.sp,{flip:o.dir<0,frame:gr,blink:bl});
      if(nl){const id=g.getImageData(0,0,w+2,h+2),d=id.data,k=nl/4*.62;for(let i=0;i<d.length;i+=4){d[i]=d[i]+(38-d[i])*k;d[i+1]=d[i+1]+(42-d[i+1])*k;d[i+2]=d[i+2]+(70-d[i+2])*k;}g.putImageData(id,0,0);}});
    const hop=o.look>0?-Math.abs(Math.sin(o.look*7))*1.2:0;blit(spc,o.x-w/2-1,gy+4-h+hop);
    if(o.look>0&&Math.random()<.02)parts.push({k:'glyph',g:'♪',x:o.x+o.dir*3,y:gy-6,vx:0,vy:-4,t:0,life:1.2,c:night?'#FFE890':'#6A7AA8',x0:0,y0:0,fy:H,free:1});}
  for(const lane of [0,1])for(const o of traffic){if(o.t!=='v'||o.lane!==lane)continue;const y=yl[lane]-o.h+1;
    blit(vehSprite(o.k,o.col,o.dir<0,nl),o.x,y);

    if(o.stop===2&&Math.floor(animT*3)%2){dotC(o.dir>0?o.x:o.x+o.w-1,yl[lane]-2,'#FFB030');dotC(o.dir>0?o.x+o.w-1:o.x,yl[lane]-3,'#FFB030');}}}

function drawLamp(rm,th){const L0=th.lamp||{k:'bulb',x:26},on=rm.light>.5,x=L0.x;
  if(L0.k==='bulb'){R(x,0,1,3,'#6E6A78');R(x-1,3,3,2,on?'#FFF2A0':'#E8E0C8');P(x,5,on?'#FFE070':'#D8D0B8');}
  else if(L0.k==='pend'){R(x,0,1,2,'#6E6A78');R(x-2,2,5,2,L0.c||'#8FB86A');R(x-3,4,7,1,L0.c||'#8FB86A');R(x-1,5,3,1,on?'#FFF2A0':'#E8E0C8');}
  else if(L0.k==='chochin'){R(x,0,1,2,'#2A1E1A');R(x-2,2,5,1,'#2A1E1A');R(x-3,3,7,6,on?'#FF6A4A':'#D8483A');for(let j=4;j<9;j+=2)R(x-3,j,7,1,on?'#FF9A6A':'#B8382A');R(x-2,9,5,1,'#2A1E1A');}
  else if(L0.k==='candle'){R(x-1,L0.y,3,4,'#FFF6E0');R(x-2,L0.y+3,5,1,'#C8A060');if(on){P(x,L0.y-1,'#FFD84A');P(x,L0.y-2,'#FF9A2A');}}}
function roomGlow(rm,th){const L0=th.lamp||{};if(L0.k==='none')return[L0.x,L0.y||15];if(L0.k==='andon')return[12,25];if(L0.k==='candle')return[L0.x,L0.y];return[L0.x,6];}

function render(){
  const u=dayU(T),dl=dayLight(u),[s0,s1]=skyCols(u);ctx.imageSmoothingEnabled=false;
  /* 空(奥の板) */
  for(let y=0;y<H;y+=2){gs.fillStyle=mix(s0,s1,cl(y/(by+rowsN*CH*.6),0,1));gs.fillRect(0,y,W,2);}
  if(dl<.6){for(const s of stars){const tw=.5+.5*Math.sin(animT*1.3+s.p);if(tw<.25)continue;gs.globalAlpha=(1-dl/.6)*tw;gs.fillStyle='#FFF6D8';gs.fillRect(s.x,s.y,1,1);}gs.globalAlpha=1;}
  const arcX=v=>Math.round(W*.08+v*W*.84),arcY=v=>Math.round(by*.55-Math.sin(v*Math.PI)*by*.42);
  if(u<.56){const v=u/.56;gs.fillStyle=mix('#FFE9A0','#FFB070',1-dl);const sx=arcX(v),sy=arcY(v)+4;for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(x*x+y*y<=18)gs.fillRect(sx+x,sy+y,1,1);}
  else{const v=(u-.56)/.44;const mx=arcX(v),my=arcY(v)+4;gs.fillStyle='#FFF2C0';for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(x*x+y*y<=11&&!((x+1.6)*(x+1.6)+(y+1)*(y+1)<=8))gs.fillRect(mx+x,my+y,1,1);}
  /* 遠くの街並み */
  const cityC=mix(mix(s1,'#6E7C9A',.45),'#141A34',(1-dl)*.5);gs.fillStyle=cityC;
  const gy=by+rowsN*CH+3;for(let x=0;x<W;x+=1){const hgt=Math.floor(8+5*Math.abs(Math.sin(Math.floor(x/7)*1.7))+4*Math.abs(Math.sin(Math.floor(x/11)*2.3)));gs.fillRect(x,gy-hgt,1,hgt);}
  if(dl<.5){gs.fillStyle='#FFE08A';for(let x=3;x<W;x+=7){const hgt=Math.floor(8+5*Math.abs(Math.sin(Math.floor(x/7)*1.7)));if((x*13)%5<2)gs.fillRect(x,gy-hgt+3,1,1);}}
  ctx.drawImage(bufS,0,0,W*K,H*K);
  /* 雲(なめらか) */
  const cc=mix(mix('#FFFFFF','#FFC8A8',1-dl),'#5A6488',(1-dl)*.7);
  ctx.fillStyle=cc;ctx.globalAlpha=.9;
  for(const c of clouds){const X=v=>Math.round((c.x+v)*K),Yy=v=>Math.round((c.y+v)*K),w=c.w;
    ctx.fillRect(X(0),Yy(3),w*K,2*K);ctx.fillRect(X(2),Yy(2),(w-4)*K,K);ctx.fillRect(X(3),Yy(1),Math.floor(w*.4)*K,K);ctx.fillRect(X(Math.floor(w*.5)),Yy(1),Math.floor(w*.3)*K,K);ctx.fillRect(X(4),Yy(0),Math.floor(w*.25)*K,K);}
  ctx.globalAlpha=1;
  /* 建物と部屋(ドット格子の板) */
  g.clearRect(0,0,W,H);
  const nk=(1-dl)*.62,fac=mix(facade,'#262A46',nk),facD=mix(fac,'#000000',.2),facL=mix(fac,'#FFFFFF',.15);
  const bw=cols*CW+2,bh=rowsN*CH+3;
  /* 地面 */
  g.fillStyle=mix('#9AA0A8','#3A3E54',nk);g.fillRect(0,gy,W,H-gy);g.fillStyle=mix('#B8BEC6','#4A4E66',nk);g.fillRect(0,gy,W,2);
  g.fillStyle=mix('#7E848E','#2E3246',nk);for(let x=(3);x<W;x+=9)g.fillRect(x,gy+2,1,3);
  g.fillStyle=mix('#5A5E68','#20243A',nk);g.fillRect(0,gy+6,W,H-gy-6);g.fillStyle=mix('#F4F0E0','#8A8878',nk);for(let x=2;x<W;x+=10)g.fillRect(x,gy+10,5,1);
  /* 植え込みと街灯 */
  const tc=mix('#6AA860','#1E3A34',nk);
  for(const tx of [bx-7,bx+bw+6]){if(tx<3||tx>W-4)continue;g.fillStyle=mix('#7E5230','#2A2030',nk);g.fillRect(tx,gy-7,2,7);g.fillStyle=tc;for(let y=-6;y<=6;y++)for(let x=-5;x<=5;x++)if(x*x+y*y*1.3<=30)g.fillRect(tx+1+x,gy-13+y,1,1);}
  /* 建物本体 */
  g.fillStyle=facD;g.fillRect(bx-1,by-1,bw+2,bh+1);g.fillStyle=fac;g.fillRect(bx,by,bw,bh);
  for(let r=0;r<=rowsN;r++){g.fillStyle=facD;g.fillRect(bx,by+r*CH+2,bw,1);g.fillStyle=facL;g.fillRect(bx,by+r*CH,bw,1);}
  /* 屋上 */
  const rc=mix(roofC,'#2A2A40',nk);g.fillStyle=rc;g.fillRect(bx-2,by-3,bw+4,3);g.fillStyle=mix(rc,'#FFFFFF',.2);g.fillRect(bx-2,by-3,bw+4,1);
  g.fillStyle=mix('#B8BEC8','#40445C',nk);const tk=bx+bw-14;g.fillRect(tk,by-11,9,6);g.fillStyle=mix('#8A90A0','#30344A',nk);g.fillRect(tk,by-11,9,1);g.fillRect(tk+1,by-5,1,2);g.fillRect(tk+7,by-5,1,2);
  g.fillStyle=mix('#6E7488','#2A2E40',nk);g.fillRect(bx+6,by-12,1,9);g.fillRect(bx+3,by-11,7,1);g.fillRect(bx+4,by-9,5,1);
  if(dl<.5&&Math.floor(animT*1.2)%2){g.fillStyle='#FF4A4A';g.fillRect(bx+6,by-13,1,1);}
  g.fillStyle=mix('#B07A4A','#3A2A30',nk);g.fillRect(bx+14,by-6,4,3);g.fillStyle=mix('#6AA860','#1E3A34',nk);g.fillRect(bx+15,by-9,2,3);g.fillRect(bx+14,by-8,1,1);g.fillRect(bx+17,by-8,1,1);
  /* 部屋 */
  for(const rm of rooms){const th=TH[rm.sp];RX=rm.ix;RY=rm.iy;tgt=0;
    if(rm.ph==='paint'&&rm.oldSp!=null){const wy=Math.floor(rm.wipe*IH);g.drawImage(wallArt(rm.oldSp),0,wy,IW,IH-wy,RX,RY+wy,IW,IH-wy);g.drawImage(wallArt(rm.sp),0,0,IW,wy,RX,RY,IW,wy);
      g.fillStyle='#FFFFFF';g.fillRect(RX+2,RY+Math.min(IH-2,wy),IW-4,1);g.fillStyle='#8A96B8';g.fillRect(RX+Math.floor(IW/2)-3,RY+Math.min(IH-2,wy)-1,7,2);}
    else g.drawImage(wallArt(rm.sp),RX,RY);
    const showRoom=rm.ph!=='paint';
    drawWindow(rm,rm.ph==='paint'&&rm.wipe<.5&&rm.oldSp!=null?TH[rm.oldSp]:th,u,dl);
    drawDoor(rm,th);drawLamp(rm,th);
    if(showRoom){th.items.forEach((it,i)=>{const st=rm.items[i];if(st==='on')it.d(animT,rm);else if(st==='box')box(it.x,it.w,it.h);});}}
  RX=0;RY=0;
  ctx.drawImage(buf,0,0,W*K,H*K);
  drawTraffic(nk);
  /* 住人(なめらか)と手前の家具 */
  for(const rm of rooms){const res=rm.res,th=TH[rm.sp];if(!res||res.mode==='gone'||res.alpha<=0)continue;
    if(rm.ph==='paint')continue;
    const A=SP[res.sp];let fr=0,oy=0,ox=0;
    if(res.mode==='walk'||res.act==='run')fr=Math.floor(res.t*(res.act==='run'?14:8))%2;
    if(res.mode==='act'){if(res.act==='eat')oy=-Math.abs(Math.sin(res.t*8))*.7;else if(res.act==='hop')oy=-Math.abs(Math.sin(res.t*4.2))*5;
      else if(res.act==='drum')oy=-Math.abs(Math.sin(res.t*6))*.8;else if(res.act==='swim'||res.act==='bath'){const sp=th.spots[res.spot];const rr=sp&&sp.range||0;ox=Math.sin(res.t*.55)*rr;oy=Math.sin(res.t*1.8)*.4;
        const want=Math.cos(res.t*.55)>0?1:-1;if(rr>2)res.dir=want;}
      else if(res.act==='swing'||(res.act==='sleep'&&th.spots[res.spot]&&th.spots[res.spot].swing))ox=rm.swing;
      else if(res.act==='read')oy=Math.round(Math.sin(rm.rock))*.5;}
    const gr=A.fw[fr],w=gr[0].length,h=gr.length,bl=res.act==='sleep'&&res.mode==='act'||(res.t%3.6)<.12;
    const spc=sprite('a'+res.sp+'_'+fr+(res.dir<0?'f':'')+(bl?'b':''),w+2,h+2,()=>drawAnimal(1+w/2,h,res.sp,{flip:res.dir<0,frame:gr,blink:bl}));
    const x=rm.ix+res.x+ox,y=rm.iy+res.y+oy;
    ctx.save();ctx.beginPath();ctx.rect(rm.ix*K,rm.iy*K,IW*K,IH*K);ctx.clip();
    blit(spc,x-w/2-1,y-h,res.alpha);
    if(res.carry&&res.mode!=='gone'){const bc=sprite('bundle',5,4,()=>{g.fillStyle='#4A88C0';g.fillRect(0,1,5,3);g.fillStyle='#FFFFFF';g.fillRect(1,2,1,1);g.fillRect(3,3,1,1);g.fillStyle='#4A88C0';g.fillRect(1,0,1,1);g.fillRect(3,0,1,1);});blit(bc,x-res.dir*2-2.5,y-h-2.5,res.alpha);}
    ctx.restore();
    if(rm.ph==='live'&&res.mode==='act'){const sp=th.spots[res.spot];if(sp&&sp.front){RX=rm.ix;RY=rm.iy;tgt=1;sp.front(animT,rm);tgt=0;RX=0;RY=0;}}}
  /* 部屋の明るさ:灯りが消えている部屋は夜の暗さに、夜の子が昼に眠る部屋はカーテン越しにうす暗く */
  for(const rm of rooms){const th=TH[rm.sp],res=rm.res;
    let dark=(1-dl)*.64*(1-rm.light);
    if(th.noct&&res&&res.asleep&&dl>.3)dark=Math.max(dark,.22*dl);
    if(dark>.01){ctx.fillStyle='rgba(18,22,52,'+dark.toFixed(3)+')';ctx.fillRect(rm.ix*K,rm.iy*K,IW*K,IH*K);}
    if(rm.light>.02&&dl<.95){ctx.fillStyle='rgba(255,206,130,'+(rm.light*(1-dl)*.08).toFixed(3)+')';ctx.fillRect(rm.ix*K,rm.iy*K,IW*K,IH*K);}}
  /* 粒 */
  for(const p of parts){if(p.t<0)continue;clipB=p.free?null:[p.x0,p.y0];const q=p.t/p.life,a=q<.15?q/.15:1-(q-.15)/.85;
    if(p.k==='dot')dotC(p.x,p.y,p.c,a);
    else if(p.k==='puff'){const r=.6+q*2;for(let i=0;i<3;i++)dotC(p.x+Math.cos(i*2.1+q*2)*r,p.y+Math.sin(i*2.1)*r*.6,p.c,a*.85);}
    else if(p.k==='ring'){dotC(p.x,p.y,p.c,a);dotC(p.x+1,p.y,p.c,a*.6);}
    else if(p.k==='glyph'){const G=GL[p.g];const xx=p.x+Math.sin(p.t*2.5)*.8;for(let r=0;r<G.length;r++)for(let c=0;c<G[r].length;c++)if(G[r][c]==='#')dotC(xx+c,p.y+r,p.c,a);}}clipB=null;}

/* ---------- ボタン ---------- */
function say(m){if(window.APKit&&APKit.toast)APKit.toast(m,2200);}
function mutate(){const live=rooms.filter(r=>r.ph==='live');const n=Math.min(live.length,Math.max(2,Math.round(rooms.length/3)));
  for(let i=live.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[live[i],live[j]]=[live[j],live[i]];}
  live.slice(0,n).forEach((rm,i)=>setTimeout(()=>startMove(rm),i*450));say('引っ越しシーズン('+n+'部屋)');}
function resetAll(){const fi=Math.floor(Math.random()*FAC.length);facade=FAC[fi][0];roofC=FAC[fi][1];
  T=DAY*.1;bag=[];const old=rooms;rooms=[];for(const o of old){const rm=makeRoom(o.c,o.r);rm.ix=o.ix;rm.iy=o.iy;rooms.push(rm);}parts=[];say('新しい顔ぶれで、朝から');}

/* ---------- boot ---------- */
resize();addEventListener('resize',resize);
setTimeout(()=>hintEl.classList.add('on'),700);
setTimeout(()=>hintEl.classList.remove('on'),9000);
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!(window.APKit&&APKit.isExporting&&APKit.isExporting())){step(dt);render();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(location.hash.indexOf('debug')>=0)window.__am={step,render,startMove,mutate,resetAll,setT:v=>{T=v;},rooms:()=>rooms,veh:(k,l)=>spawnVeh(k,l,0),walk:()=>spawnWalker(),truck:()=>callTruck(),traffic:()=>traffic,setSp:(i,s)=>{const rm=rooms[i];setSpecies(rm,s);rm.res=newRes(s);placeAtSpot(rm);},get:()=>({T,u:dayU(T),n:rooms.length,cols,rowsN,W,H,K})};

/* GIF:住人はその場で止め、家具の動き(回し車・ブランコ・水面・ミツバチ・時計…)と粒だけが3秒周期で回る。
   家具の動きの周期はそろっていないので、一部に小さな継ぎ目が出る */
if(window.APKit)APKit.init({
  canvas:cv,
  gifName:'animal-mansion-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){const sa=animT;animT=sa+phase/TAU*3;render();animT=sa;},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
