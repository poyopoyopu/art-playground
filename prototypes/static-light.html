<!-- STATIC LIGHT — ChatGPT作。参考画像の多層光学構造を、矩形の面・境界光・透過色として再構成。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>STATIC LIGHT</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,D=1,phase=0,last=performance.now(),seed=Math.random()*100000;
let memories=[];
const TAU=Math.PI*2;

const palettes=[
  [[248,245,226],[255,79,48],[42,91,225],[189,132,255],[255,190,63]],
  [[242,248,255],[255,67,43],[31,91,225],[224,139,255],[255,205,75]],
  [[255,239,214],[244,56,48],[54,111,238],[175,118,255],[255,180,56]]
];

function resize(){
  D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));canvas.height=Math.max(1,Math.round(H*D));
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize,{passive:true});resize();

function hash(n){const x=Math.sin(n*127.17+seed*11.73)*43758.5453;return x-Math.floor(x)}
function rgb(c,a=1){return"rgba("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+","+a+")"}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function layout(){
  const s=Math.min(W,H),cx=W*.5,top=H*.10;
  // x,y,w,h are fractions of the short side. This is intentionally architectural:
  // a few large planes establish the composition, then smaller planes interlock.
  return [
    {x:cx-s*.34,y:top-s*.03,w:s*.18,h:s*.86,c:0,z:0},
    {x:cx-s*.16,y:top-s*.12,w:s*.30,h:s*.19,c:1,z:1},
    {x:cx+s*.14,y:top-s*.10,w:s*.24,h:s*.20,c:3,z:2},
    {x:cx-s*.34,y:top+s*.17,w:s*.31,h:s*.39,c:2,z:3},
    {x:cx-s*.08,y:top+s*.16,w:s*.18,h:s*.18,c:0,z:4},
    {x:cx+s*.10,y:top+s*.17,w:s*.29,h:s*.48,c:4,z:5},
    {x:cx+s*.39,y:top+s*.19,w:s*.19,h:s*.48,c:1,z:6},
    {x:cx-s*.18,y:top+s*.35,w:s*.17,h:s*.43,c:2,z:7},
    {x:cx+s*.00,y:top+s*.35,w:s*.17,h:s*.43,c:0,z:8},
    {x:cx-s*.34,y:top+s*.56,w:s*.32,h:s*.24,c:1,z:9},
    {x:cx-s*.02,y:top+s*.57,w:s*.22,h:s*.24,c:3,z:10},
    {x:cx+s*.19,y:top+s*.57,w:s*.32,h:s*.24,c:2,z:11},
    {x:cx-s*.03,y:top+s*.80,w:s*.22,h:s*.18,c:4,z:12}
  ];
}
let planes=layout();
addEventListener("resize",()=>{planes=layout()},{passive:true});

function addMemory(x,y){
  memories.push({
    x,y,
    size:Math.min(W,H)*(.08+.12*hash(memories.length+40)),
    angle:hash(memories.length+70)*TAU,
    color:Math.floor(hash(memories.length+90)*5),
    born:phase
  });
  if(memories.length>12)memories.shift();
}

function glow(x,y,w,h,c,a,blur){
  ctx.save();
  ctx.globalCompositeOperation="screen";
  ctx.filter="blur("+blur+"px)";
  const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(w,h));
  g.addColorStop(0,rgb(c,a));g.addColorStop(.42,rgb(c,a*.40));g.addColorStop(1,rgb(c,0));
  ctx.fillStyle=g;ctx.fillRect(x-w,y-h,w*2,h*2);
  ctx.restore();
}

function planeGradient(p,t,pal,idx){
  const cx=p.x+p.w*(.28+.18*Math.sin(t*.21+p.z*.37));
  const cy=p.y+p.h*(.34+.13*Math.cos(t*.17+p.z*.51));
  const r=Math.max(p.w,p.h)*.82;
  const c0=pal[p.c%pal.length],c1=pal[(p.c+1)%pal.length];
  const c2=pal[(p.c+2)%pal.length];
  const g=ctx.createRadialGradient(cx,cy,0,p.x+p.w*.52,p.y+p.h*.53,r);
  const pulse=.5+.5*Math.sin(t*.31+p.z*.73);
  g.addColorStop(0,rgb(mix(c0,[255,255,255],.56),.88));
  g.addColorStop(.22,rgb(mix(c0,c1,.28),.80));
  g.addColorStop(.58,rgb(mix(c1,c2,.22),.66));
  g.addColorStop(.84,rgb(c2,.48));
  g.addColorStop(1,"rgba(2,4,9,.42)");
  return g;
}

function drawPlane(p,t,pal,idx){
  const s=Math.min(W,H);
  const drift=1+.012*Math.sin(t*.43+p.z);
  const x=p.x,y=p.y,w=p.w*drift,h=p.h*drift;
  const c0=pal[p.c%pal.length];

  // Colored spill behind the plane: this is what makes the composition feel luminous
  // instead of looking like flat colored rectangles.
  glow(x+w*.48,y+h*.44,w*.50,h*.48,c0,.055,s*.055);

  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle=planeGradient(p,t,pal,idx);
  ctx.fillRect(x,y,w,h);

  // A second, displaced veil produces the translucent-over-translucent effect.
  const veil=ctx.createLinearGradient(x,y,x+w,y+h);
  veil.addColorStop(0,"rgba(255,255,255,.015)");
  veil.addColorStop(.46,"rgba(255,255,255,"+(.045+.025*Math.sin(t*.62+p.z))+")");
  veil.addColorStop(.72,"rgba(255,255,255,.005)");
  veil.addColorStop(1,"rgba(0,0,0,.17)");
  ctx.fillStyle=veil;ctx.fillRect(x,y,w,h);
  ctx.restore();

  // Hairline boundary + a concentrated luminous edge.
  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,.105)";
  ctx.lineWidth=Math.max(.45,s*.00105);
  ctx.strokeRect(x,y,w,h);
  ctx.globalCompositeOperation="screen";
  ctx.shadowColor=rgb(c0,.48);ctx.shadowBlur=s*.009;
  ctx.strokeStyle=rgb(c0,.24);ctx.lineWidth=Math.max(.7,s*.0015);
  ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.restore();

  // Only selected edges catch the strongest light, like the reference.
  if(idx%2===0){
    glow(x+w*.5,y,w*.36,s*.018,c0,.10,s*.010);
  }
  if(idx%3===1){
    glow(x+w,y+h*.5,s*.014,h*.34,c0,.09,s*.010);
  }
}

function drawStructuralLights(t,pal){
  const s=Math.min(W,H),cx=W*.5;
  const ys=[H*.22,H*.51,H*.76];
  const xs=[cx-s*.34,cx-s*.03,cx+s*.19,cx+s*.39];

  ctx.save();ctx.globalCompositeOperation="screen";
  for(let i=0;i<ys.length;i++){
    const y=ys[i]+Math.sin(t*.22+i)*s*.002;
    const c=pal[(i+1)%pal.length];
    const g=ctx.createLinearGradient(0,y, W,y);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.16,rgb(c,.03));
    g.addColorStop(.30,rgb(c,.14));
    g.addColorStop(.50,"rgba(255,245,220,.20)");
    g.addColorStop(.70,rgb(c,.11));
    g.addColorStop(.86,rgb(c,.025));
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.fillRect(0,y-s*.004,W,s*.008);
  }
  for(let i=0;i<xs.length;i++){
    const x=xs[i]+Math.cos(t*.19+i)*s*.002;
    const c=pal[(i+2)%pal.length];
    const g=ctx.createLinearGradient(x,0,x+s*.004,0);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(.5,rgb(c,.11));
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.fillRect(x-s*.003,0,s*.006,H);
  }
  ctx.restore();
}

function drawMemories(t,pal){
  const s=Math.min(W,H);
  ctx.save();ctx.globalCompositeOperation="screen";
  for(const m of memories){
    const q=.12+.07*Math.sin(t*.8+m.born*2.7);
    const c=pal[m.color%pal.length];
    const dx=Math.cos(m.angle)*m.size,dy=Math.sin(m.angle)*m.size;
    const g=ctx.createLinearGradient(m.x-dx,m.y-dy,m.x+dx,m.y+dy);
    g.addColorStop(0,"rgba(255,255,255,0)");
    g.addColorStop(.5,rgb(c,q));
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=g;ctx.lineWidth=s*.004;
    ctx.beginPath();ctx.moveTo(m.x-dx,m.y-dy);ctx.lineTo(m.x+dx,m.y+dy);ctx.stroke();
    glow(m.x,m.y,s*.05,s*.05,c,.055,s*.025);
  }
  ctx.restore();
}

function grain(t){
  // Sparse deterministic grain. It changes slowly, so it reads as material rather
  // than television noise.
  ctx.save();ctx.globalAlpha=.042;ctx.globalCompositeOperation="screen";
  const n=Math.floor(W*H/11000),frame=Math.floor(t*2);
  for(let i=0;i<n;i++){
    const x=hash(i*2.31+frame*13.7)*W,y=hash(i*5.19+7)*H;
    ctx.fillStyle=hash(i*7.1+3)>.5?"#fff":"#000";
    ctx.fillRect(x,y,.65,.65);
  }
  ctx.restore();
}

function render(t){
  const pal=palettes[Math.floor(seed)%palettes.length];
  const bg=ctx.createRadialGradient(W*.5,H*.40,0,W*.5,H*.5,Math.max(W,H)*.72);
  bg.addColorStop(0,"#10141e");
  bg.addColorStop(.42,"#080b12");
  bg.addColorStop(1,"#020307");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Large ambient color fields establish the dark colored atmosphere around the structure.
  const s=Math.min(W,H);
  glow(W*.22,H*.30,s*.30,s*.34,pal[2],.075,s*.15);
  glow(W*.78,H*.32,s*.30,s*.34,pal[1],.065,s*.15);
  glow(W*.73,H*.75,s*.28,s*.25,pal[1],.045,s*.13);

  planes.slice().sort((a,b)=>a.z-b.z).forEach((p,i)=>drawPlane(p,t,pal,i));
  drawStructuralLights(t,pal);
  drawMemories(t,pal);
  grain(t);
}

function loopFrame(p){render(p*TAU)}
function tick(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;
  phase=(phase+dt*.38)%TAU;
  render(phase);
  requestAnimationFrame(tick);
}
function mutate(){seed=Math.random()*100000;memories=[];planes=layout()}
function reset(){memories=[];phase=0;last=performance.now()}

canvas.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;
  addMemory(e.clientX,e.clientY);e.preventDefault();return false;
},{passive:false});
canvas.addEventListener("pointermove",e=>{
  if(e.buttons)addMemory(e.clientX,e.clientY);
},{passive:true});

APKit.init({
  canvas,
  gifName:"static-light-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame,
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
