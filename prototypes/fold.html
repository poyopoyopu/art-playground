<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>FOLD</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,n=7;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#111';g.fillRect(0,0,W,H);g.save();g.translate(W/2,H/2);for(let i=0;i<n;i++){g.rotate(Math.sin(p*6+i)*.08);g.beginPath();g.rect(-Math.min(W,H)*.36,-Math.min(W,H)*.015,Math.min(W,H)*.72,Math.min(W,H)*.03);g.strokeStyle=`hsla(${30+i*25},80%,70%,.55)`;g.stroke()}g.restore()}function mu(){n=3+Math.floor(Math.random()*12)}APKit.init({canvas:c,gifName:'fold-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>n=7}]});draw(0)</script>
