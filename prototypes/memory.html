<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>MEMORY</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101010}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,trail=[],h=40;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#101010';g.fillRect(0,0,W,H);for(let i=0;i<trail.length;i++){let q=trail[i],a=i/trail.length;g.beginPath();g.arc(q.x+Math.sin(p*6+i)*30*a,q.y,8+40*a,0,7);g.strokeStyle=`hsla(${h+i*4},80%,65%,${1-a})`;g.stroke()}}c.onclick=e=>{if(APKit.isUI(e.clientX,e.clientY))return;trail.unshift({x:e.clientX,y:e.clientY});trail=trail.slice(0,24)};function mu(){h=Math.random()*360;trail=[]}APKit.init({canvas:c,gifName:'memory-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>trail=[]}]});draw(0)</script>
