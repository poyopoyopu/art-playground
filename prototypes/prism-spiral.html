<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>PRISM SPIRAL</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,twists=0,seed=Math.random()*9;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=0){g.fillStyle="#050509";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let r=10;r<S*.47;r+=5){g.beginPath();let turns=3.5+twists*.22;for(let i=0;i<50;i++){let u=i/49,a=u*Math.PI*2*turns+p*(.25+r/S)+r*.002+seed*.01,wob=Math.sin(a*2+seed)*r*.025;g.lineTo(cx+Math.cos(a)*(r+wob),cy+Math.sin(a)*(r+wob))}g.strokeStyle=`hsla(${(r*1.8+seed*40+p*12)%360},95%,65%,.48)`;g.lineWidth=1.5;g.stroke()}for(let i=0;i<12;i++){let a=i*Math.PI/6+p*.08;g.fillStyle=`hsl(${(i*30+seed*20)%360},100%,65%)`;g.beginPath();g.arc(cx+Math.cos(a)*S*.43,cy+Math.sin(a)*S*.43,4,0,7);g.fill()}}function add(x,y){if(APKit.isUI(x,y))return;let dx=x-W/2,dy=y-H/2;twists+=Math.atan2(dy,dx)*.35;seed+=Math.hypot(dx,dy)/Math.min(W,H)*2}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'PRISM-SPIRAL-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*360;twists=Math.random()*8-4}},{label:'↻',name:'reset',onClick:()=>{twists=0;seed=1}}]});(function loop(){draw(performance.now()*.00008);requestAnimationFrame(loop)})();</script></body></html>
