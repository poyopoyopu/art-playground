<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>PRESSURE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#070707}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,ps=[],seed=1;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#070707';g.fillRect(0,0,W,H);let t=p*6;for(let y=0;y<H;y+=14)for(let x=0;x<W;x+=14){let dx=0,dy=0;for(let q of ps){let X=x-q.x,Y=y-q.y,r=Math.hypot(X,Y)+4,f=7000/r/r;dx+=X*f;dy+=Y*f}let a=Math.atan2(dy,dx)+Math.sin(x*.01+t)*.15;g.strokeStyle=`hsla(${180+seed*80},75%,70%,.22)`;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*10,y+Math.sin(a)*10);g.stroke()}}c.onpointerdown=e=>{if(APKit.isUI(e.clientX,e.clientY))return;ps.push({x:e.clientX,y:e.clientY});ps=ps.slice(-8)};function mu(){seed=Math.random();ps=[]}APKit.init({canvas:c,gifName:'pressure-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>ps=[]}]});draw(0)</script>
