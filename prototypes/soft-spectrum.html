<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=5,law=0,t0=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function rgb(v){v-=Math.floor(v);return[Math.min(1,Math.exp(-Math.pow((v-.03)/.11,2))+.7*Math.exp(-Math.pow((v-.93)/.15,2))),Math.min(1,Math.exp(-Math.pow((v-.18)/.15,2))+.6*Math.exp(-Math.pow((v-.72)/.14,2))),Math.min(1,Math.exp(-Math.pow((v-.43)/.17,2)))]}
function draw(p){const t=p*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);const phase=law*.45,amp=.085+law*.012;g.save();g.translate(cx,cy);g.rotate(-.045+Math.sin(t)*.012);g.translate(-cx,-cy);const grad=g.createLinearGradient(W*.12,0,W*.88,0);for(let i=0;i<=60;i++){const q=i/60,col=rgb(q+.035*Math.sin(t*.4+q*2));grad.addColorStop(q,'rgb('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+')')}g.strokeStyle=grad;g.lineCap='round';g.lineJoin='round';g.lineWidth=S*(.105+law*.006);g.beginPath();for(let i=0;i<=600;i++){const u=i/600,q=u-.5,x=W*(.13+.74*u);const y=cy+S*(.12*Math.sin(q*2.8+t*.18+seed*.06)+amp*Math.sin(q*5.7-t*.14+phase))*Math.exp(-q*q/.34)+S*.025*q;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.globalAlpha=.28;g.lineWidth=S*.018;g.strokeStyle='#fff';g.stroke();g.globalAlpha=.12;g.lineWidth=S*.004;g.strokeStyle=grad;g.stroke();g.restore()}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);law=(law+1)%4}function reset(){seed=5;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%4;seed++;return true});function loop(now){draw(((now-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
