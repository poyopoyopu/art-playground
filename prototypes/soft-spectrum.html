<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=5,law=0,t0=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function draw(p){const t=p*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);const tilt=Math.sin(t*.5+seed)*.16;for(let layer=0;layer<54;layer++){const off=(layer-27)*S*.008;g.beginPath();for(let i=0;i<=420;i++){const u=i/420,x=W*(u-.5),q=x/S,envelope=Math.exp(-q*q/.34),bow=Math.sin(q*2.7+t*.28+seed)*S*.035*envelope,ripple=Math.sin(q*9.5-t*.22+layer*.06)*S*.006,twist=law*Math.sin(q*3.8+t+layer*.11)*S*.012*envelope,y=cy+x*tilt+off+bow+ripple+twist;if(i===0)g.moveTo(cx+x,y);else g.lineTo(cx+x,y)}const hue=(170+layer*3.8+Math.sin(t*.55)*75+seed*23)%360;g.strokeStyle='hsla('+hue+',78%,'+(62+layer*.18)+'%,'+(.022+envelope*.018)+')';g.lineWidth=.45+(layer%3)*.12;g.stroke()}g.globalCompositeOperation='screen';for(let k=0;k<13;k++){const a=(k-6)*.035+Math.sin(t*.4+seed)*.025;g.beginPath();for(let j=0;j<=240;j++){const v=j/240-.5,x=v*S*1.25,y=cy+x*a+Math.sin(v*5+t*.3+k)*S*.012,xx=cx+x;if(j===0)g.moveTo(xx,y);else g.lineTo(xx,y)}g.strokeStyle='hsla('+((k*27+seed*41+t*38)%360)+',90%,60%,.035)';g.lineWidth=.9;g.stroke()}g.globalCompositeOperation='source-over'}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);law=(law+1)%5}function reset(){seed=5;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%5;seed++;return true});function loop(now){draw(((now-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
