<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c');const g=c.getContext('2d',{alpha:false});let W=1,H=1,D=1,seed=13,law=0,t0=performance.now();
function resize(){D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.max(1,Math.floor(W*D));c.height=Math.max(1,Math.floor(H*D));g.setTransform(D,0,0,D,0,0)}
window.addEventListener('resize',resize);resize();
function draw(phase){const t=phase*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);
for(let layer=0;layer<58;layer++){const z=(layer-28.5)/28.5,depth=1-Math.abs(z),spread=S*(.22+.23*depth),hue=(185+layer*3.1+Math.sin(t*.5+layer*.12+seed)*48+seed*9)%360;g.beginPath();for(let i=0;i<=300;i++){const q=i/300*Math.PI*2,breathe=1+.035*Math.sin(t+layer*.09),fold=.035*Math.sin(q*5-t*.35+layer*.17)+.012*Math.sin(q*13+t*.23+seed),squeeze=law*.012*Math.sin(q*2+t+layer*.11),rx=spread*breathe*(1+fold)+squeeze*S*.35,ry=spread*(1.35-.28*depth)*(1+fold*.6),x=cx+Math.cos(q+z*.42+t*.06)*rx,y=cy+Math.sin(q+z*.42+t*.06)*ry;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+hue+',78%,'+(62+depth*18)+'%,'+(.018+depth*.012)+')';g.lineWidth=.45+(1-depth)*.15;g.stroke()}
g.globalCompositeOperation='multiply';for(let k=0;k<11;k++){const a=k*Math.PI/11+t*.035,rx=S*.47,ry=S*.72;g.beginPath();for(let j=0;j<=180;j++){const q=j/180*Math.PI*2,wob=.018*Math.sin(q*7+t+k)+law*.012*Math.sin(q*2-t+k),x=cx+Math.cos(q+a)*rx*(1+wob),y=cy+Math.sin(q+a)*ry*(1+wob);if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((k*31+seed*23+t*24)%360)+',75%,62%,.028)';g.lineWidth=.8;g.stroke()}g.globalCompositeOperation='source-over'}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*9);law=(law+1)%6}function reset(){seed=13;law=0}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%6;seed+=1;return true});function loop(now){draw(((now-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
