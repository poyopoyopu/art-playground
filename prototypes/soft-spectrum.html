<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=4,shift=0,t0=performance.now();function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function paint(p){let t=p*6.2831853;g.fillStyle='#fff';g.fillRect(0,0,W,H);let drift=Math.sin(t*.7)*.08,breath=.035+.025*Math.sin(t);for(let b=0;b<36;b++){g.beginPath();for(let i=0;i<=340;i++){let u=i/340,x=u*W,a=(u-.5)*5.4;let y=H*(.80+breath*.35)-Math.cos(a+drift+Math.sin(t+a*1.7)*.12+Math.sin(t*2+a*3)*.035)*H*(.62+breath);y+=Math.sin(a*2.1+t+b*.08+seed)*H*(.009+.009*Math.sin(t+b*.15)**2);y+=shift*Math.sin(a*1.4-t+b*.03)*H*.055+Math.sin(a*5-t*1.3)*H*.008;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((b*13+seed*31+Math.sin(t+b*.2)*30)%360)+',90%,64%,'+(.018+b*.0038)+')';g.lineWidth=.5+b*.032;g.stroke()}g.globalCompositeOperation='screen';for(let q=0;q<11;q++){g.beginPath();for(let i=0;i<=300;i++){let u=i/300,x=u*W,a=(u-.5)*5.1;let y=H*.78-Math.cos(a+q*.012+t*.18+Math.sin(t+a*2)*.08)*H*(.56+.05*Math.sin(t+q));y+=Math.sin(a*(2+q*.035)+t*(1+q*.03)+seed)*H*.012; y+=Math.sin(a*4-t*.7)*H*.008;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((q*43+seed*29+t*38)%360)+',100%,62%,.15)';g.lineWidth=1.1+.25*Math.sin(t+q);g.stroke()}g.globalCompositeOperation='source-over'}function frame(p){paint(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);shift=(shift+1)%4}function reset(){seed=4;shift=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;shift=(shift+1)%5;seed++;return true});function loop(t){paint(((t-t0)/16000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
