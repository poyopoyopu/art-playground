<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=5,law=0,t0=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D)}addEventListener('resize',resize);resize();
function rgb(v){v-=Math.floor(v);const a=Math.max(0,Math.min(1,Math.exp(-Math.pow((v-.02)/.12,2))+.7*Math.exp(-Math.pow((v-.94)/.14,2)))),b=Math.max(0,Math.min(1,Math.exp(-Math.pow((v-.18)/.15,2))+.55*Math.exp(-Math.pow((v-.7)/.14,2)))),d=Math.max(0,Math.min(1,Math.exp(-Math.pow((v-.44)/.17,2))));return[a,b,d]}
function draw(p){const t=p*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);const phase=law*.35,amp=.11+law*.018;g.save();g.translate(cx,cy);g.rotate(-.045+Math.sin(t)*.018);g.translate(-cx,-cy);const grad=g.createLinearGradient(W*.08,0,W*.92,0);for(let i=0;i<=40;i++){const q=i/40,col=rgb(q+.06*Math.sin(t*.35));grad.addColorStop(q,'rgba('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+','+(.055+.025*Math.sin(Math.PI*q))+')')}g.strokeStyle=grad;g.lineCap='round';g.lineWidth=S*(.13+law*.008);g.beginPath();for(let i=0;i<=500;i++){const u=i/500,x=W*(.12+.76*u),q=u-.5;const y=cy+S*(.16*Math.sin(q*3.0+t*.22+seed*.07)+amp*Math.sin(q*6.2-t*.17+phase))*Math.exp(-q*q/.42)+S*.035*q;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.globalAlpha=.55;g.lineWidth=S*(.012+law*.0015);g.strokeStyle=grad;g.stroke();g.globalAlpha=1;g.restore()}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);law=(law+1)%4}function reset(){seed=5;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%4;seed++;return true});function loop(now){draw(((now-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
