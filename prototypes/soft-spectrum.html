<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#faf8f6}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=4,shift=0,t0=performance.now();function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function paint(p){g.fillStyle='#faf8f6';g.fillRect(0,0,W,H);let t=p*6.2831853;for(let b=0;b<28;b++){g.beginPath();for(let i=0;i<=300;i++){let u=i/300,x=u*W;let a=(u-.5)*5.4;let y=H*.82-Math.cos(a+Math.sin(t+a*1.7)*.12)*H*.63; y+=Math.sin(a*2.1+t+b*.08+seed)*H*.012+shift*Math.sin(a*1.4-t)*H*.07;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((b*14+seed*31)%360)+',90%,65%,'+(.025+b*.004)+')';g.lineWidth=.55+b*.035;g.stroke()}g.globalCompositeOperation='screen';for(let q=0;q<7;q++){g.beginPath();for(let i=0;i<=260;i++){let u=i/260,x=u*W;let y=H*.78-Math.cos((u-.5)*5.1+q*.012+t*.1)*H*.58+Math.sin(u*9+t+q)*H*.01;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((q*51+seed*29)%360)+',100%,62%,.18)';g.lineWidth=1.2;g.stroke()}g.globalCompositeOperation='source-over'}function frame(p){paint(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);shift=(shift+1)%4}function reset(){seed=4;shift=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;shift=(shift+1)%5;seed++;return true});function loop(t){paint(((t-t0)/10000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
