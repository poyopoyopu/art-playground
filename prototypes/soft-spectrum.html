<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=5,law=0,t0=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function rgb(v){v-=Math.floor(v);return[Math.min(1,Math.exp(-Math.pow((v-.02)/.11,2))+.62*Math.exp(-Math.pow((v-.94)/.14,2))),Math.min(1,Math.exp(-Math.pow((v-.19)/.15,2))+.58*Math.exp(-Math.pow((v-.72)/.14,2))),Math.min(1,Math.exp(-Math.pow((v-.44)/.17,2)))]}
function draw(p){const t=p*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);const bend=[2.5,4.2,6.4,8.1][law],phase=law*.7,amp=.12+law*.018;g.save();g.translate(cx,cy);g.rotate(-.04+Math.sin(t)*.012);g.translate(-cx,-cy);const grad=g.createLinearGradient(W*.06,0,W*.94,0);for(let i=0;i<=80;i++){const q=i/80,col=rgb(q+.055*Math.sin(t*.32+q*3.1+seed*.02));grad.addColorStop(q,'rgb('+Math.round(col[0]*255)+','+Math.round(col[1]*255)+','+Math.round(col[2]*255)+')')}g.strokeStyle=grad;g.lineCap='round';g.lineJoin='round';g.lineWidth=S*(.125+law*.004);g.beginPath();for(let i=0;i<=700;i++){const u=i/700,q=u-.5,x=W*(.07+.86*u);const envelope=Math.exp(-q*q/.39);const y=cy+S*(.095*Math.sin(q*bend+t*.17+seed*.05)+amp*Math.sin(q*(bend+2.7)-t*.13+phase)+.018*Math.sin(q*17-t*.23))*envelope+S*.018*q;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.globalAlpha=.22;g.lineWidth=S*.018;g.strokeStyle='#fff';g.stroke();g.globalAlpha=.48;g.lineWidth=S*.006;g.strokeStyle=grad;g.stroke();g.globalAlpha=.18;g.lineWidth=S*.002;g.strokeStyle='#fff';g.stroke();g.restore()}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);law=(law+1)%4}function reset(){seed=5;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%4;seed++;return true});function loop(now){draw(((now-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
