<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Spectrum</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=4,field=0,t0=performance.now();function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function paint(p){let t=p*6.2831853;g.fillStyle='#fff';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W*.5,cy=H*.5;for(let layer=0;layer<44;layer++){g.beginPath();for(let i=0;i<=360;i++){let u=i/360,x=u*W;let yy=(u-.5)*S*1.25;let envelope=Math.exp(-Math.pow((u-.5)/.42,2));let breathe=.04*Math.sin(t+layer*.11);let fold=Math.sin(yy/S*5.5+t*.37+seed)*S*.035;let pinch=field*Math.exp(-Math.pow((u-.5)/.18,2))*Math.sin(t*.5+layer*.09)*S*.11;let y=cy+yy*.52+fold+breathe*S*envelope+pinch;let xx=x+Math.sin(yy/S*4+t*.23+layer*.13)*S*.035*envelope;if(i===0)g.moveTo(xx,y);else g.lineTo(xx,y)}let hue=(layer*8.5+seed*31+t*22)%360;g.strokeStyle='hsla('+hue+',88%,'+(62+Math.sin(t+layer*.2)*8)+'%,'+(.016+layer*.0028)+')';g.lineWidth=.5+layer*.018;g.stroke()}g.globalCompositeOperation='screen';for(let k=0;k<16;k++){let ang=k*Math.PI/16+t*.035;let rx=S*(.22+.012*Math.sin(t*1.7+k));let ry=S*(.72+.035*Math.cos(t+k));g.beginPath();for(let j=0;j<=180;j++){let q=j/180*Math.PI*2;let wob=.035*Math.sin(q*5+t+k)+field*.08*Math.sin(q*2-t*.6+k);let x=cx+Math.cos(q+ang)*rx*(1+wob),y=cy+Math.sin(q+ang)*ry*(1+wob);if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((k*23+seed*37+t*30)%360)+',100%,65%,.055)';g.lineWidth=.8;g.stroke()}g.globalCompositeOperation='source-over'}function frame(p){paint(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);field=(field+1)%5}function reset(){seed=4;field=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;field=(field+1)%5;seed++;return true});function loop(t){paint(((t-t0)/20000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'soft-spectrum-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
