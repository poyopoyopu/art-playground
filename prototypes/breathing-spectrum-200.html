<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BREATHING SPECTRUM 200</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3eb}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,seed=Math.random()*9999,px=.5,py=.5,tx=.5,ty=.5,hold=0,htouch=0,hue=0,ht=0,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`,hash=n=>{const x=Math.sin(n*131.7+seed*.021)*43758.5;return x-Math.floor(x)};function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function breathe(i,z,t,S){const q=i/55,phase=t*.22-q*2.7;const breath=.5+.5*Math.sin(t*.17);const amp=S*(.055+.12*Math.sin(q*Math.PI));const spine=H*(.16+q*.67);const living=amp*(.35+.65*breath)*Math.sin(z*TAU*(.72+q*1.15)+phase);const secondary=S*.028*Math.sin(z*TAU*2.7+q*11-t*.09);const focus=Math.exp(-Math.pow((z-tx)/.19,2))*hold;return [z*W,spine+living+secondary+(py*H-spine)*.34*focus]}
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H);const breath=.5+.5*Math.sin(T(.18));const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,hs(40+hue*.05,35,98));bg.addColorStop(.5,hs(35+hue*.03,29,96));bg.addColorStop(1,hs(28+hue*.04,34,93));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<56;i++){const q=i/55,g=ctx.createLinearGradient(0,0,W,0),base=315+q*230+hue;g.addColorStop(0,hs(base-35,56,61,.18));g.addColorStop(.22,hs(base,70,62,.8));g.addColorStop(.5,hs(base+90,48,74,.84));g.addColorStop(.78,hs(base+170,63,63,.8));g.addColorStop(1,hs(base+220,52,58,.18));ctx.strokeStyle=g;ctx.lineWidth=.65+1.1*Math.sin(q*Math.PI);ctx.beginPath();for(let j=0;j<=210;j++){const z=-.03+j/210*1.06,p=breathe(i,z,T(1.0),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
ctx.globalCompositeOperation='screen';const rg=ctx.createRadialGradient(px*W,py*H,0,px*W,py*H,S*(.18+.08*breath));rg.addColorStop(0,'rgba(255,247,215,.46)');rg.addColorStop(.25,'rgba(255,232,190,.14)');rg.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0006,dt));py+=(ty-py)*(1-Math.pow(.0006,dt));hold+=(htouch-hold)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);htouch=d?1:0;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));function mutate(){seed=Math.random()*9999;ht=(ht+39+hash(seed)*130)%360}function reset(){px=tx=.5;py=ty=.5;hold=htouch=0;hue=ht=0;seed=Math.random()*9999}APKit.init({canvas,gifName:'breathing-spectrum-200-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
