<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DRAG INDIGO</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02020a}body{touch-action:none;overscroll-behavior:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT prototype: v52 FOCUS variation. TOUCH LAW: DRAG moves attention itself. */
const c=document.querySelector('#c'),x=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W,H,D,drag=null,dreams=[],mem=[],last=performance.now(),seed=9,hue=.66,sens=1;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();function r(){let v=Math.sin(seed++*71.3)*43758.5;return v-Math.floor(v)}
function reset(){seed=9;dreams=[];mem=[];for(let i=0;i<4;i++)dreams.push({x:W*r(),y:H*r(),q:.7+r(),born:performance.now()+i*900,dur:3200+r()*2800,rad:Math.min(W,H)*(.18+r()*.16),h:r()})}reset();
function sources(t){let a=[];for(let i=dreams.length-1;i>=0;i--){let d=dreams[i],u=(t-d.born)/d.dur;if(u>=1){dreams.splice(i,1);continue}if(u<0)continue;let e=Math.sin(Math.PI*u);d.x+=Math.sin(t*.00023+i)*.025;d.y+=Math.cos(t*.00019+i)*.018;a.push({x:d.x,y:d.y,s:d.q*e,rad:d.rad,h:d.h})}if(drag)a.push({x:drag.x,y:drag.y,s:2.5,rad:Math.min(W,H)*.30,h:.8});for(let m of mem)a.push(m);return a}
function att(px,py,ss){let v=0;for(let s of ss)v+=s.s*Math.exp(-Math.hypot(px-s.x,py-s.y)/s.rad);return v}
function cell(px,py,w,d,ss){if(w<7){x.fillStyle=`hsla(${210+220*((px/W+py/H)*.5+hue)%1},82%,${45+att(px+w/2,py+w/2,ss)*14}%,.48)`;x.fillRect(px,py,w-1,w-1);return}let a=att(px+w/2,py+w/2,ss),th=(.34+d*.20)/sens;if(d<7&&a>th&&w>12){let q=w/2;cell(px,py,q,d+1,ss);cell(px+q,py,q,d+1,ss);cell(px,py+q,q,d+1,ss);cell(px+q,py+q,q,d+1,ss)}else{x.strokeStyle=`hsla(${215+220*((px/W+py/H)*.5+hue)%1},88%,72%,${.08+a*.22})`;x.lineWidth=.65;x.strokeRect(px+.5,py+.5,w-1,w-1)}}
function draw(t,dt){for(let i=mem.length-1;i>=0;i--){mem[i].s*=Math.pow(.08,dt);if(mem[i].s<.025)mem.splice(i,1)}x.fillStyle='#02020a';x.fillRect(0,0,W,H);cell(0,0,W,0,sources(t))}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;drag={x:e.clientX,y:e.clientY}});c.addEventListener('pointermove',e=>{if(drag){drag.x=e.clientX;drag.y=e.clientY}});function up(){if(drag){mem.push({x:drag.x,y:drag.y,s:1.4,rad:Math.min(W,H)*.20,h:.8});if(mem.length>12)mem.shift();drag=null}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
APKit.init({canvas:c,gifName:'focus-drag-indigo-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{let q=DEMO[Math.floor(p/TAU*DEMO.length)%DEMO.length],z={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.28*Math.sin(p*2)),s:1.6,rad:Math.min(W,H)*.27,h:q.h};x.fillStyle='#02020a';x.fillRect(0,0,W,H);cell(0,0,W,0,[z])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=Math.random();sens=.78+Math.random()*.45}},{label:'↻',name:'reset',onClick:reset}]});const DEMO=[{h:.62},{h:.72},{h:.58},{h:.8}];
</script></body></html>
