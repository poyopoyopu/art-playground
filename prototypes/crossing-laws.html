<!DOCTYPE html>
<!-- CROSSING LAWS(仮) — クロちゃん(Claude)作の試作。2026/11/28 おっちゃん「LEDが粗すぎる/5枚重ねると濁る、これを使って欲しいのよ」「完全に別の法則の物が重なると新たな美しさが生まれるかもよ？」
     透明なLED膜5枚に、まったく別の法則を1つずつ走らせる。各膜は純色1色の細い光の筋だけ。
     ・濁りを使う: 光は足し算。1枚だけのところは暗い単色、2枚が交わると混ざった色で明るく、3枚以上が交わると白く光る。
       交わった点だけが明るいので、どの膜にも描いていない模様が重なりから浮かぶ。
     ・粗さを使う: 膜ごとにLEDの粒の位置を1/5粒ずつずらしてある。交わった所は粒が隙間を埋め合い、1枚のときより細かく見える。
     法則: 雨(縦に落ちる)/波(横に進むうねり、深い水の波は長いほど速い)/風(斜めに吹く筋と突風)/ひび(結晶の境目に電気が走る)/うねり(大きくゆがむ流れの筋)/オーロラ(縦に揺れるカーテン)。5枚に5つ、1つは控え。
     約40秒ごとに全部の法則が強まる「山場」が来て、交わりが一斉に白く灯る。タップ=法則が1つ控えと入れ替わり、小さな山場。
     ボタン: 「1」=膜を1枚ずつ単独で見る、✦=すぐ山場。確認用 ?solo=0〜4 / ?surge=1(山場を固定)。円・輪・時刻・継ぎ目なし。WebGL2・音なし。
     LED膜の描画は led-films-kit.js を使わず、このファイルの中で完結(膜を傾けたり揺らしたりしない=交わりがずれないように)。ap-kit.js統合: クロちゃん -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CROSSING LAWS — 別々の法則が交わった所だけが光る</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:24%;text-align:center;color:rgba(255,255,255,.9);font:13px/1.8 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity 1s;text-shadow:0 0 12px #000,0 0 4px #000}
#hint.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),hintEl=document.getElementById('hint');
var Q=new URLSearchParams(location.search),solo=Q.get('solo')!==null?+Q.get('solo'):-1,surgeFix=Q.get('surge')==='1';
var gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){hintEl.innerHTML='このブラウザではWebGL2が使えません';hintEl.classList.add('on');return;}
var NAMES=['雨','波','風','ひび','うねり','オーロラ'];
// 膜ごとの色(純色)。足し算で混ざる: 赤+緑=黄、緑+青=シアン、赤+青=マゼンタ、3つ以上=白
var COLS=[[1,.10,.16],[.12,1,.30],[.16,.34,1],[1,.62,.04],[.72,.14,1]];
var slotLaw=[0,1,2,3,4],reserve=5;

function prog(vs,fs){
  function sh(t,s){var x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
  var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(var i=0;i<n;i++){var f=gl.getActiveUniform(p,i);u[f.name]=gl.getUniformLocation(p,f.name);}
  return {p:p,u:u};}
var VS='#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

// ---- 1) 法則の場: LED1粒=1テクセル。横に5枚分並べる(GX*5 × GY) ----
var fieldP=prog(VS,'#version 300 es\nprecision highp float;\n'+
'uniform vec2 u_grid;uniform float u_cell,u_H,u_t,u_surge;uniform float u_law[5],u_amp[5];out vec4 o;\n'+
'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n'+
'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}\n'+
'float fbm(vec2 p){return vn(p)*.55+vn(p*2.03+7.1)*.3+vn(p*4.1-3.7)*.15;}\n'+
'float ln(float d,float w){return smoothstep(w,w*.25,d);}\n'+
// 雨: 列ごとに雨粒が落ちる。頭が一番明るく、上に尾。山場で本数が増える
'float rain(vec2 n,float t,float k,float S){float c=floor(n.x/k+.5);float r=h21(vec2(c,3.1));float spd=.5+.7*r;\n'+
' float ph=(n.y+t*spd)*1.25+r*13.;float s=fract(ph);float tl=.10+.16*h21(vec2(c,7.));\n'+
' float on=step(1.-(.30+.35*S),h21(vec2(c,floor(ph)+.5)));\n'+
' return on*(s<tl?pow(1.-s/tl,1.5):0.);}\n'+
// 波: 横に進むうねりの波頭。長い波ほど速い(深い水の波)。波の群れの明るさが流れる
'float wave(vec2 n,float t,float k,float S){float h=n.y+.035*sin(n.x*4.2-t*.82)+.022*sin(n.x*9.7+t*1.25)+.014*sin(n.x*17.-t*1.7)+.05*sin(n.x*1.6-t*.45);\n'+
' float F=11.;float ph=h*F+t*.3;float d=abs(fract(ph+.5)-.5)/F;\n'+
' float env=.25+.75*pow(.5+.5*sin(n.x*2.1-t*.7+floor(ph)*1.7),2.);\n'+
' return ln(d,k*(1.3+.5*S))*mix(env,1.,S*.6);}\n'+
// 風: 斜めの流れの筋に、突風の切れ端が流れていく
'float wind(vec2 n,float t,float k,float S){vec2 dir=normalize(vec2(1.,-.58));float u=dot(n,dir),v=dot(n,vec2(-dir.y,dir.x));\n'+
' float F=20.;float vw=v+.07*(vn(vec2(u*1.7-t*.3,v*2.2))-.5)*2.;float id=floor(vw*F);float d=abs(fract(vw*F)-.5)/F;\n'+
' float g=fract(u*1.6-t*(.45+.45*h21(vec2(id,1.)))+h21(vec2(id,2.)));float gl2=.35+.25*S;\n'+
' float dash=g<gl2?pow(g/gl2,2.2):0.;float on=step(1.-(.55+.35*S),h21(vec2(id,floor(u*1.6-t*.5)+9.)));\n'+
' return ln(d,k*1.3)*dash*on;}\n'+
// ひび: 結晶の境目(多角形)。境目に電気の脈が走る
'float crack(vec2 n,float t,float k,float S){float sc=6.5;vec2 p=n*sc;vec2 ip=floor(p);float F1=9.,F2=9.;float id=0.;\n'+
' for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(float(i),float(j));vec2 c=ip+g;float hh=h21(c);\n'+
'  vec2 sd=g+vec2(hh,h21(c+17.3))*.8+.1+.12*vec2(sin(t*.11+hh*6.28),cos(t*.09+hh*4.1));float dd=length(sd-fract(p));\n'+
'  if(dd<F1){F2=F1;F1=dd;id=hh;}else if(dd<F2)F2=dd;}\n'+
' float d=(F2-F1)*.5/sc;float pulse=pow(.5+.5*sin(dot(n,vec2(.35,1.))*7.-t*(1.6+S*2.)+id*6.28),5.);\n'+
' return ln(d,k*1.2)*(.3+.7*max(pulse,S*.7));}\n'+
// うねり: 大きくゆがんで流れる筋(閉じた輪にならないよう、斜めの向きの筋をゆがめる)
'float swell(vec2 n,float t,float k,float S){float v=dot(n,vec2(.47,.88));float F=8.;\n'+
' float ph=v*F+1.5*fbm(n*1.25+vec2(t*.045,-t*.035))+t*.06;float d=abs(fract(ph+.5)-.5)/(F*1.35);\n'+
' return ln(d,k*1.4)*(.3+.7*vn(n*1.8+vec2(-t*.14,t*.08)))*(1.+S*.3);}\n'+
// オーロラ: 縦に揺れるカーテン。上下はぼんやり消える
'float aur(vec2 n,float t,float k,float S){float F=9.;float ph=n.x*F+1.3*fbm(vec2(n.x*.7+t*.03,n.y*.8-t*.06))+.25*sin(n.y*3.+t*.5);\n'+
' float d=abs(fract(ph+.5)-.5)/F;float band=smoothstep(.08,.45,n.y)*smoothstep(1.02,.62,n.y);\n'+
' float ray=.4+.6*vn(vec2(ph*4.,t*.7+n.y*1.5));return ln(d,k*1.4)*band*ray*(1.+S*.4);}\n'+
'void main(){ivec2 ip=ivec2(gl_FragCoord.xy);int GX=int(u_grid.x);int L=ip.x/GX;int cx=ip.x-L*GX;\n'+
' float fl=float(L);vec2 off=vec2(fl/5.,fract(fl*2./5.));\n'+
' vec2 n=(vec2(float(cx),float(ip.y))+.5-off)*u_cell/u_H;float k=u_cell/u_H;\n'+
' float lw=u_law[L];float v=0.;float t=u_t+fl*31.7;\n'+
' if(lw<.5)v=rain(n,t,k,u_surge);else if(lw<1.5)v=wave(n,t,k,u_surge);else if(lw<2.5)v=wind(n,t,k,u_surge);\n'+
' else if(lw<3.5)v=crack(n,t,k,u_surge);else if(lw<4.5)v=swell(n,t,k,u_surge);else v=aur(n,t,k,u_surge);\n'+
' o=vec4(clamp(v*u_amp[L],0.,1.),0.,0.,1.);}');

// ---- 2) LEDの粒として光らせる。5枚の粒は1/5ずつずれて重なり、光は足し算。交わりだけを強く ----
var ledP=prog(VS,'#version 300 es\nprecision highp float;\n'+
'uniform sampler2D u_f;uniform vec2 u_grid;uniform float u_cell,u_surge;uniform vec3 u_col[5];out vec4 o;\n'+
'void main(){vec2 p=gl_FragCoord.xy;vec3 col=vec3(0.);float s=0.;float hum=0.;\n'+
' for(int L=0;L<5;L++){float fl=float(L);vec2 off=vec2(fl/5.,fract(fl*2./5.));vec2 q=p/u_cell+off;vec2 cid=floor(q);vec2 f=fract(q)-.5;\n'+
'  if(cid.x<0.||cid.y<0.||cid.x>=u_grid.x||cid.y>=u_grid.y)continue;\n'+
'  float v=texelFetch(u_f,ivec2(int(cid.x)+L*int(u_grid.x),int(cid.y)),0).r;\n'+
'  float dd=max(abs(f.x),abs(f.y))*2.;float m=smoothstep(.92,.62,dd);\n'+
'  s+=v*m;col+=v*m*u_col[L];hum+=m;}\n'+
' float g2=smoothstep(.6,1.6,s),g3=smoothstep(1.6,2.7,s);\n'+
' vec3 c=col*(.24+1.1*g2)+vec3(1.,.96,.9)*g3*(.7+.35*s);\n'+
' c+=vec3(.006,.007,.010)*hum*(1.+u_surge);\n'+   // 消えているLEDも、ほんのかすかに(膜がそこにあると分かる程度)
' o=vec4(c,1.);}');
var blurP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_tex;uniform vec2 u_step,u_inv;uniform float u_thr;out vec4 o;\n'+
'vec3 f(vec3 c){return max(c-u_thr,0.);}\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 s=f(texture(u_tex,uv).rgb)*.227;\n'+
' s+=(f(texture(u_tex,uv+u_step).rgb)+f(texture(u_tex,uv-u_step).rgb))*.194;\n'+
' s+=(f(texture(u_tex,uv+u_step*2.).rgb)+f(texture(u_tex,uv-u_step*2.).rgb))*.121;\n'+
' s+=(f(texture(u_tex,uv+u_step*3.).rgb)+f(texture(u_tex,uv-u_step*3.).rgb))*.054;\n'+
' s+=(f(texture(u_tex,uv+u_step*4.).rgb)+f(texture(u_tex,uv-u_step*4.).rgb))*.016;\n'+
' o=vec4(s,1.);}');
var compP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_a,u_b,u_c;uniform vec2 u_inv;out vec4 o;\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 c=texture(u_a,uv).rgb+texture(u_b,uv).rgb*.7+texture(u_c,uv).rgb*.9;\n'+
' c=c/(1.+max(c-.85,0.)*.65);o=vec4(c,1.);}');

var quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function mkRT(w,h,nearest){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  var fm=nearest?gl.NEAREST:gl.LINEAR;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,fm);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,fm);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);return {t:t,f:f,w:w,h:h};}

var RT=null,W=0,H=0,CELL=8,GX=1,GY=1,dpr=Math.min(2,window.devicePixelRatio||1),qscale=1;
function resize(){var s=dpr*qscale;W=Math.max(2,Math.round(innerWidth*s));H=Math.max(2,Math.round(innerHeight*s));cv.width=W;cv.height=H;
  CELL=Math.max(3,Math.round(4.2*W/innerWidth));GX=Math.ceil(W/CELL)+1;GY=Math.ceil(H/CELL)+1;
  if(RT)for(var k in RT){gl.deleteTexture(RT[k].t);gl.deleteFramebuffer(RT[k].f);}
  RT={fd:mkRT(GX*5,GY,true),sc:mkRT(W,H),q1:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),q2:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),e1:mkRT(Math.max(2,W>>3),Math.max(2,H>>3)),e2:mkRT(Math.max(2,W>>3),Math.max(2,H>>3))};}
addEventListener('resize',resize);resize();

// ---- 時間の流れ: 膜ごとの明るさの呼吸・山場・入れ替え ----
var amp=new Float32Array(5),lawU=new Float32Array(5),colU=new Float32Array(15),swap=[0,0,0,0,0],swapTo=[-1,-1,-1,-1,-1];
for(var i=0;i<5;i++){colU.set(COLS[i],i*3);}
var surge=0,surgeT=0,nextSurge=18,surgeLen=7,miniT=0;
function triggerSurge(len){surgeT=0;surgeLen=len||7;}
surgeT=99;
function step(t,dt){
  nextSurge-=dt;if(nextSurge<=0){triggerSurge(7);nextSurge=34+Math.random()*14;}
  surgeT+=dt;var sv=surgeT<surgeLen?Math.sin(Math.PI*Math.min(1,surgeT/surgeLen)):0;sv=sv*sv*(3-2*sv);
  miniT=Math.max(0,miniT-dt);surge=surgeFix?1:Math.max(sv,miniT>0?Math.sin(Math.PI*miniT/2.5)*.55:0);
  for(var L=0;L<5;L++){
    if(swapTo[L]>=0){swap[L]+=dt/1.2;if(swap[L]>=1&&swapTo[L]>=0&&swap[L]<2){var old=slotLaw[L];slotLaw[L]=swapTo[L];reserve=old;swap[L]=2;}
      if(swap[L]>=3.2){swap[L]=0;swapTo[L]=-1;}}
    var fade=swapTo[L]<0?1:(swap[L]<1?1-swap[L]:Math.min(1,(swap[L]-2)/1.2));
    var breath=.8+.2*Math.sin(t*(.05+L*.013)+L*1.9);
    amp[L]=(solo>=0&&solo!==L)?0:fade*Math.min(1.25,breath+surge*.6);lawU[L]=slotLaw[L];}
}
function pass(src,dst,sx,sy,thr){gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,dst.w,dst.h);gl.useProgram(blurP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(blurP.u.u_tex,0);
  gl.uniform2f(blurP.u.u_step,sx,sy);gl.uniform2f(blurP.u.u_inv,1/dst.w,1/dst.h);gl.uniform1f(blurP.u.u_thr,thr);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
var t0=performance.now(),last=t0,frames=0,acc=0;
function frame(now){
  var dt=Math.min(.1,(now-last)/1000);last=now;var t=(now-t0)/1000+40;
  step(t,dt);gl.bindVertexArray(vao);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.fd.f);gl.viewport(0,0,RT.fd.w,RT.fd.h);gl.useProgram(fieldP.p);
  gl.uniform2f(fieldP.u.u_grid,GX,GY);gl.uniform1f(fieldP.u.u_cell,CELL);gl.uniform1f(fieldP.u.u_H,H);gl.uniform1f(fieldP.u.u_t,t);gl.uniform1f(fieldP.u.u_surge,surge);
  gl.uniform1fv(fieldP.u['u_law[0]'],lawU);gl.uniform1fv(fieldP.u['u_amp[0]'],amp);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.sc.f);gl.viewport(0,0,W,H);gl.useProgram(ledP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.fd.t);gl.uniform1i(ledP.u.u_f,0);
  gl.uniform2f(ledP.u.u_grid,GX,GY);gl.uniform1f(ledP.u.u_cell,CELL);gl.uniform1f(ledP.u.u_surge,surge);gl.uniform3fv(ledP.u['u_col[0]'],colU);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  pass(RT.sc,RT.q1,2.5/W,0,.3);pass(RT.q1,RT.q2,0,2.5/RT.q1.h,0);pass(RT.q2,RT.e1,2/RT.q2.w,0,0);pass(RT.e1,RT.e2,0,2/RT.e1.h,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(compP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.sc.t);gl.uniform1i(compP.u.u_a,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.q2.t);gl.uniform1i(compP.u.u_b,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,RT.e2.t);gl.uniform1i(compP.u.u_c,2);
  gl.uniform2f(compP.u.u_inv,1/W,1/H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.activeTexture(gl.TEXTURE0);
  frames++;acc+=dt;if(frames===90){if(acc/90>.021&&qscale>.6){qscale*=.85;resize();}frames=0;acc=0;}
  requestAnimationFrame(frame);}
requestAnimationFrame(function(n){last=n;frame(n);});

var hintTimer=0;function showHint(h,ms){hintEl.innerHTML=h;hintEl.classList.add('on');clearTimeout(hintTimer);hintTimer=setTimeout(function(){hintEl.classList.remove('on');},ms);}
function nowNames(){return slotLaw.map(function(l){return NAMES[l];}).join(' / ');}
// タップ: 法則が1つ控えと入れ替わる(入れ替わり中の膜は選ばない)+小さな山場
addEventListener('pointerdown',function(e){if(window.APKit&&APKit.isUI&&APKit.isUI(e.clientX,e.clientY))return;
  var cand=[];for(var L=0;L<5;L++)if(swapTo[L]<0)cand.push(L);if(!cand.length)return;
  if(swapTo.some(function(x){return x>=0;}))return;
  var L2=cand[Math.floor(Math.random()*cand.length)];swapTo[L2]=reserve;swap[L2]=0;miniT=2.5;
  showHint(NAMES[slotLaw[L2]]+' → '+NAMES[reserve],2500);});
// 画面を消さない
var wl=null;function wake(){if(navigator.wakeLock&&!wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}
wake();document.addEventListener('visibilitychange',wake);addEventListener('pointerdown',wake);
APKit.init({canvas:cv,gifName:'crossing-laws-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  buttons:[{label:'1',name:'solo',onClick:function(){solo=solo>=4?-1:solo+1;showHint(solo<0?'5枚ぜんぶ':('膜'+(solo+1)+'枚目だけ: '+NAMES[slotLaw[solo]]),3000);}},
           {label:'✦',name:'surge',onClick:function(){triggerSurge(7);}}]});
showHint('5枚の膜が、別々の法則で光る<br>交わった所だけが明るく、3枚以上で白く<br>タップで法則が1つ入れ替わる',8000);
})();
</script>
</body>
</html>
