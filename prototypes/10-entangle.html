<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ENTANGLE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070708}body{touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,nodes=[],active=null,t=0;
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function add(px,py){nodes.push({x:px,y:py,ox:px,oy:py,phase:Math.random()*6.28});if(nodes.length>8)nodes.shift()}
function draw(){t+=.012;x.fillStyle="rgba(7,7,8,.18)";x.fillRect(0,0,W,H);for(let i=0;i<nodes.length;i++){let a=nodes[i];a.x+=(a.ox-a.x)*.004;a.y+=(a.oy-a.y)*.004+Math.sin(t+a.phase)*.08}
for(let i=0;i<nodes.length-1;i++){let a=nodes[i],b=nodes[i+1];x.beginPath();for(let k=0;k<=80;k++){let q=k/80,xx=a.x+(b.x-a.x)*q,yy=a.y+(b.y-a.y)*q,bul=Math.sin(q*Math.PI)*18*Math.sin(t*1.5+i);let dx=b.y-a.y,dy=-(b.x-a.x),len=Math.hypot(dx,dy)||1;xx+=dx/len*bul;yy+=dy/len*bul;x.lineTo(xx,yy)}x.strokeStyle=`hsla(${200+i*17},70%,65%,.42)`;x.lineWidth=1.1;x.stroke()}
for(const a of nodes){x.beginPath();x.arc(a.x,a.y,2.4,0,6.28);x.fillStyle="rgba(245,245,245,.7)";x.fill()}requestAnimationFrame(draw)}
c.addEventListener("pointerdown",e=>{add(e.clientX,e.clientY);active=nodes[nodes.length-1]});
c.addEventListener("pointermove",e=>{if(active){active.ox=e.clientX;active.oy=e.clientY}});
c.addEventListener("pointerup",()=>active=null);draw();
</script></body></html>
