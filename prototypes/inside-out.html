<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>INSIDE OUT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),g=c.getContext("2d");let d,W,H;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
let wounds=[];
function render(p=0){g.fillStyle="#050507";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<24;k++){g.beginPath();for(let i=0;i<=180;i++){let a=i*Math.PI*2/180,r=S*(.06+k*.025),x=Math.cos(a)*r,y=Math.sin(a)*r;for(let m of wounds){let dx=x+cx-m.x,dy=y+cy-m.y,q=Math.max(0,1-Math.hypot(dx,dy)/210);let z=Math.atan2(dy,dx);x+=Math.cos(z)*q*q*65*(m.flip?-1:1);y+=Math.sin(z)*q*q*65*(m.flip?-1:1)}let fold=Math.sin(a*(3+k%5)+p*3)*S*.012;x+=Math.cos(a+1.57)*fold;y+=Math.sin(a+1.57)*fold;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${190+k*5},85%,${55+k}%,${.05+k*.006})`;g.lineWidth=1.2;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;wounds.unshift({x,y,flip:true,h:Math.random()*360});wounds=wounds.slice(0,7)}c.addEventListener("pointerdown",e=>add(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)add(e.clientX,e.clientY)});function mutate(){wounds.forEach(m=>{m.flip=!m.flip;m.h=Math.random()*360})}function reset(){wounds=[]}APKit.init({canvas:c,gifName:"inside-out-loop",clockFormat:"spec",dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:"✦",name:"mutate",onClick:mutate},{label:"↻",name:"reset",onClick:reset}]});function loop(){render(performance.now()*.0001);requestAnimationFrame(loop)}loop();</script></body></html>
