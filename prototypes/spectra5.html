<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SPECTRA 5</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:13px system-ui}#bar{position:fixed;z-index:5;top:0;left:0;right:0;height:58px;display:flex;gap:6px;padding:7px;overflow-x:auto;background:rgba(0,0,0,.84);scrollbar-width:none}#bar::-webkit-scrollbar{display:none}button{flex:0 0 auto;height:44px;min-width:104px;border:1px solid #555;border-radius:7px;background:#111;color:#ddd;font-size:13px}button.on{background:#fff;color:#000;border-color:#fff}iframe{position:absolute;left:0;right:0;bottom:0;top:58px;width:100%;height:calc(100% - 58px);border:0}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['03','JULIA','spectra03-julia.html'],['06','DRAGON','spectra06-dragon.html'],['10','HILBERT','spectra10-hilbert.html'],['17','FLAME','spectra17-flame.html'],['18','MIRROR','spectra18-mirror.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');function go(i){stage.src=A[i][2];[...bar.children].forEach((b,j)=>b.classList.toggle('on',j===i));bar.children[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}A.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0]+' '+a[1];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{const i=A.findIndex(a=>stage.src.endsWith(a[2]));if(e.key==='ArrowRight')go((i+1)%A.length);if(e.key==='ArrowLeft')go((i+A.length-1)%A.length)});</script></body></html>
