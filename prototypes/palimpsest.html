<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PALIMPSEST</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}body{touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
// PALIMPSEST — ChatGPT作。触れた場所が「書き換え規則」になり、自己相似の膜全体を再構成する試作。
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,t=0,seed=Math.random()*9999,edits=[];const TAU=Math.PI*2;
function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function field(x,y){let X=x,Y=y;for(let k=0;k<4;k++){const a=Math.atan2(Y,X),r=Math.hypot(X,Y)+1e-6;for(const e of edits){const dx=X-e.x,dy=Y-e.y,d=Math.hypot(dx,dy),q=Math.exp(-d*d/(e.r*e.r));const turn=q*e.turn*(.75+.25*k);X-=dx*q*.16;Y-=dy*q*.16;const cs=Math.cos(turn),sn=Math.sin(turn),rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;X=e.x+rx;Y=e.y+ry}const n=Math.sin(a*(3+k)+r*7-t*.0007*(k+1))*.035;X+=Math.cos(a)*n;Y+=Math.sin(a)*n;X*=.79;Y*=.79}return[X,Y]}
function render(phase=null){const tt=phase===null?t:phase*1000;g.fillStyle='#050507';g.fillRect(0,0,W,H);const S=Math.min(W,H),cx=W/2,cy=H/2;g.save();g.translate(cx,cy);g.globalCompositeOperation='screen';for(let strand=0;strand<120;strand++){g.beginPath();for(let i=0;i<=180;i++){const q=i/180*2-1,a=strand/120*TAU+q*.75+Math.sin(strand*1.7)*.018,r=(.05+Math.abs(q)*.94)*S*.48;let x=Math.cos(a)*r,y=Math.sin(a)*r;[x,y]=field(x/S*2.1,y/S*2.1);x*=S*.46;y*=S*.46;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}const h=(strand*3.1+seed*.04+tt*.006)%360;g.strokeStyle=`hsla(${h},75%,${55+20*Math.sin(strand*.23)}%,${.035+strand%7*.004})`;g.lineWidth=.55+(strand%5)*.16;g.stroke()}for(const e of edits){for(let k=0;k<4;k++){g.beginPath();const rr=e.r*S*(1+k*.32);for(let i=0;i<=160;i++){const a=i/160*TAU,wob=Math.sin(a*(6+k*3)+tt*.0012+k)*rr*.035,x=e.x*S+Math.cos(a)*(rr+wob),y=e.y*S+Math.sin(a)*(rr+wob);if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=`hsla(${e.hue+k*18},90%,70%,${.08-k*.012})`;g.lineWidth=1.1-k*.12;g.stroke()}}g.restore()}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*2-1,y:(e.clientY-r.top)/r.height*2-1}}function touch(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;const p=pos(e),S=Math.min(W,H),r=.055+.018*Math.min(edits.length,8),turn=(Math.random()>.5?1:-1)*(.28+Math.random()*.32);edits.push({x:p.x*W/S,y:p.y*H/S,r,turn,hue:185+Math.random()*150});if(edits.length>9)edits.shift();return true}c.addEventListener('pointerdown',touch);let last=0;c.addEventListener('pointermove',e=>{if(!(e.buttons&1)||e.timeStamp-last<80)return;last=e.timeStamp;touch(e)});
function loop(){if(!APKit.isExporting())render();t+=1;requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'palimpsest-loop',clockFormat:'spec',loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9999;edits=[]}},{label:'↻',name:'reset',onClick:()=>{edits=[]}}]});loop();
</script></body></html>
