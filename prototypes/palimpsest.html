     近い文字から先に現れ、解説は読む順に後から書かれていく。
   ・次の言葉に進むと、前の言葉は消えずに紙へ沁みる(顔料の滲みと、文字の薄い跡)。
     紙は読んだ言葉の重ね書き=パリンプセストになっていく。古い沁みほど少しずつ薄れる。

     → 読み進めるほど紙が「系譜の地図」になり、その地図を触って次の言葉を選ぶ。
   ・長く押すほど、しずくは大きく深く沁み、その系譜の領土が広がる。

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const paper=document.createElement('canvas'), pctx=paper.getContext('2d');

let W=0,H=0,DPR=1;
let paperIdx=0, paperSeed=(Math.random()*1e9)|0;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cl=v=>v<0?0:v>1?1:v;
const ease=k=>k*k*(3-2*k);
const rgbs=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
function mix(a,b,k){return[Math.round(a[0]+(b[0]-a[0])*k),Math.round(a[1]+(b[1]-a[1])*k),Math.round(a[2]+(b[2]-a[2])*k)];}

function makePaper(){
  const p=PAPERS[paperIdx].c, rnd=mulberry(paperSeed);
  pctx.setTransform(DPR,0,0,DPR,0,0);
  pctx.fillStyle=rgbs(p,1);pctx.fillRect(0,0,W,H);
  const M=Math.max(W,H);
  for(let i=0;i<14;i++){
    const x=rnd()*W,y=rnd()*H,r=(0.2+rnd()*0.5)*M,lt=rnd()<0.5;
    const g=pctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,lt?'rgba(255,255,255,0.035)':'rgba(0,0,0,0.09)');g.addColorStop(1,'rgba(0,0,0,0)');
    pctx.fillStyle=g;pctx.fillRect(0,0,W,H);
  }
  const n=Math.round(W*H/420);
  pctx.lineCap='round';
  for(let i=0;i<n;i++){
    const x=rnd()*W,y=rnd()*H,a=rnd()*6.2832,l=6+rnd()*rnd()*46,b=(rnd()-0.5)*l*0.6;
    const ex=x+Math.cos(a)*l,ey=y+Math.sin(a)*l,mx=(x+ex)/2-Math.sin(a)*b,my=(y+ey)/2+Math.cos(a)*b;
    pctx.strokeStyle=rnd()<0.75?'rgba(235,238,255,'+(0.02+rnd()*0.05)+')':'rgba(0,0,0,'+(0.08+rnd()*0.1)+')';
    pctx.lineWidth=0.4+rnd()*0.7;
    pctx.beginPath();pctx.moveTo(x,y);pctx.quadraticCurveTo(mx,my,ex,ey);pctx.stroke();
  }
  const g=pctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.2,W/2,H/2,Math.hypot(W,H)*0.62);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.42)');
  pctx.fillStyle=g;pctx.fillRect(0,0,W,H);
  document.body.style.background=rgbs(p,1);
}

  makePaper();
  if(cur)relayout(cur);
}

/* ── ink bloom: self-similar drops (3 levels), edge = octave-doubling ripple ── */
const FREQ=[3,6,13,27], AMP=[0.10,0.06,0.034,0.02];
function node(x,y,r,delay,depth,rnd){
  const n={x,y,r,delay,ph:[rnd()*6.2832,rnd()*6.2832,rnd()*6.2832,rnd()*6.2832],kids:[]};
  const counts=[7,4,3];
  if(depth<3){
    const k=counts[depth]+Math.floor(rnd()*2),a0=rnd()*6.2832;
    for(let i=0;i<k;i++){
      const a=a0+i/k*6.2832+(rnd()-0.5)*0.9,d=r*(0.92+rnd()*0.6),kr=r*(0.14+rnd()*0.16);
      n.kids.push(node(x+Math.cos(a)*d,y+Math.sin(a)*d,kr,delay+0.3+rnd()*0.45,depth+1,rnd));
    }
  }
  return n;
}
function shapeR(n,th,w){let s=1;for(let k=0;k<4;k++)s+=AMP[k]*Math.sin(FREQ[k]*th+n.ph[k]+0.5*Math.sin(w+k*1.7));return s;}
function drawBloom(g,n,t,w,am,pc){
  const gr=t<n.delay?0:1-Math.exp(-(t-n.delay)/0.7);
  const rr=n.r*gr;
  if(rr>=0.6){
    const N=rr>40?84:rr>12?44:24;
    g.beginPath();
    for(let i=0;i<=N;i++){
      const th=i/N*6.2832,R=rr*shapeR(n,th,w),px=n.x+Math.cos(th)*R,py=n.y+Math.sin(th)*R;
      if(i)g.lineTo(px,py);else g.moveTo(px,py);
    }
    g.closePath();
    // watercolor: pale middle, pigment pooling toward the rim (coffee-ring)
    const gr2=g.createRadialGradient(n.x,n.y,0,n.x,n.y,rr*1.22);
    gr2.addColorStop(0,rgbs(pc,0.035*am));gr2.addColorStop(0.62,rgbs(pc,0.075*am));
    gr2.addColorStop(0.9,rgbs(pc,0.15*am));gr2.addColorStop(1,rgbs(pc,0.2*am));
    g.fillStyle=gr2;g.fill();
    g.lineWidth=Math.max(2,rr*0.06);g.strokeStyle=rgbs(pc,0.05*am);g.stroke();
    g.lineWidth=Math.max(0.7,rr*0.01);g.strokeStyle=rgbs(pc,0.22*am);g.stroke();
  }
  for(const k of n.kids)drawBloom(g,k,t,w,am,pc);
}

function isCJK(s){return /[\u3000-\u9fff\uff00-\uffef]/.test(s);}
function wrap(str,max){
  const out=[];let line=[];
  for(const ch of Array.from(str)){
    if(line.length>=max){
      if(NOSTART.indexOf(ch)>=0){line.push(ch);continue;}
      out.push(line.join(''));line=[];
    }
    line.push(ch);
  }
  if(line.length)out.push(line.join(''));
  return out;
}

const len=s=>Array.from(s).length;

function relayout(c){
  const q=c.q;
  const topM=Math.max(44,H*0.09),botM=Math.max(44,H*0.09),Hh=H-topM-botM;
  let fq=Math.max(22,Math.min(72,W*0.105,H*0.068)),L=null;
  for(let it=0;it<16;it++){
    const fe=Math.max(11.5,fq*0.36),fa=Math.max(12,fq*0.42);
    const qMax=Math.max(4,Math.floor(Hh*0.94/(fq*1.04)));
    const qcols=[].concat.apply([],q.q.split('／').map(s=>wrap(s,qMax)));
    const eMax=Math.max(8,Math.min(26,Math.floor((Hh-fq*1.6)/(fe*1.12))));
    const ecols=wrap(q.e,eMax);
    const aMax=Math.max(6,Math.floor((Hh-fq*1.3-fa*2)/(fa*1.06)));
    const acols=wrap(q.w,aMax);
    const hasO=!!q.o,oC=hasO&&isCJK(q.o);
    const ocols=oC?wrap(q.o,aMax):[];
    const qW=qcols.length*fq*1.5,aW=acols.length*fa*1.62,oW=hasO?(oC?ocols.length*fa*1.62:fa*1.7):0;
    const gap1=fq*0.62,gap2=fq*0.95,eW=ecols.length*fe*1.78;
    const total=qW+gap1+aW+oW+gap2+eW;
    L={fq,fe,fa,qcols,ecols,acols,ocols,oC,hasO,qW,aW,oW,gap1,gap2,eW,total};
    if(total<=W*0.9)break;
    fq*=0.93;
  }
  const items=[],xR=(W+L.total)/2;
  let qLenMax=0;
  L.qcols.forEach((s,i)=>{
    const cx=xR-L.fq*0.75-i*L.fq*1.5;qLenMax=Math.max(qLenMax,len(s));
    Array.from(s).forEach((ch,j)=>items.push(mk('q',ch,cx,topM+L.fq*0.55+j*L.fq*1.04,L.fq)));
  });
  const qBottom=topM+qLenMax*L.fq*1.04;
  const xa=xR-L.qW-L.gap1;
  let aLen=0;L.acols.forEach(s=>aLen=Math.max(aLen,len(s)));
  const ay=Math.max(topM+L.fq*1.3,qBottom-aLen*L.fa*1.06-L.fa*1.6);
  L.acols.forEach((s,i)=>{
    const cx=xa-L.fa*0.81-i*L.fa*1.62;
    Array.from(s).forEach((ch,j)=>items.push(mk('a',ch,cx,ay+L.fa*0.53+j*L.fa*1.06,L.fa)));
  });
  const lastLen=len(L.acols[L.acols.length-1]);
  items.push({kind:'seal',ch:PIG[q.f].seal,x:xa-L.fa*0.81-(L.acols.length-1)*L.fa*1.62,y:ay+lastLen*L.fa*1.06+L.fa*1.05,fs:L.fa*1.3,revealAt:null});
  const xo=xa-L.aW,oy=topM+L.fq*1.3;
  if(L.hasO){
    if(L.oC){
      L.ocols.forEach((s,i)=>{
        const cx=xo-L.fa*0.81-i*L.fa*1.62;
        Array.from(s).forEach((ch,j)=>items.push(mk('o',ch,cx,oy+L.fa*0.53+j*L.fa*1.06,L.fa)));
      });
    }else{
      let fo=L.fa*1.08;ctx.font=fontL(fo);
      const wd=ctx.measureText(q.o).width,maxW=Hh-L.fq*1.3;
      if(wd>maxW)fo*=maxW/wd;
      items.push({kind:'lat',ch:q.o,x:xo-L.fa*0.85,y:oy,fs:fo,revealAt:null});
    }
  }
  const xe=xo-L.oW-L.gap2;let idx=0;
  L.ecols.forEach((s,i)=>{
    const cx=xe-L.fe*0.89-i*L.fe*1.78;
    Array.from(s).forEach((ch,j)=>{const it=mk('e',ch,cx,topM+L.fq*1.6+L.fe*0.56+j*L.fe*1.12,L.fe);it.idx=idx++;items.push(it);});
  });
  let y0=Infinity,y1=-Infinity;
  for(const it of items){y0=Math.min(y0,it.y-it.fs*0.6);y1=Math.max(y1,it.y+(it.kind==='lat'?Math.min(Hh,it.fs*len(it.ch)*0.5):it.fs*0.6));}
  const shift=Math.max(0,(H-(y1-y0))*0.46-y0);
  if(shift>0)for(const it of items)it.y+=shift;
  if(c.items&&c.items.length===items.length)items.forEach((it,i)=>it.revealAt=c.items[i].revealAt);
  c.items=items;
  let md=0;for(const it of items)md=Math.max(md,Math.hypot(it.x-c.x,it.y-c.y));
  c.Rt=md/0.78+12;
}

function drawChar(g,it,x,y){
  if(it.rot){g.save();g.translate(x,y);g.rotate(Math.PI/2);g.fillText(it.ch,0,0);g.restore();}
  else if(it.tr)g.fillText(it.ch,x+it.fs*0.32,y-it.fs*0.3);
  else if(it.sm)g.fillText(it.ch,x+it.fs*0.08,y-it.fs*0.08);
  else g.fillText(it.ch,x,y);
}
function drawItems(o,gif,fade){
  const pc=PIG[o.fam].rgb;
  ctx.textAlign='center';ctx.textBaseline='middle';
  let lastFont='';
  for(const it of o.items){
    let k,k2;
    if(gif){k=1;k2=1;}
    else{if(it.revealAt==null)continue;k=cl((o.age-it.revealAt)/0.55);k2=cl((o.age-it.revealAt)/1.6);}
    const a=ease(k)*(1-fade);if(a<=0.003)continue;
    const dy=(1-ease(k))*it.fs*0.14+fade*10;
    if(it.kind==='seal'){
      const s=it.fs,x=it.x-s/2,y=it.y-s/2+dy;
      ctx.shadowBlur=0;ctx.globalAlpha=a*0.88;ctx.fillStyle=rgbs(pc,1);
      ctx.beginPath();
      if(ctx.roundRect)ctx.roundRect(x,y,s,s,s*0.14);else ctx.rect(x,y,s,s);
      ctx.fill();
      ctx.globalAlpha=a;ctx.fillStyle=rgbs(PAPERS[paperIdx].c,1);
      ctx.font=fontQ(s*0.64);lastFont='';
      ctx.fillText(it.ch,it.x,it.y+dy+s*0.02);
      continue;
    }
    if(it.kind==='lat'){
      ctx.shadowBlur=0;ctx.globalAlpha=a*0.62;ctx.fillStyle=rgbs(mix(pc,GOFUN,0.55+0.45*ease(k2)),1);
      ctx.font=fontL(it.fs);lastFont='';
      ctx.save();ctx.translate(it.x,it.y+dy);ctx.rotate(Math.PI/2);ctx.textAlign='left';ctx.fillText(it.ch,0,0);ctx.restore();
      ctx.textAlign='center';
      continue;
    }
    const base=it.kind==='q'?1:it.kind==='e'?0.8:0.62;
    const f=it.kind==='q'?fontQ(it.fs):fontE(it.fs);
    if(f!==lastFont){ctx.font=f;lastFont=f;}
    ctx.globalAlpha=a*base;
    ctx.fillStyle=rgbs(mix(pc,GOFUN,ease(k2)),1);
    if(!gif&&k2<1&&it.kind==='q'){ctx.shadowColor=rgbs(pc,0.9*(1-k2));ctx.shadowBlur=it.fs*0.6*(1-k2);}
    else ctx.shadowBlur=0;
    drawChar(ctx,it,it.x,it.y+dy);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

/* ── state ── */
let cur=null,outgoing=[],press=null,time=0;
const seen=new Set(),readCount={};
FAMS.forEach(f=>readCount[f]=0);
let stainToasts=0;

function leastRead(){
  let m=Infinity;FAMS.forEach(f=>m=Math.min(m,readCount[f]));
  const c=FAMS.filter(f=>readCount[f]===m&&!(cur&&cur.fam===f&&FAMS.length>1));
  const pool=c.length?c:FAMS.filter(f=>readCount[f]===m);
  return pool[Math.floor(Math.random()*pool.length)];
}
function famAt(x,y){
  try{
    const r=3,px=Math.floor(x*DPR)-r,py=Math.floor(y*DPR)-r;
    const d=sctx.getImageData(Math.max(0,px),Math.max(0,py),r*2+1,r*2+1).data;
    let sr=0,sg=0,sb=0,sa=0;
    for(let i=0;i<d.length;i+=4){const al=d[i+3];sr+=d[i]*al;sg+=d[i+1]*al;sb+=d[i+2]*al;sa+=al;}
    if(sa/(d.length/4)<22)return null;
    const c=[sr/sa,sg/sa,sb/sa];let best=null,bd=1e9;
    for(const f of FAMS){const p=PIG[f].rgb,dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(dd<bd){bd=dd;best=f;}}
    return best;
  }catch(_){return null;}
}
function pickQuote(fam){
  let pool=QUOTES.filter(q=>q.f===fam&&!seen.has(q)&&!(cur&&cur.q===q));
  if(!pool.length){
    QUOTES.forEach(q=>{if(q.f===fam)seen.delete(q);});
    pool=QUOTES.filter(q=>q.f===fam&&!(cur&&cur.q===q));
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function commit(c){
  const pc=PIG[c.fam].rgb,w=time*0.25;
  sctx.save();
  sctx.globalCompositeOperation='destination-out';sctx.fillStyle='rgba(0,0,0,0.05)';sctx.fillRect(0,0,W,H);
  sctx.restore();
  sctx.save();
  drawBloom(sctx,c.root,c.age,w,0.55,pc);
  try{sctx.filter='blur(2px)';}catch(_){}
  sctx.fillStyle=rgbs(pc,0.085);sctx.textAlign='center';sctx.textBaseline='middle';
  for(const it of c.items){
    if(it.kind!=='q'||it.revealAt==null)continue;
    sctx.font=fontQ(it.fs);drawChar(sctx,it,it.x,it.y);
  }
  try{sctx.filter='none';}catch(_){}
  sctx.restore();
}

function drop(x,y,fam,scale){
  if(cur){commit(cur);cur.fade=0;outgoing.push(cur);if(outgoing.length>3)outgoing.shift();}
  const q=pickQuote(fam);seen.add(q);readCount[fam]++;
  const P=Math.min(W,H)*0.22*scale;
  cur={q,fam,x,y,age:0,root:node(x,y,P,0,0,Math.random),items:null,Rt:0,fade:0};
  relayout(cur);
}

function updateReveal(c,w){
  const front=c.Rt*(1-Math.exp(-c.age/0.7));
  for(const it of c.items){
    if(it.revealAt!=null)continue;
    if(it.kind==='e'&&c.age<1.1+it.idx*0.02)continue;
    const dx=it.x-c.x,dy=it.y-c.y,d=Math.hypot(dx,dy);
    if(d<=front*shapeR(c.root,Math.atan2(dy,dx),w))it.revealAt=c.age;
  }
}

function render(w,gif){
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  ctx.drawImage(paper,0,0,W,H);
  ctx.globalCompositeOperation='screen';
  ctx.drawImage(stain,0,0,W,H);
  if(!gif)for(const o of outgoing)drawBloom(ctx,o.root,o.age,w,0.45*(1-o.fade),PIG[o.fam].rgb);
  if(cur)drawBloom(ctx,cur.root,gif?Math.max(cur.age,6):cur.age,w,1,PIG[cur.fam].rgb);
  ctx.globalCompositeOperation='source-over';
  if(!gif)for(const o of outgoing)drawItems(o,false,o.fade);
  if(cur)drawItems(cur,gif,0);
  if(press&&!gif){
    const pc=PIG[press.fam].rgb,r=5+Math.min(1,press.t/1.4)*18;
    ctx.beginPath();ctx.arc(press.x,press.y,r,0,6.2832);
    ctx.fillStyle=rgbs(pc,0.35);ctx.fill();
    ctx.lineWidth=1.2;ctx.strokeStyle=rgbs(pc,0.85);ctx.stroke();
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const exp=window.APKit&&APKit.isExporting&&APKit.isExporting();
  if(!exp){
    time+=dt;
    const w=time*0.25;
    if(cur){cur.age+=dt;updateReveal(cur,w);}
    for(const o of outgoing){o.age+=dt;o.fade=Math.min(1,o.fade+dt/1.1);}
    outgoing=outgoing.filter(o=>o.fade<1);
    if(press)press.t+=dt;
    render(w,false);
  }
  requestAnimationFrame(frame);
}

/* ── input ── */
const hint=document.getElementById('hint');
let hintShown=false,hintTimer=null;
function hideHint(){hint.classList.remove('on');if(hintTimer){clearTimeout(hintTimer);hintTimer=null;}}
function say(m){if(window.APKit&&APKit.toast)APKit.toast(m,2400);}

cv.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  if(press)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const sf=famAt(e.clientX,e.clientY);
  if(sf&&stainToasts<3){stainToasts++;say(PIG[sf].pig+'の沁み ─ '+PIG[sf].name+'から');}
  press={id:e.pointerId,x:e.clientX,y:e.clientY,fam:sf||leastRead(),t:0};
  hintShown=true;hideHint();
});
cv.addEventListener('pointermove',e=>{if(press&&press.id===e.pointerId){press.x=e.clientX;press.y=e.clientY;}});
cv.addEventListener('pointerup',e=>{
  if(!press||press.id!==e.pointerId)return;
  const p=press;press=null;
  drop(p.x,p.y,p.fam,1+Math.min(1,p.t/1.4)*0.75);
});
cv.addEventListener('pointercancel',e=>{if(press&&press.id===e.pointerId)press=null;});

function mutate(){
  const n=PAPERS.length;
  paperIdx=(paperIdx+1+Math.floor(Math.random()*(n-1)))%n;
  paperSeed=(Math.random()*1e9)|0;
  makePaper();
  say('紙を'+PAPERS[paperIdx].name+'に替えた(沁みはそのまま)');
}
function resetAll(){
  sctx.clearRect(0,0,W,H);
  seen.clear();FAMS.forEach(f=>readCount[f]=0);
  outgoing=[];cur=null;press=null;
  drop(W*0.6,H*0.4,FAMS[Math.floor(Math.random()*FAMS.length)],1.1);
  say('まっさらな紙に戻した');
}

let rt=null;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,150);});
resize();
drop(W*0.6,H*0.4,FAMS[Math.floor(Math.random()*FAMS.length)],1.1);
requestAnimationFrame(frame);

hintTimer=setTimeout(()=>{
  if(hintShown)return;
  hint.classList.add('on');
  hintTimer=setTimeout(hideHint,9000);
},3200);

addEventListener('load',()=>{
  if(!document.fonts||!document.fonts.load)return;
  const jp=QUOTES.map(q=>q.q+q.w+q.e+(isCJK(q.o)?q.o:'')).join('')+'漢和古聖欧英';
  document.fonts.load('700 40px "Shippori Mincho B1"',jp).catch(()=>{});
  document.fonts.load('500 20px "Shippori Mincho B1"',jp).catch(()=>{});
  document.fonts.load('italic 20px "EB Garamond"',QUOTES.map(q=>q.o).join('')).then(()=>{if(cur)relayout(cur);}).catch(()=>{});
});

if(window.APKit)APKit.init({
  canvas:cv,
  gifName:'palimpsest-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  // GIF: the current saying is shown fully written; only the ink edges breathe (periodic in phase).
  loopFrame:function(phase){render(phase,true);},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
</body>
