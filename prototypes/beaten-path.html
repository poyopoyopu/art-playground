<!DOCTYPE html>
<!-- BEATEN PATH — Claude(クロちゃん)作。自然のフラクタル・シリーズ5(稲妻)。MORPHING FERN の光の粒の描き方を下地にした。ap-kit.js統合: Claude -->
<!-- 世界のルール: 稲妻は、前の稲妻が通った道を選ぶ(一度通った空気は電気を通しやすくなり、その跡はゆっくりしか消えない)。
     だから同じ所に何度も落とすと、ばらばらだった枝が1本の太い道にまとまっていく。指でなぞると、その道を先に通しておける
     (次の稲妻はなぞった道を選ぶ)。稲妻は枝から枝、その枝からまた枝と、同じ分かれ方を何段もくり返す。
     タップ=そこへ落とす、長押し=雲に電気をためる(離すと、ためた分だけ大きく枝分かれして落ちる)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BEATEN PATH — 稲妻は、前の稲妻が通った道を選ぶ</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #dfe4ff; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 14px rgba(120, 140, 255, .55); }
  #hint.on { opacity: .72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ そこへ落とす。稲妻は前に通った道を選ぶ<br>なぞる ＝ 道を先に通しておく ／ 長押し ＝ 雲に電気をためる</div>
<script>
/* ======== 光の粒エンジン(自然のフラクタル・シリーズ共通) ========
   MORPHING FERN の描き方(粒を溜めて少しずつ消す)を作品ごとに使えるようにしたもの。
   作品側は plot(api) で粒を打つだけ。色は作品ごとのグラデーションを24段に分けて、まとめて描く。 */
var NF = (function () {
  'use strict';
  var TAU = Math.PI * 2;

  function run(work) {
    var cvs = document.getElementById('c');
    var hint = document.getElementById('hint');
    var ctx = cvs.getContext('2d', { alpha: false, desynchronized: true });
    var acc = document.createElement('canvas');
    var actx = acc.getContext('2d', { alpha: false, desynchronized: true });

    var W = 0, H = 0, DPR = 1, RES_CAP = 2200000, MAXDT = 0.05;
    var NB = 24, CAP = 26000;
    var dx = new Float32Array(CAP), dy = new Float32Array(CAP), dc = new Uint8Array(CAP);
    var ox = new Float32Array(CAP), oy = new Float32Array(CAP);
    var cnt = 0, counts = new Int32Array(NB * 2), starts = new Int32Array(NB * 2);
    var fills = [], fillsHi = [], rgbs = [];

    /* ---- 色: 作品のグラデーションから24段 ---- */
    function setPalette(stops, alphaLo, alphaHi) {
      fills = []; fillsHi = []; rgbs = [];
      for (var i = 0; i < NB; i++) {
        var t = i / (NB - 1), k = 0;
        while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
        var a = stops[k], b = stops[k + 1];
        var u = Math.max(0, Math.min(1, (t - a[0]) / Math.max(1e-6, b[0] - a[0])));
        var r = Math.round(a[1] + (b[1] - a[1]) * u), g = Math.round(a[2] + (b[2] - a[2]) * u), bl = Math.round(a[3] + (b[3] - a[3]) * u);
        rgbs.push([r, g, bl]);
        fills.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaLo + ')');
        fillsHi.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaHi + ')');
      }
    }

    /* ---- 発光スプライト(色ごとに作って使い回す) ---- */
    var spriteCache = {};
    function spriteFor(c) {
      var i = Math.max(0, Math.min(NB - 1, Math.round(c * (NB - 1))));
      var key = i + ':' + rgbs[i].join(',');
      if (spriteCache[key]) return spriteCache[key];
      var s = document.createElement('canvas'); s.width = s.height = 64;
      var g2 = s.getContext('2d'), rgb = rgbs[i];
      var gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.12, 'rgba(' + rgb + ',0.5)');
      gr.addColorStop(0.34, 'rgba(' + rgb + ',0.13)');
      gr.addColorStop(0.66, 'rgba(' + rgb + ',0.035)');
      gr.addColorStop(1, 'rgba(' + rgb + ',0)');
      g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
      spriteCache[key] = s;
      return s;
    }

    var api = {
      W: 0, H: 0, min: 1, now: 0, dt: 0, quality: 2, TAU: TAU,
      ptr: { x: 0, y: 0, down: false, held: 0, drag: false },
      /* 粒を1つ打つ。c=色(0..1)、hi=明るい段 */
      dot: function (x, y, c, hi) {
        if (cnt >= CAP) return;
        if (x < -4 || y < -4 || x > W + 4 || y > H + 4) return;
        var i = (c * (NB - 1) + 0.5) | 0;
        if (i < 0) i = 0; else if (i >= NB) i = NB - 1;
        dx[cnt] = x * DPR; dy[cnt] = y * DPR; dc[cnt] = hi ? i + NB : i; cnt++;
      },
      /* にじむ光(溜める層へ) */
      glow: function (x, y, r, c, a) {
        var pa = actx.globalAlpha;
        actx.globalCompositeOperation = 'lighter';
        actx.globalAlpha = a;
        actx.drawImage(spriteFor(c), (x - r) * DPR, (y - r) * DPR, r * 2 * DPR, r * 2 * DPR);
        actx.globalAlpha = pa;
      },
      /* にじむ光(その場だけ、溜めない) */
      flare: function (x, y, r, c, a) {
        var pa = ctx.globalAlpha;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.drawImage(spriteFor(c), x - r, y - r, r * 2, r * 2);
        ctx.globalAlpha = pa;
      },
      clear: function () {
        actx.setTransform(1, 0, 0, 1, 0, 0);
        actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
        actx.fillStyle = '#000'; actx.fillRect(0, 0, acc.width, acc.height);
      },
      palette: setPalette,
      rand: Math.random,
      hideHint: function () { hint.classList.remove('on'); }
    };

    function resize() {
      var w = cvs.clientWidth || window.innerWidth;
      var h = cvs.clientHeight || window.innerHeight;
      if (w === W && h === H && cvs.width > 1) return;
      W = w; H = h;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      if (w * h * DPR * DPR > RES_CAP) DPR = Math.max(1, Math.sqrt(RES_CAP / (w * h)));
      cvs.width = Math.max(1, Math.round(w * DPR));
      cvs.height = Math.max(1, Math.round(h * DPR));
      acc.width = cvs.width; acc.height = cvs.height;
      api.W = W; api.H = H; api.min = Math.min(W, H);
      api.clear();
      if (work.resize) work.resize(api);
    }

    /* ---- 操作: 押した瞬間 / 短く離す=タップ / 押したまま=長押し / 動かす=なぞる ---- */
    var p = api.ptr, downAt = 0, sx = 0, sy = 0, lx = 0, ly = 0, pid = null, holding = false;
    function toXY(e) { var r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cvs.addEventListener('pointerdown', function (e) {
      if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
      if (pid !== null) return;
      pid = e.pointerId;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
      var q = toXY(e);
      p.x = sx = lx = q.x; p.y = sy = ly = q.y; p.down = true; p.held = 0; p.drag = false; holding = false;
      downAt = performance.now();
      if (api.now > 1.2) api.hideHint();
      if (work.down) work.down(api, q.x, q.y);
      e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pid) return;
      var q = toXY(e);
      p.x = q.x; p.y = q.y;
      if (!p.drag && !holding && Math.hypot(q.x - sx, q.y - sy) > 12) p.drag = true;
      if (p.drag && work.drag) work.drag(api, q.x, q.y, q.x - lx, q.y - ly);
      lx = q.x; ly = q.y;
    }, { passive: true });
    function up(e) {
      if (e.pointerId !== pid) return;
      pid = null;
      var q = toXY(e), t = (performance.now() - downAt) / 1000;
      p.down = false;
      if (holding) { if (work.release) work.release(api, q.x, q.y, p.held); }
      else if (!p.drag && t < 0.4) { if (work.tap) work.tap(api, q.x, q.y); }
      else if (p.drag && work.dragEnd) work.dragEnd(api, q.x, q.y);
      holding = false; p.drag = false; p.held = 0;
    }
    cvs.addEventListener('pointerup', up);
    cvs.addEventListener('pointercancel', up);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(cvs);
    window.addEventListener('resize', function () { setTimeout(resize, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', function () { last = 0; });

    /* ---- 描画 ---- */
    var floorT = 0;
    function clearResidue() {
      actx.save();
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalAlpha = 1;
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'lighter'; actx.fillStyle = 'rgb(1,1,1)'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.restore();
    }
    function flush() {
      var i, k;
      counts.fill(0);
      for (i = 0; i < cnt; i++) counts[dc[i]]++;
      var s = 0;
      for (k = 0; k < NB * 2; k++) { starts[k] = s; s += counts[k]; }
      var pos = starts.slice();
      for (i = 0; i < cnt; i++) { var b = dc[i], j = pos[b]++; ox[j] = dx[i]; oy[j] = dy[i]; }
      actx.globalCompositeOperation = 'lighter';
      actx.globalAlpha = 1;
      var sz = Math.max(1, DPR * 1.05), szH = Math.max(1.4, DPR * 1.45);
      for (k = 0; k < NB * 2; k++) {
        if (!counts[k]) continue;
        var hi = k >= NB, z = hi ? szH : sz;
        actx.fillStyle = hi ? fillsHi[k - NB] : fills[k];
        var e = starts[k] + counts[k];
        for (i = starts[k]; i < e; i++) actx.fillRect(ox[i], oy[i], z, z);
      }
      cnt = 0;
    }

    var last = 0, perfAcc = 0, perfN = 0;
    function frame(ts) {
      if (!last) last = ts;
      var dt = (ts - last) / 1000; last = ts;
      if (dt > MAXDT) dt = MAXDT;
      if (dt < 0.0005) dt = 0.0005;
      api.now += dt; api.dt = dt;
      if (p.down && !p.drag) {
        var t = (performance.now() - downAt) / 1000;
        if (!holding && t >= 0.4) { holding = true; if (work.holdStart) work.holdStart(api, p.x, p.y); }
        if (holding) { p.held += dt; if (work.hold) work.hold(api, p.x, p.y, dt); }
      }
      if (work.update) work.update(api, dt);

      var fadeA = 1 - Math.exp(-(work.fade || 1.25) * dt);
      if (fadeA < 0.001) fadeA = 0.001;
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
      actx.fillStyle = 'rgba(0,0,0,' + fadeA.toFixed(5) + ')';
      actx.fillRect(0, 0, acc.width, acc.height);
      floorT += dt;
      if (floorT >= 0.05) { floorT = 0; clearResidue(); }

      work.plot(api);
      flush();

      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      if (work.background) work.background(api, ctx); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(acc, 0, 0, acc.width, acc.height, 0, 0, W, H);
      if (work.overlay) work.overlay(api, ctx);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

      perfAcc += dt * 1000; perfN++;
      if (perfN >= 90) { if (perfAcc / perfN > 26 && api.quality === 2) api.quality = 1; perfAcc = 0; perfN = 0; }
      requestAnimationFrame(frame);
    }

    api.ctx = ctx;
    if (work.init) work.init(api);
    resize();
    setTimeout(function () { hint.classList.add('on'); }, 550);
    setTimeout(api.hideHint, 7500);
    requestAnimationFrame(frame);
    window.__api = api;

    if (window.APKit) {
      window.APKit.init({
        canvas: cvs,
        gifName: work.name,
        clockFormat: 'spec',
        dock: true,
        autoHide: true,
        fullscreenButton: false,
        buttons: [
          { label: '✦', name: 'mutate', onClick: function () { work.mutate(api); } },
          { label: '↻', name: 'reset', onClick: function () { api.clear(); work.reset(api); } }
        ]
      });
    }
    return api;
  }
  return { run: run };
})();

(function () {
  'use strict';
  var CS = 7, cols = 0, rows = 0, cond = null, trail = [];
  var bolts = [], flash = 0, charge = 0, auto = 2.5, cloudY = 0, step = 7, hueSet = 0;

  function condAt(x, y) {
    var i = (x / CS) | 0, j = (y / CS) | 0;
    if (i < 0 || j < 0 || i >= cols || j >= rows) return 0;
    return cond[j * cols + i];
  }
  function ionize(x, y, v) {
    var i = (x / CS) | 0, j = (y / CS) | 0, a, b;
    for (a = -1; a <= 1; a++) for (b = -1; b <= 1; b++) {
      var ii = i + a, jj = j + b;
      if (ii < 0 || jj < 0 || ii >= cols || jj >= rows) continue;
      var k = jj * cols + ii, w = (a || b) ? v * 0.35 : v;
      cond[k] = Math.min(3, cond[k] + w);
    }
  }

  /* 先駆けの放電: 何本かの候補のうち「目的地へ向かう度合い + 通りやすさ + 偶然」が一番高い方へ進む */
  function walk(api, x, y, dirA, tx, ty, depth, maxSteps, power, segs, main) {
    var a = dirA, s, K = 7;
    for (s = 0; s < maxSteps; s++) {
      var to = main ? Math.atan2(ty - y, tx - x) : dirA;
      var best = a, bs = -1e9, k;
      for (k = 0; k < K; k++) {
        var ca = a + (Math.random() - 0.5) * 1.5;
        var nx = x + Math.cos(ca) * step, ny = y + Math.sin(ca) * step;
        var sc = Math.cos(ca - to) * (main ? 1.1 : 0.8) + condAt(nx, ny) * 1.25 + Math.random() * 0.95;
        if (sc > bs) { bs = sc; best = ca; }
      }
      a = best;
      var len = step * (0.7 + Math.random() * 0.7);
      var x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      segs.push(x, y, x2, y2, depth);
      x = x2; y = y2;
      if (x < -20 || x > api.W + 20 || y > api.H + 10) break;
      if (main && (Math.hypot(tx - x, ty - y) < step * 1.6 || y > ty + step)) { segs.push(x, y, tx, ty, depth); break; }
      /* 枝分かれ(同じ分かれ方を何段も): 通りやすい所ほど枝が出やすい */
      var pb = (0.05 + 0.05 * power + 0.03 * condAt(x, y)) / (1 + depth * 0.9);
      if (depth < 4 && Math.random() < pb) {
        var side = Math.random() < 0.5 ? -1 : 1;
        var ba = a + side * (0.35 + Math.random() * 0.6);
        walk(api, x, y, ba, 0, 0, depth + 1, (8 + Math.random() * 30 * (1 + power)) / (1 + depth * 0.6), power, segs, false);
      }
    }
  }
  function strike(api, tx, ty, power) {
    var ox;
    /* 雲のどこから出るかも、前の道に引っぱられる */
    var bestX = tx + (Math.random() - 0.5) * api.W * 0.5, bc = -1;
    for (var k = 0; k < 9; k++) {
      var cx = Math.max(10, Math.min(api.W - 10, tx + (Math.random() - 0.5) * api.W * 0.7));
      var c = condAt(cx, cloudY + step * 2) * 2 + Math.random();
      if (c > bc) { bc = c; bestX = cx; }
    }
    ox = bestX;
    var segs = [];
    walk(api, ox, cloudY, Math.PI / 2, tx, ty, 0, 900, power, segs, true);
    var L = 0, i;
    for (i = 0; i < segs.length; i += 5) {
      var d = segs[i + 4];
      L += Math.hypot(segs[i + 2] - segs[i], segs[i + 3] - segs[i + 1]) * (d === 0 ? 3 : 1 / (1 + d));
      ionize(segs[i + 2], segs[i + 3], d === 0 ? 0.9 : 0.25 / (1 + d));
    }
    bolts.push({ s: segs, L: L, t: 0, tx: tx, ty: ty, p: power });
    if (bolts.length > 14) bolts.shift();
    flash = Math.min(1.2, flash + 0.7 + power * 0.4);
  }

  var work = {
    name: 'beaten-path',
    fade: 3.4,
    init: function (api) {
      api.palette([[0, 26, 14, 70], [0.28, 96, 40, 170], [0.5, 90, 110, 255], [0.7, 150, 210, 255], [0.86, 220, 240, 255], [1, 255, 255, 255]], 0.36, 0.75);
    },
    resize: function (api) {
      cols = Math.ceil(api.W / CS) + 1; rows = Math.ceil(api.H / CS) + 1;
      cond = new Float32Array(cols * rows);
      step = Math.max(5, api.min * 0.018);
      cloudY = api.H * 0.1;
      bolts = []; trail = [];
    },
    tap: function (api, x, y) { if (y < cloudY + 30) y = cloudY + 30; strike(api, x, y, 0); },
    drag: function (api, x, y, dx, dy) {          /* なぞった所を先に電気が通りやすくしておく */
      var n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 4)), i;
      for (i = 0; i < n; i++) { var px = x - dx * i / n, py = y - dy * i / n; ionize(px, py, 0.5); trail.push(px, py, api.now); }
      if (trail.length > 3000) trail.splice(0, trail.length - 3000);
    },
    dragEnd: function (api, x, y) { if (y > cloudY + 30) strike(api, x, y, 0.3); },
    hold: function (api, x, y, dt) { charge = Math.min(1, charge + dt / 2.5); },
    release: function (api, x, y) {
      if (y < cloudY + 30) y = cloudY + 30;
      var p = charge; charge = 0;
      strike(api, x, y, p * 1.6);
      if (p > 0.6) setTimeout(function () { strike(api, x + (Math.random() - 0.5) * 40, y, p); }, 140);
    },
    mutate: function (api) {                      /* 雷の色(放電する空気)を変える */
      var sets = [
        [[0, 26, 14, 70], [0.28, 96, 40, 170], [0.5, 90, 110, 255], [0.7, 150, 210, 255], [0.86, 220, 240, 255], [1, 255, 255, 255]],
        [[0, 60, 10, 40], [0.3, 170, 30, 120], [0.52, 255, 80, 180], [0.72, 255, 170, 230], [0.88, 255, 230, 250], [1, 255, 255, 255]],
        [[0, 10, 40, 40], [0.3, 20, 140, 120], [0.52, 60, 230, 200], [0.72, 170, 255, 230], [0.88, 230, 255, 245], [1, 255, 255, 255]],
        [[0, 50, 20, 6], [0.3, 170, 70, 20], [0.52, 255, 150, 50], [0.72, 255, 210, 130], [0.88, 255, 240, 210], [1, 255, 255, 255]]
      ];
      hueSet = (hueSet + 1 + ((Math.random() * (sets.length - 1)) | 0)) % sets.length;
      api.palette(sets[hueSet], 0.36, 0.75);
      strike(api, api.W * (0.2 + Math.random() * 0.6), api.H * (0.6 + Math.random() * 0.3), 0.5);
    },
    reset: function (api) { cond.fill(0); bolts = []; trail = []; flash = 0; },
    update: function (api, dt) {
      var k = Math.exp(-dt / 28), i;               /* 通った跡は30秒ほどかけて消える */
      for (i = 0; i < cond.length; i++) cond[i] *= k;
      for (i = 0; i < bolts.length; i++) bolts[i].t += dt;
      while (bolts.length && bolts[0].t > 40) bolts.shift();
      flash = Math.max(0, flash - dt * 3.2);
      auto -= dt;
      if (auto <= 0 && !api.ptr.down) {
        auto = 3 + Math.random() * 4.5;
        strike(api, api.W * (0.12 + Math.random() * 0.76), api.H * (0.78 + Math.random() * 0.12), Math.random() * 0.4);
      }
      while (trail.length && api.now - trail[2] > 6) trail.splice(0, 3);
    },
    plot: function (api) {
      var budget = api.quality === 2 ? 9000 : 5200, b, i;
      for (b = 0; b < bolts.length; b++) {
        var B = bolts[b], a = B.t, s = B.s;
        /* 光り方: 最初の一撃 + 2回の返し(ちらつき) → あとは跡 */
        var I = Math.exp(-a * 9) + (a > 0.11 ? 0.7 * Math.exp(-(a - 0.11) * 11) : 0) + (a > 0.27 ? 0.45 * Math.exp(-(a - 0.27) * 10) : 0);
        var ghost = 0.05 * Math.exp(-a / 14);
        var n = Math.min(budget * 0.7, B.L * (I * 3.2 + ghost * 2));
        var nseg = s.length / 5;
        for (i = 0; i < n; i++) {
          var j = ((Math.random() * nseg) | 0) * 5, d = s[j + 4];
          if (d > 0 && Math.random() > 1 / (1 + d * 1.3)) continue;        /* 細い枝ほど粒が少ない */
          var t = Math.random(), x = s[j] + (s[j + 2] - s[j]) * t, y = s[j + 1] + (s[j + 3] - s[j + 1]) * t;
          var w = d === 0 ? 1.6 + 1.2 * B.p : 0.7;
          x += (Math.random() - 0.5) * w; y += (Math.random() - 0.5) * w;
          var c = I > ghost ? Math.min(1, (d === 0 ? 0.62 : 0.42 - d * 0.06) + I * 0.38) : 0.18 + 0.12 * Math.random();
          api.dot(x, y, c, d === 0 && I > 0.4);
        }
        if (a < 0.4) {
          api.glow(B.tx, B.ty, api.min * (0.08 + 0.06 * B.p), 0.85, 0.35 * I);
          for (i = 0; i < 6; i++) { var q = ((Math.random() * nseg) | 0) * 5; if (s[q + 4] === 0) api.glow(s[q + 2], s[q + 3], api.min * 0.06, 0.6, 0.1 * I); }
        }
      }
      /* なぞった道(電気が通りやすくなった跡) */
      for (i = 0; i < trail.length; i += 3) {
        var age = api.now - trail[i + 2];
        if (Math.random() < 0.5) api.dot(trail[i] + (Math.random() - 0.5) * 3, trail[i + 1] + (Math.random() - 0.5) * 3, 0.32 * (1 - age / 6) + 0.1, false);
      }
    },
    background: function (api, ctx) {
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, api.W, api.H);
      /* 雲の底: ふだんはうっすら、光ると照らされる。ためると内側から光る */
      var g = ctx.createLinearGradient(0, 0, 0, cloudY * 2.6);
      var f = Math.min(1, flash), q = charge;
      g.addColorStop(0, 'rgba(' + Math.round(26 + 90 * f + 40 * q) + ',' + Math.round(28 + 90 * f + 20 * q) + ',' + Math.round(52 + 140 * f + 90 * q) + ',1)');
      g.addColorStop(0.55, 'rgba(' + Math.round(10 + 40 * f) + ',' + Math.round(10 + 40 * f) + ',' + Math.round(24 + 80 * f + 40 * q) + ',0.8)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, api.W, cloudY * 2.6);
      if (f > 0.02) { ctx.fillStyle = 'rgba(120,130,255,' + (0.06 * f).toFixed(3) + ')'; ctx.fillRect(0, 0, api.W, api.H); }
    },
    overlay: function (api, ctx) {
      if (charge > 0.02) {
        var p = api.ptr;
        api.flare(p.x, cloudY, api.min * (0.2 + 0.3 * charge), 0.55, 0.25 * charge * (0.8 + 0.2 * Math.sin(api.now * 40)));
        api.flare(p.x, p.y, api.min * 0.05, 0.8, 0.3 * charge);
      }
    }
  };
  NF.run(work);
})();
</script>
