<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNOT — CIRCUIT LAW</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#888;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  KNOT — CIRCUIT LAW / Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: 虹色のガラス管が絡み合う画像(おっちゃん提供)

  世界のルール — 「光は順番に流れ、触れた場所が新しい順番を決める」:
  管の中を光が流れている。光は結び目を1周ぐるりと回るのではなく、
  管を12の区間に分けた「順番」に従って、区間から区間へ飛び移りながら進む。
  触れた場所が新しい光の入口になり、そこを起点に順番が組み直される。
  つまり触るたびに、光がどこからどこへ渡るかという配線そのものが変わる。
  同じ形なのに、光の走り方だけが別物になっていく。順番は元に戻らない。
*/
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}
  return {p,u}}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const NS=12;   /* 区間の数 */

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float k,hue,flow;
uniform float pf,qf,qinv;
uniform float R,r2,tube;
uniform float ord[${NS}];   /* 各区間が、光の通る何番目か */
uniform float rewire;       /* 配線が組み変わった直後の光り 0..1 */

const float TAU=6.28318530718;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 pal(float x){return 0.5+0.5*cos(TAU*(x+vec3(0.0,0.33,0.67)));}

float knot(vec3 p,out float u){
  float ang=atan(p.z,p.x);
  vec2 cs=vec2(length(p.xz)-R,p.y);
  cs*=rot(ang*qf/pf);
  float a2=atan(cs.y,cs.x);
  float sec=TAU/pf;
  float idx=floor((a2+sec*0.5)/sec);
  float a3=a2-idx*sec;
  float L=length(cs);
  vec2 cf=L*vec2(cos(a3),sin(a3));
  float m=mod(idx*qinv,pf);
  u=fract((ang/TAU+m)/pf+1.0);
  return length(cf-vec2(r2,0.0));
}
float map(vec3 p){
  float u;
  return (knot(p,u)-tube)*0.45;
}
vec3 nrm(vec3 p){
  vec2 e=vec2(1.0,-1.0)*0.0016;
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx));
}
/* その場所を、いま光が通っているか。区間ごとの順番で決まる */
float lit(float u){
  float f=fract(u)*float(${NS});
  int i=int(floor(f));
  float o=ord[i];
  float d=fract(flow-o/float(${NS}));
  float head=exp(-d*d*260.0)+exp(-(1.0-d)*(1.0-d)*260.0);
  /* 区間の中でも、頭から順に明るくなる */
  float inner=smoothstep(0.0,0.35,1.0-abs(fract(f)-fract(flow*float(${NS}))));
  return head*(0.55+0.45*inner);
}
vec3 env(vec3 d){
  float a=atan(d.z,d.x);
  vec3 c=vec3(0.015,0.02,0.045);
  c+=vec3(0.18,0.5,1.0)*pow(max(0.0,sin(a+1.0)*0.5+0.5),6.0)*(0.55+0.45*d.y);
  c+=vec3(1.0,0.55,0.16)*pow(max(0.0,cos(a*1.3-0.5)*0.5+0.5),12.0);
  c+=vec3(0.75,0.3,1.0)*pow(max(0.0,sin(a*0.7-2.0)*0.5+0.5),8.0);
  c+=vec3(1.0)*pow(max(0.0,d.y),26.0)*1.6;
  return c;
}
/* 背景は真っ黒。光っているのは管の中を流れる光だけ */
vec3 bg(vec2 uv){
  return vec3(0.0);
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 ro=vec3(0.0,0.06*sin(k*2.0),-3.6),rd=normalize(vec3(uv,1.8));
  mat2 Rm=rot(k);
  ro.xz*=Rm; rd.xz*=Rm;
  ro.yz*=rot(0.32); rd.yz*=rot(0.32);

  float t=0.1;bool hit=false;
  for(int i=0;i<130;i++){
    vec3 p=ro+rd*t;float d=map(p);
    if(d<0.0012*t){hit=true;break;}
    t+=d; if(t>9.0)break;
  }

  vec3 col=bg(uv);
  if(hit){
    vec3 p=ro+rd*t,n=nrm(p);
    float u;knot(p,u);
    float fres=pow(1.0-max(dot(n,-rd),0.0),3.5);
    vec3 rr=refract(rd,n,0.72);
    if(dot(rr,rr)<0.001)rr=reflect(rd,n);
    vec3 ip=p-n*0.01;float thick=0.0;float uu=u;
    for(int i=0;i<10;i++){
      float d=map(ip);
      if(d>-0.001)break;
      float st=max(0.02,-d);
      ip+=rr*st;thick+=st;
    }
    knot(ip,uu);   /* 管の反対側の位置。光は管の奥からも透けて見える */
    float ph=thick*9.0+dot(n,vec3(0.6,0.4,0.7))*1.8;
    vec3 iri=0.5+0.5*cos(vec3(ph,ph*1.08+0.9,ph*1.18+1.9));
    vec3 base=pal(hue+u*0.5+0.1*n.y);
    col=base*iri*0.34;
    col+=env(reflect(rd,n))*(0.22+0.8*fres);
    col+=vec3(1.0)*pow(max(dot(reflect(rd,n),normalize(vec3(0.4,0.9,-0.4))),0.0),60.0)*1.0;
    /* 流れている光。手前と奥の両方が光る */
    float e=lit(u)+lit(uu)*0.55;
    col+=pal(hue+0.15+u*0.4)*e*(1.1+1.6*thick);
    col+=vec3(1.0,0.95,0.9)*e*e*0.5;
    col+=pal(hue+0.6)*rewire*(0.3+fres);
    col*=1.0-0.05*t;
  }
  col=pow(max(col,0.0),vec3(0.86));
  O=vec4(col,1.0);
}`;
const P=prog(FS),U=P.u;

/* ---------- 状態 ---------- */
let W=0,H=0,DPR=1,paused=false;
let hue=Math.random();
let R=1.0,r2=0.42,tube=0.20;
let pq=[2,3],qinv=1;
let flow=0,rewire=0;
const ord=new Float32Array(NS);

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.4);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR));
}
window.addEventListener('resize',resize);resize();

function egcdInv(a,m){for(let i=1;i<m;i++)if((a*i)%m===1)return i;return 1}
const KNOTS=[[2,3],[2,5],[3,4],[3,5],[2,7]];

/* 入口の区間から始めて、残りの区間を飛び飛びに繋いでいく = 配線 */
function rewireFrom(start){
  const left=[];
  for(let i=0;i<NS;i++)if(i!==start)left.push(i);
  ord[start]=0;
  let cur=start,n=1;
  while(left.length){
    /* 近い区間ほど渡りやすいが、たまに遠くへ飛ぶ(交差での飛び移り) */
    let pick=0,best=1e9;
    const jump=Math.random()<0.35;
    left.forEach((v,i)=>{
      let d=Math.abs(v-cur);d=Math.min(d,NS-d);
      const score=jump?-d+Math.random()*2:d+Math.random()*1.5;
      if(score<best){best=score;pick=i}
    });
    cur=left.splice(pick,1)[0];
    ord[cur]=n++;
  }
  rewire=1;
}
function seedWorld(){
  pq=KNOTS[Math.floor(Math.random()*KNOTS.length)];
  hue=Math.random();r2=0.38+Math.random()*0.10;tube=0.18+Math.random()*0.05;
  flow=0;rewireFrom(0);rewire=0;
}
seedWorld();

/* 画面の指の位置 → 結び目の上の位置 */
function knotJS(x,y,z){
  const ang=Math.atan2(z,x);
  const cx=Math.hypot(x,z)-R, cy=y;
  const a=ang*pq[1]/pq[0],ca=Math.cos(a),sa=Math.sin(a);
  const rx=cx*ca-cy*sa, ry=cx*sa+cy*ca;
  const a2=Math.atan2(ry,rx),sec=2*Math.PI/pq[0];
  const idx=Math.floor((a2+sec*0.5)/sec);
  const a3=a2-idx*sec,L=Math.hypot(rx,ry);
  const fx=L*Math.cos(a3)-r2, fy=L*Math.sin(a3);
  const m=((idx*qinv)%pq[0]+pq[0])%pq[0];
  const u=(((ang/(2*Math.PI)+m)/pq[0])%1+1)%1;
  return {d:Math.hypot(fx,fy),u};
}
function pick(px,py){
  let du=(2*px-W)/H, dv=(H-2*py)/H;
  let d=[du,dv,1.8];
  const L=Math.hypot(d[0],d[1],d[2]);d=[d[0]/L,d[1]/L,d[2]/L];
  let o=[0,0.06*Math.sin(phase*2),-3.6];
  const cs=Math.cos(phase),sn=Math.sin(phase);
  const rotXZ=a=>[a[0]*cs-a[2]*sn,a[1],a[0]*sn+a[2]*cs];
  o=rotXZ(o);d=rotXZ(d);
  const c2=Math.cos(0.32),s2=Math.sin(0.32);
  const rotYZ=a=>[a[0],a[1]*c2-a[2]*s2,a[1]*s2+a[2]*c2];
  o=rotYZ(o);d=rotYZ(d);
  let t=0.1;
  for(let i=0;i<110;i++){
    const p=[o[0]+d[0]*t,o[1]+d[1]*t,o[2]+d[2]*t];
    const q=knotJS(p[0],p[1],p[2]);
    const dd=(q.d-tube)*0.45;
    if(dd<0.0015*t)return q.u;
    t+=dd; if(t>9)break;
  }
  return null;
}

let ptr=null,lastRe=0;
function touchAt(px,py){
  const u=pick(px,py);
  if(u===null)return;
  const now=performance.now();
  if(now-lastRe<260)return;   /* 連続で組み変わりすぎないように */
  lastRe=now;
  rewireFrom(Math.floor(u*NS)%NS);
  flow=0;                      /* 触れた場所が新しい入口になる */
  hue=(hue+0.06)%1;
}
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId};touchAt(e.clientX,e.clientY);
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  touchAt(e.clientX,e.clientY);
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

function render(kk){
  gl.useProgram(P.p);
  gl.viewport(0,0,c.width,c.height);
  gl.uniform2f(U.res,c.width,c.height);
  gl.uniform1f(U.k,kk);
  gl.uniform1f(U.hue,hue);
  gl.uniform1f(U.flow,flow);
  gl.uniform1f(U.rewire,rewire);
  qinv=egcdInv(pq[1]%pq[0]||1,pq[0]);
  gl.uniform1f(U.pf,pq[0]);gl.uniform1f(U.qf,pq[1]);gl.uniform1f(U.qinv,qinv);
  gl.uniform1f(U.R,R);gl.uniform1f(U.r2,r2);gl.uniform1f(U.tube,tube);
  gl.uniform1fv(U.ord,ord);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

let phase=0,last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){
    phase=(phase+dt*0.18)%(Math.PI*2);
    flow=(flow+dt*0.22)%1;
    rewire=Math.max(0,rewire-dt*1.6);
    render(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'knot-circuit-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  /* 光の流れもループ位相に合わせて1周させる */
  loopFrame:function(ph){paused=true;flow=ph/(Math.PI*2);render(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 結び目の形と色を引き直す。配線(光の順番)はそのまま残る */
      pq=KNOTS[Math.floor(Math.random()*KNOTS.length)];
      r2=0.34+Math.random()*0.16;tube=0.15+Math.random()*0.09;hue=Math.random();
    }},
    {label:'↻',name:'reset',onClick:function(){seedWorld();}}
  ]
});
</script>
</body></html>
