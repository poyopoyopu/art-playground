<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MIRROR BITE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020408}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let d,W,H,bites=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function render(p=0){g.fillStyle='#020408';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<15;k++){g.beginPath();for(let i=0;i<=120;i++){let a=i/120*Math.PI*2,x=Math.cos(a)*S*(.12+k*.045),y=Math.sin(a)*S*(.12+k*.045);for(let m of bites){let dx=x+cx-m.x,dy=y+cy-m.y,z=Math.max(0,1-Math.hypot(dx,dy)/170);x-=dx*z*(.28+.08*Math.sin(p*2+k));y-=dy*z*(.28+.08*Math.sin(p*2+k))}g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${195+k*9},70%,${55+k*2}%,${.12+k*.01})`;g.lineWidth=1.5;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;bites.unshift({x,y});bites=bites.slice(0,7)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));APKit.init({canvas:c,gifName:'MIRROR-BITE-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>bites.reverse()},{label:'↻',name:'reset',onClick:()=>bites=[]}]});function loop(){render(performance.now()*.00015);requestAnimationFrame(loop)}loop();</script></body></html>
