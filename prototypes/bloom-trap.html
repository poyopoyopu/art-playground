<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BLOOM TRAP</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020604}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),g=c.getContext("2d");let d,W,H;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();let traps=[];function render(p=0){g.fillStyle="#020604";g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let t of traps){for(let j=0;j<7;j++){g.beginPath();let pts=90+j*13;for(let i=0;i<=pts;i++){let u=i/pts,a=u*6.283+j*.83+p*.25,r=(8+u*(S*.32+t.growth*20))*(1+.16*Math.sin(u*18+j));let pull=Math.max(0,1-Math.hypot(Math.cos(a)*r+t.x-W/2,Math.sin(a)*r+t.y-H/2)/220);a+=pull*t.spin*2;r*=1-pull*.35;g.lineTo(t.x+Math.cos(a)*r,t.y+Math.sin(a)*r)}g.strokeStyle=`hsla(${70+j*34},85%,65%,.18)`;g.lineWidth=1+j*.45;g.stroke()}}}function add(x,y){if(APKit.isUI(x,y))return;traps.push({x,y,growth:Math.random()*2,spin:(Math.random()-.5)*2});if(traps.length>5)traps.shift()}c.addEventListener("pointerdown",e=>add(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)add(e.clientX,e.clientY)});function mutate(){traps.forEach(t=>{t.spin=(Math.random()-.5)*4;t.growth=Math.random()*5})}function reset(){traps=[]}APKit.init({canvas:c,gifName:"bloom-trap-loop",clockFormat:"spec",dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:"✦",name:"mutate",onClick:mutate},{label:"↻",name:"reset",onClick:reset}]});function loop(){render(performance.now()*.0001);requestAnimationFrame(loop)}loop();</script></body></html>
