<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LIGHT 20</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font:12px system-ui}#bar{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;gap:6px;padding:8px;overflow:auto;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}button{flex:0 0 auto;border:1px solid #444;background:#111;color:#ddd;padding:7px 10px;border-radius:4px}button.on{background:#fff;color:#000}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;padding-top:42px}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['RIBBON','light01-ribbon.html'],['STREAM','light02-stream.html'],['GRIDWARP','light03-gridwarp.html'],['ORBITAL','light04-orbital.html'],['BURST','light05-burst.html'],['REFLECT','light06-reflect.html'],['TUNNEL','light07-tunnel.html'],['RAIN','light08-rain.html'],['SPIRAL','light09-spiral.html'],['WAVE','light10-wave.html'],['CROSS','light11-cross.html'],['CELL','light12-cell.html'],['COMET','light13-comet.html'],['HALO','light14-halo.html'],['MATRIX','light15-matrix.html'],['VORTEX','light16-vortex.html'],['DRIFT','light17-drift.html'],['SPARK','light18-spark.html'],['PRISM','light19-prism.html'],['NEBULA','light20-nebula.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');A.forEach((a,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+a[0];b.onclick=()=>{stage.src=a[1];document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};bar.appendChild(b)});bar.firstChild.click();addEventListener('keydown',e=>{let n=+e.key;if(n>=1&&n<=9)bar.children[n-1].click();if(e.key==='0')bar.children[9].click();if(e.key==='ArrowRight')stage.src=A[(A.findIndex(x=>stage.src.endsWith(x[1]))+1)%20][1];if(e.key==='ArrowLeft')stage.src=A[(A.findIndex(x=>stage.src.endsWith(x[1]))+19)%20][1]});</script></body></html>
