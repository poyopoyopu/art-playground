<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LIGHT 8</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font:13px system-ui;-webkit-tap-highlight-color:transparent}#bar{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 10px;overflow-x:auto;overflow-y:hidden;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}#bar::-webkit-scrollbar{display:none}button{flex:0 0 auto;min-height:44px;border:1px solid #555;background:#111;color:#ddd;padding:0 15px;border-radius:8px;font:600 13px system-ui;white-space:nowrap;touch-action:manipulation}button.on{background:#fff;color:#000;border-color:#fff}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['01 RIBBON','light01-ribbon.html'],['02 STREAM','light02-stream.html'],['03 GRIDWARP','light03-gridwarp.html'],['06 REFLECT','light06-reflect.html'],['07 TUNNEL','light07-tunnel.html'],['08 RAIN','light08-rain.html'],['15 MATRIX','light15-matrix.html'],['18 SPARK','light18-spark.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');function go(i){stage.src=A[i][1];document.querySelectorAll('button').forEach(x=>x.classList.remove('on'));bar.children[i].classList.add('on');bar.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}A.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{let n=+e.key;if(n>=1&&n<=8)go(n-1);if(e.key==='ArrowRight')go((A.findIndex(x=>stage.src.endsWith(x[1]))+1)%A.length);if(e.key==='ArrowLeft')go((A.findIndex(x=>stage.src.endsWith(x[1]))+A.length-1)%A.length)});</script></body></html>
