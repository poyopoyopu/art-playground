<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SEA SPARKLE — 切られた光は、渦になって止まらない</title>
<!-- SEA SPARKLE — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/21 試作
     おっちゃんが候補4つから「③夜光虫の波打ち際」「④ビスマス結晶」が気になる、と選んだうちの③。
     題材: 夜光虫(ノクチルカ。英名 sea sparkle)。刺激されると青く光り、その光が刺激になって隣も光る。
     一度光った所はしばらく光れない(不応期)。
     世界のルール: 光は隣へ伝わり、光った所はしばらく光れない。だから光の波を途中で切ると、
       切り口の端が行き場を失って巻きこみ、らせんの波になって回り続ける(触った所が新しい中心になる)。
       何もしなくても: 沖(画面の上)から光の波がときどき寄せてくる
       タップ = そこに光の輪   長押し = 輪が次々に生まれる
       なぞる = 指の下の光を消して、しばらく光れなくする(=光の波を切る)。光っている波を切ると、切り口から渦が生まれる
       ✦ = 別の夜(光の色と、波の太さ・速さが変わる。今ある渦はそのまま)
       ↻ = 暗い海に戻す
     仕組み: Barkleyモデル(興奮性媒体の反応拡散)。u=光、v=疲れ(不応)。格子は1マス約3px(スマホ幅で130×280ほど)。
     描画: Canvas 2D。格子を小さな画像にして拡大+縮小を重ねた光のにじみ+光っている所に夜光虫の粒をちらす。
     2026/10/21 v2: おっちゃんのiPhone実機スクショで「キラキラしてないね」→ なめらかな光の帯を0.4倍に抑え、
       光の絵に「黒地に白い粒の模様」を掛け合わせて、光っている所だけ無数の粒が光るように。模様は3コマごとに位置と種類が
       入れかわって粒がまたたく。明るい所の粒には、ときどき十字のきらめき。
     2026/10/21 v3: おっちゃん「これで完成なの？」→ 足りない3点(海に見えない・光り方が均一・光りっぱなし)を
       「ドローンで真上から撮った夜光虫の浜辺」に寄せて直す(おっちゃん「やってくれ」)。
       ・画面の下を砂浜に。波打ち際はゆるく曲がり、光の波が届くと波が砂に駆け上がって(遡上)青く光り、引いていく
       ・夜光虫の濃さに場所ごとのムラ(ゆっくり流れる)。濃い所ほど強く光り、薄い所は暗い
       ・疲れ: 光るほど暗くなり、休むと戻る(光の明るさだけ。波の伝わり方=渦のルールは変えない)。渦の中は少し暗く脈打つ
       ・砂を踏む(タップ/なぞる)と、打ち上げられた夜光虫が足あとの形にまたたく(本物の浜でも起きる)。濡れた砂ほど強い
     2026/10/21 v4: おっちゃん「一回切るともうループなのは砂浜の意味がないなー」→ 潮の流れ(岸向きの移流)を足した。
       渦は回りながら岸へ流され、砂浜に着くと消える(打ち上がる)。渦は永遠ではなく、生まれてから岸に着くまでの命になった。
       世界のルール(v4): 光の波を切ると渦が生まれ、回り続ける。でも潮が渦ごと岸へ運び、砂浜に打ち上げて終わらせる。
       ※夜光虫は本物では隣の光で光らない。渦の法則はBZ反応や心臓の電気の波など「興奮性の媒質」の本物の法則を借りた架空の海
     2026/10/21 v5: おっちゃんの実機スクショで「重くはないけど、綺麗だけどつまんない」→ 原因は「放っておくと何も起きない」
       (画面の8割が暗い海で、渦は自分で切らないと見られない)。おっちゃん「両方」で、海が自分で動く仕掛けを2つ足した。
       足したルール: 強くかき回された夜光虫は一瞬で光り切って、しばらく光れなくなる(=指でなぞるのと同じく、光の波を切る)
       ・岩: 海の中ほどに2〜3個。光の波が岩の裏まで回りこむと、岩の裏の渦潮が光を散らして波を切る → 岩の下から渦が生まれる
       ・魚: エイ1匹と小魚の群れが泳ぐ。通った所の夜光虫が光り切って暗い筋が残り、そこを光の波が通ると切れて渦になる
       ・なぞった所も一瞬またたいてから暗くなる(切ったことが目で分かるように) -->
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#01040a;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

#hint.off{opacity:0}
#toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);color:rgba(214,240,255,.95);font:500 13px/1.6 system-ui,sans-serif;letter-spacing:.16em;text-shadow:0 1px 8px rgba(0,0,0,.9);pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap}
#toast.on{opacity:1}
</style>

<body>
<canvas id="c"></canvas>
<div id="hint">海をタップで光の輪 · 光る波をサッと切ると渦になる<br>岩や魚も波を切る · 渦は潮に流され砂浜で消える</div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
var W=1,H=1,DPR=1, CELL=3, GW=1, GH=1, GP=1;   // GP = 外周1マスを足した横幅
var u,v,un, small, sctx, img, glowS, gsctx, gimg, b1,b1c,b2,b2c,b3,b3c;
var sand, en, sandN, shore, wetW, dens, DW=1, DH=1, DPAD=48;   // 砂のマス・疲れ・砂の粒・波打ち際の行・濃さのムラ

/* ---------- 夜(✦で切りかわる) ---------- */
var NIGHTS=[   // どれも「切ると渦が残る」範囲(b小さめ)で選んでいる
  {name:'青い夜',      a:0.75, b:0.02, eps:0.020, speed:3.4, tint:[40,140,255], core:[190,235,255]},
  {name:'水色の夜',    a:0.80, b:0.02, eps:0.015, speed:3.2, tint:[30,220,255], core:[205,250,255]},
  {name:'緑がかる夜',  a:0.60, b:0.02, eps:0.020, speed:3.6, tint:[40,255,170], core:[210,255,235]},
  {name:'すみれ色の夜', a:0.75, b:0.03, eps:0.018, speed:3.4, tint:[110,120,255], core:[225,225,255]},
  {name:'細い波の夜',  a:0.85, b:0.01, eps:0.012, speed:3.0, tint:[50,170,255], core:[200,240,255]}
];
var nightI=0, night=NIGHTS[0];
var DX=0.4, DT=0.026, simAcc=0, simT=0;   // DXを大きめにして、渦の大きさを画面に合わせている
var DRIFT=1.5;   // 潮の速さ(空間単位/時間)。渦の芯はスマホ幅でおよそ15px/秒で岸へ流れ、画面の上の方で生まれた渦も30秒ほどで岸に着く

function setup(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  CELL=Math.max(3,Math.round(Math.sqrt(W*H/36000)));
  var ow=GW, oh=GH, ou=u, ov=v, x, y;
  GW=Math.ceil(W/CELL); GH=Math.ceil(H/CELL); GP=GW+2;
  var N=GP*(GH+2);
  u=new Float32Array(N); v=new Float32Array(N); un=new Float32Array(N);
  if(ou){ // サイズ変更時は近いマスを引きつぐ
    var op=ow+2;
    for(y=0;y<GH;y++)for(x=0;x<GW;x++){
      var sx=Math.min(ow-1,Math.floor(x*ow/GW)), sy=Math.min(oh-1,Math.floor(y*oh/GH));
      u[(y+1)*GP+x+1]=ou[(sy+1)*op+sx+1]; v[(y+1)*GP+x+1]=ov[(sy+1)*op+sx+1];
    }
  }
  // 波打ち際(行)。縦長は下から22%、横長は26%が砂浜
  var frac=H>W?0.78:0.74, ph1=Math.random()*6.28, ph2=Math.random()*6.28;
  shore=new Float32Array(GW); wetW=new Float32Array(GW);
  for(x=0;x<GW;x++){ shore[x]=GH*frac+4*Math.sin(x*0.045+ph1)+2.2*Math.sin(x*0.11+ph2); wetW[x]=0.7+0.3*Math.sin(x*0.08+ph2*1.7); }
  sand=new Uint8Array(N); en=new Float32Array(N); sandN=new Float32Array(N);
  for(y=0;y<GH;y++)for(x=0;x<GW;x++){ var ii=(y+1)*GP+x+1; en[ii]=1; sandN[ii]=Math.random(); if(y>=shore[x]){ sand[ii]=1; u[ii]=0; v[ii]=0; } }
  makeRocks();   // sand=2 が岩(光らない・伝えないマス)
  makeFish();
  makeDensity();
  small=document.createElement('canvas'); small.width=GW; small.height=GH; sctx=small.getContext('2d'); img=sctx.createImageData(GW,GH);
  glowS=document.createElement('canvas'); glowS.width=GW; glowS.height=GH; gsctx=glowS.getContext('2d'); gimg=gsctx.createImageData(GW,GH);
  function mk(div){ var c=document.createElement('canvas'); c.width=Math.max(2,Math.ceil(GW/div)); c.height=Math.max(2,Math.ceil(GH/div)); return c; }
  b1=mk(2); b1c=b1.getContext('2d'); b2=mk(4); b2c=b2.getContext('2d'); b3=mk(8); b3c=b3.getContext('2d');
  sp=document.createElement('canvas'); sp.width=cv.width; sp.height=cv.height; spc=sp.getContext('2d');
  spH=document.createElement('canvas'); spH.width=Math.ceil(cv.width/3); spH.height=Math.ceil(cv.height/3); spHc=spH.getContext('2d');
  texA=makeSpeckle(cv.width+TEXPAD,cv.height+TEXPAD); texB=makeSpeckle(cv.width+TEXPAD,cv.height+TEXPAD);
}

/* ---------- 夜光虫の濃さのムラ: なめらかなノイズ2段。ゆっくり流れる ---------- */
function makeDensity(){
  DW=GW+DPAD*2; DH=GH+DPAD*2; dens=new Float32Array(DW*DH);
  function layer(cell,amp){
    var cw=Math.ceil(DW/cell)+2, ch=Math.ceil(DH/cell)+2, L=new Float32Array(cw*ch);
    for(var i=0;i<L.length;i++) L[i]=Math.random();
    for(var y=0;y<DH;y++)for(var x=0;x<DW;x++){
      var fx=x/cell, fy=y/cell, ix=fx|0, iy=fy|0, tx=fx-ix, ty=fy-iy;
      tx=tx*tx*(3-2*tx); ty=ty*ty*(3-2*ty);
      var a=L[iy*cw+ix], b=L[iy*cw+ix+1], c=L[(iy+1)*cw+ix], d=L[(iy+1)*cw+ix+1];
      dens[y*DW+x]+=amp*((a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty);
    }
  }
  layer(26,0.65); layer(9,0.35);
  // 継ぎ目が格子に見えないよう、ぼかしを3回
  var tmp=new Float32Array(dens.length);
  for(var r=0;r<3;r++){
    for(var y=0;y<DH;y++)for(var x=0;x<DW;x++){ var a=0,n=0; for(var k=-3;k<=3;k++){ var xx=x+k; if(xx<0||xx>=DW) continue; a+=dens[y*DW+xx]; n++; } tmp[y*DW+x]=a/n; }
    for(y=0;y<DH;y++)for(x=0;x<DW;x++){ a=0;n=0; for(k=-3;k<=3;k++){ var yy=y+k; if(yy<0||yy>=DH) continue; a+=tmp[yy*DW+x]; n++; } dens[y*DW+x]=a/n; }
  }
  for(var i=0;i<dens.length;i++){ var q=(dens[i]-0.3)/0.4; q=q<0?0:(q>1?1:q); dens[i]=0.12+0.88*q*q*(3-2*q); }
}

/* ---------- 夜光虫の粒: 黒地に白い点をちらした模様。光の絵と掛け合わせると、光っている所の点だけが光る ---------- */
var sp,spc,spH,spHc,texA,texB,TEXPAD=96,texOff=[0,0],texUse=0,texTick=0;
function makeSpeckle(w,h){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d'), im=g.createImageData(w,h), d=im.data, n=w*h;
  for(var i=3;i<n*4;i+=4) d[i]=255;
  var dots=Math.round(n/(70*DPR)), s=Math.max(1,Math.round(DPR));
  for(var k=0;k<dots;k++){
    var x=(Math.random()*(w-2))|0, y=(Math.random()*(h-2))|0, v=Math.random()<0.7? 150+Math.random()*105 : 255;
    var big=Math.random()<0.18? s+1 : s;               // ときどき少し大きい粒
    for(var yy=0;yy<big;yy++)for(var xx=0;xx<big;xx++){
      var j=((y+yy)*w+x+xx)*4, vv=(xx===0||yy===0)?v:v*0.6;
      if(d[j]<vv){ d[j]=vv; d[j+1]=vv; d[j+2]=vv; }
    }
  }
  g.putImageData(im,0,0); return c;
}

/* ---------- Barkleyモデル ---------- */
function step(){
  var a=night.a, b=night.b, ie=1/night.eps, k=1/(DX*DX), dt=DT;
  var adv=DRIFT/DX;   // 潮の流れ(岸=下向き)。光も疲れも同じ速さで運ばれるので、渦はまるごと岸へ流れる
  var i, x, y, row;
  // 外周は鏡写し(光が壁で跳ね返らず、外へ抜けるようにふるまう)
  // v(疲れ)も上の端を鏡写しにする(潮の流れの計算で上の外側を見るため)。
  // 2026/10/21 v5: これが抜けていて、上の端のマスは「外から疲れていない水が流れこむ」扱いになり、
  // 一度光ると疲れずに光りっぱなし→下へ波を出し続けて海が光で埋まることがあった
  for(x=1;x<=GW;x++){ u[x]=u[GP+x]; u[(GH+1)*GP+x]=u[GH*GP+x]; v[x]=v[GP+x]; }
  for(y=0;y<GH+2;y++){ row=y*GP; u[row]=u[row+1]; u[row+GW+1]=u[row+GW]; }
  for(y=1;y<=GH;y++){
    row=y*GP;
    for(x=1;x<=GW;x++){
      i=row+x;
      // 砂(1)は光らない。岩(2)の下は普通の海として計算する(光は岩の下をくぐって裏で閉じる。見た目は岩が上から隠す)。
      // 岩を「光らない穴」にすると、渦が岩に引っかかって永遠に回り続け、海が光で埋まってしまうため
      if(sand[i]===1){ un[i]=0; continue; }
      var uu=u[i], vv=v[i];
      var lap=(u[i-1]+u[i+1]+u[i-GP]+u[i+GP]-4*uu)*k;
      var th=(vv+b)/a;
      var nu=uu+dt*(uu*(1-uu)*(uu-th)*ie+lap-adv*(uu-u[i-GP]));
      un[i]= nu<0?0:(nu>1?1:nu);
      v[i]=vv+dt*(uu-vv-adv*(vv-v[i-GP]));
    }
  }
  var t=u; u=un; un=t;
}

/* ---------- 刺激 ---------- */
function excite(cx,cy,r,onlyRested){ // 画面座標
  var gx=cx/CELL, gy=cy/CELL, R=r, R2=R*R;
  var x0=Math.max(0,Math.floor(gx-R)), x1=Math.min(GW-1,Math.ceil(gx+R));
  var y0=Math.max(0,Math.floor(gy-R)), y1=Math.min(GH-1,Math.ceil(gy+R));
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
    var dx=x+0.5-gx, dy=y+0.5-gy; if(dx*dx+dy*dy>R2) continue;
    var i=(y+1)*GP+x+1;
    if(sand[i]) continue;
    if(onlyRested && v[i]>0.16) continue;
    if(u[i]<0.95) u[i]=0.95;
  }
}
function cut(cx,cy,r){ cutCells(cx/CELL,cy/CELL,r); }
function cutCells(gx,gy,r){ // 光を消して、しばらく光れなくする(マス座標)
  var R2=r*r;
  var x0=Math.max(0,Math.floor(gx-r)), x1=Math.min(GW-1,Math.ceil(gx+r));
  var y0=Math.max(0,Math.floor(gy-r)), y1=Math.min(GH-1,Math.ceil(gy+r));
  for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
    var dx=x+0.5-gx, dy=y+0.5-gy; if(dx*dx+dy*dy>R2) continue;
    var i=(y+1)*GP+x+1;
    u[i]=0; if(v[i]<2.4) v[i]=2.4;
  }
}
// 沖から寄せる光の波: 上の端をゆるく波打つ線で光らせる
var nextSea=0.8, seaPhase=0, noSea=false;
function offshoreRested(){ // 沖(上の端の数行)がほぼ休んでいるか。疲れた所に半端に波を起こすと、それが新しい渦の種になってしまう
  var c=0,n=0; for(var y=0;y<6&&y<GH;y++)for(var x=0;x<GW;x+=2){ var i=(y+1)*GP+x+1; n++; if(v[i]<0.16&&u[i]<0.1) c++; }
  return n? c/n>0.97 : true;
}
function seaWave(){
  seaPhase=Math.random()*6.28;
  var amp=2+Math.random()*4, k=(0.03+Math.random()*0.04);
  for(var x=0;x<GW;x++){
    var yy=Math.round(1.5+amp*(1+Math.sin(x*k+seaPhase)));
    for(var y=0;y<=yy && y<GH;y++){
      var i=(y+1)*GP+x+1;
      if(!sand[i] && v[i]<0.16 && u[i]<0.95) u[i]=0.95;
    }
  }
}

/* ---------- かき回す: 夜光虫が一瞬で光り切って(またたき)、しばらく光れなくなる ---------- */
var ox=DPAD, oy=DPAD;   // 濃さのムラのずれ(renderで毎コマ更新)
function plank(px,py){ // その場所の夜光虫が今どれだけ光れるか(0〜1)
  var gx=(px/CELL)|0, gy=(py/CELL)|0;
  if(gx<0||gy<0||gx>=GW||gy>=GH) return 0;
  var i=(gy+1)*GP+gx+1; if(sand[i]) return 0;
  return dens[(gy+oy)*DW+gx+ox]*Math.exp(-v[i]*1.2)*(0.15+0.85*en[i]);
}
function spark(x,y,b,life,s){ if(b<0.04) return; foot.push({x:x,y:y,t:0,life:life,b:Math.min(1,b),s:s}); }
function stir(px,py,rC,n,gain){ // 画面座標、半径はマス。またたきを出してから切る
  var rp=rC*CELL;
  for(var k=0;k<n;k++){
    var a=Math.random()*6.28, rr=Math.sqrt(Math.random())*rp, x=px+Math.cos(a)*rr, y=py+Math.sin(a)*rr;
    spark(x,y,plank(x,y)*gain*(0.6+Math.random()*0.6),0.6+Math.random()*0.9,0.9+Math.random()*1.3);
  }
  cutCells(px/CELL,py/CELL,rC);
}

/* ---------- 岩: 光の波が岩の裏を通ると、岩の裏の渦潮が光を散らして波を切る ---------- */
var rocks=[], SCALE=1, rockHits=0, act=0, actT=0;
function measureAct(dtF){ // 海の何割が光の波の先頭か(間引いて数える)
  actT+=dtF; if(actT<0.4) return; actT=0;
  var c=0,n=0; for(var i=0;i<u.length;i+=7){ if(sand[i]) continue; n++; if(u[i]>0.5&&v[i]<0.5) c++; }
  act=n?c/n:0;
}
function rockR(rk,th){ return rk.r*(1+0.16*Math.sin(2*th+rk.p1)+0.09*Math.sin(3*th+rk.p2)+0.05*Math.sin(5*th+rk.p3)); }
function inRock(rk,px,py,pad){ // 画面座標。padだけ外側まで含める
  var dx=px-rk.x, dy=py-rk.y, c=Math.cos(rk.rot), s=Math.sin(rk.rot);
  var lx=(dx*c+dy*s)/rk.sx, ly=-dx*s+dy*c, d=Math.hypot(lx,ly);
  return d-(rockR(rk,Math.atan2(ly,lx))+pad);
}
function makeRocks(){
  rocks=[]; SCALE=Math.sqrt(W*H)/574;   // 574 ≒ 390×844 のスマホ
  var want=W*H>700000?3:2, tries=0, sy=H*(H>W?0.78:0.74);
  while(rocks.length<want && tries++<300){

    if(!ok) continue;
    rocks.push({x:x,y:y,r:r,sx:1.15+Math.random()*0.4,rot:Math.random()*6.28,p1:Math.random()*6.28,p2:Math.random()*6.28,p3:Math.random()*6.28,
      cool:1+Math.random()*2,rim:0,ring:[],below:[],gbx:0,gby:0,gw:0});
  }

    rk.gw=Math.max(4,maxX-minX+1); rk.gbx=(minX+maxX+1)/2; rk.gby=maxY+3;

      for(gx=Math.round(rk.gbx-rk.gw*0.25);gx<=Math.round(rk.gbx+rk.gw*0.25);gx++){

}
function rockWakes(dtF){

    for(j=0;j<rk.ring.length;j++){ i=rk.ring[j]; var q=u[i]*Math.exp(-v[i]*5.5); if(q>f) f=q; }
    rk.rim=Math.max(f,rk.rim*Math.exp(-dtF/0.6));
    rk.cool-=dtF; if(rk.cool>0 || !rk.below.length || act>0.06) continue;   // 波を割るのは海が静かな時だけ(渦だらけの時は割らない)
    // 岩の裏(下の2〜3行)を光の波の先頭が通っているか
    var m=0; for(j=0;j<rk.below.length;j++){ i=rk.below[j]; if(u[i]>0.5 && v[i]<0.5) m++; } m/=rk.below.length;

/* ---------- 魚: 通った所の夜光虫が光り切る(暗い筋が残る)。その筋が光の波を切る ---------- */
var fishes=[];
function seaBottom(x){ var gx=Math.min(GW-1,Math.max(0,(x/CELL)|0)); return shore[gx]*CELL; }
function makeFish(){
  fishes=[];
  var s=SCALE;
  // up=水面近く(見えて、夜光虫をかき回す)/ 潜っている間は見えず、何もしない。dive=次に切りかわるまでの秒数
  fishes.push({kind:'ray',x:W*(0.25+Math.random()*0.5),y:H*(0.3+Math.random()*0.2),a:Math.random()*6.28,sp:28*s,L:30*s,S:40*s,ph:0,wt:0,seed:Math.random()*99,turn:0.9,up:true,vis:0,dive:14+Math.random()*8});
  var lead={kind:'lead',x:W*(0.25+Math.random()*0.5),y:H*(0.4+Math.random()*0.15),a:Math.random()*6.28,sp:46*s,wt:0,seed:Math.random()*99,turn:1.4,up:false,vis:0,dive:9+Math.random()*8};
  fishes.push(lead);
  for(var k=0;k<7;k++){
    var ofx=-8*s-Math.random()*34*s, ofy=(Math.random()-0.5)*40*s;
    fishes.push({kind:'small',lead:lead,ofx:ofx,ofy:ofy,x:lead.x+ofx,y:lead.y+ofy,a:lead.a,sp:lead.sp,L:(8+Math.random()*3)*s,wt:Math.random()*9,seed:Math.random()*99});
  }
}
function angTo(a,b,maxD){ var d=b-a; while(d>Math.PI) d-=6.2832; while(d<-Math.PI) d+=6.2832; return a+Math.max(-maxD,Math.min(maxD,d)); }
function avoidVec(x,y,m){
  var ax=0, ay=0, bot=seaBottom(x)-m*0.9;
  if(x<m) ax+=(m-x)/m; if(x>W-m) ax-=(x-(W-m))/m;
  var top=H*0.05+m; if(y<top) ay+=(top-y)/m;
  if(y>bot-m) ay-=Math.min(3,(y-(bot-m))/m);
  for(var k=0;k<rocks.length;k++){
    var rk=rocks[k], d=inRock(rk,x,y,0), rad=m*0.9;
    if(d<rad){ var dx=x-rk.x, dy=y-rk.y, l=Math.hypot(dx,dy)||1, w=(rad-d)/rad*2; ax+=dx/l*w; ay+=dy/l*w; }
  }

}
function updateFish(dtF){
  for(var k=0;k<fishes.length;k++){
    var f=fishes[k], m=60*SCALE, av, want;
    f.wt+=dtF;
    if(f.kind==='small'){
      var L=f.lead, c=Math.cos(L.a), s=Math.sin(L.a);
      var tx=L.x+f.ofx*c-f.ofy*s+Math.sin(f.wt*2.1+f.seed)*4*SCALE, ty=L.y+f.ofx*s+f.ofy*c+Math.cos(f.wt*1.7+f.seed)*4*SCALE;
      var dx=tx-f.x, dy=ty-f.y, dist=Math.hypot(dx,dy);
      av=avoidVec(f.x,f.y,m*0.5);
      want=Math.atan2(dy/(dist||1)+av[1]*1.5, dx/(dist||1)+av[0]*1.5);
      f.a=angTo(f.a,want,5*dtF);
      f.sp=L.sp*Math.min(1.8,Math.max(0.6,dist/(18*SCALE)));
    } else {
      f.a+=(Math.sin(f.wt*0.41+f.seed)*0.55+Math.sin(f.wt*0.17+f.seed*2.3)*0.45)*f.turn*dtF;
      av=avoidVec(f.x,f.y,m);
      if(av[0]||av[1]){ want=Math.atan2(Math.sin(f.a)+av[1]*2.2, Math.cos(f.a)+av[0]*2.2); f.a=angTo(f.a,want,2.4*dtF); }
    }
    f.x+=Math.cos(f.a)*f.sp*dtF; f.y+=Math.sin(f.a)*f.sp*dtF;
    var bot=seaBottom(f.x)-12*SCALE; if(f.y>bot) f.y=bot; if(f.y<4) f.y=4; if(f.x<4) f.x=4; if(f.x>W-4) f.x=W-4;
    if(f.kind!=='small'){ // 浮いたり潜ったり
      f.dive-=dtF;
      if(f.dive<=0){ f.up=!f.up; f.dive=f.up? 12+Math.random()*10 : 16+Math.random()*16; }
      f.vis+=((f.up?1:0)-f.vis)*Math.min(1,dtF/1.2);
    }
    if(f.kind==='lead') continue;   // 群れの先頭は目に見えない案内役
    var vis=f.kind==='small'? f.lead.vis : f.vis;
    if(vis<0.5) continue;           // 潜っている魚は夜光虫をかき回さない
    // かき回す: 体の下の夜光虫が光り切る
    if(f.kind==='ray'){
      f.ph+=dtF*2.3;
      var Sp=f.S*(0.82+0.18*Math.cos(f.ph)), nx=-Math.sin(f.a), ny=Math.cos(f.a);
      var bx=f.x-Math.cos(f.a)*f.L*0.22, by=f.y-Math.sin(f.a)*f.L*0.22;   // 翼の先の並び(体の少し後ろ)
      for(var q=-2;q<=2;q++){ var w=q/2*Sp*0.9; cutCells((bx+nx*w)/CELL,(by+ny*w)/CELL,2.2); }
      for(q=-1;q<=1;q+=2){ var tx2=bx+nx*Sp*q, ty2=by+ny*Sp*q; spark(tx2+(Math.random()-0.5)*4,ty2+(Math.random()-0.5)*4,plank(tx2,ty2)*1.6,0.8+Math.random()*0.9,1+Math.random()*1.2); }
      if(Math.random()<0.6){ var r2=(Math.random()*2-1)*Sp; spark(bx+nx*r2,by+ny*r2,plank(bx+nx*r2,by+ny*r2)*1.2,0.6+Math.random()*0.8,0.9+Math.random()); }
    } else {
      cutCells(f.x/CELL,f.y/CELL,1.3);
      if(Math.random()<0.7){ var tlx=f.x-Math.cos(f.a)*f.L*0.6, tly=f.y-Math.sin(f.a)*f.L*0.6; spark(tlx,tly,plank(tlx,tly)*1.5,0.5+Math.random()*0.7,0.8+Math.random()); }

}
function rayOutline(f){ // エイの輪郭(体の向き=+x)。羽ばたきで翼の幅と先の位置が変わる
  var L=f.L, cf=Math.cos(f.ph), S=f.S*(0.84+0.16*cf), sw=0.06*cf;
  // 翼の幅は体の長さの2倍以上。翼の先(tip)だけは丸めずにとがらせる

  var pts=[[0.46*L,0]];
  for(var k=0;k<half.length;k++) pts.push([half[k][0]*L,half[k][1]*S,half[k][2]]);
  pts.push([-0.44*L,0]);
  for(k=half.length-1;k>=0;k--) pts.push([half[k][0]*L,-half[k][1]*S,half[k][2]]);

}
function drawRocks(t){

    var rk=rocks[k], c=Math.cos(rk.rot), s=Math.sin(rk.rot);

    for(var j=0;j<40;j++){ var th=j/40*6.2832, r=rockR(rk,th); var x=Math.cos(th)*r*rk.sx, y=Math.sin(th)*r; if(j) ctx.lineTo(x,y); else ctx.moveTo(x,y); }

function drawFish(t){
  var tn=night.tint, co=night.core;

    var vis=f.kind==='small'? f.lead.vis : f.vis; if(vis<0.02) continue;

    if(f.kind==='ray'){

    ctx.strokeStyle='rgba('+co[0]+','+co[1]+','+co[2]+','+((f.kind==='ray'?0.14:0.4)*al).toFixed(3)+')'; ctx.lineWidth=1; ctx.stroke();

/* ---------- 波打ち際の遡上(波が砂に駆け上がって引く) ---------- */
var swashT=99, lastSwash=-99, SWASH_A=12;
var beachGlow=null;   // 列ごと: 波が岸に触れた所の濡れた砂が光り、少しずつ消える(打ち上げられた光)
function updateBeachGlow(dtF){
  if(!beachGlow || beachGlow.length!==GW) beachGlow=new Float32Array(GW);
  var dec=Math.exp(-dtF/1.4);
  for(var x=0;x<GW;x++){
    var f=0, y0=Math.floor(shore[x])-1;   // 岸の手前4マスで、いちばん強い光の先頭
    for(var y=y0;y>y0-4 && y>=0;y--){ var i=(y+1)*GP+x+1, q=u[i]*Math.exp(-v[i]*5.5); if(q>f) f=q; }
    f=Math.min(1,f*1.4);
    var gNew=beachGlow[x]*dec; if(f>gNew) gNew=f;
    beachGlow[x]=gNew;
  }
}
function swashExt(x){ // 今どこまで駆け上がっているか(マス)
  var t=swashT, A=SWASH_A*wetW[x];
  if(t<0.7) return A*Math.pow(t/0.7,0.6);
  var q=1-(t-0.7)/1.9; return q>0? A*q*q : 0;
}
function swashGlow(){ var t=swashT; return t<0.9? 1 : Math.max(0,1-(t-0.9)/2.4); }
function checkSwash(now){
  if(now-lastSwash<2.6) return;
  var hit=0;
  for(var x=0;x<GW;x+=2){
    var y0=Math.floor(shore[x])-5;
    for(var y=y0;y<y0+4;y++){ if(y<0) continue; var i=(y+1)*GP+x+1; if(u[i]*Math.exp(-v[i]*5.5)>0.35){ hit++; break; } }
  }
  if(hit>GW*0.5*0.3){ swashT=0; lastSwash=now; }
}

/* ---------- 砂の足あと: 打ち上げられた夜光虫がまたたく ---------- */
var foot=[], glowSpr=null, glowSprNight=-1;
function getGlowSprite(){   // 粒のまわりの丸いにじみ(夜の色で作り置き)
  if(glowSprNight===nightI && glowSpr) return glowSpr;
  var c=document.createElement('canvas'); c.width=c.height=32; var g=c.getContext('2d'), t=night.tint;
  var gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba('+t[0]+','+t[1]+','+t[2]+',0.55)'); gr.addColorStop(0.35,'rgba('+t[0]+','+t[1]+','+t[2]+',0.18)'); gr.addColorStop(1,'rgba('+t[0]+','+t[1]+','+t[2]+',0)');
  g.fillStyle=gr; g.fillRect(0,0,32,32); glowSpr=c; glowSprNight=nightI; return c;
}
function stepOnSand(x,y,n){
  var gx=Math.min(GW-1,Math.max(0,(x/CELL)|0)), wet=wetness(gx,y/CELL);
  for(var k=0;k<n;k++){
    var a=Math.random()*6.28, r=Math.sqrt(Math.random());
    foot.push({x:x+Math.cos(a)*r*11, y:y+Math.sin(a)*r*16, t:0, life:1.4+Math.random()*1.6*(0.6+wet), b:(0.7+0.3*wet)*(0.55+Math.random()*0.45), s:1.1+Math.random()*1.6});
  }
  if(foot.length>2500) foot.splice(0,foot.length-2500);
}
function wetness(gx,gy){ var dd=gy-shore[gx]; var w=1-dd/(SWASH_A*wetW[gx]+10); return w<0.08?0.08:(w>1?1:w); }

/* ---------- 描画 ---------- */
function render(now){
  var j, t=now/1000, d=img.data, g=gimg.data, tint=night.tint, core=night.core;
  ox=(DPAD+DPAD*0.9*Math.sin(t*0.031))|0; oy=(DPAD+DPAD*0.9*Math.sin(t*0.023+1.3))|0;   // ムラがゆっくり流れる
  var sg=swashGlow();
  var p=0;
  for(var y=0;y<GH;y++){
    var row=(y+1)*GP+1, fy=y/GH, drow=(y+oy)*DW+ox;
    for(var x=0;x<GW;x++){
      var i=row+x, dn=dens[drow+x];
      var sh=shore[x];
      if(sand[i]===2){ // 岩(形は上からベクターで描く。ここは下地だけ)
        d[p]=8; d[p+1]=11; d[p+2]=16; d[p+3]=255; g[p]=0; g[p+1]=0; g[p+2]=0; g[p+3]=255; p+=4; continue;
      }
      if(sand[i]){
        // 砂浜: 波打ち際に近いほど濡れて暗く、つやがある
        var dd=y-sh, ext=swashExt(x), wet=1-dd/(SWASH_A*wetW[x]+10); if(wet<0) wet=0;
        var gn=sandN[i];
        var sr=30+10*gn, sgc=27+9*gn, sb=24+8*gn;                 // 乾いた砂(夜)
        sr=sr*(1-wet*0.55)+wet*8; sgc=sgc*(1-wet*0.5)+wet*11; sb=sb*(1-wet*0.4)+wet*18;
        var rr=0,gg2=0,bb2=0, lit=0;
        var bgl=beachGlow? Math.min(1,beachGlow[x]*Math.max(0,1-dd/10)*(0.5+dn)*1.3) : 0;   // 打ち上げられた光(波打ち際から10マス)
        if(bgl>0.01){ rr=tint[0]*bgl; gg2=tint[1]*bgl; bb2=tint[2]*bgl; lit=bgl; }
        if(dd<ext){
          // 駆け上がった波のうすい水: 先っぽの泡ほど明るく光る
          var front=1-(ext-dd)/(ext+0.001), sl=sg*dn*(0.35+0.65*front*front);
          sr=sr*0.6+4; sgc=sgc*0.6+9; sb=sb*0.6+18;
          if(sl>lit){ lit=sl; rr=tint[0]*lit; gg2=tint[1]*lit; bb2=tint[2]*lit; }
          if(ext-dd<1.6){ sr+=26; sgc+=30; sb+=36; }               // 泡のふち
        }
        d[p]=sr+rr*0.45; d[p+1]=sgc+gg2*0.45; d[p+2]=sb+bb2*0.45; d[p+3]=255;
        var w2=rr>0? lit*90:0;
        g[p]=rr*1.6+w2; g[p+1]=gg2*1.6+w2; g[p+2]=bb2*1.6+w2; g[p+3]=255;
        p+=4; continue;
      }
      var uu=u[i], vv=v[i];
      // 夜の海: ゆっくり動くうねりの濃淡。岸に近いほど少し明るい(浅い)
      var sw=Math.sin(x*0.09+y*0.05+t*0.7)+Math.sin(x*0.04-y*0.11-t*0.5)*0.8+Math.sin((x+y)*0.21+t*1.3)*0.25;
      var base=0.55+0.12*sw, near=Math.max(0,1-(sh-y)/22);
      var br=2+3*base+near*4, bg=6+9*base+fy*4+near*6, bb=16+18*base+fy*8+near*8;
      var fo=1-Math.abs(sh-(y+0.5))/1.3; if(fo>0){ br+=16*fo; bg+=20*fo; bb+=24*fo; }   // 波打ち際の白いふち(なめらかに)
      // 光るのは波の先頭だけ(疲れvがたまる前)。うしろは疲れとともに薄い尾になる
      var fr=uu*Math.exp(-vv*5.5);
      var tail=vv>0? (vv<1?vv:1)*(1-uu*0.6)*0.22 : 0;
      var L=dn*(0.15+0.85*en[i]);                                    // 濃さのムラ × 夜光虫の疲れ
      var gl=(fr*1.05+uu*0.10+tail)*L;
      var c2=fr*fr*fr*0.85*L;
      var r=tint[0]*gl+(core[0]-tint[0])*c2, gg=tint[1]*gl+(core[1]-tint[1])*c2, bl=tint[2]*gl+(core[2]-tint[2])*c2;
      // 下地の帯は控えめ(0.4倍)。光そのものは粒(キラキラ)で見せる
      var cov=y+1-sh;                                                // このマスにかかる砂の割合(境目をなめらかに)
      if(cov>0){ var gn2=sandN[i]; br=br*(1-cov)+(10+6*gn2)*cov; bg=bg*(1-cov)+(13+6*gn2)*cov; bb=bb*(1-cov)+(19+6*gn2)*cov; }
      d[p]=br+r*0.4; d[p+1]=bg+gg*0.4; d[p+2]=bb+bl*0.4; d[p+3]=255;
      var wb=fr*150*L;                                 // 波の先頭の粒は白く
      g[p]=r*1.8+wb; g[p+1]=gg*1.8+wb; g[p+2]=bl*1.8+wb; g[p+3]=255;
      p+=4;
    }
  }
  sctx.putImageData(img,0,0); gsctx.putImageData(gimg,0,0);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.drawImage(small,0,0,GW,GH,0,0,GW*CELL*DPR,GH*CELL*DPR);
  // にじみ: 1/2→1/4→1/8 に縮めたものを広げて足す
  b1c.clearRect(0,0,b1.width,b1.height); b1c.drawImage(glowS,0,0,b1.width,b1.height);
  b2c.clearRect(0,0,b2.width,b2.height); b2c.drawImage(b1,0,0,b2.width,b2.height);
  b3c.clearRect(0,0,b3.width,b3.height); b3c.drawImage(b2,0,0,b3.width,b3.height);
  ctx.globalCompositeOperation='lighter';
  var Wd=GW*CELL*DPR, Hd=GH*CELL*DPR;
  ctx.globalAlpha=0.32; ctx.drawImage(b1,0,0,Wd,Hd);
  ctx.globalAlpha=0.32; ctx.drawImage(b2,0,0,Wd,Hd);
  ctx.globalAlpha=0.3; ctx.drawImage(b3,0,0,Wd,Hd);
  // キラキラ: 光の絵 × 粒の模様。模様は数コマごとに位置と種類が入れかわり、粒がまたたく
  if(++texTick>=3){ texTick=0; texUse^=1; texOff[0]=(Math.random()*TEXPAD)|0; texOff[1]=(Math.random()*TEXPAD)|0; }
  spc.globalCompositeOperation='source-over'; spc.globalAlpha=1; spc.imageSmoothingEnabled=true;
  spc.drawImage(glowS,0,0,GW,GH,0,0,Wd,Hd);
  spc.globalCompositeOperation='multiply';
  spc.drawImage(texUse?texB:texA,-texOff[0],-texOff[1]);
  ctx.globalAlpha=1; ctx.drawImage(sp,0,0);
  // 粒のまわりの小さなにじみ(1/3に縮めて広げる)
  spHc.globalCompositeOperation='copy'; spHc.drawImage(sp,0,0,spH.width,spH.height);
  ctx.globalAlpha=1; ctx.drawImage(spH,0,0,cv.width,cv.height);
  ctx.globalAlpha=0.7; ctx.drawImage(spH,0,0,cv.width,cv.height);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  drawRocks(t); drawFish(t);
  ctx.globalCompositeOperation='lighter';
  // 夜光虫の粒: 光っている所にちらばる点
  ctx.globalAlpha=1;
  var n=Math.round(GW*GH/22);
  for(var s=0;s<n;s++){
    var x=(Math.random()*GW)|0, y=(Math.random()*GH)|0, i=(y+1)*GP+x+1;
    if(sand[i]) continue;
    var e=(u[i]*Math.exp(-v[i]*5.5)+Math.max(0,v[i]*(1-u[i]))*0.12)*dens[(y+oy)*DW+x+ox]*(0.15+0.85*en[i]);
    if(Math.random()>e*1.4) continue;
    var a=Math.min(1,e*1.3);
    var sz=(0.8+Math.random()*1.2)*DPR;
    ctx.fillStyle='rgba('+core[0]+','+core[1]+','+core[2]+','+(a*0.9).toFixed(3)+')';
    var px=(x+Math.random())*CELL*DPR, py=(y+Math.random())*CELL*DPR;
    ctx.fillRect(px-sz/2,py-sz/2,sz,sz);
    if(e>0.55 && Math.random()<0.12){ // 十字のきらめき
      var L=(3+Math.random()*4)*DPR, th=Math.max(1,0.6*DPR);
      ctx.fillStyle='rgba(255,255,255,'+(0.55*a).toFixed(3)+')';
      ctx.fillRect(px-L,py-th/2,L*2,th); ctx.fillRect(px-th/2,py-L,th,L*2);
    }
  }
  // 砂の足あと: またたく粒
  var fdt=Math.min(0.05,t-(render.lt||t)); render.lt=t;
  ctx.globalCompositeOperation='lighter';
  var spr=getGlowSprite();
  for(j=foot.length-1;j>=0;j--){
    var f=foot[j]; f.t+=fdt; if(f.t>f.life){ foot.splice(j,1); continue; }
    var k=1-f.t/f.life, fl=(0.4+0.6*Math.random())*f.b*k*(f.t<0.12?f.t/0.12:1);
    var fs=f.s*DPR;
    ctx.globalAlpha=Math.min(1,fl); ctx.drawImage(spr,f.x*DPR-fs*4,f.y*DPR-fs*4,fs*8,fs*8); ctx.globalAlpha=1;
    ctx.fillStyle='rgba('+core[0]+','+core[1]+','+core[2]+','+Math.min(1,fl*1.5).toFixed(3)+')';
    ctx.fillRect(f.x*DPR-fs/2,f.y*DPR-fs/2,fs,fs);
  }
  // なぞった跡: 水面のさざ波(すぐ消える)
  ctx.globalCompositeOperation='source-over';
  for(j=trails.length-1;j>=0;j--){
    var tr=trails[j], age=t-tr.t; if(age>0.9){ trails.splice(j,1); continue; }
    ctx.globalAlpha=(1-age/0.9)*0.22;
    ctx.strokeStyle='#cfe6ff'; ctx.lineWidth=(1+age*5)*DPR;
    ctx.beginPath(); ctx.moveTo(tr.x0*DPR,tr.y0*DPR); ctx.lineTo(tr.x1*DPR,tr.y1*DPR); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---------- 操作 ---------- */
var hint=document.getElementById('hint'), hinted=false;
function hideHint(){ if(!hinted){ hinted=true; hint.classList.add('off'); } }
setTimeout(hideHint,10000);
var toastEl=document.getElementById('toast'), toastT=0;
function toast(s,ms){ toastEl.textContent=s; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('on'); },ms||2200); }

var ptrs={}, trails=[];
function isSand(px,py){ var gx=Math.min(GW-1,Math.max(0,(px/CELL)|0)); return py/CELL>=shore[gx]; }
var CUT_R=5;   // マス。スマホ幅で直径およそ30px(指の腹くらい)
cv.addEventListener('pointerdown',function(ev){
  if(window.APKit && APKit.isUI(ev.clientX,ev.clientY)) return true;
  ev.preventDefault(); hideHint();
  // 押した瞬間には光らせない: なぞる(=切る)つもりの指が、切り口を自分の光で埋めてしまうため。
  // タップは離した時、長押しは0.15秒じっとしていたら光る。
  var onSand=isSand(ev.clientX,ev.clientY);
  ptrs[ev.pointerId]={x:ev.clientX,y:ev.clientY,sx:ev.clientX,sy:ev.clientY,moved:false,t0:performance.now(),lit:false,sand:onSand,fx:ev.clientX,fy:ev.clientY};
  if(onSand) stepOnSand(ev.clientX,ev.clientY,90);   // 砂を踏む
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove',function(ev){
  var p=ptrs[ev.pointerId]; if(!p) return;
  var x=ev.clientX, y=ev.clientY;
  if(!p.moved && Math.hypot(x-p.sx,y-p.sy)>14){ p.moved=true; }
  if(isSand(x,y)){
    // 砂の上をなぞる: 足あとが続く
    if(Math.hypot(x-p.fx,y-p.fy)>12){ stepOnSand(x,y,22); p.fx=x; p.fy=y; }
  } else if(p.moved){
    var len=Math.hypot(x-p.x,y-p.y), n=Math.max(1,Math.ceil(len/(CELL*1.2)));
    for(var k=1;k<=n;k++) stir(p.x+(x-p.x)*k/n, p.y+(y-p.y)*k/n, CUT_R, 3, 1.3);   // 一瞬またたいてから暗くなる
    trails.push({x0:p.x,y0:p.y,x1:x,y1:y,t:performance.now()/1000});
    // 生まれたての渦は沖からの波にかき消されやすいので、切った直後は次の波を少し待たせる
    if(nextSea<simT+night.speed*5) nextSea=simT+night.speed*5;
  }
  p.x=x; p.y=y;
});
function endPtr(ev){
  var p=ptrs[ev.pointerId];
  if(p && ev.type==='pointerup' && !p.moved && !p.lit && !p.sand) excite(p.x,p.y,3.2,false);   // 海をタップ
  delete ptrs[ev.pointerId];
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);

function setNight(i){ nightI=i; night=NIGHTS[i]; }
function mutate(){ var n=nightI; while(n===nightI) n=(Math.random()*NIGHTS.length)|0; setNight(n); toast(night.name); }
function reset(){ u.fill(0); v.fill(0); un.fill(0); en.fill(1); foot=[]; nextSea=simT+1.2; toast('静かな浜に戻した',1500); }

/* ---------- ループ ---------- */
var resizeT=0;
window.addEventListener('resize',function(){ clearTimeout(resizeT); resizeT=setTimeout(setup,200); });
setup();
var last=performance.now(), perf={ms:0,n:0};
function frame(now){
  var dtF=Math.min(0.05,(now-last)/1000); last=now;
  var a0=performance.now();
  // 長押し中は、休んでいるマスだけを光らせ続ける(=輪が次々に生まれる)
  for(var id in ptrs){
    var p=ptrs[id]; if(p.moved || p.sand || now-p.t0<150) continue;
    if(!p.lit){ excite(p.x,p.y,3.2,false); p.lit=true; } else excite(p.x,p.y,3.2,true);
  }
  simAcc+=dtF*night.speed;
  var guard=0;
  while(simAcc>=DT && guard<8){ step(); simAcc-=DT; simT+=DT; guard++; }
  if(guard>=8) simAcc=0;
  // 夜光虫の疲れ: 光っている間は減り、休むと戻る(明るさだけに効く)
  var sdt=guard*DT, drain=0.12*sdt, rec=0.07*sdt, N=u.length;
  if(sdt>0) for(var i=0;i<N;i++){ var e=en[i]-drain*u[i]+rec*(1-en[i]); en[i]=e<0?0:e; }
  if(!noSea && simT>=nextSea){
    if(offshoreRested()){ seaWave(); nextSea=simT+night.speed*(4.5+Math.random()*3); }
    else nextSea=simT+night.speed*0.8;   // 沖がまだ光っている・疲れているなら少し待つ
  }
  if(guard>0){ measureAct(dtF); updateFish(dtF); rockWakes(dtF); }
  swashT+=dtF; checkSwash(now/1000); updateBeachGlow(dtF);
  render(now);
  perf.ms+=performance.now()-a0; perf.n++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ss={get foot(){return foot;},get swashT(){return swashT;},get en(){return en;},perf:perf,excite:excite,cut:cut,mutate:mutate,reset:reset,seaWave:seaWave,get u(){return u;},get v(){return v;},set noSea(b){noSea=b;},get rocks(){return rocks;},get sand(){return sand;},get rockHits(){return rockHits;},get act(){return act;},get fishes(){return fishes;},get grid(){return {GW:GW,GH:GH,GP:GP,CELL:CELL};}};

if(window.APKit){
  APKit.init({
    canvas: cv,
    gifName: 'sea-sparkle-loop',
    clockFormat: 'spec',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      {label:'✦', name:'mutate', onClick:function(){ mutate(); }},
      {label:'↻', name:'reset',  onClick:function(){ reset(); }}
    ]
  });
}
})();
</script>
