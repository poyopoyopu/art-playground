<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DUAL SPECTRUM 200</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,seed=Math.random()*9999,px=.5,py=.5,tx=.5,ty=.5,press=0,pt=0,hue=0,ht=0,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`,hash=n=>{const x=Math.sin(n*113.1+seed*.019)*43758.5;return x-Math.floor(x)};function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function strand(side,i,z,t,S){const q=i/23,mirror=side?1:-1,center=H*(.28+q*.44);const cross=(z-.5)*S*(.16+.12*Math.sin(q*TAU));const wave=S*(.035+.045*q)*Math.sin(z*TAU*(1.1+q)+side*2.4+i*.27+t*.16);const encounter=Math.exp(-Math.pow((z-tx)/.17,2))*press;const bend=(py*H-center)*.24*encounter*mirror;const x=W*(side?.54:.46)+mirror*(cross+S*.08*Math.sin(z*TAU*1.5+q*5+t*.08))+bend*.18;return [x,center+wave+mirror*S*.035*Math.sin(z*TAU*2.1+q*7-t*.11)-bend]}
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,hs(42+hue*.04,34,98));bg.addColorStop(.5,hs(35+hue*.03,28,96));bg.addColorStop(1,hs(30+hue*.02,34,93));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let side=0;side<2;side++)for(let i=0;i<24;i++){const q=i/23,g=ctx.createLinearGradient(0,0,W,0),base=(side?180:325)+q*190+hue;g.addColorStop(0,hs(base,52,61,.28));g.addColorStop(.25,hs(base+35,68,63,.82));g.addColorStop(.55,hs(base+110,48,73,.78));g.addColorStop(.82,hs(base+185,62,63,.82));g.addColorStop(1,hs(base+230,52,58,.25));ctx.strokeStyle=g;ctx.lineWidth=.8+Math.sin(q*Math.PI)*.75;ctx.beginPath();for(let j=0;j<=190;j++){const z=-.03+j/190*1.06,p=strand(side,i,z,T(1.1),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,rg=ctx.createRadialGradient(X,Y,0,X,Y,S*.45);rg.addColorStop(0,'rgba(255,245,205,.38)');rg.addColorStop(.25,'rgba(255,230,185,.12)');rg.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0006,dt));py+=(ty-py)*(1-Math.pow(.0006,dt));press+=(pt-press)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);pt=d?1:0;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));function mutate(){seed=Math.random()*9999;ht=(ht+53+hash(seed)*100)%360}function reset(){px=tx=.5;py=ty=.5;press=pt=0;hue=ht=0;seed=Math.random()*9999}APKit.init({canvas,gifName:'dual-spectrum-200-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
