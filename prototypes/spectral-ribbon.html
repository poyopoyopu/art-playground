<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=3,law=0,t0=performance.now();const field=document.createElement('canvas'),fg=field.getContext('2d');
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D);field.width=Math.max(180,Math.floor(W/5));field.height=Math.max(120,Math.floor(H/5))}addEventListener('resize',resize);resize();
function spectral(v){v-=Math.floor(v);return[Math.min(1,Math.exp(-Math.pow((v-.02)/.12,2))+.65*Math.exp(-Math.pow((v-.92)/.16,2))),Math.min(1,Math.exp(-Math.pow((v-.18)/.16,2))+.55*Math.exp(-Math.pow((v-.72)/.13,2))),Math.min(1,Math.exp(-Math.pow((v-.43)/.18,2)))]}
function draw(p){const t=p*Math.PI*2,sx=field.width,sy=field.height,img=fg.createImageData(sx,sy),data=img.data,S=Math.min(W,H);const src=law%2?[[.27,.48,13.5],[.71,.54,10.8],[.49,.25,7.2]]:[[.22,.52,12.2],[.77,.47,11.1],[.51,.76,8.4]];let k=0;for(let y=0;y<sy;y++){const ny=y/sy;for(let x=0;x<sx;x++){const nx=x/sx;let sum=0;for(let j=0;j<3;j++){const q=src[j],dx=(nx-q[0])*W/S,dy=(ny-q[1])*H/S,r=Math.hypot(dx,dy)+.0001;sum+=Math.sin(r*q[2]+t*(.55+j*.13)+law*.7+.045*Math.sin(r*5.5-t*.55+j*2.1+seed*.13))}const v=(sum/3+1)/2,film=.5+.5*Math.sin(v*12.5+Math.sin(v*3.1+t*.25)*.8),sp=spectral(film),edge=Math.pow(Math.sin(Math.PI*Math.max(0,Math.min(1,v))),.7),grain=.94+.06*Math.sin(nx*31+ny*47+seed);data[k++]=255-(255-sp[0]*230)*edge*grain;data[k++]=255-(255-sp[1]*220)*edge*grain;data[k++]=255-(255-sp[2]*235)*edge*grain;data[k++]=Math.floor(255*(.16+.72*edge))}}fg.putImageData(img,0,0);g.fillStyle='#fff';g.fillRect(0,0,W,H);g.globalAlpha=.82;g.drawImage(field,0,0,W,H);g.globalAlpha=.18;g.filter='blur(10px)';g.drawImage(field,0,0,W,H);g.filter='none';g.globalAlpha=1}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*9);law=(law+1)%4}function reset(){seed=3;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%4;seed++;return true});function loop(now){draw(((now-t0)/18000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
