<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=1,fold=0,t0=performance.now();function sz(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){let t=p*Math.PI*2;g.fillStyle='#fff';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W*(.46+.04*Math.sin(t)),cy=H*(.55+.025*Math.cos(t*.5));for(let b=0;b<24;b++){g.beginPath();for(let i=0;i<=300;i++){let u=i/300,a=-1.5+u*3,bend=.18*Math.sin(a*1.55+t+seed*.31)+.07*Math.sin(a*3.8-t*.55)+.035*Math.sin(a*8+t*1.7),rr=S*(.54+b*.0045)+Math.sin(a*6.5+b*.31+t)*S*(.006+.012*Math.exp(-a*a*.42))+fold*Math.sin(a*2.2-t*1.3+b*.24)*S*.055+S*.012*Math.sin(t*2+a*2+b*.17),aa=a+bend+.025*Math.sin(t*.5+a*1.3),x=cx+Math.sin(aa)*rr,y=cy-Math.cos(aa)*rr*(.68+.035*Math.sin(t+a*1.8));i?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle='hsla('+((b*18+seed*47+Math.sin(t+b)*18)%360)+',95%,58%,'+(.035+b*.009)+')';g.lineWidth=.55+b*.055;g.stroke()}g.globalCompositeOperation='screen';for(let i=0;i<900;i++){let a=-1.5+i/900*3,rr=S*(.55+.018*Math.sin(i*3.7+seed)),w=.06*Math.sin(t*1.5+a*4+i*.01),x=cx+Math.sin(a+w)*rr,y=cy-Math.cos(a+w)*rr*.7+Math.sin(a*7+t*1.2+i*.017)*S*.004;g.fillStyle='hsla('+((i*2.7+seed*41+t*35)%360)+',100%,62%,.16)';g.fillRect(x,y,1.2,1.2)}g.globalCompositeOperation='source-over'}function frame(p){draw(p)}function mutate(){seed++;fold=(fold+1)%4}function reset(){seed=1;fold=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;fold=(fold+1)%5;seed+=Math.floor(e.clientX/80)+1;return true});function loop(t){draw(((t-t0)/15000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
