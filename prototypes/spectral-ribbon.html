<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=2,law=0,t0=performance.now();
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function draw(p){const t=p*Math.PI*2,S=Math.min(W,H),cx=W*.5,cy=H*.5;g.fillStyle='#fff';g.fillRect(0,0,W,H);const drift=Math.sin(t*.5+seed)*S*.11;for(let layer=0;layer<96;layer++){g.beginPath();for(let i=0;i<=300;i++){const u=i/300,x=W*(u),q=(u-.5)*S*1.55;const envelope=Math.exp(-q*q/(S*S*.55));const carrier=Math.sin(q/S*13+t*.32+layer*.012+seed)*S*.008;const interference=Math.sin(q/S*31-t*.21+layer*.065)*S*(.002+law*.0015);const bend=Math.sin(q/S*2.2-t*.16+seed)*S*.025;const lens=Math.exp(-Math.pow((x-(cx+drift))/(S*.27),2));const y=cy+q*.34+bend+carrier+interference+lens*Math.sin(q/S*18+t+layer*.04)*S*.018*law;if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}const hue=(205+layer*1.9+Math.sin(t*.8+layer*.025)*105+seed*31)%360;g.strokeStyle='hsla('+hue+',82%,'+(58+layer*.16)+'%,'+(.018+envelope*.018)+')';g.lineWidth=.28+(layer%4)*.08;g.stroke()}g.globalCompositeOperation='multiply';for(let k=0;k<7;k++){const x0=W*(.18+k*.105)+Math.sin(t*.45+k+seed)*S*.045;g.beginPath();for(let j=0;j<=160;j++){const v=j/160,y=v*H;const pinch=Math.exp(-Math.pow((y-(cy+Math.sin(t+k)*S*.16))/(S*.25),2));const x=x0+Math.sin(v*7+t*.3+k)*S*.018+pinch*Math.sin(t*1.1+v*10+k)*S*.035;if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((k*51+seed*29+t*35)%360)+',70%,55%,.035)';g.lineWidth=.7;g.stroke()}g.globalCompositeOperation='source-over'}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*7);law=(law+1)%5}function reset(){seed=2;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%5;seed++;return true});function loop(now){draw(((now-t0)/18000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
