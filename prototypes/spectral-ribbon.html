<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=1,warp=0,t0=performance.now();function sz(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();
function draw(p){let t=p*Math.PI*2;g.fillStyle='#fff';g.fillRect(0,0,W,H);let S=Math.min(W,H);g.globalCompositeOperation='source-over';for(let b=0;b<52;b++){g.beginPath();for(let i=0;i<=420;i++){let u=i/420,x=u*W,y=H*.5;let a=(u-.5)*Math.PI*2.8;let wave=Math.sin(a*1.7+t*.45+seed*.2)*.10+Math.sin(a*5.2-t*.31+b*.018)*.025;let lens=Math.exp(-Math.pow((u-(.22+.56*(.5+.5*Math.sin(t*.5+seed))))/.16,2));y+=Math.sin(a+wave)*S*.34;y+=Math.sin(a*2.4-t*.2+b*.07)*S*.012;y+=warp*lens*Math.sin(a*3.2+t+b*.04)*S*.20;let xx=x+Math.sin(a*1.7+t*.15)*S*.025*lens;let yy=y+Math.cos(a+wave)*S*.03;if(i===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}let hue=(b*9.5+seed*43+t*32)%360;g.strokeStyle='hsla('+hue+',88%,'+(58+b*.25)+'%,'+(.018+b*.0028)+')';g.lineWidth=.45+b*.022;g.stroke()}g.globalCompositeOperation='screen';for(let k=0;k<9;k++){let x0=W*(.12+k*.095+.018*Math.sin(t+k));g.beginPath();for(let j=0;j<=120;j++){let v=j/120,y=H*(v-.1),u=(y/H-.5)*4;let bend=Math.sin(v*5+t*.35+k)*W*.035+Math.sin(v*12-t+k*.7)*W*.008;let x=x0+bend+warp*Math.exp(-Math.pow((v-.55)/.22,2))*Math.sin(t+v*7+k)*W*.10;if(j===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='hsla('+((k*47+seed*29+t*25)%360)+',100%,58%,.10)';g.lineWidth=1;g.stroke()}g.globalCompositeOperation='source-over'}function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*8);warp=(warp+1)%5}function reset(){seed=1;warp=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;warp=(warp+1)%5;seed+=1;return true});function loop(t){draw(((t-t0)/18000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
