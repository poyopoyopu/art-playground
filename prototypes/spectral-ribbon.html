<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f1ef}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=1,fold=0,t0=performance.now();function sz(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();
function draw(p){let t=p*Math.PI*2;g.fillStyle='#f4f1ef';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W*.48,cy=H*.55;for(let band=0;band<18;band++){g.beginPath();for(let q=0;q<=220;q++){let u=q/220,a=-1.35+u*2.7;let bend=Math.sin(a*1.8+t+seed*.31)*.16+Math.sin(a*4.1-t*.7)*.035;let f=Math.exp(-a*a*.8);let rr=S*(.55+band*.006)+Math.sin(a*7+band*.37+t)*S*.006+fold*Math.sin(a*2.5-t+band*.2)*S*.045;let xx=cx+Math.sin(a+bend)*rr,yy=cy-Math.cos(a+bend)*rr*.72;if(q===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.strokeStyle='hsla('+((band*19+seed*47)%360)+',95%,58%,'+(.045+band*.012)+')';g.lineWidth=.7+band*.06;g.stroke()}for(let i=0;i<260;i++){let a=(i/260)*Math.PI*2,rr=S*(.55+Math.sin(i*7+seed)*.08);let x=cx+Math.sin(a)*rr,y=cy-Math.cos(a)*rr*.72;g.fillStyle='hsla('+((i*13+seed*31)%360)+',100%,62%,.10)';g.fillRect(x,y,1.3,1.3)}}function frame(p){draw(p)}function mutate(){seed++;fold=(fold+1)%4}function reset(){seed=1;fold=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;fold=(fold+1)%5;seed+=Math.floor(e.clientX/80)+1;return true});function loop(t){draw(((t-t0)/10000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
