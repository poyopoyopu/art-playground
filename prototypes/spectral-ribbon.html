<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c');
const g=c.getContext('2d',{alpha:false});
let W=1,H=1,D=1,seed=7,law=0,t0=performance.now();
function resize(){D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.max(1,Math.floor(W*D));c.height=Math.max(1,Math.floor(H*D));g.setTransform(D,0,0,D,0,0)}
window.addEventListener('resize',resize);resize();
function draw(phase){
 const t=phase*Math.PI*2, S=Math.min(W,H), cx=W*.5, cy=H*.5;
 g.fillStyle='#fff';g.fillRect(0,0,W,H);
 const lx=cx+Math.cos(t*.5+seed)*W*.30, ly=cy+Math.sin(t*.5+seed*.7)*H*.28;
 for(let b=0;b<72;b++){
   g.beginPath();
   for(let i=0;i<=260;i++){
     const u=i/260, x=u*W, base=(u-.5)*S*1.35;
     const lens=Math.exp(-Math.pow((x-lx)/(S*.25),2)-Math.pow((base-(ly-cy))/(S*.42),2));
     const wave=Math.sin(base/S*8+t*.32+seed*.11+b*.035)*S*.012;
     const bend=Math.sin(base/S*2.8-t*.22+seed)*S*.035;
     const y=cy+base*.38+bend+wave+law*.012*S*lens*Math.sin(base/S*18+t+b*.13);
     const xx=x+lens*S*.07*Math.sin(base/S*7-t*.25+b*.08);
     if(i===0)g.moveTo(xx,y);else g.lineTo(xx,y);
   }
   const hue=(190+b*2.35+Math.sin(t*.5+b*.06)*55+seed*17)%360;
   g.strokeStyle='hsla('+hue+',82%,'+(62+b*.18)+'%,'+(.055+b*.0009)+')';g.lineWidth=.42+(b%5)*.08;g.stroke();
 }
 g.globalCompositeOperation='multiply';
 for(let k=0;k<18;k++){
   const x=W*(.06+k*.052), drift=Math.sin(t*.5+k*.7)*S*.018;
   g.beginPath();
   for(let j=0;j<=120;j++){
     const v=j/120,y=v*H,q=Math.exp(-Math.pow((x-lx)/(S*.22),2)-Math.pow((y-ly)/(S*.42),2));
     const xx=x+drift+q*S*.055*Math.sin(v*10+t+k);
     if(j===0)g.moveTo(xx,y);else g.lineTo(xx,y);
   }
   g.strokeStyle='hsla('+((k*19+seed*31+t*28)%360)+',70%,60%,.035)';g.lineWidth=.65;g.stroke();
 }
 g.globalCompositeOperation='source-over';
}
function frame(p){draw(p)}
function mutate(){seed+=1+Math.floor(Math.random()*9);law=(law+1)%6}
function reset(){seed=7;law=0}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%6;seed+=1;return true});
function loop(now){draw(((now-t0)/18000)%1);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
