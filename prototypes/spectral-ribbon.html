<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spectral Ribbon</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=1,H=1,D=1,seed=3,law=0,t0=performance.now();const field=document.createElement('canvas'),fg=field.getContext('2d');
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,W*D);c.height=Math.max(1,H*D);g.setTransform(D,0,0,D,0,0);field.width=Math.max(160,Math.floor(W/4));field.height=Math.max(120,Math.floor(H/4))}addEventListener('resize',resize);resize();
function spectral(v){v-=Math.floor(v);return[Math.min(1,Math.exp(-Math.pow((v-.03)/.11,2))+.7*Math.exp(-Math.pow((v-.93)/.15,2))),Math.min(1,Math.exp(-Math.pow((v-.18)/.15,2))+.6*Math.exp(-Math.pow((v-.72)/.14,2))),Math.min(1,Math.exp(-Math.pow((v-.43)/.17,2)))]}
function draw(p){const t=p*Math.PI*2,sx=field.width,sy=field.height,img=fg.createImageData(sx,sy),data=img.data,S=Math.min(W,H);const src=law%2?[[.25,.48,12.8],[.74,.52,10.6],[.50,.24,7.6]]:[[.20,.54,11.4],[.80,.46,10.2],[.50,.76,8.0]];let k=0;for(let y=0;y<sy;y++){const ny=y/sy;for(let x=0;x<sx;x++){const nx=x/sx;let sum=0;for(let j=0;j<3;j++){const q=src[j],dx=(nx-q[0])*W/S,dy=(ny-q[1])*H/S,r=Math.hypot(dx,dy);sum+=Math.sin(r*q[2]+t*(.7+j*.11)+j*1.7+law*.55+.08*Math.sin(r*4.2-t*.4+j+seed*.1))}const v=(sum/3+1)*.5,film=.5+.5*Math.sin(v*10.5+Math.sin(v*3+t*.2)*.7),sp=spectral(film),edge=.45+.55*Math.pow(Math.sin(Math.PI*v),.55),grain=.97+.03*Math.sin(nx*29+ny*41+seed);data[k++]=Math.min(255,Math.round(255-(255-sp[0]*245)*edge*grain));data[k++]=Math.min(255,Math.round(255-(255-sp[1]*235)*edge*grain));data[k++]=Math.min(255,Math.round(255-(255-sp[2]*245)*edge*grain));data[k++]=255}}fg.putImageData(img,0,0);g.fillStyle='#fff';g.fillRect(0,0,W,H);g.imageSmoothingEnabled=true;g.globalAlpha=.92;g.drawImage(field,0,0,W,H);g.globalAlpha=.18;g.filter='blur(12px)';g.drawImage(field,0,0,W,H);g.filter='none';g.globalAlpha=1}
function frame(p){draw(p)}function mutate(){seed+=1+Math.floor(Math.random()*9);law=(law+1)%4}function reset(){seed=3;law=0}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;law=(law+1)%4;seed++;return true});function loop(now){draw(((now-t0)/18000)%1);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'spectral-ribbon-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:frame,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});</script></body></html>
