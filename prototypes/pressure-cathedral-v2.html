<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRESSURE CATHEDRAL II</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060504}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,p=0,seed=Math.random()*99,folds=[],drag=null;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function reset(){folds=[];drag=null;seed=Math.random()*99}function mutate(){seed=Math.random()*99;folds.forEach(f=>f.a+=Math.PI/2)}
function down(a,b){if(window.APKit&&APKit.isUI(a,b))return true;drag={x:a,y:b,x0:a,y0:b};return true}function move(a,b){if(drag){drag.x=a;drag.y=b}}function up(){if(!drag)return;let dx=drag.x-drag.x0,dy=drag.y-drag.y0,d=Math.hypot(dx,dy);folds.push({x:drag.x0,y:drag.y0,a:Math.atan2(dy,dx),len:Math.max(90,Math.min(500,d*2.4)),power:.5+Math.min(.8,d/260)});if(folds.length>8)folds.shift();drag=null}
c.addEventListener('pointerdown',e=>down(e.clientX,e.clientY));c.addEventListener('pointermove',e=>move(e.clientX,e.clientY));c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
function bend(a,b){let X=0,Y=0;for(const f of folds){let dx=a-f.x,dy=b-f.y,ca=Math.cos(f.a),sa=Math.sin(f.a),side=-dx*sa+dy*ca,along=dx*ca+dy*sa;if(Math.abs(along)<f.len*.5){let q=Math.max(0,1-Math.abs(side)/100);X+=-sa*side*q*f.power*.22;Y+=ca*side*q*f.power*.22}}return[X,Y]}
function draw(t){x.fillStyle='#060504';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,R=Math.min(W,H)*.48;x.save();x.translate(cx,cy);for(let k=1;k<25;k++){let r=R*k/24;x.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,q=bend(r*Math.cos(a)+cx,r*Math.sin(a)+cy),w=Math.sin(a*(k+2)+t*2+seed)*(.6+k*.06),xx=r*Math.cos(a)+q[0]+Math.cos(a)*w,yy=r*Math.sin(a)+q[1]+Math.sin(a)*w;i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.strokeStyle=`hsla(${30+k*3+seed%20},65%,${40+k*1.5}%,${.12+k*.012})`;x.stroke()}for(const f of folds){x.save();x.translate(f.x-cx,f.y-cy);x.rotate(f.a);x.beginPath();x.moveTo(-f.len/2,0);x.lineTo(f.len/2,0);x.strokeStyle='rgba(255,225,170,.45)';x.lineWidth=1.5;x.stroke();x.restore()}if(drag){x.save();x.translate(drag.x0-cx,drag.y0-cy);x.rotate(Math.atan2(drag.y-drag.y0,drag.x-drag.x0));x.beginPath();x.moveTo(-20,0);x.lineTo(Math.min(250,Math.hypot(drag.x-drag.x0,drag.y-drag.y0)*2),0);x.strokeStyle='rgba(255,235,190,.8)';x.stroke();x.restore()}x.restore()}
function loop(){p=(performance.now()%12000)/12000*Math.PI*2;draw(p);requestAnimationFrame(loop)}loop();APKit.init({canvas:c,gifName:'pressure-cathedral-v2-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
