<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC VEIL 200</title><script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f5ef}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*10000;
let mx=.18,my=.34,tx=.18,ty=.34,press=0,pt=0,hue=0,ht=0,last=performance.now();
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const hash=n=>{const x=Math.sin(n*127.1+seed*.017)*43758.5453;return x-Math.floor(x)};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',resize,{passive:true});resize();
function makeRibbon(i,z,phase,S){const q=i/28,y0=H*(.18+q*.62),amp=S*(.035+.035*Math.sin(q*Math.PI));const pull=Math.exp(-Math.pow((z-mx)/.20,2))*press;return y0+amp*Math.sin(z*TAU*(1.05+q*.9)+q*7+phase*.32+i*.17)+S*.018*Math.sin(z*TAU*3-q*4-phase*.13)+(my*H-y0)*.10*pull}
function strokeRibbon(i,phase,S){const q=i/28,N=190,pts=[];for(let j=0;j<=N;j++){const z=-.04+j/N*1.08;pts.push([z*W,makeRibbon(i,z,phase,S)])}const g=ctx.createLinearGradient(0,0,W,0),h=(q<.52?330+q*120:42+(q-.52)*210)+hue;g.addColorStop(0,hs(h,68,58,.65));g.addColorStop(.28,hs(h+28,65,66,.86));g.addColorStop(.52,hs(h+120,45,72,.76));g.addColorStop(.76,hs(h+190,62,63,.88));g.addColorStop(1,hs(h+220,55,57,.65));ctx.strokeStyle=g;ctx.lineWidth=1.05;ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=.55;ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]-.7):ctx.moveTo(p[0],p[1]-.7));ctx.stroke()}
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H),X=mx*W,Y=my*H;ctx.globalCompositeOperation='source-over';const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,hs(42+hue*.08,32,97));bg.addColorStop(.5,hs(35+hue*.05,28,96));bg.addColorStop(1,hs(28+hue*.06,34,94));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);const ph=T(1);for(let i=0;i<29;i++)strokeRibbon(i,ph,S);ctx.globalCompositeOperation='screen';const glow=ctx.createRadialGradient(X,Y,0,X,Y,S*(.48+.05*Math.sin(T(.08))));glow.addColorStop(0,'rgba(255,245,214,.38)');glow.addColorStop(.22,'rgba(255,232,190,.13)');glow.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';for(let i=0;i<8;i++){const q=hash(i+11)*.92,z=clamp(mx+(hash(i+31)-.5)*.72,0,1),y=makeRibbon(Math.floor(q*28),z,T(.6),S),a=.18+.55*Math.pow((Math.sin(T(.33+i*.07)+i*2.1)+1)/2,7),r=S*(.003+.004*hash(i+4)),g=ctx.createRadialGradient(z*W,y,0,z*W,y,r*8);g.addColorStop(0,`rgba(255,250,230,${a})`);g.addColorStop(1,'rgba(255,250,230,0)');ctx.fillStyle=g;ctx.fillRect(z*W-r*8,y-r*8,r*16,r*16)}}
function frame(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;mx+=(tx-mx)*(1-Math.pow(.0005,dt));my+=(ty-my)*(1-Math.pow(.0005,dt));press+=(pt-press)*(1-Math.pow(.0001,dt));hue+=(ht-hue)*(1-Math.pow(.0008,dt));draw();requestAnimationFrame(frame)}frame();
function setTouch(x,y,down){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);pt=down?1:0;return true}canvas.addEventListener('pointerdown',e=>{setTouch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)setTouch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>{setTouch(e.clientX,e.clientY,false)});
function mutate(){seed=Math.random()*10000;ht=(ht+38+hash(seed)*90)%360}function reset(){mx=tx=.18;my=ty=.34;press=pt=0;hue=ht=0;seed=Math.random()*10000}
APKit.init({canvas,gifName:'chromatic-veil-200-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
