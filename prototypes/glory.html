<!doctype html>
<!-- GLORY — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/31 試作。
     世界のルール: 山頂から夜明けの雲海を見下ろしている。触れた所に自分の影が雲の上に落ち、影のまわりに虹色の輪(光輪=グローリー)ができる。
       (ブロッケン現象: 太陽の反対側にだけ、影と輪が現れる)。影を動かすと輪も動く。押し続けると霧が濃くなり、輪が増えてくっきりする。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1f4d">
<title>GLORY — 触れた所に影が落ち、雲に虹の輪が咲く</title>
<script src="../ap-kit.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1f4d;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;text-align:center;pointer-events:none;color:#fff;font:500 10px/1.9 ui-monospace,monospace;letter-spacing:.2em;text-shadow:0 2px 14px #000a;transition:opacity 1.4s}
#hint b{display:block;font:600 12px/1.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em}
#hint.off{opacity:0}
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="hint"><b>触れた所に、あなたの影が落ちる</b>影のまわりに虹の輪が咲く · 押し続けると、霧が濃くなる</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),hint=document.getElementById('hint');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
const YH=.07;/* 雲海の水平線の高さ(画面の高さを1として、中央が0) */
let W=1,H=1,scale=1,t=0,last=0,alive=true,touched=false,slow=0;
let seed=0,tone=0,mist=.35,mistBase=.35,held=null;
let g={x:.04,y:-.2},gt={x:.04,y:-.2};
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes,uG;uniform float uT,uMist,uTone,uSeed;
const float YH=${YH.toFixed(3)};
float h1(float x){return fract(sin(x*127.1+uSeed)*43758.5453);}
float n1(float x){float i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(h1(i),h1(i+1.),f);}
float fbm1(float x){return n1(x)*.5+n1(x*2.13+7.)*.25+n1(x*4.37+13.)*.125;}
float rdg(float x){float f=fbm1(x)*1.7;return 1.-abs(2.*f-1.);}
float h2(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x),mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,v=0.;for(int i=0;i<6;i++){v+=a*n2(p);p=p*2.03+vec2(17.1,9.7);a*=.5;}return v;}
vec3 pal(float x){return .5+.5*cos(6.2832*(x+vec3(0.,.33,.67)));}
/* 空: 地平線のすぐ上に桃色の帯(ヴィーナスベルト)、その上に藍 */
vec3 horizonC(){return mix(vec3(1.,.8,.6),vec3(1.,.66,.42),uTone);}
vec3 sky(vec2 p){
  float v=clamp((p.y-YH)/.5,0.,1.);
  vec3 hor=horizonC();
  vec3 band=mix(vec3(.92,.5,.74),vec3(.95,.42,.42),uTone);
  vec3 top=mix(vec3(.03,.06,.3),vec3(.04,.04,.2),uTone);
  vec3 c=mix(hor,band,smoothstep(0.,.22,v));c=mix(c,top,smoothstep(.12,.95,v));
  c+=hor*exp(-(p.y-YH)*7.)*.45;/* 地平線に昇る朝日の明るみ */
  /* 高い筋雲 */
  float ci=smoothstep(.5,.85,fbm(vec2(p.x*1.2+uSeed,p.y*9.)))*smoothstep(.05,.3,v);
  c+=mix(vec3(1.,.78,.7),vec3(.8,.7,1.),v)*ci*.22;
  /* 星(上空だけうっすら) */
  vec2 g2=p*80.;vec2 id=floor(g2);float s=h2(id);
  c+=vec3(.9,.95,1.)*step(.992,s)*smoothstep(.4,0.,length(fract(g2)-.5))*smoothstep(.45,.9,v)*.6;
  return c;
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  float aa=1.4/uRes.y;
  vec3 hor=horizonC();
  vec3 col;
  if(p.y>=YH){
    col=sky(p);
    /* 雲海から突き出る遠い山並み */
    for(int k=0;k<3;k++){
      float fk=float(k);
      float yk=YH+.012+(.1-.028*fk)*(rdg(p.x*(2.2+1.4*fk)+fk*8.3+2.)-.35)*(1.+.2*fk);
      float cov=smoothstep(-aa,aa,yk-p.y);
      vec3 rc=mix(vec3(.5,.42,.68),vec3(.16,.16,.36),fk/2.);
      float db=yk-p.y;
      rc=mix(rc,hor*.95,exp(-db*14.)*(.55-.15*fk));
      rc+=vec3(1.,.72,.5)*smoothstep(.01,.0,db)*.14;
      col=mix(col,rc,cov);
    }
    col=mix(col,hor,exp(-(p.y-YH)*26.)*.5);
  }else{
    /* 雲海: 水平線に向かって細かく縮む平面。後ろから朝日が差し、こちら向きの面が金色に光る */
    float dz=YH-p.y;
    float z=.2/(dz+.014);
    vec2 uv=vec2(p.x*z*1.7+uSeed,z*1.2+uT*.008)*2.4;
    float h=fbm(uv),h2v=fbm(uv-vec2(0.,.09));
    float lit=clamp(.5+(h2v-h)*7.5,0.,1.);
    vec3 shadowC=mix(vec3(.3,.34,.74),vec3(.46,.26,.58),uTone);
    vec3 litC=mix(vec3(1.,.88,.68),vec3(1.,.7,.5),uTone);
    vec3 cc=mix(shadowC,litC,lit)*(.62+.6*h);
    cc=mix(mix(vec3(.12,.16,.42),vec3(.26,.14,.36),uTone),cc,smoothstep(.2,.58,h));
    /* 触れた所の影と、そのまわりの虹の輪(光輪) */
    vec2 d=p-uG;vec2 de=vec2(d.x,d.y*1.35);float r=length(de);
    float sh=exp(-pow(d.x/.03,2.)-pow((d.y-.012)/.07,2.));
    float tt=r/.034;
    float mi=uMist;
    float amp=exp(-tt*(.9-.4*mi))*smoothstep(.7,1.3,tt)*(.42+.8*mi);
    vec3 ring=mix(vec3(.85,.88,.95),pal(tt*.5-.05),.72);
    float cloudBright=.4+.9*h;
    cc*=1.-.78*sh*(.55+.45*mi);
    cc+=ring*amp*cloudBright*.95;
    cc+=vec3(1.,.95,.85)*exp(-r*30.)*(.18+.4*mi)*cloudBright;
    /* 水平線に向かって霧にかすむ */
    float fg=exp(-dz*6.5);
    cc=mix(cc,hor,fg*.82);
    col=cc;
    /* 手前の岩(山頂の足もと) */
    float yb=-.47+.05*(fbm1(p.x*3.2+11.)-.35)+.012*abs(fract(p.x*9.)-.5);
    float rock=smoothstep(-aa,aa,yb-p.y);
    vec3 rc2=vec3(.02,.025,.06)+hor*.06*smoothstep(.02,.0,yb-p.y);
    col=mix(col,rc2,rock);
  }
  float vg=smoothstep(1.2,.3,length(p*vec2(.85,.6)));
  col*=.72+.28*vg;
  col=1.-exp(-col*1.2);
  col=pow(col,vec3(.96));
  col+=(h2(gl_FragCoord.xy+uT)-.5)*.014;
  gl_FragColor=vec4(col,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uRes','uG','uT','uMist','uTone','uSeed'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
function resize(){
  W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5)*scale;
  canvas.width=Math.max(2,Math.round(W*d));canvas.height=Math.max(2,Math.round(H*d));canvas.style.width=W+'px';canvas.style.height=H+'px';
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize,{passive:true});
function setG(cx,cy){const x=(cx-W*.5)/H,y=(H*.5-cy)/H;gt.x=Math.max(-.5,Math.min(.5,x));gt.y=Math.max(-.46,Math.min(YH-.06,y))}
function reset(){seed=0;tone=0;mistBase=.35;mist=.35;gt={x:.04,y:-.2}}
function mutate(){seed=Math.random()*60;tone=Math.random()<.5?0:1;}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  touched=true;hint.classList.add('off');try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  held=e.pointerId;setG(e.clientX,e.clientY);e.preventDefault();
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(held===e.pointerId)setG(e.clientX,e.clientY)});
function up(e){if(held===e.pointerId)held=null}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function frame(ts){
  if(!alive)return;const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;t+=dt;
  slow=slow*.95+dt*.05;if(slow>.03&&scale>.5){scale*=.85;slow=.016;resize()}
  const k=1-Math.exp(-dt*(held!==null?10:4));g.x+=(gt.x-g.x)*k;g.y+=(gt.y-g.y)*k;
  /* 押している間は霧が濃くなり、離すとゆっくり薄まる */
  if(held!==null)mist=Math.min(1,mist+dt*.45);else mist+=(mistBase-mist)*(1-Math.exp(-dt*.1));
  const sway=held!==null?0:Math.sin(t*.4)*.004;
  gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform2f(U.uG,g.x+sway,g.y);gl.uniform1f(U.uT,t);gl.uniform1f(U.uMist,mist);gl.uniform1f(U.uTone,tone);gl.uniform1f(U.uSeed,seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(!touched&&t>16)hint.classList.add('off');
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)alive=false;else if(!alive){alive=true;last=performance.now();requestAnimationFrame(frame)}});
resize();
APKit.init({canvas,gifName:'glory-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:mutate},
  {label:'↻',name:'reset',onClick:reset}
]});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
