<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM 200 V8 — COLOR BLOOM</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,px=.5,py=.49,tx=.5,ty=.49,force=0,ft=0,hue=0,ht=0,law=0,last=performance.now();
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function spiralPoint(q,u,t,S){const cx=W*(.5+.018*Math.sin(t*.055)),cy=H*(.49+.018*Math.cos(t*.065)),minR=S*.045,maxR=S*.455,layer=(q-.5)*S*.145,r=minR+(maxR-minR)*u+layer,turns=2.78+law*.16,base=-.72+u*turns*TAU+q*.018*TAU;const tide=.045*Math.sin(TAU*t/9+u*8-q*4),wave=.032*Math.sin(TAU*t/6-q*8+u*5),dx=tx-.5,dy=ty-.5,touch=Math.exp(-Math.pow((u-.52)/.32,2))*force;const ang=base+tide+wave+(dx*Math.cos(base)+dy*Math.sin(base))*4.5*touch+law*.12*Math.sin(u*TAU*3+t+q*5);const rr=r*(1+.035*Math.sin(TAU*t/11+q*7+u*5)+.022*Math.sin(TAU*t/5+u*13))+S*(.075*touch*(1-u)+.025*Math.sin(TAU*t/7+q*12)*u);return[cx+Math.cos(ang)*rr+dx*S*.045*touch,cy+Math.sin(ang)*rr+dy*S*.045*touch]}
function draw(phase=null){const real=performance.now()/1000,t=phase===null?real:phase,T=k=>APKit.T(k,phase,real),S=Math.min(W,H),b=.5+.5*Math.sin(T(1)*TAU),a=T(.14)*TAU,a2=T(.31)*TAU;
const palette=42+74*(.5+.5*Math.sin(a))+48*(.5+.5*Math.sin(a2+1.4))+hue*.16;const driftX=Math.sin(a*.63)*S*.045,driftY=Math.cos(a2*.71)*S*.035;
const bg=ctx.createRadialGradient(W*.5+driftX,H*.48+driftY,0,W*.5-driftX*.45,H*.5-driftY*.3,S*.9);bg.addColorStop(0,hs(palette,48,99));bg.addColorStop(.22,hs(palette+34,39,98));bg.addColorStop(.46,hs(palette+88,33,97));bg.addColorStop(.7,hs(palette+154,31,95));bg.addColorStop(1,hs(palette+220,27,90));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.globalCompositeOperation='screen';for(let k=0;k<7;k++){const q=k/6,ang=a*(.55+.09*k)+k*1.07,x=W*(.5+.46*Math.cos(ang)),y=H*(.5+.36*Math.sin(ang*.83)),r=S*(.25+.14*(.5+.5*Math.sin(a2+k)));const fog=ctx.createRadialGradient(x,y,0,x,y,r);const hh=palette+k*43+32*Math.sin(a*.8+k);fog.addColorStop(0,hs(hh,58,80,.085));fog.addColorStop(.3,hs(hh+22,46,88,.045));fog.addColorStop(.72,hs(hh+60,34,94,.018));fog.addColorStop(1,hs(hh,25,97,0));ctx.fillStyle=fog;ctx.fillRect(x-r,y-r,x+r,y+r)}ctx.globalCompositeOperation='source-over';
ctx.globalCompositeOperation='multiply';for(let k=0;k<30;k++){const q=k/29,y=H*(q-.5),amp=S*(.014+.035*b),ph=t*.11+k*.71;ctx.beginPath();for(let j=0;j<=90;j++){const x=-30+j/90*(W+60),u=x/W-.5,yy=H*.5+y+Math.sin(u*TAU*1.5+ph)*amp+Math.sin(u*TAU*4.2-ph*.55+k)*amp*.24;j?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.strokeStyle=hs(palette+20+k*8,24,66,.018+.012*b);ctx.lineWidth=.45;ctx.stroke()}ctx.globalCompositeOperation='source-over';
const N=58;for(let i=0;i<N;i++){const q=i/(N-1),g=ctx.createLinearGradient(W*.08,H*.12,W*.92,H*.88),base=298+q*214+hue;g.addColorStop(0,hs(base-42,54,68,.14));g.addColorStop(.18,hs(base,70,60,.76));g.addColorStop(.42,hs(base+78,57,72,.86));g.addColorStop(.67,hs(base+145,62,65,.82));g.addColorStop(.84,hs(base+190,58,61,.62));g.addColorStop(1,hs(base+225,52,62,.16));ctx.strokeStyle=g;ctx.lineWidth=.48+.64*(1-Math.abs(q-.5)*1.55);ctx.beginPath();for(let j=0;j<=360;j++){const u=-.015+j/360*1.03,z=spiralPoint(q,u,T(1),S);j?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1])}ctx.stroke()}
ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,r=S*(.105+.065*b),gl=ctx.createRadialGradient(X,Y,0,X,Y,r*5);gl.addColorStop(0,'rgba(255,252,225,.62)');gl.addColorStop(.18,'rgba(255,226,180,.19)');gl.addColorStop(.52,'rgba(210,220,255,.055)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));law+=(force*.9-law)*(1-Math.pow(.0009,dt));draw();requestAnimationFrame(frame)}frame();
function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;ht=(ht+(x/W-.5)*34+(y/H-.5)*22)%360;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));
function mutate(){ht=(ht+55+Math.random()*100)%360;law+=(Math.random()-.5)*.8}function reset(){px=tx=.5;py=ty=.49;force=ft=0;hue=ht=law=0}APKit.init({canvas,gifName:'spiral-spectrum-200-v8-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
