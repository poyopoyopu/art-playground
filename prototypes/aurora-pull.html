<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NORTH DRAW — なぞった線に、オーロラの裾が寄ってくる</title>
<!-- NORTH DRAW — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/21 試作
     おっちゃん「もう思い付かないのよねー」→ クロちゃんの3案(オーロラ/同期するホタル/墨流し)から「オーロラいいね、リアルなやつね」。
     世界のルール: なぞった線に、オーロラの裾(いちばん下の緑の縁)が寄ってくる。寄せた形は波になって、カーテンを横へ伝わっていく。
       何もしなくても: 星空と天の川の下で、オーロラのカーテンがゆっくり形を変え、光の筋が流れる。ときどき自然にブレイクアップが起きる
       なぞる  = 指の線の高さにオーロラの裾が引き寄せられ、その形が波になって左右へ伝わる(空が少しのあいだ形を覚える)
       タップ  = ブレイクアップ(オーロラの爆発): その場所から明るくなって横へ広がり、上が赤く、裾が紫に色づき、筋が速く踊る
       ✦      = 別の夜(山と森の形・カーテンの配置・オーロラの種類: ふつうの緑/嵐の夜/静かな夜/日本で見える赤いオーロラ)
       ↻      = 寄せた形を戻す
     本物っぽさ: 空を高さごとの薄い層に分けて、視線が各層を通る位置でカーテンの濃さを足し合わせる(だから縦の筋と奥行きの重なりが自然に出る)。
       色は高さで決まる(下の縁=緑の酸素557nm、上=赤の酸素630nm、激しい時の裾=紫の窒素)。手前に山と針葉樹のシルエット、それを映す湖。
     描画: WebGL1(フラグメントシェーダ1枚)。重い端末では描画解像度を自動で下げる。 -->
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#01030a;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 18px);text-align:center;color:rgba(230,255,240,.88);font:500 11px/1.7 system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;transition:opacity 1.2s}
#hint.off{opacity:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 112px);text-align:center;color:rgba(230,255,240,.88);font:500 11px/1.7 system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .7s}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">空をなぞると、オーロラの裾が指の線に寄ってくる<br>タップすると、オーロラが爆発する(ブレイクアップ)</div>
<div id="toast"></div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime, uSeed, uHor, uFl;
uniform float uBurst, uBurstX, uBurstAge;
uniform float uGreen, uRed, uPurple, uRays;
uniform vec3 uZ;
uniform sampler2D uDisp;
uniform float uQ;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float n1(float x,float s){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(hash(vec2(i,s)),hash(vec2(i+1.,s)),f); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
float fb2(vec2 p){ return n2(p)*.55+n2(p*2.1+3.1)*.28+n2(p*4.3+7.7)*.17; }

float disp(float x){ return texture2D(uDisp,vec2(clamp((x+8.)/16.,0.,1.),.5)).r*12.-6.; }

float curtainZ(float x,float k,float z0){
  float s=uSeed*3.7+k*17.;
  float slope=(hash(vec2(k,uSeed))-.5)*1.1;
  return z0+slope*x
    +2.6*(n1(x*.32+uTime*.016,s)-.5)
    +.9*(n1(x*1.1-uTime*.04,s+5.)-.5)
    +.22*(n1(x*4.2+uTime*.12,s+9.)-.5)
    +disp(x)*(1.-k*.25);
}

/* オーロラのカーテン=地上から立つ縦の幕。視線が幕を貫く点を求め、その高さで色、幕を斜めに見るほど明るく(ひだが光る) */
vec3 curtain(vec3 rd,float k,float z0){
  float s=z0/rd.z;
  for(int i=0;i<6;i++){ float zn=curtainZ(rd.x*s,k,z0)/rd.z; s=mix(s,zn,.65); }
  float x=rd.x*s, h=rd.y*s, hh=h-1.;
  if(s<=0. || hh<-.25 || hh>3.2) return vec3(0.);
  float e=.02, dzx=(curtainZ(x+e,k,z0)-curtainZ(x-e,k,z0))/(2.*e);
  float cosi=abs(rd.z-dzx*rd.x)/sqrt(1.+dzx*dzx);
  float L=1./max(cosi,.14);
  float pg=smoothstep(-.05,.06,hh)*(exp(-max(hh,0.)*2.)+.7*exp(-max(hh,0.)*12.)) + .15*smoothstep(-.25,0.,hh)*step(hh,0.);
  float pr=smoothstep(.5,1.6,hh)*exp(-(hh-1.6)*.8)*uRed*(.45+uBurst*1.2);
  float pp=smoothstep(-.03,0.,hh)*(1.-smoothstep(0.,.12,hh))*uPurple*(.25+uBurst*1.6);
  vec3 c=vec3(.18,1.,.48)*pg*uGreen+vec3(1.,.13,.28)*pr+vec3(.7,.25,1.)*pp;
  float r1=n1(x*7.+uTime*(.3+uBurst*1.4)+k*31.,uSeed+k);
  float r2=n1(x*24.-uTime*(.9+uBurst*3.)+k*7.,uSeed+k+.5);
  float r3=n1(x*61.+uTime*(2.+uBurst*4.),uSeed+k+.9);
  float rays=mix(1.,.12+1.2*r1*r1+.45*r2+.25*r3,uRays);
  float patch=.25+1.*n1(x*.35+uTime*.04,uSeed+k*3.);
  float bw=1.4+uBurstAge*2.2;
  float b=1.+uBurst*3.2*exp(-(x-uBurstX)*(x-uBurstX)/(bw*bw));
  return c*rays*patch*b*L*(1.-k*.2)/(1.+s*.04);
}
vec3 aurora(vec3 rd,float N){
  if(rd.y<.002||rd.z<.05) return vec3(0.);
  vec3 a=curtain(rd,0.,uZ.x)+curtain(rd,1.,uZ.y)+curtain(rd,2.,uZ.z);
  return a*.33;
}

float ridge(float x){ return uHor+.05+.075*fb2(vec2(x*2.2+uSeed*7.,uSeed))-.02*n1(x*11.+uSeed*3.,uSeed+2.); }
float forest(float x,float y){         // 針葉樹の並び(1=木の中)
  float yr=y-uHor;
  if(yr>.075) return 0.;
  float m=step(yr,.006+.004*n1(x*60.,uSeed));
  for(int j=-1;j<=1;j++){
    float w=.0105, ci=floor(x/w)+float(j);
    float hs=hash(vec2(ci,uSeed*5.));
    if(hs<.18) continue;
    float cxp=(ci+.5+(hash(vec2(ci,uSeed*9.))-.5)*.6)*w;
    float hgt=.012+.045*pow(hash(vec2(ci,uSeed*13.)),1.6);
    float u=abs(x-cxp);
    float tier=fract(yr/(.0055+hgt*.06));
    float half_=(hgt-yr)*.26*(.75+.5*tier);
    if(yr<hgt && u<half_) m=1.;
    if(yr<hgt*.25 && u<.0009) m=1.;
  }
  return m;
}

vec3 sky(vec3 rd,vec2 p,float N){
  float e=rd.y;
  vec3 c=mix(vec3(.018,.035,.06),vec3(.004,.008,.022),smoothstep(0.,.7,e));
  c+=vec3(.03,.05,.06)*exp(-max(e,0.)*14.);
  // 天の川
  float mwd=p.y-uHor-.35-(p.x)*.55;
  float mw=exp(-mwd*mwd/.025)*(.4+.8*fb2(p*7.+uSeed));
  c+=vec3(.05,.06,.08)*mw*.35;
  // 星
  vec2 sp=p*uRes.y/(3.2*uQ+1.);
  for(int l=0;l<2;l++){
    vec2 g=sp*(l==0?1.:.55); vec2 ci=floor(g); float h=hash(ci+uSeed+float(l)*7.);
    float th=l==0?.86-mw*.12:.965;
    if(h>th){
      vec2 o=vec2(hash(ci+1.3),hash(ci+2.7))*.8+.1;
      float d=length(fract(g)-o);
      float br=pow((h-th)/(1.-th),2.2)*(l==0?.7:1.6);
      float tw=.75+.25*sin(uTime*(2.+h*6.)+h*40.);
      c+=vec3(.85,.9,1.)*br*tw*smoothstep(.22,0.,d)*(1.-exp(-e*30.));
    }
  }
  vec3 a=aurora(rd,N);
  c+=a;
  c+=vec3(.0,.02,.012)*clamp(a.g*.6,0.,1.);    // オーロラで空も少し明るむ
  return c;
}

vec3 scene(vec2 p,float N,out float glow){
  vec3 rd=normalize(vec3(p.x,p.y-uHor,uFl));
  glow=0.;
  float rg=ridge(p.x);
  if(p.y<rg){
    // 山: 雪の稜線がオーロラの光をうっすら受ける
    float k=(rg-p.y);
    vec3 m=vec3(.012,.018,.03)+vec3(.02,.035,.03)*exp(-k*90.)*(.6+uBurst);
    m+=vec3(.025,.03,.04)*fb2(vec2(p.x*40.,p.y*80.))*exp(-k*25.);
    if(forest(p.x,p.y)>.5) m=vec3(.003,.005,.009);
    return m;
  }
  return sky(rd,p,N);
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  vec3 col; float g;
  if(p.y<uHor){
    // 湖: 上下を反転した景色を、さざ波で揺らして映す
    float dy=uHor-p.y;
    float rip=(n2(vec2(p.x*90.,p.y*420.+uTime*.8))-.5)*.006*(.3+dy*6.);
    vec2 q=vec2(p.x+rip,2.*uHor-p.y+rip*.3);
    col=scene(q,16.,g)*vec3(.5,.6,.68);
    col*=1.-smoothstep(.0,.35,dy)*.55;
    col+=vec3(.01,.015,.02)*smoothstep(.003,.0,dy);
  } else {
    col=scene(p,36.,g);
  }
  // 写真らしい階調
  col=1.-exp(-col*1.6);
  col=pow(col,vec3(.92));
  float v=length(p*vec2(.8,1.));
  col*=1.-.35*smoothstep(.35,.95,v);
  col+=(hash(gl_FragCoord.xy+fract(uTime*7.))-.5)*.018;
  gl_FragColor=vec4(col,1.);
}
</script>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var gl=cv.getContext('webgl',{antialias:false,preserveDrawingBuffer:true,alpha:false})||cv.getContext('experimental-webgl',{preserveDrawingBuffer:true});
function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ---------- シェーダ ---------- */
var VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
var prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent));
gl.linkProgram(prog); if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var al=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
var U={}; ['uRes','uTime','uSeed','uHor','uFl','uBurst','uBurstX','uBurstAge','uGreen','uRed','uPurple','uRays','uZ','uDisp','uQ'].forEach(function(n){ U[n]=gl.getUniformLocation(prog,n); });

/* 寄せた形(64区間)をテクスチャで渡す */
var NB=64, dU=new Float32Array(NB), dV=new Float32Array(NB), dBytes=new Uint8Array(NB*4);
var tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
function uploadDisp(){ for(var i=0;i<NB;i++){ var v=clamp((dU[i]+6)/12,0,1)*255; dBytes[i*4]=v; dBytes[i*4+3]=255; }
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,NB,1,0,gl.RGBA,gl.UNSIGNED_BYTE,dBytes); }
uploadDisp(); gl.uniform1i(U.uDisp,0);

/* ---------- 夜の種類 ---------- */
var KINDS=[
  {name:'ふつうの緑のオーロラ', green:1.0, red:.3, purple:.35, rays:.9, z:[3.6,6.5,11]},
  {name:'嵐の夜(赤と紫が強い)', green:1.15, red:1.2, purple:.9, rays:1.0, z:[3.2,5.2,8.5]},
  {name:'静かな夜(淡い緑)', green:.75, red:.2, purple:.1, rays:.6, z:[4.2,8,13]},
  {name:'日本で見える赤いオーロラ', green:.18, red:2.2, purple:.05, rays:.45, z:[9,13,18]}
];
var kind=KINDS[0], seed=rnd(0,50), Z=[3.6,6.5,11];
function newNight(i){ kind=KINDS[i]; seed=rnd(0,50); Z=kind.z.map(function(z){ return z*rnd(.9,1.1); }); }

/* ---------- 画面 ---------- */
var QF=(location.hash.match(/q=([\d.]+)/)||[])[1], W=0,H=0,DPR=1,Q=QF?+QF:0.7,hor=-0.2,fl=0.75;
function setup(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  var s=DPR*Q;
  cv.width=Math.max(2,Math.round(W*s)); cv.height=Math.max(2,Math.round(H*s));
  gl.viewport(0,0,cv.width,cv.height);
  var asp=W/H;
  hor=asp<1? -0.22 : -0.17;              // 地平線(画面の下から3割ほど)
  fl=asp<1? 0.62 : 0.85;
}

/* ---------- 触る ---------- */
function ptrToP(x,y){ return [(x-W/2)/H, (H/2-y)/H]; }       // シェーダのpと同じ座標
function ptrRay(x,y){ var p=ptrToP(x,y); return [p[0], p[1]-hor, fl]; }
function worldX(rd,z){ return rd[0]/rd[2]*z; }
var drags={}, burst=0, burstX=0, burstAge=0, clock=0, nextAuto=rnd(25,45);
function pull(x,y){
  var rd=ptrRay(x,y); if(rd[1]<=0.02) return;
  var zf=clamp(rd[2]/rd[1],1.6,16);                         // 裾(高さ1)がこの点に見える距離
  var wx=worldX(rd,zf), b=(wx+8)/16*(NB-1);
  for(var i=0;i<NB;i++){ var g=Math.exp(-(i-b)*(i-b)/3.2); dU[i]+=((zf-Z[0])-dU[i])*0.35*g; dV[i]*=1-0.5*g; }
}
function boom(x,y,str){
  var rd=ptrRay(x,y); if(rd[1]<=0.01) rd[1]=0.05;
  burstX=worldX(rd,Z[0]); burstAge=0; burst=Math.max(burst,str);
}

/* ---------- ループ ---------- */
var hint=document.getElementById('hint'), hinted=false;
function hideHint(){ if(!hinted){ hinted=true; hint.classList.add('off'); } }
setTimeout(hideHint,9000);
var toastEl=document.getElementById('toast'), toastT=0;
function toast(s,ms){ toastEl.textContent=s; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('on'); },ms||2500); }

cv.addEventListener('pointerdown',function(ev){
  if(window.APKit && APKit.isUI(ev.clientX,ev.clientY)) return true;
  ev.preventDefault(); hideHint();
  drags[ev.pointerId]={x0:ev.clientX,y0:ev.clientY,moved:false,t0:performance.now()};
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove',function(ev){
  var d=drags[ev.pointerId]; if(!d) return;
  if(!d.moved && Math.hypot(ev.clientX-d.x0,ev.clientY-d.y0)>8) d.moved=true;
  if(d.moved) pull(ev.clientX,ev.clientY);
});
function endPtr(ev){
  var d=drags[ev.pointerId]; if(!d) return;
  if(!d.moved && ev.type==='pointerup' && performance.now()-d.t0<500) boom(ev.clientX,ev.clientY,1);
  delete drags[ev.pointerId];
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);

function stepWave(dt){
  // 寄せた形は波になって左右へ伝わり、ゆっくり元に戻る
  var n=3, h=dt/n;
  for(var s=0;s<n;s++){
    for(var i=0;i<NB;i++){
      var l=dU[i>0?i-1:i], r=dU[i<NB-1?i+1:i];
      dV[i]+=(26*(l+r-2*dU[i]) - 0.9*dV[i] - 0.12*dU[i])*h;
    }
    for(i=0;i<NB;i++) dU[i]+=dV[i]*h;
  }
}

var last=performance.now(), perfT=0, perfN=0, tuned=0, perf={ms:0,n:0};
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now; clock+=dt;
  // 重い端末では描画解像度を下げる(最初の数秒で判定)
  perfT+=dt; perfN++;
  if(perfT>1.5 && tuned<4 && !QF){ var fps=perfN/perfT; if(fps<40 && Q>0.4){ Q-=0.12; setup(); } else if(fps>58 && Q<0.85 && tuned===0){ Q+=0.1; setup(); } tuned++; perfT=0; perfN=0; }
  stepWave(dt); uploadDisp();
  burstAge+=dt; burst*=Math.pow(0.82,dt);
  nextAuto-=dt;
  if(nextAuto<0){ nextAuto=rnd(30,60); boom(rnd(W*.2,W*.8),H*rnd(.3,.5),rnd(.5,.8)); }
  var a=performance.now();
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform1f(U.uTime,clock); gl.uniform1f(U.uSeed,seed); gl.uniform1f(U.uHor,hor); gl.uniform1f(U.uFl,fl);
  gl.uniform1f(U.uBurst,burst); gl.uniform1f(U.uBurstX,burstX); gl.uniform1f(U.uBurstAge,burstAge);
  gl.uniform1f(U.uGreen,kind.green); gl.uniform1f(U.uRed,kind.red); gl.uniform1f(U.uPurple,kind.purple); gl.uniform1f(U.uRays,kind.rays);
  gl.uniform3f(U.uZ,Z[0],Z[1],Z[2]); gl.uniform1f(U.uQ,Q);
  gl.drawArrays(gl.TRIANGLES,0,3);
  perf.ms+=performance.now()-a; perf.n++;
  requestAnimationFrame(frame);
}

function mutate(){ var i=(Math.random()*KINDS.length)|0; newNight(i); dU.fill(0); dV.fill(0); toast(kind.name,2200); }
function reset(){ dU.fill(0); dV.fill(0); toast('寄せた形を戻した',1500); }

var resizeT=0;
window.addEventListener('resize',function(){ clearTimeout(resizeT); resizeT=setTimeout(setup,200); });
newNight(0); setup();
requestAnimationFrame(frame);
window.__au={perf:perf,get Q(){return Q;},boom:boom,pull:pull,newNight:newNight};

if(window.APKit){
  APKit.init({
    canvas: cv,
    gifName: 'north-draw-loop',
    clockFormat: 'spec',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      {label:'✦', name:'mutate', onClick:function(){ mutate(); }},
      {label:'↻', name:'reset',  onClick:function(){ reset(); }}
    ]
  });
}
})();
</script>
</body>
</html>
