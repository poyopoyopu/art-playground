<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIQUID LAW</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  LIQUID LAW — Claude(クロちゃん)作

  世界のルール:
  触れた場所には亀裂(crease)が生まれ、そこから虹色の光が漏れ出す。
  亀裂は消えない。長押しすると、その場所がさらに深く融けて広がる。
  指を離すと、そこで固まって新しい球の一部になる——二度と元の
  無傷の球には戻らない(↻でのみリセット)。
  タップ = 新しい亀裂 / ドラッグ = 球を回す / ホールド = 亀裂を深める。
*/
const c = document.getElementById('c');
const gl = c.getContext('webgl', {antialias:true, alpha:false, preserveDrawingBuffer:true}) ||
           c.getContext('experimental-webgl', {antialias:true, alpha:false});

const VERT = `attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}`;
const FRAG = `
precision highp float;
uniform vec2 res;
uniform float ay,ax,hueT;
uniform vec4 tA[24];
uniform vec4 tB[24];
uniform int tCount;

vec3 hsv2rgb(vec3 c){
  vec3 p=abs(fract(c.xxx+vec3(0.0,2.0/3.0,1.0/3.0))*6.0-3.0);
  return c.z*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),c.y);
}
vec3 rotX(vec3 v,float a){float s=sin(a),co=cos(a);return vec3(v.x,co*v.y-s*v.z,s*v.y+co*v.z);}
vec3 rotY(vec3 v,float a){float s=sin(a),co=cos(a);return vec3(co*v.x+s*v.z,v.y,-s*v.x+co*v.z);}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*res)/min(res.x,res.y)*2.0;
  float r2=dot(uv,uv);
  float R=0.86;
  if(r2>R*R){
    float vig=smoothstep(R*R,R*R+0.6,r2);
    gl_FragColor=vec4(vec3(0.02,0.02,0.03)*(1.0-vig*0.6),1.0);
    return;
  }
  float z=sqrt(max(R*R-r2,0.0));
  vec3 nView=normalize(vec3(uv,z));
  vec3 nWorld=rotX(rotY(nView,-ay),-ax);

  float crease=0.0;
  float hueShift=0.0;
  for(int i=0;i<24;i++){
    if(i>=tCount) break;
    vec3 dir=tA[i].xyz;
    float strength=tA[i].w;
    float tangAng=tB[i].x;
    float curve=tB[i].y;
    float d=dot(nWorld,dir);
    vec3 up=abs(dir.y)<0.99?vec3(0.0,1.0,0.0):vec3(1.0,0.0,0.0);
    vec3 e1=normalize(cross(up,dir));
    vec3 e2=cross(dir,e1);
    vec3 proj=nWorld-dir*d;
    float pu=dot(proj,e1);
    float pv=dot(proj,e2);
    float cu=cos(tangAng)*pu-sin(tangAng)*pv;
    float cv=sin(tangAng)*pu+cos(tangAng)*pv;
    cv-=curve*cu*cu*6.0;
    float wu=0.10+0.035*strength;
    float wv=0.045+0.022*strength;
    float g=exp(-(cu*cu)/(wu*wu)-(cv*cv)/(wv*wv))*(0.5+0.5*strength);
    crease+=g;
    hueShift+=g*(tangAng/6.2831853);
  }
  crease=clamp(crease,0.0,1.6);

  vec3 viewDir=vec3(0.0,0.0,1.0);
  float fres=pow(1.0-max(dot(nView,viewDir),0.0),3.0);

  float hue=fract(hueT+fres*1.4+crease*0.5+hueShift);
  vec3 irid=hsv2rgb(vec3(hue,0.75,1.0));

  vec3 col=vec3(0.0);
  col+=irid*clamp(crease*1.1,0.0,1.0);
  col+=vec3(0.9,0.95,1.0)*pow(fres,6.0)*0.55;
  col+=irid*pow(fres,2.0)*crease*0.4;
  float rim=smoothstep(R*R*0.94,R*R,r2);
  col+=vec3(1.0)*rim*(0.15+0.3*pow(fres,1.5));

  gl_FragColor=vec4(col,1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VERT));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const U={
  res:gl.getUniformLocation(prog,'res'),
  ay:gl.getUniformLocation(prog,'ay'),
  ax:gl.getUniformLocation(prog,'ax'),
  hueT:gl.getUniformLocation(prog,'hueT'),
  tA:gl.getUniformLocation(prog,'tA'),
  tB:gl.getUniformLocation(prog,'tB'),
  tCount:gl.getUniformLocation(prog,'tCount')
};

let W,H,d=1;
function R(){
  d=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  c.width=W*d;c.height=H*d;
  gl.viewport(0,0,c.width,c.height);
}
addEventListener('resize',R);R();

const MAX=24;
let cracks=[];
let userAy=0,userAx=0;

function rotXjs(v,a){const s=Math.sin(a),co=Math.cos(a);return [v[0],co*v[1]-s*v[2],s*v[1]+co*v[2]];}
function rotYjs(v,a){const s=Math.sin(a),co=Math.cos(a);return [co*v[0]+s*v[2],v[1],-s*v[0]+co*v[2]];}
function norm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}

function screenToView(sx,sy){
  const R=0.86;
  const r2=sx*sx+sy*sy;
  if(r2>R*R) return null;
  const z=Math.sqrt(Math.max(R*R-r2,0));
  return norm3([sx,sy,z]);
}

function addCrack(dirWorld,strength,tangAng,curve){
  if(cracks.length>=MAX) return;
  cracks.push({dir:dirWorld,strength:strength,tang:tangAng,curve:curve});
}

function seedGenesis(){
  cracks=[];
  const n=2+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const lon=Math.random()*Math.PI*2, lat=Math.acos(2*Math.random()-1);
    const dir=[Math.sin(lat)*Math.cos(lon),Math.cos(lat),Math.sin(lat)*Math.sin(lon)];
    addCrack(dir,0.8+Math.random()*0.6,Math.random()*Math.PI*2,(Math.random()*2-1)*0.6);
  }
}
seedGenesis();

let downX=0,downY=0,downT=0,moved=false,dragging=false,lastX=0,lastY=0;
const HOLD_MS=340, MOVE_THRESH=8;

c.addEventListener('pointerdown',e=>{
  if(window.APKit && APKit.isUI(e.clientX,e.clientY)) return;
  downX=e.clientX;downY=e.clientY;downT=performance.now();
  lastX=e.clientX;lastY=e.clientY;
  moved=false;dragging=true;
  c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointermove',e=>{
  if(!dragging) return;
  if(window.APKit && APKit.isUI(e.clientX,e.clientY)) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(!moved && Math.hypot(e.clientX-downX,e.clientY-downY)>MOVE_THRESH) moved=true;
  if(moved){
    userAy+=dx*0.006;
    userAx=Math.max(-1.3,Math.min(1.3,userAx+dy*0.006));
  }
  lastX=e.clientX;lastY=e.clientY;
});
c.addEventListener('pointerup',e=>{
  if(!dragging) return;
  dragging=false;
  if(window.APKit && APKit.isUI(e.clientX,e.clientY)) return;
  if(moved) return;
  const min=Math.min(W,H);
  const sx=(e.clientX*d-0.5*W)/min*2;
  const sy=-(e.clientY*d-0.5*H)/min*2;
  const nView=screenToView(sx,sy);
  if(!nView) return;
  const curAy=userAy+autoYaw, curAx=userAx;
  const nWorld=norm3(rotXjs(rotYjs(nView,-curAy),-curAx));
  const held=performance.now()-downT;
  if(held>HOLD_MS){
    let near=null,best=0.14;
    for(const cr of cracks){
      const dd=Math.acos(Math.max(-1,Math.min(1,cr.dir[0]*nWorld[0]+cr.dir[1]*nWorld[1]+cr.dir[2]*nWorld[2])));
      if(dd<best){best=dd;near=cr;}
    }
    if(near){ near.strength=Math.min(3.0,near.strength+0.6); }
    else addCrack(nWorld,1.7,Math.random()*Math.PI*2,(Math.random()*2-1)*0.7);
  }else{
    addCrack(nWorld,1.0,Math.random()*Math.PI*2,(Math.random()*2-1)*0.6);
  }
});

let autoYaw=0,time=0;

function uploadCracks(){
  const A=new Float32Array(MAX*4), B=new Float32Array(MAX*4);
  for(let i=0;i<cracks.length;i++){
    const cr=cracks[i];
    A[i*4+0]=cr.dir[0];A[i*4+1]=cr.dir[1];A[i*4+2]=cr.dir[2];A[i*4+3]=cr.strength;
    B[i*4+0]=cr.tang;B[i*4+1]=cr.curve;B[i*4+2]=0;B[i*4+3]=0;
  }
  gl.uniform4fv(U.tA,A);
  gl.uniform4fv(U.tB,B);
  gl.uniform1i(U.tCount,cracks.length);
}

function render(ayVal,axVal,hueVal){
  gl.uniform2f(U.res,c.width,c.height);
  gl.uniform1f(U.ay,ayVal);
  gl.uniform1f(U.ax,axVal);
  gl.uniform1f(U.hueT,hueVal);
  uploadCracks();
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function loop(phase){
  autoYaw=phase;
  render(userAy+phase, userAx, phase/(2*Math.PI));
}

function anim(ms){
  time=ms*0.001;
  autoYaw=time*0.05;
  render(userAy+autoYaw, userAx, time*0.05);
  requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

APKit.init({
  canvas:c,
  gifName:'liquid-law-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:loop,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      for(const cr of cracks){ cr.tang=Math.random()*Math.PI*2; cr.curve=(Math.random()*2-1)*0.7; }
      if(cracks.length<MAX && Math.random()<0.5){
        const lon=Math.random()*Math.PI*2, lat=Math.acos(2*Math.random()-1);
        addCrack([Math.sin(lat)*Math.cos(lon),Math.cos(lat),Math.sin(lat)*Math.sin(lon)],1.0+Math.random()*0.8,Math.random()*Math.PI*2,(Math.random()*2-1)*0.6);
      }
    }},
    {label:'↻',name:'reset',onClick:function(){ seedGenesis(); userAy=0; userAx=0; }}
  ]
});
</script>
</body></html>
