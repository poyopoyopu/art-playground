<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRESSURE CATHEDRAL</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090806}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,phase=0,pressure=0,seed=Math.random()*6.28,anchor=null,holding=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){pressure=0;anchor=null;holding=false}function mutate(){seed=Math.random()*6.28;pressure=Math.random()*.35}
function down(x,y){if(window.APKit&&APKit.isUI(x,y))return true;anchor={x,y};holding=true;return true}function up(){holding=false;return true}
canvas.addEventListener('pointerdown',e=>down(e.clientX,e.clientY));canvas.addEventListener('pointermove',e=>{if(holding)anchor={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function draw(p=phase){if(holding)pressure=Math.min(1,pressure+.003);else pressure*=.997;ctx.fillStyle='#090806';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2,base=Math.min(W,H)*.43;ctx.save();ctx.translate(cx,cy);const squeeze=1-pressure*.58;
for(let layer=0;layer<18;layer++){const rr=base*(layer+1)/18;ctx.beginPath();const n=96;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;let sx=1,sy=1;if(anchor){const ax=anchor.x-cx,ay=anchor.y-cy;const d=Math.hypot(rr*Math.cos(a)-ax,rr*Math.sin(a)-ay);const pull=Math.max(0,1-d/(base*.65))*pressure*.8;sx=1-pull*(Math.abs(Math.cos(a))*squeeze);sy=1-pull*(Math.abs(Math.sin(a))*squeeze)}const wob=.018*Math.sin(a*(layer+3)+p*2+seed);const x=rr*Math.cos(a)*sx*(1+wob),y=rr*Math.sin(a)*sy*(1-wob);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`hsla(${38+layer*5+pressure*120},65%,${38+layer*2}%,${.12+layer*.018})`;ctx.lineWidth=1.1+pressure*1.2;ctx.stroke()}
for(let spoke=0;spoke<24;spoke++){const a=spoke*Math.PI*2/24+p*.08*(1-pressure);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*base,Math.sin(a)*base);ctx.strokeStyle=`hsla(${28+spoke*2},55%,65%,${.045+pressure*.08})`;ctx.stroke()}ctx.restore()}
function frame(){phase=(performance.now()%10000)/10000*Math.PI*2;draw();requestAnimationFrame(frame)}frame();APKit.init({canvas,gifName:'pressure-cathedral-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
