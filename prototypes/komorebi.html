<!doctype html>
<!-- KOMOREBI — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/31 試作。
     お題: 「静かで落ち着く」「自然の景色×光の幾何」。MOONLITがNORTH DRAWと雰囲気が近かったため、題材を変えて作り直し(おっちゃんが木漏れ日を選択)。
     世界のルール: 葉のすきまは、太陽の小さな像を地面に作る(ピンホール)。だから木漏れ日の1つ1つは「太陽の形」をしている。
       横になぞって日食を進めると、すべての光の斑点が同時に三日月になり、いちばん進むと細い金色の輪(金環日食)になる。世界は暗く涼しい色に。離すとゆっくり丸い光に戻る。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b140a">
<title>KOMOREBI — 木漏れ日は、太陽の形を映している</title>
<script src="../ap-kit.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b140a;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;text-align:center;pointer-events:none;color:#fffbe8;font:500 10px/1.9 ui-monospace,monospace;letter-spacing:.2em;text-shadow:0 2px 14px #000b;transition:opacity 1.6s}
#hint b{display:block;font:600 12px/1.9 ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em}
#hint.off{opacity:0}
#sun{white-space:pre;position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);pointer-events:none;color:#fff3cf;font:500 11px/1.7 ui-monospace,monospace;letter-spacing:.2em;opacity:.75;text-shadow:0 1px 8px #000}
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="sun"></div>
<div id="hint"><b>葉のすきまは、太陽の小さな像をつくる</b>ひとりでに進む · タップで一時停止 · なぞると動かせる</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),hint=document.getElementById('hint'),sunEl=document.getElementById('sun');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
const DBG=(new URLSearchParams(location.search)).get('f');/* ?f=0 のように日食の時間(-1=前,0=最大,1=あと)を指定して確かめられる */
let W=1,H=1,scale=1,t=0,last=0,alive=true,touched=false,slow=0,seed=0,held=null,lastTouch=-99;
/* 日食が1周する長さ(秒)。⏱で 20秒/60秒/3分/10分 を切り替え、端末に保存する。?sec=90 のようにURLでも指定できる */
const PRESETS=[20,60,180,600];
function fmtSec(v){return v>=120?(v%60===0?(v/60)+'分':(v/60).toFixed(1)+'分'):v+'秒'}
let cycle=60;
try{const q=parseFloat((new URLSearchParams(location.search)).get('sec'));const sv=parseFloat(localStorage.getItem('komorebi-cycle'));
  cycle=q>0?q:(sv>0?sv:60)}catch(_){}
cycle=Math.max(5,Math.min(3600,cycle));
let paused=false,press=null;/* タップで一時停止/再開 */
let rest=0;/* 自動の日食が1周したあと、光が丸い状態で休む秒数 */
let F=DBG!==null?parseFloat(DBG):-1,tgt=F,theme=(new URLSearchParams(location.search)).get('theme')==='neon'?1:0;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes;uniform float uT,uF,uCov,uMR,uSeed,uTh;
float h2(vec2 p){p=fract(p*vec2(123.34,456.21)+uSeed*.013);p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x),mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,v=0.;for(int i=0;i<5;i++){v+=a*n2(p);p=p*2.03+vec2(17.1,9.7);a*=.5;}return v;}
/* 太陽の像(円)から月の円を引いたもの。日食が進むほど三日月→細い輪(金環)になる */
float kernel(vec2 d,float r){
  float aa=1.2/uRes.y+r*.07;
  float sun=smoothstep(r+aa,r-aa,length(d));
  vec2 off=normalize(vec2(.8,.6))*uF*1.9*r;/* 月は太陽の手前を通り過ぎる。中央(uF=0)で重なり、過ぎると三日月は反対向きになる */
  float moon=smoothstep(r*uMR+aa,r*uMR-aa,length(d-off));
  return sun*(1.-moon);
}
/* 葉のすきま: 1マスに最大1つ。ゆらゆら揺れる。木漏れ日の層ごとに大きさが違う */
/* 虹の色(0〜1で一周) */
vec3 rainbow(float h){return .5+.5*cos(6.2832*(h+vec3(0.,.33,.67)));}
vec3 dapples(vec2 p,float cs,float prob,float rb,float so){
  vec2 g=p/cs,id=floor(g);vec3 sum=vec3(0.);
  for(int dy=-1;dy<=1;dy++)for(int dx=-1;dx<=1;dx++){
    vec2 cell=id+vec2(float(dx),float(dy));
    float h=h2(cell+so);
    if(h<prob){
      vec2 c=(cell+.2+.6*vec2(h2(cell+so+3.),h2(cell+so+7.)))*cs;
      c+=vec2(sin(uT*.45+h*40.),cos(uT*.38+h*31.))*rb*.4;
      float r=rb*(.65+.7*h2(cell+so+11.));
      /* 色収差: 赤と青で像が少しずれる。日食が進むほど、縁の虹がはっきり出る */
      vec2 dd=normalize(vec2(.8,.6))*r*(.035+.05*uCov);
      vec3 k=vec3(kernel(p-c-dd,r),kernel(p-c,r),kernel(p-c+dd,r));
      /* 斑点ごとに、少し違う色を帯びる(日食が進むほど虹色に。皆既で光と一緒に消える) */
      float amt=mix((.3+.55*uCov)*(1.-smoothstep(.9,1.,uCov)),.95*(1.-smoothstep(.97,1.,uCov)),uTh);
      vec3 hc=mix(vec3(1.),rainbow(h2(cell+so+19.)+uT*.015)*mix(1.5,1.9,uTh),amt);
      sum+=k*hc;
      /* ネオン: 光の斑点のまわりに、にじむ光 */
      sum+=hc*exp(-length(p-c)/(r*1.5))*smoothstep(cs*.9,cs*.4,length(p-c))*.22*uTh*(1.-uCov*.85);/* マス目の端で切れないよう、内側で消す */
    }
  }
  return sum;
}
/* 落ち葉(秋の色) */
vec3 gNeon;
vec4 leaf(vec2 p,float sc){
  float cs=.11;vec2 g=p/cs,id=floor(g);
  float h=h2(id+41.);if(h>.55)return vec4(0.);
  vec2 c=(id+.3+.4*vec2(h2(id+43.),h2(id+47.)))*cs;
  float th=h2(id+53.)*6.2832;vec2 d=p-c;
  vec2 q=vec2(cos(th)*d.x+sin(th)*d.y,-sin(th)*d.x+cos(th)*d.y);
  float a=(.03+.012*h2(id+59.))*sc,b=(.013+.004*h2(id+61.))*sc;
  gNeon=rainbow(h2(id+73.))*1.4;
  float u=q.x/a;
  float body=step(abs(u),1.)*smoothstep(1.,.8,abs(q.y)/(b*max(1.-u*u,.02)));
  float vein=smoothstep(.0012,.0,abs(q.y))*step(abs(u),.95);
  float k=h2(id+67.);
  vec3 col=k<.25?vec3(.72,.26,.07):(k<.5?vec3(.86,.56,.12):(k<.75?vec3(.5,.16,.05):vec3(.42,.48,.1)));
  col=col*(.85+.3*h2(id+71.))*(1.-.35*vein);
  return vec4(col,body);
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  /* 地面: 苔と土 */
  float g1=.35,g2=.5;/* 背景のムラ(ウネウネ)は無し */
  vec3 ground=mix(vec3(.04,.075,.03),vec3(.14,.2,.07),g1);
  ground*=.8+.4*smoothstep(-.55,.55,p.y);
  ground*=.8+.4*g2;
  vec4 lf=leaf(p,1.);
  ground=mix(ground,lf.rgb*.55,lf.a);
  /* 木もれ日: 林冠が混んでいる所は暗く、すいている所に光が集まる */
  float M=1.;
  vec3 D=dapples(p,.15,.6,.036,0.)+dapples(p,.078,.55,.019,31.)*.9+dapples(p,.042,.5,.0095,67.)*.8;
  vec3 shine=clamp(D,vec3(0.),vec3(1.2))*(.18+.82*M);
  float diffuse=0.;
  /* 日食が進むと、光は暗く涼しい色に */
  float e=uCov;
  float dim=max(1.-e*.97,.02);
  vec3 lightC=mix(vec3(1.,.82,.46),vec3(1.,.72,.34),e*.8);
  vec3 amb=mix(vec3(.9,1.05,.85),vec3(.7,.86,1.),e*.6)*mix(1.,.5,e);
  vec3 col=ground*(amb*.5+lightC*(3.6*shine+.5*diffuse)*dim);
  float tot=smoothstep(.93,1.,e);/* 皆既: 地平線の夕焼けのような橙があたりをうっすら照らす */
  col+=vec3(.5,.2,.08)*tot*(.35+.65*g1)*(.25+ground.g*2.);
  col+=lightC*vec3(1.,.97,.9)*shine*(.85+.7*e)*dim+lightC*diffuse*.06*dim;
  float nearT=exp(-pow((abs(uF)-.2)*7.,2.))*step(.55,e);
  float bands=smoothstep(.2,.8,.5+.5*sin((p.x*.9+p.y*.55+.06*sin(p.y*20.+uT))*75.+uT*9.));
  if(uTh>.5){
    /* ネオン: 暗い藍の地面に、落ち葉は輪郭だけネオン管のように光り、光の斑点が蛍光色でにじむ */
    vec3 nb=vec3(.012,.008,.04)+vec3(.025,.012,.06)*g1;
    vec4 lo=leaf(p,1.);vec3 nl=gNeon;vec4 li=leaf(p,.74);
    float outl=clamp(lo.a-li.a,0.,1.);
    nb+=nl*outl*.85+nl*lo.a*.05;
    float dimN=mix(1.,.55,e);
    col=nb+D*(.35+.65*M)*1.9*dimN;
  }
  float vg=smoothstep(1.15,.25,length(p*vec2(.85,.62)));
  col*=.62+.38*vg;
  col=1.-exp(-col*mix(1.35,1.15,uTh));
  col=pow(col,vec3(.94));
  col+=(h2(gl_FragCoord.xy+uT)-.5)*.012;
  gl_FragColor=vec4(col,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uRes','uT','uF','uCov','uMR','uSeed','uTh'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
function resize(){
  W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5)*scale;
  canvas.width=Math.max(2,Math.round(W*d));canvas.height=Math.max(2,Math.round(H*d));canvas.style.width=W+'px';canvas.style.height=H+'px';
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize,{passive:true});
function setF(cx){tgt=Math.max(0,Math.min(1,(cx-W*.08)/(W*.84)))*2-1}
/* 太陽(半径1)と月(半径mr)の重なりの割合 */
function cover(f,mr){const d=Math.abs(f)*1.9,R=1;if(d>=R+mr)return 0;if(d<=Math.abs(R-mr))return mr>=R?1:mr*mr;
  const a=R*R*Math.acos((d*d+R*R-mr*mr)/(2*d*R))+mr*mr*Math.acos((d*d+mr*mr-R*R)/(2*d*mr))-.5*Math.sqrt((-d+mr+R)*(d+mr-R)*(d-mr+R)*(d+mr+R));return Math.min(1,a/Math.PI)}
function reset(){F=-1;tgt=-1;lastTouch=-99;rest=3;paused=false}
function nextCycle(){let i=PRESETS.findIndex(v=>v>cycle+.5);cycle=PRESETS[i<0?0:i];try{localStorage.setItem('komorebi-cycle',String(cycle))}catch(_){}}
function mutate(){seed=Math.random()*80;theme=1-theme}/* ✦: 森⇄ネオン。森は皆既日食、ネオンは金環日食 */
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  touched=true;hint.classList.add('off');try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  held=e.pointerId;lastTouch=t;press={x:e.clientX,y:e.clientY,t0:t,drag:false};e.preventDefault();/* 押している間は止まる。タップなら一時停止/再開、なぞるなら時間を動かす */
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(held===e.pointerId&&press){
  if(!press.drag&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10)press.drag=true;
  if(press.drag){lastTouch=t;setF(e.clientX)}}});
function up(e){if(held===e.pointerId){
  if(press&&!press.drag&&t-press.t0<.35){paused=!paused;tgt=F}/* 短いタップ: 一時停止 ⇄ 再開 */
  if(press&&press.drag&&paused)tgt=F;
  held=null;lastTouch=t;press=null}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
function frame(ts){
  if(!alive)return;const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;t+=dt;
  slow=slow*.95+dt*.05;if(slow>.03&&scale>.5){scale*=.85;slow=.016;resize()}
  /* なぞったあと約6秒で、ゆっくり日食が終わって丸い光に戻る */
  /* なぞっていない間は、ひとりでに日食が進む(約60秒で前→皆既→あと。そのあと少し休んで、また最初から) */
  if(DBG===null&&held===null&&!paused&&t-lastTouch>6){
    if(rest>0)rest-=dt;else{F+=dt*(2/cycle);if(F>=1){F=-1;rest=12}}
    tgt=F;
  }else{const k=1-Math.exp(-dt*(held!==null?6:2.5));F+=(tgt-F)*k}
  const total=theme===0,mr=total?1.03:.88,cov=cover(F,mr),hid=Math.round(cov*100);
  sunEl.textContent=(paused?'⏸ 一時停止  ':'')+'1周 '+fmtSec(cycle)+'\n'+(theme?'NEON  ':'FOREST  ')+'太陽の欠け '+hid+'%  '+(cov>.995?(total?'皆既日食':'金環日食'):(Math.abs(F)<.02?'':(F<0?'欠けていく':'戻っていく')));
  gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uT,t);gl.uniform1f(U.uF,F);gl.uniform1f(U.uCov,cov);gl.uniform1f(U.uMR,mr);gl.uniform1f(U.uTh,theme);gl.uniform1f(U.uSeed,seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(!touched&&t>18)hint.classList.add('off');
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)alive=false;else if(!alive){alive=true;last=performance.now();requestAnimationFrame(frame)}});
resize();
APKit.init({canvas,gifName:'komorebi-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:mutate},
  {label:'⏱',name:'speed',onClick:nextCycle},
  {label:'↻',name:'reset',onClick:reset}
]});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
