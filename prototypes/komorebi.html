     世界のルール: 葉のすきまは、太陽の小さな像を地面に作る(ピンホール)。だから木漏れ日の1つ1つは「太陽の形」をしている。
       横になぞって日食を進めると、すべての光の斑点が同時に三日月になり、いちばん進むと細い金色の輪(金環日食)になる。世界は暗く涼しい色に。離すとゆっくり丸い光に戻る。 -->

function resize(){
  W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5)*scale;
  canvas.width=Math.max(2,Math.round(W*d));canvas.height=Math.max(2,Math.round(H*d));canvas.style.width=W+'px';canvas.style.height=H+'px';
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize',resize,{passive:true});
function setF(cx){tgt=Math.max(0,Math.min(1,(cx-W*.08)/(W*.84)))*2-1}
/* 太陽(半径1)と月(半径mr)の重なりの割合 */
function cover(f,mr){const d=Math.abs(f)*1.9,R=1;if(d>=R+mr)return 0;if(d<=Math.abs(R-mr))return mr>=R?1:mr*mr;
  const a=R*R*Math.acos((d*d+R*R-mr*mr)/(2*d*R))+mr*mr*Math.acos((d*d+mr*mr-R*R)/(2*d*mr))-.5*Math.sqrt((-d+mr+R)*(d+mr-R)*(d-mr+R)*(d+mr+R));return Math.min(1,a/Math.PI)}
function save(k,v){try{localStorage.setItem(k,String(v))}catch(_){}}
function restart(run){F=-1;tgt=-1;rest=0;ended=false;running=run}
function cancelUntil(){until=null;bus=-1;save('komorebi-until','');save('komorebi-bus','')}
function reset(){cancelUntil();restart(loop);rest=loop?3:0}/* 最初から。くり返すなら自動で進み、くり返さないなら「スタート」を待つ */
function mutate(){seed=Math.random()*80;theme=(theme+1)%THEMES.length;save('komorebi-theme',theme)}/* ✦: 配置を作り直し、模様を次へ */
function setCycle(v){if(until)cancelUntil();cycle=Math.max(5,Math.min(3600,v));save('komorebi-cycle',cycle);refreshMenu()}
function defaultUntil(){const d=new Date(Date.now()+30*60000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function busPlan(stop,fromMs){
  const nd=nextDep(stop,fromMs);if(!nd)return null;const af=nextDep(stop,nd.t);
  return {s:fromMs,t:nd.t,bus:true,label:STOPS[stop]+'  '+hm(nd.h,nd.m)+' 発'+(nd.day?'(明日)':''),note:nd.note,after:af?hm(af.h,af.m)+(af.day?'(明日)':''):''}}
function startBus(stop){
  const u=busPlan(stop,Date.now());if(!u)return;bus=stop;until=u;save('komorebi-bus',stop);save('komorebi-until','');
  restart(true);ended=false;toggleMenu(false)}
function startUntil(){
  const m=/^(\d{1,2}):(\d{2})/.exec(untilTime||defaultUntil());if(!m)return;
  const now=Date.now(),d=new Date(now);d.setHours(+m[1],+m[2],0,0);
  let tt=d.getTime();if(tt<=now+1000)tt+=86400000;/* すでに過ぎていたら、翌日の同じ時刻まで */
  until={s:now,t:tt,label:('0'+m[1]).slice(-2)+':'+m[2]};save('komorebi-until',JSON.stringify(until));save('komorebi-until-time',untilTime||defaultUntil());
  restart(true);ended=false;toggleMenu(false)}
function toggleRun(){
  if(until)cancelUntil();
  if(ended||(!loop&&F>=.999)){restart(true)}/* 終わったあとは、最初からスタート */
  else running=!running;
  refreshMenu()}
function setLoop(v){loop=v;save('komorebi-loop',v?1:0);if(loop&&ended&&rest<=0){restart(true)}refreshMenu()}
let warned=false,wentShown=false,flashUntil=0;const flashEl=document.getElementById('flash');
function buzzShort(){try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(_){}}
function flashNow(){flashEl.classList.remove('on');void flashEl.offsetWidth;flashEl.classList.add('on');flashUntil=Date.now()+2800}
function buzz(){try{navigator.vibrate&&navigator.vibrate([220,120,220,120,400])}catch(_){}}
/* 画面は、なぞると日食の時間を動かせるだけ(タップでは何も起きない) */
const cornerTaps=[];let tapT0=0;
function inRect(el,x,y){if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&x>=r.left-14&&x<=r.right+14&&y>=r.top-14&&y<=r.bottom+14}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  tapT0=performance.now();
  if(!TIMER_ON&&e.clientX<90&&e.clientY<130){const n=Date.now();cornerTaps.push(n);while(cornerTaps.length&&n-cornerTaps[0]>4000)cornerTaps.shift();
    if(cornerTaps.length>=5){try{localStorage.setItem('komorebi-timer','1')}catch(_){}location.reload();return}}
  touched=true;hint.classList.add('off');try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  held=e.pointerId;press={x:e.clientX,y:e.clientY,drag:false};e.preventDefault();
},{passive:false});
canvas.addEventListener('pointermove',e=>{if(held===e.pointerId&&press){
  if(!press.drag&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10)press.drag=true;
  if(press.drag){setF(e.clientX);fingerF=tgt;if(!until){F=tgt;ended=false}}}});
function up(e){if(held===e.pointerId){
  /* 時計(または残り時間)の上を短くタップしたら、タイマーのメニューを開く(隠しメニューが有効な端末だけ) */
  if(TIMER_ON&&e.type==='pointerup'&&press&&!press.drag&&performance.now()-tapT0<400&&(inRect(document.querySelector('.apk-clock.apk-on'),e.clientX,e.clientY)||inRect(cdEl,e.clientX,e.clientY)))toggleMenu(true);
  held=null;press=null}}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
/* ---- メニュー(☰): タイマーの時間・スタート/一時停止・くり返し・模様 ---- */
const menu=document.createElement('div');menu.id='menu';menu.hidden=true;document.body.appendChild(menu);
function mmss(v){return ('0'+Math.floor(v/60)).slice(-2)+':'+('0'+(v%60)).slice(-2)}
function refreshMenu(){
  if(menu.hidden)return;
  const startLabel=running?'⏸ 一時停止':((ended||(!loop&&F>=.999)||F<=-.999)?'▶ スタート':'▶ 再開');
  if(!untilTime)untilTime=defaultUntil();
  menu.innerHTML='<div class="row"><button class="big" data-a="wait60">⏳ 1分待機を始める</button></div>'
   +'<div class="mh"><b>BUS · パレット・ライド</b><button class="x" data-a="close" aria-label="閉じる">✕</button></div>'
   +'<div class="row">'+STOPS.map((n,i)=>'<button class="'+(bus===i?'on':'')+'" data-a="bus" data-v="'+i+'">'+(i+1)+' '+n+'</button>').join('')+'</div>'
   +(bus>=0&&until?'<div class="row"><span class="note">次の発車 '+until.label.split('  ')[1]+(until.after?'(その次 '+until.after+')':'')+'</span><button data-a="cancel">解除</button></div>':'<div class="row"><span class="note">乗る停留所を選ぶと、次の発車までを数えます</span></div>')
   +'<div class="mh sub"><b>UNTIL</b></div>'
   +'<div class="row"><input type="time" id="tu" value="'+untilTime+'" aria-label="この時刻までカウントダウン"></div>'
   +'<div class="row"><button class="big" data-a="until">▶ '+(untilTime||'')+' までカウントダウン</button></div>'
   +(until&&!until.bus?'<div class="row"><span class="note">'+until.label+' まで数えています</span><button data-a="cancel">解除</button></div>':'')
   +'<div class="mh sub"><b>TIMER</b></div>'
   +'<div class="mt">'+mmss(cycle)+'</div>'
   +'<div class="row"><button data-a="m10">−10秒</button><button data-a="p10">+10秒</button></div>'
   +'<div class="row">'+CHIPS.map(v=>'<button class="'+(!until&&cycle===v?'on':'')+'" data-a="c" data-v="'+v+'">'+fmtSec(v)+'</button>').join('')+'</div>'
   +'<div class="row"><button class="big" data-a="run">'+(until?'▶ スタート':startLabel)+'</button><button data-a="rs">↺ 最初から</button></div>'
   +'<div class="row"><button class="'+(loop?'on':'')+'" data-a="loop">くり返す '+(loop?'ON':'OFF')+'</button></div>';
}
menu.addEventListener('input',e=>{if(e.target.id==='tu'){untilTime=e.target.value;save('komorebi-until-time',untilTime);const b=menu.querySelector('[data-a=until]');if(b)b.textContent='▶ '+(untilTime||'')+' までカウントダウン'}});
menu.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,v=parseFloat(b.dataset.v);
  if(a==='close'){toggleMenu(false);return}
  if(a==='until'){startUntil();return}
  if(a==='wait60'){cancelUntil();cycle=60;loop=false;restart(true);toggleMenu(false);return}/* 押した瞬間から60秒。終わると知らせて止まる */
  if(a==='bus'){startBus(v);return}
  if(a==='cancel'){cancelUntil();restart(loop);rest=loop?3:0;refreshMenu();return}
  if(a==='m10')setCycle(cycle-10);else if(a==='p10')setCycle(cycle+10);else if(a==='c')setCycle(v);
  else if(a==='run')toggleRun();else if(a==='rs'){cancelUntil();restart(false);refreshMenu()}
  else if(a==='loop')setLoop(!loop);
});
if(TIMER_ON)hint.lastChild.textContent='☰で停留所を選ぶと、発車までを数えます';
function toggleMenu(on){if(!TIMER_ON)return;menu.hidden=on===undefined?!menu.hidden:!on;if(!menu.hidden)refreshMenu()}
let lastReal=performance.now();/* 待ち時間を測るため、日食の進みは実際の時計で数える(重い端末や、画面が止まっていた間も遅れない) */
function frame(ts){
  const nowR=performance.now(),rdt=Math.min(Math.max(0,(nowR-lastReal)/1000),cycle*2);lastReal=nowR;
  if(!alive)return;const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;t+=dt;
  slow=slow*.95+dt*.05;if(slow>.03&&scale>.5){scale*=.85;slow=.016;resize()}
  /* 日食は実際の時計で進む。なぞっている間と一時停止中は進まない。くり返さない設定では、1周して止まり、「おわり」と知らせる */
  const dragging=press&&press.drag&&!until;
  if(until){
    /* 指定時刻まで: 日食は、開始から目標時刻までの進み具合に合わせる(実際の時計) */
    const now=Date.now(),tot=until.t-until.s,el=Math.min(tot,Math.max(0,now-until.s));F=-1+2*el/tot;tgt=F;
    if(press&&press.drag)F=fingerF;/* なぞっている間は見た目だけ動かす。残り時間は実際の時計のままで、離すと時刻どおりの位置に戻る */
    if(now>=until.t){
      if(until.bus){buzz();flashNow();busFlash=now+8000;const u=busPlan(bus,now);if(u){until=u;F=-1;tgt=-1}}/* 発車: 次の便のカウントダウンへ */
      else if(!ended){ended=true;running=false;buzz();save('komorebi-until','');refreshMenu()}}
  }else if(DBG===null&&running&&!dragging){
    if(rest>0)rest-=rdt;else{F+=rdt*(2/cycle);if(F>=1){
      if(loop){F=-1;rest=12;ended=true}else{F=1;running=false;ended=true;buzz();refreshMenu()}}}
    tgt=F;
  }else{F+=(tgt-F)*(1-Math.exp(-dt*6))}
  const total=TOTAL[theme],mr=total?1.03:.88,cov=cover(F,mr),hid=Math.round(cov*100);
  /* 残り時間: 日食の始まり(F=-1)から終わり(F=+1)までが「1周」。残りは (1-F)/2 × 1周 */
  if(!until&&loop&&rest<=0)ended=false;
  const left=ended?0:(until?Math.max(0,(until.t-Date.now())/1000):Math.max(0,(1-F)/2*cycle)),ls=Math.ceil(left-.001);
  /* 定刻の10秒前に予告(振動+色+脈打ち)、定刻に発車の知らせ(画面が光る+点滅)。iPhoneのSafariは振動が使えないので、色と光でも知らせる */
  const active=(until||(!loop&&running))&&!ended;
  const warnNow=active&&left>0&&left<=10;
  if(warnNow&&!warned){warned=true;buzzShort()}
  if(!warnNow&&left>10)warned=false;
  let goNow=ended&&!wentShown;if(ended&&!wentShown){wentShown=true;flashEl.classList.remove('on');void flashEl.offsetWidth;flashEl.classList.add('on')}
  if(!ended)wentShown=false;
  if(until&&until.bus&&Date.now()<busFlash)goNow=true;
  cdEl.className=(ended?'end ':'')+(warnNow?'warn ':'')+((goNow||Date.now()<flashUntil)?'go':'');
  const hh=Math.floor(ls/3600),mm=Math.floor(ls%3600/60),ss=ls%60;
  cdEl.querySelector('.t').innerHTML=ended?'00<i>:</i>00':(hh>0?hh+'<i>:</i>':'')+('0'+mm).slice(-2)+'<i>:</i>'+('0'+ss).slice(-2);
  if(until&&until.bus&&!ended){
    cdEl.querySelector('.d').textContent=(Date.now()<busFlash?'発車しました  ·  次の便':'次の発車')+'\n'+until.label+(until.note?'('+until.note+')':'')+(until.after?'\n次 '+until.after:'');
  }else cdEl.querySelector('.d').textContent=(ended?'おわり':(until?until.label+' まで':(!running?(F<=-.999?'スタート待ち':'一時停止'):'あと')))+'  ·  太陽の欠け '+hid+'%  '+(cov>.995?(total?'皆既日食':'金環日食'):(Math.abs(F)<.02?'':(F<0?'欠けていく':'戻っていく')));
  gl.uniform2f(U.uRes,canvas.width,canvas.height);gl.uniform1f(U.uT,t);gl.uniform1f(U.uF,F);gl.uniform1f(U.uCov,cov);gl.uniform1f(U.uMR,mr);gl.uniform1f(U.uTh,theme);gl.uniform1f(U.uSeed,seed);
  gl.drawArrays(gl.TRIANGLES,0,3);
  if(!touched&&t>18)hint.classList.add('off');
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)alive=false;else if(!alive){alive=true;last=performance.now();requestAnimationFrame(frame)}});
resize();
APKit.init({canvas,gifName:'komorebi-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:mutate}].concat(TIMER_ON?[{label:'☰',name:'menu',onClick:()=>toggleMenu()}]:[]).concat([
  {label:'↻',name:'reset',onClick:reset}
])});
/* 隠しメニュー: ap-kitの🕐ボタンを4秒以内に5回タップしても有効になる(ap-kit.jsは変更せず、画面全体で押された🕐の回数を数えるだけ。ボタンが後から作られても数えられる) */
if(!TIMER_ON){
  const clockTaps=[];
  document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('button');
    if(!b||b.textContent.trim()!=='🕐')return;
    const n=Date.now();clockTaps.push(n);while(clockTaps.length&&n-clockTaps[0]>4000)clockTaps.shift();
    if(clockTaps.length>=5){try{localStorage.setItem('komorebi-timer','1')}catch(_){}location.reload()}},true);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
