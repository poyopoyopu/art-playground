<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TENFOLD MEMBRANE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*50,mode=0,tx=.5,ty=.5,ax=.5,ay=.5,t0=performance.now();const TAU=Math.PI*2,P=[[[22,218,244],[117,76,255],[245,70,190],[255,181,79]],[[44,240,178],[40,151,255],[194,92,255],[255,229,111]],[[255,79,157],[103,67,248],[25,216,236],[255,151,70]]];function resize(){D=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function bg(t){const s=Math.min(W,H),p=P[mode];ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);ctx.save();ctx.globalCompositeOperation='screen';for(let j=0;j<5;j++){const q=j*TAU/5-t*.055*(j%2?1:-1),x=W*(.5+.28*Math.cos(q)),y=H*(.5+.34*Math.sin(q)),g=ctx.createRadialGradient(x,y,0,x,y,s*.28),col=p[(j+1)%4];g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.065)`);g.addColorStop(.35,`rgba(${col[0]},${col[1]},${col[2]},.022)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.restore();const vg=ctx.createRadialGradient(W*ax,H*ay,0,W*ax,H*ay,s*.62);vg.addColorStop(0,'rgba(20,30,55,.08)');vg.addColorStop(.55,'rgba(5,8,18,.02)');vg.addColorStop(1,'rgba(0,0,0,.58)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}function pathFor(i,t){const n=112,s=Math.min(W,H),pts=[];const u0=(i-4.5)/4.5;for(let k=0;k<=n;k++){const q=k/n,x=W*(.10+.80*q),yy=H*.5+H*.27*u0;let y=yy+H*(.10+.025*Math.sin(i*1.7+seed)) * Math.sin(q*TAU*1.15+t*.18+i*.47);for(let h=0;h<3;h++){const cx=W*(.27+h*.23+.06*Math.sin(t*.11+h*2+i*.17)),cy=H*(.5+.26*Math.sin(t*.13+h*2.1+i*.29)),dx=(x-cx)/s,dy=(y-cy)/s,r2=dx*dx+dy*dy+.035;const force=.050*Math.sin(t*.23+h*1.7+i*.31)/r2; y+=dy*force*s; }y+=H*.045*Math.sin(q*TAU*2-t*.12+i*.71+seed)*(.25+.75*q*(1-q));const z=.45*Math.sin(q*TAU+t*.16+i*.8)+.25*Math.sin(q*TAU*2-t*.08+i);pts.push([x,y,z])}return pts}function ribbon(i,t){const p=P[mode],pts=pathFor(i,t),s=Math.min(W,H),width=s*(.012+.003*Math.sin(i));ctx.save();ctx.globalCompositeOperation='screen';ctx.beginPath();for(let k=0;k<pts.length;k++){const q=pts[k],q2=pts[Math.min(pts.length-1,k+1)],dx=q2[0]-q[0],dy=q2[1]-q[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=width*(.55+.55*Math.sin(Math.PI*k/(pts.length-1)));const x=q[0]+nx*w,y=q[1]+ny*w;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}for(let k=pts.length-1;k>=0;k--){const q=pts[k],q2=pts[Math.max(0,k-1)],dx=q[0]-q2[0],dy=q[1]-q2[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=width*(.55+.55*Math.sin(Math.PI*k/(pts.length-1))),x=q[0]-nx*w,y=q[1]-ny*w;ctx.lineTo(x,y)}ctx.closePath();const a=p[i%4],b=p[(i+1)%4],g=ctx.createLinearGradient(0,H*.1,W,H*.9);g.addColorStop(0,`rgba(${a[0]},${a[1]},${a[2]},.12)`);g.addColorStop(.30,`rgba(${b[0]},${b[1]},${b[2]},.48)`);g.addColorStop(.55,'rgba(255,255,255,.34)');g.addColorStop(.72,`rgba(${a[0]},${a[1]},${a[2]},.42)`);g.addColorStop(1,`rgba(${b[0]},${b[1]},${b[2]},.10)`);ctx.fillStyle=g;ctx.fill();ctx.beginPath();for(let k=0;k<pts.length;k++){const q=pts[k],q2=pts[Math.min(pts.length-1,k+1)],dx=q2[0]-q[0],dy=q2[1]-q[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=width*.18,x=q[0]+nx*w,y=q[1]+ny*w;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1.1;ctx.stroke();ctx.restore()}function draw(t){bg(t);const order=[...Array(10).keys()].sort((a,b)=>Math.sin(a+t*.1)-Math.sin(b+t*.1));for(const i of order)ribbon(i,t)}function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;tx=x/W;ty=y/H;mode=(mode+1)%3;seed=Math.random()*50;return true}c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});c.addEventListener('pointermove',e=>{if(e.buttons){tx=e.clientX/W;ty=e.clientY/H}},{passive:true});function frame(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;ax+=(tx-ax)*(1-Math.exp(-dt*1.4));ay+=(ty-ay)*(1-Math.exp(-dt*1.4));draw(now/1000);requestAnimationFrame(frame)}APKit.init({canvas:c,gifName:'tenfold-membrane-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:function(){mode=(mode+1)%3;seed=Math.random()*50;}},{label:'↻',name:'reset',onClick:function(){mode=0;seed=Math.random()*50;tx=.5;ty=.5;ax=.5;ay=.5;}}]});requestAnimationFrame(frame);</script></body></html>
