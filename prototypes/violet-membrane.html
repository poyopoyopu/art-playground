<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VIOLET MEMBRANE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,t0=performance.now(),seed=1,laws=[];function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);function rnd(n){return Math.abs(Math.sin(n*12.9898+seed*78.233)*43758.5453)%1}function glow(x,y,r,c,a){let z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,c+a+')');z.addColorStop(.25,c+(a*.35)+')');z.addColorStop(1,c+'0)');g.fillStyle=z;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function draw(p){let t=p*6.283185;g.fillStyle='#000';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W*.52,cy=H*.5,R=S*.38;glow(cx,cy,R*1.3,'rgba(55,15,190,',.18);glow(cx,cy,R*.72,'rgba(150,35,255,',.1);g.globalCompositeOperation='lighter';for(let L=0;L<36;L++){let z=(L-17.5)/17.5,d=1-Math.abs(z)*.6,rx=R*(.3+.55*d),ry=R*(.95+.1*d);for(let s=0;s<18;s++){let b=s/18*6.283185+L*.071;g.beginPath();for(let j=0;j<=100;j++){let u=j/100*6.283185;let X=Math.cos(u+b*.035)*rx*(.72+.28*Math.cos(u))*(1+.1*Math.sin(b*3+u*2-t*.15))+Math.sin(u*3+b+t*.1)*R*.06+z*R*.2*Math.sin(u);let Y=Math.sin(u)*ry+Math.sin(b*2+u*4-t*.13)*R*.025;for(let q=0;q<laws.length;q++){let Lw=laws[q],dx=X-Lw.x*S,dy=Y-Lw.y*S,dd=Math.hypot(dx,dy)+1,f=Math.exp(-dd/(S*.22))*.12;X+=dx/dd*f*S*.2;Y+=dy/dd*f*S*.2}if(j)g.lineTo(cx+X,cy+Y);else g.moveTo(cx+X,cy+Y)}g.strokeStyle=`hsla(${260+L*2+s*.7},90%,65%,${.045+.05*d})`;g.lineWidth=.5+1.2*d;g.stroke()}}for(let q=0;q<10;q++){g.beginPath();for(let j=0;j<150;j++){let u=j/149*6.283185,y=(u/6.283185-.5)*R*1.8,X=Math.sin(u*2.1+q*.3+t*.1)*R*.2+Math.sin(u*5-q)*R*.035;j?g.lineTo(cx+X,cy+y):g.moveTo(cx+X,cy+y)}g.strokeStyle=`hsla(${275+q*5},95%,70%,.16)`;g.lineWidth=1+q*.12;g.stroke()}let ox=cx+Math.sin(t*.07)*S*.025,oy=cy+Math.cos(t*.08)*S*.02;glow(ox,oy,S*.14,'rgba(100,40,255,',.28);for(let i=0;i<500;i++){let a=rnd(i)*6.283185,r=Math.sqrt(rnd(i+700))*S*.08;g.fillStyle=`hsla(${265+rnd(i+900)*50},90%,75%,${.2+.6*rnd(i+1100)})`;g.fillRect(ox+Math.cos(a)*r,oy+Math.sin(a)*r,1.2,1.2)}for(let i=0;i<12;i++){let a=i/12*6.283185+t*(.035+i*.002),rx=R*(1.03+i*.05),ry=R*(.38+i*.025);g.strokeStyle=`hsla(${245+i*7},90%,70%,.055)`;g.lineWidth=.8;g.beginPath();g.ellipse(cx,cy,rx,ry,a,0,6.283185);g.stroke();let X=cx+Math.cos(a)*rx,Y=cy+Math.sin(a)*ry;glow(X,Y,S*.025,'rgba(120,70,255,',.28);g.fillStyle='rgba(220,180,255,.9)';g.beginPath();g.arc(X,Y,S*.004,0,6.283185);g.fill()}for(let i=0;i<180;i++){let a=rnd(i+1400)*6.283185,r=R*(.75+.65*rnd(i+1600)),X=cx+Math.cos(a)*r,Y=cy+Math.sin(a)*r*.72,len=S*(.02+.1*rnd(i+1800));g.strokeStyle=`hsla(${250+rnd(i)*70},90%,70%,.16)`;g.beginPath();g.moveTo(X,Y);g.quadraticCurveTo(X+Math.cos(a+1.2)*len*.5,Y+Math.sin(a+1.2)*len*.5,X+Math.cos(a+.7)*len,Y+Math.sin(a+.7)*len);g.stroke()}g.globalCompositeOperation='source-over';let v=g.createRadialGradient(W*.5,H*.5,S*.15,W*.5,H*.5,S*.82);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.68)');g.fillStyle=v;g.fillRect(0,0,W,H)}function loop(){draw(((performance.now()-t0)/9000)%1);requestAnimationFrame(loop)}loop();c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let r=c.getBoundingClientRect();laws.push({x:(e.clientX-r.left)/r.width-.5,y:(e.clientY-r.top)/r.height-.5})});APKit.init({canvas:c,gifName:'violet-membrane-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*9999},{label:'↻',name:'reset',onClick:()=>{seed=1;laws=[]}}]});</script></body></html>
