<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHROMATIC TIDE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style>
<script src="../ap-kit.js"></script>
</head>
<body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,D=1,t0=performance.now(),seed=31,laws=[];const TAU=Math.PI*2;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);g.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);
function rnd(n){return (Math.sin(n*127.1+seed*311.7)*43758.5453%1+1)%1}
function field(x,y,t){let a=0,mag=1;for(let i=0;i<laws.length;i++){const f=laws[i],dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy)+.0001,q=Math.exp(-d/f.r);a+=f.s*q*(1+.25*Math.sin(t*.55+f.k));mag*=1-f.q*q*.72}return{a,mag}}
function glow(x,y,r,h,a){const z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,`hsla(${h},95%,88%,${a})`);z.addColorStop(.28,`hsla(${h+22},92%,68%,${a*.25})`);z.addColorStop(1,`hsla(${h+55},90%,52%,0)`);g.fillStyle=z;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function pal(t){const k=(t/TAU*4)%4,i=Math.floor(k),f=k-i,a=[195,265,330,48][i],b=[195,265,330,48][(i+1)%4];let h=a+(b-a)*f;if(i===3)h=a+(b+360-a)*f;return(h+360)%360}
function background(t,S,cx,cy){const h=pal(t),bg=g.createRadialGradient(cx-S*.18*Math.sin(t*.16),cy-S*.18*Math.cos(t*.13),0,cx,cy,S*.9);bg.addColorStop(0,`hsla(${(h+35)%360},34%,13%,1)`);bg.addColorStop(.28,`hsla(${(h+305)%360},38%,8%,1)`);bg.addColorStop(.62,'#050713');bg.addColorStop(1,'#010208');g.fillStyle=bg;g.fillRect(0,0,W,H);g.globalCompositeOperation='screen';glow(cx+S*.25*Math.cos(t*.13),cy+S*.18*Math.sin(t*.17),S*.56,(h+330)%360,.055);glow(cx-S*.3*Math.sin(t*.09),cy-S*.22*Math.cos(t*.12),S*.46,(h+80)%360,.045);glow(cx+S*.05*Math.sin(t*.21),cy+S*.3*Math.cos(t*.14),S*.32,(h+190)%360,.03);g.globalAlpha=.16;for(let k=0;k<9;k++){const rr=S*(.18+k*.105),rot=t*(.012+k*.002)+k*.71;g.beginPath();for(let j=0;j<=130;j++){const u=j/130*TAU,w=1+.035*Math.sin(u*3+k*1.4+t*.18)+.018*Math.sin(u*7-k);const x=Math.cos(u+rot)*rr*w,y=Math.sin(u+rot)*rr*(.72+.03*Math.sin(t+k));j?g.lineTo(cx+x,cy+y):g.moveTo(cx+x,cy+y)}g.strokeStyle=`hsla(${(h+205+k*17)%360},65%,70%,.13)`;g.lineWidth=.45;g.stroke()}g.globalAlpha=1;for(let i=0;i<110;i++){const a=rnd(i+5000)*TAU,r=S*(.15+.74*rnd(i+6000)),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.74,p=.5+.5*Math.sin(t*.7+i*1.73);g.fillStyle=`hsla(${(h+150+rnd(i+7000)*180)%360},72%,${62+p*28}%,${.025+p*.11})`;g.fillRect(x,y,.5+p*.9,.5+p*.9)}g.globalCompositeOperation='source-over'}
function draw(p){const t=p*TAU,S=Math.min(W,H),h=pal(t),cx=W*.5+Math.sin(t*.37)*S*.025,cy=H*.5+Math.cos(t*.29)*S*.018,breath=.93+.09*Math.sin(t*.9),R=S*(.405+.025*Math.sin(t*.55));background(t,S,cx,cy);glow(cx,cy,R*.9,(h+40)%360,.065);g.globalCompositeOperation='lighter';for(let layer=0;layer<54;layer++){const rr=R*(.055+layer/54*.95)*breath,phase=layer*.27;g.beginPath();for(let j=0;j<=230;j++){const u=j/230*TAU,warp=1+.055*Math.sin(u*5-phase+t*.21)+.025*Math.sin(u*11+phase-t*.13);let rad=rr*warp;let x=Math.cos(u)*rad,y=Math.sin(u)*rad*(.68+.1*Math.sin(t*.45+layer*.04));const f=field(x,y,t),ang=f.a+.18*Math.sin(t*.23+rr/S*9)+.035*Math.sin(u*2-t*.17);const xx=x*Math.cos(ang)-y*Math.sin(ang),yy=x*Math.sin(ang)+y*Math.cos(ang);const bend=(1-f.mag)*S*(.12+.04*Math.sin(t+layer*.2));x=xx+(xx/(Math.hypot(xx,yy)+1))*bend;y=yy+(yy/(Math.hypot(xx,yy)+1))*bend;x+=Math.sin(u*3+phase+t*.16)*S*.008;y+=Math.cos(u*4-phase-t*.11)*S*.007;j?g.lineTo(cx+x,cy+y):g.moveTo(cx+x,cy+y)}const hue=(h+layer*2.05+24*Math.sin(t+layer*.08)+360)%360;g.strokeStyle=`hsla(${hue},${82+12*Math.sin(t*.5+layer)}%,${57+10*Math.sin(t*.7+layer*.05)}%,${.026+layer/54*.04})`;g.lineWidth=.45+layer/54*1.25;g.stroke()}for(let k=0;k<14;k++){const rr=R*(.12+k*.075),rot=t*(.018+k*.002)+k*.57;g.beginPath();for(let j=0;j<=170;j++){const u=j/170*TAU,x=Math.cos(u)*rr,y=Math.sin(u)*rr*.72,f=field(x,y,t),a=f.a*.9+rot,xx=x*Math.cos(a)-y*Math.sin(a),yy=x*Math.sin(a)+y*Math.cos(a);j?g.lineTo(cx+xx,cy+yy):g.moveTo(cx+xx,cy+yy)}g.strokeStyle=`hsla(${(h+70+k*8)%360},100%,78%,.075)`;g.lineWidth=.65+.12*Math.sin(t+k);g.stroke()}for(let i=0;i<330;i++){const a=rnd(i)*TAU,r=R*(.04+.94*rnd(i+500));let x=Math.cos(a)*r,y=Math.sin(a)*r*.72,f=field(x,y,t);x*=f.mag;y*=f.mag;const pulse=.5+.5*Math.sin(t*2.2+i*.19),hue=(h+55+rnd(i+900)*300+40*Math.sin(t*.6+i))%360;g.fillStyle=`hsla(${hue},94%,${68+pulse*27}%,${.045+pulse*.4})`;const q=.55+f.mag*1.5;g.fillRect(cx+x,cy+y,q,q)}g.globalCompositeOperation='screen';for(let i=0;i<18;i++){const a=i/18*TAU+t*(.012+i*.001),rr=R*(.86+.12*Math.sin(t*.8+i));const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.7;glow(x,y,S*.018,(h+i*19)%360,.12)}g.globalCompositeOperation='source-over';const v=g.createRadialGradient(cx,cy,S*.05,cx,cy,S*.82);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(.65,'rgba(0,0,0,.015)');v.addColorStop(1,'rgba(0,0,0,.56)');g.fillStyle=v;g.fillRect(0,0,W,H)}
function loop(){draw(((performance.now()-t0)/12000)%1);requestAnimationFrame(loop)}loop();
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const r=c.getBoundingClientRect(),S=Math.min(W,H),x=e.clientX-r.left-W*.5,y=e.clientY-r.top-H*.5;laws.push({x,y,r:S*(.09+.035*(laws.length%6)),s:(laws.length%2?-.8:.8),q:.72,k:laws.length*1.07});if(laws.length>9)laws.shift()});
APKit.init({canvas:c,gifName:'chromatic-tide-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9999}},{label:'↻',name:'reset',onClick:()=>{seed=31;laws=[]}}]});
</script></body></html>
