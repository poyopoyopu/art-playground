<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIOLET MEMBRANE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
let W=1,H=1,D=1,seed=13.73;
let touch={x:0,y:0},target={x:0,y:0},drag=false;
const laws=[];
function hash(n){const x=Math.sin(n*127.1+seed*31.7)*43758.5453;return x-Math.floor(x)}
function resize(){D=Math.min(devicePixelRatio||1,1.65);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function setTouch(e){const r=canvas.getBoundingClientRect();target.x=((e.clientX-r.left)/r.width-.5)*2;target.y=-((e.clientY-r.top)/r.height-.5)*2}
canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;drag=true;canvas.setPointerCapture?.(e.pointerId);setTouch(e);laws.push({x:target.x,y:target.y,t:performance.now()/1000})});
canvas.addEventListener('pointermove',e=>{if(drag)setTouch(e)});
canvas.addEventListener('pointerup',e=>{drag=false;setTouch(e)});
canvas.addEventListener('pointercancel',()=>drag=false);
function pal(x){
 x=((x%1)+1)%1;
 const stops=[[.54,.08,1],[.20,.38,1],[.82,.16,1],[1,.34,.86],[.28,.74,1]];
 const p=x*(stops.length-1),i=Math.floor(p),f=p-i,a=stops[Math.min(i,stops.length-1)],b=stops[Math.min(i+1,stops.length-1)];
 return `rgb(${Math.floor((a[0]+(b[0]-a[0])*f)*255)},${Math.floor((a[1]+(b[1]-a[1])*f)*255)},${Math.floor((a[2]+(b[2]-a[2])*f)*255)})`;
}
function glowDot(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(.2,`rgba(${c},${a*.55})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function draw(phase){
 const t=phase/TAU*12;
 touch.x+=(target.x-touch.x)*.055;touch.y+=(target.y-touch.y)*.055;
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 const cx=W*.5,cy=H*.5,S=Math.min(W,H),R=S*.34;
 // Deep atmospheric shell.
 for(let k=0;k<8;k++){
  const rr=R*(1.20+k*.085),a=.018*(1-k/9);
  ctx.strokeStyle=`rgba(75,30,160,${a})`;ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<=180;i++){const q=i/180*TAU, wob=1+.018*Math.sin(q*7+t*.18+k)+.012*Math.sin(q*13-t*.11);const x=cx+Math.cos(q+t*.025)*rr*wob,y=cy+Math.sin(q)*rr*.73*wob;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.stroke();
 }
 // The membrane: hundreds of continuous, depth-layered strands folding around a central void.
 ctx.globalCompositeOperation='lighter';
 for(let layer=0;layer<34;layer++){
  const z=(layer-16.5)/16.5;
  const depth=1-Math.abs(z)*.72;
  const rx=R*(.58+.34*depth), ry=R*(.98+.08*depth);
  const skew=z*.30;
  for(let strand=0;strand<13;strand++){
   const base=strand/13*TAU+layer*.071;
   const hue=layer*.027+strand*.013+seed*.001;
   ctx.beginPath();
   for(let j=0;j<=64;j++){
    const u=j/64*TAU;
    const fold=Math.sin(u*2+base*1.7+t*.31+layer*.13)*.10 + Math.sin(u*5-base+t*.17)*.035;
    const pinch=.82+.18*Math.cos(u);
    const bulge=1+.11*Math.sin(base*3+u*2.2-t*.22)+.045*Math.sin(base*9-u*4+t*.12);
    let x=Math.cos(u+base*.055)*rx*bulge*pinch;
    let y=Math.sin(u)*ry*(.93+.07*Math.cos(base*2+u));
    x+=fold*R*(.72+depth*.35)+skew*R*Math.sin(u);
    y+=Math.sin(base*2.1+u*3.0+t*.23)*R*.035;
    // Permanent touch laws bend the whole membrane, not just the cursor.
    for(let q=0;q<laws.length;q++){
      const L=laws[q],lx=L.x*S*.5,ly=-L.y*S*.5;
      const dx=x-(lx),dy=y-(ly),d=Math.sqrt(dx*dx+dy*dy)+1;
      const force=Math.exp(-d/(S*.22))*.075;
      x+=dx/d*force*S*.22;y+=dy/d*force*S*.22;
    }
    const wob=.5+.5*Math.sin(u*3-base*2+t*.18+layer*.09);
    const px=cx+x+touch.x*S*.025*Math.exp(-Math.abs(z)*2)*Math.sin(u+base);
    const py=cy+y+touch.y*S*.025*Math.exp(-Math.abs(z)*2)*Math.cos(u-base);
    if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.strokeStyle=pal(hue+wob*.11);
   ctx.globalAlpha=.075+.055*depth;
   ctx.lineWidth=.55+1.1*depth;
   ctx.stroke();
  }
 }
 // Bright seam where the membrane folds inward.
 ctx.globalAlpha=.65;
 for(let q=0;q<7;q++){
  ctx.beginPath();
  for(let j=0;j<=110;j++){
   const u=-1.15+j/110*2.30;
   const x=cx+Math.sin(u*2.2+q*.15+t*.12)*R*.19 + u*R*.34;
   const y=cy+Math.sin(u*3.3+q+t*.25)*R*.78;
   if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=pal(.68+q*.025);ctx.lineWidth=1.1+q*.25;ctx.stroke();
 }
 // Central luminous orb, deliberately sparse and particulate.
 const ox=cx+Math.sin(t*.09)*S*.025,oy=cy+Math.cos(t*.11)*S*.018;
 glowDot(ox,oy,S*.15,'82,40,255',.16);
 glowDot(ox,oy,S*.075,'174,100,255',.18);
 ctx.save();ctx.translate(ox,oy);ctx.rotate(t*.045);
 for(let i=0;i<420;i++){
  const a=hash(i*2.31)*TAU, rr=Math.sqrt(hash(i*7.17))*S*.082;
  const px=Math.cos(a)*rr*(.72+.28*Math.sin(a*3+t*.2)),py=Math.sin(a)*rr;
  const bright=.25+.75*hash(i*9.3);
  ctx.fillStyle=`rgba(190,145,255,${.12+.6*bright})`;ctx.fillRect(px,py,1,1);
 }
 ctx.restore();
 // Orbiting translucent nodes and long elliptical traces.
 for(let i=0;i<9;i++){
  const a=i/9*TAU+t*(.055+i*.004),rx=R*(1.04+.17*Math.sin(i*2.4)),ry=R*(.46+.09*Math.cos(i));
  const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
  const c=i%3===0?'95,185,255':i%3===1?'205,105,255':'142,92,255';
  glowDot(x,y,S*(.025+.012*hash(i+33)),c,.22);
  ctx.fillStyle=`rgba(${c},.72)`;ctx.beginPath();ctx.arc(x,y,S*.0045,0,TAU);ctx.fill();
 }
 for(let i=0;i<11;i++){
  const a=i*.71+t*.025*(i%3+1),rx=R*(1.10+i*.055),ry=R*(.56+i*.025);
  ctx.strokeStyle=`rgba(${i%2?'100,70,255':'150,120,255'},${.07-i*.003})`;ctx.lineWidth=.7;
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,a,0,TAU);ctx.stroke();
 }
 // Fine escaped filaments at the edge.
 for(let i=0;i<150;i++){
  const a=hash(i+200)*TAU,rr=R*(.9+hash(i+400)*.48),len=S*(.025+.10*hash(i+500));
  const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.73;
  const dx=Math.cos(a+.9)*len,dy=Math.sin(a+.9)*len;
  ctx.strokeStyle=pal(.55+hash(i)*.32);ctx.globalAlpha=.12*hash(i+50);ctx.lineWidth=.45;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();
 }
 // Touch laws leave a subtle permanent scar.
 for(const L of laws){const x=cx+L.x*S*.5,y=cy-L.y*S*.5;glowDot(x,y,S*.055,'190,90,255',.08);ctx.strokeStyle='rgba(190,90,255,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,S*.04,0,TAU);ctx.stroke()}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 // Final vignette.
 const vg=ctx.createRadialGradient(cx,cy,S*.18,cx,cy,S*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(.72,'rgba(0,0,0,.08)');vg.addColorStop(1,'rgba(0,0,0,.72)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
let start=performance.now();
function frame(){draw(((performance.now()-start)/1000/8%1)*TAU);requestAnimationFrame(frame)}
frame();
APKit.init({canvas:canvas,gifName:'violet-membrane-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[
 {label:'✦',name:'mutate',onClick:function(){seed=Math.random()*1000;laws.length=0}},
 {label:'↻',name:'reset',onClick:function(){seed=13.73;laws.length=0;touch={x:0,y:0};target={x:0,y:0}}}
]});
</script>
</body>
</html>
