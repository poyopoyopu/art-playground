<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHROMATIC TIDE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W=0,H=0,D=1,t0=performance.now(),seed=17,laws=[];const TAU=Math.PI*2;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);g.setTransform(D,0,0,D,0,0)}size();addEventListener('resize',size);
function rnd(n){return (Math.sin(n*127.1+seed*311.7)*43758.5453%1+1)%1}
const sets=[[190,222,278,325,18],[168,205,246,292,345],[205,242,285,330,48],[135,178,225,286,338],[22,55,155,238,305],[180,230,300,345,72]];
function hue(a,b,t){let d=((b-a+540)%360)-180;return(a+d*t+360)%360}
function pal(t){let z=t/TAU*.9,k=Math.floor(z),f=z-k,A=sets[k%sets.length],B=sets[(k+1)%sets.length];return A.map((v,i)=>hue(v,B[i],f))}
function field(x,y,t){let rot=0,stretch=1,flow=0;for(const f of laws){let dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy)+1,q=Math.exp(-d/f.r);rot+=f.s*q*(1+.35*Math.sin(t*.37+f.k));stretch*=1-f.q*q*.48;flow+=f.s*q}return{rot,stretch,flow}}
function glow(x,y,r,h,a){let z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,`hsla(${h},100%,92%,${a})`);z.addColorStop(.3,`hsla(${(h+28)%360},92%,68%,${a*.24})`);z.addColorStop(1,`hsla(${(h+70)%360},90%,50%,0)`);g.fillStyle=z;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function bg(t,S,P){let h=P[0],q=P[3];let b=g.createRadialGradient(W*(.18+.64*(.5+.5*Math.sin(t*.17))),H*(.18+.64*(.5+.5*Math.cos(t*.13))),0,W*.5,H*.5,Math.max(W,H)*.9);b.addColorStop(0,`hsla(${h},42%,15%,1)`);b.addColorStop(.3,`hsla(${q},35%,9%,1)`);b.addColorStop(.68,`hsla(${P[2]},30%,5%,1)`);b.addColorStop(1,'#010208');g.fillStyle=b;g.fillRect(0,0,W,H);g.globalCompositeOperation='screen';for(let i=0;i<9;i++){let x=W*(.08+.84*((i/9+t*.025)%1)),y=H*(.12+.76*((i*.37-t*.018)%1));glow(x,y,S*(.48+.16*Math.sin(t*.23+i)),P[(i+1)%5],.035)}g.globalCompositeOperation='source-over'}
function draw(p){let t=p*TAU,S=Math.min(W,H),P=pal(t);bg(t,S,P);let cx=W*.5,cy=H*.5;g.globalCompositeOperation='lighter';
for(let band=0;band<72;band++){let phase=band*.23,yy=H*(band+.5)/72;g.beginPath();for(let j=0;j<=300;j++){let u=j/300,x=-W*.08+u*W*1.16;let y=yy+Math.sin(u*TAU*(.65+band%5*.19)+t*.24+phase)*H*(.045+.012*Math.sin(band*.7));y+=Math.sin(u*TAU*(1.7+band%3*.31)-t*.13+band)*H*.035;y+=Math.sin(u*TAU*.31+t*.19+band*.17)*H*.07;let dx=x-cx,dy=y-cy,f=field(dx,dy,t),a=f.rot+.16*Math.sin(t*.15+band*.1),cs=Math.cos(a),sn=Math.sin(a),rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;let xx=cx+rx*(1+f.flow*.08),yy2=cy+ry*(1+f.flow*.05);g.lineTo(xx,yy2)}let hh=hue(P[band%5],P[(band+2)%5],.5+.5*Math.sin(t*.53+band*.11));g.strokeStyle=`hsla(${hh},${78+16*Math.sin(t*.31+band)}%,${54+16*(.5+.5*Math.sin(t*.47+band*.08))}%,${.018+band/72*.052})`;g.lineWidth=.5+band/72*1.45;g.stroke()}
for(let band=0;band<28;band++){let phase=band*.51,xx=W*(band+.5)/28;g.beginPath();for(let j=0;j<=260;j++){let u=j/260,y=-H*.1+u*H*1.2,x=xx+Math.sin(u*TAU*(.7+band%4*.2)-t*.21+phase)*W*.07+Math.sin(u*TAU*2.2+t*.16)*W*.025;let dx=x-cx,dy=y-cy,f=field(dx,dy,t),a=f.rot*.8,cs=Math.cos(a),sn=Math.sin(a),rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;g.lineTo(cx+rx,cy+ry)}let hh=hue(P[(band+1)%5],P[(band+4)%5],.5+.5*Math.sin(t*.7+band));g.strokeStyle=`hsla(${hh},92%,68%,.018)`;g.lineWidth=.45+band/28*.75;g.stroke()}
g.globalCompositeOperation='screen';for(let i=0;i<8;i++){let a=t*.12+i*.79,r=S*(.28+.1*Math.sin(t*.41+i));glow(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.72,S*.18,P[(i+2)%5],.035)}g.globalCompositeOperation='source-over';let v=g.createRadialGradient(cx,cy,S*.15,cx,cy,Math.max(W,H)*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.38)');g.fillStyle=v;g.fillRect(0,0,W,H)}
function loop(){draw(((performance.now()-t0)/15000)%1);requestAnimationFrame(loop)}loop();
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let r=c.getBoundingClientRect(),x=e.clientX-r.left-W*.5,y=e.clientY-r.top-H*.5;laws.push({x,y,r:Math.min(W,H)*(.16+.03*(laws.length%5)),s:laws.length%2?-.9:.9,q:.7,k:laws.length*.91});if(laws.length>9)laws.shift()});
APKit.init({canvas:c,gifName:'chromatic-tide-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*9999},{label:'↻',name:'reset',onClick:()=>{seed=17;laws=[]}}]});
</script></body></html>
