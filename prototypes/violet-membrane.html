<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INVERSE GARDEN</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}
body{touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W=0,H=0,D=1,t0=performance.now(),seed=17,flips=[];
const TAU=Math.PI*2;
function size(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);g.setTransform(D,0,0,D,0,0)}
size();addEventListener('resize',size);
function rnd(n){return (Math.sin(n*127.1+seed*311.7)*43758.5453%1+1)%1}
function field(x,y,t){
  let a=0,mag=1;
  for(let i=0;i<flips.length;i++){
    const f=flips[i],dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy)+.0001,q=Math.exp(-d/(f.r));
    a+=f.s*q*(1.0+0.18*Math.sin(t*0.7+f.k));
    mag*=1-f.q*q*.72;
  }
  return {a,mag};
}
function glow(x,y,r,h,a){const z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,`hsla(${h},95%,78%,${a})`);z.addColorStop(.35,`hsla(${h},90%,62%,${a*.22})`);z.addColorStop(1,`hsla(${h},90%,50%,0)`);g.fillStyle=z;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function draw(p){
  const t=p*TAU,S=Math.min(W,H),cx=W*.5,cy=H*.5,R=S*.43;
  g.globalCompositeOperation='source-over';g.fillStyle='#050507';g.fillRect(0,0,W,H);
  glow(cx,cy,R*1.05,278,.16);
  g.globalCompositeOperation='lighter';
  for(let layer=0;layer<46;layer++){
    const rr=R*(.10+layer/46*.93),phase=layer*.37;
    g.beginPath();
    for(let j=0;j<=240;j++){
      const u=j/240*TAU;
      let rad=rr*(1+.045*Math.sin(u*5-phase+t*.12)+.025*Math.sin(u*11+phase-t*.18));
      let x=Math.cos(u)*rad,y=Math.sin(u)*rad*.78;
      const f=field(x,y,t),ang=f.a+.16*Math.sin(t*.15+rr/S*8),xx=x*Math.cos(ang)-y*Math.sin(ang),yy=x*Math.sin(ang)+y*Math.cos(ang),bend=(1-f.mag)*S*.12;
      x=xx+(xx/(Math.hypot(xx,yy)+1))*bend;y=yy+(yy/(Math.hypot(xx,yy)+1))*bend;
      x+=Math.sin(u*3+phase+t*.09)*S*.006;y+=Math.cos(u*4-phase-t*.07)*S*.006;
      const px=cx+x,py=cy+y;j?g.lineTo(px,py):g.moveTo(px,py);
    }
    const hue=250+layer*1.9+14*Math.sin(t+layer*.08);g.strokeStyle=`hsla(${hue},92%,${58+layer*.25}%,${.035+layer/46*.035})`;g.lineWidth=.55+layer/46*1.05;g.stroke();
  }
  for(let k=0;k<9;k++){
    const rr=R*(.24+k*.085),rot=t*(.025+k*.002)+k*.7;g.beginPath();
    for(let j=0;j<=180;j++){
      const u=j/180*TAU,x=Math.cos(u)*rr,y=Math.sin(u)*rr*.78,f=field(x,y,t),a=f.a*.7+rot,xx=x*Math.cos(a)-y*Math.sin(a),yy=x*Math.sin(a)+y*Math.cos(a);j?g.lineTo(cx+xx,cy+yy):g.moveTo(cx+xx,cy+yy);
    }
    g.strokeStyle=`hsla(${285+k*8},100%,72%,.09)`;g.lineWidth=.8;g.stroke();
  }
  for(let i=0;i<220;i++){
    const a=rnd(i)*TAU,r=R*(.08+.84*rnd(i+500));let x=Math.cos(a)*r,y=Math.sin(a)*r*.78,f=field(x,y,t);x*=f.mag;y*=f.mag;const pulse=.5+.5*Math.sin(t*2+i*.17);g.fillStyle=`hsla(${265+rnd(i+900)*55},95%,${68+pulse*22}%,${.10+pulse*.5})`;g.fillRect(cx+x,cy+y,1+f.mag*1.2,1+f.mag*1.2);
  }
  for(let i=0;i<flips.length;i++){const f=flips[i];glow(cx+f.x,cy+f.y,f.r*.55,278,.10);g.beginPath();g.arc(cx+f.x,cy+f.y,Math.max(2,f.r*.035),0,TAU);g.strokeStyle='rgba(245,220,255,.65)';g.lineWidth=.8;g.stroke()}
  g.globalCompositeOperation='source-over';const v=g.createRadialGradient(cx,cy,S*.12,cx,cy,S*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=v;g.fillRect(0,0,W,H);
}
function loop(){draw(((performance.now()-t0)/11000)%1);requestAnimationFrame(loop)}
loop();
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const r=c.getBoundingClientRect(),S=Math.min(W,H),x=e.clientX-r.left-W*.5,y=e.clientY-r.top-H*.5;flips.push({x,y,r:S*(.12+.035*(flips.length%5)),s:(flips.length%2?-.75:.75),q:.65,k:flips.length*.9});if(flips.length>7)flips.shift()});
APKit.init({canvas:c,gifName:'inverse-garden-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9999}},{label:'↻',name:'reset',onClick:()=>{seed=17;flips=[]}}]});
</script>
</body>
</html>
