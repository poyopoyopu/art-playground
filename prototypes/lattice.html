<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>LATTICE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080808}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,n=18;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#080808';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let i=0;i<=n;i++){let q=i/n;g.beginPath();g.moveTo(q*W,0);g.lineTo(q*W+Math.sin(p*6+q*8)*S*.18,H);g.strokeStyle=`hsla(${180+q*100},60%,65%,.3)`;g.stroke();g.beginPath();g.moveTo(0,q*H);g.lineTo(W,q*H+Math.cos(p*6+q*7)*S*.18);g.stroke()}}function mu(){n=8+Math.floor(Math.random()*30)}APKit.init({canvas:c,gifName:'lattice-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>n=18}]});draw(0)</script>
