<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FLUID ORBIT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060a}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,cores=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=0){g.fillStyle="#02060a";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let q=0;q<70;q++){let a=q*.089+p*(.35+q*.003),r=S*(.045+q*.0048),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;for(let m of cores){let dx=x-m.x,dy=y-m.y,z=Math.max(0,1-Math.hypot(dx,dy)/240),aa=Math.atan2(dy,dx);x+=Math.cos(aa)*z*z*90;y+=Math.sin(aa)*z*z*90}let rr=2+q*.035;g.beginPath();g.arc(x,y,rr,0,7);g.fillStyle=`hsla(${185+q*2.2},90%,${55+q*.3}%,${.08+q*.006})`;g.fill()}for(let m of cores){g.beginPath();g.arc(m.x,m.y,12+8*Math.sin(p+m.s),0,7);g.strokeStyle=`hsla(${40+m.s*20},100%,70%,.65)`;g.lineWidth=2;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;cores.unshift({x,y,s:Math.random()*6});cores=cores.slice(0,5)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'FLUID-ORBIT-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>cores.forEach(m=>m.s=Math.random()*6)},{label:'↻',name:'reset',onClick:()=>cores=[]}]});(function loop(){draw(performance.now()*.00009);requestAnimationFrame(loop)})();</script></body></html>
