<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOLO THAW</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04040a}canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#99a;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  HOLO THAW — Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: 虹色の流体マーブル + 垂れる液体(おっちゃん提供の参考画像2枚の掛け合わせ)

  世界のルール:
  画面は凍りついたホログラム箔。3階層の折れ目(大きな折れの中に小さな折れ)でできていて、動かない。
  指の熱が触れた所を溶かす。溶けた箔は二度と凍らない。
  溶けた部分は温かいうちだけ重力で流れ落ち、流れた熱がさらに下の箔を溶かして「溶け道」を掘っていく。
  冷めた液体は流れを止めるが、鏡のようなツヤは残る。もう一度温めればまた流れ出す。
  長押しほど熱が溜まり、ドラッグすると熱の筋が引ける。
*/
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}
  return {p,u}}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let FLOAT=!!gl.getExtension('EXT_color_buffer_float');
function makeTarget(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  if(FLOAT)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  if(!ok&&FLOAT){FLOAT=false;return makeTarget(w,h)}
  return {t,f,w,h}}

// RGBA8端末向けの詰め方(座標 / 融解 / 熱)
const ENC=`
vec4 enc(vec2 q,float m,float h){ return FL ? vec4(q,m,h) : vec4(q*.2+.5,m,h*.25); }
vec4 dec(vec4 s){ return FL ? s : vec4((s.rg-.5)*5.,s.b,s.a*4.); }`;

const FS_INIT=`#version 300 es
precision highp float;uniform vec2 res;uniform bool FL;out vec4 o;${ENC}
void main(){vec2 P=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);o=enc(P,0.,0.);}`;

const FS_SIM=`#version 300 es
precision highp float;uniform sampler2D prev;uniform vec2 res,grav,F0,F1;uniform float dt,t,fOn,fStr,fRad;uniform bool FL;
out vec4 o;${ENC}
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
vec2 curl(vec2 p){float e=.05;
  return vec2(vn(p+vec2(0,e))-vn(p-vec2(0,e)),-(vn(p+vec2(e,0))-vn(p-vec2(e,0))))/(2.*e);}
float segD(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);return length(pa-ba*h);}
void main(){
  vec2 uv=gl_FragCoord.xy/res;vec2 px=1./res;float S=min(res.x,res.y);
  vec2 P=(gl_FragCoord.xy-.5*res)/S;
  vec4 cur=dec(texture(prev,uv));
  float m0=cur.b,h0=cur.a;
  // 上流(重力と逆向き)の1マスが流れていれば、その流れはこのマスへ入ってくる
  vec4 upc=dec(texture(prev,uv-grav*px*1.5));
  float flow=max(m0*clamp(h0,0.,1.6),upc.b*clamp(upc.a,0.,1.6));
  vec2 vel=grav*flow*.42+curl(P*3.5+vec2(0.,t*.15))*flow*.05;
  vec2 back=uv-vel*dt*S/res;
  vec4 adv;
  if(back.y>1.||back.x<0.||back.x>1.){vec2 Q=(back*res-.5*res)/S;adv=vec4(Q,0.,0.);} // 画面の外から来るのは凍った箔
  else adv=dec(texture(prev,clamp(back,0.,1.)));
  // 熱: 流れに乗り、少しにじみ、ゆっくり冷める
  float hn=(dec(texture(prev,uv+vec2(px.x,0))).a+dec(texture(prev,uv-vec2(px.x,0))).a
           +dec(texture(prev,uv+vec2(0,px.y))).a+dec(texture(prev,uv-vec2(0,px.y))).a)*.25;
  float heat=mix(mix(h0,adv.a,step(.02,flow)),hn,.12)*exp(-dt/2.6);
  if(fOn>.5){float d=segD(P,F0,F1);heat+=fStr*dt*exp(-d*d/(fRad*fRad));}
  heat=min(heat,2.);
  // 融けたら二度と凍らない
  float melt=max(m0,smoothstep(.18,.55,heat));
  vec2 src=mix(cur.rg,adv.rg,step(.001,flow));
  o=enc(src,melt,heat);
}`;

// パスA: 源座標 → 折れ目の高さ(3階層の自己相似な箔)
const FS_FIELD=`#version 300 es
precision highp float;uniform sampler2D st;uniform vec2 res;uniform float seed;uniform bool FL;
out vec4 o;${ENC}
float hs1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hs1(i),hs1(i+vec2(1,0)),f.x),mix(hs1(i+vec2(0,1)),hs1(i+1.),f.x),f.y);}
vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
// 1セルごとにランダムな傾きの平面。s小=鋭い折れ目、s大=溶けて丸い
vec3 facets(vec2 p,float s){
  vec2 i=floor(p),f=fract(p);float id=0.,best=9.;
  float dd[9];vec2 ds[9];vec2 rs[9];vec2 gs[9];int k=0;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 g=vec2(x,y),r=h2(i+g+seed);vec2 d=f-(g+.15+.7*r);
    dd[k]=dot(d,d);ds[k]=d;rs[k]=r;gs[k]=(h2(i+g+seed+7.3)-.5)*1.8;
    if(dd[k]<best){best=dd[k];id=r.y;}
    k++;
  }
  float hs=0.,ws=0.;
  for(int j=0;j<9;j++){
    float w=exp(-(dd[j]-best)/(s*s));
    hs+=w*(dot(ds[j],gs[j])+rs[j].x*.3);ws+=w;
  }
  return vec3(hs/ws,id,best);
}
void main(){
  vec2 uv=gl_FragCoord.xy/res;
  vec4 s=dec(texture(st,uv));
  float m=s.b;
  float sh=mix(.07,.2,m);
  vec2 q=s.rg*2.8;
  vec3 a=facets(q,sh),b=facets(q*2.3+3.1,sh),c3=facets(q*5.3+9.7,sh);
  float h=a.x*.60+b.x*.26+c3.x*.12;
  // 溶けた所: 流れに沿った細い筋と、液面のゆらぎ
  if(m>.01){
    vec2 P=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
    float ln=vn(vec2(P.x*55.+s.r*9.,P.y*5.+s.g*14.))*.6+vn(vec2(P.x*140.,P.y*12.+s.g*30.))*.4;
    float wob=vn(P*7.+s.rg*3.)*.7+vn(P*17.-s.rg*5.)*.3;
    h=mix(h,h*.35+ln*.10+wob*.28,m);
  }
  float film=fract(a.y*.7+b.y*.3)*.8*(1.-m)+h*.6;
  float glint=step(.965,fract(c3.y*37.1+b.y*11.))*(1.-m);
  o=vec4(h*.5+.5,film,m,glint>.5?.55+min(1.,s.a)*.45:min(1.,s.a)*.45);
}`;

const FS_SHADE=`#version 300 es
precision highp float;uniform sampler2D fld;uniform vec2 fres,res;uniform float lp,hue,gain;
out vec4 o;
void main(){
  vec2 uv=gl_FragCoord.xy/res;vec2 px=1./fres;
  vec4 f=texture(fld,uv);
  float hl=texture(fld,uv-vec2(px.x,0)).r,hr=texture(fld,uv+vec2(px.x,0)).r;
  float hd=texture(fld,uv-vec2(0,px.y)).r,hu=texture(fld,uv+vec2(0,px.y)).r;
  float m=f.b;
  float g=gain*mix(16.,.7,smoothstep(0.,.6,m));
  vec3 N=normalize(vec3((hl-hr)*g,(hd-hu)*g,1.));
  float glint=step(.55,f.a);
  float heat=glint>.5?(f.a-.55)/.45:f.a/.45;
  vec3 L=normalize(vec3(cos(lp)*.75,sin(lp)*.75,.5));
  vec3 R=reflect(vec3(0,0,-1),N);
  float rl=max(dot(R,L),0.);
  // 凍った箔: 面ごとに違う角度で虹が立つ
  vec3 holo=.5+.5*cos(6.2831*(f.g*1.4+dot(N,L)*2.4+hue+vec3(0.,.33,.67)));holo=holo*holo;
  vec3 L2=normalize(vec3(-.4,.6,.7));
  float fl=pow(max(dot(N,L2),0.),3.);
  vec3 ice=vec3(.035,.038,.07)+vec3(.30,.31,.40)*fl*(.6+.4*fract(f.g*7.))
          +holo*pow(rl,5.)*1.05+vec3(1.)*pow(rl,60.)*.8;
  ice+=holo*glint*(.5+.5*sin(lp*7.+f.g*40.))*.8;
  // 溶けた箔: 鏡のような銀と薄膜の虹
  vec3 env=mix(vec3(.10,.10,.16),vec3(.86,.87,.93),smoothstep(-.5,.8,R.y*.9+R.x*.4+.25));
  vec3 film=.5+.5*cos(6.2831*(f.g*.9+(1.-N.z)*2.5+hue+vec3(0.,.33,.67)));
  vec3 liq=env*.9+film*(smoothstep(.01,.2,1.-N.z)*.7+.10)+vec3(1.,.97,.94)*pow(rl,30.)*1.2;
  liq=mix(liq,liq*vec3(1.08,.95,1.05)+vec3(.10,.03,.08),heat*.35);   // 温かい間だけわずかに色づく
  vec3 col=mix(ice,liq,smoothstep(.2,.8,m));
  col=col/(1.+col*.15);
  float vg=1.-.3*dot(uv-.5,uv-.5)*2.;
  o=vec4(pow(col*vg,vec3(.95)),1.);
}`;
const P_INIT=prog(FS_INIT),P_SIM=prog(FS_SIM),P_FIELD=prog(FS_FIELD),P_SHADE=prog(FS_SHADE);

let W=0,H=0,MW=0,MH=0,A=null,B=null,fld=null;
let seed=Math.random()*40,hue=Math.random(),gAng=-Math.PI/2;
let paused=false,t0=performance.now(),last=t0;
const S=()=>Math.min(W,H);
function blit(P,target,uni){
  gl.useProgram(P.p);
  if(target){gl.bindFramebuffer(gl.FRAMEBUFFER,target.f);gl.viewport(0,0,target.w,target.h)}
  else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,c.width,c.height)}
  uni();gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function clearState(){blit(P_INIT,A,()=>{gl.uniform2f(P_INIT.u.res,MW,MH);gl.uniform1i(P_INIT.u.FL,FLOAT?1:0)})}
function resize(){
  const d=Math.min(2,devicePixelRatio||1);
  c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);
  if(innerWidth===W&&innerHeight===H&&A)return;
  W=innerWidth;H=innerHeight;
  const k=Math.min(.75,1000/Math.max(W,H));MW=Math.round(W*k);MH=Math.round(H*k);
  A=makeTarget(MW,MH);B=makeTarget(MW,MH);fld=makeTarget(MW,MH);clearState();
}
addEventListener('resize',resize);resize();

/* ---------- 指の熱 ---------- */
const toW=(x,y)=>[(x-W/2)/S(),(H/2-y)/S()];
let ptr=null;
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  const p=toW(e.clientX,e.clientY);
  ptr={id:e.pointerId,a:p,b:p,t:performance.now(),burst:1};
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  ptr.b=toW(e.clientX,e.clientY);
});
function up(e){if(ptr&&e.pointerId===ptr.id){ptr.release=performance.now();ptr.tail=0.12}}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

function sim(dt,now){
  let on=0,str=0,a=[0,0],b=[0,0];
  if(ptr){
    on=1;a=ptr.a;b=ptr.b;
    const held=(now-ptr.t)/1000;
    str=ptr.burst?7:0;ptr.burst=0;                 // 触れた瞬間のひと押し
    str+=2.2+Math.min(3,held*1.2);                // 長押しほど熱い
    if(ptr.release){ptr.tail-=dt;if(ptr.tail<=0)ptr=null;}
    else ptr.a=ptr.b;
  }
  const g=[Math.cos(gAng),Math.sin(gAng)];
  blit(P_SIM,B,()=>{const u=P_SIM.u;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.t);gl.uniform1i(u.prev,0);
    gl.uniform2f(u.res,MW,MH);gl.uniform2f(u.grav,g[0],g[1]);
    gl.uniform2f(u.F0,a[0],a[1]);gl.uniform2f(u.F1,b[0],b[1]);
    gl.uniform1f(u.dt,dt);gl.uniform1f(u.t,now/1000);gl.uniform1f(u.fOn,on);
    gl.uniform1f(u.fStr,str);gl.uniform1f(u.fRad,.045);gl.uniform1i(u.FL,FLOAT?1:0)});
  const t=A;A=B;B=t;
}
function render(lp){
  blit(P_FIELD,fld,()=>{const u=P_FIELD.u;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,A.t);gl.uniform1i(u.st,0);
    gl.uniform2f(u.res,MW,MH);gl.uniform1f(u.seed,seed);gl.uniform1i(u.FL,FLOAT?1:0)});
  blit(P_SHADE,null,()=>{const u=P_SHADE.u;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fld.t);gl.uniform1i(u.fld,0);
    gl.uniform2f(u.fres,MW,MH);gl.uniform2f(u.res,c.width,c.height);
    gl.uniform1f(u.lp,lp);gl.uniform1f(u.hue,hue);gl.uniform1f(u.gain,MW*.02)});
}
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(!paused){
    // 2段に分けて進める(流れが速い所でも破綻しにくく)
    sim(dt/2,now);sim(dt/2,now);
    render(((now-t0)/1000)*.35%(Math.PI*2));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'holo-thaw-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  preroll:false,
  // GIF中は融解を止め、光源をひと回りさせて箔のきらめきでループさせる
  loopFrame:function(phase){paused=true;render(phase);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      // 重力の向きを変える(真下を中心に±60°)+ 虹の位相。凍った箔の折れ目はそのまま
      gAng=-Math.PI/2+(Math.random()-.5)*Math.PI*.66;hue=Math.random();
    }},
    {label:'↻',name:'reset',onClick:function(){seed=Math.random()*40;clearState();}}
  ]
});
</script>
</body></html>
