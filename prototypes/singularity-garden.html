<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SINGULARITY GARDEN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
'use strict';
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,dpr=1,t=0,seed=Math.random()*50,holes=[];
function R(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',R);R();
function draw(T=t){x.fillStyle='#020208';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,S=Math.min(W,H)*.48;for(let r=2;r<S;r+=3.3){let n=Math.max(20,Math.floor(r*.32));for(let i=0;i<n;i++){let a=i/n*Math.PI*2+r*.018+Math.sin(r*.035+T*.12)*.18,rr=r*(1+.08*Math.sin(a*7-r*.04+T*.07)),px=cx+Math.cos(a+rr*.004)*rr,py=cy+Math.sin(a+rr*.004)*rr*.82;if(holes.some(h=>Math.hypot(px-h.x,py-h.y)<h.r*(.7+.3*Math.sin(T*.5+h.a))))continue;let wob=.5+.5*Math.sin(r*.17+a*9-T*.1),h=(r*1.4+a*45+seed*80+T*9)%360;x.fillStyle=`hsla(${h},90%,${45+wob*35}%,${.22+wob*.62})`;x.fillRect(px,py,2.4+wob*3,1.3+wob*2)}}for(const h of holes){x.beginPath();x.arc(h.x,h.y,h.r*(1+.1*Math.sin(T+h.a)),0,7);x.fillStyle='rgba(0,0,2,.98)';x.fill();x.strokeStyle=`hsla(${h.a*80+220},90%,70%,.65)`;x.lineWidth=1.5;x.stroke()}}
function touch(px,py){holes.push({x:px,y:py,r:35+Math.random()*70,a:Math.random()*6.28});if(holes.length>6)holes.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);
APKit.init({canvas:c,gifName:'singularity-garden-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;holes=[]}},{label:'↻',name:'reset',onClick:()=>holes=[]}]});
</script></body></html>
