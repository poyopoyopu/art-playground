<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM 200</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3eb}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,seed=Math.random()*9999,px=.5,py=.48,tx=.5,ty=.48,force=0,ft=0,hue=0,ht=0,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`,hash=n=>{const x=Math.sin(n*91.7+seed*.017)*43758.5;return x-Math.floor(x)};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function line(i,z,t,S){const q=i/47,a=TAU*(z-.5),r=S*(.08+q*.38);const twist=.72*Math.sin(t*.17+q*5.2),touch=Math.exp(-Math.pow((z-tx)/.18,2))*force;const ang=a+twist+touch*(1.7+(q*.8));const rr=r*(1+.16*Math.sin(t*.13+q*9+z*4))+S*.055*touch*(1-q);return [W*.5+Math.cos(ang)*rr+(py-.5)*S*.06*touch,H*.5+Math.sin(ang)*rr+(px-.5)*S*.06*touch]}
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H);ctx.globalCompositeOperation='source-over';
const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,S*.8);bg.addColorStop(0,hs(43+hue*.04,35,98));bg.addColorStop(.62,hs(35+hue*.03,30,96));bg.addColorStop(1,hs(28+hue*.02,30,92));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
const driftX=Math.sin(T(.08)*TAU)*S*.035,driftY=Math.cos(T(.11)*TAU)*S*.025,rot=T(.045)*TAU;ctx.save();ctx.translate(W*.5+driftX,H*.5+driftY);ctx.rotate(rot);
for(let k=0;k<11;k++){const q=k/10,rx=S*(.20+q*.055),ry=S*(.12+q*.105),w=.35+.55*(1-q);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,TAU);ctx.strokeStyle=hs(330+q*250+hue*.35,38,72,.055+.035*(1-q));ctx.lineWidth=w;ctx.stroke()}
for(let k=0;k<7;k++){const a=TAU*k/7+T(.06)*TAU,rr=S*(.16+.045*Math.sin(k*2.3+T(.12)*TAU));ctx.beginPath();ctx.ellipse(Math.cos(a)*S*.16,Math.sin(a)*S*.11,S*(.10+.018*k),S*(.055+.012*k),a+.35,0,TAU);ctx.strokeStyle=hs(40+k*47+hue*.25,34,75,.035);ctx.lineWidth=.5;ctx.stroke()}ctx.restore();
for(let k=0;k<5;k++){const a=TAU*(k/5+.2*T(.055)),x=W*(.5+.36*Math.cos(a)),y=H*(.5+.28*Math.sin(a)),r=S*(.16+.035*Math.sin(T(.09)*TAU+k));const fog=ctx.createRadialGradient(x,y,0,x,y,r);fog.addColorStop(0,hs(285+k*37+hue*.2,48,78,.045));fog.addColorStop(.45,hs(175+k*31+hue*.2,42,84,.018));fog.addColorStop(1,hs(50,30,96,0));ctx.fillStyle=fog;ctx.fillRect(x-r*1.4,y-r*1.4,r*2.8,r*2.8)}
ctx.globalCompositeOperation='multiply';ctx.strokeStyle='rgba(120,110,95,.018)';ctx.lineWidth=.45;for(let k=0;k<18;k++){const y=H*(k/18)+Math.sin(k*7.1+T(.03)*TAU)*S*.008;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y+S*.006,W*.7,y-S*.005,W,y+S*.002);ctx.stroke()}ctx.globalCompositeOperation='source-over';
for(let i=0;i<48;i++){const q=i/47,g=ctx.createLinearGradient(0,0,W,H),base=300+q*260+hue;g.addColorStop(0,hs(base-45,58,63,.22));g.addColorStop(.24,hs(base,72,60,.84));g.addColorStop(.5,hs(base+95,50,73,.82));g.addColorStop(.76,hs(base+175,64,63,.82));g.addColorStop(1,hs(base+220,55,58,.25));ctx.strokeStyle=g;ctx.lineWidth=.75+1.05*(1-Math.abs(q-.5)*1.7);ctx.beginPath();for(let j=0;j<=220;j++){const z=-.05+j/220*1.1,p=line(i,z,T(1.0),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,r=S*(.13+.05*Math.sin(T(.07)));const gl=ctx.createRadialGradient(X,Y,0,X,Y,r*4);gl.addColorStop(0,'rgba(255,250,220,.5)');gl.addColorStop(.2,'rgba(255,230,180,.18)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();
function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));
function mutate(){seed=Math.random()*9999;ht=(ht+45+hash(seed)*120)%360}function reset(){px=tx=.5;py=ty=.48;force=ft=0;hue=ht=0;seed=Math.random()*9999}APKit.init({canvas,gifName:'spiral-spectrum-200-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
