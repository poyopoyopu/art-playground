<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM — LIVING ATMOSPHERE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3eb}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,seed=Math.random()*99999,px=.5,py=.48,tx=.5,ty=.48,force=0,ft=0,hue=0,ht=0,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`,hash=n=>{const x=Math.sin(n*91.7+seed*.017)*43758.5;return x-Math.floor(x)};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function draw(phase=null){const t=phase===null?performance.now()/1000:phase,T=k=>APKit.T(k,phase,t),S=Math.min(W,H);ctx.globalCompositeOperation='source-over';
const driftX=Math.sin(T(.08)*TAU)*S*.035,driftY=Math.cos(T(.11)*TAU)*S*.025,rot=T(.045)*TAU,cx=W*.5+driftX,cy=H*.5+driftY;
const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,S*.82);bg.addColorStop(0,'#fffefa');bg.addColorStop(.3,hs(47+hue*.04,35,98));bg.addColorStop(.68,hs(34+hue*.025,29,95));bg.addColorStop(1,hs(27,25,89));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalCompositeOperation='screen';
// slowly migrating pastel atmosphere: the background itself has a life of its own
for(let k=0;k<8;k++){const a=TAU*k/8+T(.018)*TAU*(k%2?-1:1),ox=W*.5+Math.cos(a)*S*(.32+.025*Math.sin(k)),oy=H*.5+Math.sin(a)*S*.28;const r=S*(.23+.055*Math.sin(T(.055)*TAU+k));const fog=ctx.createRadialGradient(ox,oy,0,ox,oy,r);fog.addColorStop(0,hs(178+k*39+hue*.35,48,80,.13));fog.addColorStop(.42,hs(285+k*25+hue*.2,43,82,.055));fog.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=fog;ctx.fillRect(ox-r*1.5,oy-r*1.5,r*3,r*3)}ctx.restore();
// moving topographic rings
ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);for(let k=0;k<15;k++){const q=k/14,rx=S*(.17+q*.062),ry=S*(.105+q*.112),w=.45+.55*(1-q);ctx.beginPath();for(let n=0;n<=190;n++){const a=n/190*TAU,warp=1+.025*Math.sin(a*3+T(.025)*TAU+k*.7)+.012*Math.sin(a*9-T(.06)*TAU);const x=Math.cos(a)*rx*warp,y=Math.sin(a)*ry*(1+.018*Math.sin(a*5+T(.04)*TAU));n?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=hs(330+q*250+hue*.35,39,71,.07+.035*(1-q));ctx.lineWidth=w;ctx.stroke()}ctx.restore();
// large silk-like atmospheric ribbons crossing behind the spiral
ctx.save();ctx.globalCompositeOperation='screen';for(let k=0;k<7;k++){const yy=H*(.13+k*.125)+Math.sin(T(.022)*TAU+k)*S*.04;ctx.beginPath();for(let n=0;n<=180;n++){const u=n/180,x=-S*.12+u*(W+S*.24),y=yy+Math.sin(u*TAU*1.12+T(.028)*TAU+k*.9)*S*.07+Math.sin(u*TAU*2.8-T(.019)*TAU)*S*.022;n?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=hs(170+k*32+hue,47,77,.045);ctx.lineWidth=11+8*Math.sin(T(.035)*TAU+k);ctx.stroke()}ctx.restore();
// paper-like drifting grain, deliberately extremely quiet
ctx.globalCompositeOperation='multiply';ctx.strokeStyle='rgba(120,110,95,.018)';ctx.lineWidth=.45;for(let k=0;k<20;k++){const y=H*k/20+Math.sin(k*7.1+T(.025)*TAU)*S*.008;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.3,y+S*.006,W*.7,y-S*.005,W,y+S*.002);ctx.stroke()}ctx.globalCompositeOperation='source-over';
// orbital halos
ctx.save();ctx.globalCompositeOperation='screen';for(let k=0;k<5;k++){const rx=S*(.47+k*.067),ry=rx*.58,r=T(.035)*TAU*(k%2?-1:1)+k*.36;ctx.save();ctx.rotate(r);ctx.beginPath();ctx.ellipse(0+W*.5,0+H*.5,rx,ry,0,0,TAU);ctx.strokeStyle=hs(182+k*43+hue,38,76,.055);ctx.lineWidth=.75;ctx.stroke();ctx.restore()}ctx.restore();
// spiral: 56 fine spectral strands
for(let i=0;i<56;i++){const q=i/55,a0=TAU*(q-.5),base=300+q*255+hue;ctx.strokeStyle=hs(base,67,63,.72);ctx.lineWidth=.58+.9*(1-Math.abs(q-.5)*1.65);ctx.beginPath();for(let j=0;j<=250;j++){const z=-.035+j/250*1.07,r=S*(.075+q*.43)*(1+.045*Math.sin(T(.13)*TAU+q*8)+.035*Math.sin(z*TAU*2-T(.04)*TAU));const touch=Math.exp(-Math.pow((z-tx)/.17,2))*force;const ang=a0+TAU*(.115*Math.sin(T(.16)*TAU+q*5.5))+touch*(1.9+.7*q)+.06*Math.sin(T(.07)*TAU+z*10);const rr=r+S*.055*touch*(1-q),x=W*.5+Math.cos(ang)*rr+(py-.5)*S*.08*touch,y=H*.5+Math.sin(ang)*rr+(px-.5)*S*.08*touch;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
// luminous breathing core
ctx.globalCompositeOperation='screen';const R=S*(.115+.014*Math.sin(T(.2)*TAU));const gl=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,R*3.7);gl.addColorStop(0,'rgba(255,255,245,.78)');gl.addColorStop(.25,'rgba(255,247,220,.25)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();
function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));
function mutate(){seed=Math.random()*99999;ht=(ht+35+hash(seed)*150)%360}function reset(){px=tx=.5;py=ty=.48;force=ft=0;hue=ht=0;seed=Math.random()*99999}APKit.init({canvas,gifName:'spiral-spectrum-living-atmosphere-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
