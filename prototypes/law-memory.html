<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAW MEMORY</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,phase=0,seed=Math.random()*9999;const laws=[];let down=false,last=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){laws.length=0;seed=Math.random()*9999}function mutate(){seed=Math.random()*9999;laws.forEach(l=>{l.bias=(l.bias+Math.PI*(.35+Math.random()))%(Math.PI*2);l.h=(l.h+35+Math.random()*90)%360})}
function addLaw(x,y){if(window.APKit&&APKit.isUI(x,y))return true;const dx=x-W/2,dy=y-H/2;laws.push({x,y,r:35+Math.hypot(dx,dy)*.12,bias:Math.atan2(dy,dx)+Math.PI/2,h:(seed+x*.13+y*.07)%360,age:0});if(laws.length>8)laws.shift();return true}
canvas.addEventListener('pointerdown',e=>{down=true;last={x:e.clientX,y:e.clientY};addLaw(e.clientX,e.clientY)});canvas.addEventListener('pointermove',e=>{if(!down||!last)return;const d=Math.hypot(e.clientX-last.x,e.clientY-last.y);if(d>90){addLaw(e.clientX,e.clientY);last={x:e.clientX,y:e.clientY}}});['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>{down=false;last=null}));
function field(x,y,p){let bend=0,weight=0;for(const l of laws){const dx=x-l.x,dy=y-l.y,d=Math.hypot(dx,dy);if(d<l.r*3.2){const q=1-d/(l.r*3.2);const local=Math.atan2(dy,dx);bend+=(Math.sin(local-l.bias)*q*q)*.9;weight+=q*q}}return bend/(1+weight*.55)}
function draw(p=phase){ctx.fillStyle='#020307';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H/2,R=Math.hypot(W,H)*.58;ctx.save();ctx.translate(cx,cy);const rings=27;for(let k=1;k<=rings;k++){const rr=R*k/rings;ctx.beginPath();for(let i=0;i<=180;i++){const a=i/180*Math.PI*2;const x=rr*Math.cos(a),y=rr*Math.sin(a);let b=field(x+cx,y+cy,p);const memory=.045*Math.sin(a*4+k*.33+p*2+seed*.001);const rad=rr*(1+memory+b*.11);const xx=rad*Math.cos(a),yy=rad*Math.sin(a);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}const hue=205+k*2.8+(seed%25);ctx.strokeStyle=`hsla(${hue},75%,${38+k*.8}%,${.11+k*.012})`;ctx.lineWidth=1.05;ctx.stroke()}
for(const l of laws){l.age+=.016;const pulse=.5+.5*Math.sin(p*2+l.bias*2);ctx.beginPath();ctx.arc(l.x-cx,l.y-cy,l.r*(.8+.15*pulse),0,Math.PI*2);ctx.strokeStyle=`hsla(${l.h},90%,72%,${Math.max(.08,.55-l.age*.025)})`;ctx.lineWidth=1.2;ctx.stroke();for(let q=0;q<3;q++){const a=l.bias+q*Math.PI*2/3+p*.08;ctx.beginPath();ctx.moveTo(l.x-cx,l.y-cy);ctx.lineTo(l.x-cx+Math.cos(a)*l.r*1.8,l.y-cy+Math.sin(a)*l.r*1.8);ctx.strokeStyle=`hsla(${l.h},80%,70%,.12)`;ctx.stroke()}}
ctx.restore()}
function frame(){phase=(performance.now()%14000)/14000*Math.PI*2;draw();requestAnimationFrame(frame)}frame();APKit.init({canvas,gifName:'law-memory-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
