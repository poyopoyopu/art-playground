<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FLAT LAW</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e4da}
body{touch-action:none}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// FLAT LAW — ChatGPT作。フルフラットの視覚を、触れるたびに別の秩序へ変える試作。
const c=document.getElementById('c'),g=c.getContext('2d');
let W=0,H=0,d=1,phase=0,law=0,seed=Math.random(),marks=[];
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
function hash(n){return Math.sin(n*127.1+seed*91.7)*43758.5453%1}
function render(p=phase){
  g.fillStyle='#e8e4da';g.fillRect(0,0,W,H);
  const S=Math.min(W,H), cell=Math.max(18,Math.floor(S/18));
  const cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const n=x+y*cols, q=hash(n), cx=x*cell+cell*.5, cy=y*cell+cell*.5;
    let dx=0,dy=0,rot=0,sz=cell*.38;
    for(const m of marks){const ax=cx-m.x,ay=cy-m.y,dist=Math.hypot(ax,ay);if(dist<m.r){const f=1-dist/m.r;
      if(law===0){rot+=Math.atan2(ay,ax)*f*.18;}
      else if(law===1){dx+=Math.cos(Math.atan2(ay,ax)+m.a)*f*cell*.55;dy+=Math.sin(Math.atan2(ay,ax)+m.a)*f*cell*.55;}
      else {sz*=1+f*.65;rot+=m.a*f*.45;}
    }}
    const wob=Math.sin(p*2+n*.37)*.035*cell;
    g.save();g.translate(cx+dx+wob,cy+dy);g.rotate(rot);
    g.fillStyle=q>.5?'#171717':'#b9b3a5';
    if(law===2 && q>.72)g.fillStyle='#171717';
    g.fillRect(-sz/2,-sz/2,sz,sz);
    g.restore();
  }
  // The marks are not painted onto the field. They are invisible rules.
}
function draw(){phase+=.004;render();requestAnimationFrame(draw)}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;
  // Every new touch changes the law globally, while its position becomes the new origin.
  law=(law+1)%3;marks.unshift({x,y,r:Math.min(W,H)*(.22+.06*Math.random()),a:Math.random()*Math.PI*2});marks=marks.slice(0,5);seed=Math.random();return true}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
draw();
APKit.init({canvas:c,gifName:'FLAT-LAW-loop',clockFormat:'spec',loopFrame:p=>render(p),buttons:[
 {label:'✦',name:'mutate',onClick:()=>{seed=Math.random();law=Math.floor(Math.random()*3);marks=[];render()}},
 {label:'↻',name:'reset',onClick:()=>{marks=[];law=0;g.fillStyle='#e8e4da';g.fillRect(0,0,W,H)}}
]});
</script>
</body>
</html>
