<!doctype html><!-- NESTED CELLS — ChatGPT作。極小セルを3階層で自己相似化。ap-kit.js統合 --><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NESTED CELLS</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,seed=Math.random()*9e4,marks=[],down=0,lx=0,ly=0;const T=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function col(h){h=(h%360+360)%360/60;let i=h|0,f=h-i,p=.06,q=.94*(1-f*.9),u=.94*(.1+f*.9),r=0,b=0,d=0;switch(i%6){case 0:r=.94;b=p;d=u;break;case 1:r=q;b=p;d=.94;break;case 2:r=p;b=u;d=.94;break;case 3:r=p;b=.94;d=q;break;case 4:r=u;b=p;d=.94;break;default:r=.94;b=p;d=q}return`rgb(${r*255|0},${d*255|0},${b*255|0})`}
function f(x,y,t){let X=x,Y=y,C=0;for(let k=0;k<3;k++){for(const m of marks){let dx=X-m.x,dy=Y-m.y,d2=dx*dx+dy*dy,a=Math.exp(-d2/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.2);X+=(dx*Math.cos(m.a)-dy*Math.sin(m.a))*a*m.p;Y+=(dx*Math.sin(m.a)+dy*Math.cos(m.a))*a*m.p;C+=a*(k+1)}let q=Math.floor((X+.0)*3)/3;X=(X-q)*1.5+q*.35;Y=Y*.93+Math.sin(X*13+k)*.012}return[X,Y,C]}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let s=4.4;for(let y=0;y<H+s;y+=s)for(let x=0;x<W+s;x+=s){let nx=x/W*2-1,ny=y/H*2-1,z=f(nx,ny,t),j=Math.sin(nx*17+ny*23+seed*.01)*18;g.fillStyle=col(seed*.025+x*.08+y*.035+z[2]*95+j);let q=s*.86;g.fillRect(x+z[0]*s*2-q/2,y+z[1]*s*2-q/2,q,q)}}
function add(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:y/H*2-1,r:tap?.3:.13,p:tap?1.4:1.0,a:Math.atan2(vy,vx)+Math.PI/2,t:performance.now()});if(marks.length>26)marks.shift();draw(performance.now());return false}function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function dn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=P(e);down=1;lx=p.x;ly=p.y;add(p.x,p.y,0,0,1)}function mv(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=P(e),dx=p.x-lx,dy=p.y-ly;if(Math.hypot(dx,dy)>6){add(p.x,p.y,dx,dy,0);lx=p.x;ly=p.y}}function up(){down=0}c.onpointerdown=dn;c.onpointermove=mv;c.onpointerup=up;c.onpointercancel=up;let st=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'nested-cells-loop',clockFormat:'spec',loopFrame:p=>draw(st+p*T*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9e4;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
