<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON SIGN — WHAT IT CAN STILL SAY</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  NEON SIGN — WHAT IT CAN STILL SAY / Claude(クロちゃん)作。ap-kit.js統合: Claude

  世界のルール — 「この看板は、生きている管で言えることしか言えない」:
  4文字ぶんのネオン管(1文字あたり16本)が並んでいて、看板はいま点けられる言葉を出している。
  管に触れると、その1本が焼き切れる。切れた管は二度と点かない。
  すると看板は、残った管だけで綴れる別の言葉を探し、そちらに切り替わる。
  管が減るほど言える言葉は減っていき、最後には何も言えなくなって、
  意味を失った管の光だけが残る。
*/
const c=document.getElementById('c');
const g=c.getContext('2d');

/* ---------- 16本組みの管の形 ---------- */
/* 1文字の枠を 幅1 × 高さ2 として、管の両端を置く */
const PT={TL:[0,0],TM:[.5,0],TR:[1,0],ML:[0,1],MM:[.5,1],MR:[1,1],BL:[0,2],BM:[.5,2],BR:[1,2]};
const SEG={
  a1:['TL','TM'],a2:['TM','TR'],
  f:['TL','ML'],b:['TR','MR'],
  g1:['ML','MM'],g2:['MM','MR'],
  e:['ML','BL'],c:['MR','BR'],
  d1:['BL','BM'],d2:['BM','BR'],
  i:['TM','MM'],l:['MM','BM'],
  h:['TL','MM'],j:['TR','MM'],k:['BL','MM'],m:['BR','MM']
};
const SEGKEYS=Object.keys(SEG);
const GLYPH={
  A:'a1 a2 f b g1 g2 e c',   C:'a1 a2 f e d1 d2',
  D:'a1 a2 b c d1 d2 i l',   E:'a1 a2 f e g1 g2 d1 d2',
  H:'f b e c g1 g2',         I:'a1 a2 i l d1 d2',
  L:'f e d1 d2',             M:'f b h j e c',
  N:'f b e c h m',           O:'a1 a2 f b e c d1 d2',
  P:'a1 a2 f b g1 g2 e',     R:'a1 a2 f b g1 g2 e m',
  S:'a1 a2 f g1 g2 c d1 d2', T:'a1 a2 i l',
  U:'f b e c d1 d2'
};
for(const k in GLYPH)GLYPH[k]=GLYPH[k].split(' ');

/* 看板が言える言葉。上にあるほど長く、看板が元気なうちに出る */
const WORDS=('OPEN NEON HOME REAL PLAN CALM ROAD SOUL HEAT PAST RUIN MIND LINE SHOP '+
  'HOPE DUST ECHO MOON LAST NOTE NEAR HALT SALT COLD HOLD LOUD MUTE LOST DEAL '+
  'ART SUN END OUT ONE RUN SIR SEA TEN TIN NET RED HIT LIT DIM ODE EAT '+
  'ON NO SO IT IN AM UP AT OH').split(' ');

const NCELL=4;
let cells=[];           /* cells[i][segKey] = {dead, heat, A, B} */
let word='',wordCells=[];
let flashSeg=null,changeFlash=0,hue0=0.92,dead=false;

let W=0,H=0,DPR=1,SX=0,SY=0,CW=0,CH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR));
  layout();
}
function layout(){
  const w=c.width,h=c.height;
  const gap=0.34;                      /* 文字間 */
  const totalW=NCELL+gap*(NCELL-1);
  /* 画面の85%に収まるように1文字の幅を決める */
  const byW=(w*0.86)/totalW;
  const byH=(h*0.52)/2;
  CW=Math.min(byW,byH);CH=CW*2;
  SX=(w-(totalW*CW))/2;
  SY=(h-CH)/2;
  cells.forEach((cell,ci)=>{
    const ox=SX+ci*(1+gap)*CW;
    for(const kk of SEGKEYS){
      const s=cell[kk];
      const p0=PT[SEG[kk][0]],p1=PT[SEG[kk][1]];
      s.A={x:ox+p0[0]*CW,y:SY+p0[1]*CW};
      s.B={x:ox+p1[0]*CW,y:SY+p1[1]*CW};
    }
  });
}
window.addEventListener('resize',resize);

function makeCells(){
  cells=[];
  for(let i=0;i<NCELL;i++){
    const o={};
    for(const kk of SEGKEYS)o[kk]={dead:false,heat:0,A:{x:0,y:0},B:{x:0,y:0}};
    cells.push(o);
  }
}

/* いま点けられる言葉を探す。長いものを優先し、同じ長さなら適当に選ぶ */
function pickWord(prev){
  const ok=[];
  for(const wd of WORDS){
    const off=Math.floor((NCELL-wd.length)/2);
    if(wd.length>NCELL)continue;
    let fine=true;
    for(let i=0;i<wd.length&&fine;i++){
      const gl=GLYPH[wd[i]];
      if(!gl){fine=false;break}
      for(const s of gl)if(cells[off+i][s].dead){fine=false;break}
    }
    if(fine)ok.push(wd);
  }
  if(!ok.length)return null;
  const maxLen=Math.max(...ok.map(s=>s.length));
  const best=ok.filter(s=>s.length===maxLen&&s!==prev);
  const pool=best.length?best:ok;
  return pool[Math.floor(Math.random()*pool.length)];
}
function setWord(){
  const wd=pickWord(word);
  if(wd===null){dead=true;word='';wordCells=[];return}
  dead=false;word=wd;
  const off=Math.floor((NCELL-wd.length)/2);
  wordCells=[];
  for(let i=0;i<NCELL;i++)wordCells.push(null);
  for(let i=0;i<wd.length;i++)wordCells[off+i]=GLYPH[wd[i]];
  changeFlash=1;
}

function seedWorld(){
  makeCells();layout();
  hue0=[0.92,0.55,0.08,0.75][Math.floor(Math.random()*4)];
  word='';dead=false;setWord();
}

/* ---------- 入力: 触れた管を焼き切る ---------- */
function segDist(s,x,y){
  const dx=s.B.x-s.A.x,dy=s.B.y-s.A.y;
  const L2=dx*dx+dy*dy||1;
  let t=((x-s.A.x)*dx+(y-s.A.y)*dy)/L2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(x-(s.A.x+dx*t),y-(s.A.y+dy*t));
}
let ptr=null,lastKill=0;
function killAt(px,py){
  const x=px*DPR,y=py*DPR;
  let best=null,bd=1e9;
  cells.forEach((cell,ci)=>{
    for(const kk of SEGKEYS){
      const s=cell[kk];
      if(s.dead)continue;
      const d=segDist(s,x,y);
      if(d<bd){bd=d;best={s:s,key:kk,ci:ci}}
    }
  });
  if(!best||bd>CW*0.34)return;
  const now=performance.now();
  if(now-lastKill<130)return;
  lastKill=now;
  best.s.dead=true;best.s.heat=0;
  flashSeg={s:best.s,t:1};
  setWord();                 /* 看板は言える言葉を探し直す */
}
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId};killAt(e.clientX,e.clientY);
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  killAt(e.clientX,e.clientY);
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

/* ---------- 進行 ---------- */
function sim(dt){
  cells.forEach((cell,ci)=>{
    const on=wordCells[ci];
    for(const kk of SEGKEYS){
      const s=cell[kk];
      if(s.dead){s.heat=0;continue}
      const want=(on&&on.indexOf(kk)>=0)?1:0;
      s.heat+=(want-s.heat)*Math.min(1,dt*(want?7:3));
    }
  });
  if(flashSeg){flashSeg.t-=dt*1.5;if(flashSeg.t<=0)flashSeg=null}
  changeFlash=Math.max(0,changeFlash-dt*2.4);
}

/* ---------- 描画 ---------- */
function stroke(A,B,w,col,alpha){
  g.strokeStyle=col;g.globalAlpha=alpha;g.lineWidth=w;
  g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke();
}
function hsl(h,s,l){return 'hsl('+(((h%1)+1)%1*360).toFixed(1)+','+s+'%,'+l+'%)'}

function render(ph){
  const w=c.width,h=c.height;
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  g.lineCap='round';g.lineJoin='round';
  const u=CW/100;

  /* 消えている管・切れた管。黒の中に形だけ残る */
  cells.forEach(cell=>{
    for(const kk of SEGKEYS){
      const s=cell[kk];
      if(s.heat>0.04&&!s.dead)continue;
      stroke(s.A,s.B,s.dead?3.4*u:4.4*u,s.dead?'#141419':'#202430',s.dead?0.5:0.8);
    }
  });

  /* 点いている管 */
  g.globalCompositeOperation='lighter';
  cells.forEach((cell,ci)=>{
    for(const kk of SEGKEYS){
      const s=cell[kk];
      if(s.dead||s.heat<=0.04)continue;
      /* ネオンらしい、わずかなちらつき */
      const fl=0.90+0.10*Math.sin(ph*7.0+ci*2.1+kk.charCodeAt(0));
      const k=s.heat*fl*(1.0+0.5*changeFlash);
      const col=hsl(hue0+ci*0.012,100,60);
      stroke(s.A,s.B,26*u,col,0.030*k);
      stroke(s.A,s.B,14*u,col,0.075*k);
      stroke(s.A,s.B,7*u,col,0.22*k);
      stroke(s.A,s.B,2.8*u,'#fff',0.70*k);
    }
  });

  /* 焼き切れた瞬間の閃光 */
  if(flashSeg){
    const t=flashSeg.t,s=flashSeg.s;
    stroke(s.A,s.B,30*u,'#fff',0.25*t*t);
    stroke(s.A,s.B,9*u,'#fff',0.7*t);
  }

  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

let phase=0,last=performance.now(),paused=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){
    phase=(phase+dt*0.9)%(Math.PI*2);
    sim(dt);
    render(phase);
  }
  requestAnimationFrame(frame);
}
seedWorld();
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'neon-sign-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(p){paused=true;render(p);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 管の色を替え、いま言える別の言葉に言い直す。切れた管はそのまま */
      hue0=Math.random();setWord();
    }},
    {label:'↻',name:'reset',onClick:function(){seedWorld();}}
  ]
});
</script>
</body></html>
