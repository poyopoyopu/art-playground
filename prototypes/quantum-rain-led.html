<!DOCTYPE html>
<!-- QUANTUM RAIN LED(仮) — クロちゃん(Claude)作の試作。2026/11/28 おっちゃん「この細かいLEDパネルを使った美しいのか欲しいな」→「LEDの光の雨」を選択。ap-kit.js統合: クロちゃん -->
<!-- 2026/11/28 おっちゃん「タッチで一つの幕が一時停止はどうかね？」→ タップするたびに手前の膜から奥へ順に1枚ずつ、その膜の雨だけが約8秒止まる(続けてタップすると止まる膜が増える)。止まっている膜は縁がほのかに光る。 -->
<!-- 2026/11/28 おっちゃん「これの方がマシだ」→「膜ごとに別の雨の世界に」: 膜0=青紫の細かい霧雨(ゆっくり漂う)、膜1=下から上へ昇る金色の光、膜2=右下へ長く斜めに降るシアンの雨、膜3=左へ強く流れるマゼンタの雨、膜4=今までの虹色のまっすぐな雨(光の柱=分・白い一滴=秒もここ)。 -->
<!-- 2026/11/28 おっちゃん「枚数増えたんだからもっと面白いことしてよ」→ ①毎分0秒、5枚の膜が奥へ広がりながら少しずつ違う向きにねじれ、LEDの格子が重なってモアレが出る(約17秒で戻る。?m=1で常にねじれた状態) ②10秒ごとに光の脈が奥の膜から手前の膜へ通り抜ける ③なぞると視点が動いて膜どうしが前後にずれる(離すとゆっくり戻る)。タップの光の輪はそのまま。 -->
<!-- 2026/11/28 おっちゃん「このLEDまくが、5枚透過してる感じにして」→ 透明なLED膜を5枚、奥へ重ねた。奥の膜ほど小さく暗く粒が少しぼけ、ゆっくり大きく揺れる(視差)。雨は膜ごとに別々に降り、すき間から後ろの膜が透ける。一番奥の膜に虹色の霞と光だまり、一番手前の膜に光の柱(分)・白い一滴(秒)・なぞった光の輪。膜のふちがうっすら光る。 -->
<!-- 画面は細かい四角いLED(約4px角)が並んだ1枚のパネル。絵をぼかして写すのではなく、LED1粒ずつの点灯を直接決める(黒はくっきり消灯)。
     元ネタ(Starkapoo氏「Quantum Rain」)の再現: 列ごとに光の粒が尾を引いてまっすぐ落ちる。奥の列は暗く遅く尾が短い、手前の列は明るく速く尾が長い。尾はデータのようにちらつき、ときどき1粒がきらめく。色は横位置の虹、粒の先頭は白っぽく光る。下ほど光がたまる。
     時計: 横幅が0〜59の目盛り。光の柱=いまの分(1時間かけて左→右)、白く明るい一滴=いまの秒。
     2026/11/28 おっちゃん「ダサすぎる、なんとなくわかる感じでいいんだよ」→ 文字は出さないことにした(下の電光掲示板の仕組みはコードに残すが表示しない)。時刻は光の柱(分)と白い一滴(秒)だけで、なんとなく分かる形。
     2026/11/28 おっちゃん「この時計の表示も見飽きたな」→「電光掲示板で流れる」を選択: 大きい数字をやめ、30秒ごとに5×7ドット書体の時刻(HH:MM)が雨の中を右から左へ11秒かけて流れる。文字の帯の所は雨が少し暗くなる。?g=1で流れっぱなし。以下の「満ちる数字」は廃止。
     (旧)世界の法則: 毎分0秒から、落ちてくる雨粒が数字の形のLEDに「とまって」灯りつづけ、時刻(時・分)が雨で満ちていく。20秒すぎからとまった粒がほどけて、また雨に戻る。
     なぞる=触れた所から光の輪が広がる。✦=虹の色をずらす / ↻=元に戻す。確認用: ?t=HH:MM:SS / ?g=1(常に数字が満ちた状態)。WebGL2・音なし・Wake Lock・録画用にpreserveDrawingBuffer -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QUANTUM RAIN LED — 光の雨が、LEDに時刻をともす</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:24%;text-align:center;color:rgba(255,255,255,.88);font:13px/1.8 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity 1.2s;text-shadow:0 0 12px #000,0 0 4px #000}
#hint.on{opacity:1}

<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
(function(){
var cv=document.getElementById('c');
var gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
var hintEl=document.getElementById('hint');
if(!gl){hintEl.innerHTML='このブラウザではWebGL2が使えません';hintEl.classList.add('on');return;}
var Q=new URLSearchParams(location.search);

function prog(vs,fs){
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
  var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var inf=gl.getActiveUniform(p,i);u[inf.name]=gl.getUniformLocation(p,inf.name);}
  return {p:p,u:u};}
var VS='#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

// ---------- LEDパネル: 1粒ずつ点灯を決める ----------
var ledP=prog(VS,
'#version 300 es\nprecision highp float;\n'+
'uniform vec2 u_grid,u_res;uniform float u_cell,u_t,u_sec,u_min,u_hue,u_fill,u_tt;uniform vec2 u_tp;uniform sampler2D u_dig;uniform float u_fti[5],u_fz[5];uniform float u_tw,u_tpos,u_ty,u_ts,u_ton,u_spread,u_twist,u_pulse;uniform vec2 u_view;out vec4 o;\n'+
'float h1(float n){return fract(sin(n*127.1+311.7)*43758.5453);}\n'+
'float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n'+
'float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x),mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x),f.y);}\n'+
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n2(p);p=p*2.02+vec2(3.1,1.7);a*=.5;}return s;}\n'+
'float hueOf(float x){float h;\n'+
' if(x<.12)h=mix(.12,0.,x/.12);else if(x<.3)h=mix(0.,-.12,(x-.12)/.18);else if(x<.45)h=mix(-.12,-.24,(x-.3)/.15);\n'+
' else if(x<.6)h=mix(-.24,-.38,(x-.45)/.15);else if(x<.8)h=mix(-.38,-.48,(x-.6)/.2);else h=mix(-.48,-.62,(x-.8)/.2);\n'+
' return fract(h+u_hue+8.);}\n'+
'vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}\n'+
// 1枚の透明なLED膜。L=0が一番奥、L=4が一番手前
'vec3 film(vec2 fc,float L){\n'+
' float z=L/4.;float s=mix(mix(.56,.3,u_spread),1.,z);vec2 ctr=u_res*vec2(.5,.52);\n'+
' float ang=u_twist*(4.-L)*(mod(L,2.)<.5?1.:-1.)*.07;float ca=cos(ang),sa=sin(ang);\n'+
' vec2 sway=vec2(sin(u_t*.11+L*1.7),cos(u_t*.083+L*.9))*(1.-z)*u_cell*4.;\n'+   // 奥の膜ほどゆっくり大きく揺れる
' vec2 q=fc-ctr-u_view*(z-1.)*1.6;q=vec2(ca*q.x-sa*q.y,sa*q.x+ca*q.y);\n'+
' vec2 p=q/s+ctr+sway;\n'+
' if(p.x<0.||p.y<0.||p.x>u_res.x||p.y>u_res.y)return vec3(0.);\n'+
' vec2 cid=floor(p/u_cell);vec2 f=fract(p/u_cell)-.5;\n'+
' float c=cid.x,r=u_grid.y-1.-cid.y;float xn=(c+.5)/u_grid.x;float yn=r/u_grid.y;\n'+
// 膜ごとに別の雨の世界: 0=霧雨 1=昇る金の光 2=右へ斜めの雨 3=左へ強く流れる雨 4=虹色のまっすぐな雨
' int Li=int(L+.5);float slope=Li==2?.55:(Li==3?-1.1:(Li==0?.12:0.));\n'+
' float rr=Li==1?(u_grid.y-1.-r):r;\n'+
' float lc=floor(c+slope*rr+.5);float cs=lc+L*157.3;\n'+
' float SPM=Li==0?.28:(Li==1?.45:(Li==2?1.15:(Li==3?1.35:1.)));float TLM=Li==0?.18:(Li==1?.5:(Li==2?1.5:(Li==3?.9:1.)));float DEN=Li==0?.05:(Li==1?.55:(Li==2?.35:(Li==3?.4:.3)));\n'+
' float tt=u_fti[Li];\n'+   // 膜ごとの時間(タップで止まる)
' float rain=0.,white=0.;\n'+
' for(int k=0;k<2;k++){float fk=float(k);if(h1(cs*3.17+fk*11.3)<DEN+.15*fk)continue;\n'+
'  float dep=clamp(z+(h1(cs*7.91+fk*5.1)-.5)*.3,0.,1.);\n'+
'  float spd=mix(6.,30.,dep)*(.85+.3*h1(cs*2.3+fk))*SPM;float tail=max(1.5,mix(5.,34.,dep)*(.7+.6*h1(cs*4.4+fk*2.))*TLM);\n'+
'  float per=u_grid.y+tail+u_grid.y*(.2+1.3*h1(cs*9.7+fk*3.));\n'+
'  float t=tt*spd+h1(cs*1.3+fk*7.)*per;float head=mod(t,per);float d=head-rr;if(d<0.||d>tail)continue;\n'+
'  float fl=.55+.45*step(.3,h2(vec2(cs*1.7+fk,rr+floor(tt*6.+h1(cs+fk)*9.))));\n'+
'  rain=max(rain,exp(-d/(tail*.32))*fl);white=max(white,step(d,1.));}\n'+
' float gs=h2(cid*.73+L*9.1+floor(tt*1.3+h2(cid+L)*13.));float gp=fract(tt*1.3+h2(cid+L)*13.);\n'+
' float glint=step(.998,gs)*pow(1.-gp,3.)*1.4;\n'+
' float bh=Li==0?.70+.05*xn:(Li==1?.11+.03*sin(xn*6.):(Li==2?.5+.04*xn:(Li==3?.87+.04*xn:hueOf(xn))));\n'+
' vec3 hc=hsv(Li==4?hueOf(xn):fract(bh),Li==1?.7:.85,1.);\n'+
' vec3 col=hc*rain+mix(hc,vec3(1.),.75)*white*rain*1.1+mix(vec3(1.),hc,.4)*glint;\n'+
' if(L<.5){\n'+                                                                    // 一番奥の膜: 虹色の霞と下にたまる光
'  vec2 bp=vec2(xn*2.4,yn*2.4*u_grid.y/u_grid.x);float wq=fbm(bp*.9+vec2(u_t*.03,-u_t*.05));float neb=fbm(bp+vec2(wq*1.6+u_t*.02,wq*1.2-u_t*.04));\n'+
'  float bg=smoothstep(.38,.85,neb)*.3+smoothstep(.6,.95,neb)*.22;\n'+
'  float wv=fract(u_t/14.);float wy=1.2-wv*1.6;float swell=exp(-pow((yn-wy-(xn-.5)*.25)/.07,2.))*.2*smoothstep(0.,.1,wv)*smoothstep(1.,.75,wv);\n'+
'  float wave=.6+.4*sin(xn*17.+u_t*.4)*sin(xn*5.3-u_t*.23);\n'+
'  col+=hsv(hueOf(fract(xn+(neb-.5)*.35)),.8,1.)*(bg+swell)+hc*(exp(-(1.-yn)/.11)*.35*wave+exp(-(1.-yn)/.35)*.08);}\n'+
' if(L>3.5){\n'+                                                                   // 一番手前の膜: 分の光の柱・秒の一滴・なぞった光の輪
'  float mcol=floor((u_min+u_sec/60.)/60.*u_grid.x);float dm=abs(c-mcol);\n'+
'  float pil=(step(dm,.5)*.5+step(dm,1.5)*.16+exp(-dm*.35)*.07)*(.35+.65*yn)*(.75+.25*step(.5,h2(vec2(c,r+floor(u_t*10.)))));\n'+
'  float sx=fract(u_sec),idx=floor(u_sec);float scol=floor((idx+.5)/60.*u_grid.x);float sd=sx*sx*u_grid.y-r;\n'+
'  float sdrop=(abs(c-scol)<.5&&sd>=0.&&sd<14.)?exp(-sd/4.)*1.2:0.;\n'+
'  float rd=length(cid-u_tp);float age=u_t-u_tt;float ring=exp(-pow(rd-age*38.,2.)/6.)*exp(-age*1.8)*step(0.,age);\n'+
'  col+=mix(vec3(1.),hc,.55)*pil+mix(vec3(1.),hc,.3)*sdrop+mix(vec3(1.),hc,.5)*ring;}\n'+
' float lum=max(max(col.r,col.g),col.b);col*=(floor(min(lum,1.4)*20.+.5)/20.*step(.12,lum)+lum*step(lum,.12))/max(lum,1e-4);\n'+
' float dd=max(abs(f.x),abs(f.y))*2.;float led=smoothstep(.88,.6-.2*(1.-z),dd)*(1.+.3*(1.-length(f)*2.));\n'+   // 奥ほど粒が少しぼける
' float e=min(min(p.x,p.y),min(u_res.x-p.x,u_res.y-p.y))/u_cell;\n'+
' vec3 edge=vec3(.5,.55,.7)*exp(-e*1.2)*.07*(1.-z*.5)+vec3(.75,.8,1.)*(exp(-e*1.4)*.35+exp(-e*.2)*.03)*u_fz[Li];\n'+   // 止まっている膜は縁が光る                       // 膜のふち(透明な板の存在感)
' vec3 off=vec3(.010,.011,.015)*smoothstep(.9,.6,dd);\n'+
' float pls=exp(-pow((u_pulse-z*1.3)/.2,2.));\n'+                                 // 奥→手前へ通り抜ける光の脈
' return (col*led*(1.+1.3*pls)+off*(1.+6.*pls)+edge*(1.+5.*pls)+hc*led*pls*.06)*mix(.42,1.,pow(z,.8));}\n'+
'void main(){vec3 c=vec3(0.);\n'+
' for(int i=0;i<5;i++){c+=film(gl_FragCoord.xy,float(i));}\n'+                  // 透けて重なる(LEDは発光なので足し合わせ)
' o=vec4(c,1.);}');

// ---------- 光のにじみ(ブルーム) ----------
var blurP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_tex;uniform vec2 u_step,u_inv;uniform float u_thr;out vec4 o;\n'+
'vec3 f(vec3 c){return max(c-u_thr,0.);}\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 s=f(texture(u_tex,uv).rgb)*.227;\n'+
' s+=(f(texture(u_tex,uv+u_step).rgb)+f(texture(u_tex,uv-u_step).rgb))*.194;\n'+
' s+=(f(texture(u_tex,uv+u_step*2.).rgb)+f(texture(u_tex,uv-u_step*2.).rgb))*.121;\n'+
' s+=(f(texture(u_tex,uv+u_step*3.).rgb)+f(texture(u_tex,uv-u_step*3.).rgb))*.054;\n'+
' s+=(f(texture(u_tex,uv+u_step*4.).rgb)+f(texture(u_tex,uv-u_step*4.).rgb))*.016;\n'+
' o=vec4(s,1.);}');
var compP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_a,u_b,u_c;uniform vec2 u_inv;out vec4 o;\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 c=texture(u_a,uv).rgb+texture(u_b,uv).rgb*.5+texture(u_c,uv).rgb*.7;\n'+
' c=c/(1.+max(c-.85,0.)*.7);o=vec4(c,1.);}');

function mkRT(w,h){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);return {t:t,f:f,w:w,h:h};}
var RT=null;
function buildRT(){if(RT)for(var k in RT){gl.deleteTexture(RT[k].t);gl.deleteFramebuffer(RT[k].f);}
  RT={sc:mkRT(W,H),q1:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),q2:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),e1:mkRT(Math.max(2,W>>3),Math.max(2,H>>3)),e2:mkRT(Math.max(2,W>>3),Math.max(2,H>>3))};}
function pass(src,dst,sx,sy,thr){gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,dst.w,dst.h);gl.useProgram(blurP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(blurP.u.u_tex,0);
  gl.uniform2f(blurP.u.u_step,sx,sy);gl.uniform2f(blurP.u.u_inv,1/dst.w,1/dst.h);gl.uniform1f(blurP.u.u_thr,thr);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

var quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

// ---------- 画面とLEDの格子 ----------
var dpr=Math.min(2,window.devicePixelRatio||1),qscale=1,W=0,H=0,CELL=8,GX=1,GY=1;
var digTex=gl.createTexture();
function resize(){var s=dpr*qscale;W=Math.max(2,Math.round(innerWidth*s));H=Math.max(2,Math.round(innerHeight*s));cv.width=W;cv.height=H;
  CELL=Math.max(3,Math.round(4.2*W/innerWidth));GX=Math.ceil(W/CELL);GY=Math.ceil(H/CELL);buildRT();}

// ---------- 電光掲示板の文字(5×7ドットの書体) ----------
var FONT={'0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','00100','01000','11111'],'3':['11111','00010','00100','00010','00001','10001','01110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['00110','01000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00010','01100'],
':':['000','011','011','000','011','011','000'],' ':['000','000','000','000','000','000','000']};
var digKey='',TW=1;function pad(n){return (n<10?'0':'')+n;}
function buildDigits(hh,mm){var txt=pad(hh)+':'+pad(mm);if(txt===digKey)return;digKey=txt;
  var cols=[];for(var i=0;i<txt.length;i++){var g=FONT[txt[i]];for(var x=0;x<g[0].length;x++){var col=[];for(var y=0;y<7;y++)col.push(g[y][x]==='1'?255:0);cols.push(col);}cols.push([0,0,0,0,0,0,0]);}
  TW=cols.length;var a=new Uint8Array(TW*7);for(var x2=0;x2<TW;x2++)for(var y2=0;y2<7;y2++)a[y2*TW+x2]=cols[x2][y2];   // 1行目=上
  gl.bindTexture(gl.TEXTURE_2D,digTex);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,TW,7,0,gl.RED,gl.UNSIGNED_BYTE,a);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);}
addEventListener('resize',resize);resize();

// ---------- 時刻 ----------
var tOff=0;
if(Q.get('t')){var m=Q.get('t').split(':');var tg=new Date();tg.setHours(+m[0]||0,+m[1]||0,+m[2]||0,0);tOff=tg.getTime()-Date.now();}
function nowDate(){return new Date(Date.now()+tOff);}
var t0=performance.now();

// ---------- 操作 ----------
var hueT=0,hueV=0,tp=[-999,-999],tt=-99,lastT=0;
function poke(e){var x=e.clientX*W/innerWidth/CELL,y=(innerHeight-e.clientY)*H/innerHeight/CELL;tp=[Math.floor(x),Math.floor(y)];tt=lastT;}
var FT=[0,0,0,0,0],FZ=[0,0,0,0,0],FZv=[0,0,0,0,0],nextFreeze=4;   // 膜ごとの時間・止まっている残り秒
var down=false,lastPoke=0,vx=0,vy=0,px0=0,py0=0,view=[0,0];
addEventListener('pointerdown',function(e){if(window.APKit&&APKit.isUI&&APKit.isUI(e.clientX,e.clientY))return;down=true;poke(e);lastPoke=lastT;px0=e.clientX;py0=e.clientY;
  FZ[nextFreeze]=8;nextFreeze=(nextFreeze+4)%5;});   // タップ=手前から順に1枚ずつ、約8秒止まる
addEventListener('pointermove',function(e){if(!down)return;var k=W/innerWidth;vx+=(e.clientX-px0)*k*1.2;vy-=(e.clientY-py0)*k*1.2;px0=e.clientX;py0=e.clientY;var lim=W*.25;vx=Math.max(-lim,Math.min(lim,vx));vy=Math.max(-lim,Math.min(lim,vy));});   // なぞる=視点が動き、膜どうしが前後にずれる
addEventListener('pointerup',function(){down=false;});addEventListener('pointercancel',function(){down=false;});

function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
var last=performance.now(),frames=0,acc=0;
function frame(now){
  var dt=Math.min(.1,(now-last)/1000);last=now;var t=(now-t0)/1000;lastT=t;
  hueV+=(hueT-hueV)*(1-Math.exp(-dt*1.6));
  var d=nowDate(),sec=d.getSeconds()+d.getMilliseconds()/1000,mn=d.getMinutes();
  buildDigits(d.getHours(),mn);
  for(var fl=0;fl<5;fl++){if(FZ[fl]>0)FZ[fl]-=dt;else FT[fl]+=dt;FZv[fl]+=((FZ[fl]>0?1:0)-FZv[fl])*(1-Math.exp(-dt*6));}
  var fill=0;
  if(!down){vx*=Math.exp(-dt*.9);vy*=Math.exp(-dt*.9);}view[0]+=(vx-view[0])*(1-Math.exp(-dt*6));view[1]+=(vy-view[1])*(1-Math.exp(-dt*6));
  var env=ss(0,4,sec)*(1-ss(10,17,sec));if(Q.get('m')==='1')env=1;   // 毎分0秒、膜が奥へ広がりながらねじれる(モアレ)
  var pulse=(sec%10)/1.6-.15;   // 10秒ごとに奥から手前へ光の脈
  var ph=sec%30,DUR=11;if(Q.get('g')==='1')ph=t%DUR;   // 30秒ごとに時刻が右から左へ流れる(11秒で通り過ぎる)
  var TS=Math.max(2,Math.floor(GX/32)),tpos=GX-Math.min(1,ph/DUR)*(GX+TW*TS),ty=Math.round(GY*.56);
  gl.bindVertexArray(vao);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.sc.f);gl.viewport(0,0,W,H);gl.useProgram(ledP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,digTex);gl.uniform1i(ledP.u.u_dig,0);
  gl.uniform2f(ledP.u.u_grid,GX,GY);gl.uniform2f(ledP.u.u_res,W,H);gl.uniform1fv(ledP.u['u_fti[0]'],FT);gl.uniform1fv(ledP.u['u_fz[0]'],FZv);gl.uniform1f(ledP.u.u_spread,env);gl.uniform1f(ledP.u.u_twist,env);gl.uniform1f(ledP.u.u_pulse,pulse);gl.uniform2f(ledP.u.u_view,view[0],view[1]);gl.uniform1f(ledP.u.u_cell,CELL);gl.uniform1f(ledP.u.u_t,t);gl.uniform1f(ledP.u.u_sec,sec);gl.uniform1f(ledP.u.u_min,mn);
  gl.uniform1f(ledP.u.u_hue,hueV);gl.uniform1f(ledP.u.u_fill,fill);gl.uniform2f(ledP.u.u_tp,tp[0],tp[1]);gl.uniform1f(ledP.u.u_tt,tt);gl.uniform1f(ledP.u.u_tw,TW);gl.uniform1f(ledP.u.u_tpos,Math.round(tpos));gl.uniform1f(ledP.u.u_ty,ty);gl.uniform1f(ledP.u.u_ts,TS);gl.uniform1f(ledP.u.u_ton,0);   // 電光掲示板の文字は出さない(2026/11/28「ダサすぎる、なんとなくわかる感じでいい」)
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  pass(RT.sc,RT.q1,2.5/W,0,.18);pass(RT.q1,RT.q2,0,1.5/RT.q1.h,0);pass(RT.q2,RT.e1,2/RT.q2.w,0,0);pass(RT.e1,RT.e2,0,2/RT.e1.h,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(compP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.sc.t);gl.uniform1i(compP.u.u_a,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.q2.t);gl.uniform1i(compP.u.u_b,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,RT.e2.t);gl.uniform1i(compP.u.u_c,2);
  gl.uniform2f(compP.u.u_inv,1/W,1/H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.activeTexture(gl.TEXTURE0);
  frames++;acc+=dt;if(frames===90){if(acc/90>.021&&qscale>.6){qscale*=.85;resize();}frames=0;acc=0;}
  requestAnimationFrame(frame);}
requestAnimationFrame(function(n){last=n;frame(n);});

// ---------- 画面を消さない ----------
var wl=null;
function wake(){if(navigator.wakeLock&&!wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}
wake();document.addEventListener('visibilitychange',wake);addEventListener('pointerdown',wake);

var hintTimer=0;
function showHint(html,ms){hintEl.innerHTML=html;hintEl.classList.add('on');clearTimeout(hintTimer);hintTimer=setTimeout(function(){hintEl.classList.remove('on');},ms);}

APKit.init({
  canvas:cv, gifName:'quantum-rain-led-loop', clockFormat:'spec',
  dock:true, autoHide:true, fullscreenButton:false,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){hueT+=.12+Math.random()*.5;}},
    {label:'↻',name:'reset',onClick:function(){hueV=hueV-Math.round(hueV);hueT=0;}}
  ]
});
showHint('5枚の透明なLED膜に、5つの雨<br>タップするたびに膜が1枚ずつ止まる<br>光の柱=分 / 白い一滴=秒',8000);
})();
</script>
