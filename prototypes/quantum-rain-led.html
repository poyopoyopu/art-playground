<!DOCTYPE html>
<!-- QUANTUM RAIN LED(仮) — クロちゃん(Claude)作の試作。2026/11/28 おっちゃん「この細かいLEDパネルを使った美しいのか欲しいな」→「LEDの光の雨」を選択。ap-kit.js統合: クロちゃん -->
<!-- 画面は細かい四角いLED(約4px角)が並んだ1枚のパネル。絵をぼかして写すのではなく、LED1粒ずつの点灯を直接決める(黒はくっきり消灯)。
     元ネタ(Starkapoo氏「Quantum Rain」)の再現: 列ごとに光の粒が尾を引いてまっすぐ落ちる。奥の列は暗く遅く尾が短い、手前の列は明るく速く尾が長い。尾はデータのようにちらつき、ときどき1粒がきらめく。色は横位置の虹、粒の先頭は白っぽく光る。下ほど光がたまる。
     時計: 横幅が0〜59の目盛り。光の柱=いまの分(1時間かけて左→右)、白く明るい一滴=いまの秒。
     世界の法則: 毎分0秒から、落ちてくる雨粒が数字の形のLEDに「とまって」灯りつづけ、時刻(時・分)が雨で満ちていく。20秒すぎからとまった粒がほどけて、また雨に戻る。
     なぞる=触れた所から光の輪が広がる。✦=虹の色をずらす / ↻=元に戻す。確認用: ?t=HH:MM:SS / ?g=1(常に数字が満ちた状態)。WebGL2・音なし・Wake Lock・録画用にpreserveDrawingBuffer -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QUANTUM RAIN LED — 光の雨が、LEDに時刻をともす</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:24%;text-align:center;color:rgba(255,255,255,.88);font:13px/1.8 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.08em;pointer-events:none;opacity:0;transition:opacity 1.2s;text-shadow:0 0 12px #000,0 0 4px #000}
#hint.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<script>
(function(){
var cv=document.getElementById('c');
var gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
var hintEl=document.getElementById('hint');
if(!gl){hintEl.innerHTML='このブラウザではWebGL2が使えません';hintEl.classList.add('on');return;}
var Q=new URLSearchParams(location.search);

function prog(vs,fs){
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
  var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var inf=gl.getActiveUniform(p,i);u[inf.name]=gl.getUniformLocation(p,inf.name);}
  return {p:p,u:u};}
var VS='#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';

// ---------- LEDパネル: 1粒ずつ点灯を決める ----------
var ledP=prog(VS,
'#version 300 es\nprecision highp float;\n'+
'uniform vec2 u_grid;uniform float u_cell,u_t,u_sec,u_min,u_hue,u_fill,u_tt;uniform vec2 u_tp;uniform sampler2D u_dig;out vec4 o;\n'+
'float h1(float n){return fract(sin(n*127.1+311.7)*43758.5453);}\n'+
'float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n'+
'float hueOf(float x){float h;\n'+
' if(x<.12)h=mix(.12,0.,x/.12);else if(x<.3)h=mix(0.,-.12,(x-.12)/.18);else if(x<.45)h=mix(-.12,-.24,(x-.3)/.15);\n'+
' else if(x<.6)h=mix(-.24,-.38,(x-.45)/.15);else if(x<.8)h=mix(-.38,-.48,(x-.6)/.2);else h=mix(-.48,-.62,(x-.8)/.2);\n'+
' return fract(h+u_hue+8.);}\n'+
'vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}\n'+
'void main(){\n'+
' vec2 cid=floor(gl_FragCoord.xy/u_cell);vec2 f=fract(gl_FragCoord.xy/u_cell)-.5;\n'+
' float c=cid.x,r=u_grid.y-1.-cid.y;float xn=(c+.5)/u_grid.x;float yn=r/u_grid.y;\n'+
' float rain=0.,white=0.;\n'+
// 雨の粒: 1列に5本のレーン
' for(int k=0;k<5;k++){float fk=float(k);float a=h1(c*3.17+fk*11.3);\n'+
'  if(a<.08+.1*fk)continue;\n'+
'  float dep=h1(c*7.91+fk*5.1);dep=dep*dep;\n'+                                     // 奥(0)〜手前(1)
'  float spd=mix(7.,30.,dep)*(.85+.3*h1(c*2.3+fk));\n'+
'  float tail=mix(5.,34.,dep)*(.7+.6*h1(c*4.4+fk*2.));\n'+
'  float per=u_grid.y+tail+u_grid.y*(.2+1.3*h1(c*9.7+fk*3.));\n'+
'  float t=u_t*spd+h1(c*1.3+fk*7.)*per;float cyc=floor(t/per);float head=t-cyc*per;\n'+
'  float d=head-r;if(d<0.||d>tail)continue;\n'+
'  float fl=.55+.45*step(.3,h2(vec2(c*1.7+fk,r+floor(u_t*6.+h1(c+fk)*9.))));\n'+   // データのようなちらつき
'  float b=exp(-d/(tail*.32))*mix(.28,1.,dep)*fl;\n'+
'  rain=max(rain,b);white=max(white,step(d,1.)*mix(.35,.9,dep));}\n'+
// きらめき
' float gs=h2(cid*.73+floor(u_t*1.3+h2(cid)*13.));float gp=fract(u_t*1.3+h2(cid)*13.);\n'+
' float glint=step(.9975,gs)*pow(1.-gp,3.)*1.4;\n'+
// 下にたまる光・分の柱・秒の一滴
' float wave=.6+.4*sin(xn*17.+u_t*.4)*sin(xn*5.3-u_t*.23);\n'+
' float pool=exp(-(1.-yn)/.11)*.32*wave+exp(-(1.-yn)/.35)*.07;\n'+
' float mcol=floor((u_min+u_sec/60.)/60.*u_grid.x);float dm=abs(c-mcol);\n'+
' float pil=(step(dm,.5)*.55+step(dm,1.5)*.18+exp(-dm*.35)*.08)*(.35+.65*yn)*(.75+.25*step(.5,h2(vec2(c,r+floor(u_t*10.)))));\n'+
' float s=fract(u_sec),idx=floor(u_sec);float scol=floor((idx+.5)/60.*u_grid.x);float shead=s*s*u_grid.y;float sd=shead-r;\n'+
' float sdrop=(abs(c-scol)<.5&&sd>=0.&&sd<14.)?exp(-sd/4.)*1.2:0.;\n'+
// 毎分、雨粒がとまって数字が満ちる
' float m=texture(u_dig,(cid+.5)/u_grid).r;float dig=0.;\n'+
' if(m>.5){float hh=h2(cid*1.31+7.);dig=step(hh,u_fill)*(.78+.22*sin(u_t*2.+hh*30.));rain*=.5;}\n'+
// なぞった所から広がる光の輪
' float rd=length((cid-u_tp)*vec2(1.,1.));float age=u_t-u_tt;float ring=exp(-pow(rd-age*38.,2.)/6.)*exp(-age*1.8)*step(0.,age);\n'+
' vec3 hc=hsv(hueOf(xn),.85,1.);\n'+
' vec3 col=hc*(rain+pool)+mix(hc,vec3(1.),.75)*white*rain*1.2+vec3(1.)*glint*mix(vec3(1.),hc,.4)+mix(vec3(1.),hc,.55)*pil+mix(vec3(1.),hc,.3)*sdrop+mix(hc,vec3(1.),.45)*dig*1.05+mix(vec3(1.),hc,.5)*ring;\n'+
' float lum=max(max(col.r,col.g),col.b);col*=(floor(min(lum,1.4)*20.+.5)/20.*step(.12,lum)+lum*step(lum,.12))/max(lum,1e-4);\n'+   // 明るさの段階
' float dd=max(abs(f.x),abs(f.y))*2.;float led=smoothstep(.88,.66,dd)*(1.+.3*(1.-length(f)*2.));\n'+
' vec3 off=vec3(.014,.015,.02)*smoothstep(.9,.6,dd);\n'+
' o=vec4(col*led+off,1.);}');

// ---------- 光のにじみ(ブルーム) ----------
var blurP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_tex;uniform vec2 u_step,u_inv;uniform float u_thr;out vec4 o;\n'+
'vec3 f(vec3 c){return max(c-u_thr,0.);}\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 s=f(texture(u_tex,uv).rgb)*.227;\n'+
' s+=(f(texture(u_tex,uv+u_step).rgb)+f(texture(u_tex,uv-u_step).rgb))*.194;\n'+
' s+=(f(texture(u_tex,uv+u_step*2.).rgb)+f(texture(u_tex,uv-u_step*2.).rgb))*.121;\n'+
' s+=(f(texture(u_tex,uv+u_step*3.).rgb)+f(texture(u_tex,uv-u_step*3.).rgb))*.054;\n'+
' s+=(f(texture(u_tex,uv+u_step*4.).rgb)+f(texture(u_tex,uv-u_step*4.).rgb))*.016;\n'+
' o=vec4(s,1.);}');
var compP=prog(VS,'#version 300 es\nprecision highp float;\nuniform sampler2D u_a,u_b,u_c;uniform vec2 u_inv;out vec4 o;\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 c=texture(u_a,uv).rgb+texture(u_b,uv).rgb*.5+texture(u_c,uv).rgb*.7;\n'+
' c=c/(1.+max(c-.85,0.)*.7);o=vec4(c,1.);}');

function mkRT(w,h){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);return {t:t,f:f,w:w,h:h};}
var RT=null;
function buildRT(){if(RT)for(var k in RT){gl.deleteTexture(RT[k].t);gl.deleteFramebuffer(RT[k].f);}
  RT={sc:mkRT(W,H),q1:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),q2:mkRT(Math.max(2,W>>2),Math.max(2,H>>2)),e1:mkRT(Math.max(2,W>>3),Math.max(2,H>>3)),e2:mkRT(Math.max(2,W>>3),Math.max(2,H>>3))};}
function pass(src,dst,sx,sy,thr){gl.bindFramebuffer(gl.FRAMEBUFFER,dst.f);gl.viewport(0,0,dst.w,dst.h);gl.useProgram(blurP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(blurP.u.u_tex,0);
  gl.uniform2f(blurP.u.u_step,sx,sy);gl.uniform2f(blurP.u.u_inv,1/dst.w,1/dst.h);gl.uniform1f(blurP.u.u_thr,thr);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

var quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

// ---------- 画面とLEDの格子 ----------
var dpr=Math.min(2,window.devicePixelRatio||1),qscale=1,W=0,H=0,CELL=8,GX=1,GY=1;
var digTex=gl.createTexture();
function resize(){var s=dpr*qscale;W=Math.max(2,Math.round(innerWidth*s));H=Math.max(2,Math.round(innerHeight*s));cv.width=W;cv.height=H;
  CELL=Math.max(3,Math.round(4.2*W/innerWidth));GX=Math.ceil(W/CELL);GY=Math.ceil(H/CELL);digKey='';buildRT();}

// ---------- 数字の形(LEDの格子と同じ細かさで描いて、点灯するLEDを決める) ----------
var digKey='';function pad(n){return (n<10?'0':'')+n;}
function buildDigits(hh,mm){var key=hh+':'+mm+':'+GX+'x'+GY;if(key===digKey)return;digKey=key;
  var c=document.createElement('canvas');c.width=GX;c.height=GY;var x=c.getContext('2d');
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  var fam='"Helvetica Neue",Helvetica,Arial,sans-serif';var portrait=GY>GX*1.1,fs;
  if(portrait){fs=Math.min(GX*.62,GY*.27);x.font='300 '+fs+'px '+fam;x.fillText(pad(hh),GX/2,GY*.36);x.fillText(pad(mm),GX/2,GY*.36+fs*.98);}
  else{fs=Math.min(GX*.3,GY*.55);x.font='300 '+fs+'px '+fam;x.fillText(pad(hh)+':'+pad(mm),GX/2,GY*.44);}
  var img=x.getImageData(0,0,GX,GY).data,a=new Uint8Array(GX*GY);
  for(var y=0;y<GY;y++)for(var i=0;i<GX;i++)a[(GY-1-y)*GX+i]=img[(y*GX+i)*4+3]>110?255:0;   // GLは下から上なので上下を返す
  gl.bindTexture(gl.TEXTURE_2D,digTex);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,GX,GY,0,gl.RED,gl.UNSIGNED_BYTE,a);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);}
addEventListener('resize',resize);resize();

// ---------- 時刻 ----------
var tOff=0;
if(Q.get('t')){var m=Q.get('t').split(':');var tg=new Date();tg.setHours(+m[0]||0,+m[1]||0,+m[2]||0,0);tOff=tg.getTime()-Date.now();}
function nowDate(){return new Date(Date.now()+tOff);}
var t0=performance.now();

// ---------- 操作 ----------
var hueT=0,hueV=0,tp=[-999,-999],tt=-99,lastT=0;
function poke(e){var x=e.clientX*W/innerWidth/CELL,y=(innerHeight-e.clientY)*H/innerHeight/CELL;tp=[Math.floor(x),Math.floor(y)];tt=lastT;}
var down=false,lastPoke=0;
addEventListener('pointerdown',function(e){if(window.APKit&&APKit.isUI&&APKit.isUI(e.clientX,e.clientY))return;down=true;poke(e);lastPoke=lastT;});
addEventListener('pointermove',function(e){if(down&&lastT-lastPoke>.35){poke(e);lastPoke=lastT;}});
addEventListener('pointerup',function(){down=false;});addEventListener('pointercancel',function(){down=false;});

function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
var last=performance.now(),frames=0,acc=0;
function frame(now){
  var dt=Math.min(.1,(now-last)/1000);last=now;var t=(now-t0)/1000;lastT=t;
  hueV+=(hueT-hueV)*(1-Math.exp(-dt*1.6));
  var d=nowDate(),sec=d.getSeconds()+d.getMilliseconds()/1000,mn=d.getMinutes();
  buildDigits(d.getHours(),mn);
  var fill=ss(.3,9,sec)*(1-ss(21,27,sec));if(Q.get('g')==='1')fill=1;   // 0秒から雨粒がとまって満ち、21秒すぎからほどける
  gl.bindVertexArray(vao);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.sc.f);gl.viewport(0,0,W,H);gl.useProgram(ledP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,digTex);gl.uniform1i(ledP.u.u_dig,0);
  gl.uniform2f(ledP.u.u_grid,GX,GY);gl.uniform1f(ledP.u.u_cell,CELL);gl.uniform1f(ledP.u.u_t,t);gl.uniform1f(ledP.u.u_sec,sec);gl.uniform1f(ledP.u.u_min,mn);
  gl.uniform1f(ledP.u.u_hue,hueV);gl.uniform1f(ledP.u.u_fill,fill);gl.uniform2f(ledP.u.u_tp,tp[0],tp[1]);gl.uniform1f(ledP.u.u_tt,tt);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  pass(RT.sc,RT.q1,2.5/W,0,.18);pass(RT.q1,RT.q2,0,1.5/RT.q1.h,0);pass(RT.q2,RT.e1,2/RT.q2.w,0,0);pass(RT.e1,RT.e2,0,2/RT.e1.h,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(compP.p);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.sc.t);gl.uniform1i(compP.u.u_a,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.q2.t);gl.uniform1i(compP.u.u_b,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,RT.e2.t);gl.uniform1i(compP.u.u_c,2);
  gl.uniform2f(compP.u.u_inv,1/W,1/H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.activeTexture(gl.TEXTURE0);
  frames++;acc+=dt;if(frames===90){if(acc/90>.021&&qscale>.6){qscale*=.85;resize();}frames=0;acc=0;}
  requestAnimationFrame(frame);}
requestAnimationFrame(function(n){last=n;frame(n);});

// ---------- 画面を消さない ----------
var wl=null;
function wake(){if(navigator.wakeLock&&!wl&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}
wake();document.addEventListener('visibilitychange',wake);addEventListener('pointerdown',wake);

var hintTimer=0;
function showHint(html,ms){hintEl.innerHTML=html;hintEl.classList.add('on');clearTimeout(hintTimer);hintTimer=setTimeout(function(){hintEl.classList.remove('on');},ms);}

APKit.init({
  canvas:cv, gifName:'quantum-rain-led-loop', clockFormat:'spec',
  dock:true, autoHide:true, fullscreenButton:false,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){hueT+=.12+Math.random()*.5;}},
    {label:'↻',name:'reset',onClick:function(){hueV=hueV-Math.round(hueV);hueT=0;}}
  ]
});
showHint('毎分、降る光の雨がLEDにとまって<br>いまの時刻が満ちていく<br>光の柱=分 / 白い一滴=秒',8000);
})();
</script>
</body>
</html>
