<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BILATERAL WEAVE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,marks=[],bias=0;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=0){g.fillStyle="#000";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let q=0;q<34;q++){g.beginPath();for(let i=0;i<160;i++){let u=i/159,t=u*Math.PI*2,a=t+Math.sin(t*3+q*.4+p*.3)*.08,x=(S*.08+u*S*.32)*Math.cos(a),y=(S*.08+u*S*.32)*Math.sin(a);for(let m of marks){let dx=x+cx-m.x,dy=y+cy-m.y,z=Math.max(0,1-Math.hypot(dx,dy)/180);x+=dx*z*.35;y+=dy*z*.35}x*=1+bias*.002;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${bias>0?45:205},90%,${68-q*.7}%,${.09+q*.006})`;g.lineWidth=1+q*.025;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;marks.unshift({x,y});bias+=(x-W/2)/W*18;marks=marks.slice(0,8)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'BILATERAL-WEAVE-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>bias=(Math.random()-.5)*30},{label:'↻',name:'reset',onClick:()=>{marks=[];bias=0}}]});(function loop(){draw(performance.now()*.00007);requestAnimationFrame(loop)})();</script></body></html>
