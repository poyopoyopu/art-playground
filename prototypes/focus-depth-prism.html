<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH PRISM</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07030d}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: attention reveals recursive depth. Touch DRAGS the aperture. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,focus=null,mem=[],dream=[],last=performance.now(),hue=.71;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
function reset(){focus={x:W*.5,y:H*.5,p:.4,rot:0};mem=[];dream=[];for(let i=0;i<5;i++)dream.push({x:W*(.08+.84*Math.random()),y:H*(.08+.84*Math.random()),p:.35+Math.random()*.4,ph:Math.random()*TAU})}reset();
function sources(t){let a=[{x:focus.x,y:focus.y,p:focus.p,r:Math.min(W,H)*.30}];for(let m of mem)a.push(m);for(let d of dream){d.ph+=.0025;d.p=.22+.22*(.5+.5*Math.sin(t*.00035+d.ph));a.push({x:d.x+Math.sin(d.ph)*20,y:d.y+Math.cos(d.ph*1.3)*18,p:d.p,r:Math.min(W,H)*.16})}return a}
function att(px,py,ss){let v=0;for(let s of ss)v+=s.p*Math.exp(-Math.hypot(px-s.x,py-s.y)/s.r);return v}
function pal(v,depth){let stops=[[278,92,70],[192,88,68],[36,96,62],[328,82,74]];let q=stops[(depth+Math.floor(v*9))%stops.length];return `hsla(${q[0]+v*22},${q[1]}%,${q[2]}%,`}
function cell(px,py,w,d,ss){let a=att(px+w/2,py+w/2,ss),th=.27+d*.135;if(d<9&&a>th&&w>4){let q=w/2;cell(px,py,q,d+1,ss);cell(px+q,py,q,d+1,ss);cell(px,py+q,q,d+1,ss);cell(px+q,py+q,q,d+1,ss);return}let v=(px/W+py/H)*.5+hue+d*.045;g.fillStyle=pal(v%1,d)+(.035+a*.18)+')';g.fillRect(px,py,w-.6,w-.6);g.strokeStyle=pal((v+.12)%1,d)+(.12+a*.34)+')';g.lineWidth=.55;g.strokeRect(px+.3,py+.3,w-.6,w-.6)}
function draw(t,dt){focus.p=.34+.27*(.5+.5*Math.sin(t*.00042));focus.rot+=dt*.08;for(let i=mem.length-1;i>=0;i--){mem[i].p*=Math.pow(.12,dt);if(mem[i].p<.025)mem.splice(i,1)}g.fillStyle='#07030d';g.fillRect(0,0,W,H);cell(0,0,W,0,sources(t));g.save();g.translate(focus.x,focus.y);g.rotate(focus.rot);g.strokeStyle='rgba(255,255,255,.35)';g.strokeRect(-5,-5,10,10);g.restore()}
function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;focus.x=e.clientX;focus.y=e.clientY;focus.p=1});c.addEventListener('pointermove',e=>{if(e.buttons){focus.x=e.clientX;focus.y=e.clientY;focus.p=Math.min(1,focus.p+.012)}});c.addEventListener('pointerup',()=>{mem.push({x:focus.x,y:focus.y,p:Math.min(.9,focus.p),r:Math.min(W,H)*.20});if(mem.length>15)mem.shift()});
APKit.init({canvas:c,gifName:'focus-depth-prism-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{focus={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.34*Math.sin(p*2)),p:.75+.2*Math.sin(p)**2};g.fillStyle='#07030d';g.fillRect(0,0,W,H);cell(0,0,W,0,[{x:focus.x,y:focus.y,p:focus.p,r:Math.min(W,H)*.30}])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=Math.random()}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
