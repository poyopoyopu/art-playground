<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPECTRAL ORGAN</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070c}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* SPECTRAL ORGAN — ChatGPT作。触れた場所が次の呼吸の中心になる巨大な有機膜。 */
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*50,t=0,paused=false;
let centers=[{x:.5,y:.5,w:1}],touches=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.5,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();
function pal(h){h=((h%1)+1)%1;let x=h*6,q=Math.floor(x),f=x-q;let a=[[1,f,0],[1-f,1,0],[0,1,f],[0,1-f,1],[f,0,1],[1,0,1-f]][q];return 'rgb('+a.map(v=>Math.round(v*210+25)).join(',')+')'}
function center(){let sx=0,sy=0,sw=0;for(const p of centers){sx+=p.x*p.w;sy+=p.y*p.w;sw+=p.w}return [sx/sw,sy/sw]}
function draw(ph){
 const cx=center(),R=Math.min(W,H)*.46;ctx.fillStyle='#08070c';ctx.fillRect(0,0,W,H);
 const breath=.5+.5*Math.sin(ph*.75),pulse=.94+.12*Math.sin(ph*.75),n=96,rings=28;
 for(let j=rings-1;j>=0;j--){let r=R*(j+1)/rings*pulse;ctx.beginPath();
   for(let i=0;i<=n;i++){let a=i/n*Math.PI*2;let wave=1+.16*Math.sin(a*5-ph*.9+seed)+.07*Math.sin(a*11+ph*1.2+j*.4);
     let local=0;for(const p of touches){let d=Math.hypot(Math.cos(a)*r/W+p.x-cx,Math.sin(a)*r/H+p.y-cy);local+=Math.exp(-d*d/.012)*.12}
     let rr=r*(wave+local*Math.sin(ph*.8+j*.25));let x=cx*W+Math.cos(a)*rr,y=cy*H+Math.sin(a)*rr*.9;
     if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}
   ctx.closePath();ctx.fillStyle=pal(.58+j*.026+ph*.025+breath*.08);ctx.globalAlpha=.12+.018*j;ctx.fill();ctx.globalAlpha=1;
 }
 ctx.globalCompositeOperation='screen';
 for(let layer=0;layer<5;layer++){ctx.beginPath();for(let i=0;i<=n;i++){let a=i/n*Math.PI*2;let r=R*(.18+layer*.14)*(1+.2*Math.sin(a*(6+layer)+ph+seed));let x=cx[0]*W+Math.cos(a)*r,y=cx[1]*H+Math.sin(a)*r*.9;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle=pal(.82+layer*.07+ph*.02);ctx.globalAlpha=.28;ctx.lineWidth=1.2+layer*.35;ctx.stroke()}
 ctx.globalCompositeOperation='source-over';
 // self-similar vascular branches
 for(let k=0;k<24;k++){let a=k/24*Math.PI*2+ph*.05,len=R*(.55+.12*Math.sin(seed+k));branch(cx[0]*W,cx[1]*H,a,len,3,ph,k)}
}
function branch(x,y,a,len,depth,ph,k){if(depth<0||len<8)return;let bend=.12*Math.sin(ph+k+depth);let ex=x+Math.cos(a+bend)*len,ey=y+Math.sin(a+bend)*len*.9;ctx.strokeStyle=pal(.72+k*.017+depth*.06);ctx.globalAlpha=.11;ctx.lineWidth=Math.max(.5,depth*.55);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();let da=.43+.06*Math.sin(k+seed);branch(ex,ey,a+da,len*.56,depth-1,ph,k+.7);branch(ex,ey,a-da,len*.56,depth-1,ph,k+1.1)}
function addTouch(x,y){touches.push({x:x/W,y:y/H});centers.unshift({x:x/W,y:y/H,w:1.8});if(centers.length>5)centers.pop();if(touches.length>10)touches.shift()}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();addTouch(e.clientX,e.clientY)});
function loop(now){if(!paused){t=now*.00035;draw(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'spectral-organ-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[
{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*50}},
{label:'↻',name:'reset',onClick:()=>{touches=[];centers=[{x:.5,y:.5,w:1}]}}]});
</script></body></html>
