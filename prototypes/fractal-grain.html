<!doctype html><!-- FRACTAL GRAIN — ChatGPT作。極小セルが多段階の流れを形成する試作。ap-kit.js統合 --><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FRACTAL GRAIN</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,D,seed=Math.random()*1e5,marks=[],down=0,lx=0,ly=0;const T=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h){h=(h%360+360)%360/60;let i=h|0,f=h-i,p=.04,q=.96*(1-f),u=.96*f,r,b,d;switch(i%6){case 0:r=.96;b=p;d=u;break;case 1:r=q;b=p;d=.96;break;case 2:r=p;b=u;d=.96;break;case 3:r=p;b=.96;d=q;break;case 4:r=u;b=p;d=.96;break;default:r=.96;b=p;d=q}return`rgb(${r*255|0},${d*255|0},${b*255|0})`}
function flow(x,y,t){let X=x,Y=y,C=0;for(let k=0;k<6;k++){let a=Math.sin(Y*3.1+seed*.0007+k*.7)+Math.cos(X*4.7-k*.4);let b=Math.cos(X*2.3+seed*.0005-k)+Math.sin(Y*5.2+k*.3);for(const m of marks){let dx=X-m.x,dy=Y-m.y,d2=dx*dx+dy*dy,q=Math.exp(-d2/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.18);a+=(-dy*m.spin+dx*m.pull)*q;b+=(dx*m.spin+dy*m.pull)*q;C+=q*(k+1)}let ca=Math.cos(a*.17),sa=Math.sin(a*.17);let xx=X*ca-Y*sa,yy=X*sa+Y*ca;X=xx*.67+Math.sin(yy*5+k)*.035;Y=yy*.67+Math.cos(xx*7-k)*.035}return[X,Y,C]}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let s=3.7;for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){let nx=x/W*2-1,ny=y/H*2-1,z=flow(nx,ny,t);let hue=seed*.018+x*.11-y*.07+z[2]*118+Math.sin(x*.025+y*.019)*35;g.fillStyle=hsv(hue);let q=s*.72;g.fillRect(x+z[0]*s*2.3-q/2,y+z[1]*s*2.3-q/2,q,q)}}
function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function add(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:y/H*2-1,r:tap?.28:.095,pull:tap?1.5:1.0,spin:tap?1.1:(vx-vy)*.02,t:performance.now()});if(marks.length>30)marks.shift();draw(performance.now());return false}function dn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=P(e);down=1;lx=p.x;ly=p.y;add(p.x,p.y,0,0,1)}function mv(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=P(e),dx=p.x-lx,dy=p.y-ly;if(Math.hypot(dx,dy)>5){add(p.x,p.y,dx,dy,0);lx=p.x;ly=p.y}}function up(){down=0}c.onpointerdown=dn;c.onpointermove=mv;c.onpointerup=up;c.onpointercancel=up;let st=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'fractal-grain-loop',clockFormat:'spec',loopFrame:p=>draw(st+p*T*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*1e5;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
