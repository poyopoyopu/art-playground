<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MEMORY RIFT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let d,W,H,marks=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function render(p=0){g.fillStyle='#05060a';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<34;k++){g.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,r=S*(.06+k*.022),x=Math.cos(a)*r,y=Math.sin(a)*r;for(let m of marks){let dx=x+cx-m.x,dy=y+cy-m.y,q=Math.max(0,1-Math.hypot(dx,dy)/220);let aa=Math.atan2(dy,dx)+q*q*m.turn;x+=Math.cos(aa)*q*14;y+=Math.sin(aa)*q*14}let b=Math.sin(a*(2+k%4)+p*2+k)*S*.012;x+=Math.cos(a)*b;y+=Math.sin(a)*b;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${175+k*3},75%,${48+k}%,${.035+k*.002})`;g.lineWidth=1+k*.025;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;marks.unshift({x,y,turn:(Math.random()-.5)*5});marks=marks.slice(0,8)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'MEMORY-RIFT-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>marks.forEach(m=>m.turn+=(Math.random()-.5)*2)},{label:'↻',name:'reset',onClick:()=>{marks=[]}}]});function loop(){render(performance.now()*.00018);requestAnimationFrame(loop)}loop();</script></body></html>
