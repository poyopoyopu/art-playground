<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORGANISM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* ORGANISM — ChatGPT作。一本の生体軸が自分自身を枝分かれさせ、触れた場所を新しい成長点にする。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform vec2 r;uniform float t,seed;uniform vec4 press[8];uniform int n;
vec3 pal(float h){float z=fract(h+seed*.017);return .5+.5*cos(6.2831853*(z+vec3(0.,.31,.63)));}
void main(){vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);float best=9.,gene=0.;
for(int k=0;k<7;k++){float fi=float(k);float s=pow(1.65,-fi);vec2 q=p*s;float a=atan(q.y,q.x);float rr=length(q);
float branch=sin(a*(3.+mod(fi,3.))+rr*5.-t*.13+fi*1.7+seed*.03);float trunk=abs(q.x+.11*sin(q.y*7.+t*.12+fi)*(.3+.08*fi));
float d=abs(trunk-(.045+.018*sin(q.y*13.+fi))*(.7+.3*abs(branch)));best=min(best,d/s);gene+=smoothstep(.07,.0,d/s)*(.11+.035*fi);}
for(int i=0;i<8;i++){if(i>=n)break;vec2 d=p-press[i].xy;float g=exp(-dot(d,d)/(.045+.02*press[i].z));float a=atan(d.y,d.x);best=min(best,abs(length(d)-(.08+.035*sin(a*4.+t*.2+seed)))*g+.002);gene+=g*(.3+press[i].z);}
float edge=smoothstep(.018,.0,best),inner=sin(p.x*21.+p.y*17.+gene*8.+t*.1),spectrum=atan(p.y,p.x)*.22+gene+inner*.045+seed*.01;vec3 col=pal(spectrum);col*=.18+.82*edge;col+=vec3(1.)*edge*.3;col=.02+col*1.25;o=vec4(pow(max(col,0.),vec3(.78)),1.);}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));let U={};for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''))}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);let W,H,D=1,seed=Math.random()*70,press=[],paused=false,currentPhase=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.5,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}function draw(ph){gl.useProgram(pr);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(32);press.forEach((q,i)=>a.set(q,i*4));gl.uniform4fv(U.press,a);gl.uniform1i(U.n,press.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);press.push([q[0],q[1],.7+.6*Math.random(),currentPhase]);if(press.length>8)press.shift()});let start=performance.now();function loop(now){currentPhase=(now-start)*.00035;if(!paused)draw(currentPhase);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'organism-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*90},{label:'↻',name:'reset',onClick:()=>press=[]}]});
</script></body></html>
