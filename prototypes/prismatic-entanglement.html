<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRISMATIC ENTANGLEMENT</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body><canvas id="c"></canvas><script>
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,seed=Math.random()*100,mode=0,last=performance.now(),rx=0,ry=0,tx=0,ty=0;
const TAU=Math.PI*2;
const palettes=[[[35,220,255],[117,65,255],[255,65,205],[255,190,80]],[[70,255,185],[40,170,255],[155,100,255],[255,245,170]],[[255,80,175],[120,70,255],[40,215,255],[255,175,65]],[[255,115,55],[255,45,145],[95,70,255],[55,225,235]]];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function bg(g,t){g.fillStyle='#02030a';g.fillRect(0,0,W,H);const s=Math.min(W,H),cx=W*.5+Math.sin(t*.17)*s*.08,cy=H*.5+Math.cos(t*.13)*s*.06;const blobs=[[-.32,-.22,.55,0],[.34,-.28,.52,1],[.38,.32,.58,2],[-.30,.34,.48,3]];blobs.forEach((b,i)=>{const x=cx+b[0]*s,y=cy+b[1]*s,r=b[2]*s,p=palettes[mode][b[3]],q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${p[0]},${p[1]},${p[2]},${.15-i*.012})`);q.addColorStop(.42,`rgba(${p[0]},${p[1]},${p[2]},.055)`);q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,W,H)});g.save();g.globalCompositeOperation='screen';for(let i=0;i<12;i++){const a=i*TAU/12+t*.035*(i%2?1:-1),r=s*(.30+.035*Math.sin(t*.2+i)),x=W*.5+Math.cos(a)*r,y=H*.5+Math.sin(a)*r*.7,p=palettes[mode][i%4],q=g.createRadialGradient(x,y,0,x,y,s*.055);q.addColorStop(0,`rgba(${p[0]},${p[1]},${p[2]},.09)`);q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.beginPath();g.arc(x,y,s*.07,0,TAU);g.fill()}g.restore();const vign=g.createRadialGradient(W*.5,H*.5,s*.18,W*.5,H*.5,s*.78);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.58)');g.fillStyle=vign;g.fillRect(0,0,W,H)}
function point(u,t,ring){const a=u*TAU+t*(.065+ring*.012)+seed*.013,breathe=1+.10*Math.sin(t*.23+ring*1.7)+.055*Math.sin(t*.11+u*TAU*3+seed);let x=Math.sin(a)*(1+.27*Math.sin(2*a+t*.12+ring))+.18*Math.sin(5*a-t*.08+ring),y=Math.cos(a)*(.73+.20*Math.cos(3*a-t*.10-ring*.7))+.13*Math.sin(4*a+t*.09),z=.38*Math.sin(2*a+t*.07+ring*.8)+.15*Math.sin(5*a-t*.05),twist=.18*Math.sin(a*2+t*.10+ring)+.08*Math.sin(a*7-t*.13),ca=Math.cos(ry),sa=Math.sin(ry),cb=Math.cos(rx),sb=Math.sin(rx),xx=x*ca-z*sa,zz=x*sa+z*ca,yy=y*cb-zz*sb,z2=y*sb+zz*cb;return[xx*breathe,yy*breathe,z2]}
function strokeRibbon(g,t,ring){const s=Math.min(W,H),scale=s*.245,cx=W*.5,cy=H*.5,P=[],N=260;for(let i=0;i<=N;i++)P.push(point(i/N,t,ring));const pal=palettes[mode];g.save();g.translate(cx,cy);g.globalCompositeOperation='lighter';for(let layer=8;layer>=0;layer--){g.beginPath();for(let i=0;i<=N;i++){const p=P[i],z=p[2],pers=1/(1-z*.22),x=p[0]*scale*pers,y=p[1]*scale*pers;i?g.lineTo(x,y):g.moveTo(x,y)}const a=.025+.012*layer,col=pal[(ring+layer)%pal.length];g.lineWidth=.7+layer*.9;g.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;g.stroke()}for(let pass=0;pass<3;pass++){g.beginPath();for(let i=0;i<=N;i++){const p=P[i],pers=1/(1-p[2]*.22),x=p[0]*scale*pers,y=p[1]*scale*pers;i?g.lineTo(x,y):g.moveTo(x,y)}const grad=g.createLinearGradient(-scale,-scale,scale,scale),c0=pal[(ring+pass)%4],c1=pal[(ring+pass+1)%4],c2=pal[(ring+pass+2)%4];grad.addColorStop(0,`rgba(${c0[0]},${c0[1]},${c0[2]},.55)`);grad.addColorStop(.42,`rgba(${c1[0]},${c1[1]},${c1[2]},.82)`);grad.addColorStop(.72,`rgba(${c2[0]},${c2[1]},${c2[2]},.66)`);grad.addColorStop(1,`rgba(${c0[0]},${c0[1]},${c0[2]},.45)`);g.strokeStyle=grad;g.lineWidth=18-pass*5;g.shadowBlur=18-pass*4;g.shadowColor=`rgba(${c1[0]},${c1[1]},${c1[2]},.35)`;g.stroke()}g.shadowBlur=0;for(let k=0;k<7;k++){const u=(k/7+t*.018+ring*.09)%1,p=point(u,t,ring),pers=1/(1-p[2]*.22),x=p[0]*scale*pers,y=p[1]*scale*pers;if(p[2]>.02){const r=s*(.008+.006*Math.sin(k+t*.3)),q=g.createRadialGradient(x,y,0,x,y,r*5);q.addColorStop(0,'rgba(255,255,255,.82)');q.addColorStop(.15,'rgba(220,250,255,.38)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.beginPath();g.arc(x,y,r*5,0,TAU);g.fill()}}g.restore()}
function draw(t){bg(ctx,t);strokeRibbon(ctx,t,0);strokeRibbon(ctx,t+.9,1);strokeRibbon(ctx,t+1.8,2);const s=Math.min(W,H),q=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,s*.23);q.addColorStop(0,'rgba(1,2,9,.86)');q.addColorStop(.55,'rgba(3,4,15,.30)');q.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=q;ctx.beginPath();ctx.arc(W*.5,H*.5,s*.25,0,TAU);ctx.fill()}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;mode=(mode+1)%palettes.length;seed=Math.random()*100;tx=(y/H-.5)*.9;ty=(x/W-.5)*.9;return true}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});c.addEventListener('pointermove',e=>{if(e.buttons){tx=(e.clientY/H-.5)*1.1;ty=(e.clientX/W-.5)*1.1}},{passive:true});
function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;rx+=(tx-rx)*(1-Math.exp(-dt*1.6));ry+=(ty-ry)*(1-Math.exp(-dt*1.6));draw(now/1000);requestAnimationFrame(animate)}
APKit.init({canvas:c,gifName:'prismatic-entanglement-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:function(){mode=(mode+1)%palettes.length;seed=Math.random()*100;}},{label:'↻',name:'reset',onClick:function(){mode=0;seed=Math.random()*100;rx=0;ry=0;tx=0;ty=0;}}]});requestAnimationFrame(animate);
</script></body></html>
