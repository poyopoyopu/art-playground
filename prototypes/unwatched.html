<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>UNWATCHED — 見られていない石像だけが動ける</title>
<!-- UNWATCHED — ムーちゃん(Muse)作。2026/11/06 試作。前作 GAZE GARDEN(庭)が実機で「つまらんなー」と
     却下された(変化が繊細すぎて粗い視線精度に負けた)ため、題材ごと作り直した第2作。
     世界のルール: 見られていない石像だけが動ける。暗い美術館ホールに大理石の石像が5体立つ。
     視線(半径=画面の約30%)が当たっている石像は光を浴びて白く照らされ、完全に止まる。
     視線の外の石像はゆっくり観客へ近づき(奥行きが進む=大きく・下へ)、頭がこちらを向き、ポーズが少しずつ変わる。
     視線を戻したとき「さっきより近い/姿が違う」と気づくのが核で、見ている正面では滑って動かない
     (前進量は視線の効き influence の残りでのみ決まり、中心で見ている石像の前進は厳密に0)。
     近づきすぎた石像は前景いっぱいの所で静かにフェードして奥へ戻る。ゲーム要素・音・スコアは一切なし。
     視線: 前面カメラ+MediaPipe Face Landmarker(tasks-vision、CDN)で虹彩と顔の向きから推定する
     (推定コードは GAZE GARDEN から再利用。校正なし、半径約30%で作品側が粗さを吸収する)。
     カメラ映像は画面に出さず、端末の外へ送らない。カメラが無い/拒否/読み込み失敗のときは
     指・マウスの位置が視線の代わりになり、何も触らないと視線がゆっくり巡回する自動デモになる。
     Render: Canvas 2D。石像は奥行き depth(0=奥..1=前景)で投影し、遠→近の順に描く。
     画質改修(2026/11/06 第2版): 第1版は実機で「絵が安っぽい」と却下された(フラットなベタ塗り人型が敗因。
     仕組み・コンセプトへの不満ではない)ため、描画だけを全面改修。石像はベジェで作る彫刻的なローブの
     シルエットを事前にオフスクリーンへ焼いたスプライト(ほぼ真っ黒な base / 大理石の脈テクスチャ付き lit /
     縁だけ光る rim / 霧色 fog の4層×深度3バケット)で描き、空気感は床の反射・接触影・視線スポットライト・
     光の中の埃・霧の帯・フィルムグレインで作る。仕組み側の数値・挙動は第1版から変更なし。
     ap-kit.js統合: Muse(必須オプション一式。loopFrameは渡さない=◉なし) -->
<script src="../ap-kit.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:16px;right:16px;text-align:center;pointer-events:none;font:500 15px/1.9 system-ui,-apple-system,"Hiragino Sans",sans-serif;letter-spacing:.06em;color:#fff;text-shadow:0 0 14px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.8);transition:opacity 1.4s}
#hint .sub{font-size:11px;color:rgba(255,255,255,.82);letter-spacing:.1em}
#hint.off{opacity:0}
#tip{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 96px);text-align:center;pointer-events:none;font:500 13px/1.7 system-ui,-apple-system,"Hiragino Sans",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.8);opacity:0;transition:opacity .8s}
#tip.on{opacity:1}

@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-22px,13px)}50%{transform:translate(14px,-19px)}75%{transform:translate(-9px,-26px)}100%{transform:translate(0,0)}}
</style>

<body>
<canvas id="c" aria-label="暗い美術館のホールに立つ石像たち。見つめている石像は止まって白く照らされ、見ていない石像だけが少しずつ近づいてくる"></canvas>
<div id="hint">みられていない石像だけが、うごける<br><span class="sub">👁 をおすと カメラが視線を追う · ゆびでも うごく</span></div>
<div id="tip"></div>
<div id="vig"></div>
<div id="grain"></div>
<video id="cam" playsinline muted></video>
<script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),
      hint=document.getElementById('hint'),tipEl=document.getElementById('tip'),video=document.getElementById('cam');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const now=()=>performance.now()/1000;

/* ---------- 乱数(種つき。✦で引き直し、↻で最初の種に戻る) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FIRST_SEED=20261106;
let rnd=mulberry32(FIRST_SEED);
const rr=(a,b)=>a+rnd()*(b-a);

/* ---------- 石像(世界の状態) ----------
   lane: ホールの左右位置(-1..1) / depth: 奥行き(0=奥..1=前景いっぱい)
   pose: ポーズの型(0..3) / poseT: 見られていない間にだけ進む「変化の時計」
   lit: 照らされ具合(視線の効きへ滑らかに追う) / watch: 今フレームの視線の効き */
let statues=[];
function arrange(seed){
  rnd=mulberry32(seed);
  const lanes=[-.82,-.42,0,.42,.82], depths=[.08,.22,.38,.52,.66];
  // 並びは種で入れ替える(中央が必ず一番手前、にならないように)
  for(let i=depths.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const t=depths[i];depths[i]=depths[j];depths[j]=t}
  statues=lanes.map((lane,i)=>({
    lane:lane+rr(-.05,.05), depth:depths[i],
    speed:rr(.030,.046),                 // 奥行きの進む速さ(体ごとに違う)
    pose:i%4, poseT:rr(0,.4), sway:rr(0,6.28),
    lit:0, watch:0, px:0, py:0, ph:0
  }));
}
arrange(FIRST_SEED);
function resetStatue(s,back){
  s.depth=back?rr(.02,.10):s.depth;
  s.poseT=0; s.lit=0;
  if(back){s.lane=rr(-.9,.9); s.pose=(rnd()*4)|0; s.speed=rr(.030,.046)}
}

/* ---------- 画面と視線 ---------- */
let W=1,H=1,U=1,R=100,horizonY=0;
const sceneC=document.createElement('canvas'),sceneCtx=sceneC.getContext('2d');
const SC=.55;                       // シーン(ホール+反射+石像)は SC 倍の解像度で描いてから拡大する(空気感のある絵では滲みが味になり、描画負荷が下がる)
let DC=ctx;                         // 描画先(フレーム前半は sceneCtx、後半の重ね物は ctx)
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);U=Math.min(W,H);
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  sceneC.width=Math.max(1,Math.round(W*dpr*SC));sceneC.height=Math.max(1,Math.round(H*dpr*SC));
  sceneCtx.setTransform(dpr*SC,0,0,dpr*SC,0,0);
  R=Math.max(W,H)*.30;                       // 視線が効く半径(粗い推定を吸収する広さ)
  horizonY=H*.40;
}
addEventListener('resize',resize);resize();

const gaze={x:innerWidth/2,y:innerHeight/3};
const gazeT={x:gaze.x,y:gaze.y};
let mode='auto';                                     // auto | pointer | camera
let lastPointer=-10,lastFace=-10,camState='off';     // off | starting | on
function influence(x,y){
  const dx=x-gaze.x,dy=y-gaze.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d>=R)return 0;
  const q=1-d/R;return q*q;
}

/* ---------- 投影(奥行き→画面) ---------- */
function project(s){
  const t=s.depth;
  s.px=W/2+s.lane*W*(.13+.40*t);                       // 奥では中央に寄り、手前で広がる
  s.py=horizonY+(H*1.03-horizonY)*Math.pow(t,1.35);    // 足元(手前ほど下へ)
  s.ph=H*(.15+.98*Math.pow(t,1.65));                    // 背丈(手前ほど大きく)
}

/* ---------- 更新: 見られていない石像だけが動ける ---------- */
function updateStatue(s,dt){
  project(s);
  s.watch=influence(s.px,s.py-s.ph*.55);               // 石像の中心で視線の効きを見る
  const tau=s.watch>s.lit?.25:1.1;
  s.lit+=(s.watch-s.lit)*(1-Math.exp(-dt/tau));
  // 前進は「視線の効きの残り」でのみ決まる。効きが .55 以上ある石像は厳密に止まる
  // (見つめている正面で滑って動く、を起こさないためのデッドゾーン)。
  const free=clamp((.55-s.watch)/.55,0,1);
  const move=free*free;
  s.depth+=dt*s.speed*move;
  s.poseT+=dt*move*.35;                                // ポーズ・頭の向きの変化も、見られていない間だけ(ゆっくり)
  if(s.depth>=1.14)resetStatue(s,true);                // 前景いっぱい→静かに奥へ戻る(描画側でフェード)
}

/* ---------- 描画: ホール ---------- */
function drawHall(){
  // 奥の壁
  const gw=DC.createLinearGradient(0,0,0,horizonY);
  gw.addColorStop(0,'#05060a');gw.addColorStop(1,'#14171f');
  DC.fillStyle=gw;DC.fillRect(0,0,W,horizonY+1);
  // 壁のパネル(奥に吸い込まれる縦線)
  DC.strokeStyle='rgba(190,200,220,.055)';DC.lineWidth=1;
  for(let i=-4;i<=4;i++){
    const x0=W/2+i*W*.11,x1=W/2+i*W*.30;
    DC.beginPath();DC.moveTo(x0,0);DC.lineTo(x1,horizonY);DC.stroke();
  }
  DC.strokeStyle='rgba(190,200,220,.07)';
  DC.beginPath();DC.moveTo(0,horizonY*.55);DC.lineTo(W,horizonY*.55);DC.stroke();
  // 遠くの明かり(ホールの奥の小さなランプ2つ)
  for(const fx of [.36,.64]){
    const lx=W*fx,ly=horizonY*.60;
    const gl=DC.createRadialGradient(lx,ly,0,lx,ly,U*.05);
    gl.addColorStop(0,'rgba(255,214,150,.30)');gl.addColorStop(1,'rgba(255,214,150,0)');
    DC.fillStyle=gl;DC.fillRect(lx-U*.05,ly-U*.05,U*.1,U*.1);
    DC.fillStyle='rgba(255,224,170,.75)';
    DC.beginPath();DC.arc(lx,ly,Math.max(1.2,U*.004),0,6.2832);DC.fill();
  }
  // 床(遠近のタイル)
  const gf=DC.createLinearGradient(0,horizonY,0,H);
  gf.addColorStop(0,'#101218');gf.addColorStop(1,'#1d2027');
  DC.fillStyle=gf;DC.fillRect(0,horizonY,W,H-horizonY);
  DC.strokeStyle='rgba(200,210,230,.10)';
  for(let i=-5;i<=5;i++){
    DC.beginPath();DC.moveTo(W/2+i*W*.045,horizonY);DC.lineTo(W/2+i*W*.30,H);DC.stroke();
  }
  for(let i=1;i<=6;i++){
    const y=horizonY+(H-horizonY)*Math.pow(i/6,1.8);
    DC.strokeStyle='rgba(200,210,230,'+(0.04+i*0.012)+')';
    DC.beginPath();DC.moveTo(0,y);DC.lineTo(W,y);DC.stroke();
  }
  // 視線の光(壁と床の上に薄く)
  const gg=DC.createRadialGradient(gaze.x,gaze.y,0,gaze.x,gaze.y,R);
  gg.addColorStop(0,'rgba(255,240,205,.16)');gg.addColorStop(1,'rgba(255,240,205,0)');
  DC.fillStyle=gg;DC.fillRect(gaze.x-R,gaze.y-R,R*2,R*2);
}

/* ---------- 描画: 石像(第2版・画質改修) ----------
   「描き込む」のではなく「シルエット+空気感」で見せる。石像の形はベジェで作る彫刻的な
   ローブ/ドレープのシルエット(単位空間: 足元中心=原点、上方向マイナス、高さ1000)を
   Path2D として事前に構築して使い回す(毎フレームのパス構築はしない)。
   ※当初はオフスクリーンへ焼いたスプライト方式で実装したが、ヘッドレス実測で drawImage の
     重ね描きが重く約60fps要件を満たせなかった(28→43fps)。パス塗り方式(第1版が60fpsを
     出した方式)に切り替えたら要件を満たしたため、こちらを採用。絵の設計は同じ。
   層: base(ほぼ真っ黒) → lit(大理石グラデ+脈テクスチャ+ひだ/たすき/髪+輪郭のリムライト)
       → fog(遠い石像だけ霧色を重ねる)。顔(目・鼻の影)だけ headTurn 連動で毎フレーム描く。
   headTurn(0..1): 横向き気味→正面。reach(0..1): 腕が前に出る量。どちらも poseT 由来で第1版と同じ式。
   体(body: 台座+ローブ+首+頭)は全ポーズ共通、腕だけポーズ別の Path2D。 */
const veinTile=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  for(let i=0;i<46;i++){const x=Math.random()*512,y=Math.random()*512,r=20+Math.random()*70;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(118,116,124,'+(0.04+Math.random()*0.05)+')');gr.addColorStop(1,'rgba(118,116,124,0)');
    g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
  g.lineCap='round';
  for(let i=0;i<26;i++){let x=Math.random()*512,y=Math.random()*512;
    g.strokeStyle='rgba(88,86,98,'+(0.05+Math.random()*0.09)+')';g.lineWidth=.6+Math.random()*1.4;
    g.beginPath();g.moveTo(x,y);const n=4+(Math.random()*5|0);
    for(let j=0;j<n;j++){x+=(Math.random()-.5)*90;y+=Math.random()*70-20;g.lineTo(x,y)}g.stroke()}
  return c})();
const bodyPath=(()=>{const p=new Path2D();
  p.ellipse(0,-16,218,17,0,0,6.2832);                                   // 台座(円盤)
  p.rect(-200,-42,400,28);
  p.moveTo(-238,-44);                                                  // ローブ(ドレープの裾広がり)
  p.bezierCurveTo(-206,-330,-154,-580,-120,-784);
  p.quadraticCurveTo(0,-822,120,-784);
  p.bezierCurveTo(154,-580,206,-330,238,-44);
  p.quadraticCurveTo(0,-14,-238,-44);
  p.closePath();
  p.rect(-27,-844,54,54);                                              // 首
  p.ellipse(0,-904,55,67,0,0,6.2832);                                  // 頭
  return p})();
const ARM_POSES=[ // ポーズ別: [肩,肘,手]×左右(単位空間)
  [[[112,-768],[214,-640],[186,-890]],[[-112,-768],[-178,-548],[-150,-345]]],   // 0: 右手を上げる
  [[[112,-768],[205,-590],[248,-478]],[[-112,-768],[-205,-590],[-248,-478]]],   // 1: 両腕を前へ
  [[[112,-768],[182,-598],[-58,-662]],[[-112,-768],[-182,-584],[58,-638]]],     // 2: 胸で組む
  [[[112,-768],[202,-598],[40,-836]],[[-112,-768],[-202,-566],[-42,-468]]]      // 3: 右手をあごへ
];
const armPaths=ARM_POSES.map(P=>{const p=new Path2D();
  for(const a of P){p.moveTo(a[0][0],a[0][1]);p.lineTo(a[1][0],a[1][1]);p.lineTo(a[2][0],a[2][1])}
  return p});
const armBasePaths=ARM_POSES.map(P=>{const p=new Path2D();
  for(const a of P)p.ellipse(a[0][0],a[0][1],34,34,0,0,6.2832);        // 肩の付け根
  return p});

/* 石像を層で描く(単位空間へ変換してから Path2D を塗る。本体・反射で共用)。
   full=false のときは反射用にテクスチャ/リム/ひだ/顔/fog を省略する */
function paintStatue(g,s,alphaMul,lit,full){
  const u=s.ph/1000;
  g.save();g.translate(s.px,s.py);g.scale(u,u);
  // base: ほぼ真っ黒なシルエット
  const bg=g.createLinearGradient(0,-1000,0,0);
  bg.addColorStop(0,'#181b23');bg.addColorStop(.6,'#0c0e13');bg.addColorStop(1,'#05060a');
  g.globalAlpha=alphaMul;g.fillStyle=bg;g.fill(bodyPath);
  g.strokeStyle=bg;g.lineWidth=60;g.lineCap='round';g.lineJoin='round';g.stroke(armPaths[s.pose]);
  g.fill(armBasePaths[s.pose]);
  // lit: 大理石
  if(lit>.01){
    const mg=g.createLinearGradient(-260,0,260,0);
    mg.addColorStop(0,'#5d5b55');mg.addColorStop(.30,'#b3ac9c');mg.addColorStop(.5,'#ece4d0');
    mg.addColorStop(.72,'#c2bba8');mg.addColorStop(1,'#66645e');
    g.globalAlpha=alphaMul*lit;
    g.strokeStyle='rgba(255,237,184,.7)';g.lineWidth=67;g.stroke(armPaths[s.pose]);   // 腕のリム(太く先に敷く)
    g.fillStyle=mg;g.fill(bodyPath);
    g.strokeStyle=mg;g.lineWidth=56;g.stroke(armPaths[s.pose]);g.fill(armBasePaths[s.pose]);
    if(full){
      g.save();g.clip(bodyPath);
      g.globalAlpha=alphaMul*lit*.8;g.drawImage(veinTile,-340,-1040,680,1040);        // 大理石の脈
      g.globalAlpha=alphaMul*lit;
      const sh=g.createLinearGradient(0,-1020,0,0);
      sh.addColorStop(0,'rgba(255,255,255,.12)');sh.addColorStop(.55,'rgba(20,20,28,0)');sh.addColorStop(1,'rgba(12,12,20,.42)');
      g.fillStyle=sh;g.fillRect(-340,-1040,680,1040);
      g.strokeStyle='rgba(255,237,184,.6)';g.lineWidth=13;g.stroke(bodyPath);          // 輪郭のリムライト(クリップ内側)
      g.restore();
      g.strokeStyle='rgba(74,72,84,.20)';g.lineWidth=7;                                // ドレープのひだ
      for(const fx of [-150,-52,58,158]){g.beginPath();g.moveTo(fx*.82,-520);g.quadraticCurveTo(fx*1.04,-300,fx,-70);g.stroke()}
      g.fillStyle='rgba(70,68,80,.16)';                                                // たすき
      g.beginPath();g.moveTo(-118,-786);g.lineTo(-16,-786);g.lineTo(150,-428);g.lineTo(58,-402);g.closePath();g.fill();
      g.strokeStyle='rgba(74,72,84,.4)';g.lineWidth=11;                                // 髪(頭頂の弧)
      g.beginPath();g.arc(0,-916,58,Math.PI*1.05,Math.PI*1.95);g.stroke();
      g.fillStyle='rgba(20,20,28,.28)';g.fillRect(-205,-44,410,30);          // 台座の影(接地感)
    }
  }
  // fog: 遠い石像は霧で薄く
  if(full){
    const fogA=clamp((.45-s.depth)/.45,0,1)*.5;
    if(fogA>.01){
      g.globalAlpha=fogA*alphaMul;g.fillStyle='#2b3345';g.fill(bodyPath);
      g.strokeStyle='#2b3345';g.lineWidth=60;g.stroke(armPaths[s.pose]);g.fill(armBasePaths[s.pose]);
    }
    // 顔: 正面を向くほど両目が見える。横向き気味の間は鼻の影が片側へ寄る(第1版と同じ読み方)
    if(lit>.02){
      const headTurn=clamp(.20+s.poseT*.09,0,1);
      const eyeY=-908,eyeDx=36*headTurn,noseX=(1-headTurn)*33;
      g.fillStyle='rgba(18,19,26,'+((0.14+0.38*headTurn)*lit*alphaMul)+')';
      if(headTurn>.35){
        for(const sx of [-1,1]){g.beginPath();g.ellipse(sx*eyeDx,eyeY,9,7,0,0,6.2832);g.fill()}
      }else{
        g.beginPath();g.ellipse(eyeDx*.4,eyeY,9,7,0,0,6.2832);g.fill();
      }
      g.strokeStyle='rgba(18,19,26,'+(0.30*lit*alphaMul)+')';g.lineWidth=5;
      g.beginPath();g.moveTo(noseX,eyeY+5);g.lineTo(noseX+7,eyeY+28);g.stroke();
    }
  }
  g.restore();g.globalAlpha=1;
}
function drawStatue(s){
  let alpha=1;
  if(s.depth>1)alpha=clamp(1-(s.depth-1)/.14,0,1);     // 前景いっぱい→フェードアウト
  if(alpha<=0)return;
  const w=s.ph*.36;
  // 接触影(ぼけた楕円)
  const sh=DC.createRadialGradient(0,0,0,0,0,w*.78);
  sh.addColorStop(0,'rgba(0,0,0,.55)');sh.addColorStop(1,'rgba(0,0,0,0)');
  DC.save();DC.translate(s.px,s.py);DC.scale(1,.30);DC.globalAlpha=alpha;
  DC.fillStyle=sh;DC.beginPath();DC.arc(0,0,w*.78,0,6.2832);DC.fill();DC.restore();
  // 腕の reach は肩を軸にした回転として全体へ(わずかな傾き+前進感)
  paintStatue(DC,s,alpha,.16+.84*s.lit,true);
  // 照らされた石像の足元の光だまり
  if(s.lit>.03){
    const gl=DC.createRadialGradient(s.px,s.py,0,s.px,s.py,w*1.15);
    gl.addColorStop(0,'rgba(255,240,205,'+(0.20*s.lit*alpha)+')');gl.addColorStop(1,'rgba(255,240,205,0)');
    DC.fillStyle=gl;DC.fillRect(s.px-w*1.15,s.py-w*1.15,w*2.3,w*2.3);
  }
}

/* ---------- 空気感: 埃・霧・グレイン ---------- */
const dust=[];for(let i=0;i<54;i++)dust.push({u:Math.random(),v:Math.random(),s:Math.random()*6.28,r:.7+Math.random()*1.3});
const grainC=document.createElement('canvas');grainC.width=grainC.height=256;
{const gg=grainC.getContext('2d');const id=gg.createImageData(256,256);
 for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=16}
 gg.putImageData(id,0,0)}
document.getElementById('grain').style.backgroundImage='url('+grainC.toDataURL()+')';

/* ---------- フレーム ---------- */
let prevT=now();
function frame(){
  const t=now();let dt=Math.min(.05,t-prevT);prevT=t;
  if(mode!=='camera'&&t-lastPointer>5){
    gazeT.x=W*(.5+.40*Math.sin(t*.17));
    gazeT.y=H*(.46+.28*Math.sin(t*.131+1.1));
  }
  const k=1-Math.exp(-dt*7);
  gaze.x+=(gazeT.x-gaze.x)*k;gaze.y+=(gazeT.y-gaze.y)*k;
  detectGaze();
  for(const s of statues)updateStatue(s,dt);
  DC=sceneCtx;
  drawHall();
  const order=statues.slice().sort((a,b)=>a.depth-b.depth);
  // 床の反射(石像を足元で反転して薄く描き、床の霧グラデで下ほど消す。パス描画なので毎フレームでも軽い)
  for(const s of order){
    if(s.depth<.18)continue;
    const fa=s.depth>1?clamp(1-(s.depth-1)/.14,0,1):1;
    sceneCtx.save();sceneCtx.translate(0,2*s.py);sceneCtx.scale(1,-.55);
    paintStatue(sceneCtx,s,.13*fa,(.16+.84*s.lit)*.7,false);
    sceneCtx.restore();
  }
  const fh=sceneCtx.createLinearGradient(0,horizonY,0,H);
  fh.addColorStop(0,'rgba(13,15,20,0)');fh.addColorStop(1,'rgba(13,15,20,.45)');
  sceneCtx.fillStyle=fh;sceneCtx.fillRect(0,horizonY,W,H-horizonY);
  for(const s of order)drawStatue(s);
  DC=ctx;
  ctx.drawImage(sceneC,0,0,W,H);
  // 視線スポットライト(体積光っぽい柔らかい光のプールを重ねる)
  const sg=ctx.createRadialGradient(gaze.x,gaze.y,0,gaze.x,gaze.y,R*1.1);
  sg.addColorStop(0,'rgba(255,240,205,.12)');sg.addColorStop(.6,'rgba(255,240,205,.05)');sg.addColorStop(1,'rgba(255,240,205,0)');
  ctx.fillStyle=sg;ctx.fillRect(gaze.x-R*1.1,gaze.y-R*1.1,R*2.2,R*2.2);
  // 漂う埃(光の中だけで見える)
  ctx.fillStyle='#ffeec4';
  for(const p of dust){
    const x=p.u*W+Math.sin(t*.07+p.s)*14,y=p.v*H+Math.cos(t*.055+p.s*1.7)*10;
    const d=Math.hypot(x-gaze.x,y-gaze.y);
    if(d>=R)continue;
    ctx.globalAlpha=(1-d/R)*.45;
    ctx.beginPath();ctx.arc(x,y,p.r,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 霧の帯(ゆっくり漂う)
  for(let i=0;i<2;i++){
    const by=H*(i===0?.40:.62)+Math.sin(t*.05+i*2.1)*6,bh=H*(i===0?.10:.14);
    const fb=ctx.createLinearGradient(0,by,0,by+bh);
    fb.addColorStop(0,'rgba(168,182,205,0)');fb.addColorStop(.5,'rgba(168,182,205,'+(i===0?.05:.035)+')');fb.addColorStop(1,'rgba(168,182,205,0)');
    ctx.fillStyle=fb;ctx.fillRect(0,by,W,bh);
  }
  // フィルムグレインとビネットは CSS オーバーレイ(#grain / #vig)が担う(キャンバス描画を増やさない)
  requestAnimationFrame(frame);
}

/* ---------- 指・マウス(視線の代わり) ---------- */
function pointerGaze(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  gazeT.x=e.clientX;gazeT.y=e.clientY;lastPointer=now();
  if(mode!=='camera')mode='pointer';
  hint.classList.add('off');
}
canvas.addEventListener('pointermove',pointerGaze,{passive:true});
canvas.addEventListener('pointerdown',pointerGaze,{passive:true});

/* ---------- カメラ+視線推定(MediaPipe Face Landmarker、CDNから遅延読み込み。GAZE GARDENから再利用) ---------- */
const MP_VER='0.10.14';
const MP_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MP_VER+'/vision_bundle.mjs';
const WASM_URL='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@'+MP_VER+'/wasm';
const MODEL_URL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
let landmarker=null,camStream=null,lastVideoTime=-1,lastDetectMs=0;
let tipTimer=0;
function tip(msg,sec){
  tipEl.textContent=msg;tipEl.classList.add('on');
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>tipEl.classList.remove('on'),(sec||4)*1000);
}
async function makeLandmarker(vision,delegate){
  const fileset=await vision.FilesetResolver.forVisionTasks(WASM_URL);
  return await vision.FaceLandmarker.createFromOptions(fileset,{
    baseOptions:{modelAssetPath:MODEL_URL,delegate:delegate},
    runningMode:'VIDEO',numFaces:1,
    minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5
  });
}
async function startCamera(){
  if(camState==='on'){stopCamera();return}
  if(camState==='starting')return;
  camState='starting';
  tip('カメラと顔の読み取りを準備中…',6);
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no getUserMedia');
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=camStream;await video.play();
    if(!landmarker){
      const vision=await import(MP_URL);
      try{landmarker=await makeLandmarker(vision,'GPU')}
      catch(e){landmarker=await makeLandmarker(vision,'CPU')}
    }
    camState='on';mode='camera';lastFace=now();
    hint.classList.add('off');
    tip('カメラで視線を追っています。石像を見つめてみて',4);
  }catch(e){
    camState='off';mode='auto';stopStream();
    tip('カメラは使えませんでした。指でなぞると、そこが視線の代わりになります',6);
  }
}
function stopStream(){
  if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null}
  video.srcObject=null;
}
function stopCamera(){
  camState='off';mode='auto';lastPointer=-10;stopStream();
  tip('カメラを止めました。指でも動かせます',3);
}
function detectGaze(){
  if(camState!=='on'||!landmarker||video.readyState<2)return;
  const ms=performance.now();
  if(ms-lastDetectMs<50||video.currentTime===lastVideoTime)return;   // 推定は間引く(負荷対策)
  lastDetectMs=ms;lastVideoTime=video.currentTime;
  let res;
  try{res=landmarker.detectForVideo(video,ms)}catch(e){return}
  if(!res||!res.faceLandmarks||!res.faceLandmarks.length)return;
  const lm=res.faceLandmarks[0];
  // まばたき中(目がほぼ閉じている)コマは捨てる
  const openR=lm[145].y-lm[159].y,openL=lm[374].y-lm[386].y;
  if(openR<.006&&openL<.006)return;
  lastFace=now();
  // 虹彩の位置: 目の両端を基準にした割合(頭が傾いてもぶれにくい)
  const ratio=(p,a,b)=>(p-a)/((b-a)||1e-6);
  const h=(ratio(lm[468].x,lm[33].x,lm[133].x)+ratio(lm[473].x,lm[362].x,lm[263].x))/2;
  const v=(ratio(lm[468].y,lm[159].y,lm[145].y)+ratio(lm[473].y,lm[386].y,lm[374].y))/2;
  // 顔の向き: 鼻先が顔の枠の中心からどれだけずれているか
  const yaw=ratio(lm[1].x,lm[234].x,lm[454].x)*2-1;
  const pitch=ratio(lm[1].y,lm[10].y,lm[152].y)*2-1;
  const rawX=.5+(h-.5)*2.6+yaw*.28;
  const rawY=.5+(v-.5)*1.7+pitch*.45;
  gazeT.x=(1-clamp(rawX,0,1))*W;          // 自撮り視点: 左右は鏡像になる
  gazeT.y=clamp(rawY,0,1)*H;
}

/* ---------- テスト用フック(検証スクリプトから状態を読むため) ---------- */
window.__UW={gaze:gaze,gazeT:gazeT,
  get statues(){return statues},
  setGaze:function(x,y){gaze.x=gazeT.x=x;gaze.y=gazeT.y=y;lastPointer=now()+1e9;mode='pointer'},
  arrange:arrange};

/* ---------- ap-kit(必須オプション一式。loopFrameは渡さない) ---------- */
setTimeout(()=>hint.classList.add('off'),11000);
APKit.init({canvas:canvas,gifName:'unwatched-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,buttons:[
  {label:'✦',name:'mutate',onClick:()=>{arrange((Math.random()*1e9)|0);hint.classList.add('off')}},
  {label:'↻',name:'reset',onClick:()=>{arrange(FIRST_SEED)}},
  {label:'👁',name:'camera',toggle:true,onClick:()=>{startCamera()}}
]});
requestAnimationFrame(frame);
</script>
