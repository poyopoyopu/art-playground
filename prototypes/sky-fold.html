<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d8ee}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/*
 SKY FOLD
 元ネタのGLSL式をそのまま「雲っぽいフラクタル」として再構成。
 以前の雲シミュレーションではなく、自己相似なfold + ray accumulationが本体。
*/
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;

vec3 hsv2rgb(vec3 c){
  vec3 p=abs(fract(c.xxx+vec3(0.0,0.6666667,0.3333333))*6.0-3.0);
  return c.z*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),c.y);
}

mat3 rotate3D(float a,vec3 axis){
  axis=normalize(axis);
  float s=sin(a),c=cos(a),oc=1.0-c;
  return mat3(
    oc*axis.x*axis.x+c,       oc*axis.x*axis.y-axis.z*s, oc*axis.z*axis.x+axis.y*s,
    oc*axis.x*axis.y+axis.z*s,oc*axis.y*axis.y+c,       oc*axis.y*axis.z-axis.x*s,
    oc*axis.z*axis.x-axis.y*s,oc*axis.y*axis.z+axis.x*s,oc*axis.z*axis.z+c
  );
}

vec2 applyTouch(vec2 p){
  for(int j=0;j<6;j++){
    if(j>=lawCount)break;
    vec2 v=p-law[j].xy;
    float d=dot(v,v)+0.03;
    float w=law[j].z/d;
    float a=law[j].w+time*.04;
    vec2 rv=vec2(cos(a)*v.x-sin(a)*v.y,sin(a)*v.x+cos(a)*v.y);
    p+=rv*clamp(w,0.0,2.0)*0.012*bend;
  }
  return p;
}

void main(){
  vec2 FC=gl_FragCoord.xy;
  vec2 r=res;
  vec2 uv=(FC-.5*r)/r.y;

  /* 元コードの 99 x 19 fold。iPhoneでは品質を落として負荷を制御。 */
  const int OUTER=72;
  const int INNER=15;

  float g=0.0;
  float e=1.0;
  float s=2.0;
  vec3 col=vec3(0.0);

  vec2 tp=applyTouch(uv*1.05);

  for(int oi=0;oi<OUTER;oi++){
    float i=float(oi)+1.0;

    vec3 p=vec3(tp*5.0+vec2(0.0,9.0),g);

    float ang=-1.1-cos(time*.15)*.1;
    p=rotate3D(ang,vec3(1.0,11.0+sin(time)*.15,-1.5))*p;

    s=2.0;
    e=1.0;

    for(int j=0;j<INNER;j++){
      p=vec3(.08,4.0,-1.0)-abs(abs(p)*e-vec3(3.0,4.0,3.0));
      float de=dot(p,p*.51);
      e=7.1/max(de,0.001);
      s*=e;
    }

    g+=p.y/max(s,0.0001);
    s=log2(max(s,0.0001))/exp(clamp(e,-8.0,8.0));

    /* 元コードの暖色HSVを、空と雲の白〜青に少し広げる。 */
    vec3 c=hsv2rgb(vec3(.10,g*.016-e*.30,max(s/200.0,0.0)));

    /* 参考画像の白い雲を中心にするため、青白い霧を混ぜる。 */
    c=mix(c,vec3(.86,.94,1.0),.32);
    col+=.014+c*.010;

    /* 触った場所ほど局所的に明るいfoldを出す。 */
    if(lawCount>0){
      float glow=0.0;
      for(int j=0;j<6;j++){
        if(j>=lawCount)break;
        glow+=exp(-dot(uv-law[j].xy,uv-law[j].xy)*12.0);
      }
      col+=vec3(.025,.035,.045)*glow*depth*.15;
    }
  }

  /* 空気遠近：上は青、雲の明部は白。 */
  float skyMix=smoothstep(-.45,.85,uv.y);
  col=mix(vec3(.86,.93,.98),vec3(.35,.63,.86),skyMix*.58);
  col+=vec3(1.0,.82,.60)*exp(-dot(uv-vec2(.48,-.42),uv-vec2(.48,-.42))*7.0)*.11;

  /* fractal accumulationを空に重ねる。 */
  float luminance=length(col);
  vec3 cloud=col;
  cloud=mix(cloud,vec3(.94,.97,1.0),smoothstep(.12,.55,luminance));
  col=mix(vec3(.55,.72,.87),cloud,clamp(luminance*.95,0.0,1.0));

  col=pow(max(col,0.0),vec3(.92));
  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100,bend=1,depth=0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*.5)/s,(H*.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.25,q[1]*1.25,.55+Math.random()*.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.2,bend+.12);
  depth=Math.min(3,depth+.2);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*.22)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){seed=Math.random()*100;bend=.75+Math.random()*1.1;depth=Math.random()*.8;}},
    {label:'↻',name:'reset',onClick:function(){laws=[];bend=1;depth=0;seed=Math.random()*100;}}
  ]
});
</script>
</body>
</html>
