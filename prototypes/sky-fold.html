<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';

/*
 SKY FOLD — ChatGPT作。
 Yohei Nishitsuji氏の投稿GLSLを基準にWebGL2へ移植。
 99回の外側ループ、19回のfold、eの継承、row-vector型rotate3D、
 twigl互換hsv、元の色蓄積式を維持する。
*/

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;

out vec4 O;

uniform vec2 r;
uniform float t;
uniform vec2 mouse;

vec3 hsv(float h,float s,float v){
  vec4 k=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
  vec3 p=abs(fract(vec3(h)+k.xyz)*6.0-k.www);
  return v*mix(k.xxx,clamp(p-k.xxx,0.0,1.0),s);
}

mat3 rotate3D(float angle,vec3 axis){
  vec3 a=normalize(axis);
  float s=sin(angle),c=cos(angle),q=1.0-c;
  return mat3(
    a.x*a.x*q+c, a.y*a.x*q+a.z*s, a.z*a.x*q-a.y*s,
    a.x*a.y*q-a.z*s, a.y*a.y*q+c, a.z*a.y*q+a.x*s,
    a.x*a.z*q+a.y*s, a.y*a.z*q-a.x*s, a.z*a.z*q+c
  );
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
  p-=mouse;

  vec3 o=vec3(0.0);
  float g=0.0;
  float e=0.0;
  float s=0.0;

  for(int i=0;i<99;++i){
    vec3 q=vec3(p*5.0+vec2(0.0,9.0),g)
      *rotate3D(-1.1-cos(t*.15)*.1,
                vec3(1.0,11.0+sin(t)*.15,-1.5));

    s=2.0;

    for(int j=0;j<19;++j){
      q=vec3(.08,4.0,-1.0)-abs(abs(q)*e-vec3(3.0,4.0,3.0));
      s*=e=7.1/dot(q,q*.51);
    }

    g+=q.y/s;
    s=log2(s)/exp(e);
    o+=.01-hsv(.1,g*.016-e*.3,s/2e2);
  }

  O=vec4(o,1.0);
}
`;

function compile(type,src){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,src);
  gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(shader)||'shader compile failed');
  }
  return shader;
}

const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
  throw new Error(gl.getProgramInfoLog(program)||'program link failed');
}

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let phaseOffset=0;
let mouseX=0,mouseY=0;
let hasPointer=false;
let paused=false;

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,.5);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);
resize();

function setMouse(x,y){
  const s=Math.min(W,H);
  mouseX=(x-W*.5)/s;
  mouseY=(H*.5-y)/s;
  hasPointer=true;
}

function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform1f(U.t,phase+phaseOffset);
  gl.uniform2f(U.mouse,hasPointer?mouseX:0,hasPointer?mouseY:0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  setMouse(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(e.buttons)setMouse(e.clientX,e.clientY);
});

canvas.addEventListener('pointerup',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  hasPointer=false;
});

let last=performance.now();
let phase=0;

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  if(!paused){
    phase=(phase+dt*.30)%(Math.PI*2);
    draw(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,
  gifName:'sky-fold-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){
    paused=true;
    draw(ph);
  },
  onExportEnd:function(){
    paused=false;
    last=performance.now();
  },
  buttons:[
    {
      label:'✦',
      name:'mutate',
      onClick:function(){
        phaseOffset=Math.random()*Math.PI*2;
        hasPointer=false;
      }
    },
    {
      label:'↻',
      name:'reset',
      onClick:function(){
        phaseOffset=0;
        mouseX=0;
        mouseY=0;
        hasPointer=false;
      }
    }
  ]
});
</script>
</body>
</html>
