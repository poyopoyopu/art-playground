<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78aee0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/* SKY FOLD — 雲塊のメタボールではなく、空間を満たす雲の「体積」を描く軽量ボリューム版。 */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;

float hash(vec2 p){
  return fract(sin(dot(p,vec2(127.1,311.7))+seed*19.17)*43758.5453);
}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0));
  float c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0;
  v+=noise(p)*0.56;
  p=p*2.03+vec2(17.3,9.1);v+=noise(p)*0.28;
  p=p*2.02+vec2(-8.2,13.7);v+=noise(p)*0.11;
  p=p*2.01+vec2(5.4,-6.2);v+=noise(p)*0.05;
  return v;
}

vec2 lawWarp(vec2 p){
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    vec2 v=p-law[i].xy;
    float r2=dot(v,v);
    float w=law[i].z/(0.055+r2);
    float ca=cos(law[i].w),sa=sin(law[i].w);
    vec2 rv=vec2(ca*v.x-sa*v.y,sa*v.x+ca*v.y);
    p+=rv*clamp(w,0.0,2.5)*0.028*bend;
  }
  return p;
}

/* 空中の一地点における雲密度。水平の大きな塊＋細部＋高さで体積を作る。 */
float density(vec3 p,float t){
  vec2 xz=lawWarp(p.xz);

  float drift=t*.035;
  vec2 q=xz*0.72+vec2(drift,-drift*.35);
  float large=fbm(q);

  vec2 detailPos=xz*1.72+vec2(-drift*1.8,drift*.8)+large*0.32;
  float detail=fbm(detailPos);

  vec2 finePos=xz*3.7+vec2(drift*.8,-drift*1.4);
  float fine=noise(finePos);

  /* 雲の床と天井。中央に厚みを持つ。 */
  float base=0.02+0.28*fbm(xz*.33+vec2(2.0,-1.0));
  float top=0.95+0.26*fbm(xz*.42+vec2(-4.0,2.0));
  float h=smoothstep(base,base+.25,p.y)*smoothstep(top,top-.34,p.y);

  /* ふくらみ。 */
  float body=smoothstep(.38,.67,large*.66+detail*.34);
  float detailCut=smoothstep(.30,.72,detail*.72+fine*.28);
  float d=body*mix(.62,1.0,detailCut)*h;

  /* 上空の薄い雲を少量。 */
  float high=smoothstep(1.0,.58,p.y)*smoothstep(.58,1.55,p.y);
  float cir=fbm(xz*.48+vec2(6.0,2.0)+t*.008);
  d+=smoothstep(.57,.78,cir)*high*.12;

  return clamp(d,0.0,1.0);
}

vec3 sky(vec2 uv){
  float h=clamp(uv.y*.5+.5,0.0,1.0);
  vec3 horizon=vec3(.92,.96,.985);
  vec3 mid=vec3(.43,.69,.90);
  vec3 zenith=vec3(.20,.43,.72);
  vec3 c=mix(horizon,mid,smoothstep(.0,.56,h));
  c=mix(c,zenith,smoothstep(.50,1.0,h));

  vec2 sun=vec2(.52,-.40);
  float sd=length(uv-sun);
  c+=vec3(1.0,.83,.57)*exp(-sd*sd*8.0)*.28;
  c+=vec3(1.0,.95,.82)*exp(-sd*sd*1.65)*.075;
  return c;
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;

  /* 空を見上げるカメラ。 */
  vec3 ro=vec3(0.0,-.08,-2.9);
  vec3 rd=normalize(vec3(uv.x*.86,uv.y*.72+.18,1.35));

  float driftYaw=.055*sin(time*.07);
  float cs=cos(driftYaw),sn=sin(driftYaw);
  ro.xz=mat2(cs,-sn,sn,cs)*ro.xz;
  rd.xz=mat2(cs,-sn,sn,cs)*rd.xz;

  vec3 col=sky(uv);

  float alpha=0.0;
  vec3 cloudColor=vec3(0.0);
  float z=0.10;

  /* 体積を前から後ろへ。レイマーチは28回に抑えてiPhoneでも動かす。 */
  for(int i=0;i<28;i++){
    vec3 p=ro+rd*z;

    /* 雲層を画面中央〜遠景へ広げる。 */
    p.y*=1.05;
    float d=density(p,time);

    /* 太陽は右下。上面ほど光を受ける。 */
    float heightLight=smoothstep(-.05,.72,p.y);
    float edge=1.0-smoothstep(.15,.72,d);
    float light=.42+.46*heightLight+.24*edge;

    vec3 shadow=vec3(.20,.34,.49);
    vec3 body=vec3(.68,.79,.88);
    vec3 bright=vec3(.98,.99,.985);
    vec3 warm=vec3(1.0,.88,.70);

    vec3 lit=mix(shadow,body,smoothstep(.08,.48,light));
    lit=mix(lit,bright,smoothstep(.48,.88,light));
    lit=mix(lit,warm,.16*smoothstep(.15,.95,heightLight));

    float a=d*.075;
    cloudColor+=lit*a*(1.0-alpha);
    alpha+=a*(1.0-alpha);

    z+=.105;
    if(alpha>.985)break;
  }

  col=mix(col,cloudColor,clamp(alpha,0.0,1.0));

  /* 遠くの雲海と薄い光。 */
  float horizon=exp(-pow((uv.y+.22)*4.2,2.0));
  col=mix(col,vec3(.82,.90,.96),horizon*.10*(1.0-alpha));

  /* タッチした場所は雲の流れを曲げる。 */
  float touch=0.0;
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    touch+=exp(-dot(uv-law[i].xy,uv-law[i].xy)*8.0);
  }
  col=mix(col,vec3(.95,.98,1.0),clamp(touch*.025*depth,0.0,.10));

  col*=1.0-.055*length(uv*.38);
  col=pow(max(col,0.0),vec3(.94));
  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100.0,bend=1.0,depth=0.0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*.5)/s,(H*.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.45,q[1]*1.45,.55+Math.random()*.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.2,bend+.12);
  depth=Math.min(3.0,depth+.2);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*.20)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*100.;bend=.75+Math.random()*1.1;depth=Math.random()*.8;
    }},
    {label:'↻',name:'reset',onClick:function(){
      laws=[];bend=1.;depth=0.;seed=Math.random()*100.;
    }}
  ]
});
</script>
</body>
</html>
