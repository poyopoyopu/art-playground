<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cbe9}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/* SKY FOLD — ChatGPT作。雲海を軽量な多層ボリューム風シェーダーで描き、触れた場所で雲の流れの法則が変わる。 */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;

float hash2(vec2 p){
  p+=seed*0.013;
  return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);
}
float noise2(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash2(i),b=hash2(i+vec2(1.0,0.0));
  float c=hash2(i+vec2(0.0,1.0)),d=hash2(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.55;
  for(int i=0;i<4;i++){
    v+=noise2(p)*a;
    p=p*2.02+vec2(17.3,9.1);
    a*=0.5;
  }
  return v;
}
float cloud(vec2 p,float scale,float drift){
  vec2 q=p*scale+vec2(time*drift,-time*drift*0.22);
  float n=fbm(q);
  float detail=fbm(q*1.85+vec2(4.7,-2.3));
  float body=smoothstep(0.34,0.67,n*0.72+detail*0.28);
  return pow(body,1.12);
}

vec2 touchWarp(vec2 p){
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    vec2 v=p-law[i].xy;
    float r2=dot(v,v);
    float w=law[i].z/(0.035+r2);
    float ca=cos(law[i].w),sa=sin(law[i].w);
    vec2 rv=vec2(ca*v.x-sa*v.y,sa*v.x+ca*v.y);
    p+=rv*clamp(w,0.0,2.2)*0.018*bend;
    p+=vec2(sin(r2*8.0+law[i].w+time*.18),cos(r2*7.0-law[i].w-time*.13))*clamp(w,0.0,1.4)*0.008;
  }
  return p;
}

vec3 sky(vec2 uv){
  float h=clamp(uv.y*0.5+0.5,0.0,1.0);
  vec3 horizon=vec3(0.94,0.97,0.985);
  vec3 blue=vec3(0.50,0.73,0.91);
  vec3 deep=vec3(0.22,0.45,0.72);
  vec3 c=mix(horizon,blue,smoothstep(0.0,0.62,h));
  c=mix(c,deep,smoothstep(0.55,1.0,h));

  vec2 sun=vec2(0.48,-0.38);
  float d=length(uv-sun);
  c+=vec3(1.0,0.84,0.60)*exp(-d*d*9.0)*0.22;
  c+=vec3(1.0,0.94,0.80)*exp(-d*d*2.0)*0.055;
  return c;
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 col=sky(uv);

  /* 触れた場所を雲の座標系そのものへ刻む。 */
  vec2 p=touchWarp(uv*vec2(0.92,1.0));

  /* 遠景：薄い雲海。 */
  float farN=fbm(p*0.72+vec2(time*.006,0.0));
  float farCloud=smoothstep(0.47,0.69,farN);
  farCloud*=smoothstep(-0.72,0.08,uv.y);
  col=mix(col,vec3(0.83,0.90,0.95),farCloud*0.38);

  /* 主役：丸い積雲。複数スケールを重ねて雲の塊を作る。 */
  float c1=cloud(p*vec2(1.0,0.82)+vec2(-.2,.05),1.18,.006);
  float c2=cloud(p*vec2(1.15,0.96)+vec2(2.7,-.7),2.15,-.009);
  float c3=cloud(p*vec2(1.0,0.72)+vec2(-4.0,1.4),3.9,.014);

  float height=smoothstep(-0.92,-0.20,uv.y)*smoothstep(0.92,-0.02,uv.y);
  float cloudField=clamp(c1*.76+c2*.28+c3*.10,0.0,1.0)*height;

  /* 雲の下側を青灰色、上側を太陽で白くする。 */
  float underside=smoothstep(0.72,0.05,uv.y);
  float lightEdge=smoothstep(0.32,0.76,c1+c2*.35);
  vec3 shadow=vec3(0.37,0.51,0.65);
  vec3 white=vec3(0.985,0.99,0.985);
  vec3 warm=vec3(1.0,0.90,0.74);

  vec3 cloudCol=mix(shadow,white,lightEdge);
  cloudCol=mix(cloudCol,warm,0.16*smoothstep(0.0,1.0,uv.x)*smoothstep(-.45,.35,uv.y));
  cloudCol*=0.82+0.18*(1.0-underside);

  col=mix(col,cloudCol,cloudField*0.91);

  /* 上空の薄い巻雲。 */
  float wisps=fbm(vec2(p.x*.55+p.y*.30,p.y*.22-time*.018));
  wisps=smoothstep(.60,.76,wisps)*smoothstep(.02,.78,uv.y)*.18;
  col=mix(col,vec3(.92,.96,.985),wisps);

  /* タッチが増えるほど折りの自己相似性が強くなる。 */
  float lawGlow=0.0;
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    lawGlow+=exp(-dot(p-law[i].xy,p-law[i].xy)*7.0);
  }
  col=mix(col,vec3(0.94,0.98,1.0),clamp(lawGlow*0.035*depth,0.0,.12));

  col*=1.0-0.045*length(uv*.45);
  col=pow(max(col,0.0),vec3(.94));
  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100.0,bend=1.0,depth=0.0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  /* 画面全体を滑らかに描く。前版の0.72倍はブロック状に見えたため撤回。 */
  DPR=1.0;
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*.5)/s,(H*.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.55,q[1]*1.55,.55+Math.random()*.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.2,bend+.12);
  depth=Math.min(3.0,depth+.2);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*.22)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*100.;bend=.75+Math.random()*1.1;depth=Math.random()*.8;
    }},
    {label:'↻',name:'reset',onClick:function(){
      laws=[];bend=1.;depth=0.;seed=Math.random()*100.;
    }}
  ]
});
</script>
</body>
</html>
