<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ec8ec}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/* SKY FOLD — ChatGPT作。丸い雲塊を重ねた軽量メタボール風雲景。 */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;

float hash(float n){return fract(sin(n)*43758.5453123);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i.x+i.y*57.0+seed);
  float b=hash(i.x+1.0+i.y*57.0+seed);
  float c=hash(i.x+(i.y+1.0)*57.0+seed);
  float d=hash(i.x+1.0+(i.y+1.0)*57.0+seed);
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0;
  v+=noise(p)*0.55;
  p=p*2.03+vec2(11.7,4.3);
  v+=noise(p)*0.28;
  p=p*2.01+vec2(5.1,8.7);
  v+=noise(p)*0.12;
  return v;
}

vec2 warp(vec2 p){
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    vec2 v=p-law[i].xy;
    float r2=dot(v,v);
    float w=law[i].z/(0.045+r2);
    float ca=cos(law[i].w),sa=sin(law[i].w);
    vec2 rv=vec2(ca*v.x-sa*v.y,sa*v.x+ca*v.y);
    p+=rv*clamp(w,0.0,2.0)*0.018*bend;
  }
  return p;
}

/* ひとつの雲塊。Gaussianの重なりなので四角いセルが出ない。 */
float puff(vec2 p,vec2 c,vec2 r){
  vec2 q=(p-c)/r;
  float d=dot(q,q);
  return exp(-d*2.15);
}

/* 丸い積雲の集合。位置をずらした大小のpuffを重ねる。 */
float cloudMass(vec2 p,float layer,float drift){
  p.x+=time*drift;
  float m=0.0;

  m+=puff(p,vec2(-1.28,-0.06+layer),vec2(.50,.42));
  m+=puff(p,vec2(-.91,.13+layer),vec2(.43,.55));
  m+=puff(p,vec2(-.54,.02+layer),vec2(.52,.48));
  m+=puff(p,vec2(-.12,.17+layer),vec2(.39,.55));
  m+=puff(p,vec2(.24,.01+layer),vec2(.52,.43));
  m+=puff(p,vec2(.63,.16+layer),vec2(.44,.54));
  m+=puff(p,vec2(1.02,.00+layer),vec2(.53,.44));
  m+=puff(p,vec2(1.38,.13+layer),vec2(.42,.50));

  /* 雲の端だけ少し崩す。 */
  float n=fbm(p*2.5+vec2(layer*4.0,-layer*2.0));
  m*=0.84+0.24*n;
  return m;
}

vec3 sky(vec2 uv){
  float h=clamp(uv.y*.5+.5,0.0,1.0);
  vec3 horizon=vec3(.95,.975,.985);
  vec3 blue=vec3(.52,.75,.93);
  vec3 deep=vec3(.27,.51,.78);
  vec3 c=mix(horizon,blue,smoothstep(0.0,.62,h));
  c=mix(c,deep,smoothstep(.55,1.0,h));

  vec2 sun=vec2(.47,-.34);
  float d=length(uv-sun);
  c+=vec3(1.0,.82,.57)*exp(-d*d*8.0)*.24;
  c+=vec3(1.0,.95,.82)*exp(-d*d*2.1)*.065;
  return c;
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec2 p=warp(uv);

  vec3 col=sky(uv);

  /* 遠くの雲海。薄く、水平に広がる。 */
  float far=cloudMass(p*vec2(.72,.42)+vec2(0.0,-.46),-.12,.004);
  far=smoothstep(1.15,2.25,far);
  far*=smoothstep(-.85,-.05,uv.y);
  col=mix(col,vec3(.80,.89,.96),far*.42);

  /* 主役の雲。丸い塊を2層重ねる。 */
  float upper=cloudMass(p*vec2(.86,.72)+vec2(0.0,.03),.05,.006);
  float lower=cloudMass(p*vec2(1.02,.82)+vec2(.18,-.18),-.14,-.004);

  upper=smoothstep(.58,1.22,upper);
  lower=smoothstep(.48,1.10,lower);
  float clouds=clamp(upper*.76+lower*.42,0.0,1.0);

  /* 雲底の青灰、上面の白、太陽側の暖色。 */
  float topLight=smoothstep(-.30,.48,uv.y);
  float rim=smoothstep(.45,.92,clouds);
  vec3 shadow=vec3(.40,.53,.66);
  vec3 mid=vec3(.78,.87,.93);
  vec3 white=vec3(.985,.99,.985);
  vec3 warm=vec3(1.0,.90,.74);

  vec3 cloudCol=mix(shadow,mid,topLight);
  cloudCol=mix(cloudCol,white,rim*.82);
  cloudCol=mix(cloudCol,warm,.12*smoothstep(.0,1.0,uv.x));

  col=mix(col,cloudCol,clouds*.94);

  /* 雲の輪郭にごく薄い霞を足す。 */
  float haze=smoothstep(.18,.62,clouds)*.09;
  col=mix(col,vec3(.93,.97,.99),haze);

  /* タッチした場所は雲を寄せ、折り畳みを少しずつ深くする。 */
  float lawGlow=0.0;
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    float d=length(p-law[i].xy);
    lawGlow+=exp(-d*d*9.0);
  }
  col=mix(col,vec3(.97,.99,1.0),clamp(lawGlow*.025*depth,0.0,.10));

  col*=1.0-.045*length(uv*.45);
  col=pow(max(col,0.0),vec3(.94));
  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100.0,bend=1.0,depth=0.0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  /* iPhoneの高DPIでCSS 1pxをそのまま拡大すると雲がブロック化する。軽量化済みなので2xまで描く。 */
  DPR=Math.min(devicePixelRatio||1,2.0);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*.5)/s,(H*.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.55,q[1]*1.55,.55+Math.random()*.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.2,bend+.12);
  depth=Math.min(3.0,depth+.2);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*.22)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*100.;bend=.75+Math.random()*1.1;depth=Math.random()*.8;
    }},
    {label:'↻',name:'reset',onClick:function(){
      laws=[];bend=1.;depth=0.;seed=Math.random()*100.;
    }}
  ]
});
</script>
</body>
</html>
