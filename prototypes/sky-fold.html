<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d8ee}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/*
 SKY FOLD
 元ネタのGLSL式をそのまま「雲っぽいフラクタル」として再構成。
 以前の雲シミュレーションではなく、自己相似なfold + ray accumulationが本体。
*/
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS="#version 300 es\nprecision highp float;\nout vec4 O;\nuniform vec2 res;\nuniform float time;\nuniform float bend;\nuniform vec4 law[6];\nuniform int lawCount;\n\nvec3 hsv(float h,float sat,float v){\n  vec4 k=vec4(1.0,2.0/3.0,1.0/3.0,3.0);\n  vec3 p=abs(fract(vec3(h)+k.xyz)*6.0-k.www);\n  return v*mix(k.xxx,clamp(p-k.xxx,0.0,1.0),sat);\n}\n\nmat2 rotate2D(float a){\n  return mat2(cos(a),sin(a),-sin(a),cos(a));\n}\n\nmat3 rotate3D(float angle,vec3 axis){\n  vec3 a=normalize(axis);\n  float s=sin(angle),c=cos(angle),q=1.0-c;\n  return mat3(\n    a.x*a.x*q+c, a.y*a.x*q+a.z*s, a.z*a.x*q-a.y*s,\n    a.x*a.y*q-a.z*s, a.y*a.y*q+c, a.z*a.y*q+a.x*s,\n    a.x*a.z*q+a.y*s, a.y*a.z*q-a.x*s, a.z*a.z*q+c\n  );\n}\n\nvec2 applyTouch(vec2 p){\n  for(int j=0;j<6;j++){\n    if(j>=lawCount)break;\n    vec2 v=p-law[j].xy;\n    float d=dot(v,v)+0.03;\n    float w=law[j].z/d;\n    float a=law[j].w+time*.04;\n    vec2 rv=vec2(cos(a)*v.x-sin(a)*v.y,sin(a)*v.x+cos(a)*v.y);\n    p+=rv*clamp(w,0.0,2.0)*0.012*bend;\n  }\n  return p;\n}\n\nvoid main(){\n  vec2 FC=gl_FragCoord.xy;\n  vec2 r=res;\n  vec2 uv=(FC-.5*r)/r.y;\n  uv=applyTouch(uv);\n\n  // Exact state flow of the reference shader: g/e/s persist across outer iterations.\n  float g=0.0;\n  float e=0.0;\n  float s=0.0;\n  vec3 col=vec3(0.0);\n\n  for(int oi=0;oi<99;oi++){\n    vec3 p=vec3(uv*5.0+vec2(0.0,9.0),g);\n    p=p*rotate3D(-1.1-cos(time*.15)*.1,\n                 vec3(1.0,11.0+sin(time)*.15,-1.5));\n\n    s=2.0;\n\n    for(int j=0;j<19;j++){\n      p=vec3(.08,4.0,-1.0)-abs(abs(p)*e-vec3(3.0,4.0,3.0));\n      e=7.1/dot(p,p*.51);\n      s*=e;\n    }\n\n    g+=p.y/s;\n    s=log2(s)/exp(e);\n    col+=.01-hsv(.1,g*.016-e*.3,s/200.0);\n  }\n\n  O=vec4(col,1.0);\n}\n"

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100,bend=1,depth=0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,.35);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*.5)/s,(H*.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.25,q[1]*1.25,.55+Math.random()*.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.2,bend+.12);
  depth=Math.min(3,depth+.2);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*.30)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){seed=Math.random()*100;bend=.75+Math.random()*1.1;depth=Math.random()*.8;}},
    {label:'↻',name:'reset',onClick:function(){laws=[];bend=1;depth=0;seed=Math.random()*100;}}
  ]
});
</script>
</body>
</html>
