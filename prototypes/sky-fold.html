<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9cbe9}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/* SKY FOLD — ChatGPT作。雲を「塊」として描き、触れた場所で雲の折り方そのものが変わる。 */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}

float hash31(vec3 p){
  p=fract(p*0.3183099+.1);
  p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float noise3(vec3 p){
  vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash31(i+vec3(0,0,0)),n100=hash31(i+vec3(1,0,0));
  float n010=hash31(i+vec3(0,1,0)),n110=hash31(i+vec3(1,1,0));
  float n001=hash31(i+vec3(0,0,1)),n101=hash31(i+vec3(1,0,1));
  float n011=hash31(i+vec3(0,1,1)),n111=hash31(i+vec3(1,1,1));
  float x00=mix(n000,n100,f.x),x10=mix(n010,n110,f.x);
  float x01=mix(n001,n101,f.x),x11=mix(n011,n111,f.x);
  return mix(mix(x00,x10,f.y),mix(x01,x11,f.y),f.z);
}
float fbm(vec3 p){
  float v=0.0,a=0.5;
  for(int i=0;i<4;i++){v+=noise3(p)*a;p=p*2.03+vec3(7.1,3.7,5.9);a*=0.5;}
  return v;
}
float billow(vec3 p){
  float n=fbm(p);
  return 1.0-abs(n*2.0-1.0);
}

/* 雲の主塊。低い雲海→中層の積雲→上空の薄い巻雲を同じ世界に重ねる。 */
float cloudDensity(vec3 p,float t){
  p.xz*=rot(0.035*sin(t*0.10));
  vec3 q=p;
  float warp=fbm(q*0.42+vec3(seed*.07,0.0,seed*.11));
  q.xz+=vec2(warp-0.45,fbm(q*0.38+3.0)-0.45)*0.75*bend;

  float large=billow(q*0.72+vec3(0.0,t*0.018,0.0));
  float mid=billow(q*1.55+vec3(4.1,-1.7,2.8));
  float fine=noise3(q*4.2+vec3(-2.0,3.0,t*0.025));

  /* ふわふわした丸い雲を作る高度マスク */
  float lower=smoothstep(-1.25,-0.25,p.y)*smoothstep(1.15,0.10,p.y);
  float middle=smoothstep(-0.55,-0.05,p.y)*smoothstep(1.15,0.42,p.y);
  float bill=large*0.72+mid*0.25+fine*0.08;
  float d=smoothstep(0.36,0.70,bill);

  /* 雲海。画面下に厚く、遠くへ行くほど平たく薄くする。 */
  float sea=smoothstep(-1.05,0.18,p.y);
  float seaNoise=smoothstep(0.34,0.63,billow(q*0.52+vec3(2.0,1.0,-3.0)));
  d=max(d*lower,d*middle*0.92);
  d=max(d,sea*seaNoise*0.55);

  /* 上空の薄い巻雲。 */
  float wispy=noise3(vec3(q.x*0.8+q.y*0.3,q.y*0.42,q.z*0.55)*2.0);
  float cirrus=smoothstep(0.52,0.73,fbm(vec3(q.x*0.42+q.y*0.2,q.y*0.22,q.z*0.35)+vec3(8.0)));
  cirrus*=smoothstep(0.1,0.8,p.y)*0.26;
  d=max(d,cirrus*(0.72+0.28*wispy));

  /* タッチした地点が雲を引き寄せ、そこから折り畳みが発生する。 */
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    vec2 at=law[i].xy;
    vec2 v=q.xz-at;
    float r2=dot(v,v);
    float w=law[i].z/(0.09+r2);
    float ca=cos(law[i].w),sa=sin(law[i].w);
    vec2 rv=vec2(ca*v.x-sa*v.y,sa*v.x+ca*v.y);
    q.xz+=rv*clamp(w,0.0,2.6)*0.09*bend;
    q.y+=sin(r2*5.0+law[i].w+t*0.20)*clamp(w,0.0,1.3)*0.055;
  }

  /* touch後の自己相似な折り返し。 */
  vec3 f=q;
  for(int i=0;i<3;i++){
    f=abs(f)-vec3(0.58,0.34,0.52);
    f.xz*=rot(0.18*sin(seed+float(i)*1.9+t*0.06));
    f*=1.38;
  }
  float folded=billow(f*0.72+vec3(1.7,-2.0,0.5));
  d+=smoothstep(0.56,0.82,folded)*0.16*depth;
  return clamp(d,0.0,1.0);
}

vec3 skyGradient(float y){
  vec3 horizon=vec3(0.91,0.95,0.98);
  vec3 blue=vec3(0.47,0.70,0.89);
  vec3 deep=vec3(0.25,0.48,0.75);
  float h=clamp(y*0.5+0.5,0.0,1.0);
  return mix(horizon,mix(blue,deep,smoothstep(0.35,1.0,h)),smoothstep(0.05,0.72,h));
}

vec3 background(vec2 uv,float t){
  vec3 col=skyGradient(uv.y);
  /* 遠景の雲海 */
  float n=fbm(vec3(uv.x*0.72,uv.y*0.55,0.7+t*0.012));
  float horizonCloud=smoothstep(0.48,0.70,n)*smoothstep(-0.65,0.05,uv.y);
  col=mix(col,vec3(0.83,0.90,0.95),horizonCloud*0.30);

  /* 右下から差す太陽。 */
  vec2 sunPos=vec2(0.48,-0.34);
  float sd=length(uv-sunPos);
  float sun=exp(-sd*sd*8.5);
  float halo=exp(-sd*sd*1.7);
  col+=vec3(1.0,0.82,0.56)*sun*0.30;
  col+=vec3(1.0,0.94,0.78)*halo*0.075;

  /* ごく薄い大気の虹色。雲の白さを邪魔しない程度。 */
  float arc=exp(-abs(length(uv-vec2(-0.34,-0.10))-0.48)*55.0);
  col+=vec3(0.15,0.27,0.35)*arc*0.018;
  return col;
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 ro=vec3(0.0,0.18,-4.1);
  vec3 rd=normalize(vec3(uv.x*0.88,uv.y*0.72+0.02,1.55));

  float yaw=0.035*sin(time*0.11);
  ro.xz*=rot(yaw);rd.xz*=rot(yaw);

  vec3 col=background(uv,time);
  float alpha=0.0;
  vec3 accum=vec3(0.0);

  /* 前景の積雲をレイマーチ。 */
  for(int i=0;i<58;i++){
    float z=0.35+float(i)*0.078;
    vec3 p=ro+rd*z;
    float dens=cloudDensity(p,time);
    float depthFade=smoothstep(0.25,0.9,z)*smoothstep(4.9,2.0,z);
    float a=dens*0.082*depthFade;
    float lightProbe=cloudDensity(p+vec3(0.20,0.13,-0.18),time);
    float light=clamp(0.54+0.95*(lightProbe-dens),0.20,1.18);

    vec3 shadow=vec3(0.34,0.50,0.68);
    vec3 cream=vec3(0.98,0.99,0.98);
    vec3 silver=vec3(0.70,0.82,0.91);
    vec3 lit=mix(shadow,cream,smoothstep(0.18,0.68,dens));
    lit=mix(lit,silver,0.35*(1.0-light));
    lit*=0.76+0.35*light;

    /* 太陽側だけ暖色へ。 */
    float sunSide=clamp(dot(normalize(vec3(0.55,0.65,-0.45)),normalize(p-ro)),0.0,1.0);
    lit=mix(lit,vec3(1.0,0.89,0.73),sunSide*0.18);

    accum+=lit*a*(1.0-alpha);
    alpha+=a*(1.0-alpha);
    if(alpha>0.985)break;
  }

  col=mix(col,accum,clamp(alpha,0.0,1.0));
  col+=vec3(0.38,0.55,0.70)*alpha*0.018;
  col*=1.0-0.06*length(uv*0.48);
  col=pow(max(col,0.0),vec3(0.94));
  O=vec4(col,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={};
for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){
  const a=gl.getActiveUniform(program,i);
  U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);
}
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*100.0,bend=1.0,depth=0.0,laws=[];
const lawBuf=new Float32Array(24);

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);resize();

function lawPoint(x,y){
  const s=Math.min(W,H);
  return[(x-W*0.5)/s,(H*0.5-y)/s];
}
function addLaw(x,y){
  const q=lawPoint(x,y);
  laws.push([q[0]*1.65,q[1]*1.65,0.55+Math.random()*0.55,Math.random()*6.2831853]);
  if(laws.length>6)laws.shift();
  bend=Math.min(2.25,bend+0.12);
  depth=Math.min(3.0,depth+0.20);
}

let paused=false;
function draw(phase){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,phase);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.bend,bend);
  gl.uniform1f(U.depth,depth);
  lawBuf.fill(0);
  laws.forEach((q,i)=>lawBuf.set(q,i*4));
  gl.uniform4fv(U.law,lawBuf);
  gl.uniform1i(U.lawCount,laws.length);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  addLaw(e.clientX,e.clientY);
  canvas.setPointerCapture?.(e.pointerId);
});

let last=performance.now(),phase=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){phase=(phase+dt*0.22)%(Math.PI*2);draw(phase);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,gifName:'sky-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      seed=Math.random()*100.0;bend=0.75+Math.random()*1.1;depth=Math.random()*0.8;
    }},
    {label:'↻',name:'reset',onClick:function(){
      laws=[];bend=1.0;depth=0.0;seed=Math.random()*100.0;
    }}
  ]
});
</script>
</body>
</html>
