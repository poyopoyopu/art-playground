<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKY FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9d5ee}
canvas{display:block;width:100%;height:100%;touch-action:none}
#fallback{display:none;position:fixed;inset:0;place-items:center;color:#7890a6;font:14px/1.5 system-ui;background:#dbe8f4}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="fallback">WebGL2 unavailable</div>
<script>
'use strict';
/* SKY FOLD — ChatGPT作。空そのものが折り畳まれ、触れた場所が次の空の法則になる。 */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('fallback').style.display='grid';throw new Error('WebGL2 unavailable');}
const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}`;
const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float time;
uniform float seed;
uniform float bend;
uniform float depth;
uniform vec4 law[6];
uniform int lawCount;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 sky(float y){
  vec3 top=vec3(0.20,0.48,0.76),mid=vec3(0.58,0.77,0.91),low=vec3(0.88,0.93,0.96);
  return mix(mix(low,mid,smoothstep(-0.7,0.45,y)),top,smoothstep(0.35,1.15,y));
}
vec3 cloudPal(float x){
  vec3 a=vec3(0.76,0.86,0.93),b=vec3(0.96,0.98,1.0),c=vec3(0.48,0.67,0.84);
  return mix(mix(a,b,smoothstep(0.05,0.62,x)),c,smoothstep(0.72,1.0,x));
}
/* 深いfold。同じ折り畳み規則を5世代繰り返す。 */
float field(vec3 p,float t){
  float scale=1.0,d=0.0;
  for(int i=0;i<5;i++){
    p.xz*=rot(0.34*sin(t*0.18+float(i)*1.7+seed));
    p.yz*=rot(0.22*cos(t*0.13+float(i)*1.31-seed));
    p=abs(p);p-=vec3(0.52,0.31,0.44);
    p.xy*=rot(0.28+0.08*sin(seed+float(i)*2.1));p*=1.62;scale*=1.62;
    d+=exp(-18.0*abs(p.y))*0.105/scale;
  }
  return d;
}
float density(vec3 p,float t){
  vec3 q=p;
  q.y+=0.18*sin(q.x*0.65+t*0.23)+0.11*cos(q.z*0.48-t*0.17);
  q.xz*=rot(0.12*sin(t*0.16));
  float d=field(q,t);
  d+=0.22*exp(-8.0*abs(q.y+0.08+0.12*sin(q.z*0.7+t*0.2)));
  for(int i=0;i<6;i++){
    if(i>=lawCount)break;
    vec2 at=law[i].xy;vec2 v=q.xz-at;float r2=dot(v,v);
    float w=law[i].z/(0.055+r2);float ca=cos(law[i].w),sa=sin(law[i].w);
    vec2 rv=vec2(ca*v.x-sa*v.y,sa*v.x+ca*v.y);
    q.xz+=rv*clamp(w,0.0,2.8)*0.045*bend;
    q.y+=sin(r2*8.0+law[i].w+t*0.35)*clamp(w,0.0,1.4)*0.026;
  }
  float nested=field(q*vec3(1.0,1.12+depth*0.08,1.0),t*1.05+depth*0.4);
  d+=nested*(0.62+0.12*depth);
  return clamp(d,0.0,1.0);
}
void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 ro=vec3(0.0,0.28,-3.7),rd=normalize(vec3(uv.x*0.86,uv.y*0.64+0.02,1.45));
  ro.xz*=rot(0.08*sin(time*0.12));rd.xz*=rot(0.08*sin(time*0.12));
  vec3 col=sky(uv.y);
  col+=vec3(0.12,0.16,0.20)*pow(max(0.0,uv.y+0.18),3.0);
  float alpha=0.0,glow=0.0;vec3 accum=vec3(0.0);
  for(int i=0;i<70;i++){
    float z=0.18+float(i)*0.072;vec3 p=ro+rd*z;float dens=density(p,time);
    float layer=exp(-0.26*abs(p.y+0.12+0.11*sin(p.x*0.8+time*0.2)));
    float a=dens*layer*0.072;a*=1.0-exp(-0.035*float(i));
    vec3 lit=cloudPal(dens+0.12*sin(p.z*0.7+time*0.17));
    float light=0.55+0.45*sin(p.x*1.2-p.z*0.8+time*0.22);lit*=0.78+0.25*light;
    accum+=lit*a*(1.0-alpha);alpha+=a*(1.0-alpha);glow+=a*max(0.0,0.65-p.y*0.18);
    if(alpha>0.985)break;
  }
  col=mix(col,accum,clamp(alpha,0.0,1.0));col+=vec3(0.38,0.53,0.66)*glow*0.012;
  col*=1.0-0.12*length(uv*0.55);col=pow(max(col,0.0),vec3(0.92));O=vec4(col,1.0);
}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');return s;}
const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));gl.bindAttribLocation(program,0,'p');gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');
const U={};for(let i=0;i<gl.getProgramParameter(program,gl.ACTIVE_UNIFORMS);i++){const a=gl.getActiveUniform(program,i);U[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(program,a.name);}
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W=0,H=0,DPR=1,seed=Math.random()*100.0,bend=1.0,depth=0.0,laws=[];const lawBuf=new Float32Array(24);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.35);canvas.width=Math.max(1,Math.round(W*DPR));canvas.height=Math.max(1,Math.round(H*DPR));}
addEventListener('resize',resize);resize();
function lawPoint(x,y){const s=Math.min(W,H);return[(x-W*0.5)/s,(H*0.5-y)/s];}
function addLaw(x,y){const q=lawPoint(x,y);laws.push([q[0]*1.9,q[1]*1.9,0.55+Math.random()*0.55,Math.random()*6.2831853]);if(laws.length>6)laws.shift();bend=Math.min(2.4,bend+0.12);depth=Math.min(3.0,depth+0.22);}
let paused=false;
function draw(phase){gl.useProgram(program);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.time,phase);gl.uniform1f(U.seed,seed);gl.uniform1f(U.bend,bend);gl.uniform1f(U.depth,depth);lawBuf.fill(0);laws.forEach((q,i)=>lawBuf.set(q,i*4));gl.uniform4fv(U.law,lawBuf);gl.uniform1i(U.lawCount,laws.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();addLaw(e.clientX,e.clientY);canvas.setPointerCapture?.(e.pointerId);});
let last=performance.now(),phase=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!paused){phase=(phase+dt*0.22)%(Math.PI*2);draw(phase);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
APKit.init({
  canvas, gifName:'sky-fold-loop', clockFormat:'spec', dock:true, autoHide:true, fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph);}, onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){seed=Math.random()*100.0;bend=0.75+Math.random()*1.1;depth=Math.random()*0.8;}},
    {label:'↻',name:'reset',onClick:function(){laws=[];bend=1.0;depth=0.0;seed=Math.random()*100.0;}}
  ]
});
</script>
</body>
</html>
