<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FROZEN LAW</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
body{touch-action:none}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const TEMP_PERIOD=6.0;
const c=document.getElementById('c'),g=c.getContext('2d');
let W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,2),phase=0,seed=Math.random(),nodes=[],holdX=-9999,holdY=-9999;
c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);
function temperature(phase){
  const t=((phase%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/(Math.PI*2);
  return t<.5?t*2:2-t*2;
}
function buildCrystal(seed,originX,originY){
  const created=[{x:originX,y:originY,depth:0,angle:-Math.PI/2,parentId:-1,bornAtTemp:temperature(phase)}];
  for(let depth=0;depth<8;depth++){
    const start=created.length;
    for(let i=0;i<start;i++)if(created[i].depth===depth){
      const branches=depth<2?3:2;
      for(let b=0;b<branches;b++){
        const a=created[i].angle+(b-(branches-1)/2)*(.42+depth*.025)+Math.sin(seed*19.7+i*1.73+b*4.11)*.11;
        const len=15+depth*6+Math.abs(Math.sin(seed*7.1+i*.91+b))*15;
        created.push({x:created[i].x+Math.cos(a)*len,y:created[i].y+Math.sin(a)*len,depth:depth+1,angle:a,parentId:i,bornAtTemp:created[i].bornAtTemp});
      }
    }
  }
  return created;
}
function renderAt(nodes,temp){
  g.fillStyle='#071018';g.fillRect(0,0,W,H);
  for(const n of nodes){
    if(n.depth===0)continue;
    const p=nodes[n.parentId];if(!p)continue;
    const cold=1-temp;
    const melt=Math.max(0,Math.min(1,(temp-n.bornAtTemp+.08)/.68));
    const reach=Math.max(.025,cold*(1-melt*.94));
    const x=p.x+(n.x-p.x)*reach,y=p.y+(n.y-p.y)*reach;
    if(Math.hypot(x-holdX,y-holdY)<Math.min(W,H)*.18){
      const local=Math.max(0,1-Math.hypot(x-holdX,y-holdY)/(Math.min(W,H)*.18));
      const hx=p.x+(x-p.x)*(1-local*.72),hy=p.y+(y-p.y)*(1-local*.72);
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(hx,hy);g.strokeStyle='rgba(190,235,255,.72)';g.lineWidth=Math.max(.5,2.6-n.depth*.16);g.stroke();
    }else{
      g.beginPath();g.moveTo(p.x,p.y);g.lineTo(x,y);g.strokeStyle=`rgba(190,235,255,${Math.max(.06,reach*.95)})`;g.lineWidth=Math.max(.5,2.6-n.depth*.16);g.stroke();
    }
  }
  for(const n of nodes)if(n.depth===0){g.beginPath();g.arc(n.x,n.y,2.4,0,Math.PI*2);g.fillStyle='rgba(235,250,255,.9)';g.fill();}
}
function onTap(x,y){
  if(window.APKit&&APKit.isUI(x,y))return true;
  const crystal=buildCrystal(seed+nodes.length*.731,x,y),offset=nodes.length;
  for(const n of crystal){if(n.parentId>=0)n.parentId+=offset;nodes.push(n)}
  return true;
}
function onHold(x,y){
  if(window.APKit&&APKit.isUI(x,y))return true;
  holdX=x;holdY=y;
  for(const n of nodes)if(n.depth>0&&Math.hypot(n.x-x,n.y-y)<Math.min(W,H)*.2)n.bornAtTemp=-1;
  return true;
}
function onDoubleTap(){phase=0;return true;}
let lastTap=0,holdTimer=0;
c.setAttribute('onpointerdown',"if(window.APKit&&APKit.isUI(event.clientX,event.clientY))return;var now=performance.now();if(now-lastTap<320){clearTimeout(holdTimer);onDoubleTap();lastTap=0}else{lastTap=now;holdX=event.clientX;holdY=event.clientY;holdTimer=setTimeout('onHold(holdX,holdY)',420);onTap(event.clientX,event.clientY)}");
c.setAttribute('onpointerup',"clearTimeout(holdTimer);holdX=-9999;holdY=-9999");
nodes=buildCrystal(seed,W*.5,H*.5);
setInterval('phase=(phase+Math.PI*2*(0.016/TEMP_PERIOD))%(Math.PI*2);renderAt(nodes,temperature(phase))',16);
APKit.init({canvas:c,gifName:'FROZEN-LAW-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>renderAt(nodes,temperature(p)),buttons:[
 {label:'✦',name:'mutate',onClick:()=>{seed=Math.random();nodes=buildCrystal(seed,W*.5,H*.5)}},
 {label:'↻',name:'reset',onClick:()=>{nodes=buildCrystal(seed,W*.5,H*.5)}}
]});
</script>
</body>
</html>
