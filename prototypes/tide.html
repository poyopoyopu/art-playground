<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>TIDE</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#031018}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,amp=50;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#031018';g.fillRect(0,0,W,H);for(let i=0;i<16;i++){g.beginPath();for(let x=0;x<W;x+=8){let y=H/2+i*amp/4+Math.sin(x*.012+i+p*6)*amp+Math.sin(x*.035-p*6)*amp*.3;g.lineTo(x,y)}g.strokeStyle=`hsla(${175+i*4},75%,65%,.35)`;g.stroke()}}function mu(){amp=15+Math.random()*100}APKit.init({canvas:c,gifName:'tide-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>amp=50}]});draw(0)</script>
