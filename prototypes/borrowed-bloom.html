<!-- BORROWED BLOOM — クロちゃん(Claude)作。おっちゃん提供の動画(画面いっぱいに絵の具が爆ぜた中心から、
     渦を巻くポーリングアートの花がひらいていく)を参考に、
     「花は新しい色を持たない。足元の絵の具を吸い上げて咲く」という世界のルールで再構成。
     ap-kit.js統合: クロちゃん -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BORROWED BLOOM — 借りものの色</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#8fb3bd;overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;left:0;right:0;bottom:118px;text-align:center;pointer-events:none;
    font:12px ui-monospace,Menlo,monospace;letter-spacing:.35em;color:#fff;
    text-shadow:0 0 6px rgba(0,0,0,.7);opacity:.75;transition:opacity 1.2s}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    font:14px ui-monospace,Menlo,monospace;color:#222;text-align:center;padding:24px}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">TAP · HOLD</div>
<div id="nogl">この端末ではWebGLが使えないため表示できません</div>
<script>
(function(){
"use strict";

/* ---------- 世界のルール ----------
   画面は、一度ぶちまけられた絵の具の層。
   触った場所から花がひらく。花の真ん中は絵の具を押し出し続け、古い層は外へ押しやられて
   縁に寄り集まり、中心からは放射状の流れと、レースのような網目が伸びていく。

   ただし花は新しい色を持たない。咲く瞬間に、足元とまわりの絵の具を吸い上げて、
   その色だけで咲く。だから、咲けば咲くほど世界は自分の色を混ぜ直していく。
   一度混ぜた色は二度と分かれない。

   タップ = 小さな花 / 長押し = 押している間、花が広がり続ける(注ぎ続ける)
   ✦ = 新しい絵の具を投げつける(この世界に新しい色が入る唯一の方法)
   ↻ = 最初の爆発からやり直す
------------------------------------ */

var cv=document.getElementById('c');
var hint=document.getElementById('hint');
var gl=cv.getContext('webgl',{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false,preserveDrawingBuffer:false});
if(!gl){document.getElementById('nogl').style.display='flex';return;}

var MAXB=6;
var W=2,H=2,S=2;
var t=0,lastTouch=0,touchedOnce=false;
var blooms=[];
var ptrs={};
var rnd=Math.random;
var boomC=[0.5,0.5];

/* ---------- 投げつける絵の具の色 ---------- */
var SPLASH_PALS=[
  ['#16e0ff','#1f6dff','#2fd2ff','#ff2fa0','#7a2cff','#ffe51f'],
  ['#ff3d2e','#ff9b1a','#ffd60a','#ff2e88','#7b1fa2','#2ec4b6'],
  ['#00e0c6','#00a3ff','#3dff7a','#f4ff3d','#0b3cff','#ff5ac8'],
  ['#ff6fb5','#ffe066','#7bdff2','#b388ff','#ff8c42','#2cd67a'],
  ['#ff4500','#ffb000','#c1121f','#ffd6a5','#3a86ff','#8338ec'],
  ['#c6ff00','#00e5ff','#ff1744','#ffea00','#651fff','#00c853']
];
var lastPal=0;
function hexRgb(h){var n=parseInt(h.slice(1),16);return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}

/* ---------- WebGL ---------- */
var VS='attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';

var NOISE=[
'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'vec2 hash2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}',
'float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+17.1;a*=.5;}return s/.9375;}',
'float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}',
'float vnoise3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);',
' return mix(mix(mix(h3(i),h3(i+vec3(1.,0.,0.)),f.x),mix(h3(i+vec3(0.,1.,0.)),h3(i+vec3(1.,1.,0.)),f.x),f.y),',
'  mix(mix(h3(i+vec3(0.,0.,1.)),h3(i+vec3(1.,0.,1.)),f.x),mix(h3(i+vec3(0.,1.,1.)),h3(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}'
].join('\n');

/* 爆発:画面いっぱいの粉っぽい絵の具の雲+黒い煙+放射状の飛沫+黒と赤のすじ。
   uFull=1なら下地から描き直し、0なら今の絵の上に重ねる。uR0〜uR1の輪の範囲だけ塗る(飛び散る演出) */
var BOOM_FS=[
'precision highp float;',
'uniform sampler2D uState;uniform vec2 uRes,uC;uniform float uS,uSeed,uSp,uFull,uR0,uR1;uniform vec3 uPal[6];',
NOISE,
'vec3 palAt(float k){vec3 c=uPal[0];for(int j=0;j<6;j++){if(float(j)==k)c=uPal[j];}return c;}',
'void main(){',
' vec2 px=gl_FragCoord.xy;vec2 q=px/uS;vec2 uv=px/uRes;',
' vec2 d=q-uC;float r=length(d);vec2 dv=d/max(r,1e-4);float A=atan(d.y,d.x);',
' float ring=step(uR0,r)*step(r,uR1);',
' vec3 old=texture2D(uState,uv).rgb;',
' if(ring<.5){gl_FragColor=vec4(old,1.);return;}',
' float sd=uSeed;',
' vec3 base=mix(vec3(.50,.62,.67),vec3(.80,.86,.88),uv.y)*(.92+.12*fbm(q*3.+sd));',
' vec3 col=uFull>.5?base:old;',
/* 粉っぽい色の雲 */
' vec2 p=q*2.2+sd;',
' vec2 w=vec2(fbm(p),fbm(p+vec2(5.2,1.3)));',
' vec2 w2=vec2(fbm(p*2.+w*3.),fbm(p*2.+w*3.+3.7));',
' float reach=uSp*(.42+.38*fbm(dv*2.2+sd)+.25*pow(vnoise(dv*7.+sd+3.),2.));',
' float cover=1.-smoothstep(reach*.55,reach,r+.12*(fbm(q*9.+w*2.)-.5));',
' float g=clamp((fbm(p*.8+w2*2.4+dv*.6)-.22)/.56,0.,.999)*6.;',
' float k0=mod(floor(g),6.),k1=mod(k0+1.,6.);',
' vec3 cc=mix(palAt(k0),palAt(k1),smoothstep(.55,1.,fract(g)));',
' float smoke=smoothstep(.52,.72,fbm(p*1.3+w2*2.+11.+dv*.8));',
' cc=mix(cc,vec3(.02,.04,.06),smoke*.92);',
' float glow=smoothstep(.3,.75,fbm(p*.7+w*1.5+20.));',
' cc=mix(cc,cc*1.35+vec3(.12),glow*.6*(1.-smoke));',
' float grain=vnoise(q*380.+sd)*.6+vnoise(q*170.+sd*2.)*.4;',
' cc*=.82+.36*grain;',
' float powder=cover*(.62+.38*smoothstep(.25,.6,fbm(q*6.+w2*3.)));',
' col=mix(col,clamp(cc,0.,1.),powder);',
/* 放射状の飛沫(外へ行くほどまばらで小さく、放射方向に伸びる) */
' for(int L=0;L<2;L++){',
'  float KA=L==0?150.:380.;float KR=L==0?9.:16.;',
'  float lr=log(r+.02);',
'  vec2 cid=vec2(floor((A+3.14159)/6.28318*KA),floor(lr*KR));',
'  vec2 hh=hash2(cid+sd*13.+float(L)*71.);',
'  float dens=(L==0?.3:.36)*smoothstep(.03,.15,r)*(1.-smoothstep(reach*.9,reach*2.2,r));',
'  if(hh.x<dens){',
'   float ca=(cid.x+.32+.36*hh.y)/KA*6.28318-3.14159;',
'   float cr=exp((cid.y+.42+.16*fract(hh.x*17.))/KR)-.02;',
'   float da=A-ca;float tang=da*r;float rad=r-cr;',
'   float sz=(r+.02)*6.28318/KA*(.06+.2*pow(fract(hh.y*29.),1.5));',
'   float e=length(vec2(tang,rad/(1.3+.9*fract(hh.x*7.))))-sz;',
'   float dropA=1.-smoothstep(-.6/uS,.6/uS,e);',
'   float pc=floor(fract(hh.y*53.)*7.);',
'   vec3 dc=pc>5.5?vec3(.03,.03,.05):palAt(pc);',
'   col=mix(col,dc*(.95+.15*fract(hh.x*91.)),dropA*.95);',
'  }',
' }',
/* 細かい霧 */
' float hp=hash(floor(px/1.5)+sd*7.);',
' float mist=step(1.-(.022*cover+.006),hp);',
' col=mix(col,palAt(floor(fract(hp*97.)*6.))*1.1,mist*.8);',
/* 黒と赤のすじ */
' for(int L=0;L<2;L++){',
'  float N=L==0?90.:200.;',
'  float Af=(A+3.14159)/6.28318*N;float li=floor(Af);vec2 hh=hash2(vec2(li,sd+N));',
'  if(hh.x>(L==0?.6:.8)){',
'   float ca=li+.5+(hh.y-.5)*.7;float perp=abs((Af-ca)/N*6.28318)*r;',
'   float rs=uSp*(.08+.45*fract(hh.x*13.7));float re=rs+.2+1.3*fract(hh.y*7.3);',
'   float wd=(L==0?.0028:.0012)*(.5+1.5*pow(fract(hh.x*31.1),2.))*(.4+r);',
'   wd*=smoothstep(re,rs+(re-rs)*.3,r)*smoothstep(rs,rs+.04,r);',
'   wd=max(wd,.0);',
'   float ln=1.-smoothstep(wd-.7/uS,wd+.7/uS,perp);',
'   ln*=step(rs,r)*step(r,re);',
'   vec3 lc=fract(hh.y*91.)<.33?vec3(.86,.06,.08):vec3(.04,.04,.06);',
'   col=mix(col,lc,ln*.92);',
'  }',
' }',
' gl_FragColor=vec4(col,1.);',
'}'
].join('\n');

/* 流れ:花の中心から外へ押し出す(面積が保たれる湧き出し)+ゆるい渦+わずかなゆらぎ。
   花の内側には、吸い上げた色で放射状の流れとレースの網目を描き込む */
var FLOW_FS=[
'precision highp float;',
'uniform sampler2D uState;uniform vec2 uRes;uniform float uS,uTime,uDt;uniform int uN;',
'uniform vec4 uA[6];uniform vec4 uB[6];uniform vec3 uPal[30];',
NOISE,
'vec3 tx(vec2 p){return texture2D(uState,p/uRes).rgb;}',
'vec3 sampleCR(vec2 sp){',
' vec2 tp1=floor(sp-.5)+.5;vec2 f=sp-tp1;',
' vec2 w0=f*(-.5+f*(1.-.5*f));vec2 w1=1.+f*f*(-2.5+1.5*f);vec2 w2=f*(.5+f*(2.-1.5*f));vec2 w3=f*f*(-.5+.5*f);',
' vec2 w12=w1+w2;vec2 o12=w2/w12;',
' vec2 t0=tp1-1.;vec2 t3=tp1+2.;vec2 t12=tp1+o12;',
' vec3 c=tx(vec2(t0.x,t0.y))*w0.x*w0.y+tx(vec2(t12.x,t0.y))*w12.x*w0.y+tx(vec2(t3.x,t0.y))*w3.x*w0.y',
'  +tx(vec2(t0.x,t12.y))*w0.x*w12.y+tx(vec2(t12.x,t12.y))*w12.x*w12.y+tx(vec2(t3.x,t12.y))*w3.x*w12.y',
'  +tx(vec2(t0.x,t3.y))*w0.x*w3.y+tx(vec2(t12.x,t3.y))*w12.x*w3.y+tx(vec2(t3.x,t3.y))*w3.x*w3.y;',
' return clamp(c,0.,1.);}',
'void main(){',
' vec2 px=gl_FragCoord.xy;vec2 q=px/uS;vec2 src=q;float moved=0.;',
' vec3 P=vec3(0.);float AA=0.;',
' for(int i=0;i<6;i++){',
'  if(i>=uN)break;',
'  vec4 a=uA[i];vec4 b=uB[i];vec2 c=a.xy;float r=a.z;float s=a.w;',
'  vec2 d=src-c;float dist=length(d);',
'  float rr=r*(1.+.3*(vnoise(d/max(dist,1e-4)*2.4+b.w)-.5)+.08*(vnoise(d/max(dist,1e-4)*9.+b.w)-.5));',
'  float m=s*(1.-smoothstep(rr*.84,rr*1.04,dist));',
'  if(m>.0001){',
'   float dd=max(dist,b.z*.5);',
'   float v=b.x/(6.2831853*dd);',
'   float nd=max(dist-v*uDt*m,0.);',
'   float th=uDt*m*b.y*(.45*exp(-dist/(.3*r+.02))+.04*max(0.,1.-dist/r));',
'   float cs=cos(th),sn=sin(th);',
'   vec2 dr=vec2(cs*d.x+sn*d.y,-sn*d.x+cs*d.y);',
'   if(dist>1e-5)dr*=nd/dist;',
'   vec2 w=vec2(vnoise(src*7.+vec2(uTime*.4,b.w)),vnoise(src*7.+vec2(b.w,uTime*.4)+31.7))-.5;',
'   src=c+dr+w*uDt*m*.035;moved=1.;',
'  }',
'  vec2 e=q-c;float ed=length(e);',
'  vec2 ev=e/max(ed,1e-4);',
'  float rc=max(b.z,r*(.80+.22*(vnoise(ev*2.4+b.w)-.5)));',
'  if(ed<rc&&s>.001){',
'   float lr=log(ed+.015);',
'   float ang=atan(e.y,e.x)+b.y*.3*lr;',
'   vec2 dv=vec2(cos(ang),sin(ang));',
'   float u=lr-uTime*.32;',
/* 色の流れ:吸い上げた色が中心から帯になって流れ出す */
'   float g=(fbm(dv*1.8+vec2(b.w,u*.35))*.7+vnoise3(vec3(dv*5.,u*.8+b.w))*.3)*5.;',
'   float k0=mod(floor(g),4.);float k1=mod(k0+1.,4.);float fg=fract(g);',
'   vec3 dark=vec3(0.),c0=vec3(0.),c1=vec3(0.);',
'   for(int k=0;k<5;k++){vec3 pk=uPal[i*5+k];if(k==4)dark=pk;else{if(float(k)==k0)c0=pk;if(float(k)==k1)c1=pk;}}',
'   vec3 col=mix(c0,c1,smoothstep(.62,.9,fg));',
'   col=mix(col,dark,(1.-smoothstep(.0,.05,fg))*.7);',
/* レース:放射方向に伸びた穴。穴のふちの糸は明るく */
'   float L=vnoise3(vec3(dv*13.,u*8.+b.w))*.62+vnoise3(vec3(dv*29.,u*17.+b.w+7.))*.38;',
'   float hole=smoothstep(.54,.62,L);',
'   float thread=smoothstep(.44,.54,L)*(1.-hole);',
'   vec3 holec=mix(dark,c1*.45,.35);',
'   vec3 pc=mix(col*(1.+.18*thread),holec,hole*.88);',
'   pc=mix(pc,dark,1.-smoothstep(.006,.02,ed));',
'   float al=(1.-pow(.6,uDt*60.))*s*(1.-smoothstep(rc*.8,rc,ed));',
'   P=P*(1.-al)+pc*al;AA=AA*(1.-al)+al;',
'  }',
' }',
' vec3 base=moved>.5?sampleCR(src*uS):texture2D(uState,px/uRes).rgb;',
' gl_FragColor=vec4(base*(1.-AA)+P,1.);',
'}'
].join('\n');

var COPY_FS='precision highp float;uniform sampler2D uOld;varying vec2 vUv;void main(){gl_FragColor=vec4(texture2D(uOld,vUv).rgb,1.);}';

/* 表示:明るさの勾配を絵の具の厚みとみなして、濡れたツヤを乗せる */
var SHOW_FS=[
'precision highp float;',
'uniform sampler2D uState;uniform vec2 uRes;',
'float lum(vec2 p){return dot(texture2D(uState,p/uRes).rgb,vec3(.299,.587,.114));}',
'void main(){vec2 px=gl_FragCoord.xy;vec3 c=texture2D(uState,px/uRes).rgb;',
' vec2 g=vec2(lum(px+vec2(1.5,0.))-lum(px-vec2(1.5,0.)),lum(px+vec2(0.,1.5))-lum(px-vec2(0.,1.5)));',
' vec3 n=normalize(vec3(-g*1.8,1.));vec3 L=normalize(vec3(-.45,.6,.75));vec3 Hh=normalize(L+vec3(0.,0.,1.));',
' float diff=dot(n,L);float spec=pow(max(dot(n,Hh),0.),60.);',
' c=c*(.9+.14*diff)+spec*.16;',
' vec2 v=px/uRes-.5;c*=1.-.2*dot(v,v);',
' gl_FragColor=vec4(c,1.);}'
].join('\n');

function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));}return s;}
function prog(fs){var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));}
  var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var info=gl.getActiveUniform(p,i);var nm=info.name.replace(/\[0\]$/,'');u[nm]=gl.getUniformLocation(p,info.name);}
  return {p:p,u:u};}
var pFlow=prog(FLOW_FS),pBoom=prog(BOOM_FS),pCopy=prog(COPY_FS),pShow=prog(SHOW_FS);

var vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

function makeTex(w,h){var tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  var fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tx,0);
  return {t:tx,f:fb};}
var st=[null,null],cur=0;

function pass(pr,target){gl.useProgram(pr.p);gl.bindFramebuffer(gl.FRAMEBUFFER,target?target.f:null);gl.viewport(0,0,W,H);}
function draw(){gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

/* ---------- サイズ ---------- */
function simSize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.round(window.innerWidth*dpr),h=Math.round(window.innerHeight*dpr);
  var k=Math.min(1,Math.sqrt(2200000/(w*h)));
  return [Math.max(2,Math.round(w*k)),Math.max(2,Math.round(h*k))];
}
function sizeSetup(keep){
  var sz=simSize();
  if(sz[0]===W&&sz[1]===H&&st[0])return false;
  var old=st[cur];
  var nw=sz[0],nh=sz[1];
  var a=makeTex(nw,nh),b=makeTex(nw,nh);
  W=nw;H=nh;S=Math.min(W,H);cv.width=W;cv.height=H;
  if(old&&keep){pass(pCopy,a);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,old.t);gl.uniform1i(pCopy.u.uOld,0);draw();}
  if(st[0]){gl.deleteTexture(st[0].t);gl.deleteFramebuffer(st[0].f);gl.deleteTexture(st[1].t);gl.deleteFramebuffer(st[1].f);}
  st=[a,b];cur=0;
  return true;
}

/* ---------- 絵の具をぶちまける ---------- */
var boom=null; // {cx,cy,seed,sp,full,pal,r,age}
var BP=new Float32Array(18);
function doBoom(r0,r1){
  var bm=boom;
  for(var i=0;i<6;i++){var c=hexRgb(bm.pal[i]);BP[i*3]=c[0];BP[i*3+1]=c[1];BP[i*3+2]=c[2];}
  var src=st[cur],dst=st[1-cur];
  pass(pBoom,dst);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(pBoom.u.uState,0);
  gl.uniform2f(pBoom.u.uRes,W,H);gl.uniform2f(pBoom.u.uC,bm.cx,bm.cy);gl.uniform1f(pBoom.u.uS,S);
  gl.uniform1f(pBoom.u.uSeed,bm.seed);gl.uniform1f(pBoom.u.uSp,bm.sp);gl.uniform1f(pBoom.u.uFull,bm.full?1:0);
  gl.uniform1f(pBoom.u.uR0,r0);gl.uniform1f(pBoom.u.uR1,r1);gl.uniform3fv(pBoom.u.uPal,BP);
  draw();
  cur=1-cur;
}
function startBoom(full){
  var pal,cx,cy;
  if(full){pal=SPLASH_PALS[0];lastPal=0;cx=W/S*(0.46+rnd()*0.08);cy=H/S*(0.45+rnd()*0.1);}
  else{var pi=lastPal;while(pi===lastPal)pi=(rnd()*SPLASH_PALS.length)|0;lastPal=pi;pal=SPLASH_PALS[pi];
    cx=W/S*(0.2+rnd()*0.6);cy=H/S*(0.2+rnd()*0.6);}
  boom={cx:cx,cy:cy,seed:rnd()*90+5,sp:full?1.0:0.55,full:full,pal:pal,r:-1,age:0};
  boomC=[cx,cy];
  if(full){doBoom(-1,99);boom=null;}
}

/* ---------- 色を吸い上げる ---------- */
var pixBuf=new Uint8Array(4);
function readQ(qx,qy){
  var x=Math.max(0,Math.min(W-1,Math.round(qx*S))),y=Math.max(0,Math.min(H-1,Math.round(qy*S)));
  gl.bindFramebuffer(gl.FRAMEBUFFER,st[cur].f);
  gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixBuf);
  return [pixBuf[0]/255,pixBuf[1]/255,pixBuf[2]/255];
}
function rgb2hsl(c){var r=c[0],g=c[1],b=c[2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0;
  if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;}
  return [h,s,l];}
function hsl2rgb(h,s,l){function f(n){var k=(n+h*12)%12;var a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));}
  return [f(0),f(8),f(4)];}
function borrowPalette(qx,qy,R0){
  var smp=[],i,a,rr;
  for(i=0;i<16;i++){a=rnd()*6.283;rr=R0*1.3*Math.sqrt(rnd());smp.push(readQ(qx+Math.cos(a)*rr,qy+Math.sin(a)*rr));}
  for(i=0;i<8;i++){smp.push(readQ(rnd()*W/S,rnd()*H/S));}
  var hs=smp.map(rgb2hsl);
  var chrom=hs.filter(function(x){return x[1]>0.22&&x[2]>0.12&&x[2]<0.93;});
  chrom.sort(function(p,q){return q[1]*(1-Math.abs(q[2]-0.5))-p[1]*(1-Math.abs(p[2]-0.5));});
  var picks=[];
  for(i=0;i<chrom.length&&picks.length<4;i++){
    var ok=true;for(var j=0;j<picks.length;j++){var dh=Math.abs(chrom[i][0]-picks[j][0]);dh=Math.min(dh,1-dh);if(dh<0.07){ok=false;break;}}
    if(ok)picks.push(chrom[i]);
  }
  if(!picks.length){var g=hs[(rnd()*hs.length)|0];picks.push([g[0],g[1],Math.min(0.85,Math.max(0.3,g[2]))]);}
  var base=picks.length;
  for(i=0;picks.length<4;i++){var p=picks[i%base];picks.push([p[0],p[1],p[2]+(i%2?-0.16:0.16)]);}
  /* 一番明るい色を必ず混ぜる(黄色系がいれば糸が光る) */
  var out=picks.map(function(p){
    var s=p[1]>0.15?Math.min(1,0.8+p[1]*0.3):p[1];
    var l=Math.max(0.38,Math.min(0.7,0.5+(p[2]-0.5)*0.55));
    return hsl2rgb(p[0],s,l);});
  var dh2=picks[(rnd()*picks.length)|0];
  out.push(hsl2rgb(dh2[0],Math.min(0.7,dh2[1]),0.12));
  return out;
}

/* ---------- 花 ---------- */
function addBloom(qx,qy,held,Rt){
  var b={x:qx,y:qy,r:0.012,Rt:Rt,held:held,age:0,rel:0,s:1,Q:0,
    spin:(rnd()<0.5?-1:1)*(0.7+rnd()*0.6),seed:rnd()*100,pal:borrowPalette(qx,qy,Rt+0.1),core:0.03};
  blooms.push(b);
  if(blooms.length>MAXB)blooms.shift();
  return b;
}
function updateBlooms(dt){
  var maxR=Math.max(W,H)/S*0.62;
  for(var i=blooms.length-1;i>=0;i--){var b=blooms[i];
    b.age+=dt;
    if(b.held){b.Rt=Math.min(maxR,b.Rt+dt*0.1);}else b.rel+=dt;
    var dr=(b.Rt-b.r)/1.8;b.r+=dr*dt;
    b.Q=6.2832*b.r*Math.max(dr,0)+0.003;
    if(!b.held&&b.rel>4+b.Rt*7)b.s-=dt/1.8;
    if(b.s<=0)blooms.splice(i,1);
  }
}
var UA=new Float32Array(24),UB=new Float32Array(24),UP=new Float32Array(90);
function doFlow(dt){
  var n=blooms.length;
  for(var i=0;i<n;i++){var b=blooms[i];
    UA[i*4]=b.x;UA[i*4+1]=b.y;UA[i*4+2]=b.r;UA[i*4+3]=Math.max(0,Math.min(1,b.s));
    UB[i*4]=b.Q;UB[i*4+1]=b.spin;UB[i*4+2]=b.core;UB[i*4+3]=b.seed;
    for(var k=0;k<5;k++){UP[i*15+k*3]=b.pal[k][0];UP[i*15+k*3+1]=b.pal[k][1];UP[i*15+k*3+2]=b.pal[k][2];}
  }
  var src=st[cur],dst=st[1-cur];
  pass(pFlow,dst);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(pFlow.u.uState,0);
  gl.uniform2f(pFlow.u.uRes,W,H);gl.uniform1f(pFlow.u.uS,S);gl.uniform1f(pFlow.u.uTime,t);gl.uniform1f(pFlow.u.uDt,dt);
  gl.uniform1i(pFlow.u.uN,n);
  gl.uniform4fv(pFlow.u.uA,UA);gl.uniform4fv(pFlow.u.uB,UB);gl.uniform3fv(pFlow.u.uPal,UP);
  draw();
  cur=1-cur;
}
function show(){
  pass(pShow,null);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,st[cur].t);gl.uniform1i(pShow.u.uState,0);
  gl.uniform2f(pShow.u.uRes,W,H);
  draw();
}

/* ---------- 最初の一輪と、放っておいた時の一輪 ---------- */
var script=[];
function demo(){
  script=[];
  script.push({at:t+1.2,fn:function(){var b=addBloom(boomC[0],boomC[1],true,0.16);script.push({at:t+3.2,fn:function(){b.held=false;}});}});
}
function idle(){
  if(blooms.length||script.length||boom)return;
  if(t-lastTouch<14)return;
  lastTouch=t;
  var b=addBloom(W/S*(0.2+rnd()*0.6),H/S*(0.2+rnd()*0.6),true,0.14);
  var hold=0.4+rnd()*2.2;
  script.push({at:t+hold,fn:function(){b.held=false;}});
}

/* ---------- 操作 ---------- */
function toQ(e){return [e.clientX/window.innerWidth*W/S,(1-e.clientY/window.innerHeight)*H/S];}
cv.addEventListener('pointerdown',function(e){
  if(window.APKit&&window.APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  var q=toQ(e);
  ptrs[e.pointerId]=addBloom(q[0],q[1],true,0.15+rnd()*0.05);
  lastTouch=t;
  if(!touchedOnce){touchedOnce=true;hint.style.opacity=0;}
},{passive:false});
function endPtr(e){var b=ptrs[e.pointerId];if(b)b.held=false;delete ptrs[e.pointerId];lastTouch=t;}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);

/* ---------- ✦ ↻ ---------- */
function mutate(){startBoom(false);lastTouch=t;}
function resetAll(){
  for(var k in ptrs){delete ptrs[k];}
  blooms=[];boom=null;
  startBoom(true);demo();lastTouch=t;
}

/* ---------- ループ ---------- */
var last=0;
function tick(now){
  var dt=last?(now-last)/1000:0.016;last=now;
  if(dt>0.05)dt=0.05;
  t+=dt;
  for(var i=script.length-1;i>=0;i--){if(t>=script[i].at){var f=script[i].fn;script.splice(i,1);f();}}
  idle();
  if(!touchedOnce&&t>9)hint.style.opacity=0;
  if(boom){
    boom.age+=dt;var k=Math.min(1,boom.age/0.5);var e=1-Math.pow(1-k,3);
    var r1=e*(Math.max(W,H)/S*1.5);doBoom(boom.r,r1);boom.r=r1;
    if(k>=1)boom=null;
  }
  updateBlooms(dt);
  if(blooms.length)doFlow(Math.min(dt,1/30));
  show();
  requestAnimationFrame(tick);
}

function onResize(){if(sizeSetup(true)){blooms=[];for(var k in ptrs){delete ptrs[k];}}}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,120);});

sizeSetup(false);
startBoom(true);
demo();
requestAnimationFrame(tick);

if(window.APKit){
  window.APKit.init({
    canvas:cv,
    gifName:'borrowed-bloom',
    clockFormat:'spec',
    dock:true,
    autoHide:true,
    fullscreenButton:false,
    buttons:[
      {label:'✦',name:'mutate',onClick:mutate},
      {label:'↻',name:'reset',onClick:resetAll}
    ]
  });
}
})();
</script>
</body>
