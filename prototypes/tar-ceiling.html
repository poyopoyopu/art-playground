<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAR CEILING</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#888;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  TAR CEILING — Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: 天井から垂れる黒いクローム液(おっちゃん提供の参考画像)

  世界のルール:
  天井には黒い液体が溜まっていて、放っておけば落ちてこない(飾りの雫が揺れているだけ)。
  触れた場所は「漏れ口」になり、二度と塞がらない。漏れ口からは雫が育ち、ちぎれて床へ落ちる。
  長押しすると漏れ口が重くなり、速く垂れる。指で横になぞると、通り道に細かい漏れ口が並ぶ。
  改修(2026-09-17): 漏れ口を細い糸状に変更し、数の上限を24に増やした。
  天井の液が尽きると、世界がひっくり返る。溜まった床が新しい天井になり、漏れ口はそのまま残る。
*/
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}
  return {p,u}}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let FLOAT=!!gl.getExtension('EXT_color_buffer_float');
function makeTarget(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  if(FLOAT)gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  const ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  if(!ok&&FLOAT){FLOAT=false;return makeTarget(w,h)}
  return {t,f,w,h}}

const NC=64,ND=32,NP=32,NR=8,NW=24;

/* パスA: 液体の距離場 → ドーム状の高さ */
const FS_FIELD=`#version 300 es
precision highp float;
uniform vec2 res,view;uniform float k,flip,wob,margin;
uniform float th[${NC}];
uniform vec4 drip[${ND}];   // x, rootY, len, bulb
uniform float fine[${ND}];  // 1=細い漏れ口
uniform vec4 drop[${NP}];   // x, y, r, stretch
uniform vec3 rip[${NR}];    // x, age, amp
uniform vec2 wsag[${NW}];   // x, sag
uniform float pool;
out vec4 o;
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float ceilT(float x){
  float u=clamp((x-margin)/(view.x-2.*margin),0.,1.)*${NC-1}.;
  float i=floor(u);int a=int(i),b=min(a+1,${NC-1});
  float t=mix(th[a],th[b],u-i);
  for(int j=0;j<${NW};j++){float d=(x-wsag[j].x)/11.;t+=wsag[j].y*exp(-d*d);}
  float dl=x-margin,dr=view.x-margin-x;
  t+=min(t*.9,110.)*(exp(-dl/22.)+exp(-dr/22.));            // 壁を伝う
  t+=wob*(sin(x*.021+k)*2.5+sin(x*.047-k*2.)*1.2);
  return t;
}
float sdSeg(vec2 p,vec2 a,vec2 b,out float h){vec2 pa=p-a,ba=b-a;h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}
float liquid(vec2 p){
  float d=p.y-(margin+ceilT(p.x));
  for(int i=0;i<${ND};i++){
    vec4 q=drip[i];if(q.z<1.)continue;
    vec2 a=vec2(q.x,q.y-6.),b=vec2(q.x,q.y+q.z);
    float h;float s=sdSeg(p,a,b,h);
    float fn=fine[i];
    float r=mix(mix(12.+q.w*.4,3.8+q.w*.3,fn),mix(3.4+q.w*.22,1.1+q.w*.12,fn),pow(h,.5));
    float dd=s-r;
    dd=smin(dd,length(p-b-vec2(0.,q.w*.35))-q.w,5.);
    d=smin(d,dd,mix(11.,6.,fn));
  }
  float pl=view.y-margin-pool;
  for(int i=0;i<${NR};i++){vec3 r=rip[i];if(r.z<=0.)continue;float dx=abs(p.x-r.x);
    pl-=r.z*exp(-r.y*1.6)*sin(dx*.09-r.y*10.)*exp(-dx/110.);}
  float dl=p.x-margin,dr=view.x-margin-p.x;
  pl-=min(pool,40.)*.8*(exp(-dl/14.)+exp(-dr/14.));           // メニスカス
  d=smin(d,pl-p.y,10.);
  for(int i=0;i<${NP};i++){
    vec4 q=drop[i];if(q.z<=0.)continue;
    vec2 e=(p-q.xy)*vec2(1.,1./q.w);
    d=smin(d,(length(e)-q.z)*min(1.,q.w),9.);
  }
  return d;
}
void main(){
  vec2 p=gl_FragCoord.xy/res*view;p.y=view.y-p.y;                  // 画面座標(y下向き)
  float cy=view.y*.5;p.y=cy+(p.y-cy)/(abs(flip)<.02?sign(flip+1e-4)*.02:flip);
  float d=liquid(p);
  float T=14.;
  float u=clamp(-d/T,0.,1.);
  float z=sqrt(1.-(1.-u)*(1.-u));
  float cov=smoothstep(.9,-.9,d*res.x/view.x);
  o=vec4(z,clamp(-d/260.,0.,1.),cov,1.);
}`;

const FS_SHADE=`#version 300 es
precision highp float;
uniform sampler2D fld;uniform vec2 fres,res,view;uniform float k,margin,rad,flipShade,hue;
out vec4 o;
float sdRR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
vec3 env(vec3 r){
  vec3 c=vec3(.02)+vec3(.35)*smoothstep(.1,1.,r.y);
  c+=vec3(1.)*smoothstep(.72,.8,r.x)*smoothstep(.35,.0,abs(r.y-.1))*1.3;       // 右の縦長ライト
  c+=vec3(.8)*smoothstep(-.78,-.86,r.x)*smoothstep(.4,.0,abs(r.y+.05))*1.0;  // 左の縦長ライト
  c+=vec3(1.)*smoothstep(.93,.99,dot(r,normalize(vec3(-.25,.55,.8))))*1.2;    // 小さな点光
  return c;}
void main(){
  vec2 uv=gl_FragCoord.xy/res;vec2 px=1./fres;
  vec4 f=texture(fld,uv);
  float zl=texture(fld,uv-vec2(px.x,0)).r,zr=texture(fld,uv+vec2(px.x,0)).r;
  float zd=texture(fld,uv-vec2(0,px.y)).r,zu=texture(fld,uv+vec2(0,px.y)).r;
  float g=fres.x*.045;
  vec3 N=normalize(vec3((zl-zr)*g,(zd-zu)*g,1.));
  vec3 R=reflect(vec3(0,0,-1),N);
  float fr=pow(1.-N.z,2.);
  vec3 film=.5+.5*cos(6.2831*(fr*1.6+N.x*.3+N.y*.5+hue+vec3(0.,.33,.67)));
  vec2 p=uv*view;p.y=view.y-p.y;
  float face=pow(N.z,10.);
  float glow=exp(-length((p-vec2(view.x*.58,view.y*.30))/vec2(view.x*.55,view.y*.28)));
  vec3 faceCol=vec3(.075,.075,.08)+vec3(.30,.30,.31)*glow;       // 平らな面に映る鈍い光
  vec3 liq=mix(env(R)*(.45+.8*fr),faceCol,face);
  liq+=film*smoothstep(.12,.6,1.-N.z)*.34*(.35+env(R).r);         // 油膜の虹色
  // 背景とガラス枠
  float dF=sdRR(p-view*.5,view*.5-margin,rad);
  vec3 bg=vec3(.004);
  float rim=exp(-abs(dF)/1.1)*.55+exp(-abs(dF+3.)/2.5)*.12;
  bg*=step(dF,0.);
  vec3 col=mix(bg,liq,f.b*step(dF,.5));
  col+=vec3(.75,.77,.8)*rim;
  col*=flipShade;
  o=vec4(pow(col,vec3(.92)),1.);
}`;
const P_FIELD=prog(FS_FIELD),P_SHADE=prog(FS_SHADE);

/* ---------- state ---------- */
let W=0,H=0,FW=0,FH=0,fld=null;
const MARGIN=14,RAD=38;
let th=new Float32Array(NC),vol0=1,pool=8,hue=Math.random();
let weights=[],drips=[],drops=[],rips=[];
let flipU=0,flipping=false,paused=false,t0=performance.now(),last=t0;

function resize(){
  const d=Math.min(2,devicePixelRatio||1);
  c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);
  if(innerWidth===W&&innerHeight===H&&fld)return;
  W=innerWidth;H=innerHeight;
  const s=Math.min(.7,820/Math.max(W,H));FW=Math.round(W*s);FH=Math.round(H*s);
  fld=makeTarget(FW,FH);
  if(!vol0||vol0===1)seedWorld();
}
function rnd(a,b){return a+Math.random()*(b-a)}
function seedWorld(){
  // ハートの上半分のように、中央と左右に膨らみを持つ天井
  const lobes=[[rnd(.15,.3),rnd(.25,.4)],[rnd(.55,.75),rnd(.3,.46)],[rnd(.4,.5),rnd(.12,.2)]];
  for(let i=0;i<NC;i++){
    const x=i/(NC-1);let t=H*.07;
    for(const [cx,hh] of lobes){const d=(x-cx)/.17;t+=H*hh*Math.exp(-d*d)*.75;}
    th[i]=t;
  }
  vol0=volume();pool=20;weights=[];drops=[];rips=[];drips=[];
  const n=4+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++)drips.push({x:rnd(MARGIN+30,W-MARGIN-30),len:rnd(20,Math.min(260,H*.3)),bulb:rnd(8,13),w:null,ph:Math.random()*6});
}
function volume(){let s=0;for(let i=0;i<NC;i++)s+=th[i];return s*(W-2*MARGIN)/(NC-1);}
function colOf(x){return Math.max(0,Math.min(NC-1,(x-MARGIN)/(W-2*MARGIN)*(NC-1)));}
function thickAt(x){const u=colOf(x),i=Math.floor(u),j=Math.min(NC-1,i+1);return th[i]+(th[j]-th[i])*(u-i);}
function drain(x,v){
  // xの周りから体積vを抜く
  const u=colOf(x),cw=(W-2*MARGIN)/(NC-1);let ws=0;const wv=[];
  for(let i=0;i<NC;i++){const w=Math.exp(-(((i-u)/3.2)**2));wv.push(w);ws+=w;}
  let got=0;
  for(let i=0;i<NC;i++){const n=Math.max(1,th[i]-v*wv[i]/ws/cw);got+=(th[i]-n)*cw;th[i]=n;}
  return got;
}
function fill(x,v){
  const u=colOf(x),cw=(W-2*MARGIN)/(NC-1);let ws=0;const wv=[];
  for(let i=0;i<NC;i++){const w=Math.exp(-(((i-u)/5)**2));wv.push(w);ws+=w;}
  for(let i=0;i<NC;i++)th[i]+=v*wv[i]/ws/cw;
}
addEventListener('resize',resize);resize();

/* ---------- 漏れ口 ---------- */
function leakAt(x){
  let best=null,bd=9;
  for(const w of weights){const d=Math.abs(w.x-x);if(d<bd){bd=d;best=w}}
  if(best){best.str=Math.min(4,best.str+.4);return best}
  if(weights.length>=NW){   // 漏れ口の上限。いちばん近い漏れ口に合流させる
    let n=weights[0];for(const w of weights)if(Math.abs(w.x-x)<Math.abs(n.x-x))n=w;
    n.str=Math.min(4,n.str+.4);return n}
  const w={x,str:1};weights.push(w);
  // 近くの飾りの雫があれば、それを漏れ口の雫にする
  let dr=null,dd=12;for(const q of drips){if(q.w)continue;const d=Math.abs(q.x-x);if(d<dd){dd=d;dr=q}}
  if(dr){dr.w=w;dr.x=x}else drips.push({x,len:0,bulb:5,w,ph:0});
  if(drips.length>ND){const i=drips.findIndex(q=>!q.w);drips.splice(i>=0?i:0,1)}
  return w;
}
let ptr=null;
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  if(flipping)return;
  const x=Math.max(MARGIN+6,Math.min(W-MARGIN-6,e.clientX));
  const w=leakAt(x);
  ptr={id:e.pointerId,w,lx:x};
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id||flipping)return;
  const x=Math.max(MARGIN+6,Math.min(W-MARGIN-6,e.clientX));
  // なぞった所に、細かい漏れ口を12pxおきに並べる
  while(Math.abs(x-ptr.lx)>=12){
    ptr.lx+=Math.sign(x-ptr.lx)*12;
    ptr.w=leakAt(ptr.lx);
  }
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

/* ---------- 物理 ---------- */
function sim(dt){
  if(ptr&&ptr.w)ptr.w.str=Math.min(4,ptr.w.str+dt*.9);
  // 天井の液はゆっくり横にならされる
  for(let it=0;it<3;it++){const n=th.slice();for(let i=0;i<NC;i++){const a=n[Math.max(0,i-1)],b=n[Math.min(NC-1,i+1)];th[i]=n[i]+.22*(a+b-2*n[i]);}}
  const ceilVol=volume();
  for(const q of drips){
    if(!q.w){q.ph+=dt;continue}
    const s=q.w.str,avail=Math.min(1,thickAt(q.x)/40);
    q.len+=dt*(34+30*s)*avail*(.45+q.len/110);
    q.bulb=Math.min(3.6+1.6*s,2.6+q.len*.03+.3*s);
    if(!q.max)q.max=rnd(45,Math.min(190,H*.26))*(.85+.08*s);
    if(q.len>q.max&&avail>.05){
      const root=MARGIN+thickAt(q.x);
      const v=drain(q.x,Math.PI*q.bulb*q.bulb*1.4+q.len*.9);
      drops.push({x:q.x,y:root+q.len+q.bulb*.35,r:q.bulb*1.1,vy:60+s*30,vol:v});
      if(drops.length>NP)drops.shift();
      q.len*=.25;q.max=0;
    }
  }
  const floorY=()=>H-MARGIN-pool;
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.vy+=(d.vy>=0?1100:-1100)*dt;
    d.y+=d.vy*dt;
    if(d.vy>0&&d.y+d.r>floorY()){
      pool+=d.vol/(W-2*MARGIN);
      rips.push({x:d.x,age:0,amp:Math.min(7,2+d.r*.4)});if(rips.length>NR)rips.shift();
      drops.splice(i,1);
    }else if(d.vy<0&&d.y-d.r<MARGIN+thickAt(d.x)){
      fill(d.x,d.vol);drops.splice(i,1);
    }
  }
  for(const r of rips)r.age+=dt;
  rips=rips.filter(r=>r.age<3.5);
  for(const w of weights)w.sag=1.5+w.str*1.8;
  if(ceilVol<vol0*.2&&!flipping&&drops.length<3){flipping=true;flipU=0;}
}
function finishFlip(){
  // 床が天井になる。漏れ口の位置はそのまま
  const v=pool*(W-2*MARGIN);
  const rest=volume();
  for(let i=0;i<NC;i++)th[i]=pool+Math.sin(i*.4+Math.random())*3;
  pool=Math.max(4,rest/(W-2*MARGIN));
  vol0=Math.max(v,1);
  for(const d of drops){d.y=H-d.y;d.vy=-d.vy;}
  rips=[];
  for(const q of drips){q.len=q.w?0:q.len*.5;q.max=0;}
  hue=(hue+.21)%1;
}

/* ---------- 描画 ---------- */
function render(phase,wob){
  const F=P_FIELD.u;
  gl.useProgram(P_FIELD.p);gl.bindFramebuffer(gl.FRAMEBUFFER,fld.f);gl.viewport(0,0,FW,FH);
  gl.uniform2f(F.res,FW,FH);gl.uniform2f(F.view,W,H);gl.uniform1f(F.k,phase);gl.uniform1f(F.wob,wob);
  gl.uniform1f(F.margin,MARGIN);gl.uniform1f(F.pool,pool);
  gl.uniform1f(F.flip,Math.cos(Math.PI*flipU));
  gl.uniform1fv(F.th,th);
  const dr=new Float32Array(ND*4);
  drips.slice(0,ND).forEach((q,i)=>{
    const breathe=q.w?0:Math.sin(q.ph*1.3)*3;
    dr.set([q.x,MARGIN+thickAt(q.x)-2,Math.max(0,q.len+breathe),q.bulb],i*4)});
  gl.uniform4fv(F.drip,dr);
  const fi=new Float32Array(ND);drips.slice(0,ND).forEach((q,i)=>fi[i]=q.w?1:0);gl.uniform1fv(F.fine,fi);
  const dp=new Float32Array(NP*4);
  drops.slice(-NP).forEach((d,i)=>dp.set([d.x,d.y,d.r,1+Math.min(1.2,Math.abs(d.vy)/900)],i*4));
  gl.uniform4fv(F.drop,dp);
  const rp=new Float32Array(NR*3);
  rips.forEach((r,i)=>rp.set([r.x,r.age,r.amp],i*3));gl.uniform3fv(F.rip,rp);
  const ws=new Float32Array(NW*2);
  weights.slice(0,NW).forEach((w,i)=>ws.set([w.x,w.sag||0],i*2));gl.uniform2fv(F.wsag,ws);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  const S=P_SHADE.u;
  gl.useProgram(P_SHADE.p);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,c.width,c.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,fld.t);gl.uniform1i(S.fld,0);
  gl.uniform2f(S.fres,FW,FH);gl.uniform2f(S.res,c.width,c.height);gl.uniform2f(S.view,W,H);
  gl.uniform1f(S.k,phase);gl.uniform1f(S.margin,MARGIN);gl.uniform1f(S.rad,RAD);gl.uniform1f(S.hue,hue);
  gl.uniform1f(S.flipShade,.35+.65*Math.abs(Math.cos(Math.PI*flipU)));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){
    if(flipping){
      flipU+=dt/1.6;
      if(flipU>=1){flipU=0;flipping=false;finishFlip();}
    }else sim(dt);
    render(((now-t0)/1000)*.6%(Math.PI*2),1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'tar-ceiling-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  preroll:false,
  // 雫の落下はシミュレーションなのでGIF中は止め、表面の揺れだけでループさせる
  loopFrame:function(phase){paused=true;render(phase,1.8);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      // 漏れ口を1つ、ランダムな位置に増やす + 油膜の色相を変える
      hue=Math.random();if(!flipping)leakAt(rnd(MARGIN+20,W-MARGIN-20));
    }},
    {label:'↻',name:'reset',onClick:function(){flipping=false;flipU=0;seedWorld();}}
  ]
});
</script>
</body></html>
