<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>SHATTER</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,N=70;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#050505';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let i=0;i<N;i++){let a=i*.618+p*6,r=(i/N)*S*.5,rr=8+Math.sin(p*12+i)*6,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;g.save();g.translate(x,y);g.rotate(a);g.strokeStyle=`hsla(${i*5},80%,70%,.45)`;g.strokeRect(-rr,-rr,rr*2,rr*2);g.restore()}}function mu(){N=25+Math.floor(Math.random()*120)}APKit.init({canvas:c,gifName:'shatter-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>N=70}]});draw(0)</script>
