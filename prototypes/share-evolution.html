<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SHARE EVOLUTION</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a}body{touch-action:none}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D=1;const TAU=Math.PI*2;let hue=0,beings=[];function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();
function seed(){beings=[];for(let i=0;i<7;i++)beings.push({x:W*(.15+Math.random()*.7),y:H*(.15+Math.random()*.7),a:Math.random()*TAU,r:18+Math.random()*22,m:.8+Math.random()*.7,life:0})}seed();
function draw(p=0){x.fillStyle='#03030a';x.fillRect(0,0,W,H);for(let i=beings.length-1;i>=0;i--){let b=beings[i];b.a+=.002*(1+b.m);b.life+=.003; b.x+=Math.cos(b.a)*.16*b.m;b.y+=Math.sin(b.a)*.16*b.m;if(b.x<0||b.x>W)b.a=Math.PI-b.a;if(b.y<0||b.y>H)b.a=-b.a;for(let j=i-1;j>=0;j--){let q=beings[j],dx=q.x-b.x,dy=q.y-b.y,d=Math.hypot(dx,dy);if(d<(b.r+q.r)*.72){let nx=(b.x+q.x)/2,ny=(b.y+q.y)/2;b.m+=q.m*.35;b.r=Math.min(70,Math.sqrt(b.r*b.r+q.r*q.r));b.x=nx;b.y=ny;beings.splice(j,1);i--;break}}let col=`hsla(${hue+b.m*70+b.life*30},90%,${58+b.m*12}%,.75)`;x.beginPath();x.arc(b.x,b.y,b.r*(1+.08*Math.sin(p+b.a)),0,TAU);x.strokeStyle=col;x.lineWidth=2;x.stroke();x.beginPath();x.arc(b.x,b.y,b.r*.22,0,TAU);x.fillStyle=col;x.fill()}}
function touch(px,py){if(APKit.isUI(px,py))return;let nearest=null,nd=1e9;for(let b of beings){let d=Math.hypot(b.x-px,b.y-py);if(d<nd){nd=d;nearest=b}}if(nearest&&nd<180){nearest.x=px;nearest.y=py;nearest.m*=1.9;nearest.r*=.72}else beings.push({x:px,y:py,a:Math.random()*TAU,r:14,m:1.8,life:0})}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
APKit.init({canvas:c,gifName:'share-evolution-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=Math.random()*360;beings.forEach(b=>b.a+=Math.random()*TAU)}},{label:'↻',name:'reset',onClick:seed}]});function loop(){draw(performance.now()*.00012);requestAnimationFrame(loop)}loop();
</script></body></html>
