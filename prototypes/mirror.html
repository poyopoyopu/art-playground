<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>MIRROR</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,sk=.18;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#0b0b0b';g.fillRect(0,0,W,H);for(let i=0;i<80;i++){let x=i*W/79,y=H/2+Math.sin(i*.33+p*6)*H*.25;let mx=W-x;g.beginPath();g.moveTo(x,y);g.lineTo(W/2+(x-W/2)*-1,y+Math.sin(i+ p*6)*sk*100);g.strokeStyle=`hsla(${i*4},75%,70%,.35)`;g.stroke();g.beginPath();g.arc(mx,H-y,2,0,7);g.fill()}}function mu(){sk=Math.random()*1.2}APKit.init({canvas:c,gifName:'mirror-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>sk=.18}]});draw(0)</script>
