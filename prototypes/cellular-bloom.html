<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CELLULAR BLOOM</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020704}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,cells=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=0){g.fillStyle="#020704";g.fillRect(0,0,W,H);for(let m of cells){for(let j=0;j<9;j++){let a=j*Math.PI*2/9+p*.12+m.seed,rr=m.r*(.45+.13*Math.sin(p*1.5+j)),x=m.x+Math.cos(a)*rr,y=m.y+Math.sin(a)*rr;g.beginPath();for(let k=0;k<18;k++){let aa=k*Math.PI*2/18,rad=rr*.32*(1+.18*Math.sin(aa*5+p+j));g.lineTo(x+Math.cos(aa)*rad,y+Math.sin(aa)*rad)}g.closePath();g.strokeStyle=`hsla(${100+j*28+m.seed*20},85%,65%,.2)`;g.lineWidth=1.2;g.stroke()}}}function add(x,y){if(APKit.isUI(x,y))return;cells.unshift({x,y,r:18+Math.random()*22,seed:Math.random()*6});cells=cells.slice(0,7)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'CELLULAR-BLOOM-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>cells.forEach(m=>m.seed=Math.random()*6)},{label:'↻',name:'reset',onClick:()=>cells=[]}]});(function loop(){draw(performance.now()*.00007);requestAnimationFrame(loop)})();</script></body></html>
