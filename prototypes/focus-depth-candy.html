<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH CANDY</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10050d}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: detail blooms where attention lingers. TOUCH PAINTS depth, not marks. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,last=performance.now(),f={x:0,y:0,p:.4},marks=[];
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!f.x){f.x=W/2;f.y=H/2}}addEventListener('resize',rs);rs();
function reset(){f={x:W*.5,y:H*.5,p:.3};marks=[]}reset();
function A(x,y){let v=f.p*Math.exp(-Math.hypot(x-f.x,y-f.y)/(Math.min(W,H)*.28));for(let m of marks)v+=m.p*Math.exp(-Math.hypot(x-m.x,y-m.y)/(Math.min(W,H)*.16));return v}
function cell(x,y,s,d){let a=A(x+s/2,y+s/2),th=.22+d*.11;if(d<10&&a>th&&s>3){let q=s/2;cell(x,y,q,d+1);cell(x+q,y,q,d+1);cell(x,y+q,q,d+1);cell(x+q,y+q,q,d+1);return}let h=(315+d*17+(x/W)*100+(y/H)*140)%360;let l=50+a*24;g.fillStyle=`hsla(${h},88%,${l}%,${.06+a*.20})`;g.fillRect(x,y,s-.55,s-.55);g.strokeStyle=`hsla(${h+38},100%,78%,${.14+a*.35})`;g.lineWidth=.6;g.strokeRect(x+.25,y+.25,s-.5,s-.5)}
function draw(t,dt){f.p=.3+.28*(.5+.5*Math.sin(t*.0005));for(let m of marks)m.p*=Math.pow(.22,dt);marks=marks.filter(m=>m.p>.025);g.fillStyle='#10050d';g.fillRect(0,0,W,H);cell(0,0,W,0)}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
let down=false;c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;f.x=e.clientX;f.y=e.clientY;f.p=.9});c.addEventListener('pointermove',e=>{if(down){f.x=e.clientX;f.y=e.clientY;f.p=Math.min(1,f.p+.015)}});c.addEventListener('pointerup',()=>{down=false;marks.push({x:f.x,y:f.y,p:f.p});if(marks.length>16)marks.shift()});c.addEventListener('pointercancel',()=>down=false);
APKit.init({canvas:c,gifName:'focus-depth-candy-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{f={x:W*(.5+.34*Math.cos(p*2)),y:H*(.5+.3*Math.sin(p*3)),p:.28+.55*(.5+.5*Math.sin(p*2)**2)};g.fillStyle='#10050d';g.fillRect(0,0,W,H);cell(0,0,W,0)},buttons:[{label:'✦',name:'mutate',onClick:()=>{}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
