<!DOCTYPE html>
<!-- NIGHT EXPOSURE — クロちゃん(Claude)作。2026/11/20 試作。
     題材の種: MUTEK.JP で観た Max Cooper の 3D/AV Live(透過スクリーンを前後に重ねた奥行き)。
     湾岸の夜景を3枚の透明な層に分けて重ねる。
       奥 = 対岸の街明かり・観覧車・飛行機(小さく・遅く・ぼかす)
       中 = ビル群の窓明かり・モノレール・水面の映り込み
       手前 = 高架の高速を流れる車のライト・街灯(大きく・速く・くっきり)
     世界のルール: 「触れている間だけシャッターが開く」。
       指を置いたまま=動いている車の光だけが筋になって焼き付く(止まった光は焼き付かない)。
       なぞる=視点が動き、層ごとのズレの分だけ光が焼き付く。近い光ほど長く、遠い光ほど短い。
       焼き付いた筋(いちばん手前の見えない層=フィルム)は消えない。端末に保存され、次に開いても残る。
       2本指=層の間隔が変わる(広げるほど奥の層が動かなくなり、筋の長さの差が大きくなる)。
     ✦=別の街に替える(フィルムはそのまま=多重露光)。↻=フィルムを新しくする。
     音なし・常駐テキストなし(ヒント1行だけ)。窓明かりと車の数は今の時刻で変わる。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NIGHT EXPOSURE — 触れている間だけ、夜景が焼き付く</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;
  color:#fff;font:600 15px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif;letter-spacing:.06em;
  text-shadow:0 0 8px #000,0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .8s}
#hint.on{opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">触れている間シャッターが開く・2本指で層の間隔</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var hint=document.getElementById('hint');
function mk(){return document.createElement('canvas');}
var skyC=mk(), farS=mk(), farC=mk(), midS=mk(), refC=mk(), filmC=mk();
var skyX=skyC.getContext('2d'), farSX=farS.getContext('2d'), farX=farC.getContext('2d'),
    midSX=midS.getContext('2d'), refX=refC.getContext('2d'), filmX=filmC.getContext('2d');

var DPR, W, H, U, TW;                 // 画面(css px)・基準長・層のタイル幅
var FAR_S=.4, MID_S, REF_S=.5;        // 奥/中/映り込みの解像度の倍率
var farBase, midBase, deckY;
var seed, rnd;
var camX=0, camY=0, spacing=1;
var Z_MID=1.2, Z_FAR=5;
var farL, midL, midLC, roofs, cars, lamps, train, wheel, plane;
var litRatio, carCount;
var KEY='night-exposure-v1';

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function R(a,b){return a+(b-a)*rnd();}
function mod(a,n){return((a%n)+n)%n;}
function kOf(z){return 1/(1+z*spacing);}

// 光のスプライト(放射状のにじみ)
function sprite(r,g,b,size){var c=mk();c.width=c.height=size;var x=c.getContext('2d');
  var gr=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,'rgba('+r+','+g+','+b+',.95)');
  gr.addColorStop(.45,'rgba('+r+','+g+','+b+',.28)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=gr;x.fillRect(0,0,size,size);return c;}
var SP={head:sprite(255,244,220,64), tail:sprite(255,40,30,64), lamp:sprite(255,170,70,64),
        red:sprite(255,30,20,32), warm:sprite(255,210,150,32), cool:sprite(190,215,255,32)};

// 時刻で街の明るさと車の数を決める(眺める時計として)
function byHour(){var h=new Date().getHours();
  var lr=[.30,.24,.2,.18,.18,.24,.3,.4,.45,.45,.45,.45,.45,.45,.45,.45,.5,.55,.6,.6,.58,.52,.45,.38][h];
  var cc=[10,7,5,4,4,7,12,16,16,16,16,16,16,16,16,16,18,20,20,18,16,15,14,12][h];
  litRatio=lr;carCount=cc;}

function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;U=Math.min(W,H);TW=Math.max(2*W,1.6*H);
  MID_S=Math.min(DPR,1.6);
  var land=W>H;
  farBase=H*(land?.46:.52); midBase=H*(land?.62:.65); deckY=H*(land?.75:.76);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}

function buildSky(){
  skyC.width=Math.ceil(W);skyC.height=Math.ceil(H);
  var g=skyX.createLinearGradient(0,0,0,midBase);
  g.addColorStop(0,'#040714');g.addColorStop(.45,'#0c1230');g.addColorStop(.78,'#251d3e');
  g.addColorStop(.92,'#4a2f48');g.addColorStop(1,'#5a3a48');
  skyX.fillStyle=g;skyX.fillRect(0,0,W,H);
  var r2=mulberry(seed+3);
  for(var i=0;i<160;i++){var y=r2()*farBase*.7, a=r2()*.55*(1-y/(farBase*.75));
    skyX.fillStyle='rgba(220,228,255,'+a.toFixed(3)+')';skyX.fillRect(r2()*W,y,r2()<.1?1.4:1,r2()<.1?1.4:1);}
}

// 奥の層: 対岸の街(低い解像度で描いて拡大=ぼける)
function buildFar(){
  farS.width=Math.ceil(TW*FAR_S);farS.height=Math.ceil(midBase*FAR_S+4);
  var x=farSX;x.setTransform(FAR_S,0,0,FAR_S,0,0);x.clearRect(0,0,TW,midBase+10);
  var glow=x.createLinearGradient(0,farBase-H*.12,0,farBase);
  glow.addColorStop(0,'rgba(120,80,110,0)');glow.addColorStop(1,'rgba(160,100,110,.35)');
  x.fillStyle=glow;x.fillRect(0,farBase-H*.12,TW,H*.12);
  x.fillStyle='#0b0e1d';x.fillRect(0,farBase,TW,midBase-farBase+10);   // 対岸の手前の暗い水
  farL=[];
  var bx=0;
  while(bx<TW){var w=U*R(.016,.05), h=farBase*R(.03,.13)*(rnd()<.14?2:1);
    x.fillStyle='rgb('+Math.round(R(20,30))+','+Math.round(R(24,34))+','+Math.round(R(44,58))+')';
    x.fillRect(bx,farBase-h,w+1,h+1);
    var n=Math.round(w*h/13*R(.6,1.4));
    for(var i=0;i<n;i++){var px=bx+R(1,w-1), py=farBase-R(1,h-1);
      var warm=rnd()<.7, a=R(.35,1);
      x.fillStyle=warm?'rgba(255,205,140,'+a+')':'rgba(200,220,255,'+a+')';x.fillRect(px,py,1.2,1.2);
      if(rnd()<.5)farL.push(px,py);}
    bx+=w+U*R(0,.01);}
  for(var i=0;i<TW/2.2;i++){var px=R(0,TW), py=farBase+R(-1,2.5);   // 岸の道路の灯りの帯
    x.fillStyle='rgba(255,'+Math.round(R(160,220))+',120,'+R(.4,1).toFixed(2)+')';x.fillRect(px,py,1.3,1.1);
    if(rnd()<.4)farL.push(px,py);}
  // 電波塔(格子の塔のシルエット)
  var tx=mod(camX*kOf(Z_FAR)+W*R(.12,.38),TW), th=farBase*R(.22,.32), tw=th*.18;
  x.fillStyle='#141a30';x.beginPath();x.moveTo(tx-tw,farBase);x.lineTo(tx-1.2,farBase-th);x.lineTo(tx+1.2,farBase-th);x.lineTo(tx+tw,farBase);x.fill();
  for(var j=0;j<14;j++){var f=j/13, yy=farBase-th*f, ww=tw*(1-f)+1.2;
    x.fillStyle='rgba(255,'+(j%3?150:220)+',90,.95)';x.fillRect(tx-ww,yy,1.5,1.5);x.fillRect(tx+ww-1.5,yy,1.5,1.5);
    farL.push(tx-ww,yy,tx+ww,yy);}
  x.fillStyle='rgba(255,60,40,1)';x.fillRect(tx-1,farBase-th-3,2,2);
  wheel={x:mod(camX*kOf(Z_FAR)+W*R(.6,.84),TW), r:U*R(.075,.09), a:0};
  wheel.y=farBase-wheel.r*1.12;
  plane={x:R(0,W), y:farBase*R(.22,.45), v:U*R(.012,.02)*(rnd()<.5?1:-1)};
  if(farL.length>1800){var s=[],st=farL.length/1800|0;st=st*2;for(var i=0;i<farL.length;i+=st)s.push(farL[i],farL[i+1]);farL=s;}
  farL=new Float32Array(farL);
}

// 中の層: ビル群と窓明かり(タイルとして横につながる)
function buildMid(){
  midS.width=Math.ceil(TW*MID_S);midS.height=Math.ceil(midBase*MID_S+2);
  var x=midSX;x.setTransform(MID_S,0,0,MID_S,0,0);x.clearRect(0,0,TW,midBase+4);
  var ml=[], mc=[];roofs=[];
  var cw=Math.max(2,U*.0072), chh=cw*1.35, gx=cw*.8, gy=chh*.65;
  var bx=R(0,U*.05);
  function building(bx,w,h,tone,lit){
    for(var rep=0;rep<2;rep++){var ox=bx-rep*TW; if(rep===1&&bx+w<TW)break;
      var g=x.createLinearGradient(0,midBase-h,0,midBase);g.addColorStop(0,'#0d1222');g.addColorStop(1,'#080b16');
      x.fillStyle=g;x.fillRect(ox,midBase-h,w,h+1);
      x.fillStyle='rgba(120,110,150,.18)';x.fillRect(ox,midBase-h,1,h);}
    var cols=Math.floor((w-cw)/(cw+gx)), rows=Math.floor((h-chh*2)/(chh+gy));
    var x0=bx+(w-cols*(cw+gx)+gx)/2;
    for(var r=0;r<rows;r++){var band=rnd()<.15?0:1;
      for(var c=0;c<cols;c++){
        if(band&&rnd()<lit){var px=x0+c*(cw+gx), py=midBase-h+chh+r*(chh+gy), a=R(.45,1);
          var col=tone?'rgba(195,218,255,'+a+')':'rgba(255,'+Math.round(R(185,215))+','+Math.round(R(115,160))+','+a+')';
          x.fillStyle=col;x.fillRect(px,py,cw,chh);if(px+cw>TW){x.fillRect(px-TW,py,cw,chh);}
          ml.push(mod(px+cw/2,TW),py+chh/2);mc.push(tone);}
        else if(rnd()<.25){x.fillStyle='rgba(60,70,100,.25)';x.fillRect(x0+c*(cw+gx),midBase-h+chh+r*(chh+gy),cw,chh);}
      }}
    if(rnd()<.55){roofs.push(mod(bx+w/2,TW),midBase-h-U*.012,rnd()*6.28);
      x.fillStyle='#0d1222';x.fillRect(bx+w/2-.6,midBase-h-U*.012,1.2,U*.012);}
  }
  while(bx<TW){var w=U*R(.07,.16), h=midBase*R(.12,.40)*(rnd()<.18?1.6:1);
    var tone=rnd()<.35?1:0, lit=litRatio*R(.4,1.6)*(rnd()<.15?.25:1);
    building(bx,w,Math.min(h,midBase*.82),tone,Math.min(.95,lit));
    bx+=w+U*(rnd()<.22?R(.08,.16):R(.006,.035));}
  // モノレールの高架
  var ty=midBase-U*.05;
  x.fillStyle='#0a0d18';x.fillRect(0,ty,TW,U*.012);
  for(var p=R(0,U*.2);p<TW;p+=U*R(.18,.26))x.fillRect(p,ty,U*.012,midBase-ty);
  train={y:ty-U*.026, h:U*.024, cl:U*.11, n:6, x:R(0,TW), v:U*.075};
  midL=new Float32Array(ml);midLC=new Uint8Array(mc);
}

function buildNear(){
  cars=[];var L=3*W;
  var n=carCount;
  for(var i=0;i<n;i++){var lane=i%2;
    cars.push({lane:lane, x:R(0,L), v:(lane?-1:1)*U*R(.75,1.05), truck:rnd()<.15, px:null, py:null});}
  lamps=[];var sp=Math.max(U*.42,140);
  for(var p=0;p<L;p+=sp)lamps.push(p);
}

function build(){byHour();rnd=mulberry(seed);buildSky();buildFar();buildMid();buildNear();
  farC.width=Math.ceil(W*FAR_S);farC.height=Math.ceil(midBase*FAR_S+4);
  refC.width=Math.ceil(W*REF_S);refC.height=Math.ceil(midBase*REF_S+2);}

// フィルム(いちばん手前の見えない層)
function sizeFilm(){
  var old=null;
  if(filmC.width){old=mk();old.width=filmC.width;old.height=filmC.height;old.getContext('2d').drawImage(filmC,0,0);}
  filmC.width=Math.ceil(W);filmC.height=Math.ceil(H);
  if(old)coverDraw(old);
}
function coverDraw(img){var iw=img.width,ih=img.height,s=Math.max(W/iw,H/ih);
  filmX.save();filmX.globalCompositeOperation='lighter';
  filmX.drawImage(img,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s);filmX.restore();}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({seed:seed,camX:camX,camY:camY,spacing:spacing}));
  localStorage.setItem(KEY+'-film',filmC.toDataURL('image/png'));}catch(e){}}
var saveT=0;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveState,400);}
function loadState(){
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){seed=s.seed|0;camX=+s.camX||0;camY=+s.camY||0;spacing=+s.spacing||1;}
    var f=localStorage.getItem(KEY+'-film');
    if(f){var im=new Image();im.onload=function(){coverDraw(im);};im.src=f;}
  }catch(e){}
}

// 露光: 線分を色ごとにまとめて1回で引く
var groups={
  far:{c:'rgba(255,215,170,.10)',w:.8,p:[]}, wheel:{c:'rgba(255,170,230,.16)',w:1,p:[]},
  midW:{c:'rgba(255,200,140,.12)',w:1.1,p:[]}, midC:{c:'rgba(185,212,255,.12)',w:1.1,p:[]},
  midR:{c:'rgba(255,60,40,.22)',w:1.2,p:[]}, train:{c:'rgba(225,235,255,.16)',w:1.4,p:[]},
  head:{c:'rgba(255,240,215,.13)',w:2.4,p:[]}, tail:{c:'rgba(255,45,35,.16)',w:1.9,p:[]},
  lamp:{c:'rgba(255,165,70,.16)',w:2.6,p:[]}
};
function seg(g,x0,y0,x1,y1){if(x1<-20&&x0<-20||x1>W+20&&x0>W+20)return;groups[g].p.push(x0,y0,x1,y1);}
function flushFilm(){
  filmX.save();filmX.globalCompositeOperation='lighter';filmX.lineCap='round';
  for(var k in groups){var g=groups[k],p=g.p;if(!p.length)continue;
    filmX.strokeStyle=g.c;filmX.lineWidth=g.w;filmX.beginPath();
    for(var i=0;i<p.length;i+=4){var x0=p[i],y0=p[i+1],x1=p[i+2],y1=p[i+3];
      if(Math.abs(x1-x0)+Math.abs(y1-y0)<.35){x1+=.35;}
      filmX.moveTo(x0,y0);filmX.lineTo(x1,y1);}
    filmX.stroke();g.p.length=0;}
  filmX.restore();
}

// 入力
var ptrs={}, nP=0, shutter=false, pinch0=0, sp0=1, mid0=null, frameA=0, gestCam=[0,0];
function pts(){var a=[];for(var k in ptrs)a.push(ptrs[k]);return a;}
cv.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};nP++;shutter=true;hint.classList.remove('on');
  if(nP===1){gestCam=[camX,camY];}
  if(nP===2){var a=pts();pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);sp0=spacing;mid0={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
});
cv.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;
  if(nP===1){camX-=e.clientX-p.x;camY-=(e.clientY-p.y)*.5;}
  p.x=e.clientX;p.y=e.clientY;
  if(nP>=2){var a=pts(), d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch0>10)spacing=Math.max(.25,Math.min(3.2,sp0*Math.pow(d/pinch0,1.4)));
    var m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};camX-=m.x-mid0.x;camY-=(m.y-mid0.y)*.5;mid0=m;}
  camY=Math.max(-H*.05,Math.min(H*.05,camY));
});
function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];nP=Math.max(0,nP-1);
  if(nP===1){var a=pts();mid0=null;}
  if(nP===0){shutter=false;saveSoon();}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// 描画
var t=0, last=performance.now(), pCamX=camX, pCamY=camY, pSp=spacing;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  var kM=kOf(Z_MID), kF=kOf(Z_FAR), pkM=1/(1+Z_MID*pSp), pkF=1/(1+Z_FAR*pSp);
  var c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.globalCompositeOperation='source-over';c.globalAlpha=1;
  c.drawImage(skyC,0,0,W,H);

  // 奥
  var fOx=mod(camX*kF,TW), fOy=-camY*kF;
  var fx=farX;fx.setTransform(1,0,0,1,0,0);fx.clearRect(0,0,farC.width,farC.height);
  fx.drawImage(farS,-fOx*FAR_S,fOy*FAR_S);fx.drawImage(farS,(TW-fOx)*FAR_S,fOy*FAR_S);
  fx.setTransform(FAR_S,0,0,FAR_S,0,0);
  wheel.a+=dt*.06;
  var wx=mod(wheel.x-camX*kF,TW), wy=wheel.y+fOy;
  if(wx>W+wheel.r*2)wx-=TW;
  fx.strokeStyle='rgba(40,50,80,.9)';fx.lineWidth=1;fx.beginPath();fx.moveTo(wx-wheel.r*.5,farBase+fOy);fx.lineTo(wx,wy);fx.lineTo(wx+wheel.r*.5,farBase+fOy);fx.stroke();
  for(var i=0;i<36;i++){var a=wheel.a+i/36*6.2832, lx=wx+Math.cos(a)*wheel.r, ly=wy+Math.sin(a)*wheel.r;
    var hue=(i*10+t*40)%360;fx.fillStyle='hsl('+hue+',90%,'+(62+Math.sin(t*2+i)*14)+'%)';fx.fillRect(lx-.9,ly-.9,1.8,1.8);
    if(i%6===0){fx.fillStyle='rgba(255,240,220,.35)';fx.fillRect((wx+lx)/2-.5,(wy+ly)/2-.5,1,1);}}
  plane.x+=plane.v*dt;if(plane.x>W+40)plane.x=-40;if(plane.x<-40)plane.x=W+40;
  var pxs=plane.x-camX*kF*.6;pxs=mod(pxs+40,W+80)-40;
  if((t*1.1)%1<.12){fx.fillStyle='#fff';fx.fillRect(pxs,plane.y+fOy,1.6,1.6);}
  fx.fillStyle='rgba(255,60,50,'+((t*.9)%1<.5?.9:.2)+')';fx.fillRect(pxs+2,plane.y+fOy,1.2,1.2);
  for(var i=0;i<140;i++){var j=((i*7919+Math.floor(t*3+i*.37)*104729)%(farL.length/2))|0;   // きらめき
    var lx=mod(farL[j*2]-camX*kF,TW), ly=farL[j*2+1]+fOy;if(lx>W)continue;
    var a=.5+.5*Math.sin(t*5+i);fx.fillStyle='rgba(255,236,200,'+(a*.8).toFixed(2)+')';fx.fillRect(lx-.5,ly-.5,1.6,1.6);}
  c.imageSmoothingEnabled=true;
  c.drawImage(farC,0,0,farC.width/FAR_S,farC.height/FAR_S);

  // 中
  var mOx=mod(camX*kM,TW), mOy=-camY*kM, sw=W*MID_S;
  function midBlit(ctx2,scale,oy){
    var sx=mOx*MID_S, w1=Math.min(sw,midS.width-sx);
    ctx2.drawImage(midS,sx,0,w1,midS.height,0,oy,w1/MID_S*scale,midS.height/MID_S*scale);
    if(w1<sw)ctx2.drawImage(midS,0,0,sw-w1,midS.height,w1/MID_S*scale,oy,(sw-w1)/MID_S*scale,midS.height/MID_S*scale);}
  midBlit(c,1,mOy);
  var blink=(t%1.6)<.8;
  for(var i=0;i<roofs.length;i+=3){var rx=mod(roofs[i]-camX*kM,TW);if(rx>W+8)continue;
    var a=blink?1:.15;c.globalAlpha=a;c.drawImage(SP.red,rx-5,roofs[i+1]+mOy-5,10,10);}
  c.globalAlpha=1;
  // 窓のきらめき
  var nW=midL.length/2;
  for(var i=0;i<60&&nW;i++){var j=((i*15485863+Math.floor(t*2.2+i*.61)*7919)%nW)|0;
    var lx=mod(midL[j*2]-camX*kM,TW);if(lx>W)continue;var a=Math.max(0,Math.sin(t*3.3+i*1.7));
    c.globalAlpha=a*.7;c.drawImage(midLC[j]?SP.cool:SP.warm,lx-4,midL[j*2+1]+mOy-4,8,8);}
  c.globalAlpha=1;
  // モノレール
  train.x=mod(train.x+train.v*dt,TW);
  for(var k=0;k<train.n;k++){var tx0=mod(train.x-k*(train.cl+2)-camX*kM,TW);if(tx0>W+train.cl)tx0-=TW;
    if(tx0<-train.cl||tx0>W)continue;var ty=train.y+mOy;
    c.fillStyle='#1a2034';c.fillRect(tx0,ty,train.cl,train.h);
    c.fillStyle='rgba(225,236,255,.92)';var ww=train.cl/7;
    for(var q=0;q<6;q++)c.fillRect(tx0+ww*(q+.6),ty+train.h*.25,ww*.62,train.h*.38);}

  // 水面(中の層の映り込み)
  var wTop=midBase+mOy, wBot=deckY-camY;
  c.fillStyle='#050812';c.fillRect(0,wTop,W,wBot-wTop+2);
  var rx2=refX;rx2.setTransform(1,0,0,1,0,0);rx2.clearRect(0,0,refC.width,refC.height);
  midBlit(rx2,REF_S,0);
  var bandH=wBot-wTop;
  for(var y=0;y<bandH;y+=2){var srcY=(midBase-1-y*1.18);if(srcY<0)break;
    var f=y/bandH, dx=Math.sin(y*.23+t*1.2)*(.6+y*.035)+Math.sin(y*.05-t*.5)*1.5;
    c.globalAlpha=.5*(1-f)*(1-f)+.04;
    c.drawImage(refC,0,srcY*REF_S,refC.width,1,dx,wTop+y,W,2.2);}
  c.globalAlpha=1;
  for(var i=0;i<90;i++){var hx=((i*2654435761)>>>0)%1000/1000, hy=((i*40503+7)>>>0)%997/997;   // 水面のきらめき
    var a=Math.sin(t*2.6+i*2.1);if(a<.55)continue;
    c.fillStyle='rgba(255,220,180,'+((a-.55)*.9).toFixed(2)+')';c.fillRect(hx*W,wTop+bandH*(.05+hy*.9),2+hy*5,1);}

  // 手前: 高架の高速
  var dY=deckY-camY, L=3*W;
  c.fillStyle='#07080e';c.fillRect(0,dY,W,H-dY+2);
  var RD=U*.15;c.fillStyle='#10121b';c.fillRect(0,dY,W,RD);
  var dash=U*.12, off=mod(camX,dash*2);
  c.fillStyle='rgba(200,200,210,.22)';
  for(var x=-off;x<W;x+=dash*2)c.fillRect(x,dY+RD*.52,dash,2);
  c.fillStyle='#161925';c.fillRect(0,dY+RD,W,U*.04);   // 防音壁の上端
  c.fillStyle='rgba(160,170,200,.35)';c.fillRect(0,dY+RD,W,1);
  var pier=U*.55, poff=mod(camX,pier);c.fillStyle='#0b0c14';
  for(var x=-poff;x<W+pier;x+=pier)c.fillRect(x-U*.025,dY+RD+U*.04,U*.05,H);
  // 街灯
  var lampH=U*.17;
  for(var i=0;i<lamps.length;i++){var lx=mod(lamps[i]-camX,L);if(lx>W+30)continue;
    c.fillStyle='#14161f';c.fillRect(lx-1.2,dY-lampH,2.4,lampH);c.fillRect(lx-1.2,dY-lampH,U*.03,2);
    c.drawImage(SP.lamp,lx+U*.03-22,dY-lampH-18,44,44);
    c.globalAlpha=.25;c.drawImage(SP.lamp,lx-30,dY-8,60,30);c.globalAlpha=1;}
  // 車
  for(var i=0;i<cars.length;i++){var car=cars[i];car.x=mod(car.x+car.v*dt,L);
    var sx=mod(car.x-camX,L)-60, lane=car.lane;
    var sy=dY+(lane?U*.04:U*.105), s=lane?.85:1.5, gap=U*(lane?.026:.042);
    car.sx=sx;car.sy=sy;
    if(sx<-80||sx>W+80){car.px=null;continue;}
    var spr=lane?SP.tail:SP.head, z=U*.055*s;
    c.globalCompositeOperation='lighter';
    c.drawImage(spr,sx-z/2,sy-z/2,z,z);c.drawImage(spr,sx+gap-z/2,sy-z/2,z,z);
    if(!lane){c.globalAlpha=.35;c.drawImage(spr,sx+gap/2-z*1.6,sy-z*.35,z*3.2,z*.7);c.globalAlpha=1;}
    if(car.truck){for(var q=1;q<5;q++){c.globalAlpha=.8;c.drawImage(SP.lamp,sx+(lane?gap+q*U*.04:-q*U*.04)-6,sy-U*.016-6,12,12);}c.globalAlpha=1;}
    c.globalCompositeOperation='source-over';}

  // 透明なスクリーンのふち(触っている間だけ見える)
  frameA+=((shutter?1:0)-frameA)*Math.min(1,dt*(shutter?6:1.5));
  if(frameA>.01){var zs=[0,Z_MID,Z_FAR];
    for(var q=0;q<3;q++){var k=kOf(zs[q]), sc=1/(1+zs[q]*spacing*.05), m=U*.05;
      var ox=-(camX-gestCam[0])*k*.15, oy=-(camY-gestCam[1])*k*.15;
      var ww=(W-2*m)*sc, hh=(H-2*m)*sc;
      c.strokeStyle='rgba(190,215,255,'+(frameA*(.32-q*.08)).toFixed(3)+')';c.lineWidth=1;
      c.strokeRect(W/2-ww/2+ox,H/2-hh/2+oy,ww,hh);}}

  // 露光(シャッターが開いている間)
  if(shutter){
    var dCx=camX-pCamX, dCy=camY-pCamY, moved=Math.abs(dCx)+Math.abs(dCy)>.05||Math.abs(spacing-pSp)>.001;
    if(moved){
      var n=farL.length/2, st=Math.max(1,(n/700)|0);
      for(var i=0;i<n;i+=st){var wx0=farL[i*2], y=farL[i*2+1];
        var x1=mod(wx0-camX*kF,TW), x0=x1+(camX*kF-pCamX*pkF);if(x1>W+10&&x0>W+10)continue;
        seg('far',x0,y+pCamY*-pkF,x1,y-camY*kF);}
      for(var i=0;i<36;i+=2){var a=wheel.a+i/36*6.2832, lx=mod(wheel.x-camX*kF,TW)+Math.cos(a)*wheel.r, ly=wheel.y+Math.sin(a)*wheel.r;
        seg('wheel',lx+(camX*kF-pCamX*pkF),ly-pCamY*pkF,lx,ly-camY*kF);}
      var nm=midL.length/2, sm=Math.max(1,(nm/900)|0);
      for(var i=0;i<nm;i+=sm){var x1=mod(midL[i*2]-camX*kM,TW);if(x1>W+10)continue;
        var x0=x1+(camX*kM-pCamX*pkM), y=midL[i*2+1];
        seg(midLC[i]?'midC':'midW',x0,y-pCamY*pkM,x1,y-camY*kM);}
      for(var i=0;i<roofs.length;i+=3){var x1=mod(roofs[i]-camX*kM,TW);if(x1>W+10)continue;
        seg('midR',x1+(camX*kM-pCamX*pkM),roofs[i+1]-pCamY*pkM,x1,roofs[i+1]-camY*kM);}
      for(var i=0;i<lamps.length;i++){var x1=mod(lamps[i]-camX,L);if(x1>W+30)continue;
        seg('lamp',x1+U*.03+dCx,dY-lampH-1+dCy,x1+U*.03,dY-lampH-1);}
    }
    // 動く光(車・モノレール)は止まっていても筋になる
    for(var i=0;i<cars.length;i++){var car=cars[i];if(car.px==null||car.sx<-80||car.sx>W+80)continue;
      var gap=U*(car.lane?.026:.042);var g=car.lane?'tail':'head';
      if(Math.abs(car.sx-car.px)<W*.5){seg(g,car.px,car.py,car.sx,car.sy);seg(g,car.px+gap,car.py,car.sx+gap,car.sy);}}
    var ty=train.y+train.h*.45;
    for(var k=0;k<train.n;k++){var tx0=mod(train.x-k*(train.cl+2)-camX*kM,TW);if(tx0>W+train.cl)tx0-=TW;if(tx0<-train.cl||tx0>W)continue;
      var d=train.v*dt-(camX*kM-pCamX*pkM);
      for(var q=0;q<6;q+=2){var qx=tx0+train.cl/7*(q+.9);seg('train',qx-d,ty-camY*kM+(camY*kM-pCamY*pkM),qx,ty-camY*kM);}}
    flushFilm();
  }
  for(var i=0;i<cars.length;i++){var car=cars[i];car.px=car.sx;car.py=car.sy;}
  pCamX=camX;pCamY=camY;pSp=spacing;

  c.globalCompositeOperation='lighter';c.drawImage(filmC,0,0,W,H);c.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}

function setup(){layout();build();sizeFilm();}
seed=(Math.random()*1e9)|0;
loadState();
setup();
addEventListener('resize',function(){clearTimeout(setup.t);setup.t=setTimeout(setup,120);});
document.addEventListener('visibilitychange',function(){if(document.hidden)saveState();});
requestAnimationFrame(function(n){last=n;frame(n);});
hint.classList.add('on');setTimeout(function(){hint.classList.remove('on');},8000);

APKit.init({
  canvas:cv, gifName:'night-exposure-loop', clockFormat:'spec',
  dock:true, autoHide:true, fullscreenButton:false,
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){seed=(seed+7919)|0;build();saveSoon();}},   // 別の街に替える(フィルムは残る=多重露光)
    {label:'↻',name:'reset',onClick:function(){filmX.clearRect(0,0,filmC.width,filmC.height);spacing=1;saveSoon();}}   // フィルムを新しくする
  ]
});
})();
</script>
