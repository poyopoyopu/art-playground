<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GLASS TOPOLOGY</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,tears=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function P(i,j,T){let gx=i*28,gy=j*28,xx=gx+18*Math.sin(gy*.018+T*.12)+10*Math.sin(gx*.031-gy*.012),yy=gy+14*Math.cos(gx*.021+T*.09)+8*Math.sin(gy*.027);for(const q of tears){let dx=xx-q.x,dy=yy-q.y,r=Math.hypot(dx,dy),k=Math.max(0,1-r/q.r);xx+=dx*k*.7;yy+=dy*k*.7}return[xx,yy]}function draw(T=t){x.fillStyle='#05070a';x.fillRect(0,0,W,H);let nx=Math.ceil(W/28)+1,ny=Math.ceil(H/28)+1;for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){let a=P(i,j,T),b=P(i+1,j,T),q=P(i+1,j+1,T),e=P(i,j+1,T),cx=(a[0]+b[0]+q[0]+e[0])/4,cy=(a[1]+b[1]+q[1]+e[1])/4;if(tears.some(z=>Math.hypot(cx-z.x,cy-z.y)<z.r*.72))continue;let h=(i*13+j*7+seed*80+T*4)%360;x.beginPath();x.moveTo(...a);x.lineTo(...b);x.lineTo(...q);x.lineTo(...e);x.closePath();x.fillStyle=`hsla(${h},65%,${30+20*Math.sin(i+j)}%,.42)`;x.fill();x.strokeStyle=`hsla(${h+35},90%,75%,.5)`;x.stroke()}}function touch(px,py){tears.push({x:px,y:py,r:50+Math.random()*90});if(tears.length>8)tears.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'glass-topology-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;tears=[]}},{label:'↻',name:'reset',onClick:()=>tears=[]}]});</script></body></html>
