<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS PINCH MINT</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02100e}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* TOUCH LAW: TWO FINGERS pinch/spread the radius of attention; the world is compressed or released. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=6.283185;let W,H,D,pointers=new Map(),dreams=[],mem=[],seed=41,last=performance.now(),hue=.42,sens=1,pinch=null;
function sz(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();function r(){let z=Math.sin(seed++*37.7)*43758.5;return z-Math.floor(z)}function reset(){seed=41;dreams=[];mem=[];for(let i=0;i<5;i++)dreams.push({x:W*(.1+.8*r()),y:H*(.1+.8*r()),q:.7+r(),b:performance.now()+i*650,d:3600+r()*3200,rad:Math.min(W,H)*(.14+r()*.2)})}reset();
function src(t){let a=[];for(let i=dreams.length-1;i>=0;i--){let z=dreams[i],u=(t-z.b)/z.d;if(u>=1){dreams.splice(i,1);continue}if(u<0)continue;let e=Math.sin(Math.PI*u);a.push({x:z.x+Math.sin(t*.00018+i)*8,y:z.y+Math.cos(t*.0002+i)*8,s:z.q*e,rad:z.rad})}for(let m of mem)a.push(m);if(pinch)a.push({x:pinch.cx,y:pinch.cy,s:1.8,rad:pinch.rad});return a}function at(px,py,a){let v=0;for(let z of a)v+=z.s*Math.exp(-Math.hypot(px-z.x,py-z.y)/z.rad);return v}function cell(px,py,w,d,a){let q=at(px+w/2,py+w/2,a),th=(.31+d*.19)/sens;if(d<7&&w>10&&q>th){let k=w/2;cell(px,py,k,d+1,a);cell(px+k,py,k,d+1,a);cell(px,py+k,k,d+1,a);cell(px+k,py+k,k,d+1,a)}else{let hh=(hue+d*.03+(px/W)*.06)%1;g.strokeStyle=`hsla(${150+hh*80},85%,66%,${.07+q*.25})`;g.lineWidth=.7;g.strokeRect(px+.5,py+.5,w-1,w-1)}}function draw(t,dt){for(let i=mem.length-1;i>=0;i--){mem[i].s*=Math.pow(.08,dt);if(mem[i].s<.025)mem.splice(i,1)}g.fillStyle='#02100e';g.fillRect(0,0,W,H);cell(0,0,W,0,src(t))}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function updatePinch(){let a=[...pointers.values()];if(a.length<2){pinch=null;return}let A=a[0],B=a[1];pinch={cx:(A.x+B.x)/2,cy:(A.y+B.y)/2,rad:Math.max(25,Math.hypot(A.x-B.x,A.y-B.y)*1.8)}}c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);updatePinch()});c.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId)){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});updatePinch()}});function up(e){pointers.delete(e.pointerId);updatePinch();if(!pinch)mem.push({x:e.clientX,y:e.clientY,s:.8,rad:Math.min(W,H)*.16})}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
APKit.init({canvas:c,gifName:'focus-pinch-mint-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{let z={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.28*Math.sin(p*2)),s:1.55,rad:Math.min(W,H)*(.18+.10*(.5+.5*Math.sin(p)))};g.fillStyle='#02100e';g.fillRect(0,0,W,H);cell(0,0,W,0,[z])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=.34+Math.random()*.18;sens=.8+Math.random()*.4}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
