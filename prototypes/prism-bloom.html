<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRISM BLOOM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* PRISM BLOOM — ChatGPT作。ap-kit.js統合: ChatGPT */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl)throw new Error('WebGL2 unavailable');
const vs=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}
`;
const fs=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 R;uniform float P,H,S;uniform vec4 M[8];

vec3 hsv(vec3 c){
 vec3 p=abs(fract(c.xxx+vec3(0.,.6666667,.3333333))*6.-3.);
 return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);
}

float petal(vec2 p,float n,float scale,float phase,out float edge,out float innerLine){
 vec2 q=p/scale;
 float r=length(q),a=atan(q.y,q.x);
 float sector=6.2831853/n;
 float local=mod(a+phase+sector*.5+3.14159265,sector)-sector*.5;
 float y=r*sin(local);
 float x=r*cos(local);

 // A filled teardrop: narrow at the base and tip, widest through the middle.
 float t=clamp(x/.58,0.,1.);
 float width=.20*pow(max(0.,sin(3.14159265*t)),.68);
 float inside=1.0-smoothstep(width-.018,width+.006,abs(y));
 float front=smoothstep(.025,.070,x);
 float back=1.0-smoothstep(.555,.595,x);
 float shape=inside*front*back;

 // Thin glass rim follows the actual petal boundary.
 float rim=1.0-smoothstep(.004,.018,abs(abs(y)-width));
 edge=rim*front*back;
 innerLine=1.0-smoothstep(.010,.030,abs(x-.055));
 return shape;
}

void main(){
 vec2 p=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
 for(int i=0;i<8;i++){
  float d=length(p-M[i].xy);
  float w=exp(-d*d/(.025+.10*M[i].w));
  p+=normalize(p-M[i].xy+.0001)*w*M[i].z*.055*sin(P*.5+float(i));
 }
 vec3 bg=vec3(.94,.955,.985);
 vec3 col=bg;
 for(int g=0;g<2;g++){
  float G=float(g);
  float scale=1.0-G*.24;
  float edge,base;
  float shape=petal(p,6.0,scale,P*.045+G*.5236,edge,base);
  float r=length(p/scale);
  float a=atan(p.y,p.x);
  float hue=fract(H+a/6.2831853*.22+G*.14+r*.10+P*.003);
  vec3 c=hsv(vec3(hue,.72,.94));
  vec3 ca=hsv(vec3(fract(hue+.10),.58,.98));
  col=mix(col,c,shape*(.44-.055*G));
  col+=ca*edge*(.34-.045*G);
  col+=c*base*.10;
  float e2,b2;
  float innerShape=petal(p,6.0,scale*.70,P*.045+G*.5236+.26,e2,b2);
  vec3 ci=hsv(vec3(fract(hue+.20),.55,.98));
  col=mix(col,ci,innerShape*.14);
  col+=ci*e2*.16;
 }
 float r=length(p),a=atan(p.y,p.x);
 float core=1.0-smoothstep(.02,.14,r);
 float coreRing=1.0-smoothstep(.004,.016,abs(r-.105));
 vec3 ca=hsv(vec3(fract(H+.08+P*.01),.64,.98));
 vec3 cb=hsv(vec3(fract(H+.30),.52,.98));
 col=mix(col,ca,core*.18);
 col+=cb*coreRing*.32;
 float facets=.5+.5*cos(S*a*1.5+P*.32+r*28.);
 col+=hsv(vec3(fract(H+.52*facets+r*.16),.46,.98))*.055*facets*(1.-smoothstep(.25,.70,r));
 float shine=pow(max(0.,cos(a*2.0+P*.22)),20.)*(1.-smoothstep(.15,.68,r));
 col+=vec3(1.)*shine*.045;
 o=vec4(clamp(col,0.,1.),1.);
}
`

function sh(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
let pos=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);
let uR=gl.getUniformLocation(pr,'R'),uP=gl.getUniformLocation(pr,'P'),uH=gl.getUniformLocation(pr,'H'),uS=gl.getUniformLocation(pr,'S'),uM=gl.getUniformLocation(pr,'M[0]');
const marks=Array.from({length:8},()=>[0,0,0,1]);let sym=6,hue=.02;const PERIOD=9;
function resize(){let d=Math.min(devicePixelRatio||1,2),w=innerWidth*d,h=innerHeight*d;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}addEventListener('resize',resize,{passive:true});resize();
function draw(ph){gl.useProgram(pr);gl.uniform2f(uR,canvas.width,canvas.height);gl.uniform1f(uP,ph);gl.uniform1f(uH,hue);gl.uniform1f(uS,sym);gl.uniform4fv(uM,new Float32Array(marks.flat()));gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
function loop(t){let ph=(t/1000%PERIOD)/PERIOD*6.28318530718;marks.forEach(m=>m[3]=Math.min(1,m[3]+.002));draw(ph);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function touch(x,y){let q=canvas.getBoundingClientRect();marks.unshift([(x-q.left)/q.width*2-1,1-(y-q.top)/q.height*2-.0,.9,.05]);marks.pop()}
canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;touch(e.clientX,e.clientY)});
canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY)});
function mutate(){sym=[5,6,7,8][Math.floor(Math.random()*4)];hue=Math.random();marks.forEach(m=>m[2]=.45+Math.random()*.65)}
function reset(){marks.forEach(m=>{m[0]=0;m[1]=0;m[2]=0;m[3]=1});sym=7;hue=.02}
APKit.init({canvas:canvas,gifName:'prism-bloom-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script>
</body>
</html>
