<!-- POLAR FOLD — ChatGPT作。第3構成。閉じた輪を廃し、画面を横断する一枚の連続膜として再構成。ap-kit.js統合: ChatGPT -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f5;touch-action:none}
canvas{display:block;width:100%;height:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";

const c=document.getElementById("c"),ctx=c.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
let W=0,H=0,D=1,S=1,t0=performance.now();
let seed=Math.random()*10000,hue=Math.random()*360;
let creases=[],finger=null;

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;S=Math.min(W,H);
  c.width=Math.round(W*D);c.height=Math.round(H*D);
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize,{passive:true});resize();

function rnd(a,b){return a+Math.random()*(b-a)}

function reset(){
  seed=Math.random()*10000;
  hue=rnd(0,360);
  creases=[];
}
function mutate(){
  seed=Math.random()*10000;
  hue=rnd(0,360);
  creases=[];
}

/*
 WORLD RULE:
 一本の膜しか存在しない。
 その膜には表裏がなく、折れた場所だけが色を圧縮する。
 膜は画面の外から入り、画面の外へ抜ける。
 だから「輪」にはならない。
 触れた場所は永久的な折り癖になる。
*/

function addCrease(x,y){
  const px=(x-W*.5)/S,py=(y-H*.5)/S;
  creases.push({
    x:px,y:py,
    a:Math.atan2(py,px)+rnd(-1.2,1.2),
    r:rnd(.08,.18),
    p:rnd(.16,.38),
    phase:rnd(0,TAU)
  });
  if(creases.length>7)creases.shift();
}

c.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  finger={id:e.pointerId,x:e.clientX,y:e.clientY};
  c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  addCrease(e.clientX,e.clientY);
},{passive:false});

c.addEventListener("pointermove",e=>{
  if(!finger||finger.id!==e.pointerId)return;
  e.preventDefault();
  const dx=e.clientX-finger.x,dy=e.clientY-finger.y;
  if(dx*dx+dy*dy>1100)addCrease(e.clientX,e.clientY);
  finger.x=e.clientX;finger.y=e.clientY;
},{passive:false});

function release(e){
  if(finger&&finger.id===e.pointerId)finger=null;
}
c.addEventListener("pointerup",release);
c.addEventListener("pointercancel",release);

/* 一本の膜の中心線。
   x方向に進みながら、複数の長い折りを通過する。 */
function foldEvent(u,time,index){
  /* 3つの折り目が同じ世界を巡回する。周期はすべて整数。 */
  const speeds=[1,2,3];
  const base=[0.08,0.42,0.76][index];
  const center=(base+time*speeds[index]/TAU)%1;
  let d=u-center;
  if(d>.5)d-=1;if(d<-.5)d+=1;
  const width=[.075,.055,.09][index];
  const g=Math.exp(-(d*d)/(width*width));
  const wave=Math.sin(time*(index+2)+index*1.7);
  return {center,d,g,wave};
}

function centerAt(u,time){
  /* 一本の膜。ただし折り目ではx方向も圧縮され、自己交差が起きる。 */
  let x=-1.78+u*3.56;
  let y=
    .12*Math.sin(u*TAU*2+time)+
    .09*Math.sin(u*TAU*5-time*2)+
    .045*Math.sin(u*TAU*9+time*3);

  let energy=0;

  for(let k=0;k<3;k++){
    const f=foldEvent(u,time,k);
    const s=[1,-1,1][k];
    const a=[.56,.43,.62][k];

    /* 折り目が膜を前後へ押し出す */
    y+=s*a*f.g*(.42+.58*Math.sin(time*(k+2)+k));
    /* 同じ場所をx方向にも圧縮して「重なる」瞬間を作る */
    x+=s*.30*f.g*Math.sin(time*(k+1)+k*.9);
    x+=s*.10*f.g*Math.sin(f.d*TAU*7+time*2);

    energy+=f.g*(.7+.3*Math.abs(f.wave));
  }

  /* 膜全体もゆっくり左右へ蛇行 */
  y+=.16*Math.sin(u*TAU+time);
  x+=.08*Math.sin(u*TAU*2-time);

  /* タッチした折り癖 */
  for(const q of creases){
    const qx=(q.x+1.78)/3.56;
    let du=u-qx;
    if(du>.5)du-=1;if(du<-.5)du+=1;
    const g=Math.exp(-(du*du)/(q.r*q.r));
    y+=q.p*g*Math.sin(du*TAU*6+q.phase+time*2);
    x+=q.p*.35*g*Math.cos(du*TAU*4+q.phase);
  }

  return [x,y,energy];
}

function widthAt(u,time){
  let w=.25
    +.045*Math.sin(u*TAU*2-time)
    +.035*Math.sin(u*TAU*6+time*2);

  for(let k=0;k<3;k++){
    const f=foldEvent(u,time,k);
    /* 折り目が重なるほど膜が一瞬厚くなる */
    w+=.11*f.g*(.45+.55*Math.abs(f.wave));
  }

  for(const q of creases){
    const qx=(q.x+1.78)/3.56;
    let du=u-qx;
    if(du>.5)du-=1;if(du<-.5)du+=1;
    const g=Math.exp(-(du*du)/(q.r*q.r*1.5));
    w-=q.p*.07*g;
  }
  return Math.max(.10,w);
}

function tangent(u,time){
  const e=.0015;
  const a=centerAt(Math.max(0,u-e),time),b=centerAt(Math.min(1,u+e),time);
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
  return [dx/l,dy/l];
}

function normal(u,time){
  const t=tangent(u,time);
  return [-t[1],t[0]];
}

function screenPoint(p){
  return [W*.5+p[0]*S*.62,H*.5+p[1]*S*.62];
}

function ribbon(time,scale=1,offset=0){
  const N=280,top=[],bottom=[];
  for(let i=0;i<=N;i++){
    const u=i/N;
    const uu=(u+offset)%1;
    const p=centerAt(uu,time);
    const n=normal(uu,time);
    const w=widthAt(uu,time)*scale;
    top.push([p[0]+n[0]*w,p[1]+n[1]*w]);
    bottom.push([p[0]-n[0]*w,p[1]-n[1]*w]);
  }
  return top.concat(bottom.reverse());
}

function gradient(time){
  const g=ctx.createLinearGradient(0,0,W,H);
  const h=(hue+time*28)%360;
  const stops=[
    [0,(h+190)%360,.68],
    [.12,(h+225)%360,.78],
    [.25,(h+270)%360,.86],
    [.38,(h+320)%360,.94],
    [.50,(h+8)%360,.96],
    [.62,(h+52)%360,.93],
    [.75,(h+96)%360,.86],
    [.88,(h+140)%360,.76],
    [1,(h+178)%360,.66]
  ];
  for(const s of stops)
    g.addColorStop(s[0],`hsla(${s[1]},82%,61%,${s[2]})`);
  return g;
}

function pathPoly(poly){
  ctx.beginPath();
  ctx.moveTo(W*.5+poly[0][0]*S*.5,H*.5+poly[0][1]*S*.5);
  for(let i=1;i<poly.length;i++)
    ctx.lineTo(W*.5+poly[i][0]*S*.5,H*.5+poly[i][1]*S*.5);
  ctx.closePath();
}

function strokeMembrane(time){
  /* 中心線を細かく区切り、折り目のエネルギーが高い場所だけ色が濃くなる */
  const N=260;
  for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N;
    const a=centerAt(u0,time),b=centerAt(u1,time);
    const q0=screenPoint(a),q1=screenPoint(b);
    const e=Math.min(1,(a[2]+b[2])*.28);
    const h=(hue+u0*300+time*28)%360;
    ctx.strokeStyle=`hsla(${h},88%,${58-e*12}%,${.35+e*.5})`;
    ctx.lineWidth=Math.max(1.5,S*(.0065+e*.006));
    ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();
  }
}

function background(time){
  const g=ctx.createRadialGradient(
    W*.50+Math.sin(time*.11)*S*.18,
    H*.50+Math.cos(time*.09)*S*.14,
    0,
    W*.5,H*.5,S*.82
  );
  const h=(hue+time*5)%360;
  g.addColorStop(0,"rgb(255,255,253)");
  g.addColorStop(.55,`hsl(${(h+55)%360},24%,97%)`);
  g.addColorStop(1,`hsl(${(h+190)%360},20%,95%)`);
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawMembrane(time){
  background(time);

  /* 膜の影。重なった瞬間が読めるように、ほんの少しだけずらす */
  const shadow=ribbon(time,1.20,0);
  pathPoly(shadow);
  ctx.globalAlpha=.045;
  ctx.fillStyle="rgba(80,60,120,.8)";
  ctx.fill();

  /* 本体 */
  const poly=ribbon(time,1.10,0);
  pathPoly(poly);
  ctx.globalAlpha=.16;
  ctx.fillStyle=gradient(time);
  ctx.fill();

  /* 膜の内部に複数の色層。折り重なりが視覚的なイベントになる */
  for(let j=5;j>=1;j--){
    const p=ribbon(time+j*.035,1.04-j*.035,.002*j);
    pathPoly(p);
    ctx.globalAlpha=.028+j*.004;
    ctx.fillStyle=gradient(time+j*.07);
    ctx.fill();
  }

  ctx.globalAlpha=1;
  strokeMembrane(time);

  /* 折り目の瞬間だけ、白い反射が走る */
  const N=260;
  ctx.lineCap="round";
  for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N;
    const a=centerAt(u0,time),b=centerAt(u1,time);
    const e=Math.min(1,(a[2]+b[2])*.35);
    if(e<.35)continue;
    const q0=screenPoint(a),q1=screenPoint(b);
    ctx.strokeStyle=`rgba(255,255,255,${e*.20})`;
    ctx.lineWidth=Math.max(1,S*.003*e);
    ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();
  }

  /* タッチの折り癖 */
  for(let i=0;i<creases.length;i++){
    const q=creases[i];
    const x=W*.5+q.x*S*.5,y=H*.5+q.y*S*.5;
    const len=S*(.03+.05*q.p);
    ctx.save();ctx.translate(x,y);ctx.rotate(q.a);
    const gg=ctx.createLinearGradient(-len,0,len,0);
    gg.addColorStop(0,"rgba(255,255,255,0)");
    gg.addColorStop(.5,`hsla(${(hue+180+i*31)%360},88%,65%,.20)`);
    gg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.strokeStyle=gg;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.stroke();
    ctx.restore();
  }

  ctx.globalAlpha=1;
}

function frame(now,phase){
  const time=phase==null?((now-t0)/9000)*TAU:phase*TAU;
  drawMembrane(time);
  if(phase==null)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){drawMembrane(phase);},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
