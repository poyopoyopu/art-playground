<!-- POLAR FOLD — ChatGPT作。第8構成。WebGL2 bilateral hinged-square field. -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{alpha:false,antialias:false,preserveDrawingBuffer:true});
if(!gl)throw new Error("WebGL2 unavailable");

const VS=`#version 300 es
in vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_phase;
uniform vec2 u_touch;
uniform float u_touchPower;
const float PI=3.14159265359;
const float TAU=6.28318530718;

vec3 hsv(float h,float s,float v){
  vec3 p=abs(fract(h+vec3(0.0,.6666667,.3333333))*6.0-3.0);
  return v*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),s);
}
float ring(float d,float w){
  float x=abs(d)/max(w,.0001);
  return exp(-x*x*2.4);
}
float softBand(float x,float w){
  float d=abs(fract(x)-.5);
  return 1.0-smoothstep(.0,w,d);
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  p.y=-p.y;
  float t=u_phase*TAU;

  /* 左右を同じ法則で生成する。ただし各半分は独立した正方形の場。 */
  float side=sign(p.x);
  float x=abs(p.x);

  /* 巨大→圧縮→巨大。ズーム中も正方形の階層は保つ。 */
  float zoom=exp(1.15*sin(t-.72));
  float center=.305+.045*sin(t*.5+.4);
  vec2 q=vec2(x-center,p.y*.96)*zoom;

  /* 中央ヒンジ。内側の辺だけが中央へ折れ込む。 */
  float hinge=exp(-x*x/.055);
  float vertical=exp(-p.y*p.y/.72);
  float fold=.24*sin(t-.18)+.10*sin(t*2.0+.7);
  q.x+=hinge*vertical*(fold+.11*u_touchPower);
  q.y+=hinge*(.055*sin(t+.9)+.04*u_touchPower*p.x);

  /* 指を置いた場所を「折り目の新しい重心」として一時的に扱う。 */
  vec2 tp=u_touch;
  float td=length(p-tp);
  float touchWarp=exp(-td*td/.035)*u_touchPower;
  q.x+=touchWarp*.20*side;
  q.y+=touchWarp*.14;

  /* L∞距離＝円ではない、正方形の半径。 */
  float r=max(abs(q.x),abs(q.y));
  float z=log2(max(r,.0012));

  /* 階層は太い少数輪郭。細線ではなく「空間の段差」として見せる。 */
  float level=z*.62;
  float cell=fract(level+.10);
  float contour=softBand(level+.10,.065);
  float contour2=softBand(level+.36,.040);
  float contour3=softBand(level+.67,.026);
  float lines=contour*.82+contour2*.34+contour3*.16;

  /* 輪郭間も色面。正方形の各世代で虹が少しずつ位相移動する。 */
  float hue=.53 + cell*.92 + .11*side + .055*sin(t*.5)
            + .07*sin(p.y*2.4-t) + .035*sin(z*1.7);
  vec3 c=hsv(hue,.57,.98);
  vec3 cWarm=hsv(hue+.08,.42,1.0);
  vec3 cPastel=mix(c,cWarm,.42);

  float face=pow(sin(PI*cell),1.25);
  vec3 color=mix(vec3(1.0),cPastel,.34+.38*face);
  color=mix(color,c,.62*lines);

  /* 中央は線ではなく、左右の空間が圧縮される明るい折り目。 */
  float crease=exp(-x*x/.0018)*(.45+.55*vertical);
  color=mix(color,vec3(1.0),crease*.82);

  /* 外周へ行くほど白へほどける。 */
  float edge=smoothstep(.72,1.02,length(p));
  color=mix(color,vec3(1.0),edge*.28);

  /* 指で折り目をつまんだ時だけ、周囲の色階層も引っ張る。 */
  color+=c*.08*touchWarp;
  outColor=vec4(clamp(color,0.0,1.0),1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,"a_position");
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(program,"u_res");
const uPhase=gl.getUniformLocation(program,"u_phase");
const uTouch=gl.getUniformLocation(program,"u_touch");
const uTouchPower=gl.getUniformLocation(program,"u_touchPower");

let D=1,W=0,H=0,t0=performance.now(),shift=0;
let touchX=0,touchY=0,touchPower=0;

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));
  canvas.height=Math.max(1,Math.round(H*D));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize,{passive:true});
resize();

function pointer(e){
  touchX=(e.clientX-W*.5)/Math.min(W,H);
  touchY=-(e.clientY-H*.5)/Math.min(W,H);
}
function draw(phase){
  gl.useProgram(program);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uPhase,phase+shift);
  gl.uniform2f(uTouch,touchX,touchY);
  gl.uniform1f(uTouchPower,touchPower);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function animate(now){
  touchPower*=.93;
  draw(((now-t0)/9000)%1);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

canvas.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  pointer(e);touchPower=1;
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{if(touchPower>.02)pointer(e)});
canvas.addEventListener("pointerup",()=>touchPower=.35);
canvas.addEventListener("pointercancel",()=>touchPower=.0);

function mutate(){shift+=.17+Math.random()*.6}
function reset(){shift=0;t0=performance.now();touchPower=0}

APKit.init({
  canvas,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
