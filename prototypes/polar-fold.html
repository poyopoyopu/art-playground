<!-- POLAR FOLD — ChatGPT作。描画安定版。2D Canvas / mirrored square-fold field. -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false});
let W=0,H=0,D=1,t0=performance.now(),phaseShift=0;
const touch={x:0,y:0,active:false};

function resize(){
  D=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));
  canvas.height=Math.max(1,Math.round(H*D));
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize,{passive:true});resize();

function hsv(h,s,v){
  h=((h%1)+1)%1;
  const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){
    case 0:return[v,t,p];case 1:return[q,v,p];case 2:return[p,v,t];
    case 3:return[p,q,v];case 4:return[t,p,v];default:return[v,p,q];
  }
}
function rgb(c,a=1){
  return"rgba("+Math.round(c[0]*255)+","+Math.round(c[1]*255)+","+Math.round(c[2]*255)+","+a+")";
}

/* 左右それぞれの正方形。内側の一辺だけが中央ヒンジへ折れる。 */
function squarePath(side,scale,phase){
  const min=H,cx=side*min*.285,cy=H*.5,s=scale*min*.62;
  const tilt=.055*Math.sin(phase+side*.7),co=Math.cos(tilt),si=Math.sin(tilt);
  const pts=[[-s,-s],[s,-s],[s,s],[-s,s]].map(([x,y])=>[
    cx+x*co-y*si,cy+x*si+y*co
  ]);
  let a,b,outer1,outer2;
  if(side>0){
    a=pts[0];b=pts[3];outer1=pts[1];outer2=pts[2];
  }else{
    a=pts[1];b=pts[2];outer1=pts[0];outer2=pts[3];
  }
  const pull=(.22+.18*Math.sin(phase*.5))*s;
  const mid=[W*.5+side*pull*.16,cy+s*.18*Math.sin(phase+side)];

  ctx.beginPath();
  ctx.moveTo(outer1[0],outer1[1]);
  ctx.lineTo(a[0],a[1]);
  ctx.quadraticCurveTo(mid[0],mid[1],b[0],b[1]);
  ctx.lineTo(outer2[0],outer2[1]);
  ctx.closePath();
}

function strokeFold(side,scale,phase,idx){
  squarePath(side,scale,phase);
  const hueBase=(idx*.115+side*.12+phase*.055)%1;
  const line=ctx.createLinearGradient(side<0?W:0,0,side<0?0:W,H);
  const stops=[
    [0,hsv(hueBase,.72,1)],[.25,hsv(hueBase+.18,.78,1)],
    [.5,hsv(hueBase+.36,.74,1)],[.75,hsv(hueBase+.55,.76,1)],
    [1,hsv(hueBase+.72,.70,1)]
  ];
  for(const [p,c] of stops)line.addColorStop(p,rgb(c,.92));
  ctx.lineJoin="round";ctx.lineCap="round";

  ctx.save();
  ctx.strokeStyle=line;ctx.lineWidth=Math.max(12,scale*H*.035);
  ctx.globalAlpha=.075;ctx.stroke();ctx.restore();

  ctx.save();
  ctx.strokeStyle=line;ctx.lineWidth=Math.max(4,scale*H*.014);
  ctx.globalAlpha=.34;ctx.stroke();ctx.restore();

  ctx.save();
  ctx.strokeStyle=line;ctx.lineWidth=Math.max(1.5,scale*H*.0048);
  ctx.globalAlpha=.96;ctx.stroke();ctx.restore();
}

function draw(phase){
  const p=phase+phaseShift,zoom=Math.exp(1.48*Math.sin(p-.55));
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#fff");bg.addColorStop(.5,"#fffefe");bg.addColorStop(1,"#fafafa");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  const base=[1.34,1.05,.79,.58,.40,.27,.17];
  for(let i=0;i<base.length;i++){
    const sc=base[i]/zoom;
    if(sc<.018)continue;
    strokeFold(-1,sc,p,i);strokeFold(1,sc,p,i);
  }

  const seam=ctx.createLinearGradient(W*.5-18,0,W*.5+18,0);
  seam.addColorStop(0,"rgba(255,255,255,0)");
  seam.addColorStop(.42,"rgba(255,255,255,.78)");
  seam.addColorStop(.5,"rgba(255,255,255,1)");
  seam.addColorStop(.58,"rgba(255,255,255,.78)");
  seam.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=seam;ctx.fillRect(W*.5-18,0,36,H);

  const shadow=ctx.createLinearGradient(0,H*.34,0,H);
  shadow.addColorStop(0,"rgba(255,255,255,0)");
  shadow.addColorStop(1,"rgba(255,255,255,.28)");
  ctx.fillStyle=shadow;ctx.fillRect(W*.5-5,H*.30,10,H*.70);

  if(touch.active){
    const dx=(touch.x-W*.5)/Math.min(W,H);
    ctx.save();ctx.globalAlpha=.035;ctx.beginPath();
    ctx.arc(touch.x,touch.y,Math.min(W,H)*.12,0,Math.PI*2);
    ctx.fillStyle=rgb(hsv(.55+dx*.15,.5,1));ctx.fill();ctx.restore();
  }
}

function animate(now){
  draw(((now-t0)/9000)%1);requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function setTouch(e){touch.x=e.clientX;touch.y=e.clientY}
canvas.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  touch.active=true;setTouch(e);
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{if(touch.active)setTouch(e)});
canvas.addEventListener("pointerup",()=>touch.active=false);
canvas.addEventListener("pointercancel",()=>touch.active=false);

function mutate(){phaseShift+=.21+Math.random()*.47}
function reset(){phaseShift=0;t0=performance.now()}

APKit.init({
  canvas,gifName:"polar-fold-loop",clockFormat:"spec",dock:true,autoHide:true,
  fullscreenButton:false,loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
