<!-- POLAR FOLD — ChatGPT作。第10構成。一本の連続スクエア螺旋へ再設計。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{alpha:false,antialias:false,preserveDrawingBuffer:true});
if(!gl)throw new Error("WebGL2 unavailable");

const VS=`#version 300 es
in vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_phase;
uniform float u_twist;
uniform float u_hue;
const float PI=3.14159265359;
const float TAU=6.28318530718;

vec3 palette(float h){
  return .5+.5*cos(TAU*(h+vec3(.0,.333333,.666667)));
}

float angle01(vec2 p){
  /* Branch cut is deliberately downward: the reference has one continuous
     opening from the core toward the lower edge, not two mirrored halves. */
  return atan(p.x,-p.y)/TAU;
}

float angularDistance(float a,float b){
  return atan(sin(TAU*(a-b)),cos(TAU*(a-b)))/TAU;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  p.y=-p.y;

  float t=u_phase*TAU;

  /* One continuous world: no mirror, no hinge, no left/right split.
     The zoom is deliberately large, while the spiral law stays invariant. */
  float zoom=exp2(1.30*sin(t-.72));
  p*=zoom;

  /* A tiny drift prevents the pole from feeling mechanically pinned. */
  vec2 drift=.025*vec2(cos(t*.5+.8),sin(t*.5-.2));
  p-=drift;

  /* Mostly square outside, increasingly rounded toward the central curl. */
  float rs=max(abs(p.x),abs(p.y));
  float rr=pow(pow(abs(p.x),10.0)+pow(abs(p.y),10.0),.1);
  float innerRound=smoothstep(.24,.025,rs);
  float r=mix(rs,rr,.045+.22*innerRound);

  float theta=angle01(p);
  float logR=log2(max(r,.0012));

  /* The decisive change: one broad logarithmic spiral, with a stronger
     winding rate and a gentle angular/radial warp so it reads as a spiral,
     not as concentric square rings. */
  theta+=.028*sin(TAU*theta*4.0+logR*2.1-t*.12);
  float radialBulge=.105*sin(TAU*theta-.55+.28*sin(t*.5));
  logR+=radialBulge*(smoothstep(.02,.82,r));

  float twist=1.64+.11*sin(t*.5-.2)+u_twist;
  twist+=.22*exp(-r*8.0);
  float spiral=logR-twist*theta;

  /* A low-amplitude second warp breaks geometric regularity while preserving
     one connected square-polar field. */
  spiral+=.075*sin(TAU*(theta+.17*logR)-t*.18)*(smoothstep(.015,.9,r));

  /* Broad color bands follow the spiral coordinate itself. */
  float level=spiral*.82+u_phase*.07;
  float cell=fract(level+.08);
  float hue=.53+cell*.96+.10*theta+.035*sin(logR*1.7-t*.12)+u_hue;
  vec3 rainbow=palette(hue);
  vec3 pastel=mix(vec3(1.0),rainbow,.78);

  float body=pow(max(sin(PI*cell),0.0),.92);
  vec3 color=mix(vec3(1.0),pastel,.13+.69*body);

  /* Soft chromatic ridges make each spiral turn legible without becoming
     hard outlines. */
  float bandDist=abs(fract(level+.08)-.5);
  float aa=max(fwidth(level)*1.6,.0025);
  float band=1.0-smoothstep(.018+aa,.085+aa,bandDist);
  color=mix(color,rainbow,band*.42);

  /* One narrow downward seam exposes the branch cut. It is not a split. */
  float seamWidth=.018+.005*sin(t*.5);
  float seam=exp(-pow(angularDistance(theta,0.0)/seamWidth,2.0));
  seam*=smoothstep(.018,.10,r);
  color=mix(color,vec3(1.0),seam*.34);

  /* The final turn closes into a rounded luminous hook. */
  float core=1.0-smoothstep(.0,.045,r);
  color=mix(color,vec3(1.0),core*.78);

  /* Let the largest generations dissolve into white at the viewport edge. */
  float edge=smoothstep(.82,1.12,length(p)/max(zoom,.0001));
  color=mix(color,vec3(1.0),edge*.22);

  outColor=vec4(clamp(color,0.0,1.0),1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,"a_position");
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(program,"u_res");
const uPhase=gl.getUniformLocation(program,"u_phase");
const uTwist=gl.getUniformLocation(program,"u_twist");
const uHue=gl.getUniformLocation(program,"u_hue");

let D=1,W=0,H=0,t0=performance.now();
let twistLaw=0,hueLaw=0;

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));
  canvas.height=Math.max(1,Math.round(H*D));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize,{passive:true});
resize();

function draw(phase){
  gl.useProgram(program);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uPhase,phase);
  gl.uniform1f(uTwist,twistLaw);
  gl.uniform1f(uHue,hueLaw);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function animate(now){
  draw(((now-t0)/9000)%1);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

canvas.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  const x=(e.clientX-W*.5)/Math.min(W,H);
  const y=(e.clientY-H*.5)/Math.min(W,H);
  /* Touch changes the spiral law itself: horizontal position alters winding,
     vertical position shifts the spectral phase. The change persists. */
  twistLaw=Math.max(-.28,Math.min(.28,twistLaw+x*.11));
  hueLaw+=y*.035;
});

function mutate(){
  twistLaw=(Math.random()-.5)*.32;
  hueLaw=Math.random();
}
function reset(){
  twistLaw=0;
  hueLaw=0;
  t0=performance.now();
}

APKit.init({
  canvas,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
