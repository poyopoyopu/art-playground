<!-- POLAR FOLD — ChatGPT作。第7構成。WebGL2 square-fold field. -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{alpha:false,antialias:false,preserveDrawingBuffer:true});
let W=0,H=0,D=1,t0=performance.now(),shift=0;

const VS=`#version 300 es
in vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_phase;
const float PI=3.14159265359;
const float TAU=6.28318530718;

vec3 hsv(vec3 c){
  vec3 p=abs(fract(c.xxx+vec3(0.0,.6666667,.3333333))*6.0-3.0);
  return c.z*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),c.y);
}
float sq(vec2 p){return max(abs(p.x),abs(p.y));}
float ring(float d,float w){
  float x=abs(d)/max(w,.0001);
  return exp(-x*x*1.7);
}
vec2 rot(vec2 p,float a){
  float c=cos(a),s=sin(a);
  return vec2(c*p.x-s*p.y,s*p.x+c*p.y);
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  p.y=-p.y;
  float t=u_phase*TAU;

  /* 座標系そのものを大きく呼吸させる。 */
  float zoom=exp(1.72*sin(t-.72));
  vec2 q=p*zoom;

  /* 中央の一点を「ヒンジ」にして空間を折る。 */
  vec2 hinge=vec2(.18*sin(t+.4),-.06+.14*sin(t-.3));
  vec2 h=q-hinge;
  float local=exp(-dot(h,h)/.075);
  float bend=.92*sin(t-.15)*local;
  q=rot(h,bend)+hinge;

  /* ヒンジの近傍だけ正方形の一辺を横へ引き込む。 */
  float nearEdge=exp(-pow(q.x-.025,2.0)/.018);
  float lower=1.0-smoothstep(-.5,.35,q.y);
  q.x+=.22*sin(t+.7)*nearEdge*lower;

  /* 円ではなくL∞距離。これが四角い入れ子を作る。 */
  float r=sq(q);
  float a=atan(q.y,q.x);
  float spiral=.18+.06*sin(t*.5);
  float rr=r*exp(spiral*sin(a*2.0+t*.12));
  float z=log2(max(rr,.0009));

  /* 少数の太い自己相似輪郭。 */
  float d0=fract(z*.52+.08)-.5;
  float d1=fract(z*.52+.31)-.5;
  float d2=fract(z*.52+.55)-.5;
  float line=ring(d0,.042)+.72*ring(d1,.034)+.42*ring(d2,.027);

  /* 輪郭の間も色面として存在させる。 */
  float cell=fract(z*.52+.08);
  float field=pow(sin(PI*cell),1.6);
  float hue=.02+cell*.92+a/TAU*.16+.08*sin(t*.5)+.055*sin(a*2.0-t);
  vec3 c=hsv(vec3(hue,.66,1.0));
  vec3 c2=hsv(vec3(hue+.055,.52,1.0));
  vec3 fieldColor=mix(c,c2,.45);
  vec3 color=mix(vec3(1.0),fieldColor,.22+field*.42);
  color=mix(color,c,clamp(line*.95,0.0,.98));

  /* 中央下側の折り目。単なる縦線ではなく、白い谷。 */
  float seam=exp(-q.x*q.x/.0009)*(1.0-smoothstep(-.48,.42,q.y));
  color=mix(color,vec3(1.0),seam*.92);

  float edge=smoothstep(.78,1.02,length(p));
  color=mix(color,vec3(1.0),edge*.32);
  outColor=vec4(color,1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
if(!gl)throw new Error("WebGL2 unavailable");

const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,"a_position");
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(program,"u_res");
const uPhase=gl.getUniformLocation(program,"u_phase");

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));
  canvas.height=Math.max(1,Math.round(H*D));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize,{passive:true});
resize();

function draw(phase){
  gl.useProgram(program);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uPhase,phase+shift);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function animate(now){
  draw(((now-t0)/9000)%1);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function mutate(){shift+=.17+Math.random()*.6}
function reset(){shift=0;t0=performance.now()}

APKit.init({
  canvas,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
