<!-- POLAR FOLD — ChatGPT作。第5構成。明快な有機形と虹色の膜を主役にした再設計。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfaf7;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";

const c=document.getElementById("c"),ctx=c.getContext("2d",{alpha:false});
const TAU=Math.PI*2;
let W=0,H=0,D=1,S=1;
let t0=performance.now(),seed=Math.random()*TAU,hue=Math.random()*360;
let touch=null,creases=[];

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;S=Math.min(W,H);
  c.width=W*D;c.height=H*D;
  ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize,{passive:true});resize();

function reset(){seed=Math.random()*TAU;hue=Math.random()*360;creases=[]}
function mutate(){seed=Math.random()*TAU;hue=Math.random()*360;creases=[]}

function addCrease(x,y){
  creases.push({
    x:(x-W/2)/S,y:(y-H/2)/S,
    a:Math.atan2(y-H/2,x-W/2),
    p:.05+Math.random()*.10
  });
  if(creases.length>5)creases.shift();
}

c.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  touch={id:e.pointerId,x:e.clientX,y:e.clientY};
  addCrease(e.clientX,e.clientY);
  c.setPointerCapture&&c.setPointerCapture(e.pointerId);
},{passive:true});
c.addEventListener("pointermove",e=>{
  if(!touch||touch.id!==e.pointerId)return;
  if(Math.hypot(e.clientX-touch.x,e.clientY-touch.y)>45)addCrease(e.clientX,e.clientY);
  touch.x=e.clientX;touch.y=e.clientY;
},{passive:true});
function release(e){if(touch&&touch.id===e.pointerId)touch=null}
c.addEventListener("pointerup",release);
c.addEventListener("pointercancel",release);

/*
  A single closed membrane.
  形は「四角」ではなく、4つの大きな面と柔らかな角を持つ。
  すべての変化は2π周期。
*/
function point(u,t,scale=1){
  const a=u*TAU;
  const m1=Math.sin(t*.72+seed);
  const m2=Math.cos(t*.41-seed*.7);
  const m3=Math.sin(t*.29+seed*1.8);

  let r=
    .53+
    .075*Math.cos(4*a+t*.52)+
    .038*Math.sin(3*a-t*.37)+
    .025*Math.cos(7*a+t*.23)+
    .018*Math.sin(9*a+seed);

  /* 四隅の存在感をゆっくり変える */
  r+=.055*Math.pow(Math.abs(Math.cos(a+Math.PI/4)),10)*(0.5+.5*m1);
  r+=.045*Math.pow(Math.abs(Math.sin(a+Math.PI/4)),10)*(0.5+.5*m2);

  /* 一箇所だけ大きく折れる。波にはせず、局所的な面の変形 */
  const fc=.72+Math.sin(t*.31+seed)*.55;
  let da=Math.atan2(Math.sin(a-fc),Math.cos(a-fc));
  const fold=Math.exp(-da*da/.11);
  r+=.11*fold*Math.sin(t*.63+seed);

  let x=Math.cos(a)*r,y=Math.sin(a)*r;

  /* タッチした場所に柔らかい折り癖 */
  for(const q of creases){
    const dx=x-q.x,dy=y-q.y;
    const along=dx*Math.cos(q.a)+dy*Math.sin(q.a);
    const side=-dx*Math.sin(q.a)+dy*Math.cos(q.a);
    const g=Math.exp(-(along*along+side*side)/.045);
    x+=Math.cos(q.a)*g*q.p*Math.sin(t*.5);
    y+=Math.sin(q.a)*g*q.p*Math.sin(t*.5);
  }

  /* わずかな非円形の面移動 */
  x+=.035*Math.sin(a*2+t*.26)*(.5+.5*m2);
  y+=.028*Math.cos(a*3-t*.19)*(.5+.5*m3);

  /* ゆっくりした全体回転 */
  const rot=.10*Math.sin(t*.17+seed)+.07*t;
  const ca=Math.cos(rot),sa=Math.sin(rot);
  return [x*ca-y*sa,y*ca+x*sa];
}

function pts(t,scale=1,phase=0){
  const out=[],N=320;
  for(let i=0;i<N;i++)out.push(point((i/N+phase)%1,t,scale));
  return out;
}

function screen(p){
  return [W/2+p[0]*S,H/2+p[1]*S];
}

function path(ps){
  ctx.beginPath();
  let q=screen(ps[0]);ctx.moveTo(q[0],q[1]);
  for(let i=1;i<ps.length;i++){q=screen(ps[i]);ctx.lineTo(q[0],q[1])}
  ctx.closePath();
}

function rainbow(t,offset=0){
  const g=ctx.createLinearGradient(0,0,W,H);
  const h=(hue+t*13+offset)%360;
  const stops=[
    [0,(h+185)%360],[.12,(h+225)%360],[.25,(h+270)%360],
    [.38,(h+320)%360],[.50,(h+8)%360],[.62,(h+48)%360],
    [.75,(h+92)%360],[.88,(h+138)%360],[1,(h+180)%360]
  ];
  for(const z of stops)g.addColorStop(z[0],`hsla(${z[1]},82%,63%,.95)`);
  return g;
}

function background(t){
  const g=ctx.createRadialGradient(
    W/2+Math.sin(t*.13)*S*.12,H/2+Math.cos(t*.11)*S*.10,0,
    W/2,H/2,S*.78
  );
  g.addColorStop(0,"#fff");
  g.addColorStop(.7,"#fbfaf8");
  g.addColorStop(1,"#f2f1ed");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function draw(t){
  background(t);

  /* 柔らかな外側の色膜 */
  for(let k=5;k>=1;k--){
    const p=pts(t-k*.018,1+k*.018,k*.0004);
    path(p);
    ctx.fillStyle=rainbow(t,k*8);
    ctx.globalAlpha=.012+k*.008;
    ctx.fill();
  }

  /* 主膜 */
  const p=pts(t,1,0);
  path(p);
  ctx.fillStyle=rainbow(t,0);
  ctx.globalAlpha=.13;
  ctx.fill();

  /* 膜の内部に別の色層を薄く流す */
  for(let k=1;k<=4;k++){
    const q=pts(t+k*.035,1-k*.055,k*.001);
    path(q);
    ctx.fillStyle=rainbow(t,k*21);
    ctx.globalAlpha=.022;
    ctx.fill();
  }

  /* 主輪郭：太さを変えながら、虹が一周する */
  ctx.globalAlpha=.10;
  ctx.lineWidth=S*.026;
  ctx.strokeStyle=rainbow(t,0);
  ctx.stroke();

  ctx.globalAlpha=.72;
  ctx.lineWidth=S*.010;
  ctx.strokeStyle=rainbow(t,18);
  ctx.stroke();

  /* 白いハイライト */
  ctx.globalAlpha=.30;
  ctx.lineWidth=S*.0028;
  ctx.strokeStyle="rgba(255,255,255,.95)";
  ctx.stroke();

  /* 内側の境界。一本だけ。二重の輪に見せないため透明度を低くする */
  const inner=pts(t+.12,.82,.002);
  path(inner);
  ctx.globalAlpha=.17;
  ctx.lineWidth=S*.004;
  ctx.strokeStyle=rainbow(t,55);
  ctx.stroke();

  ctx.globalAlpha=1;
}

function frame(now,phase){
  const t=phase==null?((now-t0)/9000)*TAU:phase*TAU;
  draw(t);
  if(phase==null)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase*TAU)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
