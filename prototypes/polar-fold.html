<!-- POLAR FOLD — ChatGPT作。第9構成。WebGL2 square-log-polar spiral field. -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>POLAR FOLD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{"use strict";
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl2",{alpha:false,antialias:false,preserveDrawingBuffer:true});
if(!gl)throw new Error("WebGL2 unavailable");

const VS=`#version 300 es
in vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_phase;
uniform float u_twist;
uniform float u_hue;
const float PI=3.14159265359;
const float TAU=6.28318530718;

vec3 palette(float h){
  return .5+.5*cos(TAU*(h+vec3(.0,.333333,.666667)));
}

float angle01(vec2 p){
  /* Branch cut is deliberately downward: the reference has one continuous
     opening from the core toward the lower edge, not two mirrored halves. */
  return atan(p.x,-p.y)/TAU;
}

float angularDistance(float a,float b){
  return atan(sin(TAU*(a-b)),cos(TAU*(a-b)))/TAU;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  p.y=-p.y;

  float t=u_phase*TAU;

  /* The whole image is one field. There is no left/right split.
     Zoom is exponential so the same square-spiral law survives scale changes. */
  float zoom=exp2(1.52*sin(t-.72));
  p*=zoom;

  /* Very small orbital drift keeps the center alive without changing the law. */
  vec2 drift=.035*vec2(cos(t*.5+.8),sin(t*.5-.2));
  p-=drift;

  /* Square-polar radius: L-infinity geometry, softened only slightly at corners. */
  float rs=max(abs(p.x),abs(p.y));
  float rr=pow(pow(abs(p.x),8.0)+pow(abs(p.y),8.0),.125);
  float r=mix(rs,rr,.075);

  float theta=angle01(p);

  /* A single logarithmic square spiral.
     log2(r) gives scale invariance; theta winds the square field around the pole. */
  float twist=.91+.055*sin(t*.5-.2)+u_twist;
  float spiral=log2(max(r,.0012))-twist*theta;

  /* Tiny non-axisymmetric breathing, strongest away from the pole. */
  spiral+=.055*sin(TAU*theta*1.35-t*.35)*(smoothstep(.025,.9,r));

  /* Four broad color generations are enough; each is a continuous field,
     not a stack of independently drawn lines. */
  float density=.72;
  float level=spiral*density+u_phase*.055;
  float cell=fract(level+.12);

  vec3 rainbow=palette(.57+cell*.92+.055*theta+u_hue);
  vec3 pastel=mix(vec3(1.0),rainbow,.72);

  float softCell=sin(PI*cell);
  float body=pow(max(softCell,0.0),1.12);
  vec3 color=mix(vec3(1.0),pastel,.18+.64*body);

  /* The transitions become slightly denser and more chromatic at each
     square contour, producing the soft bands visible in the reference. */
  float bandDist=abs(fract(level+.12)-.5);
  float aa=max(fwidth(level)*1.8,.003);
  float band=1.0-smoothstep(.035+aa,.095+aa,bandDist);
  color=mix(color,rainbow,band*.34);

  /* The branch cut is a fold seam, not a division of the artwork.
     It fades into white while remaining continuous through the center. */
  float seamWidth=.042+.012*sin(t*.5);
  float seam=exp(-pow(angularDistance(theta,0.0)/seamWidth,2.0));
  seam*=smoothstep(.025,.13,r);
  color=mix(color,vec3(1.0),seam*.68);

  /* Slightly brighter center: the spiral terminates into a tiny luminous pole. */
  float core=1.0-smoothstep(.0,.055,r);
  color=mix(color,vec3(1.0),core*.72);

  /* Let the largest generations dissolve into white at the viewport edge. */
  float edge=smoothstep(.82,1.12,length(p)/max(zoom,.0001));
  color=mix(color,vec3(1.0),edge*.22);

  outColor=vec4(clamp(color,0.0,1.0),1.0);
}
`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const position=gl.getAttribLocation(program,"a_position");
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

const uRes=gl.getUniformLocation(program,"u_res");
const uPhase=gl.getUniformLocation(program,"u_phase");
const uTwist=gl.getUniformLocation(program,"u_twist");
const uHue=gl.getUniformLocation(program,"u_hue");

let D=1,W=0,H=0,t0=performance.now();
let twistLaw=0,hueLaw=0;

function resize(){
  D=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*D));
  canvas.height=Math.max(1,Math.round(H*D));
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize,{passive:true});
resize();

function draw(phase){
  gl.useProgram(program);
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform1f(uPhase,phase);
  gl.uniform1f(uTwist,twistLaw);
  gl.uniform1f(uHue,hueLaw);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

function animate(now){
  draw(((now-t0)/9000)%1);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

canvas.addEventListener("pointerdown",e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  const x=(e.clientX-W*.5)/Math.min(W,H);
  const y=(e.clientY-H*.5)/Math.min(W,H);
  /* Touch changes the spiral law itself: horizontal position alters winding,
     vertical position shifts the spectral phase. The change persists. */
  twistLaw=Math.max(-.28,Math.min(.28,twistLaw+x*.11));
  hueLaw+=y*.035;
});

function mutate(){
  twistLaw=(Math.random()-.5)*.32;
  hueLaw=Math.random();
}
function reset(){
  twistLaw=0;
  hueLaw=0;
  t0=performance.now();
}

APKit.init({
  canvas,
  gifName:"polar-fold-loop",
  clockFormat:"spec",
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:"✦",name:"mutate",onClick:mutate},
    {label:"↻",name:"reset",onClick:reset}
  ]
});
})();
</script>
</body>
</html>
