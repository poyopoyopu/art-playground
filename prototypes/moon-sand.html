<!DOCTYPE html>
<!-- MOON SAND — Claude(クロちゃん)作。おっちゃんが見せてくれた「背景付きサンドピクチャー」(砂が砂時計のように流れ落ち、二度と同じ絵にならない)を、ブラウザの中で再現した作品。ap-kit.js統合: Claude -->
<!-- 世界のルール: 砂は、落ちた順に層になって積もる。細い隙間を通った砂は、山の中心から外側へ向かって、V字の縞を刻んでいく。
     タップ=ひっくり返す(絵が半回転し、これまでの山が崩れ落ちて、次の山の材料になる。一度できた縞は、二度と同じ形には戻らない)。
     左右になぞる=絵を傾ける(砂が斜めに流れ、山が傾いて積もる)。長押し=時間の早送り。
     ✦=砂と背景の色を変える(月夜の青・夕暮れの琥珀・翡翠の霧・紫のオーロラ)。↻=砂を入れ直して、隙間の位置も新しくする。
     砂が落ち切ってしばらくすると、放っておいても勝手にひっくり返る。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>MOON SAND — 砂は、落ちた順に山を描く</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #02040a; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #e6f2ff; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 10px rgba(0, 10, 30, .9), 0 0 16px rgba(120, 170, 255, .45); }
  #hint.on { opacity: .8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ ひっくり返す ／ 左右になぞる ＝ 傾ける<br>長押し ＝ 時間の早送り</div>
<script>
(function () {
  'use strict';
  var cvs = document.getElementById('c'), hint = document.getElementById('hint');
  var ctx = cvs.getContext('2d', { alpha: false });
  var W = 0, H = 0, DPR = 1;
  var fx = 0, fy = 0, fw = 0, fh = 0;           /* 額縁の外形 */
  var ix = 0, iy = 0, iw = 0, ih = 0;           /* 額縁の内側(砂と背景の領域) */
  var GW = 0, GH = 0, N = 0, CW = 1, CH = 1;    /* 砂のマス目 */
  var WALL = 200;
  var a = null, throat = null, glow = null;     /* a: 下位8bit=種類(0空/1-7砂/200石)、上位8bit=粒の個性 */
  var sandCv = document.createElement('canvas'), sandCtx = null, sandImg = null, sandU32 = null;
  var bgCv = document.createElement('canvas');
  var orbR = 60, bgSeed = 1;
  var gaps = [], gapOpen = new Float32Array(24);
  var tilt = 0, tiltT = 0, fast = false;
  var phase = 0, flipStart = 0, flipP = 0, FLIP_MS = 1500;
  var stepAcc = 0, stepCount = 0, settled = 0, now = 0, last = 0, started = 0, pdown = false;
  var stars = [];

  /* ======== 色の組み合わせ(砂7色 + 背景) ======== */
  var THEMES = [
    { /* 月夜の青 */
      edge: [4, 8, 28], mid: [14, 42, 100], orb: [238, 232, 206], halo: [110, 170, 255], cl: [150, 205, 255], cd: [10, 30, 82],
      sand: [[10, 34, 84], [18, 78, 160], [28, 130, 204], [84, 180, 232], [198, 228, 245], [196, 142, 52], [6, 14, 34]],
      wt: [2, 3, 4, 3, 1.2, 0, 1.1]
    },
    { /* 夕暮れの琥珀 */
      edge: [26, 8, 24], mid: [124, 46, 54], orb: [255, 228, 164], halo: [255, 150, 74], cl: [255, 180, 124], cd: [60, 18, 40],
      sand: [[58, 16, 24], [140, 40, 36], [214, 96, 40], [244, 162, 66], [252, 224, 172], [214, 160, 62], [30, 8, 16]],
      wt: [2, 3, 4, 3, 1.2, 0, 1.1]
    },
    { /* 翡翠の霧 */
      edge: [3, 14, 16], mid: [10, 64, 72], orb: [228, 246, 228], halo: [90, 232, 190], cl: [134, 232, 212], cd: [4, 34, 40],
      sand: [[6, 40, 44], [10, 90, 88], [24, 152, 132], [98, 208, 172], [216, 245, 226], [200, 176, 96], [4, 18, 20]],
      wt: [2, 3, 4, 3, 1.2, 0, 1.1]
    },
    { /* 紫のオーロラ */
      edge: [10, 4, 28], mid: [58, 24, 112], orb: [250, 228, 250], halo: [204, 134, 255], cl: [222, 164, 255], cd: [24, 10, 62],
      sand: [[30, 14, 70], [84, 36, 150], [152, 72, 212], [232, 122, 202], [248, 216, 244], [124, 222, 238], [14, 6, 34]],
      wt: [2, 3, 4, 3, 1.2, 0, 1.1]
    }
  ];
  var theme = 0;
  var pr = new Float32Array(8), pg = new Float32Array(8), pb = new Float32Array(8);
  function setPalette() {
    var s = THEMES[theme].sand;
    for (var k = 0; k < 7; k++) { pr[k + 1] = s[k][0]; pg[k + 1] = s[k][1]; pb[k + 1] = s[k][2]; }
  }

  /* ======== ノイズ(背景の雲と月の表面用) ======== */
  function hash2(x, y, s) {
    var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function vnoise(x, y, s) {
    var xi = Math.floor(x), yi = Math.floor(y), fx_ = x - xi, fy_ = y - yi;
    fx_ = fx_ * fx_ * (3 - 2 * fx_); fy_ = fy_ * fy_ * (3 - 2 * fy_);
    var p = hash2(xi, yi, s), q = hash2(xi + 1, yi, s), r = hash2(xi, yi + 1, s), t = hash2(xi + 1, yi + 1, s);
    var top = p + (q - p) * fx_, bot = r + (t - r) * fx_;
    return top + (bot - top) * fy_;
  }
  function fbm(x, y, s) {
    var v = 0, amp = 0.5;
    for (var o = 0; o < 5; o++) { v += amp * vnoise(x, y, s + o * 17); x = x * 2.03 + 11.3; y = y * 2.03 + 7.1; amp *= 0.5; }
    return v;
  }
  function sstep(e0, e1, x) { var t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }

  /* ======== 背景(月・雲・星): 180°回しても同じに見えるよう、点対称に作る ======== */
  function makeBackdrop() {
    var bw = Math.max(64, Math.round(iw / 2)), bh = Math.max(64, Math.round(ih / 2));
    bgCv.width = bw; bgCv.height = bh;
    var bctx = bgCv.getContext('2d');
    var img = bctx.createImageData(bw, bh), d = img.data;
    var T = THEMES[theme], asp = ih / iw, R = orbR * bw / iw, S = bgSeed;
    for (var y = 0; y < bh; y++) {
      for (var x = 0; x < bw; x++) {
        var u = (x + 0.5) / bw, v = (y + 0.5) / bh;
        var k = Math.pow(1 - Math.abs(2 * v - 1), 1.25);
        var r = T.edge[0] + (T.mid[0] - T.edge[0]) * k, g = T.edge[1] + (T.mid[1] - T.edge[1]) * k, b = T.edge[2] + (T.mid[2] - T.edge[2]) * k;
        var dx = x + 0.5 - bw / 2, dy = y + 0.5 - bh / 2, dd = Math.sqrt(dx * dx + dy * dy);
        var gl = Math.exp(-Math.max(0, dd - R) / (R * 2.0));
        /* 雲(点対称) */
        var nx = u * 3.4, ny = v * 3.4 * asp;
        var n = 0.5 * (fbm(nx, ny, S) + fbm(3.4 - nx, 3.4 * asp - ny, S));
        var c = sstep(0.42, 0.78, n) * 0.9;
        var lit = 0.2 + 0.8 * gl;
        r += (T.cd[0] + (T.cl[0] - T.cd[0]) * lit - r) * c;
        g += (T.cd[1] + (T.cl[1] - T.cd[1]) * lit - g) * c;
        b += (T.cd[2] + (T.cl[2] - T.cd[2]) * lit - b) * c;
        /* 月のまわりの光 */
        var hl = Math.exp(-Math.max(0, dd - R) / (R * 1.5)) * 0.5;
        r += T.halo[0] * hl; g += T.halo[1] * hl; b += T.halo[2] * hl;
        /* 月 */
        var m = sstep(R + 1.1, R - 1.1, dd);
        if (m > 0) {
          var px = dx / R, py = dy / R;
          var tx = 0.5 * (fbm(px * 2.6 + 9, py * 2.6, S + 5) + fbm(-px * 2.6 + 9, -py * 2.6, S + 5));
          var sh = 0.74 + 0.34 * tx;
          r += (T.orb[0] * sh - r) * m; g += (T.orb[1] * sh - g) * m; b += (T.orb[2] * sh - b) * m;
        }
        var o = (y * bw + x) * 4;
        d[o] = r > 255 ? 255 : r; d[o + 1] = g > 255 ? 255 : g; d[o + 2] = b > 255 ? 255 : b; d[o + 3] = 255;
      }
    }
    bctx.putImageData(img, 0, 0);
    stars = [];
    for (var s = 0; s < 70; s++) {
      var su = Math.random(), sv = Math.random(), sd = Math.sqrt(Math.pow((su - 0.5) * iw, 2) + Math.pow((sv - 0.5) * ih, 2));
      if (sd < orbR * 1.5) continue;
      var sp = Math.random() * 6.28, sb = 0.4 + Math.random() * 0.6;
      stars.push({ u: su, v: sv, p: sp, b: sb }); stars.push({ u: 1 - su, v: 1 - sv, p: sp + 1.7, b: sb });
    }
  }

  /* ======== 砂の入れ物(石の棚・隙間・層) ======== */
  function pickType(T, last) {
    var tot = 0, k;
    for (k = 0; k < 7; k++) tot += T.wt[k];
    for (var tries = 0; tries < 12; tries++) {
      var r = Math.random() * tot;
      for (k = 0; k < 7; k++) { r -= T.wt[k]; if (r <= 0) break; }
      if (k + 1 !== last && k + 1 !== 6) return k + 1;
    }
    return 3;
  }
  function fillSand() {
    var T = THEMES[theme], i, x, y;
    for (i = 0; i < N; i++) { a[i] = 0; throat[i] = 0; }
    gaps = [];
    var bm = Math.round(GH * 0.5), thick = 5;
    var n = Math.max(4, Math.round(GW / 52));
    for (var gi = 0; gi < n; gi++) {
      var gx = Math.round((gi + 0.5) / n * GW + (Math.random() - 0.5) * 0.5 * GW / n);
      gx = Math.max(4, Math.min(GW - 5, gx));
      gaps.push({ x: gx, w: 3 + (Math.random() < 0.35 ? 1 : 0), ph: Math.random() * 6.28, om: 0.6 + Math.random() * 0.9 });
    }
    var ph1 = Math.random() * 6.28;
    var yTop = new Int32Array(GW), isGap = new Int32Array(GW);
    for (x = 0; x < GW; x++) {
      yTop[x] = bm + Math.round(2 * Math.sin(x * 0.19 + ph1) + 1.4 * Math.sin(x * 0.07) + (hash2(x >> 2, 3, 9) - 0.5) * 2.6);
      for (var g = 0; g < gaps.length; g++) { if (Math.abs(x - gaps[g].x) <= gaps[g].w / 2) isGap[x] = g + 1; }
    }
    /* 石の棚 */
    for (x = 0; x < GW; x++) {
      for (y = yTop[x]; y < yTop[x] + thick; y++) {
        var idx = y * GW + x;
        if (isGap[x]) continue;
        a[idx] = WALL | (((Math.random() * 255) | 0) << 8);
      }
      if (isGap[x]) for (y = bm - 4; y < bm + thick + 4; y++) throat[y * GW + x] = isGap[x];
    }
    /* 層を作る */
    var rows = Math.round(0.2 * iw / CH), topRow = bm - rows - 4;
    var layers = [], u = 0, lastT = -1;
    while (u < rows + 60) {
      var ty, th;
      if (Math.random() < 0.13) { ty = 6; th = 1; }
      else { ty = pickType(T, lastT); th = 2 + ((Math.random() * 6) | 0); }
      lastT = ty; for (var q = 0; q < th; q++) layers.push(ty); u += th;
    }
    var ph2 = Math.random() * 6.28, ph3 = Math.random() * 6.28;
    for (x = 0; x < GW; x++) {
      var warp = 3.2 * Math.sin(x * 0.045 + ph2) + 2 * Math.sin(x * 0.11 + ph3);
      for (y = topRow; y < yTop[x]; y++) {
        if (isGap[x] && y >= bm - 4) continue;
        var li = Math.round(y - topRow + warp + (Math.random() - 0.5) * 1.8);
        if (li < 0) li = 0; if (li >= layers.length) li = layers.length - 1;
        a[y * GW + x] = layers[li] | (((Math.random() * 255) | 0) << 8);
      }
    }
    /* 床の砂(うすく) */
    for (x = 0; x < GW; x++) {
      for (y = GH - 4; y < GH; y++) {
        var tt = (y === GH - 4 || y === GH - 1) ? 7 : (y === GH - 3 ? 2 : 1);
        if (y === GH - 2) tt = 3;
        a[y * GW + x] = tt | (((Math.random() * 255) | 0) << 8);
      }
    }
  }

  /* ======== 砂のシミュレーション(下へ落ちる/斜めに崩れる。隙間は開いたり閉じたりする) ======== */
  var SLIDE_P = 0.6, SLIDE_UP = 0.14, STEEP = 0.45, BM = 0;
  function step() {
    var moved = 0, tl = tilt, atl = Math.abs(tl), sg = tl > 0 ? 1 : -1, pr_ = 0.5 + 0.5 * tl;
    stepCount++;
    for (var y = GH - 2; y >= 0; y--) {
      var row = y * GW, rev = ((y + stepCount) & 1) === 0;
      for (var k = 0; k < GW; k++) {
        var x = rev ? GW - 1 - k : k, i = row + x, v = a[i], t = v & 255;
        if (t === 0 || t === WALL) continue;
        var b = i + GW, th;
        if (a[b] === 0) {
          if ((th = throat[b]) !== 0 && Math.random() >= gapOpen[th]) continue;
          if (atl > 0.05 && Math.random() < atl * 0.55) {
            var xs = x + sg;
            if (xs >= 0 && xs < GW && a[b + sg] === 0 && a[i + sg] !== WALL && !(throat[b + sg] !== 0 && Math.random() >= gapOpen[throat[b + sg]])) {
              a[b + sg] = v; a[i] = 0; moved++; continue;
            }
          }
          a[b] = v; a[i] = 0; moved++; continue;
        }
        /* 下がふさがっている → 斜めに崩れる */
        if (Math.random() >= (y < BM ? SLIDE_UP : SLIDE_P)) continue;
        var d = Math.random() < pr_ ? 1 : -1, done = false;
        for (var tr = 0; tr < 2 && !done; tr++, d = -d) {
          var xd = x + d;
          if (xd < 0 || xd >= GW) continue;
          if (a[b + d] !== 0 || a[i + d] === WALL) continue;
          if (Math.random() < STEEP && a[b + d + GW] !== 0) continue;
          if ((th = throat[b + d]) !== 0 && Math.random() >= gapOpen[th]) continue;
          a[b + d] = v; a[i] = 0; moved++; done = true;
        }
        /* 強く傾けたときは、表面を横にもすべる */
        if (!done && atl > 0.55 && Math.random() < (atl - 0.55) * 0.5) {
          var xh = x + sg;
          if (xh >= 0 && xh < GW && a[i + sg] === 0) { a[i + sg] = v; a[i] = 0; moved++; }
        }
      }
    }
    return moved;
  }

  /* ======== 描画 ======== */
  function renderSand(tm) {
    var tt = (tm * 0.009) | 0, d = sandU32, j, v, t, f, lit, rr, gg, bb, h;
    for (var i = 0; i < N; i++) {
      v = a[i]; t = v & 255;
      if (t === 0) { d[i] = 0; continue; }
      j = v >> 8;
      var up = i >= GW ? a[i - GW] : 0;
      var ul = (i >= GW + 1 && (i % GW) > 0) ? a[i - GW - 1] : 1;
      if (t === WALL) {
        lit = (up === 0 ? 1.7 : 1) * (0.55 + j / 255 * 0.7);
        rr = 30 * lit; gg = 34 * lit; bb = 48 * lit;
        if (j > 236) { rr = 196; gg = 218; bb = 255; }
      } else {
        f = 0.88 + j / 255 * 0.24;
        lit = f * (up === 0 ? 1.28 : 1) * (ul === 0 ? 1.08 : 1);
        var gf = 1 + glow[i] * 0.0018;
        rr = pr[t] * lit * gf; gg = pg[t] * lit * gf; bb = pb[t] * lit * gf;
        h = (Math.imul(i, 2654435761) + Math.imul(tt, 40503)) >>> 0;
        if (t === 6) {
          if ((h >>> 24) < 16) { rr = 255; gg = 250; bb = 235; } else { rr *= 1.12; gg *= 1.12; bb *= 1.1; }
        } else if ((h >>> 24) < 2) { rr += 70; gg += 70; bb += 70; }
      }
      d[i] = 0xff000000 | ((bb > 255 ? 255 : bb) << 16) | ((gg > 255 ? 255 : gg) << 8) | (rr > 255 ? 255 : rr);
    }
    sandCtx.putImageData(sandImg, 0, 0);
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h + 0);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function draw(tm) {
    var T = THEMES[theme];
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, W, H);
    var cx = fx + fw / 2, cy = fy + fh / 2;
    var gr = ctx.createRadialGradient(cx, cy, Math.min(fw, fh) * 0.2, cx, cy, Math.max(W, H) * 0.7);
    gr.addColorStop(0, 'rgba(' + T.halo[0] + ',' + T.halo[1] + ',' + T.halo[2] + ',0.13)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    ctx.save();
    var ang = 0, sc = 1;
    if (phase === 1) { var e = ease(flipP); ang = Math.PI * e; sc = 1 - 0.13 * Math.sin(Math.PI * flipP); }
    ctx.translate(cx, cy); ctx.rotate(ang); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
    /* 額縁 */
    var fg = ctx.createLinearGradient(fx, fy, fx + fw, fy + fh);
    fg.addColorStop(0, '#c4cbd6'); fg.addColorStop(0.5, '#5a616e'); fg.addColorStop(1, '#c4cbd6');
    ctx.fillStyle = fg; rrect(fx, fy, fw, fh, 6); ctx.fill();
    ctx.fillStyle = '#05070c'; ctx.fillRect(ix - 3, iy - 3, iw + 6, ih + 6);
    /* 中身 */
    ctx.save(); ctx.beginPath(); ctx.rect(ix, iy, iw, ih); ctx.clip();
    var par = -tilt * 7, pw = iw * 1.05, ph = ih * 1.05;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(bgCv, ix - (pw - iw) / 2 + par, iy - (ph - ih) / 2, pw, ph);
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s], tw = 0.45 + 0.55 * Math.sin(tm * 0.0013 + st.p);
      ctx.fillStyle = 'rgba(235,242,255,' + (st.b * tw * 0.8).toFixed(3) + ')';
      ctx.fillRect(ix + st.u * iw + par * 1.4, iy + st.v * ih, 1.4, 1.4);
    }
    ctx.drawImage(sandCv, ix, iy, iw, ih);
    /* 奥行き: 縁のくらがり */
    var vg = ctx.createRadialGradient(ix + iw / 2, iy + ih / 2, Math.min(iw, ih) * 0.42, ix + iw / 2, iy + ih / 2, Math.max(iw, ih) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,0.5)');
    ctx.fillStyle = vg; ctx.fillRect(ix, iy, iw, ih);
    /* ガラスの反射(傾けると動く。中心対称の斜めの帯) */
    var sp = 0.5 + tilt * 0.4 + (phase === 1 ? 0.45 * Math.sin(Math.PI * flipP) : 0);
    var sg2 = ctx.createLinearGradient(ix + (sp - 0.5) * iw, iy, ix + (sp + 0.5) * iw, iy + ih);
    sg2.addColorStop(0, 'rgba(255,255,255,0)'); sg2.addColorStop(0.5, 'rgba(214,232,255,0.085)'); sg2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg2; ctx.fillRect(ix, iy, iw, ih);
    ctx.restore();
    ctx.restore();
  }

  /* ======== ひっくり返す ======== */
  function flip() {
    if (phase !== 0) return;
    phase = 1; flipStart = now; flipP = 0; fast = false; settled = 0;
  }
  function finishFlip() {
    for (var i = 0, j = N - 1; i < j; i++, j--) {
      var t = a[i]; a[i] = a[j]; a[j] = t;
      var u = throat[i]; throat[i] = throat[j]; throat[j] = u;
    }
    for (var g = 0; g < gaps.length; g++) gaps[g].x = GW - 1 - gaps[g].x;
    phase = 0; settled = 0; stepAcc = 0;
  }

  /* ======== 組み立て ======== */
  function build() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var cap = Math.sqrt(2600000 / (W * H)); if (DPR > cap) DPR = Math.max(1, cap);
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    var M = 14, FB = 9, aw = W - 2 * M, ah = H - 2 * M - 46;
    var ar = Math.max(0.64, Math.min(1.45, aw / ah));
    fw = Math.min(aw, ah * ar); fh = fw / ar;
    fx = (W - fw) / 2; fy = (H - fh) / 2 - 12;
    ix = fx + FB; iy = fy + FB; iw = fw - 2 * FB; ih = fh - 2 * FB;
    var cw = Math.sqrt(iw * ih / (100000 * 0.9));
    GW = Math.max(100, Math.round(iw / cw)); GH = Math.max(110, Math.round(ih / (cw * 0.9)));
    CW = iw / GW; CH = ih / GH; N = GW * GH; BM = Math.round(GH * 0.5);
    a = new Uint16Array(N); throat = new Uint8Array(N); glow = new Uint8Array(N);
    sandCv.width = GW; sandCv.height = GH; sandCtx = sandCv.getContext('2d');
    sandImg = sandCtx.createImageData(GW, GH); sandU32 = new Uint32Array(sandImg.data.buffer);
    orbR = 0.22 * Math.min(iw, ih);
    for (var y = 0; y < GH; y++) {
      for (var x = 0; x < GW; x++) {
        var dx = (x + 0.5) * CW - iw / 2, dy = (y + 0.5) * CH - ih / 2, dd = Math.sqrt(dx * dx + dy * dy);
        glow[y * GW + x] = Math.round(255 * Math.exp(-Math.max(0, dd - orbR) / (orbR * 2.0)));
      }
    }
    bgSeed = (Math.random() * 900) | 0;
    setPalette(); makeBackdrop(); fillSand();
    phase = 0; tilt = 0; tiltT = 0; settled = 0; stepAcc = 0; last = 0;
  }

  /* ======== メインループ ======== */
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min(64, ts - last); last = ts; now += dt;
    if (!started) started = now;
    tilt += (tiltT - tilt) * Math.min(1, dt * 0.009);
    for (var g = 0; g < gaps.length; g++) {
      var o = 0.5 + 0.95 * Math.sin(now * 0.0006 * gaps[g].om + gaps[g].ph);
      gapOpen[g + 1] = o < 0 ? 0 : (o > 1 ? 1 : o);
    }
    if (phase === 1) {
      flipP = (now - flipStart) / FLIP_MS;
      if (flipP >= 1) { flipP = 1; finishFlip(); }
    } else {
      stepAcc += dt / 16.67 * (fast ? 6 : 1.2);
      var movedFrame = 0, cnt = 0;
      while (stepAcc >= 1 && cnt < 14) { stepAcc -= 1; movedFrame += step(); cnt++; }
      if (stepAcc > 14) stepAcc = 0;
      if (cnt > 0) { if (movedFrame === 0) settled++; else settled = 0; }
      if (settled > 360 && !pdown) flip();
    }
    renderSand(now);
    draw(now);
    if (!hint._shown && now - started > 1200) { hint._shown = true; hint.classList.add('on'); }
    if (hint._shown && !hint._off && now - started > 9000) hintOff();
  }
  function hintOff() { hint._off = true; hint.classList.remove('on'); }

  /* ======== 操作 ======== */
  var pd = null;
  cvs.addEventListener('pointerdown', function (e) {
    if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
    pd = { x: e.clientX, t: performance.now(), drag: false, id: e.pointerId };
    pdown = true; hintOff();
    try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
    var me = pd;
    pd.timer = setTimeout(function () { if (pd === me && !me.drag) fast = true; }, 420);
  });
  cvs.addEventListener('pointermove', function (e) {
    if (!pd || e.pointerId !== pd.id) return;
    var dx = e.clientX - pd.x;
    if (!pd.drag && Math.abs(dx) > 14) { pd.drag = true; clearTimeout(pd.timer); fast = false; }
    if (pd.drag) tiltT = Math.max(-1, Math.min(1, dx / (W * 0.26)));
  });
  function up(e) {
    if (!pd || e.pointerId !== pd.id) return;
    clearTimeout(pd.timer);
    var tap = !pd.drag && !fast && (performance.now() - pd.t) < 420;
    fast = false; tiltT = 0; pd = null; pdown = false;
    if (tap) flip();
  }
  cvs.addEventListener('pointerup', up);
  cvs.addEventListener('pointercancel', up);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  var rzT = 0, lastW = 0, lastH = 0;
  function onResize() {
    clearTimeout(rzT);
    rzT = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 3 && Math.abs(window.innerHeight - lastH) < 3) return;
      lastW = window.innerWidth; lastH = window.innerHeight; build();
    }, 150);
  }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', function () { last = 0; });

  lastW = window.innerWidth; lastH = window.innerHeight;
  build();
  requestAnimationFrame(frame);

  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'moon-sand',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {      /* 砂と背景の色を次の組み合わせへ(いまの砂もそのまま染まる) */
          theme = (theme + 1) % THEMES.length; bgSeed = (Math.random() * 900) | 0; setPalette(); makeBackdrop();
        } },
        { label: '↻', name: 'reset', onClick: function () {       /* 砂を入れ直す(隙間の位置・層も新しく) */
          bgSeed = (Math.random() * 900) | 0; makeBackdrop(); fillSand(); phase = 0; settled = 0; stepAcc = 0;
        } }
      ]
    });
  }
})();
</script>
</body>
</html>
