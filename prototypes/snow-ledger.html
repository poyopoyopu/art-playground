<!DOCTYPE html>
<!-- SNOW LEDGER — Claude(クロちゃん)作。試作SAME WINTER(自然のフラクタル・シリーズ2)を、おっちゃんの希望で単独の作品として作り直した。
     改良: 本物っぽい氷(半透明の体・明るい縁・中心の筋・虹色ににじむ縁・腕ごとに光の当たり方が違う・きらめき)、
     育ちきった結晶が降る雪になる、雪の夜の景色(街灯の明かり・遠くの家の灯・もみの木・雪の野原)。ap-kit.js統合: Claude -->
<!-- 世界のルール: 雪の結晶の腕は、育つあいだの「空の状態」をそのまま形に刻む。6本の腕は同じ空を通ってきたので、同じ形になる。
     指は空そのもの。タップ=突風(その瞬間、全部の枝先が同時に枝を出す)、上下になぞる=湿り気(湿るほど枝分かれし、雪もたくさん降る)、
     長押し=冷たく静かな空(枝先に六角の板が育ち、風がやむ)。✦=空の温度(樹枝・扇形・星形・シダ形の育ち方)。
     育ちきった結晶は空から放されて、降る雪の1粒になる。だから降っている雪は、ぜんぶこの空で育った結晶で、
     触っているうちに、降る雪が自分の育てた結晶に入れ替わっていく(降った雪は帳簿のように野原に積もる)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050c">
<title>SNOW LEDGER — 降っている雪は、みんなこの空で育った結晶</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #03050c; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #e6f2ff; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 10px rgba(0, 10, 30, .9), 0 0 16px rgba(140, 190, 255, .45); }
  #hint.on { opacity: .8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ 突風（6本の腕に同じ枝）／ 長押し ＝ 六角の板<br>上下になぞる ＝ 湿り気。育ちきった結晶は、降る雪になる</div>
<script>
(function () {
  'use strict';
  var TAU = Math.PI * 2, R60 = Math.PI / 3, S30 = Math.tan(Math.PI / 6);
  var LIGHT = -2.25;                                    /* 光の来る向き(左上の街灯) */
  var cvs = document.getElementById('c'), hint = document.getElementById('hint');
  var ctx = cvs.getContext('2d', { alpha: false });
  var bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  var W = 0, H = 0, DPR = 1, MIN = 1, RES_CAP = 2600000, YH = 0;
  var now = 0, quality = 2, speedMul = 1;

  /* ======== 空の温度で変わる育ち方(中谷ダイヤグラムの、ざっくり4種) ======== */
  var HABITS = [
    { w: [0.021, 0.013, 0.009, 0.007], rate: 1.0, core: [0.05, 0.09], plate: 0.0, len: 1.0 },    /* 樹枝 */
    { w: [0.052, 0.034, 0.021, 0.014], rate: 0.42, core: [0.10, 0.16], plate: 0.55, len: 0.72 },  /* 扇形 */
    { w: [0.030, 0.017, 0.011, 0.008], rate: 0.22, core: [0.06, 0.10], plate: 0.25, len: 0.8 },   /* 星形 */
    { w: [0.016, 0.010, 0.007, 0.005], rate: 1.7, core: [0.04, 0.07], plate: 0.0, len: 1.1 }      /* シダ形 */
  ];

  /* ======== 結晶: 1本の腕の半分(30°のくさび)だけを育て、12倍(6本×鏡)にして見る ======== */
  function Crystal(hum, habit) {
    this.segs = []; this.tips = []; this.plates = []; this.age = 0; this.gust = 0; this.calm = 0;
    this.hum = hum; this.habit = habit; this.ver = 0; this.sprite = null; this.mine = false;
    var hb = HABITS[habit];
    this.plates.push({ x: 0, y: 0, s: 0, max: hb.core[0] + Math.random() * (hb.core[1] - hb.core[0]), grow: 1, core: true });
    this.armMax = 0.62 + Math.random() * 0.38;
    this.addTip(0.015, 0, 0, 0);
  }
  Crystal.prototype.addTip = function (x, y, ang, lv) {
    if (this.tips.length > 300) return;
    var hb = HABITS[this.habit], h = this.hum;
    var sg = { x1: x, y1: y, x2: x, y2: y, w: hb.w[lv] * (0.75 + 0.5 * (1 - h)), lv: lv };
    this.segs.push(sg);
    this.tips.push({ x: x, y: y, a: ang, ca: Math.cos(ang), sa: Math.sin(ang), lv: lv, seg: sg, since: 0,
      gap: 0.05 + lv * 0.035, sp: [1, 0.5, 0.32, 0.22][lv], len: 0,
      max: lv ? (0.24 / Math.pow(lv, 0.8)) * (0.45 + h) * hb.len : this.armMax, plate: null });
  };
  Crystal.prototype.branch = function (t) {         /* 60°ずつ枝を出す(同じきまりを何段でも) */
    var l = t.lv + 1;
    if (l > 3) return;
    if (t.lv === 0) this.addTip(t.x, t.y, t.a + R60, l);
    else { this.addTip(t.x, t.y, t.a + R60, l); this.addTip(t.x, t.y, t.a - R60, l); }
    t.since = 0;
  };
  Crystal.prototype.gustNow = function () {
    var n = this.tips.length;
    for (var i = 0; i < n; i++) if (this.tips[i].since > 0.012) this.branch(this.tips[i]);
    this.gust = 1; this.ver++;
  };
  Crystal.prototype.setCalm = function (on) {
    this.calm = on ? 1 : 0;
    if (!on) for (var i = 0; i < this.tips.length; i++) this.tips[i].plate = null;
  };
  Crystal.prototype.step = function (dt) {
    var hb = HABITS[this.habit], h = this.hum, i, t;
    this.age += dt;
    this.gust = Math.max(0, this.gust - dt * 1.4);
    if (this.calm) for (i = 0; i < this.tips.length; i++) {
      t = this.tips[i];
      if (!t.plate && t.lv <= 1) { t.plate = { x: t.x, y: t.y, s: 0, max: t.lv ? 0.024 : 0.05, grow: 1 }; this.plates.push(t.plate); }
    }
    var speed = (0.026 + 0.06 * h) * (this.calm ? 0.25 : 1) * (1 + this.gust * 1.5);
    var rate = this.calm ? 0 : (0.25 + h * h * 3.2) * hb.rate;
    for (i = this.tips.length - 1; i >= 0; i--) {
      t = this.tips[i];
      var v = speed * t.sp;
      t.x += t.ca * v * dt; t.y += t.sa * v * dt; t.since += v * dt; t.len += v * dt;
      t.seg.x2 = t.x; t.seg.y2 = t.y;
      var r = Math.hypot(t.x, t.y);
      if (t.y > t.x * S30 + 0.002 || t.y < -0.002 || r > 1 || t.len > t.max) {     /* 隣の腕との境目・外周・伸びきりで止まる */
        if (hb.plate && t.lv <= 2 && Math.random() < hb.plate) this.plates.push({ x: t.x, y: t.y, s: 0, max: t.seg.w * 2.4, grow: 1 });
        this.tips.splice(i, 1); continue;
      }
      if (t.since > t.gap && Math.random() < rate * dt * (t.lv === 0 ? 1.2 : 1)) this.branch(t);
      if (t.plate) { t.plate.x = t.x; t.plate.y = t.y; }
    }
    for (i = 0; i < this.plates.length; i++) {
      var p = this.plates[i];
      if (p.grow) { p.s = Math.min(p.max, p.s + dt * 0.024); if (p.s >= p.max && !this.calm) p.grow = 0; }
    }
    if (this.age > 70) { this.tips.length = 0; for (i = 0; i < this.plates.length; i++) this.plates[i].grow = 0; }
    this.ver++;
  };
  Crystal.prototype.done = function () {
    if (this.tips.length) return false;
    for (var i = 0; i < this.plates.length; i++) if (this.plates[i].grow) return false;
    return true;
  };
  Crystal.prototype.extent = function () {
    var e = 0.05, i;
    for (i = 0; i < this.segs.length; i++) { var s = this.segs[i]; e = Math.max(e, Math.hypot(s.x2, s.y2) + s.w * 0.3); }
    for (i = 0; i < this.plates.length; i++) { var p = this.plates[i]; e = Math.max(e, Math.hypot(p.x, p.y) + p.s); }
    return e;
  };

  /* ---- 形の道筋(Path2D)。軸の上(鏡で重なる)・軸の外・芯の板で分ける ---- */
  function hexPath(P, x, y, s) {
    for (var k = 0; k < 6; k++) {
      var a = k * R60, px = x + Math.cos(a) * s, py = y + Math.sin(a) * s;
      if (k) P.lineTo(px, py); else P.moveTo(px, py);
    }
    P.closePath();
  }
  function newGroup() { return { body: new Path2D(), rib: new Path2D(), pl: new Path2D(), pld: new Path2D(), empty: true }; }
  Crystal.prototype.paths = function () {
    if (this._pv === this.ver) return this._p;
    var G = { axis: newGroup(), off: newGroup(), core: newGroup() }, i, k;
    for (i = 0; i < this.segs.length; i++) {
      var s = this.segs[i], dx = s.x2 - s.x1, dy = s.y2 - s.y1, L = Math.hypot(dx, dy);
      if (L < 1e-4) continue;
      var g = (s.lv === 0) ? G.axis : G.off;
      var ux = dx / L, uy = dy / L, nx = -uy, ny = ux, hb = s.w * 0.5, ht = hb * 0.78, cap = Math.min(L * 0.5, hb * 1.3);
      var bx = s.x1 - ux * hb * 0.4, by = s.y1 - uy * hb * 0.4, ex = s.x2 - ux * cap, ey = s.y2 - uy * cap;
      g.body.moveTo(bx + nx * hb, by + ny * hb); g.body.lineTo(ex + nx * ht, ey + ny * ht); g.body.lineTo(s.x2, s.y2);
      g.body.lineTo(ex - nx * ht, ey - ny * ht); g.body.lineTo(bx - nx * hb, by - ny * hb); g.body.closePath();
      g.rib.moveTo(s.x1, s.y1); g.rib.lineTo(s.x2 - ux * cap * 0.4, s.y2 - uy * cap * 0.4);
      g.empty = false;
    }
    for (i = 0; i < this.plates.length; i++) {
      var p = this.plates[i];
      if (p.s < 0.004) continue;
      var gp = p.core ? G.core : (Math.abs(p.y) < 0.004 ? G.axis : G.off);
      hexPath(gp.pl, p.x, p.y, p.s);
      hexPath(gp.pld, p.x, p.y, p.s * 0.62);
      if (p.core) { hexPath(gp.pld, p.x, p.y, p.s * 0.34); hexPath(gp.pld, p.x, p.y, p.s * 0.14); }
      for (k = 0; k < 6; k++) { gp.pld.moveTo(p.x, p.y); gp.pld.lineTo(p.x + Math.cos(k * R60) * p.s * 0.95, p.y + Math.sin(k * R60) * p.s * 0.95); }
      gp.empty = false;
    }
    this._p = G; this._pv = this.ver;
    return G;
  };
  Crystal.prototype.glintPts = function () {         /* きらめく所: 腕の先・大きな枝の先・芯の角 */
    if (this._gv === this.ver) return this._g;
    var ends = [], g = [], i;
    for (i = 0; i < this.segs.length; i++) { var s = this.segs[i]; if (s.lv <= 1) ends.push([s.x2, s.y2, Math.hypot(s.x2, s.y2)]); }
    ends.sort(function (a, b) { return b[2] - a[2]; });
    for (i = 0; i < Math.min(4, ends.length); i++) g.push([ends[i][0], ends[i][1], i * 1.7]);
    if (this.plates[0].s > 0.02) g.push([this.plates[0].s, 0, 5.1]);
    this._g = g; this._gv = this.ver;
    return g;
  };

  /* ======== 氷の描き方 ======== */
  function irid(c) {                                     /* 薄い氷の虹色(中心からの距離で色が変わる) */
    if (c.__irid) return c.__irid;
    var g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, 'rgba(255,214,240,0.22)'); g.addColorStop(0.07, 'rgba(160,240,255,0.2)');
    g.addColorStop(0.15, 'rgba(255,236,170,0.17)'); g.addColorStop(0.25, 'rgba(200,170,255,0.17)');
    g.addColorStop(0.4, 'rgba(150,230,255,0.15)'); g.addColorStop(0.6, 'rgba(255,200,230,0.13)');
    g.addColorStop(0.85, 'rgba(170,255,240,0.12)'); g.addColorStop(1, 'rgba(230,240,255,0.1)');
    c.__irid = g;
    return g;
  }
  function setT(c, bs, x, y, ang, R, m) {
    var ca = Math.cos(ang) * bs, sa = Math.sin(ang) * bs;
    c.setTransform(ca * R, sa * R, -sa * R * m, ca * R * m, x * bs, y * bs);
  }
  function drawCrystal(c, C, bs, cx, cy, R, rot, A, t, hi, glints) {
    var G = C.paths(), ir = irid(c), list = [], k, i;
    for (k = 0; k < 6; k++) list.push([G.axis, rot + k * R60, 1, k]);
    for (k = 0; k < 6; k++) { list.push([G.off, rot + k * R60, 1, k]); list.push([G.off, rot + k * R60, -1, k]); }
    list.push([G.core, rot, 1, 0]);
    c.globalCompositeOperation = 'lighter';
    c.lineJoin = 'round'; c.lineCap = 'round';
    var bright = [];
    for (i = 0; i < list.length; i++) {
      var g = list[i][0], ang = list[i][1], m = list[i][2], kk = list[i][3];
      if (g.empty) { bright.push(0); continue; }
      var th = ang + (g === G.off ? m * 0.35 : 0);
      var f = 0.5 + 0.5 * Math.cos(th - LIGHT), b = 0.35 + 0.65 * Math.pow(f, 2.5), sp = Math.pow(f, 14);
      if (g === G.core) { b = 0.8; sp = 0.25; }
      bright.push(b);
      setT(c, bs, cx, cy, ang, R, m);
      c.globalAlpha = A * b; c.fillStyle = 'rgba(150,190,240,0.2)'; c.fill(g.body);
      c.globalAlpha = A * b * (0.75 + 0.25 * Math.sin(t * 0.7 + kk * 1.3 + m)); c.fillStyle = ir; c.fill(g.pl);
      if (sp > 0.02) { c.globalAlpha = A * sp; c.fillStyle = 'rgba(255,255,255,0.34)'; c.fill(g.body); c.fill(g.pl); }
      if (hi) {                                          /* 縁が虹色ににじむ(プリズム) */
        c.lineWidth = 1.3 / R; c.globalAlpha = A * (0.5 + 0.5 * b);
        setT(c, bs, cx + 0.8, cy + 0.45, ang, R, m); c.strokeStyle = 'rgba(255,92,150,0.2)'; c.stroke(g.body); c.stroke(g.pl);
        setT(c, bs, cx - 0.8, cy - 0.45, ang, R, m); c.strokeStyle = 'rgba(90,170,255,0.3)'; c.stroke(g.body); c.stroke(g.pl);
        setT(c, bs, cx, cy, ang, R, m);
      }
      c.globalAlpha = A * (0.3 + 0.7 * b); c.lineWidth = 1.0 / R; c.strokeStyle = 'rgba(236,246,255,0.48)';
      c.stroke(g.body); c.stroke(g.pl);
      c.lineWidth = 0.75 / R; c.strokeStyle = 'rgba(255,255,255,0.42)'; c.stroke(g.rib);
      c.strokeStyle = 'rgba(210,232,255,0.3)'; c.stroke(g.pld);
    }
    c.setTransform(bs, 0, 0, bs, 0, 0);
    if (glints) {
      var pts = C.glintPts();
      for (i = 0; i < list.length - 1; i++) {
        var bb = bright[i];
        if (bb < 0.72) continue;
        var a2 = list[i][1], m2 = list[i][2], ca = Math.cos(a2), sa = Math.sin(a2);
        for (var j = 0; j < pts.length; j++) {
          var px = pts[j][0], py = pts[j][1] * m2;
          var tw = Math.sin(t * 1.7 + pts[j][2] + list[i][3] * 2.1 + m2);
          if (tw <= 0) continue;
          var al = A * Math.pow(tw, 10) * (bb - 0.72) * 3.6;
          if (al < 0.03) continue;
          star(c, cx + (px * ca - py * sa) * R, cy + (px * sa + py * ca) * R, 7 + 16 * al, al);
        }
      }
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }

  /* ---- 光の素材 ---- */
  function radialSprite(size, stops) {
    var s = document.createElement('canvas'); s.width = s.height = size;
    var g = s.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (var i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return s;
  }
  var DOT = radialSprite(32, [[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(225,238,255,0.55)'], [0.6, 'rgba(190,215,255,0.12)'], [1, 'rgba(190,215,255,0)']]);
  var GLOW = radialSprite(128, [[0, 'rgba(160,200,255,0.5)'], [0.35, 'rgba(120,170,255,0.16)'], [1, 'rgba(100,150,255,0)']]);
  var WARM = radialSprite(64, [[0, 'rgba(255,236,190,1)'], [0.18, 'rgba(255,190,110,0.7)'], [0.5, 'rgba(255,150,70,0.18)'], [1, 'rgba(255,140,60,0)']]);
  var STAR = (function () {
    var s = document.createElement('canvas'); s.width = s.height = 96;
    var g = s.getContext('2d'), c = 48, i;
    g.globalCompositeOperation = 'lighter';
    g.drawImage(radialSprite(96, [[0, 'rgba(255,255,255,0.9)'], [0.12, 'rgba(220,235,255,0.35)'], [0.4, 'rgba(170,200,255,0.06)'], [1, 'rgba(170,200,255,0)']]), 0, 0);
    for (i = 0; i < 4; i++) {
      var a = i * Math.PI / 2, len = i % 2 ? 46 : 46, lg = g.createLinearGradient(c, c, c + Math.cos(a) * len, c + Math.sin(a) * len);
      lg.addColorStop(0, 'rgba(255,255,255,0.9)'); lg.addColorStop(1, 'rgba(200,225,255,0)');
      g.strokeStyle = lg; g.lineWidth = 1.6; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a) * len, c + Math.sin(a) * len); g.stroke();
    }
    for (i = 0; i < 4; i++) {
      var a2 = Math.PI / 4 + i * Math.PI / 2, lg2 = g.createLinearGradient(c, c, c + Math.cos(a2) * 22, c + Math.sin(a2) * 22);
      lg2.addColorStop(0, 'rgba(255,255,255,0.45)'); lg2.addColorStop(1, 'rgba(200,225,255,0)');
      g.strokeStyle = lg2; g.lineWidth = 1; g.beginPath(); g.moveTo(c, c); g.lineTo(c + Math.cos(a2) * 22, c + Math.sin(a2) * 22); g.stroke();
    }
    return s;
  })();
  function star(c, x, y, r, a) {
    var pa = c.globalAlpha, po = c.globalCompositeOperation;
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, a);
    c.drawImage(STAR, x - r, y - r, r * 2, r * 2);
    c.globalAlpha = pa; c.globalCompositeOperation = po;
  }

  /* 降る雪用に、結晶を1枚の絵にしておく(はっきり版とぼけ版) */
  function makeSprites(C, rot) {
    var ext = C.extent(), S = 224;
    var hi = document.createElement('canvas'); hi.width = hi.height = S;
    var c = hi.getContext('2d');
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.5; c.drawImage(GLOW, S * 0.1, S * 0.1, S * 0.8, S * 0.8);
    drawCrystal(c, C, 1, S / 2, S / 2, S * 0.47 / ext, rot, 1, Math.random() * 10, true, false);
    var lo = document.createElement('canvas'); lo.width = lo.height = 40;
    var l = lo.getContext('2d'); l.imageSmoothingEnabled = true; l.imageSmoothingQuality = 'high';
    l.drawImage(hi, 0, 0, 40, 40);
    C.sprite = { hi: hi, lo: lo, ext: ext };
  }
  /* 空で育ったことにして、ひとつ結晶を作る(最初から降っている雪のため) */
  function simulate() {
    var C = new Crystal(0.2 + Math.random() * 0.7, (Math.random() * HABITS.length) | 0), n = 0, calmLeft = 0;
    while (!C.done() && n < 1500) {
      if (Math.random() < 0.006) C.gustNow();
      if (!calmLeft && Math.random() < 0.003) { calmLeft = 30 + Math.random() * 40; C.setCalm(true); }
      if (calmLeft && --calmLeft <= 0) { calmLeft = 0; C.setCalm(false); }
      C.hum = Math.max(0.05, Math.min(0.95, C.hum + (Math.random() - 0.5) * 0.02));
      C.step(0.05); n++;
    }
    C.setCalm(false);
    makeSprites(C, Math.random() * TAU);
    return C;
  }

  /* ======== 雪の夜の景色(大きさが変わったときだけ描き直す) ======== */

    ctx.globalAlpha = A * (0.28 + 0.3 * gustFlash);
    var gr = R * (0.5 + ext) * 1.3;
    ctx.drawImage(GLOW, CX - gr, CY + bob - gr, gr * 2, gr * 2);
    drawCrystal(ctx, main, DPR, CX, CY + bob, R, rot, A, now, quality === 2, true);

    for (i = split; i < flakes.length; i++) {
      f = flakes[i];
      drawFlake(f, f.cur || f.rad, f.C.sprite.hi, f.state === 'rel' ? 1 : 0.4 + 0.55 * f.z);
    }
    for (i = 0; i < blurs.length; i++) {
      var b = blurs[i], bw = b.rad / 0.47;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(b.x, b.y); ctx.rotate(b.spin);
      ctx.globalAlpha = 0.13; ctx.drawImage(b.C.sprite.lo, -bw / 2, -bw / 2, bw, bw);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  /* ======== ループ ======== */
  var last = 0, perfAcc = 0, perfN = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000; last = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0.0005) dt = 0.0005;
    dt *= speedMul;
    now += dt;
    update(dt);
    render();
    perfAcc += dt * 1000 / speedMul; perfN++;
    if (perfN >= 90) { if (perfAcc / perfN > 26 && quality === 2) quality = 1; perfAcc = 0; perfN = 0; }
    requestAnimationFrame(frame);
  }

  /* 初期化 */
  resize();
  for (var i0 = 0; i0 < 12; i0++) pool.push(simulate());
  humGoal = hum = 0.4 + Math.random() * 0.3;
  newMain();
  var first = Math.round(8 + 26 * hum);
  for (var j0 = 0; j0 < first; j0++) flakes.push(newFlake(null, true));
  setTimeout(function () { hint.classList.add('on'); }, 550);
  setTimeout(hideHint, 7500);
  requestAnimationFrame(frame);

  /* テスト用 */
  window.__snow = { speed: function (s) { speedMul = s; }, release: function () { if (main.segs.length) release(); }, tap: tap,
    state: function () { return { flakes: flakes.length, landed: landed.length, pool: pool.length, mine: pool.filter(function (c) { return c.mine; }).length, hum: hum, quality: quality, mainState: mainState, tips: main.tips.length }; } };

  /* ---- 共有コントロール(ap-kit.js) ---- */
  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'snow-ledger',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {      /* 空の温度を変える: 樹枝→扇形→星形→シダ形(いま育っている結晶にも、この先の枝から効く) */
          habit = (habit + 1) % HABITS.length; main.habit = habit; gustFlash = 0.5;
        } },
        { label: '↻', name: 'reset', onClick: function () {       /* 新しい結晶の芽から。野原の雪も消える */
          landed.length = 0; humSeed = Math.random() * 100; newMain();
        } }
      ]
    });
  }
})();
</script>
</body>
