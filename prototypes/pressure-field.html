<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PRESSURE FIELD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* PRESSURE FIELD — ChatGPT作。ap-kit.js統合: ChatGPT */
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<div style="color:white;padding:2em;font:16px sans-serif">WebGL2 required.</div>';throw new Error('WebGL2 required');}

const vs=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.,1.);}
`;

const fs=`#version 300 es
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform float u_phase;
uniform float u_touchCount;
uniform vec4 u_laws[12];
out vec4 outColor;

#define PI 3.14159265359

float hash21(vec2 p){
  p=fract(p*vec2(123.34,345.45));
  p+=dot(p,p+34.345);
  return fract(p.x*p.y);
}

vec2 fold(vec2 p){
  p=abs(p);
  p-=floor(p*2.0)/2.0;
  return p;
}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*u_res)/min(u_res.x,u_res.y);
  vec2 p=uv;
  float aspect=u_res.x/u_res.y;
  p.x*=aspect;

  // A continuously moving coordinate lattice, closed by u_phase.
  float t=u_phase/(2.0*PI);

  // Each touch permanently writes a local pressure well.
  float pressure=0.0;
  vec2 displacement=vec2(0.0);
  for(int i=0;i<12;i++){
    if(float(i)>=u_touchCount) break;
    vec4 q=u_laws[i];
    vec2 d=p-q.xy;
    float r=length(d)+0.0001;
    float w=exp(-r*r/(q.z*q.z));
    pressure+=w*q.w;
    displacement+=normalize(d)*w*q.w*0.11;
  }

  p+=displacement;
  p*=1.0+pressure*0.17;

  // Deep recursive Cartesian folding creates nested architecture.
  vec2 f=p;
  float bands=0.0;
  float glow=0.0;
  for(int i=0;i<7;i++){
    float fi=float(i);
    f=fold(f*1.72+vec2(
      sin(t*PI*2.0+fi*1.7)*0.035,
      cos(t*PI*2.0*1.5+fi)*0.035
    ));
    float rr=length(f-vec2(.25));
    float line=exp(-pow(abs(fract(rr*5.0+fi*.17)-.5)*18.0,2.0));
    bands+=line/(1.0+fi*.7);
    glow+=exp(-rr*12.0)/(1.0+fi);
  }

  // Pressure changes the spacing of the whole field, not just its color.
  float strata=sin((p.x+p.y*0.63+pressure*1.8)*18.0+sin(t*PI*2.0)*2.0);
  float contour=sin(length(p)*30.0-pressure*12.0+strata*.35);
  float edge=smoothstep(.72,.05,abs(contour));

  vec3 a=vec3(.025,.03,.045);
  vec3 b=vec3(.16,.28,.34);
  vec3 c=vec3(.75,.47,.23);
  float hue=0.5+0.5*sin(pressure*2.0+bands*.7+t*PI*2.0);
  vec3 col=mix(a,b,smoothstep(.0,.65,bands));
  col=mix(col,c,pow(max(hue,0.0),3.0)*0.55*edge);
  col+=vec3(.32,.48,.52)*glow*.7;
  col*=.72+.28*edge;
  col+=vec3(.02,.018,.012)*strata;

  // Subtle grain prevents flat digital gradients.
  float n=hash21(gl_FragCoord.xy+floor(u_time*60.0));
  col+=((n-.5)/255.0);

  float vignette=1.0-smoothstep(.55,1.15,length(uv));
  col*=.72+.28*vignette;
  outColor=vec4(col,1.0);
}
`;

function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U={
 res:gl.getUniformLocation(prog,'u_res'),
 time:gl.getUniformLocation(prog,'u_time'),
 phase:gl.getUniformLocation(prog,'u_phase'),
 count:gl.getUniformLocation(prog,'u_touchCount'),
 laws:gl.getUniformLocation(prog,'u_laws')
};

let laws=[];
let seed=Math.random()*1000;
function randomize(){
  seed=Math.random()*1000;
  laws=[];
  for(let i=0;i<5;i++) laws.push([
    (Math.random()*2-1)*1.05,
    (Math.random()*2-1)*.72,
    .12+Math.random()*.18,
    .28+Math.random()*.42
  ]);
}
function reset(){laws=[];}
function addPressure(x,y,strength){
  const rect=canvas.getBoundingClientRect();
  const nx=((x-rect.left)/rect.width-.5)*(rect.width/Math.min(rect.width,rect.height));
  const ny=(.5-(y-rect.top)/rect.height)*(rect.height/Math.min(rect.width,rect.height));
  laws.push([nx,ny,.09+Math.min(0.22,strength*.12),Math.min(1.25,.42+strength*.45)]);
  if(laws.length>12) laws.shift();
}

let down=false,downAt=0,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY)) return;
  down=true;downAt=performance.now();lastX=e.clientX;lastY=e.clientY;
  addPressure(e.clientX,e.clientY,.75);
});
canvas.addEventListener('pointermove',e=>{
  if(!down)return;
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY)) return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  const speed=Math.min(2.5,Math.hypot(dx,dy)/8);
  addPressure(e.clientX,e.clientY,.35+speed);
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('pointerup',()=>down=false);
canvas.addEventListener('pointercancel',()=>down=false);

function resize(){
  const d=Math.min(2,devicePixelRatio||1);
  const w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
}
function draw(phase,time){
  resize();
  gl.useProgram(prog);
  gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.time,time);
  gl.uniform1f(U.phase,phase);
  gl.uniform1f(U.count,laws.length);
  const flat=new Float32Array(12*4);
  laws.forEach((q,i)=>flat.set(q,i*4));
  gl.uniform4fv(U.laws,flat);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
const start=performance.now();
function frame(now){
  draw(((now-start)/1000 % 7)/7*2*PI,(now-start)/1000);
  requestAnimationFrame(frame);
}
randomize();
requestAnimationFrame(frame);

APKit.init({
  canvas:canvas,
  gifName:'pressure-field-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase,phase/(2*PI)*7);},
  buttons:[
    {label:'✦',name:'mutate',onClick:randomize},
    {label:'↻',name:'reset',onClick:reset}
  ]
});
</script>
</body>
</html>
