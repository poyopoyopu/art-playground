<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL GROWTH</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;
let W=0,H=0,D=1,t=0,seed=Math.random()*100,paused=false,nodes=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function hash(a){return Math.abs(Math.sin(a*127.1+seed*31.7)*43758.5453)%1}
function addNode(px,py){nodes.push({x:px,y:py,b:Math.random()*TAU,r:8+Math.random()*13,a:0});if(nodes.length>9)nodes.shift()}
function draw(ph){
 x.fillStyle='#030407';x.fillRect(0,0,W,H);
 const s=Math.min(W,H),cx=W*.5,cy=H*.5;
 x.save();x.translate(cx,cy);
 const pulse=.5+.5*Math.sin(ph*.9);
 for(let k=0;k<7;k++){const sc=s*(.05+k*.095),rot=ph*(.035+k*.009)+seed*.01;
  x.save();x.rotate(rot);x.globalAlpha=.11;
  x.beginPath();for(let j=0;j<=144;j++){const q=j/144*TAU,r=sc*(1+.06*Math.sin(j*.37+ph+k)+.025*Math.sin(j*1.7));const xx=Math.cos(q)*r,yy=Math.sin(q)*r;x.lineTo(xx,yy)}x.closePath();x.strokeStyle='rgba(150,180,205,.8)';x.lineWidth=1.1;x.stroke();x.restore()}
 x.globalAlpha=1;
 nodes.forEach((q,ni)=>{
   const age=Math.min(1,q.a/4),R=q.r*(1+q.a*.42);
   x.save();x.translate(q.x-W/2,q.y-H/2);x.rotate(q.b+ph*.03);
   for(let lev=0;lev<4;lev++){const rr=R*(.32+lev*.23)*(1+.08*Math.sin(ph+ni+lev));x.beginPath();
    for(let j=0;j<9;j++){const a=j/8*TAU+lev*.17,r=rr*(.78+.22*Math.sin(j*2.4+ni+lev));x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
    x.closePath();x.strokeStyle=`hsla(${185+ni*31+lev*17},75%,${62+lev*7}%,${.25+age*.45})`;x.lineWidth=1.2+age*2;x.stroke()}
   for(let b=0;b<6;b++){const a=b/6*TAU;const len=R*(1.4+age*1.8);x.beginPath();x.moveTo(Math.cos(a)*R*.25,Math.sin(a)*R*.25);x.lineTo(Math.cos(a+.12*Math.sin(ph+b))*len,Math.sin(a+.12*Math.sin(ph+b))*len);x.strokeStyle=`hsla(${200+ni*27+b*9},85%,72%,${.18+age*.4})`;x.stroke()}
   x.restore();
 });
 const g=x.createRadialGradient(0,0,0,0,0,s*.32);g.addColorStop(0,`rgba(210,225,255,${.12+.08*pulse})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-s*.5,-s*.5,s,s);
 x.restore();
}
function loop(now){if(!paused){t=now*.001;draw(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;addNode(e.clientX,e.clientY)});
APKit.init({canvas:c,gifName:'opal-growth-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*100}},{label:'↻',name:'reset',onClick:()=>{nodes=[]}}]});
</script></body></html>
