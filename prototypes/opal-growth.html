<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL GROWTH</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const VS='#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}';
const FS='#version 300 es\nprecision highp float;in vec2 uv;out vec4 o;uniform vec2 res;uniform float t,seed;uniform vec4 core[8];uniform float age[8];uniform int n;\nfloat h(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.7);return fract(p.x*p.y);}\nfloat noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nfloat fb(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=mat2(1.6,1.2,-1.2,1.6)*p+7.1;a*=.45;}return s;}\nvoid main(){vec2 P=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);float field=fb(P*2.2+vec2(seed));float growth=0.;float crystal=0.;for(int i=0;i<8;i++){if(i>=n)break;vec2 d=P-core[i].xy;float r=length(d);float R=core[i].z;float a=age[i];float rings=exp(-abs(r-R*(.45+.045*a))*70.)*(.4+.6*smoothstep(0.,3.,a));float spokes=pow(max(0.,cos(atan(d.y,d.x)*int(7.+mod(float(i)*3.,6.)) + field*4.)),18.);growth+=rings*(.35+spokes*.8);crystal+=exp(-r*r/(R*R*1.8))*(.08+.035*a)*(0.5+0.5*sin(r*90.-a*2.));}float v=field*.72+growth*1.5+crystal;float edge=smoothstep(.25,.8,abs(field-.5));vec3 ir=.5+.5*cos(6.283*(v*1.7+vec3(0.,.32,.67)+P.x*.12-P.y*.08));vec3 base=mix(vec3(.015,.018,.028),vec3(.48,.5,.56),smoothstep(.25,.7,v));base+=ir*(.12+growth*.8);float spec=pow(max(0.,dot(normalize(vec3(-.35,.65,.7)),normalize(vec3(-dFdx(v)*3.,-dFdy(v)*3.,1.)))),18.);base+=spec*vec3(1.,.95,.9);o=vec4(pow(base/(1.+base*.22),vec3(.9)),1.); }';
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);let u={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name.replace(/\[0\]$/,''))}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*40,cores=[],live=0,paused=false;function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}function draw(ph){gl.useProgram(p);gl.viewport(0,0,c.width,c.height);gl.uniform2f(u.res,c.width,c.height);gl.uniform1f(u.t,ph);gl.uniform1f(u.seed,seed);let cc=new Float32Array(32),aa=new Float32Array(8);cores.forEach((q,i)=>{cc.set([q.x,q.y,q.r],i*4);aa[i]=q.a});gl.uniform4fv(u.core,cc);gl.uniform1fv(u.age,aa);gl.uniform1i(u.n,cores.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);cores.push({x:q[0],y:q[1],r:.045+Math.random()*.05,a:0});if(cores.length>8)cores.shift()});let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused){live+=dt;cores.forEach(q=>q.a+=dt);draw(live*.12)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'opal-growth-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(ph){paused=true;draw(ph)},onExportEnd:function(){paused=false;last=performance.now()},buttons:[{label:'✦',name:'mutate',onClick:function(){seed=Math.random()*80}},{label:'↻',name:'reset',onClick:function(){cores=[];live=0}}]});
</script></body></html>
