<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>POLAR FIELD</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,charges=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function draw(T=t){x.fillStyle='#030509';x.fillRect(0,0,W,H);let S=Math.min(W,H)*.72,cx=W/2,cy=H/2;for(let yy=-S;yy<S;yy+=5)for(let xx=-S;xx<S;xx+=5){let px=xx/S*2,py=yy/S*2,fx=0,fy=0,src=[{x:-.72,y:0,q:1},{x:.72,y:0,q:-1},...charges.map(z=>({x:z.x/W*2-1,y:z.y/H*2-1,q:z.q}))];for(const q of src){let dx=px-q.x,dy=py-q.y,r2=dx*dx+dy*dy+.018,f=q.q/r2;fx+=dx*f;fy+=dy*f}let ang=Math.atan2(fy,fx),mag=Math.min(1,Math.hypot(fx,fy)*.015),phase=Math.sin((px*Math.cos(ang)+py*Math.sin(ang))*55+T*.7);if(Math.abs(phase)<.12){let h=(ang*57.3+seed*100+T*5+120)%360;x.fillStyle=`hsla(${h},95%,${55+mag*30}%,${.2+mag*.7})`;x.fillRect(cx+xx,cy+yy,4.5,4.5)}}}function touch(px,py){charges.push({x:px,y:py,q:Math.random()<.5?1:-1});if(charges.length>10)charges.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'polar-field-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;charges=[]}},{label:'↻',name:'reset',onClick:()=>charges=[]}]});</script></body></html>
