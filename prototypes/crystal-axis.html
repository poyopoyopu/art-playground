<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRYSTAL AXIS</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#888;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  CRYSTAL AXIS — Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: makeitrad の StyleGAN3 結晶アニメーション(おっちゃん提供の動画)

  世界のルール:
  この結晶は、いま持っている「対称の軸」の数だけの法則で育っている。
  触ると、触った方向に新しい鏡面(軸)が1枚生まれ、世界はその軸を含めた対称性で
  組み直される。軸は消えない。増えるほど結晶は複雑になり、元の形には戻らない。
  軸が9枚を超えると、いちばん近い軸に吸収されて1枚の強い軸になる(法則の統合)。
  何もしなくても結晶はゆっくり成長し続ける。
*/
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}
  return {p,u}}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const NAX=9;

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float k;      /* ループ位相 0..2PI */
uniform float grow;   /* 蓄積した成長 0..1 */
uniform float hue;
uniform float nax;    /* 有効な軸の数 */
uniform float seedA,seedB,seedC;
uniform vec4 ax[${NAX}];  /* xyz=鏡面の法線 w=効き具合0..1 */

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdOcta(vec3 p,float s){p=abs(p);return (p.x+p.y+p.z-s)*0.57735;}
vec3 pal(float x){return 0.5+0.5*cos(6.28318*(x+vec3(0.0,0.33,0.67)));}

/* 世界の法則。軸(鏡面)で畳んでから、同じ変換を5階層くり返す */
float map(vec3 p){
  for(int i=0;i<${NAX};i++){
    if(float(i)>=nax)break;
    vec3 n=ax[i].xyz;
    p -= 2.0*min(dot(p,n),0.0)*n*ax[i].w;
  }
  float s=1.0,d=1e9;
  vec3 q=p;
  for(int i=0;i<5;i++){
    q=abs(q);
    if(q.x<q.y)q.xy=q.yx;
    if(q.x<q.z)q.xz=q.zx;
    if(q.y<q.z)q.yz=q.zy;
    q.xz*=rot(seedA+0.11*float(i));
    q=q*1.58-vec3(0.93,0.44,0.93)*0.58;
    q.xy*=rot(seedB+0.05*float(i));
    s*=1.58;
    d=min(d,sdOcta(q,0.92+0.46*grow+0.07*sin(k+float(i)*1.7+seedC))/s);
  }
  return d*0.88;
}
vec3 nrm(vec3 p){
  vec2 e=vec2(1.0,-1.0)*0.0015;
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx));
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 ro=vec3(0.0,0.05*sin(k*2.0),-4.3),rd=normalize(vec3(uv,1.75));
  mat2 R=rot(k);
  ro.xz*=R; rd.xz*=R;

  float t=0.15;bool hit=false;
  for(int i=0;i<88;i++){
    vec3 p=ro+rd*t;float d=map(p);
    if(d<0.0013*t){hit=true;break;}
    t+=d; if(t>11.0)break;
  }

  /* 背景: 黒の中に、結晶の後ろだけ灰色の光 */
  float g=exp(-2.2*length(uv-vec2(0.0,-0.08)));
  vec3 col=vec3(0.052,0.056,0.068)*g*3.4;

  if(hit){
    vec3 p=ro+rd*t,n=nrm(p);
    float fres=pow(1.0-max(dot(n,-rd),0.0),4.0);
    /* 内部を進んで厚みを測る。厚みが色の位相になる(薄膜干渉のふり) */
    vec3 rr=refract(rd,n,0.73);
    if(dot(rr,rr)<0.001)rr=reflect(rd,n);
    vec3 ip=p-n*0.012;float thick=0.0;
    for(int i=0;i<12;i++){
      float d=map(ip);
      if(d>-0.001)break;
      float st=max(0.025,-d);
      ip+=rr*st;thick+=st;
    }
    float ph=thick*7.0+dot(n,vec3(0.7,0.35,0.6))*1.6+nax*0.35;
    vec3 disp=0.5+0.5*cos(vec3(ph,ph*1.07+0.9,ph*1.15+1.9));
    vec3 base=pal(hue+thick*0.22+0.13*n.y+0.05*grow);
    col=base*disp*(0.42+0.95*fres)+base*0.16;
    vec3 L=normalize(vec3(0.55,0.85,-0.6));
    col+=vec3(1.0)*pow(max(dot(reflect(rd,n),L),0.0),46.0)*0.85;
    col+=pal(hue+0.52)*fres*0.42;
    col*=1.0-0.045*t;
  }
  col=pow(max(col,0.0),vec3(0.85));
  O=vec4(col,1.0);
}`;
const P=prog(FS),U=P.u;

/* ---------- 状態 ---------- */
let W=0,H=0,DPR=1;
let grow=0.06,hue=Math.random(),paused=false;
let seedA=0.32,seedB=0.24,seedC=0;
let axes=[];
const axBuf=new Float32Array(NAX*4);

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.4);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR));
}
window.addEventListener('resize',resize);resize();

function seedWorld(){
  axes=[];grow=0.06;
  seedA=0.2+Math.random()*0.5;seedB=0.1+Math.random()*0.5;seedC=Math.random()*6.28;
  hue=Math.random();
}
seedWorld();

/* 触った方向 → 新しい鏡面(軸)。画面の中心から見た方向が、そのまま法線になる */
function addAxis(x,y,k){
  let u=(2*x-W)/H, v=(H-2*y)/H;
  const L=Math.hypot(u,v);
  if(L<0.06){const a=Math.random()*6.28;u=Math.cos(a);v=Math.sin(a);}
  else{u/=L;v/=L;}
  const cs=Math.cos(k),sn=Math.sin(k);
  const n=[u*cs,v,u*sn];
  const nl=Math.hypot(n[0],n[1],n[2]);n[0]/=nl;n[1]/=nl;n[2]/=nl;
  if(axes.length>=NAX){
    /* 軸が満杯。いちばん近い軸に吸収させる(法則の統合) */
    let best=axes[0],bd=-9;
    for(const a of axes){const d=Math.abs(a.n[0]*n[0]+a.n[1]*n[1]+a.n[2]*n[2]);if(d>bd){bd=d;best=a}}
    best.n=n;best.w=Math.min(1,best.w);
  }else{
    axes.push({n,w:0});
  }
  grow=Math.min(1,grow+0.055);
  hue=(hue+0.037)%1;
}

let ptr=null;
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  addAxis(e.clientX,e.clientY,phase);
  ptr={id:e.pointerId,lx:e.clientX,ly:e.clientY,cool:0};
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  const d=Math.hypot(e.clientX-ptr.lx,e.clientY-ptr.ly);
  /* なぞった分だけ、次々に新しい軸が生まれる */
  if(d>Math.min(W,H)*0.16){ptr.lx=e.clientX;ptr.ly=e.clientY;addAxis(e.clientX,e.clientY,phase);}
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

/* ---------- 描画 ---------- */
function render(k){
  gl.useProgram(P.p);
  gl.viewport(0,0,c.width,c.height);
  gl.uniform2f(U.res,c.width,c.height);
  gl.uniform1f(U.k,k);
  gl.uniform1f(U.grow,grow);
  gl.uniform1f(U.hue,hue);
  gl.uniform1f(U.nax,axes.length);
  gl.uniform1f(U.seedA,seedA);gl.uniform1f(U.seedB,seedB);gl.uniform1f(U.seedC,seedC);
  axBuf.fill(0);
  axes.forEach((a,i)=>{axBuf.set([a.n[0],a.n[1],a.n[2],a.w],i*4)});
  gl.uniform4fv(U.ax,axBuf);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

let phase=0,last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){
    phase=(phase+dt*0.2)%(Math.PI*2);
    for(const a of axes)a.w=Math.min(1,a.w+dt*1.4);  /* 新しい法則はじわっと効いてくる */
    grow=Math.min(1,grow+dt*0.004);                  /* 放っておいても育つ */
    render(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'crystal-axis-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){paused=true;render(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 結晶の種類そのものを変える。軸(法則)と成長はそのまま残す */
      seedA=0.15+Math.random()*0.6;seedB=0.05+Math.random()*0.6;seedC=Math.random()*6.28;
      hue=Math.random();
    }},
    {label:'↻',name:'reset',onClick:function(){seedWorld();}}
  ]
});
</script>
</body></html>
