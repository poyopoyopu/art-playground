<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>PREDATOR</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020305}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),g=c.getContext("2d");let d,W,H;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();let hunters=[];function render(p=0){g.fillStyle="#020305";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<32;k++){g.beginPath();for(let i=0;i<=160;i++){let a=i*6.283/160,r=S*(.04+k*.022),x=Math.cos(a)*r,y=Math.sin(a)*r;for(let h of hunters){let dx=x+cx-h.x,dy=y+cy-h.y,dd=Math.hypot(dx,dy)+1,q=Math.max(0,1-dd/(110+h.mass*8));x-=dx*q*.22;y-=dy*q*.22}let wob=Math.sin(a*(2+k%4)+p*1.7)*S*.009;x+=Math.cos(a+1.57)*wob;y+=Math.sin(a+1.57)*wob;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${160+k*5},85%,65%,.09)`;g.stroke()}for(let h of hunters){h.mass=Math.min(9,h.mass+.002);g.beginPath();g.arc(h.x,h.y,7+h.mass*3,0,6.283);g.fillStyle=`hsla(${20+h.mass*18},100%,65%,.9)`;g.fill()}}function add(x,y){if(APKit.isUI(x,y))return;hunters.push({x,y,mass:1});if(hunters.length>5)hunters.shift()}c.addEventListener("pointerdown",e=>add(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)add(e.clientX,e.clientY)});function mutate(){hunters.forEach(h=>{h.x=Math.random()*W;h.y=Math.random()*H})}function reset(){hunters=[]}APKit.init({canvas:c,gifName:"predator-loop",clockFormat:"spec",dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:"✦",name:"mutate",onClick:mutate},{label:"↻",name:"reset",onClick:reset}]});function loop(){render(performance.now()*.0001);requestAnimationFrame(loop)}loop();</script></body></html>
