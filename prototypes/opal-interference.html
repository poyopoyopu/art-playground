<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL INTERFERENCE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V='#version 300 es\\nin vec2 p;out vec2 u;void main(){u=p*.5+.5;gl_Position=vec4(p,0,1);}';
const F='#version 300 es\\nprecision highp float;in vec2 u;out vec4 o;uniform vec2 r;uniform float t,seed;uniform vec4 src[7];uniform int n;\\nfloat h(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+34.7);return fract(p.x*p.y);}\\nvoid main(){vec2 P=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);float wave=0.;float light=0.;for(int i=0;i<7;i++){if(i>=n)break;vec2 d=P-src[i].xy;float rr=length(d);float a=src[i].z;wave+=sin(rr*(55.+a*35.)-t*(1.2+a*.5))*exp(-rr*(2.5+a*3.));light+=exp(-rr*rr/(.012+.02*a))*a;}float base=sin((P.x*P.x-P.y*P.y)*13.+t*.35+seed);float rings=sin(wave*2.2+base*2.);float fringe=smoothstep(.25,.9,.5+.5*sin(wave*1.7));vec3 spectral=.5+.5*cos(6.283*(rings*.18+vec3(0.,.333,.667)+P.x*.1));vec3 pearl=mix(vec3(.025,.03,.045),vec3(.75,.78,.86),smoothstep(-.3,.8,base));vec3 col=pearl*(.45+.55*fringe)+spectral*(.12+light*.72);col+=vec3(1.,.95,.88)*pow(max(0.,1.-abs(sin(wave))),22.)*.65;col*=1.-.3*length(P);o=vec4(pow(col/(1.+col*.25),vec3(.88)),1.);}';
function S(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let p=gl.createProgram();gl.attachShader(p,S(gl.VERTEX_SHADER,V));gl.attachShader(p,S(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);let U={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(p,i);U[a.name]=gl.getUniformLocation(p,a.name)}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*30,live=0,paused=false,sources=[];function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();function P(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}function draw(ph){gl.useProgram(p);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(28);sources.forEach((q,i)=>a.set([q.x,q.y,q.a,q.spin],i*4));gl.uniform4fv(U.src,a);gl.uniform1i(U.n,sources.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=P(e.clientX,e.clientY);sources.push({x:q[0],y:q[1],a:.4+Math.random()*.8,spin:Math.random()*6.28});if(sources.length>7)sources.shift()});let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused){live+=dt;draw(live*.22)}requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'opal-interference-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(ph){paused=true;draw(ph)},onExportEnd:function(){paused=false;last=performance.now()},buttons:[{label:'✦',name:'mutate',onClick:function(){seed=Math.random()*70;sources.forEach(q=>q.a=.3+Math.random()*1.3)}},{label:'↻',name:'reset',onClick:function(){sources=[];live=0}}]});
</script></body></html>
