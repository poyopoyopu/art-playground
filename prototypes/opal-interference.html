<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL INTERFERENCE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111214}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W,H,D=1,t=0,seed=Math.random()*80,paused=false,sources=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function add(px,py){sources.push({x:px,y:py,r:8,a:.5+Math.random()*.5,p:Math.random()*TAU});if(sources.length>6)sources.shift()}
function draw(ph){const s=Math.min(W,H);x.fillStyle='#101114';x.fillRect(0,0,W,H);
 const bg=x.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,s*.7);bg.addColorStop(0,'#25282d');bg.addColorStop(.45,'#17191d');bg.addColorStop(1,'#090a0d');x.fillStyle=bg;x.fillRect(0,0,W,H);
 x.save();x.globalCompositeOperation='screen';
 sources.forEach((q,si)=>{const age=Math.min(1,q.a);for(let k=0;k<22;k++){const rr=q.r+k*s*.014+Math.sin(ph*.7+k*.6+q.p)*2;const hue=(195+si*43+k*9+seed)%360;
   x.beginPath();x.arc(q.x,q.y,rr,0,TAU);x.strokeStyle=`hsla(${hue},82%,${58+18*Math.sin(k*.7+ph)}%,${.035+age*.045})`;x.lineWidth=1.2;x.stroke()}});
 for(let ring=0;ring<24;ring++){const rr=s*(.035+ring*.032),wave=Math.sin(rr*.075-ph*2.1+seed)+sources.reduce((v,q)=>v+Math.sin(Math.hypot(q.x-W/2,q.y-H/2)*.035-rr*.08+q.p),0);
   const hue=(205+wave*75+ring*7+seed)%360;x.beginPath();x.arc(W/2,H/2,rr,0,TAU);x.strokeStyle=`hsla(${hue},72%,${52+20*(.5+.5*Math.sin(wave))}%,${.045+.045*(.5+.5*Math.sin(wave))})`;x.lineWidth=1.5;x.stroke()}
 x.globalCompositeOperation='source-over';
 sources.forEach((q,i)=>{q.r=Math.min(26,q.r+.12);q.p+=.006;const g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*3);g.addColorStop(0,'rgba(245,250,255,.20)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(q.x-q.r*3,q.y-q.r*3,q.r*6,q.r*6)});
 x.restore();
 const vg=x.createRadialGradient(W/2,H/2,s*.2,W/2,H/2,s*.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');x.fillStyle=vg;x.fillRect(0,0,W,H)}
function loop(now){if(!paused){t=now*.001;draw(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;add(e.clientX,e.clientY)});
APKit.init({canvas:c,gifName:'opal-interference-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*80}},{label:'↻',name:'reset',onClick:()=>{sources=[]}}]});
</script></body></html>
