<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BRONZE FOLD</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eceae6}
body,canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* BRONZE FOLD — ChatGPT作。参考動画の平たい金属リボン彫刻を再構成。 */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,seed=194,law=0,down=false,lastX=0,lastY=0,drag=0;
const TAU=Math.PI*2,N=420,LOOP=7;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

function hash(n){const x=Math.sin(n*127.1+seed*3.17)*43758.5453;return x-Math.floor(x)}
function center(u,ph){
  const a=u*TAU;
  let x,y,z;
  
  x=1.30*Math.cos(2*a)+.62*Math.cos(3*a-.35)+.16*Math.cos(a+ph);
  y=1.30*Math.sin(2*a)+.62*Math.sin(3*a-.35)+.16*Math.sin(a+ph);
  z=.30*Math.sin(3*a+ph*.45)-.16*Math.cos(2*a);
  const s=1+.035*Math.sin(ph*2+a*3);
  x*=s;y*=s;
  const cy=Math.cos(ph*.18),sy=Math.sin(ph*.18),cx=Math.cos(-.28),sx=Math.sin(-.28);
  let X=x*cy+z*sy,Z=-x*sy+z*cy;
  let Y=y*cx-Z*sx; Z=y*sx+Z*cx;
  return{x:X,y:Y,z:Z};
}
function proj(p){
  const cam=5.2,s=Math.min(W,H)*.245,k=cam/(cam-p.z);
  return{x:W/2+p.x*s*k,y:H/2+p.y*s*k,z:p.z,k};
}
function ribbonPoint(u,ph,side){
  const p=center(u,ph),a=center((u+.002)%1,ph),b=center((u-.002+1)%1,ph);
  let tx=a.x-b.x,ty=a.y-b.y,tz=a.z-b.z;
  const tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
  let nx=-ty,ny=tx,nz=0;
  const nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;
  const roll=.28*Math.sin(ph+u*TAU*3)+.12*Math.cos(u*TAU*2-ph);
  const bx=ty*nz-tz*ny,by=tz*nx-tx*nz,bz=tx*ny-ty*nx;
  const c=Math.cos(roll),s=Math.sin(roll);
  const wx=nx*c+bx*s,wy=ny*c+by*s,wz=nz*c+bz*s;
  const width=.43*(1+.07*Math.sin(u*TAU*3+ph));
  return proj({x:p.x+wx*width*side,y:p.y+wy*width*side,z:p.z+wz*width*side});
}
function draw(ph){
  ctx.clearRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W*.5,H*.42,0,W*.5,H*.5,Math.max(W,H)*.72);
  bg.addColorStop(0,'#faf9f6');bg.addColorStop(.7,'#eceae6');bg.addColorStop(1,'#d9d6d0');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.save();ctx.translate(W*.5,H*.73);ctx.scale(1,.22);ctx.filter='blur(25px)';
  ctx.fillStyle='rgba(45,28,16,.16)';ctx.beginPath();ctx.ellipse(0,0,Math.min(W,H)*.29,Math.min(W,H)*.13,0,0,TAU);ctx.fill();ctx.restore();ctx.filter='none';

  const P=Array.from({length:N},(_,i)=>{const u=i/N;return{u,center:center(u,ph),L:ribbonPoint(u,ph,-1),R:ribbonPoint(u,ph,1)}})
  const seg=[];
  for(let i=0;i<N;i++){const j=(i+1)%N;seg.push({i,j,z:(P[i].center.z+P[j].center.z)/2})}
  seg.sort((a,b)=>a.z-b.z);

  for(const q of seg){
    const A=P[q.i],B=P[q.j],z=q.z;
    const light=.5+.5*Math.sin(z*1.9+q.i*.035+ph*.6);
    const hue=27+18*Math.sin(A.u*TAU*1.7+ph*.35);
    const r=Math.round(92+72*light+30*Math.max(0,Math.sin(A.u*TAU*2+ph)));
    const g=Math.round(48+52*light+14*Math.max(0,Math.cos(A.u*TAU*2-ph)));
    const b=Math.round(22+24*light);
    const hi='rgb('+Math.min(225,r+62)+','+Math.min(185,g+48)+','+Math.min(135,b+30)+')';
    const mid='rgb('+r+','+g+','+b+')';
    const lo='rgb('+Math.max(24,r-42)+','+Math.max(16,g-28)+','+Math.max(8,b-13)+')';
    const grad=ctx.createLinearGradient(A.L.x,A.L.y,A.R.x,A.R.y);
    grad.addColorStop(0,lo);grad.addColorStop(.12,mid);grad.addColorStop(.32,hi);grad.addColorStop(.50,'rgb(118,67,29)');grad.addColorStop(.67,hi);grad.addColorStop(.88,mid);grad.addColorStop(1,lo);
    ctx.beginPath();ctx.moveTo(A.L.x,A.L.y);ctx.lineTo(B.L.x,B.L.y);ctx.lineTo(B.R.x,B.R.y);ctx.lineTo(A.R.x,A.R.y);ctx.closePath();
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='rgba(53,29,14,.70)';ctx.lineWidth=1;ctx.stroke();
  }
  // continuous longitudinal highlights: no worm-like transverse segmentation
  for(const off of [-.62,.62]){
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const u=i/N,p=ribbonPoint(u%1,ph,off);
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle='rgba(255,232,193,.28)';ctx.lineWidth=1.2;ctx.stroke();
  }
}
function loopFrame(ph){draw(ph)}
let t0=performance.now();
function frame(now){draw(((now-t0)/1000%LOOP)/LOOP*TAU);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;down=true;drag=0;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;law+=(e.clientX-lastX)*.006;drag+=Math.hypot(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',e=>{if(!down)return;down=false;if(drag<12)law+=.8});
canvas.addEventListener('pointercancel',()=>down=false);

APKit.init({
 canvas:canvas,gifName:'bronze-fold-loop',
 clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,
 loopFrame:loopFrame,
 buttons:[
  {label:'✦',name:'mutate',onClick:function(){seed=Math.floor(Math.random()*99999)+1;law=(Math.random()-.5)*3}},
  {label:'↻',name:'reset',onClick:function(){seed=194;law=0}}
 ]
});
</script>
</body>
</html>
