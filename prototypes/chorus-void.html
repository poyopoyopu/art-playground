<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHORUS VOID</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010106}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* CHORUS VOID — ChatGPT作。触れた場所が世界の折り目になり、全体の位相を再編成する。 */
'use strict';
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
let W=1,H=1,D=1,seed=Math.random()*1000,marks=[],down=false;
const TAU=Math.PI*2;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.35,devicePixelRatio||1);c.width=Math.max(1,Math.floor(W*D));c.height=Math.max(1,Math.floor(H*D));if(gl)gl.viewport(0,0,c.width,c.height)}
addEventListener('resize',resize);resize();
const VS=`#version 300 es
in vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;in vec2 v;out vec4 O;
uniform vec2 R;uniform float T,S;uniform vec4 A[10];uniform int N;
#define TAU 6.28318530718
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash21(i),b=hash21(i+vec2(1,0)),d=hash21(i+vec2(0,1)),e=hash21(i+1.);return mix(mix(a,b,f.x),mix(d,e,f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=mat2(1.6,-1.2,1.2,1.6)*p;a*=.5;}return s;}
vec3 pal(float x){x=fract(x);vec3 a=vec3(.015,.008,.035),b=vec3(.12,.035,.28),cc=vec3(.12,.75,1.),d=vec3(1.,.12,.48);return a+b*cos(TAU*(cc*x+d));}
vec2 fold(vec2 p,float phase){for(int i=0;i<7;i++){float fi=float(i),an=.55*sin(phase*.31+fi*.71+S*.0007),cs=cos(an),sn=sin(an);p=mat2(cs,-sn,sn,cs)*p;p.x=abs(p.x)-(.34-.018*fi);p.y=abs(p.y)-(.28-.012*fi);p*=1.36+.045*sin(phase*.53+fi*1.7);}return p;}
float touchField(vec2 p){float q=0.;for(int i=0;i<10;i++){if(i>=N)break;vec2 d=p-A[i].xy;float r=max(A[i].z,.012);q+=exp(-dot(d,d)/(r*r))*(.65+.35*sin(A[i].w+T*.35));}return min(q,3.);}
void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.);float t=T,q=touchField(p);float spin=.16*sin(t*.17)+.08*sin(t*.071+S);p*=mat2(cos(spin),-sin(spin),sin(spin),cos(spin));float rr=length(p),ang=atan(p.y,p.x);p*=1.+.035*sin(t*.73)+.018*sin(t*1.31+rr*5.);vec2 f=fold(p,t);float r=length(f),a=atan(f.y,f.x);float shell=exp(-abs(r-.22)/(.018+.004*sin(a*6.+t*.4)));float shell2=exp(-abs(r-.47)/(.022+.004*cos(a*8.-t*.3)));float shell3=exp(-abs(r-.76)/(.028+.006*sin(a*5.+t*.2)));float veins=pow(abs(sin(a*18.+r*21.-t*.8)),18.);float micro=pow(abs(sin(a*47.-r*63.+fbm(f*5.)*3.-t*.45)),12.);float star=pow(max(0.,1.-length(f)*1.5),8.);float hole=smoothstep(.055,.16,rr+q*.10);float field=fbm(p*2.2+vec2(t*.04,-t*.03));float rings=(shell+shell2*.78+shell3*.62)*(1.+q*.9);float radial=pow(max(0.,.5+.5*cos(a*12.+sin(r*8.-t*.5)*1.5)),7.)*smoothstep(1.1,.05,r);vec3 col=pal(.04+r*1.7+a*.08+t*.025)*(.035+.35*rings);col+=pal(.42+a*.11-t*.018)*(.11*veins+shell2*.22);col+=pal(.72-r*.8+t*.015)*micro*.13;col+=pal(.16+field*.25)*radial*.09;col+=pal(.58+t*.01)*star*.22;float rim=smoothstep(.12,.34,q)-smoothstep(.34,.8,q);col+=pal(.9-q*.12)*rim*.55;col*=smoothstep(1.22,.12,rr);col*=1.-.78*hole;col+=noise(p*35.+t*.02)*.012;O=vec4(max(col,vec3(0.)),1.);}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let u=null;
try{const pr=gl.createProgram();gl.attachShader(pr,compile(gl.VERTEX_SHADER,VS));gl.attachShader(pr,compile(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);u={R:gl.getUniformLocation(pr,'R'),T:gl.getUniformLocation(pr,'T'),S:gl.getUniformLocation(pr,'S'),A:gl.getUniformLocation(pr,'A[0]'),N:gl.getUniformLocation(pr,'N')}}catch(e){document.body.innerHTML='<div style="height:100%;display:grid;place-items:center;color:white;background:#010106;font:14px system-ui">WebGL2 could not start</div>';console.error(e)}
function draw(t){if(!u)return;gl.uniform2f(u.R,W,H);gl.uniform1f(u.T,t);gl.uniform1f(u.S,seed);const a=new Float32Array(40);for(let i=0;i<marks.length&&i<10;i++){const m=marks[i];a[i*4]=m.x/W-.5;a[i*4+1]=.5-m.y/H;a[i*4+2]=m.r/Math.max(W,H);a[i*4+3]=m.p}gl.uniform4fv(u.A,a);gl.uniform1i(u.N,Math.min(10,marks.length));gl.drawArrays(gl.TRIANGLES,0,3)}
function addMark(x,y){marks.push({x,y,r:.045*Math.min(W,H)+Math.random()*28,p:Math.random()*TAU});if(marks.length>10)marks.shift()}
c.onpointerdown=e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;down=true;addMark(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(down&&Math.random()<.2)addMark(e.clientX,e.clientY)};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;
function anim(ms){draw(ms*.00055);requestAnimationFrame(anim)}requestAnimationFrame(anim);
APKit.init({canvas:c,gifName:'chorus-void-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*1000;marks=[]}},{label:'↻',name:'reset',onClick:()=>{marks=[]}}]});
</script>
</body>
</html>
