<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>FOCUS TOUCH WHITE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}canvas{width:100%;height:100%;display:block}body{touch-action:none}</style></head><body><canvas id="c"></canvas><script>
/* v52 variation: TOUCH changes the center of attention. Palette is near-white graphite. */
const c=document.getElementById('c'),g=c.getContext('2d'),P=Math.PI*2;let W=1,H=1,d=1,spots=[],held=null,seed=97;
function R(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function q(){let n=Math.sin(seed++*17.3)*43758.5;return n-Math.floor(n)}
function reset(){seed=97;spots=[];for(let i=0;i<5;i++)spots.push({x:W*q(),y:H*q(),a:q(),t:performance.now()+i*800,r:Math.min(W,H)*(.16+.2*q()),p:.7+q()})}reset();
function drawCell(x,y,w,z,A){let cx=x+w/2,cy=y+w/2,v=0;for(let s of A)v+=s.p*Math.exp(-Math.hypot(cx-s.x,cy-s.y)/s.r);if(z<7&&w>10&&v>.32+z*.19){let h=w/2;drawCell(x,y,h,z+1,A);drawCell(x+h,y,h,z+1,A);drawCell(x,y+h,h,z+1,A);drawCell(x+h,y+h,h,z+1,A)}else{g.strokeStyle='rgba(235,235,225,'+(.07+v*.22)+')';g.strokeRect(x+.5,y+.5,w-1,w-1)}}
function frame(t){let A=[];for(let i=0;i<spots.length;i++){let s=spots[i],u=(t-s.t)/4200;if(u>1){s.t=t+700+q()*1400;s.x=W*(.08+.84*q());s.y=H*(.08+.84*q());u=0}if(u>=0){let e=Math.sin(Math.PI*u);A.push({x:s.x+Math.sin(t*.0002+i)*8,y:s.y+Math.cos(t*.00017+i)*7,p:s.p*e,r:s.r})}}if(held)A.push({x:held.x,y:held.y,p:2.2,r:Math.min(W,H)*.28});g.fillStyle='#080808';g.fillRect(0,0,W,H);drawCell(0,0,W,0,A)}
let prev=performance.now();function loop(){let t=performance.now();if(!APKit.isExporting())frame(t);prev=t;requestAnimationFrame(loop)}loop();
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;held={x:e.clientX,y:e.clientY}});c.addEventListener('pointermove',e=>{if(held){held.x=e.clientX;held.y=e.clientY}});c.addEventListener('pointerup',()=>{held=null});c.addEventListener('pointercancel',()=>{held=null});
APKit.init({canvas:c,gifName:'focus-touch-white-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>frame(performance.now()+p*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{spots.forEach(s=>s.p=.6+q())}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
