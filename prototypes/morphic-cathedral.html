<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MORPHIC CATHEDRAL</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),g=c.getContext('webgl2',{antialias:false,alpha:false});const V=`#version 300 es
in vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`,F=`#version 300 es
precision highp float;out vec4 O;in vec2 v;uniform vec2 R,P;uniform float T,S;uniform vec4 A[8];uniform int N;#define TAU 6.28318530718
float h(float p){p=fract(p*123.34);p+=dot(p,p+45.32);return fract(p*p);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i.x+31.7*i.y),h(i.x+31.7*i.y+1.),f.x),mix(h(i.x+31.7*(i.y+1.)),h(i.x+31.7*(i.y+1.)+1.),f.x),f.y);}float tf(vec2 p){float q=0.;for(int i=0;i<8;i++){if(i>=N)break;vec2 d=p-A[i].xy;q+=exp(-dot(d,d)/(A[i].z*A[i].z));}return q;}void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.);float t=tf(p);float a=atan(p.y,p.x),r=length(p),seg=TAU/13.;a=mod(a+seg*.5,seg)-seg*.5;vec2 q=vec2(cos(a),sin(a))*r;q+=vec2(sin(q.y*5.+T*.018),cos(q.x*6.-T*.014))*(.12+t*.65);float ribs=pow(abs(sin(q.x*18.+sin(q.y*7.+T*.02))),9.);float arches=smoothstep(.14,.02,abs(sin(q.y*15.+n(q*4.)*4.)));float mosaic=step(.48,fract(n(q*9.+T*.003)*8.));vec3 col=vec3(.025,.008,.055)+vec3(.42,.2,.32)*cos(TAU*(vec3(.73,.38,.14)*n(q*3.)+vec3(.0,.2,.6)));col+=ribs*vec3(.15,.7,.95)+arches*vec3(.8,.25,.08);col*=.55+.65*mosaic;col*=1.-smoothstep(.05,.32,r)*.78;O=vec4(col,1.);}`;if(!g)throw Error('WebGL2 unavailable');function sh(t,s){let q=g.createShader(t);g.shaderSource(q,s);g.compileShader(q);if(!g.getShaderParameter(q,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(q));return q}let pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,V));g.attachShader(pr,sh(g.FRAGMENT_SHADER,F));g.linkProgram(pr);g.useProgram(pr);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);let u={R:g.getUniformLocation(pr,'R'),P:g.getUniformLocation(pr,'P'),T:g.getUniformLocation(pr,'T'),S:g.getUniformLocation(pr,'S'),A:g.getUniformLocation(pr,'A[0]'),N:g.getUniformLocation(pr,'N')},W,H,D,seed=Math.random()*99999,pts=[],t0=performance.now(),P={x:0,y:0};function rs(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rs);rs();function draw(t){g.uniform2f(u.R,W,H);g.uniform2f(u.P,P.x/W-.5,1-P.y/H-.5);g.uniform1f(u.T,t);g.uniform1f(u.S,seed);let a=new Float32Array(32);pts.forEach((q,i)=>{if(i<8){a[i*4]=q.x/W-.5;a[i*4+1]=1-q.y/H-.5;a[i*4+2]=q.r/Math.max(W,H);a[i*4+3]=q.phase}});g.uniform4fv(u.A,a);g.uniform1i(u.N,Math.min(8,pts.length));g.drawArrays(g.TRIANGLES,0,3)}function add(x,y){pts.push({x,y,r:75+Math.random()*115,phase:Math.random()*TAU});if(pts.length>8)pts.shift()}let d=0;c.onpointerdown=e=>{if(APKit.isUI(e.clientX,e.clientY))return;d=1;P.x=e.clientX;P.y=e.clientY;add(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{P.x=e.clientX;P.y=e.clientY;if(d&&Math.random()<.45)add(e.clientX,e.clientY)};c.onpointerup=()=>d=0;c.onpointercancel=()=>d=0;function anim(ms){draw((ms-t0)*.00006);requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'morphic-cathedral-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;pts=[]}},{label:'↻',name:'reset',onClick:()=>pts=[]}]});</script></body></html>
