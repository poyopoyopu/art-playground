<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVING20</title><style>html,body{margin:0;background:#000;height:100%;overflow:hidden;font-family:system-ui}iframe{border:0;width:100%;height:100%}nav{position:fixed;z-index:5;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 20px)}button{background:#000b;color:#fff;border:1px solid #ffffff55;border-radius:99px;padding:6px 9px;font-size:10px}button.on{border-color:#fff}</style></head><body><nav id="n"></nav><iframe id="f"></iframe><script>const names=['MEMORY','PRESSURE','GRAVITY','ECHO','CURRENT','SCAR','TIDE','MIRROR','SPLIT','WORMHOLE','VEIL','FOLD','ORBIT','RESONANCE','CRYSTAL','DRIFT','VORTEX','FRACTURE','NEST','VOID'];const n=document.querySelector('#n'),f=document.querySelector('#f');names.forEach((x,i)=>{let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+x;b.onclick=()=>{f.src='living20.html?mode='+i;history.replaceState(null,'','?mode='+i);document.querySelectorAll('button').forEach(z=>z.classList.remove('on'));b.classList.add('on')};n.append(b)});let m=+(new URLSearchParams(location.search).get('mode')||0);f.src='living20-'+String(m+1).padStart(2,'0')+'.html';n.children[m].classList.add('on');</script></body></html>
