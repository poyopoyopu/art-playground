<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH OCEAN</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#001217}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: the deeper you look, the more alien the grid becomes. TOUCH DILATES depth. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,last=performance.now(),f={x:0,y:0,p:.4},marks=[];
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!f.x){f.x=W/2;f.y=H/2}}addEventListener('resize',rs);rs();
function reset(){f={x:W*.5,y:H*.5,p:.3};marks=[]}reset();
function A(x,y){let v=f.p*Math.exp(-Math.hypot(x-f.x,y-f.y)/(Math.min(W,H)*.32));for(let m of marks)v+=m.p*Math.exp(-Math.hypot(x-m.x,y-m.y)/(Math.min(W,H)*.19));return v}
function cell(x,y,s,d){let a=A(x+s/2,y+s/2),th=.25+d*.105;if(d<11&&a>th&&s>2.5){let q=s/2;cell(x,y,q,d+1);cell(x+q,y,q,d+1);cell(x,y+q,q,d+1);cell(x+q,y+q,q,d+1);return}let h=(170+d*19+(x/W)*55-(y/H)*45)%360;let k=Math.max(0,Math.min(1,a));g.fillStyle=`hsla(${h},76%,${34+k*28}%,${.045+k*.20})`;g.fillRect(x,y,s-.45,s-.45);if(d>6&&k>.3){g.strokeStyle=`hsla(${h+180},92%,82%,${.18+k*.38})`;g.lineWidth=.7;g.strokeRect(x+.3,y+.3,s-.6,s-.6)}}
function draw(t,dt){f.p=.27+.38*(.5+.5*Math.sin(t*.00037));for(let m of marks)m.p*=Math.pow(.16,dt);marks=marks.filter(m=>m.p>.025);g.fillStyle='#001217';g.fillRect(0,0,W,H);cell(0,0,W,0);g.beginPath();g.arc(f.x,f.y,4+f.p*7,0,TAU);g.strokeStyle='rgba(80,245,220,.6)';g.stroke()}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
let down=false;c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;f.x=e.clientX;f.y=e.clientY;f.p=.95});c.addEventListener('pointermove',e=>{if(down){f.x=e.clientX;f.y=e.clientY;f.p=Math.min(1,f.p+.02)}});c.addEventListener('pointerup',()=>{down=false;marks.push({x:f.x,y:f.y,p:f.p});if(marks.length>14)marks.shift()});c.addEventListener('pointercancel',()=>down=false);
APKit.init({canvas:c,gifName:'focus-depth-ocean-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{f={x:W*(.5+.35*Math.cos(p)),y:H*(.5+.35*Math.sin(p*2)),p:.3+.55*(.5+.5*Math.sin(p*3)**2)};g.fillStyle='#001217';g.fillRect(0,0,W,H);cell(0,0,W,0)},buttons:[{label:'✦',name:'mutate',onClick:()=>{f.p=.25+Math.random()*.7}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
