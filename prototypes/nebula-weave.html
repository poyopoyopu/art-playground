<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEBULA WEAVE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,knots=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function n(px,py){let v=0,a=1;for(let k=1;k<9;k++){v+=(Math.sin(px*k*2.7+Math.sin(py*k*1.9+t*.06+seed)*1.7)+Math.cos(py*k*2.1+px*k*.7))*a;a*=.52}for(const q of knots){let r=Math.hypot(px-q.x,py-q.y);v+=Math.exp(-r*r*9)*q.s}return v}function draw(T=t){x.fillStyle='#02050b';x.fillRect(0,0,W,H);let s=7;for(let yy=0;yy<H;yy+=s)for(let xx=0;xx<W;xx+=s){let px=xx/W*8-4,py=yy/H*8-4,z=n(px,py),r=Math.abs(Math.sin(z*2.8));if(r>.72){let h=(z*75+px*20+py*30+T*7+seed*100)%360;x.fillStyle=`hsla(${h},95%,${45+r*35}%,${.18+r*.8})`;x.fillRect(xx,yy,s+1,s+1)}}for(const q of knots){x.beginPath();x.arc(q.x,q.y,24+q.s*5,0,7);x.fillStyle='rgba(0,0,0,.9)';x.fill()}}function touch(px,py){knots.push({x:px,y:py,s:2+Math.random()*3});if(knots.length>7)knots.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'nebula-weave-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;knots=[]}},{label:'↻',name:'reset',onClick:()=>knots=[]}]});</script></body></html>
