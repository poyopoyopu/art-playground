<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SANCTUARY PARADOX</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020204}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — SANCTUARY PARADOX
WORLD LAW: a sanctuary is defined by what lies OUTSIDE it. Touching a place
makes it permanent, but permanence inverts its neighborhood. Touch again inside
the sanctuary and the inversion moves outward. A sanctuary can therefore never
be understood from its center alone; every touch changes its boundary condition.
*/
const c=document.querySelector('#c'),g=c.getContext('2d'),TAU=Math.PI*2;let W,H,D=1,marks=[],seed=9;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function rnd(){let v=Math.sin(seed++*78.233)*43758.5453;return v-Math.floor(v)}
function reset(){seed=9;marks=[];for(let i=0;i<3;i++)marks.push({x:W*(.25+.5*rnd()),y:H*(.25+.5*rnd()),r:38+40*rnd(),age:rnd()*6,phase:rnd()*TAU,depth:1,h:rnd()})}reset();
function ring(m,t,a){let R=m.r*(1+.035*Math.sin(t*1.7+m.phase)),n=6+m.depth*2;g.save();g.translate(m.x,m.y);g.rotate(m.phase+t*.015);for(let k=0;k<m.depth+2;k++){let rr=R*(1+k*.42),rot=(k&1)*Math.PI/n;g.beginPath();for(let i=0;i<n;i++){let q=rot+i*TAU/n,wig=1+.07*Math.sin(i*3.7+k*1.9+m.phase);let x=Math.cos(q)*rr*wig,y=Math.sin(q)*rr*wig;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.strokeStyle=`hsla(${190+m.h*150+k*18},90%,${62-k*4}%,${a*(.75-k*.1)})`;g.lineWidth=1.1+k*.28;g.stroke()}g.restore()}
function draw(phase=null){let t=phase===null?performance.now()*.00012:phase;g.fillStyle='#020204';g.fillRect(0,0,W,H);
 // The world is a field of nested boundaries. Their orientation is determined by the nearest permanent mark.
 for(let y=0;y<H;y+=42)for(let x=0;x<W;x+=42){let best=999,ang=0;for(let m of marks){let dx=x-m.x,dy=y-m.y,d=Math.hypot(dx,dy);if(d<best){best=d;ang=Math.atan2(dy,dx)}}let rr=10+5*Math.sin(t*2+x*.013+y*.009);g.save();g.translate(x+21,y+21);g.rotate(ang+Math.PI/4);g.strokeStyle=`hsla(${205+best%90},55%,55%,${best<160?.12:.045})`;g.strokeRect(-rr/2,-rr/2,rr,rr);g.restore()}
 for(let m of marks){m.age+=.0005;if(phase===null)m.phase+=.00008;ring(m,t,.9)}
 // Collision is the paradox: when boundaries overlap, the older sanctuary survives but inherits the other's outside law.
 for(let i=0;i<marks.length;i++)for(let j=i+1;j<marks.length;j++){let a=marks[i],b=marks[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<a.r+b.r*.7){a.depth=Math.min(8,a.depth+b.depth);a.r=Math.min(Math.min(W,H)*.45,Math.sqrt(a.r*a.r+b.r*b.r));a.h=(a.h+b.h+.13)%1;a.phase+=(b.phase-a.phase)*.5;marks.splice(j,1);j--;}}
}
function touch(x,y){if(APKit.isUI(x,y))return;let hit=null,best=Infinity;for(let m of marks){let d=Math.hypot(x-m.x,y-m.y);if(d<best){best=d;hit=m}}if(hit&&best<hit.r*(1+hit.depth*.42)){// touching the inside pushes the boundary outward and flips its geometry
 hit.r=Math.min(Math.min(W,H)*.46,hit.r*(1.22+hit.depth*.025));hit.depth=Math.min(8,hit.depth+1);hit.phase+=Math.PI/(2+hit.depth);hit.x=x;hit.y=y;
}else{// outside: create a new permanent law, but it starts as a hole rather than an object
 marks.push({x,y,r:26+Math.random()*24,age:0,phase:Math.random()*TAU,depth:1,h:Math.random()});if(marks.length>9)marks.shift()}}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
APKit.init({canvas:c,gifName:'sanctuary-paradox-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{marks.forEach(m=>{m.h=(m.h+.15+Math.random()*.45)%1;m.phase+=Math.random()*TAU})}},{label:'↻',name:'reset',onClick:reset}]});function loop(){draw();requestAnimationFrame(loop)}loop();
</script></body></html>
