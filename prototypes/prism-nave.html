<!doctype html>
<!-- PRISM NAVE — クロード作(おっちゃん提供のInstagramリール=左右対称のガラス建築が虹色の帯の中を流れる映像を参考)。ap-kit.js統合: クロード -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PRISM NAVE — 触れた場所が消失点になる</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07061c}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(12% + env(safe-area-inset-top,0px));text-align:center;
  font:500 12px/1.9 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.16em;color:rgba(255,255,255,.86);
  text-shadow:0 0 10px rgba(0,0,0,.8);pointer-events:none;transition:opacity 1.8s ease;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">触れた場所が、新しい消失点になる<br>古い遠近は消えずに流れ続ける</div>
<script>
(function(){
'use strict';
/* ─────────────────────────────────────────────────────────────
   世界のルール:「触れた場所が消失点になる」
   ・この世界の建築(ガラスの板・塔・光の筋)は、すべて一つの消失点へ向かう遠近で建っている。
   ・触れると、そこが新しい消失点になり、新しい遠近の建築がそこから湧き出す。
   ・古い遠近は消えない。それぞれ自分の消失点へ向かって流れ続け、虹の帯も自分の地平線を持つ。
   ・だから触るほど、ありえない遠近が重なった建築になる(覚えていられる遠近は5つまで。6つ目で最も古いものが溶ける)。
   ・どの遠近も、自分の消失点で左右対称・地平線で上下が映り込んでいる。
   ───────────────────────────────────────────────────────────── */
const TAU=Math.PI*2, PERIOD=12, MAXSYS=5;
const view=document.getElementById('c'), vctx=view.getContext('2d');
const hint=document.getElementById('hint');
const mk=()=>document.createElement('canvas');
const layer=mk(), lctx=layer.getContext('2d');
const scratch=mk(), sctx=scratch.getContext('2d');
const small=mk(), smctx=small.getContext('2d');
const bg=mk(), bgctx=bg.getContext('2d');

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){n=Math.imul(n^61^(n>>>16),9);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return(n>>>0)/4294967296}

/* ───────── spectra (地平線からの距離 → 色) ───────── */
const SPECTRA=[
  // RAINBOW: 上は青紫→桃→赤、地平線で橙〜黄、下は緑→水色→青→紫
  [[-.62,'#3a3cff'],[-.4,'#b43cff'],[-.26,'#ff3c9c'],[-.12,'#ff4a3a'],[-.03,'#ff8a1e'],[0,'#ffc83c'],[.04,'#a8f032'],[.12,'#3cff78'],[.24,'#3cd8ff'],[.4,'#3c6cff'],[.62,'#a03cff']],
  // NEON: 桃と水色と紫だけ
  [[-.62,'#5a2cff'],[-.34,'#ff2cd8'],[-.12,'#ff5ab4'],[0,'#c8a0ff'],[.1,'#5afff0'],[.3,'#2c9cff'],[.62,'#8a2cff']],
  // EMBER: 金と薔薇と深い青
  [[-.62,'#2a3cb4'],[-.34,'#c83c8c'],[-.14,'#ff6a4a'],[0,'#ffb450'],[.1,'#ffc04a'],[.3,'#e0507a'],[.62,'#3a3cc8']]
];
let specIdx=0;

/* ───────── sizing ───────── */
let W=0,H=0,iw=0,ih=0,F=1;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  const s=Math.min(1.25,820/Math.max(W,H))*Math.min(1.5,window.devicePixelRatio||1);
  iw=Math.max(200,Math.round(W*s));ih=Math.max(200,Math.round(H*s));
  [view,layer,scratch].forEach(c=>{c.width=iw;c.height=ih});
  small.width=Math.max(40,iw>>2);small.height=Math.max(40,ih>>2);
  F=Math.min(iw,ih)*.95;
  buildBg();
}
window.addEventListener('resize',resize);

// 背景:暗い雲のような揺らぎ(一度だけ作る)
function buildBg(){
  const bw=120,bh=Math.max(60,Math.round(120*ih/iw));
  bg.width=bw;bg.height=bh;
  const img=bgctx.createImageData(bw,bh),r=mulberry(7),G=[];
  const N=16;for(let i=0;i<N*N*4;i++)G.push(r());
  const vn=(x,y,o)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,
    g=(a,b)=>G[(((a%N)+N)%N+(((b%N)+N)%N)*N)*4+o],
    u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return (g(xi,yi)*(1-u)+g(xi+1,yi)*u)*(1-v)+(g(xi,yi+1)*(1-u)+g(xi+1,yi+1)*u)*v};
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    let f=0,a=.5,fx=x/bw*4,fy=y/bh*4*bh/bw;
    for(let o=0;o<4;o++){f+=vn(fx,fy,o)*a;fx*=2.03;fy*=2.03;a*=.5}
    f=Math.max(0,f-.46)*2.4;const t=y/bh,i=(y*bw+x)*4;
    img.data[i]=  8+f*(t<.55?120:40);
    img.data[i+1]=6+f*(t<.55?40:70);
    img.data[i+2]=28+f*(t<.55?90:150);
    img.data[i+3]=255;
  }
  bgctx.putImageData(img,0,0);
}

/* ───────── perspective systems ───────── */
let systems=[], seedBase=20260925;
function makeSystem(nx,ny,seed){
  const r=mulberry(seed),P=[];
  for(let i=0;i<96;i++){
    const t=r();
    let p;
    if(t<.2){          // 塔:軸のそばの細長い箱
      p={k:1,x:.01+Math.pow(r(),2)*.3,y:.02+r()*.1,w:.02+r()*.06,h:.4+r()*1.4,d:.2+r()*.6};
    }else if(t<.66){   // 段:中に何本も横筋が走るガラスの箱
      p={k:2,x:.04+Math.pow(r(),2)*2,y:.03+Math.pow(r(),1.8)*1.1,w:.12+r()*.9,h:.06+r()*.35,n:2+(r()*5|0),d:.3+r()*1.2};
    }else{             // 枠:透明なガラスの板
      p={k:0,x:.05+Math.pow(r(),1.7)*2.4,y:.04+Math.pow(r(),1.6)*1.5,w:.1+r()*1.1,h:.08+r()*.8,d:r()<.5?0:.2+r()*.8};
    }
    p.z0=r();p.a=.18+r()*.42;p.fl=r()*TAU;
    P.push(p);
  }
  const rays=[];for(let i=0;i<14;i++)rays.push({a:r()*Math.PI/2*.95+.02,l:.4+r()*.6,fl:r()*TAU,w:r()});
  const dust=[];for(let i=0;i<70;i++)dust.push({a:r()*Math.PI/2,r0:r(),s:.5+r()*1.5,fl:r()*TAU});
  return {nx,ny,P,rays,dust,born:0,alpha:0,dying:false,off:r()};
}

// ひとつの遠近を、白い光としてlayerに描く(左右・上下の4象限へ同時に)
function drawSystem(S,ph){
  const vx=S.nx*iw,vy=S.ny*ih;
  lctx.globalCompositeOperation='source-over';
  lctx.fillStyle='#000';lctx.fillRect(0,0,iw,ih);
  lctx.globalCompositeOperation='lighter';
  const NEAR=.55,FAR=9,cyc=ph/TAU;
  const quad=(x0,y0,x1,y1,mode,a)=>{     // 世界座標の長方形(x,yは正の象限)を4つ鏡写しで描く
    for(let sx=-1;sx<=1;sx+=2)for(let sy=-1;sy<=1;sy+=2){
      const ax=vx+sx*x0,bx=vx+sx*x1,ay=vy+sy*y0,by=vy+sy*y1;
      const L=Math.min(ax,bx),T=Math.min(ay,by),w=Math.abs(bx-ax),h=Math.abs(by-ay);
      if(L>iw||T>ih||L+w<0||T+h<0)continue;
      if(mode===0){lctx.strokeRect(L,T,w,h);}
      else lctx.fillRect(L,T,w,h);
    }
  };
  const edge=(xa,ya,xb,yb)=>{               // 奥行きの辺(4象限ぶん)
    for(let sx=-1;sx<=1;sx+=2)for(let sy=-1;sy<=1;sy+=2){
      lctx.moveTo(vx+sx*xa,vy+sy*ya);lctx.lineTo(vx+sx*xb,vy+sy*yb);
    }
  };
  for(let i=0;i<S.P.length;i++){
    const p=S.P[i];
    const f=((p.z0+cyc+S.off)%1+1)%1;               // 1周期でちょうど1回、奥から手前へ
    const z=FAR-(FAR-NEAR)*f;
    const fade=Math.min(1,f/.2)*Math.min(1,(1-f)/.12);
    if(fade<=0)continue;
    const k=F/z;
    const x0=p.x*k,y0=p.y*k,x1=(p.x+p.w)*k,y1=(p.y+p.h)*k;
    const fl=.72+.28*Math.sin(ph*3+p.fl);
    const a=p.a*fade*fl*Math.min(1,1.4/z+.2);
    lctx.lineWidth=Math.max(.6,k*.01);
    // 奥の面と、奥行きの辺 → ガラスの箱になる
    if(p.d>0){
      const k2=F/(z+p.d);
      const X0=p.x*k2,Y0=p.y*k2,X1=(p.x+p.w)*k2,Y1=(p.y+p.h)*k2;
      lctx.strokeStyle=`rgba(255,255,255,${a*.45})`;
      quad(X0,Y0,X1,Y1,0,a);
      lctx.beginPath();edge(x0,y0,X0,Y0);edge(x1,y0,X1,Y0);edge(x0,y1,X0,Y1);edge(x1,y1,X1,Y1);lctx.stroke();
      lctx.fillStyle=`rgba(255,255,255,${a*.05})`;quad(X0,Y0,X1,Y1,1,a);
    }
    lctx.strokeStyle=`rgba(255,255,255,${a*.85})`;
    lctx.fillStyle=`rgba(255,255,255,${a*(p.k===0?.05:.07)})`;
    quad(x0,y0,x1,y1,1,a);
    quad(x0,y0,x1,y1,0,a);
    if(p.k===2){
      lctx.fillStyle=`rgba(255,255,255,${a*.5})`;
      const hh=Math.max(.6,(y1-y0)*.035);
      for(let j=1;j<=p.n;j++){const yy=y0+(y1-y0)*j/(p.n+1);quad(x0,yy,x1,yy+hh,1,a);}
    }
    if(p.k===1){ // 塔の芯
      lctx.fillStyle=`rgba(255,255,255,${a*.3})`;
      quad(x0+(x1-x0)*.4,y0,x0+(x1-x0)*.6,y1,1,a);
    }
  }
  // 消失点を貫く縦の芯と、地平線
  let g=lctx.createLinearGradient(vx-iw*.02,0,vx+iw*.02,0);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.2)');g.addColorStop(1,'rgba(255,255,255,0)');
  lctx.fillStyle=g;lctx.fillRect(vx-iw*.02,0,iw*.04,ih);
  lctx.fillStyle='rgba(255,255,255,.55)';lctx.fillRect(vx-.6,0,1.2,ih);
  g=lctx.createLinearGradient(0,vy-ih*.02,0,vy+ih*.02);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');
  lctx.fillStyle=g;lctx.fillRect(0,vy-ih*.02,iw,ih*.04);
  // 光の筋(消失点から外へ)
  lctx.lineWidth=1;
  for(const R of S.rays){
    const a=.08+.1*Math.sin(ph*2+R.fl),L=Math.max(iw,ih)*1.3*R.l;
    lctx.strokeStyle=`rgba(255,255,255,${a})`;
    lctx.beginPath();
    for(let sx=-1;sx<=1;sx+=2)for(let sy=-1;sy<=1;sy+=2){
      lctx.moveTo(vx,vy);lctx.lineTo(vx+sx*Math.cos(R.a)*L,vy+sy*Math.sin(R.a)*L);
    }
    lctx.stroke();
  }
  // 光の粒(遠近に沿って外へ流れる)
  for(const d of S.dust){
    const f=((d.r0+cyc*2)%1),rr=Math.pow(f,2.2)*Math.max(iw,ih)*.9,a=Math.min(1,f*4)*(1-f)*(.6+.4*Math.sin(ph*5+d.fl));
    const s=Math.max(1,d.s*(.5+f*2));
    lctx.fillStyle=`rgba(255,255,255,${a})`;
    for(let sx=-1;sx<=1;sx+=2)for(let sy=-1;sy<=1;sy+=2)
      lctx.fillRect(vx+sx*Math.cos(d.a)*rr-s/2,vy+sy*Math.sin(d.a)*rr-s/2,s,s);
  }
}

// 画素の引き伸ばし(スリットスキャン風の筋)。消失点を中心に対称にかける
function stretchGlitch(S,ph){
  const vx=S.nx*iw,vy=S.ny*ih;
  sctx.globalCompositeOperation='copy';sctx.drawImage(layer,0,0);
  sctx.globalCompositeOperation='source-over';
  lctx.globalCompositeOperation='lighter';
  const step=Math.floor(ph/TAU*PERIOD*7);          // 1秒に7回入れ替わる(ループの中で決まった並び)
  const sd=(S.off*1e6|0)+step*131;
  for(let i=0;i<3;i++){
    // 横一列を縦に引き伸ばす → 縦の筋
    const dy=hash(sd+i*7)*ih*.45,hh=ih*(.02+hash(sd+i*7+1)*.14),a=.12+hash(sd+i*7+2)*.22;
    lctx.globalAlpha=a;
    for(const s of[-1,1]){
      const y=vy+s*dy;if(y<0||y>=ih)continue;
      lctx.drawImage(scratch,0,Math.floor(y),iw,1,0,s>0?y:y-hh,iw,hh);
    }
    // 縦一列を横に引き伸ばす → 横の筋
    const dx=hash(sd+i*7+3)*iw*.45,ww=iw*(.02+hash(sd+i*7+4)*.2);
    lctx.globalAlpha=a*.8;
    for(const s of[-1,1]){
      const x=vx+s*dx;if(x<0||x>=iw)continue;
      lctx.drawImage(scratch,Math.floor(x),0,1,ih,s>0?x:x-ww,0,ww,ih);
    }
  }
  lctx.globalAlpha=1;
}

// 白い光を、その遠近の地平線を基準にした虹で染める
function colorize(S){
  const vy=S.ny*ih,sp=SPECTRA[specIdx];
  // 染める前の白を残しておく(芯の白さ用)
  sctx.globalCompositeOperation='copy';sctx.drawImage(layer,0,0);
  const span=ih*1.0;
  const g=lctx.createLinearGradient(0,vy-span*.62,0,vy+span*.62);
  sp.forEach(([d,c])=>g.addColorStop(Math.min(1,Math.max(0,(d+.62)/1.24)),c));
  lctx.globalCompositeOperation='multiply';
  lctx.fillStyle=g;lctx.fillRect(0,0,iw,ih);
  lctx.globalCompositeOperation='lighter';
  lctx.globalAlpha=.07;lctx.drawImage(scratch,0,0);lctx.globalAlpha=1;
}

function render(ph,live){
  // 背景
  vctx.globalCompositeOperation='source-over';vctx.globalAlpha=1;
  vctx.imageSmoothingEnabled=true;
  vctx.drawImage(bg,0,0,iw,ih);
  // 遠近をひとつずつ重ねる
  const n=systems.length;
  for(let i=0;i<n;i++){
    const S=systems[i];
    const a=live?S.alpha:1;if(a<=.01)continue;
    drawSystem(S,ph);
    stretchGlitch(S,ph);
    colorize(S);
    vctx.globalCompositeOperation='lighten';          // 明るい方を取るだけ。何枚重ねても白へ足し算されない
    vctx.globalAlpha=a*(i===n-1?1:.8);
    vctx.drawImage(layer,0,0);
  }
  // にじみ(小さく縮めて、戻して足す)
  smctx.globalCompositeOperation='copy';smctx.imageSmoothingEnabled=true;
  smctx.drawImage(view,0,0,small.width,small.height);
  vctx.globalCompositeOperation='lighter';vctx.globalAlpha=.16;
  vctx.drawImage(small,0,0,iw,ih);
  vctx.globalAlpha=1;vctx.globalCompositeOperation='source-over';
  // 新しい消失点が生まれた瞬間の閃光
  if(live)systems.forEach(S=>{
    if(S.born<.8){
      const t=S.born/.8,x=S.nx*iw,y=S.ny*ih,r=Math.max(iw,ih)*(.05+t*.5);
      const g=vctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(255,255,255,${.4*(1-t)})`);g.addColorStop(1,'rgba(255,255,255,0)');
      vctx.globalCompositeOperation='lighter';vctx.fillStyle=g;vctx.fillRect(0,0,iw,ih);
      vctx.globalCompositeOperation='source-over';
    }
  });
}

/* ───────── the law ───────── */
function addSystem(nx,ny){
  const S=makeSystem(nx,ny,(Math.random()*1e9)|0);
  S.alpha=0;systems.push(S);
  const alive=systems.filter(s=>!s.dying);
  if(alive.length>MAXSYS)alive[0].dying=true;      // 覚えていられる遠近は5つまで
}

/* ───────── input ───────── */
let hinted=false;
function hideHint(){if(!hinted){hinted=true;hint.classList.remove('on')}}
view.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  const r=view.getBoundingClientRect();
  addSystem((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
  hideHint();
},{passive:false});

/* ───────── loop ───────── */
let last=performance.now(),clock=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  systems.forEach(S=>{
    S.born+=dt;
    if(S.dying)S.alpha=Math.max(0,S.alpha-dt/1.6);
    else S.alpha=Math.min(1,S.alpha+dt/1.1);
  });
  systems=systems.filter(S=>!(S.dying&&S.alpha<=0));
  render((clock/PERIOD)*TAU%TAU,true);
  requestAnimationFrame(frame);
}

/* ───────── controls ───────── */
function mutate(){                     // 虹の種類を変え、すべての遠近の建築を建て直す(消失点の位置は残す)
  specIdx=(specIdx+1)%SPECTRA.length;
  systems=systems.filter(S=>!S.dying).map(S=>{const N=makeSystem(S.nx,S.ny,(Math.random()*1e9)|0);N.alpha=S.alpha;N.born=9;return N;});
}
function resetAll(){
  const S=makeSystem(.5,.56,seedBase);S.alpha=1;S.born=9;systems=[S];
}

resize();resetAll();
requestAnimationFrame(frame);
setTimeout(()=>{if(!hinted)hint.classList.add('on')},900);
setTimeout(hideHint,8000);

window.APKit.init({
  canvas:view,
  gifName:'prism-nave-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){render(phase,false);},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
</body>
</html>
