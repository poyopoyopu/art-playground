<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNOT — PRESENCE LAW</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#888;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  KNOT — PRESENCE LAW / Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: 虹色のガラス管が絡み合う画像(おっちゃん提供)

  世界のルール — 「在るものは、触れられたものだけ」:
  この結び目は最初、ほとんど実体を持たない細い糸で、向こう側が透けている。
  なぞった所だけが太く重くなり、ガラスとしての実体を持つ。
  触れられない所は少しずつ痩せていき、やがて途切れて消える。
  だが結び目の形そのものは残っているので、消えた所をもう一度なぞれば戻ってくる。
  つまり「どこが在るか」は指が決め、放っておけば世界は自分の形を忘れていく。
*/
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name.replace('[0]','')]=gl.getUniformLocation(p,a.name)}
  return {p,u}}
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

const NT=64;   /* 結び目を64区間に分けて、それぞれの実体の濃さを持つ */

const FS=`#version 300 es
precision highp float;
out vec4 O;
uniform vec2 res;
uniform float k,hue;
uniform float pf,qf,qinv;
uniform float R,r2,tube;
uniform float th[${NT}];

const float TAU=6.28318530718;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 pal(float x){return 0.5+0.5*cos(TAU*(x+vec3(0.0,0.33,0.67)));}

float presence(float u){
  float f=fract(u)*float(${NT});
  int i0=int(floor(f));int i1=int(mod(float(i0+1),float(${NT})));
  return mix(th[i0],th[i1],fract(f));
}
float knot(vec3 p,out float u){
  float ang=atan(p.z,p.x);
  vec2 cs=vec2(length(p.xz)-R,p.y);
  cs*=rot(ang*qf/pf);
  float a2=atan(cs.y,cs.x);
  float sec=TAU/pf;
  float idx=floor((a2+sec*0.5)/sec);
  float a3=a2-idx*sec;
  float L=length(cs);
  vec2 cf=L*vec2(cos(a3),sin(a3));
  float m=mod(idx*qinv,pf);
  u=fract((ang/TAU+m)/pf+1.0);
  return length(cf-vec2(r2,0.0));
}
float map(vec3 p){
  float u;
  float d=knot(p,u)-tube*(0.055+0.945*presence(u));
  return d*0.45;
}
vec3 nrm(vec3 p){
  vec2 e=vec2(1.0,-1.0)*0.0016;
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx));
}
vec3 env(vec3 d){
  float a=atan(d.z,d.x);
  vec3 c=vec3(0.015,0.02,0.045);
  c+=vec3(0.18,0.5,1.0)*pow(max(0.0,sin(a+1.0)*0.5+0.5),6.0)*(0.55+0.45*d.y);
  c+=vec3(1.0,0.55,0.16)*pow(max(0.0,cos(a*1.3-0.5)*0.5+0.5),12.0);
  c+=vec3(0.75,0.3,1.0)*pow(max(0.0,sin(a*0.7-2.0)*0.5+0.5),8.0);
  c+=vec3(1.0)*pow(max(0.0,d.y),26.0)*1.6;
  return c;
}
vec3 bg(vec2 uv){
  vec3 c=vec3(0.012,0.016,0.032);
  for(int i=0;i<6;i++){
    float f=float(i);
    vec2 ctr=vec2(sin(f*2.3+0.4)*1.5,cos(f*1.7+1.1)*0.95);
    float rr=0.30+0.22*fract(f*0.37+0.2);
    float d=length(uv-ctr)-rr;
    vec3 tint=pal(hue+0.12*f+0.4);
    c+=tint*exp(-abs(d)*7.0)*0.32;
    c*=mix(1.0,0.12,smoothstep(0.02,-0.02,d));
  }
  return c;
}

void main(){
  vec2 uv=(gl_FragCoord.xy*2.0-res)/res.y;
  vec3 ro=vec3(0.0,0.06*sin(k*2.0),-3.6),rd=normalize(vec3(uv,1.8));
  mat2 Rm=rot(k);
  ro.xz*=Rm; rd.xz*=Rm;
  ro.yz*=rot(0.32); rd.yz*=rot(0.32);

  float t=0.1;bool hit=false;
  for(int i=0;i<130;i++){
    vec3 p=ro+rd*t;float d=map(p);
    if(d<0.0012*t){hit=true;break;}
    t+=d; if(t>9.0)break;
  }

  vec3 col=bg(uv);
  if(hit){
    vec3 p=ro+rd*t,n=nrm(p);
    float u;knot(p,u);
    float pr=presence(u);           /* ここがどれだけ「在る」か */
    float fres=pow(1.0-max(dot(n,-rd),0.0),3.5);
    vec3 rr=refract(rd,n,0.72);
    if(dot(rr,rr)<0.001)rr=reflect(rd,n);
    vec3 ip=p-n*0.01;float thick=0.0;
    for(int i=0;i<10;i++){
      float d=map(ip);
      if(d>-0.001)break;
      float st=max(0.02,-d);
      ip+=rr*st;thick+=st;
    }
    float ph=thick*9.0+dot(n,vec3(0.6,0.4,0.7))*1.8;
    vec3 iri=0.5+0.5*cos(vec3(ph,ph*1.08+0.9,ph*1.18+1.9));
    vec3 base=pal(hue+u*0.6+0.1*n.y);
    vec3 solid=base*iri*0.55+env(reflect(rd,n))*(0.25+0.85*fres)
      +vec3(1.0)*pow(max(dot(reflect(rd,n),normalize(vec3(0.4,0.9,-0.4))),0.0),60.0)*1.1
      +pal(hue+0.5)*fres*0.35;
    /* 実体の薄い所は、ガラスではなく光の筋のような幽霊になる */
    vec3 ghost=pal(hue+u*0.6)*0.35+vec3(0.5,0.62,0.9)*fres*0.5;
    col=mix(col+ghost*0.55,solid,smoothstep(0.05,0.55,pr));
    col*=1.0-0.05*t;
  }
  col=pow(max(col,0.0),vec3(0.86));
  O=vec4(col,1.0);
}`;
const P=prog(FS),U=P.u;

/* ---------- 状態 ---------- */
let W=0,H=0,DPR=1,paused=false;
let hue=Math.random();
let R=1.0,r2=0.42,tube=0.22;
let pq=[2,3];
const th=new Float32Array(NT);

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.4);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR));
}
window.addEventListener('resize',resize);resize();

function egcdInv(a,m){for(let i=1;i<m;i++)if((a*i)%m===1)return i;return 1}
const KNOTS=[[2,3],[2,5],[3,4],[3,5],[2,7]];
function seedWorld(){
  pq=KNOTS[Math.floor(Math.random()*KNOTS.length)];
  hue=Math.random();r2=0.38+Math.random()*0.10;tube=0.20+Math.random()*0.04;
  for(let i=0;i<NT;i++)th[i]=0.30+0.12*Math.sin(i*0.6);
}
seedWorld();

/* ---------- 画面の指の位置 → 結び目の上の位置(CPU側で同じ式を使う) ---------- */
let qinv=1;
function presenceJS(u){
  const f=((u%1)+1)%1*NT;
  const i0=Math.floor(f),i1=(i0+1)%NT;
  return th[i0]+(th[i1]-th[i0])*(f-i0);
}
function knotJS(x,y,z){
  const ang=Math.atan2(z,x);
  let cx=Math.hypot(x,z)-R, cy=y;
  const a=ang*pq[1]/pq[0],ca=Math.cos(a),sa=Math.sin(a);
  const rx=cx*ca-cy*sa, ry=cx*sa+cy*ca;
  const a2=Math.atan2(ry,rx),sec=2*Math.PI/pq[0];
  const idx=Math.floor((a2+sec*0.5)/sec);
  const a3=a2-idx*sec,L=Math.hypot(rx,ry);
  const fx=L*Math.cos(a3)-r2, fy=L*Math.sin(a3);
  const m=((idx*qinv)%pq[0]+pq[0])%pq[0];
  const u=(((ang/(2*Math.PI)+m)/pq[0])%1+1)%1;
  return {d:Math.hypot(fx,fy),u};
}
function pick(px,py){
  let u=(2*px-W)/H, v=(H-2*py)/H;
  let d=[u,v,1.8];
  let L=Math.hypot(d[0],d[1],d[2]);d=[d[0]/L,d[1]/L,d[2]/L];
  let o=[0,0.06*Math.sin(phase*2),-3.6];
  const cs=Math.cos(phase),sn=Math.sin(phase);
  const rotXZ=a=>[a[0]*cs-a[2]*sn,a[1],a[0]*sn+a[2]*cs];
  o=rotXZ(o);d=rotXZ(d);
  const c2=Math.cos(0.32),s2=Math.sin(0.32);
  const rotYZ=a=>[a[0],a[1]*c2-a[2]*s2,a[1]*s2+a[2]*c2];
  o=rotYZ(o);d=rotYZ(d);
  let t=0.1;
  for(let i=0;i<110;i++){
    const p=[o[0]+d[0]*t,o[1]+d[1]*t,o[2]+d[2]*t];
    const q=knotJS(p[0],p[1],p[2]);
    /* 触るときは細い糸にも当たるように、判定を実体より太めに取る */
    const dd=(q.d-Math.max(tube*0.42,tube*(0.055+0.945*presenceJS(q.u))))*0.45;
    if(dd<0.0015*t)return q.u;
    t+=dd; if(t>9)break;
  }
  return null;
}

/* 触れた所が実体になる */
function touchAt(px,py,amt){
  const u=pick(px,py);
  if(u===null)return false;
  const ctr=u*NT;
  for(let i=0;i<NT;i++){
    let du=Math.abs(i-ctr);du=Math.min(du,NT-du);
    const w=Math.exp(-(du*du)/(2.6*2.6));
    th[i]=Math.min(1,th[i]+amt*w);
  }
  return true;
}

let ptr=null;
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId};touchAt(e.clientX,e.clientY,0.42);
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  touchAt(e.clientX,e.clientY,0.30);
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

function sim(dt){
  /* 触れられない所は痩せていく。世界は自分の形を忘れる */
  for(let i=0;i<NT;i++)th[i]=Math.max(0,th[i]-dt*0.055);
  /* 隣とわずかに馴染ませて、途切れ目を滑らかにする */
  const n=Float32Array.from(th);
  for(let i=0;i<NT;i++){
    const a=n[(i-1+NT)%NT],b=n[(i+1)%NT];
    th[i]=n[i]+0.06*(a+b-2*n[i]);
  }
}

function render(kk){
  gl.useProgram(P.p);
  gl.viewport(0,0,c.width,c.height);
  gl.uniform2f(U.res,c.width,c.height);
  gl.uniform1f(U.k,kk);
  gl.uniform1f(U.hue,hue);
  qinv=egcdInv(pq[1]%pq[0]||1,pq[0]);
  gl.uniform1f(U.pf,pq[0]);gl.uniform1f(U.qf,pq[1]);gl.uniform1f(U.qinv,qinv);
  gl.uniform1f(U.R,R);gl.uniform1f(U.r2,r2);gl.uniform1f(U.tube,tube);
  gl.uniform1fv(U.th,th);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

let phase=0,last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){
    phase=(phase+dt*0.18)%(Math.PI*2);
    sim(dt);
    render(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'knot-presence-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){paused=true;render(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 結び目の種類・太さ・色を引き直す。どこが在るか(実体の分布)はそのまま */
      pq=KNOTS[Math.floor(Math.random()*KNOTS.length)];
      r2=0.34+Math.random()*0.16;tube=0.17+Math.random()*0.09;hue=Math.random();
    }},
    {label:'↻',name:'reset',onClick:function(){seedWorld();}}
  ]
});
</script>
</body></html>
