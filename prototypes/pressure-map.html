<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRESSURE MAP</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030605}canvas{width:100%;height:100%;display:block;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),g=c.getContext('webgl2',{antialias:false,alpha:false});if(!g)throw Error('WebGL2 unavailable');const V=`#version 300 es
in vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`,F=`#version 300 es
precision highp float;out vec4 O;in vec2 v;uniform vec2 R,P;uniform float T,S;uniform vec4 A[8];uniform int N;#define TAU 6.28318530718
float h(float p){p=fract(p*123.34);p+=dot(p,p+45.32);return fract(p*p);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i.x+31.7*i.y),h(i.x+31.7*i.y+1.),f.x),mix(h(i.x+31.7*(i.y+1.)),h(i.x+31.7*(i.y+1.)+1.),f.x),f.y);}float f(vec2 p){float s=0.,a=.5;for(int i=0;i<7;i++){s+=a*n(p);p=mat2(1.7,-1.1,1.1,1.7)*p;a*=.5;}return s;}float tf(vec2 p){float q=0.;for(int i=0;i<8;i++){if(i>=N)break;vec2 d=p-A[i].xy;q+=exp(-dot(d,d)/(A[i].z*A[i].z));}return q;}void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.)*1.35;float t=tf(p);float z=f(p*2.1+vec2(T*.008,-T*.006));p+=vec2(sin(p.y*3.+z*7.),cos(p.x*2.6-z*6.))* (.22+t*.7);float level=length(p)+z*.42;float contour=pow(abs(sin(level*34.-T*.025)),10.);float basin=smoothstep(.62,.94,n(p*1.3+t));float pit=0.;for(int i=0;i<5;i++){float k=float(i);vec2 q=vec2(sin(k*8.+S),cos(k*5.7+S))*.5;pit=max(pit,smoothstep(.18,.025,length(p-q)));}vec3 col=vec3(.02,.035,.03)+vec3(.22,.34,.26)*cos(TAU*(vec3(.16,.29,.51)*z+vec3(.02,.18,.61)));col+=contour*vec3(.15,.55,.62);col*=1.-basin*.42;col*=1.-pit*.78;col+=smoothstep(.45,.9,pit)*vec3(.7,.32,.05);O=vec4(col,1.);}`;function sh(t,s){let q=g.createShader(t);g.shaderSource(q,s);g.compileShader(q);if(!g.getShaderParameter(q,g.COMPILE_STATUS))throw Error(g.getShaderInfoLog(q));return q}let pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,V));g.attachShader(pr,sh(g.FRAGMENT_SHADER,F));g.linkProgram(pr);g.useProgram(pr);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),g.STATIC_DRAW);let l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);let u={R:g.getUniformLocation(pr,'R'),P:g.getUniformLocation(pr,'P'),T:g.getUniformLocation(pr,'T'),S:g.getUniformLocation(pr,'S'),A:g.getUniformLocation(pr,'A[0]'),N:g.getUniformLocation(pr,'N')},W,H,D,seed=Math.random()*9e4,pts=[],t0=performance.now(),P={x:0,y:0};function rs(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;g.viewport(0,0,c.width,c.height)}addEventListener('resize',rs);rs();function draw(t){g.uniform2f(u.R,W,H);g.uniform2f(u.P,P.x/W-.5,1-P.y/H-.5);g.uniform1f(u.T,t);g.uniform1f(u.S,seed);let a=new Float32Array(32);pts.forEach((q,i)=>{if(i<8){a[i*4]=q.x/W-.5;a[i*4+1]=1-q.y/H-.5;a[i*4+2]=q.r/Math.max(W,H);a[i*4+3]=q.phase}});g.uniform4fv(u.A,a);g.uniform1i(u.N,Math.min(8,pts.length));g.drawArrays(g.TRIANGLES,0,3)}function add(x,y){pts.push({x,y,r:80+Math.random()*100,phase:Math.random()*TAU});if(pts.length>8)pts.shift()}let d=0;c.onpointerdown=e=>{if(APKit.isUI(e.clientX,e.clientY))return;d=1;P.x=e.clientX;P.y=e.clientY;add(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{P.x=e.clientX;P.y=e.clientY;if(d&&Math.random()<.4)add(e.clientX,e.clientY)};c.onpointerup=()=>d=0;c.onpointercancel=()=>d=0;function anim(ms){draw((ms-t0)*.00007);requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'pressure-map-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9e4;pts=[]}},{label:'↻',name:'reset',onClick:()=>pts=[]}]});</script></body></html>
