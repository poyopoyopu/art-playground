<!DOCTYPE html>
<!-- SAME WINTER — Claude(クロちゃん)作。自然のフラクタル・シリーズ2(雪の結晶)。MORPHING FERN の光の粒の描き方を下地にした。ap-kit.js統合: Claude -->
<!-- 世界のルール: 雪の結晶の腕は、育つあいだの「空の状態」をそのまま形に刻む。6本の腕は同じ空を通ってきたので、同じ形になる。
     指は空そのもの。上下になぞる=湿り気(湿るほど枝分かれし、乾くと止まる)、タップ=突風(その瞬間、全部の枝先が同時に枝を出し、
     その時の大きさが輪の跡として残る)、長押し=冷たく静かな空(枝先に六角の板が育つ)。一度刻んだ形は戻らない。
     枝から枝、その枝からまた枝と、同じ「60°に枝を出す」きまりが何段もくり返されて結晶になる。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SAME WINTER — 6本の腕は、同じ空を通ってきた</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #dff4ff; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 14px rgba(140, 200, 255, .5); }
  #hint.on { opacity: .72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ 突風。6本の腕すべてに同じ枝が生える<br>上下になぞる ＝ 湿り気 ／ 長押し ＝ 六角の板が育つ</div>
<script>
/* ======== 光の粒エンジン(自然のフラクタル・シリーズ共通) ========
   MORPHING FERN の描き方(粒を溜めて少しずつ消す)を作品ごとに使えるようにしたもの。
   作品側は plot(api) で粒を打つだけ。色は作品ごとのグラデーションを24段に分けて、まとめて描く。 */
var NF = (function () {
  'use strict';
  var TAU = Math.PI * 2;

  function run(work) {
    var cvs = document.getElementById('c');
    var hint = document.getElementById('hint');
    var ctx = cvs.getContext('2d', { alpha: false, desynchronized: true });
    var acc = document.createElement('canvas');
    var actx = acc.getContext('2d', { alpha: false, desynchronized: true });

    var W = 0, H = 0, DPR = 1, RES_CAP = 2200000, MAXDT = 0.05;
    var NB = 24, CAP = 26000;
    var dx = new Float32Array(CAP), dy = new Float32Array(CAP), dc = new Uint8Array(CAP);
    var ox = new Float32Array(CAP), oy = new Float32Array(CAP);
    var cnt = 0, counts = new Int32Array(NB * 2), starts = new Int32Array(NB * 2);
    var fills = [], fillsHi = [], rgbs = [];

    /* ---- 色: 作品のグラデーションから24段 ---- */
    function setPalette(stops, alphaLo, alphaHi) {
      fills = []; fillsHi = []; rgbs = [];
      for (var i = 0; i < NB; i++) {
        var t = i / (NB - 1), k = 0;
        while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
        var a = stops[k], b = stops[k + 1];
        var u = Math.max(0, Math.min(1, (t - a[0]) / Math.max(1e-6, b[0] - a[0])));
        var r = Math.round(a[1] + (b[1] - a[1]) * u), g = Math.round(a[2] + (b[2] - a[2]) * u), bl = Math.round(a[3] + (b[3] - a[3]) * u);
        rgbs.push([r, g, bl]);
        fills.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaLo + ')');
        fillsHi.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaHi + ')');
      }
    }

    /* ---- 発光スプライト(色ごとに作って使い回す) ---- */
    var spriteCache = {};
    function spriteFor(c) {
      var i = Math.max(0, Math.min(NB - 1, Math.round(c * (NB - 1))));
      var key = i + ':' + rgbs[i].join(',');
      if (spriteCache[key]) return spriteCache[key];
      var s = document.createElement('canvas'); s.width = s.height = 64;
      var g2 = s.getContext('2d'), rgb = rgbs[i];
      var gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.12, 'rgba(' + rgb + ',0.5)');
      gr.addColorStop(0.34, 'rgba(' + rgb + ',0.13)');
      gr.addColorStop(0.66, 'rgba(' + rgb + ',0.035)');
      gr.addColorStop(1, 'rgba(' + rgb + ',0)');
      g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
      spriteCache[key] = s;
      return s;
    }

    var api = {
      W: 0, H: 0, min: 1, now: 0, dt: 0, quality: 2, TAU: TAU,
      ptr: { x: 0, y: 0, down: false, held: 0, drag: false },
      /* 粒を1つ打つ。c=色(0..1)、hi=明るい段 */
      dot: function (x, y, c, hi) {
        if (cnt >= CAP) return;
        if (x < -4 || y < -4 || x > W + 4 || y > H + 4) return;
        var i = (c * (NB - 1) + 0.5) | 0;
        if (i < 0) i = 0; else if (i >= NB) i = NB - 1;
        dx[cnt] = x * DPR; dy[cnt] = y * DPR; dc[cnt] = hi ? i + NB : i; cnt++;
      },
      /* にじむ光(溜める層へ) */
      glow: function (x, y, r, c, a) {
        var pa = actx.globalAlpha;
        actx.globalCompositeOperation = 'lighter';
        actx.globalAlpha = a;
        actx.drawImage(spriteFor(c), (x - r) * DPR, (y - r) * DPR, r * 2 * DPR, r * 2 * DPR);
        actx.globalAlpha = pa;
      },
      /* にじむ光(その場だけ、溜めない) */
      flare: function (x, y, r, c, a) {
        var pa = ctx.globalAlpha;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.drawImage(spriteFor(c), x - r, y - r, r * 2, r * 2);
        ctx.globalAlpha = pa;
      },
      clear: function () {
        actx.setTransform(1, 0, 0, 1, 0, 0);
        actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
        actx.fillStyle = '#000'; actx.fillRect(0, 0, acc.width, acc.height);
      },
      palette: setPalette,
      rand: Math.random,
      hideHint: function () { hint.classList.remove('on'); }
    };

    function resize() {
      var w = cvs.clientWidth || window.innerWidth;
      var h = cvs.clientHeight || window.innerHeight;
      if (w === W && h === H && cvs.width > 1) return;
      W = w; H = h;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      if (w * h * DPR * DPR > RES_CAP) DPR = Math.max(1, Math.sqrt(RES_CAP / (w * h)));
      cvs.width = Math.max(1, Math.round(w * DPR));
      cvs.height = Math.max(1, Math.round(h * DPR));
      acc.width = cvs.width; acc.height = cvs.height;
      api.W = W; api.H = H; api.min = Math.min(W, H);
      api.clear();
      if (work.resize) work.resize(api);
    }

    /* ---- 操作: 押した瞬間 / 短く離す=タップ / 押したまま=長押し / 動かす=なぞる ---- */
    var p = api.ptr, downAt = 0, sx = 0, sy = 0, lx = 0, ly = 0, pid = null, holding = false;
    function toXY(e) { var r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cvs.addEventListener('pointerdown', function (e) {
      if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
      if (pid !== null) return;
      pid = e.pointerId;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
      var q = toXY(e);
      p.x = sx = lx = q.x; p.y = sy = ly = q.y; p.down = true; p.held = 0; p.drag = false; holding = false;
      downAt = performance.now();
      if (api.now > 1.2) api.hideHint();
      if (work.down) work.down(api, q.x, q.y);
      e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pid) return;
      var q = toXY(e);
      p.x = q.x; p.y = q.y;
      if (!p.drag && !holding && Math.hypot(q.x - sx, q.y - sy) > 12) p.drag = true;
      if (p.drag && work.drag) work.drag(api, q.x, q.y, q.x - lx, q.y - ly);
      lx = q.x; ly = q.y;
    }, { passive: true });
    function up(e) {
      if (e.pointerId !== pid) return;
      pid = null;
      var q = toXY(e), t = (performance.now() - downAt) / 1000;
      p.down = false;
      if (holding) { if (work.release) work.release(api, q.x, q.y, p.held); }
      else if (!p.drag && t < 0.4) { if (work.tap) work.tap(api, q.x, q.y); }
      else if (p.drag && work.dragEnd) work.dragEnd(api, q.x, q.y);
      holding = false; p.drag = false; p.held = 0;
    }
    cvs.addEventListener('pointerup', up);
    cvs.addEventListener('pointercancel', up);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(cvs);
    window.addEventListener('resize', function () { setTimeout(resize, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', function () { last = 0; });

    /* ---- 描画 ---- */
    var floorT = 0;
    function clearResidue() {
      actx.save();
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalAlpha = 1;
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'lighter'; actx.fillStyle = 'rgb(1,1,1)'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.restore();
    }
    function flush() {
      var i, k;
      counts.fill(0);
      for (i = 0; i < cnt; i++) counts[dc[i]]++;
      var s = 0;
      for (k = 0; k < NB * 2; k++) { starts[k] = s; s += counts[k]; }
      var pos = starts.slice();
      for (i = 0; i < cnt; i++) { var b = dc[i], j = pos[b]++; ox[j] = dx[i]; oy[j] = dy[i]; }
      actx.globalCompositeOperation = 'lighter';
      actx.globalAlpha = 1;
      var sz = Math.max(1, DPR * 1.05), szH = Math.max(1.4, DPR * 1.45);
      for (k = 0; k < NB * 2; k++) {
        if (!counts[k]) continue;
        var hi = k >= NB, z = hi ? szH : sz;
        actx.fillStyle = hi ? fillsHi[k - NB] : fills[k];
        var e = starts[k] + counts[k];
        for (i = starts[k]; i < e; i++) actx.fillRect(ox[i], oy[i], z, z);
      }
      cnt = 0;
    }

    var last = 0, perfAcc = 0, perfN = 0;
    function frame(ts) {
      if (!last) last = ts;
      var dt = (ts - last) / 1000; last = ts;
      if (dt > MAXDT) dt = MAXDT;
      if (dt < 0.0005) dt = 0.0005;
      api.now += dt; api.dt = dt;
      if (p.down && !p.drag) {
        var t = (performance.now() - downAt) / 1000;
        if (!holding && t >= 0.4) { holding = true; if (work.holdStart) work.holdStart(api, p.x, p.y); }
        if (holding) { p.held += dt; if (work.hold) work.hold(api, p.x, p.y, dt); }
      }
      if (work.update) work.update(api, dt);

      var fadeA = 1 - Math.exp(-(work.fade || 1.25) * dt);
      if (fadeA < 0.001) fadeA = 0.001;
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
      actx.fillStyle = 'rgba(0,0,0,' + fadeA.toFixed(5) + ')';
      actx.fillRect(0, 0, acc.width, acc.height);
      floorT += dt;
      if (floorT >= 0.05) { floorT = 0; clearResidue(); }

      work.plot(api);
      flush();

      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      if (work.background) work.background(api, ctx); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(acc, 0, 0, acc.width, acc.height, 0, 0, W, H);
      if (work.overlay) work.overlay(api, ctx);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

      perfAcc += dt * 1000; perfN++;
      if (perfN >= 90) { if (perfAcc / perfN > 26 && api.quality === 2) api.quality = 1; perfAcc = 0; perfN = 0; }
      requestAnimationFrame(frame);
    }

    api.ctx = ctx;
    if (work.init) work.init(api);
    resize();
    setTimeout(function () { hint.classList.add('on'); }, 550);
    setTimeout(api.hideHint, 7500);
    requestAnimationFrame(frame);
    window.__api = api;

    if (window.APKit) {
      window.APKit.init({
        canvas: cvs,
        gifName: work.name,
        clockFormat: 'spec',
        dock: true,
        autoHide: true,
        fullscreenButton: false,
        buttons: [
          { label: '✦', name: 'mutate', onClick: function () { work.mutate(api); } },
          { label: '↻', name: 'reset', onClick: function () { api.clear(); work.reset(api); } }
        ]
      });
    }
    return api;
  }
  return { run: run };
})();

(function () {
  'use strict';
  var S30 = Math.tan(Math.PI / 6), R60 = Math.PI / 3;
  var segs, tips, plates, rings, R, hum, humGoal, rot, age, doneT, melt, gust, seed, calm;
  var COS = [], SIN = [];
  for (var k = 0; k < 6; k++) { COS.push(Math.cos(k * R60)); SIN.push(Math.sin(k * R60)); }

  function newCrystal() {
    segs = []; tips = []; plates = []; rings = [];
    age = 0; doneT = 0; melt = 0; gust = 0; calm = 0;
    hum = humGoal = 0.35 + Math.random() * 0.4;
    seed = Math.random() * 100;
    plates.push({ x: 0, y: 0, s: 0, max: 0.05 + Math.random() * 0.05, grow: 1 });   /* 芯の小さな六角板 */
    addTip(0.02, 0, 0, 0);
  }
  function addTip(x, y, ang, level) {
    if (tips.length > 360) return;
    var sg = { x1: x, y1: y, x2: x, y2: y, w: level === 0 ? 1.0 : level === 1 ? 0.62 : 0.4, lv: level, t: age };
    segs.push(sg);
    tips.push({ x: x, y: y, a: ang, ca: Math.cos(ang), sa: Math.sin(ang), lv: level, seg: sg, since: 0, gap: 0.05 + level * 0.035, sp: [1, 0.5, 0.32, 0.22][level], len: 0, max: level ? (0.24 / Math.pow(level, 0.8)) * (0.45 + hum) : 9 });
  }
  function branch(t) {                             /* 60°ずつ枝を出す(同じきまりを何段でも) */
    var a = t.a, l = t.lv + 1;
    if (l > 3) return;
    if (t.lv === 0) { addTip(t.x, t.y, a + R60, l); }
    else { addTip(t.x, t.y, a + R60, l); addTip(t.x, t.y, a - R60, l); }
    t.since = 0;
  }

  var work = {
    name: 'same-winter',
    fade: 1.9,
    init: function (api) {
      api.palette([[0, 30, 60, 150], [0.22, 100, 170, 255], [0.42, 215, 238, 255], [0.56, 205, 255, 236], [0.7, 236, 222, 255], [0.84, 255, 226, 240], [1, 255, 255, 255]], 0.34, 0.7);
      rot = Math.random() * 6;
      newCrystal();
    },
    resize: function (api) { R = api.min * 0.44; },
    tap: function (api) {                            /* 突風: いまの枝先すべてから同時に枝 */
      if (melt > 0) return;
      var n = tips.length, i;
      for (i = 0; i < n; i++) if (tips[i].since > 0.012) branch(tips[i]);
      gust = 1;
      rings.push({ r: Math.max(0.03, tips.length ? Math.max.apply(null, tips.map(function (t) { return Math.hypot(t.x, t.y); })) : 0.1), t: 0 });
    },
    drag: function (api, x, y, dx, dy) { humGoal = Math.max(0, Math.min(1, humGoal - dy / (api.H * 0.45))); hum = humGoal; },
    holdStart: function () { calm = 1; },
    hold: function (api, x, y, dt) {
      for (var i = 0; i < tips.length; i++) {
        var t = tips[i];
        if (!t.plate && t.lv <= 1) { t.plate = { x: t.x, y: t.y, s: 0, max: t.lv ? 0.022 : 0.045, grow: 1 }; plates.push(t.plate); }
      }
    },
    release: function () {
      calm = 0;
      for (var i = 0; i < tips.length; i++) tips[i].plate = null;
    },
    mutate: function () { humGoal = Math.random(); seed = Math.random() * 100; gust = 0.6; },
    reset: function () { newCrystal(); rot = Math.random() * 6; },
    update: function (api, dt) {
      rot += dt * 0.025;
      gust = Math.max(0, gust - dt * 1.4);
      if (melt > 0) {
        melt += dt / 3.2;
        if (melt >= 1) newCrystal();
        return;
      }
      age += dt;
      /* 空は勝手にもゆっくり変わる(指でなぞると上書き) */
      if (!api.ptr.drag) humGoal += (0.5 + 0.45 * Math.sin(age * 0.23 + seed) * Math.sin(age * 0.11 + seed * 2) - humGoal) * dt * 0.08;
      hum += (humGoal - hum) * Math.min(1, dt * 2);

      var speed = (0.018 + 0.05 * hum) * (calm ? 0.25 : 1) * (1 + gust * 1.5);
      var rate = calm ? 0 : (0.25 + hum * hum * 3.2);
      for (var i = tips.length - 1; i >= 0; i--) {
        var t = tips[i], v = speed * t.sp;
        t.x += t.ca * v * dt; t.y += t.sa * v * dt; t.since += v * dt; t.len += v * dt;
        t.seg.x2 = t.x; t.seg.y2 = t.y;
        var r = Math.hypot(t.x, t.y);
        if (t.y > t.x * S30 + 0.002 || t.y < -0.002 || r > 1 || t.len > t.max) { tips.splice(i, 1); continue; }   /* 隣の腕との境目・軸・外周で止まる */
        if (t.since > t.gap && Math.random() < rate * dt * (t.lv === 0 ? 1.2 : 1)) branch(t);
        if (t.plate) { t.plate.x = t.x; t.plate.y = t.y; }
      }
      for (i = 0; i < plates.length; i++) { var p = plates[i]; if (p.grow) { p.s = Math.min(p.max, p.s + dt * 0.02); if (p.s >= p.max && !calm) p.grow = 0; } }
      for (i = 0; i < rings.length; i++) rings[i].t += dt;
      if (!tips.length) { doneT += dt; if (doneT > 7) melt = 0.0001; }
    },
    plot: function (api) {
      var cx = api.W / 2, cy = api.H * 0.46, n = api.quality === 2 ? 9000 : 5200;
      var i, L = 0, cum = [], fade = melt > 0 ? 1 - melt : 1;
      n = Math.round(n * fade);
      for (i = 0; i < segs.length; i++) { var s = segs[i]; L += Math.hypot(s.x2 - s.x1, s.y2 - s.y1) * (1 + s.w) + 1e-5; cum.push(L); }
      var pl = 0, pcum = [];
      for (i = 0; i < plates.length; i++) { pl += plates[i].s * 6 + 1e-6; pcum.push(pl); }
      var share = pl / (pl + L * 0.6 + 1e-6);
      var tipsR = 0; for (i = 0; i < tips.length; i++) tipsR = Math.max(tipsR, Math.hypot(tips[i].x, tips[i].y));
      for (var k = 0; k < n; k++) {
        var x, y, hi = false, u = Math.random();
        if (u < share) {                             /* 六角の板: 縁と、中心から角への筋 */
          var q = Math.random() * pl, lo = 0, hi2 = pcum.length - 1;
          while (lo < hi2) { var m = (lo + hi2) >> 1; if (pcum[m] < q) lo = m + 1; else hi2 = m; }
          var P = plates[lo], e = (Math.random() * 6) | 0, f = Math.random(), a1 = e * R60, a2 = a1 + R60;
          if (Math.random() < 0.7) { x = P.x + P.s * (Math.cos(a1) * (1 - f) + Math.cos(a2) * f); y = P.y + P.s * (Math.sin(a1) * (1 - f) + Math.sin(a2) * f); hi = Math.random() < 0.08; }
          else { var g = Math.sqrt(Math.random()); x = P.x + P.s * g * Math.cos(a1) * 0.96; y = P.y + P.s * g * Math.sin(a1) * 0.96; }
        } else if (rings.length && Math.random() < 0.06) {   /* 突風の跡: その時の大きさの六角の輪 */
          var rg = rings[(Math.random() * rings.length) | 0], e2 = (Math.random() * 6) | 0, f2 = Math.random();
          var rr = rg.r * Math.min(1, rg.t * 3), b1 = e2 * R60 - R60 / 2, b2 = b1 + R60;
          x = rr * (Math.cos(b1) * (1 - f2) + Math.cos(b2) * f2); y = rr * (Math.sin(b1) * (1 - f2) + Math.sin(b2) * f2);
          if (y < 0 || y > x * S30) { x = Math.hypot(x, y); y = 0; }
        } else {                                      /* 枝 */
          if (!segs.length) continue;
          var q2 = Math.random() * L, lo2 = 0, hi3 = cum.length - 1;
          while (lo2 < hi3) { var m2 = (lo2 + hi3) >> 1; if (cum[m2] < q2) lo2 = m2 + 1; else hi3 = m2; }
          var s2 = segs[lo2], t2 = Math.random(), dx = s2.x2 - s2.x1, dy = s2.y2 - s2.y1, len = Math.hypot(dx, dy) + 1e-6;
          var off = (Math.random() - 0.5) * s2.w * 0.012 * (1.4 - t2 * 0.6);
          x = s2.x1 + dx * t2 - dy / len * off; y = s2.y1 + dy * t2 + dx / len * off;
          hi = t2 > 0.97 && Math.random() < 0.5;
        }
        /* 12倍: 6本の腕 × 鏡 */
        var kk = (Math.random() * 6) | 0, yy = Math.random() < 0.5 ? y : -y;
        var ca = Math.cos(rot), sa = Math.sin(rot);
        var X = x * COS[kk] - yy * SIN[kk], Y = x * SIN[kk] + yy * COS[kk];
        var X2 = X * ca - Y * sa, Y2 = X * sa + Y * ca;
        var r = Math.hypot(x, y);
        var c = 0.3 + 0.62 * (0.5 + 0.5 * Math.sin(r * 15 + seed + 1.3)) * (0.35 + 0.65 * Math.min(1, r * 4));
        api.dot(cx + X2 * R, cy + Y2 * R, c, hi);
      }
      if (gust > 0.01) api.glow(cx, cy, R * (0.4 + tipsR), 0.45, 0.05 * gust);
    },
    overlay: function (api, ctx) {
      api.flare(api.W / 2, api.H * 0.46, R * 0.18, 0.5, 0.06 + (calm ? 0.06 : 0));
    }
  };
  NF.run(work);
})();
</script>
