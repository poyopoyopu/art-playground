<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS HOLD AMBER</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090501}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* TOUCH LAW: HOLD fixes attention in place and lets it excavate depth; release leaves a fading hollow. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=6.283185;let W,H,D,held=null,dreams=[],mem=[],seed=13,last=performance.now(),hue=.10,sens=1;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();function rnd(){let z=Math.sin(seed++*83.2)*43758.5;return z-Math.floor(z)}
function reset(){seed=13;dreams=[];mem=[];for(let i=0;i<5;i++)dreams.push({x:W*(.08+.84*rnd()),y:H*(.08+.84*rnd()),q:.75+rnd(),b:performance.now()+i*700,d:3600+rnd()*3000,r:Math.min(W,H)*(.15+rnd()*.18)})}reset();
function src(t){let a=[];for(let i=dreams.length-1;i>=0;i--){let d=dreams[i],u=(t-d.b)/d.d;if(u>=1){dreams.splice(i,1);continue}if(u<0)continue;let e=Math.sin(Math.PI*u);a.push({x:d.x+Math.sin(t*.0002+i)*9,y:d.y+Math.cos(t*.00017+i)*7,s:d.q*e,rad:d.r})}if(held){let u=(t-held.t)/1000;a.push({x:held.x,y:held.y,s:1+u*1.8,rad:Math.min(W,H)*(.20+Math.min(.25,u*.04))})}for(let m of mem)a.push(m);return a}
function att(px,py,a){let v=0;for(let s of a)v+=s.s*Math.exp(-Math.hypot(px-s.x,py-s.y)/s.rad);return v}function cell(px,py,w,d,a){let A=att(px+w/2,py+w/2,a),th=(.30+d*.19)/sens;if(d<7&&w>10&&A>th){let q=w/2;cell(px,py,q,d+1,a);cell(px+q,py,q,d+1,a);cell(px,py+q,q,d+1,a);cell(px+q,py+q,q,d+1,a)}else{let hh=(hue+d*.028+(px/W)*.06)%1;g.strokeStyle=`hsla(${28+hh*45},88%,68%,${.07+A*.25})`;g.lineWidth=.7;g.strokeRect(px+.5,py+.5,w-1,w-1);if(A>.5){g.fillStyle=`hsla(${35+hh*30},90%,58%,${Math.min(.12,A*.06)})`;g.fillRect(px+1,py+1,w-2,w-2)}}}
function draw(t,dt){for(let i=mem.length-1;i>=0;i--){mem[i].s*=Math.pow(.05,dt);if(mem[i].s<.025)mem.splice(i,1)}g.fillStyle='#090501';g.fillRect(0,0,W,H);cell(0,0,W,0,src(t))}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;held={x:e.clientX,y:e.clientY,t:performance.now()}});c.addEventListener('pointermove',e=>{if(held){held.x=e.clientX;held.y=e.clientY}});function release(){if(held){let u=(performance.now()-held.t)/1000;mem.push({x:held.x,y:held.y,s:Math.min(2.2,.7+u),rad:Math.min(W,H)*.22});if(mem.length>16)mem.shift();held=null}}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);
APKit.init({canvas:c,gifName:'focus-hold-amber-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{let z={x:W*(.5+.35*Math.cos(p)),y:H*(.5+.28*Math.sin(p*2)),s:1.4+.6*Math.sin(p)**2,rad:Math.min(W,H)*.25};g.fillStyle='#090501';g.fillRect(0,0,W,H);cell(0,0,W,0,[z])},buttons:[{label:'✦',name:'mutate',onClick:()=>{hue=.04+Math.random()*.16;sens=.8+Math.random()*.4}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
