<!doctype html>
<!-- AFTERIMAGE — ChatGPT作。四角いドットの残像が流れ、触れた場所だけ世界の法則が変わる。 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020308"><title>AFTERIMAGE — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
let W=1,H=1,dpr=1,seed=Math.random()*1000,marks=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));if(gl)gl.viewport(0,0,canvas.width,canvas.height)}addEventListener('resize',resize);resize();

let render;
if(gl){
const VS=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform vec2 R;uniform float T,S;uniform vec4 M[18];
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 rr(vec2 p,float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c)*p;}
float sq(vec2 p,float w){vec2 q=abs(fract(p)-.5);return 1.-smoothstep(w,w+.035,max(q.x,q.y));}
void main(){
 vec2 q=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
 float law=0.,memory=0.;vec2 force=vec2(0.);
 for(int i=0;i<18;i++){
  vec4 m=M[i];if(m.w<=0.)continue;vec2 d=q-m.xy;float r=length(d);float a=m.w*exp(-r*r/(m.z*m.z+.0001));
  law+=a/(1.+r*10.);memory+=a;force+=d*a/(.03+r*r*12.);
 }
 vec2 p=q+force*.012;
 // The same bend is repeated six times: large stream -> smaller self-similar echoes.
 float echo=0.;
 for(int i=0;i<6;i++){
  float k=float(i);p=rr(p,.10*sin(T*(.55+mod(k,3.)*.16))+law*.055/(k+1.));
  p+=.018*vec2(sin(p.y*5.0+T*.55+k),cos(p.x*4.2-T*.43-k))/(k+1.);
  p*=1.47+0.035*sin(S+k);
  echo+=sin(p.x*6.0+p.y*3.0+k*.9)*(.6/(k+1.));
 }
 float flow=.028*sin(q.y*9.-T*.7)+.018*cos(q.x*13.+T*.43);
 p=q+vec2(flow,flow*.55)+rr(q,law*.045);
 float scale=17.0+3.0*sin(S*.017);
 float dots=0.,ghost=0.;
 for(int i=0;i<4;i++){
  float k=float(i);vec2 a=p*scale*(1.+k*.66)+echo*.055*(k+1.);
  float size=.105+.018*sin(echo*2.0+k)+law*.025;
  float d=sq(a,size);dots=max(dots,d*(1.0/(1.+k*.55)));
 }
 // Touch memories become smaller square afterimages around their original position.
 for(int i=0;i<18;i++){
  vec4 m=M[i];if(m.w<=0.)continue;vec2 d=q-m.xy;
  for(int j=0;j<3;j++){
   float k=float(j);vec2 a=d*(23.-k*5.)+vec2(sin(float(i)*2.17+k),cos(float(i)*1.71-k))*.025;
   ghost+=sq(a,.13+k*.018)*m.w*(.42/(k+1.));
  }
 }
 float v=max(dots,ghost*.9);
 float h=fract(S*.001+echo*.035+law*.08+memory*.015);
 vec3 col=.5+.5*cos(6.283185*(h+vec3(.00,.16,.34)));
 col*=pow(max(v,0.),.78)*(.9+memory*.08);
 col+=vec3(.16,.48,.95)*ghost*.55;
 col+=vec3(.25,.82,.42)*dots*.16;
 col*=.58+.42*(1.-smoothstep(.58,1.05,length(q)));
 o=vec4(col,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const UR=gl.getUniformLocation(pr,'R'),UT=gl.getUniformLocation(pr,'T'),US=gl.getUniformLocation(pr,'S'),UM=gl.getUniformLocation(pr,'M[0]');
render=ph=>{const a=new Float32Array(72);for(let i=0;i<marks.length;i++){const m=marks[i];a[i*4]=m.x;a[i*4+1]=m.y;a[i*4+2]=m.r;a[i*4+3]=m.w}gl.useProgram(pr);gl.uniform2f(UR,canvas.width,canvas.height);gl.uniform1f(UT,ph*6.283185);gl.uniform1f(US,seed);gl.uniform4fv(UM,a);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)};
}else{
// Safe 2D fallback for browsers where WebGL2 is unavailable.
const ctx=canvas.getContext('2d');render=ph=>{ctx.fillStyle='#020308';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2,canvas.height/2);let sc=Math.min(canvas.width,canvas.height),t=ph*6.283185;for(let i=0;i<180;i++){let a=i*.37+t*.12,r=(i%12)*sc*.025,sz=2+(i%5);for(let j=0;j<marks.length;j++){let m=marks[j],d=Math.hypot(a%1-(m.x+.5),r/sc-(m.y+.5));r+=Math.exp(-d*80)*sc*.025}ctx.fillStyle=`hsl(${(i*19+seed)%360} 90% 65%)`;ctx.fillRect(Math.cos(a)*r,Math.sin(a)*r,sz,sz)}ctx.restore()}
}
function addMark(x,y,w=1){marks.push({x:x/W-.5,y:.5-y/H,r:.045+Math.random()*.05,w});if(marks.length>18)marks.shift()}
let drawing=false,last=0;
function point(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return true;addMark(e.clientX,e.clientY);return false}
canvas.addEventListener('pointerdown',e=>{if(point(e))return;drawing=true;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing||performance.now()-last<38)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=performance.now();point(e)});
canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);
let start=performance.now(),period=8;function frame(now){if(!APKit.isExporting())render(((now-start)/1000%period)/period);requestAnimationFrame(frame)}
APKit.init({canvas:canvas,gifName:'afterimage-grid-loop',clockFormat:'spec',loopFrame:ph=>render(ph),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*1000;marks=[]}},{label:'↻',name:'reset',onClick:()=>{marks=[]}}]});requestAnimationFrame(frame);
</script></body></html>
