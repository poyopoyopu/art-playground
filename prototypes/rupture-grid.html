<!doctype html>
<!-- RUPTURE GRID — ChatGPT作。格子の自己相似変形。タッチ痕の線は使わず、接触点だけで場を変える。ap-kit.js統合 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RUPTURE GRID — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*99999,marks=[];const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function law(x,y,t){let X=x,Y=y,vx=0,vy=0;
  for(let k=0;k<5;k++){const s=1.17+k*.46,sh=.34*Math.sin(t*.22+k*.73);const qx=X*s+sh,qy=Y*s-.21*Math.cos(t*.17+k*.61);const h=Math.sin(qx*2.35+Math.sin(qy*1.55))+Math.cos(qy*3.0-qx*1.3);const w=1/(k+1);vx+=(Math.cos(h+qy*.72)+.5*Math.sin(qy*1.55+t*.10))*w*.62;vy+=(Math.sin(h-qx*.58)+.38*Math.cos(qx*1.35-t*.08))*w*.62;X=(qx*.87-qy*.13)*.59;Y=(qx*.21+qy*.87)*.59}
  for(const m of marks){const dx=x-m.x,dy=y-m.y,d2=dx*dx+dy*dy+1e-5,q=Math.exp(-d2/(m.r*m.r));vx+=dx*q*m.power;vy+=dy*q*m.power;vx+=-dy*q*m.spin;vy+=dx*q*m.spin}
  return[vx,vy]}
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=u;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=u;break;case 3:r=p;g=q;b=v;break;case 4:r=u;g=p;b=v;break;default:r=v;g=p;b=q}return[r*255,g*255,b*255]}
function scene(ph,live){const t=ph*TAU;g.fillStyle=live?'rgba(0,0,0,.20)':'#000';g.fillRect(0,0,W,H);const gap=Math.max(9,Math.min(15,W/62)),cols=Math.ceil(W/gap)+2,rows=Math.ceil(H/gap)+2;
  for(let iy=-1;iy<rows;iy++)for(let ix=-1;ix<cols;ix++){
    let x=(ix+.5)*gap,y=(iy+.5)*gap,nx=x/W*2-1,ny=y/H*2-1,q=law(nx,ny,t);let x2=x+q[0]*gap*1.8,y2=y+q[1]*gap*1.8;
    let q2=law(nx*2.15+0.11*Math.sin(ny*2.7+t*.31),ny*2.15,t*.72);x2+=q2[0]*gap*.72;y2+=q2[1]*gap*.72;
    let q3=law(nx*4.4+0.07*Math.sin(ny*4.1-t*.23),ny*4.4,t*1.13);x2+=q3[0]*gap*.28;y2+=q3[1]*gap*.28;
    const e=Math.min(1,Math.hypot(q[0],q[1])*.72+Math.hypot(q2[0],q2[1])*.28),sx=.5+.5*Math.sin(x2*.055-y2*.037+t*.55+seed*.01),hue=seed*.018+ix*.83+iy*.41+e*170+t*18,col=hsv(hue,1,.28+.72*Math.pow(sx,.65)),size=gap*(.25+.7*e);
    if(size<gap*.31&&((ix+iy)&3)!==0)continue;g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${.18+.72*sx})`;g.fillRect(x2-size/2,y2-size/2,size,size);
  }
}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function addMark(x,y,drag){if(window.APKit&&APKit.isUI(x,y))return true;const m={x:x/W*2-1,y:1-y/H*2,r:.19+Math.random()*.11,power:drag?.55:.88,spin:(Math.random()<.5?-1:1)*(.48+Math.random()*.56)};marks.push(m);if(marks.length>12)marks.shift();return false}
let down=false,last=0;function handleDown(e){const p=point(e);if(addMark(p.x,p.y,false))return;down=true;c.setPointerCapture?.(e.pointerId)}function handleMove(e){if(!down||performance.now()-last<115)return;const p=point(e);if(window.APKit&&APKit.isUI(p.x,p.y))return;last=performance.now();addMark(p.x,p.y,true)}
c.addEventListener('pointerdown',handleDown);c.addEventListener('pointermove',handleMove);c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
let start=performance.now();function loop(now){if(!APKit.isExporting())scene((((now-start)/1000)%11)/11,true);requestAnimationFrame(loop)}
APKit.init({canvas:c,gifName:'rupture-grid-loop',clockFormat:'spec',loopFrame:p=>scene(p,false),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;marks=[];g.fillStyle='#000';g.fillRect(0,0,W,H)}},{label:'↻',name:'reset',onClick:()=>{marks=[];g.fillStyle='#000';g.fillRect(0,0,W,H)}}]});requestAnimationFrame(loop);
</script></body></html>
