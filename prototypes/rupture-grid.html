<!doctype html>
<!-- RUPTURE GRID — ChatGPT作。平面のスクエア格子。動くのは触れた場所だけ。ap-kit.js統合 -->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RUPTURE GRID — ART PLAYGROUND</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,seed=Math.random()*99999,marks=[],down=false,lastX=0,lastY=0,lastT=0;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function hsv(h,s,v){h=((h%360)+360)%360/60;const i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v;g=u;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=u;break;case 3:r=p;g=q;b=v;break;case 4:r=u;g=p;b=v;break;default:r=v;g=p;b=q}return[r*255,g*255,b*255]}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)}}
function displacement(x,y,now){let dx=0,dy=0,color=0;for(const m of marks){const ox=x-m.x,oy=y-m.y,d2=ox*ox+oy*oy,s=m.r*m.r;const a=Math.exp(-d2/s);const age=Math.max(0,(now-m.t)/1000);const decay=Math.exp(-age*1.25);if(decay<.004)continue;
  // Tap: a clean pressure pulse. Drag: pull the nearby grid in the direction of the finger.
  const pulse=Math.sin(Math.min(age*5.2,Math.PI))*decay;
  dx+=ox*a*(m.push*pulse);dy+=oy*a*(m.push*pulse);
  dx+=m.vx*a*decay*m.drag;dy+=m.vy*a*decay*m.drag;
  color+=a*decay*m.chroma;
 }return[dx,dy,color]}
function scene(now){g.fillStyle='#000';g.fillRect(0,0,W,H);const gap=Math.max(9,Math.min(14,W/62)),cols=Math.ceil(W/gap)+2,rows=Math.ceil(H/gap)+2;
 for(let iy=-1;iy<rows;iy++)for(let ix=-1;ix<cols;ix++){const x=(ix+.5)*gap,y=(iy+.5)*gap,nx=x/W*2-1,ny=y/H*2-1;const z=displacement(nx,ny,now);const x2=x+z[0]*gap*2.8,y2=y+z[1]*gap*2.8;
  const hue=seed*.018+ix*.78+iy*.46+z[2]*85;const col=hsv(hue,1,.92);const size=gap*.72;g.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;g.fillRect(x2-size/2,y2-size/2,size,size)}
}
function addTouch(x,y,vx,vy,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.16:.13,push:tap?1.8:0.65,vx:vx/W*2,vy:-vy/H*2,drag:tap?0:.95,chroma:tap?1.2:.55,t});if(marks.length>18)marks.shift();return false}
function handleDown(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e);lastX=p.x;lastY=p.y;lastT=performance.now();down=true;c.setPointerCapture?.(e.pointerId);addTouch(p.x,p.y,0,0,true)}
function handleMove(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;const p=point(e),now=performance.now(),dt=Math.max(16,now-lastT);if(now-lastT<55)return;addTouch(p.x,p.y,(p.x-lastX)/dt*900,(p.y-lastY)/dt*900,false);lastX=p.x;lastY=p.y;lastT=now}
function handleUp(){down=false}
c.addEventListener('pointerdown',handleDown);c.addEventListener('pointermove',handleMove);c.addEventListener('pointerup',handleUp);c.addEventListener('pointercancel',handleUp);
let start=performance.now();function loop(now){if(!APKit.isExporting())scene(now);requestAnimationFrame(loop)}
APKit.init({canvas:c,gifName:'rupture-grid-loop',clockFormat:'spec',loopFrame:p=>scene(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;marks=[];scene(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];scene(performance.now())}}]});requestAnimationFrame(loop);
</script></body></html>
