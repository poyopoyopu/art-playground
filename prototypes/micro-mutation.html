<!doctype html>
<!-- MICRO MUTATION — ChatGPT作。極小の形が自己相似的に別形態へ突然変異する試作。ap-kit.js統合 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MICRO MUTATION</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W,H,D,seed=Math.random()*99999,marks=[],down=false,last;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=((h%360)+360)%360/60;let i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s),r,b,d;switch(i%6){case 0:r=v;b=u;d=p;break;case 1:r=q;b=v;d=p;break;case 2:r=p;b=v;d=u;break;case 3:r=p;b=q;d=v;break;case 4:r=u;b=p;d=v;break;default:r=v;b=p;d=q}return`rgb(${r*255|0},${b*255|0},${d*255|0})`}
function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function F(x,y,t){let X=x/W*2-1,Y=1-y/H*2,a=0,b=0;const now=performance.now();for(let m of marks){let dx=X-m.x,dy=Y-m.y,d2=dx*dx+dy*dy,q=Math.exp(-d2/(m.r*m.r))*Math.exp(-(now-m.t)/1000*.19);a+=q*m.a;b+=q*m.b;let k=m.k*q,cs=Math.cos(k),sn=Math.sin(k);X+=(dx*cs-dy*sn-dx)*.72*q;Y+=(dx*sn+dy*cs-dy)*.72*q}for(let n=0;n<4;n++){let ox=X;X=Math.abs(X+.31)-.31;Y=Math.abs(Y-.27)-.27;let cs=Math.cos(.42+n*.17+a*.12),sn=Math.sin(.42+n*.17+a*.12);let tx=X*cs-Y*sn,ty=X*sn+Y*cs;X=tx*.86;Y=ty*.86}return[X,Y,a,b]}
function shape(x,y,s,r,type){let cs=Math.cos(r),sn=Math.sin(r),h=s*.5;g.beginPath();if(type===0){let x0=-h,y0=-h,x1=h,y1=h;g.moveTo(x+x0*cs-y0*sn,y+x0*sn+y0*cs);g.lineTo(x+x1*cs-y0*sn,y+x1*sn+y0*cs);g.lineTo(x+x1*cs-y1*sn,y+x1*sn+y1*cs);g.lineTo(x+x0*cs-y1*sn,y+x0*sn+y1*cs)}else if(type===1){let a=-s*.62,b=s*.55;g.moveTo(x,y-s*.62);g.lineTo(x+b*cs-b*.45*sn,y+b*sn+b*.45*cs);g.lineTo(x-b*cs-b*.45*sn,y-b*sn+b*.45*cs)}else{let rr=s*.68;for(let k=0;k<5;k++){let a=-Math.PI*.5+k*TAU/5,px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(k===0)g.moveTo(x+px*cs-py*sn,y+px*sn+py*cs);else g.lineTo(x+px*cs-py*sn,y+px*sn+py*cs)}}g.closePath();g.fill()}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let s=Math.max(4.8,Math.min(6.8,Math.min(W,H)/108)),nx=Math.ceil(W/s)+2,ny=Math.ceil(H/s)+2;const now=performance.now();for(let j=-1;j<ny;j++)for(let i=-1;i<nx;i++){let x=(i+.5)*s,y=(j+.5)*s,z=F(x,y,now),phase=i*.137+j*.219+seed*.004;let branch=Math.sin(phase*2.1+z[2]*2)+Math.sin(phase*.71-z[3]);let type=((branch+3)|0)%3;let size=s*(.72+.22*Math.abs(Math.sin(phase*3.1+z[2]*4)));let hue=seed*.02+i*.47-j*.71+z[2]*190+z[3]*80;g.fillStyle=hsv(hue,1,.96);shape(x+z[0]*s*2.8,y-z[1]*s*2.8,size,z[2]*.5+phase*.15,type)}}
function touch(x,y,tap){if(window.APKit&&APKit.isUI(x,y))return true;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.20:.11,a:tap?1.7:1.0,b:tap?1.4:.8,k:(Math.random()-.5)*6.5,t:performance.now()});if(marks.length>16)marks.shift();draw(performance.now());return false}
function dn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=P(e);down=true;c.setPointerCapture?.(e.pointerId);touch(last.x,last.y,true)}function mv(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let q=P(e);if(Math.hypot(q.x-last.x,q.y-last.y)>7){touch(q.x,q.y,false);last=q}}function up(){down=false}c.addEventListener('pointerdown',dn,{passive:false});c.addEventListener('pointermove',mv,{passive:false});c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);let start=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-mutation-loop',clockFormat:'spec',loopFrame:p=>draw(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
