<!doctype html>
<!-- MICRO MUTATION — ChatGPT作。触れると細胞が逃げ、吸い寄せられ、最後に遺伝子を残す試作。ap-kit.js統合 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MICRO MUTATION</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W,H,D,seed=Math.random()*99999,marks=[],down=false,last,dirty=true,lastDraw=0;const TAU=Math.PI*2,PALETTE=[];
function hsv(h){h=((h%360)+360)%360/60;let i=h|0,f=h-i,p=.04,q=1-f*.96,u=1-(1-f)*.96,r,b,d;switch(i%6){case 0:r=1;b=u;d=p;break;case 1:r=q;b=1;d=p;break;case 2:r=p;b=1;d=u;break;case 3:r=p;b=q;d=1;break;case 4:r=u;b=p;d=1;break;default:r=1;b=p;d=q}return`rgb(${r*255|0},${b*255|0},${d*255|0})`}
function rebuildPalette(){PALETTE.length=0;for(let i=0;i<512;i++)PALETTE.push(hsv(seed*.02+i*.703))}
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);dirty=true}addEventListener('resize',resize);
function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function F(x,y,t){let X=x/W*2-1,Y=1-y/H*2,mut=0,turn=0,warp=0;for(let m of marks){let dx=X-m.x,dy=Y-m.y,d=Math.sqrt(dx*dx+dy*dy),age=Math.max(0,(t-m.t)/1000);if(age>5.5)continue;let life=Math.max(0,1-age/5.5),front=Math.max(0,1-Math.abs(d-(m.r+age*m.speed))/m.width),core=Math.exp(-d*d/(m.r*m.r))*Math.exp(-age*.12)*m.power,q=Math.max(front,core*.72);if(q>.012){let cs=m.cs,sn=m.sn;X+=(dx*cs-dy*sn-dx)*.48*q;Y+=(dx*sn+dy*cs-dy)*.48*q;let pull=Math.sin(Math.min(1,age/1.15)*Math.PI)*q*m.force;X+=(dx/Math.max(d,.001))*pull;Y+=(dy/Math.max(d,.001))*pull;mut=Math.max(mut,q);turn+=m.spin*q;warp+=q*m.bias}}for(let n=0;n<4;n++){X=Math.abs(X+.31)-.31;Y=Math.abs(Y-.27)-.27;let r=.42+n*.17+turn*.22+warp*.04,cs=Math.cos(r),sn=Math.sin(r),tx=X*cs-Y*sn;Y=X*sn+Y*cs;X=tx;X*=.86;Y*=.86}return[X,Y,mut,turn,warp]}
function shape(x,y,s,r,type,cut){let cs=Math.cos(r),sn=Math.sin(r),h=s*.5;g.beginPath();if(type===0){let pts=[[-h,-h],[h,-h],[h,h],[-h,h]];for(let k=0;k<4;k++){let px=pts[k][0],py=pts[k][1],qx=x+px*cs-py*sn,qy=y+px*sn+py*cs;k?g.lineTo(qx,qy):g.moveTo(qx,qy)}}else if(type===1){let pts=[[0,-s*.62],[s*.55,s*.45],[-s*.55,s*.45]];for(let k=0;k<3;k++){let px=pts[k][0],py=pts[k][1],qx=x+px*cs-py*sn,qy=y+px*sn+py*cs;k?g.lineTo(qx,qy):g.moveTo(qx,qy)}}else{let rr=s*.68;for(let k=0;k<5;k++){let a=-Math.PI*.5+k*TAU/5,px=Math.cos(a)*rr,py=Math.sin(a)*rr,qx=x+px*cs-py*sn,qy=y+px*sn+py*cs;k?g.lineTo(qx,qy):g.moveTo(qx,qy)}}g.closePath();g.fill();if(cut>.46){g.globalCompositeOperation='destination-out';g.beginPath();g.arc(x+Math.cos(r)*s*.18,y+Math.sin(r)*s*.18,s*.18,0,TAU);g.fill();g.globalCompositeOperation='source-over'}}
function draw(t){if(t-lastDraw<32&&!dirty)return;lastDraw=t;dirty=false;g.fillStyle='#000';g.fillRect(0,0,W,H);let s=Math.max(3.8,Math.min(5.8,Math.min(W,H)/126)),nx=Math.ceil(W/s)+2,ny=Math.ceil(H/s)+2;for(let j=-1;j<ny;j++)for(let i=-1;i<nx;i++){let x=(i+.5)*s,y=(j+.5)*s,z=F(x,y,t),phase=i*.137+j*.219+seed*.004;let branch=Math.sin(phase*2.1+z[2]*3.5)+Math.sin(phase*.71-z[4]*2.4);let base=((branch+3)|0)%3;let type=z[2]>.25?((base+1+(z[3]>.18?1:0))%3):base;let size=s*(.72+.22*Math.abs(Math.sin(phase*3.1+z[2]*4)));size*=1+z[2]*.28;let hue=((seed*.02+i*.47-j*.71+z[2]*190+z[4]*80)*1.42)&511;g.fillStyle=PALETTE[hue|0];shape(x+z[0]*s*(2.8+z[2]*2.2),y-z[1]*s*(2.8+z[2]*2.2),size,z[3]*.7+phase*.15+z[2]*1.7,type,z[2])}}
function touch(x,y,tap){if(window.APKit&&APKit.isUI(x,y))return true;let k=(Math.random()-.5)*6.5;marks.push({x:x/W*2-1,y:1-y/H*2,r:tap?.075:.045,width:tap?.09:.055,speed:tap?.34:.52,power:tap?2.5:1.35,force:tap?-1.15:-.72,spin:k,bias:(Math.random()-.5)*3.8,cs:Math.cos(k),sn:Math.sin(k),t:performance.now()});if(tap){let ang=Math.random()*TAU;for(let q=0;q<3;q++){let rr=.035+q*.028;marks.push({x:x/W*2-1+Math.cos(ang+q*TAU/3)*rr,y:1-y/H*2+Math.sin(ang+q*TAU/3)*rr,r:.025,width:.045,speed:.30+q*.08,power:1.15,force:-.42,spin:k+(q-1)*1.8,bias:(Math.random()-.5)*2,t:performance.now()})}}if(marks.length>20)marks.splice(0,marks.length-20);dirty=true;draw(performance.now());return false}
function dn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=P(e);down=true;c.setPointerCapture?.(e.pointerId);touch(last.x,last.y,true)}function mv(e){if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let q=P(e);if(Math.hypot(q.x-last.x,q.y-last.y)>6){touch(q.x,q.y,false);last=q}}function up(){down=false}c.addEventListener('pointerdown',dn,{passive:false});c.addEventListener('pointermove',mv,{passive:false});c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
let start=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-mutation-loop',clockFormat:'spec',loopFrame:p=>draw(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;rebuildPalette();marks=[];dirty=true;draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];dirty=true;draw(performance.now())}}]});rebuildPalette();resize();requestAnimationFrame(loop);
</script></body></html>
