<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>GRAVITY CATHEDRAL</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040509}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let d,W,H,wells=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function render(p=0){g.fillStyle='#040509';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<26;k++){g.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,r=S*(.04+k*.026),x=Math.cos(a)*r,y=Math.sin(a)*r;for(let m of wells){let dx=x+cx-m.x,dy=y+cy-m.y,dd=Math.hypot(dx,dy)+1,z=Math.max(0,1-dd/260);let aa=Math.atan2(dy,dx);x-=Math.cos(aa)*z*32;y-=Math.sin(aa)*z*32}let wob=Math.sin(p*.55+k*.7)*S*.009;x+=Math.cos(a+Math.PI/2)*wob;y+=Math.sin(a+Math.PI/2)*wob;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${35+k*8},85%,${48+k*1.3}%,.07)`;g.lineWidth=1+k*.07;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;wells.unshift({x,y});wells=wells.slice(0,5)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));APKit.init({canvas:c,gifName:'GRAVITY-CATHEDRAL-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>wells.forEach(w=>{w.x=Math.random()*W;w.y=Math.random()*H})},{label:'↻',name:'reset',onClick:()=>wells=[]}]});function loop(){render(performance.now()*.00010);requestAnimationFrame(loop)}loop();</script></body></html>
