<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORGANIC ABYSS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false});
if(!gl)throw new Error('WebGL2 unavailable');
const VS=`#version 300 es
in vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;out vec4 O;in vec2 v;uniform vec2 R,P;uniform float T,S;uniform vec4 A[8];uniform int N;
#define TAU 6.28318530718
float h21(float p){p=fract(p*123.34);p+=dot(p,p+45.32);return fract(p*p);}float hash21(vec2 p){return h21(p.x+31.7*p.y);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*noise(p);p=mat2(1.6,-1.2,1.2,1.6)*p;a*=.5;}return s;}vec3 pal(float x,vec3 a,vec3 b,vec3 c,vec3 d){return a+b*cos(TAU*(c*x+d));}vec2 warp(vec2 p,float k){float n=fbm(p*.72+T*.018);return p+vec2(sin(p.y*2.1+n*6.+T*.05),cos(p.x*2.4-n*5.-T*.04))*k;}float touchField(vec2 p){float q=0.;for(int i=0;i<8;i++){if(i>=N)break;vec2 d=p-A[i].xy;float z=exp(-dot(d,d)/(A[i].z*A[i].z));q+=z*(.5+.5*sin(A[i].w));}return q;}
void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.);float tf=touchField(p);p*=1.15;vec2 q=p;float n=fbm(q*2.0);q+=vec2(sin(q.y*3.+n*5.+T*.018),cos(q.x*3.-n*4.-T*.014))*.25;float holes=0.;for(int i=0;i<6;i++){float fi=float(i);vec2 z=vec2(sin(fi*4.8+S),cos(fi*6.1+S))*.48;float d=length(q-z);holes=max(holes,smoothstep(.25+.08*sin(fi),.03,d));}float reef=abs(sin((q.x*5.+q.y*7.+n*3.)*4.));float lace=smoothstep(.72,.98,reef)*smoothstep(.18,.82,n);vec3 c=pal(n+q.x*.12,vec3(.01,.025,.035),vec3(.12,.35,.38),vec3(.45,.55,.3),vec3(.12,.3,.65));c+=lace*vec3(.15,.55,.75);c=mix(c,vec3(.002,.003,.006),holes*.86);float rim=smoothstep(.55,.9,holes)-smoothstep(.9,1.,holes);c+=rim*vec3(1.,.45,.08);O=vec4(c,1.);}`;
function sh(t,s){let q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);if(!gl.getShaderParameter(q,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(q));return q}let prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let la=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);let u={R:gl.getUniformLocation(prog,'R'),P:gl.getUniformLocation(prog,'P'),T:gl.getUniformLocation(prog,'T'),S:gl.getUniformLocation(prog,'S'),A:gl.getUniformLocation(prog,'A[0]'),N:gl.getUniformLocation(prog,'N')};let W,H,D=Math.min(2,devicePixelRatio||1),seed=Math.random()*99999,pts=[],t0=performance.now(),P={x:0,y:0};function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',resize);resize();function render(t){gl.uniform2f(u.R,W,H);gl.uniform2f(u.P,P.x/W-.5,1-P.y/H-.5);gl.uniform1f(u.T,t);gl.uniform1f(u.S,seed);let a=new Float32Array(32);pts.forEach((z,i)=>{if(i<8){a[i*4]=z.x/W-.5;a[i*4+1]=1-z.y/H-.5;a[i*4+2]=z.r/Math.max(W,H);a[i*4+3]=z.phase}});gl.uniform4fv(u.A,a);gl.uniform1i(u.N,Math.min(8,pts.length));gl.drawArrays(gl.TRIANGLES,0,3)}function add(x,y){pts.push({x,y,r:70+Math.random()*120,phase:Math.random()*TAU});if(pts.length>8)pts.shift()}let down=false;c.onpointerdown=e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;P.x=e.clientX;P.y=e.clientY;add(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{P.x=e.clientX;P.y=e.clientY;if(down&&Math.random()<.45)add(e.clientX,e.clientY)};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;function loop(p){render(p)}function anim(ms){render((ms-t0)*.00008);requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'organic-abyss-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;pts=[]}},{label:'↻',name:'reset',onClick:()=>pts=[]}]});</script></body></html>
