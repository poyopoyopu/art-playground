<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>STRATA</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,layers=32;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#111';g.fillRect(0,0,W,H);for(let i=0;i<layers;i++){let y=i*H/layers+Math.sin(p*6+i)*12;g.beginPath();g.moveTo(0,y);for(let x=0;x<W;x+=10)g.lineTo(x,y+Math.sin(x*.02+i)*8);g.strokeStyle=`hsla(${20+i*4},70%,65%,.4)`;g.stroke()}}function mu(){layers=8+Math.random()*60|0}APKit.init({canvas:c,gifName:'strata-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>layers=32}]});draw(0)</script>
