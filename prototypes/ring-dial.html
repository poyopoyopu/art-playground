<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RING DIAL — 輪にかかる影が、いまの時刻</title>
<!-- RING DIAL — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/30 試作
     お題: 「おっちゃんが時計代わりに眺める作品」。数字を飾りで包むのではなく、作品の状態そのものが時刻。
     世界のルール: この惑星の空では、太陽が12時間で惑星を一周し、月は1時間で、惑星そのものは1分で回る。
       時 = 輪にかかる惑星の影。影が伸びている向きが時針(影が真上=12時、真右=3時)
       分 = 輪のすき間(エンケの空隙)を回る小さな月。月は塵をまきながら進むので、正時から月までの光の弧が「この1時間に過ぎた分」。
            正時に弧が一周して閉じ、ゆっくり消えて、また新しい弧が始まる
       秒 = 惑星の自転。北極を真上から見ているので、白い嵐が1分で1周する。輪の上を走る青白い電気の筋(スポーク)も一緒に回る。
            夜の側に回った嵐は、雷で光る
       光の色 = 地上のいまの時刻。明け方は桃色、昼は白、夕方は橙、夜は青白い月光(午前と午後の区別に)
       タップ = 隕石が輪に落ちる。破片の雲は内側ほど速く回る輪に引き伸ばされ、渦巻きの筋になってからゆっくり輪に戻る
       なぞる = 指が小さな衛星になって輪をかき分け、航跡が残る
       ✦ = 別の惑星(色と輪の細かい筋が変わる)  ↻ = 輪の乱れを静める  ？ = 読み方  🕐 = 数字の時刻(上に小さく。初期はOFF)
     本物っぽさ: 輪の粒子は1粒ずつケプラー回転(内側ほど速い)し、月の重力で空隙の縁が乱れて航跡ができる。
       輪の構造はC環・B環・カッシーニの間隙・A環・エンケの空隙・F環。北極の六角形の渦、夜側のオーロラ。
     技術: WebGPU(compute shaderで輪の粒子を毎フレーム積分、インスタンス描画、rgba16floatに加算してトーンマップ)。
       WebGPUが無い端末はWebGL2(transform feedbackで同じ積分)に自動で切り替え。Screen Wake Lock APIで画面を消さない。
       置きっぱなし前提で30fps上限・DPR上限・重い端末は粒子数を自動で減らす。
     テスト用: URLに ?t=15:20:05 を付けると、その時刻から進む(作品の時刻だけ。数字の時計は本当の時刻)
-->
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);text-align:center;color:#dfe6f2;
  font:500 13px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;letter-spacing:.12em;opacity:0;
  transition:opacity 1.6s;pointer-events:none;text-shadow:0 0 8px #000}
#hint.on{opacity:.78}
#guide{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(84vw,360px);box-sizing:border-box;padding:22px 22px 18px;
  background:rgba(8,10,18,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);
  border-radius:16px;color:#e6eaf2;font:13px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;z-index:70;display:none}
#guide.on{display:block}
#guide h2{margin:0 0 10px;font-size:13px;letter-spacing:.28em;font-weight:600;opacity:.9}
#guide dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}

</style>

<body>
<canvas id="cv"></canvas>
<div id="hint">影が時・月が分・嵐が秒 ／ ？で読み方</div>
<div id="guide">
  <h2>RING DIAL の読み方</h2>
  <dl>
    <dt>時</dt><dd>輪にかかる太い影。影の向きが時針(真上=12時、真右=3時)</dd>
    <dt>分</dt><dd>輪のすき間を回る小さな月。月がまいた光の弧が、正時から過ぎた分</dd>
    <dt>秒</dt><dd>惑星の白い嵐と、輪を走る青白い筋。1分で1周</dd>
    <dt>色</dt><dd>明け方は桃色、昼は白、夕方は橙、夜は青白い月光</dd>
  </dl>
  <p>タップで隕石が落ちて輪が乱れ、なぞると航跡が残る。しばらくすると輪は元に戻る。</p>
</div>
<div id="nogpu">この端末では表示できませんでした(WebGPU / WebGL2 が必要です)</div>
<script>
'use strict';
(function(){
const cv=document.getElementById('cv');
const TAU=Math.PI*2;
// ---------- world constants (units: 1 = ring outer area radius) ----------
const RP=0.22, MOON_R=0.795, VIEW_R=0.965, NIMP=8;
const UF=new Float32Array(80);           // 20 x vec4, shared by WebGPU and WebGL2
let W=1,H=1,DPR=1, backend='', N=0, ND=26000, drawN=0;
// test offset (?t=HH:MM[:SS])
let tOffset=0;
const OFFSCREEN=/[?&]gpuoff=1/.test(location.search);   // test: headless browsers can't present WebGPU canvases
const NMAX=+(/[?&]n=(\d+)/.exec(location.search)||[])[1]||0;   // test: particle count
(function(){const m=/[?&]t=(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(location.search);if(!m)return;
  const d=new Date(),g=new Date();g.setHours(+m[1],+m[2],+(m[3]||0),0);tOffset=g-d;})();

// ---------- palettes (planet bands A/B, ring tint) ----------
const PALS=[
  {a:[0.92,0.78,0.55],b:[0.62,0.46,0.30],r:[1.00,0.88,0.70]},  // saturn gold
  {a:[0.62,0.86,0.92],b:[0.30,0.52,0.70],r:[0.80,0.92,1.00]},  // ice giant
  {a:[0.95,0.70,0.62],b:[0.55,0.30,0.34],r:[1.00,0.80,0.74]},  // rose copper
  {a:[0.74,0.90,0.70],b:[0.36,0.40,0.62],r:[0.86,0.96,0.86]},  // jade / indigo
];
let palIx=0, ringSeed=Math.random()*1000;

// ---------- ring structure ----------
function hash1(x){const s=Math.sin(x*127.1+ringSeed*13.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash1(i)*(1-u)+hash1(i+1)*u}
function ringDensity(a){
  let d;
  if(a<0.30||a>0.872)return 0;
  if(a<0.41)d=0.20;                 // C ring (faint)
  else if(a<0.425)d=0.35;
  else if(a<0.615)d=1.0;            // B ring
  else if(a<0.655)d=0.045;          // Cassini division
  else if(a<0.765)d=0.62;           // A ring
  else if(a<0.825)d=0.0;            // Encke gap: the minute moon lives here
  else d=0.52;                      // outer A
  const fine=0.45+0.55*vnoise(a*260)*vnoise(a*61+3.1);
  return d*(0.35+0.65*fine);
}
function seedParticles(arr){
  for(let i=0;i<N;i++){
    let a,b=1;
    if(i%40===0){a=0.905+(Math.random()-0.5)*0.006;b=1.6}        // F ring (thin, bright)
    else{for(let k=0;k<60;k++){a=0.30+Math.random()*0.575;if(Math.random()<ringDensity(a))break}
      const l1=vnoise(a*180+7.0), l2=vnoise(a*720+1.3), l3=vnoise(a*2400+5.1);
      b=0.35+0.8*l1*l1+0.55*l2*l2+0.35*l3}
    const o=i*8;
    arr[o]=a;arr[o+1]=Math.random()*TAU;arr[o+2]=0;arr[o+3]=0;
    arr[o+4]=0;arr[o+5]=0;arr[o+6]=Math.random();arr[o+7]=b;
  }
  return arr;
}

// ---------- time -> world state ----------
const SUNKEYS=[[0,.52,.62,1.0],[4.5,.56,.60,.98],[5.8,1.0,.62,.62],[7,1.0,.82,.66],[9,1.0,.94,.84],[12,1.0,1.0,.97],
  [15,1.0,.93,.78],[17,1.0,.72,.42],[18.3,1.0,.50,.30],[19.3,.74,.52,.86],[20.5,.54,.62,1.0],[24,.52,.62,1.0]];
function sunColor(h){
  for(let i=0;i<SUNKEYS.length-1;i++){const A=SUNKEYS[i],B=SUNKEYS[i+1];
    if(h>=A[0]&&h<=B[0]){const f=(h-A[0])/(B[0]-A[0]);return [A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f,A[3]+(B[3]-A[3])*f]}}
  return [1,1,1];
}
function clockState(){
  const d=new Date(Date.now()+tOffset);
  const s=d.getSeconds()+d.getMilliseconds()/1000, m=d.getMinutes()+s/60, h=d.getHours()+m/60;
  return {sec:TAU*s/60, min:TAU*m/60, hour:TAU*(h%12)/12, h24:h};
}

// ---------- interaction ----------
const imps=[]; let resetT=0, lastPt=null, hintShown=false;
function toUnit(cx,cy){const sc=Math.min(W,H)/2/VIEW_R;return [(cx-W/2)/sc,-(cy-H/2)/sc]}
function addImp(cx,cy,str,rad){if(imps.length>=NIMP)imps.shift();const p=toUnit(cx,cy);imps.push([p[0],p[1],str,rad])}
cv.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  requestWake();
  addImp(e.clientX,e.clientY,0.085,0.06);lastPt=[e.clientX,e.clientY];
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!lastPt)return;
  const dx=e.clientX-lastPt[0],dy=e.clientY-lastPt[1];
  if(dx*dx+dy*dy<64)return;
  addImp(e.clientX,e.clientY,0.022,0.035);lastPt=[e.clientX,e.clientY];
});
const up=()=>{lastPt=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---------- wake lock ----------
let wake=null;
function requestWake(){
  if(!('wakeLock' in navigator)||wake||document.visibilityState!=='visible')return;
  navigator.wakeLock.request('screen').then(l=>{wake=l;l.addEventListener('release',()=>{wake=null})}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake()});
requestWake();

// ---------- uniforms ----------
let simT=0;
function fillUniforms(dt,dust){
  const cs=clockState(), sc=Math.min(W,H)/2/VIEW_R;
  const sun=sunColor(cs.h24), P=PALS[palIx];
  const night=(cs.h24<5||cs.h24>20)?0.82:1.0;
  UF.fill(0);
  UF.set([W,H,W/2,H/2],0);
  UF.set([sc,simT,dt,imps.length],4);
  UF.set([cs.sec,cs.min,cs.hour,2.2e-5],8);
  UF.set([sun[0]*night,sun[1]*night,sun[2]*night,DPR],12);
  UF.set([P.a[0],P.a[1],P.a[2],ringSeed%97],16);
  UF.set([P.b[0],P.b[1],P.b[2],0],20);
  UF.set([P.r[0],P.r[1],P.r[2],0],24);
  UF.set([MOON_R*Math.sin(cs.min),MOON_R*Math.cos(cs.min),cs.h24/24,resetT>0?1:0],28);
  const szPx=1.7*DPR;
  UF.set([N,backend==='webgpu'?1:intensityScale,0.62*sc*sc/(Math.max(drawN,1)*szPx*szPx),dust],32);
  for(let i=0;i<imps.length;i++)UF.set(imps[i],36+i*4);
}
let intensityScale=1;

// ================= shader sources =================
// --- WGSL ---
const WGSL_COMMON=`
struct U { v: array<vec4f,20> };
@group(0) @binding(0) var<uniform> u: U;
const TAU:f32=6.2831853;
const RP:f32=0.22;
fn omega(a:f32)->f32{ return 0.0419*pow(a/0.86,-1.5); }
fn ss(a:f32,b:f32,x:f32)->f32{ let t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
fn wrapPi(x:f32)->f32{ return x-TAU*floor((x+3.14159265)/TAU); }
fn hu(i:u32,k:u32)->f32{ var h=i*747796405u+k*2891336453u+12345u; h=((h>>((h>>28u)+4u))^h)*277803737u; h=(h>>22u)^h; return f32(h)/4294967295.0; }
fn h11(n:f32)->f32{ return fract(sin(n*127.1)*43758.5453); }
fn h21(p:vec2f)->f32{ return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453); }
fn vn2(p:vec2f)->f32{ let i=floor(p); let f=fract(p); let w=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2f(1.,0.)),w.x),mix(h21(i+vec2f(0.,1.)),h21(i+vec2f(1.,1.)),w.x),w.y); }
fn fbm(p0:vec2f)->f32{ var p=p0; var s=0.0; var a=0.5; for(var i=0;i<4;i++){ s+=a*vn2(p); p=p*2.03+vec2f(1.7,9.2); a*=0.5; } return s; }
fn sunDir()->vec2f{ let h=u.v[2].z; return -vec2f(sin(h),cos(h)); }
fn shadowF(p:vec2f)->f32{
  let s=sunDir(); let al=dot(p,s); let pe=abs(p.x*s.y-p.y*s.x);
  let sh=1.0-ss(RP-0.012,RP+0.006,pe);
  return 1.0-0.955*sh*ss(0.0,-0.02,al);
}
`;
const WGSL_SIM=WGSL_COMMON+`
@group(0) @binding(1) var<storage,read_write> P: array<vec4f>;
@compute @workgroup_size(256) fn cs(@builtin(global_invocation_id) id:vec3u){
  let i=id.x; let N=u32(u.v[8].x); if(i>=N){return;}
  var A=P[2u*i]; var B=P[2u*i+1u];
  let dt=u.v[1].z; let a=A.x; var th=A.y; var x=A.z; var vx=A.w; var w=B.x; var heat=B.y;
  let Om=omega(a); let r=a+x;
  let er=vec2f(sin(th),cos(th)); let et=vec2f(cos(th),-sin(th)); let p=r*er;
  let d=u.v[7].xy-p; let dd=dot(d,d)+0.0005; let F=u.v[2].w*d/(dd*sqrt(dd));
  var Fr=dot(F,er); var Ft=dot(F,et);
  let ni=i32(u.v[1].w);
  for(var k=0;k<8;k++){ if(k>=ni){break;}
    let I=u.v[9+k]; let q=p-I.xy; let g=exp(-dot(q,q)/(I.w*I.w));
    if(g>0.002){ let kick=I.z*g*q/(length(q)+0.004); vx+=dot(kick,er); w+=dot(kick,et); heat+=g*I.z*14.0; }
  }
  vx+=(-(Om*Om+0.012)*x+Fr-0.10*vx)*dt;
  w +=(Ft-0.10*w)*dt;
  x=clamp(x+vx*dt,-0.18,0.18);
  th+= (Om*(1.0-1.5*x/a)+w/r)*dt;
  th=th-TAU*floor(th/TAU);
  heat*=exp(-1.3*dt);
  if(u.v[7].w>0.5){ x*=0.94; vx*=0.94; w*=0.94; }
  P[2u*i]=vec4f(a,th,x,vx); P[2u*i+1u]=vec4f(w,heat,B.z,B.w);
}
`;
const WGSL_DRAW=WGSL_COMMON+`
@group(0) @binding(1) var<storage,read> P: array<vec4f>;
struct VO{ @builtin(position) pos:vec4f, @location(0) col:vec3f, @location(1) uv:vec2f };
@vertex fn vs(@builtin(vertex_index) vi:u32, @builtin(instance_index) ii:u32)->VO{
  var C=array<vec2f,6>(vec2f(-1.,-1.),vec2f(1.,-1.),vec2f(-1.,1.),vec2f(-1.,1.),vec2f(1.,-1.),vec2f(1.,1.));
  let N=u32(u.v[8].x); let k=u.v[8].z*u.v[8].y;
  var p:vec2f; var col:vec3f; var sz:f32;
  let sun=u.v[3].rgb;
  if(ii<N){
    let A=P[2u*ii]; let B=P[2u*ii+1u];
    let a=A.x; let r=a+A.z; let th=A.y; p=r*vec2f(sin(th),cos(th));
    let seed=B.z;
    var base=mix(u.v[6].rgb*0.78,u.v[6].rgb,ss(0.42,0.62,a));
    base=mix(base*vec3f(0.62,0.66,0.78),base,ss(0.38,0.43,a));       // C ring greyer
    base*=0.9+0.2*seed;
    let lit=shadowF(p);
    col=base*sun*(lit*1.0+0.035)*B.w*k;
    // spokes: co-rotate with the planet (seconds)
    let dA=wrapPi(th-u.v[2].x);
    let band=ss(0.43,0.47,a)*(1.0-ss(0.58,0.62,a));
    let sp=exp(-dA*dA/0.0016)*band*(0.35+0.65*fract(sin(floor(a*140.0)*91.7)*437.5));
    col+=vec3f(0.45,0.75,1.25)*sp*k*2.4;
    col+=vec3f(1.5,0.75,0.32)*min(B.y,3.0)*k*1.6;
    sz=1.7*u.v[3].w*(0.8+0.4*seed);
  } else {
    // dust shed by the minute moon since the top of the hour
    let j=ii-N; let ph=hu(j,1u)*TAU; let mA=u.v[2].y;
    var age=mA-ph; var vis=1.0;
    if(age<0.0){ age+=TAU; vis=1.0-ss(0.0,0.30,mA); }
    let ft=age/TAU;
    let rr=0.795+(hu(j,2u)-0.5)*(0.004+0.045*ft)+(hu(j,3u)-0.5)*0.003;
    let ang=ph+(hu(j,4u)-0.5)*0.01+age*0.012*(rr-0.795)*40.0;
    p=rr*vec2f(sin(ang),cos(ang));
    let fresh=exp(-age*1.6);
    let lit=shadowF(p);
    col=mix(vec3f(0.75,0.85,1.0),sun,0.5)*(0.22+1.4*fresh)*vis*(0.25+0.75*lit)*u.v[8].y*0.10;
    sz=u.v[3].w*(0.9+0.9*fresh);
  }
  let sc=u.v[1].x; let dpr=u.v[3].w;
  let px=u.v[0].zw+vec2f(p.x,-p.y)*sc;
  let c=C[vi]*sz;
  var o:VO;
  let ndc=vec2f((px.x+c.x)/u.v[0].x*2.0-1.0, 1.0-(px.y+c.y)/u.v[0].y*2.0);
  o.pos=vec4f(ndc,0.,1.); o.col=col; o.uv=C[vi];
  return o;
}
@fragment fn fs(i:VO)->@location(0) vec4f{
  let g=exp(-dot(i.uv,i.uv)*2.6);
  return vec4f(i.col*g,1.0);
}
`;
const WGSL_COMP=WGSL_COMMON+`
@group(0) @binding(1) var tex: texture_2d<f32>;
struct VO{ @builtin(position) pos:vec4f };
@vertex fn vs(@builtin(vertex_index) vi:u32)->VO{
  var C=array<vec2f,3>(vec2f(-1.,-1.),vec2f(3.,-1.),vec2f(-1.,3.));
  var o:VO; o.pos=vec4f(C[vi],0.,1.); return o;
}
#SHADE#
@fragment fn fs(i:VO)->@location(0) vec4f{
  let ring=textureLoad(tex,vec2i(i.pos.xy),0).rgb;
  return vec4f(shade(i.pos.xy,ring),1.0);
}
`;
// composite shading shared in a tiny dialect: written once, translated to WGSL / GLSL
const SHADE_SRC=`
FN vec3 starL(vec2 p, float cell, float th){
  vec2 g=p*cell; vec2 ip=floor(g); vec2 f=fract(g)-0.5;
  float h=h21(ip); vec3 o=V3(0.);
  if(h>th){ float b=(h-th)/(1.0-th); vec2 off=V2(h21(ip+V2(3.1,1.7)),h21(ip+V2(5.3,9.1)))-0.5;
    float d=length(f-off*0.7); float tw=0.75+0.25*sin(U1.y*(1.5+h*3.)+h*40.);
    o=mix(V3(0.7,0.8,1.0),V3(1.0,0.85,0.7),h21(ip+V2(7.,7.)))*exp(-d*d*cell*cell/(b*6.+1.)*0.5)*b*tw; }
  return o;
}
FN vec3 shade(vec2 fc, vec3 ring){
  float sc=U1.x; vec2 p=(fc-U0.zw)/sc; p.y=-p.y;
  vec3 sun=U3.rgb; vec2 s=sunDir(); float r=length(p);
  // space
  vec3 col=starL(p,95.,0.975)*0.9+starL(p,210.,0.988)*0.6;
  float neb=fbm(p*1.3+V2(U4.w,2.));
  col+=V3(0.05,0.07,0.13)*neb*neb*1.4+V3(0.10,0.04,0.09)*pow(fbm(p*2.4-V2(4.,U4.w)),3.)*1.2;

      fillUniforms(dt,0);
      // simulate (transform feedback)
      gl.useProgram(pSim);gl.uniform4fv(uS,UF);
      gl.bindVertexArray(simV[cur]);
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,tfo);
      gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,bufs[1-cur]);
      gl.enable(gl.RASTERIZER_DISCARD);
      gl.beginTransformFeedback(gl.POINTS);gl.drawArrays(gl.POINTS,0,N);gl.endTransformFeedback();
      gl.disable(gl.RASTERIZER_DISCARD);
      gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER,0,null);
      gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK,null);
      cur=1-cur;
      // particles -> HDR
      gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,tw,th);
      gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
      gl.useProgram(pDraw);gl.uniform4fv(uD,UF);
      gl.bindVertexArray(drawV[cur]);gl.drawArraysInstanced(gl.TRIANGLES,0,6,drawN);
      UF[35]=N;gl.uniform4fv(uD,UF);
      gl.bindVertexArray(emptyV);gl.drawArraysInstanced(gl.TRIANGLES,0,6,ND);
      gl.disable(gl.BLEND);
      // composite
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
      gl.useProgram(pComp);UF[35]=0;gl.uniform4fv(uC,UF);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(uT,0);
      gl.bindVertexArray(emptyV);gl.drawArrays(gl.TRIANGLES,0,3);
    }
  };
}

// ================= loop =================
let ctxTaken=false, R=null, last=0, lastFrame=0, slow=0, fast=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1, backend==='webgpu'?2:1.75);
  const w=Math.round(innerWidth*DPR),h=Math.round(innerHeight*DPR);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  W=w;H=h;
}
addEventListener('resize',resize);
function loop(now){
  requestAnimationFrame(loop);
  if(now-lastFrame<31)return;                       // ~30fps cap: it's a clock, keep it cool
  const iv=now-lastFrame; lastFrame=now;
  const dt=Math.min(0.1,(now-(last||now))/1000);
  // adapt particle count if the device can't hold 30fps
  if(iv>48&&iv<400){slow++;fast=0;if(slow>45&&drawN>N*0.35){drawN=Math.floor(drawN*0.8);slow=0}}
  else if(iv<36){fast++;slow=Math.max(0,slow-1);if(fast>600&&drawN<N){drawN=Math.min(N,Math.floor(drawN*1.15));fast=0}}
  if(R.frame(dt)===false)return;   // GPU still busy: try again next tick (dt keeps growing)
  last=now; simT+=dt;
  if(resetT>0)resetT-=dt;
  imps.length=0;
}
async function start(){
  resize();
  let r=null;
  if(!/[?&]gl=1/.test(location.search)){try{backend='webgpu';r=await initWebGPU()}catch(e){console.warn(e);r=null}}
  if(!r){
    if(ctxTaken){ // this canvas already holds a webgpu context -> reload in WebGL2 mode
      history.replaceState(null,'',location.pathname+(location.search?location.search+'&':'?')+'gl=1');location.reload();return;
    }
    backend='webgl2';resize();r=initWebGL2();
  }
  if(!r){document.getElementById('nogpu').style.display='flex';return}
  boot(r);
}
function boot(r){
  R=r;backend=r.name;resize();
  window.__rd={backend,N:()=>N,drawN:()=>drawN,setOffset:v=>{tOffset=v},readback:()=>R.readback&&R.readback()};
  requestAnimationFrame(loop);
  const hint=document.getElementById('hint');
  setTimeout(()=>hint.classList.add('on'),1200);setTimeout(()=>hint.classList.remove('on'),7000);
  const guide=document.getElementById('guide');
  guide.addEventListener('pointerdown',e=>{e.stopPropagation();guide.classList.remove('on')});
  if(window.APKit)APKit.init({
    canvas: cv,
    gifName: 'ring-dial-loop',
    clockFormat: 'spec',
    clockPos: 'top',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      {label:'✦', name:'mutate', onClick:function(){ palIx=(palIx+1)%PALS.length; ringSeed=Math.random()*1000; R.reseed(); }},
      {label:'↻', name:'reset',  onClick:function(){ resetT=2.5; }},
      {label:'？', name:'guide', onClick:function(){ guide.classList.toggle('on'); }}
    ]
  });
}
start();
})();
