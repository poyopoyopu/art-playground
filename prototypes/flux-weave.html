<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLUX WEAVE</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010205}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body><canvas id="c"></canvas><script>
'use strict';
const c=document.getElementById('c');
const gl=c.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true});
const V='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const F=`precision highp float;
uniform vec2 res; uniform float t,law,seed;
uniform vec3 c0,c1,c2,c3;
mat2 R(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
float sdTorus(vec3 p,float major,float minor){vec2 q=vec2(length(p.xz)-major,p.y);return length(q)-minor;}
float scene(vec3 p){
 float a=atan(p.z,p.x);
 float twist=.42*sin(a*2.0+t*.22+seed*.13)+.18*sin(a*5.0-t*.17);
 p.yz=R(twist*.42)*p.yz;
 float d=sdTorus(p,.92,.25);
 float swell=.055*sin(a*3.0-t*.21+seed)+.028*sin(a*7.0+t*.13);
 d-=swell;
 vec3 q=p;
 q.xz=R(1.5707963)*q.xz;
 q.y+=.16*sin(t*.18+seed);
 float d2=sdTorus(q,.48,.075);
 d=min(d,d2);
 return d;
}
vec3 normal(vec3 p){float e=.0015;return normalize(vec3(scene(p+vec3(e,0,0))-scene(p-vec3(e,0,0)),scene(p+vec3(0,e,0))-scene(p-vec3(0,e,0)),scene(p+vec3(0,0,e))-scene(p-vec3(0,0,e))));}
vec3 env(vec3 d){
 float h=.5+.5*d.y;
 float s=.5+.5*sin(4.5*d.y+2.0*sin(2.2*d.x+t*.10)+law*.8);
 vec3 a=mix(c0,c1,h); vec3 b=mix(c2,c3,.5+.5*d.x);
 return mix(vec3(.003,.004,.010),mix(a,b,.42),.52+.38*s);
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);
 vec3 ro=vec3(0.,0.,3.35), rd=normalize(vec3(uv,-2.75));
 float ca=cos(t*.055),sa=sin(t*.055); rd.xz=mat2(ca,-sa,sa,ca)*rd.xz;
 float d=0.,hit=0.;vec3 p=ro;
 for(int i=0;i<90;i++){p=ro+rd*d;float h=scene(p);if(h<.001){hit=1.;break;}d+=h*.72;if(d>7.)break;}
 vec3 bg=mix(vec3(.001,.002,.006),c0,.055*exp(-length(uv)*3.));
 float glow=exp(-abs(d-1.9)*3.0)*.055;bg+=mix(c1,c2,.5)*glow;
 if(hit<.5){gl_FragColor=vec4(bg,1.);return;}
 vec3 N=normal(p),Vv=normalize(ro-p),L=normalize(vec3(-.5,.75,1.1));
 float ndl=max(dot(N,L),0.);float fres=pow(1.-max(dot(N,Vv),0.),3.2);
 vec3 refl=reflect(-Vv,N);refl.xz=R(t*.035)*refl.xz;
 vec3 col=env(normalize(refl))*(.52+.78*fres);
 float spec=pow(max(dot(N,normalize(L+Vv)),0.),70.);col+=vec3(1.)*spec*1.8;
 float inner=pow(max(dot(N,Vv),0.),1.5);
 col+=mix(c1,c3,.5+.5*sin(t*.12+p.y*4.0+seed))*inner*.32;
 float rim=pow(1.-max(dot(N,Vv),0.),5.);col+=c1*rim*.65;
 float edge=exp(-abs(scene(p+.012*N))*.0);
 col*=.86+.14*sin(t*.16+p.x*3.0+p.z*2.0+law);
 gl_FragColor=vec4(col+edge*.0,1.);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,V));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,F));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={res:gl.getUniformLocation(prog,'res'),t:gl.getUniformLocation(prog,'t'),law:gl.getUniformLocation(prog,'law'),seed:gl.getUniformLocation(prog,'seed'),c0:gl.getUniformLocation(prog,'c0'),c1:gl.getUniformLocation(prog,'c1'),c2:gl.getUniformLocation(prog,'c2'),c3:gl.getUniformLocation(prog,'c3')};
const pals=[[[.008,.025,.040],[.02,.82,.78],[.30,.03,.62],[.82,.28,.95]],[[.006,.035,.018],[.16,.92,.55],[.02,.42,.30],[.75,1.,.72]],[[.025,.008,.035],[.55,.10,.82],[.95,.18,.46],[1.,.68,.30]],[[.005,.018,.045],[.08,.42,.95],[.35,.05,.70],[.96,.36,.72]]];
let law=0,seed=Math.random()*50,start=performance.now(),dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;gl.viewport(0,0,c.width,c.height)}
addEventListener('resize',resize);resize();
function draw(phase){const time=phase===null?(performance.now()-start)/1000:phase;const P=pals[law%pals.length];gl.uniform2f(U.res,c.width,c.height);gl.uniform1f(U.t,time);gl.uniform1f(U.law,law);gl.uniform1f(U.seed,seed);gl.uniform3fv(U.c0,P[0]);gl.uniform3fv(U.c1,P[1]);gl.uniform3fv(U.c2,P[2]);gl.uniform3fv(U.c3,P[3]);gl.drawArrays(gl.TRIANGLES,0,3)}
function animate(){draw(null);requestAnimationFrame(animate)}
function mutate(){law=(law+1)%pals.length;seed=Math.random()*50}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;mutate();return true}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});
APKit.init({canvas:c,gifName:'flux-weave-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:function(){law=0;seed=Math.random()*50;}}]});
requestAnimationFrame(animate);
</script></body></html>
