<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RIBBON ORGAN</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07050c}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let d,W,H,pts=[];function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function render(p=0){g.fillStyle='#07050c';g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let q=0;q<18;q++){g.beginPath();for(let i=0;i<=220;i++){let u=i/220,a=u*Math.PI*2+(q%3)*.11,r=S*(.10+q*.032),w=Math.sin(u*8*Math.PI+p*2+q)*S*.025;let x=Math.cos(a)*r+w*Math.cos(a+Math.PI/2),y=Math.sin(a)*r+w*Math.sin(a+Math.PI/2);for(let m of pts){let dx=x+cx-m.x,dy=y+cy-m.y,dd=Math.hypot(dx,dy),z=Math.max(0,1-dd/190);x+=dx*z*.18;y+=dy*z*.18}g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${270+q*7},80%,${50+q*1.5}%,.28)`;g.lineWidth=1.2+Math.sin(p*2+q)*2.2;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;pts.unshift({x,y});pts=pts.slice(0,6)}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'RIBBON-ORGAN-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:'✦',name:'mutate',onClick:()=>pts.forEach(m=>{m.x+=Math.random()*80-40;m.y+=Math.random()*80-40})},{label:'↻',name:'reset',onClick:()=>pts=[]}]});function loop(){render(performance.now()*.00012);requestAnimationFrame(loop)}loop();</script></body></html>
