<!DOCTYPE html>
<!-- HAIRLINE — クロちゃん(Claude)作。おっちゃんが見せてくれたYMM4プラグイン「I_DistortChroma」(Panko200氏、MITライセンス:
     画像の明暗差からバンプマップを計算し、光の屈折に従ってRGBがずれて描画される)の仕組みを、ブラウザ(WebGL)で一から組み直した作品。
     プラグインのコードは使っていない。GLASS CLAY(つまらん)の作り直しで、おっちゃんが3案から「割れるほど増える虹」を選んだ。ap-kit.js統合: クロちゃん -->
<!-- 世界のルール: この一枚ガラスには色が無い。虹は「割れ目」にだけ宿る。割れ目の縁で光が曲がり、波長ごとに曲がり方が違うから。
     そして、一度入ったヒビは自分で育つ。大きな破片の中に小さなヒビが走り、その破片の中にさらに小さなヒビが走る(最大6階層の入れ子)。
     ガラスは二度と元に戻らない。割るほど、虹が増える。
     ・タップ … 叩く。そこを中心に蜘蛛の巣状のヒビ(放射状+同心円)が入り、破片は中心へ向かって少しへこむ(傾く)。
     ・押さえる/なぞる … 指の下の破片を細かく砕く。割れていない所で押さえると、小さく割れる。
     ・放っておく … ヒビは時間をかけて勝手に枝分かれし、破片が増えていく。破片はそれぞれ違う向きに傾いているので、光が回るとひとつずつ光る。
     ・✦ … ガラスの向こうの光(景色)とガラスの種類(虹の幅・色味)を替える。割れ方はそのまま。
     ・↻ … 新しい一枚ガラス(真ん中を一回叩いたところから)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HAIRLINE — 割れ目にだけ、虹が宿る</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #2a2c31; overflow: hidden; overscroll-behavior: none; }
  body {
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 12px; line-height: 1.9; letter-spacing: .07em;
    color: #f2f4f8; opacity: 0; transition: opacity 1.6s ease;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .8);
  }
  #hint.on { opacity: .85; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ddd; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ 叩いて割る　押さえる・なぞる ＝ 細かく砕く<br>ヒビは勝手に育つ。割れ目にだけ虹が出る</div>
<div id="nogl">WebGLが使えない環境です</div>
<script>
(function () {
  'use strict';

  var cvs = document.getElementById('c');
  var hint = document.getElementById('hint');
  var gl = cvs.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('nogl').style.display = 'flex'; return; }

  /* ---------- シェーダ ----------
     地図テクスチャ(格子): R,G = 破片の傾き、B = ヒビの線(細い)、A = ヒビのふくらみ(ぼかした線 = バンプ)。
     1) 破片の傾きの分だけ、ガラスの向こうの景色をずらして読む(破片ごとに景色がずれる)。
     2) ヒビのふくらみの傾きに沿って、ヒビの線そのものをずらして読む(=プラグインと同じ「明暗からバンプ→屈折」)。
     どちらも波長(赤→紫)ごとにずらす量を変えて12回読み、波長の色で足し合わせる。割れていない所は12回とも同じ所を読むので灰色のまま。 */
  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  var FS = [
    'precision highp float;',
    'uniform sampler2D M;uniform sampler2D BG;',
    'uniform vec2 R;uniform vec2 G;uniform vec2 bgS;uniform vec2 drift;',
    'uniform float S;uniform float S2;uniform float S3;uniform float D;uniform float Dc;uniform float K;',
    'uniform vec3 tint;uniform vec3 L;',
    'vec3 wave(float t){',
    '  vec3 c=vec3(0.13,0.50,0.87);',
    '  vec3 d=clamp(1.0-abs(t-c)/vec3(0.36,0.33,0.36),0.0,1.0);',
    '  return d*d*(3.0-2.0*d);',
    '}',
    'void main(){',
    '  vec2 uv=vec2(gl_FragCoord.x/R.x,1.0-gl_FragCoord.y/R.y);',
    '  vec2 tx=1.0/G;',
    '  vec4 m=texture2D(M,uv);',
    '  vec2 T=(m.rg-0.5)/K;',
    '  float aL=texture2D(M,uv-vec2(tx.x,0.0)).a, aR=texture2D(M,uv+vec2(tx.x,0.0)).a;',
    '  float aU=texture2D(M,uv-vec2(0.0,tx.y)).a, aD=texture2D(M,uv+vec2(0.0,tx.y)).a;',
    '  vec2 gA=vec2(aR-aL,aD-aU)*0.5;',
    '  vec2 cd=normalize(L.xy+vec2(0.0001));',
    '  vec2 bu=uv*bgS+drift;',
    '  vec3 acc=vec3(0.0);vec3 ws=vec3(0.0);',
    '  for(int i=0;i<12;i++){',
    '    float t=(float(i)+0.5)/12.0;',
    '    float f=1.0+D*(t-0.5)*2.0;',
    '    float fc=1.0+Dc*(t-0.5)*2.0;',
    '    float b=texture2D(BG,bu+(T*S+gA*S3)*f).r;',
    '    float e=(t-0.5)*2.0;',
    '    float c=texture2D(M,uv+cd*Dc*1.4*e*tx).b;',
    '    float h=texture2D(M,uv+cd*S2*Dc*e*tx).a;',
    '    vec3 w=wave(t);',
    '    acc+=w*(b+c*0.8+h*h*0.55);ws+=w;',
    '  }',
    '  vec3 col=acc/ws;',
    '  col*=tint;',
    '  vec3 n=normalize(vec3(-T*1.5,1.0));',
    '  float sp=pow(max(dot(n,L),0.0),70.0);',
    '  col+=sp*0.42*vec3(0.96,0.98,1.0);',
    '  vec2 q=uv-0.5;',
    '  col*=1.0-0.3*dot(q,q)*2.0;',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  var vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var aP = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  var U = {};
  ['M', 'BG', 'R', 'G', 'bgS', 'drift', 'S', 'S2', 'S3', 'D', 'Dc', 'K', 'tint', 'L'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });
  var K = 0.42;   /* 傾きを0..255に詰める倍率(±1.2まで) */

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  var texM = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texM);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var texBG = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texBG);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.activeTexture(gl.TEXTURE0);

  /* ---------- ガラスの向こうの景色(タイル状につながる512px) ---------- */
  var BGN = 512;
  var bgCanvas = document.createElement('canvas');
  bgCanvas.width = bgCanvas.height = BGN;
  function buildBG() {
    var c = bgCanvas.getContext('2d');
    c.filter = 'none';
    var img = c.createImageData(BGN, BGN), dd = img.data;
    var bands = [];
    for (var bi = 0; bi < 3; bi++) {
      var kx = 1 + ((Math.random() * 3) | 0), ky = ((Math.random() * 7) | 0) - 3;
      if (Math.random() < 0.5) { var tk = kx; kx = ky; ky = tk; if (kx === 0 && ky === 0) ky = 1; }
      bands.push([kx, ky, Math.random() * 6.2832, 0.18 + Math.random() * 0.35, 6 + ((Math.random() * 18) | 0)]);
    }
    for (var yy = 0; yy < BGN; yy++) for (var xx = 0; xx < BGN; xx++) {
      var v = 58;
      for (bi = 0; bi < bands.length; bi++) {
        var B = bands[bi];
        var sv = 0.5 + 0.5 * Math.sin(6.2832 * (B[0] * xx + B[1] * yy) / BGN + B[2]);
        v += B[3] * 110 * Math.pow(sv, B[4]);
      }
      var o = (yy * BGN + xx) * 4;
      dd[o] = dd[o + 1] = dd[o + 2] = v > 255 ? 255 : v; dd[o + 3] = 255;
    }
    c.putImageData(img, 0, 0);
    function blob(x, y, r, v, a) {
      for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
        var X = x + ox * BGN, Y = y + oy * BGN;
        if (X + r < 0 || X - r > BGN || Y + r < 0 || Y - r > BGN) continue;
        var g = c.createRadialGradient(X, Y, 0, X, Y, r);
        g.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',' + a + ')');
        g.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)');
        c.fillStyle = g; c.fillRect(X - r, Y - r, r * 2, r * 2);
      }
    }
    var i;
    for (i = 0; i < 22; i++) blob(Math.random() * BGN, Math.random() * BGN, 50 + Math.random() * 130, Math.random() < 0.45 ? 255 : 0, 0.12 + Math.random() * 0.2);
    for (i = 0; i < 90; i++) blob(Math.random() * BGN, Math.random() * BGN, 6 + Math.random() * 30, Math.random() < 0.6 ? 255 : 0, 0.2 + Math.random() * 0.35);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texBG);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bgCanvas);
    gl.activeTexture(gl.TEXTURE0);
  }

  /* ---------- 地図(格子) ---------- */
  var W = 0, Hc = 0, DPR = 1;
  var gw = 0, gh = 0, gs = 1, minG = 1, nCells = 0;
  var Tx, Ty, Cs, Ca, px;
  var dirty = null;

  var glass = { D: 0.32, Dc: 0.7, tint: [0.96, 0.99, 1.05] };
  var TINTS = [[0.96, 0.99, 1.05], [1.05, 0.99, 0.93], [0.96, 1.03, 1.0], [1.03, 0.96, 1.05], [1.0, 1.0, 1.0]];

  function allocGrid() {
    nCells = gw * gh;
    Tx = new Float32Array(nCells); Ty = new Float32Array(nCells);
    Cs = new Float32Array(nCells); Ca = new Float32Array(nCells);
    px = new Uint8Array(nCells * 4);
  }
  function markDirty(y0, y1) {
    y0 = Math.max(0, Math.floor(y0)); y1 = Math.min(gh - 1, Math.ceil(y1));
    if (y1 < y0) return;
    if (!dirty) dirty = [y0, y1];
    else { if (y0 < dirty[0]) dirty[0] = y0; if (y1 > dirty[1]) dirty[1] = y1; }
  }
  function upload() {
    if (!dirty) return;
    var y0 = dirty[0], y1 = dirty[1];
    for (var i = y0 * gw, e = (y1 + 1) * gw; i < e; i++) {
      var r = 128 + Tx[i] * K * 255, g = 128 + Ty[i] * K * 255, o = i * 4;
      px[o] = r < 0 ? 0 : (r > 255 ? 255 : r);
      px[o + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
      px[o + 2] = Cs[i] > 1 ? 255 : Cs[i] * 255;
      px[o + 3] = Ca[i] > 1 ? 255 : Ca[i] * 255;
    }
    gl.bindTexture(gl.TEXTURE_2D, texM);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, y0, gw, y1 - y0 + 1, gl.RGBA, gl.UNSIGNED_BYTE,
      px.subarray(y0 * gw * 4, (y1 + 1) * gw * 4));
    dirty = null;
  }

  /* ヒビの線を1本、格子に焼く(細い線 = B、ぼかした線 = A) */
  function crackLine(ax, ay, bx, by, I) {
    var sig = Math.max(1.5, minG * 0.0058);
    var wS = 0.75 + I * 0.55;
    var m = sig * 3 + 2;
    var x0 = Math.max(0, Math.floor(Math.min(ax, bx) - m)), x1 = Math.min(gw - 1, Math.ceil(Math.max(ax, bx) + m));
    var y0 = Math.max(0, Math.floor(Math.min(ay, by) - m)), y1 = Math.min(gh - 1, Math.ceil(Math.max(ay, by) + m));
    if (x1 < x0 || y1 < y0) return;
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-6;
    var inv2s = 1 / (2 * sig * sig);
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var t = ((x - ax) * dx + (y - ay) * dy) / L2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var ex = x - (ax + dx * t), ey = y - (ay + dy * t);
        var d2 = ex * ex + ey * ey;
        if (d2 > m * m) continue;
        var i = y * gw + x;
        var d = Math.sqrt(d2);
        var s = I * (1 - d / wS); if (s > Cs[i]) Cs[i] = s;
        var a = I * Math.exp(-d2 * inv2s); if (a > Ca[i]) Ca[i] = a;
      }
    }
    markDirty(y0, y1);
  }

  /* ---------- 破片(凸多角形) ---------- */
  var leaves = [];          /* いま一番細かい破片たち */
  var deadCount = 0;
  var events = [];          /* {t, fn} これから起きること */
  var clock = 0;            /* 秒 */
  var MAXD = 6;

  function polyArea(v) {
    var a = 0;
    for (var i = 0, n = v.length; i < n; i++) { var p = v[i], q = v[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
    return a * 0.5;
  }
  function makeShard(v, depth) {
    var cx = 0, cy = 0, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (var i = 0; i < v.length; i++) {
      cx += v[i][0]; cy += v[i][1];
      if (v[i][0] < x0) x0 = v[i][0]; if (v[i][0] > x1) x1 = v[i][0];
      if (v[i][1] < y0) y0 = v[i][1]; if (v[i][1] > y1) y1 = v[i][1];
    }
    return { v: v, depth: depth, cx: cx / v.length, cy: cy / v.length, bb: [x0, y0, x1, y1],
      area: Math.abs(polyArea(v)), sgn: polyArea(v) >= 0 ? 1 : -1, dead: false };
  }
  function inside(sh, x, y) {
    var b = sh.bb;
    if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) return false;
    var v = sh.v, n = v.length, s = sh.sgn;
    for (var i = 0; i < n; i++) {
      var p = v[i], q = v[(i + 1) % n];
      if (((q[0] - p[0]) * (y - p[1]) - (q[1] - p[1]) * (x - p[0])) * s < -0.0001) return false;
    }
    return true;
  }
  /* 破片の中だけ、傾きを足す */
  function tiltShard(sh, dx, dy) {
    var b = sh.bb;
    var x0 = Math.max(0, Math.floor(b[0])), x1 = Math.min(gw - 1, Math.ceil(b[2]));
    var y0 = Math.max(0, Math.floor(b[1])), y1 = Math.min(gh - 1, Math.ceil(b[3]));
    if (x1 < x0 || y1 < y0) return;
    var v = sh.v, n = v.length, s = sh.sgn;
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var ok = true;
        for (var k = 0; k < n; k++) {
          var p = v[k], q = v[(k + 1) % n];
          if (((q[0] - p[0]) * (y - p[1]) - (q[1] - p[1]) * (x - p[0])) * s < 0) { ok = false; break; }
        }
        if (!ok) continue;
        var i = y * gw + x;
        Tx[i] += dx; Ty[i] += dy;
      }
    }
    markDirty(y0, y1);
  }
  function addLeaf(sh, tiltX, tiltY) {
    leaves.push(sh);
    tiltShard(sh, tiltX, tiltY);
  }
  var minArea = 40;
  var SPLIT_P = [1, 0.95, 0.8, 0.6, 0.4, 0.25];
  function scheduleSplit(sh, base, near) {
    if (sh.depth >= MAXD) return;
    if (Math.random() > SPLIT_P[sh.depth]) return;
    var delay = (0.5 + Math.random() * 2.6) * Math.pow(1.75, sh.depth) * (1 + (near || 0));
    events.push({ t: base + delay, fn: function () { splitShard(sh, false); } });
  }
  /* 破片を1本のヒビで2つに割る */
  function splitShard(sh, forced) {
    if (sh.dead) return false;
    if (sh.area < (forced ? minArea * 0.45 : minArea)) return false;
    var v = sh.v, n = v.length;
    var li = 0, best = -1;
    for (var i = 0; i < n; i++) {
      var p = v[i], q = v[(i + 1) % n], l = (q[0] - p[0]) * (q[0] - p[0]) + (q[1] - p[1]) * (q[1] - p[1]);
      if (l > best) { best = l; li = i; }
    }
    var j;
    if (n === 3) j = (li + 1 + (Math.random() < 0.5 ? 0 : 1)) % 3;
    else {
      var opts = [];
      for (var k = 0; k < n; k++) { var dk = (k - li + n) % n; if (dk !== 0 && dk !== 1 && dk !== n - 1) opts.push(k); }
      j = opts[(Math.random() * opts.length) | 0];
    }
    var ta = 0.3 + Math.random() * 0.4, tb = 0.3 + Math.random() * 0.4;
    var A0 = v[li], A1 = v[(li + 1) % n], B0 = v[j], B1 = v[(j + 1) % n];
    var P = [A0[0] + (A1[0] - A0[0]) * ta, A0[1] + (A1[1] - A0[1]) * ta];
    var Q = [B0[0] + (B1[0] - B0[0]) * tb, B0[1] + (B1[1] - B0[1]) * tb];
    var va = [P], vb = [Q], idx;
    idx = (li + 1) % n;
    while (true) { va.push(v[idx]); if (idx === j) break; idx = (idx + 1) % n; }
    va.push(Q);
    idx = (j + 1) % n;
    while (true) { vb.push(v[idx]); if (idx === li) break; idx = (idx + 1) % n; }
    vb.push(P);
    sh.dead = true; deadCount++;
    var d = sh.depth + 1;
    var a = makeShard(va, d), b = makeShard(vb, d);
    crackLine(P[0], P[1], Q[0], Q[1], Math.max(0.42, 0.9 * Math.pow(0.86, sh.depth)));
    /* 割れた片方だけが少し傾く。その段差でも景色がずれる */
    var mag = 0.16 * Math.pow(0.8, sh.depth) * (0.5 + Math.random());
    var an = Math.random() * 6.2832;
    var who = Math.random() < 0.5 ? a : b;
    leaves.push(a); leaves.push(b);
    tiltShard(who, Math.cos(an) * mag, Math.sin(an) * mag);
    if (!forced) { scheduleSplit(a, clock); scheduleSplit(b, clock); }
    else { scheduleSplit(a, clock + 1.5); scheduleSplit(b, clock + 1.5); }
    if (deadCount > 400) { leaves = leaves.filter(function (s) { return !s.dead; }); deadCount = 0; }
    return true;
  }

  /* 叩く: 放射状のヒビと同心円のヒビ。破片は中心へ向かってへこむ */
  function impact(cx, cy, R) {
    var N = 8 + ((Math.random() * 6) | 0);
    var M = 4 + (Math.random() < 0.5 ? 1 : 0);
    var r = [R * (0.05 + Math.random() * 0.03)];
    var steps = [], sum = 0;
    for (var m = 0; m < M; m++) { var s = 0.55 + Math.random() * 0.9; s *= Math.pow(1.25, m); steps.push(s); sum += s; }
    for (m = 0; m < M; m++) r.push(r[m] + (R - r[0]) * steps[m] / sum);
    var th0 = Math.random() * 6.2832;
    var ang = [];
    for (var k = 0; k < N; k++) ang.push(th0 + (k + (Math.random() - 0.5) * 0.55) * 6.2832 / N);
    var V = [];
    for (k = 0; k < N; k++) {
      V.push([]);
      for (m = 0; m <= M; m++) {
        var a = ang[k] + (m ? (Math.random() - 0.5) * 0.16 : 0);
        var rr = r[m] * (1 + (Math.random() - 0.5) * 0.14);
        V[k].push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
      }
    }
    var t0 = clock;
    function at(dt, fn) { events.push({ t: t0 + dt, fn: fn }); }
    /* 放射状のヒビ(中心から外へ、一気に走る) */
    for (k = 0; k < N; k++) (function (k) {
      at(0, function () { crackLine(cx, cy, V[k][0][0], V[k][0][1], 1); });
      for (var m2 = 0; m2 < M; m2++) (function (m2) {
        at(0.03 * (m2 + 1), function () { crackLine(V[k][m2][0], V[k][m2][1], V[k][m2 + 1][0], V[k][m2 + 1][1], 1 - m2 * 0.05); });
      })(m2);
      /* 外へのびる尾 */
      if (Math.random() < 0.7) {
        var pts = [[V[k][M][0], V[k][M][1]]], a2 = ang[k], segs = 2 + ((Math.random() * 3) | 0), seg = R * (0.06 + Math.random() * 0.12);
        for (var s2 = 0; s2 < segs; s2++) {
          a2 += (Math.random() - 0.5) * 0.35;
          var lp = pts[pts.length - 1];
          pts.push([lp[0] + Math.cos(a2) * seg, lp[1] + Math.sin(a2) * seg]);
        }
        for (s2 = 0; s2 < segs; s2++) (function (s2) {
          at(0.03 * (M + 1 + s2), function () { crackLine(pts[s2][0], pts[s2][1], pts[s2 + 1][0], pts[s2 + 1][1], 0.8 - s2 * 0.12); });
        })(s2);
      }
    })(k);
    /* 同心円のヒビと、へこんだ破片 */
    for (m = 0; m <= M; m++) (function (m) {
      for (var k2 = 0; k2 < N; k2++) (function (k2) {
        var k3 = (k2 + 1) % N;
        at(0.07 + 0.05 * m + Math.random() * 0.08, function () { crackLine(V[k2][m][0], V[k2][m][1], V[k3][m][0], V[k3][m][1], 0.85 - m * 0.04); });
        var poly = m === 0 ? [[cx, cy], V[k2][0], V[k3][0]] : [V[k2][m - 1], V[k3][m - 1], V[k3][m], V[k2][m]];
        at(0.1 + 0.05 * m, function () {
          var sh = makeShard(poly, 0);
          var ex = cx - sh.cx, ey = cy - sh.cy, dd = Math.sqrt(ex * ex + ey * ey) || 1;
          var dent = 0.3 * Math.exp(-dd / R * 1.4);
          var rnd = 0.07 + 0.08 * Math.random(), ra = Math.random() * 6.2832;
          addLeaf(sh, ex / dd * dent + Math.cos(ra) * rnd, ey / dd * dent + Math.sin(ra) * rnd);
          scheduleSplit(sh, clock, dd / R * 0.8);
        });
      })(k2);
    })(m);
  }

  /* ---------- 大きさ ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; Hc = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(Hc * DPR);
    gl.viewport(0, 0, cvs.width, cvs.height);
    var ngs = Math.min(1, Math.sqrt(330000 / (W * Hc)));
    var nw = Math.max(16, Math.round(W * ngs)), nh = Math.max(16, Math.round(Hc * ngs));
    if (nw === gw && nh === gh && Tx) return;
    gs = ngs; gw = nw; gh = nh; minG = Math.min(gw, gh);
    minArea = Math.pow(minG * 0.02, 2);
    allocGrid();
    gl.bindTexture(gl.TEXTURE_2D, texM);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    /* 向きが変わったら、新しいガラスで最初から(割れ方は格子に焼いてあるので持ち越せない) */
    freshPane();
  }
  function freshPane() {
    Tx.fill(0); Ty.fill(0); Cs.fill(0); Ca.fill(0);
    leaves = []; events = []; deadCount = 0;
    dirty = [0, gh - 1];
    var started = clock;
    events.push({ t: started + 0.6, fn: function () {
      impact(gw * (0.42 + Math.random() * 0.16), gh * (0.38 + Math.random() * 0.14), minG * (0.42 + Math.random() * 0.1));
    } });
  }

  /* ---------- 操作 ---------- */
  var pointers = {};
  var hintHidden = false;
  function hideHint() { if (hintHidden) return; hintHidden = true; hint.classList.remove('on'); }
  var lastSmall = -9;

  function crumbleAt(x, y, p) {
    var hit = null, i;
    for (i = leaves.length - 1; i >= 0; i--) { var s = leaves[i]; if (!s.dead && inside(s, x, y)) { hit = s; break; } }
    if (!hit) {
      /* まだ割れていない所: 小さく割る */
      if (!p.small && clock - lastSmall > 0.45) { p.small = true; lastSmall = clock; impact(x, y, minG * (0.1 + Math.random() * 0.05)); }
      return;
    }
    splitShard(hit, true);
    /* まわりの破片もひとつ */
    var r = minG * 0.06, r2 = r * r, cand = [];
    for (i = leaves.length - 1; i >= 0 && cand.length < 6; i--) {
      var t = leaves[i]; if (t.dead) continue;
      var ex = t.cx - x, ey = t.cy - y;
      if (ex * ex + ey * ey < r2) cand.push(t);
    }
    if (cand.length) splitShard(cand[(Math.random() * cand.length) | 0], true);
  }

  cvs.addEventListener('pointerdown', function (e) {
    if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
    e.preventDefault();
    hideHint();
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t0: performance.now(),
      moved: false, active: false, acc: 0 };
  });
  cvs.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    e.preventDefault();
    if (!p.moved && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) { p.moved = true; p.active = true; }
    p.x = e.clientX; p.y = e.clientY;
  });
  function up(e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    if (!p.active && performance.now() - p.t0 < 280) {
      impact(p.x * gs, p.y * gs, minG * (0.24 + Math.random() * 0.2));
    }
    delete pointers[e.pointerId];
  }
  cvs.addEventListener('pointerup', up);
  cvs.addEventListener('pointercancel', function (e) { delete pointers[e.pointerId]; });

  /* ---------- ループ ---------- */
  var last = performance.now();
  var creep = 3;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock += dt;

    for (var id in pointers) {
      var p = pointers[id];
      if (!p.active && now - p.t0 > 280) p.active = true;
      if (p.active) {
        p.acc += dt;
        while (p.acc > 0.07) { p.acc -= 0.07; crumbleAt(p.x * gs, p.y * gs, p); }
      }
    }

    /* 予定の時刻が来たヒビを走らせる(1フレームに走らせる数は抑える) */
    var budget = 160, keep = [];
    events.sort(function (a, b) { return a.t - b.t; });
    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      if (ev.t <= clock && budget > 0) { ev.fn(); budget--; }
      else keep.push(ev);
    }
    events = keep;

    /* ガラスはひずみを抱えていて、ときどきどこかが勝手にピシッと割れる */
    creep -= dt;
    if (creep <= 0) {
      creep = 2.2 + Math.random() * 3.5;
      for (var tries = 0; tries < 8 && leaves.length; tries++) {
        var s = leaves[(Math.random() * leaves.length) | 0];
        if (!s.dead && s.area > minArea * 3) { splitShard(s, false); break; }
      }
    }

    upload();

    var la = clock * 0.21;
    var lx = Math.cos(la) * 0.62, ly = Math.sin(la) * 0.62, lz = 1;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    var cover = Math.min(W, Hc) * 0.95;
    gl.uniform1i(U.M, 0);
    gl.uniform1i(U.BG, 1);
    gl.uniform2f(U.R, cvs.width, cvs.height);
    gl.uniform2f(U.G, gw, gh);
    gl.uniform2f(U.bgS, W / cover, Hc / cover);
    gl.uniform2f(U.drift, clock * 0.0045, clock * 0.0028);
    gl.uniform1f(U.S, 0.3);
    gl.uniform1f(U.S2, 5 * minG / 370);
    gl.uniform1f(U.S3, 0.02);
    gl.uniform1f(U.D, glass.D);
    gl.uniform1f(U.Dc, glass.Dc);
    gl.uniform1f(U.K, K);
    gl.uniform3f(U.tint, glass.tint[0], glass.tint[1], glass.tint[2]);
    gl.uniform3f(U.L, lx / ll, ly / ll, lz / ll);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  buildBG();
  resize();
  setTimeout(function () { if (!hintHidden) hint.classList.add('on'); }, 900);
  setTimeout(hideHint, 8500);
  requestAnimationFrame(frame);

  /* ---- 共有コントロール(ap-kit.js) ---- */
  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'hairline',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {   /* ガラスの向こうの光と、ガラスの種類(虹の幅・色味)を替える。割れ方はそのまま */
          buildBG();
          glass.D = 0.18 + Math.random() * 0.4;
          glass.Dc = 0.45 + Math.random() * 0.6;
          glass.tint = TINTS[(Math.random() * TINTS.length) | 0];
        } },
        { label: '↻', name: 'reset', onClick: function () { freshPane(); } }   /* 新しい一枚ガラス */
      ]
    });
  }
})();
</script>
</body>
</html>
