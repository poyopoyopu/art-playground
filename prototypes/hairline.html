<!DOCTYPE html>
<!-- HAIRLINE — クロちゃん(Claude)作。おっちゃんが見せてくれたYMM4プラグイン「I_DistortChroma」(Panko200氏、MITライセンス:
     画像の明暗差からバンプマップを計算し、光の屈折に従ってRGBがずれて描画される)の仕組みを、ブラウザ(WebGL)で一から組み直した作品。
     プラグインのコードは使っていない。GLASS CLAY(つまらん)の作り直しで、おっちゃんが3案から「割れるほど増える虹」を選んだ。
     v2: 「リアルさが足りない」で作り直し。ヒビをギザギザの細い線にし、光の向きで光らせる。割れ目は少しずつ走って伸び、別のヒビに当たると止まる。
     叩いた中心は粉々に。v3: 「背景がつまらん、リアルなマグマとかリアルな雷雨とか」でガラスの向こうを動くマグマ/雷雨に。ap-kit.js統合: クロちゃん -->
<!-- 世界のルール: この一枚ガラスには色が無い。虹は「割れ目」にだけ宿る。割れ目の縁で光が曲がり、波長ごとに曲がり方が違うから。
     そして、一度入ったヒビは自分で育つ。大きな破片の中に小さなヒビが走り、その破片の中にさらに小さなヒビが走る(最大6階層の入れ子)。
     走り出したヒビは止まらずにのび続け、別のヒビにぶつかったところで止まる。ガラスは二度と元に戻らない。割るほど、虹が増える。
     ・タップ … 叩く。そこを中心に蜘蛛の巣状のヒビ(放射状+同心円)が入り、中心は粉々に。破片は中心へ向かって少しへこむ(傾く)。
     ・押さえる/なぞる … 指の下の破片を細かく砕く。割れていない所で押さえると、小さく割れる。
     ・放っておく … ヒビの先がじわじわ走り、破片の中に新しいヒビが入っていく。破片はそれぞれ違う向きに傾いているので、光が回るとひとつずつ光る。
     ・✦ … ガラスの向こうをマグマ⇔雷雨に切り替え、ガラスの種類(虹の幅)も替える。割れ方はそのまま。
     ・雷雨では、稲妻が光るたびに割れ目が一斉に白く浮かぶ。マグマでは、割れ目が溶岩の光を受けて赤く光る。
     ・↻ … 新しい一枚ガラス(真ん中を一回叩いたところから)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HAIRLINE — 割りすぎると、足もとのガラスが抜ける</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #10131a; overflow: hidden; overscroll-behavior: none; }
  body {
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 12px; line-height: 1.9; letter-spacing: .07em;
    color: #f2f4f8; opacity: 0; transition: opacity 1.6s ease;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .9);
  }
  #hint.on { opacity: .85; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ddd; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">地上300mのガラスの床。割りすぎると、床が抜ける<br>タップ ＝ 叩く　押さえる・なぞる ＝ 砕く</div>
<div id="nogl">WebGLが使えない環境です</div>
<script>
(function () {
  'use strict';

  var cvs = document.getElementById('c');
  var hint = document.getElementById('hint');
  var gl = cvs.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('nogl').style.display = 'flex'; return; }

  /* ---------- シェーダ ----------
     地図テクスチャ(格子): R,G = 破片の傾き、B = ヒビの線(細い)、A = ヒビのふくらみ(ぼかした線 = バンプ)。
     1) 破片の傾きと、ヒビのふくらみの傾きの分だけ、ガラスの向こうの景色をずらして読む
        (=プラグインと同じ「明暗からバンプ→屈折」。波長ごとにずらす量を変えて12回読み、波長の色で足す)。
     2) ヒビの向きは、ふくらみの曲がり方(2階微分)から求める。光の向きとヒビの向きが合った所だけ、ヒビが白く光る。
        光はゆっくり回るので、光るヒビが移っていく。 */
  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  var FS = [
    'precision highp float;',
    'uniform sampler2D M;uniform sampler2D BG;',
    'uniform vec2 R;uniform vec2 G;uniform float flash;uniform float gone;uniform float black;uniform vec2 shake;uniform float fallV;uniform float beamW;uniform float boltS;',
    'uniform float S;uniform float S3;uniform float D;uniform float Dc;uniform float K;uniform float sheen;',
    'uniform vec3 L;',
    'vec3 wave(float t){',
    '  vec3 c=vec3(0.13,0.50,0.87);',
    '  vec3 d=clamp(1.0-abs(t-c)/vec3(0.36,0.33,0.36),0.0,1.0);',
    '  return d*d*(3.0-2.0*d);',
    '}',
    'float A(vec2 p){return texture2D(M,p).a;}',
    'void main(){',
    '  vec2 uv=vec2(gl_FragCoord.x/R.x,1.0-gl_FragCoord.y/R.y)+shake;',
    '  vec2 tx=1.0/G;',
    '  vec4 m=texture2D(M,uv);',
    '  vec2 T=(m.rg-0.5)/K*(1.0-gone);',
    '  float a0=m.a*(1.0-gone);',
    '  float aL=A(uv-vec2(tx.x,0.0)), aR=A(uv+vec2(tx.x,0.0)), aU=A(uv-vec2(0.0,tx.y)), aD=A(uv+vec2(0.0,tx.y));',
    '  float aLU=A(uv-tx), aRD=A(uv+tx), aRU=A(uv+vec2(tx.x,-tx.y)), aLD=A(uv+vec2(-tx.x,tx.y));',
    '  vec2 gA=vec2(aR-aL,aD-aU)*0.5*(1.0-gone);',
    '  float hxx=aR+aL-2.0*a0, hyy=aD+aU-2.0*a0, hxy=(aRD-aRU-aLD+aLU)*0.25;',
    '  float th=0.5*atan(2.0*hxy, hxx-hyy+1e-5);',
    '  vec2 ld=vec2(cos(th),sin(th));',
    '  vec2 cd=normalize(L.xy+vec2(0.0001));',
    '  float glint=pow(abs(dot(vec2(-ld.y,ld.x),cd)),5.0);',
    '  vec2 su=vec2(uv.x,1.0-uv.y);',
    '  vec3 acc=vec3(0.0);vec3 cs=vec3(0.0);vec3 ws=vec3(0.0);',
    '  for(int i=0;i<12;i++){',
    '    float t=(float(i)+0.5)/12.0;',
    '    float e=(t-0.5)*2.0;',
    '    float f=1.0+D*e;',
    '    vec2 o=(T*S+gA*S3)*f+(uv-0.5)*fallV*0.09*(t-0.1);',
    '    vec3 b=texture2D(BG,su+vec2(o.x,-o.y)).rgb;',
    '    float c=texture2D(M,uv+cd*Dc*1.3*e*tx).b;',
    '    vec3 w=wave(t);',
    '    acc+=w*b;cs+=w*c;ws+=w;',
    '  }',
    '  vec3 col=acc/ws;',
    '  vec3 crack=cs/ws*(1.0-gone);',
    /* ヒビ: 光っていない所はうっすら暗い筋、光の向きと合った所は白くきらめく */
    '  vec3 sc=texture2D(BG,su).rgb;',
    '  float lum=dot(sc,vec3(0.3,0.55,0.15));',
    '  col*=1.0-0.28*crack;',
    /* 割れ目は、向こう側の光(マグマの光・稲妻)を受けても光る */
    '  col+=crack*(0.06+1.05*glint+lum*0.9+flash*1.5);',
    '  col+=a0*a0*(0.16*glint+flash*0.55+lum*0.12)*vec3(0.92,0.96,1.0);',
    /* 破片: 傾いた破片は、向きが光と合うと鏡のように光る */
    '  vec3 n=normalize(vec3(-T*1.5,1.0));',
    '  float tl=min(length(T)*7.0,1.0);',
    '  float nd=max(dot(n,L),0.0);',
    '  col+=pow(nd,80.0)*0.55*tl+pow(nd,8.0)*0.03*tl+flash*0.1*tl*pow(nd,3.0);',
    /* 割れていないガラスの表面にも、うっすら光の映り込みが流れる */
    '  float sh=exp(-pow((dot(uv-0.5,cd)*2.0-sheen)*2.4,2.0))*0.045;',
    '  col+=sh*(1.0-gone);',
    '  vec2 q=uv-0.5;',
    '  col*=1.0-0.35*dot(q,q)*2.0;',
    /* ガラスの床の両側の鉄骨の枠。床が抜けると見えなくなる */
    '  float bx=min(uv.x,1.0-uv.x);',
    '  if(bx<beamW*(1.0-gone)){',
    '    float k=bx/beamW;',
    '    vec3 st=vec3(0.16,0.17,0.19)*(0.7+0.5*smoothstep(0.0,0.5,k))*(1.0-0.35*smoothstep(0.75,1.0,k));',
    '    st+=vec3(0.25)*exp(-pow((k-0.3)*9.0,2.0))*0.5;',
    '    vec2 bo=vec2((k-0.55)*beamW*R.x/R.y,fract(uv.y/boltS)*boltS-boltS*0.5);',
    '    float bl=smoothstep(0.0045,0.0025,length(bo));',
    '    st=mix(st,vec3(0.32,0.33,0.35),bl);',
    '    col=st;',
    '  }',
    '  col*=1.0-black;',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  var vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var aP = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  var U = {};
  ['M', 'BG', 'R', 'G', 'flash', 'gone', 'black', 'shake', 'fallV', 'beamW', 'boltS', 'S', 'S3', 'D', 'Dc', 'K', 'sheen', 'L'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });
  var K = 0.42;   /* 傾きを0..255に詰める倍率(±1.2まで) */

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  var texM = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texM);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  /* ---------- ガラスの向こうの景色(毎フレーム描く): マグマ / 雷雨 ----------
     景色はまず画面の半分の解像度の別の絵(フレームバッファ)に描き、ガラスのシェーダがそれを12回ずらして読む。 */
  var SVS = VS;
  var SFS = [
    'precision highp float;',
    'uniform vec2 R;uniform float t;uniform float mode;uniform float flash;uniform float boltOn;uniform sampler2D B;uniform vec3 cam;uniform float fov;',
    'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}',
    'float fbm(vec2 p){float v=0.0,a=0.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);',
    '  for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=0.5;}return v;}',
    'vec2 vor(vec2 p,float tt){vec2 i=floor(p),f=fract(p);float F1=9.0,F2=9.0;',
    '  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));',
    '    vec2 h=vec2(hash(i+g),hash(i+g+17.17));',
    '    vec2 o=g+0.5+0.38*sin(tt*0.25+6.2831*h)-f;float d=length(o);',
    '    if(d<F1){F2=F1;F1=d;}else if(d<F2){F2=d;}}',
    '  return vec2(F1,F2-F1);}',
    /* 溶岩(平面の座標pで) */
    'vec3 lava(vec2 p){',
    '  vec2 w=vec2(fbm(p*0.7+vec2(0.0,t*0.03)),fbm(p*0.7+vec2(3.1,1.7)-vec2(t*0.025,0.0)));',
    '  vec2 q=p+(w-0.5)*1.4;',
    '  vec2 v=vor(q*1.6,t);float edge=v.y;',
    '  float n1=fbm(q*3.0-t*0.05);',
    '  float seam=exp(-edge*11.0/(0.35+n1));',
    '  float pool=smoothstep(0.34,0.24,fbm(q*0.9+vec2(t*0.02,0.0)));',
    '  float heat=max(seam,pool)*(0.75+0.35*smoothstep(0.3,0.7,fbm(q*0.5-t*0.03)));',
    '  heat*=0.8+0.2*sin(t*1.7+n1*9.0);',
    '  float rough=fbm(q*7.0+3.0);',
    '  vec3 crust=vec3(0.075,0.058,0.05)*(0.25+1.6*rough*rough);',
    '  crust+=vec3(0.5,0.07,0.0)*exp(-edge*6.0)*0.22*(0.5+n1);',
    '  vec3 lv=vec3(0.9,0.12,0.0)*heat+vec3(1.0,0.5,0.05)*pow(heat,2.5)+vec3(1.0,0.9,0.55)*pow(heat,7.0);',
    '  lv*=0.75+0.5*fbm(q*5.0+t*0.15);',
    '  float m=smoothstep(0.15,0.6,heat);',
    '  return mix(crust,lv,m)+lv*0.3*(1.0-m)+vec3(0.16,0.025,0.0)*exp(-edge*2.5)*0.18;',
    '}',
    /* ---- 街: 真上から見下ろす。区画ごとにビルが1本。光線をマス目ごとに進めて当たりを探す ---- */
    'float bh(vec2 c){float h=hash(c+0.37);if(h<0.08)return 0.0;',
    '  float tall=pow(hash(c+3.1),5.0);return 2.5+tall*52.0+hash(c+7.7)*9.0*hash(c+2.2);}',
    'float ins(vec2 c){return 0.11+0.08*hash(c+11.3);}',
    'vec3 city(vec3 ro,vec3 rd,float night){',
    '  vec2 cell=floor(ro.xy);',
    '  vec2 rdv=rd.xy+vec2(1e-5);',
    '  vec2 sv=sign(rdv);',
    '  vec2 tD=abs(1.0/rdv);',
    '  vec2 tM=(cell+max(sv,0.0)-ro.xy)/rdv;',
    '  float tG=ro.z/(-rd.z);',
    '  float tHit=tG;float kind=0.0;vec3 nn=vec3(0.0,0.0,1.0);vec2 hc=cell;float hh=0.0;',
    '  for(int i=0;i<90;i++){',
    '    float tE=min(tM.x,tM.y);',
    '    float h=bh(cell);',
    '    if(h>0.0){float b=ins(cell);',
    '      vec3 bmin=vec3(cell+b,0.0),bmax=vec3(cell+1.0-b,h);',
    '      vec3 t1=(bmin-ro)/vec3(rdv,rd.z),t2=(bmax-ro)/vec3(rdv,rd.z);',
    '      vec3 tn=min(t1,t2),tf=max(t1,t2);',
    '      float tN=max(max(tn.x,tn.y),tn.z),tF=min(min(tf.x,tf.y),tf.z);',
    '      if(tN<=tF&&tF>0.0){tHit=tN;hc=cell;hh=h;',
    '        if(tN==tn.z){kind=1.0;nn=vec3(0.0,0.0,1.0);}',
    '        else if(tN==tn.x){kind=2.0;nn=vec3(-sv.x,0.0,0.0);}',
    '        else {kind=2.0;nn=vec3(0.0,-sv.y,0.0);}',
    '        break;}',
    '    }',
    '    if(tG<tE){tHit=tG;kind=0.0;hc=cell;break;}',
    '    if(tM.x<tM.y){cell.x+=sv.x;tM.x+=tD.x;}else{cell.y+=sv.y;tM.y+=tD.y;}',
    '  }',
    '  vec3 pos=ro+rd*tHit;',
    '  vec3 sun=normalize(vec3(0.45,0.3,0.84));',
    '  vec3 col;',
    '  if(kind>1.5){',
    /* 壁と窓 */
    '    float u=abs(nn.x)>0.5?pos.y:pos.x;',
    '    vec2 wi=vec2(floor(u*5.0),floor(pos.z*2.2));',
    '    float wu=fract(u*5.0),wz=fract(pos.z*2.2);',
    '    float win=step(0.16,wu)*step(wu,0.84)*step(0.22,wz)*step(wz,0.86);',
    '    vec3 base=mix(vec3(0.34,0.35,0.37),vec3(0.56,0.53,0.48),hash(hc+1.0));',
    '    float ao=0.45+0.55*clamp(pos.z/10.0,0.0,1.0);',
    '    float sl=max(dot(nn,sun),0.0);vec3 dayc=mix(base,vec3(0.16,0.21,0.27)+0.12*hash(wi+hc),win)*(0.32+0.95*sl)*ao+vec3(0.0,0.02,0.05)*(1.0-sl);',
    '    float lit=step(0.58,hash(wi+hc*7.0));',
    '    vec3 nightc=mix(vec3(0.025,0.03,0.045),vec3(1.0,0.74,0.42)*(0.45+0.6*hash(wi*1.3+hc)),win*lit)+vec3(0.02,0.025,0.04)*ao;',
    '    col=mix(dayc,nightc,night);',
    '  }else if(kind>0.5){',
    /* 屋上 */
    '    vec2 lp=fract(pos.xy);',
    '    float e=min(min(lp.x-ins(hc),1.0-ins(hc)-lp.x),min(lp.y-ins(hc),1.0-ins(hc)-lp.y));',
    '    float rk=hash(hc+5.5);vec3 rc=(rk<0.3?vec3(0.2,0.21,0.22):rk<0.6?vec3(0.46,0.47,0.48):rk<0.8?vec3(0.58,0.55,0.5):vec3(0.32,0.38,0.36))*(0.85+0.3*fbm(pos.xy*10.0));',
    '    vec2 ac=fract(pos.xy*3.0+hash(hc))-0.5;rc*=1.0-0.4*step(max(abs(ac.x),abs(ac.y)),0.12)*step(0.55,hash(floor(pos.xy*3.0)));',
    '    rc*=0.75+0.25*smoothstep(0.0,0.025,e);',
    '    vec3 dayc=rc*(0.55+0.6*sun.z);',
    '    vec3 nightc=vec3(0.035,0.038,0.05)*(0.7+0.5*noise(pos.xy*14.0));',
    '    float tallR=step(36.0,hh);',
    '    nightc+=vec3(1.0,0.1,0.05)*tallR*step(0.5,fract(t*0.7+hash(hc)))*exp(-length(lp-0.5)*40.0)*3.0;',
    '    col=mix(dayc,nightc,night);',
    '  }else{',
    /* 地面: 車道・歩道・公園・車 */
    '    vec2 lp=fract(pos.xy);',
    '    float b=ins(hc);',
    '    float dx=min(lp.x,1.0-lp.x),dy=min(lp.y,1.0-lp.y);',
    '    float hb=bh(hc);',
    '    float walk=step(b-0.035,dx)*step(b-0.035,dy);',
    '    vec3 asph=vec3(0.2,0.205,0.21)*(0.85+0.3*noise(pos.xy*30.0));',
    '    vec3 side=vec3(0.48,0.47,0.45);',
    '    vec3 park=vec3(0.16,0.27,0.13)*(0.6+0.8*fbm(pos.xy*9.0));',
    '    vec3 g=mix(asph,hb>0.0?side:park,walk);',
    '    float mark=step(dx,0.006)*step(0.5,fract(pos.y*4.0))*step(b,dy)+step(dy,0.006)*step(0.5,fract(pos.x*4.0))*step(b,dx);',

    tiltShard(who, Math.cos(an) * mag, Math.sin(an) * mag);
    scheduleSplit(a, clock + (forced ? 1.5 : 0)); scheduleSplit(b, clock + (forced ? 1.5 : 0));
    if (deadCount > 400) { leaves = leaves.filter(function (s) { return !s.dead; }); deadCount = 0; }
    return true;
  }
  /* 決まった2点の間を、ギザギザのヒビが数フレームかけて走る */
  function runFromTo(ax, ay, bx, by, I) {
    var dx = bx - ax, dy = by - ay, l = Math.sqrt(dx * dx + dy * dy);
    var n = Math.max(1, Math.min(10, Math.round(l / (minG * 0.03))));
    for (var s = 1; s <= n; s++) (function (s) {
      var x0 = ax + dx * (s - 1) / n, y0 = ay + dy * (s - 1) / n;
      var x1 = ax + dx * s / n, y1 = ay + dy * s / n;
      events.push({ t: clock + s * 0.012, fn: function () { jag(x0, y0, x1, y1, I); } });
    })(s);
  }

  /* ---------- 走り続けるヒビ ----------
     先端は、最初は一瞬で走り、だんだん遅くなって、最後はじわじわ這う。
     ときどき枝分かれし、別のヒビにぶつかったら止まる(本物のガラスと同じ)。 */
  function spawnRunner(x, y, a, v0, I, maxDist, gen) {
    if (runners.length > 90) return;
    runners.push({ x: x, y: y, a: a, v: v0, I: I, dist: 0, maxDist: maxDist, gen: gen || 0, acc: 0, curve: (Math.random() - 0.5) * 0.04, home: [x, y] });
  }
  function stepRunners(dt) {
    var vmin = minG * 0.006;
    for (var i = runners.length - 1; i >= 0; i--) {
      var r = runners[i];
      r.v = Math.max(vmin, r.v * Math.exp(-dt * 3.2));
      r.acc += r.v * dt;
      var stop = false;
      var guard = 0;
      while (r.acc > 2.6 && !stop && guard++ < 60) {
        r.acc -= 2.6;
        r.a += r.curve + (Math.random() - 0.5) * 0.42;
        var nx = r.x + Math.cos(r.a) * 2.6, ny = r.y + Math.sin(r.a) * 2.6;
        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) { stop = true; break; }
        /* 少し先に別のヒビがあれば、そこまで走って止まる */
        var lx = nx + Math.cos(r.a) * 1.6, ly = ny + Math.sin(r.a) * 1.6;
        var hx = r.x - r.home[0], hy = r.y - r.home[1];
        if (lx >= 0 && ly >= 0 && lx < gw && ly < gh && hx * hx + hy * hy > 36 && Cs[(ly | 0) * gw + (lx | 0)] > 0.3) {
          seg(r.x, r.y, lx, ly, r.I); stop = true; break;
        }
        seg(r.x, r.y, nx, ny, r.I * (0.75 + Math.random() * 0.3));
        r.x = nx; r.y = ny; r.dist += 2.6;
        if (r.gen < 3 && Math.random() < 0.012) {
          var side = Math.random() < 0.5 ? -1 : 1;
          spawnRunner(r.x, r.y, r.a + side * (0.4 + Math.random() * 0.5), r.v * 0.7, r.I * 0.78, (r.maxDist - r.dist) * (0.3 + Math.random() * 0.4), r.gen + 1);
        }
        if (r.dist > r.maxDist) stop = true;
      }
      if (stop) runners.splice(i, 1);
    }
  }

  /* 叩く: 中心は粉々、放射状のヒビと同心円のヒビ。破片は中心へ向かってへこむ */
  function impact(cx, cy, R) {
    var N = 8 + ((Math.random() * 6) | 0);
    var M = 4 + (Math.random() < 0.5 ? 1 : 0);
    var r = [R * (0.06 + Math.random() * 0.03)];
    var steps = [], sum = 0, m, k;
    for (m = 0; m < M; m++) { var st = 0.55 + Math.random() * 0.9; st *= Math.pow(1.25, m); steps.push(st); sum += st; }
    for (m = 0; m < M; m++) r.push(r[m] + (R - r[0]) * steps[m] / sum);
    var th0 = Math.random() * 6.2832;
    var ang = [];
    for (k = 0; k < N; k++) ang.push(th0 + (k + (Math.random() - 0.5) * 0.55) * 6.2832 / N);
    var V = [];
    for (k = 0; k < N; k++) {
      V.push([]);
      for (m = 0; m <= M; m++) {
        var a = ang[k] + (m ? (Math.random() - 0.5) * 0.16 : 0);
        var rr = r[m] * (1 + (Math.random() - 0.5) * 0.14);
        V[k].push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
      }
    }
    var t0 = clock;
    function at(dt, fn) { events.push({ t: t0 + dt, fn: fn }); }
    /* 粉々の中心 */
    at(0, function () {
      var crush = r[0] * 1.6;
      for (var q = 0; q < 46; q++) {
        var ra = Math.random() * 6.2832, rd = Math.sqrt(Math.random()) * crush;
        var x = cx + Math.cos(ra) * rd, y = cy + Math.sin(ra) * rd;
        var b2 = Math.random() * 6.2832, ln = crush * (0.15 + Math.random() * 0.5);
        jag(x, y, x + Math.cos(b2) * ln, y + Math.sin(b2) * ln, 0.55 + Math.random() * 0.4);
      }
    });
    for (k = 0; k < N; k++) (function (k) {
      at(0, function () { jag(cx, cy, V[k][0][0], V[k][0][1], 1); });
      for (var m2 = 0; m2 < M; m2++) (function (m2) {
        at(0.025 * (m2 + 1), function () { jag(V[k][m2][0], V[k][m2][1], V[k][m2 + 1][0], V[k][m2 + 1][1], 1 - m2 * 0.06); });
      })(m2);
      /* 外へは、走り続けるヒビとしてのびていく */
      if (Math.random() < 0.8) {
        at(0.025 * (M + 1), function () {
          spawnRunner(V[k][M][0], V[k][M][1], ang[k] + (Math.random() - 0.5) * 0.2, minG * (2.5 + Math.random() * 2), 0.82,
            R * (0.25 + Math.pow(Math.random(), 1.5) * 2.4), 0);
        });
      }
    })(k);
    for (m = 0; m <= M; m++) (function (m) {
      for (var k2 = 0; k2 < N; k2++) (function (k2) {
        var k3 = (k2 + 1) % N;
        {
          at(0.06 + 0.045 * m + Math.random() * 0.1, function () { jag(V[k2][m][0], V[k2][m][1], V[k3][m][0], V[k3][m][1], 0.8 - m * 0.05); });
        }
        var poly = m === 0 ? [[cx, cy], V[k2][0], V[k3][0]] : [V[k2][m - 1], V[k3][m - 1], V[k3][m], V[k2][m]];
        at(0.09 + 0.045 * m, function () {
          var sh = makeShard(poly, 0);
          var ex = cx - sh.cx, ey = cy - sh.cy, dd = Math.sqrt(ex * ex + ey * ey) || 1;
          var dent = 0.26 * Math.exp(-dd / R * 1.4);
          var rnd = 0.05 + 0.07 * Math.random(), ra = Math.random() * 6.2832;
          leaves.push(sh);
          tiltShard(sh, ex / dd * dent + Math.cos(ra) * rnd, ey / dd * dent + Math.sin(ra) * rnd);
          scheduleSplit(sh, clock, dd / R * 0.8);
        });
      })(k2);
    })(m);
  }

  /* ---------- 大きさ ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; Hc = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(Hc * DPR);
    gl.viewport(0, 0, cvs.width, cvs.height);
    sizeScene();
    var ngs = Math.min(1.25, Math.sqrt(420000 / (W * Hc)));
    var nw = Math.max(16, Math.round(W * ngs)), nh = Math.max(16, Math.round(Hc * ngs));
    if (nw === gw && nh === gh && Tx) return;
    gs = ngs; gw = nw; gh = nh; minG = Math.min(gw, gh);
    minArea = Math.pow(minG * 0.022, 2);
    allocGrid();
    gl.bindTexture(gl.TEXTURE_2D, texM);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    freshPane();
  }
  function freshPane(clean) {
    Tx.fill(0); Ty.fill(0); Cs.fill(0); Ca.fill(0);
    leaves = []; events = []; runners = []; deadCount = 0;
    stress = 0;
    dirty = [0, gh - 1];
    if (clean) return;
    events.push({ t: clock + 0.6, fn: function () {
      impact(gw * (0.42 + Math.random() * 0.16), gh * (0.38 + Math.random() * 0.14), minG * (0.34 + Math.random() * 0.08));
      stress = 1;
    } });
  }

  /* ---------- 床が抜ける ----------
     叩くたび・砕くたびに、ガラスにひずみ(stress)がたまる。限界の手前でガラスはきしみ出し、
     限界を超えると床が抜けて、まっさかさまに落ちる。底で暗転して、新しいガラスの上に戻る。 */
  var stress = 0, STRESS_MAX = 7;
  var fallT = -1;            /* 落ち始めた時刻(-1 = 立っている) */
  var camX = 0.5, camY = 0, camZ = 430;
  var shakeAmt = 0, creak = 2;
  function addStress(v) {
    if (fallT >= 0) return;
    stress += v;
    if (stress >= STRESS_MAX) { fallT = clock; shakeAmt = 1; }
  }

  /* ---------- 操作 ---------- */
  var pointers = {};
  var hintHidden = false;
  function hideHint() { if (hintHidden) return; hintHidden = true; hint.classList.remove('on'); }
  var lastSmall = -9;

  function crumbleAt(x, y, p) {
    var hit = null, i;
    for (i = leaves.length - 1; i >= 0; i--) { var s = leaves[i]; if (!s.dead && inside(s, x, y)) { hit = s; break; } }
    if (!hit) {
      if (!p.small && clock - lastSmall > 0.45) { p.small = true; lastSmall = clock; impact(x, y, minG * (0.1 + Math.random() * 0.05)); addStress(0.5); }
      return;
    }
    if (splitShard(hit, true)) addStress(0.05);
    var r = minG * 0.06, r2 = r * r, cand = [];
    for (i = leaves.length - 1; i >= 0 && cand.length < 6; i--) {
      var t = leaves[i]; if (t.dead) continue;
      var ex = t.cx - x, ey = t.cy - y;
      if (ex * ex + ey * ey < r2) cand.push(t);
    }
    if (cand.length) splitShard(cand[(Math.random() * cand.length) | 0], true);
  }

  cvs.addEventListener('pointerdown', function (e) {
    if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
    e.preventDefault();
    hideHint();
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t0: performance.now(),
      moved: false, active: false, acc: 0, small: false };
  });
  cvs.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    e.preventDefault();
    if (!p.moved && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 8) { p.moved = true; p.active = true; }
    p.x = e.clientX; p.y = e.clientY;
  });
  function up(e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    if (fallT < 0 && !p.active && performance.now() - p.t0 < 280) { impact(p.x * gs, p.y * gs, minG * (0.24 + Math.random() * 0.2)); addStress(1); shakeAmt = Math.max(shakeAmt, 0.35); }
    delete pointers[e.pointerId];
  }
  cvs.addEventListener('pointerup', up);
  cvs.addEventListener('pointercancel', function (e) { delete pointers[e.pointerId]; });

  /* ---------- ループ ---------- */
  var last = performance.now();
  var creep = 3;
  var fadeIn = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000) * timeScale; last = now;
    clock += dt;

    for (var id in pointers) {
      var p = pointers[id];
      if (!p.active && now - p.t0 > 280) p.active = true;
      if (p.active && fallT < 0) {
        p.acc += dt;
        while (p.acc > 0.07) { p.acc -= 0.07; crumbleAt(p.x * gs, p.y * gs, p); }
      }
    }

    var budget = 220, keep = [];
    events.sort(function (a, b) { return a.t - b.t; });
    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      if (ev.t <= clock && budget > 0) { ev.fn(); budget--; }
      else keep.push(ev);
    }
    events = keep;
    stepRunners(dt);

    /* ガラスはひずみを抱えていて、ときどきどこかのヒビの端から、新しいヒビがじわっと走り出す */
    creep -= dt;
    if (creep <= 0) {
      creep = 3 + Math.random() * 4;
      for (var tries = 0; tries < 10 && leaves.length; tries++) {
        var s = leaves[(Math.random() * leaves.length) | 0];
        if (s.dead) continue;
        if (Math.random() < 0.5 && s.area > minArea * 3) { splitShard(s, false); break; }
        var vv = s.v[(Math.random() * s.v.length) | 0];
        spawnRunner(vv[0], vv[1], Math.random() * 6.2832, minG * 0.05, 0.6, minG * (0.08 + Math.random() * 0.3), 1);
        break;
      }
    }

    /* 立っている間は、足もとがゆっくり流れていく(街なら道の真上を進む) */
    var gone = 0, black = 0, fallV = 0;
    if (fallT < 0) {
      camZ = MODE_H[mode];
      camX += dt * 0.035 * (mode <= 1 ? 1 : 30);
      if (mode <= 1) camY = 0;
      /* 限界が近いと、ガラスがきしむ: ヒビが勝手に走り、足もとが揺れる */
      if (stress > STRESS_MAX * 0.6) {
        creak -= dt;
        if (creak <= 0) {
          creak = 0.8 + Math.random() * 1.6;
          shakeAmt = Math.max(shakeAmt, 0.22);
          var lv = leaves.length ? leaves[(Math.random() * leaves.length) | 0] : null;
          if (lv && !lv.dead) { var v0 = lv.v[0]; spawnRunner(v0[0], v0[1], Math.random() * 6.2832, minG * 1.2, 0.75, minG * (0.15 + Math.random() * 0.3), 1); }
        }
      }
    } else {
      var fs = clock - fallT;
      if (fs < 0.55) {
        /* 抜ける直前: 一気にヒビが走る */
        if (Math.random() < 0.5 && leaves.length) { var lw = leaves[(Math.random() * leaves.length) | 0]; if (!lw.dead) splitShard(lw, true); }
        shakeAmt = Math.max(shakeAmt, 0.6);
      } else {
        var ft = fs - 0.55;
        gone = Math.min(1, ft / 0.35);
        var G = MODE_G[mode], H0 = MODE_H[mode];
        camZ = Math.max(0.4, H0 - 0.5 * G * ft * ft);
        shakeAmt = Math.max(shakeAmt, 0.25 * (1 - gone) + 0.08);
        black = Math.min(1, Math.max(0, (6 - camZ) / 5.6));
        fallV = Math.min(1, ft / 2.2);
        if (camZ <= 0.4) {
          var hold = ft - Math.sqrt(2 * (H0 - 0.4) / G);
          black = 1;
          if (hold > 0.7) { fallT = -1; freshPane(true); camZ = MODE_H[mode]; fadeIn = 1; }
        }
      }
    }
    if (fadeIn > 0) { black = Math.max(black, fadeIn); fadeIn = Math.max(0, fadeIn - dt / 0.9); }
    shakeAmt = Math.max(0, shakeAmt - dt * 1.4);
    var shx = (Math.random() - 0.5) * shakeAmt * 0.012, shy = (Math.random() - 0.5) * shakeAmt * 0.012;

    upload();

    /* 雷: 雷雲の上のときだけ、ときどき落ちる(ときどき雲の中だけ光る) */
    var fl = 0, bo = 0;
    if (mode === 3) {
      nextStrike -= dt;
      if (nextStrike <= 0) {
        strikeT = clock; strikeSheet = Math.random() < 0.3;
        if (!strikeSheet) drawBolt();
        nextStrike = 2.5 + Math.random() * 6.5;
      }
      var ss = clock - strikeT;
      fl = flashAt(ss, false) * (strikeSheet ? 0.4 : 1);
      bo = strikeSheet ? 0 : Math.min(1, flashAt(ss, true) * 1.3);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, sw, shh);
    gl.useProgram(sprog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.enableVertexAttribArray(aPs);
    gl.vertexAttribPointer(aPs, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texBolt);
    gl.uniform1i(SU.B, 1);
    gl.uniform2f(SU.R, sw, shh);
    gl.uniform1f(SU.t, clock);
    gl.uniform1f(SU.mode, mode);
    gl.uniform1f(SU.flash, fl);
    gl.uniform1f(SU.boltOn, bo);
    var shk = 3;
    gl.uniform3f(SU.cam, camX + shx * shk, camY + shy * shk, camZ);
    gl.uniform1f(SU.fov, MODE_F[mode]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cvs.width, cvs.height);

    gl.useProgram(prog);
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texScene);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texM);

    var la = clock * 0.19;
    var lx = Math.cos(la) * 0.62, ly = Math.sin(la) * 0.62, lz = 1;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    gl.uniform1i(U.M, 0);
    gl.uniform1i(U.BG, 1);
    gl.uniform2f(U.R, cvs.width, cvs.height);
    gl.uniform2f(U.G, gw, gh);
    gl.uniform1f(U.flash, fl);
    gl.uniform1f(U.gone, gone);
    gl.uniform1f(U.black, black);
    gl.uniform2f(U.shake, shx, shy);
    gl.uniform1f(U.fallV, fallV);
    gl.uniform1f(U.beamW, Math.min(0.08, 20 / W));
    gl.uniform1f(U.boltS, 46 / Hc);
    gl.uniform1f(U.S, 0.04);
    gl.uniform1f(U.S3, 0.01);
    gl.uniform1f(U.D, glass.D);
    gl.uniform1f(U.Dc, glass.Dc);
    gl.uniform1f(U.K, K);
    gl.uniform1f(U.sheen, Math.sin(clock * 0.13) * 1.4);
    gl.uniform3f(U.L, lx / ll, ly / ll, lz / ll);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  setTimeout(function () { if (!hintHidden) hint.classList.add('on'); }, 900);
  setTimeout(hideHint, 8500);
  requestAnimationFrame(frame);

  /* ---- 共有コントロール(ap-kit.js) ---- */
  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'hairline',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {   /* 足もとの景色を 昼の街→夜の街→火口→雷雲の上 と切り替え、ガラスの種類(虹の幅)も替える。割れ方はそのまま */
          mode = (mode + 1) % 4; nextStrike = 0.8; strikeT = -99; clearBolt(); camZ = MODE_H[mode];
          glass.D = 0.18 + Math.random() * 0.25;
          glass.Dc = 0.5 + Math.random() * 0.7;
        } },
        { label: '↻', name: 'reset', onClick: function () { if (fallT < 0) freshPane(); } }   /* 新しい一枚ガラス */
      ]
    });
  }
})();
</script>
</body>
</html>
