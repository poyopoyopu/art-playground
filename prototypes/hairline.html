<!DOCTYPE html>
<!-- HAIRLINE — クロちゃん(Claude)作。おっちゃんが見せてくれたYMM4プラグイン「I_DistortChroma」(Panko200氏、MITライセンス:
     画像の明暗差からバンプマップを計算し、光の屈折に従ってRGBがずれて描画される)の仕組みを、ブラウザ(WebGL)で一から組み直した作品。
     プラグインのコードは使っていない。GLASS CLAY(つまらん)の作り直しで、おっちゃんが3案から「割れるほど増える虹」を選んだ。
     v2: 「リアルさが足りない」で作り直し。ヒビをギザギザの細い線にし、光の向きで光らせる。割れ目は少しずつ走って伸び、別のヒビに当たると止まる。
     叩いた中心は粉々に。v3: 「背景がつまらん、リアルなマグマとかリアルな雷雨とか」でガラスの向こうを動くマグマ/雷雨に。ap-kit.js統合: クロちゃん -->
<!-- 世界のルール: この一枚ガラスには色が無い。虹は「割れ目」にだけ宿る。割れ目の縁で光が曲がり、波長ごとに曲がり方が違うから。
     そして、一度入ったヒビは自分で育つ。大きな破片の中に小さなヒビが走り、その破片の中にさらに小さなヒビが走る(最大6階層の入れ子)。
     走り出したヒビは止まらずにのび続け、別のヒビにぶつかったところで止まる。ガラスは二度と元に戻らない。割るほど、虹が増える。
     ・タップ … 叩く。そこを中心に蜘蛛の巣状のヒビ(放射状+同心円)が入り、中心は粉々に。破片は中心へ向かって少しへこむ(傾く)。
     ・押さえる/なぞる … 指の下の破片を細かく砕く。割れていない所で押さえると、小さく割れる。
     ・放っておく … ヒビの先がじわじわ走り、破片の中に新しいヒビが入っていく。破片はそれぞれ違う向きに傾いているので、光が回るとひとつずつ光る。
     ・✦ … ガラスの向こうをマグマ⇔雷雨に切り替え、ガラスの種類(虹の幅)も替える。割れ方はそのまま。
     ・雷雨では、稲妻が光るたびに割れ目が一斉に白く浮かぶ。マグマでは、割れ目が溶岩の光を受けて赤く光る。
     ・↻ … 新しい一枚ガラス(真ん中を一回叩いたところから)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>HAIRLINE — 割れ目にだけ、虹が宿る</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #10131a; overflow: hidden; overscroll-behavior: none; }
  body {
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 12px; line-height: 1.9; letter-spacing: .07em;
    color: #f2f4f8; opacity: 0; transition: opacity 1.6s ease;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .9);
  }
  #hint.on { opacity: .85; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #ddd; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">タップ ＝ 叩いて割る　押さえる・なぞる ＝ 細かく砕く<br>ヒビは勝手に走る。割れ目にだけ虹が出る</div>
<div id="nogl">WebGLが使えない環境です</div>
<script>
(function () {
  'use strict';

  var cvs = document.getElementById('c');
  var hint = document.getElementById('hint');
  var gl = cvs.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('nogl').style.display = 'flex'; return; }

  /* ---------- シェーダ ----------
     地図テクスチャ(格子): R,G = 破片の傾き、B = ヒビの線(細い)、A = ヒビのふくらみ(ぼかした線 = バンプ)。
     1) 破片の傾きと、ヒビのふくらみの傾きの分だけ、ガラスの向こうの景色をずらして読む
        (=プラグインと同じ「明暗からバンプ→屈折」。波長ごとにずらす量を変えて12回読み、波長の色で足す)。
     2) ヒビの向きは、ふくらみの曲がり方(2階微分)から求める。光の向きとヒビの向きが合った所だけ、ヒビが白く光る。
        光はゆっくり回るので、光るヒビが移っていく。 */
  var VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}';
  var FS = [
    'precision highp float;',
    'uniform sampler2D M;uniform sampler2D BG;',
    'uniform vec2 R;uniform vec2 G;uniform float flash;',
    'uniform float S;uniform float S3;uniform float D;uniform float Dc;uniform float K;uniform float sheen;',
    'uniform vec3 L;',
    'vec3 wave(float t){',
    '  vec3 c=vec3(0.13,0.50,0.87);',
    '  vec3 d=clamp(1.0-abs(t-c)/vec3(0.36,0.33,0.36),0.0,1.0);',
    '  return d*d*(3.0-2.0*d);',
    '}',
    'float A(vec2 p){return texture2D(M,p).a;}',
    'void main(){',
    '  vec2 uv=vec2(gl_FragCoord.x/R.x,1.0-gl_FragCoord.y/R.y);',
    '  vec2 tx=1.0/G;',
    '  vec4 m=texture2D(M,uv);',
    '  vec2 T=(m.rg-0.5)/K;',
    '  float a0=m.a;',
    '  float aL=A(uv-vec2(tx.x,0.0)), aR=A(uv+vec2(tx.x,0.0)), aU=A(uv-vec2(0.0,tx.y)), aD=A(uv+vec2(0.0,tx.y));',
    '  float aLU=A(uv-tx), aRD=A(uv+tx), aRU=A(uv+vec2(tx.x,-tx.y)), aLD=A(uv+vec2(-tx.x,tx.y));',
    '  vec2 gA=vec2(aR-aL,aD-aU)*0.5;',
    '  float hxx=aR+aL-2.0*a0, hyy=aD+aU-2.0*a0, hxy=(aRD-aRU-aLD+aLU)*0.25;',
    '  float th=0.5*atan(2.0*hxy, hxx-hyy+1e-5);',
    '  vec2 ld=vec2(cos(th),sin(th));',
    '  vec2 cd=normalize(L.xy+vec2(0.0001));',
    '  float glint=pow(abs(dot(vec2(-ld.y,ld.x),cd)),5.0);',
    '  vec2 su=vec2(uv.x,1.0-uv.y);',
    '  vec3 acc=vec3(0.0);vec3 cs=vec3(0.0);vec3 ws=vec3(0.0);',
    '  for(int i=0;i<12;i++){',
    '    float t=(float(i)+0.5)/12.0;',
    '    float e=(t-0.5)*2.0;',
    '    float f=1.0+D*e;',
    '    vec2 o=(T*S+gA*S3)*f;',
    '    vec3 b=texture2D(BG,su+vec2(o.x,-o.y)).rgb;',
    '    float c=texture2D(M,uv+cd*Dc*1.3*e*tx).b;',
    '    vec3 w=wave(t);',
    '    acc+=w*b;cs+=w*c;ws+=w;',
    '  }',
    '  vec3 col=acc/ws;',
    '  vec3 crack=cs/ws;',
    /* ヒビ: 光っていない所はうっすら暗い筋、光の向きと合った所は白くきらめく */
    '  vec3 sc=texture2D(BG,su).rgb;',
    '  float lum=dot(sc,vec3(0.3,0.55,0.15));',
    '  col*=1.0-0.28*crack;',
    /* 割れ目は、向こう側の光(マグマの光・稲妻)を受けても光る */
    '  col+=crack*(0.06+1.05*glint+lum*0.9+flash*1.5);',
    '  col+=a0*a0*(0.16*glint+flash*0.55+lum*0.12)*vec3(0.92,0.96,1.0);',
    /* 破片: 傾いた破片は、向きが光と合うと鏡のように光る */
    '  vec3 n=normalize(vec3(-T*1.5,1.0));',
    '  float tl=min(length(T)*7.0,1.0);',
    '  float nd=max(dot(n,L),0.0);',
    '  col+=pow(nd,80.0)*0.55*tl+pow(nd,8.0)*0.03*tl+flash*0.1*tl*pow(nd,3.0);',
    /* 割れていないガラスの表面にも、うっすら光の映り込みが流れる */
    '  float sh=exp(-pow((dot(uv-0.5,cd)*2.0-sheen)*2.4,2.0))*0.045;',
    '  col+=sh;',
    '  vec2 q=uv-0.5;',
    '  col*=1.0-0.35*dot(q,q)*2.0;',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  var vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var aP = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(aP);
  gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
  var U = {};
  ['M', 'BG', 'R', 'G', 'flash', 'S', 'S3', 'D', 'Dc', 'K', 'sheen', 'L'].forEach(function (k) { U[k] = gl.getUniformLocation(prog, k); });
  var K = 0.42;   /* 傾きを0..255に詰める倍率(±1.2まで) */

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  var texM = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texM);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  /* ---------- ガラスの向こうの景色(毎フレーム描く): マグマ / 雷雨 ----------
     景色はまず画面の半分の解像度の別の絵(フレームバッファ)に描き、ガラスのシェーダがそれを12回ずらして読む。 */
  var SVS = VS;
  var SFS = [
    'precision highp float;',
    'uniform vec2 R;uniform float t;uniform float mode;uniform float flash;uniform float boltOn;uniform sampler2D B;',
    'float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
    'float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);}',
    'float fbm(vec2 p){float v=0.0,a=0.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);',
    '  for(int i=0;i<6;i++){v+=a*noise(p);p=m*p;a*=0.5;}return v;}',
    'vec2 vor(vec2 p,float tt){vec2 i=floor(p),f=fract(p);float F1=9.0,F2=9.0;',
    '  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));',
    '    vec2 h=vec2(hash(i+g),hash(i+g+17.17));',
    '    vec2 o=g+0.5+0.38*sin(tt*0.25+6.2831*h)-f;float d=length(o);',
    '    if(d<F1){F2=F1;F1=d;}else if(d<F2){F2=d;}}',
    '  return vec2(F1,F2-F1);}',
    'vec3 magma(){',
    '  vec2 p=gl_FragCoord.xy/min(R.x,R.y)*2.6;',
    '  p+=vec2(0.02,-0.035)*t;',
    '  vec2 w=vec2(fbm(p*0.7+vec2(0.0,t*0.03)),fbm(p*0.7+vec2(3.1,1.7)-vec2(t*0.025,0.0)));',
    '  vec2 q=p+(w-0.5)*1.4;',
    '  vec2 v=vor(q*1.6,t);',
    '  float edge=v.y;',
    '  float n1=fbm(q*3.0-t*0.05);',
    /* 冷えて固まった岩の板のすき間から、溶岩がのぞく。大きな溶岩だまりもある */
    '  float seam=exp(-edge*11.0/(0.35+n1));',
    '  float pool=smoothstep(0.34,0.24,fbm(q*0.9+vec2(t*0.02,0.0)));',
    '  float heat=max(seam,pool)*(0.75+0.35*smoothstep(0.3,0.7,fbm(q*0.5-t*0.03)));',
    '  heat*=0.8+0.2*sin(t*1.7+n1*9.0);',
    '  float rough=fbm(q*7.0+3.0);',
    '  vec3 crust=vec3(0.075,0.058,0.05)*(0.25+1.6*rough*rough)+vec3(0.02,0.016,0.014)*noise(q*40.0);',
    '  crust+=vec3(0.5,0.07,0.0)*exp(-edge*6.0)*0.22*(0.5+n1);',
    '  vec3 lava=vec3(0.9,0.12,0.0)*heat+vec3(1.0,0.5,0.05)*pow(heat,2.5)+vec3(1.0,0.9,0.55)*pow(heat,7.0);',
    '  lava*=0.75+0.5*fbm(q*5.0+t*0.15);',
    '  float m=smoothstep(0.15,0.6,heat);',
    '  vec3 col=mix(crust,lava,m)+lava*0.3*(1.0-m);',
    '  col+=vec3(0.16,0.025,0.0)*exp(-edge*2.5)*0.18;',
    '  return col;',
    '}',
    'vec3 storm(){',
    '  vec2 uvS=gl_FragCoord.xy/R;',
    '  vec2 p=gl_FragCoord.xy/min(R.x,R.y);',
    '  float y=uvS.y;',
    '  vec3 sky=mix(vec3(0.17,0.18,0.21),vec3(0.05,0.06,0.075),y);',
    '  vec2 cp=p*1.8+vec2(t*0.035,0.0);',
    '  float wv=fbm(cp*0.8-vec2(t*0.02,0.0));',
    '  float c1=fbm(cp+wv*1.3);',
    '  float c2=fbm(cp*2.3+vec2(t*0.05,0.0)+c1);',
    '  float dens=smoothstep(0.3,0.8,c1*0.75+c2*0.35);',
    '  dens*=smoothstep(-0.1,0.55,y);',
    '  vec3 cloud=mix(vec3(0.07,0.075,0.09),vec3(0.27,0.28,0.32),smoothstep(0.25,0.75,c2))*(0.75+0.5*c1);',
    '  vec3 col=mix(sky,cloud,dens);',
    '  vec4 bt=texture2D(B,uvS);',
    /* 稲妻: 雲の中まで照らす光と、稲妻そのもの */
    '  col+=vec3(0.55,0.6,0.85)*flash*(0.16+bt.g*1.1)*(0.35+dens*1.3);',
    '  col+=vec3(0.92,0.95,1.0)*bt.r*boltOn*1.6+vec3(0.6,0.65,1.0)*bt.g*boltOn*0.5;',
    /* 遠くの街のにじんだ明かり */
    '  float hz=smoothstep(0.16,0.0,y);',
    '  col+=vec3(0.28,0.16,0.08)*hz*0.35*(0.6+0.4*noise(vec2(p.x*40.0,1.0)));',
    /* 雨 */
    '  vec2 rp=gl_FragCoord.xy/R.y;rp.x+=rp.y*0.12;',
    '  float rain=0.0;',
    '  for(int k=0;k<3;k++){',
    '    float fk=float(k);float sc=90.0+fk*70.0;',
    '    float cx=floor(rp.x*sc);float h=hash(vec2(cx,fk*7.1));',
    '    float fy=fract(rp.y*(1.2+fk*0.4)+t*(1.8+h*1.2+fk*0.6)+h*13.0);',
    '    float fx=abs(fract(rp.x*sc)-0.5);',
    '    rain+=smoothstep(0.1,0.0,fx)*smoothstep(0.12,0.0,fy)*smoothstep(0.0,0.01,fy)*step(0.55,h)*(0.6-fk*0.15);',
    '  }',
    '  col+=vec3(0.6,0.65,0.75)*rain*(0.2+flash*0.6);',
    '  return col;',
    '}',
    'void main(){',
    '  vec3 col=mode<0.5?magma():storm();',
    '  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);',
    '}'
  ].join('\n');
  var sprog = gl.createProgram();
  gl.attachShader(sprog, sh(gl.VERTEX_SHADER, SVS));
  gl.attachShader(sprog, sh(gl.FRAGMENT_SHADER, SFS));
  gl.linkProgram(sprog);
  var aPs = gl.getAttribLocation(sprog, 'p');
  var SU = {};
  ['R', 't', 'mode', 'flash', 'boltOn', 'B'].forEach(function (k) { SU[k] = gl.getUniformLocation(sprog, k); });

  function mkTex(wrap) {
    var tx = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tx;
  }
  var texScene = mkTex(), texBolt = mkTex();
  var fbo = gl.createFramebuffer();
  var sw = 0, shh = 0;
  function sizeScene() {
    sw = Math.max(64, Math.round(cvs.width * 0.5)); shh = Math.max(64, Math.round(cvs.height * 0.5));
    gl.bindTexture(gl.TEXTURE_2D, texScene);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sw, shh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texScene, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    boltCanvas.width = sw; boltCanvas.height = shh;
    clearBolt();
  }

  /* 稲妻は、落ちるたびにギザギザの道をCPUで描いて渡す(赤 = 芯、緑 = まわりの光) */
  var boltCanvas = document.createElement('canvas');
  function uploadBolt() {
    gl.bindTexture(gl.TEXTURE_2D, texBolt);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, boltCanvas);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  }
  function clearBolt() {
    var c = boltCanvas.getContext('2d');
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#000'; c.fillRect(0, 0, boltCanvas.width, boltCanvas.height);
    uploadBolt();
  }
  function drawBolt() {
    var c = boltCanvas.getContext('2d');
    var Wb = boltCanvas.width, Hb = boltCanvas.height, u = Math.min(Wb, Hb) / 400;
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#000'; c.fillRect(0, 0, Wb, Hb);
    var paths = [];
    function walk(x, y, a, steps, wdt, endY) {
      var pts = [[x, y]], base = a;
      for (var i = 0; i < steps; i++) {
        a = base + (Math.random() - 0.5) * 1.5;
        base += (Math.random() - 0.5) * 0.12;
        base = Math.max(0.9, Math.min(2.25, base));
        var l = (3 + Math.random() * 7) * u;
        x += Math.cos(a) * l; y += Math.sin(a) * l;
        pts.push([x, y]);
        if (Math.random() < 0.09 && wdt > 0.3) walk(x, y, base + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5), 8 + ((Math.random() * 26) | 0), wdt * 0.5, endY);
        if (endY && y > endY) break;
      }
      paths.push({ pts: pts, w: wdt });
    }
    walk(Wb * (0.15 + Math.random() * 0.7), -5, 1.5708, 400, 1, Hb * (0.45 + Math.random() * 0.5));
    c.globalCompositeOperation = 'lighter';
    c.lineJoin = 'round'; c.lineCap = 'round';
    paths.forEach(function (pth) {
      c.beginPath();
      c.moveTo(pth.pts[0][0], pth.pts[0][1]);
      for (var i = 1; i < pth.pts.length; i++) c.lineTo(pth.pts[i][0], pth.pts[i][1]);
      c.strokeStyle = 'rgba(0,255,0,' + (0.22 * pth.w) + ')'; c.lineWidth = 5 * u * pth.w;
      c.shadowColor = 'rgb(0,255,0)'; c.shadowBlur = 30 * u; c.stroke();

    for (var id in pointers) {
      var p = pointers[id];
      if (!p.active && now - p.t0 > 280) p.active = true;
      if (p.active) {
        p.acc += dt;
        while (p.acc > 0.07) { p.acc -= 0.07; crumbleAt(p.x * gs, p.y * gs, p); }
      }
    }

    var budget = 220, keep = [];
    events.sort(function (a, b) { return a.t - b.t; });
    for (var i = 0; i < events.length; i++) {
      var ev = events[i];
      if (ev.t <= clock && budget > 0) { ev.fn(); budget--; }
      else keep.push(ev);
    }
    events = keep;
    stepRunners(dt);

    /* ガラスはひずみを抱えていて、ときどきどこかのヒビの端から、新しいヒビがじわっと走り出す */
    creep -= dt;
    if (creep <= 0) {
      creep = 3 + Math.random() * 4;
      for (var tries = 0; tries < 10 && leaves.length; tries++) {
        var s = leaves[(Math.random() * leaves.length) | 0];
        if (s.dead) continue;
        if (Math.random() < 0.5 && s.area > minArea * 3) { splitShard(s, false); break; }
        var vv = s.v[(Math.random() * s.v.length) | 0];
        spawnRunner(vv[0], vv[1], Math.random() * 6.2832, minG * 0.05, 0.6, minG * (0.08 + Math.random() * 0.3), 1);
        break;
      }
    }

    upload();

    /* 雷: 雷雨のときだけ、ときどき落ちる(ときどき雲の中だけ光る) */
    var fl = 0, bo = 0;
    if (mode === 1) {
      nextStrike -= dt;
      if (nextStrike <= 0) {
        strikeT = clock; strikeSheet = Math.random() < 0.3;
        if (!strikeSheet) drawBolt();
        nextStrike = 2.5 + Math.random() * 6.5;
      }
      var ss = clock - strikeT;
      fl = flashAt(ss, false) * (strikeSheet ? 0.4 : 1);
      bo = strikeSheet ? 0 : Math.min(1, flashAt(ss, true) * 1.3);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, sw, shh);
    gl.useProgram(sprog);
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.enableVertexAttribArray(aPs);
    gl.vertexAttribPointer(aPs, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texBolt);
    gl.uniform1i(SU.B, 1);
    gl.uniform2f(SU.R, sw, shh);
    gl.uniform1f(SU.t, clock);
    gl.uniform1f(SU.mode, mode);
    gl.uniform1f(SU.flash, fl);
    gl.uniform1f(SU.boltOn, bo);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cvs.width, cvs.height);

    gl.useProgram(prog);
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texScene);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texM);

    var la = clock * 0.19;
    var lx = Math.cos(la) * 0.62, ly = Math.sin(la) * 0.62, lz = 1;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    gl.uniform1i(U.M, 0);
    gl.uniform1i(U.BG, 1);
    gl.uniform2f(U.R, cvs.width, cvs.height);
    gl.uniform2f(U.G, gw, gh);
    gl.uniform1f(U.flash, fl);
    gl.uniform1f(U.S, 0.04);
    gl.uniform1f(U.S3, 0.01);
    gl.uniform1f(U.D, glass.D);
    gl.uniform1f(U.Dc, glass.Dc);
    gl.uniform1f(U.K, K);
    gl.uniform1f(U.sheen, Math.sin(clock * 0.13) * 1.4);
    gl.uniform3f(U.L, lx / ll, ly / ll, lz / ll);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  setTimeout(function () { if (!hintHidden) hint.classList.add('on'); }, 900);
  setTimeout(hideHint, 8500);
  requestAnimationFrame(frame);

  /* ---- 共有コントロール(ap-kit.js) ---- */
  if (window.APKit) {
    window.APKit.init({
      canvas: cvs,
      gifName: 'hairline',
      clockFormat: 'spec',
      dock: true,
      autoHide: true,
      fullscreenButton: false,
      buttons: [
        { label: '✦', name: 'mutate', onClick: function () {   /* ガラスの向こうをマグマ⇔雷雨に切り替え、ガラスの種類(虹の幅)も替える。割れ方はそのまま */
          mode = 1 - mode; nextStrike = 0.8; strikeT = -99; clearBolt();
          glass.D = 0.18 + Math.random() * 0.25;
          glass.Dc = 0.5 + Math.random() * 0.7;
        } },
        { label: '↻', name: 'reset', onClick: function () { freshPane(); } }   /* 新しい一枚ガラス */
      ]
    });
  }
})();
</script>
</body>
</html>
