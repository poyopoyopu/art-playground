<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAZE — BLACK ORCHID C</title>
<script src="../ap-kit.js"></script>
<script src="orchid-engine.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  GAZE — Claude(クロちゃん)作。ap-kit.js統合: Claude / 描画は orchid-engine.js
  案C。おっちゃん提供の黒い蘭の写真から。

  世界のルール — 「見られていることに気づくと、この花は咲く」:
  指を置いてじっとしていると蕾がほどけていく。指を動かした瞬間に閉じる。
  離しても閉じる。何もしない時間だけが花を開かせるので、せっかちな人間には一生見せない。
  最後まで開ききった花は「見られた」ことになり、その一輪は二度と咲かず、
  押し花になって背景に残る。次は別の花が蕾から始まる。
*/
const O=Orchid,c=document.getElementById('c'),ctx=c.getContext('2d');
let W=0,H=0,DPR=1,R=1,CX=0,CY=0,bg=null,bgx=null,geo=null,genes=[];
let open=0,down=false,lastP=null,fullT=0,seen=0,flash=0,hint=1,shake=0;

function newFlower(seed){
  const r=O.mulberry32(seed);
  const base=seen===0&&seed===1?O.clone(O.WILD):O.randomGene(r);
  genes=[];for(let i=0;i<O.N;i++)genes.push(O.mutate(base,0.05,r));
  geo=O.buildGeo(genes,R);
}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

function orient(i,ro,bp){
  const e=ease(open),real=ro.a*Math.PI/180,bud=-Math.PI/2+(i-2.5)*0.105;
  return {ang:bud+(real-bud)*e+Math.sin(bp+i*1.17)*0.014*e+shake*Math.sin(i*2.1)*0.05,
    scale:(i===5?0.22+0.78*e:0.52+0.48*e)};
}
function paint(i,g){
  const e=open;
  return {hue:g.hue,sat:g.sat*(0.30+0.70*e),lum:g.lum*(0.50+0.80*e),
    sheen:g.sheen*(0.25+0.75*e),
    alpha:i===5?Math.max(0,Math.min(1,(e-0.42)/0.38)):1};
}

/* 見られた花は押し花になって背景に残る */
function press(){
  const r=O.mulberry32((Date.now()&0xffff)|1);
  const x=W*(0.18+r()*0.64),y=H*(0.15+r()*0.7);
  bgx.save();bgx.globalAlpha=0.20;
  bgx.translate(x,y);bgx.rotate((r()-0.5)*1.2);bgx.translate(-x,-y);
  O.drawFlower(bgx,geo,{cx:x,cy:y,bp:0,scale:0.30+r()*0.12,alpha:0.85,
    paint:function(i,g){return {hue:g.hue,sat:0.12,lum:0.30,sheen:0.10,alpha:1}}});
  bgx.restore();
}

function draw(bp){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(bg,0,0);
  O.drawFlower(ctx,geo,{cx:CX,cy:CY,bp:bp,orient:orient,paint:paint});
  if(open>0.02){ /* 開いた分だけ中心が息づく */
    const gr=ctx.createRadialGradient(CX,CY,0,CX,CY,R*(0.35+0.5*open));
    gr.addColorStop(0,'rgba(220,190,255,'+(0.10*open).toFixed(3)+')');
    gr.addColorStop(1,'rgba(220,190,255,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(CX,CY,R*(0.35+0.5*open),0,7);ctx.fill();
  }
  if(flash>0){ctx.save();ctx.globalAlpha=flash*0.28;ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);ctx.restore()}
  O.label(ctx,W,H,R,'SEEN '+String(seen).padStart(2,'0'));
  if(hint>0)O.label(ctx,W,H,R,'HOLD STILL',true,0.38*hint);
}

let last=performance.now();
function tick(){
  const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;
  if(down)open=Math.min(1,open+dt/3.1);
  else open=Math.max(0,open-dt/1.5);
  if(shake>0)shake=Math.max(0,shake-dt*4);
  if(open>=0.999){fullT+=dt;if(fullT>1.2){
    press();flash=1;seen++;open=0;fullT=0;down=false;lastP=null;
    newFlower((Date.now()&0x7fffffff)||2);hint=0;}}
  else fullT=0;
  if(flash>0)flash=Math.max(0,flash-dt*1.8);
  if(hint>0&&now>8000)hint=Math.max(0,hint-dt*0.4);
  draw(now/1000*0.55);
  requestAnimationFrame(tick);
}

c.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  down=true;lastP=[e.clientX,e.clientY];hint=0;
});
c.addEventListener('pointermove',function(e){
  if(!down||!lastP)return;
  const d=Math.hypot(e.clientX-lastP[0],e.clientY-lastP[1]);
  lastP=[e.clientX,e.clientY];
  if(d>0.8){                      /* 動かした分だけ閉じる */
    const pen=Math.min(0.5,d/40*0.22);
    if(open>0.02)shake=Math.min(1,shake+pen*2);
    open=Math.max(0,open-pen);
  }
});
function up(){down=false;lastP=null}
c.addEventListener('pointerup',up);
c.addEventListener('pointercancel',up);
c.addEventListener('contextmenu',function(e){e.preventDefault()});

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);
  c.width=W;c.height=H;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  R=Math.min(W,H)*0.34;CX=W/2;CY=H*0.46;
  bg=O.makeBG(W,H,7777);bgx=bg.getContext('2d');
  geo=O.buildGeo(genes,R);
}
window.addEventListener('resize',resize);
newFlower(1);resize();requestAnimationFrame(tick);

APKit.init({
  canvas:c,gifName:'orchid-gaze-loop',clockFormat:'spec',dock:true,autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){draw(phase)},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){newFlower((Date.now()&0x7fffffff)||3);
      open=0;fullT=0;hint=0}},
    {label:'↻',name:'reset',onClick:function(){seen=0;open=0;fullT=0;
      bg=O.makeBG(W,H,7777);bgx=bg.getContext('2d');newFlower(1);hint=1}}
  ]
});
</script>
</body></html>
