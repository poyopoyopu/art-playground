<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPECTRAL WEAVE</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<!-- SPECTRAL WEAVE — ChatGPT作。ap-kit.js統合: ChatGPT -->
<canvas id="c"></canvas>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
if(!gl){document.body.innerHTML='<div style="color:#fff;font:14px sans-serif;padding:24px">WebGL2 required.</div>';return;}
const vs="#version 300 es\nin vec2 p;\nvoid main(){ gl_Position=vec4(p,0.0,1.0); }";
const fs="#version 300 es\nprecision highp float;\nout vec4 outColor;\nuniform vec2 uRes;\nuniform float uTime;\nuniform float uSeed;\nuniform vec4 uMarks[10];\nuniform int uCount;\n\n#define PI 3.14159265359\n#define TAU 6.28318530718\n\nfloat hash21(vec2 p){\n  p=fract(p*vec2(123.34,345.45));\n  p+=dot(p,p+34.345);\n  return fract(p.x*p.y);\n}\nvec3 hsv2rgb(vec3 c){\n  vec3 p=abs(fract(c.xxx+vec3(0.0,2.0/3.0,1.0/3.0))*6.0-3.0);\n  return c.z*mix(vec3(1.0),clamp(p-1.0,0.0,1.0),c.y);\n}\nvec2 bend(vec2 q, vec2 m, float amp, float phase){\n  vec2 d=q-m;\n  float r=length(d)+0.0001;\n  float fall=exp(-r*r*5.0);\n  float a=atan(d.y,d.x);\n  float turn=amp*fall*(0.65+0.35*sin(a*2.0+phase));\n  float ca=cos(turn), sa=sin(turn);\n  d=mat2(ca,-sa,sa,ca)*d;\n  return m+d;\n}\nfloat dash(float x,float width,float gap){\n  float z=mod(x,gap);\n  return smoothstep(width,0.0,abs(z-gap*0.5));\n}\nvoid main(){\n  vec2 uv=gl_FragCoord.xy/uRes;\n  vec2 p=(uv-0.5)*vec2(uRes.x/uRes.y,1.0);\n  float t=uTime;\n  float rot=0.12*sin(t*0.37);\n  p=mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*p;\n\n  for(int i=0;i<10;i++){\n    if(i>=uCount) break;\n    vec2 m=uMarks[i].xy;\n    p=bend(p,m,uMarks[i].z,uMarks[i].w+t*0.08);\n  }\n\n  float r=length(p);\n  float ang=atan(p.y,p.x);\n  float f=0.0;\n  vec3 col=vec3(0.0);\n\n  for(int k=0;k<4;k++){\n    float fk=float(k);\n    float phase=fk*0.91+uSeed*TAU;\n    float slope=0.72+0.12*sin(phase);\n    float wave=0.12+0.025*sin(t*0.5+fk);\n\n    float a=p.x*slope+p.y;\n    a+=wave*sin(p.x*3.8+t*0.42+phase);\n    a+=0.07*sin(p.y*7.0-t*0.28+phase*2.0);\n\n    float b=p.y*slope-p.x;\n    b+=wave*cos(p.y*4.2-t*0.31+phase);\n    b+=0.06*sin(p.x*8.0+t*0.25+phase);\n\n    float da=dash(a+fk*0.17+t*(0.16+fk*0.025),0.035,0.145);\n    float db=dash(b-fk*0.11-t*(0.13+fk*0.02),0.030,0.16);\n    float edge=1.0-smoothstep(0.48,0.92,r);\n\n    vec3 c1=hsv2rgb(vec3(fract(0.03*fk+0.11*sin(a*2.0+phase)+uSeed),0.92,1.0));\n    vec3 c2=hsv2rgb(vec3(fract(0.17+0.18*fk+0.13*cos(b*1.7-phase)+uSeed*0.7),0.88,1.0));\n\n    float q1=da*edge, q2=db*edge;\n    f+=q1+q2;\n    col+=c1*q1+c2*q2;\n\n    float railA=0.5+0.5*cos(a*PI*2.0+t*0.35+phase);\n    float railB=0.5+0.5*sin(b*PI*2.0-t*0.25-phase);\n    col+=c1*(0.012*railA*edge)+c2*(0.010*railB*edge);\n  }\n\n  float knot=0.0;\n  for(int j=0;j<6;j++){\n    float fj=float(j);\n    float aa=ang+fj*PI/3.0+0.10*sin(t*0.2+fj);\n    float rr=r*(1.0+0.08*sin(aa*5.0-t*0.3));\n    float spoke=pow(max(0.0,cos(aa*7.0)),18.0);\n    knot+=spoke*exp(-rr*rr*10.0)*0.12;\n  }\n  col+=hsv2rgb(vec3(fract(0.12+t*0.018+uSeed),0.75,1.0))*knot;\n\n  vec2 cell=floor(p*34.0);\n  vec2 gv=fract(p*34.0)-0.5;\n  float h=hash21(cell+uSeed*31.0);\n  float dust=smoothstep(0.17,0.0,length(gv))*step(0.985,h);\n  col+=hsv2rgb(vec3(fract(h+uSeed+0.07*sin(t*0.2)),0.9,1.0))*dust*0.9;\n\n  col+=col*0.24*exp(-r*r*3.0);\n  col+=vec3(0.8,0.9,1.0)*pow(max(f-0.72,0.0),4.0)*1.8;\n  col*=1.08;\n  col=1.0-exp(-col*1.65);\n  col*=1.0-0.34*smoothstep(0.25,0.88,r);\n  outColor=vec4(col,1.0);\n}";
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile');return s;}
const prog=gl.createProgram();gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog)||'program link');gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uRes=gl.getUniformLocation(prog,'uRes'),uTime=gl.getUniformLocation(prog,'uTime'),uSeed=gl.getUniformLocation(prog,'uSeed'),uMarks=gl.getUniformLocation(prog,'uMarks'),uCount=gl.getUniformLocation(prog,'uCount');
let marks=[],seed=Math.random(),last=performance.now();
function resize(){const d=Math.min(devicePixelRatio||1,1.65),w=Math.max(1,Math.floor(innerWidth*d)),h=Math.max(1,Math.floor(innerHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);}
addEventListener('resize',resize,{passive:true});resize();
function addMark(x,y){const nx=x/innerWidth-0.5,ny=0.5-y/innerHeight;marks.push([nx*(innerWidth/innerHeight),ny,(0.32+Math.random()*0.26)*(Math.random()<0.5?-1:1),Math.random()*6.2831853]);if(marks.length>10)marks.shift();}
function mutate(){seed=Math.random();marks=marks.map(m=>[m[0],m[1],m[2]*(0.72+Math.random()*0.55),m[3]+(Math.random()-0.5)*1.4]);}
function reset(){marks=[];seed=Math.random();}
function render(t){gl.useProgram(prog);gl.uniform2f(uRes,canvas.width,canvas.height);gl.uniform1f(uTime,t);gl.uniform1f(uSeed,seed);gl.uniform1i(uCount,marks.length);const a=[];for(let i=0;i<10;i++){const m=marks[i]||[0,0,0,0];a.push(m[0],m[1],m[2],m[3]);}gl.uniform4fv(uMarks,a);gl.drawArrays(gl.TRIANGLES,0,3);}
function frame(now){render(now/1000);requestAnimationFrame(frame);}requestAnimationFrame(frame);
canvas.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;canvas.setPointerCapture?.(e.pointerId);addMark(e.clientX,e.clientY);e.preventDefault();},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!(e.buttons&1))return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;if(Math.random()<0.22)addMark(e.clientX,e.clientY);e.preventDefault();},{passive:false});
APKit.init({canvas,gifName:'spectral-weave-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){render(phase/6.2831853*6.0);},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
})();
</script>
</body>
</html>
