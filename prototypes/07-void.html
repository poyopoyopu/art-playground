<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VOID</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e6df}body{touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,holes=[],t=0;
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function scene(){t+=.006;x.fillStyle="#e9e6df";x.fillRect(0,0,W,H);let S=Math.min(W,H);
for(let j=0;j<34;j++){x.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,r=S*(.08+j*.018),px=W/2+Math.cos(a)*r,py=H/2+Math.sin(a)*r;
for(const h of holes){let dx=px-h.x,dy=py-h.y,q=Math.max(0,1-Math.hypot(dx,dy)/h.r);if(q){let ang=Math.atan2(dy,dx)+q*q*h.spin,rr=Math.hypot(dx,dy)*(1-q*.72);px=h.x+Math.cos(ang)*rr;py=h.y+Math.sin(ang)*rr}}
x.lineTo(px,py)}x.strokeStyle=`rgba(20,24,28,${.035+j*.0015})`;x.lineWidth=.8;x.stroke()}
for(const h of holes){h.r+=.11;h.life-=.35;h.spin*=.9997;if(h.life<0)h.life=0}
holes=holes.filter(h=>h.r<Math.max(W,H)*.75);requestAnimationFrame(scene)} 
function punch(px,py){holes.unshift({x:px,y:py,r:18,life:1,spin:(Math.random()>.5?1:-1)*2.1});holes=holes.slice(0,9)}
c.addEventListener("pointerdown",e=>punch(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)punch(e.clientX,e.clientY)});scene();
</script></body></html>
