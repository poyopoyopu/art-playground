<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>COLOR THEFT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById("c"),g=c.getContext("2d");let d,W,H;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();let scars=[],seed=Math.random()*6;function render(p=0){g.fillStyle="#030405";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let q=0;q<16;q++){g.beginPath();for(let i=0;i<=220;i++){let u=i/220,a=u*6.283+q*.17,r=S*(.03+u*.48),x=Math.cos(a)*r,y=Math.sin(a)*r;for(let m of scars){let dx=x+cx-m.x,dy=y+cy-m.y,dd=Math.hypot(dx,dy),z=Math.max(0,1-dd/180);x+=-dy*z*.32*m.sign;y+=dx*z*.32*m.sign}let n=Math.sin(u*28+q*1.7+p*2+seed)*S*.008;x+=Math.cos(a+1.57)*n;y+=Math.sin(a+1.57)*n;g.lineTo(cx+x,cy+y)}g.strokeStyle=`hsla(${(q*22+seed*80)%360},90%,62%,.20)`;g.lineWidth=1.5+q*.08;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;scars.push({x,y,sign:Math.random()<.5?-1:1,h:Math.random()*360});if(scars.length>9)scars.shift()}c.addEventListener("pointerdown",e=>add(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)add(e.clientX,e.clientY)});function mutate(){seed=Math.random()*20;scars.forEach(m=>m.h=(m.h+90+Math.random()*180)%360)}function reset(){scars=[]}APKit.init({canvas:c,gifName:"color-theft-loop",clockFormat:"spec",dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>render(p),buttons:[{label:"✦",name:"mutate",onClick:mutate},{label:"↻",name:"reset",onClick:reset}]});function loop(){render(performance.now()*.0001);requestAnimationFrame(loop)}loop();</script></body></html>
