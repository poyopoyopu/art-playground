<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEVEN SLICE</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070b}canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));
  font:9px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#c9ccd6;opacity:.5;white-space:pre;pointer-events:none;letter-spacing:.02em}
#msg{position:fixed;left:0;right:0;top:45%;text-align:center;color:#99a;font:14px/1.6 system-ui;display:none}</style>
</head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="msg">この端末ではWebGL2が使えません</div>
<script>
'use strict';
/*
  SEVEN SLICE — Claude(クロちゃん)作。ap-kit.js統合: Claude
  参考: 「7次元格子を2Dに映すとこうなる」準結晶の映像(おっちゃん提供)

  仕組み: 画面は7次元の整数格子を2次元で切った断面(de Bruijnの7方向グリッド)。
  7方向の平行線の束が重なり、交点が準結晶の頂点になる。

  世界のルール:
  ・ドラッグ = 断面を「見えない方向」へずらす(フェイゾン)。模様は平行移動せず、その場で組み替わる。
  ・タップ = その場所に転位(格子のねじれ)を刻む。線の本数がそこを中心に食い違い、渦を巻く。
    刻んだ転位は消えない。同じ場所をもう一度叩くと、ねじれが足し算で深くなる。
  ・長押し = その場所に張力(フォノン)を溜める。線がレンズのように曲がり、離してもそのまま残る。
  ・✦ = 格子の次元(対称の数)そのものを変える。刻んだ転位と張力は新しい次元でも残る。
  自己相似: 放っておくと断面の目盛りがゆっくり呼吸し、疎な線と交点の世界と、
  線が溶けて干渉模様になった世界を行き来する(同じ構造が別の縮尺で繰り返し現れる)。
*/
const c=document.getElementById('c'),hud=document.getElementById('hud');
const gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById('msg').style.display='block';throw Error('no webgl2');}

const MAXN=12,MAXD=12,MAXL=8;
const VS=`#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const FS=`#version 300 es
precision highp float;
uniform vec2 res;uniform float dpr,sp,t,hue,dens;
uniform int N,nD,nL;
uniform vec2 u1,u2;uniform float u0;
uniform vec2 dpos[${MAXD}];
uniform float bdef[${MAXD*MAXN}];
uniform vec4 lens[${MAXL}];
out vec4 o;
const float TAU=6.28318530718;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
vec3 pal(float x){return .5+.5*cos(TAU*(x+vec3(0.,.33,.67)));}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*res)/dpr;           // CSSピクセル、画面中心が原点
  float fN=float(N);
  // 転位: 各中心まわりの角度(巻き数×角度が各方向の位相に足される)
  float th[${MAXD}];vec2 gth[${MAXD}];float near=0.;
  for(int k=0;k<nD;k++){
    vec2 v=p-dpos[k];float r2=max(dot(v,v),4.);
    th[k]=atan(v.y,v.x)/TAU;gth[k]=vec2(-v.y,v.x)/(r2*TAU);
    near=max(near,exp(-r2/900.));
  }
  // 張力: 放射状の変位場
  vec2 D=vec2(0.);
  for(int k=0;k<nL;k++){
    vec2 v=p-lens[k].xy;float R=lens[k].z;
    D+=v*lens[k].w*exp(-dot(v,v)/(R*R));
  }
  float dist[${MAXN}];float bri[${MAXN}];
  vec3 col=vec3(0.);float q=0.;
  for(int j=0;j<N;j++){
    float a=TAU*float(j)/fN;
    vec2 n=vec2(cos(a),sin(a));
    // 断面の位置(内部空間の2つの回転表現 + 対角成分)
    float a2=TAU*2.*float(j)/fN,a3=TAU*3.*float(j)/fN;
    float ph=dot(u1,vec2(cos(a2),sin(a2)))+dot(u2,vec2(cos(a3),sin(a3)))+u0;
    float sb=dot(p+D,n)/sp+ph;
    vec2 g=vec2(dFdx(sb),dFdy(sb));
    float s=sb;vec2 gd=vec2(0.);
    for(int k=0;k<nD;k++){float bb=bdef[k*${MAXN}+j];s+=bb*th[k];gd+=bb*gth[k];}
    float glen=length(g+gd/dpr)+1e-4;
    float dpx=abs(fract(s+.5)-.5)/glen/dpr;         // 最寄りの線までの距離(CSSpx)
    dist[j]=dpx;
    q+=cos(TAU*s);
    // 線ごとの明るさ: 線に沿ってゆっくり明滅する光の筋
    vec2 tdir=vec2(-n.y,n.x);
    float along=dot(p,tdir)/(sp*5.);
    float b=vn(vec2(s*.23+float(j)*7.1,along-t*.18+float(j)));
    b=smoothstep(.30,.85,b);
    bri[j]=b;
    float core=exp(-dpx*dpx/.55);
    float glow=exp(-dpx/3.2)*.16;
    vec3 fc=pal(hue+float(j)/fN*.62);
    col+=fc*(core*.75+glow)*b;
  }
  q/=fN;
  // 交点 = 準結晶の頂点
  float dots=0.;
  for(int i=1;i<N;i++)for(int j=0;j<i;j++){
    float d2=dist[i]*dist[i]+dist[j]*dist[j];
    dots+=exp(-d2/2.)*bri[i]*bri[j];
  }
  col+=vec3(1.,.97,.92)*min(dots,1.6)*1.25;
  // 線が細かく詰まると、線は溶けて干渉の霧になる
  float haze=smoothstep(.25,.85,q)*dens;
  col+=pal(hue+.78)*haze*.55+vec3(1.,.4,.9)*haze*.25;
  col*=1.-smoothstep(-.35,-.8,q)*dens*.8;
  col+=vec3(.6,.7,1.)*near*.06;
  col+=vec3(.016,.018,.028);
  col=col/(1.+col*.55);
  vec2 uv=gl_FragCoord.xy/res;
  col*=1.-.35*dot(uv-.5,uv-.5)*2.;
  o=vec4(pow(col,vec3(.9)),1.);
}`;
function sh(tp,s){const x=gl.createShader(tp);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
const P=gl.createProgram();gl.attachShader(P,sh(gl.VERTEX_SHADER,VS));gl.attachShader(P,sh(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(P,0,'p');gl.linkProgram(P);
if(!gl.getProgramParameter(P,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(P));
gl.useProgram(P);
const U={};for(const n of ['res','dpr','sp','t','hue','dens','N','nD','nL','u1','u2','u0','dpos','bdef','lens'])U[n]=gl.getUniformLocation(P,n)||gl.getUniformLocation(P,n+'[0]');
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

/* ---------- state ---------- */
let W=0,H=0,DPR=1,quality=1;
let N=7,hue=Math.random();
let u1=[Math.random()*3,Math.random()*3],u2=[Math.random()*3,Math.random()*3],u0=Math.random();
let defs=[];   // {x,y,b:Float32Array(MAXN)}
let lenses=[]; // {x,y,R,A}
let paused=false,t0=performance.now(),last=t0,liveT=0;
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1)*quality;
  c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
}
addEventListener('resize',resize);resize();

function baseSpacing(){return Math.min(W,H)/7.5}
// 目盛りの呼吸: 疎な線の世界 ⇄ 干渉の霧の世界
function spacingAt(ph){return baseSpacing()*Math.exp(1.15*Math.sin(ph)-.45)}

function render(tt,ph){
  const sp=spacingAt(ph);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,c.width,c.height);
  gl.uniform2f(U.res,c.width,c.height);gl.uniform1f(U.dpr,DPR);
  gl.uniform1f(U.sp,sp);gl.uniform1f(U.t,tt);gl.uniform1f(U.hue,hue);
  gl.uniform1f(U.dens,Math.max(0,Math.min(1,(26-sp)/16)));
  gl.uniform1i(U.N,N);gl.uniform1i(U.nD,defs.length);gl.uniform1i(U.nL,lenses.length);
  // 放っておくと断面は内部空間を小さな円でめぐる(GIFでも閉じる)
  gl.uniform2f(U.u1,u1[0]+.35*Math.cos(ph*2),u1[1]+.35*Math.sin(ph*2));
  gl.uniform2f(U.u2,u2[0]+.22*Math.cos(ph*3+1),u2[1]+.22*Math.sin(ph*3+1));
  gl.uniform1f(U.u0,u0);
  const dp=new Float32Array(MAXD*2),bd=new Float32Array(MAXD*MAXN);
  defs.forEach((d,i)=>{dp[i*2]=d.x;dp[i*2+1]=d.y;bd.set(d.b,i*MAXN)});
  gl.uniform2fv(U.dpos,dp);gl.uniform1fv(U.bdef,bd);
  const ld=new Float32Array(MAXL*4);
  lenses.forEach((l,i)=>ld.set([l.x,l.y,l.R,l.A],i*4));
  gl.uniform4fv(U.lens,ld);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  return sp;
}

/* ---------- HUD ---------- */
let hudT=0;
function pad(s,n){s=String(s);while(s.length<n)s=' '+s;return s}
function updateHud(sp){
  let pairs=0;for(let i=1;i<N;i++)for(let j=0;j<i;j++)pairs+=Math.abs(Math.sin(2*Math.PI*(i-j)/N));
  const inter=Math.round(W*H*pairs/(sp*sp)*.42);
  let ten=0;for(const l of lenses)ten+=Math.abs(l.A);
  let wind=0;for(const d of defs)for(let j=0;j<N;j++)wind+=Math.abs(d.b[j]);
  hud.textContent=
    '[ DE BRUIJN GRID ORDER  : N='+N+' ]\n'+
    '[ PHASON OFFSET         : '+pad(u1[0].toFixed(3),7)+' '+pad(u1[1].toFixed(3),7)+' ]\n'+
    '[ HYPER-PHONON TENSION  : '+pad((ten*100).toFixed(1),6)+' % ]\n'+
    '[ DISLOCATION WINDING   : '+pad(wind,4)+' ]\n'+
    '[ ACTIVE INTERSECTIONS  : '+pad(inter.toLocaleString('en-US'),8)+' ]';
}

/* ---------- touch ---------- */
const toP=(x,y)=>[x-W/2,H/2-y];
let ptr=null,lensSign=1;
function burgers(){
  // 7次元のねじれベクトル(各方向の食い違い本数は -1, 0, +1)
  const k=1+Math.floor(Math.random()*3),a=Math.random()*Math.PI*2,b=new Float32Array(MAXN);
  let nz=0;
  for(let j=0;j<MAXN;j++){b[j]=Math.round(1.45*Math.cos(2*Math.PI*k*j/N+a));if(j<N&&b[j])nz++;}
  if(!nz)b[0]=1;
  return b;
}
function addDefect(x,y){
  const nb=burgers();
  let best=null,bd=40;
  for(const d of defs){const e=Math.hypot(d.x-x,d.y-y);if(e<bd){bd=e;best=d}}
  if(!best&&defs.length>=MAXD){ // 上限: 最も近い転位に合流(ねじれは消えずに足される)
    bd=1e9;for(const d of defs){const e=Math.hypot(d.x-x,d.y-y);if(e<bd){bd=e;best=d}}
  }
  if(best){for(let j=0;j<MAXN;j++)best.b[j]=Math.max(-4,Math.min(4,best.b[j]+nb[j]));}
  else defs.push({x,y,b:nb});
}
function lensAt(x,y){
  let best=null,bd=60;
  for(const l of lenses){const e=Math.hypot(l.x-x,l.y-y);if(e<bd){bd=e;best=l}}
  if(!best&&lenses.length>=MAXL){bd=1e9;for(const l of lenses){const e=Math.hypot(l.x-x,l.y-y);if(e<bd){bd=e;best=l}}}
  if(!best){best={x,y,R:Math.min(W,H)*.2,A:0};lenses.push(best)}
  return best;
}
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:0,lens:null};
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  ptr.moved+=Math.hypot(dx,dy);
  if(ptr.moved>10&&!ptr.lens){
    // フェイゾン: 指の動きを内部空間の2つの方向へ振り分ける
    const k=1/baseSpacing()*.9;
    u1[0]+=dx*k;u1[1]-=dy*k;
    u2[0]+=(dx*.62-dy*.78)*k*.7;u2[1]+=(dx*.78+dy*.62)*k*.7;
  }
  ptr.x=e.clientX;ptr.y=e.clientY;
});
function up(e){
  if(!ptr||e.pointerId!==ptr.id)return;
  const dt=performance.now()-ptr.t;
  if(ptr.moved<=10&&!ptr.lens&&dt<380){const p=toP(ptr.x,ptr.y);addDefect(p[0],p[1]);}
  if(ptr.lens)lensSign=-lensSign;       // 次の長押しは逆向きの張力
  ptr=null;
}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

/* ---------- loop ---------- */
let slow=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){
    if(ptr&&ptr.moved<=10&&now-ptr.t>380){
      if(!ptr.lens){const p=toP(ptr.x,ptr.y);ptr.lens=lensAt(p[0],p[1]);}
      const l=ptr.lens;l.A=Math.max(-1.6,Math.min(1.6,l.A+lensSign*dt*.55));
    }
    liveT+=dt;
    const sp=render(liveT,(liveT*.045)%(Math.PI*2));
    if((hudT-=dt)<=0){hudT=.25;updateHud(sp);}
    // 重い端末では解像度を少し落とす
    if(dt>.034)slow++;else slow=Math.max(0,slow-1);
    if(slow>90&&quality>.62){quality-=.19;slow=0;resize();}
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'seven-slice-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  preroll:false,
  // 目盛りの呼吸と内部空間の周回を位相で回す(0と2πで同じ画になる)
  loopFrame:function(phase){paused=true;render(phase*2,phase);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      const opts=[5,7,8,9,11,12].filter(n=>n!==N);
      N=opts[Math.floor(Math.random()*opts.length)];hue=Math.random();
    }},
    {label:'↻',name:'reset',onClick:function(){
      defs=[];lenses=[];N=7;
      u1=[Math.random()*3,Math.random()*3];u2=[Math.random()*3,Math.random()*3];u0=Math.random();
    }}
  ]
});
</script>
</body></html>
