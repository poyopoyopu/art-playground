<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORBIDDEN GARDEN</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020604}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,phase=0,seed=Math.random()*9999,voids=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){voids=[];seed=Math.random()*9999}function mutate(){seed=Math.random()*9999;voids.forEach(v=>{v.h=(v.h+45+Math.random()*100)%360;v.spin*=-1})}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;let hit=null,best=1e9;for(const v of voids){const d=Math.hypot(x-v.x,y-v.y);if(d<v.r*1.8&&d<best){hit=v;best=d}}if(hit){hit.r=Math.min(110,hit.r*1.42);hit.spin*=-1;hit.h=(hit.h+137)%360}else voids.push({x,y,r:12+Math.random()*12,h:(seed+x*.2+y*.1)%360,spin:Math.random()<.5?-1:1});if(voids.length>10)voids.shift();return true}canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
function law(x,y,p){let ax=0,ay=0;for(const v of voids){const dx=x-v.x,dy=y-v.y,d=Math.hypot(dx,dy)||1;if(d<v.r*5){const q=1-d/(v.r*5),sg=v.spin;ax+=(-dy/d)*q*q*2.4*sg;ay+=(dx/d)*q*q*2.4*sg}}return[ax,ay]}
function draw(p=phase){ctx.fillStyle='#020604';ctx.fillRect(0,0,W,H);const cell=Math.max(9,Math.min(15,W/62)),cols=Math.ceil(W/cell),rows=Math.ceil(H/cell);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=(i+.5)*cell,y=(j+.5)*cell,f=law(x,y,p),a=.3*Math.sin(i*.37+j*.29+seed*.002+p*.8)+Math.atan2(f[1],f[0])*.32,len=cell*(.42+Math.min(1,Math.hypot(f[0],f[1]))*.12);ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.strokeStyle=`hsla(${145+Math.min(100,Math.hypot(f[0],f[1])*30)+i*.25},72%,${38+Math.min(25,Math.hypot(f[0],f[1])*5)}%,${.12+Math.min(.3,Math.hypot(f[0],f[1])*.04)})`;ctx.lineWidth=1.15;ctx.stroke();ctx.restore()}for(const v of voids){const pulse=.5+.5*Math.sin(p*2+v.h);ctx.beginPath();ctx.arc(v.x,v.y,v.r*(.92+.1*pulse),0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.97)';ctx.fill();ctx.strokeStyle=`hsla(${v.h},90%,70%,.75)`;ctx.lineWidth=1.2;ctx.stroke();ctx.beginPath();ctx.arc(v.x,v.y,v.r*1.55,0,Math.PI*2);ctx.strokeStyle=`hsla(${v.h},80%,65%,.12)`;ctx.stroke()}}
function frame(){phase=(performance.now()%16000)/16000*Math.PI*2;draw();requestAnimationFrame(frame)}frame();APKit.init({canvas,gifName:'forbidden-garden-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
