<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORBIDDEN GARDEN</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030806}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,phase=0,seed=Math.random()*100,voids=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){voids.length=0;seed=Math.random()*100}function mutate(){seed=Math.random()*100;voids.forEach(v=>v.h=(v.h+60+Math.random()*80)%360)}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;voids.push({x,y,r:10+Math.random()*14,h:(seed+x+y)%360});if(voids.length>9)voids.shift();return true}canvas.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
function blocked(x,y){for(const v of voids)if(Math.hypot(x-v.x,y-v.y)<v.r)return true;return false}
function draw(p=phase){ctx.fillStyle='#030806';ctx.fillRect(0,0,W,H);const cell=Math.max(10,Math.min(18,W/55)),cols=Math.ceil(W/cell),rows=Math.ceil(H/cell);
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=(i+.5)*cell,y=(j+.5)*cell;let nearest=999,ang=0;for(const v of voids){const dx=v.x-x,dy=v.y-y,d=Math.hypot(dx,dy);if(d<nearest){nearest=d;ang=Math.atan2(dy,dx)}}let voidForce=0;if(nearest<130)voidForce=1-nearest/130;const drift=.24*Math.sin(i*.47+j*.31+seed*.03+p*.7)+voidForce*1.6*Math.sin(ang*5-p*1.4);const len=cell*.62*(.3+voidForce*.9);ctx.save();ctx.translate(x,y);ctx.rotate(drift);ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.strokeStyle=`hsla(${142+voidForce*90+i*.4},70%,${40+voidForce*25}%,${.12+voidForce*.38})`;ctx.lineWidth=1.2;ctx.stroke();ctx.restore()}
for(const v of voids){ctx.beginPath();ctx.arc(v.x,v.y,v.r*(1+.08*Math.sin(p*2+v.h)),0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.98)';ctx.fill();ctx.strokeStyle=`hsla(${v.h},85%,65%,.7)`;ctx.lineWidth=1;ctx.stroke()}}
function frame(){phase=(performance.now()%14000)/14000*Math.PI*2;draw();requestAnimationFrame(frame)}frame();APKit.init({canvas,gifName:'forbidden-garden-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
