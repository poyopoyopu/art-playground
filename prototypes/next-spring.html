<title>NEXT SPRING — 綿毛の落ちた所に、次の春が咲く</title>
<!-- NEXT SPRING — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/20 試作
     おっちゃん「別の作品を頼むよ！」(題材はおまかせ)。IRON BLOOMでの好み=眺めるだけで成立する・何なのか一目で分かる・暗すぎない、を受けて。
     世界のルール: 綿毛は風にしか運ばれない。綿毛の落ちた所にだけ、次のタンポポが咲く。
       芽→つぼみ→黄色い花→閉じる→白い綿毛→風で飛ぶ→落ちた所から芽、の一生を、触らなくてもくり返す
       なぞる = その向きに風が吹く(綿毛がちぎれて飛ぶ。吹いた向きに次の野原ができる)
       タップ = 綿毛をはじく
       長押し = 風がやむ(飛んでいる綿毛が空中で止まりかける)
     2026/10/20 v2: おっちゃん「ちゃっちいなー」を受けて描画を全面作り直し。
       草むらに寝転んで逆光のタンポポを見上げる写真の構図に。被写界深度(奥と手前がボケる)、
       綿毛は1粒ずつ「冠毛の円盤+くちばし+実」を立体の向きで描く、花は切れ込みのある舌状花の重なり、
       草は先細りの葉を奥行きの層ごとに揺らす、雲・木立・遠くの花畑・光のボケ・グレイン・ビネット。
     描画: Canvas 2D。綿毛の頭は株ごとの作り置きキャンバスに描き、綿毛が減った時だけ描き直す。 -->

<script>
(function(){

function mk(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }

// ---- 時間帯(✦で切り替え) ----

var TIMES=[

   bokeh:'rgba(255,212,150,', mote:'rgba(255,236,190,', vig:'rgba(46,22,40,', vigA:.48, bloomA:.3, haloA:.38, bloom:'rgba(255,190,120,', bg:'#e9b98f'},

  {name:'春の昼', sunX:.80, sunY:-.56, night:false,
   sky:['#2a72cf','#4f97e6','#93c7f4','#d2ebfb','#eef8ff'], cloud:'#c3d3ea', cloudLit:'#ffffff', cloudA:.95,

   hillFar:'#9cc0b2', hillNear:'#6e9f72', trees:'#4d8155', haze:'rgba(232,246,255,',
   meadow:['#9cc66a','#6aa14a','#3f7530'], dotY:'#ffe04a', dotW:'#ffffff',
   grass:['#2f5a24','#4f8a36','#a8d36a'], rim:'rgba(250,255,215,', near:'#173019', grassTip:'#d2ee92', rimA:.42, leaf:'#3b6f2a', leafLit:'#9fd068',
   stem:'#b0cf80', stemDark:'#76a04e', pap:'#ffffff', achene:'#735536', glow:'rgba(255,255,255,',
   bud:'#5f9038', budLit:'#b9dc7c', bract:'#4b7a30', fdim:0,
   bokeh:'rgba(255,255,245,', mote:'rgba(255,255,255,', vig:'rgba(18,40,60,', vigA:.24, bloomA:.12, haloA:.18, bloom:'rgba(255,255,240,', bg:'#cfe6f7'},
  {name:'月夜', sunX:.70, sunY:-.40, night:true,
   sky:['#050a20','#0f1a44','#22346c','#3e5390','#5d72aa'], cloud:'#24305e', cloudLit:'#8b9fd8', cloudA:.7,
   sun:'#f3f5ff', sunGlow:'rgba(180,200,255,', streak:'rgba(190,210,255,',
   hillFar:'#2c3c6c', hillNear:'#1e2b52', trees:'#141e3c', haze:'rgba(150,175,235,',
   meadow:['#2b3c4a','#1a2a34','#0d171e'], dotY:'#b9a85a', dotW:'#dfe9ff',
   grass:['#0b161b','#16282e','#3f6070'], rim:'rgba(180,210,255,', near:'#04080b', grassTip:'#47697a', rimA:.22, leaf:'#1c3330', leafLit:'#4f7470',
   stem:'#728f90', stemDark:'#3f5759', pap:'#eaf2ff', achene:'#4a5468', glow:'rgba(175,205,255,',
   bud:'#3a5a48', budLit:'#6f9480', bract:'#2c4838', fdim:.45,
   bokeh:'rgba(185,212,255,', mote:'rgba(225,255,170,', vig:'rgba(2,4,14,', vigA:.52, bloomA:.14, haloA:.42, bloom:'rgba(150,180,255,', bg:'#0f1a44'}
];
var TI=0, T=TIMES[0];

// ---- 奥行き ----
// z: 0=遠く 1=目の前。1より大きいのはカメラのすぐ前(大きくボケる)
function horizon(){ return H*(W>H?.66:.70); }
function baseY(z){ var hy=horizon(); return hy+(H*1.06-hy)*Math.pow(Math.max(0,z),1.3); }
function zOfY(y){ var hy=horizon(); return Math.pow(Math.max(0,(y-hy)/(H*1.06-hy)),1/1.3); }
function zsc(z){ return .36+1.04*Math.pow(Math.max(0,z),1.4); }
function lvOf(z){ if(z>1.25) return 3; if(z>1.04) return 2; var d=Math.abs(z-.78); return d<.26?0:(d<.46?1:2); }
var SUN={x:0,y:0};

// ---- 作り置きの絵 ----
// ぼかし: 半分ずつ縮めてから戻す(どのブラウザでも同じに見える)
function blurCanvas(src,steps){
  if(steps<=0) return src;
  var cur=src, list=[];
  for(var i=0;i<steps;i++){ var n=mk(cur.width/2,cur.height/2), g=n.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(cur,0,0,n.width,n.height); list.push(n); cur=n; }
  for(i=steps-1;i>=0;i--){ var w=i===0?src.width:list[i-1].width, h=i===0?src.height:list[i-1].height; var u=mk(w,h), q=u.getContext('2d'); q.imageSmoothingEnabled=true; q.imageSmoothingQuality='high'; q.drawImage(cur,0,0,w,h); cur=u; }
  return cur;
}
var DS=128, DC=64, DR=46;        // 冠毛の円盤(正面向き)
var discSpr=[], flySpr=[], FS=160, FOX=80, FOY=84;
var flowerSpr=null, FLR=112;
var haloSpr=null, bokehSpr=null, glintSpr=null;
function buildDisc(lv){
  var c=mk(DS,DS), g=c.getContext('2d'), n=78, lw=.75+lv*1.15;
  g.lineCap='round'; g.strokeStyle=T.pap;
  for(var i=0;i<n;i++){
    var a=i/n*PI2+rnd(-.03,.03), L=DR*rnd(.8,1), ca=Math.cos(a), sa=Math.sin(a);
    g.globalAlpha=(.2+.16*Math.random())/(1+lv*.55); g.lineWidth=lw;
    g.beginPath(); g.moveTo(DC+ca*3,DC+sa*3); g.lineTo(DC+ca*L,DC+sa*L); g.stroke();
    if(lv<2){
      g.globalAlpha=.16; g.lineWidth=lw*.7; g.beginPath();
      for(var k=0;k<4;k++){ var t=.5+k*.13, px=DC+ca*L*t, py=DC+sa*L*t, bl=3+k;
        g.moveTo(px,py); g.lineTo(px+Math.cos(a-.55)*bl,py+Math.sin(a-.55)*bl);
        g.moveTo(px,py); g.lineTo(px+Math.cos(a+.55)*bl,py+Math.sin(a+.55)*bl); }
      g.stroke();
    }
  }
  // 毛先の光(逆光)
  g.globalAlpha=1;
  var rg=g.createRadialGradient(DC,DC,DR*.5,DC,DC,DR*1.02);
  rg.addColorStop(0,T.glow+'0)'); rg.addColorStop(.8,T.glow+(.07+lv*.04)+')'); rg.addColorStop(1,T.glow+'0)');
  g.fillStyle=rg; g.beginPath(); g.arc(DC,DC,DR*1.05,0,PI2); g.fill();
  var cg=g.createRadialGradient(DC,DC,0,DC,DC,7); cg.addColorStop(0,T.glow+'0.45)'); cg.addColorStop(1,T.glow+'0)');
  g.fillStyle=cg; g.beginPath(); g.arc(DC,DC,9,0,PI2); g.fill();
  return blurCanvas(c,lv);
}
function buildFly(lv){
  // 横から見た綿毛1粒: 冠毛(少し上に反った円盤)+くちばし+実
  var c=mk(FS,FS), g=c.getContext('2d'), cx=FOX, cy=48, n=70, lw=.75+lv*1.15;
  g.lineCap='round'; g.strokeStyle=T.pap;
  var pts=[];
  for(var i=0;i<n;i++){ var a=i/n*PI2+rnd(-.04,.04), L=DR*rnd(.8,1); pts.push([a,L]); }
  pts.sort(function(p,q){ return Math.sin(p[0])-Math.sin(q[0]); });   // 奥の毛から
  pts.forEach(function(p){
    var a=p[0], L=p[1], ex=cx+Math.cos(a)*L, ey=cy+Math.sin(a)*L*.3-L*.24;
    var back=Math.sin(a)<0;
    g.globalAlpha=(back?.28:.55)*(1+lv*.25); g.lineWidth=lw;
    g.beginPath(); g.moveTo(cx,cy); g.quadraticCurveTo(cx+Math.cos(a)*L*.5,cy+Math.sin(a)*L*.15-L*.04,ex,ey); g.stroke();
    if(lv<2 && !back){ g.globalAlpha=.3; g.lineWidth=lw*.7; g.beginPath();
      for(var k=0;k<3;k++){ var t=.55+k*.15, px=cx+(ex-cx)*t, py=cy+(ey-cy)*t; g.moveTo(px,py); g.lineTo(px+(Math.random()-.5)*5,py-2-Math.random()*2); }
      g.stroke(); }
  });
  // くちばし
  g.globalAlpha=.85; g.lineWidth=.9+lv; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx,cy+52); g.stroke();
  // 実(とげのある細長い種)
  g.globalAlpha=1; g.fillStyle=T.achene;
  g.beginPath(); g.ellipse(cx,cy+60,2.6+lv*.6,8.5,0,0,PI2); g.fill();
  g.strokeStyle='rgba(255,230,190,.35)'; g.lineWidth=.6; g.beginPath(); g.moveTo(cx-.8,cy+54); g.lineTo(cx-.8,cy+66); g.stroke();
  // 冠毛の付け根の光
  var cg=g.createRadialGradient(cx,cy,0,cx,cy,10); cg.addColorStop(0,T.glow+'0.95)'); cg.addColorStop(1,T.glow+'0)');
  g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,10,0,PI2); g.fill();
  return blurCanvas(c,lv);
}
function buildFlower(){
  var S=256, c=mk(S,S), g=c.getContext('2d'), C=128, R=FLR;
  var rings=[{n:40,l:1,w:.085,c0:'#f0a000',c1:'#ffe14d'},{n:34,l:.86,w:.088,c0:'#ec9500',c1:'#ffd83a'},{n:28,l:.71,w:.095,c0:'#e88a00',c1:'#ffcf2a'},{n:22,l:.55,w:.11,c0:'#e07c00',c1:'#ffc21a'},{n:15,l:.38,w:.13,c0:'#d06c00',c1:'#f9b20e'}];
  rings.forEach(function(rg,ri){
    for(var i=0;i<rg.n;i++){
      var a=i/rg.n*PI2+ri*.41+rnd(-.05,.05), L=R*rg.l*rnd(.9,1.04), wd=R*rg.w*rnd(.85,1.15);
      g.save(); g.translate(C,C); g.rotate(a);
      var gr=g.createLinearGradient(0,0,L,0); gr.addColorStop(0,rg.c0); gr.addColorStop(.5,rg.c1); gr.addColorStop(1,rg.c1);
      g.fillStyle=gr;
      g.beginPath(); g.moveTo(0,-wd*.22); g.quadraticCurveTo(L*.5,-wd*.72,L*.93,-wd*.5);
      g.lineTo(L,-wd*.32); g.lineTo(L*.965,-wd*.12); g.lineTo(L*1.0,wd*.08); g.lineTo(L*.965,wd*.27); g.lineTo(L*.99,wd*.46);
      g.lineTo(L*.93,wd*.5); g.quadraticCurveTo(L*.5,wd*.72,0,wd*.22); g.closePath(); g.fill();
      g.strokeStyle='rgba(150,70,0,.28)'; g.lineWidth=.7; g.stroke();
      g.strokeStyle='rgba(255,250,200,.35)'; g.lineWidth=.6; g.beginPath(); g.moveTo(L*.2,0); g.lineTo(L*.85,0); g.stroke();
      g.restore();
    }
  });
  // 中心の小さな花(丸まった筒状)
  var cgr=g.createRadialGradient(C,C,0,C,C,R*.2); cgr.addColorStop(0,'#b86a00'); cgr.addColorStop(1,'rgba(230,140,0,0)');
  g.fillStyle=cgr; g.beginPath(); g.arc(C,C,R*.2,0,PI2); g.fill();
  for(var j=0;j<34;j++){ var a2=j*2.4, r2=Math.sqrt(j/34)*R*.16; g.fillStyle=j%3?'#f6b31a':'#d98a08'; g.beginPath(); g.arc(C+Math.cos(a2)*r2,C+Math.sin(a2)*r2,R*.022,0,PI2); g.fill(); }
  if(T.fdim>0){ g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(20,30,70,'+T.fdim+')'; g.fillRect(0,0,S,S); g.globalCompositeOperation='source-over'; }
  return c;
}
function radial(size,stops){
  var c=mk(size,size), g=c.getContext('2d'), h=size/2, rg=g.createRadialGradient(h,h,0,h,h,h);
  stops.forEach(function(s){ rg.addColorStop(s[0],s[1]); });
  g.fillStyle=rg; g.fillRect(0,0,size,size); return c;
}
function buildSprites(){
  discSpr=[]; flySpr=[];
  for(var lv=0;lv<4;lv++){ discSpr.push(buildDisc(lv)); flySpr.push(buildFly(lv)); }
  flowerSpr=buildFlower();
  haloSpr=radial(128,[[0,T.glow+'0.16)'],[.5,T.glow+'0.12)'],[.72,T.glow+'0.3)'],[.84,T.glow+'0.1)'],[1,T.glow+'0)']]);
  // ボケ玉: ふちが少し明るい
  bokehSpr=radial(96,[[0,T.bokeh+'0.5)'],[.72,T.bokeh+'0.62)'],[.86,T.bokeh+'0.9)'],[.94,T.bokeh+'0.35)'],[1,T.bokeh+'0)']]);
  glintSpr=radial(64,[[0,T.mote+'1)'],[.18,T.mote+'0.6)'],[.5,T.mote+'0.12)'],[1,T.mote+'0)']]);
}

// ---- 背景(静止部分はまとめて作り置き) ----
var skyCv=mk(1,1), landCv=mk(1,1), bloomCv=mk(1,1), vigCv=mk(1,1), grainTile=null;
var clouds=[], raysCv=null, streakG=null, sheenSpr=null, troughSpr=null, waves=[], LIGHT={cov:0,v:1};
function buildGrain(){
  var c=mk(160,160), g=c.getContext('2d'), im=g.createImageData(160,160);
  for(var i=0;i<im.data.length;i+=4){ var v=110+Math.random()*36|0; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; }
  g.putImageData(im,0,0); grainTile=c;
}
function addGrain(c,a){   // 透明なところには粒子を乗せない
  var t=mk(c.width,c.height), g=t.getContext('2d');
  g.fillStyle=g.createPattern(grainTile,'repeat'); g.fillRect(0,0,t.width,t.height);
  g.globalCompositeOperation='destination-in'; g.drawImage(c,0,0);
  var x=c.getContext('2d'); x.setTransform(1,0,0,1,0,0); x.globalCompositeOperation='overlay'; x.globalAlpha=a;
  x.drawImage(t,0,0); x.globalCompositeOperation='source-over'; x.globalAlpha=1;
}
// 雲の帯: 横につながる(端と端が継ぎ目なく続く)帯を作って、風に流す
function buildCloudStrip(hy,y0,y1,nc,size,alpha,speed){
  var cq=.25, SW=W*1.6, pad=W*.25, cc=mk((SW+pad*2)*cq,hy*cq), g=cc.getContext('2d'); g.setTransform(cq,0,0,cq,0,0);
  for(var i=0;i<nc;i++){
    var cy=hy*rnd(y0,y1), cx=Math.random()*SW, cw=W*rnd(.5,1.0)*size, ch=H*rnd(.01,.026)*size, lit=[], k;
    var sdy=SUN.y>cy?1:-1;
    for(k=0;k<46;k++){
      var u=rnd(-.5,.5), ex=cx+u*cw, ey=cy+rnd(-.5,.5)*ch*2+Math.sin(u*5+i)*ch, rx=W*rnd(.03,.09)*size*(1-Math.abs(u)*.8), ry=rx*rnd(.14,.3);
      lit.push([ex,ey,rx,ry]);
    }
    [-SW,0,SW].forEach(function(o){
      lit.forEach(function(e){ g.globalAlpha=T.cloudA*.4*alpha; g.fillStyle=T.cloud; g.beginPath(); g.ellipse(pad+e[0]+o,e[1],e[2],e[3],0,0,PI2); g.fill(); });
      lit.forEach(function(e){ var sdx=(SUN.x-((e[0]+o)%SW))/W; g.globalAlpha=T.cloudA*.36*alpha; g.fillStyle=T.cloudLit; g.beginPath(); g.ellipse(pad+e[0]+o+sdx*e[2]*.3,e[1]+sdy*e[3]*.6,e[2]*.8,e[3]*.5,0,0,PI2); g.fill(); });
    });
  }
  var bl=blurCanvas(cc,2), out=mk(SW*cq,hy*cq), og=out.getContext('2d');
  og.drawImage(bl,pad*cq,0,SW*cq,hy*cq,0,0,out.width,out.height);
  // 太陽の高さの行の濃さを覚えておく(雲が太陽にかかったら光を弱める)
  var row=Math.max(0,Math.min(out.height-1,Math.round(SUN.y*cq))), dat=og.getImageData(0,row,out.width,1).data, dens=new Float32Array(out.width);
  for(i=0;i<out.width;i++) dens[i]=dat[i*4+3]/255;
  return {cv:out, SW:SW, hy:hy, dens:dens, speed:speed, off:Math.random()*SW};
}
function softSpr(col){
  var c=mk(64,64), g=c.getContext('2d'), r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,col+'1)'); r.addColorStop(.45,col+'0.45)'); r.addColorStop(1,col+'0)');
  g.fillStyle=r; g.fillRect(0,0,64,64); return c;
}
function buildRays(){
  var R=Math.max(W,H)*1.15, q=.25, c=mk(R*2*q,R*2*q), g=c.getContext('2d'); g.setTransform(q,0,0,q,R*q,R*q);
  var n=T.night?9:16, col=rgbaOf(T.sun);
  for(var i=0;i<n;i++){

// ---- 動く背景: 雲・野原を渡る風・日差し ----
var cloudGust=0;
function stepSky(dt,t){
  var ge=natGust?natGust.env*Math.min(1,natGust.s/(120*U)):0;
  cloudGust+=(ge-cloudGust)*Math.min(1,dt*.6);
  var cov=0;
  clouds.forEach(function(c){
    c.off+=BREEZE*c.speed*U*(1+.6*cloudGust)*(1-calm*.85)*dt;
    c.off=((c.off%c.SW)+c.SW)%c.SW;
    var sx=((SUN.x-(-c.off))%c.SW+c.SW)%c.SW, ix=Math.min(c.dens.length-1,Math.max(0,Math.round(sx/c.SW*c.dens.length)));
    cov+=c.dens[ix];
  });
  cov=Math.min(1,cov*1.15);
  LIGHT.cov+=(cov-LIGHT.cov)*Math.min(1,dt*1.2);
  LIGHT.v=(.92+.05*Math.sin(t*.53)+.03*Math.sin(t*1.71+.4)+.02*Math.sin(t*3.1+1.3))*(1-.6*LIGHT.cov);
  var hy=horizon();
  for(var i=0;i<waves.length;i++){
    var w=waves[i], wd=wind(w.x,hy+H*.08,t);
    w.x+=(wd[0]*1.6+BREEZE*14*U)*w.v*dt;
    if(w.x>W*1.3||w.x<-W*.3){ waves[i]=newWave(BREEZE>0?-W*.25:W*1.25); }
  }
}
function drawClouds(){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  clouds.forEach(function(c){
    var x=-c.off;
    ctx.drawImage(c.cv,x*DPR,0,c.SW*DPR,c.hy*DPR);
    ctx.drawImage(c.cv,(x+c.SW)*DPR,0,c.SW*DPR,c.hy*DPR);
  });
}
function drawMeadowWind(t){
  var hy=horizon(), span=H-hy, night=T.night?.5:1;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  function row(x,d,k,dir){
    var y=hy+d*span, fade=Math.min(1,d/.03)*Math.max(0,1-d/.46), ww=(50+620*d)*U*(.7+.6*k), hh=(5+60*d)*U*(.8+.4*k);
    if(fade<=0) return;
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=Math.min(.5,.09*k)*fade*night;
    ctx.drawImage(troughSpr,x+dir*ww*.55-ww*.5,y-hh*.5,ww,hh);
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(.5,.11*k)*fade*night;
    ctx.drawImage(sheenSpr,x-ww*.5,y-hh*.5,ww,hh);
  }
  for(var i=0;i<waves.length;i++){
    var w=waves[i];
    for(var j=0;j<w.rows.length;j++){
      var r=w.rows[j], x=w.x+r.dx*W, y=hy+r.d*span, wd=wind(x,y,t), wm=Math.abs(wd[0]);

// ---- 風 ----
var gusts=[], natGust=null, calm=0, calmTarget=0, BREEZE=1;
function wind(x,y,t){
  var wx=BREEZE*(11+7*Math.sin(t*.13)+5*Math.sin(t*.37+x*.004))*U;
  var wy=(-2+5*Math.sin(x*.012+t*.8)+3*Math.sin(y*.02-t*.6))*U;
  if(natGust){ var k=Math.exp(-Math.pow((x-natGust.x)/(W*.28),2))*natGust.env; wx+=natGust.dir*natGust.s*k; wy-=natGust.s*.22*k; }
  for(var i=0;i<gusts.length;i++){ var b=gusts[i], dx=x-b.x, dy=y-b.y, k2=Math.exp(-(dx*dx+dy*dy)/(b.r*b.r))*(b.life/b.l0); wx+=b.vx*k2; wy+=b.vy*k2; }
  var m=1-calm*.95;
  return [wx*m, wy*m];
}

// 一生(秒): 0-3 芽 / 3-7 茎とつぼみ / 7-15 花 / 15-18 閉じる / 18-21 綿毛がひらく / 21- 綿毛(ちぎれて飛ぶ)

var plants=[], flying=[], motes=[];
var MAXP=9;
function fib(n){
  var a=[], ga=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<n;i++){ var y=1-2*(i+.5)/n, r=Math.sqrt(1-y*y), th=i*ga;
    var d=[Math.cos(th)*r+rnd(-.05,.05), y+rnd(-.05,.05), Math.sin(th)*r+rnd(-.05,.05)];
    var l=Math.hypot(d[0],d[1],d[2]); a.push({d:[d[0]/l,d[1]/l,d[2]/l], on:true, len:rnd(.86,1.02)}); }
  a.sort(function(p,q){return p.d[2]-q.d[2];});
  return a;
}
function leafShape(){

}

  else { ctx.beginPath(); ctx.ellipse(0,-r*.3,r*.75,r*.55,0,0,PI2); ctx.fill(); }
  // 総苞(下にそり返った細い葉)
  ctx.strokeStyle=T.bract; ctx.lineWidth=Math.max(.7,r*.16); ctx.lineCap='round';
  ctx.beginPath();
  for(var i=0;i<7;i++){ var s=(i/6-.5)*2; ctx.moveTo(s*r*.42,-r*.05); ctx.quadraticCurveTo(s*r*1.05,r*.15,s*r*1.15,r*.75+Math.abs(s)*r*.1); }
  ctx.stroke();
  ctx.restore();
}
function drawFlower(x,y,r,lean,a,lv){
  ctx.save(); ctx.translate(x,y-r*.18); ctx.rotate(lean*.5); ctx.scale(1,.7);
  ctx.globalAlpha=a;
  var s=r/FLR*1.08;
  ctx.drawImage(flowerSpr,-128*s,-128*s,256*s,256*s);
  // 花のかがやき
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*(T.night?.12:.3);
  ctx.drawImage(haloSpr,-r*1.25,-r*1.25,r*2.5,r*2.5);
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}
function drawFlyer(f){
  var s=headR(f)*.34/DR;
  var spr=flySpr[f.lv];
  ctx.globalAlpha=(f.landed?f.life*.8:1)*(f.z>1.02?.85:1);
  var c=Math.cos(f.rot), sn=Math.sin(f.rot);
  ctx.setTransform(DPR*c*s, DPR*sn*s, -DPR*sn*s, DPR*c*s, DPR*f.x, DPR*f.y);
  ctx.drawImage(spr,-FOX,-FOY);
}
function drawBlades(list,t){
  if(!list.length) return;
  var top=1e9, bot=-1e9, all=new Path2D();
  var paths=[new Path2D(),new Path2D(),new Path2D()], tip=new Path2D(), rim=new Path2D(), stalk=new Path2D(), ear=new Path2D(), t0=.42, u=1-t0;
  for(var i=0;i<list.length;i++){
    var b=list[i], w=wind(b.x,b.y-b.h,t);
    var bend=clamp(w[0]/(170*U),-1.1,1.1)*b.h*.5+Math.sin(t*1.7+b.ph+b.x*.01)*b.h*.05, dx=b.lean*b.h+bend;
    var tx=b.x+dx, ty=b.y-b.h+Math.abs(dx)*.3, cx=b.x+dx*.18, cy=b.y-b.h*.58, y=b.y;
    if(b.spike){
      stalk.moveTo(b.x,y); stalk.quadraticCurveTo(cx,cy,tx,ty);
      var ang=Math.atan2(ty-cy,tx-cx), el=b.h*.13;
      ear.moveTo(tx+Math.cos(ang)*el*.2,ty+Math.sin(ang)*el*.2); ear.ellipse(tx-Math.cos(ang)*el*.6,ty-Math.sin(ang)*el*.6,el,Math.max(.9,b.w*.42),ang,0,PI2);
      continue;
    }
    var x0=b.x-b.w*.5, x1=b.x+b.w*.5, lcx=cx-b.w*.32, rcx=cx+b.w*.32;
    var P=paths[b.ci];
    P.moveTo(x0,y); P.quadraticCurveTo(lcx,cy,tx,ty); P.quadraticCurveTo(rcx,cy,x1,y); P.closePath();
    all.moveTo(x0,y); all.quadraticCurveTo(lcx,cy,tx,ty); all.quadraticCurveTo(rcx,cy,x1,y); all.closePath();
    if(ty<top) top=ty; if(y>bot) bot=y;
    // 先の半分(明るい)
    var sy=u*u*y+2*u*t0*cy+t0*t0*ty, lsx=u*u*x0+2*u*t0*lcx+t0*t0*tx, rsx=u*u*x1+2*u*t0*rcx+t0*t0*tx;
    var lc2=lcx+(tx-lcx)*t0, rc2=rcx+(tx-rcx)*t0, cy2=cy+(ty-cy)*t0;
    tip.moveTo(lsx,sy); tip.quadraticCurveTo(lc2,cy2,tx,ty); tip.quadraticCurveTo(rc2,cy2,rsx,sy); tip.closePath();
    // 太陽の側のふち
    if(SUN.x>b.x){ rim.moveTo(rsx,sy); rim.quadraticCurveTo(rc2,cy2,tx,ty); rim.quadraticCurveTo(rc2-b.w*.2,cy2,rsx-b.w*.3,sy); rim.closePath(); }
    else { rim.moveTo(lsx,sy); rim.quadraticCurveTo(lc2,cy2,tx,ty); rim.quadraticCurveTo(lc2+b.w*.2,cy2,lsx+b.w*.3,sy); rim.closePath(); }
  }
  for(var k=0;k<3;k++){ ctx.fillStyle=T.grass[k]; ctx.globalAlpha=k===2?.94:1; ctx.fill(paths[k]); }
  if(bot>top){ var gg=ctx.createLinearGradient(0,top,0,bot), tc=rgbaOf(T.grassTip);
    gg.addColorStop(0,tc+'0.55)'); gg.addColorStop(.45,tc+'0.18)'); gg.addColorStop(.8,tc+'0)'); gg.addColorStop(1,T.vig+'0.35)');
    ctx.globalAlpha=1; ctx.fillStyle=gg; ctx.fill(all); }
  ctx.globalAlpha=T.rimA; ctx.fillStyle=T.rim+'1)'; ctx.fill(rim);
  ctx.globalAlpha=.9; ctx.strokeStyle=T.grass[1]; ctx.lineWidth=Math.max(.6,1.1*U); ctx.lineCap='round'; ctx.stroke(stalk);
  ctx.fillStyle=T.grass[2]; ctx.fill(ear);
  ctx.globalAlpha=T.rimA*.7; ctx.fillStyle=T.rim+'1)'; ctx.fill(ear);
  ctx.globalAlpha=1;
}
function drawNear(t){
  var g=nearCv.getContext('2d'), y0=H*.5;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,nearCv.width,nearCv.height);
  g.setTransform(NQ,0,0,NQ,0,-y0*NQ);
  var P=new Path2D(), Rm=new Path2D();
  for(var i=0;i<nearBlades.length;i++){
    var b=nearBlades[i], w=wind(b.x,H-b.h,t);
    var bend=clamp(w[0]/(170*U),-1,1)*b.h*.25+Math.sin(t*1.3+b.ph)*b.h*.03;
    var bx=b.x, by=H+10, tx=bx+b.lean*b.h+bend, ty=by-b.h, cx=bx+(b.lean*b.h+bend)*.3, cy=by-b.h*.55;
    P.moveTo(bx-b.w*.5,by); P.quadraticCurveTo(cx-b.w*.3,cy,tx,ty); P.quadraticCurveTo(cx+b.w*.3,cy,bx+b.w*.5,by); P.closePath();
    if(b.lit){ var sd=SUN.x>bx?1:-1; Rm.moveTo(cx+b.w*.3*sd,cy); Rm.quadraticCurveTo((cx+tx)/2+b.w*.15*sd,(cy+ty)/2,tx,ty); }
  }
  g.fillStyle=T.near; g.globalAlpha=.94; g.fill(P);
  g.globalAlpha=.55; g.strokeStyle=T.rim+'0.8)'; g.lineWidth=2.2*U; g.stroke(Rm); g.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(nearCv,0,y0*DPR,W*DPR,H*.5*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  ctx.drawImage(skyCv,0,0);
  drawClouds();
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  ctx.drawImage(landCv,0,0);
  drawMeadowWind(t);
  drawSunlight(t);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 奥のボケ玉
  ctx.globalCompositeOperation='lighter';
  motes.forEach(function(m){ if(!m.big) return; ctx.globalAlpha=m.a*(.7+.3*Math.sin(t*.5+m.ph)); ctx.drawImage(bokehSpr,m.x-m.r,m.y-m.r,m.r*2,m.r*2); });
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // 奥から手前へ: 草の層・タンポポ・飛ぶ綿毛を、奥行き順に重ねる
  var items=[], i;
  for(i=0;i<plants.length;i++) items.push({z:plants[i].z, k:0, o:plants[i]});
  for(i=0;i<flying.length;i++) if(flying[i].z<=1.02) items.push({z:flying[i].z, k:1, o:flying[i]});
  var buckets=[]; for(i=0;i<NB;i++) buckets.push([]);
  for(i=0;i<blades.length;i++) buckets[blades[i].b].push(blades[i]);
  for(i=0;i<NB;i++) items.push({z:(i+1)*.2-.001, k:2, o:buckets[i]});
  items.sort(function(a,b){ return a.z-b.z; });
  for(i=0;i<items.length;i++){
    var it=items[i];
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if(it.k===0) drawPlant(it.o,t);
    else if(it.k===1) drawFlyer(it.o);
    else drawBlades(it.o,t);
  }
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.globalAlpha=1;
  // 光の粒
  ctx.globalCompositeOperation='lighter';
  motes.forEach(function(m){ if(m.big) return; var tw=T.night?Math.max(0,Math.sin(t*1.3+m.ph)):(.6+.4*Math.sin(t*2+m.ph)); ctx.globalAlpha=m.a*tw; var r=m.r*3; ctx.drawImage(glintSpr,m.x-r,m.y-r,r*2,r*2); });
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // 手前のボケた草
  drawNear(t);
  // カメラのすぐ前をよぎる綿毛(大きくボケる)
  for(i=0;i<flying.length;i++){ if(flying[i].z>1.02){ drawFlyer(flying[i]); } }
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  // 光のにじみと周辺の暗さ
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,.35+.7*LIGHT.v); ctx.drawImage(bloomCv,0,0,W*DPR,H*DPR); ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over'; ctx.drawImage(vigCv,0,0,W*DPR,H*DPR);
}

// ---- サイズ ----
function resize(){
  var w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight;
  var first=!W, ox=W, oy=H;
  DPR=Math.min(window.devicePixelRatio||1,2); W=w; H=h; U=Math.min(W,H)/400;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  if(!grainTile) buildGrain();
  buildSprites(); buildBg(); buildBlades(); buildMotes();
  if(first){ seedPlants(); }
  else if(ox&&oy){
    plants.forEach(function(p){ p.x=p.x/ox*W; p.sc=zsc(p.z); p.len=p.len/oy*H; p.dirty=true; });
    flying.forEach(function(f){ f.x=f.x/ox*W; f.y=f.y/oy*H; f.sc=zsc(f.z); });
  }
}
addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(function(){ if((cv.clientWidth|0)!==(W|0)||(cv.clientHeight|0)!==(H|0)) resize(); }).observe(cv);
resize();

// ---- ✦ / ↻ ----
function mutate(){
  TI=(TI+1)%TIMES.length; T=TIMES[TI];
  BREEZE=Math.random()<.75?1:-1;
  buildSprites(); buildBg(); buildMotes();
  plants.forEach(function(p){ p.dirty=true; p.lastR=-1; });
}
function reset(){ seedPlants(); lastTouch=nowS(); natT=14; }

var perf={n:0,ms:0};
window.__ns={ state:function(){ return {plants:plants.length, flying:flying.filter(function(f){return !f.landed;}).length, time:T.name, msPerFrame:perf.n?+(perf.ms/perf.n).toFixed(2):0}; }, mutate:mutate, gust:function(){ natGust={dir:BREEZE, x:BREEZE>0?-W*.1:W*1.1, v:W*.32+90*U, s:130*U, env:0}; } };
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  var t=nowS(), a=performance.now();
  stepAll(dt,t);
  stepSky(dt,t);
  render(t);
  perf.ms+=performance.now()-a; perf.n++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if(window.APKit){
  APKit.init({
    canvas: cv,
    gifName: 'next-spring-loop',
    clockFormat: 'spec',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      {label:'✦', name:'mutate', onClick:function(){ mutate(); }},
      {label:'↻', name:'reset',  onClick:function(){ reset(); }}
    ]
  });
}
})();
</script>
