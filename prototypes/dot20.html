<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DOT 20</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font:14px system-ui;color:#fff}#bar{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;gap:7px;padding:8px;overflow-x:auto;background:rgba(0,0,0,.78);-webkit-overflow-scrolling:touch;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}button{flex:0 0 auto;min-width:112px;height:44px;padding:0 13px;border:1px solid #555;border-radius:8px;background:#111;color:#ddd;font-size:14px}button.on{background:#fff;color:#000;border-color:#fff}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;padding-top:60px}</style></head><body><nav id="bar"></nav><iframe id="stage"></iframe><script>const A=[['01','TUNNEL','dot01-tunnel.html'],['02','LENS','dot02-lens.html'],['03','VORTEX','dot03-vortex.html'],['04','WAVE','dot04-wave.html'],['05','RIPPLE','dot05-ripple.html'],['06','PINWHEEL','dot06-pinwheel.html'],['07','FOLD','dot07-fold.html'],['08','BLOOM','dot08-bloom.html'],['09','SPIRAL','dot09-spiral.html'],['10','KNOT','dot10-knot.html'],['11','PRESSURE','dot11-pressure.html'],['12','ORBIT','dot12-orbit.html'],['13','PRISM','dot13-prism.html'],['14','BURST','dot14-burst.html'],['15','MIRROR','dot15-mirror.html'],['16','CURRENT','dot16-current.html'],['17','SPLIT','dot17-split.html'],['18','GRAVITY','dot18-gravity.html'],['19','MESH','dot19-mesh.html'],['20','FRACTURE','dot20-fracture.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');function go(i){stage.src=A[i][2];[...bar.children].forEach(b=>b.classList.remove('on'));const b=bar.children[i];b.classList.add('on');b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}A.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0]+' '+a[1];b.onclick=()=>go(i);bar.appendChild(b)});go(0);addEventListener('keydown',e=>{if(e.key==='ArrowRight')go((A.findIndex(x=>stage.src.endsWith(x[2]))+1)%20);if(e.key==='ArrowLeft')go((A.findIndex(x=>stage.src.endsWith(x[2]))+19)%20)});</script></body></html>
