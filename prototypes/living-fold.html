<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIVING FOLD</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head>
<body><canvas id="c"></canvas><script>
'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});
let W=0,H=0,D=1,t0=performance.now(),seed=Math.random()*99,mode=0,rx=0,ry=0,trx=0,try_=0;
const TAU=Math.PI*2;
const PAL=[[[24,205,236],[111,53,244],[247,54,180],[255,177,73]],[[39,232,166],[35,139,255],[176,84,255],[255,226,102]],[[255,79,151],[104,63,244],[29,215,239],[255,151,68]]];
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function hash(n){return (Math.sin(n*127.1+seed*311.7)*43758.5453)%1}
function bg(t){ctx.fillStyle='#05040a';ctx.fillRect(0,0,W,H);const s=Math.min(W,H),p=PAL[mode];ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<7;i++){const a=i*TAU/7+t*.055*(i%2?1:-1),r=s*(.27+.045*Math.sin(t*.19+i));const x=W*.5+Math.cos(a)*r,y=H*.5+Math.sin(a)*r*.72;const q=ctx.createRadialGradient(x,y,0,x,y,s*.24);const col=p[i%4];q.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.10)`);q.addColorStop(.38,`rgba(${col[0]},${col[1]},${col[2]},.035)`);q.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=q;ctx.fillRect(0,0,W,H)}ctx.restore();let v=ctx.createRadialGradient(W*.5,H*.5,s*.12,W*.5,H*.5,s*.76);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.62)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function centerline(u,t,k){const a=u*TAU;const breathe=1+.13*Math.sin(t*.21+k*.8)+.055*Math.sin(a*3-t*.12+seed);const fold=.38*Math.sin(2*a+t*.105+k)+.17*Math.sin(5*a-t*.07+seed*.03);let x=Math.cos(a)*(1+.24*Math.sin(3*a+t*.08+k))+.23*Math.sin(2*a-t*.06+k);let y=Math.sin(a)*(.76+.22*Math.cos(2*a-t*.09-k))+.15*Math.sin(4*a+t*.07);let z=fold+.22*Math.cos(a*3+t*.065+k*1.3);x*=breathe;y*=breathe;const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let xx=x*cy-z*sy,zz=x*sy+z*cy,yy=y*cx-zz*sx,zz2=y*sx+zz*cx;return [xx,yy,zz2]}
function ribbon(t,k,scale,phase){const p=PAL[mode],N=320,s=Math.min(W,H),pts=[];for(let i=0;i<=N;i++)pts.push(centerline(i/N,t,k));ctx.save();ctx.translate(W*.5,H*.5);ctx.globalCompositeOperation='lighter';
for(let layer=0;layer<5;layer++){ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pers=1/(1-q[2]*.18),x=q[0]*s*scale*pers,y=q[1]*s*scale*pers;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}const a=.16-layer*.022;const col=p[(k+layer+phase)%4];ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;ctx.lineWidth=30-layer*4;ctx.shadowBlur=12;ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.28)`;ctx.stroke()}
ctx.shadowBlur=0;ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pers=1/(1-q[2]*.18),x=q[0]*s*scale*pers,y=q[1]*s*scale*pers;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}const g=ctx.createLinearGradient(-s*.35,-s*.25,s*.35,s*.25),c0=p[(k+phase)%4],c1=p[(k+phase+1)%4],c2=p[(k+phase+2)%4];g.addColorStop(0,`rgba(${c0[0]},${c0[1]},${c0[2]},.72)`);g.addColorStop(.35,`rgba(${c1[0]},${c1[1]},${c1[2]},.82)`);g.addColorStop(.68,`rgba(${c2[0]},${c2[1]},${c2[2]},.72)`);g.addColorStop(1,`rgba(${c0[0]},${c0[1]},${c0[2]},.68)`);ctx.strokeStyle=g;ctx.lineWidth=13;ctx.stroke();
for(let j=0;j<8;j++){const u=(j/8+t*.014+k*.11)%1,q=centerline(u,t,k),pers=1/(1-q[2]*.18),x=q[0]*s*scale*pers,y=q[1]*s*scale*pers;if(q[2]>.05){const r=s*.012;const h=ctx.createRadialGradient(x,y,0,x,y,r*3);h.addColorStop(0,'rgba(255,255,255,.62)');h.addColorStop(.22,'rgba(220,245,255,.22)');h.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=h;ctx.beginPath();ctx.arc(x,y,r*3,0,TAU);ctx.fill()}}
ctx.restore()}
function draw(t){bg(t);const s=Math.min(W,H);ribbon(t*.92,0,s>500?.29:.31,0);ribbon(t*1.03+1.7,1,s>500?.27:.29,1);ribbon(t*.84+3.4,2,s>500?.25:.27,2);}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;mode=(mode+1)%PAL.length;seed=Math.random()*99;trx=(y/H-.5)*.9;try_=(x/W-.5)*.9;return true}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});c.addEventListener('pointermove',e=>{if(e.buttons){trx=(e.clientY/H-.5)*1.1;try_=(e.clientX/W-.5)*1.1}},{passive:true});
function frame(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;rx+=(trx-rx)*(1-Math.exp(-dt*1.3));ry+=(try_-ry)*(1-Math.exp(-dt*1.3));draw(now/1000);requestAnimationFrame(frame)}
APKit.init({canvas:c,gifName:'living-fold-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:function(){mode=(mode+1)%PAL.length;seed=Math.random()*99;}},{label:'↻',name:'reset',onClick:function(){mode=0;seed=Math.random()*99;rx=0;ry=0;trx=0;try_=0;}}]});requestAnimationFrame(frame);
</script></body></html>
