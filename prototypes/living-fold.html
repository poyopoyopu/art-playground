<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVING FOLD — TEN FLUX</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,t0=performance.now(),seed=Math.random()*99,mode=0,rx=0,ry=0,trx=0,try_=0;const TAU=Math.PI*2,PAL=[[[24,205,236],[111,53,244],[247,54,180],[255,177,73]],[[39,232,166],[35,139,255],[176,84,255],[255,226,102]],[[255,79,151],[104,63,244],[29,215,239],[255,151,68]]];function resize(){D=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function bg(t){ctx.fillStyle='#03040a';ctx.fillRect(0,0,W,H);const s=Math.min(W,H),p=PAL[mode];const g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,s*.72);g.addColorStop(0,`rgba(${p[1][0]},${p[1][1]},${p[1][2]},.10)`);g.addColorStop(.42,`rgba(${p[0][0]},${p[0][1]},${p[0][2]},.035)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='screen';for(let i=0;i<3;i++){const a=t*.035*(i%2?-.8:.8)+i*TAU/3,x=W*.5+Math.cos(a)*s*.30,y=H*.5+Math.sin(a)*s*.30;const q=ctx.createRadialGradient(x,y,0,x,y,s*.25),col=p[(i+2)%4];q.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.045)`);q.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=q;ctx.fillRect(0,0,W,H)}ctx.globalCompositeOperation='source-over'}function point(u,t,k){const a=u*TAU+k*.31;const shared=.075*Math.sin(t*.20+k*.17);const wave=.13*Math.sin(3*a-t*.09+k)+.075*Math.sin(7*a+t*.055-k*.7);const squeeze=.10*Math.cos(a*2+t*.075+k*.43);const r=1+shared+wave+squeeze;let x=Math.cos(a)*r,y=Math.sin(a)*(.72+.10*Math.sin(t*.16+k))*r;const z=.18*Math.sin(2*a+t*.07+k)+.10*Math.cos(5*a-t*.05+k*1.7);const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);let xx=x*cy-z*sy,zz=x*sy+z*cy,yy=y*cx-zz*sx,zz2=y*sx+zz*cx;return[xx,yy,zz2]}function ribbon(t,k,scale,idx){const p=PAL[mode],N=112,s=Math.min(W,H),pts=new Array(N+1);for(let i=0;i<=N;i++)pts[i]=point(i/N,t,k);ctx.save();ctx.translate(W*.5,H*.5);ctx.globalCompositeOperation='screen';ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pr=1/(1-q[2]*.12),x=q[0]*s*scale*pr,y=q[1]*s*scale*pr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}const c0=p[idx%4],c1=p[(idx+1)%4],c2=p[(idx+2)%4];const grad=ctx.createLinearGradient(-s*.4,-s*.3,s*.4,s*.3);grad.addColorStop(0,`rgba(${c0[0]},${c0[1]},${c0[2]},.42)`);grad.addColorStop(.32,`rgba(${c1[0]},${c1[1]},${c1[2]},.70)`);grad.addColorStop(.68,`rgba(${c2[0]},${c2[1]},${c2[2]},.62)`);grad.addColorStop(1,`rgba(${c0[0]},${c0[1]},${c0[2]},.42)`);ctx.strokeStyle=grad;ctx.lineWidth=5.2;ctx.stroke();ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pr=1/(1-q[2]*.12),x=q[0]*s*scale*pr,y=q[1]*s*scale*pr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`rgba(245,250,255,.16)`;ctx.lineWidth=1.2;ctx.stroke();ctx.restore()}function draw(t){bg(t);const s=Math.min(W,H),base=s>500?.275:.30;for(let i=0;i<10;i++){const k=i*.63+Math.sin(t*.08+i*.9)*.16;const tt=t*(.64+.026*i)+i*.73;const scale=base+.010*Math.sin(t*.11+i*1.7);ribbon(tt,k,scale,i)}}function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;mode=(mode+1)%PAL.length;seed=Math.random()*99;trx=(y/H-.5)*.8;try_=(x/W-.5)*.8;return true}c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});c.addEventListener('pointermove',e=>{if(e.buttons){trx=(e.clientY/H-.5)*.9;try_=(e.clientX/W-.5)*.9}},{passive:true});function frame(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;rx+=(trx-rx)*(1-Math.exp(-dt*1.05));ry+=(try_-ry)*(1-Math.exp(-dt*1.05));draw(now/1000);requestAnimationFrame(frame)}APKit.init({canvas:c,gifName:'living-fold-ten-flux-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:function(){mode=(mode+1)%PAL.length;seed=Math.random()*99;}},{label:'↻',name:'reset',onClick:function(){mode=0;seed=Math.random()*99;rx=0;ry=0;trx=0;try_=0;}}]});requestAnimationFrame(frame);</script></body></html>
