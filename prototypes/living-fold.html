<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVING FOLD — TEN LIGHT</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,t0=performance.now(),seed=Math.random()*99,mode=0,rx=0,ry=0,trx=0,try_=0;const TAU=Math.PI*2,PAL=[[[24,205,236],[111,53,244],[247,54,180],[255,177,73]],[[39,232,166],[35,139,255],[176,84,255],[255,226,102]],[[255,79,151],[104,63,244],[29,215,239],[255,151,68]]];function resize(){D=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function bg(t){ctx.fillStyle='#02030a';ctx.fillRect(0,0,W,H);const s=Math.min(W,H),p=PAL[mode];ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){const a=i*TAU/6+t*.035*(i%2?1:-1),r=s*(.30+.035*Math.sin(t*.13+i*1.9)),x=W*.5+Math.cos(a)*r,y=H*.5+Math.sin(a)*r*.68,q=ctx.createRadialGradient(x,y,0,x,y,s*.19),col=p[i%4];q.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},.055)`);q.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=q;ctx.fillRect(0,0,W,H)}ctx.restore();let v=ctx.createRadialGradient(W*.5,H*.5,s*.18,W*.5,H*.5,s*.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.48)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}function point(u,t,k){const a=u*TAU+k*.37,b=1+.10*Math.sin(t*.18+k*.53)+.04*Math.sin(a*3-t*.11+seed),f=.30*Math.sin(2*a+t*.09+k*.71)+.13*Math.sin(5*a-t*.06+seed*.03+k),x=(Math.cos(a)*(1+.20*Math.sin(3*a+t*.07+k*.31))+.18*Math.sin(2*a-t*.05+k))*b,y=(Math.sin(a)*(.72+.18*Math.cos(2*a-t*.08-k*.17))+.11*Math.sin(4*a+t*.06+k))*b,z=f+.16*Math.cos(a*3+t*.055+k*1.3),cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),xx=x*cy-z*sy,zz=x*sy+z*cy,yy=y*cx-zz*sx,zz2=y*sx+zz*cx;return[xx,yy,zz2]}function ribbon(t,k,scale,phase){const p=PAL[mode],N=150,s=Math.min(W,H),pts=new Array(N+1);for(let i=0;i<=N;i++)pts[i]=point(i/N,t,k);ctx.save();ctx.translate(W*.5,H*.5);ctx.globalCompositeOperation='screen';ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pr=1/(1-q[2]*.15),x=q[0]*s*scale*pr,y=q[1]*s*scale*pr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}const a=.30,col=p[phase%4];ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;ctx.lineWidth=5.5;ctx.shadowBlur=5;ctx.shadowColor=`rgba(${col[0]},${col[1]},${col[2]},.18)`;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();for(let i=0;i<=N;i++){const q=pts[i],pr=1/(1-q[2]*.15),x=q[0]*s*scale*pr,y=q[1]*s*scale*pr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}const c0=p[phase%4],c1=p[(phase+1)%4],g=ctx.createLinearGradient(-s*.4,-s*.3,s*.4,s*.3);g.addColorStop(0,`rgba(${c0[0]},${c0[1]},${c0[2]},.64)`);g.addColorStop(.5,`rgba(${c1[0]},${c1[1]},${c1[2]},.76)`);g.addColorStop(1,`rgba(${c0[0]},${c0[1]},${c0[2]},.60)`);ctx.strokeStyle=g;ctx.lineWidth=6;ctx.stroke();ctx.restore()}function draw(t){bg(t);const s=Math.min(W,H),base=s>500?.27:.285;for(let i=0;i<10;i++){const scale=base+.012*Math.sin(i*2.1+t*.09),tt=t*(.72+.025*i)+i*.71,k=i*.63+Math.sin(t*.07+i)*.14;ribbon(tt,k,scale,i%4)}}function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;mode=(mode+1)%PAL.length;seed=Math.random()*99;trx=(y/H-.5)*.8;try_=(x/W-.5)*.8;return true}c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY),{passive:true});c.addEventListener('pointermove',e=>{if(e.buttons){trx=(e.clientY/H-.5)*.9;try_=(e.clientX/W-.5)*.9}},{passive:true});function frame(now){const dt=Math.min(.05,(now-t0)/1000);t0=now;rx+=(trx-rx)*(1-Math.exp(-dt*1.1));ry+=(try_-ry)*(1-Math.exp(-dt*1.1));draw(now/1000);requestAnimationFrame(frame)}APKit.init({canvas:c,gifName:'living-fold-ten-light-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:function(){mode=(mode+1)%PAL.length;seed=Math.random()*99;}},{label:'↻',name:'reset',onClick:function(){mode=0;seed=Math.random()*99;rx=0;ry=0;trx=0;try_=0;}}]});requestAnimationFrame(frame);</script></body></html>
