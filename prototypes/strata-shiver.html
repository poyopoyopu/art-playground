<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STRATA SHIVER</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,seed=Math.random()*50,touch={x:0,y:0,s:0};function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function noise(v){return Math.sin(v*1.73+Math.sin(v*.37)*2.1)*.5+Math.sin(v*.47+3)*.5}
function draw(p){let t=p*Math.PI*2+seed;g.fillStyle='#010103';g.fillRect(0,0,W,H);let bands=92,dy=H/bands;for(let b=0;b<bands;b++){let base=b*dy,depth=b/bands;g.beginPath();for(let i=0;i<=W;i+=3){let u=i/W;let q=noise(u*11+b*.19+t*.18)+.55*noise(u*27-b*.11-t*.11);let wave=15*q*(.3+depth*1.7)+8*Math.sin(u*12+t*.8+b*.07);let dx=i-W*.5,dy2=base-H*.5;let r=Math.hypot(dx,dy2),ang=Math.atan2(dy2,dx);let fold=28*Math.sin(r*.018-t*.7+ang*4)*(1-depth*.35);let sx=i+fold*Math.cos(ang),sy=base+wave+fold*Math.sin(ang);if(i===0)g.moveTo(sx,sy);else g.lineTo(sx,sy)}let lum=42+45*Math.pow(Math.sin(depth*Math.PI),2);g.strokeStyle=`hsla(${185+150*depth+35*Math.sin(t+b*.05)},95%,${lum}%,${.2+.55*Math.pow(Math.sin(depth*Math.PI),.7)})`;g.lineWidth=.55+depth*1.15;g.stroke();if(b%3===0){g.strokeStyle=`hsla(${300+40*Math.sin(b+t)},100%,72%,.28)`;g.lineWidth=.35;g.stroke()}}
// vertical fracture memory: touching changes the geometry, not a particle effect
if(touch.s>0){let age=touch.s,rad=80+age*180;g.save();g.globalCompositeOperation='lighter';g.beginPath();for(let k=0;k<12;k++){let a=k*Math.PI/6;g.moveTo(touch.x,touch.y);g.lineTo(touch.x+Math.cos(a)*rad,touch.y+Math.sin(a)*rad)}g.strokeStyle='rgba(210,245,255,.12)';g.lineWidth=1;g.stroke();g.restore()}}
function loopFrame(p){draw(p)}function tick(){draw(((performance.now()/10000)%1));requestAnimationFrame(tick)}tick();
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;if(window.APKit&&APKit.isUI(px,py))return true;touch={x:px,y:py,s:1};setTimeout(()=>touch.s=.35,700);return true});
APKit.init({canvas:c,gifName:'strata-shiver-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame,buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*100},{label:'↻',name:'reset',onClick:()=>{seed=2;touch.s=0}}]});</script></body></html>
