const NS=SP.length;
function rotGrid(gr,k){let a=gr.map(r=>r.split(''));for(let n=0;n<k;n++){const h=a.length,w=a[0].length,b=[];for(let x=0;x<w;x++){const row=[];for(let y=h-1;y>=0;y--)row.push(a[y][x]);b.push(row);}a=b;}return a;}
SP.forEach(a=>{a.fr=[0,1,2,3].map(k=>rotGrid(a.s,k));const s2=a.s.slice(),lr=s2[s2.length-1];s2[s2.length-1]='.'+lr.slice(0,-1);a.fw=[rotGrid(a.s,0),rotGrid(s2,0)];});
function hamster(x,y,sp,o){o=o||{};const A=SP[sp],gr=o.frame||A.fr[0],h=gr.length,w=gr[0].length,fl=!!o.flip;
  const x0=Math.round(x-w/2),y0=o.center?Math.round(y-h/2):Math.round(y)-h+1,X=c=>x0+(fl?w-1-c:c);
  g.fillStyle=A.O;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){if(gr[r][c]==='.')continue;const xx=X(c);g.fillRect(xx-1,y0+r,1,1);g.fillRect(xx+1,y0+r,1,1);g.fillRect(xx,y0+r-1,1,1);g.fillRect(xx,y0+r+1,1,1);}
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){let ch=gr[r][c];if(ch==='.')continue;
    if(ch==='K'&&o.blink){const nb=gr[r][c-1]||gr[r][c+1];if(nb&&nb!=='.'&&nb!=='K')ch=nb;}
    px(X(c),y0+r,ch==='K'?'#2A1E1A':(A.p[ch]||'#2A1E1A'));}}

const THEMES=[
 {sky:['#D2EAF8','#C2E0F4'],far:'#B9DEC0',hill:'#8FC984',hillD:'#7AB872',water:['#3F8FDB','#3480CC','#8CC8F2'],hud:'#3A4460',night:0,

 {sky:['#E6F4E4','#D8EDD6'],far:'#C9E2B8','hill':'#A8D08D',hillD:'#94C27A',water:['#4FA6B8','#4396A8','#A6DDE4'],hud:'#3C5040',night:0,

let TH=0,theme=THEMES[0],NR=10;

/* ---------- layout ---------- */
let cx=90,cy=170,Rmax=84,r0=15,sp=7.7,RW=3,waterTop=356,hillTop=330;
let rings=[],mates=[],parts=[],labels=[],caps=[],stars=[];
let phase='build',tPhase=0,tRound=0,best=null,pals=0,rtime=0,bag=[];
const skyCv=document.createElement('canvas'),groundCv=document.createElement('canvas');

function resize(){
  const d=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
  /* 1ドット=画面のkピクセル(整数)にそろえる。動くものは画面のピクセル単位でなめらかに動かし、ドットの大きさは変えない */
  K=Math.max(1,Math.round(Math.min(cv.width,cv.height)/S));
  W=Math.ceil(cv.width/K);H=Math.ceil(cv.height/K);
  buf.width=W;buf.height=H;g=buf.getContext('2d');bufB.width=W;bufB.height=H;gB=bufB.getContext('2d');
  layout();}
function layout(){
  const wH=Math.round(H>W?H*.085:H*.09);waterTop=H-wH;hillTop=waterTop-(H>W?16:10);
  const top=17,bot=waterTop-8;
  Rmax=Math.floor(Math.min(W/2-5,(bot-top)/2-1));
  cx=Math.round(W/2);cy=Math.round(cl(top+(bot-top)*.46,top+Rmax+1,bot-Rmax));
  placeRings();buildBg();
  const k=innermost();if(k>=0){const lim=rings[k].r-RW/2-RA;for(const m of mates)if(m.in){const dd=Math.hypot(m.x,m.y);if(dd>lim){m.x*=lim/dd;m.y*=lim/dd;}}}}
function ringCount(){return Math.min(NR,Math.floor((Rmax-r0)/4.6)+1);}
function placeRings(){
  const n=rings.length;if(!n)return;
  sp=(Rmax-r0)/Math.max(1,n-1);RW=sp>=6.5?3:2;
  rings.forEach((R,i)=>{R.r=r0+sp*i;R.gap=(GA+R.r*GB)/R.r;buildPix(R);});}
function buildPix(R){
  const xs=[],ys=[],as=[],sh=[],e=RW/2;
  for(let y=Math.floor(cy-R.r-3);y<=cy+R.r+3;y++)for(let x=Math.floor(cx-R.r-3);x<=cx+R.r+3;x++){
    const dx=x+.5-cx,dy=y+.5-cy,o=Math.hypot(dx,dy)-R.r;if(Math.abs(o)>e)continue;
    xs.push(x);ys.push(y);as.push(Math.atan2(dy,dx));sh.push(RW===3?(o>.5?2:o<-.5?1:0):(o>0?2:0));}
  R.cvs={};R.px={x:Int16Array.from(xs),y:Int16Array.from(ys),a:Float32Array.from(as),s:Uint8Array.from(sh)};}
function ringColors(){
  const P=theme.ring,n=rings.length;
  rings.forEach((R,i)=>{const f=n>1?i*(P.length-1)/(n-1):0,a=Math.floor(f),b=Math.min(P.length-1,a+1);
    R.cvs={};R.col=mix(P[a],P[b],f-a);R.dark=mix(R.col,theme.night?'#000000':'#1A1030',.28);R.light=mix(R.col,'#FFFFFF',.38);});}

/* ---------- background (空の菱形チェック・丘・水面をキャッシュ) ---------- */
function buildBg(){
  skyCv.width=W+12;skyCv.height=H+12;const s=skyCv.getContext('2d');
  for(let y=0;y<H+12;y++)for(let x=0;x<W+12;x++){
    const u=Math.floor((x+y)/12),v=Math.floor((x-y+600)/12);
    if(((u+v)&1)===0)continue;s.fillStyle=theme.sky[1];s.fillRect(x,y,1,1);}
  groundCv.width=W;groundCv.height=H;const q=groundCv.getContext('2d');
  const col=(c,x,y,w,h)=>{q.fillStyle=c;q.fillRect(x,y,w,h);};
  for(let x=0;x<W;x++){
    const f=Math.round(hillTop-8-5*Math.sin(x*.031+1.3)-3*Math.sin(x*.083+.4));col(theme.far,x,f,1,waterTop-f);
    const n=Math.round(hillTop+2-3*Math.sin(x*.047+2.1)-2*Math.sin(x*.13));col(theme.hill,x,n,1,waterTop-n);col(theme.hillD,x,n,1,1);}
  col(theme.water[0],0,waterTop,W,H-waterTop);col(mix(theme.water[0],'#FFFFFF',.55),0,waterTop,W,1);
  for(let y=waterTop+3;y<H;y+=3)for(let x=(y*7)%11;x<W;x+=11)col(theme.water[1],x,y,5,1);
  stars=[];if(theme.night)for(let i=0;i<Math.round(W*H/700);i++)stars.push([Math.floor(rnd(0,W)),Math.floor(rnd(0,hillTop-10)),rnd(0,TAU),rnd(1.5,3.5)]);
  document.body.style.background=theme.sky[0];}

/* ---------- round ---------- */
function innermost(){for(let i=0;i<rings.length;i++)if(rings[i].alive)return i;return -1;}
function nextSpecies(){if(!bag.length){bag=[...Array(NS).keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}return bag.pop();}
function newRound(){
  const n=ringCount();rings=[];
  let dir=Math.random()<.5?1:-1;
  for(let i=0;i<n;i++){
    if(Math.random()<.78)dir=-dir;
    rings.push({alive:true,ang:rnd(0,TAU),w:dir*rnd(.55,1.25),born:.2+i*.065,flash:0,hold:false,flip:false,close:0});}
  placeRings();ringColors();
  mates=[];caps=[];parts=[];labels=labels.filter(l=>l.t<.5);pals=0;tRound=0;tPhase=0;phase='build';
  caps.push({x:0,y:0,t:-(.35+n*.065),col:capColor()});}
const CAPC=['#FF8FA3','#7CC6FF','#FFE066','#8EDB8A','#C3A6FF','#FFB547','#9FE0E0'];
function capColor(){return CAPC[Math.floor(Math.random()*CAPC.length)];}

function label(s,x,y,col){labels.push({s,x:cl(x,tw(s)/2+3,W-tw(s)/2-3),y:cl(y,24,waterTop-6),col,t:0});}
function popRing(k,ex,ey){
  const R=rings[k];R.alive=false;const P=R.px;
  for(let i=0;i<P.x.length;i+=2){
    const rel=wrap(P.a[i]-R.ang);if(Math.abs(rel)<R.gap/2)continue;
    const c=Math.cos(P.a[i]),s=Math.sin(P.a[i]),v=rnd(8,42);
    parts.push({x:P.x[i]+.5,y:P.y[i]+.5,vx:c*v+rnd(-10,10),vy:s*v+rnd(-14,6),c:P.s[i]===2?R.dark:P.s[i]===1?R.light:R.col,life:rnd(.6,1.3),t:0});}
  label('POP!',cx+ex,cy+ey-8,'#E8453C');
  const nk=innermost();
  if(nk<0){phase='free';tPhase=0;const t=tRound;const nb=best===null||t<best;if(nb)best=t;freeInfo={t,nb};
    for(const m of mates)m.in=false;return;}
  rings[nk].flash=.25;
  caps.push({x:rnd(-2,2),y:rnd(-2,2),t:0,col:capColor()});}
let freeInfo=null;
function openCap(c){
  const sp2=nextSpecies(),a=rnd(0,TAU);
  mates.push({x:c.x,y:c.y,vx:Math.cos(a)*V,vy:Math.sin(a)*V,sp:sp2,t:rnd(0,3),in:true,hop:.35,out:false});
  pals=mates.length;
  for(let i=0;i<14;i++){const b=rnd(0,TAU),v=rnd(10,30);parts.push({x:cx+c.x,y:cy+c.y,vx:Math.cos(b)*v,vy:Math.sin(b)*v-10,c:i%2?c.col:'#FFFFFF',life:rnd(.3,.6),t:0});}
  if(phase==='build'){phase='run';tRound=0;}}

/* ---------- simulation ---------- */
function step(dt){
  rtime+=dt;tPhase+=dt;if(phase==='run')tRound+=dt;
  for(const R of rings){if(!R.hold)R.ang=wrap(R.ang+R.w*dt);if(R.flash>0)R.flash-=dt;if(R.close>0)R.close-=dt;}
  if(press&&!press.R.hold&&rtime-press.t0>.28){press.R.hold=true;}
  for(const c of caps){c.t+=dt;}
  for(let i=caps.length-1;i>=0;i--)if(caps[i].t>=.55){openCap(caps[i]);caps.splice(i,1);}
  const k=innermost(),sub=Math.max(1,Math.ceil(dt/.006)),h=dt/sub;
  for(let s=0;s<sub;s++){
    for(const m of mates){m.x+=m.vx*h;m.y+=m.vy*h;
      if(!m.in){const d=Math.hypot(m.x,m.y)||1;m.vx+=m.x/d*34*h;m.vy+=m.y/d*34*h;}}
    for(let i=0;i<mates.length;i++)for(let j=i+1;j<mates.length;j++){
      const a=mates[i],b=mates[j];if(a.in!==b.in)continue;const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,md=RA*2-.4;
      if(d2>=md*md||d2<1e-6)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(md-d)/2;
      a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny;}}
    if(k>=0&&phase!=='free'){const R=rings[innermost()];if(!R)break;
      for(const m of mates){if(!m.in)continue;
        const d=Math.hypot(m.x,m.y)||1e-6,lim=R.r-RW/2-RA;
        if(d<=lim)continue;
        const a=Math.atan2(m.y,m.x),rel=wrap(a-R.ang),half=R.gap/2,mg=RA*MG/R.r;
        if(Math.abs(rel)<half-mg){
          if(d>R.r+POPD){const kk=rings.indexOf(R);popRing(kk,m.x,m.y);break;}
          continue;}
        const nx=m.x/d,ny=m.y/d;m.x=nx*lim;m.y=ny*lim;
        const vn=m.vx*nx+m.vy*ny;
        if(vn>0){m.vx-=2*vn*nx;m.vy-=2*vn*ny;
          const q=rnd(-.2,.2),c=Math.cos(q),sn=Math.sin(q),vx=m.vx*c-m.vy*sn,vy=m.vx*sn+m.vy*c;
          if(vx*nx+vy*ny<0){m.vx=vx;m.vy=vy;}
          if(Math.abs(rel)<half+RA*2.6/R.r&&R.close<=0&&phase==='run'){R.close=1.4;label('CLOSE!',cx+m.x,cy+m.y-9,theme.hud);}}}}
    for(const m of mates){const sp2=Math.hypot(m.vx,m.vy)||1,tv=m.in?V:Math.max(V,sp2);m.vx*=tv/sp2;m.vy*=tv/sp2;}}
  for(const m of mates){m.t+=dt;if(m.hop>0)m.hop-=dt;
    if(!m.in&&!m.out){const X=cx+m.x,Y=cy+m.y;if(X<-8||X>W+8||Y<-8||Y>H+8){m.out=true;label('OUT!',X,Y,'#E0529C');}}}
  mates=mates.filter(m=>!m.out||m.t<0);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=70*dt;p.vx*=1-1.2*dt;}
  parts=parts.filter(p=>p.t<p.life);
  for(const l of labels){l.t+=dt;l.y-=9*dt;}labels=labels.filter(l=>l.t<.95);
  if(phase==='free'&&(tPhase>4.2||(tPhase>1.6&&!mates.length)))newRound();}

/* ---------- render ----------
   なめらかさのしくみ:
   ・丘・水面・輪・HUDは低解像度の板に描いて、整数倍(K)でそのまま拡大(=ドットの格子)。
   ・動物・カプセル・かけら・吹き出し・空の模様・水面のきらめきは、ドット絵を小さな板に一度だけ描いておき、
     画面のピクセル単位の位置に整数倍で貼る(ドットの大きさはそのまま、位置だけなめらか)。
   ・輪の隙間の端のドットは、隙間がどこまで来ているかに合わせて薄く描くので、隙間がするすると回って見える。 */
const sprCache=new Map();
function sprite(key,w,h,fn){let c=sprCache.get(key);if(!c){c=document.createElement('canvas');c.width=w;c.height=h;const og=g;g=c.getContext('2d');fn();g=og;sprCache.set(key,c);}return c;}
function blit(c,x,y){ctx.drawImage(c,Math.round(x*K),Math.round(y*K),c.width*K,c.height*K);}
function dot(x,y,w,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x*K),Math.round(y*K),w*K,K);}
const scr=document.createElement('canvas');let sg=scr.getContext('2d');
function ringCanvas(R,v,cols){
  if(R.cvs[v])return R.cvs[v];
  const n=Math.ceil(R.r*2+8),c=document.createElement('canvas');c.width=n;c.height=n;R.ox=Math.floor(cx-n/2);R.oy=Math.floor(cy-n/2);
  if(scr.width<n){scr.width=n;scr.height=n;sg=scr.getContext('2d');}
  const q=c.getContext('2d'),P=R.px;
  for(let sh=0;sh<3;sh++){q.fillStyle=cols[sh];for(let i=0;i<P.x.length;i++)if(P.s[i]===sh)q.fillRect(P.x[i]-R.ox,P.y[i]-R.oy,1,1);}
  return R.cvs[v]=c;}
function ringAng(R,gp){return gp===null?R.ang:R.ang+Math.sign(R.w)*gp;}
function render(gp){
  const T=gp===null?rtime:gp/TAU*3;
  ctx.imageSmoothingEnabled=false;
  /* sky (菱形チェックはなめらかに流れる) */
  ctx.fillStyle=theme.sky[0];ctx.fillRect(0,0,cv.width,cv.height);
  const off=gp===null?(rtime*3)%12:gp/TAU*12;
  ctx.drawImage(skyCv,Math.round(-off*K),Math.round(-off*K),skyCv.width*K,skyCv.height*K);
  /* grid layer: stars, hills, water, rings */
  g.clearRect(0,0,W,H);
  for(const s of stars){const b=.5+.5*Math.sin(s[2]+T*TAU/3*Math.round(s[3]));if(b>.35)px(s[0],s[1],b>.8?'#FFFFFF':'#9FB0E0');}
  g.drawImage(groundCv,0,0);
  for(const R of rings){
    if(!R.alive)continue;const age=tPhase-R.born;if(phase==='build'&&age<0)continue;
    const a0=ringAng(R,gp),P=R.px,white=(phase==='build'&&age<.14)||R.flash>0,hg=R.gap/2,rr=R.r;
    const cols=R.hold?[R.light,mix(R.light,'#FFFFFF',.4),R.col]:white?['#FFFFFF','#FFFFFF','#E4EEF8']:[R.col,R.light,R.dark];
    const rc=ringCanvas(R,R.hold?'h':white?'w':'n',cols),n=rc.width,lx=cx-R.ox,ly=cy-R.oy,rx=rr+4;
    /* 輪の絵を作業板に写し、隙間の扇形だけ抜く(扇形の縁はドットが半分だけ残る=隙間の端がなめらかに回る) */
    sg.globalCompositeOperation='copy';sg.drawImage(rc,0,0);
    sg.globalCompositeOperation='destination-out';sg.beginPath();sg.moveTo(lx,ly);
    sg.lineTo(lx+rx*2*Math.cos(a0-hg),ly+rx*2*Math.sin(a0-hg));sg.arc(lx,ly,rx*2,a0-hg,a0+hg);sg.closePath();sg.fill();
    g.drawImage(scr,0,0,n,n,R.ox,R.oy,n,n);}
  ctx.drawImage(buf,0,0,W*K,H*K);
  /* water sparkles (なめらか) */
  for(let i=0;i<Math.max(3,W/40);i++){const x=((i*47+T*(6+i%3*3))%(W+10))-5,y=waterTop+3+((i*5)%Math.max(1,H-waterTop-5));dot(x,y,3+i%3,theme.water[2]);}
  /* capsules */
  for(const c of caps){
    if(phase==='build'&&c.t<-.2&&gp===null)continue;
    const bob=c.t<0?0:-Math.abs(Math.sin(c.t*12))*2*(1-c.t/.55),wob=c.t>.3?Math.sin(c.t*60)*.8:0;
    const cc=sprite('c'+c.col,11,11,()=>drawCap(5.5,5.5,c.col));
    blit(cc,cx+c.x+wob-5.5,cy+c.y+bob-5.5);}
  /* animals */
  const order=mates.slice().sort((a,b)=>a.y-b.y);
  order.forEach((m,i)=>{
    const run=gp===null?m.t:gp/TAU*3+i*.37,fr=Math.floor(run*8)%2,A=SP[m.sp],gr=A.fw[fr],w=gr[0].length,h=gr.length;
    const fl=m.vx<0,bl=(run+i)%3.3<.12;
    const hop=m.hop>0?-Math.sin((1-m.hop/.35)*Math.PI)*3:0,bob=gp===null?0:Math.sin(gp*2+i)*.6;
    const c=sprite('a'+m.sp+'_'+fr+(fl?'f':'')+(bl?'b':''),w+2,h+2,()=>hamster(1+w/2,1+h/2,m.sp,{center:true,flip:fl,frame:gr,blink:bl}));
    blit(c,cx+m.x-w/2-1,cy+m.y+hop+bob-h/2-1);});
  if(gp===null){
    for(const p of parts){const a=1-p.t/p.life;if(a<.25&&(Math.floor(p.t*30)&1))continue;dot(p.x-.5,p.y-.5,1,p.c);}
    for(const l of labels){const w=tw(l.s)+4,ed=theme.night?'#1F2548':'#3A4460';
      const c=sprite('l'+l.s+l.col+ed,w,9,()=>{box(0,0,w,9,'#FFFFFF',ed);text(l.s,2,2,l.col);});
      blit(c,l.x-w/2,l.y-4);}}
  /* HUD (grid layer on top) */
  const og=g;g=gB;g.clearRect(0,0,W,H);
  const nr=phase==='build'?rings.length:Math.max(0,rings.filter(r=>r.alive).length);
  const hud=[['RINGS',String(nr)],['TIME',(phase==='build'?0:tRound).toFixed(1)],['PALS',String(pals)]];
  const span=Math.min(W,230)-8,L0=Math.round((W-span)/2),ws=hud.map(h=>tw(h[0]+' '+h[1])+6);
  hud.forEach((h,i)=>{const x=i===0?L0:i===2?L0+span-ws[i]:Math.round(W/2-ws[i]/2);
    box(x,4,ws[i],10,'#FFFFFF',theme.hud);text(h[0],x+3,7,mix(theme.hud,'#FFFFFF',.4));text(h[1],x+3+tw(h[0]+' '),7,theme.hud);});
  if(phase==='free'&&freeInfo&&gp===null){
    const bw=64,bh=freeInfo.nb||best!==null?34:28,bx=Math.round(cx-bw/2),by=Math.round(cy-bh/2);
    box(bx,by,bw,bh,'#FFFFFF',theme.hud);
    const f='FREE!';text(f,cx-tw(f,2)/2,by+4,'#2BA84A',2);
    const s=freeInfo.t.toFixed(1)+' SEC';text(s,cx-tw(s)/2,by+17,theme.hud);
    const b=(freeInfo.nb?'NEW BEST':'BEST '+best.toFixed(1));text(b,cx-tw(b)/2,by+25,freeInfo.nb?'#E0529C':mix(theme.hud,'#FFFFFF',.35));}
  g=og;ctx.drawImage(bufB,0,0,W*K,H*K);}
function drawCap(x,y,col){
  const CAP=["..TTTTT..",".TTLTTTT.","TTLTTTTTT","TTTTTTTTT","DDDDDDDDD","BBBBBBBBB","BBBBBBBBB",".BBBBBBB.","..BBBBB.."];
  const pal={T:col,L:mix(col,'#FFFFFF',.6),D:mix(col,'#3A3050',.35),B:'#FFFFFF'},x0=Math.round(x-4.5),y0=Math.round(y-4.5);
  g.fillStyle='#4A4660';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(CAP[r][c]!=='.'){g.fillRect(x0+c-1,y0+r,1,1);g.fillRect(x0+c+1,y0+r,1,1);g.fillRect(x0+c,y0+r-1,1,1);g.fillRect(x0+c,y0+r+1,1,1);}
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const ch=CAP[r][c];if(ch!=='.')px(x0+c,y0+r,pal[ch]);}}
function draw(){/* renderが画面へ直接描く */}

/* ---------- interaction ---------- */
let press=null;
function toBuf(e){return[e.clientX*cv.width/innerWidth/K,e.clientY*cv.height/innerHeight/K];}
function ringAt(bx,by){const d=Math.hypot(bx-cx,by-cy);let best2=null,bd=Math.max(sp/2,3.2);
  for(const R of rings){if(!R.alive)continue;const o=Math.abs(d-R.r);if(o<bd){bd=o;best2=R;}}return best2;}
cv.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();hintEl.classList.remove('on');
  const[bx,by]=toBuf(e);
  if(phase==='free'&&tPhase>.8){newRound();return;}
  const R=ringAt(bx,by);if(R)press={R,t0:rtime,id:e.pointerId};});
function release(e){if(!press||(e&&press.id!==e.pointerId))return;const R=press.R;
  if(R.hold){R.hold=false;}
  else if(R.alive){R.w=-R.w;R.flip=!R.flip;R.flash=.12;}
  press=null;}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function mutate(){
  let n;do{n=Math.floor(Math.random()*THEMES.length);}while(n===TH&&THEMES.length>1);
  TH=n;theme=THEMES[TH];NR=Math.floor(rnd(8,13));buildBg();newRound();say('空と輪を替えた(輪 '+ringCount()+' 本)');}
function resetAll(){newRound();say('この輪を、最初から');}

/* ---------- boot ---------- */
resize();newRound();addEventListener('resize',resize);
setTimeout(()=>hintEl.classList.add('on'),700);
setTimeout(()=>hintEl.classList.remove('on'),8500);
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!(window.APKit&&APKit.isExporting&&APKit.isExporting())){step(dt);render(null);draw();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(location.hash==='#debug')window.__lh={rings:()=>rings,theme:(i)=>{TH=i;theme=THEMES[i];buildBg();ringColors();},set:(o)=>{if('V'in o)V=o.V;if('GA'in o)GA=o.GA;if('GB'in o)GB=o.GB;if('MG'in o)MG=o.MG;if('POPD'in o)POPD=o.POPD;},step,get:()=>({phase,tRound,best,pals,alive:rings.filter(r=>r.alive).length,n:rings.length}),newRound,mutate,render,draw};

if(window.APKit)APKit.init({
  canvas:cv,
  gifName:'loophole-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){render(phase);draw();},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
</body>
