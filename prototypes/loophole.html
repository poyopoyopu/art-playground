<!doctype html>
<!-- LOOPHOLE — クロード作(おっちゃんが見せてくれた「回る虹色の輪から小さな生き物が抜け出していく」ドット絵動画から着想。
     おっちゃん「もはやアートではなくゲーム」→「かけらが積もって記録になる」「輪が入れ子で増殖する」の二つで作り直し。住人はHAMSTER DROPの動物たち)。ap-kit.js統合: クロード -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LOOPHOLE — 抜けた輪は、地面に積もる</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#D2EAF8}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(9% + env(safe-area-inset-top,0px));text-align:center;
  font:600 12px/1.9 "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.97);
  text-shadow:0 1px 0 rgba(30,40,70,.85),0 0 6px rgba(30,40,70,.7);pointer-events:none;transition:opacity 1.6s ease;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">輪をくぐり抜けた子のまわりに、ひとまわり小さな輪が生まれる<br>はじけた輪は、地面に積もっていく<br>輪に触れると逆回り、長押しのあいだは止まる</div>
<script>
(function(){
'use strict';
/* ─────────────────────────────────────────────────────────────
   世界のルール:「くぐり抜けた子のまわりには、ひとまわり小さな輪が生まれる。はじけた輪は、地面に積もる」
   ・空に、回り続ける虹色の輪の巣がひとつ。どの輪にも隙間が一か所あり、中の動物が隙間をくぐると、その輪ははじける。
   ・巣の最後の輪をくぐり抜けた子のまわりには、同じ形のひとまわり小さな巣が生まれ、カプセルから仲間がひとり加わる。
     大きな巣(6重)→ 中の巣(4重)→ 小さな巣(3重)→ いちばん小さな巣(2重)と、同じ形が縮みながら 1→1→2→4 つに増えていく(入れ子の増殖)。
     いちばん小さな巣を抜けた子たちは地面に降りて、積もった層の上を歩いて去っていく。巣が全部消えたら、また大きな巣から。
   ・はじけた輪のかけらは落ちて地面に積もる。どの輪がいつはじけたかが色の層になって残り、層が厚くなると古い層から下へ沈んでいく。
     ✦で空と輪の色を替えると、その時代の色が新しい層として重なる(地面は「いつ、どの色の世界だったか」の記録になる)。
   ・触れた輪は逆回りになり、長押しのあいだは止まる(隙間を呼び寄せたり、閉じ込めたりできる)。
   ✦ = 空と輪の色を替える(積もった層はそのまま) / ↻ = 地面をならして最初から
   ───────────────────────────────────────────────────────────── */
const TAU=Math.PI*2,S=180,RA=3.6,TOP=4;let V=70,GA=18,GB=1.1,GM=1.7;
const GENS=[{f:.92,n:5},{f:.52,n:4},{f:.32,n:3},{f:.2,n:2}];
let W=S,H=390,K=4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hintEl=document.getElementById('hint');
const buf=document.createElement('canvas');let g=buf.getContext('2d');
const sedCv=document.createElement('canvas');let sq=sedCv.getContext('2d');
const skyCv=document.createElement('canvas');
const scr=document.createElement('canvas');let sg=scr.getContext('2d');
const cl=(u,a,b)=>u<a?a:u>b?b:u,rnd=(a,b)=>a+Math.random()*(b-a),wrap=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
function px(x,y,c){g.fillStyle=c;g.fillRect(Math.floor(x),Math.floor(y),1,1);}
function hx(c){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,u){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*u).toString(16).padStart(2,'0')).join('');}

/* ---------- animals (HAMSTER DROPの20種・右向き。左へ動く時は反転) ---------- */
const PK='#FFC2D1';
const SP=[
{n:'ハムスター',O:'#B8672A',p:{B:'#F2A24E',W:'#FFF6EA',E:'#F2A7A0',N:'#FF8FA3',C:PK,F:'#F7B5B5'},s:["...E....","..EBBB..",".BBBBBB.","BBBBBKBB","BBBBBBCN","BBBBWWWW",".WWWWWW.","..F..F.."]},
{n:'モルモット',O:'#6B4A2E',p:{B:'#E8A060',D:'#8A6448',W:'#FFFFFF',E:'#F2A7A0',N:'#FF8FA3',F:'#F7B5B5'},s:["......EE..","..DDBWBBB.",".DDDBWBKBB","DDDBBWBBBN","DDBBBWWWWW",".WWWWWWWW.","..F....F.."]},
{n:'ねずみ',O:'#7C7890',p:{B:'#B9B6C4',E:'#FFB3C6',N:'#FF8FA3',T:'#FFB3C6',W:'#FFFFFF',F:'#F7B5B5'},s:[".....BBB...","....BEEEB..","..BBBEEBBB.",".BBBBBBBKB.","TBBBBBBBBBN","T.BBBBBBBW.",".T.F...F..."]},
{n:'りす',O:'#8A5028',p:{T:'#C07A40',L:'#E8B070',B:'#D98C48',W:'#FFF0DC',E:'#8A5028',N:'#4A3428',F:'#D98C48'},s:["..TT....E..",".TTTT..BBB.","TTTLT.BBBKB","TTTLTBBBBBN",".TTTBBWWBB.","..TTBBWWB..","....F..F..."]},
{n:'うさぎ',O:'#B8A8B8',p:{B:'#FFFFFF',E:'#FFB3C6',T:'#F4F0F4',N:'#FF8FA3',C:PK,F:'#F7B5B5'},s:["......BB..","......BE..","......BE..",".....BBBB.",".BBBBBBKBB","TBBBBBBBCN",".BBBBBBBB.","..F...FF.."]},
{n:'ひよこ',O:'#C9A227',p:{B:'#FFE066',W:'#F2C94C',N:'#FF9F43',C:'#FFB3A0',F:'#FF9F43'},s:[".....B...","...BBBB..","..BBBBKB.",".BBWWBBCN","BBBWWWBB.",".BBBBBBB.","..BBBBB..","...F.F..."]},
{n:'アヒル',O:'#B8B0B8',p:{B:'#FFFFFF',W:'#E6E6EE',N:'#FFB547',T:'#FFFFFF',F:'#FF9F43'},s:["......BBB..",".....BBBKB.",".....BBBBNN","T....BBB...","TBBBBBBB...","BBBBWWBBB..",".BBBBBBBB..","...F..F...."]},
{n:'ペンギン',O:'#232B3C',p:{B:'#3E4A63',W:'#FFFFFF',D:'#2E3850',N:'#FF9F43',F:'#FF9F43'},s:["..BBBB..",".BBBWKB.",".BBBBBNN",".BBWWWW.","BDBWWWW.",".BBWWWW.",".BBWWW..","..FF.F.."]},
{n:'ハリネズミ',O:'#5E4630',p:{S:'#8A6A4A',W:'#F6E3C8',N:'#2A1E1A',F:'#F7B5B5'},s:["..S.S.S...",".SSSSSSS..","SSSSSSSWW.","SSSSSSWKWW","SSSSSSWWWN",".WWWWWWWW.","..F...F..."]},
{n:'カピバラ',O:'#6B4A30',p:{B:'#A07A55',Y:'#FFB547',E:'#6B4A30',N:'#4A3428',F:'#8A6448'},s:["...YY.E....","....BBBBB..","..BBBBBKBB.",".BBBBBBBBBB","BBBBBBBBBBN","BBBBBBBBBB.",".BBBBBBBB..","..F....F..."]},
{n:'こぶた',O:'#D9708E',p:{B:'#FFC2D1',E:'#FF8FAE',N:'#FF8FAE',T:'#FF8FAE',F:'#FF8FAE'},s:["......E...","...BBBEB..",".BBBBBBKB.","TBBBBBBBNN",".BBBBBBBNN",".BBBBBBBB.","..F...F..."]},
{n:'ひつじ',O:'#C8C0B8',p:{W:'#FFFFFF',H:'#F2DCC0',C:PK,D:'#6B5A50'},s:["..W.W.W....",".WWWWWWWHH.","WWWWWWWHHKH","WWWWWWWWHHC","WWWWWWWWW..",".WWWWWWWW..","..D...D...."]},
{n:'子ぐま',O:'#7A5436',p:{B:'#B98A60',E:'#E0B890',W:'#F2DCC0',N:'#2A1E1A',C:PK,F:'#E0B890'},s:[".....BB...","....BEBBB.",".BBBBBBBKB","BBBBBBBBWN","BBBBBBBCWW","BBBBBBBBB.",".BBBBBBB..","..F...F..."]},
{n:'コアラ',O:'#6E6A78',p:{B:'#A7A6B0',W:'#FFFFFF',N:'#3A3440',C:PK,F:'#8A8894'},s:["...BBB....","..BWWBBB..","..BWWBBBB.",".BBBBBBKNN","BBBBBBBCNN","BBBWWWBBB.",".BBWWWBB..","..F...F..."]},
{n:'フクロウ',O:'#6B4A2E',p:{B:'#B98A60',W:'#FFFFFF',D:'#8A6448',L:'#F2DCC0',N:'#FFB547',F:'#FFB547'},s:["B.....B","BBBBBBB","BWWBWWB","BWKBKWB","BBBNBBB","BDLLLDB",".DLLLD.",".F...F."]},
{n:'タヌキ',O:'#4A3428',p:{B:'#A07A55',D:'#5A4232',W:'#F2E6D0',E:'#4A3428',T:'#A07A55',N:'#2A1E1A',F:'#5A4232'},s:["......E...",".....BBB..","TT..BBDKW.","TTBBBBDWWN","DTBBBBBWW.","..BBBBBB..","..F...F..."]},
{n:'キツネ',O:'#A0501C',p:{B:'#F08A3C',T:'#F08A3C',L:'#FFFFFF',W:'#FFFFFF',E:'#4A3428',N:'#2A1E1A',F:'#4A3428'},s:[".......E...","......BBB..","T.....BBKB.","TT.BBBBBWWN","LTTBBBBBW..","LLTBBBBB...","...F..F...."]},
{n:'レッサーパンダ',O:'#7A3418',p:{B:'#C8602C',T:'#C8602C',S:'#7A3418',W:'#FFFFFF',N:'#2A1E1A',F:'#4A2A20'},s:["......W...",".....BBB..","S...BWBKB.","TS.BBBBWWN","ST.BBBBBW.",".TSBBBBB..","...F..F..."]},
{n:'カメ',O:'#3C7A30',p:{S:'#6FB05A',L:'#A8D88A',R:'#E8C88A',B:'#9AD07A',F:'#9AD07A'},s:["..SSSS.....",".SSLLSS....","SSLSSLSSBB.","SSSSSSSSBKB","RRRRRRRRBBB",".F.F..F.F.."]},
{n:'ちびゾウ',O:'#6E7890',p:{B:'#A9B4C8',E:'#FFC2D1',C:'#FFC2D1',F:'#A9B4C8'},s:["....BBBBB.","..BBEEBBBB",".BBBEEBKBB","BBBBEEBBBB","BBBBBBBB.B","BBBBBBBB.C",".BF..BF..."]}];
const NS=SP.length;
function rotGrid(gr,k){let a=gr.map(r=>r.split(''));for(let n=0;n<k;n++){const h=a.length,w=a[0].length,b=[];for(let x=0;x<w;x++){const row=[];for(let y=h-1;y>=0;y--)row.push(a[y][x]);b.push(row);}a=b;}return a;}
SP.forEach(a=>{a.fr=[0,1,2,3].map(k=>rotGrid(a.s,k));const s2=a.s.slice(),lr=s2[s2.length-1];s2[s2.length-1]='.'+lr.slice(0,-1);a.fw=[rotGrid(a.s,0),rotGrid(s2,0)];});
function hamster(x,y,sp,o){o=o||{};const A=SP[sp],gr=o.frame||A.fr[0],h=gr.length,w=gr[0].length,fl=!!o.flip;
  const x0=Math.round(x-w/2),y0=o.center?Math.round(y-h/2):Math.round(y)-h+1,X=c=>x0+(fl?w-1-c:c);
  g.fillStyle=A.O;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){if(gr[r][c]==='.')continue;const xx=X(c);g.fillRect(xx-1,y0+r,1,1);g.fillRect(xx+1,y0+r,1,1);g.fillRect(xx,y0+r-1,1,1);g.fillRect(xx,y0+r+1,1,1);}
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){let ch=gr[r][c];if(ch==='.')continue;
    if(ch==='K'&&o.blink){const nb=gr[r][c-1]||gr[r][c+1];if(nb&&nb!=='.'&&nb!=='K')ch=nb;}
    px(X(c),y0+r,ch==='K'?'#2A1E1A':(A.p[ch]||'#2A1E1A'));}}

/* ---------- themes (空と輪の色。✦で替わり、積もる層の色も時代ごとに変わる) ---------- */
const THEMES=[
 {sky:['#D2EAF8','#C2E0F4'],soil:['#9C7B5B','#8A6B4E'],night:0,ring:['#E8453C','#F2842A','#F4C22E','#8CC63F','#2BA84A','#1FB5A8','#2E9AE0','#3B5BDB','#7B4FD6','#E0529C']},
 {sky:['#FFE0C4','#FFD2B4'],soil:['#8E6A6E','#7E5C62'],night:0,ring:['#FF6F61','#FF9A5A','#FFC857','#F9E07F','#B5E48C','#76C9B8','#6FA8DC','#8E7CC3','#C27BA0','#F28DB2']},
 {sky:['#1F2548','#252C54'],soil:['#3A3A58','#2F2F4A'],night:1,ring:['#FF4D6D','#FF8E3C','#FFE14D','#9BF55A','#3DF0A0','#3DE6F0','#4DA8FF','#7A6CFF','#C15CFF','#FF5CC8']},
 {sky:['#E6F4E4','#D8EDD6'],soil:['#8FA27A','#7F926C'],night:0,ring:['#F28BA8','#F5A97F','#EFCB68','#A9D67A','#6FCB9F','#5FC4C4','#76A9E0','#9A8FE0','#C48FE0','#EA8FC4']}];
let TH=0,theme=THEMES[0];

/* ---------- state ---------- */
let nests=[],walkers=[],parts=[],stars=[],cols=[],sedW=0;
let limitH=90,skyBot=290,Rmax=80,cx0=90,cy0=140,rtime=0,idle=0,cycles=0,bag=[];

function resize(){
  const d=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
  /* 1ドット=画面のKピクセル(整数)。動くものは画面のピクセル単位でなめらかに動かし、ドットの大きさは変えない */
  K=Math.max(1,Math.round(Math.min(cv.width,cv.height)/S));
  W=Math.ceil(cv.width/K);H=Math.ceil(cv.height/K);
  buf.width=W;buf.height=H;g=buf.getContext('2d');
  layout();}
function layout(){
  limitH=Math.round(H*(H>W?.24:.2));skyBot=H-limitH-3;
  Rmax=Math.floor(Math.min(W/2-4,(skyBot-TOP)/2));
  cx0=W/2;cy0=Math.round(cl(TOP+(skyBot-TOP)*.47,TOP+Rmax,skyBot-Rmax));
  resampleSed();buildBg();
  for(const N of nests){geom(N);N.x=cl(N.x,N.R+2,W-N.R-2);N.y=cl(N.y,TOP+N.R,skyBot-N.R);}}
function buildBg(){
  skyCv.width=W+12;skyCv.height=H+12;const s=skyCv.getContext('2d');s.fillStyle=theme.sky[1];
  for(let y=0;y<H+12;y++)for(let x=0;x<W+12;x++){const u=Math.floor((x+y)/12),v=Math.floor((x-y+600)/12);if((u+v)&1)s.fillRect(x,y,1,1);}
  stars=[];if(theme.night)for(let i=0;i<Math.round(W*H/700);i++)stars.push([Math.floor(rnd(0,W)),Math.floor(rnd(0,skyBot)),rnd(0,TAU),Math.round(rnd(1,4))]);
  document.body.style.background=theme.sky[0];}

/* ---------- sediment (はじけた輪のかけらが積もる地面) ---------- */
function initSed(){cols=[];for(let x=0;x<W;x++){const c=[];for(let i=0;i<5;i++)c.push(theme.soil[((x*7+i*3)%5)<2?1:0]);cols.push(c);}sedW=W;drawSed();}
function maxH(){let m=0;for(const c of cols)if(c.length>m)m=c.length;return m;}
function drawSed(){sedCv.width=W;sedCv.height=H;sq=sedCv.getContext('2d');
  for(let x=0;x<W;x++){const c=cols[x];for(let i=0;i<c.length;i++){sq.fillStyle=c[i];sq.fillRect(x,H-1-i,1,1);}}}
function resampleSed(){
  if(!cols.length){initSed();return;}
  if(sedW!==W){const o=cols;cols=[];for(let x=0;x<W;x++)cols.push(o[Math.min(o.length-1,Math.floor(x*o.length/W))].slice());sedW=W;}
  while(maxH()>limitH)for(const c of cols)if(c.length>1)c.shift();
  drawSed();}
/* 層が厚くなったら、いちばん古い(下の)層から沈んで見えなくなる */
function sinkSed(){for(const c of cols)if(c.length>1)c.shift();drawSed();}
function surf(x){return H-cols[cl(Math.floor(x),0,W-1)].length;}
function deposit(xf,c){
  let x=Math.floor(xf),dir=Math.random()<.5?-1:1;if(x<0||x>=W)return;
  /* かけらは低いほうへ転がり、平らな段の上も転がり続けるので、ほぼ平らな層になって広がる(=色の縞が時間の記録になる) */
  const L=i=>i<0||i>=W?1e9:cols[i].length;
  for(let n=0;n<W*2;n++){const h=L(x),a=L(x+dir),b=L(x-dir);
    if(a<h){x+=dir;continue;}if(b<h){dir=-dir;x+=dir;continue;}
    if(a===h&&Math.random()<.99){x+=dir;continue;}break;}
  cols[x].push(c);sq.fillStyle=c;sq.fillRect(x,H-cols[x].length,1,1);
  if(cols[x].length>limitH)sinkSed();}

/* ---------- nests (輪の巣。どの世代も同じ形で、縮みながら増える) ---------- */
function innermost(N){for(let i=0;i<N.rings.length;i++)if(N.rings[i].alive)return i;return -1;}
function nextSpecies(){if(!bag.length){bag=[...Array(NS).keys()];for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}return bag.pop();}
const CAPC=['#FF8FA3','#7CC6FF','#FFE066','#8EDB8A','#C3A6FF','#FFB547','#9FE0E0'];
function makeNest(gen,x,y,mates){
  const spec=GENS[gen],N={gen,x,y,vx:0,vy:0,t:0,rings:[],mates:mates||[],caps:[],dead:false};
  let dir=Math.random()<.5?1:-1;
  for(let i=0;i<spec.n;i++){if(Math.random()<.75)dir=-dir;N.rings.push({alive:true,ang:rnd(0,TAU),w:dir*rnd(.6,1.3),born:.08+i*.07,flash:0,hold:false});}
  geom(N);colorNest(N);
  N.caps.push({x:rnd(-1.5,1.5),y:rnd(-1.5,1.5),t:-(spec.n*.07+.15),col:CAPC[Math.floor(Math.random()*CAPC.length)]});
  N.x=cl(N.x,N.R+2,W-N.R-2);N.y=cl(N.y,TOP+N.R,skyBot-N.R);
  nests.push(N);return N;}
function geom(N){
  const n=N.rings.length;let R=Math.max(12,Rmax*GENS[N.gen].f);const r0=Math.max(11,R*.4);R=Math.max(R,r0+(n-1)*5);
  N.R=R;N.sp=n>1?(R-r0)/(n-1):6;N.RW=N.sp>=7?3:2;
  N.rings.forEach((Q,i)=>{Q.r=n>1?r0+N.sp*i:R;Q.gap=Math.min(GM,(GA+GB*Q.r)/Q.r);buildPix(Q,N.RW);});
  const k=innermost(N);if(k>=0){const lim=N.rings[k].r-N.RW/2-RA;for(const m of N.mates){const d=Math.hypot(m.x,m.y);if(d>lim){m.x*=lim/d;m.y*=lim/d;}}}}
function buildPix(Q,RW){
  const n=2*Math.ceil(Q.r+3),xs=[],ys=[],as=[],sh=[],e=RW/2;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x+.5-n/2,dy=y+.5-n/2,o=Math.hypot(dx,dy)-Q.r;if(Math.abs(o)>e)continue;
    xs.push(x);ys.push(y);as.push(Math.atan2(dy,dx));sh.push(RW===3?(o>.5?2:o<-.5?1:0):(o>0?2:0));}
  Q.n=n;Q.cvs={};Q.px={x:Int16Array.from(xs),y:Int16Array.from(ys),a:Float32Array.from(as),s:Uint8Array.from(sh)};
  if(scr.width<n||scr.height<n){const m=Math.max(n,scr.width,scr.height);scr.width=m;scr.height=m;sg=scr.getContext('2d');}}
function colorNest(N){
  const P=theme.ring,n=N.rings.length;
  N.rings.forEach((Q,i)=>{const f=n>1?i*(P.length-1)/(n-1):0,a=Math.floor(f),b=Math.min(P.length-1,a+1);
    Q.cvs={};Q.col=mix(P[a],P[b],f-a);Q.dark=mix(Q.col,theme.night?'#000000':'#1A1030',.28);Q.light=mix(Q.col,'#FFFFFF',.38);});}
function ringCanvas(Q,v,colsh){
  if(Q.cvs[v])return Q.cvs[v];
  const c=document.createElement('canvas');c.width=Q.n;c.height=Q.n;const q=c.getContext('2d'),P=Q.px;
  for(let s=0;s<3;s++){q.fillStyle=colsh[s];for(let i=0;i<P.x.length;i++)if(P.s[i]===s)q.fillRect(P.x[i],P.y[i],1,1);}
  return Q.cvs[v]=c;}

function newCycle(){cycles++;idle=0;makeNest(0,cx0,cy0,[]);}
function say(m){if(window.APKit&&APKit.toast)APKit.toast(m,2400);}

/* 輪がはじける:かけらの一部は落ちて地面に積もる */
function popRing(N,k,m){
  const Q=N.rings[k],P=Q.px,o=Q.n/2;Q.alive=false;
  for(let i=0;i<P.x.length;i++){
    if(Math.abs(wrap(P.a[i]-Q.ang))<Q.gap/2)continue;
    const dep=i%4===0;if(!dep&&(i&1))continue;
    const c=Math.cos(P.a[i]),s=Math.sin(P.a[i]),v=rnd(6,30);
    parts.push({x:N.x-o+P.x[i]+.5,y:N.y-o+P.y[i]+.5,vx:c*v+rnd(-8,8),vy:s*v+rnd(-12,4),c:dep?Q.col:(P.s[i]===2?Q.dark:P.s[i]===1?Q.light:Q.col),life:rnd(.5,1.1),t:0,dep});}
  for(let i=0;i<8;i++){const b=rnd(0,TAU),v=rnd(12,30);parts.push({x:N.x+m.x,y:N.y+m.y,vx:Math.cos(b)*v,vy:Math.sin(b)*v,c:'#FFFFFF',life:rnd(.25,.45),t:0,dep:false});}
  const nk=innermost(N);
  if(nk<0)release(N);else N.rings[nk].flash=.2;}
/* 巣の最後の輪を抜けた:ひとまわり小さな巣が、抜けた子それぞれのまわりに生まれる(いちばん小さな巣の子は地面へ) */
function release(N){
  N.dead=true;
  for(const m of N.mates){
    const ax=N.x+m.x,ay=N.y+m.y;
    if(N.gen<GENS.length-1){m.x=0;m.y=0;m.hop=.35;const a=rnd(0,TAU);m.vx=Math.cos(a)*V;m.vy=Math.sin(a)*V;makeNest(N.gen+1,ax,ay,[m]);}
    else walkers.push({x:ax,y:ay,vy:-24,sp:m.sp,dir:ax<W/2?-1:1,t:m.t,st:'fall'});}}
function openCap(N,c){
  const a=rnd(0,TAU);N.mates.push({x:c.x,y:c.y,vx:Math.cos(a)*V,vy:Math.sin(a)*V,sp:nextSpecies(),t:rnd(0,3),hop:.35});
  for(let i=0;i<12;i++){const b=rnd(0,TAU),v=rnd(10,28);parts.push({x:N.x+c.x,y:N.y+c.y,vx:Math.cos(b)*v,vy:Math.sin(b)*v-10,c:i%2?c.col:'#FFFFFF',life:rnd(.3,.6),t:0,dep:false});}}

/* ---------- simulation ---------- */
let press=null;
function step(dt){
  rtime+=dt;
  if(press&&!press.Q.hold&&rtime-press.t0>.28)press.Q.hold=true;
  /* 巣どうしは押し合い、空の中にとどまる */
  for(let i=0;i<nests.length;i++){const A=nests[i];
    for(let j=i+1;j<nests.length;j++){const B=nests[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.01,ov=A.R+B.R+3-d;
      if(ov>0){const nx=dx/d,ny=dy/d,ma=A.R*A.R,mb=B.R*B.R,f=ov*10*dt;A.vx-=nx*f*mb/(ma+mb);A.vy-=ny*f*mb/(ma+mb);B.vx+=nx*f*ma/(ma+mb);B.vy+=ny*f*ma/(ma+mb);}}
    const R=A.R+2;let sb=skyBot;for(let s=-1;s<=1;s++)sb=Math.min(sb,surf(A.x+s*A.R*.7)-3);
    if(A.x<R)A.vx+=(R-A.x)*10*dt;if(A.x>W-R)A.vx-=(A.x-(W-R))*10*dt;
    if(A.y<TOP+R)A.vy+=(TOP+R-A.y)*10*dt;if(A.y>sb-R)A.vy-=(A.y-(sb-R))*10*dt;
    A.vx+=(cx0-A.x)*.8*dt;A.vy+=(cy0-A.y)*.8*dt;/* 空の真ん中へゆるく引かれ、押し合って並ぶ */
    A.vx*=1-3*dt;A.vy*=1-3*dt;A.x+=A.vx*dt;A.y+=A.vy*dt;A.t+=dt;
    for(const Q of A.rings){if(!Q.hold)Q.ang=wrap(Q.ang+Q.w*dt);if(Q.flash>0)Q.flash-=dt;}
    for(const c of A.caps)c.t+=dt;
    for(let c=A.caps.length-1;c>=0;c--)if(A.caps[c].t>=.55){openCap(A,A.caps[c]);A.caps.splice(c,1);}}
  /* 動物:壁で跳ね返り、隙間をくぐると輪がはじける */
  const sub=Math.max(1,Math.ceil(dt/.006)),h=dt/sub;
  for(const N of nests.slice()){
    for(let s=0;s<sub&&!N.dead;s++){
      const ms=N.mates;
      for(const m of ms){m.x+=m.vx*h;m.y+=m.vy*h;}
      for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){
        const a=ms[i],b=ms[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,md=RA*2-.4;
        if(d2>=md*md||d2<1e-6)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(md-d)/2;
        a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny;}}
      const k=innermost(N);if(k<0)break;const Q=N.rings[k];
      for(const m of ms){
        const d=Math.hypot(m.x,m.y)||1e-6,lim=Q.r-N.RW/2-RA;if(d<=lim)continue;
        const a=Math.atan2(m.y,m.x),rel=wrap(a-Q.ang),half=Q.gap/2,mg=RA*.4/Q.r;
        if(Math.abs(rel)<half-mg){if(d>Q.r){popRing(N,k,m);break;}continue;}
        const nx=m.x/d,ny=m.y/d;m.x=nx*lim;m.y=ny*lim;
        const vn=m.vx*nx+m.vy*ny;
        if(vn>0){m.vx-=2*vn*nx;m.vy-=2*vn*ny;
          const q=rnd(-.2,.2),c=Math.cos(q),sn=Math.sin(q),vx=m.vx*c-m.vy*sn,vy=m.vx*sn+m.vy*c;if(vx*nx+vy*ny<0){m.vx=vx;m.vy=vy;}}}
      for(const m of ms){const sp=Math.hypot(m.vx,m.vy)||1;m.vx*=V/sp;m.vy*=V/sp;}}
    for(const m of N.mates){m.t+=dt;if(m.hop>0)m.hop-=dt;}}
  nests=nests.filter(N=>!N.dead);
  /* 地面に降りた子は、積もった層の上を歩いて去る */
  for(const w of walkers){w.t+=dt;const hh=4;
    if(w.st==='fall'){w.vy+=140*dt;w.y+=w.vy*dt;w.x+=w.dir*6*dt;if(w.y>=surf(w.x)-hh){w.y=surf(w.x)-hh;w.st='walk';}}
    else{w.x+=w.dir*13*dt;const ty=surf(w.x)-hh;w.y+=(ty-w.y)*Math.min(1,14*dt);}}
  walkers=walkers.filter(w=>w.x>-14&&w.x<W+14);
  for(const p of parts){p.t+=dt;p.vy+=(p.dep?110:70)*dt;p.vx*=1-1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.dep&&p.y>=surf(p.x)){deposit(p.x,p.c);p.t=1e9;}}
  parts=parts.filter(p=>p.x>-2&&p.x<W+2&&(p.dep?p.t<1e8:p.t<p.life));
  if(!nests.length){idle+=dt;if(idle>2.4)newCycle();}}

/* ---------- render ----------
   地面(積もった層)と星はドットの格子に描いて整数倍で拡大。
   輪・カプセル・動物・かけらは、ドット絵を小さな板に描いてから画面のピクセル単位の位置に整数倍で貼る(ドットはそのまま、動きはなめらか)。
   輪の隙間は扇形で抜くので、端のドットが半分だけ残り、隙間がするすると回って見える。 */
const sprCache=new Map();
function sprite(key,w,h,fn){let c=sprCache.get(key);if(!c){c=document.createElement('canvas');c.width=w;c.height=h;const og=g;g=c.getContext('2d');fn();g=og;sprCache.set(key,c);}return c;}
function blit(c,x,y,sw,sh){sw=sw||c.width;sh=sh||c.height;ctx.drawImage(c,0,0,sw,sh,Math.round(x*K),Math.round(y*K),sw*K,sh*K);}
function dot(x,y,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x*K),Math.round(y*K),K,K);}
function drawCap(x,y,col){
  const CAP=["..TTTTT..",".TTLTTTT.","TTLTTTTTT","TTTTTTTTT","DDDDDDDDD","BBBBBBBBB","BBBBBBBBB",".BBBBBBB.","..BBBBB.."];
  const pal={T:col,L:mix(col,'#FFFFFF',.6),D:mix(col,'#3A3050',.35),B:'#FFFFFF'},x0=Math.round(x-4.5),y0=Math.round(y-4.5);
  g.fillStyle='#4A4660';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(CAP[r][c]!=='.'){g.fillRect(x0+c-1,y0+r,1,1);g.fillRect(x0+c+1,y0+r,1,1);g.fillRect(x0+c,y0+r-1,1,1);g.fillRect(x0+c,y0+r+1,1,1);}
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const ch=CAP[r][c];if(ch!=='.')px(x0+c,y0+r,pal[ch]);}}
function animal(x,y,sp,run,flip,blinkKey){
  const A=SP[sp],fr=Math.floor(run*8)%2,gr=A.fw[fr],w=gr[0].length,h=gr.length,bl=(run+blinkKey)%3.3<.12;
  const c=sprite('a'+sp+'_'+fr+(flip?'f':'')+(bl?'b':''),w+2,h+2,()=>hamster(1+w/2,1+h/2,sp,{center:true,flip,frame:gr,blink:bl}));
  blit(c,x-w/2-1,y-h/2-1);}
function render(gp){
  const T=gp===null?rtime:gp/TAU*3;
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle=theme.sky[0];ctx.fillRect(0,0,cv.width,cv.height);
  const off=gp===null?(rtime*3)%12:gp/TAU*12;
  ctx.drawImage(skyCv,Math.round(-off*K),Math.round(-off*K),skyCv.width*K,skyCv.height*K);
  g.clearRect(0,0,W,H);
  for(const s of stars){const b=.5+.5*Math.sin(s[2]+T*TAU/3*s[3]);if(b>.35)px(s[0],s[1],b>.8?'#FFFFFF':'#9FB0E0');}
  g.drawImage(sedCv,0,0);
  ctx.drawImage(buf,0,0,W*K,H*K);
  /* rings */
  for(const N of nests)for(const Q of N.rings){
    if(!Q.alive)continue;const age=N.t-Q.born;if(age<0)continue;
    const a0=gp===null?Q.ang:Q.ang+Math.sign(Q.w)*gp,white=age<.14||Q.flash>0,hg=Q.gap/2,n=Q.n,c=n/2,rx=Q.r*2+8;
    const colsh=Q.hold?[Q.light,mix(Q.light,'#FFFFFF',.4),Q.col]:white?['#FFFFFF','#FFFFFF','#E4EEF8']:[Q.col,Q.light,Q.dark];
    const rc=ringCanvas(Q,Q.hold?'h':white?'w':'n',colsh);
    sg.globalCompositeOperation='copy';sg.drawImage(rc,0,0);
    sg.globalCompositeOperation='destination-out';sg.beginPath();sg.moveTo(c,c);
    sg.lineTo(c+rx*Math.cos(a0-hg),c+rx*Math.sin(a0-hg));sg.arc(c,c,rx,a0-hg,a0+hg);sg.closePath();sg.fill();
    blit(scr,N.x-c,N.y-c,n,n);}
  /* capsules */
  for(const N of nests)for(const cp of N.caps){
    if(cp.t<-.25)continue;
    const bob=cp.t<0?0:-Math.abs(Math.sin(cp.t*12))*2*(1-cp.t/.55),wob=cp.t>.3?Math.sin(cp.t*60)*.8:0;
    blit(sprite('c'+cp.col,11,11,()=>drawCap(5.5,5.5,cp.col)),N.x+cp.x+wob-5.5,N.y+cp.y+bob-5.5);}
  /* animals (巣の中の子と、地面を歩く子) */
  const list=[];
  for(const N of nests)for(const m of N.mates)list.push([N.x+m.x,N.y+m.y,m]);
  list.sort((a,b)=>a[1]-b[1]);
  list.forEach(([x,y,m],i)=>{const run=gp===null?m.t:gp/TAU*3+i*.37,hop=m.hop>0?-Math.sin((1-m.hop/.35)*Math.PI)*3:0,bob=gp===null?0:Math.sin(gp*2+i)*.6;
    animal(x,y+hop+bob,m.sp,run,m.vx<0,i);});
  walkers.forEach((w,i)=>{const run=gp===null?w.t:gp/TAU*3+i*.29;animal(w.x,w.y-(w.st==='walk'?Math.abs(Math.sin(run*TAU*2))*.8:0),w.sp,run,w.dir<0,i+5);});
  if(gp===null)for(const p of parts){if(!p.dep){const a=1-p.t/p.life;if(a<.3&&(Math.floor(p.t*30)&1))continue;}dot(p.x-.5,p.y-.5,p.c);}}
function draw(){/* renderが画面へ直接描く */}

/* ---------- interaction ---------- */
function toBuf(e){return[e.clientX*cv.width/innerWidth/K,e.clientY*cv.height/innerHeight/K];}
function ringAt(bx,by){let best=null,bd=1e9;
  for(const N of nests){const d=Math.hypot(bx-N.x,by-N.y),tol=Math.max(N.sp/2,2.6);
    for(const Q of N.rings){if(!Q.alive)continue;const o=Math.abs(d-Q.r);if(o<tol&&o<bd){bd=o;best=Q;}}}
  return best;}
cv.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();hintEl.classList.remove('on');
  const[bx,by]=toBuf(e),Q=ringAt(bx,by);if(Q)press={Q,t0:rtime,id:e.pointerId};});
function release2(e){if(!press||(e&&press.id!==e.pointerId))return;const Q=press.Q;
  if(Q.hold)Q.hold=false;else if(Q.alive){Q.w=-Q.w;Q.flash=.12;}
  press=null;}
cv.addEventListener('pointerup',release2);cv.addEventListener('pointercancel',release2);

function mutate(){
  let n;do{n=Math.floor(Math.random()*THEMES.length);}while(n===TH&&THEMES.length>1);
  TH=n;theme=THEMES[TH];buildBg();for(const N of nests)colorNest(N);say('空と輪の色を替えた(積もった層はそのまま)');}
function resetAll(){nests=[];walkers=[];parts=[];initSed();newCycle();say('地面をならして、最初から');}

/* ---------- boot ---------- */
resize();newCycle();addEventListener('resize',resize);
setTimeout(()=>hintEl.classList.add('on'),700);
setTimeout(()=>hintEl.classList.remove('on'),9000);
let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!(window.APKit&&APKit.isExporting&&APKit.isExporting())){step(dt);render(null);}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(location.hash==='#debug')window.__lh={set:o=>{if('V'in o)V=o.V;if('GA'in o)GA=o.GA;if('GB'in o)GB=o.GB;if('GM'in o)GM=o.GM;},step,render,mutate,resetAll,prof:()=>cols.map(c=>c.length),get:()=>({nests:nests.length,gens:nests.map(n=>n.gen),mates:nests.reduce((a,n)=>a+n.mates.length,0),walkers:walkers.length,maxH:maxH(),limitH,cycles})};

if(window.APKit)APKit.init({
  canvas:cv,
  gifName:'loophole-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  /* GIF書き出しはなし(2026/09/29 おっちゃんの方針で◉を外した) */
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
