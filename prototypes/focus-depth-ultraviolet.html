<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>FOCUS DEPTH ULTRAVIOLET</title><script src="../ap-kit.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04000b}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
/* CHATGPT — v52 FOCUS variation. LAW: attention opens nested space. TOUCH ROTATES the law around the chosen point. */
const c=document.querySelector('#c'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W=1,H=1,D=1,last=performance.now(),f={x:0,y:0,p:.4,rot:0},marks=[];
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);if(!f.x){f.x=W/2;f.y=H/2}}addEventListener('resize',rs);rs();function reset(){f={x:W*.5,y:H*.5,p:.3,rot:0};marks=[]}reset();
function A(x,y){let dx=x-f.x,dy=y-f.y,cs=Math.cos(f.rot),sn=Math.sin(f.rot),rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;let v=f.p*Math.exp(-Math.hypot(rx,ry)/(Math.min(W,H)*.31));for(let m of marks)v+=m.p*Math.exp(-Math.hypot(x-m.x,y-m.y)/(Math.min(W,H)*.18));return v}
function cell(x,y,s,d){let a=A(x+s/2,y+s/2),th=.22+d*.105;if(d<11&&a>th&&s>2.5){let q=s/2;cell(x,y,q,d+1);cell(x+q,y,q,d+1);cell(x,y+q,q,d+1);cell(x+q,y+q,q,d+1);return}let h=(265+d*23+(x/W)*90-(y/H)*110)%360,l=45+a*27;g.fillStyle=`hsla(${h},94%,${l}%,${.045+a*.23})`;g.fillRect(x,y,s-.5,s-.5);g.strokeStyle=`hsla(${h+95},100%,82%,${.12+a*.38})`;g.lineWidth=.55;g.strokeRect(x+.25,y+.25,s-.5,s-.5)}
function draw(t,dt){f.p=.28+.36*(.5+.5*Math.sin(t*.00039));f.rot+=dt*.16;for(let m of marks)m.p*=Math.pow(.13,dt);marks=marks.filter(m=>m.p>.025);g.fillStyle='#04000b';g.fillRect(0,0,W,H);cell(0,0,W,0);g.beginPath();g.arc(f.x,f.y,4+f.p*7,0,TAU);g.strokeStyle='rgba(235,130,255,.7)';g.stroke()}function loop(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(!APKit.isExporting())draw(n,dt);requestAnimationFrame(loop)}loop();
let down=false;c.addEventListener('pointerdown',e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=true;f.x=e.clientX;f.y=e.clientY;f.p=.9});c.addEventListener('pointermove',e=>{if(down){f.x=e.clientX;f.y=e.clientY;f.rot+=.018;f.p=Math.min(1,f.p+.014)}});c.addEventListener('pointerup',()=>{down=false;marks.push({x:f.x,y:f.y,p:f.p});if(marks.length>16)marks.shift()});c.addEventListener('pointercancel',()=>down=false);
APKit.init({canvas:c,gifName:'focus-depth-ultraviolet-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{f={x:W*(.5+.34*Math.cos(p)),y:H*(.5+.32*Math.sin(p*2)),p:.3+.58*(.5+.5*Math.sin(p*3)**2),rot:p};g.fillStyle='#04000b';g.fillRect(0,0,W,H);cell(0,0,W,0)},buttons:[{label:'✦',name:'mutate',onClick:()=>{f.rot=Math.random()*TAU}},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
