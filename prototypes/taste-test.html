<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ART PLAYGROUND — TASTE TEST</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0b0c;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{overflow:hidden}.bar{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#101012;border-bottom:1px solid #252528}.bar button{background:#17171a;color:#ddd;border:1px solid #333;border-radius:8px;padding:8px 11px;font:inherit;cursor:pointer}.bar button.active{background:#eee;color:#111}.stage{height:calc(100% - 58px);position:relative}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}.stage iframe.active{display:block}</style></head><body><div class="bar" id="bar"></div><div class="stage">
<iframe src="06-vein.html" data-i="0"></iframe><iframe src="07-void.html" data-i="1"></iframe><iframe src="08-tension.html" data-i="2"></iframe><iframe src="09-scar.html" data-i="3"></iframe><iframe src="10-entangle.html" data-i="4"></iframe></div>
<script>const names=["VEIN","VOID","TENSION","SCAR","ENTANGLE"],bar=document.getElementById("bar"),frames=[...document.querySelectorAll("iframe")];let n=0;names.forEach((name,i)=>{let b=document.createElement("button");b.textContent=(i+1)+" · "+name;b.onclick=()=>show(i);bar.appendChild(b)});function show(i){n=i;frames.forEach((f,k)=>f.classList.toggle("active",k===i));[...bar.children].forEach((b,k)=>b.classList.toggle("active",k===i))}addEventListener("keydown",e=>{let k=+e.key;if(k>=1&&k<=5)show(k-1)});show(0);</script></body></html>
