<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ART PLAYGROUND — PROTOTYPE TEST</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0c;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{touch-action:pan-y}.bar{height:52px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#101012;border-bottom:1px solid #252528;overflow-x:auto;white-space:nowrap}.bar button{flex:0 0 auto;background:#17171a;color:#bbb;border:1px solid #333;border-radius:7px;padding:7px 9px;font:inherit;font-size:12px;cursor:pointer}.bar button.active{background:#eee;color:#111}.stage{height:calc(100% - 52px);position:relative}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#08090b}.stage iframe.active{display:block}</style></head><body><div class="bar" id="bar"></div><div class="stage" id="stage"></div><script>const works=[['VEIN','06-vein.html'],['VOID','07-void.html'],['TENSION','08-tension.html'],['SCAR','09-scar.html'],['ENTANGLE','10-entangle.html'],['AFTERIMAGE','afterimage.html'],['BLACKHOLE','blackhole.html'],['CLOCKWORK','clockwork.html'],['DISSOLVE','dissolve.html'],['ECHO','echo.html'],['FIELD','field.html'],['FLUX','flux.html'],['FOLD','fold.html'],['GRAVITY','gravity.html'],['GROWTH','growth.html'],['LATTICE','lattice.html'],['MAGNET','magnet.html'],['MEMORY','memory.html'],['MIRROR','mirror.html'],['NOISE','noise.html'],['ORBIT','orbit.html'],['PRESSURE','pressure.html'],['PULSE','pulse.html'],['RIFT','rift.html'],['SHATTER','shatter.html'],['SPIRAL','spiral.html'],['SPLIT','split.html'],['STRATA','strata.html'],['SWARM','swarm.html'],['TIDE','tide.html'],['VOID FIELD','void.html']];const bar=document.getElementById('bar'),stage=document.getElementById('stage');let frames=[];works.forEach((w,i)=>{const b=document.createElement('button');b.textContent=(i+1)+' · '+w[0];b.onclick=()=>show(i);bar.appendChild(b);const f=document.createElement('iframe');f.src=w[1];f.loading='lazy';stage.appendChild(f);frames.push(f)});function show(i){frames.forEach((f,k)=>f.classList.toggle('active',k===i));[...bar.children].forEach((b,k)=>b.classList.toggle('active',k===i));frames[i].focus()}addEventListener('keydown',e=>{const k=+e.key;if(k>=1&&k<=works.length)show(k-1);if(e.key==='ArrowRight')show((current()+1)%works.length);if(e.key==='ArrowLeft')show((current()-1+works.length)%works.length)});function current(){return frames.findIndex(f=>f.classList.contains('active'))}show(0);</script></body></html>
