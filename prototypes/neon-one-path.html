<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON — ONE PATH LAW</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}</style>
</head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  NEON — ONE PATH LAW / Claude(クロちゃん)作。ap-kit.js統合: Claude

  世界のルール — 「電気が通れる道は、いつも一本だけ」:
  ネオン管が網の目に張りめぐらされているが、光が流れるのはそのうちの一本道だけ。
  管の交点に触れるとそこのスイッチが切り替わり、電気は別の経路へ渡る。
  電気の通らなくなった管は冷えて暗くなり、冷えきった管はやがて切れる。
  切れた管には二度と光は通らない。
  だから触るほど網は痩せていき、選べる道は減り、最後には細い一本道だけが残る。
  どの一本を残すかだけが、こちらに委ねられている。
*/
const c=document.getElementById('c');
const g=c.getContext('2d');

let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.max(1,Math.round(W*DPR));c.height=Math.max(1,Math.round(H*DPR));
  build();
}
window.addEventListener('resize',resize);

/* ---------- 管の網 ---------- */
let nodes=[],edges=[],adj=[],sw=[],src=0,path=[],pathLen=0,alive=true,hue0=Math.random();
let COLS=0,ROWS=0,GX=0,GY=0,OX=0,OY=0;

function build(){
  const w=c.width,h=c.height;
  const cell=Math.max(64*DPR,Math.min(w,h)/6.2);
  COLS=Math.max(3,Math.round(w/cell));
  ROWS=Math.max(4,Math.round(h/cell));
  GX=w/(COLS+1);GY=h/(ROWS+1);OX=GX;OY=GY;
  nodes=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    /* 格子をわずかに崩して、手で曲げたネオン管らしくする */
    const j=0.16;
    nodes.push({
      x:OX+x*GX+(Math.sin(x*3.1+y*1.7)*j)*GX,
      y:OY+y*GY+(Math.cos(x*2.3+y*2.9)*j)*GY
    });
  }
  const id=(x,y)=>y*COLS+x;
  edges=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(x+1<COLS)edges.push({a:id(x,y),b:id(x+1,y)});
    if(y+1<ROWS)edges.push({a:id(x,y),b:id(x,y+1)});
    /* 斜めの管を少しだけ混ぜて、道の選択肢を作る */
    if(x+1<COLS&&y+1<ROWS&&Math.random()<0.28)
      edges.push(Math.random()<0.5?{a:id(x,y),b:id(x+1,y+1)}:{a:id(x+1,y),b:id(x,y+1)});
  }
  /* 少し間引いて、網に隙間を作る */
  edges=edges.filter(()=>Math.random()<0.82);
  edges.forEach(e=>{
    e.heat=0;e.cold=0;e.dead=false;
    const A=nodes[e.a],B=nodes[e.b];
    e.len=Math.hypot(B.x-A.x,B.y-A.y);
  });
  adj=nodes.map(()=>[]);
  edges.forEach((e,i)=>{adj[e.a].push(i);adj[e.b].push(i)});
  sw=nodes.map(()=>Math.floor(Math.random()*4));
  /* 枝が2本以上ある節点から電源を選ぶ */
  const cand=[];
  nodes.forEach((n,i)=>{if(adj[i].length>=2)cand.push(i)});
  src=cand.length?cand[Math.floor(Math.random()*cand.length)]:0;
  alive=true;
  recompute();
}

/* いま電気が通っている一本道を求める */
function recompute(){
  path=[];pathLen=0;
  let node=src,from=-1;
  const used=new Set();
  for(let step=0;step<220;step++){
    const list=adj[node].filter(i=>!edges[i].dead);
    if(!list.length)break;
    let pick=list[((sw[node]%list.length)+list.length)%list.length];
    if(list.length>1&&pick===from)pick=list[(list.indexOf(pick)+1)%list.length];
    if(used.has(pick))break;          /* 一周して閉じたら、そこで回路が完成 */
    used.add(pick);
    const e=edges[pick];
    const next=(e.a===node)?e.b:e.a;
    path.push({e:pick,from:node,to:next});
    pathLen+=e.len;
    from=pick;node=next;
  }
  alive=path.length>0;
}

/* 道に沿った位置 s(px) の座標 */
function pointAt(s){
  let acc=0;
  for(const seg of path){
    const e=edges[seg.e];
    if(acc+e.len>=s){
      const t=(s-acc)/e.len;
      const A=nodes[seg.from],B=nodes[seg.to];
      return [A.x+(B.x-A.x)*t,A.y+(B.y-A.y)*t];
    }
    acc+=e.len;
  }
  const last=path[path.length-1];
  return last?[nodes[last.to].x,nodes[last.to].y]:[0,0];
}

/* ---------- 入力 ---------- */
let ptr=null,lastTap=0;
function tapAt(px,py){
  const x=px*DPR,y=py*DPR;
  let best=-1,bd=1e9;
  nodes.forEach((n,i)=>{
    const d=Math.hypot(n.x-x,n.y-y);
    if(d<bd){bd=d;best=i}
  });
  if(best<0||bd>Math.min(GX,GY)*1.1)return;
  const now=performance.now();
  if(now-lastTap<110)return;
  lastTap=now;
  sw[best]++;              /* その交点のスイッチが切り替わる */
  nodes[best].flash=1;
  recompute();
}
c.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();c.setPointerCapture&&c.setPointerCapture(e.pointerId);
  ptr={id:e.pointerId};tapAt(e.clientX,e.clientY);
});
c.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id)return;
  tapAt(e.clientX,e.clientY);
});
function up(e){if(ptr&&e.pointerId===ptr.id)ptr=null}
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);

/* ---------- 進行 ---------- */
const COLD_LIMIT=11;   /* これだけ電気が通らないと、管は切れる */
function sim(dt){
  const on=new Set(path.map(p=>p.e));
  let died=false;
  edges.forEach((e,i)=>{
    if(e.dead)return;
    if(on.has(i)){
      e.heat=Math.min(1,e.heat+dt*3.2);e.cold=0;
    }else{
      e.heat=Math.max(0,e.heat-dt*0.5);
      e.cold+=dt;
      if(e.cold>COLD_LIMIT){e.dead=true;e.heat=0;died=true;}
    }
  });
  nodes.forEach(n=>{if(n.flash)n.flash=Math.max(0,n.flash-dt*2.2)});
  if(died)recompute();
}

/* ---------- 描画 ---------- */
function stroke(A,B,w,col,alpha){
  g.strokeStyle=col;g.globalAlpha=alpha;g.lineWidth=w;
  g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke();
}
function hsl(h,s,l){return 'hsl('+((h%1)*360).toFixed(1)+','+s+'%,'+l+'%)'}

function render(ph){
  const w=c.width,h=c.height;
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  g.lineCap='round';g.lineJoin='round';

  /* 消えている管・切れた管。形だけが黒の中に残る */
  g.globalCompositeOperation='source-over';
  edges.forEach(e=>{
    const A=nodes[e.a],B=nodes[e.b];
    if(e.dead)stroke(A,B,1.4*DPR,'#1a1a20',0.55);
    else if(e.heat<0.02)stroke(A,B,1.6*DPR,'#23252e',0.75);
  });

  /* 光っている管。細い芯のまわりに広い光を重ねて発光にする */
  g.globalCompositeOperation='lighter';
  const s=DPR;
  edges.forEach((e,i)=>{
    if(e.dead||e.heat<=0.02)return;
    const A=nodes[e.a],B=nodes[e.b];
    const hu=hue0+((A.y+B.y)/(2*h))*0.30+((A.x+B.x)/(2*w))*0.12;
    const col=hsl(hu,100,58);
    const k=e.heat;
    stroke(A,B,15*s,col,0.045*k);
    stroke(A,B,8*s,col,0.10*k);
    stroke(A,B,3.6*s,col,0.30*k);
    stroke(A,B,1.5*s,'#fff',0.55*k);
  });

  /* 流れる電気。道の上を走る明るい頭 */
  if(alive&&pathLen>1){
    const head=(ph/(Math.PI*2))*pathLen;
    const tail=Math.min(pathLen*0.30,260*s);
    const steps=Math.max(8,Math.round(tail/(9*s)));
    for(let i=0;i<steps;i++){
      const t=i/steps;
      const s0=(head-tail*t+pathLen*4)%pathLen;
      const s1=(head-tail*(t+1/steps)+pathLen*4)%pathLen;
      if(Math.abs(s0-s1)>pathLen*0.5)continue;
      const P=pointAt(s0),Q=pointAt(s1);
      const a=(1-t)*(1-t);
      const hu=hue0+0.5+t*0.12;
      stroke({x:P[0],y:P[1]},{x:Q[0],y:Q[1]},14*s,hsl(hu,100,60),0.07*a);
      stroke({x:P[0],y:P[1]},{x:Q[0],y:Q[1]},5*s,hsl(hu,100,72),0.22*a);
      stroke({x:P[0],y:P[1]},{x:Q[0],y:Q[1]},2*s,'#ffffff',0.75*a);
    }
  }

  /* 交点。触れた所は一瞬強く光る */
  nodes.forEach((n,i)=>{
    const live=adj[i].some(e=>!edges[e].dead&&edges[e].heat>0.05);
    const f=n.flash||0;
    if(!live&&f<=0)return;
    const r=(live?2.6:2.0)*s+f*7*s;
    g.globalAlpha=0.5+0.5*f;
    g.fillStyle=f>0?'#fff':hsl(hue0+n.y/h*0.3,100,72);
    g.beginPath();g.arc(n.x,n.y,r,0,6.2832);g.fill();
  });

  /* 全部切れて、最後の光が消えたあと */
  if(!alive){
    g.globalCompositeOperation='source-over';
    g.globalAlpha=1;
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

let phase=0,last=performance.now(),paused=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!paused){
    phase=(phase+dt*0.42)%(Math.PI*2);
    sim(dt);
    render(phase);
  }
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

APKit.init({
  canvas:c,
  gifName:'neon-one-path-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  /* 電気が道を1周する分がそのままループになる */
  loopFrame:function(ph){paused=true;render(ph);},
  onExportEnd:function(){paused=false;last=performance.now();},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){
      /* 管の色と電源の位置を変える。切れた管はそのまま */
      hue0=Math.random();
      const cand=[];
      nodes.forEach((n,i)=>{if(adj[i].some(e=>!edges[e].dead))cand.push(i)});
      if(cand.length)src=cand[Math.floor(Math.random()*cand.length)];
      recompute();
    }},
    {label:'↻',name:'reset',onClick:function(){hue0=Math.random();build();}}
  ]
});
</script>
</body></html>
