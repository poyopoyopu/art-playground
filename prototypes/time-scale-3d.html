<!-- TIME SCALE 3D — クロちゃん(Claude)作。2026/11/13。prototypes/time-scale.html(2D版・残してある)の立体版。魚・イカ3Dキット(assets/squid-kit、CC0)を使う試作。
     世界のルール(2D版と同じ): 「魚の群れが秒をはこび、こぼれた鱗が一分で一枚の泥になり、一時間で一枚の石になる」。
     2D版の評価「3Dデータの意味があまりない」への答え: 地層を絵ではなく「立体の塊」にした。
     - 塊: 横1.3m×奥行き0.7mの海底ブロック。上に今の1時間(60枚の層)が積もり、下に過ぎた時間の石(8時間ぶん)が積み重なる。
       4つの側面がそのまま断面で、層の色・白い鍵層・掘った穴の跡が見える。視点は自動でゆっくり回り込む(指でなぞって回す/傾きボタン)。
     - 秒: 魚の群れ(3D)が1分かけて左→右へ渡り、こぼれた鱗が落ちて泥の層を左から敷く。分が変わると群れは左へ駆け戻る。
     - 分: 右の測量杭に目盛り(:00〜:50)。泥の面が今の分を指し、HH:MM が乗る。10分ごとの層は白い鍵層。
     - 正時: 60枚が押し固められて薄い「石」1枚になる。コウイカは正時前に泥へ潜り、新しい海底から出てくる。
     - 触る: 塊の上面をタップ = アオリイカがそこへ泳いでいき、漏斗の噴射で泥に穴をあける(穴は消えない。石は掘れない)。
       断面(側面)をタップ = その層がいつ積もったかを読む。指でなぞる = 視点を回す。
     ボタン: ✦色替え / ⏭出来事をいま見る / ↻積もり直し / 傾き=スマホを傾けて視点を動かす(センサー) / 📷=インカメラで顔を追い、顔の位置で視点が動く「水槽の窓」
     📷: 顔の検出は端末の中だけ(@mediapipe/face_detection、assets/vendor/mediapipe-face-detection、Apache-2.0)。映像は表示・保存・送信しない。許可されない/使えないときは傾き→指なぞりで動く。
     テスト用: URLに ?head=x,y(-1〜1)を付けると、カメラなしで「顔がそこにいる」ものとして視点を固定できる。 -->

<script type="module">

const $ = id => document.getElementById(id);
const note = $('note'), glWrap = $('gl'), readEl = $('read');

// ---------- small helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function h2(i, j, s) { let t = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul(j | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b9); t = Math.imul(t ^ (t >>> 15), 0x85ebca6b); t ^= t >>> 13; t = Math.imul(t, 0xc2b2ae35); t ^= t >>> 16; return (t >>> 0) / 4294967296 * 2 - 1; }

// ---------- palettes (✦ changes what falls from now on; the record keeps its colours) ----------
const ASH = [222, 217, 204];
const PALS = [
  { name: 'SPECTRUM', f: (hk, m) => hsl(hk * 137.508 + m * 6, .5, .42 + .05 * Math.sin(m * .9)) },
  { name: 'AGATE', f: (hk, m) => {

      const p = ((m + hk * 7) / 6) % st.length, i = Math.floor(p), t = p - i;

  { name: 'ABYSS', f: (hk, m) => hsl(170 + 125 * (.5 + .5 * Math.sin((m + hk * 13) / 60 * Math.PI * 4)), .56, .40 + .09 * Math.sin(m * 1.3)) },
  { name: 'EMBER', f: (hk, m) => hsl(4 + 46 * (.5 + .5 * Math.sin((m + hk * 11) / 60 * Math.PI * 6)), .74, .42 + .1 * Math.sin(m * 1.7)) },

// ---------- the block (metres). x = time axis (screen right), y = up, z = toward the viewer ----------
const BW = 1.3, BD = .7, NX = 96, NZ = 32, VX = NX + 1, VZ = NZ + 1, NV = VX * VZ, DX = BW / NX, DZ = BD / NZ;

const TAPER = .22, EPS = 2.5e-5, OFF = .0007;
const POLEX = BW / 2 + .075, POLEZ = BD / 2 + .035;
const GX = new Float32Array(NV), GZ = new Float32Array(NV);

const tmpB = new Float32Array(NV);
function blur2(a, rx, rz) {
  const out = new Float32Array(NV);
  for (let k = 0; k < VZ; k++) for (let i = 0; i < VX; i++) { let s = 0; for (let d = -rx; d <= rx; d++) s += a[k * VX + clamp(i + d, 0, VX - 1)]; tmpB[k * VX + i] = s / (2 * rx + 1); }
  for (let k = 0; k < VZ; k++) for (let i = 0; i < VX; i++) { let s = 0; for (let d = -rz; d <= rz; d++) s += tmpB[clamp(k + d, 0, VZ - 1) * VX + i]; out[k * VX + i] = s / (2 * rz + 1); }
  return out;
}
function samp(a, x, z) {
  let fi = (x + BW / 2) / DX, fk = (z + BD / 2) / DZ;
  fi = clamp(fi, 0, NX - .0001); fk = clamp(fk, 0, NZ - .0001);
  const i = fi | 0, k = fk | 0, u = fi - i, v = fk - k, id = k * VX + i;
  return (a[id] * (1 - u) + a[id + 1] * u) * (1 - v) + (a[id + VX] * (1 - u) + a[id + VX + 1] * u) * v;
}
const sw = u => u * u * (3 - 2 * u);

// ---------- the record ----------
// layers: the current hour's finished minute layers (index = minute); top = height field (m) over the grid.
// bands: past hours pressed into stone, newest first; only their four edge profiles are kept (that is all a stone shows).
let layers = [], bands = [], grow = null, flatBase = new Float32Array(NV);
let state = { hk: 0, h: 0, m: 0 };
const hourKeyOf = ms => Math.floor(ms / 3600000);
function nowInfo() { const d = new Date(); return { d, hk: hourKeyOf(d.getTime()), h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() + d.getMilliseconds() / 1000 }; }
// A new layer drapes over the one below: hollows fill faster than bumps, so a dug hole heals slowly but its scar stays in the strata.
// Near the survey pole (right end) the thickness is exact, so the surface there reads the minute.
function makeTop(bottom, hk, m) {
  const seed = (hk * 61 + m) % 99991, sm = blur2(bottom, 3, 2), out = new Float32Array(NV), exact = (m + 1) * T;
  for (let k = 0; k < VZ; k++) for (let i = 0; i < VX; i++) {
    const id = k * VX + i, x = GX[id], z = GZ[id];
    const n = .36 * vn2(x / .24, z / .34, seed) + .14 * vn2(x / .08, z / .11, seed + 11);
    const b = bottom[id], filled = Math.max(b, b * .58 + sm[id] * .42);
    const v = filled + T * (1 + n), pb = smooth(.2, .5, x);

  }

}
const mkLayer = (top, hk, m) => ({ top, hk, m, ash: m % 10 === 0, rgb: colorFor(hk, m) });
function synthLayers(hk, upto) {
  let bottom = flatBase; const arr = [];
  for (let m = 0; m < upto; m++) { const top = makeTop(bottom, hk, m); arr.push(mkLayer(top, hk, m)); bottom = top; }
  return arr;
}
function stoneRGB(c, ash) { const l = c[0] * .3 + c[1] * .55 + c[2] * .15; return mix(mix(c, [l, l, l], .6), [10, 14, 18], ash ? .3 : .44); }

function newGrow(hk, m) {
  const bottom = layers.length ? layers[layers.length - 1].top : flatBase;
  return { hk, m, bottom, top: makeTop(bottom, hk, m), rgb: colorFor(hk, m), ash: m % 10 === 0, prev: prevColorFor() };
}
function edgeSets(top) {
  const f = new Float32Array(VX), b = new Float32Array(VX), l = new Float32Array(VZ), r = new Float32Array(VZ);
  for (let i = 0; i < VX; i++) { f[i] = top[NZ * VX + i]; b[i] = top[NX - i]; }
  for (let k = 0; k < VZ; k++) { l[k] = top[k * VX]; r[k] = top[(NZ - k) * VX + NX]; }
  return { f, b, l, r };
}
function hourLabel(hk) { return pad(new Date(hk * 3600000 + 1000).getHours()); }
const makeBand = (arr, hk) => ({ hk, label: hourLabel(hk), layers: arr.map(L => ({ e: edgeSets(L.top), rgb: L.rgb, ash: L.ash })) });

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPRMAX = Math.min(devicePixelRatio || 1, 2); let DPR = DPRMAX;
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x03101a, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
glWrap.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, .3, 16);
const pivot = new THREE.Group(); scene.add(pivot);
const kitG = new THREE.Group(); kitG.rotation.y = -Math.PI / 2; pivot.add(kitG); // kit axes: x toward viewer, -z = screen right; ours: x = right, z = toward viewer
const hemi = new THREE.HemisphereLight(0xd2ece6, 0x06131b, 1.7); scene.add(hemi);
const key = new THREE.DirectionalLight(0xeaf5ec, 3.0); key.position.set(-1.6, 3.2, 2.6); scene.add(key);
const rim = new THREE.DirectionalLight(0x7fb2b8, 1.4); rim.position.set(2.5, 1.5, -3); scene.add(rim);
const neutral = new THREE.Color(0xd2ece6), tint = new THREE.Color();

// shared uniforms for the strata shaders
const LIGHT = new THREE.Vector3(-.4, .78, .5).normalize();
const U = {
  uCam: { value: new THREE.Vector3() }, uL: { value: LIGHT }, uFog: { value: new THREE.Color(.012, .05, .07) },
  uGlow: { value: 0 }, uHi: { value: -9 }, uHiA: { value: 0 }, uSc: { value: 1 }, uSh: { value: 0 }, uTime: { value: 0 }

const FRAG_COMMON = /* glsl */`
precision highp float;
uniform vec3 uCam; uniform vec3 uL; uniform vec3 uFog; uniform float uGlow; uniform float uHi; uniform float uHiA;
varying vec3 vW; varying vec3 vC; varying float vL; varying float vT; varying float vK; varying float vTh;
float hsh(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnz(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(hsh(i),hsh(i+vec3(1,0,0)),f.x),mix(hsh(i+vec3(0,1,0)),hsh(i+vec3(1,1,0)),f.x),f.y),

vec3 shade(vec3 base, vec3 n, vec3 v, float line, float ashf, float lid){

const FRAG_LAYER = FRAG_COMMON + /* glsl */`
void main(){
  if (vTh < .0004) discard;
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW))); vec3 v = normalize(uCam - vW); if (dot(n,v) < 0.) n = -n;
  float line = vK < 1. ? smoothstep(.74,1.,vT) : 0.;

const VERT_LAYER = /* glsl */`
uniform float uSc; uniform float uSh; uniform float uKind;
attribute vec3 aColor; attribute float aLayer; attribute float aT;
varying vec3 vW; varying vec3 vC; varying float vL; varying float vT; varying float vK; varying float vTh;
void main(){
  vec3 p = position; p.y = p.y*uSc - uSh;
  vec4 w = modelMatrix*vec4(p,1.); vW = w.xyz; vC = aColor; vL = aLayer; vT = aT; vK = uKind; vTh = 1.;
  gl_Position = projectionMatrix*viewMatrix*w;

const VERT_GROW = /* glsl */`
uniform float uFront; uniform vec3 uGrowC; uniform vec3 uPrev; uniform float uGrowL;
attribute float aH0; attribute float aH1; attribute float aMode;
varying vec3 vW; varying vec3 vC; varying float vL; varying float vT; varying float vK; varying float vTh;
void main(){
  float u = clamp((uFront - (position.x + ${(BW / 2).toFixed(4)})) / ${TAPER.toFixed(4)}, 0., 1.);
  float S = u*u*(3.-2.*u);
  float h = aMode < .5 ? aH0 : aH0 + (aH1 - aH0)*S;

const share = o => Object.assign({ uCam: U.uCam, uL: U.uL, uFog: U.uFog, uGlow: U.uGlow, uHi: U.uHi, uHiA: U.uHiA }, o);

const topPos = new Float32Array(NL * NV * 3), topCol = new Float32Array(NL * NV * 3), topId = new Float32Array(NL * NV), topT = new Float32Array(NL * NV).fill(1);
for (let s = 0; s < NL; s++) for (let id = 0; id < NV; id++) { const o = (s * NV + id) * 3; topPos[o] = GX[id]; topPos[o + 2] = GZ[id]; }

for (let s = 0, q = 0; s < NL; s++) for (let k = 0; k < NZ; k++) for (let i = 0; i < NX; i++) {
  const a = s * NV + k * VX + i, b = a + 1, c = a + VX, d = c + 1;
  topIdx[q++] = a; topIdx[q++] = c; topIdx[q++] = b; topIdx[q++] = b; topIdx[q++] = c; topIdx[q++] = d;
}
const topGeo = new THREE.BufferGeometry();
const A = (arr, n, dyn = true) => { const a = new THREE.BufferAttribute(arr, n); if (dyn) a.setUsage(THREE.DynamicDrawUsage); return a; };
topGeo.setAttribute('position', A(topPos, 3)); topGeo.setAttribute('aColor', A(topCol, 3)); topGeo.setAttribute('aLayer', A(topId, 1)); topGeo.setAttribute('aT', A(topT, 1, false));

// ---------- surface (the sea floor, as the strata currently show it) ----------
let anim = null, sNow = 0; // anim: {type:'compact'|'reveal', t, dur, arr, ...}

// ---------- craters: the only thing the viewer can do to the record ----------

// ---------- events ----------

function fullSync() {

}

// ---------- picking: march the view ray through the block ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {

  pivot.updateMatrixWorld(true);
  const inv = pivot.matrixWorld.clone().invert(), o = ray.ray.origin.clone().applyMatrix4(inv), d = ray.ray.direction.clone().transformDirection(inv);
  const p = new THREE.Vector3(); let prevIn = false;

    const inside = Math.abs(p.x) <= BW / 2 && Math.abs(p.z) <= BD / 2 && p.y > YBASE;
    if (inside) {
      const h = p.y >= 0 ? surfH(p.x, p.z) : 0;
      if (p.y <= h || p.y < 0) {
        const side = !prevIn && (Math.abs(Math.abs(p.x) - BW / 2) < .02 || Math.abs(Math.abs(p.z) - BD / 2) < .02);
        return { p: p.clone(), side, world: p.clone().applyMatrix4(pivot.matrixWorld) };

}

}

// ---------- view: auto orbit, finger, tilt, face ("window into a tank") ----------
const ZW = .62, DIST = 3.6, WS = 1.52, TGY = .25;
let HS = 3.8, aspect = 1, vw = 1, vh = 1;

function resize() {
  vw = innerWidth; vh = innerHeight; aspect = vw / vh;

}

// pointer: drag = look around, tap = dig / read
let ptr = null;
addEventListener('pointerdown', e => {

  if (window.APKit && APKit.isUI && APKit.isUI(e.clientX, e.clientY)) return;
  ptr = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), drag: false };
  view.lastTouch = performance.now() / 1000;
  requestWakeLock();
}, { passive: true });
addEventListener('pointermove', e => {
  if (!ptr) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (!ptr.drag && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 8) ptr.drag = true;
  if (ptr.drag) {
    view.yawOff = clamp(view.yawOff + dx * .0062, -1.1, 1.1); view.elOff = clamp(view.elOff + dy * .0032, -.22, .5);

}, { passive: true });
const endPtr = e => { if (ptr && !ptr.drag && performance.now() - ptr.t0 < 600) handleTap(ptr.x0, ptr.y0); ptr = null; };
addEventListener('pointerup', endPtr, { passive: true });
addEventListener('pointercancel', () => { ptr = null; }, { passive: true });

let awake = null;
function requestWakeLock() {

}
document.addEventListener('visibilitychange', requestWakeLock);

// tilt (sensor): a button, because the sensor has to be asked for
const tiltBtn = $('tiltBtn'), tilt = { on: false, base: null, got: false, g: 0, b: 0 };
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  tilt.got = true;
  if (!tilt.base) tilt.base = { b: e.beta, g: e.gamma };
  tilt.g += (clamp(e.gamma - tilt.base.g, -35, 35) - tilt.g) * .3; tilt.b += (clamp(e.beta - tilt.base.b, -30, 30) - tilt.b) * .3;

}

  tiltBtn.querySelector('span').textContent = on ? '傾き ON' : '傾き OFF';
  if (on) {

    setTimeout(() => { if (tilt.on && !tilt.got) { setTilt(false); say('この端末では傾きセンサーが使えないみたい', 4200); } }, 2200);
  } else { removeEventListener('deviceorientation', onTilt); view.tiltYaw = 0; view.tiltEl = 0; }

  if (typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') setTilt(true); else say('傾きが許可されなかった。設定で許可すると使える', 4600); }).catch(() => say('傾きが許可されなかった。設定で許可すると使える', 4600));
  else setTilt(true);

// camera (face tracking): the front camera is read in this page only.
// The video element is hidden and never drawn; no frame is saved or sent anywhere.
const camBtn = $('camBtn'), camVideo = $('cam');
const cam = { on: false, stream: null, det: null, busy: false, base: null, nb: 0, raf: 0, last: 0, seen: -99 };
const MP = new URL('../assets/vendor/mediapipe-face-detection/', import.meta.url).href;
function loadMP() {

}
function camFail(msg) {

}

  if (!bb) return;
  const cx = bb.xCenter != null ? bb.xCenter : bb.xmin + bb.width / 2, cy = bb.yCenter != null ? bb.yCenter : bb.ymin + bb.height / 2, w = bb.width;
  if (!(w > 0.03)) return;

  else if (cam.nb < 12) { cam.nb++; cam.base.x += (x - cam.base.x) * .25; cam.base.y += (y - cam.base.y) * .25; cam.base.w += (w - cam.base.w) * .25; }
  else { const a = now - cam.seen > 1.5 ? .5 : .004; cam.base.x += (x - cam.base.x) * a; cam.base.y += (y - cam.base.y) * a; cam.base.w += (w - cam.base.w) * a; }

// ---------- frame ----------
// slow phones render fewer pixels instead of stuttering
let fAcc = 0, fN = 0, fWait = 1.5;
function adaptRes(dt) {
  if (document.visibilityState !== 'visible' || dt <= 0) return;
  fWait -= dt; if (fWait > 0) return;
  fAcc += dt; fN++;
  if (fN < 40) return;
  const avg = fAcc / fN; fAcc = 0; fN = 0;
  let nd = DPR;
  if (avg > .026 && DPR > 1) nd = Math.max(1, DPR - .25); else if (avg < .0155 && DPR < DPRMAX) nd = Math.min(DPRMAX, DPR + .25);

let last = performance.now() / 1000, elapsed = 0;

// ---------- updates ----------
function updateFish(dt, s, ash, tintRGB) {
  const tg = schoolTarget(s, elapsed), emitting = !tg.dash && !anim;
  let ac = null; if (aori) ac = centerLocal(aori, tmpW);
  for (let i = 0; i < fish.length; i++) {
    const f = fish[i];

      let dy = Math.atan2(-f.v.z, f.v.x) - f.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); f.yaw += dy * (1 - Math.exp(-7 * dt));
      f.pit += (Math.atan2(f.v.y, Math.hypot(f.v.x, f.v.z)) - f.pit) * (1 - Math.exp(-5 * dt));
    }
    if (emitting && Math.random() < (ash ? 4.6 : 2.3) * dt) {
      const c = ash ? mix(ASH, WHITE, .3) : mix(tintRGB, WHITE, .18);
      addP({ k: 0, x: f.p.x, y: f.p.y - .01, z: f.p.z, vx: f.v.x * .15, vy: -.03, vz: f.v.z * .15, sz: (ash ? .0095 : .0075) * (.8 + Math.random() * .6), rgb: c, tw: Math.random() * 6, vt: .22 + Math.random() * .14, life: 0, max: 30 });
    }

    tmpE.set(0, f.yaw, f.pit, 'YZX'); tmpQ.setFromEuler(tmpE); tmpS.set(f.L, f.L, f.L);
    tmpM.compose(f.p, tmpQ, tmpS); fBody.setMatrixAt(i, tmpM);
