<!doctype html>
<!-- TIME SCALE 3D — クロちゃん(Claude)作。2026/11/13。TIME SCALE(time-scale.html)に「水槽の窓」の奥行きを足した版。
     奥行き: 画面は水槽のガラス。地層はガラスに押しつけられた泥の断面で、その奥に海底の上面・イカ・魚・マリンスノー・海がある。
     見る位置(📷 顔 / 傾き / 指なぞり / 何もしないときはゆっくり漂う)が動くと、奥のものほど大きくずれて、泥の上面が奥へのびて見える。
     📷: インカメラの映像はこのページの中だけで顔の位置を読むのに使い、表示・保存・送信はしない。拒否されたら傾き、それも無ければ指なぞり。
     テスト用: ?head=x,y(-1〜1)で、カメラなしに見る位置を固定できる。
     海の時間帯: 朝・昼・夕・夜で海の色と光が変わる。夜は鱗とプランクトンが光る(テスト用: ?hour=0〜23)。
     エギ: 数分おきに、上から糸でエギ(イカ釣りの疑似餌)が沈んでくる。アオリイカが後ろについて追い、抱きつくか見切る。
       抱いたら墨を吐いて離し、見切ったらエギは巻き上げられて帰っていく(イカ・エギは魚・イカ3Dキットの3Dデータ)。
     以下は元の TIME SCALE の説明。魚・イカ3Dキット(assets/squid-kit、CC0)を使う試作。
     世界のルール: 「魚の群れが秒をはこび、こぼれた鱗が一分で一枚の泥になり、一時間で一枚の石になる」。
     - 秒: 小さな魚の群れが1分かけて左から右へ渡り、こぼれた鱗(光る粒)が海底に落ちて、その分の泥の層を左から順に敷いていく。
       分が変わると群れは左へ駆け戻り、次の色の層が始まる。層の色は1分ごとに少しずつ変わる(1時間で虹を一周)。
     - 分: 右端の測量杭に目盛り(:00〜:50)。泥の面が今の分を指し、面の上に HH:MM が乗る。10分ごとの層は白い鍵層。
     - 正時: その1時間ぶんの60枚の層が押し固められて、1枚の薄い「石」(下に積み重なる時間の帯)になる。
       コウイカは正時の少し前に泥へ潜り、石になったあとの新しい海底から出てくる。
     - 触る: 水の中をタップ = アオリイカがそこへ泳いでいき、漏斗の噴射で泥に穴をあける。穴は消えない。
       あとから積もる層は穴を少しずつ埋めながら覆うので、地層に「掘った跡」が残る。石(過ぎた時間)は硬くて掘れない。
       地層をタップ = その層がいつ積もったかを読む。
     ボタン: ✦ これから積もる泥の色を替える(積もった層の色は変わらない) / ⏭ 出来事をいま見る(10分の鍵層 → 正時 → エギ) / ↻ 積もり直す
     題名の SCALE は「鱗」と「目盛り」と「地質年代表(geologic time scale)」の掛け言葉。 -->

<script type="module">
import * as THREE from 'three';
import { loadSquids, createSquid } from '../assets/squid-kit/squid-kit.js';

const $ = id => document.getElementById(id);
const bg = $('bg'), fg = $('fg'), glWrap = $('gl'), note = $('note'), seaEl = $('sea');
const bx = bg.getContext('2d'), fx = fg.getContext('2d');
const cache = document.createElement('canvas'), cx = cache.getContext('2d');

// ---------- small helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const pad = n => String(n).padStart(2, '0');
function h1(i) { let t = Math.imul((i | 0) ^ 0x9e3779b9, 0x85ebca6b); t ^= t >>> 13; t = Math.imul(t, 0xc2b2ae35); t ^= t >>> 16; return (t >>> 0) / 4294967296 * 2 - 1; }
function vn(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return h1(i + seed * 7919) * (1 - u) + h1(i + 1 + seed * 7919) * u; }
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1/6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2/3 ? p + (q - p) * (2/3 - t) * 6 : p; };
  return [f(h + 1/3) * 255, f(h) * 255, f(h - 1/3) * 255];
}
const rgbs = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (c, d, t) => [lerp(c[0], d[0], t), lerp(c[1], d[1], t), lerp(c[2], d[2], t)];
const WHITE = [255, 255, 255], BLACK = [0, 0, 0];

// ---------- palettes (✦ changes what falls from now on; the record keeps its colours) ----------
const ASH = [222, 217, 204];
const PALS = [
  { name: 'SPECTRUM', f: (hk, m) => hsl(hk * 137.508 + m * 6, .5, .42 + .05 * Math.sin(m * .9)) },
  { name: 'AGATE', f: (hk, m) => {
      const st = [[236, 216, 178], [204, 128, 66], [150, 66, 42], [98, 60, 46], [218, 172, 118], [168, 98, 70]];
      const p = ((m + hk * 7) / 6) % st.length, i = Math.floor(p), t = p - i;
      return mix(st[i], st[(i + 1) % st.length], t * t * (3 - 2 * t));
    } },
  { name: 'ABYSS', f: (hk, m) => hsl(170 + 125 * (.5 + .5 * Math.sin((m + hk * 13) / 60 * Math.PI * 4)), .56, .40 + .09 * Math.sin(m * 1.3)) },
  { name: 'EMBER', f: (hk, m) => hsl(4 + 46 * (.5 + .5 * Math.sin((m + hk * 11) / 60 * Math.PI * 6)), .74, .42 + .1 * Math.sin(m * 1.7)) },
];
let pal = 0;
const colorFor = (hk, m) => m % 10 === 0 ? mix(ASH, PALS[pal].f(hk, m), .12) : PALS[pal].f(hk, m);

// ---------- layout ----------
let W = 0, H = 0, DPR = 1, COLS = 0, CW = 2, Y0 = 0, Y60 = 0, T = 5, BAND = 12, K = .005, POLE = 0, UI = 1;
let TAPER = 46, waterTop = 0, waterBottom = 0;
function layout() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  for (const c of [bg, fg, cache]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  const portrait = H >= W;
  Y0 = Math.round(H * (portrait ? .785 : .84));
  Y60 = Math.round(H * (portrait ? .405 : .40));
  T = (Y0 - Y60) / 60;
  BAND = Math.max(9, Math.round(T * 2.6));
  COLS = Math.ceil(W / CW) + 1;
  K = .86 / Math.min(W, H * 1.25); // squids about 1.5x the size of TIME SCALE
  UI = clamp(Math.min(W, H) / 390, .85, 1.4);
  POLE = W - Math.max(22, W * .058);
  TAPER = 46 * UI;
  waterTop = Math.max(46, H * .055);
  waterBottom = Y60 - H * .05;
  M = Math.min(W, H) * .2;
}

// ---------- depth: the screen is the glass of a tank ----------
// E is where the viewer's eye is (x right, y up, -1..1). Something at depth d (0 = on the glass, 1 = the far sea)
// is drawn shifted by d*M toward the eye's side: far things follow the eye, the glass stays put.
const E = { x: 0, y: 0, tx: 0, ty: .35 }, EDGE_D = .5, GL_D = .2;
let M = 60, G = 1; // G grows while a face is watching through the glass
const shX = d => E.x * d * M * G, shY = d => -E.y * d * M * G;
const head = { on: false, tx: 0, ty: 0, tz: 1 };
const drag = { x: 0, y: 0, at: -99 };

// ---------- the record ----------
// layers: the current hour's finished minute layers (index = minute). Each has a top boundary per column (y, px).
// bands: past hours pressed into stone, newest first, each pre-rendered to its own small canvas.
let layers = [], bands = [], grow = null;
let state = { hk: 0, h: 0, m: 0 };
let flatBase = null;
const hourKeyOf = ms => Math.floor(ms / 3600000);
function nowInfo() { const d = new Date(); return { d, hk: hourKeyOf(d.getTime()), h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() + d.getMilliseconds() / 1000 }; }
function flat(y) { const a = new Float32Array(COLS); a.fill(y); return a; }
function blur(a, r) {
  const n = a.length, out = new Float32Array(n);
  for (let j = 0; j < n; j++) { let s = 0, c = 0; for (let k = -r; k <= r; k++) { const i = clamp(j + k, 0, n - 1); s += a[i]; c++; } out[j] = s / c; }
  return out;
}
// A new layer drapes over the one below: hollows fill faster than bumps, so a dug hole heals slowly but its scar stays in the strata.
// Near the survey pole the thickness is exact, so the surface there reads the minute.
function makeTop(bottom, hk, m) {
  const seed = (hk * 61 + m) % 99991;
  const sm = blur(bottom, 6), out = new Float32Array(COLS), exact = Y0 - (m + 1) * T;
  for (let j = 0; j < COLS; j++) {
    const x = j * CW;
    const n = .36 * vn(x / (70 * UI), seed) + .14 * vn(x / (23 * UI), seed + 11);
    const filled = Math.min(bottom[j], bottom[j] * .58 + sm[j] * .42);
    const v = filled - T * (1 + n), pb = smooth(POLE - 84 * UI, POLE - 26 * UI, x);
    out[j] = Math.min(bottom[j], v + (exact - v) * pb);
  }
  return out;
}
const mkLayer = (top, hk, m) => ({ top, hk, m, ash: m % 10 === 0, rgb: colorFor(hk, m) });
function synthLayers(hk, upto) {
  let bottom = flatBase; const arr = [];
  for (let m = 0; m < upto; m++) { const top = makeTop(bottom, hk, m); arr.push(mkLayer(top, hk, m)); bottom = top; }
  return arr;
}
function newGrow(hk, m) {
  const bottom = layers.length ? layers[layers.length - 1].top : flatBase;
  return { hk, m, bottom, top: makeTop(bottom, hk, m), rgb: colorFor(hk, m), ash: m % 10 === 0 };
}
function stone(c, ash) { const l = c[0] * .3 + c[1] * .55 + c[2] * .15; return mix(mix(c, [l, l, l], .5), [10, 14, 18], ash ? .3 : .42); }
function hourLabel(hk) { return pad(new Date(hk * 3600000 + 1000).getHours()); }
// Press one hour of layers into a thin band of stone. The 60 boundaries keep their order, squeezed into BAND px.
function makeBand(arr, hk) {
  const h = BAND, c = document.createElement('canvas');
  c.width = Math.round(W * DPR); c.height = Math.max(1, Math.round((h + 1) * DPR));
  const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = BAND / (60 * T);
  const yb = y => h - (Y0 - y) * s;
  g.fillStyle = rgbs(stone(arr.length ? arr[0].rgb : ASH, false)); g.fillRect(0, 0, W, h + 1);
  for (let i = arr.length - 1; i >= 0; i--) {
    const top = arr[i].top; g.beginPath(); g.moveTo(0, h + 1);
    for (let j = 0; j < COLS; j++) g.lineTo(j * CW, yb(top[j]));
    g.lineTo(W, h + 1); g.closePath();
    g.fillStyle = rgbs(stone(arr[i].rgb, arr[i].ash)); g.fill();
  }
  for (let i = 0; i < arr.length; i++) if (arr[i].ash) {
    const top = arr[i].top; g.beginPath();
    for (let j = 0; j < COLS; j++) g[j ? 'lineTo' : 'moveTo'](j * CW, yb(top[j]) + .5);
    g.strokeStyle = 'rgba(255,250,236,.30)'; g.lineWidth = .6; g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, W, .8);
  g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(0, .8, W, .7);
  return { cv: c, h, hk, label: hourLabel(hk) };
}
function fullSync() {
  const N = nowInfo();
  flatBase = flat(Y0);
  const need = Math.ceil((H - Y0) / BAND) + 2;
  bands = [];
  for (let k = 1; k <= need; k++) bands.push(makeBand(synthLayers(N.hk - k, 60), N.hk - k));
  layers = synthLayers(N.hk, N.m);
  state = { hk: N.hk, h: N.h, m: N.m };
  grow = newGrow(N.hk, N.m);
  anim = null; reading = null;
  rebuildCache();
  spawnKouika(false);
}

// ---------- drawing the strata ----------
function layerPath(g, top, bottomY) {
  g.beginPath(); g.moveTo(0, bottomY);
  for (let j = 0; j < COLS; j++) g.lineTo(j * CW, top[j]);
  g.lineTo(W, bottomY); g.closePath();
}
function strokeTop(g, top, style, w) {
  g.beginPath();
  for (let j = 0; j < COLS; j++) g[j ? 'lineTo' : 'moveTo'](j * CW, top[j]);
  g.strokeStyle = style; g.lineWidth = w; g.stroke();
}
function drawBands(g, offset, skipFirst) {
  let y = Y0 + offset;
  for (let i = skipFirst ? 1 : 0; i < bands.length && y < H + 2; i++) { g.drawImage(bands[i].cv, 0, y, W, bands[i].h + 1); y += bands[i].h; }
}
// Painter's order from the top layer down: each layer is filled from its top to the base, so shared boundaries never leave seams.
function drawLayers(g, arr, n, map, baseY) {
  for (let i = n - 1; i >= 0; i--) {
    const L = arr[i], top = map ? L.top.map(map) : L.top;
    layerPath(g, top, baseY); g.fillStyle = rgbs(L.rgb); g.fill();
  }
  for (let i = 0; i < n; i++) {
    const L = arr[i], top = map ? L.top.map(map) : L.top;
    strokeTop(g, top, L.ash ? 'rgba(255,252,240,.55)' : rgbs(mix(L.rgb, WHITE, .4), .42), L.ash ? .9 : .7);
    g.save(); g.translate(0, 1.3); strokeTop(g, top, 'rgba(0,0,0,.16)', .8); g.restore();
  }
}
function rebuildCache() {
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, cache.width, cache.height);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBands(cx, 0, false);
  drawLayers(cx, layers, layers.length, null, Y0 + 1);
}

// ---------- grain texture (baked once) ----------
let grainPat = null, grainBg = null;
function makeGrain() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  for (let i = 0; i < 2600; i++) {
    const l = Math.random() < .5; g.fillStyle = l ? `rgba(255,248,230,${.25 + Math.random() * .45})` : `rgba(0,0,0,${.25 + Math.random() * .5})`;
    const s = Math.random() < .08 ? 2 : 1; g.fillRect(Math.random() * 180, Math.random() * 180, s, s);
  }
  grainPat = fx.createPattern(c, 'repeat'); grainBg = bx.createPattern(c, 'repeat');
}

// ---------- surface ----------
let surf = new Float32Array(1);
let anim = null; // {type:'compact'|'reveal', t, dur, ...}
let sNow = 0;
function frontX(s) { return -TAPER + (W + 2 * TAPER) * clamp((s - 7) / 52, 0, 1); }
function growTop(j, s) {
  const f = frontX(s), x = j * CW, u = clamp((f - x) / TAPER, 0, 1);
  return grow.bottom[j] + (grow.top[j] - grow.bottom[j]) * u * u * (3 - 2 * u);
}
function compactMap(e) { // where a boundary y goes while an hour is being pressed
  const sc = lerp(1, BAND / (60 * T), e), sh = BAND * e;
  return y => Y0 + sh - (Y0 - y) * sc;
}
function updateSurface() {
  if (surf.length !== COLS) surf = new Float32Array(COLS);
  if (anim && anim.type === 'compact') {
    const e = easeIO(clamp(anim.t / anim.dur, 0, 1)), m = compactMap(e), top = anim.arr.length ? anim.arr[anim.arr.length - 1].top : flatBase;
    for (let j = 0; j < COLS; j++) surf[j] = m(top[j]);
  } else if (anim && anim.type === 'reveal') {
    const n = anim.shown, top = n ? anim.arr[n - 1].top : flatBase;
    for (let j = 0; j < COLS; j++) surf[j] = top[j];
  } else if (grow) {
    for (let j = 0; j < COLS; j++) surf[j] = growTop(j, sNow);
  } else surf.fill(Y0);
}
const surfAt = x => surf[clamp(Math.round(x / CW), 0, COLS - 1)];

// ---------- craters: the only thing the viewer can do to the record ----------
function crater(cxp) {
  if (anim) return;
  const R = 30 * UI, D = Math.min(T * 5.5, 30 * UI);
  const floor = new Float32Array(COLS);
  for (let j = 0; j < COLS; j++) {
    const d = (j * CW - cxp) / R, bell = Math.exp(-d * d * 1.7);
    floor[j] = bell > .02 ? Math.min(Y0, surf[j] + D * bell) : -1e9; // stone (past hours) is too hard to dig
  }
  const cut = a => { for (let j = 0; j < COLS; j++) if (a[j] < floor[j]) a[j] = floor[j]; };
  layers.forEach(L => cut(L.top));
  if (grow.bottom !== flatBase) cut(grow.bottom);
  grow.top = makeTop(grow.bottom, grow.hk, grow.m);
  rebuildCache();
}

// ---------- particles (scales falling, silt puffs, jet streaks, sparkles) ----------
const P = [];
const MAXP = 900;
function addP(o) { if (P.length >= MAXP) P.shift(); P.push(o); }
function colorAtDepth(x, y) {
  const j = clamp(Math.round(x / CW), 0, COLS - 1);
  for (let i = layers.length - 1; i >= 0; i--) { const bot = i ? layers[i - 1].top[j] : Y0; if (y >= layers[i].top[j] - .5 && y <= bot + .5) return layers[i].rgb; }
  return grow ? grow.rgb : ASH;
}
function burst(x0, n, spread, power, colorFn) {
  for (let i = 0; i < n; i++) {
    const x = x0 + (Math.random() - .5) * spread, y = surfAt(x) - 1;
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.6;
    const v = power * (.35 + Math.random() * .75);
    addP({ k: 1, d: GL_D, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, sz: (1 + Math.random() * 1.8) * UI, rgb: colorFn(x, y + Math.random() * 18), life: 0, max: 3 + Math.random() * 2.5, tw: Math.random() * 6 });
  }
}

// ---------- fish school: the second hand ----------
const fish = [];
const watch = { k: 0, greet: false, cool: 0 }; // the school notices a face at the glass
function makeFish() {
  fish.length = 0;
  const n = 18;
  for (let i = 0; i < n; i++) fish.push({
    x: W * .1 + Math.random() * 40, y: H * .15 + Math.random() * 40, vx: 20, vy: 0, ang: 0,
    L: (11 + Math.random() * 6) * UI, a: Math.random() * 6.28, w: (.25 + Math.random() * .35) * (Math.random() < .5 ? -1 : 1),

    const glow = Math.sin(Math.PI * clamp(anim.t / anim.dur, 0, 1));
    if (glow > 0) { g.globalCompositeOperation = 'lighter'; g.fillStyle = `rgba(255,244,220,${.16 * glow})`; g.fillRect(0, surf[0] - 6, W, Y0 + BAND - surf[0] + 6); g.globalCompositeOperation = 'source-over'; }

    drawLayers(g, anim.arr, anim.shown, null, Y0 + 1);

  // material: grain, depth, slow agate sheen (only on the strata already drawn)
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = .32; g.fillStyle = grainPat; g.fillRect(0, Y60 - 40, W, H); g.globalAlpha = 1;
  const dg = g.createLinearGradient(0, Y60, 0, H);
  dg.addColorStop(0, 'rgba(0,6,12,0)'); dg.addColorStop(clamp((Y0 - Y60) / (H - Y60), 0, 1), 'rgba(0,6,12,.2)'); dg.addColorStop(1, 'rgba(0,4,8,.62)');
  g.fillStyle = dg; g.fillRect(0, Y60 - 40, W, H);
  const sx = (elapsed * 18) % (W * 2.2) - W * .6;
  const sh = g.createLinearGradient(sx, Y60, sx + W * .55, H);
  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(236,250,255,.07)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sh; g.fillRect(0, Y60 - 40, W, H);
  g.globalCompositeOperation = 'source-over';

  g.strokeStyle = 'rgba(190,232,236,.08)'; g.lineWidth = 7; g.stroke();
  g.strokeStyle = 'rgba(214,242,244,.42)'; g.lineWidth = .9; g.stroke();

  // the minute just sealed: a light runs along its top

    sealT += 1 / 60; const t = sealT / 1.3;
    if (t > 1) sealT = -1; else {
      const top = layers[layers.length - 1].top, x1 = t * (W + 80) - 40;
      g.beginPath(); let started = false;
      for (let j = 0; j < COLS; j++) { const x = j * CW; if (x < x1 - 90 || x > x1) continue; g[started ? 'lineTo' : 'moveTo'](x, top[j]); started = true; }
      const lg = g.createLinearGradient(x1 - 90, 0, x1, 0); lg.addColorStop(0, 'rgba(255,255,240,0)'); lg.addColorStop(1, 'rgba(255,255,240,.85)');
      g.strokeStyle = lg; g.lineWidth = 1.4; g.stroke();

  if (reading) {
    reading.t += 1 / 60;
    const a = reading.t < .2 ? reading.t / .2 : reading.t > 2.4 ? Math.max(0, 1 - (reading.t - 2.4) / .5) : 1;

    else if (p.k === 2) { const a = 1 - p.life / p.max; g.fillStyle = rgbs(mix(p.rgb, WHITE, .6), a); g.beginPath(); g.arc(p.x, p.y, p.sz * (1 + p.life * 3), 0, 6.283); g.fill(); }
    else if (p.k === 3) { const a = 1 - p.life / p.max; g.strokeStyle = `rgba(210,236,238,${.35 * a})`; g.lineWidth = 1; g.beginPath(); g.moveTo(p.x, p.y - 26); g.lineTo(p.x, p.y); g.stroke(); }
    g.restore();

  drawPole(g, N);
}
// The sea floor goes back from the glass: its top face shows between the front edge (the cut) and the edge at EDGE_D.
function drawTopFace() {
  const g = bx, dx = shX(EDGE_D), dy = shY(EDGE_D);
  if (dy > -.5) return; // looking from below: the cut face hides it
  const c = grow ? grow.rgb : (layers.length ? layers[layers.length - 1].rgb : [120, 120, 120]);
  const x0 = -Math.abs(dx) - CW, x1 = W + Math.abs(dx) + CW, back = [];
  for (let x = x0; x <= x1; x += CW) back.push(x);
  g.beginPath();
  back.forEach((x, i) => g[i ? 'lineTo' : 'moveTo'](x + dx, surfAt(x) + dy));
  for (let i = back.length - 1; i >= 0; i--) g.lineTo(back[i], surfAt(back[i]) + 2);
  g.closePath();
  const ymin = Math.min(surf[0], surf[COLS >> 1], surf[COLS - 1]) + dy;
  const gr = g.createLinearGradient(0, ymin, 0, ymin - dy + 4);
  gr.addColorStop(0, rgbs(mix(c, sea.bot, .78))); gr.addColorStop(1, rgbs(mix(c, sea.bot, .38)));
  g.fillStyle = gr; g.fill();
  g.save(); g.clip(); g.globalAlpha = .28; g.fillStyle = grainBg; g.fillRect(-W, ymin - 4, W * 3, -dy + 12); g.restore();
  g.beginPath(); back.forEach((x, i) => g[i ? 'lineTo' : 'moveTo'](x + dx, surfAt(x) + dy));
  g.strokeStyle = 'rgba(200,236,240,.16)'; g.lineWidth = 1; g.stroke();
}
// motes between the glass and the eye: they move the other way
const near = [];
function makeNear() { near.length = 0; for (let i = 0; i < 9; i++) near.push({ x: Math.random() * W, y: Math.random() * H, r: (3 + Math.random() * 7) * UI, v: 3 + Math.random() * 6, a: .05 + Math.random() * .08, d: -(.5 + Math.random() * .7) }); }
function drawNear() {
  const g = fx;
  for (const n of near) {
    n.y += n.v / 60; if (n.y > H + 20) { n.y = -20; n.x = Math.random() * W; }
    const x = n.x + shX(n.d), y = n.y + shY(n.d), gr = g.createRadialGradient(x, y, 0, x, y, n.r);
    gr.addColorStop(0, `rgba(220,240,236,${n.a})`); gr.addColorStop(1, 'rgba(220,240,236,0)');

}
function updateEye(dt, t) {
  let tx, ty;
  if (head.on) { tx = head.tx; ty = head.ty; }
  else if (tilt.on && tilt.got) { tx = -tilt.g / 30; ty = .35 + tilt.b / 28; }
  else {
    const idle = t - drag.at, k = smooth(4, 10, idle);
    if (idle > 4) { drag.x *= Math.exp(-.5 * dt * k); drag.y += (.35 - drag.y) * (1 - Math.exp(-.5 * dt * k)); }
    tx = drag.x + .5 * Math.sin(t * .13) * k; ty = drag.y + .15 * Math.sin(t * .09 + 1) * k;

  E.tx = clamp(tx, -1, 1); E.ty = clamp(ty, -1, 1);
  const a = 1 - Math.exp(-6 * dt);
  E.x += (E.tx - E.x) * a; E.y += (E.ty - E.y) * a;
  G += ((head.on ? 2 : 1) - G) * (1 - Math.exp(-2 * dt));
  seaEl.style.transform = `translate3d(${shX(.7).toFixed(1)}px,${shY(.7).toFixed(1)}px,0)`;
  glWrap.style.transform = `translate3d(${shX(GL_D).toFixed(1)}px,${shY(GL_D).toFixed(1)}px,0)`;

  g.strokeStyle = 'rgba(226,238,232,.42)'; g.lineWidth = 1.2;

  g.fillStyle = 'rgba(226,238,232,.5)'; g.beginPath(); g.arc(px, top, 1.8 * UI, 0, 6.283); g.fill();
