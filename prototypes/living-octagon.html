<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LIVING OCTAGON</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070b}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>const c=document.getElementById('c'),g=c.getContext('2d');let W,H,d,n=8,rot=0,pressure=0;function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=0){g.fillStyle="#09070b";g.fillRect(0,0,W,H);let S=Math.min(W,H),cx=W/2,cy=H/2;for(let k=0;k<9;k++){let R=S*(.12+k*.045);g.beginPath();for(let i=0;i<=n;i++){let a=i/n*Math.PI*2+rot+p*.08,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;if(pressure){let dx=x-pressure.x,dy=y-pressure.y,z=Math.max(0,1-Math.hypot(dx,dy)/250);x+=dx*z*.28;y+=dy*z*.28}g.lineTo(x,y)}g.strokeStyle=`hsla(${275+k*9},90%,${58+k*2}%,${.18+k*.025})`;g.lineWidth=1.5+k*.3;g.stroke()}}function add(x,y){if(APKit.isUI(x,y))return;pressure={x,y};n=n===8?9:8;rot+=.22}c.addEventListener('pointerdown',e=>add(e.clientX,e.clientY));c.addEventListener('pointermove',e=>{if(e.buttons)add(e.clientX,e.clientY)});APKit.init({canvas:c,gifName:'LIVING-OCTAGON-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{n=5+Math.floor(Math.random()*7);rot=Math.random()*6}},{label:'↻',name:'reset',onClick:()=>{n=8;rot=0;pressure=0}}]});(function loop(){draw(performance.now()*.00006);requestAnimationFrame(loop)})();</script></body></html>
