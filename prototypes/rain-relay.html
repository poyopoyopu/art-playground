<!doctype html>
<!-- RAIN RELAY — クロード作(おっちゃん提供のX投稿動画=おかず/Okazz氏の#p5js作品、暗い水面に色とりどりの雫が落ちて楕円の波紋としぶきが広がる映像を参考に、法則はオリジナル)。ap-kit.js統合: クロード -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RAIN RELAY — 雨は、水面から降る</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111214}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:0;right:0;top:calc(20% + env(safe-area-inset-top,0px));text-align:center;
  font:600 12px/1.95 "Hiragino Sans","Yu Gothic",sans-serif;letter-spacing:.12em;color:rgba(236,232,220,.9);
  text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;transition:opacity 1.8s ease;opacity:0}
#hint.on{opacity:1}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ここでは、雨は水面から降る<br>輪が通った雫は跳ね上がり<br>その輪の色に染まって落ちる<br>触れると空から雫がひとつ(長押しで重く)</div>
<script>
(function(){
'use strict';
/* ─────────────────────────────────────────────────────────────
   世界のルール:「雨は、水面から降る」
   ・暗い水面には色とりどりの雫(ビーズ)が浮いている。空から降る雨はない。
   ・波紋の輪が雫の下を通ると、その雫は跳ね上がり、
     「自分を跳ね上げた輪の色」に染まって落ちる。落ちた所にまた輪ができる。
     → 雨はリレーのように水面を渡り、色は波紋から波紋へ感染していく。
   ・強い着水は雫を小さな雫に割り、それがまた小さな輪を作る(輪の中に輪の自己相似)。
     着水した雫どうしが触れれば一つにまとまる。
   ・放っておいても、水面はときどき自分で雫を跳ね上げる(自発的な雨)。
     色は受け継がれるだけなので、放っておくと池はだんだん一色に寄っていく。
   ・触れると、その場所へ唯一「空からの雫」が落ちる。色はいま池で一番少ない色。
     長押しするほど重くなり、大きな輪と長いリレーを起こす。
   ・池の色の割合は画面下の細い帯に出る(誰の雨が池を塗り替えたかの記録)。
   ✦=水面の色の組み合わせを替える(雫の系譜はそのまま) / ↻=雫を撒き直す
   ───────────────────────────────────────────────────────────── */
const TAU=Math.PI*2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1;

const PALETTES=[
  ['#2d63db','#3cb6e6','#f39028','#e3294d','#ebe6d4','#37c4a9','#f4c533'],
  ['#ff5f6d','#ffc75f','#63d297','#4f8dff','#b983ff','#f2f2f2'],
  ['#00cfc1','#ff4f8b','#ffe066','#7a5cff','#f5f5f5','#ff9f1c'],
  ['#e63946','#f1faee','#a8dadc','#4a7fb0','#f4a261','#2a9d8f'],
  ['#ff7b00','#ffd000','#00b4d8','#ff3d7f','#eaeaea','#7cff6b']
];
let palIdx=0,PAL=PALETTES[0];

/* ── camera (low, long lens: rings read as flat ellipses, mild perspective) ── */
const ELEV=24*Math.PI/180;
let L=4000,CY=0,CZ=0,SA=Math.sin(ELEV),CA=Math.cos(ELEV);
function setupCam(){
  L=Math.max(W,H)*5;
  CY=L*SA;CZ=-L*CA;
}
// project world (x,y,z) → [sx,sy,scale,sinE]
function proj(x,y,z){
  const px=x,py=y-CY,pz=z-CZ;
  const d=-py*SA+pz*CA;               // depth along forward (0,-sin,cos)
  const u=py*CA+pz*SA;                // along up (0,cos,sin)
  const s=L/d;
  return [W/2+px*s,H/2-u*s,s];
}
function sinElev(x,z){
  const px=x,py=-CY,pz=z-CZ;
  return CY/Math.sqrt(px*px+py*py+pz*pz);
}
function unproj(sx,sy){
  const a=(sx-W/2)/L,b=-(sy-H/2)/L;
  const dx=a,dy=-SA+b*CA,dz=CA+b*SA;
  if(dy>=-1e-4)return null;
  const t=-CY/dy;
  return [dx*t,CZ+dz*t];
}

/* ── state ── */
let beads=[],air=[],rings=[],spray=[];
let ringId=1,time=0,spont=1.2,kickScale=1;
const holds=new Map();
const G=900;
let maxBeads=320;

function rnd(a,b){return a+Math.random()*(b-a)}
function beadR(m){return 0.9+1.9*Math.sqrt(m)}

function scatter(){
  beads=[];air=[];rings=[];spray=[];
  const n=Math.round(Math.min(170,Math.max(70,W*H/3300)));
  maxBeads=Math.round(n*1.35);
  let tries=0;
  while(beads.length<n&&tries<n*8){
    tries++;
    const p=unproj(rnd(-20,W+20),rnd(H*0.03,H+20));
    if(!p)continue;
    const m=Math.pow(Math.random(),1.6)*1.1+0.18;
    let ok=true;
    for(const b of beads){const dx=b.x-p[0],dz=b.z-p[1];if(dx*dx+dz*dz<(beadR(m)+beadR(b.m)+6)**2){ok=false;break}}
    if(!ok)continue;
    beads.push({x:p[0],z:p[1],m,c:(Math.random()*PAL.length)|0,cool:0,hop:0,hv:0,lastRing:0});
  }
}

function onScreen(x,z,pad){
  const p=proj(x,0,z);
  return p[0]>-pad&&p[0]<W+pad&&p[1]>-pad&&p[1]<H+pad;
}

/* ── events ── */
function launchBead(b,strength,ox,oz,color){
  // the bead leaves the surface and becomes rain
  let dx=b.x-ox,dz=b.z-oz,d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;
  const hs=18+46*strength;
  air.push({x:b.x,y:beadR(b.m),z:b.z,vx:dx*hs,vy:230+250*strength,vz:dz*hs,
            m:b.m,e:strength,c:color,sky:false});
}

function land(d){
  const e=d.e,m=d.m,c=d.c;
  const rmax=(18+58*Math.pow(e,0.85))*(0.62+0.38*Math.sqrt(Math.min(m,2.2)));
  const id=ringId++;
  rings.push({id,x:d.x,z:d.z,t:0,dur:1.5+1.0*Math.min(e,2.5),rmax,e,c,pr:0});
  // decorative spray streaks (multicolour like a real splash under coloured light)
  const ns=Math.round(4+9*Math.min(e,2.4));
  for(let i=0;i<ns;i++){
    const a=Math.random()*TAU,hsp=rnd(30,120)*Math.sqrt(e),vsp=rnd(160,420)*Math.sqrt(Math.min(e,2.4));
    const cc=Math.random()<0.55?c:(Math.random()*PAL.length)|0;
    spray.push({x:d.x,y:0.5,z:d.z,vx:Math.cos(a)*hsp,vy:vsp,vz:Math.sin(a)*hsp,c:cc,w:Math.random()<0.25});
  }
  // a hard landing breaks the drop into smaller drops: rings inside rings
  const k=e>1.7?4:e>1.05?3:2;
  if(e>0.62&&m/k>=0.11){
    const cm=m/k,base=Math.random()*TAU;
    for(let i=0;i<k;i++){
      const a=base+i*TAU/k+rnd(-0.35,0.35);
      const dist=rmax*rnd(0.55,0.95),vy=rnd(170,260),tf=2*vy/G;
      air.push({x:d.x,y:1,z:d.z,vx:Math.cos(a)*dist/tf,vy,vz:Math.sin(a)*dist/tf,
                m:cm,e:e*0.42,c,sky:false});
    }
    return id;
  }
  // otherwise it rests on the water; merge with a bead it touches
  const r0=beadR(m);
  for(let i=0;i<beads.length;i++){
    const b=beads[i],dx=b.x-d.x,dz=b.z-d.z;
    if(dx*dx+dz*dz<(r0+beadR(b.m)+2)**2){
      const tot=b.m+m;
      b.x=(b.x*b.m+d.x*m)/tot;b.z=(b.z*b.m+d.z*m)/tot;
      if(m>b.m)b.c=c;
      b.m=Math.min(tot,2.6);b.cool=0.7;b.lastRing=id;b.hv=60;
      return id;
    }
  }
  if(onScreen(d.x,d.z,60))
    beads.push({x:d.x,z:d.z,m,c,cool:0.7,hop:0,hv:40,lastRing:id});
  return id;
}

function rarestColor(){
  const cnt=new Array(PAL.length).fill(0);
  for(const b of beads)cnt[b.c]+=b.m;
  for(const d of air)cnt[d.c]+=d.m*0.5;
  let best=0,bv=Infinity;
  const off=(Math.random()*PAL.length)|0;
  for(let j=0;j<PAL.length;j++){const i=(j+off)%PAL.length;if(cnt[i]<bv){bv=cnt[i];best=i}}
  return best;
}

/* ── simulation ── */
function update(dt){
  time+=dt;
  // spontaneous rain: the water throws up one of its own beads
  spont-=dt;
  if(spont<=0){
    spont=rnd(0.22,0.55);
    if(beads.length){
      const i=(Math.random()*beads.length)|0,b=beads[i];
      if(onScreen(b.x,b.z,-20)){
        beads.splice(i,1);
        const col=Math.random()<0.03?(Math.random()*PAL.length)|0:b.c;
        air.push({x:b.x,y:beadR(b.m),z:b.z,vx:rnd(-12,12),vy:rnd(330,470),vz:rnd(-12,12),
                  m:b.m,e:rnd(0.75,1.05)*kickScale,c:col,sky:false});
      }
    }
  }
  // airborne drops
  for(let i=air.length-1;i>=0;i--){
    const d=air[i];
    d.vy-=G*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;
    if(d.y<=0){d.y=0;air.splice(i,1);land(d);}
  }
  // spray
  for(let i=spray.length-1;i>=0;i--){
    const s=spray[i];
    s.vy-=G*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
    if(s.y<0)spray.splice(i,1);
  }
  // beads bob and cool down
  for(const b of beads){
    b.cool=Math.max(0,b.cool-dt);
    b.hv-=G*0.6*dt;b.hop+=b.hv*dt;
    if(b.hop<0){b.hop=0;b.hv=Math.abs(b.hv)>30?-b.hv*0.3:0;}
  }
  // rings expand and relay the rain
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.t+=dt/r.dur;
    if(r.t>=1){rings.splice(i,1);continue;}
    const rr=r.rmax*(1-Math.pow(1-r.t,2.2));
    if(r.t<0.8){
      const kick=r.e*0.8*kickScale;
      for(let j=beads.length-1;j>=0;j--){
        const b=beads[j];
        if(b.lastRing===r.id)continue;
        const dx=b.x-r.x,dz=b.z-r.z,dd=dx*dx+dz*dz;
        if(dd>rr*rr||dd<=r.pr*r.pr)continue;
        const str=kick*(1-0.42*Math.sqrt(dd)/r.rmax)*(1.15-0.25*Math.min(b.m,1.6));
        b.lastRing=r.id;
        if(str>0.24&&b.cool<=0){
          beads.splice(j,1);
          launchBead(b,str,r.x,r.z,r.c);      // ← the rule: it falls in the colour of the ring that lifted it
        }else{
          b.hv=Math.max(b.hv,40+140*str);   // too weak: it only bobs
        }
      }
    }
    r.pr=rr;
  }
  // keep populations bounded
  if(air.length>260)air.splice(0,air.length-260);
  if(rings.length>240)rings.splice(0,rings.length-240);
  if(spray.length>700)spray.splice(0,spray.length-700);
  if(beads.length>maxBeads){
    beads.sort((a,b)=>b.m-a.m);beads.length=maxBeads;
  }
  // held drops gather weight
  for(const h of holds.values())h.age+=dt;
}

/* ── rendering ── */
function bg(){
  ctx.fillStyle='#111214';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(38,40,46,0.35)');g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawRing(x,z,rr,t,col,e){
  const p=proj(x,0,z),s=p[2],se=sinElev(x,z);
  const a=Math.pow(1-t,0.85);
  if(a<=0.01||rr<=0.3)return;
  const lines=e>1.1?3:e>0.45?2:1;
  ctx.strokeStyle=col;
  for(let k=0;k<lines;k++){
    const r=rr*(1-k*0.075)-k*0.6;
    if(r<=0.3)continue;
    ctx.globalAlpha=a*(k===0?0.95:0.55);
    ctx.lineWidth=(k===0?1.7:1.1)*Math.min(1.25,0.55+0.5*s);
    ctx.beginPath();ctx.ellipse(p[0],p[1],r*s,r*s*se,0,0,TAU);ctx.stroke();
  }
}

function drawBead(x,z,m,col,hop,alpha){
  const r=beadR(m);
  const g=proj(x,0,z),p=proj(x,r*0.55+hop,z),s=p[2];
  if(hop>0.5){
    ctx.globalAlpha=0.25*alpha;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(g[0],g[1],r*s*0.9,r*s*0.9*sinElev(x,z),0,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=alpha;ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(p[0],p[1],r*s,r*s*0.92,0,0,TAU);ctx.fill();
}

function drawAir(d,alpha){
  const r=beadR(d.m);
  // shadow on the water below
  const g=proj(d.x,0,d.z);
  const sh=Math.max(0,1-d.y/420);
  ctx.globalAlpha=0.3*sh*alpha;ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(g[0],g[1],r*g[2]*1.2,r*g[2]*1.2*sinElev(d.x,d.z),0,0,TAU);ctx.fill();
  const p=proj(d.x,d.y+r,d.z),s=p[2];
  // short motion trail
  const q=proj(d.x-d.vx*0.03,d.y+r-d.vy*0.03,d.z-d.vz*0.03);
  ctx.globalAlpha=0.35*alpha;ctx.strokeStyle=PAL[d.c];ctx.lineWidth=Math.max(1,r*s*0.9);
  ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
  const st=1+Math.min(0.9,Math.abs(d.vy)/700);
  ctx.globalAlpha=alpha;ctx.fillStyle=PAL[d.c];
  ctx.beginPath();ctx.ellipse(p[0],p[1],r*s/Math.sqrt(st),r*s*st,0,0,TAU);ctx.fill();
}

function drawSpray(s,alpha){
  const p=proj(s.x,s.y,s.z),q=proj(s.x-s.vx*0.05,s.y-s.vy*0.05,s.z-s.vz*0.05);
  ctx.globalAlpha=alpha*(s.w?0.8:0.9);
  ctx.strokeStyle=s.w?'#f4f1e8':PAL[s.c];
  ctx.lineWidth=s.w?0.9:1.25;
  ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
}

function drawHolds(){
  for(const h of holds.values()){
    const w=unproj(h.sx,h.sy);if(!w)continue;
    const m=0.7+Math.min(1.6,h.age),e=0.9+Math.min(1.8,h.age*1.1);
    const hy=260;
    // target ring on the water, pulsing faster as it gets heavier
    const pulse=(time*(1.2+e*0.6))%1;
    drawRing(w[0],w[1],(10+18*e)*pulse,pulse,PAL[h.c],0.3);
    const p=proj(w[0],hy,w[1]),r=beadR(m)*p[2];
    const wob=1+0.06*Math.sin(time*18);
    ctx.globalAlpha=0.95;ctx.fillStyle=PAL[h.c];
    ctx.beginPath();ctx.ellipse(p[0],p[1]+r*0.15,r*wob,r*1.18/wob,0,0,TAU);ctx.fill();
    ctx.globalAlpha=0.5;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p[0]-r*0.3,p[1]-r*0.2,Math.max(0.8,r*0.22),0,TAU);ctx.fill();
  }
}

function drawShare(){
  const cnt=new Array(PAL.length).fill(0);let tot=0;
  for(const b of beads){cnt[b.c]+=b.m;tot+=b.m;}
  if(tot<=0)return;
  const y=H-3,w=Math.min(W*0.5,240),x0=(W-w)/2;
  let x=x0;
  ctx.globalAlpha=0.85;
  for(let i=0;i<PAL.length;i++){
    const ww=w*cnt[i]/tot;if(ww<=0)continue;
    ctx.fillStyle=PAL[i];ctx.fillRect(x,y-2,ww,2);x+=ww;
  }
}

function render(){
  bg();
  ctx.lineCap='round';
  // far → near for rings, then beads, then what is in the air
  rings.sort((a,b)=>b.z-a.z);
  for(const r of rings)drawRing(r.x,r.z,r.pr,r.t,PAL[r.c],r.e);
  beads.sort((a,b)=>b.z-a.z);
  for(const b of beads)drawBead(b.x,b.z,b.m,PAL[b.c],b.hop,1);
  air.sort((a,b)=>b.z-a.z);
  for(const d of air)drawAir(d,1);
  for(const s of spray)drawSpray(s,1);
  drawHolds();
  drawShare();
  ctx.globalAlpha=1;
}

/* ── GIF: the simulation pauses; a fixed set of drops replays on a 3 s cycle ── */
let gifEv=null;
function buildGif(){
  gifEv=[];
  const src=beads.slice();
  const n=Math.min(14,Math.max(9,(W*H/26000)|0));
  for(let i=0;i<n;i++){
    const p=unproj(rnd(W*0.08,W*0.92),rnd(H*0.1,H*0.92));if(!p)continue;
    const e=rnd(0.7,1.4);
    const ev={x:p[0],z:p[1],o:i/n+rnd(-0.03,0.03),e,m:rnd(0.4,1),c:(Math.random()*PAL.length)|0,kids:[],spr:[]};
    const rmax=(18+58*Math.pow(e,0.85))*0.9;
    const k=e>1.05?3:2,base=Math.random()*TAU;
    for(let j=0;j<k;j++){const a=base+j*TAU/k+rnd(-0.3,0.3),dd=rmax*rnd(0.55,0.9);ev.kids.push([Math.cos(a)*dd,Math.sin(a)*dd]);}
    for(let j=0;j<10;j++){const a=Math.random()*TAU;ev.spr.push([Math.cos(a)*rnd(30,110),rnd(180,380),Math.sin(a)*rnd(30,110),Math.random()<0.5?ev.c:(Math.random()*PAL.length)|0,Math.random()<0.25]);}
    ev.rmax=rmax;
    gifEv.push(ev);
  }
  gifEv.beads=src;
}
function loopRender(phase){
  if(!gifEv)buildGif();
  bg();ctx.lineCap='round';
  const u0=phase/TAU;
  const items=[];
  for(const ev of gifEv){
    const u=((u0+ev.o)%1+1)%1;          // 0..1 over 3 s; everything is invisible at the seam
    const T=u*3;
    // fall: 0 → 0.55 s, impact at 0.55
    if(T<0.55){
      const y=300*(1-(T/0.55)*(T/0.55));
      const a=Math.min(1,T/0.12);
      items.push(()=>drawAir({x:ev.x,y,z:ev.z,vx:0,vy:-900*T,vz:0,m:ev.m,c:ev.c},a));
    }else{
      const t=(T-0.55)/2.2;
      if(t<1){
        const rr=ev.rmax*(1-Math.pow(1-t,2.2));
        drawRing(ev.x,ev.z,rr,t,PAL[ev.c],ev.e);
      }
      const ts=T-0.55;
      for(const s of ev.spr){
        const y=s[1]*ts-G*ts*ts/2;
        if(y>0)items.push(()=>drawSpray({x:ev.x+s[0]*ts,y,z:ev.z+s[2]*ts,vx:s[0],vy:s[1]-G*ts,vz:s[2],c:s[3],w:s[4]},1));
      }
      // children: flight 0.45 s, then small rings
      for(const kd of ev.kids){
        const tk=ts/0.45;
        if(tk<1){
          const vy=G*0.45/2,y=vy*ts-G*ts*ts/2;
          items.push(()=>drawAir({x:ev.x+kd[0]*tk,y:Math.max(0,y),z:ev.z+kd[1]*tk,vx:kd[0]/0.45,vy:vy-G*ts,vz:kd[1]/0.45,m:ev.m*0.4,c:ev.c},1));
        }else{
          const t2=(ts-0.45)/1.6;
          if(t2<1)drawRing(ev.x+kd[0],ev.z+kd[1],ev.rmax*0.45*(1-Math.pow(1-t2,2.2)),t2,PAL[ev.c],0.4);
        }
      }
    }
  }
  const bs=gifEv.beads.slice().sort((a,b)=>b.z-a.z);
  for(const b of bs)drawBead(b.x,b.z,b.m,PAL[b.c],0,1);
  for(const f of items)f();
  drawShare();
  ctx.globalAlpha=1;
}

/* ── input ── */
function say(m){if(window.APKit&&APKit.toast)APKit.toast(m,2400);}
cv.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  holds.set(e.pointerId,{sx:e.clientX,sy:e.clientY,age:0,c:rarestColor()});
  hideHint();
});
cv.addEventListener('pointermove',e=>{
  const h=holds.get(e.pointerId);if(!h)return;
  h.sx=e.clientX;h.sy=e.clientY;
});
function release(e){
  const h=holds.get(e.pointerId);if(!h)return;
  holds.delete(e.pointerId);
  const w=unproj(h.sx,h.sy);if(!w)return;
  const m=0.7+Math.min(1.6,h.age),en=0.9+Math.min(1.8,h.age*1.1);
  air.push({x:w[0],y:260,z:w[1],vx:0,vy:-120,vz:0,m,e:en,c:h.c,sky:true});
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

let hintT=null;
const hint=document.getElementById('hint');
function hideHint(){hint.classList.remove('on');}
setTimeout(()=>{hint.classList.add('on');hintT=setTimeout(hideHint,6500);},700);

/* ── buttons ── */
function mutate(){
  palIdx=(palIdx+1+((Math.random()*(PALETTES.length-1))|0))%PALETTES.length;
  PAL=PALETTES[palIdx];
  for(const b of beads)b.c%=PAL.length;
  for(const d of air)d.c%=PAL.length;
  for(const r of rings)r.c%=PAL.length;
  for(const s of spray)s.c%=PAL.length;
  kickScale=rnd(0.9,1.12);
  gifEv=null;
  say('水面の色が替わった — 雫の系譜はそのまま');
}
function resetAll(){
  scatter();gifEv=null;
  say('雫を撒き直した');
}

/* ── boot ── */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const nw=innerWidth,nh=innerHeight;
  const first=W===0;
  W=nw;H=nh;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  setupCam();
  if(first)scatter();
  else beads=beads.filter(b=>onScreen(b.x,b.z,80));
  gifEv=null;
}
addEventListener('resize',resize,{passive:true});
resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const exp=window.APKit&&APKit.isExporting&&APKit.isExporting();
  if(!exp){gifEv=null;update(dt);render();}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if(window.APKit)APKit.init({
  canvas:cv,
  gifName:'rain-relay-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  /* GIF書き出しはなし(2026/09/29 おっちゃんの方針で◉を外した) */
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});
})();
</script>
</body>
