<!doctype html>
<!-- MICRO LATTICE — ChatGPT作。微細な格子が局所法則で再帰的に向きを変える試作。ap-kit.js統合 -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MICRO LATTICE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});let W,H,D,seed=Math.random()*9999,marks=[],drag=false,last;const TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0);draw(performance.now())}addEventListener('resize',resize);
function hsv(h,s,v){h=((h%360)+360)%360/60;let i=h|0,f=h-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s),r,b,d;switch(i%6){case 0:r=v;b=u;d=p;break;case 1:r=q;b=v;d=p;break;case 2:r=p;b=v;d=u;break;case 3:r=p;b=q;d=v;break;case 4:r=u;b=p;d=v;break;default:r=v;b=p;d=q}return`rgb(${r*255|0},${b*255|0},${d*255|0})`}
function pt(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function fx(x,y,t){let X=x/W*2-1,Y=1-y/H*2,A=0,B=0;for(let m of marks){let dx=X-m.x,dy=Y-m.y,d2=dx*dx+dy*dy,a=Math.exp(-d2/(m.r*m.r))*Math.exp(-(t-m.t)/1000*.17);A+=a*m.a;B+=a*m.b}for(let k=0;k<5;k++){let z=X*.9+Math.sin(Y*3.1+k*.73+seed)*.08+A*.22;Y=Y*.9+Math.sin(z*2.7-k*.61)*.07+B*.18;X=z}return[X,Y,A,B]}
function draw(t){g.fillStyle='#000';g.fillRect(0,0,W,H);let s=Math.max(5,Math.min(8,Math.min(W,H)/100)),nx=Math.ceil(W/s)+2,ny=Math.ceil(H/s)+2;for(let j=-1;j<ny;j++)for(let i=-1;i<nx;i++){let x=(i+.5)*s,y=(j+.5)*s,z=fx(x,y,t),q=Math.sin(i*.11+j*.19+seed*.01)+Math.sin(i*.031-j*.047+seed*.02);let ang=q*.55+z[2]*2.7,sc=.54+.16*(.5+.5*Math.sin(q*3+z[3]*4));let hue=seed*.03+i*.62+j*.91+z[2]*150+Math.sin(i*.019+j*.027)*95;g.fillStyle=hsv(hue,1,.93);g.save();g.translate(x+z[0]*s*1.7,y-z[1]*s*1.7);g.rotate(ang);g.fillRect(-s*sc/2,-s*sc/2,s*sc,s*sc);g.restore()}}
function touch(x,y){if(window.APKit&&APKit.isUI(x,y))return true;let dx=0,dy=0;if(last){dx=x-last.x;dy=y-last.y}marks.push({x:x/W*2-1,y:1-y/H*2,r:.16,a:1.8+dx*.01,b:1.2+dy*.01,t:performance.now()});if(marks.length>30)marks.shift();draw(performance.now());return false}function downFn(e){if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;last=pt(e);drag=true;touch(last.x,last.y)}function moveFn(e){if(!drag)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;let p=pt(e);if(Math.hypot(p.x-last.x,p.y-last.y)>7){touch(p.x,p.y);last=p}}function up(){drag=false}c.addEventListener('pointerdown',downFn,{passive:false});c.addEventListener('pointermove',moveFn,{passive:false});c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);let start=performance.now();function loop(t){if(!APKit.isExporting())draw(t);requestAnimationFrame(loop)}APKit.init({canvas:c,gifName:'micro-lattice-loop',clockFormat:'spec',loopFrame:p=>draw(start+p*TAU*1000),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*9999;marks=[];draw(performance.now())}},{label:'↻',name:'reset',onClick:()=>{marks=[];draw(performance.now())}}]});resize();requestAnimationFrame(loop);
</script></body></html>
