<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SILVER TURN — 怯えは銀の閃きになって群れを渡る</title>
<!-- SILVER TURN — クロちゃん(Claude)作。ap-kit.js統合: クロちゃん。2026/10/23 試作
     Meta Museに作らせたJULIA DRIFT / BAIT BALL / MOON DRIFTが3作とも「しょぼい」で不採用 → おっちゃん「クロちゃんなら100点に仕上げられる？」→「イワシで頼む」。
     2026/10/23 iPhone実機で「もっとリアルに出来ないの？ 他の魚とかは？」→ 捕食者(マグロ/サメ/イルカ/カジキ)を入れ、群れの魚の種類も✦で切り替え(両方)。
       リアルさ: 匹数を増やして密集、上の魚が光を遮って群れの下と中心が暗くなる、背と腹のコントラスト、水面の線を控えめに。
     世界のルール: 指は捕食者。群れは指をよけて穴を開け、怯えは銀の閃きの波になって群れ全体を渡る。
       触るほど群れは怯えて、球がぎゅっと締まり、速く回り、よくギラつくようになる(しばらく触らなければ落ち着く)
       何もしなくても: 群れ(ベイトボール)が回遊し、捕食者が周りを回ってはときどき突っ込む。カメラはゆっくり群れの周りを回る
       タップ   = その場所へ捕食者が飛び込む(一番近い1匹)。群れが弾けて穴が開き、泡と閃きの波
       なぞる   = 指の通り道にトンネルが開き、閃きが指を追う
       長押し   = 群れが怯えて締まり、離すと大きな閃きの波
       ✦       = 別の海: 外洋の青(マイワシ×キハダマグロ) / 潮通しの崖(ギンガメアジ×サメ) / 夕暮れの海(マイワシ×イルカ) / 真昼の浅瀬(キビナゴ×バショウカジキ) / 深場の藍(オニカマス×サメ)
       ◎       = 次の現象を今すぐ起こす
       ↻       = 群れを落ち着かせて最初の形に戻す
     本物っぽさ: 小魚の横腹は鏡。体をひねると水面の明るさを映して光る(実際の群れの「シマー」と同じ仕組み)。
       背は暗く腹は白い(カウンターシェーディング)。マイワシの黒点、マアジの稜鱗、キビナゴの青い帯、カジキの帆と縦じま。
       イルカは尾びれが横向きで上下に振り、下から突き上げて泡を出す。カジキは襲う時に帆を立てる。
     描画: WebGL1 + ANGLE_instanced_arrays(魚は1匹ずつ立体のメッシュ)。重い端末では解像度→匹数の順に自動で下げる。
     2026/10/30 iPhone実機で「魚の違いが小さいから分からない」「自然の想像外のパターンも欲しい」→
       魚の違い: 色や模様ではなく、大きさ・体形・匹数・群れの形そのものを変える。
         マイワシ(小さく4千匹・黒点が大きい) / ギンガメアジ(体高が高い大きめの魚・千匹・竜巻を作る)
         キビナゴ(細くて透け、太く鮮やかな青い帯) / オニカマス(細長い大きな魚・6百匹・黒い山形の縞・ドーナツ状に回る)
         カメラはゆっくり寄ったり引いたりして、寄ったときは1匹ずつの形が見える。
       想像外の現象(本物の海で実際に起きること)。何もしなくても順番に起き、◎で今すぐ起こせる:
         竜巻(群れが縦の筒になって回る) / ドーナツ(真ん中が空いた輪になって回る) / 砂時計(胴がくびれる)
         分裂(ボールが2つに割れて、また1つに戻る) / フラッシュ拡散(一瞬で全方向に弾けて、また集まる)
         一斉反転(群れ全体が同時に向きを変える)
         ザトウクジラのバブルネット(下に泡の輪のカーテン→群れが締まる→クジラが真下から群れを丸呑みして突き抜ける。食べられた分はあとから戻る)
         カツオドリの急降下(水面から白い鳥が次々に泡の筋を引いて突っ込んでくる) -->

#hint.off{opacity:0}

#toast.on{opacity:1}

<body>
<canvas id="c"></canvas>
<div id="hint">群れをタップすると、捕食者がそこへ飛び込む<br>なぞるとトンネル、長押しで群れが締まる</div>
<div id="toast"></div>
<script>
(function(){
'use strict';

var cv=document.getElementById('c');
var hint=document.getElementById('hint');
var gl=cv.getContext('webgl',{antialias:true,preserveDrawingBuffer:true,alpha:false,depth:true})||
       cv.getContext('experimental-webgl',{antialias:true,preserveDrawingBuffer:true,alpha:false,depth:true});
if(!gl){ hint.textContent='この端末ではWebGLが使えないみたい'; return; }
var IA=gl.getExtension('ANGLE_instanced_arrays');
if(!IA){ hint.textContent='この端末ではこの作品を描けないみたい'; return; }

/* ================= シェーダー ================= */
var WATER=[
'uniform vec3 uDeep,uMid,uTop,uSurf,uSun,uSunCol,uSun2;',
'uniform float uTime,uTwin;',
'vec3 water(vec3 d){',
'  float y=d.y;',
'  vec3 c=mix(uDeep,uMid,smoothstep(-0.75,0.05,y));',
'  c=mix(c,uTop,smoothstep(-0.05,0.6,y));',
'  c=mix(c,uSurf,smoothstep(0.6,1.0,y)*0.75);',
'  c+=uSunCol*pow(max(dot(d,uSun),0.0),16.0)*0.30;',
'  c+=uSurf*pow(max(dot(d,uSun2),0.0),60.0)*0.45*uTwin;',
'  return c;',
'}'
].join('\n');

var BG_VS='attribute vec2 aQ;void main(){gl_Position=vec4(aQ,0.0,1.0);}';
var BG_FS=[
'precision highp float;',
WATER,
'uniform vec2 uRes;',
'uniform vec3 uCamF,uCamR,uCamU,uCamP;',
'uniform float uTanV,uAsp;',
'float hs(float x){return fract(sin(x*127.1)*43758.5453);}',
'float n1(float x){float i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);return mix(hs(i),hs(i+1.0),f);}',
'void main(){',
'  vec2 q=gl_FragCoord.xy/uRes*2.0-1.0;',
'  vec3 d=normalize(uCamF+q.x*uCamR*uTanV*uAsp+q.y*uCamU*uTanV);',
'  vec3 c=water(d);',
   // 水面: 見上げた先だけ、細かく淡いきらめき
'  if(d.y>0.0){',
'    float t=(3.4-uCamP.y)/max(d.y,0.02);',
'    vec2 s=(uCamP.xz+d.xz*t)*4.2;',
'    float w=sin(s.x*1.3+uTime*0.9)+sin(s.y*1.7-uTime*0.75)+sin((s.x+s.y)*0.9+uTime*1.2)+0.7*sin((s.x-s.y)*2.3-uTime*1.0);',
'    float l=pow(1.0-abs(sin(w*1.2)),6.0);',
'    float fade=smoothstep(0.2,0.75,d.y)*exp(-t*0.07);',
'    c+=uSurf*(l*0.10*fade+smoothstep(0.25,1.0,d.y)*0.14);',
'  }',
   // 光の筋
'  vec2 p=vec2(q.x*uAsp,q.y);',
'  vec2 v=p-vec2(0.35*uAsp+0.1,1.9);',
'  float a=atan(v.x,-v.y);',
'  float r=n1(a*16.0+uTime*0.13)*0.6+n1(a*43.0-uTime*0.21)*0.4;',
'  r=smoothstep(0.42,0.95,r);',
'  float fall=smoothstep(4.2,0.3,length(v));',
'  c+=uSurf*r*fall*0.15*smoothstep(-0.9,0.3,d.y);',
'  c*=1.0-0.26*dot(q*vec2(0.7,0.55),q*vec2(0.7,0.55));',
'  gl_FragColor=vec4(c,1.0);',
'}'
].join('\n');

var FISH_VS=[
'attribute vec3 aP,aN;',
'attribute float aM;',     // 0=体 1=ひれ 2=黄色いひれ 3=帆
'attribute vec3 iPos,iFwd;',
'attribute vec4 iM;',      // x=ひねり(roll) y=尾の位相 z=大きさ w=明るさ(群れの影)
'attribute float iF;',     // 小魚: 閃きの強さ / カジキ: 帆の立ち具合
'uniform mat4 uVP;',
'uniform float uWig,uWigK,uTailX,uVert,uFlap;',
'varying vec3 vN,vW;',
'varying float vLy,vX,vSh,vFl,vMat,vNy,vNz;',
'void main(){',
'  vec3 p=aP,n=aN;',
'  if(aM>2.5) p.y=0.06+(p.y-0.06)*(0.22+0.78*iF);',
'  float tl=clamp((uTailX-p.x)/(uTailX+0.52),0.0,1.0);tl*=tl;',
'  float ph=iM.y-p.x*uWigK;',
'  float off=sin(ph)*uWig*tl;',
'  float dd=cos(ph)*(-uWigK)*uWig*tl;',
'  if(uFlap>0.0){float wz=abs(aP.z);p.y+=sin(iM.y-wz*4.0)*uFlap*wz*wz*2.2;}',
'  if(uVert>0.5){p.y+=off;n=normalize(vec3(n.x-dd*n.y,n.y,n.z));}',
'  else{p.z+=off;n=normalize(vec3(n.x-dd*n.z,n.y,n.z));}',
'  vec3 f=normalize(iFwd);',
'  vec3 s=cross(f,vec3(0.0,1.0,0.0));',
'  float sl=length(s);',
'  s=sl>0.001?s/sl:vec3(1.0,0.0,0.0);',
'  vec3 u=cross(s,f);',
'  float cr=cos(iM.x),sr=sin(iM.x);',
'  vec3 s2=s*cr+u*sr,u2=u*cr-s*sr;',
'  vec3 w=iPos+(f*p.x+u2*p.y+s2*p.z)*iM.z;',
'  vW=w;vN=f*n.x+u2*n.y+s2*n.z;vNy=n.y;vNz=n.z;',
'  vLy=aP.y;vX=aP.x;vSh=iM.w;vFl=iF;vMat=aM;',
'  gl_Position=uVP*vec4(w,1.0);',
'}'
].join('\n');

var FISH_FS=[
'precision highp float;',
WATER,
'uniform vec3 uCam,uBack,uFlank,uBelly,uFin,uFin2,uSail,uEye;',
'uniform float uMirror,uSpots,uStripe,uLat,uBars,uHs,uFlashK,uChev,uPleat,uClear,uNeon,uRim,uHeart;',
'uniform vec3 uEmit,uFlashCol;',
'vec3 hue(float h){return clamp(abs(fract(h+vec3(0.0,0.6667,0.3333))*6.0-3.0)-1.0,0.0,1.0);}',
'uniform float uFogNear,uFogK;',
'varying vec3 vN,vW;',
'varying float vLy,vX,vSh,vFl,vMat,vNy,vNz;',
'float hs2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'float caus(vec2 p){float c=sin(p.x*2.3+uTime*1.1)*sin(p.y*1.9-uTime*0.8)+0.6*sin((p.x+p.y)*1.4+uTime*0.6);return max(c,0.0);}',
'void main(){',
'  vec3 N=normalize(vN);',
'  vec3 V=normalize(uCam-vW);',
'  float nv=dot(N,V);',
'  if(nv<0.0){N=-N;nv=-nv;}',
'  vec3 R=reflect(-V,N);',
'  float lit=0.32+0.68*max(N.y,0.0);',
'  float cs=caus(vW.xz*2.4);',
'  float spec=pow(max(dot(R,uSun),0.0),30.0);',
'  vec3 col;',
'  if(vMat<0.5){',
     // 体: 背は暗く(上からの光の揺らぎが乗る)、腹は白い。横腹は鏡
'    float top=smoothstep(0.2,0.85,vNy), bot=smoothstep(-0.25,-0.85,vNy);',
'    vec3 base=mix(mix(uFlank,uBack,top),uBelly,bot);',
'    vec3 matte=base*lit*(1.0+0.55*cs*top)+uSunCol*spec*0.35;',
'    vec3 env=water(R)*1.1+uSurf*smoothstep(-0.15,0.9,R.y)*0.85;',
'    float fr=0.7+0.3*pow(1.0-nv,2.0);',
'    vec3 silver=env*fr*1.22*mix(vec3(1.0),uFlank*1.5,0.25)+uSunCol*pow(max(dot(R,uSun),0.0),26.0)*1.5;',
'    col=mix(matte,silver,uMirror*(1.0-top*0.85)*(1.0-bot*0.45));',
'    float ly=vLy/uHs;',
     // マイワシの黒点の列
'    if(uSpots>0.5){float sp=smoothstep(0.42,0.16,length(vec2(fract(vX*18.0)-0.5,(ly-0.016)*26.0)))*step(-0.16,vX)*step(vX,0.32);col*=1.0-sp*0.8;}',
     // キビナゴの青い帯
'    if(uStripe>0.5){float b=smoothstep(0.034,0.016,abs(ly-0.004))*step(-0.32,vX)*step(vX,0.38);float e=smoothstep(0.05,0.034,abs(ly-0.004))-b;col=mix(col,vec3(0.15,0.55,1.0)*(0.9+0.8*lit)+uSunCol*spec*0.6,b*0.95);col=mix(col,vec3(0.9,0.97,1.0)*(0.7+0.5*lit),max(e,0.0)*0.6);}',
     // マアジの稜鱗(側線)
'    if(uLat>0.5){float yl=0.006+0.024*smoothstep(-0.12,0.24,vX);float b=smoothstep(0.007,0.002,abs(ly-yl))*step(-0.32,vX)*step(vX,0.33);col*=1.0-b*0.4;col*=vec3(1.04,1.0,0.86);}',
     // カジキの縦じま
'    if(uBars>0.5){float b=smoothstep(0.6,0.95,sin(vX*64.0+sin(vLy*45.0)*0.9))*(1.0-top)*(1.0-bot)*step(-0.3,vX)*step(vX,0.2)*(0.5+0.5*hs2(vec2(floor(vX*64.0/6.28),1.0)));col=mix(col,vec3(0.45,0.7,1.0)*(0.6+0.6*lit),b*0.35);}',
'    if(uChev>0.5){float c=smoothstep(0.35,0.85,sin((vX+abs(ly)*1.6)*62.0))*smoothstep(-0.6,0.1,vNy)*(1.0-bot)*step(-0.3,vX)*step(vX,0.3);col*=1.0-c*0.72;}',
'    if(uPleat>0.5){float a=atan(vNz,-vNy);float pl=smoothstep(0.55,0.95,sin(a*46.0))*bot*smoothstep(-0.08,0.05,vX);col*=1.0-pl*0.45;}',
'    if(uNeon>0.5){vec3 nc=hue(fract(vW.y*0.22+vW.x*0.08+uTime*0.05));float ln=smoothstep(0.014,0.003,abs(ly+0.002))*step(-0.36,vX)*step(vX,0.36);col=col*(1.0-ln*0.5)+nc*ln*1.7;}',
'    if(uHeart>0.5){float hd=length(vec2((vX-0.1)*0.7,ly+0.006));col+=vec3(1.0,0.35,0.55)*smoothstep(0.03,0.0,hd)*(1.3+0.7*sin(uTime*5.0+vW.x*4.0+vW.z*3.0));float sp=smoothstep(0.006,0.0,abs(ly-0.004))*step(-0.3,vX)*step(vX,0.3);col+=vec3(0.6,0.9,1.0)*sp*0.35;}',
'    float eye=smoothstep(uEye.z,uEye.z*0.55,length(vec2(vX-uEye.x,ly-uEye.y)));',
'    col=mix(col,vec3(0.02,0.03,0.04),eye*0.92);',
'  } else {',
     // ひれ: 付け根が明るく先へ行くほど暗く、少し透けて水の色が混ざる
'    float root=smoothstep(0.24,0.03,max(abs(vLy)-0.06,0.0)+max(-0.36-vX,0.0)*1.2);',
'    if(vMat<1.5){ col=uFin*lit*(1.0+0.3*cs); }',
'    else if(vMat<2.5){ col=uFin2*(0.35+0.6*lit); if(uPleat>0.5){ col*=0.72+0.34*smoothstep(-0.3,0.7,sin(vX*95.0+vLy*30.0)); col*=mix(1.0,0.6,smoothstep(0.02,-0.15,vX)); } }',
'    else {',
'      vec2 g=vec2(vX*26.0,vLy*20.0), id=floor(g);',
'      vec2 fc=fract(g)-0.5+(vec2(hs2(id),hs2(id+7.0))-0.5)*0.45;',
'      float dots=smoothstep(0.28,0.08,length(fc))*step(0.35,hs2(id+3.0));',
'      col=mix(uSail,vec3(0.22,0.45,0.9),dots*0.35)*(0.45+0.65*lit);',
'    }',
'    col=col*(0.7+0.4*root)+uSunCol*spec*0.25;',
'    col=mix(col,water(-V),0.28-0.12*root);',
'  }',
'  col*=mix(0.5,1.15,smoothstep(-1.4,1.4,vW.y));',
'  col=mix(col,water(-V)*1.15,uClear*(1.0-smoothstep(0.0,0.6,abs(vNy)))*step(vMat,0.5));',
'  col*=vSh;',
'  col+=uFlashCol*vFl*0.6*uFlashK;',
'  float dist=length(uCam-vW);',
'  float fog=1.0-exp(-max(dist-uFogNear,0.0)*uFogK);',
'  col=mix(col,water(-V),clamp(fog,0.0,0.9));',
'  float rim=pow(1.0-nv,2.5);',
'  col+=uEmit*(0.35+0.65*rim)*(1.0-0.5*clamp(fog,0.0,0.9));',
'  if(uRim>0.5) col+=hue(fract(vW.y*0.22+vW.x*0.08+uTime*0.05))*rim*0.55*(1.0-0.6*clamp(fog,0.0,0.9));',
'  gl_FragColor=vec4(col,1.0);',
'}'
].join('\n');

var PT_VS=[
'attribute vec3 aPos;',
'attribute vec2 aS;',
'uniform mat4 uVP;',
'uniform float uPx;',
'varying float vA;',
'void main(){',
'  gl_Position=uVP*vec4(aPos,1.0);',
'  gl_PointSize=max(1.0,aS.x*uPx/gl_Position.w);',
'  vA=aS.y;',
'}'
].join('\n');
var PT_FS=[
'precision mediump float;',
'uniform float uRing;',
'uniform vec3 uCol;',
'varying float vA;',
'void main(){',
'  vec2 c=gl_PointCoord*2.0-1.0;',
'  float r=length(c);',
'  if(r>1.0) discard;',
'  float a;',
'  if(uRing>0.5){',
'    a=smoothstep(1.0,0.84,r)*(0.25+0.75*smoothstep(0.5,0.92,r));',
'    a+=smoothstep(0.42,0.0,length(c-vec2(-0.36,0.36)))*0.7;',
'  } else {',
'    a=(1.0-r)*(1.0-r);',
'  }',
'  gl_FragColor=vec4(uCol*a*vA,1.0);',
'}'
].join('\n');

function sh(type,src){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  var o={p:p,u:{},a:{}}, i, n;
  n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(i=0;i<n;i++){ var u=gl.getActiveUniform(p,i); o.u[u.name]=gl.getUniformLocation(p,u.name); }
  n=gl.getProgramParameter(p,gl.ACTIVE_ATTRIBUTES);
  for(i=0;i<n;i++){ var a=gl.getActiveAttrib(p,i); o.a[a.name]=gl.getAttribLocation(p,a.name); }
  return o;
}
var BG,FISH,PT;
try{ BG=prog(BG_VS,BG_FS); FISH=prog(FISH_VS,FISH_FS); PT=prog(PT_VS,PT_FS); }
catch(e){ hint.textContent='描画の準備に失敗しました'; if(window.console) console.error(e); return; }

/* ================= 魚の形 ================= */
// 体長1、x=前(+0.5が口先)、y=上、z=横。体は楕円の断面を輪切りでつなぎ、ひれは薄い板
function buildMesh(sp){
  var out=[], M=sp.M, hs=sp.hs||1, k, j;
  var X=sp.X, Hh=sp.H.map(function(h){ return h*hs; });
  if(sp.res){ // 大きな体は輪切りを細かくして角ばりを消す(Catmull-Rom)
    var X2=[], H2=[], L=X.length;
    function cr(a,i,u){ var p0=a[Math.max(0,i-1)],p1=a[i],p2=a[Math.min(L-1,i+1)],p3=a[Math.min(L-1,i+2)];
      return 0.5*((2*p1)+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u); }
    for(k=0;k<L-1;k++) for(j=0;j<sp.res;j++){ var uu=j/sp.res; X2.push(cr(X,k,uu)); H2.push(Math.max(0.004,cr(Hh,k,uu))); }
    X2.push(X[L-1]); H2.push(Hh[L-1]); X=X2; Hh=H2;
  }
  function push(p,n,m){ var l=Math.hypot(n[0],n[1],n[2])||1; out.push(p[0],p[1],p[2],n[0]/l,n[1]/l,n[2]/l,m); }
  var rings=[];
  for(k=0;k<X.length;k++){
    var h=Hh[k], w=h*sp.wr, cy=-h*0.05;
    var a=Math.max(0,k-1), b=Math.min(X.length-1,k+1);
    var slope=(Hh[a]-Hh[b])/((X[a]-X[b])||1);
    var ring=[];
    for(j=0;j<M;j++){
      var th=j/M*6.28318, ey=Math.cos(th)/h, ez=Math.sin(th)/w, el=Math.hypot(ey,ez);
      ring.push({p:[X[k],cy+h*Math.cos(th),w*Math.sin(th)], n:[-slope,ey/el,ez/el]});
    }
    rings.push(ring);
  }
  var nose=[sp.nose,-Hh[0]*0.05,0];
  for(j=0;j<M;j++){ push(nose,[1,0,0],0); push(rings[0][j].p,rings[0][j].n,0); push(rings[0][(j+1)%M].p,rings[0][(j+1)%M].n,0); }
  for(k=0;k<rings.length-1;k++){
    for(j=0;j<M;j++){
      var A=rings[k][j], B=rings[k][(j+1)%M], Cc=rings[k+1][(j+1)%M], D=rings[k+1][j];
      push(A.p,A.n,0); push(B.p,B.n,0); push(Cc.p,Cc.n,0); push(A.p,A.n,0); push(Cc.p,Cc.n,0); push(D.p,D.n,0);
    }
  }
  var L=rings[rings.length-1], end=[X[X.length-1]-0.005,-Hh[Hh.length-1]*0.05,0];
  for(j=0;j<M;j++){ push(end,[-1,0,0],0); push(L[(j+1)%M].p,[-1,0,0],0); push(L[j].p,[-1,0,0],0); }
  (sp.fins||[]).forEach(function(f){
    var m=f[0], t=f.slice(1);
    for(var i=0;i<t.length;i+=3){
      var p0=t[i],p1=t[i+1],p2=t[i+2];
      var e1=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], e2=[p2[0]-p0[0],p2[1]-p0[1],p2[2]-p0[2]];
      var n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
      push(p0,n,m); push(p1,n,m); push(p2,n,m);
    }
  });
  // 左右対称のひれ(z>0で書いたものを鏡写しに)
  (sp.pairs||[]).forEach(function(f){
    var m=f[0], t=f.slice(1);
    [1,-1].forEach(function(sg){
      for(var i=0;i<t.length;i+=3){
        var p0=[t[i][0],t[i][1],t[i][2]*sg],p1=[t[i+1][0],t[i+1][1],t[i+1][2]*sg],p2=[t[i+2][0],t[i+2][1],t[i+2][2]*sg];
        var e1=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], e2=[p2[0]-p0[0],p2[1]-p0[1],p2[2]-p0[2]];
        var n=[e1[1]*e2[2]-e1[2]*e2[1],e1[2]*e2[0]-e1[0]*e2[2],e1[0]*e2[1]-e1[1]*e2[0]];
        push(p0,n,m); push(p1,n,m); push(p2,n,m);
      }
    });
  });
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(out),gl.STATIC_DRAW);
  return {buf:buf,n:out.length/7};
}
function forkTail(x,h,tx,ty,nx){ // 二股の尾(縦の板)
  var bt=[x,h,0], bb=[x,-h,0], tu=[tx,ty,0], nt=[nx,0,0], tl=[tx,-ty,0];
  return [1,bt,tu,nt, bt,nt,bb, bb,nt,tl];
}

  if(wG>0.001){ frameAt(t,AXA); frameAt(t+0.05,AXB); }
  syncW+=(syncT-syncW)*Math.min(1,dt*1.2);
  var bTop=craft?craft.p[1]:0, beamOn=craft&&beamI>0.05;
  splitA+=dt*0.12;
  var sox=Math.cos(splitA)*0.32*wS, soz=Math.sin(splitA)*0.32*wS, soy=0.8*wS;   // 縦に割れる(縦長の画面に2つとも入る)
  relax+=(1-relax)*Math.min(1,dt*0.45);

  var Rb=radius(), Rbs=Rb*(1-0.28*wS), vt0=0.5*(1+0.9*fear), wob=0.28+0.32*fear;
  var Ytop=Rb*((0.95*wB+1.5*wT+0.3*wR+1.25*wH)*(1-wG)+1.2*wG);
  var ro=pred.ray?pred.ray.o:null, rd=pred.ray?pred.ray.d:null;
  var kk=Math.min(1,dt*2.6)*relax, turnK=Math.min(1,dt*6), size=prey.size, capV=3+1.6*(1-relax), cap2=capV*capV;
  var tailF=prey.tailF||1, pitchMax=(prey.pitch||0.6)*(1+0.8*(1-relax));
  for(var i=0;i<N;i++){
    var i3=i*3, o=i*STRIDE;
    if(EATEN[i]){ instData[o+8]=0; continue; }
    var px=P[i3],py=P[i3+1],pz=P[i3+2];
    var hn=HN[i]+0.16*Math.sin(t*0.11*WF[i]+PH[i]); if(hn>0.96)hn=0.96; else if(hn<-0.96)hn=-0.96;
    var sg=(i&1)?1:-1;
    var rx=px-C[0]-sg*sox, ry=py-C[1]-sg*soy, rz=pz-C[2]-sg*soz;
    var rxz2=rx*rx+rz*rz, rc=Math.sqrt(rxz2)+1e-4, ux=rx/rc, uz=rz/rc;
    var ct=Math.sqrt(1-hn*hn), q=Q[i], ah=hn<0?-hn:hn, ph=PH[i]+0.3*Math.sin(t*0.2*WF[i]);
    var rcT=wB*q*Rbs*ct + wT*Rb*(0.2+0.36*q) + wR*Rb*(0.92+0.32*q*Math.cos(ph)) + wH*q*Rb*ct*(0.28+0.8*Math.min(1,ah*1.5));
    var yT =wB*q*Rbs*hn*0.95 + wT*Rb*hn*1.5 + wR*Rb*0.3*q*Math.sin(ph) + wH*q*Rb*hn*1.3;
    var vt=vt0*SPD[i]*(0.45+0.55*(ct+(1-ct)*ctMix));
    var vdx=-uz*spin*vt+ux*(rcT-rc)*1.7;
    var vdz= ux*spin*vt+uz*(rcT-rc)*1.7;
    var vdy=(yT-ry)*1.5+0.16*Math.sin(t*0.9*WF[i]+PH[i]);
    if(wG>0.001){
      gTarget(i,t,AXA,hn,q,wHx,wGy,wCb,wPt,Rb); var g0x=GT[0]/wG, g0y=GT[1]/wG, g0z=GT[2]/wG;
      gTarget(i,t+0.05,AXB,hn,q,wHx,wGy,wCb,wPt,Rb);
      var evx=(GT[0]/wG-g0x)*20+(C[0]+g0x-px)*2.4, evy=(GT[1]/wG-g0y)*20+(C[1]+g0y-py)*2.4, evz=(GT[2]/wG-g0z)*20+(C[2]+g0z-pz)*2.4;
      var ws=1-wG; vdx=vdx*ws+evx*wG; vdy=vdy*ws+evy*wG; vdz=vdz*ws+evz*wG;
    }
    var vx=Vl[i3],vy=Vl[i3+1],vz=Vl[i3+2];
    vx+=(vdx-vx)*kk; vy+=(vdy-vy)*kk; vz+=(vdz-vz)*kk;
    var flee=0, d, s, acc, beamG=0;
    // ソラクラゲの光の柱: 中に入った魚は吸い上げられ、クラゲに届くと消える(あとで戻ってくる)
    if(beamOn && py<bTop){
      var bx=px-craft.p[0], bz=pz-craft.p[2], rcn=0.32+(bTop-py)*0.17;
      if(bx*bx+bz*bz<rcn*rcn){
        vy+=beamI*7*dt; vx-=bx*2.5*dt*beamI; vz-=bz*2.5*dt*beamI; beamG=beamI;
        if(py>bTop-0.35){ EATEN[i]=1; eatenN++; instData[o+8]=0; continue; }
      }
    }
    // 指から逃げる(指の視線にそってトンネル)
    if(pr>0.01 && ro){
      var wx=px-ro[0], wy=py-ro[1], wz=pz-ro[2], tp=wx*rd[0]+wy*rd[1]+wz*rd[2];
      var dx=wx-rd[0]*tp, dy=wy-rd[1]*tp, dz=wz-rd[2]*tp; d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-4;
      if(d<pr){ s=1-d/pr; flee=s; s*=s; acc=s*26*dt/d; vx+=dx*acc; vy+=dy*acc; vz+=dz*acc; }
    }
    // 捕食者・鳥・クジラから逃げる
    for(k=0;k<nth;k++){
      var k5=k*5, ex=px-TH[k5], ey=py-TH[k5+1], ez=pz-TH[k5+2], e2=ex*ex+ey*ey+ez*ez, rr2=TH[k5+3];
      if(e2<rr2*rr2){ d=Math.sqrt(e2)+1e-4; s=1-d/rr2; if(s>flee) flee=s; s*=s; acc=s*TH[k5+4]*dt/d; vx+=ex*acc; vy+=ey*acc; vz+=ez*acc; }
    }
    // クジラの口に入った魚は丸呑み(隠して、あとで遠くから戻ってくる)
    if(whale){
      var qx=px-whale.p[0], qy=py-whale.p[1], qz=pz-whale.p[2], ax=qx*wf[0]+qy*wf[1]+qz*wf[2];
      if(ax>wHi-0.85 && ax<wHi+0.1){
        var lx=qx-wf[0]*ax, ly=qy-wf[1]*ax, lz=qz-wf[2]*ax;
        if(lx*lx+ly*ly+lz*lz<0.2){ EATEN[i]=1; eatenN++; instData[o+8]=0; continue; }
      }
    }
    var sp2=vx*vx+vy*vy+vz*vz, cap2b=beamG>0?Math.max(cap2,16):cap2;
    if(sp2>cap2b){ var sl=Math.sqrt(cap2b/sp2); vx*=sl; vy*=sl; vz*=sl; sp2=cap2b; }
    px+=vx*dt; py+=vy*dt; pz+=vz*dt;
    P[i3]=px; P[i3+1]=py; P[i3+2]=pz; Vl[i3]=vx; Vl[i3+1]=vy; Vl[i3+2]=vz;
    var spd=Math.sqrt(sp2)+1e-4, fx=Fw[i3],fy=Fw[i3+1],fz=Fw[i3+2];
    var nx=fx+(vx/spd-fx)*turnK, ny=fy+(vy/spd-fy)*turnK, nz=fz+(vz/spd-fz)*turnK;
    if(ny>pitchMax) ny=pitchMax; else if(ny<-pitchMax) ny=-pitchMax;   // 魚は真上・真下を向いて泳がない
    var nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1; nx/=nl; ny/=nl; nz/=nl;
    var bank=(fz*nx-fx*nz)/Math.max(dt,0.001)*0.12;
    Fw[i3]=nx; Fw[i3+1]=ny; Fw[i3+2]=nz;
    var g=0;
    for(var kw=0;kw<waves.length;kw++){
      var wv=waves[kw], gx=px-wv.x, gy=py-wv.y, gz=pz-wv.z, de=Math.sqrt(gx*gx+gy*gy+gz*gz);
      var fr=wv.t*WAVE_V, u=(de-fr)/WAVE_W;

    if(syncW>0.01){ var pu=Math.sin(Math.atan2(rz,rx)*3+ry*3.5-t*4.5+rc*5); if(pu>0){ pu*=pu; pu*=pu; pu*=pu; g+=syncW*pu*1.3; } }
    g+=warpGlow*0.9+beamG*0.8;

    var roll=wob*Math.sin(t*WF[i]*1.3+WP[i])+(bank>0.5?0.5:bank<-0.5?-0.5:bank)+g*1.7*(WP[i]>3.1416?1:-1)+flee*1.3;
    ROLL[i]+=(roll-ROLL[i])*Math.min(1,dt*9);

    TAIL[i]+=dt*(8+spd*9)*tailF;
    if(ES[i]<1) ES[i]=Math.min(1,ES[i]+dt*0.8);

    var occ=Math.exp(-0.75*Math.max(0,Ytop-(py-C[1]))/Rb);

    instData[o+3]=nx; instData[o+4]=ny; instData[o+5]=nz;
    instData[o+6]=ROLL[i]; instData[o+7]=TAIL[i]%6.2832; instData[o+8]=SC[i]*size*ES[i];
    instData[o+9]=(0.3+0.7*occ)*(0.86+0.28*SHD[i]); instData[o+10]=FL[i];
  }

  for(var b=bubbles.length-1;b>=0;b--){
    var bb=bubbles[b]; bb.age+=dt; bb.vy=Math.min(1.4,bb.vy+dt*0.6);
    bb.y+=bb.vy*dt; bb.x+=Math.sin(bb.age*7+bb.ph)*0.12*dt; bb.z+=Math.cos(bb.age*6+bb.ph)*0.12*dt;

}

function setAttr(loc,buf,size,stride,off,div){
  if(loc===undefined||loc<0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,off);
  IA.vertexAttribDivisorANGLE(loc,div);
}
function clearAttrs(o){ for(var k in o.a){ IA.vertexAttribDivisorANGLE(o.a[k],0); gl.disableVertexAttribArray(o.a[k]); } }
function setWater(o,t){
  var u=o.u;
  gl.uniform3fv(u.uDeep,sea.deep); gl.uniform3fv(u.uMid,sea.mid); gl.uniform3fv(u.uTop,sea.top);
  gl.uniform3fv(u.uSurf,sea.surf); gl.uniform3fv(u.uSunCol,sea.sun); gl.uniform3fv(u.uSun,SUN);
  gl.uniform3fv(u.uSun2,SUN2); gl.uniform1f(u.uTwin,sea.twin||0);
  gl.uniform1f(u.uTime,t);
}
function drawFish(mesh,buf,count,sp,isPred){
  var u=FISH.u;
  gl.uniform3fv(u.uBack,sp.back); gl.uniform3fv(u.uFlank,sp.flank); gl.uniform3fv(u.uBelly,sp.belly);
  gl.uniform3fv(u.uFin,sp.fin); gl.uniform3fv(u.uFin2,sp.fin2||sp.fin); gl.uniform3fv(u.uSail,[0.06,0.12,0.35]);
  gl.uniform3fv(u.uEye,sp.eye);
  gl.uniform1f(u.uMirror,sp.mirror); gl.uniform1f(u.uSpots,sp.spots||0); gl.uniform1f(u.uStripe,sp.stripe||0);
  gl.uniform1f(u.uLat,sp.lat||0); gl.uniform1f(u.uBars,sp.bars||0); gl.uniform1f(u.uHs,sp.hs||1);
  gl.uniform1f(u.uChev,sp.chev||0); gl.uniform1f(u.uPleat,sp.pleat||0); gl.uniform1f(u.uClear,sp.clear||0);
  gl.uniform1f(u.uNeon,sp.neon||0); gl.uniform1f(u.uRim,sp.rim||0); gl.uniform1f(u.uHeart,sp.heart||0); gl.uniform1f(u.uFlap,sp.flap||0);
  gl.uniform3fv(u.uEmit,sp.emit||[0,0,0]); gl.uniform3fv(u.uFlashCol,sp.flashCol||[0.85,0.95,1.0]);

  gl.uniform1f(u.uWig,sp.wig); gl.uniform1f(u.uWigK,sp.wigK);
  gl.uniform1f(u.uTailX,sp.tailX); gl.uniform1f(u.uVert,sp.vert||0);

  setAttr(FISH.a.aN,mesh.buf,3,28,12,0);
  setAttr(FISH.a.aM,mesh.buf,1,28,24,0);
  setAttr(FISH.a.iPos,buf,3,STRIDE*4,0,1);
  setAttr(FISH.a.iFwd,buf,3,STRIDE*4,12,1);
  setAttr(FISH.a.iM,buf,4,STRIDE*4,24,1);
  setAttr(FISH.a.iF,buf,1,STRIDE*4,40,1);
  IA.drawArraysInstancedANGLE(gl.TRIANGLES,0,mesh.n,count);
}

function draw(t){
  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.DEPTH_BUFFER_BIT|gl.COLOR_BUFFER_BIT);

  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  gl.useProgram(BG.p); setWater(BG,t);
  gl.uniform2f(BG.u.uRes,cv.width,cv.height);
  gl.uniform3fv(BG.u.uCamF,cam.F); gl.uniform3fv(BG.u.uCamR,cam.R); gl.uniform3fv(BG.u.uCamU,cam.U); gl.uniform3fv(BG.u.uCamP,cam.e);
  gl.uniform1f(BG.u.uTanV,TANV); gl.uniform1f(BG.u.uAsp,asp);
  setAttr(BG.a.aQ,quadBuf,2,0,0,0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  clearAttrs(BG);

  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
  gl.useProgram(FISH.p); setWater(FISH,t);
  gl.uniformMatrix4fv(FISH.u.uVP,false,VP);
  gl.uniform3fv(FISH.u.uCam,cam.e);
  gl.uniform1f(FISH.u.uFogNear,Math.max(0,camDist-1.3)); gl.uniform1f(FISH.u.uFogK,0.38);
  gl.bindBuffer(gl.ARRAY_BUFFER,instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,instData.subarray(0,N*STRIDE));
  drawFish(prey.mesh,instBuf,N,prey,false);
  gl.bindBuffer(gl.ARRAY_BUFFER,predBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,predData.subarray(0,preds.length*STRIDE));
  drawFish(PRED[predK].mesh,predBuf,preds.length,PRED[predK],true);
  if(birds.length){
    gl.bindBuffer(gl.ARRAY_BUFFER,birdBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,birdData.subarray(0,birds.length*STRIDE));
    drawFish(BIRD.mesh,birdBuf,birds.length,BIRD,true);
  }
  if(craft){
    gl.bindBuffer(gl.ARRAY_BUFFER,jellyBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,jellyData);
    drawFish(JELLY.mesh,jellyBuf,1,JELLY,true);
  }
  if(whale){
    gl.bindBuffer(gl.ARRAY_BUFFER,whaleBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER,0,whaleData);
    drawFish(WHALE.mesh,whaleBuf,1,WHALE,true);
  }
  clearAttrs(FISH);

  var n=0, i;
  for(i=0;i<SNOW_N;i++){
    var sx=snow[i*4], sy=((snow[i*4+1]-t*0.02*snow[i*4+3]+4)%8+8)%8-4, sz=snow[i*4+2];
    sx+=Math.sin(t*0.2+i)*0.08;
    var dd=Math.hypot(sx-cam.e[0],sy-cam.e[1],sz-cam.e[2]);
    ptData[n*5]=sx; ptData[n*5+1]=sy; ptData[n*5+2]=sz; ptData[n*5+3]=0.018*snow[i*4+3];
    ptData[n*5+4]=0.55*Math.exp(-Math.max(0,dd-camDist+1)*0.25); n++;
  }
  var snowN=n;
  for(i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    ptData[n*5]=b.x; ptData[n*5+1]=b.y; ptData[n*5+2]=b.z; ptData[n*5+3]=b.r*2; ptData[n*5+4]=0.9*Math.min(1,b.age*6); n++;
  }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
  gl.useProgram(PT.p);
  gl.uniformMatrix4fv(PT.u.uVP,false,VP);
  gl.uniform1f(PT.u.uPx,cv.height/(2*TANV));
  gl.bindBuffer(gl.ARRAY_BUFFER,ptBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,ptData.subarray(0,n*5));
  setAttr(PT.a.aPos,ptBuf,3,20,0,0);
  setAttr(PT.a.aS,ptBuf,2,20,12,0);
  gl.uniform1f(PT.u.uRing,0); gl.uniform3fv(PT.u.uCol,[sea.surf[0]*0.55,sea.surf[1]*0.6,sea.surf[2]*0.6]);
  gl.drawArrays(gl.POINTS,0,snowN);
  if(n>snowN){ gl.uniform1f(PT.u.uRing,1); gl.uniform3fv(PT.u.uCol,[0.85,0.95,1.0]); gl.drawArrays(gl.POINTS,snowN,n-snowN); }
  if(craft && beamI>0.01){
    var b0=n, bTop=craft.p[1]-0.1, bBot=C[1]-1.7;
    for(i=0;i<BEAM_N;i++){
      var fr=(beamP[i*4]+t*beamP[i*4+3])%1, yb=bBot+(bTop-bBot)*fr, rcn=(0.32+(bTop-yb)*0.17)*beamP[i*4+2], ab=beamP[i*4+1]+t*0.6;
      ptData[n*5]=craft.p[0]+Math.cos(ab)*rcn; ptData[n*5+1]=yb; ptData[n*5+2]=craft.p[2]+Math.sin(ab)*rcn;
      ptData[n*5+3]=0.05+0.05*beamP[i*4+3]; ptData[n*5+4]=beamI*0.55*Math.sin(fr*3.1416); n++;
    }
    gl.bufferSubData(gl.ARRAY_BUFFER,0,ptData.subarray(0,n*5));
    gl.uniform1f(PT.u.uRing,0); gl.uniform3fv(PT.u.uCol,[0.75,0.55,1.0]); gl.drawArrays(gl.POINTS,b0,n-b0);

}

function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  var t=(now-t0)/1000; time=t;
  updateCamera(t);
  step(dt,t,now);
  draw(t);
  perfAcc+=now-(frame.prev||now); frame.prev=now; perfN++;
  if(perfN>=90){
    var avg=perfAcc/perfN; perfAcc=0; perfN=0;
    if(avg>24){
      if(dpr>1.01){ dpr=Math.max(1,dpr-0.5); setup(); }
      else if(Nperf>1800){ Nperf-=600; N=Math.min(prey.count,Nperf); }
    }
  }
  requestAnimationFrame(frame);
}

function setSea(i,quiet){
  seaI=i; var s=SEAS[i];
  sea={deep:hx(s.deep),mid:hx(s.mid),top:hx(s.top),surf:hx(s.surf),sun:hx(s.sun),twin:s.twin||0};
  document.body.style.background=s.deep;
  prey=PREY[s.prey];
  respawnSome(NMAX); whale=null; birds=[]; craft=null; ev=null; evQ=[]; squeezeEv=1; liftT=0; fkFast=0; syncT=0; warpGlow=0;
  N=Math.min(prey.count,Nperf);
  setForm(s.form); nextEv=time+12;
  if(predK!==s.pred){ predK=s.pred; spawnPreds(); }
  if(!quiet) toast(s.name+' — '+prey.name+'と'+PRED[predK].name,3000);
}
function mutate(){
  setSea((seaI+1)%SEAS.length);
  if(Math.random()<0.5){ spin=-spin; addWave(C[0],C[1],C[2],1.2); }
}
function reset(){
  fear=0; squeeze=1; waves=[]; bubbles=[]; pred.r=0; pred.burst=0; relax=1;
  whale=null; birds=[]; craft=null; ev=null; eatenN=0; squeezeEv=1; liftT=0; lift=0; fkFast=0; syncT=0; syncW=0; warpGlow=0;
  setForm(SEAS[seaI].form); for(var j=0;j<FORMS.length;j++) FW[FORMS[j]]=FT[FORMS[j]];
  nextEv=time+12;
  seedSchool(); spawnPreds(); toast('群れが落ち着いた',1500);
}

var resizeT=0;
window.addEventListener('resize',function(){ clearTimeout(resizeT); resizeT=setTimeout(setup,150); });
setup();
updateCamera(0);
seedSchool();
setSea(0,true);
requestAnimationFrame(frame);

// 確認用(ヘッドレスのテストから状態を見る・海を切り替える)
window.__st={get fear(){return fear;}, get N(){return N;}, get dpr(){return dpr;}, sea:function(i){ setSea(i,true); for(var j=0;j<FORMS.length;j++) FW[FORMS[j]]=FT[FORMS[j]]; },
  ev:function(k){ ev=null; startEvent(k); },
  ff:function(sec){ var n=Math.round(sec*30); for(var k=0;k<n;k++){ t0-=1000/30; var tt=(performance.now()-t0)/1000; time=tt; updateCamera(tt); step(1/30,tt,performance.now()); } }, get eaten(){return eatenN;}, get birds(){return birds.length;}, get whale(){return whale?whale.p.slice():null;}, get evk(){return ev?ev.k+':'+ev.stage:null;},
  strike:function(){ if(preds[0]) attack(preds[0],[C[0],C[1],C[2]],true); }, preds:function(){ return preds.map(function(p){return p.p.slice();}); },
  pose:function(dist){ var pd=preds[0]; if(!pd) return; var e=cam.e,F=cam.F,R=cam.R; dist=dist||1.8;
    pd.p=[e[0]+F[0]*dist,e[1]+F[1]*dist,e[2]+F[2]*dist]; pd.v=[R[0]*0.01,0,R[2]*0.01]; pd.f=norm([R[0],0.0001,R[2]]); pd.state=0; pd.frozen=true; }};

if(window.APKit){
  APKit.init({
    canvas: cv,
    gifName: 'silver-turn-loop',
    clockFormat: 'spec',
    dock: true,
    autoHide: true,
    fullscreenButton: false,
    buttons: [
      {label:'✦', name:'mutate', onClick:function(){ mutate(); }},
      {label:'◎', name:'event',  onClick:function(){ nextPhenomenon(); }},
      {label:'↻', name:'reset',  onClick:function(){ reset(); }}
    ]
  });
}
