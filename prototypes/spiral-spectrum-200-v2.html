<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM 200 V3 — LIVING TIDE</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,seed=Math.random()*9999,px=.5,py=.49,tx=.5,ty=.49,force=0,ft=0,hue=0,ht=0,last=performance.now();
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function spiralPoint(q,u,t,S){const cx=W*(.5+.018*Math.sin(t*.055)),cy=H*(.49+.018*Math.cos(t*.065)),minR=S*.045,maxR=S*.455,layer=(q-.5)*S*.145,r=minR+(maxR-minR)*u+layer,turns=2.78,base=-.72+u*turns*TAU+q*.018*TAU;const tide=.045*Math.sin(TAU*t/9+u*8-q*4),wave=.032*Math.sin(TAU*t/6-q*8+u*5);const dx=tx-.5,dy=ty-.5,dist=Math.hypot(dx,dy),touch=Math.exp(-Math.pow((u-.52)/.32,2))*force;const touchAngle=(dx*Math.cos(base)+dy*Math.sin(base))*4.5*touch;const ang=base+tide+wave+touchAngle;const rr=r*(1+.035*Math.sin(TAU*t/11+q*7+u*5)+.022*Math.sin(TAU*t/5+u*13))+S*(.075*touch*(1-u)+.025*Math.sin(TAU*t/7+q*12)*u);return[cx+Math.cos(ang)*rr+dx*S*.045*touch,cy+Math.sin(ang)*rr+dy*S*.045*touch]}
function draw(phase=null){const real=performance.now()/1000,t=phase===null?real:phase,T=k=>APKit.T(k,phase,real),S=Math.min(W,H),beat=.5+.5*Math.sin(T(1)*TAU),slow=.5+.5*Math.sin(T(.47)*TAU);ctx.globalCompositeOperation='source-over';const bx=W*(.48+.035*Math.sin(T(.08)*TAU)),by=H*(.46+.03*Math.cos(T(.065)*TAU)),bg=ctx.createRadialGradient(bx,by,0,bx,by,S*(.78+.08*beat));bg.addColorStop(0,hs(43+hue*.08,35,99));bg.addColorStop(.34,hs(340+slow*35+hue*.05,28,98));bg.addColorStop(.66,hs(205+slow*45,23,96));bg.addColorStop(1,hs(32+hue*.03,27,91));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.save();ctx.translate(W*.5,H*.5);ctx.rotate(T(.035)*TAU);for(let k=0;k<18;k++){const q=k/17,rx=S*(.18+q*.075+beat*.018),ry=S*(.115+q*.11+slow*.018),off=Math.sin(T(.12)*TAU+k*1.7)*S*.018;ctx.beginPath();ctx.ellipse(off,0,rx,ry,Math.sin(k*1.37+T(.06)*TAU)*.16,0,TAU);ctx.strokeStyle=hs(300+q*260+hue*.3+slow*35,38,72,.028+.035*(1-q)*beat);ctx.lineWidth=.45+.28*(1-q);ctx.stroke()}ctx.restore();
for(let k=0;k<9;k++){const a=TAU*(k/9+T(.045)),x=W*(.5+.38*Math.cos(a)),y=H*(.5+.30*Math.sin(a)),r=S*(.14+.045*(.5+.5*Math.sin(T(.13)*TAU+k*1.9))),fog=ctx.createRadialGradient(x,y,0,x,y,r);fog.addColorStop(0,hs(270+k*39+hue*.2,52,79,.055+.035*beat));fog.addColorStop(.35,hs(165+k*28,42,85,.024));fog.addColorStop(1,hs(50,30,96,0));ctx.fillStyle=fog;ctx.fillRect(x-r*1.5,y-r*1.5,r*3,r*3)}
ctx.globalCompositeOperation='multiply';for(let k=0;k<24;k++){const y=H*(k/24)+Math.sin(k*2.9+T(.075)*TAU)*S*(.008+.012*beat);ctx.beginPath();ctx.moveTo(-30,y);ctx.bezierCurveTo(W*.22,y+S*(.012+.01*Math.sin(T(.11)*TAU+k)),W*.72,y-S*.012,W+30,y+S*.006);ctx.strokeStyle=hs(35+k*11+slow*50,24,66,.014+.012*beat);ctx.lineWidth=.5;ctx.stroke()}ctx.globalCompositeOperation='source-over';
const N=58;for(let i=0;i<N;i++){const q=i/(N-1),g=ctx.createLinearGradient(W*.08,H*.12,W*.92,H*.88),base=298+q*214+hue+slow*18;g.addColorStop(0,hs(base-42,54,68,.14));g.addColorStop(.18,hs(base,70,60,.76));g.addColorStop(.42,hs(base+78,57,72,.86));g.addColorStop(.67,hs(base+145,62,65,.82));g.addColorStop(.84,hs(base+190,58,61,.62));g.addColorStop(1,hs(base+225,52,62,.16));ctx.strokeStyle=g;ctx.lineWidth=.48+.64*(1-Math.abs(q-.5)*1.55);ctx.beginPath();for(let j=0;j<=360;j++){const u=-.015+j/360*1.03,p=spiralPoint(q,u,T(1),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,r=S*(.105+.065*beat),gl=ctx.createRadialGradient(X,Y,0,X,Y,r*5);gl.addColorStop(0,'rgba(255,252,225,.62)');gl.addColorStop(.18,'rgba(255,226,180,.19)');gl.addColorStop(.52,'rgba(210,220,255,.055)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();
function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;ht=(ht+(x/W-.5)*28+(y/H-.5)*18)%360;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));
function mutate(){seed=Math.random()*9999;ht=(ht+55+Math.random()*100)%360}function reset(){px=tx=.5;py=ty=.49;force=ft=0;hue=ht=0;seed=Math.random()*9999}
APKit.init({canvas,gifName:'spiral-spectrum-200-v3-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
