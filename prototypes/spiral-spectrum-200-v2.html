<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SPIRAL SPECTRUM 200 V2</title><script src="../ap-kit.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ed}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,seed=Math.random()*9999,px=.5,py=.49,tx=.5,ty=.49,force=0,ft=0,hue=0,ht=0,last=performance.now();const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hs=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize,{passive:true});resize();
function spiralPoint(q,u,t,S){const cx=W*(.5+.025*Math.sin(t*.09)),cy=H*(.49+.025*Math.cos(t*.075)),minR=S*.045,maxR=S*.43,layer=(q-.5)*S*.135,r=minR+(maxR-minR)*u+layer,turns=2.72,ang=-.55+u*turns*TAU+q*.018*TAU,breathing=1+.035*Math.sin(t*.17+q*9+u*5),local=Math.exp(-Math.pow((u-(tx-.18))/.18,2))*force,twist=local*(.65+.95*u),rr=r*breathing+S*.045*local*(1-u);return[cx+Math.cos(ang+twist)*rr+(py-.5)*S*.055*local,cy+Math.sin(ang+twist)*rr+(px-.5)*S*.055*local]}
function draw(phase=null){const real=performance.now()/1000,t=phase===null?real:phase,T=k=>APKit.T(k,phase,real),S=Math.min(W,H);ctx.globalCompositeOperation='source-over';const driftX=Math.sin(T(.07)*TAU)*S*.035,driftY=Math.cos(T(.055)*TAU)*S*.028,bg=ctx.createRadialGradient(W*.48+driftX,H*.46+driftY,0,W*.48+driftX,H*.46+driftY,S*.78);bg.addColorStop(0,hs(44+hue*.08,35,99));bg.addColorStop(.45,hs(35+hue*.05,31,97));bg.addColorStop(1,hs(28+hue*.03,28,92));ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W*.5+driftX,H*.5+driftY);ctx.rotate(T(.035)*TAU);for(let k=0;k<13;k++){const q=k/12,rx=S*(.19+q*.062),ry=S*(.14+q*.10),a=.018+.018*(1-q);ctx.beginPath();ctx.ellipse(0,0,rx,ry,Math.sin(k*1.7)*.11,0,TAU);ctx.strokeStyle=hs(305+q*285+hue*.25,42,72,a);ctx.lineWidth=.45+.3*(1-q);ctx.stroke()}ctx.restore();for(let k=0;k<7;k++){const a=TAU*(k/7+T(.045)),x=W*(.5+.38*Math.cos(a)),y=H*(.5+.30*Math.sin(a)),r=S*(.15+.035*Math.sin(T(.08)*TAU+k*1.9)),fog=ctx.createRadialGradient(x,y,0,x,y,r);fog.addColorStop(0,hs(275+k*43+hue*.2,50,80,.07));fog.addColorStop(.4,hs(170+k*31,43,84,.028));fog.addColorStop(1,hs(50,30,96,0));ctx.fillStyle=fog;ctx.fillRect(x-r*1.5,y-r*1.5,r*3,r*3)}ctx.globalCompositeOperation='multiply';for(let k=0;k<20;k++){const y=H*(k/20)+Math.sin(k*3.7+T(.025)*TAU)*S*.012;ctx.beginPath();ctx.moveTo(-20,y);ctx.bezierCurveTo(W*.27,y+S*.012,W*.65,y-S*.010,W+20,y+S*.006);ctx.strokeStyle=hs(40+k*9,22,65,.018);ctx.lineWidth=.55;ctx.stroke()}ctx.globalCompositeOperation='source-over';const N=34;for(let i=0;i<N;i++){const q=i/(N-1),g=ctx.createLinearGradient(W*.1,H*.15,W*.9,H*.85),base=300+q*205+hue;g.addColorStop(0,hs(base-40,56,66,.12));g.addColorStop(.18,hs(base,72,61,.72));g.addColorStop(.48,hs(base+82,55,72,.84));g.addColorStop(.78,hs(base+166,62,64,.76));g.addColorStop(1,hs(base+225,55,62,.12));ctx.strokeStyle=g;ctx.lineWidth=.62+.72*(1-Math.abs(q-.5)*1.55);ctx.beginPath();for(let j=0;j<=330;j++){const u=-.025+j/330*1.05,p=spiralPoint(q,u,T(1.0),S);j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}ctx.globalCompositeOperation='screen';const X=px*W,Y=py*H,r=S*(.11+.055*Math.sin(T(.06)*TAU)),gl=ctx.createRadialGradient(X,Y,0,X,Y,r*4.5);gl.addColorStop(0,'rgba(255,250,220,.56)');gl.addColorStop(.2,'rgba(255,230,180,.16)');gl.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;px+=(tx-px)*(1-Math.pow(.0007,dt));py+=(ty-py)*(1-Math.pow(.0007,dt));force+=(ft-force)*(1-Math.pow(.00008,dt));hue+=(ht-hue)*(1-Math.pow(.001,dt));draw();requestAnimationFrame(frame)}frame();function touch(x,y,d){if(window.APKit&&APKit.isUI(x,y))return true;tx=clamp(x/W,0,1);ty=clamp(y/H,0,1);ft=d?1:0;return true}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY,true);canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY,true)});canvas.addEventListener('pointerup',e=>touch(e.clientX,e.clientY,false));function mutate(){seed=Math.random()*9999;ht=(ht+48+Math.random()*110)%360}function reset(){px=tx=.5;py=ty=.49;force=ft=0;hue=ht=0;seed=Math.random()*9999}APKit.init({canvas,gifName:'spiral-spectrum-200-v2-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
