<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>FOCUS EXILE</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030506}body{touch-action:none}canvas{width:100%;height:100%;display:block}</style>
</head>
<body><canvas id="c"></canvas><script>
/* CHATGPT — FOCUS EXILE
   WORLD LAW: attention is finite and cannot stay where it is born.
   Touching digs recursive detail into the field; releasing ejects that detail
   to a distant place. Looking closely therefore destroys one focus in order
   to create another. Holding digs deeper; repeated touch changes the topology.
*/
const c=document.querySelector('#c'),g=c.getContext('2d'),TAU=Math.PI*2;
let W,H,D=1,seed=1,focus=[],last=null,hold=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function rr(){let x=Math.sin(seed++*91.7)*43758.5453;return x-Math.floor(x)}
function reset(){seed=7;focus=[];for(let i=0;i<4;i++)focus.push({x:W*(.2+.6*rr()),y:H*(.2+.6*rr()),depth:2+Math.floor(rr()*2),rot:rr()*TAU,energy:.65+.35*rr(),age:rr()*10})}
reset();
function cell(cx,cy,size,depth,rot,e,phase){
 if(size<3||depth<=0)return;
 let wob=.035*Math.sin(phase*2+cx*.01+cy*.013),r=size*(.86+.08*Math.sin(cx*.017+cy*.011+phase));
 g.save();g.translate(cx,cy);g.rotate(rot+wob);
 g.beginPath();g.rect(-r/2,-r/2,r,r);g.strokeStyle=`hsla(${185+depth*25},75%,${58+e*18}%,${.10+depth*.055})`;g.lineWidth=.65+depth*.18;g.stroke();
 let split=depth%2?2:3, gap=.08*r, step=(r-gap*(split-1))/split;
 for(let iy=0;iy<split;iy++)for(let ix=0;ix<split;ix++){
   let nx=-r/2+step/2+ix*step+ix*gap,ny=-r/2+step/2+iy*step+iy*gap;
   if((ix+iy+depth)%3!==1 || depth<2)cell(nx,ny,step,depth-1,-rot*.7+(ix-iy)*.11,e*.94,phase);
 }
 g.restore();
}
function draw(loop=false,phase=0){
 let t=loop?phase:performance.now()*.00012;
 g.fillStyle='#030506';g.fillRect(0,0,W,H);
 // The unobserved field is deliberately almost empty.
 g.globalCompositeOperation='screen';
 for(let f of focus){
   f.age+=.0015;f.rot+=.00012*(f.energy-.5);f.energy=Math.max(.18,f.energy-.000018);
   let pulse=1+.06*Math.sin(t*2+f.age);
   cell(f.x,f.y,Math.min(W,H)*.72*pulse,f.depth,f.rot,f.energy,t);
   g.beginPath();g.arc(f.x,f.y,3+f.depth*1.5,0,TAU);g.fillStyle=`hsla(${205+f.depth*18},90%,80%,${.2+f.energy*.25})`;g.fill();
 }
 // Focuses slowly exile themselves even without touching: attention is unstable.
 for(let f of focus){f.x+=Math.sin(t*1.7+f.age)*.035*f.energy;f.y+=Math.cos(t*1.31+f.age)*.035*f.energy}
 g.globalCompositeOperation='source-over';
 if(last){g.beginPath();g.arc(last.x,last.y,10+Math.sin(t*5)*3,0,TAU);g.strokeStyle='rgba(255,255,255,.25)';g.stroke()}
}
function exile(f){
 // Preserve depth/energy but move the whole history elsewhere.
 f.x=W*(.08+.84*rr());f.y=H*(.08+.84*rr());f.rot+=Math.PI*(.5+rr());f.energy=Math.min(1,f.energy+.14);
}
function touch(x,y){if(APKit.isUI(x,y))return;let hit=null,best=1e9;for(let f of focus){let d=Math.hypot(f.x-x,f.y-y);if(d<best){best=d;hit=f}}
 if(hit&&best<180){hit.x=x;hit.y=y;hit.depth=Math.min(7,hit.depth+1);hit.energy=Math.min(1,hit.energy+.25);hit.rot+=Math.PI/2;}
 else focus.push({x,y,depth:3,rot:rr()*TAU,energy:.8,age:0});
 if(focus.length>6)focus.shift();last={x,y};
}
c.addEventListener('pointerdown',e=>{hold=true;touch(e.clientX,e.clientY)});
c.addEventListener('pointermove',e=>{if(hold&&e.buttons)touch(e.clientX,e.clientY)});
c.addEventListener('pointerup',()=>{hold=false;for(let f of focus)if(Math.random()<.48)exile(f)});
c.addEventListener('pointercancel',()=>{hold=false;for(let f of focus)exile(f)});
APKit.init({canvas:c,gifName:'focus-exile-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{seed=7;draw(true,p)},buttons:[
 {label:'✦',name:'mutate',onClick:()=>{focus.forEach(f=>{f.depth=Math.max(1,Math.min(7,f.depth+Math.floor(Math.random()*3)-1));f.rot+=Math.random()*TAU})}},
 {label:'↻',name:'reset',onClick:reset}
]});
function loop(){draw();requestAnimationFrame(loop)}loop();
</script></body></html>
