<!DOCTYPE html>
<!-- HELIOTROPE — Claude(クロちゃん)作。おっちゃんが見せたサイケな花畑の絵(中心から放射する光・金のジグザグ・シャボン玉・蛇行する川・花畑)から。ap-kit.js統合: Claude -->
<!-- 世界のルール: 太陽は、花畑の一輪だった。花を選ぶとその花が昇って次の太陽になり、いまの太陽は花に戻ってその場所に咲く。
     空の色・光の筋・金のジグザグ・川の行き先・花の向きは、すべて今の太陽(=どの花か)で決まる。かつて太陽だった花には小さな金の輪が残る。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HELIOTROPE — 選んだ一輪が、次の太陽になる</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b2a18;overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas#c{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
  #hint{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));text-align:center;
    color:#fff;font:600 14px/1.4 -apple-system,"Hiragino Sans",sans-serif;letter-spacing:.08em;
    text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity 1.2s}
  #hint.on{opacity:.92}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">花をひとつ選ぶと、それが次の太陽になる</div>
<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const mctx=cv.getContext('2d');
let ctx=mctx;
const hintEl=document.getElementById('hint');
const TAU=Math.PI*2;

let W=0,H=0,DPR=1,MIN=0,horizon=0,sunR=0,sunY=0;
let R=Math.random, seed=0;
const INIT_SEED=20261008;

function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function lerpHue(a,b,t){let d=((b-a)%360+540)%360-180;return (a+d*t+360)%360;}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const hsl=(h,s,l,a)=>a===undefined?`hsl(${h|0},${s|0}%,${l|0}%)`:`hsla(${h|0},${s|0}%,${l|0}%,${a})`;

// ---------- flowers ----------
const HUES=[350,355,5,15,28,42,50,330,315,290,270,225,205,0];
function makeFlowerData(){
  let h=HUES[(R()*HUES.length)|0]+(R()-.5)*12;
  const white=R()<.1;
  const type=(R()*4)|0;
  const n=[18,6,11,8][type]+((R()*4)|0)*(type===0?2:1);
  return {h:(h+360)%360,s:white?12:82+R()*14,l:white?93:56+R()*10,
    h2:(h+(R()<.5?40:-40)+360)%360,h3:R()<.5?48:(h+180)%360,type,n,n2:Math.max(5,Math.round(n*.66)),twist:R()*TAU};
}
function petalPath(c,r0,r1,w,pointed){
  c.moveTo(r0,0);
  if(pointed){c.quadraticCurveTo(r1*.5,-w,r1,0);c.quadraticCurveTo(r1*.5,w,r0,0);}
  else{c.bezierCurveTo(r1*.45,-w*1.2,r1*1.02,-w*.9,r1,0);c.bezierCurveTo(r1*1.02,w*.9,r1*.45,w*1.2,r0,0);}
}
// draws a flower of radius sz at origin of context c; depth = recursion for the center (flower in the flower)
// part: 'o' = outer petals, 'm' = inner petals, 'c' = center; undefined = whole flower
function paintFlower(c,f,sz,depth,part){
  const P=k=>part===undefined||part===k;
  const pointed=f.type===0||f.type===2;
  const wMul=[.13,.42,.2,.3][f.type];
  const lw=Math.max(.6,sz*.025);
  // outer ring
  c.save();c.rotate(f.twist);
  let g;
  if(P('o')){
  g=c.createRadialGradient(0,0,sz*.15,0,0,sz);
  g.addColorStop(0,hsl(f.h,f.s,Math.min(96,f.l+28)));
  g.addColorStop(.55,hsl(f.h,f.s,f.l));
  g.addColorStop(1,hsl(f.h,f.s,Math.max(20,f.l-12)));
  c.beginPath();
  for(let i=0;i<f.n;i++){c.save();c.rotate(i/f.n*TAU);petalPath(c,sz*.12,sz,sz*wMul,pointed);c.restore();}
  c.fillStyle=g;c.fill();
  c.lineWidth=lw;c.strokeStyle=hsl(f.h,60,f.s<30?55:18);c.stroke();
  // stripes
  if(sz>5){
    c.beginPath();
    for(let i=0;i<f.n;i++){const a=i/f.n*TAU;c.moveTo(Math.cos(a)*sz*.3,Math.sin(a)*sz*.3);c.lineTo(Math.cos(a)*sz*.86,Math.sin(a)*sz*.86);}
    c.lineWidth=Math.max(.5,sz*.02);c.strokeStyle='rgba(255,255,255,.75)';c.stroke();
  }
  }
  // inner ring
  c.rotate(Math.PI/f.n2);
  if(P('m')){
  g=c.createRadialGradient(0,0,0,0,0,sz*.62);
  g.addColorStop(0,hsl(f.h2,90,80));g.addColorStop(1,hsl(f.h2,85,50));
  c.beginPath();
  for(let i=0;i<f.n2;i++){c.save();c.rotate(i/f.n2*TAU);petalPath(c,sz*.08,sz*.62,sz*.62*(wMul+.08),pointed);c.restore();}
  c.fillStyle=g;c.fill();c.lineWidth=lw*.8;c.strokeStyle=hsl(f.h2,60,20);c.stroke();
  }
  c.restore();
  if(!P('c'))return;
  // center disc: rings + dot ring
  const cr=sz*.3;
  c.beginPath();c.arc(0,0,cr,0,TAU);c.fillStyle=hsl(f.h3,85,48);c.fill();
  c.lineWidth=lw;c.strokeStyle=hsl(f.h3,60,18);c.stroke();
  if(sz>8){
    const nd=Math.max(8,Math.round(cr*.9));
    c.fillStyle='rgba(255,255,255,.95)';c.beginPath();
    for(let i=0;i<nd;i++){const a=i/nd*TAU;c.moveTo(Math.cos(a)*cr*.78+cr*.07,Math.sin(a)*cr*.78);c.arc(Math.cos(a)*cr*.78,Math.sin(a)*cr*.78,cr*.07,0,TAU);}
    c.fill();
  }
  c.beginPath();c.arc(0,0,cr*.62,0,TAU);c.fillStyle=hsl(f.h,90,62);c.fill();
  if(depth>0&&sz>14){
    // the same flower, again, inside its own center
    const sub=Object.assign({},f,{h:f.h2,h2:f.h,twist:f.twist+.5});
    paintFlower(c,sub,cr*.6,depth-1);
  }else{
    c.beginPath();c.arc(0,0,cr*.36,0,TAU);c.fillStyle='#1b1030';c.fill();
    c.beginPath();c.arc(-cr*.12,-cr*.12,cr*.12,0,TAU);c.fillStyle='rgba(255,255,255,.9)';c.fill();
  }
}
function flowerSprite(f,sz,part){
  const s=Math.ceil((part==='c'?sz*.62:part==='m'?sz*1.3:sz*2)+4);
  const c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');x.translate(s/2,s/2);paintFlower(x,f,sz,3,part);
  return c;
}
// a flower as three separately turning parts
function flowerParts(f,sz){return {o:flowerSprite(f,sz,'o'),m:flowerSprite(f,sz,'m'),c:flowerSprite(f,sz,'c'),sz};}
function drawParts(P,scale,ro,rm,rc,flut){
  for(const [img,rot,sq] of [[P.o,ro,flut],[P.m,rm,-flut*.7],[P.c,rc,0]]){
    ctx.save();ctx.rotate(rot);if(sq)ctx.scale(1+sq,1-sq);
    const w=img.width*scale;ctx.drawImage(img,-w/2,-w/2,w,w);ctx.restore();
  }
}

// ---------- world state ----------
let field=[];          // {xn,p,data,exSun,sprite,size,ph}
let sun=null;          // {data, xn}  (xn = normalized x)
let sunParts=null;
let swap=null;
let hue=350;           // current world hue (lerped)
let ground=null, mountains=null, speckle=null, bubbleImg=null;
let waves=[], dots=[], sparks=[], bubbles=[], orbs=[], clouds=[], glints=[];
let t0=performance.now(), last=t0, now=0;
let touched=false;

function sunXof(xn){return clamp(xn,.38,.62)*W;}
function riverC(p,sx){const q=Math.pow(p,.65);return sx*(1-q)+W*.5*q+W*.13*Math.sin(3.2*Math.log(p+.04)+.6)*Math.sqrt(p);}
function riverW(p){return W*.008+W*.3*Math.pow(p,1.25);}
function pY(p){return horizon+(H-horizon)*p;}
function fSize(p){return MIN*(.011+.105*Math.pow(p,1.3));}

function placeOK(xn,p){
  const x=xn*W, s=fSize(p);
  if(p<.13&&Math.abs(x-W*.5)<W*.37) return false;
  const a=riverC(p,W*.38),b=riverC(p,W*.62),rw=riverW(p)*.55+s*.7;
  if(x>Math.min(a,b)-rw&&x<Math.max(a,b)+rw) return false;
  return true;
}
function newField(){
  field=[];
  const N=Math.round(clamp(W*H/(DPR*DPR)/2600,90,190));
  for(let i=0;i<N;i++){
    for(let k=0;k<30;k++){
      const p=.025+1.0*Math.pow(R(),.8);
      const xn=-.04+1.08*R();
      if(placeOK(xn,p)){field.push({xn,p,data:makeFlowerData(),exSun:false,ph:R()*TAU,spin:(R()-.5)*.25,rs:(R()<.5?-1:1)*(.15+R()*.4),rf:1.5+R()*2.5});break;}
    }
  }
  sun={data:seed===INIT_SEED?{h:350,s:90,l:58,h2:40,h3:48,type:0,n:20,n2:13,twist:0}:makeFlowerData(),xn:.5};
  hue=sun.data.h;
}
function sizeField(){
  for(const f of field){f.size=fSize(f.p);f.parts=flowerParts(f.data,f.size);}
  field.sort((a,b)=>a.p-b.p);
  sunParts=flowerParts(sun.data,sunR);
}

// ---------- cached layers ----------
function buildGround(){
  ground=document.createElement('canvas');ground.width=W;ground.height=H;
  const g=ground.getContext('2d');const rr=mulberry(seed+7);
  // field base
  let gr=g.createLinearGradient(0,horizon,0,H);
  gr.addColorStop(0,'hsl(70,85%,58%)');gr.addColorStop(.25,'hsl(95,70%,42%)');gr.addColorStop(1,'hsl(130,60%,18%)');
  g.fillStyle=gr;g.fillRect(0,horizon,W,H-horizon);
  // hills both sides, with bushes and cloud puffs along the ridge
  orbs=[];clouds=[];
  for(const side of [-1,1]){
    const hy=x=>{const u=side<0?x/W:1-x/W;const k=clamp(1-u/.42,0,1);return horizon-H*.15*k*k*(3-2*k)-H*.012*Math.sin(u*40)*k;};
    for(let i=0;i<8;i++){const u=.04+rr()*.36,x=side<0?u*W:(1-u)*W,top=hy(x);orbs.push({x,y:lerp(top,horizon,.15+rr()*.6),r:MIN*(.018+.03*rr()),ph:rr()*TAU});}
    g.beginPath();
    const xs=side<0?[-.02,.44]:[.56,1.02];
    g.moveTo(xs[0]*W,horizon+2);
    for(let i=0;i<=60;i++){const x=lerp(xs[0],xs[1],i/60)*W;g.lineTo(x,hy(x));}
    g.lineTo(xs[1]*W,horizon+2);g.closePath();
    gr=g.createLinearGradient(0,horizon-H*.16,0,horizon);gr.addColorStop(0,'hsl(88,75%,48%)');gr.addColorStop(1,'hsl(120,55%,28%)');
    g.fillStyle=gr;g.fill();
    g.save();g.clip();
    for(let i=0;i<260;i++){
      const x=lerp(xs[0],xs[1],rr())*W,top=hy(x);if(top>horizon-2)continue;
      const y=lerp(top,horizon,Math.pow(rr(),.7)),r=MIN*(.008+.022*rr());
      g.beginPath();g.arc(x,y,r,0,TAU);
      g.fillStyle=hsl(rr()<.3?60+rr()*20:90+rr()*50,70,30+rr()*35);g.fill();
      g.lineWidth=Math.max(1,r*.12);g.strokeStyle='rgba(20,50,10,.5)';g.stroke();
      if(rr()<.5){g.beginPath();g.arc(x-r*.3,y-r*.3,r*.18,0,TAU);g.fillStyle='rgba(255,255,220,.8)';g.fill();}
    }
    g.restore();
    for(let i=0;i<34;i++){
      const u=rr();const x=lerp(xs[0],xs[1],side<0?u*.8:.2+u*.8)*W,y=hy(x)-MIN*.01,r=MIN*(.012+.028*rr());
      if(hy(x)>horizon-H*.02)continue;
      clouds.push({x,y,r,l:88+rr()*8,ph:rr()*TAU});
    }
  }
  // field confetti: tiny blossoms and grass, smaller toward the horizon
  for(let i=0;i<4200;i++){
    const p=Math.pow(rr(),.9),y=pY(p),x=rr()*W,r=(.6+rr()*1.4)*(1+p*5)*DPR*.6;
    const fl=rr()<.42;
    g.fillStyle=fl?hsl(HUES[(rr()*HUES.length)|0],90,55+rr()*20):hsl(80+rr()*60,65,22+rr()*30);
    g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }
  g.lineCap='round';
  for(let i=0;i<1600;i++){
    const p=Math.pow(rr(),.8),y=pY(p),x=rr()*W,l=(3+rr()*6)*(1+p*6)*DPR*.6;
    g.strokeStyle=hsl(90+rr()*40,70,30+rr()*30);g.lineWidth=Math.max(.7,l*.12);
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l*.1,y-l*.5,x+(rr()-.5)*l*.6,y-l);g.stroke();
  }
}
function buildMountains(){
  mountains=document.createElement('canvas');mountains.width=W;mountains.height=H;
  const g=mountains.getContext('2d');const rr=mulberry(seed+3);
  const cols=[[330,70,62],[280,55,55],[215,65,55],[345,75,70],[260,50,45]];
  const peaks=[];
  for(let i=0;i<9;i++)peaks.push({x:W*(.18+.64*i/8+(rr()-.5)*.05),h:H*(.022+.03*rr()),w:W*(.07+.06*rr()),c:cols[(rr()*cols.length)|0]});
  peaks.sort((a,b)=>b.h-a.h);
  for(const k of peaks){
    const b=horizon+1;
    g.beginPath();g.moveTo(k.x-k.w,b);g.lineTo(k.x,b-k.h);g.lineTo(k.x+k.w,b);g.closePath();
    g.fillStyle=hsl(k.c[0],k.c[1],k.c[2]);g.fill();
    g.beginPath();g.moveTo(k.x,b-k.h);g.lineTo(k.x+k.w,b);g.lineTo(k.x+k.w*.25,b);g.closePath();
    g.fillStyle=hsl(k.c[0],k.c[1],k.c[2]-16);g.fill();
    g.beginPath();g.moveTo(k.x,b-k.h);g.lineTo(k.x-k.w*.22,b-k.h*.72);g.lineTo(k.x+k.w*.18,b-k.h*.7);g.closePath();
    g.fillStyle='rgba(255,245,250,.85)';g.fill();
    g.lineWidth=Math.max(1,DPR);g.strokeStyle=hsl(k.c[0],50,22,.6);
    g.beginPath();g.moveTo(k.x-k.w,b);g.lineTo(k.x,b-k.h);g.lineTo(k.x+k.w,b);g.stroke();
  }
}
function buildSpeckle(){
  speckle=document.createElement('canvas');speckle.width=W;speckle.height=Math.ceil(horizon);
  const g=speckle.getContext('2d');const rr=mulberry(seed+11);
  for(let i=0;i<2600;i++){
    const x=rr()*W,y=rr()*horizon,r=(.4+rr()*1.3)*DPR;
    g.fillStyle=rr()<.7?`rgba(255,255,255,${.25+rr()*.6})`:hsl(rr()*360,90,75,.7);
    g.fillRect(x,y,r,r);
  }
}
function buildBubble(){
  const s=128;bubbleImg=document.createElement('canvas');bubbleImg.width=bubbleImg.height=s;
  const g=bubbleImg.getContext('2d');const c=s/2,r=s*.46;
  let gr=g.createRadialGradient(c,c,r*.2,c,c,r);
  gr.addColorStop(0,'rgba(255,255,255,.04)');gr.addColorStop(.75,'rgba(190,235,255,.22)');gr.addColorStop(1,'rgba(255,255,255,.85)');
  g.fillStyle=gr;g.beginPath();g.arc(c,c,r,0,TAU);g.fill();
  for(let i=0;i<24;i++){g.beginPath();g.arc(c,c,r*.9,i/24*TAU,(i+1.2)/24*TAU);g.strokeStyle=hsl(i*15+200,100,70,.55);g.lineWidth=s*.05;g.stroke();}
  g.beginPath();g.ellipse(c-r*.38,c-r*.42,r*.26,r*.14,-.7,0,TAU);g.fillStyle='rgba(255,255,255,.95)';g.fill();
  g.beginPath();g.arc(c+r*.45,c+r*.4,r*.08,0,TAU);g.fillStyle='rgba(255,255,255,.8)';g.fill();
  g.lineWidth=s*.012;g.strokeStyle='rgba(60,60,120,.35)';g.beginPath();g.arc(c,c,r,0,TAU);g.stroke();
}
function seedParticles(){
  const rr=mulberry(seed+19);
  waves=[];for(let i=0;i<240;i++)waves.push({p:.03+rr()*1.05,s:(rr()-.5)*1.7,c:(rr()*4)|0,ph:rr()*TAU});
  dots=[];for(let i=0;i<460;i++)dots.push({a:-Math.PI-.25+(Math.PI+.5)*rr(),u:rr(),c:(rr()*5)|0,sp:.6+rr()*.8});
  glints=[];for(let i=0;i<160;i++)glints.push({xn:rr(),p:.03+Math.pow(rr(),.8),ph:rr()*TAU,sp:1.5+rr()*3,h:rr()<.5?55:rr()*360});
  sparks=[];for(let i=0;i<46;i++)sparks.push({x:rr(),y:rr()*.85,s:.4+rr()*(i<6?2.6:1),ph:rr()*TAU,sp:1+rr()*2});
  bubbles=[];for(let k=0;k<6;k++)for(let i=0;i<11;i++)bubbles.push({k,t:rr(),o:(rr()-.5)*.9,s:.5+rr()*.9});
}

// ---------- geometry from the sun ----------
const RIB=[-118,-140,-158,-62,-40,-22];
function ribbonAt(k,t,sx,sy,tm){
  const a=RIB[k]*Math.PI/180+Math.sin(tm*.23+k)*.03;
  const dx=Math.cos(a),dy=Math.sin(a),px=-dy,py=dx,sg=dx<0?-1:1;
  const D=Math.max(W,H)*1.15,bend=(.26+.04*Math.sin(tm*.4+k*1.7))*D*sg;
  const P0x=sx+dx*sunR*1.2,P0y=sy+dy*sunR*1.2;
  const P1x=sx+dx*D*.3+px*bend*.5,P1y=sy+dy*D*.3+py*bend*.5;
  const P2x=sx+dx*D*.65+px*bend,P2y=sy+dy*D*.65+py*bend;
  const P3x=sx+dx*D,P3y=sy+dy*D+D*.1;
  const u=1-t;
  const x=u*u*u*P0x+3*u*u*t*P1x+3*u*t*t*P2x+t*t*t*P3x;
  const y=u*u*u*P0y+3*u*u*t*P1y+3*u*t*t*P2y+t*t*t*P3y;
  const tx=3*u*u*(P1x-P0x)+6*u*t*(P2x-P1x)+3*t*t*(P3x-P2x);
  const ty=3*u*u*(P1y-P0y)+6*u*t*(P2y-P1y)+3*t*t*(P3y-P2y);
  const L=Math.hypot(tx,ty)||1;
  return [x,y,-ty/L,tx/L];
}
const ribW=t=>sunR*(.16+3.2*t);

// ---------- drawing ----------
// sky = the sun flower's opposite color (but never the muddy olive band)
function skyHue(hc){let k=(hc+165)%360;if(k>20&&k<100)k=k<60?lerp(340,320,(k-20)/40):lerp(118,135,(k-60)/40);return k;}
function drawSky(sx,sy,hc,dim){
  const skyH=skyHue(hc), glowH=lerpHue(hc,52,.62);
  let g=ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,hsl(skyH,70,21));g.addColorStop(.55,hsl(skyH,72,36));g.addColorStop(1,hsl(lerpHue(skyH,glowH,.7),85,62));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);
  const RG=Math.max(W,H)*.75;
  g=ctx.createRadialGradient(sx,sy,0,sx,sy,RG);
  g.addColorStop(0,`rgba(255,255,248,${dim})`);g.addColorStop(.1,`rgba(255,253,225,${.97*dim})`);g.addColorStop(.22,hsl(glowH,100,74,.88*dim));
  g.addColorStop(.5,hsl(glowH,100,62,.4*dim));g.addColorStop(1,hsl(glowH,100,60,0));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);
  ctx.globalAlpha=.55;ctx.drawImage(speckle,0,0);ctx.globalAlpha=1;
}
// tie-dye rings welling out of the sun, wobbling
function drawRings(sx,sy,hc,tm,dim){
  const D=Math.max(W,H)*1.25,N=22,step=D/N,sp=.32,f=(tm*sp)%1,base=Math.floor(tm*sp),NP=72;
  for(let i=N;i>=1;i--){
    const r=(i-1+f)*step;if(r<sunR*.9)continue;
    const idx=i-base;

const ZIG=[-74,-106,-52,-128,-30,-150];

// ---------- the law: a flower becomes the sun ----------
function startSwap(f){
  const from={x:sunXof(sun.xn),y:sunY},to={x:sunXof(f.xn),y:sunY};
  const at={x:f.xn*W,y:pY(f.p)};
  swap={t:0,f,from,to,at,fromHue:hue,toHue:f.data.s<30?52:f.data.h,
    rise:flowerParts(f.data,sunR),riseData:f.data,fall:sunParts,fallData:sun.data,fallXn:sun.xn};
}
function endSwap(){
  const f=swap.f;
  sun={data:swap.riseData,xn:f.xn};
  sunParts=swap.rise;
  f.data=swap.fallData;f.exSun=true;f.parts=flowerParts(f.data,f.size);
  hue=swap.toHue;swap=null;
}

function frame(nowMs){
  const dt=Math.min(.05,(nowMs-last)/1000);last=nowMs;
  const tm=(nowMs-t0)/1000;
  let sx=sunXof(sun.xn),sy=sunY,dim=1,e=0;
  if(swap){
    swap.t=Math.min(1,swap.t+dt/2.6);e=ease(swap.t);
    sx=lerp(swap.from.x,swap.to.x,e);
    hue=lerpHue(swap.fromHue,swap.toHue,e);
    dim=1-.55*Math.sin(Math.PI*swap.t);
  }
  ctx=mctx;ctx.setTransform(1,0,0,1,0,0);
  drawSky(sx,sy,hue,dim);
  drawRings(sx,sy,hue,tm,dim);
  drawRays(sx,sy,hue,tm,dim);
  drawSparks(tm);
  drawRibbons(sx,sy,hue,tm);
  ctx.drawImage(ground,0,0);
  drawClouds(tm);
  drawOrbs(hue,tm);
  drawZigzags(sx,sy,hue,tm);
  if(!swap)drawSun(sx,sy,tm,1);
  ctx.drawImage(mountains,0,0);
  drawWater(sx,hue,tm,dim);
  drawGlints(tm);
  drawField(sx,tm,swap?swap.f:null);
  if(swap){
    const st=swap.t;
    // old sun sinks into the flower's place
    const fe=ease(clamp(st/.8,0,1));
    const fx=lerp(swap.from.x,swap.at.x,fe),fy=lerp(swap.from.y,swap.at.y,fe)-Math.sin(Math.PI*fe)*H*.06;
    drawGlowSprite(swap.fall,fx,fy,lerp(sunR,swap.f.size,fe),fe*-3,1-fe);
    // the chosen flower rises and becomes the sun
    const re=ease(clamp((st-.12)/.88,0,1));
    const cx=(swap.at.x+swap.to.x)/2,cy=Math.min(swap.at.y,swap.to.y)-H*.18;
    const u=1-re,rx=u*u*swap.at.x+2*u*re*cx+re*re*swap.to.x,ry=u*u*swap.at.y+2*u*re*cy+re*re*swap.to.y;
    drawGlowSprite(swap.rise,rx,ry,lerp(swap.f.size,sunR,re),re*TAU,re);
    if(st>.55)drawShock((st-.55)/.45,swap.to.x,swap.to.y);
    if(swap.t>=1)endSwap();
  }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function pick(x,y){
  let best=null,bs=1e9;
  for(let i=field.length-1;i>=0;i--){
    const f=field[i],fx=f.xn*W,fy=pY(f.p),d=Math.hypot(fx-x,fy-y),lim=Math.max(f.size*1.1,20*DPR);
    if(d<f.size*.9)return f;            // directly on a flower head: the front one wins
    if(d<lim&&d/lim<bs){best=f;bs=d/lim;}
  }
  return best;
}
cv.addEventListener('pointerdown',ev=>{
  if(window.APKit&&APKit.isUI(ev.clientX,ev.clientY))return;
  ev.preventDefault();
  if(!touched){touched=true;hintEl.classList.remove('on');}
  if(swap)return;
  const f=pick(ev.clientX*DPR,ev.clientY*DPR);
  if(f)startSwap(f);
},{passive:false});

// ---------- setup ----------
