<!DOCTYPE html>
<!-- GOLDEN ANGLE — Claude(クロちゃん)作。自然のフラクタル・シリーズ1(ロマネスコ)。MORPHING FERN の光の粒の描き方を下地にした。ap-kit.js統合: Claude -->
<!-- 世界のルール: 芽はすべて「ひとつ前の芽から決まった角度だけ回った所」に生まれる。その角度は指で決まる。
     黄金角(約137.5°)のときだけ芽はすきまなく詰まり、金色に光る。芽の一つひとつも同じ法則でできた小さなロマネスコで、
     タップした芽にもぐると、それがそのまま次の全体になる(どこまでもぐっても同じ)。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GOLDEN ANGLE — 芽の角度を決めるのは指。黄金角のときだけ金色に詰まる</title>
<script src="../ap-kit.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #hint { position: fixed; left: 16px; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; font-size: 11.5px; line-height: 1.85; letter-spacing: .07em;
    color: #f3ffb0; opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 14px rgba(200, 255, 80, .45); }
  #hint.on { opacity: .72; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">左右になぞる ＝ 芽の生まれる角度をねじる（黄金角で金色に）<br>タップ ＝ その芽にもぐる。芽がそのまま次の全体になる</div>
<script>
/* ======== 光の粒エンジン(自然のフラクタル・シリーズ共通) ========
   MORPHING FERN の描き方(粒を溜めて少しずつ消す)を作品ごとに使えるようにしたもの。
   作品側は plot(api) で粒を打つだけ。色は作品ごとのグラデーションを24段に分けて、まとめて描く。 */
var NF = (function () {
  'use strict';
  var TAU = Math.PI * 2;

  function run(work) {
    var cvs = document.getElementById('c');
    var hint = document.getElementById('hint');
    var ctx = cvs.getContext('2d', { alpha: false, desynchronized: true });
    var acc = document.createElement('canvas');
    var actx = acc.getContext('2d', { alpha: false, desynchronized: true });

    var W = 0, H = 0, DPR = 1, RES_CAP = 2200000, MAXDT = 0.05;
    var NB = 24, CAP = 26000;
    var dx = new Float32Array(CAP), dy = new Float32Array(CAP), dc = new Uint8Array(CAP);
    var ox = new Float32Array(CAP), oy = new Float32Array(CAP);
    var cnt = 0, counts = new Int32Array(NB * 2), starts = new Int32Array(NB * 2);
    var fills = [], fillsHi = [], rgbs = [];

    /* ---- 色: 作品のグラデーションから24段 ---- */
    function setPalette(stops, alphaLo, alphaHi) {
      fills = []; fillsHi = []; rgbs = [];
      for (var i = 0; i < NB; i++) {
        var t = i / (NB - 1), k = 0;
        while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
        var a = stops[k], b = stops[k + 1];
        var u = Math.max(0, Math.min(1, (t - a[0]) / Math.max(1e-6, b[0] - a[0])));
        var r = Math.round(a[1] + (b[1] - a[1]) * u), g = Math.round(a[2] + (b[2] - a[2]) * u), bl = Math.round(a[3] + (b[3] - a[3]) * u);
        rgbs.push([r, g, bl]);
        fills.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaLo + ')');
        fillsHi.push('rgba(' + r + ',' + g + ',' + bl + ',' + alphaHi + ')');
      }
    }

    /* ---- 発光スプライト(色ごとに作って使い回す) ---- */
    var spriteCache = {};
    function spriteFor(c) {
      var i = Math.max(0, Math.min(NB - 1, Math.round(c * (NB - 1))));
      var key = i + ':' + rgbs[i].join(',');
      if (spriteCache[key]) return spriteCache[key];
      var s = document.createElement('canvas'); s.width = s.height = 64;
      var g2 = s.getContext('2d'), rgb = rgbs[i];
      var gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.12, 'rgba(' + rgb + ',0.5)');
      gr.addColorStop(0.34, 'rgba(' + rgb + ',0.13)');
      gr.addColorStop(0.66, 'rgba(' + rgb + ',0.035)');
      gr.addColorStop(1, 'rgba(' + rgb + ',0)');
      g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
      spriteCache[key] = s;
      return s;
    }

    var api = {
      W: 0, H: 0, min: 1, now: 0, dt: 0, quality: 2, TAU: TAU,
      ptr: { x: 0, y: 0, down: false, held: 0, drag: false },
      /* 粒を1つ打つ。c=色(0..1)、hi=明るい段 */
      dot: function (x, y, c, hi) {
        if (cnt >= CAP) return;
        if (x < -4 || y < -4 || x > W + 4 || y > H + 4) return;
        var i = (c * (NB - 1) + 0.5) | 0;
        if (i < 0) i = 0; else if (i >= NB) i = NB - 1;
        dx[cnt] = x * DPR; dy[cnt] = y * DPR; dc[cnt] = hi ? i + NB : i; cnt++;
      },
      /* にじむ光(溜める層へ) */
      glow: function (x, y, r, c, a) {
        var pa = actx.globalAlpha;
        actx.globalCompositeOperation = 'lighter';
        actx.globalAlpha = a;
        actx.drawImage(spriteFor(c), (x - r) * DPR, (y - r) * DPR, r * 2 * DPR, r * 2 * DPR);
        actx.globalAlpha = pa;
      },
      /* にじむ光(その場だけ、溜めない) */
      flare: function (x, y, r, c, a) {
        var pa = ctx.globalAlpha;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.drawImage(spriteFor(c), x - r, y - r, r * 2, r * 2);
        ctx.globalAlpha = pa;
      },
      clear: function () {
        actx.setTransform(1, 0, 0, 1, 0, 0);
        actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
        actx.fillStyle = '#000'; actx.fillRect(0, 0, acc.width, acc.height);
      },
      palette: setPalette,
      rand: Math.random,
      hideHint: function () { hint.classList.remove('on'); }
    };

    function resize() {
      var w = cvs.clientWidth || window.innerWidth;
      var h = cvs.clientHeight || window.innerHeight;
      if (w === W && h === H && cvs.width > 1) return;
      W = w; H = h;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      if (w * h * DPR * DPR > RES_CAP) DPR = Math.max(1, Math.sqrt(RES_CAP / (w * h)));
      cvs.width = Math.max(1, Math.round(w * DPR));
      cvs.height = Math.max(1, Math.round(h * DPR));
      acc.width = cvs.width; acc.height = cvs.height;
      api.W = W; api.H = H; api.min = Math.min(W, H);
      api.clear();
      if (work.resize) work.resize(api);
    }

    /* ---- 操作: 押した瞬間 / 短く離す=タップ / 押したまま=長押し / 動かす=なぞる ---- */
    var p = api.ptr, downAt = 0, sx = 0, sy = 0, lx = 0, ly = 0, pid = null, holding = false;
    function toXY(e) { var r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cvs.addEventListener('pointerdown', function (e) {
      if (window.APKit && APKit.isUI(e.clientX, e.clientY)) return;
      if (pid !== null) return;
      pid = e.pointerId;
      try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
      var q = toXY(e);
      p.x = sx = lx = q.x; p.y = sy = ly = q.y; p.down = true; p.held = 0; p.drag = false; holding = false;
      downAt = performance.now();
      if (api.now > 1.2) api.hideHint();
      if (work.down) work.down(api, q.x, q.y);
      e.preventDefault();
    }, { passive: false });
    cvs.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pid) return;
      var q = toXY(e);
      p.x = q.x; p.y = q.y;
      if (!p.drag && !holding && Math.hypot(q.x - sx, q.y - sy) > 12) p.drag = true;
      if (p.drag && work.drag) work.drag(api, q.x, q.y, q.x - lx, q.y - ly);
      lx = q.x; ly = q.y;
    }, { passive: true });
    function up(e) {
      if (e.pointerId !== pid) return;
      pid = null;
      var q = toXY(e), t = (performance.now() - downAt) / 1000;
      p.down = false;
      if (holding) { if (work.release) work.release(api, q.x, q.y, p.held); }
      else if (!p.drag && t < 0.4) { if (work.tap) work.tap(api, q.x, q.y); }
      else if (p.drag && work.dragEnd) work.dragEnd(api, q.x, q.y);
      holding = false; p.drag = false; p.held = 0;
    }
    cvs.addEventListener('pointerup', up);
    cvs.addEventListener('pointercancel', up);
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); });
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); }).observe(cvs);
    window.addEventListener('resize', function () { setTimeout(resize, 120); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(resize, 120); });
    document.addEventListener('visibilitychange', function () { last = 0; });

    /* ---- 描画 ---- */
    var floorT = 0;
    function clearResidue() {
      actx.save();
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalAlpha = 1;
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'lighter'; actx.fillStyle = 'rgb(1,1,1)'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.globalCompositeOperation = 'difference'; actx.fillStyle = '#fff'; actx.fillRect(0, 0, acc.width, acc.height);
      actx.restore();
    }
    function flush() {
      var i, k;
      counts.fill(0);
      for (i = 0; i < cnt; i++) counts[dc[i]]++;
      var s = 0;
      for (k = 0; k < NB * 2; k++) { starts[k] = s; s += counts[k]; }
      var pos = starts.slice();
      for (i = 0; i < cnt; i++) { var b = dc[i], j = pos[b]++; ox[j] = dx[i]; oy[j] = dy[i]; }
      actx.globalCompositeOperation = 'lighter';
      actx.globalAlpha = 1;
      var sz = Math.max(1, DPR * 1.05), szH = Math.max(1.4, DPR * 1.45);
      for (k = 0; k < NB * 2; k++) {
        if (!counts[k]) continue;
        var hi = k >= NB, z = hi ? szH : sz;
        actx.fillStyle = hi ? fillsHi[k - NB] : fills[k];
        var e = starts[k] + counts[k];
        for (i = starts[k]; i < e; i++) actx.fillRect(ox[i], oy[i], z, z);
      }
      cnt = 0;
    }

    var last = 0, perfAcc = 0, perfN = 0;
    function frame(ts) {
      if (!last) last = ts;
      var dt = (ts - last) / 1000; last = ts;
      if (dt > MAXDT) dt = MAXDT;
      if (dt < 0.0005) dt = 0.0005;
      api.now += dt; api.dt = dt;
      if (p.down && !p.drag) {
        var t = (performance.now() - downAt) / 1000;
        if (!holding && t >= 0.4) { holding = true; if (work.holdStart) work.holdStart(api, p.x, p.y); }
        if (holding) { p.held += dt; if (work.hold) work.hold(api, p.x, p.y, dt); }
      }
      if (work.update) work.update(api, dt);

      var fadeA = 1 - Math.exp(-(work.fade || 1.25) * dt);
      if (fadeA < 0.001) fadeA = 0.001;
      actx.setTransform(1, 0, 0, 1, 0, 0);
      actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
      actx.fillStyle = 'rgba(0,0,0,' + fadeA.toFixed(5) + ')';
      actx.fillRect(0, 0, acc.width, acc.height);
      floorT += dt;
      if (floorT >= 0.05) { floorT = 0; clearResidue(); }

      work.plot(api);
      flush();

      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      if (work.background) work.background(api, ctx); else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(acc, 0, 0, acc.width, acc.height, 0, 0, W, H);
      if (work.overlay) work.overlay(api, ctx);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

      perfAcc += dt * 1000; perfN++;
      if (perfN >= 90) { if (perfAcc / perfN > 26 && api.quality === 2) api.quality = 1; perfAcc = 0; perfN = 0; }
      requestAnimationFrame(frame);
    }

    api.ctx = ctx;
    if (work.init) work.init(api);
    resize();
    setTimeout(function () { hint.classList.add('on'); }, 550);
    setTimeout(api.hideHint, 7500);
    requestAnimationFrame(frame);
    window.__api = api;

    if (window.APKit) {
      window.APKit.init({
        canvas: cvs,
        gifName: work.name,
        clockFormat: 'spec',
        dock: true,
        autoHide: true,
        fullscreenButton: false,
        buttons: [
          { label: '✦', name: 'mutate', onClick: function () { work.mutate(api); } },
          { label: '↻', name: 'reset', onClick: function () { api.clear(); work.reset(api); } }
        ]
      });
    }
    return api;
  }
  return { run: run };
})();

(function () {
  'use strict';
  var GA = Math.PI * (3 - Math.sqrt(5));          /* 黄金角 2.39996 rad = 137.5° */
  var N = 56, C = Math.log(1 / 0.03) / N;          /* 1段あたりの芽の数と、外→内の縮み方 */
  var HC = 1.75;                                   /* 円すいの高さ(底の半径=1) */
  var TILT = 0.38;                                 /* 見下ろす角度 */
  var div = GA, gold = 1, spin = 0, flash = 0;
  var dive = null;                                 /* もぐっている途中 */
  var cosT = Math.cos(TILT), sinT = Math.sin(TILT);
  var budP = [], budS = [], budB = [];             /* 芽ごとの位置・大きさ・向き(基底) */

  function buildBuds() {
    budP = []; budS = []; budB = [];
    for (var j = 0; j < N; j++) {
      var i = N - 1 - j;                              /* i: 頂点から数えた番号 */
      var r = Math.exp(-C * j), th = i * div;
      var ct = Math.cos(th), st = Math.sin(th);
      var P = [r * ct, r * st, HC * (1 - r)];
      var nx = HC * 0.5 * ct, ny = HC * 0.5 * st, nz = 1, nl = Math.hypot(nx, ny, nz);
      var n = [nx / nl, ny / nl, nz / nl];
      var e1 = [-st, ct, 0];                          /* 円周方向 */
      var e2 = [n[1] * e1[2] - n[2] * e1[1], n[2] * e1[0] - n[0] * e1[2], n[0] * e1[1] - n[1] * e1[0]];
      budP.push(P); budS.push(r * 0.40); budB.push([e2, e1, n]);   /* 局所x=e2(外向き), y=e1, z=n */
    }
  }
  function sampleJ() {                               /* 面積に比例して芽を選ぶ */
    var j = (-Math.log(1 - Math.random()) / (2 * C)) | 0;
    return j >= N ? (Math.random() * N) | 0 : j;
  }
  function toParent(q, j) {                          /* 芽の座標 → 親の座標 */
    var B = budB[j], s = budS[j], P = budP[j];
    return [P[0] + s * (q[0] * B[0][0] + q[1] * B[1][0] + q[2] * B[2][0]),
            P[1] + s * (q[0] * B[0][1] + q[1] * B[1][1] + q[2] * B[2][1]),
            P[2] + s * (q[0] * B[0][2] + q[1] * B[1][2] + q[2] * B[2][2])];
  }
  /* 回転行列を少しずつ: 単位 → R を w の割合で(ロドリゲス) */
  function rotFrac(R, w) {
    var tr = R[0][0] + R[1][1] + R[2][2];
    var ang = Math.acos(Math.max(-1, Math.min(1, (tr - 1) / 2)));
    if (ang < 1e-5) return [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
    var ax = [R[2][1] - R[1][2], R[0][2] - R[2][0], R[1][0] - R[0][1]], al = Math.hypot(ax[0], ax[1], ax[2]) || 1;
    ax = [ax[0] / al, ax[1] / al, ax[2] / al];
    var a = ang * w, c = Math.cos(a), s = Math.sin(a), t = 1 - c, x = ax[0], y = ax[1], z = ax[2];
    return [[t * x * x + c, t * x * y - s * z, t * x * z + s * y],
            [t * x * y + s * z, t * y * y + c, t * y * z - s * x],
            [t * x * z - s * y, t * y * z + s * x, t * z * z + c]];
  }
  /* 芽の基底を、行=軸ではなく 列=軸 の行列に */
  function budMat(j) { var B = budB[j]; return [[B[0][0], B[1][0], B[2][0]], [B[0][1], B[1][1], B[2][1]], [B[0][2], B[1][2], B[2][2]]]; }

  var cam = { M: null, c: [0, 0, 0], s: 1 };         /* 見る位置(もぐる途中だけ動く) */
  var C0 = [0, 0, HC * 0.40];
  function setCam(w) {
    if (!dive) { cam.M = null; cam.s = 1; cam.c = C0; return; }
    var j = dive.j, s = budS[j], M = budMat(j);
    var R = rotFrac(M, w);
    var bc = toParent(C0, j), sw = Math.pow(s, w), cw = 1 - (1 - w) * sw;
    cam.M = R; cam.s = sw;
    cam.c = [C0[0] + (bc[0] - C0[0]) * cw, C0[1] + (bc[1] - C0[1]) * cw, C0[2] + (bc[2] - C0[2]) * cw];
  }
  var scale = 1, cx = 0, cy = 0;
  function project(q, out) {                         /* 3D → 画面 */
    var x = q[0] - cam.c[0], y = q[1] - cam.c[1], z = q[2] - cam.c[2];
    if (cam.M) { var M = cam.M; var X = M[0][0] * x + M[1][0] * y + M[2][0] * z, Y = M[0][1] * x + M[1][1] * y + M[2][1] * z, Z = M[0][2] * x + M[1][2] * y + M[2][2] * z; x = X; y = Y; z = Z; }
    x /= cam.s; y /= cam.s; z /= cam.s;
    var cs = Math.cos(spin), sn = Math.sin(spin), X2 = x * cs - y * sn, Y2 = x * sn + y * cs;
    out[0] = cx + X2 * scale;
    out[1] = cy - (z * cosT + Y2 * sinT) * scale;
    out[2] = -Y2 * cosT + z * sinT;                 /* 手前向きの度合い(カメラ側が+) */
    return out;
  }
  function facing(n) {                               /* 法線がカメラを向いているか */
    var x = n[0], y = n[1], z = n[2];
    if (cam.M) { var M = cam.M; var X = M[0][0] * x + M[1][0] * y + M[2][0] * z, Y = M[0][1] * x + M[1][1] * y + M[2][1] * z, Z = M[0][2] * x + M[1][2] * y + M[2][2] * z; x = X; y = Y; z = Z; }
    var cs = Math.cos(spin), sn = Math.sin(spin), Y2 = x * sn + y * cs;
    return -Y2 * cosT + z * sinT;
  }

  var tmp = [0, 0, 0];
  var work = {
    name: 'golden-angle',
    fade: 1.6,
    init: function (api) {
      api.palette([[0, 14, 52, 22], [0.3, 60, 150, 50], [0.55, 175, 215, 60], [0.76, 242, 188, 58], [1, 255, 226, 140]], 0.36, 0.62);
      buildBuds();
    },
    resize: function (api) {
      scale = Math.min(api.W * 0.34, api.H * 0.25);
      cx = api.W / 2; cy = api.H * 0.47;
    },
    drag: function (api, x, y, dx) {
      div += dx * 0.00045;
      if (div < 1.7) div = 1.7; if (div > 2.9) div = 2.9;
      buildBuds();
    },
    tap: function (api, x, y) {
      if (dive) return;
      var best = -1, bd = 1e9, j, s = [0, 0, 0];
      for (j = 0; j < Math.min(N, 30); j++) {
        if (facing(budB[j][2]) < 0.15) continue;
        project(toParent(C0, j), s);
        var d = Math.hypot(s[0] - x, s[1] - y);
        if (d < bd) { bd = d; best = j; }
      }
      if (best < 0 || bd > api.min * 0.25) { flash = 0.6; return; }
      dive = { j: best, t: 0 };
    },
    mutate: function (api) {                         /* いろいろな角度の世界へ */
      var picks = [GA, 2.4 + (Math.random() - 0.5) * 0.12, Math.PI * 2 / (2 + Math.random() * 2.5), 1.74 + Math.random() * 0.9];
      div = picks[(Math.random() * picks.length) | 0];
      buildBuds(); flash = 0.8;
    },
    reset: function () { div = GA; dive = null; buildBuds(); flash = 1; },
    update: function (api, dt) {
      spin += dt * 0.07;
      /* 黄金角のすぐそばでは吸い寄せられる(指を離したあと) */
      var d = div - GA;
      if (!api.ptr.drag && Math.abs(d) < 0.006 && Math.abs(d) > 1e-5) { div -= d * Math.min(1, dt * 3); buildBuds(); }
      var g = Math.exp(-Math.pow(d / 0.006, 2));
      if (g > 0.9 && gold <= 0.9) flash = 1;
      gold = g;
      flash = Math.max(0, flash - dt * 0.9);
      if (dive) {
        dive.t += dt / 2.6;
        if (dive.t >= 1) { dive = null; flash = Math.max(flash, 0.4); }
      }
      var w = dive ? dive.t * dive.t * (3 - 2 * dive.t) : 0;
      setCam(w);
    },
    plot: function (api) {
      var n = (api.quality === 2 ? 9000 : 5000), k, q, j1, j2, j3, f, f2, P = tmp;
      var inDive = !!dive;
      for (k = 0; k < n; k++) {
        /* 一番小さい芽の円すいの表面に点を置き、3段ぶん親へ戻す */
        var r3 = Math.sqrt(Math.random()), a3 = Math.random() * 6.2832;
        q = [r3 * Math.cos(a3), r3 * Math.sin(a3), HC * (1 - r3)];
        j3 = sampleJ(); q = toParent(q, j3);
        j2 = sampleJ(); f2 = facing2(j2); q = toParent(q, j2);
        if (inDive && Math.random() < 0.4) {          /* もぐる先の芽は1段深く描く */
          j1 = sampleJ(); q = toParent(q, j1);
          q = toParent(q, dive.j); f = facing(budB[dive.j][2]);
        } else {
          j1 = sampleJ(); q = toParent(q, j1); f = facing(budB[j1][2]);
        }
        if (f < -0.05) continue;
        project(q, P);
        var h = 1 - r3;
        var c = (0.10 + 0.42 * h * (0.6 + 0.4 * f2) + 0.42 * gold) * (0.55 + 0.45 * Math.min(1, f + 0.2));
        api.dot(P[0], P[1], c, h > 0.86 && gold > 0.5);
      }
      if (flash > 0.01) api.glow(cx, cy - scale * 0.1, scale * 1.1, 0.85, 0.05 * flash);
    }
  };
  function facing2(j) { return Math.max(0, budB[j][2][2]); }
  NF.run(work);
})();
</script>
