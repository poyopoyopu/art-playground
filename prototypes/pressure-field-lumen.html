<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PRESSURE FIELD — LUMEN</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* PRESSURE FIELD — ChatGPT作。ap-kit.js統合: ChatGPT */
const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,marks=[],seed=Math.random()*1000,TAU=Math.PI*2;
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;let w=Math.floor(W*D),h=Math.floor(H*D);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}}
function mutate(){seed=Math.random()*9999;marks=[];for(let i=0;i<4;i++)marks.push({x:Math.random()*W,y:Math.random()*H,r:45+Math.random()*80,p:.45+Math.random()*.5});}
function reset(){marks=[]} function add(x,y){marks.push({x,y,r:55+Math.random()*55,p:.8+Math.random()*.35});if(marks.length>12)marks.shift();}
function field(x,y){let px=x,py=y,press=0;for(const m of marks){let dx=x-m.x,dy=y-m.y,d2=dx*dx+dy*dy,w=Math.exp(-d2/(m.r*m.r));press+=w*m.p;px+=(dx/(Math.sqrt(d2)+1))*w*m.p*38;py+=(dy/(Math.sqrt(d2)+1))*w*m.p*38;}return[px,py,press];}
function draw(phase){resize();ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#050609';ctx.fillRect(0,0,W,H);let t=phase/TAU,scale=Math.min(W,H);
for(let level=0;level<6;level++){let s=scale*Math.pow(1.7,-level)*1.35,step=Math.max(16,s*.12),drift=Math.sin(t*TAU+level*1.4)*s*.025;
for(let pass=0;pass<2;pass++){ctx.beginPath();
for(let x=-s;x<W+s;x+=step)for(let y=-s;y<H+s;y+=step){let q=field(x,y),px=q[0]+drift,py=q[1]-drift*.7,p=q[2],d=Math.hypot((px-W/2)*.93,py-H/2),ring=Math.sin(d/(s*.095)+level*.72+t*TAU*(level%2?-.35:.35)),edge=.5+.5*ring;let alpha=(pass?.018:.028)+edge*(pass?.028:.042)+p*(pass?.018:.032),hue=202+level*21+Math.sin(p*2+t*TAU)*24;ctx.strokeStyle='hsla('+hue+',48%,'+(58+edge*30)+'%,'+(alpha*1.45)+')';ctx.lineWidth=pass?1.9:.72;let r=step*(.38+p*.72);ctx.moveTo(px-r,py);ctx.lineTo(px+r,py);ctx.moveTo(px,py-r);ctx.lineTo(px,py+r);}ctx.stroke();}}
for(const m of marks)for(let k=0;k<8;k++){let rr=m.r*(.28+k*.145)*(1+.045*Math.sin(t*TAU+k));ctx.beginPath();for(let j=0;j<=128;j++){let a=j/128*TAU,local=field(m.x+Math.cos(a)*rr,m.y+Math.sin(a)*rr)[2],wob=1+local*.13+Math.sin(a*4+k+t*TAU)*.018,x=m.x+Math.cos(a)*rr*wob,y=m.y+Math.sin(a)*rr*wob;if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle='hsla('+(190+k*20)+',54%,'+(68+k*2)+'%,'+(.065+k*.017)+')';ctx.lineWidth=k<2?1.8:0.9+k*.22;ctx.stroke();
if(k===0){ctx.beginPath();ctx.arc(m.x,m.y,rr*.72,0,TAU);ctx.fillStyle='rgba(175,225,235,.028)';ctx.fill();}}}
let down=false;c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;down=true;add(e.clientX,e.clientY)});c.addEventListener('pointermove',e=>{if(!down)return;if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;add(e.clientX,e.clientY)});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointercancel',()=>down=false);
mutate();requestAnimationFrame(function loop(now){draw((now%7000)/7000*TAU);requestAnimationFrame(loop)});
APKit.init({canvas:c,gifName:'pressure-field-lumen-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(phase){draw(phase)},buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:reset}]});
</script></body></html>
