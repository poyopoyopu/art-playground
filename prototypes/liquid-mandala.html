<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIQUID MANDALA</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,cuts=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function draw(T=t){x.fillStyle='#03050b';x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,R0=Math.min(W,H)*.47,N=11;for(let r=5;r<R0;r+=4)for(let k=0;k<N;k++){let a=k*2*Math.PI/N+Math.sin(r*.025+T*.08)*.12,rad=r*(1+.15*Math.sin(a*5+r*.05)+.07*Math.sin(r*.13-T*.1)),px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;if(cuts.some(q=>Math.hypot(px-q.x,py-q.y)<q.r))continue;let h=(k*31+r*1.7+seed*100+T*5)%360;x.fillStyle=`hsla(${h},85%,${42+25*Math.sin(r*.08+k)}%,.65)`;x.beginPath();x.arc(px,py,2.2+3*Math.abs(Math.sin(r*.11+k)),0,7);x.fill()}for(const q of cuts){x.beginPath();x.arc(q.x,q.y,q.r*(1+.15*Math.sin(T+q.a)),0,7);x.fillStyle='#02030a';x.fill();x.strokeStyle=`hsla(${q.a*50+160},95%,70%,.7)`;x.stroke()}}function touch(px,py){cuts.push({x:px,y:py,r:30+Math.random()*80,a:Math.random()*6.28});if(cuts.length>8)cuts.shift()}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'liquid-mandala-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;cuts=[]}},{label:'↻',name:'reset',onClick:()=>cuts=[]}]});</script></body></html>
