<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOLTEN LATTICE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* MOLTEN LATTICE — ChatGPT作。格子が溶け、触れた場所で格子の位相と色相が永久にずれる。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;
uniform vec2 r;uniform float t,seed;uniform vec4 node[8];uniform int n;
vec3 pal(float h){return .5+.5*cos(6.2831853*(h+vec3(0.,.31,.63)));}
void main(){
 vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
 float phase=t*.18;
 for(int i=0;i<8;i++){if(i>=n)break;vec2 d=p-node[i].xy;float g=exp(-dot(d,d)/(.035+.025*node[i].z));float a=atan(d.y,d.x)+node[i].w;p+=vec2(cos(a),sin(a))*g*.22*node[i].z;}
 float gx=sin((p.x+sin(p.y*2.+phase)*.08)*8.5+phase);
 float gy=sin((p.y+sin(p.x*2.-phase)*.08)*8.5-phase);
 float cell=gx*gy;
 float cross=max(abs(gx),abs(gy));
 float melt=0.;
 for(int i=0;i<5;i++){float f=float(i);melt+=sin((p.x+p.y)*pow(2.,f)*.55+phase*(f+1.)+seed)*.025/pow(2.,f);}
 float v=cell*.5+melt;
 float hue=v*.18+phase*.03+seed*.002;
 vec3 col=pal(hue);
 float grid=pow(max(0.,1.-cross),8.);
 float channels=smoothstep(.15,.9,abs(cell));
 col=mix(vec3(.015,.018,.03),col,.42+.48*channels);
 col+=pal(hue+.16)*grid*.7;
 float sheen=pow(max(0.,1.-abs(gx*gy)),12.);
 col+=vec3(1.)*sheen*.16;
 o=vec4(pow(max(col,0.),vec3(.86)),1.);
}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));
let U={};for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''))}
let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*60,nodes=[],paused=false,start=performance.now();
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();
function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}
function draw(ph){gl.useProgram(pr);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(32);nodes.forEach((q,i)=>a.set(q,i*4));gl.uniform4fv(U.node,a);gl.uniform1i(U.n,nodes.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);nodes.push([q[0],q[1],.65+.5*Math.random(),Math.random()*6.283]);if(nodes.length>8)nodes.shift()});
function loop(now){if(!paused)draw((now-start)*.0003);requestAnimationFrame(loop)}requestAnimationFrame(loop);
APKit.init({canvas:c,gifName:'molten-lattice-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[
{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*80}},
{label:'↻',name:'reset',onClick:()=>{nodes=[]}}]});
</script></body></html>
