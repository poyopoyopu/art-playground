<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SANCTUARY TITHE</title>
<script src="../ap-kit.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a}body{touch-action:none}canvas{width:100%;height:100%;display:block}</style>
</head>
<body><canvas id="c"></canvas><script>
/* CHATGPT — SANCTUARY TITHE
   WORLD LAW: permanence is not free. Every sanctuary steals order from the
   temporary world. The more you protect one place, the more another place
   must decay. Two sanctuaries touching redistribute their accumulated history.
*/
const c=document.querySelector('#c'),g=c.getContext('2d'),TAU=Math.PI*2;
let W=0,H=0,D=1,seed=0,stones=[],dust=[],press=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function rnd(){let t=Math.sin(seed++*127.1)*43758.5453;return t-Math.floor(t)}
function makeStone(x,y,power=1){return{x,y,p:power,age:0,rot:rnd()*TAU,h:205+rnd()*80}}
function reset(){seed=3;stones=[];dust=[];for(let i=0;i<6;i++)stones.push(makeStone(W*(.18+.64*rnd()),H*(.18+.64*rnd()),.65+.5*rnd()));for(let i=0;i<170;i++)dust.push({x:rnd()*W,y:rnd()*H,a:rnd()*TAU,r:2+rnd()*8,s:.1+rnd()*.35,h:190+rnd()*120})}
reset();
function poly(cx,cy,r,n,rot){g.beginPath();for(let i=0;i<n;i++){let a=rot+i*TAU/n,rr=r*(.82+.18*Math.sin(i*7.3+rot*2));let x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}
function sanctuary(s,t){
 let R=12+48*Math.sqrt(s.p), levels=Math.min(6,2+Math.floor(s.p*2));
 g.save();g.translate(s.x,s.y);g.rotate(s.rot+t*.04);
 for(let q=0;q<levels;q++){
   let r=R*(1-q*.135),n=4+(q%3),rot=(q&1)*Math.PI/n;
   poly(0,0,r,n,rot);g.strokeStyle=`hsla(${s.h+q*11},85%,${62-q*4}%,${.72-q*.07})`;g.lineWidth=1.1+q*.22;g.stroke();
   if(q>0){g.beginPath();g.arc(0,0,r*.38,0,TAU);g.strokeStyle=`hsla(${s.h+q*18},90%,70%,.16)`;g.stroke()}
 }
 g.restore();
}
function frame(loop=false,phase=0){
 let t=loop?phase:performance.now()*.00008;
 g.fillStyle='#05030a';g.fillRect(0,0,W,H);
 // temporary world: it never repeats exactly in normal play
 for(let d of dust){d.a+=d.s*.004;d.x+=Math.cos(d.a+t*3)*d.s;d.y+=Math.sin(d.a+t*2)*d.s;if(d.x<0)d.x=W;if(d.x>W)d.x=0;if(d.y<0)d.y=H;if(d.y>H)d.y=0;
   g.beginPath();g.arc(d.x,d.y,d.r*.35,0,TAU);g.fillStyle=`hsla(${d.h},70%,65%,.16)`;g.fill();
 }
 // sanctuaries slowly rotate; their stored power makes them steal nearby dust
 for(let i=0;i<stones.length;i++){
   let s=stones[i];s.age+=.0007;s.rot+=.00005*(i%2?1:-1);
   let R=18+42*Math.sqrt(s.p);
   for(let j=dust.length-1;j>=0;j--){let d=dust[j],dx=s.x-d.x,dy=s.y-d.y,dist=Math.hypot(dx,dy);if(dist<R*3){let f=.0007*s.p*(1-dist/(R*3));d.x+=(dx/(dist||1))*f*20;d.y+=(dy/(dist||1))*f*20;if(dist<R*.62){s.p=Math.min(3.8,s.p+.00012);dust.splice(j,1)}}}
   sanctuary(s,t);
 }
 // contact between sanctuaries: history is pooled, shape is reborn
 for(let i=0;i<stones.length;i++)for(let j=i+1;j<stones.length;j++){
   let a=stones[i],b=stones[j],d=Math.hypot(a.x-b.x,a.y-b.y),lim=22+30*(Math.sqrt(a.p)+Math.sqrt(b.p));
   if(d<lim){let total=a.p+b.p; a.x=(a.x*a.p+b.x*b.p)/total;a.y=(a.y*a.p+b.y*b.p)/total;a.p=Math.min(4.2,total*.76);a.h=(a.h+b.h)/2+35;a.rot+=(b.rot-a.rot)*.5;stones.splice(j,1);j--;}
 }
 if(press){g.beginPath();g.arc(press.x,press.y,6+18*Math.sin(press.t),0,TAU);g.strokeStyle='rgba(255,255,255,.35)';g.stroke()}
}
function touch(x,y){if(APKit.isUI(x,y))return;let hit=null,best=1e9;for(let s of stones){let d=Math.hypot(s.x-x,s.y-y);if(d<best){best=d;hit=s}}
 if(hit&&best<130){ // touch doesn't create a decoration: it changes ownership
   hit.x=x;hit.y=y;hit.p=Math.min(4.2,hit.p+.55);hit.rot+=Math.PI/4; 
 }else{stones.push(makeStone(x,y,1.05));if(stones.length>10)stones.shift()}
 press={x,y,t:0};
}
c.addEventListener('pointerdown',e=>touch(e.clientX,e.clientY));
c.addEventListener('pointermove',e=>{if(e.buttons){touch(e.clientX,e.clientY)}});
APKit.init({canvas:c,gifName:'sanctuary-tithe-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>{seed=3;frame(true,p)},buttons:[
 {label:'✦',name:'mutate',onClick:()=>{for(let s of stones){s.h=(s.h+40+Math.random()*140)%360;s.rot+=Math.random()*TAU}}},
 {label:'↻',name:'reset',onClick:reset}
]});
function loop(){if(press){press.t+=.035;if(press.t>Math.PI*2)press=null}frame();requestAnimationFrame(loop)}loop();
</script></body></html>
