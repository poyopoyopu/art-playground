<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>SPIRAL</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#08060a}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,turn=4;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#08060a';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let i=0;i<900;i++){let q=i/900,a=q*6.28*turn+p*6,r=q*S*.45,x=W/2+Math.cos(a)*r,y=H/2+Math.sin(a)*r;g.fillStyle=`hsla(${270+q*90},80%,70%,.5)`;g.fillRect(x,y,2,2)}}function mu(){turn=1+Math.random()*10}APKit.init({canvas:c,gifName:'spiral-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>turn=4}]});draw(0)</script>
