<!-- 2026/11/28 おっちゃん「流石に横は無理かな？あとは10秒前から少しアクション変えて欲しいな」→ 1分ごとに 下へ→右へ→上へ→左へ と回る(縦⇄横は重ねて入れ替え)。毎分50秒から雨が速く・長く・明るくなり、切り替わって3秒で戻る。?m=0〜3で向き固定、?pre=1で10秒前の状態を固定 -->
<!-- 2026/11/28 おっちゃん「もう時刻の表示やめて、1分毎に下からの雨に切り替えてみて」→ 時刻の形は出さない。偶数分は上から降り、奇数分は下から昇る雨。分が変わると約1.6秒で減速して止まり、逆向きに動き出す(?up=1で常に下から) -->
<!-- 2026/11/28 おっちゃん「微妙だなぁー、違う色で流れるは？」→ 影絵をやめ、時・分の形の所だけ、降っている雨が金色に変わって流れる(雨そのものは止まらない) -->

<!-- 2026/11/28 おっちゃん「下の光が強いかな」→ 地面に映る灯り・波紋・霧・光の柱の根元・秒の大きな波紋・下の方の雨の明るさを弱めた -->

<!-- 2026/11/28 おっちゃん「ただの雨だな」→ 毎分、ばらばらに降る雨粒の一部が一瞬で集まって時刻(時・分)の数字になり、しばらく保ってから崩れてまた雨に戻る(量子が「測定」で一つの形に決まる見立て)。
     集まる先は、その分の時刻を画面に描いて拾った点。粒ごとに集まり始めるタイミングがずれる。指でなぞると、数字の粒も散ってまた集まる。確認用: ?g=1 で常に集まった状態。
<!-- 2026/11/28 作り直し(おっちゃん「やるならもっとリアルな雨っぽくしてよ」): 点線のMatrix風をやめ、本物の雨の見え方にした。
     雨粒は「動きでのびた線」(シャッターが開いている間に落ちた距離=速さ×露光)。手前ほど速く長く太く明るい、奥は細く淡く霧のよう。
     ごく手前の粒だけピントが外れて太くにじむ。風は時間でゆっくり強弱し、手前の粒ほど大きくなびく。
     粒は地面の高さまで落ちて消え、地面(奥ほど高い位置)に楕円の波紋が二重に広がる。濡れた地面に色とりどりの灯りが映る。
     雨は虹色の灯りに照らされていて、色は横位置で決まる(左=橙・赤、中=紫・青、右=シアン・緑)。
     時計: 横幅が0〜59の目盛り。光の柱(雨を明るく照らす光の筋)=いまの分(1時間かけて左→右)。上から落ちる明るい一滴=いまの秒で、毎秒別の位置の地面に大きな波紋を広げる。
     ✦=虹の色をずらす / ↻=元に戻す。なぞると雨が横に流れる。確認用: ?t=HH:MM:SS でその時刻から進む。WebGL2・音なし・Wake Lock・録画用にpreserveDrawingBuffer -->

<script>
(function(){

var Q=new URLSearchParams(location.search);

// ---------- 共通のGLSL: 横位置→虹の色 ----------
var COMMON=
'float hueOf(float x){\n'+
' float h;\n'+
' if(x<.12)h=mix(.12,0.,x/.12);\n'+
' else if(x<.3)h=mix(0.,-.12,(x-.12)/.18);\n'+
' else if(x<.45)h=mix(-.12,-.24,(x-.3)/.15);\n'+
' else if(x<.6)h=mix(-.24,-.38,(x-.45)/.15);\n'+

'vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}\n'+
'float hash(float n){return fract(sin(n*127.1+311.7)*43758.5453);}\n';

function prog(vs,fs){
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);

  for(var i=0;i<n;i++){var inf=gl.getActiveUniform(p,i);u[inf.name]=gl.getUniformLocation(p,inf.name);}
  return {p:p,u:u};}

// ---------- 背景: 光の柱の霞 + 濡れた地面(映り込み・波紋) + いまの秒の一滴 ----------
var bgP=prog(
'#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}',
'#version 300 es\nprecision highp float;\nuniform vec2 u_res;uniform float u_t,u_sec,u_min,u_hue,u_fl,u_fx;out vec4 o;\n'+COMMON+
'float vn(float p){float i=floor(p),f=fract(p);return mix(hash(i),hash(i+1.),f*f*(3.-2.*f));}\n'+
'float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n'+
'float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x),mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x),f.y);}\n'+
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n2(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}\n'+
'const float DK[4]=float[4](.08,.34,.64,.95);\n'+
'vec3 ripples(float x,float g,float asp){\n'+
' vec3 acc=vec3(0.);\n'+
' for(int k=0;k<4;k++){\n'+
'  float dk=DK[k];float gk=1.-mix(.84,.985,dk);float sq=.17+.1*dk;float R=mix(.012,.07,dk);\n'+
'  if(abs(g-gk)>R*sq*1.15+.02)continue;\n'+
'  float N=floor(mix(30.,8.,dk));float ci=floor(x*N);\n'+
'  for(int j=-1;j<=1;j++){\n'+
'   float c=ci+float(j);float h1=hash(c*7.3+float(k)*19.1),h2=hash(c*3.7+float(k)*5.5+1.);\n'+
'   float xc=(c+h1)/N;float ph=fract(u_t*(.38+.55*h2)+h2*13.+h1*5.);\n'+
'   float dxp=(x-xc)*asp,dyp=(g-gk)/sq;float dist=sqrt(dxp*dxp+dyp*dyp);\n'+
'   float w=.0012+.0011*dk;float r=ph*R;float r2=ph*R*.55;\n'+
'   float ring=exp(-(dist-r)*(dist-r)/(2.*w*w))*pow(1.-ph,1.5);\n'+
'   float ring2=exp(-(dist-r2)*(dist-r2)/(2.*w*w))*pow(1.-ph,2.2)*.6;\n'+
'   float fl=exp(-dist*dist/(2.*.0022*.0022))*exp(-ph*26.);\n'+
'   float sp=0.;\n'+
'   for(int q=0;q<4;q++){float fq=float(q);float vx=(hash(c*5.1+fq*3.3+float(k))-.5)*1.6;float vy=.6+.7*hash(c*2.9+fq*7.7);\n'+
'    float tt=ph*.5;float px=xc+vx*tt*R/asp*3.;float py=gk+(vy*tt-2.4*tt*tt)*R*1.1;\n'+
'    float ddx=(x-px)*asp,ddy=g-py;sp+=exp(-(ddx*ddx+ddy*ddy)/(2.*.0011*.0011))*(1.-ph*2.)*step(ph,.5);}\n'+
'   acc+=hsv(hueOf(clamp(xc,0.,1.)),.5,1.)*(ring+ring2+fl*1.3+sp*1.4)*(.3+.7*dk);\n'+
'  }}\n'+
' return acc;}\n'+
'void main(){\n'+
' vec2 uv=gl_FragCoord.xy/u_res;float asp=u_res.x/u_res.y;float x=uv.x,g=uv.y;\n'+
' vec3 c=vec3(.004,.004,.018);\n'+
' float cy=1.-g;vec2 cp=vec2(x*asp*2.6+u_t*.012,cy*3.2-u_t*.004);\n'+
' float cl=fbm(cp+vec2(0.,fbm(cp*.7+u_t*.01)*.8));float cl2=fbm(cp+vec2(0.,.08));\n'+
' float cmask=smoothstep(.55,.04,cy)*smoothstep(.3,.58,cl);\n'+
' float rim=max(cl2-cl,0.)*5.5+max(cl-cl2,0.)*1.5;\n'+
' vec3 ccol=hsv(hueOf(x),.7,1.);\n'+
'\n'+                    // 虹色の灯りに照らされた雲
' float lg=exp(-(pow((x-u_fx)*asp*1.4,2.)+pow(cy-.18,2.)*7.))*u_fl;\n'+
'\n'+            // 稲光(雲の中が光る)
' float hz=mix(hash(floor(x*26.)),hash(floor(x*26.)+1.),smoothstep(0.,1.,fract(x*26.)));\n'+
' c+=hsv(hueOf(x),.75,1.)*(.012+.03*hz*hz)*(.35+.65*(1.-g))*(.7+.3*sin(u_t*.18+x*8.));\n'+     // 霧に滲む灯りの色
' float gnd=smoothstep(.17,.15,g);\n'+                                                            // 地面の帯(g<.16)
' float xw_=x+.0025*sin(g*70.+u_t*1.7)*smoothstep(.2,0.,g);\n'+
' float hh=mix(vn(xw_*36.+u_t*.04),vn(xw_*120.+7.),.45);hh=hh*hh*1.9;\n'+
' hh*=.75+.25*sin(u_t*(.6+vn(x*40.)*1.2)+vn(x*40.+3.)*20.);\n'+
' float I=exp(-g/(.03+.17*hh))*(.14+.8*hh);\n'+
' c+=hsv(hueOf(x),.88,1.)*I*.16*(.35+.65*gnd);\n'+                                                // 濡れた地面に映る灯り
' c+=hsv(hueOf(x),.6,1.)*exp(-(g-.16)*(g-.16)/.0009)*.035*(.5+hz);\n'+                             // 地平のにじみ
' float mx=x*7.+u_t*.05;float mn_=mix(hash(floor(mx)),hash(floor(mx)+1.),smoothstep(0.,1.,fract(mx)));\n'+
' float mist=mn_*exp(-g/.1)*(.5+.5*sin(u_t*.2+x*5.));\n'+
' c+=hsv(hueOf(x),.55,1.)*mist*.045;\n'+                                                           // 地面をはう霧
' float m=(u_min+u_sec/60.)/60.;float dm=(x-m)*asp;\n'+
' float pil=exp(-dm*dm/(2.*.0036*.0036))*exp(-g/.7)*.5+exp(-dm*dm/(2.*.045*.045))*exp(-g/.5)*.12+exp(-dm*dm/(2.*.012*.012))*exp(-g/.05)*.1;\n'+
' c+=mix(vec3(1.),hsv(hueOf(m),.5,1.),.4)*pil;\n'+                                                // 雨を照らす光の柱=分
' c+=ripples(x,g,asp)*(.2+.15*gnd);\n'+
' float s=fract(u_sec),idx=floor(u_sec);float xs=(idx+.5)/60.;float yo=s*s;float go=1.-yo*.985;\n'+
' float dx=(x-xs)*asp;vec3 oc=mix(vec3(1.),hsv(hueOf(xs),.7,1.),.5);\n'+
' float head=exp(-(dx*dx+(g-go)*(g-go)*.35)/(2.*.0042*.0042));\n'+
' float tail=step(go,g)*exp(-(g-go)/.05)*exp(-dx*dx/(2.*.0011*.0011))*.7;\n'+
' c+=oc*(head*.8+tail);\n'+                                                                       // いまの秒の一滴
' float xp=(mod(idx-1.,60.)+.5)/60.;float gn=1.-.985;\n'+
' float dxp=(x-xp)*asp,dyp=(g-gn)/.26;float dist=sqrt(dxp*dxp+dyp*dyp);\n'+
' float r=s*.2;float wr=.0022+.003*s;\n'+
' float big=exp(-(dist-r)*(dist-r)/(2.*wr*wr))*pow(1.-s,1.2)+exp(-(dist-r*.6)*(dist-r*.6)/(2.*wr*wr))*pow(1.-s,1.8)*.6+exp(-dist*dist/(2.*.004*.004))*exp(-s*14.)*1.2;\n'+
' c+=mix(vec3(1.),hsv(hueOf(xp),.6,1.),.4)*big*.3;\n'+                                              // 地面に大きく広がる波紋=秒の合図
' c*=1.-.35*pow(abs(uv.x-.5)*2.,3.);\n'+
' c*=.86+.14*smoothstep(1.,.8,g);\n'+                                                           // 上は暗い夜空
' c=1.-exp(-c*1.4);\n'+
' c+=(hash(dot(gl_FragCoord.xy,vec2(12.9898,78.233))+u_t)-.5)/255.;\n'+
' o=vec4(c,1.);}');

// ---------- 雨粒: 動きでのびた線(1粒=1つの板) ----------
var rainP=prog(
'#version 300 es\nprecision highp float;\nlayout(location=0) in vec4 a;\nlayout(location=1) in vec3 b;\nuniform vec2 u_res;uniform float u_t,u_dpr,u_hue,u_wind,u_um,u_fl,u_g,u_ph,u_dir,u_hz,u_am,u_pre;uniform vec3 u_p;\n'+
'out vec2 v_q;out vec3 v_col;out float v_a;\n'+COMMON+
'void main(){\n'+
' float d=a.y,seed=fract(a.w*13.7);float W=u_res.x,H=u_res.y,asp=W/H;\n'+
' float spd=mix(.3,1.15,d)*(.9+.2*seed);float yl=mix(.84,.985,d);\n'+
' float y=yl*fract(a.z+u_ph*spd/yl);\n'+   // u_ph=向き付きで進む時間(下からの雨の分は逆に進む)
' float kk=.45+.55*d;\n'+
' float xw=a.x*1.3-.15;float xs=xw+u_wind*kk*y/asp;\n'+
' vec2 head=u_hz>.5?vec2(y/yl*W,xs*H):vec2(xs*W,y*H);\n'+   // 横の雨: 流れる向きを横に、列を縦に並べ替える
' float gi=b.z*smoothstep(0.,1.,clamp(u_g*1.5-seed*.5,0.,1.));\n'+
' vec2 tgt=vec2(b.x*W,b.y*H)+vec2(sin(u_t*3.1+a.w*40.),cos(u_t*2.7+a.z*30.))*1.2*u_dpr;\n'+
' head=mix(head,tgt,gi);\n'+
' float dxt=xs-u_p.x;float tw=exp(-dxt*dxt/.0144)*u_p.z*exp(-abs(y-u_p.y)*2.6);\n'+
' head.x+=sign(dxt)*tw*.05*W*(.4+d);\n'+
' vec2 dir=(u_hz>.5?normalize(vec2(1.,u_wind*kk*.6)):normalize(mix(vec2(u_wind*kk,1.),vec2(0.,1.),gi)))*(u_dir<0.?-1.:1.);vec2 perp=vec2(-dir.y,dir.x);\n'+
' float len=H*(1.+.25*u_hz)*(spd*.042*abs(u_dir)*(1.+.9*u_pre)+.004)*(.9+.2*seed)*(1.-.94*gi);\n'+
' float oof=smoothstep(.93,.97,d);\n'+
' float hw=mix((.5+1.0*pow(d,1.2))*u_dpr*(1.+4.5*oof),.95*u_dpr,gi);float pad=hw*1.6;\n'+
' int vid=gl_VertexID;float t=float(vid&1);float ac=float(vid>>1)*2.-1.;\n'+
' vec2 P=head+dir*pad-dir*(len+2.*pad)*t+perp*ac*hw*1.9;\n'+
' v_q=vec2(t,ac);\n'+
' float hv=hash(a.w*7.1+a.z*3.3);\n'+
' float sheet=.7+.3*sin(xs*5.5-u_t*.45+y*3.+d*4.)*sin(xs*2.1+u_t*.17);\n'+
' float base=mix(.05,.42,pow(d,1.35))*(.4+.6*hv)*sheet;\n'+
' float glint=pow(max(0.,sin(u_t*(2.+seed*3.)+seed*60.)),16.)*step(.4,d)*.9;\n'+
' float xc=clamp(xs,0.,1.);float sd=(xc-u_um)*asp;\n'+
' float shaft=1.+exp(-sd*sd/(2.*.04*.04))*1.5*(1.-u_hz);\n'+
' float aFall=(base*shaft+glint*base*2.)*smoothstep(yl,yl-.02,y)*smoothstep(0.,.07,y)*(1.-.93*oof)*(1.+tw*1.4)*(1.+u_fl*.9)*(1.+.08*smoothstep(.4,0.,y));\n'+
' float aForm=.62*(.75+.5*hv);\n'+
' v_a=mix(aFall,aForm,gi)*u_am*(1.+.8*u_pre)*(1.+.9*u_hz);\n'+
' v_col=hsv(hueOf(clamp(mix(xc,b.x,gi),0.,1.)),mix(.74-.42*d*d,.55,gi),1.);\n'+
' gl_Position=vec4(P.x/W*2.-1.,1.-P.y/H*2.,0.,1.);}',
'#version 300 es\nprecision highp float;in vec2 v_q;in vec3 v_col;in float v_a;out vec4 o;\n'+
'void main(){float acr=exp(-v_q.y*v_q.y*3.2);\n'+
' float al=pow(max(1.-v_q.x,0.),.7)*smoothstep(0.,.1,v_q.x)*smoothstep(1.,.9,v_q.x);\n'+
' float hd=smoothstep(.35,0.,v_q.x)*.55;\n'+
' o=vec4(mix(v_col,vec3(1.),hd)*acr*al*v_a,1.);}');

// ---------- ブルーム(光のにじみ)用の描画先と、ぼかし・合成 ----------
var FS_HEAD='#version 300 es\nprecision highp float;\n';
var blurP=prog('#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}',
FS_HEAD+'uniform sampler2D u_tex;uniform vec2 u_step,u_inv;uniform float u_thr;out vec4 o;\n'+
'vec3 f(vec3 c){return max(c-u_thr,0.)*mix(1.,1.6,step(.001,u_thr));}\n'+
'void main(){vec2 uv=gl_FragCoord.xy*u_inv;vec3 s=f(texture(u_tex,uv).rgb)*.227;\n'+
' s+=(f(texture(u_tex,uv+u_step).rgb)+f(texture(u_tex,uv-u_step).rgb))*.194;\n'+
' s+=(f(texture(u_tex,uv+u_step*2.).rgb)+f(texture(u_tex,uv-u_step*2.).rgb))*.121;\n'+
' s+=(f(texture(u_tex,uv+u_step*3.).rgb)+f(texture(u_tex,uv-u_step*3.).rgb))*.054;\n'+
' s+=(f(texture(u_tex,uv+u_step*4.).rgb)+f(texture(u_tex,uv-u_step*4.).rgb))*.016;\n'+
' o=vec4(s,1.);}');
var compP=prog('#version 300 es\nlayout(location=0) in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}',

  gl.uniform2f(compP.u.u_inv,1/W,1/H);gl.uniform1f(compP.u.u_cell,Math.max(2,Math.round(GRAIN[gi]*W/innerWidth)));gl.uniform1f(compP.u.u_led,(LED&&GRAIN[gi]>0)?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);gl.activeTexture(gl.TEXTURE0);
  frames++;acc+=dt;if(frames===90){if(acc/90>.021&&qscale>.6){qscale*=.85;resize();}frames=0;acc=0;}
  requestAnimationFrame(frame);}
