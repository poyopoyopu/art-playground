<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VOID</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
/* VOID — ChatGPT作。色や形を描くのではなく、世界に生まれた穴が自己相似に穴を開け続ける。 */
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const F=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform vec2 r;uniform float t,seed;uniform vec4 press[8];uniform int n;
vec3 pal(float h){float z=fract(h+seed*.017);return .5+.5*cos(6.2831853*(z+vec3(0.,.31,.63)));}
void main(){vec2 p=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);float hole=0.,depth=0.,touch=0.;
for(int i=0;i<8;i++){if(i>=n)break;vec2 d=p-press[i].xy;float g=exp(-dot(d,d)/(.06+.025*press[i].z));touch+=g*(.8+press[i].z);}
vec2 q=p;
for(int k=0;k<7;k++){float fk=float(k);float sc=1.7+fk*.48;vec2 z=q*sc+vec2(sin(t*.07+fk),cos(t*.09-fk))*.08;vec2 cell=fract(z)-.5;float d=length(cell);float radius=.28+.055*sin(seed+fk*1.7+touch*.4);float h=smoothstep(radius,radius-.035,d);hole=max(hole,h*(.8-.065*fk));depth+=h*(.12+.02*fk);q=cell*2.05+q*.14;}
float rim=smoothstep(.045,0.,abs(hole-.5));float darkness=smoothstep(.48,.82,hole);float grain=sin(q.x*31.+q.y*23.+t*.12)*.035;float spectrum=p.x*.24+p.y*.17+depth*.8+grain+seed*.01;vec3 col=pal(spectrum);col=mix(col,vec3(.005,.007,.012),darkness);col+=vec3(1.)*rim*.3;col=.02+col*1.2;o=vec4(pow(max(col,0.),vec3(.78)),1.);}`;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(pr,0,'p');gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));let U={};for(let i=0;i<gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(pr,i);U[a.name]=gl.getUniformLocation(pr,a.name.replace(/\[0\]$/,''))}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);let W,H,D=1,seed=Math.random()*70,press=[],paused=false,currentPhase=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(1.5,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();function pos(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}function draw(ph){gl.useProgram(pr);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(32);press.forEach((q,i)=>a.set(q,i*4));gl.uniform4fv(U.press,a);gl.uniform1i(U.n,press.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=pos(e.clientX,e.clientY);press.push([q[0],q[1],.7+.6*Math.random(),currentPhase]);if(press.length>8)press.shift()});let start=performance.now();function loop(now){currentPhase=(now-start)*.00035;if(!paused)draw(currentPhase);requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'void-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[{label:'✦',name:'mutate',onClick:()=>seed=Math.random()*90},{label:'↻',name:'reset',onClick:()=>press=[]}]});
</script></body></html>
