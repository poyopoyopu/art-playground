<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>VOID</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#ddd}canvas{display:block;width:100%;height:100%}</style><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,n=9;function sz(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',sz);sz();function draw(p){g.fillStyle='#ddd';g.fillRect(0,0,W,H);let S=Math.min(W,H);for(let i=0;i<n;i++){let a=i*6.28/n+p*6,r=S*(.08+i*.055);g.beginPath();g.arc(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r,r*.28,0,7);g.fillStyle='#111';g.fill()}g.beginPath();g.arc(W/2,H/2,S*.12+Math.sin(p*6)*S*.03,0,7);g.fillStyle='#ddd';g.fill()}function mu(){n=3+Math.floor(Math.random()*15)}APKit.init({canvas:c,gifName:'void-loop',clockFormat:'spec',loopFrame:draw,buttons:[{label:'✦',name:'mutate',onClick:mu},{label:'↻',name:'reset',onClick:()=>n=9}]});draw(0)</script>
