<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CELLULAR ZOO</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false});let W,H,d=1,t=0,seed=Math.random()*9,cells=[];function R(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',R);R();function init(){cells=[];for(let i=0;i<48;i++)cells.push({x:Math.random()*W,y:Math.random()*H,r:18+Math.random()*70,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,h:Math.random()*360})}init();function draw(T=t){x.fillStyle='#040608';x.fillRect(0,0,W,H);for(const a of cells){a.x+=a.vx;a.y+=a.vy;if(a.x<-80)a.x=W+80;if(a.x>W+80)a.x=-80;if(a.y<-80)a.y=H+80;if(a.y>H+80)a.y=-80}for(let y=0;y<H;y+=6)for(let xx=0;xx<W;xx+=6){let best=1e9,second=1e9,bi=null;for(const a of cells){let q=Math.hypot(xx-a.x,y-a.y)-a.r;if(q<best){second=best;best=q;bi=a}else if(q<second)second=q}let seam=Math.min(1,Math.max(0,(second-best)/18)),body=best<0;if(body||seam>.35){let h=(bi.h+T*6+best*1.7)%360;x.fillStyle=body?`hsla(${h},72%,${40+seam*25}%,.86)`: `hsla(${h+90},90%,70%,${seam*.8})`;x.fillRect(xx,y,6,6)}}}function touch(px,py){let target=cells.reduce((a,b)=>Math.hypot(b.x-px,b.y-py)<Math.hypot(a.x-px,a.y-py)?b:a);target.r=Math.min(150,target.r+28);target.h=(target.h+70)%360;target.vx+=(target.x-px)*.0007;target.vy+=(target.y-py)*.0007}c.onpointerdown=e=>{touch(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(e.buttons)touch(e.clientX,e.clientY)};function loop(p){draw(p)}function anim(ms){t=ms*.001;draw();requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'cellular-zoo-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:loop,buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*999;init()}},{label:'↻',name:'reset',onClick:init}]});</script></body></html>
