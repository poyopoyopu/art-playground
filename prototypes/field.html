<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FIELD</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050505}canvas{display:block;width:100%;height:100%}</style><body><canvas id=c></canvas><script src="../ap-kit.js"></script><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let W,H,d,seed=Math.random()*9e3;function size(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function draw(p=performance.now()/6000){g.fillStyle='#050505';g.fillRect(0,0,W,H);let s=Math.min(W,H);for(let y=-s;y<H+s;y+=18)for(let x=-s;x<W+s;x+=18){let q=Math.sin(x*.012+Math.sin(y*.009+p)*2+seed)+Math.cos(y*.014+p*1.7+seed);let a=q*1.8;g.strokeStyle=`hsla(${190+q*25},70%,70%,.18)`;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*16,y+Math.sin(a)*16);g.stroke()}}function mutate(){seed=Math.random()*9e3;draw()}APKit.init({canvas:c,gifName:'field-loop',clockFormat:'spec',loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:mutate},{label:'↻',name:'reset',onClick:()=>{seed=1;draw()}}]});draw();</script>
