<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHROMATIC FAULT</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>'use strict';const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false});if(!gl)throw Error('WebGL2 unavailable');const V=`#version 300 es
in vec2 p;out vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`,F=`#version 300 es
precision highp float;out vec4 O;in vec2 v;uniform vec2 R,P;uniform float T,S;uniform vec4 A[8];uniform int N;#define TAU 6.28318530718
float h(float p){p=fract(p*123.34);p+=dot(p,p+45.32);return fract(p*p);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i.x+31.7*i.y),h(i.x+31.7*i.y+1.),f.x),mix(h(i.x+31.7*(i.y+1.)),h(i.x+31.7*(i.y+1.)+1.),f.x),f.y);}float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*n(p);p=mat2(1.6,-1.2,1.2,1.6)*p;a*=.5;}return s;}vec3 pal(float x){return vec3(.04,.02,.07)+vec3(.35,.28,.2)*cos(TAU*(vec3(.72,.38,.14)*x+vec3(.0,.22,.61)));}float tf(vec2 p){float q=0.;for(int i=0;i<8;i++){if(i>=N)break;vec2 d=p-A[i].xy;q+=exp(-dot(d,d)/(A[i].z*A[i].z))*(.5+.5*sin(A[i].w));}return q;}
void main(){vec2 p=(v-.5)*vec2(R.x/R.y,1.);float t=tf(p);p*=2.2;float z=fb(p*.72+T*.018);p+=vec2(sin(p.y*2.1+z*6.+T*.05),cos(p.x*2.4-z*5.-T*.04))*(.34+t*.38);float g=sin((p.x+p.y*1.7+fb(p*3.)*1.8)*8.+T*.06)+sin((p.x-p.y)*13.+fb(p*4.)*5.);float crack=smoothstep(.74,.98,abs(sin(g*3.)));float voids=smoothstep(.65,.93,fb(p*1.15)+t*.8);vec3 col=pal(fb(p*2.5)+.25*t);col+=crack*vec3(1.2,.25,.05);col*=.72+1.4*fb(p*4.);col*=1.-voids*.78;O=vec4(col,1.);}`;function sh(t,s){let q=gl.createShader(t);gl.shaderSource(q,s);gl.compileShader(q);if(!gl.getShaderParameter(q,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(q));return q}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,V));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,F));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);let u=['R','P','T','S','A[0]','N'].reduce((o,k)=>(o[k]=gl.getUniformLocation(pr,k),o),{});let W,H,D,seed=Math.random()*99999,pts=[],t0=performance.now(),P={x:0,y:0};function rs(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',rs);rs();function draw(t){gl.uniform2f(u.R,W,H);gl.uniform2f(u.P,P.x/W-.5,1-P.y/H-.5);gl.uniform1f(u.T,t);gl.uniform1f(u.S,seed);let a=new Float32Array(32);pts.forEach((q,i)=>{if(i<8){a[i*4]=q.x/W-.5;a[i*4+1]=1-q.y/H-.5;a[i*4+2]=q.r/Math.max(W,H);a[i*4+3]=q.phase}});gl.uniform4fv(u['A[0]'],a);gl.uniform1i(u.N,Math.min(8,pts.length));gl.drawArrays(gl.TRIANGLES,0,3)}function add(x,y){pts.push({x,y,r:70+Math.random()*120,phase:Math.random()*TAU});if(pts.length>8)pts.shift()}let down=0;c.onpointerdown=e=>{if(APKit.isUI(e.clientX,e.clientY))return;down=1;P.x=e.clientX;P.y=e.clientY;add(e.clientX,e.clientY);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{P.x=e.clientX;P.y=e.clientY;if(down&&Math.random()<.45)add(e.clientX,e.clientY)};c.onpointerup=()=>down=0;c.onpointercancel=()=>down=0;function anim(ms){draw((ms-t0)*.00008);requestAnimationFrame(anim)}requestAnimationFrame(anim);APKit.init({canvas:c,gifName:'chromatic-fault-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:p=>draw(p),buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99999;pts=[]}},{label:'↻',name:'reset',onClick:()=>pts=[]}]});</script></body></html>
