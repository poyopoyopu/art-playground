<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL ABYSS</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),gl=c.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('no webgl2');
const V='#version 300 es\nin vec2 p;out vec2 u;void main(){u=p*.5+.5;gl_Position=vec4(p,0,1);}';
const F='#version 300 es\nprecision highp float;in vec2 u;out vec4 o;uniform vec2 r;uniform float t,seed;uniform vec3 wells[6];uniform int n;\nfloat h(vec2 p){p=fract(p*vec2(91.7,47.3));p+=dot(p,p+19.1);return fract(p.x*p.y);}\nfloat no(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\nvoid main(){vec2 P=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);vec2 q=P;float depth=0.;for(int j=0;j<6;j++){q=abs(q)-.42;float a=.28+.11*sin(t*.6+float(j));float cs=cos(a),sn=sin(a);q=mat2(cs,-sn,sn,cs)*q;float k=1.35+float(j)*.07;q*=k;depth+=exp(-length(q)*3.)*.08;}float well=0.;for(int i=0;i<6;i++){if(i>=n)break;vec2 d=P-wells[i].xy;float rr=length(d);float z=wells[i].z;well+=exp(-rr*rr/(.018+.018*z))*z;}float v=no(q*2.3+seed)+depth+well*.8;float bands=sin(v*34.-t*1.2+no(P*8.)*5.);float hue=fract(v*.22+bands*.025+seed*.003);float x=hue*6.;float c=1.-abs(mod(x,2.)-1.);vec3 ir=clamp((x<1.?vec3(1.,c,0.):x<2.?vec3(c,1.,0.):x<3.?vec3(0.,1.,c):x<4.?vec3(0.,c,1.):x<5.?vec3(c,0.,1.):vec3(1.,0.,c)),0.,1.);ir=pow(ir,vec3(.72));vec3 col=mix(vec3(.003,.004,.012),ir,.78+well*.16);col+=ir*pow(max(0.,1.-abs(bands)),10.)*.28;float vign=1.-.55*length(P);col*=vign;o=vec4(pow(col,vec3(.82)),1.);}';
function S(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}let p=gl.createProgram();gl.attachShader(p,S(gl.VERTEX_SHADER,V));gl.attachShader(p,S(gl.FRAGMENT_SHADER,F));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);let U={};for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){let a=gl.getActiveUniform(p,i);U[a.name]=gl.getUniformLocation(p,a.name.replace(/\[0\]$/,''))}let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let W,H,D=1,seed=Math.random()*20,live=0,paused=false,wells=[];function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D}addEventListener('resize',resize);resize();function P(x,y){let s=Math.min(W,H);return[(x-W/2)/s,(H/2-y)/s]}function draw(ph){gl.useProgram(p);gl.viewport(0,0,c.width,c.height);gl.uniform2f(U.r,c.width,c.height);gl.uniform1f(U.t,ph);gl.uniform1f(U.seed,seed);let a=new Float32Array(18);wells.forEach((q,i)=>a.set([q.x,q.y,q.z],i*3));gl.uniform3fv(U.wells,a);gl.uniform1i(U.n,wells.length);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;e.preventDefault();let q=P(e.clientX,e.clientY);wells.push({x:q[0],y:q[1],z:.7});if(wells.length>6)wells.shift()});let last=performance.now();function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(!paused){live+=dt;wells.forEach(q=>q.z=Math.min(2.2,q.z+dt*.35));draw(live*.16)}requestAnimationFrame(loop)}requestAnimationFrame(loop);APKit.init({canvas:c,gifName:'opal-abyss-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:function(ph){paused=true;draw(ph)},onExportEnd:function(){paused=false;last=performance.now()},buttons:[{label:'✦',name:'mutate',onClick:function(){seed=Math.random()*50}},{label:'↻',name:'reset',onClick:function(){wells=[];live=0}}]});
</script></body></html>
