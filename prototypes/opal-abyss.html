<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPAL ABYSS</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020205}canvas{display:block;width:100%;height:100%;touch-action:none}</style><script src="../ap-kit.js"></script></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;let W,H,D=1,t=0,seed=Math.random()*99,paused=false,wells=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function add(px,py){wells.push({x:px,y:py,z:.15,spin:(Math.random()-.5)*.8,life:0});if(wells.length>7)wells.shift()}
function draw(ph){const s=Math.min(W,H),cx=W/2,cy=H/2;x.fillStyle='#020205';x.fillRect(0,0,W,H);
 x.save();x.translate(cx,cy);
 for(let layer=0;layer<38;layer++){let q=layer/37,rad=s*(.035+q*.62),warp=0;
  wells.forEach((w,i)=>{const dx=w.x-cx,dy=w.y-cy,dist=Math.hypot(dx,dy)/s;warp+=Math.exp(-dist*7)*w.z*(1-q)*.42});
  const rot=ph*.035*(1-q)+Math.sin(ph*.4+q*5+seed)*.08+warp;
  x.save();x.rotate(rot);x.beginPath();
  const sides=10;for(let j=0;j<=sides;j++){const a=j/sides*TAU;let rr=rad*(1+.12*Math.sin(j*3+q*17+seed)+warp*Math.sin(a*5+ph));x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  x.closePath();x.strokeStyle=`hsla(${190+q*150+seed%30},70%,${42+q*34}%,${.05+q*.055})`;x.lineWidth=1+q*2;x.stroke();x.restore()}
 wells.forEach((w,i)=>{w.z=Math.min(1.8,w.z+.0018);w.life+=.016;const dx=w.x-cx,dy=w.y-cy,dist=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
  x.save();x.rotate(a);for(let k=0;k<8;k++){const r=10+k*dist*.09+w.z*k*3;x.beginPath();x.arc(0,0,r,-.55,.55);x.strokeStyle=`hsla(${175+i*35+k*11},90%,70%,${.16/(1+k*.15)})`;x.lineWidth=1.5;x.stroke()}x.restore()});
 const g=x.createRadialGradient(0,0,0,0,0,s*.58);g.addColorStop(0,'rgba(220,235,255,.14)');g.addColorStop(.12,'rgba(90,130,180,.06)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-s,-s,2*s,2*s);x.restore()}
function loop(now){if(!paused){t=now*.001;draw(t)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
c.addEventListener('pointerdown',e=>{if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;add(e.clientX,e.clientY)});
APKit.init({canvas:c,gifName:'opal-abyss-loop',clockFormat:'spec',dock:true,autoHide:true,fullscreenButton:false,loopFrame:ph=>{paused=true;draw(ph)},onExportEnd:()=>{paused=false},buttons:[{label:'✦',name:'mutate',onClick:()=>{seed=Math.random()*99}},{label:'↻',name:'reset',onClick:()=>{wells=[]}}]});
</script></body></html>
