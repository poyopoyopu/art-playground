<!DOCTYPE html>
<!-- FOCUS FED — クロード作。ap-kit.js統合: クロード
     HALO PULL(prototypes/halo-pull.html)の見た目に戻した作り直し(SEENは要素が多すぎて静けさが消えたため)。
     法則: 輪の中には魚が1匹いる。魚は、指で合わせたピントの中でしか育たない。
     ふだんの輪はピンボケで、魚はただのにじんだ光。ときどきピントが勝手に少しだけ入りかけて、すぐ逃げる(のぞき見)。
     タップ=指の方から曲線のピントの面が入ってきて、輪の中に魚がくっきり見える(金魚鉢をのぞく感じ)。
           最後までピントが合うたびに、魚がひとまわり育つ。
           そのとき、ピントが入ってきた方角の色の斑(右=朱、上=白、左=金、下=墨)が魚の体にひとつ増える。
           どこから見てきたかで、模様がその人の魚になる。
           稚魚は透きとおっていて目が大きく、育つと金色→朱色に、尾びれが長くなり、やがて二つに割れる。
     ピントが合っている時のタップ=指の方からピントが抜けて、また溶ける。
     押さえる=ピントが逃げない。魚は指のほうへ寄ってきて、こっちを向く。
     魚は端末が覚えていて、次に開いたときも同じ魚(localStorage `ap-focus-fed-v1`)。
     ✦=別の光(背景と輪の色相・輪の大きさ。魚はそのまま)、↻=魚を稚魚からやり直す。GIF書き出し・？ボタンなし。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOCUS FED — ピントが合うたび、輪の中の魚が育つ</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c9cdf2;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
</style>
<script src="../ap-kit.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){document.body.style.background='#c9cdf2';return;}

var NSP=12; /* 魚の斑の数の上限 */
var VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var FS=[
'precision highp float;',
'uniform vec2 res;uniform float t;uniform float pin;uniform float pout;',
'uniform vec2 dir0;uniform vec2 dir1;uniform float hs;uniform float hr;uniform float R;',
/* 魚 */
'uniform vec2 fp;uniform float fpi;uniform float ffa;uniform float fL;uniform float fg;uniform float ftp;uniform float fjoy;',
'uniform vec4 sp['+NSP+'];uniform vec3 sc['+NSP+'];uniform float nsp;',
'float g(float x,float s){return exp(-x*x/(s*s));}',
'float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
'float vn(vec2 p){vec2 i=floor(p),u=fract(p);u=u*u*(3.-2.*u);',
'return mix(mix(h(i),h(i+vec2(1.,0.)),u.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),u.x),u.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}',
'vec3 hue(vec3 c,float a){',
'  const mat3 toY=mat3(.299,.596,.211,.587,-.274,-.523,.114,-.322,.312);',
'  const mat3 toR=mat3(1.,1.,1.,.956,-.272,-1.106,.621,-.647,1.703);',
'  vec3 y=toY*c;float cs=cos(a),sn=sin(a);',
'  y.yz=vec2(y.y*cs-y.z*sn,y.y*sn+y.z*cs);return toR*y;}',
'vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(p.x*c-p.y*s,p.x*s+p.y*c);}',
'float sdEl(vec2 p,vec2 ab){float k0=length(p/ab);float k1=length(p/(ab*ab));return k0*(k0-1.)/max(k1,1e-5);}',
'vec3 sky(vec2 uv,float w,float tt,float nz){',
'  vec2 p1=vec2(-.45+.15*sin(tt*.21),.4+.12*cos(tt*.17));',
'  vec2 p2=vec2(.5+.12*cos(tt*.19),.35+.15*sin(tt*.23));',
'  vec2 p3=vec2(.4+.15*sin(tt*.16+2.),-.45+.12*cos(tt*.2));',
'  vec2 p4=vec2(-.45+.12*cos(tt*.18+1.),-.4+.15*sin(tt*.22));',
'  vec2 p5=vec2(.05*sin(tt*.3),.05*cos(tt*.27));',
'  vec3 c1=mix(vec3(.66,.74,1.),vec3(1.,.74,.62),w);',
'  vec3 c2=mix(vec3(.96,.78,.95),vec3(1.,.6,.72),w);',
'  vec3 c3=mix(vec3(.6,.92,.98),vec3(1.,.86,.55),w);',
'  vec3 c4=mix(vec3(.78,.68,1.),vec3(.98,.66,.88),w);',
'  vec3 c5=mix(vec3(.9,.92,1.),vec3(1.,.9,.82),w);',
'  float w1=1./(dot(uv-p1,uv-p1)+.05),w2=1./(dot(uv-p2,uv-p2)+.05),w3=1./(dot(uv-p3,uv-p3)+.05),w4=1./(dot(uv-p4,uv-p4)+.05),w5=.6/(dot(uv-p5,uv-p5)+.08);',
'  w1*=w1;w2*=w2;w3*=w3;w4*=w4;w5*=w5;',
'  vec3 c=(c1*w1+c2*w2+c3*w3+c4*w4+c5*w5)/(w1+w2+w3+w4+w5);',
'  c+=(nz-.5)*.06;c*=1.-.12*dot(uv,uv);return c;}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy-.5*res)/min(res.x,res.y);',
'  float r=length(uv);',
'  float wob=.03*sin(uv.x*7.+uv.y*3.+t*.9)+.02*sin(uv.y*11.-uv.x*5.-t*1.3);',
'  float Rr=.78;',
'  float D0=mix(2.1,0.,pin);float D1=mix(2.1,0.,pout);',
'  float e0=Rr-length(uv-dir0*D0)+wob;float e1=Rr-length(uv-dir1*D1)-wob;',
'  float f=smoothstep(-.06,.06,e0)*(1.-smoothstep(-.06,.06,e1));',
'  float fb=smoothstep(-.3,.3,e0)*(1.-smoothstep(-.3,.3,e1));',
'  float front=(g(e0,.07)*step(.001,pin)*(1.-pin*pin)+g(e1,.07)*step(.001,pout)*(1.-pout*pout))*1.6;',
'  float wm=clamp(fb*(.55+.45*smoothstep(R,R+.3,r)),0.,1.);',
'  float nz=fbm(uv*2.2+t*.03);',
'  vec3 bg=hue(sky(uv,wm,t,nz),hs);',
'  vec3 bgCool=hue(sky(uv,0.,t,nz),hs);',
'  bg+=hue(vec3(1.,.6,.4),hs)*exp(-max(r-R,0.)/.18)*.08*fb;',
'  float blob=g(r,R*.83);',
'  vec3 blurC=mix(bgCool,hue(mix(vec3(.4,.84,1.),vec3(.66,.62,1.),g(r,R*.33)),hr),blob*.85);',
'  blurC+=vec3(.12,.1,.12)*g(r,R*.55);',
'  float eB=1.-smoothstep(R-.004,R+.004,r+.018);',
'  vec3 inside=hue(mix(vec3(.68,.72,1.),vec3(.35,.92,1.),smoothstep(0.,R,r)),hr);',
'  vec3 sharp=mix(bg,inside,eB);',
/* ---- 魚(体長1の座標で形を作る) ---- */
'  vec3 fishB=vec3(0.);float aB=0.,aF=0.,blurA=0.,du=9.;vec3 finC=vec3(1.);float bodyOp=1.;',
'  vec2 q0=uv-fp;',
'  if(dot(q0,q0)<fL*fL*4.){',
'    float sg=ffa<0.?-1.:1.;q0.x*=sg;',
'    vec2 q=rot(q0,-fpi);',
'    q.x/=max(abs(ffa),.18);q/=fL;',
'    q.y-=(.05+.05*fjoy)*sin(ftp-q.x*4.)*smoothstep(.25,-.9,q.x);',
'    float a=.5;float bb=mix(.15,.25,fg)*(1.+.16*clamp(q.x/a,-1.,1.));',
'    float db=sdEl(q,vec2(a,bb));',
/* 尾びれ: 育つと長く広く、やがて二つに割れる */
'    float tl=mix(.26,.78,fg);float u=(-q.x-.4)/tl;',
'    float ty=q.y-.05*sin(ftp*1.3-u*5.)*u;',
'    float hw=mix(.035,mix(.16,.42,fg),pow(clamp(u,0.,1.),.8))*(1.+.07*sin(u*9.-ftp*1.5));',
'    float dt=max(abs(ty)-hw,max(-u,u-1.)*tl);',
'    float notch=max(0.,smoothstep(.45,.9,fg)*hw*smoothstep(.45,1.,u)*.6-.004);',
'    if(notch>0.)dt=max(dt,notch-abs(ty));',
/* 背びれ・胸びれ・腹びれ */
'    float xt=clamp(q.x/a,-1.,1.);float ytop=bb*sqrt(max(0.,1.-xt*xt));',
'    float fx=clamp((q.x+.26)/.38,0.,1.);float fh=mix(.04,.15,fg)*sin(3.1416*fx)*(1.+.08*sin(ftp*.9-fx*4.));',
'    float dd=max(max(q.y-(ytop+fh),max(-.26-q.x,q.x-.12)),-q.y);',
'    vec2 pc=rot(q-vec2(.14,-bb*.5),.55+.35*sin(ftp*.8));',
'    float dp=sdEl(pc,vec2(.1*(.8+.5*fg),.032));',
'    vec2 pv=rot(q-vec2(-.2,-bb*.78),-.5+.15*sin(ftp*.8+1.));',
'    float dv=sdEl(pv,vec2(.08*(.8+.5*fg),.03));',
'    float dF=min(min(dt,dd),min(dp,dv));',
'    float dA=min(db,dF);du=dA*fL;',
'    float wn=.0028/fL;',
'    aB=smoothstep(wn,-wn,db);aF=smoothstep(wn,-wn,dF)*(1.-aB);',
'    blurA=smoothstep(.28,-.12,dA);',
/* 体の色: 稚魚は透きとおった水色 → 金 → 朱 */
'    vec2 pn=vec2(q.x/a,q.y/bb);',
'    vec3 base=mix(vec3(.78,.9,.97),vec3(1.,.68,.26),smoothstep(.1,.42,fg));',
'    base=mix(base,vec3(.97,.38,.2),smoothstep(.45,.85,fg));',
'    bodyOp=mix(.5,1.,smoothstep(.08,.38,fg));vec3 base0=base;',
'    float sw=.06/max(fL*4.,.05);',
'    for(int i=0;i<'+NSP+';i++){',
'      if(float(i)>=nsp)break;',
'      vec4 s=sp[i];',
'      float dsp=length((pn-s.xy)/vec2(1.,.8))/s.z+.3*(vn(pn*4.+s.w*7.)-.5);',
'      base=mix(base,sc[i],smoothstep(1.+sw,1.-sw,dsp)*mix(.55,.95,smoothstep(0.,.3,fg)));',
'    }',
'    base=mix(base,vec3(1.,.96,.9),smoothstep(.1,-.9,pn.y)*.35);',
'    base*=1.-.16*smoothstep(.2,1.,pn.y);',
'    base+=.22*exp(-pow((pn.y-.42)*4.,2.))*smoothstep(-.7,.3,pn.x);',
'    vec2 ec=vec2(a*.6,bb*.18);float er=mix(.06,.04,fg);',
'    float eo=1.-smoothstep(er-.006,er,length(q-ec));',
'    base=mix(base,vec3(.07,.07,.14),eo);',
'    base=mix(base,vec3(1.),(1.-smoothstep(er*.25,er*.4,length(q-ec-vec2(er*.3,er*.35))))*eo);',
'    fishB=base;',
'    float rays=.5+.5*sin(atan(q.y,q.x+.3)*28.);finC=mix(base0,vec3(1.,.97,.95),.2)*(.9+.1*rays);',
'  }',
'  float inW=eB;',
'  sharp=mix(sharp,fishB,aB*bodyOp*inW);',
'  sharp=mix(sharp,finC,aF*.6*inW);',
/* 魚の虹の縁どり(輪と同じ並び: 内側シアン→白→マゼンタ) */
'  float fr=inW*smoothstep(.0,.15,fg+.15);',
'  sharp+=hue(vec3(-.3,.12,.08),hr)*g(du+.0035,.003)*.35*fr;',
'  sharp=mix(sharp,vec3(1.),clamp(g(du,.0014)*.9,0.,1.)*fr);',
'  sharp=mix(sharp,hue(vec3(1.,.2,.75),hr),g(du-.003,.0025)*.45*fr);',
/* 輪の縁 */
'  float rimW=g(r-R+.004,.006);float rimC=g(r-R+.02,.018);',
'  float rimM=g(r-R-.012,.01);float rimO=g(r-R-.03,.022);',
'  float halo=smoothstep(R,R+.01,r)*exp(-(r-R)/.09);',
'  sharp+=hue(vec3(-.4,.1,.05),hr)*rimC*1.2;sharp+=hue(vec3(0.,.95,1.),hr)*rimC*.3;',
'  sharp=mix(sharp,vec3(1.),clamp(rimW*1.3,0.,1.));',
'  sharp=mix(sharp,hue(vec3(1.,.15,.75),hr),rimM*.8);',
'  sharp=mix(sharp,hue(vec3(1.,.45,.1),hr),rimO*.75);',
'  sharp+=hue(vec3(1.,.55,.3),hr)*halo*.25;',
/* ボケている時の魚は、ただのにじんだ光 */
'  blurC=mix(blurC,mix(fishB,vec3(1.),.25),blurA*.5*(.6+.4*fg)*smoothstep(R*1.1,R*.6,r));',
'  vec2 dd2=pout>.001?dir1:dir0;float ee=pout>.001?e1:e0;',
'  vec3 rb=.5+.5*cos(6.2832*(dot(uv,vec2(-dd2.y,dd2.x))*1.4+ee*3.+t*.2+vec3(0.,.33,.67)));',
'  rb=mix(rb,vec3(1.),.22);float con=front*(1.-smoothstep(R,R+.05,r));',
'  vec3 col=mix(mix(blurC,bg,fb*(1.-blob*.8)),sharp,f);',
'  col=mix(col,rb,clamp(con*.7,0.,1.));',
'  col+=(h(gl_FragCoord.xy+fract(t)*91.)-.5)*.035;',
'  gl_FragColor=vec4(clamp(col,0.,1.),1.);}'
].join('\n');

function sh(tp,src){var o=gl.createShader(tp);gl.shaderSource(o,src);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
var pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
var U={};['res','t','pin','pout','dir0','dir1','hs','hr','R','fp','fpi','ffa','fL','fg','ftp','fjoy','nsp'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
U.sp=gl.getUniformLocation(pr,'sp[0]');U.sc=gl.getUniformLocation(pr,'sc[0]');

/* 解像度(重い端末では自動で下げる)。実際に表示されている大きさから決める(iPhoneで楕円にならないように) */
var scale=Math.min(window.devicePixelRatio||1,2),minScale=0.6;
function resize(){
  var w0=cv.clientWidth||innerWidth,h0=cv.clientHeight||innerHeight;
  var w=Math.max(1,Math.round(w0*scale)),hh=Math.max(1,Math.round(h0*scale));
  if(cv.width!==w||cv.height!==hh){cv.width=w;cv.height=hh;gl.viewport(0,0,w,hh);}
}
addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);
resize();

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function ease(x){return x<0?0:x>1?1:x*x*(3-2*x);}

/* ---- 魚の記憶(端末に残る) ---- */
var KEY='ap-focus-fed-v1';
var fishMem={n:0,spots:[]};
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&typeof o.n==='number'&&Array.isArray(o.spots))fishMem=o;}}catch(_){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(fishMem));}catch(_){}}
load();
function growthOf(n){return 1-Math.exp(-n/9);}
var gDisp=growthOf(fishMem.n);

/* ピントが入ってきた方角の色: 右=朱、上=白、左=金、下=墨 */
var DIRC=[[0.95,0.32,0.2],[1,0.96,0.92],[1,0.74,0.26],[0.2,0.2,0.3]];
function dirColor(a){
  var x=((a/(Math.PI/2))%4+4)%4,i=Math.floor(x),f=x-i,A=DIRC[i],B=DIRC[(i+1)%4];
  return [A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,A[2]+(B[2]-A[2])*f];
}
var spA=new Float32Array(NSP*4),scA=new Float32Array(NSP*3);
function packSpots(){
  spA.fill(0);scA.fill(0);
  fishMem.spots.forEach(function(s,i){
    if(i>=NSP)return;
    spA[i*4]=s[0];spA[i*4+1]=s[1];spA[i*4+2]=s[2];spA[i*4+3]=s[3];
    scA[i*3]=s[4];scA[i*3+1]=s[5];scA[i*3+2]=s[6];
  });
}
packSpots();

/* ---- 魚の泳ぎ ---- */
var F={x:0,y:0,h:rnd(-0.5,0.5),sp:0,face:1,pitch:0,tx:0,ty:0,tt:0,ft:0,joy:0};
var look={hs:0,hr:0,R:0.36};
function fishL(){return look.R*(0.25+0.31*gDisp);}

function feed(a){
  fishMem.n++;
  var c=dirColor(a);
  /* 方角に寄った位置に斑を置く(上から見たら背中側、下からならお腹側…) */
  var sx=clamp(Math.cos(a)*0.35*(F.face<0?-1:1)+rnd(-0.4,0.4),-0.7,0.75);
  var sy=clamp(Math.sin(a)*0.45+rnd(-0.3,0.3),-0.75,0.8);
  var s=[sx,sy,rnd(0.2,0.4),Math.random(),c[0],c[1],c[2]];
  if(fishMem.spots.length<NSP)fishMem.spots.push(s);
  else fishMem.spots[(fishMem.n-1)%NSP]=s;
  save();packSpots();
  F.joy=1;
}

function fishStep(dt){
  var R=look.R,L=fishL(),Rs=Math.max(R*0.12,R*0.9-L*0.95);
  F.tt-=dt;F.joy=Math.max(0,F.joy-dt*0.7);
  var looking=touch&&(S.state==='in'||S.state==='sharp');
  if(looking){F.tx=Math.cos(touch.a)*Rs*0.85;F.ty=Math.sin(touch.a)*Rs*0.85;}
  var dx=F.tx-F.x,dy=F.ty-F.y,dist=Math.hypot(dx,dy);
  if(!looking&&(F.tt<=0||dist<L*0.3)){
    var ang=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*Rs;
    F.tx=Math.cos(ang)*rr;F.ty=Math.sin(ang)*rr*0.75;F.tt=rnd(3,7);
    dx=F.tx-F.x;dy=F.ty-F.y;dist=Math.hypot(dx,dy);
  }
  var vmax=R*(0.15+0.12*F.joy);
  var slowR=L*0.7;
  var tgt=dist<slowR?vmax*0.5*dist/slowR:vmax;
  if(dist>1e-4){
    var diff=wrap(Math.atan2(dy,dx)-F.h),turn=1.7*dt;
    F.h+=clamp(diff,-turn,turn);
  }
  F.sp+=(tgt-F.sp)*Math.min(1,dt*1.5);
  F.x+=Math.cos(F.h)*F.sp*dt;F.y+=Math.sin(F.h)*F.sp*dt;
  var r=Math.hypot(F.x,F.y);
  if(r>Rs){F.x*=Rs/r;F.y*=Rs/r;}
  /* 向き: 指のそばで止まったら、指の方を向く */
  var c=Math.cos(F.h),want=Math.abs(c)>0.2?(c>0?1:-1):(F.face>=0?1:-1);
  if(looking&&dist<slowR){var cc=Math.cos(touch.a);if(Math.abs(cc)>0.15)want=cc>0?1:-1;}
  F.face+=(want-F.face)*Math.min(1,dt*2.4);
  var p=clamp(Math.atan2(Math.sin(F.h),Math.abs(c)),-0.55,0.55)*Math.min(1,F.sp/(vmax*0.4+1e-6));
  F.pitch+=(p-F.pitch)*Math.min(1,dt*2);
  F.ft+=dt*(2.4+F.sp/R*16+F.joy*9);
}

/* ---- ピントの状態: blur → peek(のぞき見、勝手に少しだけ入って逃げる) / in → sharp → out → blur ---- */
var DUR={in:2.8,sharp:3.4,out:2.6,peek:3.6};
var S={state:'blur',k:0,pin:0,pout:0,a0:0,a1:0,next:null,aim:null,byTouch:false,wait:rnd(1.5,3),peakAmt:0.5};
var held=false,touch=null;

function startIn(a,byTouch){S.state='in';S.k=0;S.pin=0;S.pout=0;S.a0=a;S.aim=null;S.byTouch=!!byTouch;}
function startOut(a){S.state='out';S.k=0;S.a1=a;}
function peekToIn(a){
  /* のぞき見の途中で触った: いまの位置から合わせにいき、ピントの面を指の方へ回す */
  var p=S.pin;S.state='in';S.pin=p;S.k=p*DUR.in;S.aim=a;S.byTouch=true;
}

function step(dt){
  S.k+=dt;
  if(S.aim!==null&&S.state==='in'){
    var d=wrap(S.aim-S.a0),m=1.4*dt;
    S.a0+=clamp(d,-m,m);
  }
  if(S.state==='blur'){
    if(S.next!==null){startIn(S.next,true);S.next=null;}
    else if(held&&touch){startIn(touch.a,true);}
    else if(S.k>S.wait){S.state='peek';S.k=0;S.a0=rnd(0,Math.PI*2);S.peakAmt=rnd(0.32,0.56);}
  }else if(S.state==='peek'){
    if(held&&touch){peekToIn(touch.a);}
    else{
      S.pin=S.peakAmt*Math.sin(Math.PI*Math.min(1,S.k/DUR.peek));
      if(S.k>=DUR.peek){S.state='blur';S.k=0;S.pin=0;S.wait=rnd(2.2,4.8);}
    }
  }else if(S.state==='in'){
    S.pin=Math.min(1,S.k/DUR.in);
    if(S.pin>=1){
      S.state='sharp';S.k=0;
      if(S.byTouch)feed(S.aim!==null?S.aim:S.a0);
    }
  }else if(S.state==='sharp'){
    if(S.next!==null){startOut(S.next);S.next=null;}
    else if(!held&&S.k>DUR.sharp){startOut(S.a0+rnd(2.2,4.0));}
  }else if(S.state==='out'){
    S.pout=Math.min(1,S.k/DUR.out);
    if(S.pout>=1){S.state='blur';S.k=0;S.pin=0;S.pout=0;S.wait=rnd(2.2,4.8);}
  }
}

function onTap(a){
  if(S.state==='blur'){startIn(a,true);}
  else if(S.state==='peek'){peekToIn(a);}
  else if(S.state==='sharp'){startOut(a);}
  else{S.next=a;}
}

function angleAt(x,y){
  var rc=cv.getBoundingClientRect();
  var dx=x-(rc.left+rc.width/2),dy=-(y-(rc.top+rc.height/2));
  if(dx*dx+dy*dy<4)return Math.random()*Math.PI*2;
  return Math.atan2(dy,dx);
}
cv.addEventListener('pointerdown',function(e){
  if(window.APKit&&window.APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  if(touch)return;
  touch={id:e.pointerId,t0:performance.now(),a:angleAt(e.clientX,e.clientY)};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',function(e){
  if(!touch||e.pointerId!==touch.id)return;
  touch.a=angleAt(e.clientX,e.clientY);
  if(S.state==='in'&&S.byTouch&&held)S.aim=touch.a;
});
function up(e){
  if(!touch||e.pointerId!==touch.id)return;
  var dur=performance.now()-touch.t0;
  if(!held&&dur<350)onTap(touch.a);
  if(held&&S.state==='sharp')S.k=0;
  held=false;touch=null;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

function mutate(){
  look.hs=rnd(-Math.PI,Math.PI);
  look.hr=Math.random()<0.35?0:rnd(-Math.PI,Math.PI);
  look.R=rnd(0.3,0.4);
}
function resetAll(){
  look.hs=0;look.hr=0;look.R=0.36;
  fishMem={n:0,spots:[]};save();packSpots();gDisp=0;
  F.x=0;F.y=0;F.joy=0;
  S.state='blur';S.k=0;S.pin=0;S.pout=0;S.next=null;S.aim=null;S.wait=rnd(1.5,3);
}

var T0=performance.now(),last=T0,slow=0;
function frame(now){
  var dt=Math.min((now-last)/1000,0.1);last=now;
  if(touch&&!held&&now-touch.t0>=350)held=true;
  step(dt);
  gDisp+=(growthOf(fishMem.n)-gDisp)*Math.min(1,dt*0.9);
  fishStep(dt);
  if(dt>0.034){slow++;}else if(slow>0)slow--;
  if(slow>40&&scale>minScale){scale=Math.max(minScale,scale*0.8);slow=0;}
  resize();
  var tt=(now-T0)/1000;
  gl.uniform2f(U.res,cv.width,cv.height);
  gl.uniform1f(U.t,tt);
  gl.uniform1f(U.pin,ease(S.pin));
  gl.uniform1f(U.pout,ease(S.pout));
  gl.uniform2f(U.dir0,Math.cos(S.a0),Math.sin(S.a0));
  gl.uniform2f(U.dir1,Math.cos(S.a1),Math.sin(S.a1));
  gl.uniform1f(U.hs,look.hs);gl.uniform1f(U.hr,look.hr);gl.uniform1f(U.R,look.R);
  gl.uniform2f(U.fp,F.x,F.y);gl.uniform1f(U.fpi,F.pitch);gl.uniform1f(U.ffa,F.face);
  gl.uniform1f(U.fL,fishL());gl.uniform1f(U.fg,gDisp);gl.uniform1f(U.ftp,F.ft);gl.uniform1f(U.fjoy,F.joy);
  gl.uniform1f(U.nsp,Math.min(NSP,fishMem.spots.length));
  gl.uniform4fv(U.sp,spA);gl.uniform3fv(U.sc,scA);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* テスト用(ヘッドレス確認で使う。作品の動きには影響しない) */
window.__ff={S:S,F:F,mem:function(){return fishMem;},feed:feed,setN:function(n){fishMem.n=n;gDisp=growthOf(n);}};

if(window.APKit){
  window.APKit.init({
    canvas:cv,
    gifName:'focus-fed',
    clockFormat:'spec',
    dock:true,
    autoHide:true,
    fullscreenButton:false,
    buttons:[
      {label:'✦',name:'mutate',onClick:mutate},
      {label:'↻',name:'reset',onClick:resetAll}
    ]
  });
}
})();
</script>
