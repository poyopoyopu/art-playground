<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLOUD TREE</title>
<script src="../ap-kit.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9d5}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* CLOUD TREE — ChatGPT作。雲の密度が枝を隠し、触れた場所だけ雲がほどけて枝が露出する。 */

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});
if(!gl)throw new Error('WebGL2 unavailable');

const VS=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.0,1.0);}
`;

const FS=`#version 300 es
precision highp float;
out vec4 O;

uniform vec2 r;
uniform float t;
uniform float seed;
uniform float breath;
uniform int markCount;
uniform vec4 marks[8];

float hash21(vec2 p){
  p=fract(p*vec2(123.34,456.21));
  p+=dot(p,p+45.32);
  return fract(p.x*p.y);
}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),
             mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=.5;
  for(int i=0;i<5;i++){
    v+=a*noise(p);
    p=p*2.03+vec2(17.1,9.7);
    a*=.5;
  }
  return v;
}
mat2 rot(float a){
  float c=cos(a),s=sin(a);
  return mat2(c,-s,s,c);
}

/* A sparse recursive tree: deliberately kept quiet until the cloud is opened. */
float treeField(vec2 p){
  float best=10.0;
  vec2 q=p;
  for(int i=0;i<6;i++){
    float fi=float(i);
    q.y+=.08;
    q.x=abs(q.x);
    q.x+=.075*sin(q.y*3.0+fi*.8+t*.10+seed*.3)*q.y;
    q=rot(-.055+fi*.005)*q;
    q.y*=1.58;
    q.x=q.x*1.95-.20;
    float trunk=abs(q.x)-(.009+fi*.0025);
    float twig=abs(q.x+q.y*.24)-(.005+fi*.0015);
    best=min(best,min(trunk,twig)/pow(1.58,fi));
  }
  best=min(best,abs(p.x)-(.016+.006*smoothstep(-.9,.2,p.y)));
  return best;
}

/* One coherent cloud mass, with slow breathing and uneven lobes. */
float cloudShape(vec2 p){
  vec2 drift=vec2(t*.010,-t*.004);
  float n=fbm(p*3.0+drift+seed*vec2(.13,-.07));
  float n2=fbm(p*6.5-drift*1.7+seed*vec2(-.04,.11));

  float a=1.0-length((p-vec2(0.0,.18))*vec2(.92,1.04));
  float b=1.0-length((p-vec2(-.43,.34))*vec2(1.18,1.02));
  float c=1.0-length((p-vec2(.43,.36))*vec2(1.17,1.00));
  float d=1.0-length((p-vec2(-.20,.64))*vec2(1.18,.82));
  float e=1.0-length((p-vec2(.23,.62))*vec2(1.15,.84));
  float lower=1.0-length((p-vec2(0.0,-.18))*vec2(.82,1.18));

  float shape=max(a,max(b,max(c,max(d,max(e,lower)))));
  shape+=(n-.5)*.13+(n2-.5)*.035;
  shape+=breath*.018;
  return shape;
}

float cloudCut(vec2 p){
  float cut=0.0;
  for(int i=0;i<8;i++){
    if(i>=markCount)break;
    vec2 m=marks[i].xy;
    float age=marks[i].z;
    float rad=.055+age*.12;
    float hole=1.0-smoothstep(rad,rad*.34,length(p-m));
    cut=max(cut,hole*marks[i].w);
  }
  return cut;
}

void main(){
  vec2 p=(gl_FragCoord.xy-.5*r)/r.y;
  p.x*=1.02;

  /* clear blue air */
  float sky=clamp((p.y+.72)/1.55,0.0,1.0);
  vec3 col=mix(vec3(.28,.54,.77),vec3(.55,.75,.90),sky);
  float grain=fbm(p*2.2+vec2(t*.006,0.0)+seed);
  col+=vec3(.018,.025,.028)*(grain-.5);

  /* faint tree silhouette: structure is present, but intentionally buried */
  vec2 tp=p-vec2(0.0,-.48);
  float td=treeField(tp);
  float branch=smoothstep(.012,0.0,td);
  float branchSoft=smoothstep(.042,0.0,td);
  vec3 treeCol=vec3(.20,.31,.38);
  col=mix(col,treeCol,branch*.075+branchSoft*.018);

  float cs=cloudShape(p);
  float cloud=smoothstep(-.015,.055,cs);
  float cut=cloudCut(p);
  float opened=cloud*cut;

  /* cloud body: opaque enough to hide the tree */
  float inner=fbm(p*5.5+vec2(seed*.2,-seed*.1)+vec2(t*.008));
  vec3 cloudCol=mix(vec3(.84,.89,.93),vec3(1.0,.985,.93),smoothstep(.30,.78,inner));
  float rim=smoothstep(.12,.0,abs(cs-.01));
  cloudCol+=vec3(.045,.055,.055)*rim;

  /* subtle lower shadow gives the cloud readable volume without white-out */
  float belly=smoothstep(.20,-.28,cs);
  cloudCol=mix(cloudCol,vec3(.72,.80,.86),belly*.16);

  col=mix(col,cloudCol,cloud*(1.0-cut*.96));

  /* the opened parts reveal the recursive tree, not a glowing paint mark */
  float reveal=smoothstep(.02,.55,cut);
  float revealTree=branch*(.82+.18*branchSoft)*reveal;
  col=mix(col,treeCol,revealTree);

  /* a soft edge around the opening makes the "cloud peeled away" event legible */
  float openingEdge=opened*(1.0-smoothstep(.0,.055,abs(cs)));
  col=mix(col,vec3(.69,.78,.84),openingEdge*.12);

  col=pow(clamp(col,0.0,1.0),vec3(.97));
  O=vec4(col,1.0);
}
`;

function shader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s)||'shader compile failed');
  return s;
}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,VS));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,FS));
gl.bindAttribLocation(program,0,'p');
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'program link failed');

const U={
  r:gl.getUniformLocation(program,'r'),
  t:gl.getUniformLocation(program,'t'),
  seed:gl.getUniformLocation(program,'seed'),
  breath:gl.getUniformLocation(program,'breath'),
  markCount:gl.getUniformLocation(program,'markCount'),
  marks:gl.getUniformLocation(program,'marks[0]')
};

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
gl.useProgram(program);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);

let W=0,H=0,DPR=1;
let seed=Math.random()*10;
let phase=0;
let paused=false;
let last=performance.now();
let marks=[];
const TAUJS=Math.PI*2;

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,1.25);
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
addEventListener('resize',resize);
resize();

function draw(ph){
  gl.useProgram(program);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.uniform2f(U.r,canvas.width,canvas.height);
  gl.uniform1f(U.t,ph);
  gl.uniform1f(U.seed,seed);
  gl.uniform1f(U.breath,.5+.5*Math.sin(ph));
  gl.uniform1i(U.markCount,marks.length);
  const data=new Float32Array(32);
  for(let i=0;i<marks.length;i++){
    const m=marks[i];
    data[i*4]=m.x;
    data[i*4+1]=m.y;
    data[i*4+2]=m.age;
    data[i*4+3]=m.power;
  }
  gl.uniform4fv(U.marks,data);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function addMark(x,y,power=1){
  if(marks.length>=8)marks.shift();
  marks.push({x,y,age:.42,power});
}
function point(e){
  const rect=canvas.getBoundingClientRect();
  return {
    x:((e.clientX-rect.left)/rect.height)-rect.width/(2*rect.height),
    y:((rect.height-(e.clientY-rect.top))/rect.height)-.5
  };
}
let drawing=false;
canvas.addEventListener('pointerdown',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  drawing=true;
  const q=point(e);
  addMark(q.x,q.y,1);
  canvas.setPointerCapture?.(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  if(!drawing)return;
  const q=point(e);
  addMark(q.x,q.y,.72);
});
function end(){drawing=false}
canvas.addEventListener('pointerup',end);
canvas.addEventListener('pointercancel',end);

function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  for(const m of marks)m.age=Math.min(1,m.age+dt*.045);
  if(!paused){
    phase=(phase+dt*.26)%TAUJS;
    draw(phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

APKit.init({
  canvas,
  gifName:'cloud-tree-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(ph){paused=true;draw(ph)},
  onExportEnd:function(){paused=false;last=performance.now()},
  buttons:[
    {label:'✦',name:'mutate',onClick:function(){seed=Math.random()*10;marks=[]}},
    {label:'↻',name:'reset',onClick:function(){seed=0;marks=[]}}
  ]
});
</script>
</body>
</html>
