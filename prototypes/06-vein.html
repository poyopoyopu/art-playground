<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VEIN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b}body{touch-action:none}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,t=0,marks=[];
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function draw(){t+=.004;x.fillStyle="rgba(8,9,11,.075)";x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,S=Math.min(W,H);
for(let k=0;k<42;k++){x.beginPath();for(let i=0;i<=220;i++){let a=i/220*Math.PI*2,r=S*(.07+k/42*.62),px=Math.cos(a)*r,py=Math.sin(a)*r;
for(const m of marks){let dx=px+cx-m.x,dy=py+cy-m.y,dd=Math.hypot(dx,dy)+1;if(dd<180){let q=1-dd/180,ang=Math.atan2(dy,dx)+q*q*m.turn;px=Math.cos(ang)*r;py=Math.sin(ang)*r}}
let bend=Math.sin(a*(3+k%5)+t*3+k)*S*.006;px+=Math.cos(a)*bend;py+=Math.sin(a)*bend;x.lineTo(cx+px,cy+py)}
x.strokeStyle=`hsla(${185+k*2.2},65%,${42+k*.7}%,${.025+k*.001})`;x.lineWidth=.7;x.stroke()}
for(const m of marks){m.r+=.22;m.turn*=.9996}requestAnimationFrame(draw)}
function add(px,py){marks.unshift({x:px,y:py,turn:(Math.random()>.5?1:-1)*(1.2+Math.random()*1.6)});marks=marks.slice(0,7)}
c.addEventListener("pointerdown",e=>add(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)add(e.clientX,e.clientY)});draw();
</script></body></html>
