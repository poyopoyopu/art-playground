<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VEIN</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a}body{touch-action:none}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById("c"),x=c.getContext("2d");let d,W,H,veins=[],t=0;
function size(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",size);size();
function draw(){t+=.01;x.fillStyle="#08090a";x.fillRect(0,0,W,H);for(const v of veins){v.a+=Math.sin(t+v.x*.01)*.006;v.x+=Math.cos(v.a)*.7;v.y+=Math.sin(v.a)*.7;v.life--;x.beginPath();x.arc(v.x,v.y,1.3,0,6.28);x.fillStyle=`hsla(${v.h},75%,65%,.55)`;x.fill()}veins=veins.filter(v=>v.life>0&&v.x>-20&&v.x<W+20&&v.y>-20&&v.y<H+20);requestAnimationFrame(draw)}
function grow(px,py){for(let i=0;i<20;i++){let a=Math.random()*6.28;veins.push({x:px,y:py,a,h:20+Math.random()*40,life:220+Math.random()*260})}}
c.addEventListener("pointerdown",e=>grow(e.clientX,e.clientY));c.addEventListener("pointermove",e=>{if(e.buttons)grow(e.clientX,e.clientY)});draw();
</script></body></html>
