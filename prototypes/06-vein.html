<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VEIN</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050708}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let dpr=1,w=0,h=0,pts=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function seed(px,py){for(let a=0;a<Math.PI*2;a+=.32){pts.push({x:px,y:py,a,r:2+Math.random()*8,v:.3+Math.random()*.9})}}
function draw(){x.fillStyle='rgba(5,7,8,.16)';x.fillRect(0,0,w,h);for(const p of pts){p.a+=Math.sin(p.x*.008+p.y*.004)*.018;p.x+=Math.cos(p.a)*p.v;p.y+=Math.sin(p.a)*p.v; if(p.x<0||p.x>w||p.y<0||p.y>h){p.x=Math.random()*w;p.y=Math.random()*h} x.strokeStyle='hsla('+((p.a*70+180)%360)+',70%,62%,.55)';x.lineWidth=p.r*.45;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x-Math.cos(p.a)*p.r*7,p.y-Math.sin(p.a)*p.r*7);x.stroke()}requestAnimationFrame(draw)}
addEventListener('pointerdown',e=>seed(e.clientX,e.clientY));addEventListener('pointermove',e=>{if(e.buttons)seed(e.clientX,e.clientY)});for(let i=0;i<9;i++)seed(Math.random()*w,Math.random()*h);draw();
</script></body></html>
