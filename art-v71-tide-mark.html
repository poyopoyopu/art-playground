<!-- TIDE MARK — クロちゃん(Claude)作。おっちゃん提供の動画(虹色の境界が画面全体を斜めに横切る
     グラデーション)を参考に、「境界=なぎさ」という世界のルールで再構成。ap-kit.js統合: クロちゃん -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TIDE MARK — なぎさの法則</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#efeae4;overflow:hidden;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="ap-kit.js"></script>
<script>
(function(){
"use strict";

/* ---------- 世界のルール ----------
   画面ぜんぶが、暖かい側と冷たい側の二つの光でできている。その境目(なぎさ)に
   色が押し集められて、虹の一本線になって画面を斜めに横切っている。

   指で触れた場所は、そこから溶ける。溶けた所は色を束ねていられなくなって、
   虹が幅いっぱいに広がり、白っぽく濁り、重みで垂れ下がる。
   そして溶けた所ほど柔らかいので、次はもっと簡単に引き伸ばせる。
   一度溶けた境目は二度と結び直せない。触り続ければ、虹はその場所から順に
   失われていき、最後には色の分かれ目のない、ただの淡い場だけが残る。

   ✦は新しい満潮(まったく別の傾き・形・色)を呼ぶ。↻は最初の凪に戻す。

   描き方について: 参考動画のように「画面全体が色の場で、境目に色が圧縮されている」
   絵は、細い帯を線で描く方式では出せなかった(帯が平らな背景に浮いてしまう)。
   なので各ピクセルで「なぎさからの符号つき距離」を求め、その距離をグラデーションの
   ランプに通して色を決める方式にした。低解像度バッファに描いて拡大合成するので、
   ぼかしフィルタを使わずに(=色相がずれずに)なめらかな階調になる。
   「溶け」は、この距離を割るspreadを場所ごとに変えることで表している。
------------------------------------ */

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d',{alpha:false});
var W=0,H=0;

// 低解像度バッファ。ここで色を作って、拡大時の補間でなめらかにする
var LOW_W=320;
var low=document.createElement('canvas');
var lctx=low.getContext('2d',{alpha:false});
var lowImg=null, lowData=null, LW=0, LH=0;

/* 4x4 Bayer。淡い部分は色の変化がゆるやかすぎて、8bitに丸める時に
   10pxおきくらいの段(バンディング)が出る。1階調未満のゆらぎを混ぜてから
   丸めることで、その段を目に見えない粒に散らす。 */
var BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

/* ---------- 形 ---------- */
var DEFAULT_SHAPE={
  dir:0.85,             // なぎさが走る向き(ラジアン)。斜めに横切らせる
  amp:[0.34,0.03],      // [0]=弧のふくらみ [1]=ごく小さな副うねり
  freq:[0.36,1.5],
  phase:[0,0.5],
  hue:322,              // 虹の芯(マゼンタ)の色相
  spread:0.62           // 色が広がる範囲(vレンジ比)。大きいほど全体がやわらかい
};
var shape=cloneShape(DEFAULT_SHAPE);

function cloneShape(s){
  return {dir:s.dir,amp:s.amp.slice(),freq:s.freq.slice(),phase:s.phase.slice(),
          hue:s.hue,spread:s.spread};
}
function rand(a,b){return a+Math.random()*(b-a);}
function randomShape(){
  return {
    dir: rand(0.45,2.45),
    amp: [rand(0.20,0.46),rand(0.012,0.055)],
    freq:[rand(0.3,0.5),rand(1.2,2.0)],
    phase:[rand(0,6.28),rand(0,6.28)],
    hue: rand(0,360),
    spread: rand(0.52,0.78)
  };
}

/* ---------- 斜めの座標系 ----------
   uはなぎさが走る方向、vはそれと直交する方向。vの値がそのまま「なぎさからの距離」に
   なるので、なぎさが真横でも立った斜めでも同じ計算で扱える(前のy=f(x)方式だと
   参考動画のような立った角度が表現できなかった)。 */
var cosD=1,sinD=0,uMin=0,uSpan=1,vMin=0,vSpan=1,vCenter=0;

function setupAxes(){
  cosD=Math.cos(shape.dir); sinD=Math.sin(shape.dir);
  var corners=[[0,0],[W,0],[0,H],[W,H]];
  var us=[],vs=[];
  for(var i=0;i<4;i++){
    us.push(corners[i][0]*cosD+corners[i][1]*sinD);
    vs.push(-corners[i][0]*sinD+corners[i][1]*cosD);
  }
  uMin=Math.min.apply(null,us); uSpan=Math.max.apply(null,us)-uMin||1;
  vMin=Math.min.apply(null,vs); vSpan=Math.max.apply(null,vs)-vMin||1;
  vCenter=vMin+vSpan*0.5;
}

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W; canvas.height=H;
  LW=Math.max(2,Math.min(LOW_W,Math.round(W)));
  LH=Math.max(2,Math.round(LW*H/W));
  low.width=LW; low.height=LH;
  lowImg=lctx.createImageData(LW,LH);
  lowData=lowImg.data;
  setupAxes();
  initNodes();
}

/* ---------- なぎさの位置(v値) ---------- */
var MAX_MARKS=140;
var marks=[];     // 消えない跡 {s, strength, sigma}
var active=null;  // ドラッグ中の跡
var lastTravel=0, lastDrift=0;

function gaussian(d,sigma){var x=d/sigma;return Math.exp(-0.5*x*x);}

function baseV(s,travel,drift){
  var v=vCenter;
  // 主役は「両端が画面のふちに留まったまま、真ん中がふくらむ」一本の弧。
  // sin(πs)は両端で0になるので、ふくらませても弧が画面の端に寄っていかない
  // (sin(freq*2πs+phase)だと弧全体が横にずれてしまい、参考動画のような
  //  画面を大きく横切る形にならなかった)。cos(drift)で膨らみがゆっくり
  // 呼吸し、やがて反り返って反対側へふくらむ。
  v += shape.amp[0]*vSpan*Math.sin(Math.PI*s)*Math.cos(drift*0.6);
  v += shape.amp[1]*vSpan*Math.sin(shape.freq[1]*6.2832*s+shape.phase[1]-drift*1.4);
  // なぎさの上をずっと滑っていく小さなさざ波
  v += vSpan*0.006*Math.sin(s*7.5-travel);
  v += vSpan*0.003*Math.sin(s*13.5-travel*1.7+1.2);
  return v;
}

function targetV(s,travel,drift){
  var v=baseV(s,travel,drift);
  for(var i=0;i<marks.length;i++){
    var m=marks[i];
    v += m.strength*gaussian(s-m.s,m.sigma);
  }
  // 溶けた分は自分の重みで垂れ下がる
  v += meltAt(s)*MELT_SAG*vSpan;
  return v;
}

/* ---------- ロープ物理 ----------
   なぎさを質点の鎖として持たせてあるので、触るとゴムのように追従して揺れ、
   離すとバネで少し弾んでから落ち着く。

   指は「その列のvを指の位置に置き換える」のではなく、近くの質点を指へ引っ張る
   “力”として効かせている。前者は掴んだ瞬間になぎさが指へ瞬間移動してしまい、
   ゴムを引く手応えがまるで無かった。力にすると、引けば伸び、素早く動かせば
   遅れてしなり、離せば戻ろうとして揺れる。
   溶けた所は柔らかいので、引く力がよく効き、形を保とうとする力は弱くなる。 */
/* ---------- 溶け ----------
   なぎさに沿った位置sごとに「どれだけ溶けたか」を0〜1で持つ。触れている間だけ増え、
   決して減らない。溶けは三つの形で効く:
     ・色を束ねる力が緩む(spreadが広がって虹が薄く広がる)
     ・色そのものが濁る(彩度を失って淡い灰へ寄る)
     ・自分の重みで垂れる(vが下がる)
   さらに溶けた所ほど柔らかくなり、引っ張りに弱くなる。 */
var MELT_N=128;
var melt=new Float32Array(MELT_N);
var MELT_RATE=1.45;      // 触れ続けた時、1秒でどれだけ溶けるか
var MELT_SIGMA=0.075;    // 指の周りの溶ける広がり
var MELT_SPREAD=3.4;     // 溶けきった所で色が何倍に広がるか
var MELT_WASH=0.72;      // 溶けきった所でどれだけ色を失うか
var MELT_SAG=0.16;       // 溶けきった所でどれだけ垂れ下がるか(vSpan比)

function meltAt(s){
  var f=(s<0?0:s>1?1:s)*(MELT_N-1);
  var i0=f|0, i1=i0<MELT_N-1?i0+1:MELT_N-1;
  var t=f-i0;
  return melt[i0]+(melt[i1]-melt[i0])*t;
}

function applyMelt(centerS,dt){
  var reach=MELT_SIGMA*3.2;
  var lo=Math.max(0,Math.floor((centerS-reach)*(MELT_N-1)));
  var hi=Math.min(MELT_N-1,Math.ceil((centerS+reach)*(MELT_N-1)));
  for(var i=lo;i<=hi;i++){
    var s=i/(MELT_N-1);
    var add=MELT_RATE*dt*gaussian(s-centerS,MELT_SIGMA);
    var m=melt[i]+add;
    melt[i]=m>1?1:m;
  }
}

function clearMelt(){for(var i=0;i<MELT_N;i++)melt[i]=0;}
var nodes=[];
var STIFF=58, COUPLE=165, DAMP=0.907;
var PULL=210, PULL_SIGMA=0.13;

function initNodes(){
  var n=84;
  nodes=new Array(n);
  for(var i=0;i<n;i++){
    var s=i/(n-1);
    nodes[i]={s:s,v:targetV(s,lastTravel,lastDrift),vel:0};
  }
}

function stepPhysics(travel,drift){
  var dt=1/60,n=nodes.length;
  if(active)applyMelt(active.s,dt);
  for(var i=0;i<n;i++){
    var nd=nodes[i];
    var m=meltAt(nd.s);
    var tgt=targetV(nd.s,travel,drift);
    var a=i>0?nodes[i-1].v:nd.v;
    var b=i<n-1?nodes[i+1].v:nd.v;
    // 溶けるほど元の形へ戻ろうとする力が弱まる
    var acc=(tgt-nd.v)*STIFF*(1-m*0.72)+((a-nd.v)+(b-nd.v))*COUPLE;
    if(active){
      var w=gaussian(nd.s-active.s,PULL_SIGMA);
      // 溶けるほど指によく付いてくる
      acc += (active.v-nd.v)*PULL*(0.4+m*1.6)*w;
    }
    nd.vel=(nd.vel+acc*dt)*DAMP;
    nd.v+=nd.vel*dt;
  }
}

function nodeVAt(s){
  var n=nodes.length;
  var f=(s<0?0:s>1?1:s)*(n-1);
  var i0=f|0, i1=i0<n-1?i0+1:n-1;
  var t=f-i0;
  return nodes[i0].v+(nodes[i1].v-nodes[i0].v)*t;
}

/* ---------- 色のランプ ----------
   なぎさからの距離をこのランプに通して色を決める。中央に白い芯、その両脇に
   マゼンタとシアン、外へ行くほど暖色(金)と寒色(藤)の淡い場に溶ける。 */
var LUT=new Uint8Array(256*3);

function hsl2rgb(h,s,l,out){
  h=((h%360)+360)%360/360; s/=100; l/=100;
  var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h*6)%2-1)), m=l-c/2, r=0,g=0,b=0;
  var seg=Math.floor(h*6);
  if(seg===0){r=c;g=x;} else if(seg===1){r=x;g=c;}
  else if(seg===2){g=c;b=x;} else if(seg===3){g=x;b=c;}
  else if(seg===4){r=x;b=c;} else {r=c;b=x;}
  out[0]=(r+m)*255; out[1]=(g+m)*255; out[2]=(b+m)*255;
}

function buildLUT(hue){
  // t=0.5がなぎさの芯。hueからの差は色相環上の実際の距離。
  // 暖色側は黄→オレンジ→マゼンタ、芯で白、寒色側はシアン→藤へ抜ける
  var stops=[
    {t:0.00,h:hue+96, s:28,l:90},
    {t:0.30,h:hue+98, s:44,l:86},
    {t:0.42,h:hue+100,s:72,l:78},
    {t:0.462,h:hue+55,s:86,l:67},
    {t:0.484,h:hue,   s:92,l:62},
    {t:0.500,h:hue-150,s:14,l:98},
    {t:0.516,h:hue-145,s:90,l:65},
    {t:0.545,h:hue-128,s:60,l:82},
    {t:0.66,h:hue-100,s:26,l:90},
    {t:1.00,h:hue-88, s:18,l:93}
  ];
  var a=[0,0,0], b=[0,0,0], si=0;
  for(var i=0;i<256;i++){
    var t=i/255;
    while(si<stops.length-2&&t>stops[si+1].t)si++;
    var s0=stops[si], s1=stops[si+1];
    var f=(t-s0.t)/((s1.t-s0.t)||1);
    if(f<0)f=0; if(f>1)f=1;
    hsl2rgb(s0.h,s0.s,s0.l,a);
    hsl2rgb(s1.h,s1.s,s1.l,b);
    LUT[i*3  ]=a[0]+(b[0]-a[0])*f;
    LUT[i*3+1]=a[1]+(b[1]-a[1])*f;
    LUT[i*3+2]=a[2]+(b[2]-a[2])*f;
  }
}

/* ---------- 入力 ---------- */
var pointerId=null;

function screenToSV(x,y){
  var u=x*cosD+y*sinD, v=-x*sinD+y*cosD;
  return [(u-uMin)/uSpan, v];
}

// 指はただの位置。引っ張る力はstepPhysicsが受け持つ
function setFinger(x,y){
  var sv=screenToSV(x,y), s=sv[0];
  if(s<0)s=0; if(s>1)s=1;
  active={s:s,v:sv[1]};
}

canvas.addEventListener('pointerdown',function(e){
  if(window.APKit&&APKit.isUI(e.clientX,e.clientY))return;
  e.preventDefault();
  pointerId=e.pointerId;
  setFinger(e.clientX,e.clientY);
},{passive:false});

canvas.addEventListener('pointermove',function(e){
  if(pointerId===null||e.pointerId!==pointerId)return;
  e.preventDefault();
  setFinger(e.clientX,e.clientY);
},{passive:false});

/* 離した時、いま実際に曲がっている分の一部だけを消えない跡として残す。
   引いた量をまるごと残すと数回なぞっただけで形がぐちゃぐちゃになる。溶けによる垂れ下がりも
   別に効くので、引っ張りの残りはさらに控えめにしてある。 */
var KEEP=0.22;

function release(e){
  if(pointerId===null||e.pointerId!==pointerId)return;
  pointerId=null;
  if(active){
    var s=active.s;
    var held=nodeVAt(s)-targetV(s,lastTravel,lastDrift);
    active=null;
    if(Math.abs(held)>vSpan*0.004){
      marks.push({s:s,strength:held*KEEP,sigma:PULL_SIGMA});
      if(marks.length>MAX_MARKS)marks.shift();
    }
  }
}
canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

/* ---------- 描画 ---------- */
function render(time,phase){
  var T=(window.APKit?APKit.T:function(k,ph,tm){return tm*k});
  var travel=T(0.85,phase,time);
  var drift=T(0.16,phase,time);   // 形そのものがゆっくり流れ続ける
  lastTravel=travel; lastDrift=drift;

  if(!nodes.length)initNodes();
  stepPhysics(travel,drift);

  var spread=shape.spread*vSpan;
  var stepX=W/LW, stepY=H/LH, p=0;
  // 溶けきった所が寄っていく、色を失った淡い灰
  var WASH_R=233, WASH_G=231, WASH_B=233;

  for(var j=0;j<LH;j++){
    var y=(j+0.5)*stepY;
    var uy=y*sinD, vy=y*cosD;
    var brow=(j&3)<<2;
    for(var i=0;i<LW;i++){
      var x=(i+0.5)*stepX;
      var s=(x*cosD+uy-uMin)/uSpan;
      var v=-x*sinD+vy;
      var m=meltAt(s);
      // 溶けた所は色を束ねていられないので、同じ距離でもランプの中央付近に
      // 留まる = 虹が幅いっぱいに広がって薄くなる
      var d=(v-nodeVAt(s))*(0.5/(spread*(1+MELT_SPREAD*m)))+0.5;
      if(d<=0)d=0; else if(d>=1)d=1;
      // LUTを段で読まず、前後を混ぜて連続値にする(段そのものを作らない)
      var f=d*255, i0=f|0, i1=i0<255?i0+1:255, t=f-i0;
      i0*=3; i1*=3;
      var r=LUT[i0  ]+(LUT[i1  ]-LUT[i0  ])*t;
      var g2=LUT[i0+1]+(LUT[i1+1]-LUT[i0+1])*t;
      var b2=LUT[i0+2]+(LUT[i1+2]-LUT[i0+2])*t;
      // 溶けた分だけ色そのものを失う
      if(m>0){
        var w=m*MELT_WASH;
        r+=(WASH_R-r)*w; g2+=(WASH_G-g2)*w; b2+=(WASH_B-b2)*w;
      }
      // 1階調未満のゆらぎを足してから丸め、残るバンディングを粒に散らす
      var dith=(BAYER[brow+(i&3)]/16)-0.5;
      lowData[p  ]=r+dith;
      lowData[p+1]=g2+dith;
      lowData[p+2]=b2+dith;
      lowData[p+3]=255;
      p+=4;
    }
  }
  lctx.putImageData(lowImg,0,0);

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(low,0,0,LW,LH,0,0,W,H);
}

/* ---------- メインループ ---------- */
var t0=performance.now();
function tick(now){
  render((now-t0)/1000,null);
  requestAnimationFrame(tick);
}

/* ---------- ✦ / ↻ ---------- */
function mutate(){
  shape=randomShape();
  buildLUT(shape.hue);
  marks.length=0; active=null; clearMelt();
  setupAxes(); initNodes();
}
function resetAll(){
  shape=cloneShape(DEFAULT_SHAPE);
  buildLUT(shape.hue);
  marks.length=0; active=null; clearMelt();
  setupAxes(); initNodes();
}

buildLUT(shape.hue);
resize();
addEventListener('resize',resize);
addEventListener('orientationchange',resize);
requestAnimationFrame(tick);

window.APKit.init({
  canvas:canvas,
  gifName:'tide-mark-loop',
  clockFormat:'spec',
  dock:true,
  autoHide:true,
  fullscreenButton:false,
  loopFrame:function(phase){render(0,phase);},
  buttons:[
    {label:'✦',name:'mutate',onClick:mutate},
    {label:'↻',name:'reset',onClick:resetAll}
  ]
});

})();
</script>
</body>
</html>
